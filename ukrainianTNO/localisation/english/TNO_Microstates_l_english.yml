### Monaco ###
MOC_casino_monte_carlo:0 "Казино де Монте-Карло"
MOC_casino_monte_carlo_desc:0 "Чим найбільше славиться Монако, так це Казино Монте-Карло: воно приваблює багатіїв-іноземців із всього світу, що прагнуть просадити свої статки в його розкішних залах. Проте гламур і вишуканість казино не лише для показового видовища, адже воно відіграє ключову роль в фінансах нашої крихітної держави. Після закінчення Другої світової, звісно, основна клієнтура казино, європейська аристократія - значною мірою збідніла, емігрувала чи вимерла, спричинивши серйозні економічні проблеми для нашого князівства. І якщо ми не знайдемо інше джерело доходів, то гламур і споживацтво, які асоціюються з Монако, незабаром стануть віддаленим спогадом, як ми опинимося на межі банкрутства."

MOC_rainier_reform:0 "Реформізм Реньє"
MOC_rainier_reform_desc:0 "Принц, що є нинішнім спадкоємцем престолу, мабуть, більш відомий за кордоном і вдома, ніж його мати - правляча принцеса. Обкладинкам міжнародної преси він знайомий завдяки своєму шлюбу з американською кінозіркою, Ґрейс Келлі. А міжнародним дипломатам - завдяки відкритій прихильності до Союзників під час Другої світової, яка ледь не коштувала Монако його існуванню за окупації малого князівства військами Осі. Хай там як, Реньє й сьогодні залишається вельми політично активним: доки його матір зайнята в основному своїми справами, Реньє значною мірою керує країною, аж до формування кліки міністрів і бюрократів, що значною мірою впливають на уряд країни."

MOC_italian_oversight:0 "Італійський нагляд"
MOC_italian_oversight_desc:0 "Факт того, що наша країна досі існує, є маленьким дивом: під час Другої світової, Монако - почергово окуповане німецькими й італійськими військами, змогло врятуватися лиш завдяки своїй економічній цінності для завойовників Осі. Зі своїм казино, що функціонувало в якості стабільного джерела цінної іноземної валюти, Монако продовжувало існувати де-юре незалежною державою, що згодом міцно ввійшла до італійської сфери впливу. Утім, Рим не з легкої руки керує справами Монако, і кожен крок, який може зменшити залежність князівства від Італії, сприймається фашистським урядом із підозрою. Будемо надто необережними в спробах покращити становище нашої країни - наслідки можуть бути воістину жахливими."

### San Marino ###
SNM_princely_sovereign_council:0 "Велична й Суверенна рада"
SNM_princely_sovereign_council_desc:0 "Сан-Марино є найдавнішою республікою світу, що має довгі традиції демократії й свободи. Точніше, колись мала: від 1923 року, у політичному житті крихітної країни панує Санмаринська фашистська партія, будь-яку опозицію оголосили поза законом, а давню Велику й Генеральну раду перетворили на її нинішню інкарнацію - Величну й Суверенну раду. Частково це зробили, аби заспокоїти Італію, та це також закріпило владу заможних родин, таких як Ґозі, які сформували первісне ядро партії, і міцно контролювали республіку впродовж 40 років. Хоча опозиція зсередини зростає - малоймовірно, що СФП відсторонять від влади найближчим часом."

SNM_burgeoning_indust:0 "Розцвіт індустріалізації"
SNM_burgeoning_indust_desc:0 "Від часів Муссоліні, Італія та Сан-Марино почали працювати над низкою узгоджених проєктів інфраструктури, як от залізниця, що поєднує Сан-Марино з Ріміні. Це призвело до збільшення нашої економічної залежності від Італії, а також до переходу нашої історично аграрної економіки на шлях завзятого індустріального розвитку. Як дедалі більше селян стікаються до промислових міст, що розвиваються, щоб влаштуватися на заводах, традиційна структура санмаринського суспільства, де колись домінувала землевласницька еліта, змінюється також, а містяни стають дедалі важливішими для політичної рівноваги країни."

SNM_rising_discontent:0 "Зростання невдоволення"
SNM_rising_discontent_desc:0 "Незважаючи на нещодавній розвиток промисловості, економічна нерівність все ще є серйозною проблемою в Республіці. Разом із обмеженням фашистською адміністрацією прав робітників і перевагою СФП, яка обмежує політичні свободи, це породжує серйозну схильність до невдоволення серед робочих та нижчих класів. Доки наші правоохоронні органи все ще тримають ситуацію під контролем, ми маємо підстави підозрювати, що підпільна Комуністична партія Сан-Марино використовує ситуацію для поширення своєї підривної доктрини серед пролетарів. У нас можуть виникнути проблеми в майбутньому, якщо ми не розберемося з цією ситуацією."



## Ideas ##
VAC_lateran_pacts:0 "Латеранські договори"
VAC_lateran_pacts_desc:0 "Підписані в 1929 році Беніто Муссоліні та Святим Престолом, Латеранські договори - юридична й дипломатична основа для існування Ватиканського міста-держави. Урвавши нитку майже 60-річного ворогування між Папством та Італійською державою, що розпочалася з захоплення Риму під час Рісорджименто, Латеранські договори не тільки відновили справжню Папську державу (хай і обмежену лише Ватиканом), але й надали інші поступки Церкві: фінансування від держави, визнання католицизму державною релігією Італії, а також дозвіл на викладання католицького вчення в державних школах. Доки Латеранські договори діють, ми можемо бути впевнені, що нашій країні нічого не загрожує під опікою й захистом Італії."

VAC_one_holy_catholic:0 "Одна, свята, католицька… розділена церква"
VAC_one_holy_catholic_desc:0 "Цілком природним є, незважаючи на своє божественне єднання - страждати від певного розподілу людського, і водночас, Католицька церква - найбільша релігійна організація в світі, духовний дім для мільйонів католиків. Церква розділилася щодо дій, аби зберегти свою роль земної домівки Христа: зіткнувшись з викликами перемінного світу, співпрацювати й надалі з незліченними деспотичними та тиранічними режимами на Землі, доки вони на словах дотримуються християнської доктрини, ігноруючи їхнє зловживання насильством? Або натомість зайняти позицію проти грубості фашизму й імперіалізму, і справді допомагати бідним та смиренним? Чи взагалі дистанціюватися від мирянської політики, лиш турбуючись за душі католицької пастви? Ці та інші питання розділяють Церкву, і збагнути їх може тільки Бог."

VAC_good_pope:0 "Добрий Папа"
VAC_good_pope_desc:0 "Обрання Івана XXIII ознаменувало значний зсув у політиці Святого Престолу, після суперечного папства Пія XII. Коли Пій XII був суворим, величавим і відосібленим, то Іван XXIII завжди сприймався близьким до звичайної людини: проповідував серед мас, оживив діяльність мирянських католицьких політичних об'єднань, і критикував гноблення фашистських режимів Європи та поза нею. Всеосяжна популярність Папи Ронкаллі нвділила його прізвиськом "іль Папа буоно" в Італії й за її межами, а також підозрами з боку кількох урядів країн по всьому світу. Однак із його кволим здоров'ям, Добрий Папа знає, що для скеровування Церкви в потрібному йому напрямку часом він обділений, доки Бог не покличе його назад до Себе."
