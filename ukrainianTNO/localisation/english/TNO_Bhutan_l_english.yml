 ## Leader Descs ##
 POLITICS_JIGME_DORJI_WANGCHUCK_DESC: "Джігме Дорджі Ванґчук став королем Бутану в 1952 році, повівши свою країну через епоху мінливих течій. Народившись у палаці Труепанґ у 1928 році, він здобував освіту в Калімпонґу та Сімлі, спостерігаючи за зростанням впливу післявоєнної Японії в Азії. Цей досвід сформував його бачення реформ у Бутані, водночас із збереженням традицій. Ванґчук зіткнувся з розділеним двором і обережно лавірував між реформаторами та консерваторами, підтримуючи помірковані реформи на кшталт демократизації та економічної модернізації, але опираючись радикальним змінам, які могли б поставити під загрозу монархію. Створення національної асамблеї в 1953 році дозволило ширше залучити громадськість до управління, водночас зберігши остаточну владу за королем.\n\nПротягом 1950-х років Бутан під керівництвом Ванґчука зробив перші кроки до модернізації, зосередившись на розбудові фундаментальної інфраструктури країни. За допомогою Калькутти було прокладено перші дороги, що з'єднали ключові райони, створено базові медичні заклади, а освіта почала виходити за межі традиційного монастирського навчання. Перші кроки до скасування кабальної праці та запровадження справедливішого оподаткування підкреслили його відданість суспільному прогресу.\n\nПопри ці досягнення, Ванґчук залишається пильним щодо захисту суверенітету Бутану в регіоні, де панує Сфера спільного процвітання. Балансуючи між традиціями та модернізацією, його правління продовжує формувати перетворення Бутану на шановану державу, міцно вкорінену у власній ідентичності, але здатну пристосовуватися до мінливого світу."

 ### Ideas ###
 BHU_The_Dilemma_Of_Reform: "Дилема реформ"
 BHU_The_Dilemma_Of_Reform_desc: "При дворі точиться боротьба між консервативними та більш реформаторськи налаштованими діячами. Серед реформаторів також точиться суперечка щодо масштабів цих реформ: одні виступають лише за символічні зміни, інші ж борються за повну перебудову економіки та подальшу демократизацію.\n\nКороль Ванґчук більше симпатизує реформаторам, але все ще остерігається радикалів, побоюючись, що вони позбавлять його надто значної частини влади. На іншому боці — аристократія, яка отримує вигоду зі старого порядку, та надзвичайно важлива опора — збройні сили. Ми йдемо мінним полем, де будь-який хибний крок може занурити нашу країну в кризу."

 BHU_In_Kolkatas_Shadow: "У тіні Калькутти"
 BHU_In_Kolkatas_Shadow_desc: "Бутан стоїть на роздоріжжі. Нація, що балансує між глибокими традиціями та тиском модернізованого світу, офіційно є суверенним королівством. Зовнішня політика Бутану залишається міцно під егідою Вільної Індії, чия спрямовуюча рука відіграла важливу роль у збереженні стабільності країни та спрямуванні її обережних кроків на світову арену.\n\nПід керівництвом Калькутти Бутан досяг значного прогресу в модернізації. Дороги зміями в'ються через колись непрохідні гори, з'єднуючи віддалені села зі столицею Тхімпху. Сучасні школи та лікарні, збудовані за японською технологічною допомогою, розкидані по всій країні, відкриваючи бутанцям погляд на обіцянки XX століття. Проте це зростання приносить із собою приховану напругу: наскільки далеко може модернізуватися нація, не втративши своєї ідентичності?"