 URL_our_common_interests_desc: "В інтересах обох наших держав спільно протистояти лихим силам за нашими кордонами, попри всі ідеологічні розбіжності. Заради нашого виживання й майбутнього ми мусимо об'єднатися та відбити тих, хто прагне знищити саме наше існування й ідеали, які ми обстоюємо, заради власних збочених інтересів."
