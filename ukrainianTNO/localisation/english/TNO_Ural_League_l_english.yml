 ############################

 URL_alone_in_the_cold: "Самі серед холоду"
 URL_alone_in_the_cold_desc: "Постала з об'єднання табірних охоронців і в'язнів, Уральська Ліга перетворилася на силу, з якою мусять рахуватися на Південному Уралі. Усупереч усьому ми боремося, щоб захистити свій дім і свій народ.\n\nХоча нам вдалося зберегти міцні позиції, наші землі захлинаються від потоку біженців, який загрожує похитнути нашу стабільність.\n\nОточені ворогами з усіх боків, ми мусимо швидко подолати цю кризу, інакше ризикуємо втратити все, заради чого так тяжко працювали."

 URL_watching_the_border: "Пильнувати кордон"
 URL_watching_the_border_desc: "Наші хоробрі гвардійці боронять кордони наших земель із люттю й відданістю могутньої ведмедиці. Кордон - суворе місце, і боронити його мусить іще суворіший вояк. Тепер як ніколи нам потрібні такі загартовані люди, щоб захиститися від ворогів з Орска й Чорної Гори.\n\nДірлеванґер і Лисенко нишпорять уздовж наших кордонів, наче голодні вовки, але наші вартові не віддадуть їм ані п'яді землі."

 URL_identifying_our_threats: "Визначити наші загрози"
 URL_identifying_our_threats_desc: "Останнім часом до наших гвардійців доходять моторошні історії про бандитів Дірлеванґера й людей Лисенка. Хоча вони, найімовірніше, неправдиві, розповіді про викрадення цілих сіл і потворні експерименти над чоловіками, жінками та дітьми похитнули дух менш стійких бійців нашої гвардії.\n\nКількох слабших духом чоловіків і жінок гвардії довелося покарати, щоб вони не відбивалися від решти війська. Якщо ми хочемо дати відсіч, цей страх треба викорінити в самому зародку. Ми залишимося сильними й непохитно стоятимемо проти потворних посіпак бандита й науковця!"

 URL_the_refugees: "Біженці"
 URL_the_refugees_desc: "Біженці масово перетинають кордони Ліги з усіх боків. Хоча наші хоробрі гвардійці докладають зусиль, щоб захистити й підтримати нужденних, навіть за межами наших кордонів, невпинний приплив нових ротів, які треба годувати, надриває наше постачання.\n\nНа вирішення цієї проблеми ми витрачаємо цінні ресурси, які могли б піти на підготовку до майбутніх конфліктів. Наші вороги можуть скористатися становищем і зламати нас.\n\nМи мусимо знайти вихід із цієї кризи, перш ніж вона погіршиться."

 URL_eyes_on_the_south: "Погляд на південь"
 URL_eyes_on_the_south_desc: "Хоча Лисенко та його нелюдські експерименти викликають моральну огиду, Дірлеванґер і 36-та дивізія СС становлять значно нагальнішу загрозу. Він проклав собі кривавий шлях від Берліна до Уралу, і Чорний Бандит лише чекає слушної миті, щоб націлитися на нас.\n\nЗаради нашої країни, заради нашого народу й заради росіян усюди ми мусимо розтоптати цю чорну пляму, поки не запізно."

 URL_militias_whoevers_proposal: "Ставка на ополчення"
 URL_militias_whoevers_proposal_desc: "Наша гвардія є найкращою бойовою силою в усій Росії. Проте нас надто мало, щоб витримати затяжну війну. Ворогів багато, а в наших лавах нині не вистачає людей, щоб битися з ними.\n\nМи мусимо скликати ополчення, щоб посилити наше військо й забезпечити перемогу. Народ Уралу має постати перед викликом і відгукнутися на заклик!"

 URL_militias_issue_the_headcount: "Провести перепис"
 URL_militias_issue_the_headcount_desc: "Щоб скликати ополчення, треба провести перепис. Наші урядовці об'їдуть усю Лігу, виконуючи це велике завдання.\n\nУсі працездатні чоловіки, яких покличуть, візьмуться до зброї та вступлять до ополчення. Вони зміцнять наші сили й подбають, щоб у нашій лінії не лишилося прогалин."

 URL_militias_approach_the_survivalists: "Звернутися до виживальників"
 URL_militias_approach_the_survivalists_desc: "Уральська гвардія робить із дітей чоловіків, але ті, хто заходить іще далі в холод, перетворюються на звірів. Ці «виживальники» досконало знають своє довкілля, здатні долати величезні відстані й жити з того, що дає їм земля. Для нашого молодого ополчення такі люди безцінні.\n\nЗалучімо їх до наших лав і зробімо ядром однієї з перших дивізій."

 URL_militias_experimental_cadet_squads: "Експериментальні кадетські загони"
 URL_militias_experimental_cadet_squads_desc: "Уральська гвардія - найкраща частина нашого війська й взірець для багатьох ополченців. То чому б не залучити її до підготовки ополчення?\n\nГвардійці мають усе потрібне, щоб перетворити наше ополчення на справжню бойову силу й змусити Дірлеванґера попітніти. Ми дамо гвардії все потрібне для їхньої підготовки."

 URL_militias_expand_the_program: "Розширити програму"
 URL_militias_expand_the_program_desc: "Тепер, коли гвардія навчила ополчення своїх бойових прийомів, настав час розгорнути програму на повну. Підготовлені гвардійцями бійці стануть сержантами-інструкторами й навчатимуть нових рекрутів.\n\nЦе підвищить нашу ефективність і бойову міць. На цьому етапі ополчення зможе битися на рівних із будь-яким ворогом на Південному Уралі."

 URL_militias_many_helping_hands: "Спільними зусиллями"
 URL_militias_many_helping_hands_desc: "Ніхто не воює самотужки, і кожен гвардієць на передовій може діяти якнайкраще лише тоді, коли його підтримує безліч інших людей на допоміжних посадах у бойових і тилових підрозділах.\n\nМінометні, великокаліберні кулеметні та протитанкові обслуги, а також медсестри, радисти, будівельники, механіки, водії та інший допоміжний персонал життєво потрібні для роботи наших сил.\n\nЦі посади легко могли б обійняти нещодавно підготовлені ополченці: вони здобули б цінний бойовий досвід із меншим ризиком, ніж у стрільців, а досвідченіші гвардійці звільнилися б для небезпечніших завдань на передовій."

 URL_militias_shuffle_the_veterans: "Ротація ветеранів"
 URL_militias_shuffle_the_veterans_desc: "Запроваджений для ополчення режим підготовки перетворив два десятки слабких і недисциплінованих біженців на згуртований бойовий підрозділ, здатний утримувати рубіж проти наших найогидніших ворогів. Але сама підготовка має межі, адже деяких навичок може навчити лише досвід.\n\nЩоб краще підготувати ополченців, буде розроблено програму, за якою найдосвідченіших гвардійців на обмежений час включатимуть до командної структури ополчення й переводитимуть між різними підрозділами. Так вони ділитимуться з новобранцями цінним досвідом і не даватимуть їм припускатися небезпечних помилок у бою.\n\nСистема ротації поліпшить підготовку новобранців: ветеранів поділять на три групи - одна воюватиме на фронті, друга навчатиме ополчення, а третя насолоджуватиметься заслуженим відпочинком, щоб повернутися до служби свіжою."

 URL_militias_familial_connections: "Родинні зв'язки"
 URL_militias_familial_connections_desc: "Жодна людина не є островом. Кожен наш солдат - чийсь син, батько, чоловік, брат, двоюрідний брат або друг. Хоча більшість цих родичів і біженців не годяться для бойових посад, їх не слід відпускати як зайві роти, які треба годувати: вони можуть стати корисною опорою нашої гвардії.\n\nКожному бійцеві на передовій потрібні незліченні люди в тилу: допоміжний персонал, кухарі, постачальники, швачки одностроїв, майстри з ремонту спорядження й багато інших.\n\nУсі ці обов'язки легко можуть виконувати родичі й знайомі наших бійців після короткої підготовки та ознайомлення. Так ми звільнимо цінних, навчених і досвідчених гвардійців від тилової роботи й відрядимо просто в бій, де вони найпотрібніші."

 URL_militias_reach_out_further: "Розширити набір"
 URL_militias_reach_out_further_desc: "Результати першого набору рекрутів Уральського ополчення, яких навчали наші інструктори, приємно здивували навіть найбільших скептиків. Перші кілька днів були метушливими, бо ми готували їхні уми до війни, але після кількох тижнів підготовки кожен рекрут навчився помічати небезпеку між деревами й на землі та відповідати вогнем, почувши постріл із гвинтівки.\n\nУсі ці люди вже мали певний, хоч здебільшого й обмежений, бойовий досвід: раніше служили або в Червоній армії, або в сільському ополченні. Однак приголомшливий успіх методів підготовки переконав інструкторів розширити набір. Тепер вступ до Уральської гвардії залежатиме не від попереднього досвіду рекрута, а від його витривалости в походах безмежними лісами й засніженими рівнинами Росії та готовности віддати життя за цю землю, коли спалахне війна.\n\nДо другого навчального набору тепер покличуть новобранців із усіх верств суспільства."

 URL_militias_caravan_experience: "Досвід караванів"
 URL_militias_caravan_experience_desc: "Навіть після того, як Совєцький Союз розпався під ударами німецької зброї, а більшій частині його території загрожували терористичні бомбардування Люфтваффе, торгівля не припинилася.\n\nДесятки колгоспів, сіл і навіть невеликих міст і далі виробляли товари, селяни обробляли поля, а робітники працювали на фабриках. Попит був на все: від таких предметів першої потреби, як їжа й ліки, до алкоголю та порнографії, які полегшували біль існування.\n\nГурти тих небагатьох відчайдухів, які наважуються торгувати, долаючи бандитів, звірів, воєвод, негоду й повсякчасну загрозу Люфтваффе, називають караванами.\n\nВони можуть стати цінним доповненням до наших сил, адже ніхто не зрівняється з їхньою здатністю постачати віддалені застави навіть усупереч непереборним труднощам. Вичерпний план постачання, що спиратиметься на каравани, гарантує, що нашим військам на передовій нічого не бракуватиме."

 URL_militias_hunters_and_trappers: "Мисливці й звіролови"
 URL_militias_hunters_and_trappers_desc: "Дика природа належить не найсильнішим, а розважливим, вправним і витривалим, а понад усе - людям із найміцнішою волею.\n\nУ ці лихі часи незліченні чоловіки йдуть до лісу, щоб забезпечити виживання своїх родин. Одні взялися за це нещодавно з необхідности, а інші займаються цим упродовж багатьох поколінь. Дізнавшись про смертельну небезпеку, яка тепер їм загрожує, ці загартовані люди неодмінно візьмуться до зброї разом із нашою гвардією, щоб вижити.\n\nМисливці й звіролови стануть бажаним доповненням до наших сил. Завдяки знанню глухих земель і здатності довго діяти самостійно вони чудово підійдуть на роль розвідників далекої дії. Їх навіть можна об'єднати з досвідченішими гвардійцями, щоб сіяти справжній жах у глибокому ворожому тилу: нищити найважливіші цілі, розставляти пастки для військ, а потім безслідно зникати в лісі."

 URL_militias_a_paying_job: "Оплачувана робота"
 URL_militias_a_paying_job_desc: "Життя в Росії непевне. У бурхливі роки після німецького вторгнення все, що нагадувало порядок і стабільність, розсипалося під терором Люфтваффе.\n\nФерми спалено, крамниці пограбовано, фабрики зруйновано, зрошувальні системи розбомблено. Незліченні російські чоловіки лишилися без домівки, роботи й громади та мусили блукати сільською місцевістю, роблячи все заради виживання. Хоча чимало з них подалися в бандити, більшість виживала випадковими заробітками й фізичною працею.\n\nЦі маси безробітних і зневірених чоловіків охоче вступлять до Уральської гвардії, якщо запропонувати їм сталу роботу й платню, достатню, щоб прогодувати родини. Разом із послідовною системою оплати та можливістю підвищення це спонукатиме їх вступати на довший термін."

 URL_militias_a_comfortable_barracks: "Затишні казарми"
 URL_militias_a_comfortable_barracks_desc: "Після німецького вторгнення бездомність стала незмінною частиною життя більшости росіян. У безжальній спробі не дати Батьківщині знову підвестися загарбник щодня здійснював терористичні нальоти на цивільні будівлі й знищив домівки мільйонів росіян, нерідко разом із їхніми рідними.\n\nЗаподіяне ворогом руйнування змусило ці душі блукати глухими краями в пошуках прихистку від жахіть російських пусток. У багатьох місцях жахи бандитизму мало чим відрізнялися від жахів війни, тож сотні цих мандрівників щодня прибувають шукати захисту гвардії.\n\nЧимало біженців готові вступити до нашого ополчення в обмін на можливість отримати власний дім. Можливо, програму підготовки ополчення варто доповнити частиною, присвяченою будівництву осель, у яких житимуть новобранці."

 URL_militias_good_friends: "Вірні друзі"
 URL_militias_good_friends_desc: "Упродовж десятиліть росіяни звикли спати з одним розплющеним оком. Від жахіть Першої Великої війни й хаосу Революції до несусвітньої мерзоти окупації нашої землі німецьким загарбником - ніколи не було відомо, кому можна довіряти.\n\nУральська гвардія - це місце, де росіянин може знайти довіру, спати без страху бути пограбованим, повернутися спиною без страху бути вбитим і покластися на ближнього без страху зради.\n\nГвардія - тісна родина чоловіків і жінок, які втратили власні родини. Їй байдужі медалі, почесті й слава. Гвардія - це сім'я, яка прагне лише захищати свою землю й народ. Коли гвардієць гине в бою, його товариші почуваються так, наче втратили рідного брата."

 URL_militias_healthy_rations: "Здорові пайки"
 URL_militias_healthy_rations_desc: "Стовп сірого диму здіймається з табору ополчення й торкається блакитного неба. Наблизившись до їдальні, яку легко знайти за юрбою навколо, можна відчути запах однієї з причин, чому стільки росіян вступає до Уральської гвардії: теплої тарілки бефстроганова з цибулею.\n\nДобра їжа має величезний попит по всій Росії, де голод став звичним явищем, а багато людей змушені животіти на консервах. Деякі з цих бляшаних потвор прострочені вже більш ніж на десять років.\n\nЗавдяки місцевим селянам, які погодилися віддати частину худоби, і праці біженців у садах та на городах Уральська гвардія зможе забезпечити своїх людей смачною й здоровою їжею.\n\nЯкісні пайки не лише забезпечать солдатів поживними речовинами, потрібними протягом тривалого часу, але й помітно піднесуть бойовий дух та приваблять десятки біженців до пунктів набору в ополчення."

 URL_militias_and_a_purpose_in_life: "Та мета в житті"
 URL_militias_and_a_purpose_in_life_desc: "Щодня на наш поріг прибувають численні чоловіки бойового віку, які шукають захисту й тікають від жахіть, що чатують у глухих краях.\n\nТепер вони блукають нашими землями - здебільшого без друзів, родини чи коханих, а передусім без свого місця у світі. Ці молоді й хоробрі чоловіки стануть бажаним поповненням ополчення.\n\nЦі нікому не потрібні чоловіки з порожнім життям, про яких ніхто не дбає і яким набридло сидіти без діла, знайдуть своє покликання в патрульній службі. Разом із тринадцятьма товаришами під проводом досвідченого капрала вони вирушать на передову битися з мерзенним ворогом."

 URL_militias_stand_for_something_greater: "Означають щось більше"
 URL_militias_stand_for_something_greater_desc: "З півдня долинає крик, хіба ви його не чуєте? Це крик маніяка Дірлеванґера: він волає про здобич для своєї банди й озброюється для непередбаченого наскоку. Його бригада готова напасти на мирні села Уралу.\n\nМи більше не беззахисні селяни. Тепер сформовано нову Уральську гвардію, посилену народом, який битиметься пліч-о-пліч із Синами Воркути. Разом із цими героями ми оборонимо всю нашу землю й збережемо мир скрізь, де він іще панує.\n\nРобітники, селяни, беріться до зброї, вдягайте однострої - на нас лежить священний обов'язок. Перш ніж ці звірі скоять свої злочини, народне ополчення знищить фашистську бандитську армію й спалить кожного з них!"

 URL_orenburg_ask_for_a_meeting: "Попросити про зустріч"
 URL_orenburg_ask_for_a_meeting_desc: "Наше сильне почуття обов'язку захищати простий і пригноблений люд хаотичного Уралу поширюється й на Комуни Орєнбурґа - край, де свободу ставлять вище за ефективність аж до крайности.\n\nОднак навіть наші елітні сили здатні вистежити лише певну кількість бандитів Дірлеванґера, захистити лише певну кількість поселень від мародерів і підготуватися до лише певної частини темних задумів Лисенка. Ми мусимо влаштувати зустріч із законними представниками Комун так, щоб підозрілі члени їхньої Ради переконалися: нашим першочерговим завданням є порятунок життів. Кілька створених ними місцевих ополчень не зможуть належно захистити навіть села, годі й казати про сам Орєнбурґ.\n\nЩоб вижити, Комунам доведеться прийняти й проковтнути гіркі ліки обмеженої централізації задля створення дієвого й добре навченого військового корпусу.\n\nЯкщо зустріч узагалі відбудеться, ми запропонуємо об'єднати наші ресурси з Орєнбурґом і створити дієву оборонну силу."

 URL_orenburg_conversations_with_the_council: "Обговорення з Радою"
 URL_orenburg_conversations_with_the_council_desc: "Схоже, орєнбурзькі комуни нарешті дозволили нам надіслати офіційного посланця до їхньої затято демократичної Ради, щоб просвітити анархістів щодо смертельних небезпек, із якими їм, найімовірніше, доведеться зіткнутися найближчим часом.\n\nКілька наших найкращих офіцерів підготували тези, за якими посланець викладе наш аналіз ризиків і рішень, визначених для їхнього становища. У короткостроковій перспективі слід розглянути й здійснити заходи для захисту від нападів відносно дисциплінованих бандитів СС, аби впоратися з чіткіше визначеною загрозою.\n\nНа обрії Комун нависає також темніша й загадковіша небезпека: схоже, чекістська армія Маґнітоґорска теж звернула свій пильний погляд і зловісну увагу на мирний край.\n\nЗагрозу Чорної Гори нелегко виміряти, але підготувати завчасну оборону все одно необхідно. Сподіваємося, наш делегат достукається до впертої Ради й з нашою допомогою буде сформовано дієвий план."

 URL_orenburg_speak_with_burba: "Поговорити з Бурбою"
 URL_orenburg_speak_with_burba_desc: "Двоє людей виявилися достатньо далекоглядними, щоб зрозуміти потребу в більш централізованій орєнбурзькій комунній системі, здатній пережити бурю зовнішнього вторгнення. Однак їхні способи досягти цієї безпеки разюче різняться, тому ми підтримали працьовитого Алєксандра Бурбу, а не безпорадного комуніста Ґєорґія Малєнкова.\n\nЯкщо Малєнков зуміє утвердити свою перевагу в Раді, то може спробувати припинити всі переговори з нами, адже інформатори повідомляють, що він вороже ставиться до того, що вважає втручанням чужої сили в справи Орєнбурґа.\n\nОтже, Бурба - наша людина. Технократ уже довів, що здатен перетворити Орєнбурґ на місто, яким воно стало після розпаду СССР. З огляду на його прагнення до дальшої індустріялізації та централізації Комун ми можемо бути певні, що він зуміє захистити Орєнбурзький край. Пропозиція підтримати реформи Бурби може значно зміцнити оборону Південного Уралу."

 URL_orenburg_our_common_interests: "Наші спільні інтереси"
 URL_orenburg_our_common_interests_desc: "У цій безплідній, розбомбленій пустці, яку ми називаємо домом, ми зустріли інших уцілілих зі схожими прагненнями й цілями: жити на Південному Уралі, насолоджуючись миром і добробутом. Наші способи наблизитися до омріяної утопії можуть разюче різнитися, але якщо нам удасться погодитися щодо мети, засоби буде можливо узгодити за кілька розмов.\n\nНаші делегати до Орєнбурзької ради повернулися з високою думкою про моральні засади Комун. Представники вважають, що ті здатні змінити край на краще й полегшити його біль і страждання. Рада загалом підтримує наші спонукання, вихваляючи нашу завзятість у полюванні на небезпечних злочинців і захисті прав та свобод людей від гноблення.\n\nСхоже, наші два шляхи сходяться до кращого майбутнього Уралу: спільні інтереси єднають нас, а наша єдність допоможе нам разом піднестися."

 URL_orenburg_watch_their_troops: "Стежити за їхнім військом"
 URL_orenburg_watch_their_troops_desc: "Сумніви щодо наших пропозицій допомогти Комунам Орєнбурґа доволі поширені. Їх обґрунтовують тим, що поселення мають власне ополчення для відбиття нападників, а отже не потребують наших безперечно дисциплінованіших військ. Дехто в Комунах боїться нашого впливу й переконаний, що ополчення, яке захищає їхні землі, дієвіше та політично менш небезпечне.\n\nЩоб обійти цю перешкоду, ми розпочнемо таємні, але неагресивні операції на їхній території та з'ясуємо їхні оборонні можливості - і чи взагалі вони помітять наші пересування. Зібрати ці відомості гвардійцям буде нескладно. З ними ми зможемо вести переговори з Орєнбурґом із позиції сили й, можливо, навіть позбавити аргументів противників співпраці.\n\nДеякі наші офіцери наголосили на стратегічній важливості такого кроку, адже він допоможе підготувати війська до подібних місій, якщо ми вирішимо кинути виклик загадковому Лисенку або розвідати бандитів Дірлеванґера."

 URL_orenburg_raise_the_issue: "Порушити питання"
 URL_orenburg_raise_the_issue_desc: "Оцінюючи становище в Орєнбурґу, особливо у військових і безпекових справах, ми визнали попередні доводи противників нашого обмеженого втручання доволі непереконливими. Проте ми не можемо просто заявити, наскільки жалюгідними є нинішні оборонні можливості, не викликавши тривожних політичних питань у Раді й не втративши дипломатичних позицій, які так тяжко виборювали.\n\nБуло вирішено трохи прикрасити нашу оцінку: піднести деякі слабкі сторони, але не відступати від твердження, що Комунам потрібна наша підтримка. Одному офіцерові спала на думку геніяльна ідея зазначити у звіті для Ради, що Орєнбурґ заклав добрий військовий фундамент, але лише з нашою допомогою зможе повністю розкрити власний потенціял.\n\nТак ми, можливо, подолаємо заперечення тих, хто застерігає від нашого впливу, й нарешті дамо Комунам змогу самим подбати про власну оборону."

 URL_orenburg_look_at_us_when_we_speak: "Слухайте, коли ми говоримо"
 URL_orenburg_look_at_us_when_we_speak_desc: "Нескінченні й безугавні чвари в Орєнбурзькій раді вже серйозно перешкоджають нашій місії захистити добробут і саме існування Комун від зовнішніх загроз.\n\nТаємні операції дали нам докази, якими ми можемо показати анархістам, наскільки жахливо неготова їхня оборона до будь-якої справжньої загрози їхньому існуванню. Та попри наші перестороги повільна й невблаганна стріла часу несе їх до загибелі, кожним цоканням наближаючи до обрію подій, а Рада й далі сперечається сама із собою.\n\nЯкщо вони не почнуть сприймати загрози серйозно й нарешті не дослухаються до наших життєво важливих порад, нам, можливо, доведеться змусити їх звернути увагу. Це, безперечно, суперечитиме нашому моральному кодексу, але в добу шляхетних переможених і брудних переможців ми, можливо, мусимо змінити засоби заради мети, яка захистить край."

 URL_orenburg_we_need_to_stand_together: "Нам треба триматися разом"
 URL_orenburg_we_need_to_stand_together_desc: "Наші невтомні розвідники нарешті помітили страшні ознаки, яких ми так сподівалися ніколи не побачити. Перевіривши й удруге перевіривши напрямок руху та сусідні цілі, ми підтвердили: грабіжницьке військо Чорного Бандита нарешті рушило пожирати Орєнбурґ. Імовірно, відступники СС розіб'ють нашу оборону на самому початку плюндрування Комун.\n\nНі ми, ні жахливо неготові анархісти не зможемо самотужки вистояти проти сил Дірлеванґера. Агресивний бойовий дух і несамовита жорстокість СС розчавлять наші обмежені сили, якщо ми вирішимо стояти окремо. Нам потрібен Орєнбурґ із його людністю та багатствами так само, як їм потрібен наш військовий досвід.\n\nМіж нашими двома силами можна укласти угоду, захисний союз, який іще може вберегти наше майбутнє."

 URL_orenburg_an_arrangement_for_our_survival: "Домовленість заради виживання"
 URL_orenburg_an_arrangement_for_our_survival_desc: "Прокляті, огидні бандити нарешті збираються на околицях наших та орєнбурзьких кордонів.\n\nОзнаки ясні: колишні нацисти рушають війною. Якщо негайно не вжити рішучих заходів, пограбування й зґвалтування наших земель майже неминучі. Орда Дірлеванґера, найімовірніше, розчавить обидві наші армії поодинці, попри якість наших військ і багатства Орєнбурґа. Єдиний шанс вижити - об'єднати сили, які й далі стоятимуть під двома прапорами, але служитимуть одній меті.\n\nЯкщо Комуни не приймуть нашу пропозицію тепер, нам доведеться самим прийняти останній бій."

 URL_orenburg_send_them_instructors: "Надіслати їм інструкторів"
 URL_orenburg_send_them_instructors_desc: "Комуни визнали, що перед дедалі більшою загрозою їхньому добробуту й виживанню їм потрібна наша військова підтримка, яка дасть їм безпеку.\n\nТому нам слід якнайкраще скористатися і перевагою нашого війська, і знанням тактики та оперативного мистецтва, водночас використавши більші людські ресурси Орєнбурґа: для цього ми надішлемо анархістам кількох досвідчених офіцерів.\n\nТепер, коли Орєнбурґ нарешті усвідомив, що стоїть на кону, він, імовірно, почне набирати нові війська. Навчаючи їхніх теперішніх бійців та офіцерів, ми зможемо спрямувати розвиток усієї комунної армії до стандартів, які вважаємо прийнятними."

 URL_orenburg_the_gift_of_the_gun: "Зброя в подарунок"
 URL_orenburg_the_gift_of_the_gun_desc: "Ми, як і прокляті прусські предки нацистського звіра, який підкорив нашу Батьківщину, є армією, що має державу. Через це промисловість приділяє особливу увагу тому, на що спрямовані й наші вкрай мілітаристські цілі: вогнепальній зброї.\n\nПроте Орєнбурґ дещо інакший: його військові запаси доволі жалюгідні порівняно з нашими. Це не надто дивує, зважаючи на брак централізованого керівництва й економічні пріоритети. Та небезпеки цього краю вимагають саме такого військового способу мислення, як наш. Тому, продовжуючи зміцнювати безпеку Орєнбурґа, ми маємо подарувати їм частину зайвої вогнепальної зброї.\n\nВони не лише озброять власні війська, а й отримають креслення, за якими зможуть виробляти власну зброю завдяки своїй значній промисловій базі."

 URL_orenburg_teach_their_artisans: "Навчити їхніх ремісників"
 URL_orenburg_teach_their_artisans_desc: "Комуни Орєнбурґа створили багатства, які здавалися неможливими на зорі розпаду Совєцького Союзу. Проте їхня промисловість організована надто хаотично, щоб належно використовувати наявну виробничу базу.\n\nЯкби наші промислові фахівці поділилися досвідом із ремісниками та промисловцями Комун, ми могли б навчити анархістів сучасних промислових методів.\n\nЗавдяки такій домовленості ми зможемо ще більше поліпшити відносини між нашими двома силами й водночас краще підготуватися до іноземного вторгнення."

 URL_orenburg_take_the_volunteers: "Прийняти добровольців"
 URL_orenburg_take_the_volunteers_desc: "Один із командирів гвардії нещодавно висунув блискучу ідею, як посилити наші військові можливості й водночас убезпечити орєнбурзькі комуни. Якщо їхня Рада не може наполягти на стандартизації війська, нам слід завербувати всіх добровольців із Комун, які бажають вступити до нашої почесної та дієвої гвардії.\n\nТак ми зможемо якнайкраще використати більші людські ресурси Орєнбурґа, адже наша система військової підготовки вже довела, що гвардія як бойова сила перевершує слабші ополчення Комун. Тепер лишилося створити належну пропаганду, щоб вплинути на анархістів. Наші сподівання доволі високі, бо чимало анархістів уже бачать вовків, які шкребуться в їхні двері."

 URL_orenburg_elevate_the_gifted: "Просунути здібних"
 URL_orenburg_elevate_the_gifted_desc: "Орєнбурзька вербувальна кампанія завершилася успішно, тож тепер новобранці проходять нашу сувору програму підготовки.\n\nЦі люди стануть гордими членами нашої славетної гвардії, готовими до величезних випробувань, що чекають попереду.\n\nЩоб привести нові сили до бойової готовности, доведеться додатково навчити деяких осіб, які під час основної підготовки виявили більшу мотивацію й військовий хист.\n\nВони стануть новими офіцерами та підстаршинами на дійсній польовій службі й боротимуться за виживання свого народу та батьківщини."

 URL_orenburg_teach_the_mediocre: "Навчити посередніх"
 URL_orenburg_teach_the_mediocre_desc: "Армійському корпусу потрібні не лише вправні солдати, готові померти за справу, й дієві офіцери, які ведуть їх до перемоги.\n\nЩоб діяти так, аби перемоги можна було використати якнайкраще або, в гіршому разі, звести втрати до рівня, за якого дальші операції ще можливі, військовій силі потрібен допоміжний персонал. Таких людей слід фахово навчити зв'язку, ремонту, медицини та незліченних інших справ, але їм не обов'язково бути видатними воїнами.\n\nМи мусимо заповнити ці посади в нових гвардійських підрозділах, які створюємо з орєнбурзьких рекрутів. Було вирішено, що наглядові офіцери мають відсіяти тих, хто принесе більше користи далеко від передової."

 URL_orenburg_but_arm_them_all: "Але озброїти всіх"
 URL_orenburg_but_arm_them_all_desc: "Численні рекрути з орєнбурзьких комун уже пройшли стандартний курс підготовки до випробувань і, цілком імовірно, жахіть, що чекають попереду.\n\nДехто прибув зі зброєю з власної ферми або зі старим армійським спорядженням із війни, яку волів би забути. Це треба негайно змінити. Ми почнемо видавати всім підготовленим солдатам стандартний комплект спорядження. Спеціялізовані групи, як-от мінометні чи кулеметні обслуги, пройдуть додаткову підготовку відповідно до своєї особливої ролі на полі бою.\n\nБільшість рекрутів користуватиметься нашою стандартною гвинтівкою, яка ще ніколи не підводила наших людей і, безперечно, не підведе й рекрутів-анархістів."

 URL_orenburg_friendship_and_labor: "Дружба і праця"
 URL_orenburg_friendship_and_labor_desc: "За останні кілька місяців ми зблизилися з недовірливими Комунами Орєнбурґа, хоча їхні анархістські звичаї не завжди добре узгоджувалися з нашою впорядкованішою та ефективнішою державою.\n\nОднак перед загрозою, що підступає до маленького раю, створеного Комунами, відносини поліпшилися. Колись уперта Рада дослухалася до наших порад у багатьох питаннях і визнає потребу тіснішої співпраці. Тепер найкращий час перейти до наступного етапу й запропонувати анархістам союз. Якщо ні, то, можливо, вони принаймні дозволять нам допомагати їм у надзвичайних обставинах.\n\nХай там як, наші дві окремі країни зблизяться, а співпраця в промисловості й торгівлі теж зможе розширитися."

 URL_guards_starinovs_proposal: "Пропозиція Старінова"
 URL_guards_starinovs_proposal_desc: "Дізнавшись про небезпеки, що загрожують краєві, чоловік на ім'я Ілья Старінов звернувся з планом до командування Уральської Ліги. Колишній полковник Червоної армії та палкий прихильник використання надзвичайно добре підготовлених сил в асиметричній війні, цей ветеран Вітчизняної війни роками мандрував пустками. Старінов - найманець, який пропонує свої послуги тому, хто заплатить найбільше, навчаючи села захищатися в обмін на їжу й дах. Тепер, розмінявши шостий десяток, полковник вирішив, що його кочове життя нарешті має скінчитися.\n\nСтарінов має докладний план перетворення нашої й без того елітної гвардії на силу, рівної якій не буде в постсовєцькому пеклі. Вона зможе добувати припаси й воювати далеко від обозів на будь-якому полі бою. Невдовзі Діти Воркути стануть наймогутнішою бойовою силою в усій Росії, здатною легко розчавити НКВД Лисенка та СС Дірлеванґера."

 URL_guards_take_stock_of_our_shortcomings: "Оцінити наші недоліки"
 URL_guards_take_stock_of_our_shortcomings_desc: "Полковник Старінов призначив зустріч із усіма польовими командирами Ліги. Разом із невеликою групою близьких радників, які були його товаришами ще від Вітчизняної війни, він відвідав кожен фронтовий підрозділ гвардії й довго розмовляв із рядовими солдатами в окопах. Радники навіть кілька разів зіткнулися з ворогом, щоб побачити, як наші люди діють під вогнем.\n\nПерш ніж утілювати численні реформи для підвищення бойової ефективности солдатів, Ілья Старінов прагне до найменших дрібниць вивчити наше становище. Це охоплює всі наші запаси зброї та боєприпасів, кількість солдатів на передовій, а також їхню особисту й групову ефективність.\n\nЛише помітивши свої недоліки й зрозумівши власні переваги, ми зможемо вдосконалити гвардію."

 URL_guards_we_have_what_we_have: "Маємо те, що маємо"
 URL_guards_we_have_what_we_have_desc: "Призначення Уральської гвардії - давати бій ворогові й захищати невинний народ Росії. Для цього нам конче потрібна справна зброя. Попри чудову підготовку, гвардієць із самим ножем не зупинить бандитської повені.\n\nКожному гвардійцеві надзвичайно важливо підтримувати зброю в бездоганному робочому стані. Значну частину нашого арсеналу становлять безнадійно застарілі зразки, як-от старі російські гвинтівки й пістолети-кулемети місцевих зброярів, прозвані нашими людьми «байстрюками».\n\nЦе ще раз доводить важливість щоденного обслуговування й ретельного догляду за зброєю. Уральська Ліга не має ресурсів, потрібних для сучасного озброєння, а відмова будь-якого нашого зразка в бою, найімовірніше, означатиме смерть, якої можна було уникнути."

 URL_guards_experimental_training_methods: "Експериментальні методи підготовки"
 URL_guards_experimental_training_methods_desc: "На полі бою сила встановлює право. Правильне застосування смертельної сили - єдиний шлях до перемоги й гарантія виживання для вас і ваших товаришів та безпеки для нашого народу.\n\nСуворі методи Старінова закарбують цю істину в голові кожного рекрута. Новий курс Уральської гвардії, що ставить на перше місце організованість, швидкість пересування й передусім агресію, відсіє більшість новобранців. Але ті, хто успішно завершить підготовку, стануть сильними чоловіками, здатними витримати все, що кинуть проти нас вороги.\n\nПіт береже кров, а методи Старінова допоможуть створити солдатів, гідних назви «Діти Воркути»."
 URL_guards_study_tactics: "Вивчати тактику"

 URL_guards_study_tactics_desc: "Наріжним каменем плану Ільї Старінова щодо реформування Уральської гвардії є тактика малих підрозділів. Старий ветеран твердо переконаний, що невелика згуртована команда, яка працює мов годинник, легко розіб'є значно численнішого, але гірше тактично організованого ворога. Вивчення, застосування й відпрацювання тактики обов'язкові для кожного гвардійця - від найнижчого рядового до найвищого командира.\n\nКожен гвардієць має досконало володіти тактикою малих підрозділів: вогнем і маневром, Г-подібними засідками, штурмом окопів, далекими патрулями, охопленням та іншими прийомами, які Старінов випробував за довгі роки боротьби з німецьким загарбником. Він називає їх примножувачами сили: правильне застосування дає відділенню змогу перемогти ворога, який переважає вдесятеро."

 URL_guards_fighting_like_demons: "Битися мов демони"
 URL_guards_fighting_like_demons_desc: "Досвід Старінова показує: перед лицем страшної й непереборної переваги солдат може покладатися лише на жагу до життя та бойовий дух. Перші кілька тижнів нового курсу складатимуться винятково з випробувань сили волі рекрутів.\n\nПосеред ночі до спального приміщення курсантів жбурлятимуть світлошумові ґранати й балони зі сльозогінним газом, узяті з Воркутлаґа. Після такого грубого пробудження їхні наплічники наповнюватимуть камінням, а самих рекрутів на цілий день відправлятимуть бігти вгору схилами Уральських гір. Повернувшись із виснажливого маршруту й витримавши холод, голод і брак сну, кожен новачок поодинці зайде до кімнати, де за наказом Старінова на нього нападуть дванадцять ветеранів гвардії. Цей неможливий бій має випробувати волю кадета й показати, чи здатен він битися мов демон, навіть коли певен, що програє.\n\nНечисленні рекрути, які пройдуть випробування, отримають теплу їжу й затишне ліжко для відпочинку перед переходом до поглибленої бойової підготовки, а невдах відправлять додому."

 URL_guards_with_catlike_tread: "Котячою ходою"
 URL_guards_with_catlike_tread_desc: "Уральська Ліга цінує рухливість, адже патрулювати треба багато миль землі, а людей обмаль. Частиною підготовки кожного гвардійця є опанування всіляких засобів пересування: від найменших мотоциклів, коней і вантажівок до найбільших бронемашин. Гвардійці навчаться користуватися всім доступним транспортом, належно його доглядати й розуміти його роль на полі бою.\n\nАвтомобілі потрібні не завжди, тож гвардійці багато тренуватимуться пересуватися пішки. Спираючись на досвід Довгого маршу з Воркутлаґа через спустошені війною глухі краї Росії, наприкінці курсу рекрути мусять здійснити повністю споряджений 150-мильний марш російськими лісами, прозваний Маршем смерти. Назва походить із того, що солдата, який відстане й не втримається зі своїм взводом, найімовірніше, вб'ють бандити, звірі або негода."

 URL_guards_every_possible_resource: "Усі можливі ресурси"
 URL_guards_every_possible_resource_desc: "Попри незаперечну перевагу наших людей на полі бою, Ліга не має достатньо ресурсів і спорядження, щоб одночасно протистояти бандитській орді Дірлеванґера й чекістам Лисенка. Покинути народ Уральських гір неможливо, тож ми застосуємо винахідливість і виготовимо все потрібне, щоб покінчити з ворогами.\n\nМісцеві уральські зброярі вже виробляють різноманітну стрілецьку зброю. Її якість гірша, але жебракам не випадає перебирати. Комендант Старінов захоплюється всілякою саморобною вибухівкою: від невеликих бомб, якими диверсанти підривають ворожі склади боєприпасів, до мін із паливних бочок, здатних знищити цілий ворожий взвод, коли на них ступить якийсь бідолашний виродок.\n\nСеред інших творчих пропозицій - саморобні глушники для наших диверсійних підрозділів і грубі артилерійські гармати з металевих труб та газових балонів."

 URL_guards_we_can_use_more: "Нам треба більше людей"
 URL_guards_we_can_use_more_desc: "Рекрути першого навчального набору полковника Ільї Старінова вже неодноразово довели свою цінність у бою. Проте суворий процес підготовки має очевидну ваду: лише небагато людей достатньо сильні й здібні, щоб продертися через увесь курс і здобути місце в Уральській гвардії.\n\nПеред подвійною загрозою з півдня та сходу Уральській гвардії відчайдушно потрібна не лише якість, а й кількість. Когорта, яку виховав Старінов, виняткова, але самотужки вона здатна зробити небагато. Хоча суворому старому полковникові це, найімовірніше, завдасть болю, набір треба розширити. Зберімо маси до нашої армії, а тоді Старінов відсіє їх на свій розсуд."

 URL_guards_study_logistics: "Вивчати логістику"
 URL_guards_study_logistics_desc: "У старій Військовій академії імені Міхаіла Фрунзє казали: аматори вивчають тактику, а професіонали - логістику. Попри всю відвагу наших гвардійців вони не зможуть перемогти ворогів без належного спорядження.\n\nЗ огляду на величезну важливість безперебійного постачання військ на фронті буде створено спеціялізований корпус логістики й транспорту, укомплектований найорганізованішими офіцерами. Ми не можемо допустити, щоб гвардія зустріла ворожу лють без засобів, потрібних для перемоги."

 URL_guards_study_history: "Вивчати історію"
 URL_guards_study_history_desc: "Таємниця виживання - учитися на чужих помилках. Більшість викликів, із якими нині стикається Уральська Ліга, інші вже долали в минулому. Вивчення їхнього досвіду може дати нам цінне розуміння того, як проводити операції.\n\nНайцінніші відомості для командирів дасть Велика Вітчизняна війна, адже і СС Дірлеванґера, і моторизовані стрілецькі сили НКВД Лисенка брали в ній участь. Завдяки обширній документації та великій кількості російських ветеранів війни серед радників полковника Старінова ми маємо досить матеріялів, щоб викласти офіцерам цінні уроки."

 URL_guards_hostile_weather_conditioning: "Загартування в суворих умовах"
 URL_guards_hostile_weather_conditioning_desc: "Клімат Уральських гір належить до найсуворіших на планеті: спекотні літні дні валять людей тепловими ударами, холодні зимові ночі вбивають усе, чому не пощастило кілька годин пробути надворі без належного прихистку, а висота високих гір може змусити непідготовлену людину знепритомніти від браку повітря вже після короткого бігу. Наша гвардія мусить звикнути жити в таких умовах. Втрати від ворожого вогню можна передбачити, але втрачати добрих людей через ночівлю на снігу неприпустимо.\n\nНаші гвардійці пройдуть суворий курс під проводом загартованих виживальників, які звикли жити з дарів уральської землі, щоб стати витривалими навіть до найжорстокішої погоди. Виснажливі марші в літню спеку й довгі варти протягом крижаної ночі підготують гвардію до всього."

 URL_guards_stand_for_the_league: "На захист Ліги"
 URL_guards_stand_for_the_league_desc: "Перший набір курсантів полковника Старінова щойно завершив підготовку, пройшов Марш смерти й прибув до штабу Уральської Ліги. Тут вони мали отримати жадані червоні берети, що засвідчували їхню гідність стати повноправними членами Уральської гвардії. Увесь загін стояв строєм у дворі, поки лейтенант проводив переклик. Старінов був задоволений: під час Маршу смерти не загинув жоден курсант - доказ того, як його жорстокі методи загартували їхні тіла й уми.\n\nПісля огляду командиром солдатам наказали стати навколішки. Уперед вийшов отець Яніс Мендрікс, сам провідник Уральської Ліги. Він зазирнув в очі кожному рекрутові й повів їх у складанні присяги: «В ім'я Бога я стоятиму за Лігу й віддам життя за захист Росії, своїх товаришів і невинних». Отримавши від нього новий берет, кожен солдат підводився. Їхні тіла боліли, а животи бурчали, але на кожному обличчі сяяла гордість. Вони справді були найкращими в Росії."

 URL_guards_understand_supreme_excellence: "Осягнути найвищу майстерність"
 URL_guards_understand_supreme_excellence_desc: "У старому військовому посібнику було сказано: найвища майстерність - не в тому, щоб битися й перемагати в усіх битвах, а в тому, щоб зламати опір ворога без бою. Ця істина особливо доречна до нинішнього становища Уральської гвардії. Ми маємо обмежені ресурси й людність, а нам загрожують два більші й безжальніші вороги, тому конче мусимо знайти способи скалічити їх без ризику для власних життів.\n\nНаші польові командири вивчили різні способи з мінімальними зусиллями скалічити і НКВД, і бандитів СС. Серед пропозицій - створити загони рейдерів для нападів на сплячого ворога, завдавати точних мінометних ударів по складах боєприпасів, щоб лишити супротивника беззахисним, передавати фальшиві відомості по ворожому радіо, руйнуючи згуртованість, надсилати в тил групи диверсантів у ворожій формі, щоб сіяти жах, і навіть здійснювати екзотичніші задуми, як-от замаскувати один із гарнізонів під торговельний караван і заманити ворога в засідку."

 URL_guards_learn_from_the_best: "Вчитися в найкращих"
 URL_guards_learn_from_the_best_desc: "Діти Воркути - найвідважніша бойова сила в усій Росії. Усі вони або ветерани Вітчизняної війни, або вцілілі після суворих умов Воркутлаґа. Дехто належить до обох груп. Провівши місяці в Довгому марші на південь через Батьківщину, витримавши бандитів, наземні міни, звірів, воєвод і сам холод, Діти стали такими міцними й витривалими, якими тільки можуть бути люди.\n\nХоча новобранці довели свою гідність, витримавши виснажливі методи підготовки Ільї Старінова, не всього можна навчитися в таборі. Ветеранів гвардії слід об'єднати з завзятими рекрутами, які щойно отримали берети, щоб навчити їх корисних умінь, що приходять лише з досвідом."

 URL_guards_accept_no_substitutes: "Не погоджуватися на менше"
 URL_guards_accept_no_substitutes_desc: "Дехто каже, що в часи конфлікту зумів би перевершити себе. Часто цього не стається: люди панікують, коли бачать, як ворожий вогонь розриває на шматки їхніх друзів. Єдиний спосіб створити дієвих солдатів - довести їх до фізичного й душевного зламу, а потім перебудувати як воїнів, байдужих до жахіть війни. Вони стануть чоловіками, які легко орудують зброєю і самі є зброєю.\n\nДіти Воркути й ті нечисленні чоловіки, які виявилися достатньо сильними, щоб витримати безжальні методи Ільї Старінова, довели свою цінність як воїни. Уральська Ліга не може погодитися на менше. Якщо поставити слабких і ненавчених людей поруч із досвідченим відділенням, це зруйнує згуртованість підрозділу й наразить на небезпеку і їх самих, і товаришів."

 URL_guards_and_they_shall_know_no_fear: "І вони не знатимуть страху"
 URL_guards_and_they_shall_know_no_fear_desc: "Немає забіяки сильнішого за нас, снайпера влучнішого, бігуна швидшого, тактика розумнішого й звіра лютішого. Ми - солдати Уральської гвардії. Наша шкіра загрубіла від праці в таборах Воркути, а виснажливі методи полковника Ільї Старінова перетворили нас на сталь. Тепер нашу волю зупинить лише смерть.\n\nМи пишаємося тим, що дивимося смерті в очі й зустрінемо солдатський кінець у бою. Ми - Вартові Уралу, найкраща бойова сила у світі, люди, які люблять мир, але не бояться війни. Попри нашу нечисленність, ми зустрінемо банду головорізів Дірлеванґера у відкритому бою, зі зброєю в руках і розгорнутими прапорами, адже один гвардієць вартий більше за все СС."
 
