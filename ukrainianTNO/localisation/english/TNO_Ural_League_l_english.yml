 URL.1.t: "Уральська гвардія"
 URL.1.d: "Ми - солдати Уральської Ліги, діти Воркутлаґу на крижаній півночі. Посталі з найнеймовірнішого союзу політичних в'язнів і наглядачів, які колись їх гнобили, ми без кінця боролися за виживання серед попелу Батьківщини. Коли сніг почав загрожувати поглинути нас, ми покинули землі, що колись були нашою в'язницею, і вирушили у виснажливий похід на південь у пошуках прихистку. Ми втратили так багато й побачили всю темряву, яку міг запропонувати цей новий світ, але зрештою дісталися земель, які нині називаємо домом.\n\nХоча ми зазнали значно більше страждань, ніж усі наші предки до нас, ми ніколи не дозволяли темряві розбестити наші серця. Коли ми прибули до підніжжя Уральських гір, то знайшли всіляких уцілілих, мандрівників і невинних людей, які потребували захисту від небезпек світу. Ми стали їхнім щитом, і невдовзі дедалі більше людей потягнулося до теплих вогнищ у наших нових фортецях. Протягом останнього десятиліття ми тренувалися без відпочинку, відточуючи себе до рівня воїнів, присяжних захищати тих, хто не може захистити себе.\n\nНещодавно ми встановили зв'язок із розрізненою групою комун довкола Орєнбурґа. Це завзятий, але неорганізований народ, беззахисний перед жахіттями пусток. Дехто з наших солдатів почав вирушати на захід, щоб допомагати й підтримувати їхні села, хоча наших людей там не завжди зустрічали приязно.\n\nТакож зі сходу надходять тривожні чутки: про охоплені полум'ям села, родини, що зникають уночі, і німців, які знову рушили в похід. Хай які мерзотні жахіття причаїлися в тіні, саме нам судилося стати свічкою в цьому новому темному світі."
 URL.1.a: "Якщо не ми, то хто?"

 URL.2.t: "Потвори у смозі"
 URL.2.d: "Уральська Ліга приймає біженців майже стільки ж, скільки існує сама. Один із засадничих принципів нашого союзу полягає в тому, що ми повинні давати притулок тим, хто його потребує, і захищати беззахисних. Утім, останніми місяцями струмок вигнанців із рідних домівок перетворився на потік, який стрімко стає повінню. Ті, хто прибуває з півдня, розповідають про посилення бандитської активности, з якою ми боремося роками, а біженці зі сходу приносять історії про нову загрозу.\n\nПриглушеними голосами вони шепочуть про цілі села, що зникають уночі, покинуті будинки й поля, чиї колишні мешканці безслідно пропали. Ширяться чутки, ніби Чорна Гора, давно покинута й забута, знову оживає, а смог її фабрик знову чорнить небо Росії. Дехто стверджує, що бачив у димній імлі людей у моторошних костюмах і масках, які тягли нічого не підозрюваних жертв назад до свого лігва на вершині гори.\n\nПоки кількість і тривожність цих повідомлень зростають, наші східні розвідники доповіли, що 22-га мотострілецька дивізія НКВД укріпила гори довкола старого шахтарського міста Маґнітоґорска. Рештки дивізії, вочевидь, діють під керівництвом Трофіма Лисенка, популярного науковця довоєнного Совєцького Союзу. Спостереження за дивізією показало, що вона знову відкрила копальні й фабрики довкола легендарної Чорної Гори, хоча її наміри наразі невідомі.\n\nЗв'язок між появою Лисенка й цими історіями неможливо не помітити. Наші східні розвідники вже отримали наказ продовжувати спостереження за горою й з'ясувати все, що зможуть. Додаткових гвардійців відкликали зі звичайних патрулів, щоб підсилити рейнджерів, які нині стоять на сході. Поки що невідомо, навіщо Лисенко знову відкрив гори й викрадає людей, які там жили, але невдовзі ми це з'ясуємо."
 URL.2.a: "Жодне питання не лишиться без відповіді. Жоден злочин не лишиться без кари."

 URL.3.t: "Погляд дияволу в очі"
 URL.3.d: "Банди, воєначальники й божевільні науковці - Уральська Ліга має чимало загроз, та одна височіє над рештою. Зграя дикунів, що йде за дегенератом Дірлеванґером, відома більшості як Чорні бандити, а гвардійцям - як Мудаки, становить найбезпосереднішу й найнагальнішу небезпеку для Південної Росії. Це розрізнене зборище німецьких воєнних злочинців, російських бандитів і казахських рейдерів виросло в найбільшу армію регіону, а їхня жорстока розпуста майже одноосібно спричинила кризу біженців, що поставила нас у таке непевне становище. Ба гірше, якщо бандити й далі набиратимуть сили, невдовзі вони можуть наважитися на повномасштабний напад на Лігу. Ми сильні духом, але нечисленні й уже насилу захищаємо наші кордони. Якщо Дірлеванґер вторгнеться, це може стати кінцем усього, що ми так тяжко будували.\n\nОскільки Чорні бандити становлять найбільшу загрозу миру й стабільності в регіоні, вирішено зосередити на півдні ті жалюгідні крихти людей і ресурсів, які ми ще маємо, щоб підготуватися до прийдешньої війни. Також запропоновано організувати людей Південного Уралу під нашим захистом в ополчення, які підсилять наші війська й допоможуть урівноважити чисельну перевагу ворогів. Це спричинило запеклі суперечки: одні командири вважають, що без ополчення наша поразка неминуча, інші ж переконані, що його створення буде рівнозначне використанню тих, кого ми присягнулися захищати, як живого щита. Так чи інакше, часу лишається обмаль. Бандитський король збирає сили, і його жага багатства й насильства незабаром вимагатиме вдоволення, а всім відомо, що терпінням він не вирізняється."
 URL.3.a: "Нехай демони приходять. Ми відправимо їх назад до пекла."

 URL.4.t: "Криза біженців"
 URL.4.d: "Роль Уральської Ліги, як її визначив наш провідник, отець Яніс Мендрікс, полягає в тому, щоб бути світлом у темряві, великим маяком надії для народу, який зазнав стількох трагедій. Найважливіше втілення цієї ролі - особлива турбота, якою ми оточуємо численних біженців, що прибувають на наші землі.\n\nТериторія Ліги - оаза миру серед беззаконних земель, які тягнуться на сотні миль, тож природно, що тисячі людей, рятуючись від незліченних жахіть глушини, постійно приходять до нашого порога. Здебільшого вони не приносять із собою нічого, крім ненависти, страху й гніву.\n\nДедалі більша кількість вигнаних чоловіків і жінок, які прибувають щодня, виснажує наші й без того мізерні запаси. У деяких фронтових загонах постачання впало так низько, що гвардійці діляться з безнадійними біженцями їжею, вбиральнями й навіть ковдрами, аби врятувати їх від холодної смерти в глушині.\n\nМасштаб хвилі біженців незабаром спричинить кризу на території Ліги. Командири розробляють плани розв'язання цієї проблеми. Їхнє лихо нагадує нам те, що ми пережили у Воркуті й під час Довгого маршу, тож покинути цих збитих докупи чоловіків і жінок напризволяще - не вихід. Ми мусимо знайти спосіб перетворити ці безнадійні маси на корисних робітників і солдатів Ліги."
 URL.4.a: "Як довго ми ще так витримаємо?"

 URL.5.t: "Чорна держава"
 URL.5.d: "Під час патрулювання південної глушини один із наших розвідників побачив те, чого вони не бачили роками: круглі шоломи й сірі мундири проклятих німецьких загарбників. Досвідчений командир підрозділу правильно наказав своїм людям улаштувати засідку й навіть зумів доправити кількох полонених до нашого штабу, який негайно привели в стан підвищеної готовности, адже німецькі військові знову рухаються нашим регіоном.\n\nНа допиті полонених з'ясувалося, що ці люди не мали наказів від Фюрера, а належали до сумнозвісної 36-ї гренадерської дивізії Ваффен-СС на чолі з Оскаром Дірлеванґером. Складена з ґвалтівників, убивць та іншого покидьку німецького суспільства, вона була улюбленим нападним псом нацистів і жахом багатьох невинних російських родин, але під час Західноросійської війни перестала виконувати накази Берліна й тепер кориться лише своєму диявольському командирові.\n\nСвідчення біженців, що прибувають щодня, розповідають про цілковиту мерзенність цих людей. Родини, які тікають від терору Чорної бригади, розносять таборами мов пожежу історії про катування, ґвалтування та вбивства беззахисних жінок і дітей задля розваги. Багато хто закликає гвардію діяти й зупинити цю жахливу загрозу.\n\nПодальша розвідка встановила, що тепер бригада базується довкола Орска. Розвідувальні фотографії разом із допитами полонених бійців бригади свідчать, що Дірлеванґер гарячково скуповує зброю й набирає солдатів, приваблюючи негідників із кожного куточка краю обіцянками влади, багатств і жінок. Очевидно, він має намір продовжувати своє царювання терору."
 URL.5.a: "Ми мусимо бути готові."

 URL.6.t: "Формування добровольчої гвардії"
 URL.6.d: "Суперечки завершилися, і згоди досягнуто. Верховне командування Уральської Ліги складається з практичних людей. Інакше ми б не дійшли так далеко. Подобається нам це чи ні, але реальність така: самої гвардії не вистачить, щоб зупинити бандитів Дірлеванґера, особливо якщо Лисенко й далі тиснутиме на нас. Тому вирішено закликати людей Уралу до дії й сформувати ополчення.\n\nОполчення стане вкрай потрібним джерелом живої сили й доповнить нечисленну регулярну гвардію, але мало хто з наших генералів цьому радий. Більшість мешканців цих гір майже не знала бою, тому вирішено набирати до ополчення лише тих, хто вже воював або має здібності й навички, корисні у війні. Навіть із таким обмеженням наші командири неохоче повертають на поле бою людей, які гадали, що їм удалося втекти від війни й так довго жити в мирі. Роками тихе, захищене життя мешканців Південного Уралу було для нас предметом гордости, доказом нашої здатности обороняти прийомний дім. Тепер настав час порушити мир, який ми так тяжко створювали, і тепер мусимо готувати тих, кого досі захищали, до того, що їм самим доведеться стати до бою. Матері й батьки, чоловіки й дружини - усіх закличуть покинути життя, яке вони з таким трудом відбудували. Востаннє виступити проти темряви. Захистити свій дім. Зробити те, що мусить бути зроблено."
 URL.6.a: "Ми маємо бути готові пожертвувати всім, щоб учинити правильно."

 URL.7.t: "Зустріч із Лігою?"
 URL.7.d: "Від Уральської Ліги надійшла пропозиція з питанням, чи не хотіли б ми зустрітися з ними. Ми вже маємо обмежені зв'язки й вдячні за ту часткову охорону, яку вони забезпечують від таких, як бригада Дірлеванґера. Усе це добре, однак серед Ради й загалом населення Орєнбурґа зростає страх, що нинішніх відносин недостатньо, аби по-справжньому захистити нас від різноманітних бандитів і викрадачів, які ховаються на Уралі. Наша Рада дещо розділена в цьому питанні. Дехто боїться, що Ліга та її могутнє військо залякуватимуть нас або спробують захопити Орєнбурґ, якщо ми дозволимо їм надто сильно впливати на наші справи. Через це багато комун лишаються під загрозою бандитських рейдів, а Ліга зазвичай безсила їх зупинити.\n\nХоча ми й утримуємо певні ополчення, вони навряд чи є дієвим засобом стримування зовнішніх загроз і бандитів, які вже ховаються на наших землях, бо часто прибувають лише після того, як нападники спустошили наш народ. Дехто в Раді стверджує, що нинішня домовленість дає достатній захист від рейдерів, а їхньої присутности не уникнути. Інші зауважують, що бригада Дірлеванґера може легко прослизнути крізь нашу оборону й розпочати низку рейдів, які завершаться нашим знищенням. На їхню думку, єдина наша надія - Уральська Ліга, а страхи перед захопленням сміховинні: якби вони хотіли взяти владу, то вже зробили б це. Вони пропонують просту зустріч у місці, яке не надто обурить членів Ради, присвячену лише встановленню офіційніших відносин - поки що нічому більше. Пропозиція здобула достатню підтримку, щоб винести її на голосування пізніше сьогодні, якщо нас знову не переб'є чергове звернення щодо зниклих свиней якогось селянина..."
 URL.7.a: "Ми зустрінемося з Уральською Лігою."
 URL.7.b: "Ми не зустрічатимемося з Уральською Лігою."

 URL.8.t: "Пропозиція Старінова"
 URL.8.d: "Уральська гвардія вже має звання найміцніших солдатів Росії. Викувані в кошмарі ГУЛАГів, загартовані в хаосі розпаду Совєцького Союзу й щодня випробовувані анархією Південного Уралу. Ми раз у раз доводимо свою доблесть і вправність, та незабаром навіть цього може бути замало. Як оборонці гір ми й раніше билися всупереч усім шансам, але цього разу все інакше. Бандити Дірлеванґера - найбільша й найбільш садистично жорстока група, яка будь-коли загрожувала регіону, набагато небезпечніша за всіх недовоєначальників і кочових головорізів, із якими ми змагалися раніше. Нечисленні солдати Лисенка, можливо, найкраще оснащені в усій Росії: вони мають нові кулемети й бронебійні набої, тоді як наші люди воюють мисливськими рушницями й підібраними кулями. Ці дві загрози можуть стати першими й останніми ворогами, яких Уральська Ліга не зможе зупинити, якщо незабаром нічого не зміниться. Саме тому полковник Ілья Старінов представив план реформування Уральської гвардії.\n\nЧимало людей закликали знизити стандарти набору до гвардії, щоб прийняти більше чоловіків і збільшити армію, яку ми можемо виставити, але план Старінова пропонує цілковиту протилежність. Він переконує, що гвардія не досить розвинула свій елітний статус і мусить перетворитися на найкраще підготовлену силу не лише в Росії, а й у світі. Він закликає запровадити новий режим підготовки, який, за його словами, «в ідеалі дискваліфікує від 70 до 85 відсотків курсантів до завершення». Навчання включатиме тижні виживання в глушині лише завдяки тому, що вдасться знайти, нескінченну муштру у звичайному бою, партизанській війні, міському бою, ближньому бою, нічному бою й будь-якому іншому виді бою, який тільки спаде на думку інструкторам. Простіше кажучи, їх проведуть через таку тяжку підготовку, що справжня війна здасться полегшенням тим, хто дістанеться іншого боку."
 URL.8.a: "Безперечно цікаво."

 URL.9.t: "Струнко"
 URL.9.d: "На полі за невеликим містечком Сім у передсвітанковій темряві зібрався невеликий натовп. Строкате товариство чоловіків віком від трохи за двадцять до майже п'ятдесяти стоїть у нестрункому шику, а між ними ходить чоловік у пошарпаному мундирі з планшетом і просить кожного назвати три речі: ім'я, вік, адресу. Провівши цю коротку співбесіду з усіма присутніми, він повертається наперед, дивиться у свій планшет і бурмоче собі під ніс.\n\n«Тридцять один, тридцять два, тридцять три загалом. Насправді більше, ніж я очікував від села такого розміру. Що ж, панове, за цих обставин формальності нам ні до чого. Як ви всі напевне знаєте, Уральська Ліга закликала формувати ополчення, щоб дати раду посиленню бандитської активности й кризі біженців. Усі ви маєте навички й досвід, які ми шукаємо, а добровільно ставши на захист батьківщини, вже довели, що маєте безстрашний і самовідданий дух гвардії. Перш ніж рушити далі, мушу спитати: скільки з вас мають власні рушниці?»\n\nБлизько половини натовпу піднімає руки, а ще кілька людей показують рушниці, принесені на збори. Переписувач швидко їх рахує й занотовує щось у записах.\n\n«Добре. Дуже добре. Насправді чудово. Хто не має - не хвилюйтеся. Ми подбаємо і про це, і про набої та однострої, коли дістанемося Белорєцка. Це майже все, що я хотів сказати. Не забудьте до 11:30 спакувати речі й попрощатися. Караван вирушає опівдні, й ми не повертатимемося по відсталих, тож на південь вам доведеться діставатися самостійно. Ще раз висловлюю повагу кожному з вас за вступ до ополчення. Ліга дякує вам, гвардія дякує вам, і народ Росії дякує вам за вашу хоробрість»."
 URL.9.a: "Справжні герої Уралу - кожен до одного."

 URL.10.t: "Ополчення комуни Бєрдяша зустрічає свого дикуна"
 URL.10.d: "Фєодор Єґоров був у захваті, коли Уральська гвардія призначила його командувати новоствореним ополченням. Формально він служив у Червоній армії під час Західноросійської війни, але тоді був іще хлопчаком, а війна скінчилася, перш ніж він узагалі дістався фронту. Це ополчення мало стати його нагодою проявити себе й довести, чого він вартий як чоловік. Тож звістка про те, що до міста надішлють якогось «виживальника» допомагати навчати ополчення, стала неприємною несподіванкою. На думку Фєодора, його люди вже знали все потрібне, а якийсь селюк із пусток буде радше тягарем, ніж поміччю.\n\nКоли чоловік нарешті прибув, усі ополченці мимоволі витріщилися на нього. Його борода виявилася не такою довгою, як вони жартували, але й короткою її не назвеш. Найбільше дивував його вік. Ніхто не наважився спитати, однак не було сумніву: цей чоловік бачив падіння Росії не один, а двічі.\n\n«Я не люблю говорити, тож ви, дітлахи, слухайте. Я живу з того, що дає земля, довше, ніж будь-хто з вас живе взагалі. Коли мені було сімнадцять, червоні спалили мій дім і вигнали мене в дику природу. Наступні двадцять років я полював, шукав припаси й убивав кожного червоного, який намагався мене зупинити. Потім прийшли нацисти, тож наступні двадцять років я вбивав нацистів. Тепер маємо бандитів, а ще двадцяти років у мене немає. Ось тут і знадобитеся ви. За сорок років у лісах дечого навчишся, і я збираюся передати вам свої знання. Я знаю, як знайти їжу там, звідки пішли навіть черви. Знаю, як рухатися так тихо, що й заєць не почує мого наближення. Знаю, як пережити хуртовину без ковдри і як заманити вовчу зграю на ворожий патруль. Коли я закінчу з вами, більшости з цього ви не вмітимете, але знатимете досить, щоб загинути в бою, а не замерзнути чи померти з голоду. Саме цього просить від вас ваш народ»."
 URL.10.a: "Можливо, від нього все-таки буде користь."

 URL.11.t: "Перший набір: навчальний табір"
 URL.11.d: "Фєґєров люто зиркнув на своїх людей. Строкате товариство: молоді й старі перемішалися в мареві кольору хакі та зібраних із чого доведеться одностроїв, але інших він не мав. Навчання буде для них нелегким, та ці люди зголосилися захищати свій клапоть Росії від довколишнього хаосу. Чого-чого, а відваги їм не бракувало, а Уральська гвардія вимагала саме відваги, не вправности чи сили. Він закричав: «Рукопашний бій - почати!»\n\nОполченці й ополченки завзято накинулися одне на одного, замахали кулаки. Схвально киваючи, Фєґєров ходив між лавами й коментував техніку бою. «Іванов, стеж за боком! Ніколаю, годі його лапати, вали на землю! Наталіє, присягаюся живим Богом: якщо ще раз спробуєш помацати суперника, я тебе вижену...»\n\nДо нього повернулися давні знання з часів совєцького навчального табору, і це було приємно. Він справді був солдатом, подумав Фєґєров, і якась його частина гірко з цього посміхнулася. Пізніше того дня, переглядаючи статистику й таблиці, Фєґєров почав складати доповідь Центральному командуванню Ліги. Бойові можливості його людей, зазначив він, значно зросли: схоже, режим підготовки працював. На старших радників реагували особливо добре, навіть із прихильністю, хоча дисципліна й далі лишалася проблемою. Він зупинився на останньому пункті. У доповіді треба було дати остаточну відповідь, чи розширювати програму жорсткими заходами призову. Це було радикально, але Урал - край крайнощів. Він глибоко вдихнув і написав відповідь. «Рекомендую розширити навчальні набори на славу Батьківщини й благо Росії. Нехай Бог підтвердить правоту мого рішення»."
 URL.11.a: "Перша хвиля з багатьох."

 URL.12.t: "Заклик до зброї"
 URL.12.d: "Наче гроно лози на поваленій колоді, самотнє село чіплялося за життя на околиці Уралу. Жоден чужинець не зміг би назвати його, а всі, кому слід було знати, були настільки близькі з містечком, що потреба в назві давно відпала. Назва села наполовину забулася, загубившись серед балачок рідкісних торговельних караванів і криків хлопчаків одне до одного на майдані. Під невимушеною близькістю способу життя, якому майже не був потрібен зовнішній світ, село поволі занурилося в затишок ізоляції, як пара вкладається у знайомі вигини одне одного в теплій нічній темряві. Та будь-який ставок скаже вам: тишу нерухомости від кінця відділяє лише одна брижа. І день за днем брижі ширшали з візитами поодиноких солдатів і пар, низьким гуркотом переміщення військ, навчаннями, кампаніями набору. Поволі ігри хлопчаків змінювалися з квача й ловів на поліцаїв і розбійників, солдатів і ковбоїв, мисливця й здобич.\n\nСтароста містечка дедалі рідше всміхався на щомісячних зборах, а купи паперів на його столі щотижня дедалі глибше занурювалися в хаос. Старі чоловіки прокидалися в холодному поту серед тихої ночі, тягнулися по рушниці, які давно зникли з домівок і господарств, і притискали до себе дружин, доки їх трусило. Пошарпані червоні прапори викопували, люто на них дивилися й швидко закопували знову разом з усіма іншими небажаними привидами. Одного ранку брижі з невимушеною неминучістю дісталися містечка й навіки порушили його тишу. Прийшов самотній піший гонець і закричав дивним північним говором.\n\n«Ідіть служити нашим братам і сестрам з Уральської Ліги! Усі працездатні молоді чоловіки з господарств, де понад чотири роти...» Матері обіймали синів і ридали у вирі уральського вітру, коли майбутнє вдарило по цьому напівприхованому містечку; і ніхто не знав, що воно залишить по собі."
 URL.12.a: "Повертайся до нас якнайшвидше, сину."

 URL.13.t: "Безмежне блакитне натхнення"
 URL.13.d: "Небо - це все, що лишилося Росії, думав Анатолій. До великої порожньої блакиті вгорі не могли дістатися ні гунська орда, ні паразити, породжені її завоюваннями, ні гризливі тиранії «Батьківщини». За визначенням, це був найбільший скарб, який могла запропонувати Родіна; у певному сенсі - єдина подоба єдности, за яку могли вхопитися уламки її народу. Було заспокійливо, що йому наказали пів години спостерігати за безмежним небом разом із сотнею інших новобранців на казарменому плацу. Звісно, високі думки як на сільського хлопця з Белорєцка, але хіба його не заохочували мріяти? Сержант гавкнув команду, й маршал рушив до трибуни перед ними. Шеренги стали струнко, і лише почасти через страх різки. Маршал не терпів розмов про своє минуле, але довколишній шепіт натякав на військову службу: можливо, він був членом місцевого гарнізону або навіть одним із ветеранів Довгого маршу з Воркути, а може, навіть братом самого Мендрікса.\n\nПопри вік, він був владною постаттю: вицвіле хакі з оздобами Уральської гвардії, глибоко порізане зморшками обличчя, що викликало стільки ж страху, скільки поваги. Тепер він стояв перед курсантами й почав говорити в сяк-так полагоджений мікрофон.\n\n«Товариші солдати, я радий вітати вас у гвардії. Почну з одного простого питання: навіщо ми тут? Служити вашим батькам? Може, прославити ваше село? Чи ви гадаєте, що місце в наших лавах допоможе вам затягти когось у ліжко?» Плацом на пів хвилини прокотився сміх. «Ні, друзі, ви тут не заради друзів, родини, Бога чи дівчини. Ви тут, щоб допомогти мені втілити мою мрію. Я мрію про Росію, де всі рівні у служінні й вірності ближнім, де приховане зло цієї землі буде викорінене спільним завзяттям».\n\nМаршал театрально здіймає руки. «А тепер, коли ви тут, це стане і вашою мрією»."
 URL.13.a: "Мрія, за яку варто боротися!"

 URL.14.t: "Повернення четвертого набору"
 URL.14.d: "Усе, що чув командир відділення Фьодор Міхаіловіч, - бух-бух-бух вибухів довкола, дедалі тугіший зашморг грому й світла. У нічній глушині лунали крики, а суворе повітря змішувало молитви без відповіді з прокльонами. Ніхто в Народному навчальному ополченні Уральської Ліги не міг цього передбачити, але ось воно сталося, і серед хаосу кожен удар його серця розтягувався на ціле життя.\n\nСпершу план був простий: на світанку захопити об'єкт Антон, а надвечір - Боріс і Васілій. Ніхто не очікував натрапити на засідку, яку бандити підготували для каравану: інструктори загинули першими серед хаосу, перекинуті колесом у криваві плями на траві. Тепер рештки взводу притисли до землі в потворній подобі їхніх власних навчань, із малими запасами, обмаль набоїв і дедалі більшими втратами. Олов'яні солдати перед горнилом. Фьодор поглянув на Ґріґорія, потім на Міхаіла - обидва час від часу стріляли в темряву поруч із ним. Він обіцяв повернути їх додому. Зрештою, він був командиром відділення. У голові кинуто кості, і все вирішилося. Шкода, що іншого шляху не було.\n\nТепер він щосили закричав: «Усім відділенням, відхід у тил, готуватися до прориву!» Тіні в його строю ожили, здригаючись від зусиль, страху й напруження. Один за одним вони відходили назад, а позаду гуркіт вогню наростав до кульмінації. Але він залишився. Дві гранати, три магазини - спорожнено. Берегти своїх людей до останньої секунди. Одне тіло за іншим сіпалося й падало. Надто мало, надто повільно. Він витяг гранату й осів. Час розтягнувся у вічність. Один ворог, два, три - висмикнути чеку, один два три чотири.\n\nКоли настав день обрати назву батальйону, вони проголосували за Фьодора. Це було єдине одностайне голосування за всю історію батальйону."
 URL.14.a: "Dulce et decorum est - pro fratria mori."

 URL.15.t: "Солодке прощання"
 URL.15.d: "Маршал робить іще один гіркий, уривчастий вдих. Кремезні ад'ютанти штовхаються довкола нього в лазареті, а повітря просякнуте нервозністю й балачками поранених. Обличчя кампанії набору до гвардії попелясто лежить на ліжку, напівмертве від хвороби, і прогноз далеко не найкращий. Та саме про це він зараз думає найменше: кашляючи на кожному русі, маршал силкується сісти. До самого нутра він був дисциплінованим солдатом; попереду нарада, і він не пропустить її навіть перед лицем смерти. Задихані вигуки долинають раніше за самого чоловіка; люди розступаються й напівуклоняються перед провідником Уральської Ліги. Мендрікс підходить, і маршал насилу віддає честь. «Облиште, маршале, до чого ця вистава? Серед друзів можна розслабитися, пам'ятаєте?» Маршал падає назад, його обличчя покреслене виснаженням. Він намагається скласти в думках слова. «...мої люди в порядку? Як добровольчі бригади?» І Мендрікс усміхається, його обличчя на мить молодшає на десятиліття, шлюзи напруги ненадовго підіймаються, а маршал переноситься назад до Воркути, віч-на-віч з ідеалістичним латвійським священником, надто клято впертим, аби померти. Надто праведним і люблячим, щоб за ним не піти. «Я пишаюся вами. Завдяки вашій праці ми маємо щось подібне до справжньої армії, а з Комун надходять зброя й припаси для неї. Послухайте мене: я говорив із нашим штабом, і вони вважають, що ми можемо мати шанс проти бандитів і Чорної Гори. Ось що ви нам дали. Шанс у бою вибороти власне майбутнє. Люди тут у боргу перед вами, як і я. Це все, солдате. А тепер відпочивайте, і нехай Бог буде з вами». Маршал усміхається й заплющує очі. Уперше за довгий час він усміхнувся. Доки він не приєднається до Ільї, маршал, Ведмідь Уральської гвардії, спочиватиме, а його справу завершено."
 URL.15.a: "Вільно, старий солдате. Далі ми впораємося."

 URL.16.t: "Розширення наших стандартів"
 URL.16.d: "Завдання гвардії - захищати громадян Ліги. Не маючи величезної кількости людей, наші обмежені війська просто не можуть забезпечити живу силу, якої потребують кордони. Тому, натхненне величезним успіхом Програми ополчення, що перетворила безнадійних цивільних і біженців на вправних солдатів, верховне командування Ліги проголосувало за зниження військових стандартів, аж до набору жінок до лав війська. Ми сподіваємося, що так усі охочі новобранці, незалежно від попередньої підготовки, зможуть зробити свій внесок в оборону Ліги.\n\nТакі генерали, як Старінов, підтримують високопідготовлену армію елітних вояків, до якої приймають лише найкращих, але цього недостатньо для наших потреб; кожен, хто має волю захищати нашу землю, гідний служити в армії Уралу."
 URL.16.a: "Ми не схилимося перед нападами!"

 URL.17.t: "Орєнбурґ погоджується на зустріч"
 URL.17.d: "Їхня Рада прийняла нашу пропозицію зустрітися з Радою Орєнбурґа. Ми досі не знаємо, чи зможемо переконати її бюрократів, але це початок і принаймні нагода більше про них дізнатися. Якщо переговори виявляться безплідними, ми не турбуватимемо їх далі, однак нам таки потрібна їхня допомога у вигляді припасів, які місто накопичило за ці роки. Натомість наші люди робитимуть те, що вміють краще за всіх: захищатимуть місто Орєнбурґ і навколишні комуни. Можливо, поки що вони нам не довіряють, але наша допомога неабияк посприяє зміцненню зв'язку між нашими землями. Крім того, ми маємо намір допомогти їм навчити власні ополчення, щоб навіть після усунення найнагальніших загроз Дірлеванґера й НКВД із Чорної Гори вони могли оборонятися без нашої безпосередньої допомоги.\n\nПівденний Урал - небезпечний край, куди щодня прибувають біженці, рятуючись до нас і Комун Орєнбурґа. Дороги, якими вони йдуть, подібні до мисливських угідь бандитів і рейдерів, охочих скористатися з людей, які потребують притулку. Вони самі, Орєнбурґ сам. Ми мусимо захистити обох. Лише тримаючись разом із Комунами й захищаючи Південний Урал, ми можемо сподіватися на світліше майбутнє для тутешніх людей. Залишається тільки надіятися, що Рада дивиться на це так само."
 URL.17.a: "Нехай солдат зустрінеться з радником."

 URL.18.t: "Обговорення з Радою"
 URL.18.d: "Політика, як і російський балет, в ідеалі складається з цілеспрямованих рухів, виконаних із витонченістю. Уявіть величезну сцену в залі, де зібралися делегації Орєнбурґа й Уральської Ліги: тут делегати кружляють у піруетах довкола дилем, обережно маневруючи трохи осторонь від засадничих розбіжностей. Водночас вони описують кола довкола обраних цілей рухами досить хаотичними, щоб їх можна було заперечити. Такою є гра між Орєнбурґом і Лігою, і вона по-своєму небезпечно прекрасна.\n\nАктори грають свої ролі з очікуваною переконливістю; Уральська Ліга починає із заспокійливих слів про спільну мету, навіть вищу за звичайні цілі. Спільне прагнення поліпшити життя російських народів, любов до цієї зламаної землі й загальне бажання знову зробити її цілою. Один чи два делегати пускають сльозу, зворушені виставою. Інші сухо кивають, зауваживши, що представник спромігся багатьма словами не сказати геть нічого конкретного. Рада Орєнбурґа не менш вправна: повторивши попередні слова, вона виголошує схожі запевнення у прийнятті й взаємній довірі та пропонує розбудову відносин, які неодмінно, без жодного сумніву, приведуть до взаємної єдности. Жодних уточнень щодо вигляду цієї єдности не надходить та й не потрібно. Кожен у своїй голові знає, що готує майбутнє.\n\nТанець триває, крижаний і бездоганно поставлений. Поволі атмосфера починає теплішати, а радники й представники готують заздалегідь написані нотатки. Непримиренні готуються до шквалу, між делегаціями Ради й Ліги передають папери. Танець набирає темпу, й Урал, захоплений видовищем, переживає переломний момент."
 URL.18.a: "Перейдімо до справжніх переговорів."

 URL.19.t: "Ліга звертається до Ради"
 URL.19.d: "Політика - це вистава; вистава - це образ. Ліга - сила солдатів, але всі солдати знають ціну зовнішнього вигляду. Тож Ліга з дивовижною легкістю й швидкістю готується до вистави дипломатії.\n\nНаші представники стоять напоготові; їхні еполети виблискують у світлі світанку, а поодинокі штабні працівники поспішають до них і пошепки доповідають про те чи інше нагальне питання, їхні голоси підхоплює уральський вітер. Гвардія чекає надворі в парадних одностроях, нав'язливо доведених до бездоганности під час численних оглядів. Зазвичай Уральська Ліга не має часу на такі дурниці, але ця зустріч може створити або зруйнувати мир на Уралі та життя його народу, тому коштів не шкодують. Ми мусимо справити на Уральську Лігу враження нашою виставою, інакше зазнаємо невдачі.\n\nКаравани забирають людей і рушають до кордону з Комунами, висаджуючи їх перед самим містом, щоб делегація могла пройти - а краще, промарширувати - останню милю до воріт Орєнбурґа пішки. Раптом прапори з'являються всюди: на будинках, прив'язані до ліхтарних стовпів, вони майорять на вітрі. Загін марширує назустріч Лізі за заздалегідь узгодженим церемоніялом, обмінюється офіційними люб'язностями, крижаними поглядами й напруженими салютами. Аж ось прибувають виконавці головних ролей: Малєнков смикає пальто й хмуриться, Бурба всміхається процесії та вправляється в невимушеній розмові, члени Ради спостерігають із тривогою й порожніми усмішками. Світлина для преси - і обидві делегації розпочинають переговори. Сцену підготовлено; актори зібралися. Два прапори змахують, завіса підіймається. І починається вистава, що вирішить долю людей у тіні гори Ямантау."
 URL.19.a: "Їхні розмови, наше життя і смерть."

 URL.20.t: "Чорних бандитів переможено!"
 URL.20.desc: "Після низки швидких сутичок по всьому Орску, під час яких зграї людей Дірлеванґера нападали на Уральську гвардію й нерегулярні сили Комун, ударне угруповання нарешті зуміло знайти головний табір відступників СС. Відірвавшись від останньої групи бандитів, гвардійці непомітно пройшли лісами й повели раптовий штурм просто в серце табору, прорубуючи собі шлях до головного намету.\n\nПопри відчайдушні спроби казахів зупинити просування штурмової групи, цілі нарешті досягли, змусивши самого Дірлеванґера разом із його головними поплічниками вийти з намету й долучитися до бою. Після кількох хвилин лютого ближнього вогневого бою німецький зрадник усвідомив безнадійність становища й у відчайдушній спробі врятувати життя відірвався разом зі штабом. Переслідуваний уральськими солдатами, він кинувся до автомобільного парку, але невелика група гвардійців зуміла протаранити однією з їхніх машин ту, яку особисто вів Дірлеванґер. У кульмінаційний момент бою гвардієць стрибнув на капот і прошив кабіну кулями, пробивши метал та вбивши Дірлеванґера й одного з його російських поплічників.\n\nПісля смерти провідника Казахська орда швидко покинула поле бою й повернулася додому. Ця остання битва офіційно поклала край життю божевільного есесівця та його мріям про різанину."
 URL.20.a: "День для святкування!"

 URL.21.t: "Облога Чорної Гори"
 URL.21.d: "Спочатку сили Лисенка чинили військам Ліги запеклий опір біля Маґнітоґорска, але його 22-га дивізія НКВД швидко усвідомила безнадійність становища й відступила до самого міста, щоб окопатися перед неминучою облогою.\n\nГвардійці та їхні союзники з Комун опинилися у скрутному становищі, адже жодна сторона не мала засобів знищити таку добре укріплену позицію, тож їм довелося вдатися до винахідливости, аби розколоти шкаралупу могутньої Чорної Гори. З Уралу притягли стару совєцьку облогову гармату, яка почала обстрілювати укріплені сталлю ворота, а відволікальний наступ ополчення Комун зв'язав оборонців. Однак люди Лисенка не очікували нападу із самої гори: загартований загін найкращих ветеранів Уральської гвардії видерся схилом гірської фортеці за допомогою старих абордажних гаків та альпіністського спорядження й завдав несподіваного удару там, де оборона була найслабшою, бо ніхто при здоровому глузді не мав на таке зважитися.\n\nКоли штурмова група дісталася мурів, оборонці зрозуміли, що їх обходять із флангу, й відкрили вогонь по гвардійцях, які підіймалися, вбивши кількох, перш ніж ті змогли відповісти, але цього було замало: за лічені хвилини елітні гвардійці захопили ключові позиції всередині фортеці й почали сіяти хаос. Коли останні оборонці відступили, щоб уникнути оточення, облогова гармата нарешті рознесла головну браму й дозволила ополченням також увірватися всередину. Бій покотився рештою фортеці, багато людей загинули в розставлених усередині пастках, доки нападники нарешті не знайшли Лисенка в його особистому кабінеті, де він навіть в останні хвилини проводив експерименти.\n\nКолишній науковець, збожеволівши від поразки, випустив своїх в'язнів і проголосив, що нова порода суперсолдатів захищатиме його до останнього, але, схоже, здивувався, коли натовп негайно обернувся проти нього: його відчайдушні крики, коли його розривали на шматки чоловіки, яких він катував усі ці роки, напевно ще довго переслідуватимуть у снах свідків."
 URL.21.a: "Нарешті цьому божевіллю покладено край."

 URL.22.t: "Удар по Лізі - відповідь"
 URL.22.d: "На нас напали! Рейдери Дірлеванґера здійснили зухвалий напад на один із колишніх ГУЛАГів, перетворених на навчальні центри для нових членів Уральської гвардії. Із укріпленого ядра споруди командир гарнізону надіслав Центральному командуванню радіозапит щодо наказів, які - за загальної згоди всіх офіцерів - зводяться до двох простих варіянтів: утримувати позиції або відступити. З одного боку, ми знаємо ГУЛАГ краще за цих дикунів, наші позиції укріплені, й наш обов'язок - битися з бандитами за кожної зустрічі. З іншого боку, головні сили там складаються зі свіжих новобранців або членів гвардії, які щойно завершили підготовку, і вони можуть не витримати людей Дірлеванґера. Якщо накажемо їм триматися, вони напевно зазнають тяжких втрат, і все це за об'єкт, який, імовірно, не вартий такої жертви. Який буде наказ, командире?"
 URL.22.a: "Тримати рубіж!"
 URL.22.b: "Відступити, щоб битися іншого дня!"

 URL.23.t: "Битва за Новотроїцк - промисловість чи люди?"
 URL.23.d: "Криза! Один із наших командирів надіслав радіограму з повідомленням, що бригада Дірлеванґера розпочала повномасштабний наступ на місто Новотроїцк. Місто вже певний час перебуває під нашим захистом і відіграє вирішальну роль у нашій воєнній машині завдяки багатій мінеральній промисловості. Тому ми розмістили там гарнізон Уральської гвардії, щоб захищати місто від рейдів і нападів. Однак це не звичайний рейд: командир доповідає, що наші зовнішні позиції вже захоплено й очікується глибше просування в місто. Ми досі контролюємо дві ключові частини міста - центр і промисловий район, - і командирові потрібно знати, чому віддати перевагу.\n\nЯкщо накажемо гарнізону гвардії зосередитися на обороні центру міста, то, можливо, зможемо стримувати сили Дірлеванґера досить довго, щоб евакуювати цивільних і поранених, зменшивши втрати й зберігши довіру народу, але це означатиме, що покидьки зможуть пограбувати наші промислові підприємства заради припасів і матеріалів. Якщо натомість зосередимо головну оборону в промисловому районі, то зможемо стримувати ворога досить довго, щоб завдати промисловості серйозних руйнувань і не дати їй потрапити до рук Дірлеванґера, але самі зазнаємо більших втрат і залишимо цивільних без захисту, з очевидними наслідками.\n\nЩо наказати, командире?"
 URL.23.a: "Евакуювати людей."
 URL.23.b: "Знищити промисловість."

 URL.24.t: "Битва за Новотроїцк - перемога"
 URL.24.d: "Слава нашим хоробрим чоловікам і жінкам! Звірі прийшли з гострими зубами й ненавистю в очах, але ми прикінчили їх, наче скажених собак. Спершу ми зазнали тяжких втрат і втратили контроль над трохи більш як половиною міста. Але хоробрість і вправність наших людей дозволили їм зрештою втримати рубіж і відбити одну за одною хвилі ворожих атак, перш ніж ми нарешті змогли розпочати власний наступ на їхні позиції. Це була довга й кривава праця, але ми таки відбили наступ Дірлеванґера на Новотроїцк, а його мешканці вітають нас як героїв. На жаль, значну частину промислових потужностей міста втрачено в боях, але це, без сумніву, перемога."
 URL.24.a: "Ми ніколи не здамося!"

 URL.25.t: "Битва за Новотроїцк - поразка"
 URL.25.d: "Приділіть, якщо можете, хвилину, щоб оплакати людей Новотроїцка. Як ми й боялися, наш гарнізон у Новотроїцку був ущент розбитий бригадою Дірлеванґера, попри доблесні спроби захистити місто. Уже надходять повідомлення про жахливі звірства над цивільним населенням, яке ми не змогли евакуювати, а також про масові грабунки й руйнування міста. Ми не лише втратили промислові потужності Новотроїцка, ця поразка похитне віру людей у нашу здатність їх захистити: ми дали обіцянку, а тепер, коли звістка про битву розійдеться, всі знатимуть, що ми її порушили."
 URL.25.a: "Нищівний удар."

 URL.26.t: "Проникнення в гори - рейд!"
 URL.26.d: "Надходять повідомлення від підрозділів Уральської гвардії та громад уздовж нашого кордону з Орском, і вони погані. Уночі бандити Дірлеванґера влаштували великий рейд на нашу територію, але повний масштаб шкоди став зрозумілим лише сьогодні вранці. Уздовж кордону відбулися десятки швидких атак, проте стало очевидно, що вони мали лише відволікти й скувати Уральську гвардію подалі від головних цілей.\n\nОдин із наших складів боєприпасів на старому совєцькому летовищі повністю пограбовано й знищено, гарнізон вирізано до останнього чоловіка, а водночас ці дикуни напали на табір невинних біженців у старому спортивному стадіоні, серед ночі підпалили намети й жорстоко вбили сотні людей. Наші люди на місці навіть доповідають, що тих, хто намагався втекти, знайшли застреленими відразу за руїнами табору.\n\nНарешті, трьох наших старших командирів, які служили біля кордону, вбито під час точного удару по їхньому командному пункту; є серйозні підозри, що рейдери забрали численні розвідувальні документи.\n\nЦе нищівний удар по наших зусиллях у регіоні, нашій здатності захищати невинних і нашій довірі в очах народу."
 URL.26.a: "Цих дикунів треба зупинити!"

 URL.27.t: "Кліщі - рейд!"
 URL.27.d: "Надходять повідомлення від підрозділів Уральської гвардії та громад уздовж нашого кордону з Орском, і вони погані. Уночі бандити Дірлеванґера влаштували великий рейд на нашу територію, але повний масштаб шкоди став зрозумілим лише сьогодні вранці. Уздовж кордону відбулися десятки швидких атак, проте стало очевидно, що вони мали лише відволікти й скувати Уральську гвардію подалі від головних цілей.\n\nОдин із наших складів боєприпасів на старому совєцькому летовищі повністю пограбовано й знищено, гарнізон вирізано до останнього чоловіка, а водночас ці дикуни напали на табір невинних біженців у старому спортивному стадіоні, серед ночі підпалили намети й жорстоко вбили сотні людей. Наші люди на місці навіть доповідають, що тих, хто намагався втекти, знайшли застреленими відразу за руїнами табору.\n\nНарешті, трьох наших старших командирів, які служили біля кордону, вбито під час точного удару по їхньому командному пункту; є серйозні підозри, що рейдери забрали численні розвідувальні документи.\n\nЦе нищівний удар по наших зусиллях у регіоні, нашій здатності захищати невинних і нашій довірі в очах народу."
 URL.27.a: "Цих дикунів треба зупинити!"

 URL.28.t: "Відповідь Ради"
 URL.28.d: "Фракційність і дріб'язковість Ради довели обговорення основоположних питань до повної зупинки. Розбіжності між непримиренними й симпатиками, сільськими й міськими делегатами завели у глухий кут військові, економічні й дипломатичні справи, а Уральська Ліга силкується зберегти консенсус, якого поза їхніми записниками ніколи не існувало. Зустріч, як і стільки інших нездійсненних надій, схоже, народилася мертвою.\n\nАж ось одинокий делегат Комуни відділяється від шарварку й простує до трибуни. У відчайдушному, щирому зверненні він нагадує братам про голодні істоти в темряві. Дірлеванґер і Лисенко, а за ними - моторошні історії, що просочуються про рештки Родіни: армії, які женуть людей хвилями, боротьба за владу й нікчемна тиранія. Проти такого, каже він, немає інших ліків, крім єдности й братерства. «Не можна дозволити духу свободи загинути на вівтарі чистоти!» - вигукує він і протягом незручної хвилини люто дивиться на власну делегацію.\n\nПотім він пропонує просту програму: Мендрікс відвідає Комуни з туром доброї волі, й, природно, обидві сторони дадуть відповідь подібним жестом. Обидві сторони надішлють військових радників задля безпеки, економічну допомогу надаватимуть на розсуд Ради, а щорічні двосторонні переговори забезпечать рівномірний розвиток цих відносин.\n\nАсамблея слухає й міркує. Поволі суперечки переходять до практичних рішень, а тоді - до узгодження подальших планів. Усупереч усім шансам делегат забезпечив успіх зустрічі. Свобода на Уралі робить іще один прекрасний, неможливий вдих."
 URL.28.a: "Чесно кажучи, не віриться, що це справді спрацювало!"

 URL.29.t: "Бажане запрошення"
 URL.29.d: "Нарешті надійшла відповідь з Орєнбурґа й навколишніх поселень. Нашу пропозицію провести двосторонні переговори задля поглиблення відносин нарешті прийнято. Це рішення, напевно, вимагало величезних зусиль від розсудливіших членів Ради, але головне - результат. Це довгоочікуване запрошення на зустріч із численними представниками Орєнбурґа - рідкісна честь для чужинців у Комунах - відкрило перед нами чимало можливостей для просування наших інтересів.\n\nПовідомляють, що відразу після радісної звістки Мендрікс відвідав стару каплицю своєї фортеці й помолився не лише за безпеку улюбленої гвардії та змученого Орєнбурґа, а й за дружбу, що зароджувалася між ними. У часи темряви, безнадії та страху ця маленька подія, така незначна поза межами цього невеликого регіону Росії, дала людям Південного Уралу значно реалістичніші сподівання на краще майбутнє - якщо не для них самих, то для їхніх дітей."
 URL.29.a: "Хвала Богові."

 URL.30.t: "Рада запрошує нас у гості"
 URL.30.d: "Мендрікс вийшов із бічних дубових дверей і ще до того, як побачив незліченні обличчя людей, перед якими мав виступити, був зустрінутий величезним гамором моря голосів. Увійшовши до великої зали, він відчув легку незручність від незліченної кількости очей, спрямованих просто на нього. Усі голови повернулися до нього, й усі розмови стихли з разючою швидкістю. Лише подекуди чулося тихе перешіптування; в кімнаті панувала моторошна тиша. Худорлявий священник міцно стиснув невеликий дерев'яний хрест, який завжди тримав глибоко в кишені - зрештою, навіть великі люди можуть відчувати невпевненість і потребувати розради близьких, - а потім заговорив своїм красномовним, виразним, але похмурим тоном.\n\nСпочатку він попросив представника прийняти дар, який привіз від гвардії. Після короткого гомону серед членів Ради м'язистий бородань, судячи з мозолів на руці - найімовірніше селянин або робітник, простягнув руку й представився Мендріксу. На диво, чоловік витяг із-за стільця чудово витканий зимовий кожух і довірив його священникові, промовивши, найімовірніше, завчені слова про те, що цей подарунок є «виявом духу Орєнбурґа».\n\nУтім, жест не здавався неприязним, і священника майже розважало, як кремезний чоловік нервово вовтузився в очікуванні його реакції. Широко й приязно всміхнувшись, Мендрікс відповів на люб'язність власним подарунком - оздобленим ножем, символом сильної, але захисної природи Уральської гвардії. Глибоко в думках він уже відчув іскру натхнення для промови, майже проповіді, спостерігаючи різкий контраст між двома подарунками й тим, що вони втілювали. Схоже, зустріч буде дуже успішною."
 URL.30.a: "Брати й сестри, нехай буде мир!"

 URL.31.t: "Бурба висуває свою кандидатуру на провідника Орєнбурґа"
 URL.31.d: "У вільному й заможному місті Орєнбурґ відбуваються важливі події. Алєксандр Бурба, блискучий інженер і найвпливовіший промисловець міста, яке він допоміг відбудувати після того, як воно лишилося саме внаслідок совєцького краху, вирішив узяти політичні справи регіону у свої руки й висунути свою кандидатуру на посаду голови Робітничої ради Орєнбурґа.\n\nДля нас сходження Бурби на вершину може мати найсприятливіші наслідки для майбутнього відносин з анархістами. Хоча Бурба не робив жодних заяв щодо нашої справи, ми можемо знайти спільну мову на ґрунті взаємного прагнення покласти край політичному хаосу й плутанині в місті та створити сильну централізовану армію Комун. Однак хоч як багато наша підтримка означає для його прагнення сильного й рішучого Орєнбурґа, гучна підтримка Бурби може нашкодити його боротьбі за провід. Ті, хто підозріло ставиться до Ліги й боїться нашого впливу, можуть побачити в Бурбі нашу маріонетку. Якщо ми хочемо, щоб Бурба став сильним провідником, якого потребує Орєнбурґ у ці тяжкі часи, слід діяти обережно."
 URL.31.a: "Алєксандр Бурба може розраховувати на нашу підтримку!"
 URL.31.b: "Краще нам не втручатися в цю колотнечу."

 URL.32.t: "Уральська Ліга підтримує кандидатуру Бурби"
 URL.32.d: "Поки суперечки довкола чинної політичної системи Орєнбурґа й потреби в централізованій владі щогодини стають запеклішими, у гру вступає зовнішній чинник. Уральська Ліга офіційно оголосила про підтримку кандидата-промисловця Алєксандра Бурби, покладаючи на нього надії на політичні й економічні реформи, що принесуть користь регіону й потенційно поліпшать відносини між Орєнбурґом і Лігою: одного дня це може перерости в союз проти спільних ворогів.\n\nВодночас у Раді точаться нескінченні розмови про те, чи допустимо давати Лізі хоч якийсь голос у вирішенні долі міста: Малєнков у своїй звичній блазнівській манері навіть назвав Бурбу «зрадливим капіталістом, який рветься виставити зад проклятій мілітаристській кліці», тоді як сам Бурба досі не зробив жодної заяви про нових покровителів. Тепер він мусить вирішити, чи прийняти дари уральців, чи зректися будь-якої чужоземної допомоги своїй кампанії."
 URL.32.a: "Бурба приймає підтримку Уральської Ліги."
 URL.32.b: "Бурбі не потрібна чужоземна допомога в боротьбі."

 URL.33.t: "Бурба дякує нам за підтримку"
 URL.33.d: "Бурба надіслав повідомлення з подякою за підтримку в його боротьбі. Хоча ми не в усьому сходимося поглядами, сказав він, ми погоджуємося щодо необхідности захищати російський народ від тиранів і бандитів. Для нас, звісно, найважливіше те, що за Бурби Орєнбурґ буде значно ближчим до нас у дипломатичному плані, ніж за Малєнкова чи, боронь Боже, у своєму нинішньому стані. У такому смертоносному й жорстокому регіоні, як наш, нам потрібні всі друзі, яких тільки можна знайти, тож ця допомога вельми доречна."
 URL.33.a: "Тричі слава товаришу Бурбі!"

 URL.34.t: "Бурбі не потрібна нічия допомога"
 URL.34.d: "Ми отримали повідомлення від Алєксандера Бурби, у якому він заявив, що не хоче нашої допомоги. Він сам візьме владу у свої руки й поведе Орєнбурґ до величі. Зрештою, наголосив він, із самісінького низу він піднявся до свого нинішнього становища лише власними силами. Відверто кажучи, ми не зовсім розуміємо, навіщо він узагалі просив про допомогу, якщо потім її відкинув. Коли казали, що він іще той дивак, то, безперечно, не брехали."
 URL.34.a: "Яка марна трата часу."

 URL.35.t: "Уральська Ліга зберігає нейтралітет щодо кандидатури Бурби"
 URL.35.d: "Попри суперечливий політичний процес, що триває в Орєнбурзі й результати якого докорінно визначать майбутнє міста, Уральська Ліга оголосила, що не втручатиметься у внутрішню політику Орєнбурґа й не підтримає кандидатуру Алєксандера Бурби на посаду голови Робітничої ради. Відтепер Бурбі доведеться покладатися лише на власну базу підтримки, щоб здобути перемогу й здійснити свої амбітні реформи міста та комун.\n\nХоча цей факт послабив нападки опонентів Бурби через його нібито зв'язки з експансіоністськими воєначальниками Уралу, схоже, він залишився без зовнішніх союзників, які могли б підтримати його боротьбу за лідерство. Він може або відкрито висловити невдоволення бездіяльністю Ліги, або промовчати про це."
 URL.35.a: "Бурба не коментуватиме цього."
 URL.35.b: "Алєксандер Бурба опротестує рішення Ліги."

 URL.36.t: "Бурбі байдуже!"
 URL.36.d: "Алєксандер Бурба прямо заявив, що йому байдуже до нашої відмови підтримати його, і він однаково продовжить втілювати свій плян. Він, імовірно, не досягне успіху, але нічого страшного: нам він однаково не подобався. Орєнбурґ знайде компетентніше керівництво деінде."
 URL.36.a: "Сам-один у своїй боротьбі. Нам його майже шкода. Майже."

 URL.37.t: "Бурба засмучений!"
 URL.37.d: "Бурба висловив розчарування й гнів через нашу відмову втручатися у внутрішню політику Орєнбурґа. Ми намагалися його заспокоїти й пояснити нашу позицію, але він нічого не хоче слухати. Він каже, що Уральська Ліга, попри всю нашу військову силу, покине Орєнбурґ напризволяще перед звірами, які терзають Росію. Він мав би краще за будь-кого розуміти, що ми не настільки дурні, аби підривати внутрішню стабільність потенційного союзника. З іншого боку, він ніколи не здавався нормальною людиною, тож, можливо, й справді не розумів. Таких, як він, буває важко збагнути."
 URL.37.a: "Таким, як він, треба перевести подих і заспокоїтися."

 URL.38.t: "Підкоритися чи чинити опір?"
 URL.38.d: "Важливі новини з Белорєцка. Ліга надіслала Раді офіційну заяву з вимогою надати громадянам Уралу голос у нашому уряді й закликає цивільну владу визнати їхні вимоги. Зайве казати, це дещо тривожно, адже статус і військова міць Ліги - зовсім не те, з чого ми можемо глузувати. Однак чимало членів кабінету твердо переконані, що ми не повинні йти їм на жодні поступки, а ідея опору популярна серед народу. Що нам робити?"
 URL.38.a: "Іншого вибору немає. Ми підкоримося."
 URL.38.b: "І що вони зроблять - воюватимуть із нами?"

 URL.39.t: "Слабкість породжує підпорядкування"
 URL.39.d: "Порівняно з примітивною комунною системою Орєнбурґа та його околиць, цим вінцем держави-виродка, ми трималися міцно й надійно. Ізольовані поселення за межами головного торговельного осередку Орєнбурґа рідко погоджуються на зміни, запропоновані Робітничою радою, що є очевидною ознакою слабкого врядування й неготовности до небезпеки, яка насувається. За оцінками і наших аналітиків, і фахівців із Комун, слабкі ополчення, що охороняють різні невеликі застави та села, у найкращому разі ні на що не здатні, а в найгіршому самі становлять загрозу громадському порядку. Як іще один аргумент на користь нашого втручання у «великий анархістський проєкт», це чудово слугує своїй меті. Раді не можна дозволити ставити себе на один рівень із військовою силою угруповань, які намагаються поширити вплив на її землі або знищити їх. Їхня оборона жалюгідна, а так звана «армія» - лише невелика слабка сила, нездатна протистояти навіть нашим дисциплінованим солдатам. Однак у своїй ганьбі вони звернуться до нас, адже з-поміж усіх проєктів лише наші бодай трохи подібні до проєктів Комун. У таких справах засоби втратили значення: нині виживання переважує всі інші міркування, і, найімовірніше, саме тому Орєнбурґ дозволив нам посісти таке привілейоване становище в Робітничій раді. Якщо ми зможемо захистити їх, нехай навіть незначною мірою, то, вірогідно, забезпечимо їхню відданість у майбутньому."
 URL.39.a: "Покора в обмін на життя."

 URL.40.t: "Погрози дають зворотний ефект"
 URL.40.d: "Попри нашу очевидну перевагу і у військових спроможностях, і у виробництві озброєнь, схоже, Орєнбурґ вирішив чинити опір і не приймати нашої милосердної пропозиції. Ми могли б забезпечити їм достатній захист, щоб принаймні убезпечити їхнє майбутнє, але вони цілковито відкинули нас. Тепер ми самі протистоїмо двом іншим лиховісним угрупованням і дивимося на багатий на ресурси регіон, який не бажає співпрацювати, попри наші найкращі наміри в місії захистити не лише саме наше існування й право на життя, а й безпеку цілого регіону. Наша справа справедлива, і ми не можемо покинути народ Уралу, не можемо порушити присягу, яку склали одне одному у Воркуті перед Довгим маршем. Однак ми не можемо заперечувати силу наших ворогів, і невдале рішення Орєнбурґа, можливо, прирекло весь регіон."
 URL.40.a: "Ми з гордістю підемо самі..."

 URL.41.t: "Підготовка до війни"
 URL.41.d: "Старінов завершив перевірку наших ресурсів і виявив, що ми маємо надлишок. У російській пустці рідко трапляється надлишок чогось, окрім страждань, тож треба мудро вирішити, як найкраще його вкласти. По-перше, ми можемо зберегти нинішній режим підготовки, водночас удосконалюючи старі тактичні прийоми, якими досі користуються наші спеціялізовані підрозділи. Всеосяжна реформа гвардії поглине надлишок, але збереже чимало крови.\n\nПо-друге, ми можемо розширити навчальні об'єкти й активізувати кампанії набору, заповнюючи прогалини в наших лавах.\n\nНарешті, ми можемо просто вкластися в якіснішу зброю. Ми надто довго покладалися на місцевих зброярів і каравани. Оснащення наших військ сучасним та ефективним спорядженням - чи то стрілецькою зброєю, допоміжним обладнанням або артилерією - різко підвищить їхню бойову ефективність і зменшить кількість поранень на полі бою; нововиготовлена граната, зрештою, не вибухне сама собою..."
 URL.41.a: "Підготовка - ключ до успіху."
 URL.41.b: "Людей ніколи не буває досить."
 URL.41.c: "Зосередимося на стрілецькій зброї."

 URL.42.t: "Рішення для наших командирів"
 URL.42.d: "Коли вовки починають шкребтися у двері, наші командири знову збираються на раду. Перед лицем таких небезпек нам доводиться ухвалювати важкі рішення щодо національної оборони, адже ми не можемо приділити увагу кожній програмі. Маємо кілька варіянтів.\n\nПерший - оновити наше спорядження. Чимало наших солдатів нині використовують зброю, якій уже десятки років і яка походить іще з Великої Вітчизняної війни. Німецький Kar98k або совєцький ППШ-41 часто можна побачити на плечах наших гвардійців у строю. Солдати насилу підтримують зношену зброю в робочому стані й не мають жодних шансів проти автоматів Лисенка чи мотоциклів Дірлеванґера. Однак заохочення нашої місцевої збройової промисловости й оснащення військ новою зброєю дорого нам коштуватиме. Доведеться пожертвувати цивільними промисловими потужностями, але це може того вартувати.\n\nДругий запропонований варіянт - мобілізувати найміцніших біженців для спорудження укріплень уздовж кордонів із нашими південним і східним сусідами. Ми знову пожертвуємо вкрай потрібними промисловими потужностями, але національна оборона є найвищим пріоритетом, а слабка економіка ліпша за економіку під владою Лисенка чи Дірлеванґера.\n\nТретій і останній варіянт - відправити біженців працювати на місцеві фабрики. Нам бракує коштів, і ми не можемо вічно утримувати воєнну економіку."
 URL.42.a: "Безпека передусім."
 URL.42.b: "Нашим військам потрібна зброя."
 URL.42.c: "Ми не пожертвуємо рівнем життя цивільних заради незначного збільшення воєнних спроможностей."

 URL.43.t: "Найкращі в Росії"
 URL.43.d: "Урал - не місце для слабких або боягузів. Скелясті гори слугують крижаними могилами серед бандитів і міст-розбійників. Щоб вижити в цьому суворому краї, потрібні і зброя, і відвага. Наші війська мають і те, й інше.\n\nІдеальний уральський солдат тримав би в руках надійну зброю, яка не заклинить і не підведе. Він знав би Урал як свої п'ять пальців і вправно користувався б картою та компасом. Найважливіше те, що його віра у справу настільки непохитна, що він пожертвував би собою заради мрії Уральської Ліги: свободи перед лицем зла, незалежности перед лицем нездоланної юрби та безкорисливости перед лицем жадібности. Люди Уральської Ліги ніколи не здадуться перед небезпекою, радше загинуть зі зброєю й гранатою в руках, ніж дадуть ворогові задоволення захопити когось із наших.\n\nУральська Ліга народилася з відчаю та крови в мерзлих ГУЛАГах Воркути й довела свою вартість під час Довгого маршу через Родіну. Якщо гвардії судилося загинути, вона загине єдиною - від вогню, а не від чвар."
 URL.43.a: "Гвардія може загинути, але ніколи не здасться."

 URL.44.t: "Ліга пропонує взаємну співпрацю"
 URL.44.d: "Сьогодні до Орєнбурґа прибув посланець із Белорєцка. Виснажений дорогою та нападами бандитів, він отримав медичну допомогу й добре виспався, перш ніж передати своє послання. Поклавши на стіл стос аркушів, він пояснив, що це пропозиція союзу від Уральської Ліги задля взаємної економічної та військової допомоги. Величезна кількість паперу являла собою всеосяжний плян удосконалення війська Орєнбурґа шляхом спільних навчань з уральськими військами, а також запровадження мит, бюрократичних реформ і спільної озброєної охорони доріг регіону.\n\nХоча Комуни завжди ревно оберігали свою незалежність і були ізоляціоністськими аж до ксенофобії, ніхто не може заперечити, що Уральська гвардія - єдине угруповання в наших околицях, не уражене божевіллям: бригада Дірлеванґера й Маґнітоґорск, наші безпосередні сусіди на сході, становлять серйозну загрозу нашій національній безпеці. Зрозуміло, що співпраця з Уральською Лігою допоможе нам захиститися, але чи справді ми можемо укласти союз з авторитарними реакціонерами й забути орєнбурзьку мрію про справжню свободу та незалежність?"
 URL.44.a: "Ми не пожертвуємо своїми ідеалами заради додаткової допомоги."
 URL.44.b: "Це необхідно для захисту наших Комун."

 URL.45.t: "Орєнбурґ відхиляє нашу пропозицію"
 URL.45.d: "Посол, якого ми відрядили до Селянських комун Орєнбурґа для переговорів про договір взаємної співпраці, повернувся. Його звістка недобра, і він привіз нам листа з відповіддю Орєнбурґа.\n\n«Як горда анархо-соціялістична держава ми не пожертвуємо своїми шляхетними ідеалами й не почнемо співпрацювати з капіталістичною державою. Нам вистачить сил утримати свої позиції проти фашистів і марксистів, що лежать поблизу. Сподіваємося, що перед лицем цих загроз ми стоятимемо разом, але відмовляємося працювати з вашими приватизованими підприємствами».\n\nСхоже, впертість Орєнбурґа стане причиною його загибелі. Утім, ми не повинні дозволити цьому збити нас із пантелику. Ми й надалі боротимемося проти загроз самому нашому існуванню - самі чи разом із кимось. Захист Батьківщини й визволення всіх людей мусять залишатися нашою кінцевою метою. Інакше заради чого жити?"
 URL.45.a: "Треба знайти нових партнерів."

 URL.46.t: "Орєнбурґ приймає нашу пропозицію"
 URL.46.d: "Посол, якого ми відрядили до Селянських комун Орєнбурґа, повернувся пізно минулої ночі. Він привіз продиктовану відповідь Робітничої ради Орєнбурґа.\n\n«Брати з Уральської Ліги. Ваш заклик до взаємної співпраці - не лише пропозиція, від якої неможливо відмовитися, а й необхідність для виживання анархічної свободи. Сподіваємося розпочати співпрацю якнайшвидше, бо загрози Чорної Гори й гунів не чекатимуть, поки ми марнуємо час на формальності. Перед лицем зла ми мусимо відкласти політичні й економічні розбіжності та битися як одне ціле».\n\nНаш уряд уже готує проєкт договору. Ми не змарнуємо цієї нагоди!"
 URL.46.a: "Єдність перед лицем зла!"

 URL.47.t: "Наскільки жорстко? Наскільки швидко?"
 URL.47.d: "Життя в Росії - низка вкладених одна в одну матрьошок. У тісній кімнаті, де керівники Уральської Ліги сидять, сховані кожен у своїй відполірованій оболонці, панує відчутна напруга. Через одне-єдине слово, яке кидають усередині цієї велетенської ляльки, наче вогняну кулю, спалахують люті сварки й час від часу сутички: Орєнбурґ. Орєнбурґ. Орєнбурґ. Назва відлунює різьбленими залами, ніби кидаючи виклик будь-кому підхопити її та вступити в гру. Це головне питання дня: звикла вважати розбиті Комуни лише невиразною прикрістю, що однаково потребує захисту, Уральська Ліга не вміє поводитися з ними як із рівним дипломатичним партнером. Однак, коли вороги вже грюкають у браму, зрозуміло, що звичних заходів більше не досить для безпеки Південного Уралу. Треба ухвалити рішення.\n\nОдна фракція генералів пропонує прямий підхід: приголомшливі вихваляння змусять Комуни скоритися нашій волі. Вимоги й нахабство можуть ґарантувати успішну анексію. Інша фракція пропонує лагідне зваблення замість жорстокого оволодіння - танець союзів і взаємних ґарантій, який неодмінно спрацює краще за агресію. Цю позицію обстоюють представники дипломатичного корпусу Ліги. Ще один куток кімнати пропонує новаторський і захопливий метод: проникнути в їхню систему й поволі повернути уряд до Ліги за допомогою військової та урядової «допомоги». Тут зібрався розвідувальний апарат Ліги - з усіма своїми темними таємницями й прихованими скелетами. Решта їх боїться, але ніхто не може заперечити слушність їхньої пропозиції. Дебати, затинаючись, тягнуться до раннього світанку. Втомлений від глухих кутів і безглуздих суперечок, замислений чоловік на чолі стола болісно зітхає. Звісно, усе завжди зводиться до цього. Священник, керманич, миротворець, творець володарів. Він переводить подих, чоловіки подаються вперед - і справу вирішено. Мендрікс висловився. Дебати закінчено. Уральська Ліга рушає на світанку."
 URL.47.a: "Сила - наша мова."
 URL.47.b: "Єдність - наша сила."
 URL.47.c: "Підривна діяльність - наш ключ."

 URL.48.t: "Заморозки"
 URL.48.d: "Уральська Ліга, як нам постійно нагадують, ніколи не була нашим другом. Ми можемо мати спільні інтереси, як-от бажання берегти власні справи й ненависть до всіх, хто загрожує миру, але реакціонерам немає місця за нашим столом, як і нам за їхнім. Коли їхні дипломати сердито залишають міста, а військові рухи на наших кордонах зустрічає вороже мовчання, цей факт стає очевидним як ніколи. Схоже, відносини між нашими державами істотно змінилися, і не конче на нашу користь.\n\nДипломатичний та економічний тиск Уральської Ліги спричинив демонстрації по всіх Комунах, об'єднавши роз'єднані поселення й Орєнбурґ у прояві єдности проти спільного ворога. У відповідь Робітнича рада оприлюднила заяву, в якій засудила Лігу як «підступних капіталістичних псів» і додала стільки інших наклепів, скільки змогла вмістити на одній сторінці.\n\nРезультат уже прославили як витвір «соціялістичного мистецтва» в орєнбурзьких шинках, тоді як Уральська Ліга у відповідь відкликала з наших земель захисні патрулі. Поки Комуни святкують вигнання небажаних знайомих, пересування військ у землях Лисенка й Дірлеванґера нагадують нам про суворі загрози поза нашими кордонами. Сподіваймося, ситуація владнається, перш ніж нас розріжуть на шматки за обіднім столом."
 URL.48.a: "Комуни поки залишаються самі."
 URL.48.b: "Нам не лишається нічого, крім як поступитися."

 URL.49.t: "Необхідне рішення"
 URL.49.d: "Орєнбурзька рада нагадує сотню чоловіків, що навшпиньки ходять одне навколо одного з ножами, натягнено всміхаються й тримають руку на спині сусіда. Такий жарт розповідають на вулицях і в долинах анархістського раю, і, на жаль, він близький до правди. Тепер ці ножі спрямовано на спільну ціль: «шановного представника» Уральської Ліги. Зрештою, ніщо так не об'єднує, як спільний ворог, а тепер вони безперечно стали ворогами Орєнбурґа. Та посланець порушує кілька вельми тривожних питань, яких не можна легко задушити затишним покровом «соціялістичної єдности». Один за одним делегати Ради ловлять себе на немислимому: вони погоджуються з реакціонером-централізатором. Представник використовує переконливі й вражаючі слова, що солодко ллються у вуха делегатів: єдність, солідарність і спільна відданість покращенню долі Росії та людства. Але всі розуміють, на що він насправді натякає. У приємних, невинних і цілковито безкомпромісних висловах він говорить про те, що рівнозначне кінцю рад в Орєнбурзі, - про союз. Сама думка про те, що Світоч Справжнього Соціялізму на Уралі може опуститися до потреби в чужоземній допомозі, справді немислима. Але страх долає гордість, і всі знають, яку небезпеку становлять Дірлеванґер і Чорна Гора. І тут посланець завдає завершального удару. Він починає сипати числами, і Рада здригається. Статистика не бреше: без підтримки Ліги Орєнбурґ поступатиметься числом солдатів і зброї, а ворог переграє його маневром. З підтримкою Ліги він має шанс поборотися, а без неї? Майбутнє міста й Уралу загалом похмуре. Можливо, шанс усе-таки є: зрештою, ополченці сповнені завзяття, а склади добре забезпечені зброєю. Та однаково цей шанс мізерний. Бюлетень за бюлетенем, голос за голосом Рада ухвалює рішення - й доля Комун висить на волосині."
 URL.49.a: "Справжній соціялізм тримається разом!"
 URL.49.b: "Справжній соціялізм стоїть сам!"

 URL.50.t: "Орєнбурґ змінюється"
 URL.50.d: "Минають дні, в Орєнбурзькій комуні тривають тяжка праця й виснажливий труд, а на поверхні майже нічого не змінюється. Однак внутрішні події вже серйозно непокоять керівництво комуни. Спершу комуна погодилася співпрацювати з Уральською Лігою, та мірою того, як обидві держави домовлялися про дедалі тіснішу співпрацю, Орєнбурґ почав зазнавати дрібних змін: від прибуття посадовців Уральської Ліги до приєднання десятків переселенців із Ліги до уряду комуни й прагнення громадян Уральської Ліги здобути ключові посади в невеликій сільській бюрократії. В очах місцевих громадян імміграція є потужним інструментом розвитку. Попри всі пов'язані з нею побоювання, вона приносила користь, збільшуючи населення комуни й сприяючи процвітанню нашої торгівлі. Та якщо ми просто й далі дозволятимемо їм прибувати в наше суспільство, вони зрештою можуть захопити уряд. Якщо виженемо їх із наших комун, то вбережемо незалежність ціною теперішнього добробуту й приязних відносин із Лігою. Хай що ми оберемо, це вирішить долю комуни."
 URL.50.a: "Нехай залишаються! Це новий розділ в історії нашої Комуни."
 URL.50.b: "Вигнати їх! Орєнбурґ належить лише нам!"

 URL.51.t: "Утвердити нашу владу?"
 URL.51.d: "Повітря в кімнаті тріщало від напруженого очікування, поки непримітний, але навдивовижу чарівний Божий чоловік оглядав своїх найкращих і найдовіреніших командирів. Майже всі, за винятком кількох непримітних молодших офіцерів, знали, чого латвійський священник вимагатиме від своїх людей. Різні фракції у військовому керівництві вже порпалися в статистиці, похмуро роздумуючи над її значенням. Їм знадобляться найкращі аргументи, щоб переконати побожного, але прагматичного чоловіка, за яким вони йшли. Обережним, виваженим голосом досвідченого проповідника Мендрікс звернувся до довіреного почту загартованих ветеранів, чимало з яких іще за часів Довгого маршу скували зі священником непорушні узи. Настав час розглянути питання Орєнбурґа й навколишніх поселень - затято анархістських комун, які, попри неприязнь до нашого централізованішого державного устрою, понад усе бажали миру у своїй невеликій частині уральського степу.\n\nУтім, Комуни зуміли розвинути велику промислову базу, можливо, навіть більшу, ніж Орєнбурґові потрібно для виживання в цій похмурій частині світу. Коли Мендрікс із властивим йому харизматичним красномовством виклав це, він помітив: подальша дискусія про те, як краще поводитися з Орєнбурґом - чи виконувати місію гвардії із захисту безпорадних, чи скористатися її нездоланною військовою силою, щоб утвердити владу над краєм і використати його ресурси для розширення могутности гвардії, - найімовірніше, буде дуже запеклою.\n\nНе всі тут зазнали нищівного для душі гноблення, яке ГУЛАГи нав'язали першим членам Ліги; ці люди не розуміли, як влада розкладає саму людяність, перетворюючи її на втілення найгірших гріхів. Мендрікс закінчив і почав викликати командирів, щоб вислухати їхні думки. Він відсторонився від моральної дилеми й чекав на їхнє рішення."
 URL.51.a: "Страхом і силою ми забезпечимо своє майбутнє."
 URL.51.b: "Ми не можемо зрадити своє походження."

 URL.52.t: "Ліга намагається утвердити свою владу!"
 URL.52.d: "Комуни Орєнбурґа завжди мали складні відносини з Уральською Лігою. Військова перевага Ліги в поєднанні з відносним багатством і слабкістю ополчень Орєнбурґа завжди змушувала частину політиків Комун ставитися до цієї організації в кращому разі з підозрою, а в гіршому - з жахом. Однак досі політика невтручання Ліги не давала цим політикам досягти якихось значних успіхів, а не менш впливова фракція виступала за співпрацю чи навіть союз із Лігою.\n\nНа жаль, нещодавня промова Мендрікса, схоже, назавжди знищила ці надії. Перед зібраними солдатами й офіцерами він заявив, що Ліга встановить свою гегемонію над Уралом, зокрема над Орєнбурґом, «заради добра самого народу Уралу».\n\nХитку політичну рівновагу в Комуні вже порушено. Триває нагальна підготовка до конфлікту, але сутички, що спалахнули між кількома фракціями, імовірно, зроблять її марною. Цивільні в жаху позамикалися у своїх домівках, чекаючи на бурю, яка ось-ось прийде від того, кого вважали найменш небезпечним із сусідів Орєнбурґа."
 URL.52.a: "Можливо, вони ніколи насправді не були на нашому боці."
 URL.52.b: "Нам не лишається нічого, крім як співпрацювати... поки що."

 URL.53.t: "Співпраця заради нашої свободи?"
 URL.53.d: "Хоча Ліга має певну славу останнього загону шляхетних і чесних солдатів на всьому Уралі, якщо не в цілій Росії, її потайливість і нестримна лють можуть дещо відштовхувати сусідів. У деяких випадках це навмисно й допомагає захищати громадян Ліги від хижаків із-поміж тих самих сусідів. Однак в інших випадках оперативні можливості Ліги були серйозно обмежені через її нездатність знаходити охочих до співпраці.\n\nНа щастя, командир Мендрікс, схоже, знайшов рішення. У промові перед зібраною когортою гвардійців верховний керівник Ліги оголосив, що відповідно до її мети бути «захисником» народів Південного Уралу вона утримуватиметься від будь-якої агресії проти всіх «гідних» сусідів.\n\nПриємно знати, що сусідня армія елітних дисциплінованих солдатів не прориватиметься крізь жалюгідне й вічно пересварене ополчення Орєнбурґа, щоб палити домівки та красти їжу, але ця заява насправді не змінила ставлення народу до Ліги. Ті, хто вважав Лігу союзником стабільности й розвитку, назвали цю заяву доказом своєї правоти; а ті, хто не довіряв Лізі, використали її як доказ того, що Ліга не лише ворог, а ще й підступний."
 URL.53.a: "Можливо, вони справді є силою добра."

 URL.54.t: "Диявол у горах"
 URL.54.d: "Один із наших солдатів запитав ветерана Уральської Ліги про Дірлеванґера й Лисенка, і його відповідь трохи налякала. «Хочеш знати про Дірлеванґера? Про Лисенка? Про всіх інших тутешніх воєначальників і тиранів? Товаришу, я можу розповісти тобі їхню історію, але таке зло по-справжньому можна зрозуміти, лише переживши його на власній шкурі».\n\n«Хоч як дивно, більшість нацистів виявляються доволі пересічними, коли дізнаєшся про них більше. Закінчивши вбивати й грабувати, вони повертаються до звичайної родини та нудного життя. Вони не надзвичайно розумні чи злі, а просто роблять своє діло, і роблять його добре. Для них це майже бюрократична робота: вбити невинного, спалити будинок із людьми всередині, зрівняти місто з землею бомбами - усе одно що заповнити папери. Вони не відчувають ані радости, ані задоволення, лише виконаний обов'язок. Але Дірлеванґер, розумієш, не такий. Він відчув радість, коли вбив свою першу людину - здається, якогось бельгійського рядового під час Великої війни. І ця радість ніколи не минула. Коли він діставав нагоду повернутися додому й жити нормальним життям, то завжди відмовлявся. Завжди. Король бандитів робить те, що робить, бо в глибині душі просто не може зупинитися. Лисенко, звісно, з того самого тіста: людське життя для нього нічого не важить. Проте він чинить це не заради насолоди, а заради власного збоченого уявлення про науку: відкриття й винаходи змушують його робити те, що він робить. Створені ним чудовиська, заподіяні ним тортури, кожен крик, кожна смерть для нього ніби ще один крок до того, щоб його пам'ятали нарівні з Айнштайном чи Едісоном, принаймні в його власній уяві».\n\n«Матінці-Росії вже давно доводиться нести на собі весь тягар тиранії, і доведеться терпіти його ще чимало. Але якщо ми колись хочемо покласти цьому край, Дірлеванґер і Лисенко мають зникнути. Вони не потерплять вільної та єдиної нації. Та й навіщо їм? Якби така постала, їх би першими кинули до в'язниці чи стратили. Тому ми мусимо захищатися від них і домогтися їхнього кінця. Зрозумів?»"
 URL.54.a: "Можна тримати його подалі від решти? Не треба, щоб він лякав усіх перед відправленням."

 URL.55.t: "Сила нашого союзу"
 URL.55.d: "Орєнбурґ та Уральська Ліга разом протистоять загрозі бригади Дірлеванґера, у цьому немає сумніву. Суперечки точаться про те, як саме нам слід стояти разом. Дехто прагне тісної співпраці й пропонує попросити Комуни про союз, який забезпечить взаємний захист та спільне використання ресурсів і після усунення найнагальніших загроз. Хоч Орєнбурґ почав більше нам довіряти, там усе ще підозріло ставляться до наших довгострокових намірів, і ми навряд чи можемо дорікати їм за параною, коли їхніми сусідами є зрадники з СС та божевільний учений. Тому вони можуть не захотіти укладати зобов'язувальний союз, побоюючись, що за такої угоди ми отримаємо надто багато влади.\n\nНатомість ми могли б дати їм низку взаємних гарантій - обіцянок захищати одне одного в скрутні часи. Це може стати добрим компромісом, адже представить нас рівноправними партнерами. Якщо ж ми захочемо припинити співпрацю з Орєнбурґом після розправи з Дірлеванґером, то можемо просто видати гарантію лише проти цієї конкретної загрози.\n\nВід того, якими узами ми вирішимо зв'язати себе з Комунами Орєнбурґа, ймовірно, залежатиме майбутнє Південного Уралу на багато років уперед."
 URL.55.a: "Союз заради майбутнього всього Уралу."
 URL.55.b: "Взаємні гарантії заради рівноправних відносин."
 URL.55.c: "Проста гарантія Орєнбурґу."

 URL.56.t: "Разом у майбутнє"
 URL.56.d: "Дірлеванґер мертвий, його мерзенний бандитський клан розвіяно за вітром. Чорну Гору розколото й виведено на світло. На Південному Уралі з'явилося нове відчуття, породжене оптимізмом і надією на краще майбутнє. Об'єднані сили Уральської Ліги та Комун Орєнбурґа здолали своїх ворогів. Тепер ми мусимо вирішити, яким хочемо бачити своє майбутнє.\n\nНаш союз допоміг зміцнити відносини з Орєнбурґом, і значна частина колишньої недовіри до наших людей зникла. Схоже, присутність наших військ і цивільного персоналу на їхній землі розвіяла їхні страхи, і тепер мешканці Комун бачать у нас рівноправних партнерів у боротьбі за виживання в Росії. Серед наших солдатів, що воювали поруч з орєнбурзьким ополченням, шириться популярна пропозиція: вони хочуть чогось більшого, ніж просто союз. Зрештою ця ідея дійшла до самого Яніса Мендрікса, і той після кількох невеликих змін погодився запропонувати Орєнбурґу договір про дружбу. Він об'єднав би наші народи не арміями й не торгівлею, а непорушними узами істинного братерства, що триватимуть віками.\n\nПроте серед наших людей є й незгодні. Вони вважають, що союзу з Орєнбурґом цілком досить як символу нашого братерства. До того ж змусити Комуни співпрацювати з нами було зовсім не легко, і ці люди сумніваються, чи Орєнбурґ відповідає нам такими ж почуттями. «Який сенс у договорі про дружбу, якщо ця дружба зрештою одностороння?» Мендрікс також почув їхні побоювання, тому закликав провести голосування, яке визначить наші майбутні відносини із союзником."
 URL.56.a: "Дружба між союзниками важлива."
 URL.56.b: "Ми разом воюємо, не більше."

 URL.57.t: "Дружба народів"
 URL.57.d: "Як колись разом стояв Совєцький Союз, так стоятимемо й ми.\n\nОрєнбурґ - наш союзник, наш брат, наш оплот проти божевілля, у яке поринув цей світ. Ми більше не повинні ставитися до сусіда як до галасливої дитини, норовистого коня чи неслухняного солдата, за якого нам доводиться виконувати його роботу. Орєнбурґ не є будь-ким з цього. Як і ми, Орєнбурґ - сильна, горда держава. Орєнбурґ населений сильними й гордими людьми, до яких ми мусимо ставитися як до співвітчизників-росіян, а не просто до тих, хто прагне відгородити собі власну вотчину. Ми - світло в ці дедалі темніші часи, і нести це світло іншим є нашим обов'язком і нашим спасінням. Хто ми такі, щоб відмовляти їм у ньому? Лише ставлячись до наших братів з Орєнбурґа як до рівних, ми зробимо перший крок на шляху до кращого завтра.\n\nЗаради наших дітей, заради Росії та заради завтрашнього дня ми стоїмо разом."
 URL.57.a: "Союз живе в наших серцях."

 URL.58.t: "Союз з Орєнбурґом розпущено"
 URL.58.d: "Наші могутні вороги лежать переможені перед нами, а жахлива війна, що охопила південноуральські степи, нарешті завершилася перемогою спільних сил орєнбурзького ополчення та наших почесних гвардійських дивізій. Лише завдяки величезним зусиллям обох армій нам вдалося загнати короля бандитів Дірлеванґера та його людей назад у пекельні провалля, з яких вони виповзли, і покласти край безумству найбожевільнішого втілення наших колишніх совєцьких гнобителів, що причаїлося в темних горах Маґнітоґорска. Тепер, коли ми стоїмо пліч-о-пліч і радіємо перемозі над злом, яке нас об'єднало, ми більше не можемо нехтувати нагальними проблемами, що нас розділяють. Здавалося, лише за кілька годин дружні орєнбурзькі сили, які допомагали нам у фінальному наступі, знову почали дивитися на нас із недовірою, повернувшись до часів, коли суперечки в їхній Робітничій раді так легко зводилися до нашого нібито дедалі більшого впливу на їхню автономну територію. Вони поволі повернулися до своїх сіл і містечок, а дехто - й до самого міста, залишивши нам лише спогади про нашу велику боротьбу. Наша плідна, але коротка дружба завершилася. Схоже, наша самотня варта знову триватиме."
 URL.58.a: "Назад на застави."

 URL.59.t: "Союз з Орєнбурґом розпущено"
 URL.59.d: "Дірлеванґер мертвий, його мерзенний бандитський клан розвіяно за вітром. Чорну Гору розколото й виведено на світло. На Південному Уралі з'явилося нове відчуття, породжене оптимізмом і слабкою надією на те, що попереду може чекати щось краще. Сили Уральської Ліги та Комун Орєнбурґа перемогли своїх ворогів. Спільні вороги та пережиті разом битви допомогли зміцнити відносини з Орєнбурґом, частина їхньої недовіри до нас розвіялася, і тепер багато тамтешніх людей вважають нас друзями. Ми виконали свою гарантію захисту Комун, тож на офіційному рівні наші відносини тепер дещо невизначені.\n\nДехто з наших людей, що воювали поруч з орєнбурзьким ополченням, прагне зберегти й поглибити наші відносини. Проте є й ті, хто сумнівається, чи Орєнбурґ справді гідний такої чести. Вони наголошують, наскільки важко було співпрацювати з Комунами та як часом ті відверто ставилися до нас із неприязню й недовірою, бачачи в наших солдатах потенційних загарбників. Лише час покаже, якими будуть наші відносини з Орєнбурґом."
 URL.59.a: "Ми виконали свій обов'язок."

 URL.60.t: "У пошуках допомоги"
 URL.60.d: "Ми нечасто просимо допомоги в сусідів, зважаючи на їхні... своєрідні погляди на дипломатію, економіку й теорію раціонального урядування. Але настав час визнати, що самотужки ми не встоїмо. А серед наших сусідів Комуни безперечно найпритомніші, якщо порівнювати з убивчим бандитизмом бригади Дірлеванґера й терором Чорної Гори. Якщо вже спиратися на когось іншого, то Комуни - безпечний вибір, попри всі їхні дивні балачки про «радикальне скасування ієрархій» та нездатність домовитися хоч про щось. До того ж у нас обох є серйозніші вороги - найкраща з можливих причин для дружби.\n\nФормальності владнують, супровід набирають із наших лав, а попередній текст прохання вже набуває форми. Наші керівники погоджуються, що їжа й людські ресурси є критичними потребами; питання лише в тому, чого саме ми попросимо. Їжа могла б підвищити нашу продуктивність і збільшити наявні запаси для майбутніх справ, тоді як люди допомогли б поповнити наші лави й зміцнити військові спроможності.\n\nМендрікс і його радники планують до пізньої ночі, і рішення ухвалено. Наш вибір -"
 URL.60.a: "Завоювання хліба!"
 URL.60.b: "Сила зброї!"

 URL.61.t: "Відповідь на прохання"
 URL.61.d: "Уральська Ліга - дивний союзник, але все ж союзник, принаймні порівняно з іншими нашими сусідами. А як це часто буває між союзниками, ми знаємо їхні дивацтва не гірше, ніж вони наші. Їхній гірський клімат і неродючий ґрунт дають мізерні врожаї та недостатньо харчів, а Уральська гвардія фактично належить до найбільших імпортерів нашого зерна. Тому дипломатичне прохання про додаткові харчі було цілком очікуваним - чого ми не очікували, то це уявлення Ліги, ніби вона заслуговує на рівне ставлення.\n\nУгода, звісно, матиме свої переваги. Попри всі старання Ради, ми так і не змогли зібрати чи спорядити достатньо солдатів для справжньої армії. Наша згода могла б настільки поліпшити відносини з Лігою, щоб майбутні домовленості військового характеру давалися легше. З іншого боку, дехто каже, що наша залежність від зброї Ліги ще обернеться проти нас, а відмова в цьому проханні стане першим кроком до позбавлення цієї залежности.\n\nРада збирається, силкується перейти до питання й поринає в довгі та виснажливі дебати. Нарешті, через кілька годин після початку засідання, узгоджено відповідь."
 URL.61.a: "Розділимо хліб на знак дружби!"
 URL.61.b: "Нехай їдять тістечка! Тільки не наші."

 URL.62.t: "Прохання задоволено"
 URL.62.d: "«Як і очікувалося, делегація повернулася з чудового Орєнбурґа й привезла добрі новини. Слід негайно почати підготовку до прийняття надісланих запасів їжі. Ми впевнені, що продовжимо ці відносини й водночас зміцнюватимемо одне одного. Я дякую відданим радникам, які не забули своїх друзів. Нехай ми завжди відповідаємо їм щирою та дружньою усмішкою».\n\nОфіцер Ліги сходить із трибуни під уривчасті оплески. Він не дивиться ані на каравани, готові прийняти запаси зерна, ані на офіцерський корпус, що вітає його. Подумки він уже вдома: Аня варить борщ на кухні, а малий Анатолій бігає з собакою. Йому вдалося забезпечити цілий місяць без виснаження, голоду, страху й відчаю.\n\nОфіцер усміхається. Ще один місяць із повним шлунком - це місяць радости, і зараз він рахує дні в календарі. Ліга та його робота можуть зачекати. Його дім тут, і він заслуговує почути добру новину."
 URL.62.a: "У безпеці від голоду й нужди."

 URL.63.t: "Крізь стиснуті зуби"
 URL.63.d: "«На жаль, наше прохання було цілковито відхилене Лігою - ми нічого не домоглися. Мендрікс запевняє Лігу, що не має наміру дозволити Белорєцку голодувати; ми й далі шукатимемо допомоги в інших регіонах, а всі громадяни мають зберігати оптимізм».\n\nСлова офіцера анітрохи не виказують його справжніх почуттів. Та хто їм повірить? Куди ще податися? Уральській Лізі просто нема на кого покластися, і якщо ця невдала угода задасть тон зміні відносин, то і на Орєнбурґ, і на гвардію чекають жахливі часи. А сусіди жадібно спостерігають і будують плани.\n\nЙому стає зле. Можливо, він не зізнається в цьому навіть собі, але він розгублений, і сьогодні так само почувається більшість Белорєцка. Він готується зустріти стривожених дружину й дитину, які, без сумніву, радо його приймуть, але з тінню тривоги та навіть розчарування.\n\nВін думає, чи зможе жити з цим почуттям провини."
 URL.63.a: "Ситуація вкрай несприятлива."

 URL.64.t: "Відповідь на прохання"
 URL.64.d: "Від самого заснування Уральська Ліга виростала навколо своєї гвардії, наче дерево навколо меча. І нехай цей меч увійшов у стовбур аж до руків'я, це не означає, що дерево про нього забуло. Схоже, Ліга прагне відточити свої військові спроможності й потребує нашої допомоги.\n\nСьогодні Комуни отримали прохання надати сто солдатів, яких виховають і розмістять у Лізі. Вона просить не найкращих і не найталановитіших, а лише тих, хто згоден пройти підготовку. Ми не сумніваємося, що їхній суворий вишкіл, яким часом лякають неслухняних дітей, швидко приведе наданих нами людей до належної форми.\n\nТа ми можемо й відмовити: багато радників кажуть, що сама думка відправити власних людей у суворе «рабство» Ліги та гвардії цілком безглузда й зраджує наші принципи. До того ж надіслані нами люди могли б стати в пригоді під час жнив, коли сільським комунам для збирання врожаю потрібні всі робочі руки. Рада, звісно ж, розділилася з цього питання.\n\nПотрібне рішення."
 URL.64.a: "Надіслати людей. Орєнбурґ іде з ними."
 URL.64.b: "Відмовити в допомозі. Орєнбурґ стоятиме сам."

 URL.65.t: "Табір новобранців"
 URL.65.d: "Олєґ нажаханий. Нажаханий до мокрих штанів і тремтіння в колінах. Він лише двадцятишестирічний селянин із маленького села й прямує до третього найгіршого місця з усіх, що знає (перше - Чорна Гора, друге - те, де зараз опинилася бригада Дірлеванґера), - до навчальних казарм Уральської Ліги. Ну, до однієї з них; він же не знавець географії.\n\nВін озирається в тісній вантажівці й бачить таких самих чоловіків, переважно молодих і міцних. Багато хто молиться, шукаючи розради. Дехто тихо схлипує. Олєґ сумнівається у здатності Бога врятувати бодай когось від долі, що на них чекає, але, як завжди казав сільський радник, бідним потрібна втіха. Те, що на них чекає, навряд чи буде милосерднішим за порожнє повітря.\n\nВантажівка верещить, звертає на нерівну гірську дорогу й зупиняється. Солдати, що обступили її, виганяють пасажирів назовні й махають їм, усміхаючись. Олєґа не полишає погане передчуття - ці усмішки не зовсім невинні, хоч наміри в них і добрі.\n\nЇх виводять на плац і дають п'ять хвилин, щоб викласти все з торб. Тоді скласти назад. Потім знову викласти. Тоді хтось у формі кричить на них, і все починається спочатку. Для Олєґа це буде довгий день. А ще він стане першим днем для нової партії іноземних солдатів, що вступають до Уральської Ліги. Сподіваймося, ця партія стане першою з багатьох."
 URL.65.a: "До роботи."

 URL.66.t: "Нестача людей"
 URL.66.d: "До справи підшито звіти про чергове невдале прохання до Комун. Керівники намагаються переконливо всміхатися, але не можуть. Темними залами Уральської Ліги міряє кроками підлогу далеко не лише Мендрікс.\n\nЛізі бракує людей, але це не найнагальніша її проблема. Бригада та жахіття Гори дають нам чимало причин для тривоги, однак наші війська добре підготовлені й споряджені. Ми маємо добрі шанси в оборонній війні, як не раз запевняють наші радники, та нам потрібен надійний союзник. Якщо ми втратимо Комуни, то втратимо будь-яку надію на притомного друга. Не те щоб нині Урал був особливо гостинним.\n\nПропонують і відкладають різні рішення, зокрема негайну мобілізацію для нападу на Чорну Гору чи Дірлеванґера, перш ніж ті усвідомлять нашу відносну слабкість. Зрештою нічого істотно не змінюється, але за збереженого становища ніхто не спить спокійно.\n\nЛіга тремтить і озирається в пошуках тепла, але поруч його немає. А вночі Урал - холодне й темне місце."
 URL.66.a: "Мусимо покладатися на себе."

 ### Flavor ###
 URL.100.t: "Грім і блискавка"
 URL.100.d: "Для тих, хто був у зоряному небі, крихітні цятки світла в океані темряви внизу здавалися мурахами, готовими бути розчавленими, або, що ще лиховісніше, світляками перед бурею. Безглуздими й відірваними від світу. Та німецькі бомбардувальники дуже відчутно впливали на тих, хто був унизу. Для бідних та ізольованих російських селян і комун, які ледве зводили кінці з кінцями, гуркіт темних машин над головою означав не що інше, як гру випадку. Сьогодні ми чи сусідня ферма? Для багатьох ця жахлива азартна гра, у якій вони знову й знову ставили на кін власне життя, стала щоденним ритуалом: сьогодні буде бомбардування, голод чи, може, набіг банди? Лише час покаже.\n\nДехто й справді ставив на це товари, бо що тепер означали гроші? Коли німці прийшли вперше, багато хто намагався сховатися, втекти, просто вижити. Нині безперервні бомбардування стали нормою. Частиною російської психіки. Якби ви запитали чи то людей у небі, які щодня скидають ті самі бомби на тих самих людей, чи то людей на землі, на яких щодня падають ті самі бомби, то почули б дуже схожі відповіді про їхнє повсякденне життя. Гра в життя і смерть. Одні мусять обирати, кого вбити, інші мусять терпіти. Жодна зі сторін через зовнішні сили не здатна зупинити це жорстоке, нескінченне коло. У моторошному вияві співчуття й солідарности вже двічі, у новорічну ніч, деякі німецькі бомбардувальники скидали замість звичного вантажу феєрверки. Прекрасна вистава кольорів, яка єдиний раз у році уривала одноманітність грому й блискавки. Наступного дня вічна гра продовжувалася."
 URL.100.a: "Життя крихке й непевне."

 URL.101.t: "Іскуплєніє"
 URL.101.d: "Щоразу, коли Яніс Мендрікс промовляв на богослужіннях, Діти Воркути відзначали поетичність його голосу, те, як кожне слово проповіді малювало такий виразний і піднесений святий образ, ніби його промовляв сам Господь. За роки вивчення богослов'я священник навчився передавати людський дух і латиською, і російською мовами. Сьогодні він нарешті завершив збірку поезій під назвою «Спокута» й надіслав перший примірник до друкарень Уральської Ліги. У цих розрізнених записах, що створювалися багато років і розповідали про віру, наполегливість та виживання, через образи й вірші збережено давні слов'янські поетичні традиції. Ось уривок з одного особливо доречного твору:\n\nХоч тут стоїмо ми самотньо,\n\nОточені тими, хто в гріху загруз,\n\nТа клич Росії сильніший за скоєне ними,\n\nІ віра міцнішає в нас.\n\nХоч інтелектуальна спільнота й молодь усієї Ліги привітали видання, невіруючі та войовничіші мешканці наших земель здебільшого проігнорували цю подію. Час покаже, чи стане збірка класикою, чи Мендрікса забудуть, як тисячі інших другорядних поетів."
 URL.101.a: "Можливо, Південному Уралу судилося стати краєм поезії."

 URL.102.t: "Уральська сімка"
 URL.102.d: "Сьогодні ми оплакуємо героїв.\n\nКілька днів тому семеро бійців Уральської гвардії прибули до села Прєчістєнка після повідомлень про німецьких бандитів з Орска. Село вже пережило набіги, втративши ферми й людей, коли прибула гвардія. Далі розгорнулася історія героїзму, скорботи та перемоги.\n\nУральська сімка, як їх почали називати, навчила цивільних військової справи й допомогла спорудити навколо села імпровізовані укріплення.\n\nЧерез кілька тижнів прийшов ворог: понад п'ятдесят чоловіків, російські бандити й німецькі рейдери, атакували селище, тиснучи й намацуючи кожен куток села в пошуках слабини в обороні. Налітники не сподівалися такого запеклого опору, наче вовк, який раптом виявив, що навіть кролі мають зуби, та все одно штурмували Прєчістєнку, мов скажені звірі, спраглі їжі й крови. На захисників кинули гранати, кулемети, Жданових і навіть два десятки казахських вершників, але щоразу їх відбивали: село стало фортецею, кожна хата - бастіоном, кожна дорога - барбаканом, кожна душа - вартовим.\n\nОдин за одним падали бійці Уральської сімки. Один за одним вони відважно билися й гинули, захищаючи невинних і останнім подихом спонукаючи своїх підопічних не припиняти боротьби. І ті не припинили. Чоловіки й жінки, молоді й старі, слабкі й сильні - усі билися із відвагою, про яку самі в собі не підозрювали, доки бандити не зламалися об коліно Прєчістєнки. Коли на третій день курява осіла, село вистояло, а бандити загинули чи втекли. Селяни вітали падіння останнього бандита, але гвардійці не раділи. Наступного дня їх уже не було: вони відмовилися приєднатися до сільського святкування, обравши натомість поховати загиблих і повернутися додому.\n\nМожливо, Уральська сімка, від якої тепер лишилося лише троє, і відсвяткувала перемогу. Та понад усе вони оплакували тих, хто не зміг розділити з ними славу. Відтоді в маленькому селі Прєчістєнка в день нападу запалюють сім свічок, чотири з яких вищі й сяють яскравіше за інші."
 URL.102.a: "Ця перемога належить селянам, а не нам."

 URL.103.t: "Паломництво"
 URL.103.d: "Через деякий час після перемоги над ворогами Ліги кілька старших офіцерів звернули увагу на велику кількість вантажівок, захоплених у НКВД Лисенка та бригади Дірлеванґера. Спершу вони жартували, що всі ці машини дуже знадобилися б під час Довгого маршу з Воркути багато років тому, але жарти поволі переросли у справжню ідею, і незабаром уже заговорили про паломництво туди, де все почалося.\n\nДля подорожі зібрався невеликий загін солдатів, який вирушив на північ, повторюючи колишній маршрут, хоча цього разу значно краще споряджений. Попри кілька сутичок із розбійниками, менше ніж за два тижні вони дісталися морозних околиць Воркутинського ГУЛАГу. Табір стояв порожній, майже недоторканий від часу їхнього відходу. Вони провели там кілька днів, розмірковуючи про пройдений шлях, залишаючи пам'ятні знаки тим, хто не дожив до цього паломництва, і шукаючи речі, які могли колись покинути.\n\nОднак для одного солдата місце початку стало й місцем кінця. Попри перемогу, попри всі спогади, його серце спорожніло. Він потер куксу руки, яку відрубав один із людей Дірлеванґера, і згадав усіх товаришів, утрачених у лабіринтах лабораторії Лисенка. Сидячи у своїй старій камері, він думав про всіх ув'язнених разом із ним людей, з яких нині не лишилося нікого. Він гірко плакав і питав себе, чому лише він досі тут, якщо не задля того, щоб страждати. Раптом відповідь стала йому цілком ясною.\n\nТовариші знайшли його на підлозі камери, з пістолетом у руці та мокрими від сліз щоками. Вони мовчки поховали його на маленькому табірному кладовищі; його хрест став єдиним, що стояв серед десятків могил, понівечених роками. Потім вони взяли курс додому."
 URL.103.a: "Деякі душі так ніколи й не покинули Воркуту."

 URL.104.t: "Новий дім"
 URL.104.d: "Анатолія вабила відкрита дорога: короткі зустрічі з незнайомцями, доброта й гнів, які приносила невідомість. Але Анатолій зовсім не скучив за холодом. Коли зима впивалася зубами в тундру, він втрачав друзів і пальці на ногах. Та попри все це дорога була набагато кращою за його колишній дім. Колима була місцем, якого не заслуговувала жодна людина, і нагадувала крижане пристановище Диявола: якби хтось читав «Пекло» Данте, то згадав би Каїну - замерзлу країну Каїна та його побратимів-зрадників, де прокляті терпіли вічний холод, позбавлені свободи смерти. Усе це було в минулому, та минуле ніколи не згасало, й Анатолій робив у тих крижаних таборах речі, від яких тремтів із причин, зовсім не пов'язаних із холодом, що пробирав його до кісток.\n\nЗа стінами майже нічого не було: поодинокі кочівники, холодні й відсторонені, могли запропонувати хіба суп та хліб, а вздовж старої дороги виднілися лише руїни. Під час повільного руху на південь поступово поверталася подоба цивілізації, а разом із нею - й людяність. Бандити й злочинці, злодії та жебраки, але принаймні він міг знайти прихисток від холоду.\n\nАнатолій невиразно пам'ятав, що на сході було море й Китай. На заході, можливо, існувала російська держава. Може, людяніша за старий Союз. Старий вирішив іти за сонцем, що сідало.\n\nЧи то через його власне сприйняття, чи то через рух Землі дні стали довшими. Снігу більше не було, а на обрії золотилася пшениця. Десь удалині щовечора сяяв вогонь. Одного довгого дня Анатолій дістався маленького села десь високо в Уральських горах. Вартові, загартовані життям поза зручностями розвиненого світу, попросили показати документи. Коли Анатолій сказав, що не має їх, вони натомість попросили розповісти свою історію, і чоловік почав із далекого минулого в таборах, а закінчив недавніми роками в дикому російському Сході. Почувши про його перебування в ГУЛАГу, вартові запросили його до караулки й налили склянку горілки. Табори переживали лише найвідважніші, й Анатолій був одним із них. Після міцного ковтка отруйної рідини вартові повели його до солдата в старій формі. Із забрудненими руками та зморшками біля очей той покликав його:"
 URL.104.a: "«Ласкаво просимо додому, брате!»"

 URL.105.t: "Серця і шлунки"
 URL.105.d: "Набір в Орєнбурґу просувається... важко. Гвардія, як завжди, намагалася поповнити свої лави добровольцями з-поміж тих, кого захищає, але багато Комун Орєнбурґа опинилися в страшній скруті. Хоч якими гордими вони намагаються здаватися й хоч яким багатим є саме місто Орєнбурґ, злидні вражають край, мов рак.\n\nЦе стало очевидніше, ніж будь-коли, коли старший лейтенант Кобяков зі своїм відділенням прибув до Красного Маяка - села, яке від багнюки навколо не відрізняла навіть табличка.\n\nПрибувши до села, офіцер зробив те, що робив завжди: виліз на табурет і почав розповідати селянам про відвагу гвардії та її благородну місію. Він довго говорив про їхній марш із Воркути, про численні небезпеки на шляху й незліченні перемоги. Про знищення Басєзьких чорних бригад. Про їхній тріумф над зграєю із понад сотні вовків у Свєрдловску, яка готувалася накинутися на село Бєрдюґіно. Навіть про власну втечу від канібальського культу Кам'яної Гори!\n\nТа він не встиг дійти й до половини барвистої реконструкції Битви сімдесяти семи на Сосьві, як селяни його перебили. Глузливі вигуки знищили крихту надії товариша лейтенанта знайти придатних новобранців: селяни вимагали не оповідей про героїзм, а їжі, води й теплого одягу.\n\n«Якщо хочете нас захистити, то нагодуйте!» - вигукнув чийсь розгніваний голос.\n\n«Я не можу вдягнути власних дітей, а ви хочете, щоб я воював?!» - долинув інший.\n\nЗа кілька хвилин пригнічені гвардійці почали віддавати селянам пайки, шинелі й усе інше, що мали при собі. Солдат Юдін віддав шинель, молодший сержант Іпатов - цигарки, а з Іванова витиснули навіть годинник! Наприкінці дня гвардія покинула Красний Маяк без жодного новобранця і значно біднішою, ніж прибула."
 URL.105.a: "Чи справді ми можемо допомогти тим, хто не може допомогти собі?"

 URL.106.t: "Мандрівний пастир"
 URL.106.d: "Сьогоднішня служба тиха, як завжди. Навіть до розпаду Союзу й хаосу воєначальників католицизм завжди був чужим для православної Росії. Тож не дивно, що каплицю, затиснуту в одному з куточків Белорєцка, відвідують рідко й вона ніколи не буває повною. Священник стоїть перед освяченими дарами й молиться за загублені душі, яких життя досить побило, щоб вони шукали прихистку в Богові.\n\nРаптом до церкви заходить виснажена постать у сірій рясі, обличчя затінене тьмяним світлом свічок, волосся сховане під каптуром. Вона прямує просто до вівтаря. Чоловік складає руки в мовчазній молитві й сідає. Священник спантеличений, та зберігає спокій: за своє життя він бачив усі види сум'яття, а тривога ще ніколи не допомагала Божому слузі. Коли починається причастя, священник іде порожніми рядами, роздаючи вино й хліб, як його попередники в неперервному ланцюгу служителів від часів Петра. Він помічає чоловіка, що молиться, запитує його ім'я й питає, чи може помолитися за нього.\n\nЧоловік підводить очі, повні сліз. «Простіть мене, отче, - шепоче він захриплим від горя голосом, - бо я відступив від свого обов'язку й сиджу на зламаному престолі. Я прагну миру, та люди навколо закликають до війни; моє серце стривожене, і душа моя скорбить смертельно. Я є... був слугою, священником. Я покинув свій обов'язок перед живим Богом. Хто простить мене? Хто може?» Спантеличений священник дивиться на нього - зрештою, почути сповідь бездоганною, хай і з акцентом, латиною в цих змучених землях випадає нечасто - і помічає в чоловікові щось знайоме. Невже це...\n\nЧоловік уриває себе, загортається в рясу й підводиться. Він швидко виходить із церкви, залишаючи священника, до якого поволі доходить істина. І подібно до Петра, що відрікся від свого Христа, Яніс Мендрікс утікає в ніч, залишивши по собі лише заплямований слізьми прохід як єдине свідчення того, що він узагалі був тут."
 URL.106.a: "За наші беззаконня він був покинутий."

 URL.107.t: "Проповідь"
 URL.107.d: "Ви, безперечно, вже чули про поразку гітлерівських бандитів на півдні та смерть Дірлеванґера. Про те, що Чорну Гору, якої так довго боялися люди Південного Уралу й яка так довго зловісно височіла над ними, саме цієї миті підкорюють наші люди. Я не використаю цю нагоду, аби читати вам лекцію про перевагу наших сил чи нашу непереможність, як зробив би хтось інший. Натомість я хочу розповісти вам про часи, коли ми не мали надії й були сповнені страху. Хтось може запитати, навіщо саме зараз я розповідаю про пережиті нами поневіряння та страждання. Хіба ми не повинні дякувати за перемогу?\n\nКоли ми були у Воркуті, навряд чи хтось бачив причину дякувати Богові. Але ми трималися разом і вистояли. Під час маршу багато хто впав край дороги. Ніхто не засудив би тих, хто сумнівався в обраному нами шляху. Але ми все одно йшли вперед. Навіть коли східна загроза була готова поглинути нас і знищити все дороге нашим серцям, ми не зупинилися. Чому?\n\nНа кожному кроці, від ГУЛАГу й маршу до полів битв Південного Уралу, ми вірили в остаточну перемогу. Вірили, що Бог допоможе нам, хоч якими тяжкими будуть обставини. Він був із нами, коли ми голодували. Він був із нами, коли ми оплакували загиблих. І Він так само перебуває з нами в мить нашої перемоги.\n\nЯ хочу, щоб ви пам'ятали цю мить радости й тріумфу. Але хочу, щоб ви пам'ятали й миті смутку та поневірянь. Бо коли смуток і поневіряння знову прийдуть до вас, ви знатимете, що завдяки своїй волі та вірі в нашого Господа так само неодмінно переможете знову."
 URL.107.a: "Амінь."

 URL.108.t: "Гвардієць-малюк"
 URL.108.d: "Був ранній ранок, небо прорізали лише поодинокі промені світла, коли одну із застав Уральської Ліги в південній глушині атакували есесівські бандити Дірлеванґера. Їм вдалося прослизнути повз периметрові патрулі й убити самотнього вартового, перш ніж той устиг попередити решту загону, після чого вони тихо рушили до наметів, де спали гвардійці.\n\nОднак їхній наліт помітили: молодий кадет, якому ледве виповнилося п'ятнадцять, один із Синів гвардії, знайшов тіло вартового, коли ніс йому каву. Кмітливий хлопець схопив пістолет-кулемет загиблого солдата й вистрілив у повітря, розбудивши гвардійців. За лічені секунди ті кинулися до зброї, застали нападників зненацька й, усупереч очікуванням, вибили їх.\n\nКоли кров висохла, кадета, який урятував увесь гарнізон, відвезли до Белорєцка, де провели вулицями разом із гвардійцями, що завдячували йому життям. Після параду юний курсант отримав Медаль Героя від самого отця Яніса Мендрікса, голови Уральської Ліги, а звістка про подію розійшлася далеко за її межами. Та найкраща мить святкування настала, коли зі юрби вийшла стара жінка й заявила, що знає юнака: у їхньому маленькому селі вона була близькою подругою його матері, а дві жінки дали одна одній обітницю подбати про чужу дитину, якщо з котроюсь із них щось станеться. Коли на селище напали бандити, хлопець разом із батьками втік до лісу, переслідуваний казахами, і відтоді вона втратила будь-який слід родини. Усі газети Уральської Ліги надрукували зворушливе фото хлопця, який крізь сльози обіймав стару жінку, міцно тримаючись за останній уламок свого дитинства."
 URL.108.a: "Великий чи малий - гвардієць лишається гвардійцем."

 URL.109.t: "Якби мої солдати думали"
 URL.109.d: "Система підготовки на Уралі викликала чимало критики в нашій адміністрації. Більшість солдатів безупинно муштрують упродовж дня, а вночі вони сплять щонайбільше шість годин. На кожен прийом їжі їм дають десять хвилин, вони мають лише один комплект одягу, що робить тренування ще виснажливішими, а якщо в них узагалі з'являється вільний час, то він минає за підготовкою до наступного дня муштри.\n\nПопри ці умови, ніхто не очікував того, що сталося вчора вранці. О 7:30 Сіянкін Ґєрасім Ґєорґій не з'явився на шикування, тож інструктор Савва Бєлов пішов його шукати. Минуло ще десять хвилин, і муштру урвав звук двох пострілів у казармі. Офіцери й солдати кинулися всередину та побачили мертвого інструктора й Сіянкіна, який приставив дуло рушниці до рота. На очах у понад п'ятдесяти свідків солдат натиснув на гачок.\n\nЦей випадок приголомшив країну, і сьогоднішні газети переповнені аналізом та критикою, але багато хто й далі захищає спартанські умови солдатів: на їхню думку, народ Уралу мусить іти на жертви, щоб захиститися від зовнішніх загроз. Проте є й незгодні, які стверджують, що вчорашнє повторюватиметься дедалі частіше, оскільки новобранці божеволіють від утоми та стресу, тоді як їхні офіцери живуть у значно кращих умовах. У тяжкі часи навіть різниця між свіжим хлібом і несмачним супом здатна довести людей до безумства від заздрости. Вони доводять, що безперервна муштра не має сенсу, якщо солдати згодом ігноруватимуть накази або, ще гірше, бунтуватимуть чи просто вбиватимуть себе. Хоч би яку позицію займали люди, це питання безперечно розкололо суспільство."
 URL.109.a: "Жахлива трагедія."

 URL.110.t: "Боягуз серед нас"
 URL.110.d: "Рада, яка нами керує, пишається тим, що її члени уособлюють найвищі чесноти Росії. Найчастіше серед них трапляються науковці з різних галузей або ветерани наших численних воєн. Вони заявляють, що протистоять терору й злу, які чатують навколо нас, своєю мужністю та розумом. З огляду на такі засади звістка про вигнання одного із членів Ради за боягузтво в бою стала справжнім потрясінням.\n\nУчора один чоловік приватно звернувся до кількох членів Ради й повідомив, що один із радників збрехав про свою попередню службу. Чоловік розповів, що вони зіткнулися з бандою налітників, які їздили на вантажівках із великими кулеметами. Коли ті відкрили вогонь, радник кинув зброю й побіг щодуху, тоді як решта відділення вступила в бій. Вони зазнали тяжких утрат, і чоловік затаїв на радника образу, хоча досі не знаходив у собі сміливости виступити. Офіцера негайно поставили перед військовим судом: розповідь солдата перевірили, заслухавши інших членів відділення, які брали участь у тій самій операції, і їхні однакові свідчення, кожне визнане точним та правдивим, вирішили справу.\n\nОфіцера позбавили звання та з ганьбою звільнили з Уральської гвардії. На додачу вирок передбачав конфіскацію всіх нечесно здобутих грошей і заслання. Чоловік, тепер уже цивільний, повернув форму й спорядження та покинув казарму лише з торбою, у якій були харчі й одяг, під зневажливими поглядами колишніх товаришів і глузування натовпу. Він мовчки вийшов із табору, і ворота зачинилися за ним. У Лізі вдосталь місця для вигнанців, біженців і проклятих, але немає місця боягузам."
 URL.110.a: "Нам не потрібні боягузи, нам потрібні провідники!"

 URL.111.t: "Скорбота за товаришем"
 URL.111.d: "Гвардієць Алєксєй був одним із найвідважніших і найзавзятіших бійців, яких знали його товариші по відділенню. Вони рівнялися на нього, а він натомість дбав про них: усі вони присягнули робити все можливе, щоб захищати одне одного, навіть ціною власного життя. Десятки разів вони дотримувалися свого слова, разом приймаючи рани й долаючи поневіряння. Алєксєй робив більше за всіх, але не вважав себе кращим: можливо, він був сильніший і влучніший, проте решта боролася з усіх сил, а цього було досить. Нарешті настав день, коли Алєксєй востаннє виконав свою присягу: виявивши найвищий героїзм, він кинувся до гранати, що залетіла в будинок, який вони обороняли, і накрив її собою, захистивши товаришів власним тілом.\n\nПохорон, як він і просив, був коротким і тихим: тіло покійного вдягнули у форму, до якої командир прикріпив посмертну медаль, а тоді товариші винесли труну й опустили її до могили. Поки один із солдатів почав засипати яму землею, священник читав Біблію й згадував про нього добрим словом. Потім уперед вийшов сержант відділення й розповів кілька кумедних історій: як Алєксєй намагався залицятися до байдужої жінки чи як упивався до нестями й реготав так голосно, що будив усю казарму. Дехто сміявся, та більшість плакала, не в змозі змиритися з думкою, що їхнього друга більше немає.\n\nНарешті на місці ями з'явився невеликий земляний горбок, і сержант зіграв короткий уривок з «Катюші», улюбленої пісні Алєксєя, а всі солдати підхопили хором. Потім вони розійшлися, хтось розмовляв із товаришами, а хтось мовчав. «Яка ж клята шкода», - пробурмотів собі під ніс сержант."
 URL.111.a: "Нам його бракуватиме."

 URL.112.t: "Пам'ять про Довгий марш"
 URL.112.d: "«Я глибоко зворушений тим, що всі ви вирішили приєднатися до мене цього вечора», - урочисто промовив Яніс Мендрікс до зібраного натовпу. Це було особливе зібрання: щороку, відповідно до свого колишнього сану священника, він правив месу в пам'ять про полеглих під час великого маршу на південь від ГУЛАГу до гір, де зрештою заснували Лігу. Мендрікс ненадовго замовк, дозволивши слухачам поаплодувати, а тоді заговорив знову.\n\n«Усі ми зазнали тяжких страждань. Ми пережили ув'язнення, примусову працю, люті зими, довгі переходи крізь пекельні умови та напади найгірших представників людства. Кожен із нас утратив когось дорогого не тому, що ці люди були слабкими чи негідними, а тому, що того дня доля від них відвернулася». Він прочитав список імен, починаючи з тих, хто загинув у таборах багато років тому, і закінчуючи вбитими лише кілька тижнів тому. Він подякував присутнім скорботним родичам, висловив їм співчуття й закликав натовп ставитися до них із милосердям.\n\n«Часом ми запитуємо себе, чи має взагалі сенс іти далі, коли світ сповнений такої жорстокости. Тим із вас, хто сумнівається, я скажу: озирніться навколо. Поруч стільки людей, яким ви дорогі й які вмить віддали б за вас життя. Усі наші поневіряння були недаремними, бо ми маємо одне одного. Бог випробовує нас не для того, щоб зламати, а щоб допомогти нам вирости й об'єднатися. Коли ви думаєте здатися, просто згадайте, скільком людям довелося пожертвувати всім, аби привести вас сюди, й намагайтеся наслідувати їх у ставленні до інших. А тепер я прошу всіх вас приєднатися до моєї молитви за тих, хто впав, і за нас - тих, заради захисту кого вони віддали життя»."
 URL.112.a: "Амінь."

 URL.113.t: "Те, що лишилося"
 URL.113.d: "Багато хто вдома попереджав їх про те, що вони побачать на півдні. Про те, що бригада Дірлеванґера зробила з багатьма селами. Ніхто в молодому розвідувальному відділенні по-справжньому не розумів цих попереджень, доки не побачив усе на власні очі.\n\nКоли вони натрапили на руїни Бузулука, неймовірний масштаб побаченого вразив їх до глибини душі. У зруйнованому місті стояв нестерпний запах диму й смерти. Напад стався нещодавно. Загублені душі безцільно блукали вулицями, одяг ледве тримався на них, а очі дивилися в порожнечу. Жінки й діти дивилися на розвідників із напівзруйнованих будинків, і в їхніх поглядах був лише біль.\n\nКазімір, один із молодших розвідників, похлинувся повітрям, побачивши те, що лежало на міській площі. Там гнила гора тіл: чоловіки, жінки й діти, молоді та старі обличчя. Бандити зняли з них одяг і забрали цінності, не спромігшись навіть поховати. Казімір став навколішки й узяв у долоню руку одного з них. Він щось пробурмотів, можливо, молитву, а можливо, вибачення. Потім підвівся. В очах стояли сльози, але вони не могли вічно оплакувати загиблих.\n\nДалі вони натрапили на купу дерева й цегли, з якої ще курився дим. У попелі лежав залізний дзвін - це була церква. Розгрібаючи руїни, один із розвідників раптом відсахнувся. Коли вони придивилися, під їхніми вкритими сажею чобітьми відкрився справжній жах: колишню підлогу церкви вкривали купи обвуглених до чорного кісток і черепів. Поволі вони зрозуміли, що сталося: бандити замкнули цих людей у церкві, а потім підпалили її.\n\nРазом розвідники нарешті усвідомили похмуру істину свого обов'язку. Їхня війна була не просто війною проти зграї буйних грабіжників і бандитів. Вони воювали проти самого обличчя зла, самої сутности людської жорстокости. Тепер вони зрозуміли своє справжнє призначення: принести цим душам справедливість, на яку ті заслужили."
 URL.113.a: "І з криками затягти орду Дірлеванґера до самого пекла."

 URL.114.t: "Питання людяности"
 URL.114.d: "«Я кажу, треба їх убити». Молодий уральський гвардієць сплюнув після цих слів, насолоджуючись помітним занепокоєнням полонених. «Це НКВДисти. У цих виродках не лишилося ані крихти душі. Я втратив на горі трьох друзів, знаєш?»\n\n«Стули пельку», - відповів його значно старший товариш. «Вони все одно люди, і ми зобов'язані перед ними та Богом так до них і ставитися. Чекісти знущалися з мене ще до твого народження. Якщо ми вб'ємо їх холоднокровно, то станемо ними».\n\n«Невже?» - сказав молодший. «Ти сказав би те саме про нациста? Про Дірлеванґера? Про Гітлєра? Як на мене, якщо перерізати горлянки цим катам, то лише зробимо всім послугу. Єдиний спосіб зупинити їх - зробити це надто кривавим, щоб воно було варте зусиль; насильство - єдина мова, яку вони розуміють».\n\nВідповідь змусила ветерана завмерти. Хоч він був лише зеленим новобранцем, та не помилявся. Усе ж старший чоловік відповів: «А хіба вони не сказали б те саме про нас, якби ми помінялися місцями? Хіба ми не були б просто бандитами, строкатим збіговиськом вигнанців і злочинців? Лише милосердя може розірвати це коло насильства. Ти молодий і майже не знаєш смерти. А я бачив убивств на десять життів». Тепер уже молодий чоловік завмер у роздумах. Він крутив ніж між пальцями, щиро не знаючи, як учинити. Його погляд звернувся до полонених, можливо, щоб побачити їх у новому світлі, аж раптом він скрикнув від гніву та розпачу."
 URL.114.a: "«Старий дурню! Вони втекли!»"

 URL.115.t: "Зброя, хліб і праця"
 URL.115.d: "Уральська Ліга існувала, щоб захищати своїх громадян і громади від численних навколишніх загроз. Багато хто зрозумів би, що для цього треба чимало воювати, але навряд чи усвідомлював би, скільки паперової роботи вимагає ця мета. А Васілій Зайцев точно усвідомлював.\n\nЩотижня надходили звіти з поселень, що входили до Ліги, і він помітив тривожну тенденцію. Багато громад були вкрай бідними, досі організованими за общинними звичаями царської доби, а безперервний потік біженців виснажував їхні ресурси до краю. Треба було щось робити.\n\nІ щось зроблять. Зайцев уже давно міркував над цим і дійшов висновку, що централізація є єдиною розумною відповіддю. Він попросить Мендрікса скористатися своєю популярністю та звернутися до громад, закликаючи їх поширити почуття уральської спільноти й на новоприбулих.\n\nВодночас він заохотить такі дії не лише доброю волею, надаючи субсидії поселенням, які на це погодяться. Запаси зерна також перерозподілять, щоб забезпечити достатньо харчів у перенапружених регіонах. Нарешті, частину ополчення Ліги переведуть із таборів до сіл і містечок, яких торкнулися інші його заходи, де вони одночасно виконуватимуть функції сил захисту й міської варти.\n\nХоч Зайцев і розумів, що його рішення спричинять проблеми й суперечки, він був переконаний: із часом усі збагнуть, що Ліга лише бере активну участь у їхньому захисті та подальшій безпеці."
 URL.115.a: "Разом вистоїмо. Порізно впадемо."

 URL.116.t: "Лицар без обладунків у дикому краю"
 URL.116.d: "Незнайомець в'їхав до міста верхи на витривалому степовому поні, одягнений у товсте зимове хутро й оточений чоловіками із суворими, худими обличчями. За плечем у нього висіла бездоганно доглянута гвинтівка Мосіна-Наґана, біля стегна щільно прилягав пістолет. Цей небезпечний чоловік, цей чорний вершник був відомий їм із новітнього фольклору, породженого пустками.\n\nЙого звали Ілья Старінов, і слава йшла поперед нього. Це був чоловік, який застрелив сумнозвісного бандита Анатолія Слівка, який дав відсіч Арійському Братству в Перестрілці під Салаватом, який приводив строкаті загони ополченців до неймовірних перемог над сильнішими ворогами. Натовп дивився й перешіптувався, приголомшений його присутністю та тим, що могла означати його несподівана поява. Сам Старінов не звертав на людей уваги, не відводячи очей від маленької церкви в центрі міста.\n\nПеред церквою, однією з небагатьох католицьких церков у цій частині світу, стояв Яніс Мендрікс. Старого священника супроводжували двоє уральських гвардійців, які насторожено стежили за стрільцем і його свитою. Старінов зустрівся поглядом із латвійським папістом, і вони ледь усміхнулися одне одному.\n\nСтарінов зліз із поні, його чоботи глухо вдарилися об свіжий сніг і здійняли білу хмарку. «То це і є знаменитий Яніс Мендрікс та його Діти Воркути? Як на мене, старий і купка нервових сільських хлопчаків», - сказав Старінов, тицьнувши в Мендрікса пальцем у рукавичці.\n\n«Ілья Старінов, якщо не помиляюся? Я здогадався за запахом старої шкіри й дешевої горілки, який потягнувся до міста, щойно ти перетнув кордон». Погляд Мендрікса був сталевим, губи стиснуті в сувору лінію. Охоронці обох сторін нервово тримали пальці на зброї, а містяни почали розходитися з вулиці.\n\nНапруга розвіялася, коли Старінов усміхнувся: «Янісе, сучий ти сину, як поживаєш?» Мендрікс засміявся, гвардійці розслабилися, а двоє старих воїнів по-товариському потиснули руки.\n\n«Я чув, у тебе є плани перетворити моє маленьке ополчення на справжню бойову силу, Ільє», - сказав Мендрікс, і старий стрілець вишкірився у відповідь.\n\n«Не просто на справжню бойову силу, Янісе, а на найкращих клятих солдатів у всій Росії»."
 URL.116.a: "Срібний шаховий кінь - його знак довіри."

 URL.117.t: "Рятувальна бригада гвардії"
 URL.117.d: "Для багатьох мешканців села лавина зійшла без попередження й видимої причини. Сніг із гуркотом ринув із гори, накриваючи будинки, вулиці й, на загальний жах, людей, доки лавина нарешті не втратила силу. Зрештою в селі було зруйновано майже всі будівлі, а близько половини населення загинуло чи дістало поранення.\n\nЧерез пів дня прибули шестеро озброєних гвинтівками чоловіків на вантажівках. Вони почули гуркіт і вирушили з'ясувати, що сталося. Побачивши трагедію, чоловіки покинули машини й почали довго та виснажливо розчищати сніг, каміння та уламки довкола села, ставити тимчасові намети для тих, хто втратив домівку, відкопувати засипаних людей і надавати медичну допомогу всім, хто її потребував. Вони навіть облаштували сільське кладовище, поховавши тридцятьох загиблих після впізнання.\n\nВони лишалися там дев'ять днів, і хоч не могли усунути заподіяну шкоду чи скасувати пережитий жах, проте допомогли громаді знову стати на ноги.\n\nДля більшости це лишилося б добрим, але зрештою забутим епізодом в уральській історії. Так би й сталося, якби Васілій Зайцев не дізнався про нього після повернення гвардійців додому, коли ті пояснювали причини своєї затримки. Тоді Зайцев запропонував Мендріксу розвинути цю ідею, і після певних вагань той схвалив задум Зайцева: Рятувальну бригаду гвардії, присвячену допомозі громадянам Південного Уралу під час катастроф і надзвичайних ситуацій."
 URL.117.a: "Захищати тих, хто не здатен захистити себе."

 URL.118.t: "Лісовик"
 URL.118.d: "Біжучи, Отто зачепив чоботом камінь і полетів на землю, зламавши зуб. Притиснувши чорний рукав до рота, щоб зупинити кров із ікла, есесівець, похитуючись, підвівся на ноги. «Куди, до біса, подівся Герман...» - пробурмотів він, а страх у його голосі погано приховувала звична для СС удавана бравада. Вони зі своїм загоном вирушили в порівняно простий рейд за рабами, аж раптом Ганс наступив на... щось, і його різко смикнуло за шию на дерево з огидним хрускотом. Коли в патрулі здійнявся хаос і полетіли кулі, Отто майже нічого не бачив, бо разом із трьома іншими людьми втік із місця події, мов перелякана миша. Звісно, на час виходу з перевалу лишилися тільки він, Герман і найстарший боєць загону Альбрехт. Четвертий, Ґюнтер, зник у кущах, ніби самі гілки схопили його й потягли в небуття під час їхньої божевільної втечі невідомо куди. Сховавшись біля дерева, Альбрехт запропонував товаришам дуже моторошне, хоч і неправдоподібне пояснення: лісовик, давній слов'янський лісовий дух, підступний і мстивий.\n\nСаме тоді все стало ще гірше. Ніби сама Росія розгнівалася, страшний скрип провістив, що ліс оживає. Альбрехт раптово впав і з дівочим криком полетів назад із такою швидкістю, що на мить немов зник, перш ніж його поглинула зяюча яма в землі. Отто й Герман не стали ризикувати та кинулися навтьоки в різні боки. Тепер Отто обережно скрадався незнайомою стежкою, стікаючи кров'ю з рота.\n\nСерце знову завмерло, коли щось хруснуло під його ногою. Подивившись униз, він побачив лише гілочку. Та знову підвівши погляд, Отто зустрівся очима з Германом: той, виродок, висів догори ногами на дереві з розпоротим животом і роззявленим ротом. Отто почув, як хтось щось пробурмотів російською, і встиг розвернутися саме вчасно, щоб отримати кулю в груди.\n\nУральський гвардієць відкинув каптур маскувального костюма й захихотів."
 URL.118.a: "«Лише я. Хоч мені лестить, що ти прийняв мене за лісовика»."

 ############################################
 URL.200.t: "Мир на сході"
 URL.200.d: "Ми довго й запекло билися за цю мить тріюмфу. Роками ворог на сході вислизав від нас. Тирани, що так нагадують минуле, з якого ми вийшли, вбивали наших чоловіків, ґвалтували наших жінок і забирали наших дітей для своїх проклятих цілей. Вони були пошестю не лише для нашої держави, а й для самого людства: уявіть світ, де мільйони невинних приносять у жертву на вівтарі збочення, яке Лисенко називав «наукою», світ, де повітря сповнене диму, крови й криків. Та попри все, що вони кинули проти нас, ми вистояли. Ми перемогли їх у їхній же жорстокій грі, але не стали такими, як вони: на відміну від тих дияволів, МИ досі люди. У темних і стерильних коридорах Чорної Гори наші товариші вмирали заради миру, заради обіцянки чогось кращого, і ми знову й знову виконували цю обіцянку: сьогодні ми перемогли! Події нашого минулого загартували нас, і боротьба проти Лисенка не стала винятком.\n\nВона стане частиною нас і наступних поколінь у цьому циклі, що є найвищою боротьбою за виживання. На Урал повернувся порядок: наші люди більше не житимуть у страху, не барикадуватимуться у своїх селах, боячись ночи й чудовиськ, які приходять разом із нею, бо ці створіння нарешті мертві. Тепер вони лежать нерухомі й закляклі, надійно поховані в могилах глибоко під землею, повернуті в темряву, що їх породила й утримуватиме повіки."
 URL.200.a: "Помолімося, щоб вони ніколи не повернулися."

 URL.201.t: "Мир із таємною поліцією"
 URL.201.d: "Таємна поліція, що повалила Лисенка та його зграю технократів, навряд чи була кращою за його прогнилий розум. Вони знищили одвічну віру Уралу, і хоча їхні популістські заяви зворушили людей, це було облудне зворушення. Потім вони продовжили справу Лисенка: тероризували робітників, якими так «дорожили», вривалися до їхніх домівок, забирали їхніх дітей і творили новий культ особи, тож урешті ніщо не відрізнялося від старих часів божевільного правління Лисенка.\n\nНарешті ми здобули перемогу. Перемогу над так званими «шляхетними наступниками» божевільного, які й самі збожеволіли. Перемогу над тією самою брехнею і тим самим популізмом, що штовхнули давніх правителів цієї землі, старий Союз, до занепаду й загибелі.\n\nПопри всі їхні зусилля, наш народ удруге не повірив старій брехні. Брехні Бухаріна, Лєніна, Лисенка й Бункова. Останнім натиском наші війська взяли штурмом Маґнітоґорск, пробиваючись через плавильні цехи й бюрократичні установи. Бої були важкими, але червоні прапори спалено, а статуї старих і нових тиранів повалено. Сьогодні комунізм на Уралі помер раз і назавжди й ніколи не повернеться."
 URL.201.a: "Геть Бункова!"

 URL.202.t: "Мир із нацистськими бандитами"
 URL.202.d: "Ще кілька років тому Дірлеванґер і його строкате зборисько сяк-так організованих варварів були лише прикрою, хоч і тривожною, завадою. Ми гадали, що вони прийдуть і підуть, як усі бандити до них, але ми помилялися. Ми мали б знати, що всі есесівці, навіть зрадники серед них, смертоносніші за найотруйнішу змію. Наче гниле м'ясо приваблює паразитів і мух, божевільний німецький перебіжчик зібрав довкола себе сотні таких самих чоловіків, заманених обіцянкою здобичи й різанини, нескінченного кошмару насильства та крови. Його маленька група розросталася, рейди перетворилися на повномасштабні наступи на наші села, потім міста, а зрештою - на саме серце нашої держави, нашого народу.\n\nОднак саме їхня жадібність і стала їхньою могилою. Божевільне прагнення Дірлеванґера грабувати й ґвалтувати все, що він бачить, зрештою його згубило, адже він правив зграєю пияків і наркоманів та покладався на них, наче вони були компетентними. Можливо, це був розпач, а можливо, він так глибоко загруз у власному безумстві, що справді вірив у їхню сумлінну службу.\n\nІз захопленням Орска, «столиці» та єдиного справжнього поселення в нікчемних володіннях есесівського перебіжчика, а також підтвердженою смертю самого Дірлеванґера, його пануванню терору нарешті настав кінець! Місто очищено від усіх слідів його божевільного правління - від свастик до шибениць із тілами тих, хто мав досить відваги, але не досить розуму, щоб протистояти дияволові голіруч. Коли цивільні побачили, як наші солдати входять до міста й роззброюють їхніх поневолювачів, вони заповнили вулиці, вітаючи наших бійців, хоча надходило чимало повідомлень, що колишніх бандитів лінчували й роздирали на шматки ті, кого вони гнобили ще напередодні. Дірлеванґер більше не наповнюватиме наші кошмари й не загрожуватиме землям, які такі дорогі нашим серцям!"
 URL.202.a: "Нарешті до цих змучених земель повернулася хоч якась подоба розсудливости."

 URL.1000.t: "Ні кроку назад!"
 URL.1000.d: "Белорєцк нині спорожнів. Гвардійці, які становили більшість його населення, перейшли до інших, напруженіших справ. Хоч як горді очільники міста відмовляються це визнавати, повертається їх менше, ніж їм хотілося б зізнатися. Набагато, набагато менше. Багато хто гине на пагорбах, які вже повсюдно називають М'ясорубками, у боях проти ворога, чиї лави рідшають далеко не так швидко, як хотілося б Лізі.\n\nЄ в цих залитих кров'ю пагорбів й інша назва, набагато популярніша: Помилки. І хто дорікне людям за те, що вона прижилася?\n\nУ тихому розпачі керівники зустрілися у відкритій усім вітрам безіменній частині міста - головний комплекс уже обступили численні демонстрації нечисленних мешканців, які ще залишалися, - й обговорили плани. Вони раз по раз поверталися до звичних заходів: подальшої мобілізації резервів, застосування сучасної зброї, залучення полків, які ще проходять базову підготовку. Як усі й очікували, кожен із них рішуче відкинули. Зрештою, ці рішення не мають самостійної мети. Ні, їхнє єдине призначення - методом спроб і помилок підвести неохочу раду до одного тривожного висновку.\n\nЯк завжди, Мендрікс виходить із глухого кута: за повідомленнями, він огризнувся на своїх радників, наказавши їм «не марнувати його час і життя солдатів», а тоді схвалив офіційне звернення до Орєнбурґа. Ліга готується посісти становище, яке ненавидить найбільше, - становище прохача. Орєнбурґ мусить їх урятувати. А хто ще?"
 URL.1000.a: "У нас немає вибору. Надішліть прохання."
 URL.1000.b: "Ми стоятимемо самі."

 URL.1001.t: "Благання про допомогу"
 URL.1001.d: "Кілька хвилин тому до Орєнбурґа надійшло термінове повідомлення з Уралу. У ньому міститься невідкладне прохання, відчайдушне благання про допомогу в боротьбі проти жорстокости Чорних бандитів і безумства Лисенка. Ліга опинилася у стані відкритої війни зі своїми ворогами й закликала Орєнбурґ приєднатися до неї. Рада розділилася в цьому питанні: з одного боку, допомога Лізі може спонукати її ворогів напасти на наші землі, але з другого, якщо Ліга впаде, немає жодного сумніву, що ми станемо наступною жертвою її ворогів."
 URL.1001.a: "У нас немає вибору: ми стоятимемо разом із Лігою або впадемо наодинці."
 URL.1001.b: "Ми не можемо дозволити собі розгнівати їхніх ворогів."

 URL.1010.t: "Останній бій"
 URL.1010.d: "Густий брудний дим здіймався вгору, заповнюючи небо, з якого все живе вже втекло якнайдалі. Однак не всі виявилися настільки розсудливими. Село сповнювали гавкіт наказів і нестримний гамір, поки нажахані селяни хапали свої нечисленні пожитки й безладно вибігали на дорогу в надії зрештою дістатися безпечного місця. Жінки й діти несли дорогоцінні реліквії, речі неоціненного значення, що їхні родини берегли десятиліттями чи навіть століттями.\n\nКоли ті, кому бракувало сили чи відваги битися, евакуювалися, решта селян вигукували й отримували накази, перекидали одне одному рушниці та оглядали зброю, якою незабаром мали скористатися. Чимало одиниць вогнепальної зброї були у справді жалюгідному стані: ними не користувалися з часів Великої Вітчизняної війни й тримали лише як трофеї та сумні нагадування про давно втрачені часи. Та все ж зброя є зброя, і ніхто з присутніх не відчував потреби нарікати. Вони вправно заряджали її, але багато хто з тривогою поглядав на свій мізерний боєзапас. Запаси й без того були малі, а їм іще треба було зберегти по одній кулі на найгірший випадок.\n\nНерегулярні бійці похмуро зайняли позиції. У глибині душі всі знали, що не доживуть до наступного дня. Якщо не станеться божественного втручання, це був їхній останній бій. Вони не могли врятувати себе, але ще могли виграти час для своїх родин та інших біженців. Шляхетна жертва стала б гідним завершальним розділом зусиль Уральської Ліги очистити світ від зла. Навіть повільна смерть була прийнятною, якщо це означало, що вони зможуть ще раз прицілитися й знову натиснути на гачок.\n\nУдалині почувся ледь помітний гул моторів. Нашвидкуруч зібрані ополченці всі як один замовкли. Чути було лише важкі машини й самотню журливу пісню єдиної пташки, яка лишилася насолодитися прийдешнім видовищем. Чоловіки припали до прицілів і приготувалися дати свій останній бій."
 URL.1010.a: "Переміг достойніший."

 URL.1011.t: "Наш тріюмф"
 URL.1011.d: "Жевріючий попіл і жарини кружляли в густому смогові, що огорнув безмовне село. Ще не минуло й години відтоді, як тут вирувала моторошна різанина: залишки Уральської гвардії віддали життя, прикриваючи втечу своїх рідних. У запеклому бою загарбники зазнали жахливих втрат, адже щоразу, коли їм удавалося прорвати оборону, гвардійці лише тактично відступали далі вглиб села. Кожен будинок перетворили на фортецю, а кілька ключових місць замінували так, щоб вони вибухнули під нападниками щойно їх покинуть оборонці. Крім того, усі будівлі, які доводилося залишити, підпалювали, і це затягнуло облогу до пізньої ночи. Лише коли чисельність гвардійців скоротилася до крихітної частки від початкової кількости оборонців, загарбники змогли взяти штурмом останній оборонний рубіж, облаштований у самому центрі села. Розправа була лютою та сповненою ненависти, але багато останніх гвардійців воліли накласти на себе руки, аніж потрапити до рук ворогів. Оборонці не лише змогли виграти несподівано багато часу, а й своєю тактикою випаленої землі позбавили нападників будь-яких можливостей знайти укриття. Тепер від їхньої героїчної жертви не залишилося нічого: барикади знесли, усі вцілілі будівлі зрівняли із землею, а тіла спалили разом із рештою розграбованого села."
 URL.1011.a: "Разом рушаємо."

 URL.2500.t: "Остання, найкраща надія"
 URL.2500.d: "Останній бій.\n\nВовк уже під дверима. Орєнбурґ палає, а з ним - і останній бастіон надії в цьому дедалі темнішому світі. Тікати більше нікуди, ніде шукати прихистку, немає спасіння для проклятих душ.\n\nПринаймні так гадали біженці з Орєнбурґа.\n\nУ найскрутнішу годину Уральська Ліга розкрила обійми відчайдушним чоловікам, жінкам і дітям, які заповнили дороги до уральських фортець. Без запитань, без вагань і не просячи нічого навзаєм Ліга взяла їх під своє крило - наче собор, що приймає всіх, вірних і невірних, коли ціле місто руйнується.\n\nМи наступні, і ми це знаємо. Не буде відступу, не буде капітуляції, а понад усе - не буде пощади. Барабани війни відлунюють у горах, і Ліга відповість!\n\nГромадяни Ліги й біженці з Орєнбурґа пліч-о-пліч готуються до останньої битви з Бригадою, укріплюючи оборону: вони копають траншеї на пагорбах і запасають боєприпаси, у хвилини спочинку пошепки моляться й утішають одне одного тепер, коли загибель близько.\n\nГвардійці! Товариші! Брати! Як і колись багато років тому, ми знову стоїмо пліч-о-пліч, об'єднані обов'язком не дозволити нацистам та їхнім божевільним послідовникам забрати нашу Батьківщину! Дзвін б'є, брама відчинена! Орди Пекла вже тут, але ми переможемо! Чоловіки й жінки, молоді й старі - усі ми б'ємося за спасіння! Наші дружини, наші діти, наші близькі - позаду нас! Ми захищатимемо найдорожче до останнього подиху!"
 URL.2500.a: "Солдати Уральської гвардії, тримайте позиції!"

