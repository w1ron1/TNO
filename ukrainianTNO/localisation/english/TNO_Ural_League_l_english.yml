 URL_refugee_crisis_desc: "Біженці зі сходу й півдня заполоняють гори, долаючи високі перевали, щоб знайти прихисток у Лізі або шлях до втечі в Комуни на заході. Перевали забиті людьми, а гвардійці щосили намагаються вивести якомога більше з них у безпеку."
