 ### Leader Descriptions ###
 POLITICS_JANIS_MENDRIKS_DESC: "Яніс Мендрікс був латвійським священником, якого багато років тому Совєцький Союз відправив до ГУЛАГу у Воркуті за його проповіді. Після розпаду СССР у Воркутлазі спалахнули заворушення, які, найпевніше, скінчилися б кривавою різаниною, якби не втручання священника. Охоронці, що співчували в'язням, об'єдналися з ними. Наслідком цього союзу стало зародження Уральської Ліги.\n\nКоли суворість Воркути стала нестерпною, Мендрікс переконав своїх людей, що похід на південь стане їхнім спасінням. Вихід зажадав своєї ціни: дорогою загинули сотні колишніх в'язнів і охоронців. Здавалося, отець Мендрікс ніколи не втрачав віри й щодня перед початком переходу виголошував промову, що гуртувала людей. У ті темні дні його слова були єдиним світлом для багатьох із них. Можливо, саме віра зрештою й провела їх крізь усі випробування, аж поки вони оселилися на Південному Уралі. У цьому відрізаному від світу краї старий священник знову звернувся до ораторського мистецтва, що служило йому ще в Латвії. Хоч він був католиком на чолі пастви, що складалася переважно з православних, відмінності між конфесіями, здавалося, мало їх турбували: його слова згуртували людей, допомогли їм вистояти й збудувати нове життя.\n\nВідтоді саме ця харизма й рішучість спрямовують Уральську Лігу. Примирливий підхід Мендрікса до керівництва добре йому послужив: майже всі командири Ліги звертаються до нього по настанову й розраду в разі потреби. Рішучість рідко зраджувала його, і навіть у найпохмуріші часи він залишався людиною слова. Яніс Мендрікс, безперечно, є людиною Божою, але в ці тяжкі часи він довів усім, що є своїм і для простого солдата."

