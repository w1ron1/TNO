 URL_children_of_vorkuta: "Діти Воркути"
 URL_children_of_vorkuta_desc: "Усі ми - вцілілі. Чи то у Воркутлазі, чи під час довгого маршу на південь, чи виконуючи місію із захисту безпорадних, кожен із нас знайшов у серці сталь і виявився гідним випробування. Уральська гвардія непохитна, і ми постанемо проти кожного, хто насмілиться тероризувати слабких."
