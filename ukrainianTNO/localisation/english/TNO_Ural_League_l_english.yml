 URL_counter_raids: "Контррейди"
 URL_counter_raids_desc: "На жаль, набіги стали частиною повсякденного життя в Росії, і хоч нам прикро це визнавати, вони є одним із небагатьох засобів нашого виживання. Тому ми мусимо бути готові організовувати рейди на сусідні території, щоб здобувати їжу, спорядження та ресурси.\n\nНаразі ми маємо £loot_icon  [?loot_amount|Y0] здобичі."
 URL_militia_system: "Система ополчення"
 URL_militia_system_desc: "Як і в більшості держав воєначальників, сильне ополчення має вирішальне значення для оборони країни та її народу. Але, на відміну від більшости таких держав, наше ополчення не має собі рівних і мусить таким залишатися. Ми повинні й надалі стежити, щоб у нас було достатньо новобранців, на яких можна покластися, і щоб вони були готові протистояти будь-якому загарбникові."
 URL_upgrade_militias: "Підготовка ополчення"
 URL_guard_system: "Уральська гвардія"
 URL_guard_system_desc: "Від Казахстану до Карського моря всі знають, що найкращих воїнів цих гір можна знайти тут, у Лізі. І наша гвардія мусить перевершити навіть цю славу. Її зброя має бути найкращою з усього, що ми спроможні дістати. Частину сил треба завжди тримати напоготові. Адже це наші найкращі солдати, а отже, найбільша запорука нашої безпеки."
 URL_upgrade_guards: "Вдосконалити гвардію"
 URL_orenburg_system: "Уральсько-орєнбурзькі відносини"
 URL_orenburg_system_desc: "Наш союз з Орєнбурґом має вирішальне значення для оборони від східної загрози. Він потребує співпраці в обороні та надзвичайно міцних відносин. Ми мусимо подбати, щоб наші шляхи не розійшлися й ніщо не стало між нами."
 URL_send_instructors_to_orenburg: "Надіслати інструкторів до Орєнбурґа"
 URL_send_weapons_to_orenburg: "Надіслати зброю до Орєнбурґа"
 URL_send_artisans_to_orenburg: "Надіслати ремісників до Орєнбурґа"
 URL_initiation_system: "Кандидати до гвардії"
 URL_initiation_system_desc: "Лють Уральської гвардії та наші сумнозвісні суворі стандарти перетворили нас на легенду, відому далеко за межами підконтрольної нам території. Наша слава приваблює багатьох охочих самостійно вступити до гвардії. Разом із нещодавніми потоками біженців уздовж Уралу це забезпечує нам постійний приплив нових кандидатів, які сподіваються пройти суворі випробування й стати повноправними гвардійцями. Нових гвардійців приймають кожні 50 днів. Наразі очікувана кількість кандидатів, які пройдуть фінальні випробування, становить §G[?Ural_initiates]§!, а за максимальної завантажености наші навчальні заклади можуть прийняти §Y[?Ural_initiates_cap]§!. Цю кількість можна збільшити, дещо знизивши стандарти або зарезервувавши більше спорядження для підготовки кандидатів. Однак деякі гвардійці сумніваються в компетентності таких новобранців і стверджують, що витрачені на їхню підготовку ресурси краще віддати навченим солдатам."
 URL_Guards_initiation: "Нових гвардійців прийнято"
 URL_Guards_initiation_desc: "Нових гвардійців приймають до наших лав кожні 50 днів."
 URL_lower_standards: "Знизити стандарти підготовки"
 URL_lower_standards_desc: "Знизивши стандарти, ми забезпечимо проходження фінальних випробувань більшою кількістю кандидатів."
 URL_lobby_for_leniency: "Домагатися поблажливости"
 URL_lobby_for_leniency_desc: "Домагаючись більшої поблажливости від інструкторів нових кандидатів, ми забезпечимо проходження фінальних випробувань більшою їх кількістю."
 URL_lobby_for_leniency_improved: "Домагатися поблажливости"
 URL_lobby_for_leniency_improved_desc: "Домагаючись більшої поблажливости від інструкторів нових кандидатів, ми забезпечимо проходження фінальних випробувань більшою їх кількістю."
 URL_reserve_guns_for_training: "Зарезервувати зброю для підготовки"
 URL_reserve_guns_for_training_desc: "Додаткове спорядження в руках наших кандидатів, безперечно, збільшить їхні шанси пройти випробування."
 URL_raise_standards: "Підвищити стандарти підготовки"
 URL_raise_standards_desc: "Підвищивши очікувані від кандидатів стандарти підготовки, ми забезпечимо проходження фінальних випробувань лише найкращими з найкращих."
 URL_commandeer_training_weapons: "Реквізувати навчальне спорядження"
 URL_commandeer_training_weapons_desc: "Спорядження, яким кандидати користуються під час підготовки, завжди можна застосувати краще в руках наших солдатів, хоча кандидатам, безумовно, буде складніше пройти випробування."
