 URL_preapare_NKVD_1: "Кордон укріплено"
 URL_preapare_NKVD_2: "Зібрано більше зброї"
 URL_starinov_available_tt: "Ми НЕ вирішили створити ополчення.\n"
 URL_militias_available_tt: "Ми НЕ обрали пропозицію Старінова.\n"
 URL_increase_cap: "Розширення програми ополчення дозволить нам прийняти щонайбільше на §G200§! кандидатів більше.\n"
 URL_improve_exploit: "Цей фокус дозволить нам ефективніше використовувати наших кандидатів.\n"
 URL_raise_initates: "Це §Gзбільшить§! кількість кандидатів, які пройдуть випробування.\n"
 URL_lower_initates: "Це §Rзменшить§! кількість кандидатів, які пройдуть випробування.\n"
 URL_alone_in_the_cold_tt: "Ми оцінимо наше становище та підготуємо оборону міст до майбутнього конфлікту.\n"
 URL_watching_the_border_tt: "Ми розслідуємо погіршення ситуації на східному кордоні. Поки ми готуватимемо дієвіші способи боротьби з НКВД, вони дедалі більше обурюватимуться нашими несподіваними діями.\n"
 URL_identifying_our_threats_tt: "Ми докладніше дослідимо хаос на півдні. Поки ми готуватимемо дієвіші способи боротьби з цими бандитами, вони дедалі більше обурюватимуться нашими несподіваними діями.\n"
 URL_the_refugees_tt: "Криза біженців лише поглиблюється. Ми докладніше її дослідимо й підготуємося до найгіршого. Розслідування, найімовірніше, дасть нам трохи людських ресурсів серед тих, кого ми визнаємо придатними, а також дозволить розпочати розселення, щоб іще збільшити наші людські ресурси... певною ціною.\n"
 URL_eyes_on_the_south_tt: "Ми мусимо не втрачати пильности й далі уважно стежити за будь-яким рухом. Ми не можемо відпочити ані миті, адже Дірлеванґер та його люди щодня ґвалтують і грабують, не втамовуючи своєї спраги. Зрештою вони поглянуть на північ і вдарять по нас. Треба належно підготуватися.\n"

