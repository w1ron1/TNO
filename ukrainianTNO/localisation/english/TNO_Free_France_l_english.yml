  #FFR_case_belgian_citizenship:0 "Бельгійське питання"
  #FFR_case_belgian_citizenship_desc:0 "Лінія Комети привела до Вільної Франції не лише французьких резистентів, але й бельгійців. Бельгійський рух опору був великою допомогою в боротьбі Франції, і після закінчення війни де Голль запропонував бельгійцям приїхати до Вільної Франції до звільнення Бельгії, пообіцявши визволити Бельгію відразу після звільнення Франції. Після понад 15 років в екзилі політичний статус бельгійців досі не визначений, і бельгійці наполягають на тому, щоб уряд Вільної Франції знайшов рішення."

