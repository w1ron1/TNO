france_reclamation.proxy.USA.1.t: "Мрія Здійснилася"
france_reclamation.proxy.USA.1.desc: "Не було можливості побачити сонце, що виглядає з-за горизонту — його приховували ряди й ряди сталевих кораблів. Кожен корабель гордо розвівав вільний французький триколор — сигнал для колабораціоністів та нацистів, що правління Віші більше не існує. Кораблі мали такі назви, як Рамільї, Бонапарт чи Голль — і на них служило більше людей, ніж хто міг порахувати.\n\nБезліч думок виникали в головах безлічі чоловіків; безліч емоцій, безліч облич, безліч страхів. Усмішка Іва різко контрастувала з рішучим виразом обличчя Мухаммеда — але обидва чоловіки дивились на горизонт, на узбережжя, на свою батьківщину.\n\nФранція.\n\nВона кликала їх, як крик матері, яка кличе додому. Вона співала їм, як древня музика, яку вони не могли не чути. Вона наказувала їм, як генерал, перед яким вони не могли не підкорятися. Вони виконували наказ Франції; вони йшли додому. Безліч Наполеонів повертаються зі свого спільного Ельби.\n\nНе кожен корабель прямував до точно того ж місця, звісно; деякі мали сісти на «Епее», «Ор» чи «Джюно». Але кожен із них грав важливу роль у майбутній запеклій битві: Відновленні Франції, раз і назавжди.\n\nЯк тільки кораблі та десантні катери наближались до узбережжя, як тільки літаки скидали парашутованих солдатів, як тільки вогонь з гармат розривав узбережжя, решта Франції затамувала подих. Так багато чоловіків, так багато жінок, так багато дітей думали, що цей день ніколи не прийде, як би сильно вони не бажали, щоб він настав. Так багато були впевнені, що він прийде, як би сильно вони не сподівались, щоб цього не сталося. Безліч телевізорів випльовували свою гидоту, свою пропаганду, не звертаючи уваги; безліч чоловіків і жінок, ті, хто чекав у тіні, повернулися на світло з гвинтівками в руках."
france_reclamation.proxy.USA.1.a: "Реконкіста почалась!"

france_reclamation.proxy.USA.2.t: "Ось ми знову, Лафайєт"
france_reclamation.proxy.USA.2.desc: "Великі новини доходять до нас сьогодні з іншого боку Атлантики, адже Французький Опір, який довго героїчно боровся проти нацистської загрози ще з часів перемир'я, піднявся масами по містах і сільських районах залишкової Французької Держави.\n\nПрослідковуючи наші зв'язки взаємної допомоги та братерства ще з 1778 року, ми, як носії свободи, маємо обов'язок підтримати сили Вільної Франції, оскільки вони борються за скидання фашистської гідри, яка домінувала в їхній батьківщині протягом майже 4 десятиліть, з іншого боку Сени.\n\nВже делегати з усіх секторів вільного світу надіслали листи визнання; вантажі були завантажені передовим військовим обладнанням; і наші найбільші голоси висловлюють співчуття справі Вільної Франції, закликаючи всіх, хто цінує свободу, підтримати їхню благородну справу.\n\nМи складаємо урочисту обіцянку не припиняти операцій і не дозволяти втомі нас подолати, оскільки ми боремося пліч-о-пліч з нашими французькими товаришами проти сил тиранії та несправедливості."
france_reclamation.proxy.USA.2.a: "І свобода знову матиме свою країну."

france_reclamation.proxy.USA.9998.t: "Останній похід"
france_reclamation.proxy.USA.9998.desc: "Руки Моріса були зв'язані металевими кайданами, але він був не єдиним. З ним було ще з десяток чоловіків, кожен з яких мав зв'язані руки, деякі металевими кайданами, деякі мотузками.\n\nРеволюція була драматичною поразкою. Франція залишалася в кайданах у несправедливого поневолювача, і Моріс не міг нічого з цим зробити. Його люди були серед перших, хто захопив місто, і деякі з них воювали ще з часів Другої світової війни, як і Моріс. Майже 30 років, і він був змушений боротися в підпіллі більшу частину цього часу після встановлення Віші. Деякі з цих солдатів були з ним протягом усіх цих років, як Паскаль, який був виноградарем перед тим, як приєднатися до армії. Потім був Жан, молодий чоловік, який народився в Нісі менше ніж 20 років тому, завжди мріючи служити своїй країні і виконати мрію свого батька; почати родину знову в Бордо. Потім був Філіп, старіючий ремісник, який нещодавно втік на північ, сподіваючись допомогти у визволенні, коли прийде час. На жаль, чотири зрадники вели членів опору до їхньої неминучої загибелі. Хода здавалася Морісу відчайдушною, ніби його тягли назад з кожним кроком. Мало що можна було зробити в такій ситуації. Моріс думав, що вже відчував безнадійність раніше, на останніх днях офіційної війни, і, можливо, він дійсно її відчував, але тоді він міг боротися. Зараз такої можливості не було. Протягом усього цього часу Моріс жив для своєї країни і кожного ранку співав її пісні своєму синові. І так, він вже любив свою країну.\n\nВсе почалося з мурмотіння, хоча б на кілька речень, перш ніж всі в лінії зрозуміли, що він співає «Марсельєзу». Після хвилинної паузи Паскаль приєднався. Їхнє співи було перервано черговою чергою вогню з кулемета, що пронизала Моріса по діагоналі. Падаючи на землю, решта чоловіків застигла, навіть самі охоронці. Жан був першим, хто знову почав співати, потім Філіп, потім решта приєдналися. Знову кулеметний вогонь заглушив їхні голоси. Коли Жан падав на спину Моріса, відчуваючи його останні подихи, він прошепотів свої останні слова до Моріса."
france_reclamation.proxy.USA.9998.a: "Батьку... Пробач."

france_reclamation.proxy.USA.9999.t: "Одна ніч у Бордо"
france_reclamation.proxy.USA.9999.desc: "Для Кріса Грішема можливість служити своїй нації була захоплюючою ідеєю — зробити це, відвідавши Францію в той час, коли вона розривається на частини, було ще більш привабливою концепцією, принаймні для нього. Спостерігати за нацією, як Франція — колишній член Пакту, — переживає свої старі гріхи таким чином було надзвичайно цікаво. Слідкувати за тим, як французький спротив перетворюється з революційної непомітної сили на потужну силу, здатну захопити європейську державу, було захоплюючим видовищем, не менш цікавим через унікальність того, що відбувалося перед ним зараз.\n\nЦе було видовище; вулиця в Бордо буквально горіла полум'ям, і вогнища простягалися по авеню. Це було дивно, тому що він знав, що саме це більшість його друзів і родини вбивали б, щоб побачити — буквально, для деяких з них. Ці вогні не були без нагляду, скоріше навпаки. Вони були оточені натовпами, які скидають лише червоне; Кріс побачив численні свастики і навіть кілька копій "Майн Кампф", що лежали у вогні, хоча більшість з них були прапорами старого режиму. Але це було не все, що побачив Грішем. Він також розрізнив іншу іконографію, хоча вона була практично грецькою для нього — ймовірно, деякі обскурні ідеологічні ніші. Але все це було таким дивним для нього, наче французи самі пішли і абсолювали себе від усього цього, і здавалося, що вони добре розуміють це, якщо веселощі та сміх були хоч чимось, що можна було помітити. Зазвичай він б вийшов і запитав би у натовпу коментарі, але це була не така ніч; усе місто було в стані святкування, немов анархічний фестиваль, з підпалом і публічними страченнями на кожному кроці. Стоячи на балконі, спостерігаючи за всім цим, він почав відчувати легку нудоту. Повернувшись всередину і діставши сигарету з кишені, Грішем почув ще одну серію вогневих звуків з автоматичної зброї, супроводжувану криками знизу. Запаливши її, він сів за свій друкарський апарат, який він несе з собою ще з того часу, коли Південна Африка почала горіти, і почав писати."
france_reclamation.proxy.USA.9999.a: "Модель свободи."

france_reclamation.proxy.GER.1.t: "Вторгнення до Франції"
france_reclamation.proxy.GER.1.desc: "Цілком ясно, що огидні та нестерпні народи нібито великих націй Старої Європи ніколи не навчаться, і незважаючи на невтомні зусилля наших солдатів, щоб переконатися, що уроки Другої світової війни будуть засвоєні, тепер здається, що останні відступники французького спротиву до нашого нового порядку вирішили розпочати останню суїцидальну кампанію, щоб якимось чином відновити націю від наших союзників у Парижі.\n\nАрмії Вільної Французької Уряду, наступники уряду де Голля, що перебував в екзилі в Західній Африці, свіжі після війни з Камеруном і африканськими воєначальниками, якимось чином висадилися у Франції, отримавши допомогу від партизанських повстанців на півдні, і швидко здобувають підтримку французького населення; все більш очевидно, що Національний Уряд несе реальний ризик бути захопленим, якщо бунтівники просуватимуться вглиб країни.\n\nІ тому, і не вперше, а, можливо, востаннє, лягає відповідальність на плечі німецької армії, щоб покласти кінець цьому хаосу, що обрушився на Францію; ситуація в Германії вимагає, щоб наші західні перехідні території залишалися твердо в нашій сфері впливу, і якщо для цього потрібно припинити французький спротив в останній раз, то давайте зустрінемо французів ще раз, щоб втамувати їхню спрагу до руйнувань і нагадати їм про їхнє належне місце в нашому світі."
france_reclamation.proxy.GER.1.a: "Новий світовий порядок не буде заперечений!"

#france_reclamation.proxy.GER.2.t: "Французька громадянська війна"
#france_reclamation.proxy.GER.2.desc: "Незадоволені тим, що наша горда нація була занурена у громадянську війну, доля, здавалося б, вирішила, що наші союзники в колишньому уряді колаборації Франції мають страждати тією ж долею; вони не змогли зупинити партизанські сили в Окситанії, чи то через байдужість, чи то через тупість, або ж через просто травмованих і потрясених хрестовим походом Гіммлера в Західний Париж, країна тепер повністю занурилася в громадянську війну, сільська місцевість палає в тінях Ейфелевої вежі.\n\nЦе не дивує нікого в Германії, що такий масакр стався, можливо, у сенсі, що блеяння овець складно ігнорувати, але Рейх не може ігнорувати події в південній Франції; плани фюрера щодо майбутнього нації ще далекі від завершення, і з огляду на стратегічну ситуацію на південь та схід, наш єдиний вихід — знову йти на захід у землю Франції.\n\nЦе була слабкість Франції, що призвела до цієї кризи, але саме німецька сила покладе їй край!"
#france_reclamation.proxy.GER.2.a: "Вперед до Ост-Парижа, вперед до Марселя!"

france_reclamation.proxy.GER.9998.t: "Остаточний похід"
france_reclamation.proxy.GER.9998.desc: "Руки Моріса були зв'язані металевими манжетами, але він був не єдиним. Біля нього було ще з десяток чоловіків, кожен з яких мав зв'язані руки, деякі — металевими манжетами, деякі — мотузкою.\n\nРеволюція була драматичною поразкою. Франція залишалася в ланцюгах у несправедливого гнобителя, і Моріс нічого не міг з цим зробити. Його люди були серед перших, хто захопив місто, і деякі з них воювали ще з часів Другої світової війни, як і Моріс. Майже 30 років, і він був змушений боротися під землею більшість із них, з моменту створення Віші. Деякі з цих солдатів були з ним усі ці роки, як Паскаль, який був виноробом перед тим, як вступити до армії. Потім був Жан, молодий чоловік, народжений в Нісі менше ніж 20 років тому, який завжди сподівався служити своїй нації і здійснити мрію свого батька: почати родину в Бордо знову. Потім був Філіпп, старіючий ремісник, який нещодавно втік із півночі, сподіваючись допомогти в визволенні, коли прийде час. Нажаль для них, чотири зрадливі зрадники привели учасників спротиву до їх певної загибелі. Хода здалася Морісу безнадійною, наче його тягнули назад з кожним кроком. Було мало що можна зробити в такій ситуації. Моріс думав, що він вже відчував безнадійність раніше, у самому кінці офіційної війни, і можливо, так і було, але тоді він міг боротися. Тепер не було такої опції. Протягом усього того часу Моріс жив для своєї країни і співав її пісні щоранку своєму сину. І тому він вже любив свою країну.\n\nСпочатку це було як бурмотіння, принаймні кілька рядків, поки всі в лінії не зрозуміли, що він співає "Марсельєзу". Після хвилини вагань Паскаль приєднався. Їхнє співання було перерване спалахом черги з кулемета, що порізала Морісу груди. Падаючи на землю, решта чоловіків застигли, навіть інші захоплені. Жан був першим, хто знову заспівав, потім Філіпп, і решта приєдналися. Знову їхні голоси перекрив вогонь з автоматичних гвинтівок. Коли Жан впав на спину Моріса, відчуваючи, як з нього вириваються останні подихи, він прошепотів свої останні слова до Моріса."
france_reclamation.proxy.GER.9998.a: ""Батьку... вибач..."" 

france_reclamation.proxy.GER.9999.t: "Одна ніч у Бордо"
france_reclamation.proxy.GER.9999.desc: "Для Кріса Грішема можливість служити своїй нації була захоплюючою ідеєю — зробити це, відвідавши Францію в той час, коли вона розривається на частини, було ще більш привабливою концепцією, принаймні для нього. Спостерігати за нацією, як Франція — колишній член Пакту, — переживає свої старі гріхи таким чином було надзвичайно цікаво. Слідкувати за тим, як французький спротив перетворюється з революційної непомітної сили на потужну силу, здатну захопити європейську державу, було захоплюючим видовищем, не менш цікавим через унікальність того, що відбувалося перед ним зараз.\n\nЦе було видовище; вулиця в Бордо буквально горіла полум'ям, і вогнища простягалися по авеню. Це було дивно, тому що він знав, що саме це більшість його друзів і родини вбивали б, щоб побачити — буквально, для деяких з них. Ці вогні не були без нагляду, скоріше навпаки. Вони були оточені натовпами, які скидають лише червоне; Кріс побачив численні свастики і навіть кілька копій "Майн Кампф", що лежали у вогні, хоча більшість з них були прапорами старого режиму. Але це було не все, що побачив Грішем. Він також розрізнив іншу іконографію, хоча вона була практично грецькою для нього — ймовірно, деякі обскурні ідеологічні ніші. Але все це було таким дивним для нього, наче французи самі пішли і абсолювали себе від усього цього, і здавалося, що вони добре розуміють це, якщо веселощі та сміх були хоч чимось, що можна було помітити. Зазвичай він б вийшов і запитав би у натовпу коментарі, але це була не така ніч; усе місто було в стані святкування, немов анархічний фестиваль, з підпалом і публічними страченнями на кожному кроці. Стоячи на балконі, спостерігаючи за всім цим, він почав відчувати легку нудоту. Повернувшись всередину і діставши сигарету з кишені, Грішем почув ще одну серію вогневих звуків з автоматичної зброї, супроводжувану криками знизу. Запаливши її, він сів за свій друкарський апарат, який він несе з собою ще з того часу, коли Південна Африка почала горіти, і почав писати."
france_reclamation.proxy.GER.9999.a: "Модель свободи."

france_reclamation.proxy.IBR.1.t: "Мрія минає"
france_reclamation.proxy.IBR.1.desc: "Було неможливо побачити сонце, що визирало за горизонт — його закривали ряди і ряди сталевих кораблів. Кожен корабель зухвало розмахував Триколором Свободної Франції — сигнал для колабораціоністів та нацистів, що правління Віші більше немає. Кораблі мали такі назви, як Раміллі, Бонапарт чи Голль — і на них служило більше людей, ніж будь-хто міг порахувати.\n\nБезліч думок прокидалося в головах багатьох чоловіків; безліч емоцій, безліч облич, безліч страхів. Посмішка Іва різко контрастувала з рішучим виразом обличчя Мухаммеда — але очі обох були спрямовані на горизонт, на узбережжя, на їхню батьківщину.\n\nФранція.\n\nВона кликала їх, як крик матері, що закликає додому. Вона співала їм, як предкова музика, яку вони не могли не почути. Вона наказувала їм, як генерал, якому вони не могли не підкорятися. Вони йшли за наказом Франції; вони йшли додому. Безліч Наполеонів повертаються з їхнього спільного Ельби.\n\nНе кожен корабель рухався в одну й ту ж точку, звісно; деякі повинні були висадитись на "Епе", "Ор" чи "Джуні". Але всі вони відігравали важливу роль у гарячій битві, що настає: відновлення Франції раз і назавжди.\n\nЯк тільки кораблі та десантні катери наближались до узбережжя, як тільки літаки скидали своїх парашутистів, як тільки на узбережжі лунали звуки пострілів, решта Франції затримала подих. Так багато чоловіків, так багато жінок, так багато дітей думали, що цей день ніколи не прийде, незважаючи на їхні бажання, щоб це сталося. Так багато людей були впевнені, що це відбудеться, незважаючи на їхні надії, щоб цього не сталося. Безліч телевізорів випльовували свою отруту, свою пропаганду, без уваги; безліч чоловіків і жінок, які чекали в тіні, поверталися на світло з гвинтівкою в руках."
france_reclamation.proxy.IBR.1.a: "La Réclamation a commencé!"  

france_reclamation.proxy.IBR.9998.t: "Остаточний похід"
france_reclamation.proxy.IBR.9998.desc: "Руки Моріса були зв'язані металевими манжетами, але він не був єдиним. Біля нього було ще з десяток чоловіків, кожен з яких мав зв'язані руки, деякі металевими манжетами, інші — мотузками.\n\nРеволюція була драматичною поразкою. Франція залишалася в ланцюгах у несправедливого гнобителя, і Моріс нічого не міг з цим зробити. Його люди були серед перших, хто захопив місто, і деякі з них воювали ще з часів Другої світової війни, як і Моріс. Майже 30 років, і він був змушений боротися під землею більшість із них, з моменту створення Віші. Деякі з цих солдатів були з ним всі ці роки, як Паскаль, який був виноробом перед тим, як вступити до армії. Потім був Жан, молодий чоловік, народжений в Нісі менше ніж 20 років тому, який завжди сподівався служити своїй нації і здійснити мрію свого батька: почати родину в Бордо знову. Потім був Філіпп, старіючий ремісник, який нещодавно втік із півночі, сподіваючись допомогти в визволенні, коли прийде час. Нажаль для них, чотири зрадливі зрадники привели учасників спротиву до їх певної загибелі. Хода здалася Морісу безнадійною, наче його тягнули назад з кожним кроком. Було мало що можна зробити в такій ситуації. Моріс думав, що він вже відчував безнадійність раніше, у самому кінці офіційної війни, і можливо, так і було, але тоді він міг боротися. Тепер не було такої опції. Протягом усього того часу Моріс жив для своєї країни і співав її пісні щоранку своєму сину. І тому він вже любив свою країну.\n\nСпочатку це було як бурмотіння, принаймні кілька рядків, поки всі в лінії не зрозуміли, що він співає "Марсельєзу". Після хвилини вагань Паскаль приєднався. Їхнє співання було перерване спалахом черги з кулемета, що порізала Морісу груди. Падаючи на землю, решта чоловіків застигли, навіть інші захоплені. Жан був першим, хто знову заспівав, потім Філіпп, і решта приєдналися. Знову їхні голоси перекрив вогонь з автоматичних гвинтівок. Коли Жан впав на спину Моріса, відчуваючи, як з нього вириваються останні подихи, він прошепотів свої останні слова до Моріса."
france_reclamation.proxy.IBR.9998.a: ""Батьку... вибач..."" 

