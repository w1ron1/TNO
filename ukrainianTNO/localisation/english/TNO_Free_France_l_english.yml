   FFR_Jean_Lecanuet: "Жан Леканюе"
  FFR_Pierre_Mendes_France: "П'єр Менде-Франс"
  POLITICS_FRANCE_MENDES_FRANCE: "Найбільш популярною людиною у Вільній Франції без сумніву є Шарль де Голль, з очевидних причин. Однак друге місце, ймовірно, належить П'єру Менде-Франсу.\n\nПісля капітуляції Франції Менде-Франс був засуджений на шість років ув'язнення за неправдивим обвинуваченням у дезертирстві. Однак він втік і приєднався до сил Вільної Франції, де служив у бойовій групі, виконуючи саботажні місії. Він приєднався до CFLN у 1943 році і був офіційним посередником між OFN та Вільною Францією в 40-50-ті роки.\n\nДля Менде-Франса де Голль — це не більше ніж малий диктатор, а армія Вільної Франції — корумповане осередок, де залишилось мало справжніх союзників. Він виступав проти розширення в Африці, а також проти будь-яких насильницьких спроб повернути Францію. У 1962 році саме він виступив за прийняття французької Конституції на територіях Вільної Франції, яка була призупинена майже два десятиліття тому.\n\nМенде-Франс представляє сильне прагнення до соціалізму в глибоко консервативній країні та моральний компас, який ніколи не був відкинутий."
  
  ## Події ##
  # Події відновлення
  free_france_reconstruction.3.t: "Держава Західної Африки"
  free_france_reconstruction.3.desc: "Це зроблено. Війна в Західній Африці закінчена. По всіх нових націях, що виникли після краху PALF, сотні тисяч були переміщені, а цілі міста зникли з карт. Сироти блукають землею, шукаючи батьків, які ніколи не повернуться додому. Америка дивиться на свою перемогу. Справжньої перемоги не буде, поки свобода не розпростягне свої крила на завойованих націях.\n\nНароди Західної Африки та вигнанці Франції просять нашої допомоги. Вони стверджують, що тільки участь Америки в відновленні може врятувати Західну Африку. З нашого боку корпорації, такі як Firestone і DuPont, готові використовувати ресурси цього регіону. Президент [USA.GetLeader] схвалив початкові пакети допомоги та проекти, і від нас залежить, щоб ми забезпечили гуманність у Західній Африці.\n\nЦе важке завдання. Люди Сполучених Штатів вірять, що вони готові допомогти цим людям відбудуватися та піднятися з попелу. Завдання уряду полягає в тому, щоб забезпечити, щоб ця віра не залишилась метафізичним об'єктом."
  free_france_reconstruction.3.a: "Триває естафета свободи."
  
  free_france_reconstruction.4.t: "Різке завершення відновлення"
  free_france_reconstruction.4.desc: "Як би уряд Вільної Франції не бажав зосередити зусилля на відновленні Західної Африки після війни з Камеруном, спалах громадянської війни на материковій Франції надає нам можливість, яку ми не можемо пропустити; кожен цент повинен бути витрачений на допомогу нашим співвітчизникам у позбавленні Франції від фашизму та вигнанні залишків Віші в море.\n\nЗ огляду на це, ми маємо не так багато можливостей для відновлення Західної Африки; ми можемо лише сподіватися, що після нашої остаточної перемоги зможемо надіслати деяку допомогу місцевим африканським урядам у розвитку національної ідентичності, але наразі кожна наша міра повинна бути спрямована на закінчення спадщини Петіна та відновлення честі Франції!"
  free_france_reconstruction.4.a: "Франція кличе."

  free_france_reconstruction.5.t: "Складні роки, висушені роки"
  free_france_reconstruction.5.desc: "Автомобілі піднімали пил із нових шосе і переносили її в безплідні землі за межами міста. Сухі гілки джунглів розмахували широкими листям, вітанням до кожного подиху вітру. Високо в небі, на фоні ясного полудневого неба, здійнялася сталева колона, на вершині якої висів круглий знак Coca-Cola, яскраво-червоний із логотипом компанії. Фермер стояв у її тіні, оглядався вліво та вправо, перш ніж плюнути в землю.\n\nЦе був важкий рік для Західної Африки. Він бачив, як його сини йшли на війну, повертаючись додому в трунах, обгорнутих триколором. Працівники ферми йшли служити, але більше їх ніколи не бачили. Земля, хоч і висушена, дарувала свої плоди, щоб полегшити тягар скорботи. Але і це забирали у нього. Він повернув голову на схід, до міста Бамако, що розросталося, поглинаючи всі багатства цієї землі.\n\nВін бачив нові дороги, заповнені людьми з інших селищ. Нові будівлі, на яких було написано логотипи американських компаній. Він похитав головою. Як це сталося? Він бачив, як солдати риють в землі, відводячи воду на плантації. В їхніх очах горіла безжальна байдужість. Їхні вуха не чули його скарг. Він зітхнув. Повільно, крок за кроком, він прямував до міста."
  free_france_reconstruction.5.a: "Те, чим ми жертвуємо заради життя."
  
  free_france_reconstruction.6.t: "Дорога з поворотами"
  free_france_reconstruction.6.desc: "Вони завантажили Діалло і його родину в вантажівки. Солдати на джипах охороняли обидва боки кортежу, кулемети блищали в вечірньому дощі. Багато разів їм доводилося зупинятися, щоб підняти автомобілі з грязьової дороги, і озброєні чоловіки спостерігали, не зворушуючи обличчя. Молоді хлопці, едва за двадцять, вже втомлені від страждань інших. Діалло бачив це в їхніх очах. Вони були мертві всередині. Декілька з них жартували та запалювали сигарети, намагаючись приховати це передчуття провини.\n\nВантажівки повзли через низькі пагорби, грязьові стежки виводили через галявини в джунглях. Вони проходили через контрольно-пропускні пункти, огороджені сіткою з курячої сітки. Прожектори сліпо проривали джунглі своїм циклопічним поглядом. Діалло не знав, куди вони їдуть. Це не мало значення.\n\nЯк тільки земля вирівнялася, а покриви джунглів відступили до далеких кутків, з'явилися плантації. Рівні ряди дерев каучуконосів. Робітники прогулювалися своїми ділянками, збираючи латекс в маленькі відра. Діалло та його діти дивились, як вони проходять, все менші, поки дерева і неповороткі люди не зникли за горизонтом. Лінія дерев поглинула все.\n\nВони прибули до свого табору незабаром. Вони вийшли з транспортних засобів і пройшли в ряд до своїх тимчасових осель. Імпровізовані хати з солом'яними дахами, які ледь вміщували двох, не кажучи вже про п'ятьох. Незважаючи на це, вони затягнули ноги та чекали на ранок."
  free_france_reconstruction.6.a: "Чи стали ми марою самі для себе?"
  
  free_france_reconstruction.7.t: "Оцінка землі"
  free_france_reconstruction.7.desc: ""Зупиняйся тут." Джип зупинився на галявині вище схилу, звідки відкривався вигляд на річку, на березі якої стояло село. Звуки життя ледь долинали до цього місця. Два чоловіки вийшли з машини, сорочки промокли від інтенсивного жару субсахарської сонця. Один зігнувся, перевіряючи грунт, розтираючи його в руках. Його два пальці меленими сушеними, червоними земними частками виводили туманне сліди, що стікали до землі.\n\n"Здається, це правильний тип грунту," сказав зігнутий чоловік. "Трішки води — і з цією річкою," він вказав пальцем, "ми зможемо тут вирощувати каучуконосні дерева."\n\n"Скільки землі, на твою думку, забере Firestone?" — запитав його товариш, уважно спостерігаючи за селом через бінокль.\n\n"Ну," відповів інший, підвівшись. "Ось звідси," він вказав на край джунглів, "до ось цього місця." Він розмахнув рукою через село до іншого краю рослинності. "Гадаю, це їм сподобається."\n\n"А село?"\n\n"А що з селом? Будуть проблеми?""
  free_france_reconstruction.7.a: ""Ні. Ні, звичайно ж, ні.""
  
  free_france_reconstruction.8.t: "Сповідь робітника на плантації каучуку"
  free_france_reconstruction.8.desc: ""Готові?" — запитав кореспондент, піднімаючи брову до перекладача. Чоловік кивнув. "Гаразд." Перед ними стояв чоловік із народу бамбарів, одягнений у просту білу сорочку, рукави якої були загорнуті, відкриваючи мозаїку ножових порізів під шкірою. Кореспондент подивився на перекладача. Шоу розпочалося. Він натиснув на кнопку запису на касетному магнітофоні.\n\n"Назвіть ваше ім'я." — сказав кореспондент, нахиляючись до перекладача.\n\n"Діарра."\n\n"Діарра, дякуємо. Тепер, пане Діарра, я розумію, що ви працюєте на плантаціях компанії Firestone Natural Rubber. Чи піклується компанія про своїх працівників? Чи отримуєте ви та ваші співробітники достатньо стимулів для того, щоб продовжувати працювати?"\n\nКоли перекладач переклав йому запитання, чоловік-бамбар із насмішливим посмішкою подивився на них. Він почав говорити. "Він каже," — сказав перекладач, — "До цього часу він працював на сільських фермах біля річок. Коли війна закінчилася, більшість з них шукала роботу. Будь-яку роботу. Firestone прийняло це." У його очах з'явився блиск. "Вони не повинні були." Він замовк після цього.\n\n"Чому?"\n\nЧоловік подивився в очі кореспондента. Зітхаючи, він продовжив. "Єдиний стимул, який вони дають тут — це пістолети. Погані новини. Солдати стежать з окопів, щоб переконатися, що кожне дерево насправді збирається правильно. Тут навіть жінки і діти працюють. У вас є ще якісь питання?"\n\n"Так. Звісно. Ми обов'язково передамо це в Штати, пане Діарра. Рахуйте на нас.""
  free_france_reconstruction.8.a: "Сенсаційний репортаж."
  
  free_france_reconstruction.9.t: "Порожні костюми"
  free_france_reconstruction.9.desc: "Жарка погода. Виконавці компанії Hershey приземлилися в Бамако сьогодні вранці і вирушили до зароджуючихся плантацій, що ростуть на околицях Малі. Коли вони приїхали, вони побачили ці молоді сіянці, ряди їх, обіцяючи процвітання на кінчиках їх листя. Какао, товар, з яким Hershey доводилося боротися проти мексиканських та бразильських монополій так довго, тепер став доступним виключно для них. Чоловіки обмінювалися привітаннями з високими п'ятами, слава їм виглядала на джипах серед рядів рослин.\n\nМісцевий малий генерал мав приготувати їх обід. Під палючим сонцем Сахари вони обідали пряним рисом і куркою, м'ясом, приготованим у арахісових соусах і копченою рибою. "Дякуємо за можливість," сказав офіцер у формі. "Малі стає сильним з кожним днем." Вони дивилися на плантацію з-за столів для обіду.\n\n"Це взаємовигідна угода, генерал." — сказав один із керівників. "Більше буде." Пауза. "До речі, як ви плануєте знайти робочу силу для цих... комплексів?"\n\n"Залиште це мені." Генерал вклонився. "Я точно знаю, де їх знайти.""
  free_france_reconstruction.9.a: "Руки потискаються. Гроші передаються."
  
  free_france_reconstruction.10.t: "Як це робиться"
  free_france_reconstruction.10.desc: "Її вели по плантації. Вона побачила ці темні, маленькі руки, що тягнуться до какао-бобів, мачете в руках менше за діаметр ручки, махаючи вгору, розбиваючи ряди рослин. Вона бачила, як вони ріжуть боби і перетирають їх в тонкий пил, на долонях їх — заплутаний візерунок з мозолів. Такі молоді, і все ж такі старі.\n\nВона домовилася, щоб потрапити сюди. Лейтенант на дорозі, близько ста двадцяти доларів "під столом", і ось вона тут, на плантації Hershey на південь, де залишалася. "Камери?" — запитала вона.\n\nЛейтенант знизав плечима. Вона все ж таки взяла одну Полароїд. Робила знімки того, чого хотіла б забути. Спалюючи кольори, те, що вона бачила. Вона бачила, як ці фотографії виповзають з її Полароїда, жах, що різав по всіх кутах, буденність і простота. Вона знову дивилася на ці пальці, помічаючи відсутні пальці, шрами від різких порізів, що прорізали плоть.\n\nВона допитувала дітей. Ранішні підйоми проти їх волі. Маленькі години ранку, вони прокидалися. Прямо на плантацію. Ніякої гри. Ніхто з них не старший дев'яти. Вона запитала їх, чи бачили вони своїх батьків. Вони похитали головами. Ви коли-небудь їли шоколад? Знову ні. Вони повернулися в місто через півгодини, тиша наростала на фоні шелесту підлісок.\n\nВ своїй кімнаті вона написала."
  free_france_reconstruction.10.a: "Леді свободи, осквернена."
  
  free_france_reconstruction.11.t: "Демони збираються"
  free_france_reconstruction.11.desc: "Переговори тривали кілька тижнів. DuPont і Firestone, два гіганти американської промисловості, почали свою роботу. Західна Африка — це багата земля, наповнена родючими ґрунтами і водними шляхами, що підтримують ріст натурального каучуку. Firestone видобуває каучук, який вони збирають на своїх плантаціях у Малі, транспортують на свої заводи в Ліберії. Хоча угода влаштовувала Firestone раніше, величезне зростання активів компанії означало, що цей процес став вузьким місцем.\n\nПереговори почалися, коли DuPont звернувся до керівництва Firestone. Вони зробили загальний жест: якщо Firestone погодиться на їхню інфраструктурну угоду, DuPont купуватиме каучук лише з плантацій Firestone, ігноруючи інших конкурентів на ринку. В обмін DuPont надасть капітал для нових доріг, залізничних мереж, портів і кораблів, спільно з інвестиціями Firestone. Одна умова стала важливою для DuPont: Firestone використовуватиме свої заводи лише для переробки каучуку.\n\nТижні минули, і переговори звели умови до конкретики. Угода залишилася незмінною."
  free_france_reconstruction.11.a: "Коли руки зчіплюються в угоді, темне коло замкнеться навколо Західної Африки."
  
  free_france_reconstruction.12.t: "Ціна свободи"
  free_france_reconstruction.12.desc: "Брудна, смолиста вода випливає з верхньої частини заводу DuPont. Вигибаються на своїх боках корови, що помирають десятками. Навколишні села порожні; вантажівки DuPont вивозять людей на свої заводи по всій країні, обіцяючи їм заробітну працю. Солдати спішно проводять робітників на заводи, пильнуючи їх з кулеметами.\n\nВін, одягнений у камуфляжну куртку, з прес-картами, що висіли на плечах, бачив все це. Газети армії писали великими літерами, що вони виграють мир тут, з любов'ю, миром, серцями та розумом. Стовпи дерев, безлистих під спекою джунглів, казали інше. Земля, обпалена шрамами, вкрита кров'ю, її річки, що течуть і несуть відходи, береги, повні переміщених людей. Він ніколи не побачить того, що бачать вони, не зрозуміє те, що розуміють вони.\n\nВійна посіяла насіння надії, мабуть. Американські солдати, добрі хлопці, яких відправили померти в галявинах, ковдри оранжевого вогню, що прокочуються через ліси перед ними, роблять хороші історії, гарні фотографії. Ось чоловіки; вони будуть жити і вмирати вільними, як їхні пращури. Він бачив ці очі, що стали твердими біля річки. Він похитав головою.\n\nПовернення додому буде важким."
  free_france_reconstruction.12.a: "Заливаючи хвилями завоювання, є туга переможених."
  
  # Події переговорів
  france_iberia_negotiations.3.t: "Посланець від Вільної Франції"
  france_iberia_negotiations.3.desc: "Дипломати були шоковані, коли несподіваний посланець прибув до їхніх офісів. Посланець приніс листа від французів. Початкова реакція була звичайною, оскільки вони очікували черговий безглуздий лист від уряду Віші, але обличчя дипломатів змінились на шоковані, коли вони прочитали його і зрозуміли, що лист був від Вільної Франції в Абіджані.\n\nПеремога Вільної Франції в Західній Африці вже потрясла глобальну спільноту, і цей лист може стати лише початком ще одного землетрусу. Вони закликають до зустрічі, щоб обговорити взаємно важливі питання для обох сторін, що викликає питання, чому і чим це може бути викликано.\n\nУ нас є здогадка, що це може означати, враховуючи давнє прагнення Вільної Франції відновити контроль над материковою частиною. Така угода була б корисною, якщо вона буде правильно оброблена, і Іберія, безумовно, має більше вигоди, ніж втрат у таких угодах, якщо вони будуть успішними.\n\nМи вже почали підготовку до зустрічі в Іберії, і ще один лист був надісланий назад до Абіджану в очікуванні. Адже немає жодної шкоди у зустрічі, принаймні, для нас."
  france_iberia_negotiations.3.a: "Тепер чекаємо."
  france_iberia_negotiations.3_tt: "§YПодивимось, що з цього вийде.§!"

  france_iberia_negotiations.4.t: "Приїзд Леклерка"
  france_iberia_negotiations.4.desc: "Жовте сонце сходить над незвично оптимістичною Іберією. Офіційна делегація від Вільної Франції — на чолі з самим Філіпом Леклерком — прибула пізно вчора ввечері своїм літаком для що обіцяють бути дуже цікавими переговорами.\n\nУ нас багато спільного з Вільною Францією, але ще багато роботи, щоб ми могли дійсно вважати себе союзниками. Якщо ми хочемо просувати наші спільні інтереси, нам потрібно узгодити нашу політику з їхньою.\n\nПроцес для цього досить простий. Спочатку ми представимо свої умови, і Вільна Франція вирішить, що з ними робити. Потім вони виставлять свої умови. Ми будемо повторювати цей процес, поки не досягнемо угоди з усіх необхідних питань.\n\nЦе звучить досить просто, але ми знаємо, що дорога попереду повна перешкод. Тим не менш, не завадить бути хоча б трохи сподіваємось на майбутнє, правда?"
  france_iberia_negotiations.4.a: "Чекаємо та спостерігаємо."
  france_iberia_negotiations.4_tt: "§GПереговори офіційно починаються.§!"

  france_iberia_negotiations.5.t: "Тема: Французька орієнтація"
  france_iberia_negotiations.5.desc: "Потискання рук і ввічливості відбулись швидко, оскільки було важливу роботу. Без підказок переговори швидко перемістилися до теми майбутньої Рекламатії: зокрема, що Іберія може зробити, щоб допомогти Вільній Франції в їхніх зусиллях.\n\nЯк ми розглядаємо наші варіанти, ми повинні бути реалістами. Підтримка їх не буде без наслідків, і ми ризикуємо багато чим, підтримуючи їх.\n\nПриродно, це означає, що нам потрібне щось натомість. Нам потрібно обговорити, що попросити Вільну Францію в обмін на нашу підтримку. На щастя, наші представники вже почали обговорення цього між собою, і є три напрямки, в яких вони пропонують провести переговори."
  france_iberia_negotiations.5.a: "Вимагати дипломатичного альянсу з Іберією."
  france_iberia_negotiations.5.b: "Вимагати торгових поступок."
  france_iberia_negotiations.5.c: "Попросити взаємні гарантії."
  france_iberia_negotiations.5.a_tt: "§RЦе остаточно прив’яже їх до нас.§!"
  france_iberia_negotiations.5.b_tt: "§YЦе може прив'язати Францію до наших економічних інтересів.§!"
  france_iberia_negotiations.5.c_tt: "§GЦе забезпечить дружнього сусіда у Франції.§!"

  france_iberia_negotiations.7.t: "Вільна Франція пропонує компроміс"
  france_iberia_negotiations.7.desc: "Вільна Франція відповіла на наші початкові умови — що Франція надасть нам торгові поступки і стане на нашу сторону в питаннях зовнішньої політики — пропозицією компромісу, середнім варіантом між їхніми і нашими умовами.\n\nПрийняття цієї пропозиції означає, що ми не отримаємо всіх вигод, які хочемо, що буде прикро. Ми могли б спробувати ще більше натискати, звичайно, і подивитись, чи погодяться вони.\n\nОднак ця угода може допомогти стабілізувати переговори, гарантуючи, що вони хоча б продовжуватимуться. Це, безумовно, теж має свою цінність."
  france_iberia_negotiations.7.a: "Прийняти компроміс."
  france_iberia_negotiations.7.b: "Продовжувати тиск на питання."
  france_iberia_negotiations.7.a_tt_1: "§YМи погодимося на торгові поступки.§!"
  france_iberia_negotiations.7.a_tt_2: "§YМи погодимося на взаємні гарантії.§!"
  france_iberia_negotiations.7.b_tt: "§RМи ризикуємо зірвати переговори.§!"

  france_iberia_negotiations.9.t: "Переговори зриваються"
  france_iberia_negotiations.9.desc: "Вперше за кілька днів у залах, де проходили франко-іберійські переговори, настала тиша. Іберійці хотіли б стверджувати, що це сталося через добре виконану роботу, але це було зовсім не так. Принаймні, не для одного з цих пунктів.\n\nПереговори справді завершились, але не успішно. У розчаруванні Леклерк і його делегація скасували все, проклинаючи іберійців за їхній впертий характер і висловлюючи співчуття до ситуації Італії кілька років тому.\n\nДипломати Іберії сидять згорблені, рефлектуючи над своїм нещодавнім провалом. Деякі п'ють алкоголь, щоб заглушити біль, інші кидаються в роботу, щоб компенсувати це.\n\nСьогодні Леклерк летить назад разом зі своєю делегацією до Західної Африки. Його шлунок ворушиться, він і його люди оглядаються на провал з жалем, але аналітичним поглядом, думаючи, що робити далі. Літак злітає, залишаючи Іберію позаду, можливо, назавжди, поки його люди сумно згадують, що могло б бути."
  france_iberia_negotiations.9.a: "Але їхні серця все ще палають рішучістю."
  france_iberia_negotiations.9_tt: "§RВільна Франція зустрінеться з майбутнім без нас.§!"

  france_iberia_negotiations.10.t: "Тема: Колоніальні гарантії"
  france_iberia_negotiations.10.desc: "Під час переговорів виникла тема колоніальних претензій та управління територіями. Як уряд Іберії, так і делегація Леклерка мають зацікавленість у тому, як будуть управлятися їхні відповідні володіння в Африці, хоча й з деякими нюансами.\n\nОбидві сторони залишаються твердо налаштованими проти антиколоніальних рухів. Це зробило узгодження питання досить простим. Іберійські дипломати були особливо здивовані, наскільки запальними були французи, зважаючи на те, як вони опосередковано контролюють свої території, однак це має сенс, враховуючи їхні недавні сутички з пан-африканізмом.\n\nЛеклерк визнав, що його уряд не зможе утримувати прямий контроль над Західною Африкою, якщо вони відновлять контроль над континентом; вони пообіцяли зробити все можливе, щоб підтримати дружні уряди, аби і Іберія, і Вільна Франція могли продовжувати мати доступ до цінних західноафриканських ринків.\n\nХоча це все виглядає чудово, питання колоніальних претензій дещо складніше. Якщо ми попросимо Вільну Францію відмовитися від претензій на наші колонії, це буде перемогою як для держави, так і для майбутнього миру між двома націями. Проте це також може непотрібно розгнівити французів і привести до скасування всіх колоніальних гарантій."
  france_iberia_negotiations.10.a: "Тиск на Францію, щоб вона відмовилась від претензій на іберійські колоніальні володіння."
  france_iberia_negotiations.10.b: "Лише попросити про продовження французької колоніальної присутності в Африці."
  france_iberia_negotiations.10.a_tt: "§YЦе дозволить уникнути можливих точок конфлікту з нашими сусідами§!"
  france_iberia_negotiations.10.b_tt: "§GЦе забезпечить регіональну стабільність і відкриє більше африканських ринків для нас§!"

  france_iberia_negotiations.12.t: "Вільна Франція відмовляється від вимоги щодо відмови від претензій"
  france_iberia_negotiations.12.desc: "Леклерк і його делегація чітко дали зрозуміти, що наша вимога про відмову від претензій на наші колонії є неприпустимою. Леклерк навіть погрожував повністю припинити переговори. Якщо ми беремо слово делегації Вільної Франції, нам доведеться відмовитись від цієї теми, якщо ми хочемо, щоб ці обговорення продовжувались.\n\nПроте, можливо, це просто блеф. Якщо Вільна Франція насправді хоче звільнити Францію, ми — їхній найкращий варіант. Це дає нам важелі впливу, і ми не повинні забувати про цей факт.\n\nКрім того, реальність полягає в тому, що Вільна Франція на практиці не має можливості повернути колонії під нашим контролем. Вони зайняті питаннями уряду на материковій частині, а після усунення їх вони будуть втягнуті в реконструкцію та вирішення своїх справ у Західній Африці. Спроба почати війну з нами була б марною витратою часу.\n\nОднак, якщо вони дійсно мають намір відмовитись, ми можемо упустити унікальну можливість. Ми вже отримали деякі поступки, і ймовірно, можемо отримати ще більше, якщо просто перейдемо до нової теми."
  france_iberia_negotiations.12.a: "Наполягати на цьому питанні."
  france_iberia_negotiations.12.b: "Залишити це питання."
  france_iberia_negotiations.12.b_tt: "§YМи погодимося на продовження французької колоніальної присутності в Африці§!"

  france_iberia_negotiations.14.t: "Тема: Борги"
  france_iberia_negotiations.14.desc: "Після того, як питання колоніальних претензій було вирішено на даний момент, настав час звернутися до делегації Вільної Франції з новою темою в порядку денному: виплата боргів.\n\nВільна Франція хоче фінансувати свою «Рекламатію», а згодом і свою «Реконструкцію», за рахунок позик від Іберійського Союзу. Звісно, це дає нам чудову можливість.\n\nНаша делегація погодилась натискати на те, щоб додати додаткові відсотки до цих майбутніх виплат, аби ця справа була вартісною для нашого часу та інвестицій.\n\nМи вже звернулися до Леклерка і його делегації з цими пропозиціями та наразі чекаємо їхньої відповіді."
  france_iberia_negotiations.14.a: "Вести переговори про відсотки."
  france_iberia_negotiations.14.a_tt: "§YПитання відсотків на боргах Франції буде обговорюватися§!"

  france_iberia_negotiations.17.t: "Тема: Фонди для реконструкції"
  france_iberia_negotiations.17.desc: "Делегація Франції, здається, набралася рішучості завдяки переговорним успіхам. Вони, зрештою, зібралися з силами, щоб попросити про те, що довгий час тримали при собі — державні позики. Не можна сказати, що ми здивовані.\n\nНавіть якщо Вільні Французи знову зможуть повернути контроль над метрополією, руйнування та насильство, яке супроводжуватиме цей процес, залишать країну тінню її колишньої величі. Тому зараз вони просять нас обіцяти надання їм досить щедрих, отже дорогих, позик після їхнього повернення додому. Не дивно, що це прохання розкололо нашу делегацію.\n\nЗ одного боку, половина делегації наполягає, що таке витрачання коштів виходить за межі бюджету і буде марною тратою грошей. Є навіть ті, хто вважає, що Іберія не повинна зміцнювати Францію занадто сильно, щоб залишатися сильнішою стороною у наших відносинах. Однак інша половина наполягає, що це варта інвестиція, адже відновлена Франція може стати надзвичайно цінним союзником і партнером в Європі та Африці. Це питання викликає багато дискусій серед нас у таємниці, і врешті-решт..."
  france_iberia_negotiations.17.a: "...буде погоджено надання позик."
  france_iberia_negotiations.17.b: "...вартість виявилася надто високою."
  france_iberia_negotiations.17.a_tt: "§YМи зробимо значні інвестиції в реконструкцію Франції§!"

  france_iberia_negotiations.18.t: "Тема: Фонди для реконструкції"
  france_iberia_negotiations.18.desc: "Делегація Франції, здається, зміцніла завдяки попереднім переговорам. Вони, нарешті, набралися рішучості попросити про те, що довгий час тримали при собі — державні позики. Не можна сказати, що ми здивовані, і не можемо реально відмовити.\n\nФранцузи, використовуючи нашу попередню угоду щодо виплат боргів, успішно домовились про надання їм позик, якщо вони відновлять контроль над Францією. Руйнування під час такого конфлікту потребуватиме значної реконструкції, що вимагатиме великих коштів, і завдяки їхній згоду на високі відсотки по боргах, нас фактично поставили в кут, і ми не можемо просто відмовитись. Тому ми змушені погодитися, незважаючи на тих бюрократів, які тихо нарікають на високу вартість такого кроку."
  france_iberia_negotiations.18.a: "Це, здається, називається quid pro quo."
  france_iberia_negotiations.19.t: "Тема: Фонди для реконструкції"
  france_iberia_negotiations.19.desc: "Ще коли ми побачили, як делегація Франції входить до кімнати, з піднятою головою та з невеликим стрибком у кроках, ми зрозуміли, що нас чекає цікавий момент. Сподіваємось, що він виявився значно меншим головним болем, ніж ми очікували. Французька пропозиція була дивно простою і прямо до справи — просте прохання про помірковані позики у разі успіху їхнього повернення до Франції.\n\nПісля довгих переговорів і кількох погоджених змін з обох сторін, ми змогли успішно досягти згоди щодо цих позик і всього, що з ними пов'язано. Це гладке вирішення того, що багато хто очікував бути важким і складним питанням, додало нової впевненості обом делегаціям на майбутнє. Сподіваємось, що наступні переговори будуть такими ж легкими."
  france_iberia_negotiations.19.a: "Маленьке чудо в політиці."
  france_iberia_negotiations.19.a_tt: "§YМи помірковано інвестуємо в реконструкцію Франції§!"

  france_iberia_negotiations.21.t: "Тема: Наземна підтримка"
  france_iberia_negotiations.21.desc: "Наша делегація повернулась після зустрічі з дипломатами Вільної Франції, приносячи нову вимогу.\n\nФранцузи не лише просять нас надати їм доступ до портів, морську підтримку і безпечний прохід до узбережжя південної Франції. Вони також просять пряме сприяння з боку наших наземних і повітряних сил у їхній кампанії.\n\nЦе дуже складне прохання. Така залученість супроводжувалась би величезними ризиками, а також прямо залучала б іберійські життя у процес Рекламатії. Якщо ми можемо уникнути цього, було б найкраще змусити Вільних Французів задовольнитись лише морською підтримкою.\n\nОднак, якщо ми не можемо змусити їх задовольнитись без того, щоб не зірвати переговори, то все ще можна витягнути більше користі з цієї вимоги. Ми могли б, якщо забажаємо, вимагати в обмін на наземну та повітряну підтримку, щоб Вільні Французи дозволили нам розмістити військові бази на їхніх територіях після завершення всього цього."
  france_iberia_negotiations.21.a: "Змусити їх відмовитись від цієї вимоги."
  france_iberia_negotiations.21.b: "Погодитись на військову наземну підтримку."
  france_iberia_negotiations.21.c: "Погодитись лише на морський доступ."
  france_iberia_negotiations.21.d: "Вимагати військові бази в обмін."
  france_iberia_negotiations.21.e: "Змусити їх прийняти військові бази в обмін на наземну підтримку."
  france_iberia_negotiations.21.a_tt: "§GМи використаємо наші попередні важелі, щоб зупинити цю вимогу§!"
  france_iberia_negotiations.21.b_tt: "§YМи приймемо ці умови без будь-яких додаткових вимог§!"
  france_iberia_negotiations.21.c_tt: "§YМи погодимось лише на безпечний прохід для морського транспорту§!"
  france_iberia_negotiations.21.d_tt: "§YМи приймемо ці умови лише за умови, що вони погодяться на розміщення іберійських військових баз на їхній території§!"
  france_iberia_negotiations.21.e_tt: "§GМи використаємо наші попередні важелі, щоб змусити їх прийняти іберійські військові бази на їхній території в обмін на наземну підтримку§!"

  france_iberia_negotiations.22.t: "Тема: Морський доступ"
  france_iberia_negotiations.22.desc: "Дипломати Вільної Франції запросили те, що ми очікували від них — доступ до портів і безпечний ескорт до узбережжя південної Франції. Ми готувалися до такої вимоги з початку переговорів, і немає причин відмовляти в такому проханні.\n\nНаша делегація готова підтвердити свою готовність надавати морську підтримку силам Вільної Франції в рамках кампанії з Рекламатії, але деякі наші посадовці вважають, що ми могли б допомогти більш масштабно.\n\nЦі посадовці виступають за те, щоб наша делегація пообіцяла Вільним Французам не лише морську, а й повітряну та наземну підтримку. Це буде ризиковано і прямо залучить іберійські життя у конфлікт. Якщо ми вирішимо надати таку розширену підтримку, то повинні бути готові до можливих наслідків цього рішення."
  france_iberia_negotiations.22.a: "Обіцяємо їм також військову підтримку!"
  france_iberia_negotiations.22.b: "Просто погоджуємось на цю угоду."
  france_iberia_negotiations.22.a_tt: "§YМи обіцяємо Вільним Французам військову підтримку§!"
  france_iberia_negotiations.22.b_tt: "§YМи надамо Вільним Французам безпечний морський прохід§!"

  france_iberia_negotiations.23.t: "Тема: Наземна підтримка"
  france_iberia_negotiations.23.desc: "Після важкої сесії переговорів питання про те, яку підтримку ми будемо зобов'язані надати Вільним Французам, було вирішено.\n\nНа жаль, хоча наша делегація намагалася зменшити зобов'язання, які ми нестимемо під час кампанії з Рекламатії, цього не вдалося. Вільні Французи, прийнявши підвищені відсотки за боргами на попередніх етапах переговорів, здобули важелі, щоб змусити нас погодитися на зобов'язання щодо наземної та повітряної підтримки кампанії.\n\nВ інтересах запобігання зриву переговорів з Вільними Французами ми погодились на цю вимогу, і тепер іберійські життя будуть безпосередньо залучені до кампанії з Рекламатії. Нам доведеться почати готувати армію та повітряні сили до цієї зміни планів."
  france_iberia_negotiations.23.a: "Це прийнятні умови."
  france_iberia_negotiations.23_tt: "§YВільні Французи використали переговори, щоб змусити нас надати їм військову підтримку§!"

  france_iberia_negotiations.25.t: "Обіцянки військових баз від Вільної Франції"
  france_iberia_negotiations.25.desc: "Після багатьох годин обговорень, ми, нарешті, змогли вмовити Вільних Французів дозволити нам розмістити військові бази на їхній території. Це потребувало великих політичних зусиль, обіцянок і компромісів. Спочатку французи рішуче відмовлялися від ідеї надання цих баз, оскільки боялися за своє гегемонію в регіоні і майже були готові вийти з переговорів. Наша первісна пропозиція полягала в простій грошовій допомозі, але цього було недостатньо, оскільки їхньою головною мотивацією залишався реваншизм.\n\nНа щастя, ми запропонували вигідну угоду. Якщо вони дозволять нашим військам перебувати на їхній території, ми надамо їм наземну і повітряну підтримку, коли настане час відновлення Франції. Це значно покращило умови, і після того, як всі дрібниці були вирішені, вони люб'язно погодились.\n\nХоча це дуже вигідно для нашого військового комплексу і розширює наш глобальний вплив, ми ще більше втягнули себе у військову машину Вільної Франції, що, ймовірно, матиме вплив на нашу політику в майбутньому. Однак ми не потрапили в це без очікувань, тож ситуація залишається в межах передбачуваного."
  france_iberia_negotiations.25.a: "Вигідний компроміс."
  france_iberia_negotiations.25_tt: "§GНам обіцяно військові бази на французькій землі в обмін на військову підтримку§!"

  france_iberia_negotiations.26.t: "Вільна Франція відкидає військові бази"
  france_iberia_negotiations.26.desc: "На жаль, Вільні Французи вперто відмовилися від того, що було справедливою угодою. Незважаючи на те, що ми зробили досить щедру пропозицію — надати їм повітряну та наземну підтримку під час їхніх спроб повернути рідну землю, вони вважали, що дозволити нам військову присутність на їхній території — це крок занадто далеко. Їхні побоювання щодо того, що наші бази загрожуватимуть їхній гегемонії в Західній Африці, перемогли їхнє бажання відновити метрополію.\n\nНа щастя для них, вони все одно отримуватимуть нашу підтримку в Середземномор'ї, супроводжуючи їхні кораблі до узбережжя метрополії. Це, здається, влаштувало Вільних Французів, і це все ще дає нам деякі дипломатичні важелі для майбутнього. Хоча й шкода, що вони зірвали наш шанс на посилення військового комплексу, зміцнення зв'язків і подальше розширення, ми все ж створюємо цінного союзника через ці переговори.\n\nОтже, ми продовжимо переговори."
  france_iberia_negotiations.26.a: "Шкода, що так вийшло."
  france_iberia_negotiations.26_tt: "§YМи не будемо надавати Вільним Французам військову підтримку§!"

  france_iberia_negotiations.28.t: "Тема: Міжнародне визнання"
  france_iberia_negotiations.28.desc: "Після того, як питання військових баз було вирішено, делегації перейшли до більш цікавої теми для обох сторін: дипломатії. Без зайвих люб'язностей та підготовки, делегація Вільної Франції виклала кілька вимог, серед яких головною була вимога визнати їх уряд єдиним легітимним урядом Франції. Крім того, якщо ми погодимося на це, вони також вимагали міжнародної підтримки їхньої справи.\n\nМи повинні подумати про наші довгострокові цілі і чи хочемо ми ускладнювати відносини в майбутньому. Хоча це прохання не зруйнує переговори, ми не повинні легковажно ставитися до наших відповідей — все, що ми скажемо, може створити проблеми в дипломатичних відносинах в майбутньому."
  france_iberia_negotiations.28.a: "Погодитись на міжнародне визнання."
  france_iberia_negotiations.28.b: "Не давати жодних обіцянок."
  france_iberia_negotiations.28_a_tt: "§YМи визнаємо Вільну Францію єдиним легітимним урядом Франції§!"
  france_iberia_negotiations.28_b_tt: "§YМи не будемо негайно визнавати Вільну Францію§!"

  france_iberia_negotiations.29.t: "Тема: Невтручання"
  france_iberia_negotiations.29.desc: "Тепер, коли питання військових баз вирішене, обидві делегації готові продовжити переговори і перейти до наступної теми. Вільні Французи запропонували нам досить просту пропозицію: ми не будемо втручатися в їхні справи щодо наслідків Рекламатії, і в свою чергу, подальші переговори будуть дещо простішими.\n\nЗвісно, багато хто готовий погодитись на умови Вільних Французів, але деякі висловили думку, що можна зробити ще один крок уперед. Якщо така низька планка ставиться перед нами, то відносини можуть бути покращені ще більше, якщо ми визнаємо їх міжнародно. Хоча обидва варіанти є позитивними, ми повинні вирішити, наскільки далеко готові йти заради них."
  france_iberia_negotiations.29.a: "Погодитись з пропозицією."
  france_iberia_negotiations.29.b: "Дати їм міжнародне визнання також!"
  france_iberia_negotiations.29_a_tt: "§YМи погоджуємося з принципом невтручання у внутрішні справи Франції§!"

  france_iberia_negotiations.30.t: "Переговори завершено"
  france_iberia_negotiations.30.desc: "Це сталося. Усі ці дебати щодо торгових поступок, військової підтримки та колоніальних претензій призвели нас до цього. Переговори завершено, і ми пообіцяли визнати Вільну Францію та підтримати їхні спроби повернути метрополію. Завдяки нашій швидкій підтримці, мрії французьких вигнанців, безсумнівно, стануть реальністю."
  france_iberia_negotiations.30.a: "Задовільний результат."
  france_iberia_negotiations.30_tt: "§GУгода підписана!§!"

  france_iberia_negotiations.31.t: "Леклер загрожує покинути переговори"
  france_iberia_negotiations.31.desc: "Наші переговори не почалися з найкращим чином. Здається, що наші початкові вимоги — щоб Франція надала нам торгові поступки і дотримувалась наших зовнішньополітичних інтересів — спричинили значне обурення серед членів їх делегації. За їхніми словами, ці умови є \"повністю і цілком неприпустимими\".\n\nЛеклер чітко заявив, що очікує від нас більшого примирення і що якщо тон переговорів не покращиться, він і вся французька делегація негайно покинуть переговори. Звісно, це може бути лише bluff, і ми можемо спробувати побачити, чи справді вони готові реалізувати свої погрози.\n\nАльтернативно, ми можемо спробувати досягти компромісу, зменшивши деякі з наших вимог щодо торгових поступок і погодившись дати їм більшу гнучкість у зовнішній політиці. Нарешті, ми можемо просто відмовитись від цієї справи та перейти до інших тем."
  france_iberia_negotiations.31.a: "Не тискати на це питання."
  france_iberia_negotiations.31.b: "Шукати компроміс."
  france_iberia_negotiations.31.c: "Перевірити їх bluff."
  france_iberia_negotiations.31.b_tt: "§YМи будемо шукати компроміс щодо торгових поступок§!"

  france_iberia_negotiations.33.t: "Вільна Франція здається"
  france_iberia_negotiations.33.desc: "Незважаючи на їхні початкові протесту, ми залишились непохитними у наших вимогах, не відступаючи ані на дюйм. І ця позиція тепер принесла плоди: ми успішно викрили їх bluff, і Вільна Франція погодилася на наші умови без будь-яких зауважень. На практиці це означає, що вони погодяться зі нашою зовнішньою політикою та нададуть нам щедрі торгові поступки, якщо їм вдасться здійснити Рекламатію.\n\nОчевидно, що їхня делегація незадоволена результатом, і атмосфера переговорів значно напружилася. Але на даний момент ми можемо вважати цей етап переговорів повною, непідробною перемогою."
  france_iberia_negotiations.33.a: "Чудово."
  france_iberia_negotiations.33_tt: "§GМи забезпечили обіцянку того, що Франція впишеться в нашу сферу впливу§!"

  france_iberia_negotiations.34.t: "Вільна Франція погоджується з умовами"
  france_iberia_negotiations.34.desc: "Ми зробили це. Після багатьох суперечок з приводу точних деталей, делегація Вільної Франції прийняла наше компромісне рішення. Як би ми не хвалили себе за добре виконану роботу — щось краще, ніж нічого — варто замислитись над тим, що ми досягли.\n\nЦя угода не є ідеальною, ні, і ми поступилися деякими з наших вимог. Але в угоді є торгові поступки від Вільної Франції, що без сумніву буде корисно для іберійської економіки, якщо Рекламатія буде успішною."
  france_iberia_negotiations.34.a: "Переговори можуть продовжитись."
  france_iberia_negotiations.34.a_tt: "§GМи отримали торгові поступки від Вільної Франції§!"

  france_iberia_negotiations.36.t: "Вільна Франція погоджується з умовами"
  france_iberia_negotiations.36.desc: "\"Мабуть, було правильно викрити bluff делегації Вільної Франції. Після того, як ми продовжили тиск, Леклер і його колеги трохи поступилися і погодилися з нашими умовами.\n\nВони заявили про своє намір відмовитись від претензій на наші нині зайняті колоніальні володіння, щоб продовжити переговори, як і очікувалось. Їхня відповідь не була ентузіастичною, але ми повинні очікувати, що вони дотримаються слова. Здається, що зрештою наша підтримка важливіша для них, ніж ще один шматок Африки.\n\nУ майбутніх переговорах ми маємо звернути увагу на те, як французи планують фінансувати свою Рекламатію та відновлення континенту. Це питання може дати цінні результати, якщо ми будемо діяти обережно."
  france_iberia_negotiations.36.a: "Переговори можуть продовжитись."
  france_iberia_negotiations.36.a_tt: "§GВільна Франція обіцяє відмовитись від претензій на наші колоніальні володіння§!"

  france_iberia_negotiations.37.t: "Вільна Франція погоджується на високі відсотки"
  france_iberia_negotiations.37.desc: "Прийшли хороші новини від наших дипломатів, які працюють з делегацією Вільної Франції.\n\nЗгідно з нашими дипломатами, Леклер та його делегація погодилися на більші відсотки по їхніх майбутніх боргах. Це буде велика вигода для іберійської економіки в майбутньому, ми впевнені в цьому.\n\nОднак ця угода не обходиться без умов. В обмін на підвищені відсотки по своїх майбутніх виплатах, Вільна Франція бажає більшої лояльності до їх делегації в наступних етапах переговорів. Швидше за все, нам доведеться поступитися в деяких питаннях в майбутньому. Проте ми повинні вважати це перемогою."
  france_iberia_negotiations.37.a: "Переговори можуть продовжитись."
  france_iberia_negotiations.37.a_tt: "§YВільна Франція може використати ці умови, щоб маніпулювати переговорами на свою користь§!"

  france_iberia_negotiations.38.t: "Вільна Франція погоджується на помірні відсотки"
  france_iberia_negotiations.38.desc: "Невтішні новини надійшли від наших дипломатів, які працюють з делегацією Вільної Франції.\n\nЗгідно з нашими дипломатами, Леклер та його делегація погодились платити лише звичайні відсотки за майбутні виплати. Вони відмовилися змінювати свою позицію з цього питання, і було вирішено, що краще відмовитися від цього питання, аніж ризикувати всіма переговорами.\n\nОднак сьогодні є й хороші новини. В обмін на відмову від підвищених відсотків на майбутні виплати, Вільна Франція погодилася на більшу лояльність до нашої делегації в майбутніх раундах переговорів. Вони погодяться на більш вигідні умови на майбутні теми переговорів, і нам слід розумно використати це важелі. Незважаючи на це, це останнє слово по даній темі."
  france_iberia_negotiations.38.a: "Переговори можуть продовжитись."
  france_iberia_negotiations.38.a_tt: "§GМи можемо використати ці умови, щоб маніпулювати переговорами на нашу користь§!"

  france_iberia_negotiations.40.t: "Переговори наближаються"
  france_iberia_negotiations.40.desc: "Французькі емігранти та ті, хто утримує фортецю вдома, чекають з нетерпінням. План чіткий - і нагадує саму Одіссею. Плисти з Західної Африки, уздовж вигнутих берегів Атлантики, через Середземне море до південного заходу Франції. Є лише одна проблема - камінь, що контролює світ, Гібралтар. Без іберійської згоди пропустити через протоку кілька тисяч солдатів - та бойових кораблів, мрія про повернення Франції може виявитися мертвою на самому початку.\n\nНаступного тижня французькі та іберійські дипломати зустрінуться таємно в Мадейрі, щоб обговорити умови та пункти між двома державами, що дозволять цьому флоту пройти. Хоча історичні суперечності та побоювання щодо відродженої Франції, яка може перевищити Іберію, затінюють ці переговори, атмосфера поки що виглядає загалом дружньою та підтримуючою. Мадрид живе під колосом Німецького Рейху вже майже двадцять років, і можливість зламати нацистське домінування в Європі є дуже спокусливою.\n\nТільки час покаже, чи підуть іберійці на таку великий поворот історії, що досі підтримував Німецьку справу."
  france_iberia_negotiations.40.a: "Маріанна кличе - чи відповість Мадрид?"

  # Події Рекламатії
  france_reclamation.5.t: "Рекламатія наближається"
  france_reclamation.5.desc: "Дивлячись на світову карту, можна б було подумати, що французький дух згас, повністю підкорений нацистським чоботом, який зараз панує над Європою. Все, що залишається видимим від колишнього переможця Великої війни - це низка територій у Західній Африці, які слабко пов'язані з Парижем доданою легендою (ФРАНЦІЯ).\n\nПроте, поглянувши на порт Дакар, можна побачити зовсім іншу картину. Через блискуче море пливуть кораблі всіх типів - фрегати, корвети та есмінці, майже 30-40 років старі, все ще пристосовані до роботи лише завдяки рішучості, разом із сучасними кораблями, свіжими з доків Нового Світу - об'єднані єдиною метою попливти востаннє через узбережжя Африки, через Гібралтарську протоку, повернутися в Середземне море та висадитися на південь Франції.\n\nТі, хто програють, можуть назвати це романтичною дурістю, або впертою неуважністю до реальності. Проте для військ, які тренуються в тимчасових таборах — від змучених 50-річних ветеранів до молодих добровольців, які перетнули Атлантику, щоб визволити землю своїх предків — є лише одне слово для того, що менш ніж за місяць стане, без сумніву, найвеликишою пригодою їхнього життя."
  france_reclamation.5.a: "Рекламатія!"

  france_reclamation.6.t: "Рекламація наближається"
  france_reclamation.6.desc: "Дивлячись на світову карту, можна б було подумати, що французький дух згас, повністю підкорений нацистським чоботом, який зараз панує над Європою. Все, що залишається видимим від колишнього переможця Великої війни - це низка територій у Західній Африці, які слабко пов'язані з Парижем доданою легендою (ФРАНЦІЯ).\n\nПроте, поглянувши на порт Дакар, можна побачити зовсім іншу картину. Через блискуче море пливуть кораблі всіх типів - фрегати, корвети та есмінці, майже 30-40 років старі, все ще пристосовані до роботи лише завдяки рішучості, разом із сучасними кораблями, свіжими з доків Нового Світу - об'єднані єдиною метою попливти востаннє через узбережжя Африки, через Гібралтарську протоку, повернутися в Середземне море та висадитися на південь Франції.\n\nТі, хто програють, можуть назвати це романтичною дурістю, або впертою неуважністю до реальності. Проте для військ, які тренуються в тимчасових таборах — від змучених 50-річних ветеранів до молодих добровольців, які перетнули Атлантику, щоб визволити землю своїх предків — є лише одне слово для того, що менш ніж за місяць стане, без сумніву, найвеликишою пригодою їхнього життя."
  france_reclamation.6.a: "Рекламація!"

  france_reclamation.9.t: "Франція звільнена"
  france_reclamation.9.desc: "Господь був свідком того, що Шарль де Голль ніколи не очікував, що події розгортатимуться саме так. І все ж де Голль був на своїй землі, входячи до столиці серед голосів звільненого народу, майже на дев'ятому десятку свого життя. Це було на чверть століття пізніше, ніж він сподівався, але бути вдома було все, що потрібно для задоволення.\n\nОднак де Голль не був сліпий; він бачив, що столиця постраждала. Нові будівлі були зруйновані, дороги розбомблені, а залишки старих будівель втратили свої деталі. Та все ж люди, що жили в домівках Парижа, незалежно від того, в якому стані ці домівки, виглядали так, наче ніколи раніше не були настільки живими.\n\nТриколор майорів на кожному флагштоку, вивішений на кожному балконі і порозі. Не було жодного свастики, коли де Голль йшов до готелю Матіньон, тимчасової урядової резиденції, серед вигуків захопленого населення.\n\nНа воротах Матіньону стояв пюпітр; хоч він і був порожнім, де Голль негайно почав говорити. Його слова спричинили гучні вигуки: "Ми не будемо приховувати це глибоке та святе почуття. Це миті, які перевищують кожне з наших бідних життів. Франція! Франція розбита, Франція ображена, Франція мучениця, але Франція звільнена!"\n\nЯк тільки люди вигукнули своє схвалення, де Голль продовжив: "Цей обов'язок війни, всі чоловіки, які тут, і всі ті, хто чує нас у Франції, знають, що це вимагає національної єдності. Ми, хто пережили найкращі години нашої історії, не маємо іншого бажання, ніж показати себе, до самого кінця, гідними Франції. Нехай живе Франція!"
  france_reclamation.9.a: "І відповідний вигук прозвучав: "Нехай живе Франція!""

  france_reclamation.10.t: "Франція звільнена"
  france_reclamation.10.desc: "Філіпп Леклерк не наважувався сподіватися на це роками. О, він повторював ці слова та боровся так само, як і будь-хто інший. Але він таємно щипав себе в машині, що в'їжджала в Париж, очікуючи, що прокинеться в Дакарі чи Конакрі і це все буде лише сном. Але це не був сон. Франція була вільною.\n\nЛеклерк не витрачав часу на сентиментальність; робота мала бути виконана, і звільнення нації завершено. Першочергово він звернувся до керівників Опору та генерального штабу. Що ж до промови, хоча люди мали повне право бути радісними, це була б дурість - хвилювати їх емоціями, коли вони мали негайно дізнатися, що буде далі.\n\n"Люди Франції!" Після звичних слів привітання Франції, він перейшов до важливого. "У найближчому майбутньому план полягає в наступному. Пріоритет буде віддано відновленню та зміцненню держави від підривної діяльності Німеччини, але вибори відбудуться дуже швидко." Люди аплодували час від часу, і він дозволяв їм це; все-таки це було справедливо за таких обставин.\n\n"Тепер я попрошу хвилину мовчання, а потім помолитися за тих, чия жертва дозволила Франції бути вільною." Коли це було зроблено, Леклерк поспішив покинути місце; у нього було дуже мало часу для того, що він чекав більше двадцяти років - побачити свою дружину і дітей знову. Він впав на коліна і прошепотів молитву, коли офіцер увійшов з новиною, що вони в безпеці.\n\nВін побачив їх у кімнаті готелю Матіньон і побіг, щоб обійняти їх, скинувши свою звичну стриманість. Саме тоді він зрозумів, що Франція дійсно вільна."
  france_reclamation.10.a: "Вітаємо, пане Президенте."

  # Новини
  FFRnews.1.t: "[Get_newspaper_header]Рекламатія Франції"
  FFRnews.1.desc: "Якщо повідомлення вірні - і лише якщо - новини, що сьогодні вибухають з Європи, є справді історичними. У 1815 році Наполеон Бонапарт повернувся до Парижа та оголосив себе імператором знову; тепер цього разу [FRA_GetGeneralTitle] [FFR.GetLeader] висадився на береги Франції. Цей колосальний поворот долі слідує за неймовірною перемогою Франції в Західній Африці. Багато хто очікував, що вони будуть знищені, але емігранти змогли розгромити та окупувати своїх ворогів. Тепер, здається, вони спрямували свої погляди на свою кінцеву мету: рекламацію французької материкової частини.\n\nПовідомлення про узгоджені повстання Опору і хаос вже прокотилися по Метрополії, немислиме відбувається прямо на їхніх очах. Підтверджено висадку десантних суден на французьких пляжах, а еміграційні сили готуються рухатись вглиб країни, щоб повалити режим. Незважаючи на те, наскільки це малоймовірно і дивно, світ прокидається у новій реальності: Вільна Франція не мертва."
  FFRnews.1.a: "Що вони роблять?!" # GER
  FFRnews.1.b: "Двадцять років привели до цього!" # FFR
  FFRnews.1.c: "Це все залежить від цього." # FRS
  FFRnews.1.d: "Це був просто перемир'я на двадцять років." # Решта світу

  FFRnews.2.t: "[Get_newspaper_header]Рекламатія Франції"
  FFRnews.2.desc: "Той крихкий мир, що панував над Європою, розколовся найімовірнішим способом. У 1960 році французька еміграційна держава, що розташувалась на узбережжі Золотого Берега в Африці, здавалася такою крихкою - доля втручалася на їх користь в найбільш грандіозний спосіб.\n\nПісля перемоги у Західноафриканському конфлікті, емігранти звернули погляд на рекламацію материкової частини. Хоча примирення між двома смертельними ворогами завжди було малоймовірним, відсутність будь-яких спроб переговорів здивувала всіх. У радіоефірі [FRA_GetGeneralTitle] [FFR.GetLeader] пообіцяв "повалити зрадників у Метрополії" і "позбутися понад двадцяти років приниження", зазначивши, що це буде зроблено "невідступною силою", якщо потрібно. Повідомлення про десантні судна, що висаджують війська по всій Франції, за якими йдуть узгоджені повстання Опору, тепер підтверджено. Здається, Франція не буде спокійно спати цієї ночі."
  FFRnews.2.a: "Якщо вони хочуть ступити на французьку землю, нехай помруть на її пляжах." # FRS
  FFRnews.2.b: "До зброї, громадяни! До зброї!" # FFR
  FFRnews.2.c: "Війна прийшла до Франції, тепер у вигляді брата." # Решта світу
  FFRnews.2.d: "Що вони роблять?!" # GER

  FFRnews.3.t: "[Get_newspaper_header]Відновлена Французька Республіка!"
  FFRnews.3.desc: "\"Імперія, довго розділена, повинна об'єднатися; імперія, довго об'єднана, повинна поділитися. Так було завжди\". Китайський письменник Ло Гуанчжун міг говорити про Китай під час його стародавніх кровних ворожнеч, але схоже, що цей вислів не втратив свого змісту. Сьогодні з'явилися неймовірні новини. Перемовини між Парижем і силами Вільної Франції призвели до угоди про примирення в рамках відновленої Французької Республіки.\n\nУ Франції вибухнули захоплені святкування і імпровізовані вуличні вечірки, коли цивільне населення святкує запобігання війни і об'єднання Франції, не затьмарене війною та окупацією. Вигнані солдати та техніка заполонили материк - але не як вороги, а як давно втрачені брати, що знову зустрілися. [FRA_GetReconciliationText]"
  FFRnews.3.a: "Війна не знайде своєї здобичі у Франції."
  FFRnews.3.b: "Французів треба захищати від їх власних імпульсів."

  FFRnews_degaulledeath_1: "Поки Франція святкує під тінню миру, рештки Шарля де Голля були повернуті на батьківщину, яку він так довго жадав. Приватна похоронна церемонія відбудеться в його рідному місті Коломбей-ле-Deux-Еglises."
  FFRnews_degaullealive_1: "Генерал Шарль де Голль повернувся на материк на чолі своїх військ, майже напевно, щоб бути зустрічаним обожнюванням свого народу."

  FFRnews.4.t: "[Get_newspaper_header]Марсельська угода"
  FFRnews.4.desc: "Новини з Парижа увійдуть в історію як одна з визначних подій у французькій історії. Антуан Пінай, президент Французької Республіки, оголосив, що всі військові дії проти вигнаних французьких сил на Золотому Березі припиняються. Крім того, стало відомо, що перемовини між Республікою та вигнанцями увінчалися успіхом, і президент офіційно оголосив про їх примирення.\n\nЦей історичний поворот шокував не лише франкомовний світ, а й увесь світ. Тепер треба вирішити, як інтегрувати вигнані сили, що повертаються на материк, і як з ними впоратися в Африці. І досі неясно, як і в якій мірі ці землі будуть поглинені Четвертою Республікою — і як вона буде розбиратися з тими, хто боїться повернення старого колоніального порядку."
  FFRnews.4.a: "Франція повертається на світову арену."

  FFRnews.5.t: "[Get_newspaper_header]Рекламатія Франції"
  FFRnews.5.desc: "Хоча французька держава не могла повірити, що їх ситуація може погіршитися, тепер це сталося. Підтверджено повідомлення про масову десантну операцію, що висадилася на французькому узбережжі — з єдиною метою: безумовної капітуляції всіх сил Метрополії. Цей несподіваний напад не з боку якогось чужого ворога — а з майже забутого куточка Африки. Вигнані французькі сили, що складаються з людей, які відмовилися здаватися після блицкрігу 1940 року.\n\nУ радіоефірі [FRA_GetGeneralTitle] [FFR.GetLeader] закликав громадян материка взятися за зброю на підтримку Французького комітету національного визволення. Попри випадкове відновлення, багато хто сподівається - або боїться - що тепер лише питання часу, коли Франція повернеться до старого порядку, якого колись позбулася."
  FFRnews.5.a: "Франція буде об'єднана. В будь-якому разі."

  FFRnews.6.t: "[Get_newspaper_header]Рекламатія Франції"
  FFRnews.6.desc: "Мир у Франції тривав лише мить. Лише те, що французькому народу довелося покласти зброю після їх кривавої громадянської війни, війна знову прийшла на їх береги. Великі, хоча й організовані хаотично армада висадили на французькі береги загарбників, яких насправді є французи.\n\nЩо не можна трактувати інакше як повний шок для міжнародної спільноти, армії Вільної Франції вирушили з їхнього куточка Африки і почали кампанію по поверненню на батьківщину. Маючи західну Африку, тепер під контролем вигнанців, вони повернули погляд на свою первісну мету: відвоювання материка. Вже зараз метрополія Франції знову охоплена панікою, адже їх виснажені та втомлені сили тепер повинні змагатися з людьми, які чекали цього моменту понад 20 років."
  FFRnews.6.a: "Якщо вони прагнули миру, то повинні були підготуватися до війни."
  FFRnews.6.b: "Їх треба знову розбити."
  FFRnews.6.c: "Брат проти брата, вдруге."

  FFRnews.7.t: "[Get_newspaper_header]Ліонська угода"
  FFRnews.7.desc: "Фратерніté, один з основних принципів старої Французької Республіки, і те, що багато хто вважав назавжди втраченим між французьким материком і вигнаними французами. Сьогодні це переконання було розбите, оскільки обидві сторони погодилися залишити свої різниці позаду.\n\nБуло погоджено, що нова держава стане сучасною і демократичною конституційною монархією, з королем Генріхом VII на чолі держави, а монархія стане символом національної єдності.\n\nНавіть [FRA_GetGeneralTitle] [FRS.GetLeader] показав свою підтримку монархії, нібито вбачаючи це як необхідний компроміс, щоб запобігти подальшим жертвам.\n\n[FRA_GetReconciliationText2]"
  FFRnews.7.a: "Фратерніté серед французів!"
  FFRnews.7.b: "Французи обрали розпад."
  FFRnews.7.c: "Дивний результат."

  FFRnews_degaulledeath_2: "На жаль, для багатьох, генерал де Голль не дожив до того часу, щоб побачити свою країну знову. Підготовка до поховання в його рідному селі розпочалася одразу після завершення перемовин, церемонія стала маленькою та приватною подією."
  FFRnews_degaullealive_2: "Генерал де Голль сам повернувся до Франції на минулому тижні і був помічений поруч з королем."

  FFRnews.8.t: "[Get_newspaper_header]Вільна Франція визнана Іберією"
  FFRnews.8.desc: "Шок пронісся через європейський континент сьогодні, після того як уряд Іберійського Союзу оголосив про своє намір визнати уряд вигнанців [FRA_GetGeneralTitle] [FFR.GetLeader] як «легітимний уряд Франції». Цей дипломатичний зсув завершує тижні таємних перемовин між представниками Союзу та французькими вигнанцями. Виступ був у формі спеціальної телевізійної промови до нації, в якій цей крок був представлений як «економічна, військова та моральна необхідність».\n\nХоча офіційні особи в Парижі та Германії швидко засудили цей крок, інші залишилися надто приголомшеними, щоб відповісти. З огляду на несподівані успіхи Вільної Франції в Західній Африці, багато хто задається питанням, чи може це оголошення стати початком чогось більшого і чи є приховані пункти в угоді."
  FFRnews.8.a: "[FRA_GetLastName] наближається великими кроками, але він ніколи не увійде в Париж..."
  FFR_deGaulle_name: "Де Голль"
  FFR_Leclerc_name: "Леклерк"

  FFRnews.9.t: "[Get_newspaper_header]Перемовини між Вільною Францією та Іберією завершилися"
  FFRnews.9.desc: "Лише кілька років тому де Голль та його війська в Західній Африці здавалися приреченими бути забутими світом. Багато хто вважав, що ізольована та без союзників держава, постійно під атакою Люфтваффе, незабаром вичерпає свої ресурси. Але лише через кілька років Вільна Франція стала основною силою в регіоні. Тому не дивно, що весь світ почав проявляти до неї інтерес.\n\nІберія стала другою великою країною, що визнала Вільну Францію, і останні кілька тижнів вела серію таємних перемовин з вигнанцями. Перемовини завершилися вчора, і хоча ніхто точно не знає, що було обговорено, обидві держави залишилися задоволені і доброзичливі після цих зустрічей. Багато хто тепер теоретизує про нове дружнє партнерство між обома державами, хоча деталі цього ще неясні."
  FFRnews.9.a: "Вільну Францію не забули."

  FFRnews.10.t: "[Get_newspaper_header]Шарль де Голль помер"
  FFRnews.10.desc: "Сьогодні більшість Франції оплакує смерть Шарля де Голля, колишнього лідера Вільної Франції з моменту падіння Франції в 1940 році, який помер у своїй резиденції від раптової аневризми. Чоловік, який понад два десятиліття очолював вигнану Францію в далекій Західній Африці, помер не забутим, як багато хто очікував, а як шанована та шанована постать в своїй країні і по всьому світу.\n\nЙого належні похорони були маленькою та приватною подією серед родини та близьких, але решта нації оплакувала його на вулицях. Мільйони французів віддали шану Лє Генералю, коли шок охопив націю до самого ядра. Незважаючи на те, що частина нації все ще ставиться до нього з неприхильністю або презирством через різні причини, більшість вибрали дати решті нації змогу відновити свої сили після цієї новини."
  FFRnews.10.a: "Кінець епохи."

  FFRnews.11.t: "[Get_newspaper_header]Францію повернуто!" # де Голль
  FFRnews.11.desc: "Нещодавня жорстока війна у Франції завершилася з повною капітуляцією всіх решток попереднього режиму та інших повстанців. Сили Вільної Франції - завдяки підтримці, яку вони отримали від широкої міжнародної коаліції, а також завдяки їхній рішучості, відвазі та силі, забезпечили контроль над усією французькою метрополією.\n\nЩо колись вважалося втраченим у глибинах історії, Вільна Франція витримала всі труднощі, щоб завершити те, що вони почали більше двадцяти років тому. Їхній довготривалий лідер, генерал Шарль де Голль, створив тимчасовий уряд з військових, політичних партій, які мають дружні стосунки, та колабораціоністів, а також багатьох прихильників Руху Опору на материковій частині. Обіцяно провести вибори найближчим часом, коли ситуація на материк обстановиться."
  FFRnews.11.a: "Ці чудові виродки!"
  FFRnews.11.b: "Ці новачки краще подумають, що вони роблять..."
  FFRnews.11.c: "Віве ле Генерал, і віве ла Франс!"
  FFRnews.11.d: "Вогонь французького опору не можна було загасити."

  FFRnews.12.t: "[Get_newspaper_header]Францію повернуто!" # Леклерк
  FFRnews.12.desc: "Світ сьогодні спостерігав за шоком та радістю, коли Філіпп Леклерк офіційно оголосив про поразку всіх інших сил у Франції, залишивши довго вигнані сили Вільної Франції безсумнівними господарями більшої частини своєї батьківщини. Країни по всьому світу вже скористалися можливістю оголосити визнання нового уряду. Тим часом Німеччина утрималася від публічної заяви.\n\nСтарі військові союзники, нові колабораціоністи і навіть члени Французького Руху Опору тепер є частиною нового тимчасового уряду, який пообіцяв організувати вільні вибори найближчим часом. Однією з перших дій уряду стало перенесення останків Шарля де Голля до Франції, щоб він міг бути похований у рідному селі поряд з його померлою донькою, згідно з його останньою волею."
  FFRnews.12.a: "Віве ла Франс Лібре!"
  FFRnews.12.b: "Ми вже перемогли їх одного разу. Вони не є загрозою."
  FFRnews.12.c: "Найбільш несподіваний розвиток подій."

  FFRnews.13.t: "[Get_newspaper_header]Шарль де Голль помер"
  FFRnews.13.desc: "Французький [FRA.FRA_GetLeaderTitle], генерал і національний герой [FRA.GetNameDef], Шарль де Голль, помер сьогодні від аневризми у своєму офісі в Hôtel Matignon; Жак Шабан-Дельмас, новообраний [FRA.FRA_GetLeaderTitle], оголосив про тиждень жалоби, а також буде проведена велика національна процесія, під час якої останки де Голля будуть перенесені до його рідного села Коломбей-ле-Дез-Егліз, щоб бути похованими поряд з його померлою донькою, Анною, згідно з його останньою волею. Вулиці були заповнені людьми, які віддавали шану своєму національному спасителю, поки процесія рухалася через французьку сільську місцевість.\n\nХоча патріотизм де Голля і його залізна воля не підлягають сумніву, його спадщина залишається спірною темою навіть серед країн ОВН, де його історія авторитаризму, ймовірно, буде предметом обговорення впродовж десятиліть."
  FFRnews.13.a: "Спочивай у мирі, старий лев, твій обов'язок виконано." # ОВН
  FFRnews.13.b: "Один партієць мертвий, наступний на черзі." # Пакт
  FFRnews.13.c: "Франція стала вдовою." # ОВН

  FFRnews.14.t: "[Get_newspaper_header]Де Голль обраний [FRA.FRA_GetLeaderTitle] Франції"
  FFRnews.14.desc: "Як і очікувалося, герой Вільної Франції Шарль де Голль був обраний [FRA.FRA_GetLeaderTitle] Франції з величезною перемогою. Після своєї насиченої військової кар'єри де Голль вирішив перетворити свою велику популярність на політичну платформу, основану на всеосяжних планах з відновлення розореної нації, перегляду старої конституції, відновлення її світового становища та «витягнення Франції з історичної ями».\n\nКритикують генерала за «бонапартізм» і спроби створити «імперське президентство», але їх набагато менше, ніж величезна хвиля популярності, якою користується платформа Ґоллістів."
  FFRnews.14.a: "Генерал переходить у політику."

  FFRnews.15.t: "[Get_newspaper_header]Шабан-Дельмас обраний [FRA.FRA_GetLeaderTitle] Франції"
  FFRnews.15.desc: "Жак Шабан-Дельмас, колишній член Руху Опору та спадкоємець спадщини де Голля, був обраний [FRA.FRA_GetLeaderTitle] Франції сьогодні на виборах, які продемонстрували постійну популярність платформи Ґоллістів у нації.\nОбіцяючи реформи, позначені обережним і консервативним контролем, а також продовження відновлення «всіх територій французької нації, які були пошкоджені під час окупації», міжнародні спостерігачі зауважили, що це, здається, є постійною зміною на французькому політичному ландшафті."
  FFRnews.15.a: "Вірний до кінця - але до людей, чи до де Голля?"

  FFRnews.16.t: "[Get_newspaper_header]Лекануєт обраний [FRA.FRA_GetLeaderTitle] Франції"
  FFRnews.16.desc: "Сьогодні сталася несподівана поразка у Франції, коли Жан Лекануєт був обраний [FRA.FRA_GetLeaderTitle], виступаючи з платформою, що різко контрастувала з платформою його колишнього соратника Шарля де Голля. Спираючись на економічний лібералізм, Лекануєт все ж запевнив публіку в своїх промовах, що він буде підтримувати та розширювати підтримку відновлення, загального добробуту та допомоги бідним.\nЯк видатний атлантист, Лекануєт також виступав за тісніші відносини з США, пориваючи з традицією Франції як великої незалежної світової держави."
  FFRnews.16.a: "Нова хвиля для Франції - побачимо, чи зможуть вони на ній триматися."

  FFRnews.17.t: "[Get_newspaper_header]Мендес Франс обраний [FRA.FRA_GetLeaderTitle] Франції"
  FFRnews.17.desc: "У шокуючому повороті, якого мало хто очікував, П'єр Мендес Франс — найбільш суперечливий з французьких вигнанців і лідер лівих сил — був обраний [FRA.FRA_GetLeaderTitle] після напруженої боротьби, в результаті якої Мендес Франс зміг об'єднати різнорідні соціалістичні, комуністичні та інші ліві течії країни.\nБудучи проти Ґоллізму та французької присутності в Західній Африці, новий [FRA.FRA_GetLeaderTitle] тепер намагається використовувати відновлення нації як платформу для виведення лівих поглядів у політичний основний потік у традиційно консервативній країні."
  FFRnews.17.a: "Червона пляма на сірій скатертині..."

  FFRnews.18.t: "[Get_newspaper_header]Вільні французькі вигнанці зазнали поразки"
  FFRnews.18.desc: "Після краху зусиль з відновлення метрополії, новини з Західної Африки підтвердили найгірше — Вільна Франція більше не існує. Наполегливо прагнучи відновити Республіку у Франції, сили Вільної Франції вичерпали себе, а рухи за незалежність у колишніх колоніях — зокрема в Кот-д'Івуарі, серці цього руху — паралізували уряд у вигнанні до непоправного стану.\nЗі зруйнованим командним апаратом французьких сил, настав час для того, щоб французький триколор у його оригінальній формі був опущений востаннє."
  FFRnews.18.a: "Трагедія нації, приреченої на історію."

  FFRnews.19.t: "[Get_newspaper_header]Франція та Африка вступають до Організації Вільних Націй"
  FFRnews.19.desc: "Велика перемога для Організації Вільних Націй — нещодавно відновлена нація Франція, а також кілька західноафриканських країн, що приєдналися до неї, сьогодні офіційно були прийняті до альянсу. Т crowds у Парижі святкували цей крок разом з відновленням, в той час як настрій у Західній Африці був відзначений як більш стриманий — дипломати підкреслили, що це рішення було зумовлено виключно геополітичними інтересами.\n\nНімецька Рейх поки що не відповіла повністю, але тривожні ознаки свідчать про те, що пошук Парижем захисту від своїх східних кордонів був мудрим рішенням. Токіо засудив цей «неоколоніалістичний» крок і пообіцяв підтримати дії проти нього."
  FFRnews.19.a: "Свобода, братерство, рівність..."

  FFRnews.20.t: "[Get_newspaper_header]Вступ Франції до Організації Вільних Націй"
  FFRnews.20.desc: "Вражаючий поворот established європейського порядку — нещодавно відновлена нація Франція, народжена з уламків довоєнного уряду у вигнанні, сьогодні була офіційно прийнята до Американо-очолюваної Організації Вільних Націй. Вражаючі натовпи у Парижі зібралися у масових, імпровізованих групах та святкували новину, махаючи триколоровими прапорами.\n\nНімецька Рейх поки що не відповіла повністю, але тривожні ознаки свідчать про те, що пошук Парижем захисту від своїх східних кордонів був мудрим рішенням. Ця подія означає відновлення трансатлантичного партнерства після майже 40-річної перерви."
  FFRnews.20.a: "Свобода, братерство, рівність..."

  # Відновлення
  POLITICS_CHARLES_DE_GAULLE_MAINLAND: ""Франція програла битву, але Франція не програла війну!"\n\nТак сказав Шарль де Голль у Лондоні багато років тому. Хоча він був одним із небагатьох, хто стримував німців під час їхнього вторгнення в його любу батьківщину, його кар'єра справжнього почалася й продовжувалася в еміграції. Він дожив до того моменту, щоб побачити, як Франція падала не один раз, а двічі: спочатку перед безсоромними, нелюдськими нацистами та зрадницьким демоном Петеном, а потім перед негідними колабораціоністами Віші. Меч Франції впав, і де Голль підняв уламки.\n\nВін постарів у вигнанні. Його родина, дім, який він залишив у Коломбей-ле-Deux-Егліз, його народ — французький народ, за який він завжди боровся: відсутність і страждання цих цінних речей мучили його довгий час. Але він не зламався; він ніс зламаний меч більше двох десятиліть, і тепер, завдяки простої силі волі та рішучості, він переплавив його у вогнях пекла, через яке він пройшов. Повернувшись, щоб звільнити свій народ, він став новим Наполеоном, новим Святим Людовиком, героєм свого народу і Вільного Світу, людиною, яку пам'ятатимуть на віки!\n\nОтже, Шарль де Голль повертається на свою батьківщину — яку за милістю свого люблячого Бога він сам зміг визволити — і падає на коліна. Він промовляє стародавні слова: "Тепер ти відпускаєш раба твого, Господи, за твоїм словом у мирі." Він зітхає, і сльози радості котяться з його очей. Так має бути; зрештою, Франція, хоч і обурена, зламана та мученицька, була визволена, і таким чином\n\n§iТУТ§! §WЕСТ§! §VАКОМПЛІ.§!
  POLITICS_PHILIPPE_LECLERC_MAINLAND: "Протягом усього свого дорослого життя Філіп Леклерк боровся. Від пагорбів та окопів Арденн у відповідь на несподівану гру, до серця Африки, де він боронився від зрадників та сепаратистів, і нарешті до самої Франції, Філіп Леклерк дозволив війні визначати його, борючись з смертельними небезпеками за Республіку, і навіть у поразці, ніколи не здаючись.\n\nУ цій боротьбі він втратив величезну, величезну суму. Його родина, в’язням якої було не уникнути, разом з його домом та всім його життям. В Африці він втратив великі ділянки молодих чоловіків, що купували час для себе та американців. І в кінцевому рахунку, Шарль де Голль, не на полі бою, а в старості, сам серце і провідник надії всіх французьких вигнанців, що одного дня жорстока поразка перед Німеччиною буде помщена.\n\nІ все ж ця надія не була марною. Виходячи з останніх засад де Голля, і під час фінальної ганьби та довгоочікуваного колапсу Віші, вдалося вирватися з вигнання назад на батьківщину. Нарешті, він може залишити те, що, можливо, визначало його, і повернутися додому до своєї родини та країни. Нарешті, старий солдат може відпочити."

  POLITICS_FRANCE_CHABAN_DELMAS: "З визволенням Франції тепер складне завдання з відновлення країни та реалізації ідеалів Шарля де Голля лягає на плечі Жака Шабан-Дельмаса.\n\nЯк частина нової хвилі голлістських політиків, Шабан-Дельмас легко піднявся по сходах завдяки своїм зв'язкам з CFLN та Жоржем Помпіду та його близькості до де Голля та Леклерка.\n\nОднак це не єдина кваліфікація Шабан-Дельмаса, далеко не єдина: він був першим національним опором, який приєднався у 1940 році, він проник у Міністерство національного виробництва Віші під прикриттям. Коли це прикриття було розкрито, йому вдалося втекти і приєднатися до де Голля в Лондоні. З того часу Шабан-Дельмас слідує концепції Ліберації Генерала, додаючи особистий штрих: соціальний прогресивізм і реформи. Це програма, яку він реалізуватиме, очоливши націю, і він не зупиниться, поки не досягне успіху."
  POLITICS_FRANCE_LECANUET: "З визволенням Франції тепер складне завдання з відновлення країни лягає на плечі Жана Леканю.\n\nЧлен французького Опору з 1943 року, Леканю важко і швидко працював, щоб врятувати євреїв від неминучої смерті. Після втрати Великої Британії він втік до Вільної Франції і дуже рано вступив у контакт з Організацією Вільних Націй. Одним із основних впливів, які OFN мали на нього, було натхнення копіювати медіа-методи, що використовуються американськими президентами, саме тому його часто називають 'Кеннеді Франції'. Водночас він став надійним атлантистом, але з власним особистим підходом, що полягає у наполяганні на рівноправному партнерстві для Франції.\n\nХоча він є прихильником основних ідеалів Опору, Леканю засудив Шарля де Голля як надмірно диктаторського в його методах. Замість того, щоб дотримуватися голлізму, як Шабан-Дельмас, він надає перевагу економічному лібералізму та побудові ринкової економіки з посиленою соціальною підтримкою. Його завдання буде важким, але він не потерпить невдачі і не зупиниться в його виконанні."

