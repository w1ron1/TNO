GER_BOR_dont_join_wars_please: "Особлива ситуація"

france_reclamation.7.t: "NYT: Франція, Західна Африка приєднуються до ОВН"
france_reclamation.7.desc: "НЬЮ-ЙОРК—У події, яка не є несподіванкою, але має глибокі геополітичні наслідки, дипломати, що представляють Французьку Республіку та Західноафриканську Федерацію, прибули до Нью-Йорка, щоб подати офіційні заявки на вступ до Організації Свободних Націй. Представники двох майбутніх членів виголосили промови в ретельно організованій послідовності.\n\n"Ми сьогодні прийшли, щоб підтвердити нашу відданість принципам демократії та представницького уряду," сказали представники Західноафриканської Федерації в промові, перекладеній з їхньої рідної французької мови. "Лише через координацію з однодумними націями ми можемо зберегти безпеку нашого народу."\n\nЦі слова були підтверджені П'єром Мендесом Франсом, французьким чиновником. У своїй довгій і заплутаній промові Франс висловив відданість нації "невмирущій боротьбі за свободу перед обличчям гніту, наполегливості перед обличчям десятиліть жорстокості".\n\nЗаявки мають бути проголосовані наступного тижня. Хоча нові кандидати в ОВН повинні технічно бути прийняті всіма членами, цей процес став формальністю в останні роки, де більшість рішень щодо членства диктуються Сполученими Штатами.\n\nПідкреслюючи цей факт, Президент [GetPresidentLastName] привітав представників Західноафриканської Федерації та Французької Республіки одразу після їхніх промов. Спілкуючись з пресою, Президент пообіцяв, що ОВН збережуть "світло свободи" на всій Європі та Африці.\n\nНевідкладне приєднання Франції та Західної Африки до Альянсу спричинило осуд з боку Німеччини, Японії та країн, що є їхніми союзниками. Хоча німецькі чиновники оголосили про нові військові навчання поблизу кордону, японський уряд виступив із заявою, що критикує "безвідповідальні та дестабілізуючі акти агресії з боку деяких націй...""
france_reclamation.7.a: "Дух Свободи охоплює три континенти."

france_reclamation.8.t: "NYT: Франція приєднується до ОВН"
france_reclamation.8.desc: "НЬЮ-ЙОРК—У події, яка не є несподіванкою, але має важливі геополітичні наслідки, дипломати, що представляють Французьку Республіку, прибули до Нью-Йорка, щоб подати офіційну заявку на вступ до Організації Свободних Націй. Стоячи в залі Ради Безпеки ОВН, приміщенні, яке зазвичай використовується для високорівневих зустрічей, французькі представники виголосили промову, закликаючи до їхнього прийому.\n\n"Франція сьогодні є нацією, що звільнилася від ланцюгів фашизму. Сьогодні ми робимо вирішальний крок у відновленні нашої незалежності, свободи та суверенітету від тих, хто намагався позбавити нас цього," сказав П'єр Мендес Франс, виголошуючи свою промову рідною французькою мовою.\n\n"Ми не дозволимо, щоб європейський континент згаснув знову. Світло свободи не повинно згасати на цій землі."\n\nЗаявки мають бути проголосовані наступного тижня. Хоча нові кандидати в ОВН повинні технічно бути прийняті всіма членами, цей процес став формальністю в останні роки, де більшість рішень щодо членства диктуються Сполученими Штатами.\n\nПідкреслюючи цей факт, Президент [GetPresidentLastName] особисто привітав представників Французької Республіки одразу після їхніх промов. Після того, як зробили фотографії з дипломатами та прийняли невелику сумку з піском, маленький шматок берега, де сили Свободної Франції висадилися, Президент звернувся до преси. [USA.GetSheHeCap] говорив про довготривалі зв'язки між Францією та Сполученими Штатами.\n\nПрезидент візьме участь у вечері, яку влаштує Французьке посольство, щоб відзначити повернення "колиски свободи" до вільного світу.\n\nНевідкладне приєднання Франції до Альянсу викликало швидку реакцію протестів від німецького уряду. Вони засудили французький уряд як нелегітимний та критикували уряд Сполучених Штатів за "акти агресії". Очікується, що військові навчання поблизу кордону зростуть, оскільки напруга зростає..."
france_reclamation.8.a: "ОВН стає яскравішим, Третій Рейх темнішає."