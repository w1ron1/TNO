  # Ідеї
  FFR_military_administration: "Військова адміністрація"
  FFR_military_administration_desc: "Наша поточна ситуація змусила Шарля де Голля поставити під військовий контроль більшість нашої території. Генерали можуть підтримувати дружні стосунки з місцевими лідерами та вождями, отримуючи доступ до їхніх особистих військ. Хоча це ефективний метод, це перешкоджає нам знати, що відбувається в решті країни, і залишає велику кількість влади в руках наших генералів."
 
  FFR_military_administration_2: "Військова адміністрація"
  FFR_military_administration_2_desc: "Війна прийшла до Вільної Франції.\n\nНаші кордони зазнали облоги, наші солдати марширують, і наша держава починає мобілізуватися проти наших ворогів. Генерали та офіцери військової адміністрації зосередилися на управлінні та зменшенні внутрішніх проблем держави, що забезпечить ефективне підтримання та контроль за територією, яка знаходиться в нашому володінні."
 
  FFR_military_administration_3: "Військова адміністрація"
  FFR_military_administration_3_desc: "Французи йдуть вперед.\n\nВійськова адміністрація завдяки своїм зусиллям з управління внутрішніми справами забезпечила ефективне функціонування нашої нації як смертоносної та добре налагодженої машини. Тепер ця машина в їхніх руках, і вони спрямовуватимуть її до нашої більшої мети.\n\nНаша перемога вже близька."
 
  FFR_precious_metal:0 "Експорт коштовних металів"
  FFR_precious_metal_desc:0 "Хоча наша економіка може бути зруйнована, а інфраструктура знищена, ми все ще можемо експлуатувати наші рудники. Хоча сталь не експортується через свою критичну важливість для підтримки нашого обладнання, ми можемо все ж експортувати цінні золото та боксит охочим покупцям."

  FFR_spirit_french:0 "Дух Французької Республіки"
  FFR_spirit_french_desc:0 "В існуванні Вільної Франції дух наших давніх демократичних традицій все ще живе. Хоча наша збройна рука на континенті досі є Резистансом, навіть тут, у глибинах землі Затоки Святого Лаврентія, ми все ще боремося за наші ідеали. Через Лінію Комети, вигнанці були відправлені сюди з Франції та Бельгії, вірячи в безмежну силу демократії та свободи, борючись за свою країну навіть через океани."

  FFR_tomb_republic: "Гробниця Французької Республіки"
  FFR_tomb_republic_desc: "Після їх невдалої війни в Західній Африці останні рештки Вільної Франції зводяться до того, що займають самотній острів Кергелен.\n\nКергелен — це маленька земельна маса, позбавлена стратегічної цінності та військових ресурсів. Тепер немає надії повернути материк для вигнанців, і як Наполеон на Святій Острівці, останні залишки Вільної Франції тепер можуть лише чекати, поки смерть забере їх."

  FFR_the_reclamation: "Відновлення"
  FFR_Reclamation_DynamicModifier: "Відновлення"
  FFR_the_reclamation_desc: "§FDivision Organisation: [?FFR_Reclamation_Modifier_army_org_factor|1%+=]\nNon-Combat Out of Supply Penalties: [?FFR_Reclamation_Modifier_out_of_supply_factor|1%-=]\nDivision Recovery Rate: [?FFR_Reclamation_Modifier_army_morale_factor|1%+=]\nWar Support: [?FFR_Reclamation_Modifier_war_support_factor|1%+=]\nDivision Defense: [?FFR_Reclamation_Modifier_army_defence_factor|1%+=]\nPlanning Speed: [?FFR_Reclamation_Modifier_planning_speed|1%+=]\n--------------§!\nТе, що наші вороги, дезертири і навіть союзники вважали неможливим, нарешті відбувається. Наші війська висаджуються на узбережжі Франції! Ми більше не є залишковою державою, яку тримають живою лише тяжінням наших колишніх колоній, серцями наших людей та гострим розумом нашого лідера, ми — визволителі Франції!\n\nМи не маємо ілюзій, що це не ситуація "все або нічого", якщо ми зазнаємо поразки, все буде втрачено, але якщо ми здобудемо перемогу, наші люди збиратимуть плоди своєї праці. Старі повернуться до своїх родин і друзів, а молоді старітимуть і помиратимуть на своїй рідній землі. Їхні втомлені очі будуть вільно споглядати красу Парижа і Сени, скільки завгодно."

  FRD_aiding_the_reclamation: "Допомога в відновленні"
  FRD_aiding_the_reclamation_desc: "Після ретельного обговорення нашими силами ми вирішили дозволити Вільним Французам висадитися на території, яку ми контролюємо. Це принесло не лише додаткові сили та допомогу в боротьбі з незаконним урядом Віші, але й підвищило мораль наших військ та громадян. Однак ця допомога також привернула небажану увагу з боку США та Німеччини, підвищивши ставки на можливість нашої перемоги."
  
