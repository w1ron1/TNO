  ## більше старих речей ##
   # Персонажі
  FFR_Charles_de_Gaulle: "Шарль де Голль"
  POLITICS_CHARLES_DE_GAULLE_DESC:0 "Від самого початку існування «Вільної Франції» Шарль де Голль стоїть на її чолі. Протягом більше ніж 20 років де Голль очолював останні залишки Вільної Франції в безнадійній і затягнутій боротьбі за виживання проти величезних шансів. Він колись був командиром дивізії в армії Четвертої Французької Республіки, прагнучи до реформи військ. Однак його спроби були запізнілими, і Франція швидко впала під ударами вермахту.\n\nПрагнучи продовжити боротьбу, де Голль зібрав усю наявну підтримку і відправився в Африку. Хоча бої продовжувалися, де Голль і тут мало чого досяг. Протягом років війська Вільної Франції були безперервно переслідувані по Африці, поки не залишилося лише найменша смужка того, що колись було колоніальними володіннями Французької Республіки. Через все це де Голль був як великою допомогою, так і великим тягарем для тих, хто досі слідує за мрією про Вільну Францію. Чоловік абсолютно переконаний у «La Libération», настільки, що важко не поділити захоплення старіючого лідера. На жаль, його переконання супроводжуються крайньою впертістю. Де Голль не хоче припиняти непопулярну військову владу, незважаючи на те, що його генерали зазвичай занадто зайняті роботою як найманці для інших західноафриканських країн і навіть для німців у Центральній Африці.\n\nДе Голль продовжує йти, виступаючи по радіо і щодня перевіряючи війська, здавалося б, переконаний, що це буде частиною початку їхнього шляху додому. Він навіть пообіцяв провести вибори, хоча дедлайн наближається, і деякі сумніваються, чи буде де Голль готовий навіть віддати хоча б це народу. Він також не визнав генералів, які хочуть бачити його на виході, і те, що вони цілком здатні здійснити своє бажання. Де Голль, можливо, повинен зрозуміти свою ситуацію і бути готовим до компромісів, якщо хоче побачити свою батьківщину ще раз."
  POLITICS_CHARLES_DE_GAULLE_DESC1:0 "Всі поза межами Вільної Франції. Де Голль вважається невдачею. Він не зміг підняти свою країну з її найтемнішого часу. Він не зміг допомогти в зусиллях війни. Він зрадив Францію. Але це лише поза межами Вільної Франції. У Вільній Франції він герой, хоча і тьмяний. Ніхто не може заперечити його харизму і оптимізм, і він використав їх у максимально можливій мірі в тій маленькій імперії, яку він вирізав для себе. У його Франції, незважаючи на всі труднощі, вони все ще марширують вулицями, співаючи «Марсельєзу» і скандуючи «Свобода, рівність, братерство».\n\nЯкщо є хоча б одна річ, за яку можна похвалити Шарля де Голля, це те, що він ніколи не здається щодо Франції, і не здасться, поки не віддасть своє останнє дихання."

