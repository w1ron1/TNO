 ## Leader Descs ##
 POLITICS_BEYERS_NAUDE_DESC: "Мир будь-якою ціною — офіційна доктрина Ліги оборони Карнарвона та її лідера.\n\nХоча сам Бейерс Науде колись був прихильником сегрегації, екстремістські погляди його побратимів-бурів та релігійні переконання багатьох членів АНК переконали богослова, що він підтримував не ту сторону. На час різанини в Кейптауні священнослужитель уже встановив зв'язки з підпільними лідерами АНК, що викликало гнів таємної поліції Герцоґа. Попри це, Науде відмовився переховуватися й продовжив публічно критикувати уряд, що значно покращило ставлення АНК до нього.\n\nКоли переворот Малана спровокував повстання Конні Малдера в Кейптауні, союзники Науде, як білі, так і чорні, захопили контроль над Північнокапською провінцією у військ бурської безпеки, які стрімко розпадалися. Глибоко релігійне розуміння Науде Південної Африки призвело до його закликів відновити довоєнну конституцію, покласти край сегрегації, налагодити співпрацю між чорними та білими, вигнати німців та створити федеративну структуру Південної Африки. Його бачення реконструйованої Південної Африки переконало практично кожну велику фракцію в тому, що Науде є їхнім природним союзником.\n\nОднак ні Малдер, ні Вільйоен, ні Бутелезі не могли передбачити створення Ліги оборони Карнарвона як нейтральної зони. Озброєний до зубів, Науде чітко дав зрозуміти, що Ліга гарантуватиме безпечне місце для тих, хто бажає уникнути подальших страждань від війни. Чи переживе Ліга бурю та залишиться цілісною — відкрите питання, але позиція Науде як найбільш ідеалістичного претендента на майбутнє Південної Африки вже забезпечена."

 ### Ideas ###
 CDL_political_refuge: "Політичний притулок"
 CDL_political_refuge_desc: "Ліга оборони Карнарвона була, перш за все, притулком для політичних біженців. Після створення Фолькстату політичні права майже всіх були безжально придушені та обмежені. Попри це, деякі продовжували виступати проти гноблення з боку Фолькстату, і найвизначнішим серед них був Бейерс Науде, який створив та захищав коло інших дисидентів навколо себе. Тепер Науде продовжує свою роботу, очолюючи різноманітну групу — від соціялістів до консерваторів, — усіх об'єднаних спільною метою просто вижити."

 CDL_haven_of_south_africa: "Прихисток у громадянській війні"
 CDL_haven_of_south_africa_desc: "На відміну від інших політичних утворень, що виникли після розпаду Фолькстату, Ліга оборони не зацікавлена в об'єднанні територій навколо себе під час Другої південноафриканської громадянської війни. Натомість вона зосереджена виключно на самообороні, слугуючи нейтральною зоною для біженців від громадянської війни навколо неї."
 