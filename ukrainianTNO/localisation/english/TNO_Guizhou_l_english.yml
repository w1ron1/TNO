## Leader Descriptions
POLITICS_HE_YINGQIN_DESC:0 "На превелику прикрість, панування Хе Їнціня над Ґуйчжоу щодня ще ближче добігає до кінця. Армія на практиці вже контролюється Юньнаню, а економіка тримається на волосині.\n\nБільшість очікували, що Хе Їнцінь, як один із найближчих сподвижників Чана Кайші, візьме важливу роль в управлінні Китаєм, і його кмітливість тільки підтримувала в цій справі. Звичайно ж, меншість очікували Другу Японсько-китайську війну, яка в усій своїй люті терору призведе до кінця старого Ґоміньдану й сходження Ван Цзінвея - найменше цього очікував сам Їнцінь. Ставши на бік ворога в останні дні війни, репутація Хе Їнціня встояла самим лише дивом і наразі перебуває на вістрі ножа.\n\nТепер призначений Китаєм губернатор Ґуйчжоу, Хе Їнцінь - балансуючи відносини між ханьцями та меншинами, і намагаючись поступово лібералізувати країну, має одну турботу, що не дає йому спати вночі. Юньнань."

