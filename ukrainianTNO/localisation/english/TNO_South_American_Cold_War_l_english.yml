  #Tooltips
  SACW_big_cold_war_info_button: "§WПісля Другої світової війни,§! §hперемоги Параґваю§! над §oБолівією§! у Першій війні Чако та §nнезалежности Санта-Крус§!, взаємна недовіра переросла в нову ворожнечу та суперництво між §KБразилією§! та §DАрґентиною§!. Південноамериканський континент тепер є викривленим дзеркалом глобальної холодної війни. Це суперництво, що почалося після здобуття обома країнами незалежности від їхніх колоніяльних володарів, уже переростало у відкриту війну. Майбутній конфлікт, безперечно, буде масштабнішим і призведе до ще більших руйнувань.\n\nНа жаль, ця холодна війна поглибилася, попри найкращі зусилля політиків запобігти цьому. Перемога §nДержав Осі§! лише посилила недовіру, оскільки §DАрґентина§! прагнула дипломатичних та економічних зв'язків із державами-переможницями, тоді як §KБразилія§! зберігала тісні зв'язки зі своїми новими янкі-союзниками.\n\nКонфлікт між §DАрґентиною§! та §jЧилі§! в §aАнтарктиці§!, §Kзахоплення Бразилією§! §QФранцузької Ґвіани§! та Друга війна Чако між §oБолівією§! та §hПараґваєм§! лише закріпили недовіру й зробили Холодну війну §Vнеминучою§!.\n\nКонфлікт інтересів цих націй визначатиме долю континенту та долі мільйонів людей. Коли насильство й розбрат поширюються континентом, мов лісова пожежа, слід пам'ятати...\n\n§V\"Складність у грі в курку — знати, коли здригнутися.\"§!"

  cold_war_info_tt: "§WБаланс сил між§! §KБразилією§! та §DАрґентиною§! залежить від:\n- §YПолітичного§! §Wвпливу на інші латиноамериканські нації§!\n- §YЕкономічного§! §Wуспіху, представленого ВВП§!\n- §YВійськової§! §Wсили армії, військово-повітряних сил і флоту\n\nХоча інші регіональні гравці можуть залучати інші нації до своєї сфери впливу, ситуація справжньої холодної війни в Америці існує лише між §KБразилією§! та §DАрґентиною§!."
  SAmap_nation_debug_tt: "§Y[THIS.GetNameWithFlag]§!\nВирівнювання: [GetSacwAllignment]\nПереможні бали: [?SA_cold_war_value|Y0]\nX = [?SA_cold_war_map_x?|Y0]\nY = [?SA_cold_war_map_y|Y0]"
  SAmap_nation_tt: "[GetSATooltip]"

  SAmap_tenstion_tt: "§WХоча мало хто заперечує реальність §GПівденноамериканської холодної війни§!, багато хто на континенті волів би мирнішого розв'язання.§!\n\nЯкщо §Gнапруженість залишається низькою§!, опосередковані конфлікти можуть бути врегульовані за взаємною згодою, і зберігається надія на мирне завершення холодної війни.\n\nОднак, якщо §Rнапруженість зростає§!, навіть відносно низька готовність до військового конфлікту в Латинській Америці може виявитися недостатньою, щоб запобігти великій війні, яка спустошить континент.\n\nНаслідки напружености [GetSAColdWarTensionLevel]:\n[GetSAColdWarTensionLevelEffects]"
