  SACW_nuclear_mechanic_tooltip_tt: "Нам потрібна бомба, щоб забезпечити могутність нашої нації та зберегти її безпеку. Прогрес нашого проєкту зі створення бомби залежатиме від його бюджету та прихильників; ні ми, ні наші суперники не маємо змоги самостійно створювати ядерну зброю, а тому потребуємо підтримки.\n\nКрім того, таємність програми також має вирішальне значення, особливо щодо наддержав; усі наддержави не бажають поширення ядерної зброї та завдадуть економічного удару й діятимуть таємно, якщо дізнаються, чим ми займаємося. Якщо їм вдасться провести цю операцію, це цілком може назавжди зруйнувати наші зусилля."
