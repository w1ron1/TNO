 ### Ideas ###
 PAK_between_the_worlds: "Між світами"
 PAK_between_the_worlds_desc: "Практично з кінця Британського Раджу Північно-західна прикордонна провінція була жорстоко розколота в питанні того, чим вона має бути. Одні виступають за Пуштуністан, інші за Пакистан; також існує значний проіндійський блок, що досі відстоює свої позиції.\n\n«Брат повстає проти брата»; різні клани, що формують правлячий клас ПЗПП, самі поділені щодо подальшого шляху. Спокою не знайти ні в школах, ні біля водопоїв: інтелігенція роз’єднана, школярі та студенти б’ються між собою. Невдоволення, страх і невизначеність панують всюди. Хоча Навабзада та його адміністрація є проафганськими, сили Пакистанського Руху, на які він спирається, рішуче проти цього."
 PAK_the_sandcastle: "Піщаний замок"
 PAK_the_sandcastle_desc: "Ситуація з безпекою в Північно-західній прикордонній провінції нагадує піщаний замок, що руйнується, оточений дітьми, які люто сваряться. Невдоволення, страх, голод і невизначеність процвітають, а держава не здатна або не бажає діяти. Одним із найяскравіших прикладів є міжкланове насильство — щоденна справа, яку влада ПЗПП цілком із задоволенням ігнорує.\n\nЩе гіршою для ПЗПП є залежність від збройного крила руху, що ідеологічно вороже ставиться до неї, — Національної гвардії Мусульманської ліги. За межами Пешавару та мережі лояльних князівств на далекій півночі вплив держави не діє. Він здійснюється лише через союзні клани або відверто нелояльну НГМЛ, яка, здається, здатна остаточно зруйнувати піщаний замок уряду Навабзади."
 PAK_pashtun_rule_british_policies: "Пуштунське правління; британські закони"
 PAK_pashtun_rule_british_policies_desc: "Те, що Північно-західна прикордонна провінція стала повністю самоврядною, не означає, що щось змінилося з часів британського колоніального правління. Як і Радж, держава спирається на мережу маліків та інших дрібних королів для управління сільськими районами. Як і Радж, держава жорстоко й непропорційно знищує будь-що, що вважає загрозою.\n\nОдними з найвизначніших жертв брутальної політики стабільності адміністрації Навабзади є Худай Хідматгари, або в перекладі Слуги Божі. Цей ненасильницький рух опору, що сягає часів Раджу, перебуває на межі знищення після того, як тисячі його членів були знищені спільною операцією ескадронів смерті уряду ПЗПП та НГМЛ."
 PAK_carrying_all_before_them: "Змітаючи все перед собою"
 PAK_carrying_all_before_them_desc: "Тепер настав час, коли котли війни розжарилися до червоного — час для Пакистанського Руху здобути перемогу! Пакистанський Рух повалив нікчемне королівство Навабзади і насадив своє правління силою зброї. Тепер всю Північно-західну прикордонну провінцію треба переформувати за їхньою ідеєю, загартувати в полум’ї кузні в зброю, спрямовану проти їхніх безбожних, комуністичних, язичницьких ворогів за Індом.\n\nДні афганського правління — принаймні, поки що — закінчилися. ПЗПП тепер кується під проводом Абдула Кайюма Хана та його людей. Скільки треба розплавити, спалити, як шлак у вогні коваля, перш ніж вони вважатимуть себе готовими?"
 PAK_one_flag_a_thousand_nations: "Один прапор, тисяча народів"
 PAK_one_flag_a_thousand_nations_desc: "Пакистанська держава надзвичайно стратифікована навіть за стандартами світу, де соціальна та етнорелігійна стратифікація є звичною.\n\nБудь-які умовні гарантії свободи релігії в Пакистані розтоптані численними закріпленими та незакріпленими законодавчо правилами, створеними виключно для політичного та економічного утиску немусульман. Пунджабський народ нестабільно тримає вершину в пакистанській расовій піраміді. Він намагається зберегти своє хитке домінування в державних справах, дискримінуючи інші етноси, що входять до складу держави, які й самі страждають від внутрішніх розколів. Касти, офіційно засуджені як пережиток «індуїстського язичництва» і теоретично «неіснуючі», насправді залишаються дуже важливими, а кастова система пронизує більшість політичних і соціальних справ."
 PAK_the_parliamentary_dictatorship: "Парламентська диктатура"
 PAK_the_parliamentary_dictatorship_desc: "Гнилі округи дореформеного Сполученого Королівства були з захватом скопійовані землевласницькими елітами Ісламської республіки Пакистан, які керують парламентом і домагаються бажаних політичних змін, змушуючи своїх орендарів голосувати за них. Пакистан теоретично є демократією і де-факто державою з конкурентними виборами, але єдині, хто може чесно змагатися, — це ворогуючі фракції землевласників.\n\nБільшість масових партій забороняють, щойно ті намагаються брати участь у виборах. Пакистанська національна асамблея через це конституційно нездатна представляти волю народу. Прем’єр-міністр підзвітний — але лише парламенту, а не людям, що робить Пакистан диктатурою парламентаріїв та олігархів у найчистішому сенсі цього слова."
 PAK_an_administrative_chimera: "Адміністративна химера"
 PAK_an_administrative_chimera_desc: "Новонароджена нація Пакистан базується на непослідовних правових принципах, які часто суперечать самі собі. Конституції не існує, закони — лише залишки від законів Раджу. Країна де-юре є домініоном Сполученого Королівства, щоб стверджувати, що вона стала незалежною в 1945, а не в 1965 році, але також регулярно заявляє про ідеологічну відданість ісламським принципам і законам шаріату.\n\nНасправді ні британське загальне право, ні накази Аллаха та Пророка не мають вірності уряду Пакистану. Реальна влада — в руках головного очільника воєнного стану та його прибічників. Жоден хадис, жодна законність не має такого впливу, як проста груба сила в сучасному Пакистані."
 PAK_the_scrap_of_paper: "Клаптик паперу"
 PAK_the_scrap_of_paper_desc: "Конституція Ісламської Республіки Пакистан обіцяє багато. Вона гарантує свободу слова, багатопартійну демократію та рівність народів як основу справжнього ісламського уряду, що дотримується Корану та Сунни. Але люди, які писали ці принципи — засновники Пакистану — цінували їх не більше, ніж папір, на якому вони написані.\n\nТака пачка паперів, як пакистанська конституція, марна для розуміння справжніх принципів правління молодої Ісламської Республіки, вірно викладених Абдулом Кайюмом Ханом і старанно дотриманих його вірними наступниками. Відповідь лежить не за письмовим столом, а на землі, у десятках тисяч таємних могил відомих і невідомих жертв від Пешавару до Карачі — і ще багатьох поховань, які неодмінно будуть."
 PAK_the_fires_must_burn: "Вогні мають горіти"
 PAK_the_fires_must_burn_desc: "Пакистан починає вступати в індустріальну еру, що дає можливість змагатися з будь-яким конкурентом, коли глянцеві брошури, що вихваляють велич «пакистанської моделі», можна знайти у фінансових центрах Франкфурта. Європейський капітал стікається до Карачі та Лахору, сподіваючись відхопити собі шматок у шаленому ринку, схожому на бійню.\n\nСправжня бійня — у фабриках і майстернях, що становлять основу цього нового буму. Індустріальні регуляції існують на папері, але ніде більше. Дитяча праця пожирає майбутнє бідняків міст і сіл, поневолених вічними боргами та знущаннями байдужих наглядачів. Вони — лише дрова для вогню індустрії, і для верхівки Пакистану одне ясно: ріст не має зупинятися, незалежно від людських втрат."
 PAK_networks_upon_networks: "Мережі на мережах"
 PAK_networks_upon_networks_desc: "У Пакистані немає управління, яке б не користувалося чи не підпадало під вплив мереж покровительства та «взаємної вигоди», створених Національною гвардією Мусульманської ліги в гонитві за Пакистаном.\n\nПереважна більшість державних справ вирішується лише за посередництва НГМЛ. Судова система не працює, правосуддя вершиться швидко й без церемоній. Немовби навмисно втілюючи давні слова «Якщо їм потрібен збирач податків, то чому б не бандит», НГМЛ також привласнила собі збір доходів.\n\nПотрібні радикальні дії, щоб загнати НГМЛ назад у казарми. Інакше армія може виявитися критично перевантаженою і розтягненою в час, коли інші державні інститути ризикують віддалитися від уряду."
 PAK_an_army_of_patronage: "Армія покровительства"
 PAK_an_army_of_patronage_desc: "Ісламська Республіка Пакистан має дві військові сили. Є професійна та меритократична Пакистанська армія, менша за чисельністю. І є більші, засноване на покровительстві Пакистанське ополчення, нащадки Національної гвардії Мусульманської ліги, створені на регіональній основі та діють автономно.\n\nКомандування частиною ополчення зазвичай визначається призначенням місцевих авторитетів. Цей процес призначення, хоч і найпростіший, надзвичайно корумпований: союзники та родичі призначаються на підлеглі посади, а офіцерські звання просто купуються та продаються. Таким чином, ополчення має сумнівну користь як військова сила, але є надзвичайно зручним як інструмент покровительства."
 PAK_power_vacuum: "Вакуум влади"
 PAK_power_vacuum_desc: "Коли уряд зникає, настає вакуум влади. Приклад: Пакистан після евакуації його уряду Німецьким Райхом.\n\nЗалишки Національної гвардії Мусульманської ліги не знають, кому підкорятися без чіткого лідера держави. Дезертирство, відповідно, процвітає. Пакистанська армія намагається відновити порядок на вулицях країни в час, коли здоровий глузд вимагав би їхньої присутності на кордоні з Індією. По всій країні почалися сільські повстання, а те, що лишилося від уряду, безсиле щось зробити. Останній цвях у труну вбиває поліція: сподіваючись на милість від Азад Хінд Фаудж після перетину кордону, оголосила повний нейтралітет."
 PAK_German_technical_assistance: "Німецька технічна допомога"
 PAK_German_training: "Німецькі навчання"

 ## Leader Descs ##
POLITICS_NAWABZADA_SHAHABUDDIN_KHAN_DESC: "Навабзада Шахабуддін Хан, хан Джандолу та наваб Діру, другий син наваба Шах Джахан Хана - суворий, безжальний чоловік із сильною відданістю обов’язку.\n\nЦе доречно, враховуючи його другу роботу як призначеного Афганістаном військового губернатора прикордонних провінцій, створеного Ханством Афганістану на противагу залишкам Пакистанської армії на кордоні. Його обов’язок — стежити, щоб Пакистанська армія залишалася на кордоні й не обернулася проти Афганістану; як вірний підлеглий Афганістану, він виконує це завдання з ентузіазмом.\n\nКоли Шахабуддін Хан не стримує пакистанців, він керує парою своїх невеликих князівств на північному заході того, що мало бути Пакистаном. Багато хто хвалить його за зусилля з модернізації — він одноосібно фінансує школи, лікарні, укріплення та дороги по всій своїй території. Але не менше людей критикують його за безжальність у спілкуванні з будь-ким, кого він зустрічає.\n\nЙого абсолютне правління в регіоні руйнує стільки ж життів, скільки піднімає; незліченні племінні групи вважають його ворогом через невпинні експропріації племінних земель заради розвитку. Жителі Прикордонних провінцій поза пакистанським кордоном чи Джандолом і Діром також не в захваті від нього; його абсолютистське, жорстоке правління викликає невдоволення, і чути відголоски пропакистанських і навіть проіндійських настроїв.\n\nПеред усіма цими викликами Навабзада робитиме, як завжди: затверджуватиме свою владу і придушуватиме інакодумство, поки воно не вщухне. Це працювало раніше — чому б йому не спрацювати знову?"
POLITICS_ABDUL_QAYYUM_KHAN_DESC: "Абдул Кайюм Хан, понад усе, людина крові.\n\nКолись він підтримував Худай Хідматгарів, що схилялися до ІНК, але наприкінці 1940-х перейшов до Всеіндійської мусульманської ліги. Він довів свою відданість, винищуючи прихильників своєї колишньої партії. Обраний лідером ВМЛ у 1959 році, сьогодні Хан є головним пуштунським лідером ВМЛ.\n\nМогутність Хана найсильніше відчувається там, де Національна гвардія Мусульманської ліги, парамілітарна сила, вірна лише йому, має найбільший вплив. Але це шкодить його репутації серед землевласників, що підтримують ВМЛ, які не цінують виняткову лояльність НГМЛ. Це також псує його стосунки з двома професійними формуваннями Пакистанського Руху — полком Джамму і Кашміру та Прикордонними силами, які вважають НГМЛ недисциплінованими дурнями та тягарем для Руху.\n\nПоки що Абдул Кайюм Хан сидить міцно. ВМЛ добре знає, що людина його натури — саме те, що потрібно, щоб мрія про Пакистан від Кашміру до Белуджистану стала реальністю."
POLITICS_FEROZ_KHAN_NOON_DESC: "Яка потужна іронія, що Фероз Хана Нуна було обрано вивести Пакистан із дитинства — чоловік, який ніколи не хотів, щоби Пакистан народився! Загляньте в його розум, і ви легко знайдете, де завжди лежали його справжні вірності. Фероз Хан Нун був відданий лише Британії, де провів свої найщасливіші роки. Він підтримував перебування Індії під британським правлінням до самого кінця.\n\nЧаси минули. У 1965 році Зірка і Півмісяць почали майоріти над дедалі більшою кількістю міст Пенджабу. Нун побачив зміни у вітрах і зрозумів, яку вигоду вони можуть йому принести, зв’язавшись зі старими друзями у Всеіндійській мусульманській лізі.\n\nСолдати Руху дісталися до села Фероз Хана Нуна, Нурпур Нун, із прапором у руках, готові його встановити, але побачили його вже на кожному видному місці в поселенні. Ніхто не був більш завзятим у завданні вербувати колишніх юніоністів до ПМЛ після війни, ніж Фероз Хан Нун. Ніхто не радів більше за нього, коли ця мобілізація допомогла вигнати Кайюма Хана під час Конституційної конвенції, залишивши при владі його.\n\nНе помиляйтеся, Фероз Хан Нун керуватиме Пакистаном якнайкраще. Він подбає, щоб Ісламська Республіка формувалася заради єдиної законної мети, яку він міг уявити: захищати та служити елітному класу, з якого він походить."
POLITICS_MUMTAZ_DAULTANA_DESC: "Мумтаз Даултана підтримував ідею Пакистану рано, приєднавшись до Всеіндійської мусульманської ліги в 1942 році. Заборона ВМЛ не стала перешкодою. Хоча Даултана приєднався до юніоністів, він підтримував зв’язок із колишніми товаришами і створив таку широку мережу, що став підпільним командиром дивізії «Мултан» НГМЛ задовго до 1965 року.\n\nНа думку Мумтаза Даултани, логічно було б, щоб він обійняв посаду прем’єр-міністра після війни. На превелику його огиду, він виявив, що Фероз Хан Нун — його давній сімейний суперник — отримав підтримку пенджабської аристократії раніше, ніж Даултана встиг переконати колишніх юніоністів стати за нього.\n\nАле все має кінець. Фероз Хан Нун упав, і аристократи підтримали Мумтаза Даултану. Не лише вони — клерикальні партії також кинули свою підтримку новій адміністрації Даултани. Якщо Мумтаз Даултана переживе реакцію на бурю, яку клерики хочуть обрушити на релігійні меншини Пакистану, вони ще можуть піднести його до вищої гідності, ніж прем’єр-міністр."
POLITICS_MAHMUD_AHMED_DESC: "Махмуд Ахмед не народився терористом. Він народився мусульманином у Лудхіані в перші дні Республіки Індія. Його дитинство було нічим не примітне, не відрізняючись від типового мусульманського дитинства в Індії. Але ніхто не народжується лиходієм — чи, якщо спитати вражаюче велику кількість прихильників Ахмеда, героєм.\n\nНемає єдиної думки, де Ахмед навчився методів тероризму та інших ідей заради національного визволення. За одними даними, він черпав натхнення з тактики ІНА у Війні за незалежність Індії. За його власними словами, ще хлопчиком він отримав аят від самого Аллаха, який розповів йому про необхідність джихаду проти індусів. Він ухилявся від призову, щоб не служити індусам, і втік у гори через нещільний кордон. Там він зник у горах і отримав подальші аяти від Найвеличнішого.\n\nМинули роки з його зникнення, і Ахмед повернувся визволяти свій народ. Борючись разом із численними послідовниками, він відомий як аль-Азад, себто, «Вільний» мовою урду. Його план — вигнати індусів із Землі Чистих будь-якою ціною і побудувати нову ісламську державу на попелі того, що буде спалено. Після століть гноблення настав час усім мусульманам Індії розірвати кайдани, що їх зв’язують, в ім’я Віри, Єдності та Дисципліни. І як великі воїни ісламу боролися проти хрестоносців, Ахмед і нові муджахіди борються проти індуських невірних за славу Аллаха."
POLITICS_INTERNAL_COMMOTION_OF_THE_STATE_DESC: "Оскільки уряд Ісламської Республіки Пакистан показав свою некомпетентність перед потребами свого народу;\n\nОскільки через його провал внутрішній безлад охопив усі регіони Республіки, армія надмірно розтягнута, Пакистанське ополчення відсутнє без дозволу, а сільські повстання процвітають;\n\nОскільки уряд Німецького Райху, спробувавши і не зумівши використати народ земель, заявлених Пакистаном, для власної вигоди, евакуював лише тих, хто був йому корисний, залишивши решту людей у регіоні в скрутному становищі;\n\nОскільки через ці демонічні махінації двох урядів у регіоні, раніше відомому як Пакистан, фактично немає влади, що є неприпустимим і не може тривати;\n\nТОМУ ми, цивільні, поліцейські та військові петиціонери, стурбовані добробутом Північно-Західних Прикордонних Провінцій, Західного Пенджабу, Синду, Белуджистану, Азад Кашміру та інших територій, окупованих зниклим урядом, і запевняючи президента Азад Гінду в нашій повній підтримці потреб Азад Гінду Фаудж у наших територіях, коли вони відновлюють порядок, смиренно просимо Виконавчу та Законодавчу Владу Республіки Азад Гінд негайно взяти на себе відповідальність за колишню Ісламську Республіку Пакистан.\n\n(Підписано) Надзвичайна нарада, Равалпінді"
POLITICS_ZULFIKAR_ALI_BHUTTO_DESC: "Коли в Ларкані, що в Синді, сонце вперше зійшло над Зульфікаром Алі Бхутто в 1928 році, уся його родина знала, що він завжди був призначений до величі.\n\nЙого батько, сер Шах Наваз Бхутто, один із найбільших землевласників Синду і пізніше його головний міністр, підтримував його політичну кар’єру від самого початку. Створення Пакистану спершу здавалося йому невдачею, адже його батько очолював юніоністські сили в Синді. Але страх поступився реальності: народження Пакистану дало Зульфікару Алі Бхутто більше влади, ніж він міг би мати в Індії.\n\nПроблема в тому, що ця можливість прийшла в час хаосу. Сьогодні Зульфікар Алі Бхутто очолює дуже нестабільну регіоналістську коаліцію. Ця коаліція виникла через обурення Синду домінуванням Пенджабу та гнів пуштунських регіонів через жорстокість і зраду держави під час Надзвичайної ситуації на кордоні.\n\nРодина Зульфікара Алі Бхутто завжди знала, що він призначений до величі. Але вони не знали, як довго це триватиме. Якщо Бхутто не зможе стабілізувати свою правлячу коаліцію навколо себе, його термін як прем’єр-міністра може бути набагато коротшим, ніж він хоче."
POLITICS_JAHANARA_SHAHNAWAZ_DESC: "Джаханара Шахнаваз — одна з небагатьох «старійшин» або старої гвардії Мусульманської ліги, що залишилася на ногах наприкінці 20 століття.\n\nЯк лідерка ВМЛ із 1910-х років, вона мала довгу й блискучу політичну кар’єру, що вплинула на підтримку створення Пакистану — до 1940-х, коли її усунули з усіх партійних посад через відмову прийняти бойкот британських колоніальних інститутів.\n\nШвидко приєднавшись до юніоністів, вона була обрана на провінційне місце своєї родини після війни і стала близькою соратницею та союзницею Фероз Хана Нуна. Дехто може глузливо порівнювати її шлях із каченятами, але Джаханара Шахнаваз дійсно пішла слідом за Нуном, коли він повернувся до її старої партії. Вона також служила міністром юстиції та права в його уряді.\n\nКоли Фероз Хан Нун нарешті піддався хворобі в 1972 році, ПМЛ зайшла в глухий кут щодо того, кого підтримати як прем’єр-міністра — за відсутності Нуна виникли різні фракції навколо різних лідерів. Але вдова Нуна, впливова грандеса Вікарун-Ніса Нун, продемонструвала свою підтримку Джаханарі Шахнаваз, ставши вирішальним голосом."

 ## Events ##
 PAK_Germany.1.t: "Підсумок операції «Менандр»"
PAK_Germany.1.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ЧИТАННЯ\nДЛЯ ВСІХ ЧЛЕНІВ АГЕНТСТВА [getGermanIntelAgencyCaps]\nОПЕРАЦІЯ «МЕНАНДР»\n\nПЕШАВАР - ПІВНІЧНО-ЗАХІДНА ПРИКОРДОННА ПРОВІНЦІЯ\n\nПакистанський рух базується на переконанні, що індуси та мусульмани не можуть жити в одній державі через історію гноблення мусульман індусами. Він виступає за створення Пакистану, «землі чистих», щоб забезпечити безпеку мусульман на Індійському субконтиненті. Члени Пакистанського Руху схильні возвеличувати європейські держави, такі як наша, як прояви переваги та войовничості порівняно з індуїстськими «язичниками» на сході.\n\nНещодавно головний очільник воєнного стану Пакистану, Абдул Кайюм Хан, звернувся до нас за згодою Пакистанського руху. Достатньо безжальний чоловік, він поділяє деякі наші погляди, але, що важливіше, розуміє — як і решта Руху — надійність і перевагу німецької держави як партнера та союзника для Пакистану. Див. Додаток B) щодо довідкової інформації про Хана та інших даних про Пакистанський рух, наданих нашими місцевими агентами. Потребує подальшого дослідження. Кінець сторінки.\n\nХАЙ НІМЕЧЧИНА БУДЕ В БЕЗПЕЧНИХ РУКАХ."
PAK_Germany.1.a: "Наші люди на субконтиненті, еге ж?"

PAK_Germany.2.t: "Лінія зближається"
PAK_Germany.2.desc: "«Ну що ж, пане Хане. Ви непогано впоралися там у... Белуджистані, чи не так?» Міністр закордонних справ Рейху схвально кивнув у бік свого співрозмовника, який зайняв місце, зазвичай зарезервоване для гостей посла Ірану.\n\nАбдул Кайюм Хан посміхнувся. «Так і є, пане міністре. Не знадобилося навіть і дрібки пороху — ми прийшли, побачили і перемогли. Прямо як під час Аншлюсу, який покійний Фюрер, хай він спочиває з миром, так майстерно провернув тридцять років тому. Я був вражений, ще коли вперше про це прочитав.»\n\nЛедь кивнувши на згадку про Гітлера, міністр закордонних справ підвів очі з люб’язною усмішкою. «Так, я бачу паралелі. Але, що важливіше», — при цьому Хан значно пожвавився — «я бачу шлях уперед, спосіб забезпечити, щоби Пакистанський рух більше не мав проблем із самозабезпеченням. Тепер у нас є прямий шлях до вас, пане Хане.»\n\n«Ви маєте на увазі—»\n\n«Саме так. Перші повноцінні поставки зброї вже в дорозі. Ви переконаєтеся, що Німецький Райх дуже щедрий для своїх вірних союзників.»\n\nХан уклонився, не встаючи з місця."
PAK_Germany.2.a: "«А ви, пане міністре, не пошкодуєте про цю щедрість. Присягаюся.»"

PAK_Germany.3.t: "Підсумок операції «Менандр»"
PAK_Germany.3.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ЧИТАННЯ\nДЛЯ ВСІХ ЧЛЕНІВ АГЕНТСТВА [getGermanIntelAgencyCaps]\nОПЕРАЦІЯ «МЕНАНДР»\n\nПЕШАВАР - ПІВНІЧНО-ЗАХІДНА ПРИКОРДОННА ПРОВІНЦІЯ\n\nЗа останні 72 години оперативники агентства [getGermanIntelAgency] зафіксували (і пакистанські джерела підтвердили) значний наступ пакистанських сил на індійські позиції у провінціях Пенджаб і Синд. Хоча перші кілька годин здавалося, що індійські позиції можуть бути зламані чи здані, їх підсилили, і тепер тривають запеклі бої.\n\nГоловний очільник воєнного стану, Абдул Кайюм Хан, повідомив нам, що він не зовсім впевнений у успіху без продовження німецької підтримки. Відповідно до наших попередніх зобов’язань перед ним і нашим союзником Пакистаном загалом, ми мусимо забезпечити, щоб пакистанська армія не відчувала нестачі припасів у боротьбі проти індійського уряду. Кінець сторінки.\n\nХАЙ НІМЕЧЧИНА БУДЕ В БЕЗПЕЧНИХ РУКАХ."
PAK_Germany.3.a: "Краще скористатися цією можливістю!"

PAK_Germany.4.t: "Зблизька на Схід"
PAK_Germany.4.desc: "Алі виглядав із круїзного лайнера. Волонтерство для захисту побратимів-мусульман від гноблення іноді мало свої приємні сторони. Алі не був певен, чи саме це уявляли в Джаматхані, коли оголосили заклик: німецький корабель мав чудову халяльну їжу, а екіпаж був надзвичайно ввічливим.\n\nГучномовець затріщав. «Пані та панове, ми наближаємося до Гвадару за кілька годин. Будь ласка, зберіть свої речі й готуйтеся до висадки, пам’ятаючи, що вихід буде непростим.»\n\nАлі схопив свій набір, висадився і попрямував до найближчого пакистанського прапора. Він назвав своє ім’я та країну походження, отримав військове привітання і подяку за те, що прибув допомагати Пакистану, після чого пішов на базову підготовку.\n\nБазова підготовка була складною. Пакистанський сержант-інструктор, ветеран Національної гвардії Мусульманської ліги, був вимогливим і безжальним. Іноді перерви робилися лише на п’ять молитов. Принаймні Алі тренувався серед людей із багатьох інших мусульманських країн: сунітів, побратимів-шиїтів. Були навіть кілька німців, що працювали офіцерами зі зброї та допомагали з підготовкою.\n\nЧерез два тижні Алі опинився на фронті. Заряджаючи гвинтівку, він приготувався і пішов за своїм загоном. Він пробурмотів шахаду, щоб заспокоїтися, а потім узявся до діла."
PAK_Germany.4.a: "Пора."

PAK_Germany.5.t: "Від Інду до Райну"
PAK_Germany.5.desc: "Клац. Канал змінюється. Телевізор показує зображення міністра закордонних справ Райху одразу після згадки його імені.\n\nЗміна ракурсу камери — представник із Данії. Ще один із іншої країни, ще один із ще однієї, а потім—\n\n«—міністр закордонних справ Ісламської Республіки Пакистан, який сьогодні вперше прибув до Постійної Ради. З присутністю міністра, пані та панове, приєднання Ісламської Республіки Пакистан до Айнхайтспакту та Європейської економічної спільноти офіційно оформлено.»\n\nПакистанський посланець підводиться і отримує оплески від присутніх делегатів, а потім починає підготовлену промову німецькою. Вихваляючи досягнення німецької держави у підтримці культури та стабільності в Європі, міністр обіцяє підтримку Пакистану своїм колегам по Пакту та ЄЕС.\n\nПромова зриває овації стоячи. Тим часом чоловік, що дивиться телевізор, схвально киває і виходить."
PAK_Germany.5.a: "Усі вони одного поля ягоди."

PAK_Germany.6.t: "Подвій, подвій"
PAK_Germany.6.desc: "«Гаразд, пане міністре. Уряд доручив мені обговорити можливість подальшої економічної інтеграції Пакистану до Європейської економічної спільноти, з особливим акцентом на німецьку економічну сферу».\n\nМіністр закордонних справ Пакистану подивився на міністра фінансів Райху. Той повільно кивнув, кажучи: «Так, ми вже визначили певні ваші продукти, які могли б принести користь німецькій економіці».\n\nПакистанець поглянув на документи. «Ці ми, гадаю, точно можемо надати. Ми також визначили певні німецькі товари та послуги, які принесли б користь Пакистанові. У довгостроковій перспективі ми сподіваємося, що Пакистан досягне процвітання на рівні Німеччини або принаймні залишить Індію позаду в багні».\n\nМіністр задумливо приклав палець до підборіддя і вирішив трохи змінити тему. «Що ж, пане міністре, ми можемо спробувати. Але, тим часом, я чув хороші відгуки про килими в цьому регіоні. Я намагався знайти Фюрерові гідний подарунок на день народження і думав, чи не могли б ви...»\n\nПакистанський дипломат усміхнувся. «Звісно, пане міністре»."
PAK_Germany.6.a: "«Я можу вам дещо показати»."

PAK_Germany.7.t: "Турбота й труд"
PAK_Germany.7.desc: "Діти гнули спини над ткацькими верстатами та іншими машинами для виготовлення килимів. Історії у кожного з них були варіаціями на одну й ту ж тему. Їх продали на роботу батьки, бо не могли їх прогодувати, або тому, що гроші були потрібніші, ніж діти.\n\nРаніше вони хоча б могли озиратися і бачити зовнішній світ. Але всередині були лише тонкі промені світла, килимові верстати, крики наглядача, що вимагав більше, і нескінченна праця. Ті кілька дітей, яким якось вдалося дістати книги, ледве могли їх читати. Якби вони вміли читати, то знали б, що це — боргова кабала, але час, який німецька дитина витратила б на навчання, вони проводили над верстатом і не мали шансів дізнатися.\n\nДекілька дітей постраждали, перш ніж останній килим був готовий. Наглядач майже вирвав килим у них із рук і поніс власникові фабрики, який схвально його оглянув. Це, можливо, не найкраща робота фабрики, але який німець зможе правильно її оцінити?\n\nВласник фабрики продав килим посередникові. На мить він подумав прибрати частину їхнього боргу як винагороду. Він придушив цей порив — борги ніколи не будуть виплачені, навіть якби він це зробив. До того ж, йому потрібна кожна пайса на наступний маєток чи нові верстати, над якими працюватимуть ще більше дітей. Він розвернувся і гримнув на іншу групу дітей, щоби працювали швидше.\n\nКоли килим дістався до кабінету Фюрера, його розстелили на підлозі перед почесним місцем, де висів портрет Гітлера. Він захоплено розглядав його, не думаючи ні про що, крім його краси. Походження не мало значення — і його б це не хвилювало, навіть якби він знав."
PAK_Germany.7.a: "Тим часом фабрика продовжувала працювати."

PAK_Germany.8.t: "Дим у очі"
PAK_Germany.8.desc: "Густий дим заповнив розкішну, оббиту оксамитом Губернаторську залу в готелі «Galle Face» у Коломбо. Лінивими вихорами він закривав світло від люстр і кидав мерехтливі тіні на напружені обличчя німецьких та японських дипломатів. Праворуч за величезним круглим столом сиділи троє ветеранів-дипломатів із Відомства закордонних справ, одягнені в гострі чорно-сині пальта з срібними облямівками та козирки. Напроти них — стримані японці, схожі на бізнесменів, що порівнюють нотатки й похмуро перемовляються.\n\nЦигарка ліниво висіла в кутику рота Фрайгерра Отто фон Штайнбаха, коли він обмірковував умови, запропоновані його візаві, що сидів із кам'яним обличчям. Одна з проблем сучасної дипломатії — це педантична наполегливість на задоволенні громадськості щодо речей, які вона не може зрозуміти і не розглядатиме, доки якийсь вискочка її не розбурхає. Початкові ноти Сфери зосереджувалися на «двосторонньому визнанні умов на місцях», «атмосфері скорочення озброєнь і контрольованого впливу» та «обміні взаємовигідними особами для досягнення співпраці». Невже їхній німецький перекладач перебрав саке?\n\nЖодного разу не згадувалося визнання Пакистану як держави. Нічого про межі кордонів, визнання, зовнішні відносини. Що, зрештою, було на руку шляхетному Фрайгерру — його завдання на цьому етапі полягало не в справжніх переговорах, а в затягуванні часу. І було очевидно, що Сфера робила те саме. Позаду нього ад’ютант непомітно передав записку — «ще два дні». Одним швидким рухом він розчавив цигарку об вигадливу попільничку і прокашлявся."
PAK_Germany.8.a: "«Гадаю, панове, тепер ми мусимо розглянути важливе питання щодо забезпечення спостерігачів на місці...»"

PAK_Germany.9.t: "Пастух котів"
PAK_Germany.9.desc: "Піт стікав із підборіддя Оберста фон Лютцова, а настільний вентилятор марно боровся з вологим повітрям. Пенджаб був пекельною місциною для завдання, але десятиліття прусської дисципліни гарантували, що, попри дискомфорт, він навіть краватки не послабить. Стук у двері сповістив про прибуття місцевого командира Пакистанського ополчення, який прийшов дати звіт перед тим, як їх за два тижні розгорнуть.\n\n«Ну що, оберґефрайтере Хан? Як просувається навчання з новими гвинтівками — люди, мабуть, віддали між NF-LAG і старими Lee-Enfield перевагу першим? А як із розподілом пустельних раціонів, що не псуються?»\n\n«Гере Оберсте, я з повагою доповідаю, що поставка нових гвинтівок не відбулася, бо ці кошти зникли разом із місцевим командиром. Крім того, кількість раціонів, що не псуються, значно скоротилися, оскільки деякі люди, яким їх видали, були не солдатами, а фермерами, що видавали себе за них. Через це чисельність військ зменшується».\n\nЛише титанічним зусиллям волі Оберст не вибухнув на місці, а лише стиснув кулак на столі, і вена біля його скроні комічно запульсувала.\n\n«Оберґефрайтере. Який відсоток людей, що приєдналися під час нашої рекрутингової кампанії, був присутній на останній зустрічі з нашими інструкторами?»\n\n«Гере Оберсте. Я з повагою доповідаю, що 32% від початкової сили залишилися з нами».\n\n«Ви —»\n\n«Глибоко перепрошую, що перебиваю вас, гере Оберсте. Є ще один звіт. Під час ранкового тренування з протитанковою зброєю стався нещасний випадок із падінням боєприпасу».\n\n«...і який результат?»\n\n«Гере Оберсте. Із 32% людей, що в нас є, 18% потребують ушпиталення»."
PAK_Germany.9.a: "«Він, мабуть, жартує. Це мусить бути жарт»."

 PAK_Germany.10.t: "Back in Black" # to be removed
 PAK_Germany.10.desc: "The great steel behemoths of the Kriegsmarine swept through the boiling waters of the Arabian Sea, hulking forms cutting sharp white wakes through the waves. Against the deep blue of the ocean stood, in stark contrast, the jet black of their superstructures - painted in blatant defiance of tactical norms. With its runway marked by a single giant swastika, jutting defiantly into the seafoam, the carrier Adolf Hitler led the group in V-formation - flanked on one end by the cruiser Friedrich Barbarossa and the destroyers Emden, Wotan, and Erich Koellner, and on the other end by the cruiser Generaladmiral Warzecha and the destroyers Eisenfaust, Hochmut, and Erich Giese. Lurking deep beneath were six U-boats - all bearing arms that could obliterate the entire subcontinent they made for. The German navy, once bound to the memory of a broken Reich, had returned to the seas.\n\nOn the docks of Karachi Port, amidst the ambient low drone, beeping of alarms, and thousands of voices shouting, lay a deep sense of unease. The dockworkers that had seen a hundred vessels arrive and a thousand leave had also heard the rumours. That the Germans were coming not as friends, but as new conquerors. That the movement that had liberated them from Delhi's tyranny only sought to replace it with their own. And, for those few that had listened to the whispers from across the border- that when, not if, the Japanese had had enough, Karachi would be the first place burned into oblivion under the scorching rays of the Rising Sun.\n\nDeep beneath Wünsdorf, in the sterile white operations room of the OKW, Großadmiral Erich Topp watched with grim determination as aides with long staves pushed small scale icons of their ships across a giant map of the Arabian Sea. Across the peninsula of the Indian Subcontinent, in the Bay of Bengal, red markers denoting the approximate positions of the Imperial Navy saw far less movement. A single submarine flotilla, last thought to be near Sri Lanka, had not been touched in hours" # to be removed
 PAK_Germany.10.a: "Let them come. We earned our place in the sun, and we will keep it." # to be removed

PAK_Germany.11.t: "Не кліпай"
PAK_Germany.11.desc: "«Гере Штайнбах, ми не можемо вести переговори добросовісно без чесної взаємності з вашого боку. За достовірними даними, не менше десяти атомних підводних човнів щойно увійшли в Аравійське море через Суецький канал — і незабаром у нас будуть фотографічні докази».\n\nМ’яз у кутику ока фон Штайнбаха ледь здригнувся. Де б цей східняк не вчив німецьку, він явно пропустив урок про шляхетність. Але роки дипломатичного досвіду зробили його відповідь плавною і виваженою:\n\n«Запевняю вас, що будь-які рухи в бік Аравійського моря відповідають політиці Райху, викладеній у ноті Фюрера тиждень тому. Якщо у вас є докази протилежного, я попросив би їх надати. Інакше ж я мушу наполягти, щоб наші друзі з Токіо задумалися, що досі саме вони відмовилися розглядати бодай одну нашу пропозицію — тож хто насправді перешкоджає мирному процесу?»\n\nВони більше не були в затишній Губернаторській залі — величезна Ювілейна бальна зала була відкрита для їхніх потреб. Уздовж боків столу для конференцій товпилися представники кожної нації Сфери, помітні члени Пакту і, в південному куті, міжнародні представники. Американців помітно не було, хоча треноване око могло зауважити кількох «латиноамериканських» спостерігачів із чіткими слідами засмаги, що пильно прислухалися. Фрайгерр душив би собі сміх із цього, якби не той факт, що японці мали абсолютну рацію, а Хеєр і Кріґсмаріне відставали від графіка майже на два тижні. Британія і Франція одного разу вже кліпнули очима. Але це був їхній колишній союзник, люди, для яких смерть була почеснішою за поразку."
PAK_Germany.11.a: "Температура зростає, диявол грає свою пекельну мелодію."

PAK_Germany.12.t: "Плати за свій шлях"
PAK_Germany.12.desc: "«Я вдячний, що ви всі знайшли час зустрітися зі мною», — сказав генерал-майор Сайєд Абід Хусейн, склавши руки на столі для конференцій. «Я впевнений, що братня держава із Айнхайтспакту може надати нам допомогу в час випробувань для нас». Перед ним сиділи люди, і в них були імена, але він вважав доречнішим називати їх власними прізвиськами. Торговець зброєю розвалився в кріслі, дивлячись на нього поверх носа через темні окуляри. Усмішка Бізнесмена була сліпучою, але очі казали про її нещирість. Міністр, здається, не міг усміхнутися, навіть якби хотів.\n\n«Оце ми можемо, друже», — сказав Торговець зброєю, шморгнувши носом. «Як тобі?» Перед Хуссейном лежав жорсткий кейс із новим Carl Gustaf m/45 всередині. «Щойно з конвеєра», — додав Торговець зброєю. Хусейн дістав один із пістолетів-кулеметів. Непогана робота, краща за те, до чого звикли більшість членів Ополчення.\n\n«Гадаю, нам варто обговорити оплату», — сказав Бізнесмен, розкриваючи теку перед собою. «Ми можемо видати цю зброю в оренду на п’ять років, з платежами, які уряд Пакистану сплачуватиме щороку—»\n\n«Ні», — вирвалося у Хусейна. Цікаві погляди звернулися до нього, але він не здригнувся. «Я буду головним отримувачем. Надсилайте рахунок прямо мені». Він знав, що це буде дорого, але великий землевласник, як він, мав гроші. Те, що він витрачав їх на оснащення Пакистанського ополчення, яке уряд не міг належним чином профінансувати, дратувало. Водночас він бачив шанс заробити кілька послуг, і не соромився цього.\n\nМіністр нервово відреагував на цей незвичний порядок речей, але, побачивши сталевий погляд Хусейна, зітхнув і кивнув Торговцю зброєю, який радісно плеснув у долоні. «Гаразд, тоді мої хлопці й твої хлопці розберуться з деталями. Приємно мати з тобою справу, пане генерал-майоре»."
PAK_Germany.12.a: "Хуссейн сподівався, що зброя прибуде вчасно."

PAK_Germany.13.t: "Східний кордон ЄЕС"
PAK_Germany.13.desc: "Усе в бальній залі виблискувало: люстра, кришталевий посуд, відполіровані дошки підлоги та золоті оздоби на стінах. Для послів від європейського капіталу, присутніх на останній конференції ЄЕС, це був той тип крикливої презентації, який не дивував, якщо відбувався від менших держав, що намагаються стрибнути вище голови. Усе ж, дехто думав, їм казали, що всю цю справу організували за кілька днів, що деякі речі настільки свіжі, що на них можна знайти відбитки маленьких пальчиків, і якість була вражаючою для такої швидкості.\n\nВони були менш захоплені промовцями на цій конференції, аж поки на сцену не вийшла поважна біла жінка, яка представилася як Дженніфер Муса, громадянка Пакистану, народжена в Ірландії, що стояла тут, щоби показати, що цей маленький куточок Південної Азії ближчий до них, ніж вони думали. Вона була в зеленому костюмі анаркалі, вишитому золотом, що ловило світло зали, і говорила чітко й м’яко — цю заспокійливу рису вона успадкувала з її попереднього життя медсестри.\n\n«За мій час перебування в двох світах я знайшла багато подібного між Європою та Пакистаном. Ми прагнемо просувати й підтримувати чесноти, які зробили наші держави сильними та чистими. Навіть коли наші цінності підриваються загарбниками, ворожими до наших традицій, ми прагнемо їх зберегти силою волі. Хоч ми й можемо розходитися в деталях, ми віримо в багато спільного: обов’язок перед родиною, нацією та Богом. Я прошу присутніх сьогодні визнати це і повірити в нового члена Пакту. Ви дізнаєтеся, як і я дізналася, що ваша довіра буде добре винагороджена».\n\nХоча більшість німців поставилися скептично, інші були відкриті до пропозиції Муси. Французький бізнесмен, представник Renault, який захоплювався місцевими бізнес-практиками, прийняв її слова близько до серця. Коли вона закінчила говорити, він попрямував до найближчого телефону і набрав номер свого місцевого партнера."
PAK_Germany.13.a: "«Жан? Це я. Гадаю, ми можемо тут заробити трохи грошей»."

PAK_Germany.14.t: "Namarië"
PAK_Germany.14.tt: "- вірш Дж. Р. Р. Толкіна, написаний однією з вигаданих ним мов, квенья, і опублікований у «Володарі перснів». Він має підзаголовок «Плач Ґаладріель у Лоріені», що мовою квенья звучить як «Altariello nainië Lóriendessë»."
PAK_Germany.14.desc: "Практично всіх значних членів пакистанського уряду запхали в німецькі літаки в Лахорі. Кожному, хто мав хоч якусь потенційну користь для Райху, видавали квиток і візу та наказували хапати речі й сідати на літаки в аеропорту.\n\nНайвищим чиновником, якого виключили зі списку, був генерал Акбар Хан, голова Пакистанської армії, якого залишили продовжувати боротьбу. Цивільні та військові машини боролися за місце біля аеродрому, а солдати Пакистанської армії та Пакистанське ополчення намагалися - й не могли - підтримувати порядок. Людей заштовхували в літаки й витягали з них, сім’ї ризикували бути розлученими, і хаос ставав дедалі повнішим, чим далі тривала евакуація.\n\nАкбар Хан, укотре проклинаючи цей безлад, побачив, як злітає літак для VIP-персон, і подякував Аллаху за малі милості. Принаймні прем’єр-міністр і кабінет вибралися в безпеці.\n\nЗгаданий прем’єр-міністр на борту притримував голову руками.\n\n«Боже! Як я це ненавиджу, як сильно я це ненавиджу», — бурмотів собі під ніс Фероз Хан Нун, а гіркі почуття в ньому вирували. «Тепер я застряг на цьому потопаючому кораблі, якійсь жалюгідній імітації проклятого Титаніка. Треба було тікати до Індії, коли ці фанатики з Пакистанського руху прийшли до Нурпур Нуна, а не приєднуватися до них». Проклинаючи свої життєві вибори, Нун дивився, як Пакистан усе більше віддалявся за вікном літака."
PAK_Germany.14.a: "Він ніколи не повернеться."

PAK_Germany.15.t: "Розбита держава"
PAK_Germany.15.desc: "Оскільки уряд Ісламської Республіки Пакистан показав свою некомпетентність перед потребами свого народу;\n\nОскільки через його провал внутрішній безлад охопив усі регіони Республіки, армія надмірно розтягнута, Пакистанське ополчення відсутнє без дозволу, а сільські повстання процвітають;\n\nОскільки уряд Німецького Райху, спробувавши і не зумівши використати народ земель, заявлених Пакистаном, для власної вигоди, евакуював лише тих, хто був йому корисний, залишивши решту людей у регіоні в скрутному становищі;\n\nОскільки через ці махінації двох урядів у регіоні, раніше відомому як Пакистан, фактично немає влади, що є неприпустимим і не може тривати;\n\nТОМУ ми, цивільні, поліцейські та військові петиціонери, стурбовані добробутом Північно-Західних Прикордонних Провінцій, Західного Пенджабу, Синду, Белуджистану, Азад Кашміру та інших територій, окупованих зниклим урядом, і запевняючи президента Азад Гінду в нашій повній підтримці потреб Азад Гінду Фаудж у наших територіях, коли вони відновлюють порядок, смиренно просимо Виконавчу та Законодавчу Владу Республіки Азад Гінд негайно взяти на себе відповідальність за колишню Ісламську Республіку Пакистан."
PAK_Germany.15.a: "(Підписано) Надзвичайна нарада, Лахор"

PAK_Germany.16.t: "Армія, що розсипається"
PAK_Germany.16.desc: "Полковник грюкнув по столу. Війна проти Азад Гінду ніколи не йшла добре, і тепер Північно-західна прикордонна провінція почала відчувати це на повну. Ніде це не було так очевидно, як на регіональній базі Пакистанських ополченців десь у Провінції.\n\n«Де ці бісові загони? Куди вони поділися?»\n\nСекретар полковника поклав слухавку, відпустивши її з незадоволенням. «Я не знаю, куди вони пішли. Я намагався додзвонитися до кожного з них. Хоч би як далеко вони були від індійців, жоден не відповів. Ми просто не знаємо, де вони».\n\n«Продовжуй шукати, чорт забирай», — крикнув полковник. Коли секретар узявся за це, ззовні почувся гнівний гамір. Лейтенант увірвався, його обличчя застигло, і він заїкаючись промовив: «Там натовп розлючених озброєних людей! В-вони хочуть, щоб ми відпустили їхніх рідних із Ополчення!»\n\nПолковник махнув рукою зневажливо. «Хіба вони не бачать, що ми самі намагаємося знайти цих клятих родичів? Як тільки знайдемо тих ідіотів, дамо їхнім придуркуватим сім’ям те, чого вони хочуть».\n\n«Ми не можемо дати їм те, чого вони хочуть», — сказав секретар. «Більшість із них, здається, мертві. Ми—»"
PAK_Germany.16.a: "Після цього базу штурмували."

PAK_Germany.17.t: "Варта на Хавелі"
PAK_Germany.17.desc: "Літаки, що залишили Акбара Хана позаду, висадили безліч вигнанців, які потім розгорнули свою діяльність по всьому Райху.\n\nДеякі з них намагалися асимілюватися і забути все, що привело їх до цього. Інші ж відмовлялися відкинути мрії про відновлення Ісламської Республіки Пакистан. Вони створювали асоціації для відродження Пакистану, наполягаючи понад усе, що Азад Гінд — нелегітимний індуїстський окупант, і що вони разом із японськими маріонетками будуть вигнані праведною силою зброї.\n\nТа нічого з цього не вийшло. Їм не вдалося навіть зібрати місцевої підтримки. Будь-який німець, який зараз був готовий слухати бурмотіння пакистанських вигнанців, мусив стримувати бажання сказати, що німці втекли з долини Інду з підібганими хвостами і виключили Пакистан із Пакту з простої, вагомої причини. Сотня чи близько того зацікавлених у будь-якій місцині постійно розривалися між тим, щоб відкрити їм правду, і просто залишити їх наодинці з цим.\n\nМинув рік. Два роки. Три. Жодних ознак повстання. Зв'язок із Акбаром Ханом зник. Не було новин від Пакистанського ополчення, не було нічого, що нагадувало б повстання Національної гвардії Мусульманської ліги. Ті кілька людей, хто міг отримувати звістки від родичів у долині Інду, чули, що там уже ніхто більше навіть не думає й не говорить про Пакистан. Безнадія охарактеризувала зустрічі пакистанських вигнанців у ці дні, хоча вони й повторювали ті самі старі благочестиві слова про «Пакистан, що ось-ось звільниться».\n\nСеред цієї інерції прийшло усвідомлення. Але ніхто з них ніколи не подумав би визнати, що саме Німеччина залишила Пакистан у його нинішньому неіснуючому стані. Тож вони продовжували говорити про індійських загарбників і японських ворогів ісламу, неначе люди, що колупають жарини, питаючи при цьому, чому немає вогню."
PAK_Germany.17.a: "Нема прискорення? Немає й сили."
