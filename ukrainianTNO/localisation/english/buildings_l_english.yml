l_english:
 infrastructure:0 "Інфраструктура"
 infrastructure_plural:0 "Інфраструктура"
 infrastructure_desc:1 "Ця споруда дозволяє поліпшувати інфраструктуру області, збільшує об'єм постачання у стратегічних реґіонах і швидкість Ваших дивізій, а також базовий об'єм видобутку ресурсів."
 arms_factory:0 "Військовий завод"
 arms_factory_plural:0 "Військові заводи"
 arms_factory_desc:0 "Ця споруда дає можливість виробляти в області нове військове спорядження. За потребою може бути перетворений у цивільний завод.\n\nЩомісячні експлуатаційні витрати: §Y52 мільйони $§!"
 dockyard:0 "Верф"
 dockyard_plural:0 "Верфі"
 dockyard_desc:0 "Ця споруда дає можливість будувати в області нові кораблі.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon.\nЩомісячні експлуатаційні витрати: §Y50 мільйонів $§!"
 dam: "Дамба"
 dam_plural: "Дамби"
 dam_desc: "Дамби дають регіону більше електроенергії, сприяючи розвитку промисловості та збільшенню обсягів видобутку ресурсів."
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 canal_kiel: "Шлюзи Кільського каналу"
 canal_kiel_desc: "Шлюзи Кільського каналу необхідні для того, щоб канал міг працювати на повну потужність.\n\nЯкщо вони будуть зруйнованими, то це спричинить довготривалу блокаду судноплавству та пересуванню."
 industrial_complex:0 "Цивільний завод"
 industrial_complex_plural:0 "Цивільні заводи"
 industrial_complex_desc:0 "Ця споруда виробляє в області цивільні товари або дозволяє будувати нові споруди. За потребою може бути перетворений у військовий завод.\n\nПідтримка кожного цивільного заводу коштує §Y1§! £steel_texticon "
 air_base:0 "Авіабаза"
 air_base_plural:0 "Авіабази"
 air_base_desc:0 "Ця будівля забезпечує державу місцем дислокації військово-повітряних сил, а також шахтами, які можуть бути використані для запуску балістичних ракет."
 naval_base:0 "Морська база"
 naval_base_plural:0 "Морські бази"
 naval_base_desc:1 "Розширює дальність дії Вашого флоту та дозволяє ремонтувати його. Дозволяє робити заморські поставки та експорт ресурсів. Вищий рівень збільшує пропускну здатність для поставок."
 bunker:0 "Наземне укріплення"
 bunker_plural:0 "Наземні укріплення"
 bunker_desc:0 "Ця споруда надає штраф атакуючим військам у бою в розмірі $VALUE|+%0$ за кожний рівень укріплень. Атака з кількох напрямів зменшує ефект від укріплень."
 coastal_bunker:0 "Прибережне укріплення"
 coastal_bunker_plural:0 "Прибережні укріплення"
 coastal_bunker_desc:0 "Ця споруда надає штраф атакуючим військам при висадці з моря в розмірі $VALUE|+%0$ за кожний рівень укріплень."
  anti_air_building:0 "Система ППО"
 anti_air_building_plural:0 "Системи ППО"
 anti_air_building_desc:0 "Ця споруда забезпечує область захистом від ворожих бомбардувальників і веде вогонь по ворожим літакам."
 synthetic_refinery:0 "Синтетичний НПЗ"
 synthetic_refinery_plural:0 "Синтетичні НПЗ"
 #synthetic_refinery_desc:0 "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc:0 "Ця споруда виробляє в області"
 synthetic_refinery_amount:0 "$VALUE|Y0=$"
 synthetic_refinery_resource:0 "£resources_strip|$FRAME$"
 radar_station:0 "Радарна станція"
 radar_station_plural:0 "Радарні станції"
 radar_station_desc:3 "Радар дозволяє Вам отримувати дані про ворожі війська в зоні покриття.\nВищий рівень радара в області збільшує радіус дії.\nРадар також дозволяє краще помічати ворожу авіацію в реґіоні, збільшуючи шанси Ваших льотчиків на успіх.\nКрім того, радар поліпшує виявлення ворожих флотів."
 rocket_site:0 "Ракетна шахта"
 rocket_site_plural:0 "Ракетні шахти"
 rocket_site_desc:0 "У цій будівлі зберігаються і запускаються МБР. Кожна шахта збільшує нашу §Yударну силу§! на певну величину, яка залежить від розміру наших запасів.\n\nЕнергоспоживання мережі: §R-1§! power_texticon.\nЩомісячні експлуатаційні витрати: §Y25 мільйонів $§!"
 nuclear_reactor_heavy_water: "Реактор на важкій воді"
 nuclear_reactor_heavy_water_plural: "Реактори на важкій воді "
 nuclear_reactor_heavy_water_desc: "Ця споруда забезпечує регіон виробництвом збагаченого урану для використання в ядерній зброї.\nЯдерні реактори, що працюють на важкій воді, дещо дешевші у будівництві, ніж графітові реактори, але виробляють менше матеріалу, який можна використовувати для створення ядерної зброї."
 commercial_nuclear_reactor: "Цивільний ядерний реактор"
 commercial_nuclear_reactor_plural: "Цивільні ядерні реактори"
 commercial_nuclear_reactor_desc: "Ця споруда забезпечує регіон виробництвом збагаченого урану для використання в ядерній зброї та електроенергії для цивільної економіки."
 theory_facility: "Дослідницький комплекс теоретичних розробок"
theory_facility_plural: "Дослідницькі комплекси теоретичних розробок"
theory_facility_desc: "Експериментальні комплекси теоретичних досліджень дають змогу розпочинати дослідницькі проєкти, пов'язані переважно з теоретичними розробками або інформаційними технологіями."
 aerospace_facility: "Дослідницький комплекс аерокосмосу"
aerospace_facility_plural: "Дослідницькі комплекси аерокосмосу"
aerospace_facility_desc: "Експериментальні комплекси аерокосмічної інженерії дають змогу розпочинати дослідницькі проєкти у сфері авіації, ракетної та космічної техніки, а також пов'язаної з ними електроніки."
electronics_facility: "Дослідницькі комплекси електротехніки"
electronics_facility_plural: "Дослідницький комплекс електротехніки"
electronics_facility_desc: "Експериментальні комплекси електронної інженерії дають змогу розпочинати дослідницькі проєкти, пов'язані з електронікою та обчислювальною технікою."
materiel_facility: "Конструкторський комплекс"
materiel_facility_plural: "Конструкторські комплекси"
materiel_facility_desc: "Експериментальні комплекси розробки військової техніки дають змогу розпочинати дослідницькі проєкти, пов'язані з різними видами озброєння та військового спорядження для сухопутних і морських сил, зокрема спеціалізованими танками й артилерією."
 mega_gun_emplacement: "Великокаліберна багатозарядна гармата"
mega_gun_emplacement_plural: "Великокаліберні багатозарядні гармати"
mega_gun_emplacement_desc: "Ця великокаліберна гармата, що використовує принцип багатоступеневого метального заряду, призначена для досягнення безпрецедентної дальності обстрілу. Завдяки системі підземних тунелів вона розганяє снаряди до надзвукової швидкості, перш ніж випустити їх у напрямку віддалених цілей."
stronghold_network: "Мережа укріплень"
stronghold_network_plural: "Мережі укріплень"
stronghold_network_desc: "Розгалужена оборонна система з масивних бункерів і добре укріплених позицій, призначена для відбиття наступу противника та захисту ключових стратегічних районів."
 
 naval_supply_hub: "Вузол військово-морського постачання"
 naval_supply_hub_desc: "Ця споруда дає змогу вашим флотам поповнювати запаси пального та припасів на цій базі, додатково до їхніх основних баз, що потенційно збільшує радіус дії ваших §Yоперативних з'єднань§!.\nВузол військово-морського постачання можна звести лише в прибережній провінції, де є морська база щонайменше 8-го рівня."
 naval_headquarters: "Штаб військово-морських сил"
 naval_headquarters_desc: "Ця споруда дає змогу призначити адмірала, який підвищуватиме ефективність §Yоперативних з'єднань§!, що діють у межах досяжності штабу.\n\nОдночасно можна призначити адміралів щонайбільше до $MAXNUM|H$ штабів.\nНаразі призначено: $CURRNUM|H$\n\nШтаб військово-морських сил можна звести лише в прибережній провінції, де є військово-морська база щонайменше 8-го рівня."

thermoelectric_plant:0 "Теплоелектростанція"
 thermoelectric_plant_plural:0 "Теплоелектростанції"
 thermoelectric_plant_desc:0 "Ця будівля забезпечує державу £power_texticon  §Yелектроенергією§!\n\nВиробництво електроенергії:"
hydroelectric_plant:0 "Гідроелектростанція"
 hydroelectric_plant_plural:0 "Гідроелектростанції"
 hydroelectric_plant_desc:0 "Ця споруда забезпечує регіон електроенергією £power_texticon  §Yзагальної електромережі§!.\nЕлектрифікація регіонів надає додаткові комірки для будівництва.\n\nВиробництво електроенергії:"
 KD_Large_Hydro_Electrical_Plant: "Бонус від великої гідроелектростанції"
 nuclear_reactor:0 "Ядерний реактор"
 nuclear_reactor_plural:0 "Ядерні реактори"
 nuclear_reactor_desc:0 "Ця споруда забезпечує регіон значними обсягами електроенергії £power_texticon  §Yзагальної електромережі§!.\nЕлектрифікація регіонів надає додаткові комірки для будівництва.\n\nВиробництво електроенергії:"
 enrichment_plant:0 "Збагачувальний завод"
 enrichment_plant_plural:0 "Збагачувальні заводи"
 enrichment_plant_desc:0 "Ця споруда забезпечує виробництво збагаченого урану для використання в ядерній зброї.\n\nТочна кількість ядерних боєголовок, що вироблятимуться щомісяця, залежить від рівня наших §Yвитрат на ядерну програму§!. Якщо уран відсутній, боєголовки не вироблятимуться.\n\nБазове виробництво боєголовок: §Y+20/місяць§!\nЩомісячні експлуатаційні витрати: §Y50 мільйонів $§!\nСпоживання електроенергії: §R-2§! £power_texticon.\nСпоживання урану: §R-6§! £uranium_texticon."
 missile_silo:0 "Ракетна шахта"
 missile_silo_plural:0 "Ракетні шахти"
 missile_silo_desc:0 "У цій будівлі зберігаються і запускаються МБР. Кожна шахта збільшує нашу §Yударну силу§! на певну величину, яка залежить від розміру наших запасів.\n\nЕнергоспоживання мережі: §R-1§! power_texticon.\nЩомісячні експлуатаційні витрати: §Y25 мільйонів $§!"

 schools:0 "Школа"
 schools_plural:0 "Школи"
 schools_desc:0 "Будівництво шкіл - це лише частина проєкту зі створення освіченої, добре поінформованої бази громадян. Налагодження транспортного сполучення для підвезення дітей до школи, забезпечення їх належним харчуванням, а також стипендії для заохочення вступу до вищих навчальних закладів є не менш важливими для розвитку робочої сили та інтелігенції нашої країни. Фізичне будівництво та фінансування навчальних закладів - все це рахується як витрати на освіту, і ці витрати будуть зростати разом з нашими амбіціями.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon."
 hospitals:0 "Лікарня"
 hospitals_plural:0 "Лікарні"
 hospitals_desc:0 "Здоровий народ - це продуктивний і задоволений народ. Якою б не була політика у сфері охорони здоров'я, наявність фінансованих та оперативних служб невідкладної допомоги є обов'язковою, і держава може втручатися у сферу охорони здоров'я будь-якими способами. Чим більше ми втручаємося, тим дорожче буде підтримувати і розширювати наші послуги, якими б корисними вони не були.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon."
 barracks:0 "Військова база"
 barracks_plural:0 "Військові бази"
 barracks_desc:0 "Аматори вивчають тактику, професіонали - логістику. У цій старій максимі є частка правди, адже з часів Першої світової війни той, хто першим мобілізується для участі в конфлікті, отримує перевагу. Витрати на випередження на логістичному фронті можуть бути великими, від будівництва та утримання фортів і авіабаз до модернізації та обслуговування військової техніки, і ми будемо тим більше вдячні за це, коли настане час для наших збройних сил вийти на поле бою.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon."
 offices:0 "Адміністративний офіс"
 offices_plural:0 "Адміністративні офіси"
 offices_desc:0 "Бюрократи. З ними не можна жити, без них не можна жити. Сам державний апарат повністю залежить від їхньої роботи в кінцевому підсумку. Для того, щоб держава працювала безперебійно і без корупції, нам потрібно забезпечити державні відомства достатнім фінансуванням і кадрами. Це може коштувати дорого, і це буде ще дорожче, якщо держава візьме на себе додаткові обов'язки.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon."
 prisons:0 "В'язниця"
 prisons_plural:0 "В'язниці"
 prisons_desc:0 "Закон і порядок важко підтримувати в сучасному світі. Лінія проти хаосу часто є тонкою і крихкою, намальованою на піску, і утримати її можуть лише наші поліцейські сили та їхні мережі підтримки. Фінансування поліції йде лише на утримання та розширення в'язниць, залучення не-поліцейської допомоги та інших методів боротьби зі злочинністю та її попередження, є багато речей, в які можна інвестувати кошти, що в кінцевому підсумку допоможе або попередити, або зупинити злочинність в нашій державі.\n\nЕнергоспоживання мережі: §R-0.5§! £power_texticon."

