 ## Leader Descs ##
 POLITICS_SIDDIQ_ABUBAKAR_III_DESC: "Сіддик Абубакар III, султан Сокото, командувач вірними, Саркін Мусульмі, і голова нігерійського відділення суфійського ордену Кадирія, є останнім ланкою в ланцюзі, що тягнеться в далеку історію цього куточка Африки. Народився в 1903 році, в день, коли британці нарешті підкорили султанат Сокото, Абубакар є нащадком засновників держави Сокото, які відіграли ключову роль в утвердженні ісламу на півночі Нігерії. Отримавши релігійну освіту, Абубакар проявив себе як досвідчений адміністратор, добре обізнаний з традиційними законами свого народу, перш ніж стати султаном у 1938 році.\n\nПравлячи як фактично абсолютний монарх і духовний наставник, Абубакар користується підтримкою значної частини традиціоналістських верхівок фуланів, але зростаючий опір з боку реформістських сил у царстві починає загрожувати легітимності султана.\n\nЩо гірше, хауса з Сокото, довгий час позбавлені будь-якої реальної репрезентації, відчувають обурення щодо султанату, що домінує серед фуланів, оскільки вимоги щодо автономії для хауса дедалі голоснішають. Нарешті, інші етнічні групи на кордонах царства Сокото, у основному зірма й фулбе, також занепокоюються під ярмом фуланів, і, ймовірно, готуються відокремитися від султанату. Попри все це, султан Абубакар ще тримається - лишень час покаже, чи вистоїть його прихильність до стародавніх і шанованих традицій його предків в цьому новому, жорстокому світі."

