 ### Ideas ###
 HAU_idea_islamic_influences: "Ісламські авторитети"
 HAU_idea_islamic_influences_desc: "Іслам має важливу роль на всіх рівнях суспільства в султанаті Сокото. Від простих людей до найвищих щаблів влади, імами й інші релігійні радники консультуються щодо кожної дії та рішення. Хай контроль віри не є абсолютним, її вплив - усепроникний, і слова пророка ніколи не віддаляються від свідомості правителів султанату."