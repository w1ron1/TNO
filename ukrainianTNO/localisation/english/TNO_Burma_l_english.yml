## Опис Лідерів ##
 POLITICS_AUNG_SAN_DESC: "Революціонер, соціаліст, зрадник, колаборант, батько-засновник.\n\nУсі ці слова можуть описувати батька-засновника Бірми Ауна Сана, залежно від того, кого спитати. Народжений у 1915 році під іменем Хтейн Лін у сім’ї середнього класу, Аун Сан мав стати одним із багатьох юридичних функціонерів Бірми — принаймні, поки не приєднався до революційного націоналістичного руху. Відтоді траєкторія його життя змінилася назавжди: він швидко став відомою фігурою в організації Добама Асіайон або ж "Асоціація Ми, Бірманці". Заарештований у 1939 році, Аун Сан отримав неочікуваний шанс змінити своє майбутнє, коли японський офіцер Кейдзі Судзукі звернувся до нього в Рангуні — їхні стосунки триватимуть ще щонайменше десять років.\n\nКоли Індія впала у 1943 році, Бірма нарешті отримала незалежність, але влада була поділена між революційними націоналістами Ауна Сана в армії та урядом Ба Мави, проте це не могло довго тривати. Ба Мава мав мало союзників, і японці швидко побачили цю слабкість. У доленосний день 1952 року Бо Хму Аун та Не Він вирушили до президентського палацу в Рангуні й змусили бірманський парламент провести плебісцит, у результаті якого Аун Сан став тимчасовим президентом.\n\nАун Сан нарешті здійснив свою мрію, але це не означає, що історія завершилася. Держава залишається хиткою, повстанці спустошують сільську місцевість, духовні лідери Бірми відкидають секуляризм Ауна Сана, об’єднуючись із землевласницькими елітами, а тінь Японії досі нависає над країною. Єдиний його надійний союзник, Нетаджі Субхаш Чандра Бос, занадто зайнятий остаточним звільненням Індії.\n\nВелика людина з великими амбіціями потребує великих жертв. Але де проходить межа між необхідним і надмірним?"

## Опис Міністрів ##
 BUR_Ne_Win_hog_desc: "§YПрем'єр-міністр\nВійськова хунта§!\n--------------\n§LНе Віна найкраще описує вислів «усміхнений тигр у траві». Навіть дата його народження залишається невідомою, її знають лише його Тридцять Товаришів. Усе, що відомо про його довоєнне життя, — це те, що він народився в окрузі П'яї в родині хакка та навчався на лікаря. Його виключили з університету в 1931 році, але він застосував ту ж точність і хірургічну майстерність, яку отримав у навчанні, до своїх військових амбіцій, приєднавшись до фракції У Ба Сейна та Тхакіна Тун Ока в організації Добама Асіайон у 1931 році.\n\nКоли в 1942 році японці увійшли до серця Бірми через тайський кордон, Не Він отримав наказ створювати партизанські мережі за лініями британців, що він виконав із великою майстерністю. Цей досвід виявився безцінним, адже він чудово знав тактику партизанської війни — що стало особливо важливим, коли Ба Мав наказав йому придушити повстання Сміта Дана після здобуття Бірмою незалежності. Але Не Він поступово почав будувати власні політичні амбіції щодо створення самодостатньої Бірми. У 1952 році він і Бо Хму Аун вирушили до палацу Ба Мави.\n\nНе Він швидко став заступником Ауна Сана й здобув репутацію творця Татмадаву як потужної, але жорстокої антипартизанської сили. Чотири удари — саме стільки потрібно для знищення ворога, як це було в Північному Китаї під час японської окупації. Проте партизани тільки посилюють свій опір, а Татмадав змушений розтягувати свої сили. Дехто вважає, що через цивільне втручання повстання досі не придушене, а інші говорять, що Не Він, мов тигр у траві, просто чекає слушного моменту, щоб усунути всіх, хто стоїть на шляху до великої Бірми.§!"
 BUR_Thakin_Nu_for_desc: "§YМіністерство закордонних справ\nЛівий націоналізм§!\n--------------\n§LЮрист за освітою, У Ну народився у поважній родині в 1907 році та розпочав свою юридичну кар'єру в Рангуні у 1929 році. У університеті він познайомився з Аун Саном, і між молодими революціонерами утворився нерозривний зв’язок. Від конфліктів з ректорами університетів і місцевою поліцією до відкритого протистояння з британцями — Аун Сан і Ну залишалися разом у боротьбі, принаймні до приходу японців.\n\nПопри небажання брати участь у бойових діях, У Ну залишався вірним своїм марксистським ідеалам навіть після конституційної поправки 1954 року, яка оголосила комунізм поза законом під тиском Японії. Впливовий союз із Бодзьоке захищав У Ну, але його товаришів і братів-комуністів ніщо не вберегло від переслідувань. Наразі мрія У Ну про демократичну, справедливу та соціалістичну Бірму залишається лише мрією — якщо тільки не буде вжито радикальних заходів, щоб змінити долю нації.§!"
 BUR_Thakin_Mya_eco_desc: "§YМіністерство фінансів\nСоціальний націоналізм§!\n--------------\n§LМережа революційних союзників Аун Сана трималася на молодечому ентузіазмі та братерстві — і жоден не уособлює цих цінностей краще, ніж Тхакін М'я, попри його відносно старший вік. Народжений у 1897 році в окрузі П'яї, він здобув освіту в галузі природничих наук, але швидко приєднався до зароджуваного націоналістичного руху. Попри те, що він не був членом Добама Асіайон і був старшим за Аун Сана, він швидко став його довіреною особою та радником. Без спеціальної підготовки, Тхакін М'я зумів досягти значного дипломатичного успіху, уклавши Шонанську угоду 1945 року, яка формально закріпила незалежність Бірми після завершення Тихоокеанської війни, що стало відправною точкою для економічного розвитку країни. Майбутнє здавалося світлим, але історія на цьому не закінчилася.\n\nЧерез 17 років після здобуття незалежності Бірма все ще перебуває в тіні Японії. Молодою нацією продовжують стрясати заворушення, і уряд не контролює всі території, на які претендує. Тхакін М'я витримав багато випробувань, але реальність бірманської незалежності стала найважчим викликом у його 65-річному житті та 30-річній боротьбі за свободу.§!"
 BUR_Bo_Hmu_Aung_sec_desc: "§YМіністерство оборони\nВійськова хунта§!\n--------------\n§LНароджений під ім’ям Сан Хлайн у родині фермерів, Бо Хму Аун у юності цікавився релігією. Будучи завзятим читачем, він проводив свої молоді роки, вивчаючи буддійську літературу. Однак, не встигнувши скласти фінальні іспити для отримання сану монаха, він повернувся до села, щоб заробляти на життя сільським господарством. Проте потрясіння Революції 1300 року визначило його остаточний шлях — шлях революціонера.\n\nБо Хму Аун став одним із Тридцяти Товаришів — тих, хто відгукнувся на заклик Аун Сана пройти військову підготовку за кордоном. Отримавши досвід, він повернувся до Бірми після здобуття незалежності у 1943 році. Дев'ять років потому він разом із Не Віном увійшов до Президентського палацу в Рангуні, змусивши парламент провести плебісцит, за підсумками якого Аун Сан був призначений тимчасовим президентом. Сьогодні він є головою генерального штабу режиму, керуючи жорстокими, але ефективними антипартизанськими операціями Татмадаву.§!"

 ### Ідеї ###
 BUR_idea_suspension_of_the_1953_constitution: "Призупинення Конституції 1953 року"
 BUR_idea_suspension_of_the_1953_constitution_desc: "§YКонституція 1953 року§! повинна була стати новим початком для Бірми, забезпечуючи плюралізм, свободу віросповідання, мов та регіональне самоврядування. Однак роки після її ухвалення стали лише знущанням над цими ідеалами — §eТатмадав§! захопив владу над регіональними органами під приводом національної безпеки, а представницька демократія була фактично скасована. Лідери в Янгоні продовжують відмахуватися від народних протестів, обіцяючи відновити Конституцію, коли нація стане безпечною. Питання лише в тому, коли це станеться?"
 BUR_idea_suspension_of_the_1953_constitution_tt: "--------------\n§LЯкщо §YКонституція§! залишиться призупиненою занадто довго, §Rнародне невдоволення§! може перерости в повстання проти §wАун Сана§!.§!"

 BUR_idea_an_union_in_perpetual_conflict: "Союз у вічному конфлікті"
 BUR_idea_an_union_in_perpetual_conflict_desc: "З часу, коли §Lтайці§! та §Wкитайці§! спустилися у долини §JШанської держави§! з північного сходу, наша країна не знала спокою. Коли §Vкомуністи§! та §iкаренські зрадники§! підняли зброю проти батьківщини, це принесло лише більше страждань. Наші солдати в окопах під Мандалаєм пишуть додому, але дім залишається лише мрією. Щодня все більше непатріотичних елементів накопичують силу, і наближається буря, що може зруйнувати нашу націю."
 BUR_idea_an_union_in_perpetual_conflict_tt: "--------------\n§LЯкщо §Rповстанці§! на північному сході не будуть придушені вчасно, все більше людей втратить віру у §QСоюз§! і почне його відкидати.§!"

 BUR_idea_the_fading_star_of_the_father: "Згасаюча зірка Батька"
 BUR_idea_the_fading_star_of_the_father_desc: "Наш легендарний §wБодзьоке§! був вірним воїном нації, готовим віддати своє життя за §QСоюз§! та народ. Але деякі вважають, що він є мішенню для корумпованих і зрадницьких сил, які прагнуть знищити все, за що він боровся. Якщо змову буде викрито, щури, що ставлять під сумнів його легітимність, будуть знищені без жалю."
 BUR_idea_the_fading_star_of_the_father_tt: "--------------\n§LЯкщо підтримка §wАун Сана§! впаде занадто низько, §eТатмадав§! вдасться до §Rрадикальних заходів§!, щоб захистити §wБодзьоке§! та державу.§!"

 BUR_idea_a_government_of_six_miles: "Уряд шести миль"
 BUR_idea_a_government_of_six_miles_desc: "§wАун Сан§!, хоч і очолює революційний уряд, насправді не контролює територію §Rпоза межами шести миль від міста Рангун§!. Релігійні лідери, землевласники та інші противники режиму змовляються, щоб обмежити вплив держави лише номінальною владою. Однак §wАун Сан§! не має наміру миритися з таким статус-кво. У залах Президентського палацу ДАА розробляє радикальний план реконструкції. §wАун Сан§! вірить, що це стане вирішенням багатьох проблем Бірми. Проте не всі поділяють його впевненість."
