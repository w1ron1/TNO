 #Indian Civil War
 ind_civil_war_concluded_tt: "The Indian Reunification War has concluded."

## Japan-India Interactions ##

 jap_india.1.t: "Another Door Opens"
 jap_india.1.d: "In a small, unassuming office of the Japanese Embassy in Kolkata worked Major-General Hideo Iwakuro, the Empire's ambassador in its easternmost outpost. On one corner of his desk lay a stack of documents, some dog-eared, some coffee-stained. On the other sat an old Webley revolver, taken years ago from a surrendering British spy in Singapore who soon found himself well acquainted with the .455 bullets it took. When three knocks came sharply from the door and one of the fresh-faced diplomatic aides from Tokyo let himself in, Iwakuro ignored the momentary gawk at the gun and focused instead on the message.\n\n"USN manoeuvring in the Pacific. Nixon & State Department untrustworthy - arms flooding to insurgents via Indian Ocean route. Meet Bose and discuss rearming INA - blank cheque from Army. Other arms report back to Singapore."\n\nThe aide excused himself. Iwakuro read the document again. Almost against his will, his mind cast back to the start of his time in Burma and India - the everpresent humid heat, the months spent training spies and smuggling arms, the neverending clashes with the naive idealism of the Indians. The scent of blood and guts draining into fetid mud, hidden forevermore under the steaming jungle. It had all been so long ago.\n\nBut now, it seemed, the game had started again. Underneath the placidity of a military bureaucrat grew the quiet excitement of a field agent - the spy demanding action once more. Iwakuro picked up a notepad and began scribbling in a list of numbers - a mix of old wartime comrades and new civilian friends. If Tokyo needed a fire lit on the Ganges, he would see that it would dwarf even the Himalayas. Before leaving, he put on the holster that had sat in his desk for the past fifteen years."
 jap_india.1.a: "The old Webley still fit inside perfectly."

 jap_india.2.t: "A Fruitful Relationship"
 jap_india.2.d: "It had been a long while since Iwakuro had met Bose privately. Outside of official functions and receptions, the old wartime leader that he had known as a firebrand speaker with little military knowledge had sealed himself off within a tight circle of close friends and the gilded cage of a cult of personality. As he waited outside Bose's office in the Writer's Building, the Major-General reminisced. He had never got along with any of the naive idealists of the 'Independence Leagues' and all the nonsense Fujiwara had put in their heads. But they had succeeded, and now Tokyo needed them friendly.\n\n"Sir? The President will see you now."\n\nIwakuro entered, and sat down. An old man, skin dotted with liver spots, looked back at him. Were it not for the eyes, still burning with that old passion, he almost would not have recognized Bose.\n\n"Major-General. Thank you for your efforts - I assure you they haven't gone unnoticed."\n\n"President Bose. I thank you in return - you will see on pages 2 and 3 of the report that Army HQ has agreed to ship another thousand assault rifles, and just under three hundred artillery pieces. In addition - "\n\n"I appreciate the support. But the INA is outnumbered almost two to one. What we need is air power - the same power that won the war in China. What did the Imperial Air Force have to say?"\n\nIwakuro shifted in his chair. "Unfortunately I haven't much good news on that front. Even a squadron of jet fighters will need tens of hundreds of engineers, maintenance workers, and so on. For the time being, we can send over a detachment from Taiwan - 12 planes, and the associated staff."\n\nBose nodded and calmly considered this. Then he looked back.\n\n"This war will decide the fate of half a billion people. If there is anything you can do with the Air Force, we will remember it.""
 jap_india.2.a: "The weight of millions upon a single man. More accurately, two."

 jap_india.3.t: "Our Wild West"
 jap_india.3.d: "It had taken quite some time for Iwakuro's web of spies and contacts to reach the north-western frontier. Field agents spending careful months embedding themselves in or along the Pakistan Movement, arms smugglers, thieves, and the other lowlives that regularly worked with guerillas, and every once in a while a true believer in the Pan-Asian cause. Now, he had finally gotten enough information - hopefully to light a fire under Tokyo's ass. Because one thing was absolutely certain - the Nazis had arrived in force to this corner of the world.\n\nThe first sign was the overthrow of the lord of the Frontier Provinces, Nawabzada Khan, and the writing was on the wall for the Khan of Kalat next. In previous dispatches Iwakuro had described the relations between the rulers and the ruled in the Frontier Provinces as reminiscent of pre-Meiji feudalism - a colourful exaggeration that nevertheless served the point. Tribal landowner relations had dominated politics for centuries until the arrival of a powerfully modern new force - the Muslim League - bringing with them a religious nationalist movement that sought the creation of a new nation-state. Even though the Afghans cautiously supported this movement, it was more to keep the region unstable and the sword still in its scabbard to be unsheathed when the time was ripe. And that time was rapidly approaching.\n\nArms smugglers in the area that had for the past few decades considered old wartime Sturmgewehrs and leftover Russian guns as their top of the line had suddenly found themselves flush with German ammunition and guns from the 50s rather than the 40s. Leather-jacketed foreigners - Europeans - were spotted entering Army tents with detailed maps and suitcases, and staying until the crack of dawn. Most importantly, however, sudden isolated incidents of religious lynchings in previously peaceful villages on the Indian side of the border had been slowly but surely inflaming tensions - to what end?"
 jap_india.3.a: "The Germans are trying to outmaneuver us in our own backyard."

 jap_india.4.t: "The Unstoppable Tide of Subhasism"
 jap_india.4.d: "Marching along the Red Road, in hypnotic lock-step, went the Indian National Army. Column after column, stretching back almost endlessly, the rhythmic thumping serving to dull the rational mind and awaken that part of the social animal that craved violence and conformity. Iwakuro's mind turned back towards the parades he had seen in his boyhood, of the Imperial Army only a few decades after its inception, and the overwhelming feeling of pride and awe. Of course, those days were long past, and the only emotion he felt now was a vague sense of uneasy anticipation. The INA marched perfectly, their weapons were good, and unlike their enemies many of their formations were battle-tested in foreign conflicts. Though they were outnumbered two-to-one, there was no better partner than the Japanese to demonstrate what the strength of will did for the fighting ability of men.\n\nEven so. The coming war would be significantly more than a few decisive battles. Once Delhi's forces had had a chance to dig in most of the bright-eyed and well-trained troops he saw marching before him would be reduced into so much bloody pulp, and the real nature of war would reveal itself. Japan had won against the most powerful industrial nation in history not because of its superior ability to train troops, but because of its superior ability to transform all of society into a machine tuned for a single purpose - total war. A concept so utterly alien to the Indian subcontinent that the last major war they had seen was the ancient one they spoke of in their epics. And even that would have been only a small skirmish compared to what was to come.\n\nThe soldiers marched on. Out of the corner of his eye, the major-general caught a glimpse of Bose. Behind the paternal smile and photo-perfect look of confidence lurked exactly the same worry - and something else. It took a while before it clicked - it was the same look he had seen in one of his superiors, the day war had been declared on the British Empire, and a few weeks before Malaya fell in a storm of arms nobody saw coming. It was a look that said 'Damn what the analysts say - today we rewrite history.""
 jap_india.4.a: "And then, of course, they did."

 jap_india.5.t: "Rupture in Kolkata"
 jap_india.5.d: "Returning from the residence to the main embassy complex in Kolkata, ambassador Hideo Iwakuro felt the unease even in the stoic faces of the guards. Stepping into the embassy building itself, the totality of it was sinking in. People gathered around the radio, or someone with a newspaper, and took in the news.\n\nThe Yasuda Crisis, as they were calling it, was a body blow to the economy of the Sphere. The shock had reached Free India, and embassy staff fretted for their jobs, for their families. Iwakuro saw a particularly vulnerable office clerk dry heave into a wastepaper basket, and two secretaries rubbed his back sympathetically. The halls were altogether too heavy, and the ambassador crossed the threshold of his office and shut the door behind him with relief.\n\nThis relief lasted until he turned around and saw the mail on his desk, letters and telegrams from concerned early callers. He could still faintly hear the staff murmuring in the hall. Sighing, he wondered how he'd explain to Bose that Tokyo purse strings had just tightened."
 jap_india.5.a: "The Sphere flinches."

 jap_india.6.t: "Then I Used Up All My Money"
 jap_india.6.d: ""You understand that this is very disappointing news, Mr. Iwakuro." The Indian politician glared witheringly at the Japanese ambassador through thick spectacles. "Chairman Bose was under the impression that Tokyo had already agreed to supply the funds."\n\nIwakuro Hideo lowered his head and swallowed his pride, reminding himself that this sort of confrontation was part of the role. "And we express our deepest apologies, Professor Guha." He adjusted his collar. "The recent financial shock has, of course, prompted some recalculations on what Japan can and cannot currently afford."\n\n"With respect, the Indian people are not in a position where the militarization project can succeed or fail based on whether or not a businessman in Guangdong sneezes. This is a national struggle."\n\nIwakuro smiled weakly. "Please, rest assured a substantial amount of funding and material is still on its way. You can still rely on us."\n\nGura simply adjusted his frames and rose from his seat, making his way casually to the door. "I hope that's true, ambassador. What we're embarking on is very serious. The cost you would pay for backing down... please account for that in your calculations."\n\nAfter his guest departed, Iwakuro considered what to report back home. He could recommend aid to India be increased - not to the original sum, but enough to perhaps make a difference in the event of hostilities. On the other hand, he could remain silent, and not saddle Japan with even more debt, but alienate Bose's government in the process."
 jap_india.6.a: "Iwakuro writes a memorandum urging Tokyo to increase military aid to Free India."
 jap_india.6.b: "Iwakuro holds firm, and says nothing. Free India will make do."

 jap_india.7.t: "For Want of a Nail..."
 jap_india.7.d: ""I'm sure you're aware of the fighter deal between us and India." spoke Iwakuro Hideo, as [JAP.GetLeader]'s eyes glazed through a seemingly endless assortment of figures detailing locations and designs, logistics pooling through in their resources and any lingering faults. "Of course, yes." he responded, his eyes rapid and head unmoving. "We're pleased with the close alliance we share with the people of India, and we'd be happy to allow it to continue for years to come."\n\n"With all due respect, sir," stammered the American ambassador, a shorter man with balding hair. "We're not in the same position we were ten, even five years ago." He looked down, sheepishly.\n\n"There may be a rival government in Delhi, but I don't see why that should alter our arrangements" responded Iwakuro, flatly. "If anything, that should further emphasise the need for us to stand by our agreements. Increasing the level of support we give the air force of India will help to give us a decisive advantage, and Nehru would be foolish to attack there."\n\n[JAP.GetLeader] tried to respond, but a brief moment of doubt clouded his first word, enough for the American ambassador to crack it open yet further. "Perhaps, but Delhi is no longer alone. If we push here, then the United States will be happy to escalate in kind" His face creased into a frown for a moment.\n\nShuffling the papers in front of him around, [JAP.GetLeader] struggled with the implication. Would India truly be able to handle a war against its larger, stronger neighbour? How far would the United States be willing to go with this? Networks still existed in Delhi; would he be able to use a potential retraction to swing interest in a beneficial direction? His stony expression buckled as he cleared his throat."
 jap_india.7.a: ""We will not break agreements with our allies. We'll look to extend our fighter deal for longer.""
 jap_india.7.b: ""The American ambassador is right. We cannot afford to increase tensions in India at this time.""

 jap_india.8.t: "Death of a Separatist"
 jap_india.8.d: "From: Daihonei Tokumusoukanbu\n\nTo: [JAP.GetLeader]\n\nTopic: Death and succession of Jawaharlal Nehru\n\nFor the last few weeks, we have been aware that Prime Minister Jawaharlal Nehru of India was severely ill due to an unidentified viral illness. We have been made aware that has passed within the last few hours, with succession plans currently being put in place. His death has likely been expected for some time, with his condition slowly but continually declining since the start of April. We have yet to receive word surrounding an announcement, but it will likely be forthcoming, and it would be wise to prepare our condolences, especially if expected succession plans are put into place.\n\nDue to the length of his illness, his succession will likely have been fully established. Most of our contacts in government were made loosely aware of his death being imminent in the final days of Nehru's life. Our existing networks within the Delhi government should be able to remain in place, though certain reshuffles could have ramifications for its strength. No significant internal change has been noted thus far.\n\nAlthough not certain, we expect that V. K. Krishna Menon will come to power as his successor. This should be a positive development for us. Menon is not uniquely radical, and has been an established figure on the international stage since forming the India League in 1928 with the aim of ending British colonialism. He has consistently been a major figure in seeking Indian non-alignment, and should help to reduce tensions between Delhi and Kolkata. Additionally, should he continue to pursue this policy in office, he will likely pursue steps to distance the country from the United States, which could greatly hamper American efforts and might encourage eventual reunification talks."
 jap_india.8.a: "Understood"

 jap_india.9.t: "Stuck on the Sidelines"
 jap_india.9.d: "From: Daihonei Tokumusoukanbu.\n\nTo: [JAP.GetLeader].\n\nTopic: Reunification talks between India and the Delhi Government.\n\nFor a long time, we have worked with the presumption that tensions between Delhi and Kolkata were too significant for any feasible reconciliation. However, recent reports from our networks within both countries instead highlight that preparation for unification talks are deep into planning. Frustrations over a lack of material aid seems to have manifested, but general interest in unification in the region has been high, especially since Nehru's death.\n\nIf these talks go ahead, the ramifications will be immense. A unified India would likely be in a position to fully embrace a policy of isolationism, with little impetus or appetite to further rely on international aid, be it economically or militarily. Supporting reunification early might be enough to swing the eventual government towards us. American support for Delhi is far meeker and far more recent, and could likely be overwhelmed by a direct endorsement from us. Any support from this government, though, will be far looser, and any unification would still mark a major defeat for our overall goals in the region.\n\nAlternatively, we can still attempt to weight the dice in our favour. Relations with India have soured, but they aren't critical yet. We still hold a great degree of soft and hard power, and could still be able to leverage it. If we can provide room for further military support, it is very likely that Indian diplomats may make demands too significant to reconcile. It must be noted, however, that we would likely have to support India in a costly, lengthy and devastating war, and the chances of them remaining hardliner will likely still be relatively low."
 jap_india.9.a: ""Perhaps it is time for us to cut our losses in the region. Back the reunification talks.""
 jap_india.9.b: ""We can't afford to concede a region as potentially influential as India. Provide whatever support is needed to shut it down.""

 jap_india.10.t: "An Ear on the Door"
 jap_india.10.d: "The Japanese embassy in Kolkata remained a whirlwind of activity, aides and their papers flying around the office, cables and curses drifting through the halls, and a dozen bureaucrats in the middle trying to catch and make sense of it all. Iwakuro Hideo stood at the centre of those bureaucrats, synthesising their fact-finding, the endless groping in the dark for glimpses of actionable intel that could tell them what was going on in the west.\n\nOne bright young bureaucrat, one Iwakuro would've taken under his wing ten years ago, dragged him out of his office and onto the balcony of the embassy. Guards were ever-present, but nestled between hedges and overlooking a nice part of town, the blows of bad news could be softened and good news could be cherished more.\n\n"They're still in talks," said the bureaucrat, who saw the relief on Iwakuro's face. "The chance of war breaking out is still there, but we won't be seeing it anytime soon."\n\n"Good." Iwakuro sipped his tea, matcha imported from the Home Islands. "What are they negotiating?"\n\n"They've had some arguments over electoral procedures, but it's mostly fighting about the top position. Bose and Menon have their own ideas about who should run things after unification. We're trying to push our assets in Menon's camp to see it from our point of view, but..." He trailed off, staring into his own teacup.\n\nIwakuro leaned back in his garden chair; the sun's warmth washed his face, but he felt no cleaner. This negotiation was a persistent issue, and the further they delayed it, the more this discussion was left to fester, the closer they risked an exchange of words becoming an exchange of gunfire. Iwakuro sighed, turned back to the bureaucrat."
 jap_india.10.a: ""Let's compromise. I'm sure both sides can find a reasonable partner.""
 jap_india.10.b: ""Don't let Bose give them an inch, my boy. You have to be firm with them.""

 jap_india.11.t: "A Bullet Closes the Mouth"
 jap_india.11.d: ""How is he?" were the first words out of Hideo Iwakura's mouth, flying out towards a group of harried administrators in the Japanese embassy. When the news reached them, panic ensued, and the most important people in the building rushed to their nearest conference room, where Iwakuro now stood on one side while a circle of embarrassed silence gathered on the other side. Eventually, one bureaucrat stepped out from the circle.\n\n"The bullet may be fatal," he said. Iwakuro raised an eyebrow, and was a second away from interjecting. "Bose was rushed to hospital, and he's stable now, but we don't know for certain."\n\n"Fuck's sake," muttered Iwakuro. Aching joints forced him to take a seat and catch his breath. "Do we know who did this? Who the hell pulled the trigger?" He looked at all of them, his unspoken follow-up question running chills through their spines.\n\n"We're still investigating the killer's motives," said the circle's representative. "But he's not among our usual suspects, and he has no known connections with any of our assets."\n\n"Good," said Iwakuro, rubbing his chin. "Gentlemen, we should consider the negotiations a lost cause. Calcutta will blame Delhi, Delhi will act indignant, and they'll both stop exchanging words. Soon afterwards, they'll start exchanging bullets."\n\n"I've already contacted the Ministry of Defense," said another bureaucrat. "I've given them the preliminary information, and I'll personally update them ev-"\n\n"You'll do nothing of the sort." Iwakuro rose from his seat, staring at the circle. "We're staring into the face of war. I'll be handling all communications with Japan moving forward. And I'll be telling them to prepare for it.""
 jap_india.11.a: "Above them, a clock ticked one minute forward."

 jap_india.12.t: "A Bandaged Hand Raises Itself"
 jap_india.12.d: "Subhas Chandra Bose tried not to show the persistent ache in his body. If he moved the wrong way, coughed a little too hard, it was like he was shot all over again. Though he did not wish to be free of the pain, for it served as a useful reminder of many ills—complacency, treachery—he knew it was deeply inconvenient at best. Whenever he was with others, he clenched his fist and ground his teeth to suppress the shock. In private, he let himself wince and curse. The only time he never felt that pain was before a crowd. He had never appreciated the analgesic effect of an audience before, but standing here in front of where he was shot, he and thousands of his countrymen in defiance of the attempt, he felt nothing but a kind of righteous fury which superseded all other sensations.\n\n"Even now, he denies any responsibility for what his actions have wrought!" His voice was animated, bouncing between steely determination and fiery outrage. "He has spat upon our attempts to bring peace to India! He flees to Delhi, seat of his false state, and he takes with him our negotiations, tossing it aside on the road like litter!"\n\nIwakuro Hideo, Ambassador to India, watched the performance from the back of a sedan, the radio tuned to a nearby news broadcast so that he could hear it clearly from a street away. Iwakuro chuckled; Bose sounded like he hated Menon more than the man who shot him. But he had to know what was being said. Bose issued enough praise to the Co-Prosperity Sphere earlier in his speech to know he wanted their support when the shooting started.\n\n"We are entering a time of great confusion. I know that many of you worry. I ask you to be strong in our struggle to achieve unity and prosperity. But our cause is righteous. Nothing shall deter India from realising its destiny of a unified continent, from Karachi to Kohima!" If the mere presence of the crowd was analgesic, the roar of support that followed was euphoric."
 jap_india.12.a: "A black sedan trailed away, thinking of bombed streets and blood in the mountains."

 jap_india.13.t: "A Broken Hand Passes the Torch"
 jap_india.13.d: "Subhas Chandra Bose could not ignore the persistent ache in his body. It flared up with every sudden movement. He coughed, and he was shot all over again. He sneezed, and a flower of pain bloomed in him again. The pain reminded him of his own weaknesses, of the treachery that lurked in Calcutta, and he knew that he had survived this bullet by pure luck. A second one would kill him. So he was here, in front of thousands mournful and hopeful, ready to pass on the cause to someone stronger, someone without a bullet weighing them down.\n\n"It is with great honour that I thank the Ambassador for joining us today," he said, pointing to said ambassador sitting beside him on the stage. "Japan has been a loyal ally of India for decades. We have been proud to serve alongside our brothers in the Co-Prosperity Sphere, and I pledge that we shall remain stalwart allies of this great and mighty movement for peace, prosperity and independence for all oppressed and enslaved peoples."\n\nA round of applause broke out; Iwakuro Hideo, half-thinking of his career in China and Manchuria, joined in with hollow claps. Beneath that praise was a kind of pleading from Calcutta to Tokyo, one he had been relaying over and over again: "Help us. Fight with us. Give us arms and tanks and bomb the hell out of the American puppets. Fulfil your obligations."\n\nThe sun was going down, and at the beginning of that golden hour Bose turned the microphone over to his successor. Iwakuro knew, if nothing else, that Chatterji would play along. He had enough hatred for the false state in Delhi to gladly receive Japanese support, and pay whatever price was necessary. As Chatterji took the stage and weaved subtle promises of revenge in a speech all about unity, Iwakuro was running through plans in his head, mentally editing them to account for the new leader. He found that little changed—least of all the chance of a war, which was growing by the day."
 jap_india.13.a: "The sun inched a little closer towards the horizon."

 jap_india.14.t: "INVASION APPROACHING"
 jap_india.14.d: "TOP SECRET\n\nFOR THE EYES OF IGHQ ONLY\n\nMy respected superiors,\n\nThe imminent war between the two rival governments in India has reached its final stage of preparation. A major buildup on the border has seen hundreds of small and medium fortifications erected, including several major constructions on the road to Delhi itself, and aerial imaging has confirmed an increased emphasis on logistics in the form of supply caches, petrol stations, and makeshift roads for motorised transport. All signs point towards the Republic of India planning an immediate sustained offensive on the first day of the war - intelligence reports from my agents embedded in their military apparatus confirm that they intend to strike first, rather than counterattack the Indian National Army's own plans (see attached report).\n\nWhile the precise date planned by Delhi remains unknown and my men will continue to search, it seems all but certain that Bose will be able to strike first before they are able to mobilise entirely. I will report as soon as a date is given, following which the Twentieth and Fifteenth Detachments based in Rangoon and Singapore will rendezvous immediately along with their aerial complements to support the forces here. We retain plausible deniability of involvement apart from material aid, a strategy that the Americans are reciprocating.\n\nHumbly pledging my loyalty once more,\n\nMAJ. GEN IWAKURO HIDEO"
 jap_india.14.a: "The drums of war beat louder, louder."

 jap_india.15.t: "INVASION IMMINENT"
 jap_india.15.d: "TOP SECRET\n\nFOR THE EYES OF IGHQ ONLY\n\nMy respected superiors,\n\nI report that all major preparations for the war in India are complete, and Kolkata has reported a start date of [?global.date.GetDateStringNoHour], Shōwa 40. The forces of the Indian National Army, aided by artillery bombardment and aerial support from both our detachments and their air force, will launch a series of lightning assaults aimed at circumventing most of the enemies dug-in positions and opening the assault into their rear lines. Partially motorised support vehicles will then maintain supply to armoured spearheads which will aim for their main logistical nodes (see attached report, pages 34-42), whilst we carry out long-range bombing to disable their airstrips, supply hubs, and factories. During the initial phase, the Air Force has been instructed to avoid places of worship and populated civilian centres - this policy will be changed as best fits the evolving situation. More details can be found in the report.\n\nI must respectfully reiterate that as per our commitments both private and public, we have chosen to extend the full power and might of the Japanese nation in solidarity with the Indian nation. This conflict will represent our single greatest military commitment since the Second World War, and the eyes of the world will watch to see how the Co-Prosperity Sphere supports its ally. The United States has unilaterally and irresponsibly chosen to support the illegitimate Delhi government to an extremely large degree, representing an escalation typical of their desire to maintain Western colonial hegemony despite our triumph in the War. We must counter their actions with the utmost vigilance and determination.\n\nHumbly pledging my loyalty once more,\n\nMAJ. GEN IWAKURO HIDEO"
 jap_india.15.a: "Ready your sword once more, O warrior."

 jap_india.16.t: "The Tiger Devours Itself"
 jap_india.16.d: "The inevitable has finally occurred, and the war for India's reunification has begun precisely at the expected hour. From the mountains of the Himalayas to the shores of Odisha, the legitimate government in Calcutta has sought to end the artificial division of the subcontinent.\n\nThough both governments have long prepared for this day, our extensive work to ready the Free Indian government for war has already shown promise, with numerous checkpoints and border strongholds having already succumbed to the initial offensive. In particular, our assistance with developing the air force of our allies in Azad Hind has proven invaluable in ensuring that our ally dominates the skies in these crucial few days.\n\nHowever, this is a war between two of the world's most populous governments with some of its largest armies. We must prepare for the long haul and ensure that our ally achieves victory and thus bring India wholly into our brotherhood of nations."
 jap_india.16.a: "There can only be one true India."

 jap_india.17.t: "The Indus Aflame"
 jap_india.17.d: "After ninety days of conflict, it is clear that the Germans have decided to play their own hand in this war.\n\nThe majority Muslim Frontier Provinces in the northwest may not have declared war formally, but their leadership has already declared that the time has come for an independent state for Muslims in the Indian subcontinent. Such would be merely an annoyance had they not already seized the heavily populated region of Punjab while inspiring a wave of likeminded fighters across the subcontinent. For the time being, this is more of a help than a hindrance as the OFN-supported Republic must now fight on two fronts, we cannot assume that the German government has anything but its own interests at heart.\n\nThe Azad Hind government wishes for a unified subcontinent, and the fait accompli of a German-aligned and protected Pakistan may prove a difficult pill for it to swallow in terms of legitimacy. Furthermore, a German intrusion into Southern Asia would make it far more straightforward for the Reich to meddle in our affairs. One of our greatest advantages over Germany so far is its lack of avenues with which to directly threaten our islands, to concede a base as grand as even a part of India to their designs would undermine decades of efforts to contain the Reich's influence to Europe, West Asia, and Africa."
 jap_india.17.a: "An opportunity for boon and bane."

 jap_india.18.t: "My Friend Came to Me"
 jap_india.18.d: "Sonic booms tore through the sky above a wheat farm in Bihar, with the scant few farmers still working the fields scattering toward shelter. Seconds later, pillars of fire and smoke threw earth into the sky, tore wheat from soil, and scattered metal into the tilled fields. After they made sure that the planes were gone, the farmers slowly returned, looking on in horror at the deep scars left by the bombs, and the rapidly spreading flames.\n\nThey rushed to contain the fire, tossing buckets of water at burning patches and stomping out individual stalks. Yet, it quickly became too much for them to bear. Fleeing to higher ground, they watched as months of hard work was swallowed by the blaze. The men and women wept. Not only were they doomed to a future of poverty, but they foresaw a vision in the rising smoke. Emaciated children clutching onto their mothers, hollow faces huddled in breadlines that would never give them enough. If only their sons and grandsons and elder brothers weren't forced to exchange their plows and scythes for rifles, maybe everything would've been okay.\n\nThis was a scene echoed throughout the Free Indian Republic. Disaster loomed on the horizon as the war dragged on."
 jap_india.18.a: "Victory first, then food!"
 jap_india.18.b: "Victory is impossible if the people starve."
 jap_india.18.c: "The frontline and homefront must be balanced."

 jap_india.19.t: "Although I Couldn't Feel the Pain"
 jap_india.19.d: "The eyes of the Indian boy looked into the soul of the ambassador, even though there was a television screen separating the two of them. His face was hollow, and his limbs were too thin to belong to a human. The boy clung onto a motionless woman, dressed in rags that were too large for her body. He couldn't even cry. He could only stare.\n\nThe ambassador looked away from the television, only listening to the report dubbed in Japanese. The famine that had ravaged the poor of Free India for months was now metastasizing into the middle class. It was clear that for the future of their ally, something had to be done to remedy this ailment.\n\nOf course, there was always the option to ramp up support in the civilian sector. Food for the hungry and modern agrarian equipment to hasten the delayed harvest. However, this would mean the frontline suffering as a consequence. They could focus on the frontline more to end the war and the famine quickly. Yet, that would be a tremendous gamble. If victory couldn't be achieved quickly, then the famine would only worsen."
 jap_india.19.a: "The hungry will be fed."
 jap_india.19.b: "Nourishment through victory."

 jap_india.20.t: "Now Won't You Give Some Bread?"
 jap_india.20.d: "The tables and graphs alone were horrific. Numbers escalated from a handful, to tens, to hundreds, to thousands, to ten thousands. The red line on the axes climbed rapidly, without any sign of decline. The pictures attached to the reports made all these numbers personal.\n\nThe ambassador looked at the first photograph. A wide shot of the Ganges, choked with the dead. There was simply no time to cremate all of them, so they were thrown into the river as they were. The second picture was close up pictures of the bodies in the water- wearing rags too large for their emaciated forms.\n\nThe ambassador closed the folder, rubbing his temple. There was no question about it- humanitarian aid had to be raised, increasing Japan's investment in the war. The debate lied in the approach to aid. They could still focus on ending the war so the Azad Hind could prioritize famine relief. That would mean the trend of starvation continuing its path until the war ends. The Japanese could divert their attention to famine relief one hundred percent- but that would leave the frontlines vulnerable.\n\nThe ambassador sighed, picking up the phone. He looked forward to taking a long vacation back home once all of this was over."
 jap_india.20.a: "Keep it balanced."
 jap_india.20.b: "The famine has to end."

 jap_india.21.t: "A Lost Subcontinent"
 jap_india.21.d: "Report on the situation in India\n\nWe of the Daihonei Tokumusoukanbu regret to inform the Prime Minister that the Azad Hind government has fallen to the American-back Republican regime. A treaty of unconditional surrender has already been signed by their President, as the provisional government has been dissolved, with the Bengal being placed under military supervision by the victors.\n\nWith our support of the former Azad Hind government having been so visible and widespread, we have virtually no chance of creating a rapport between us and the unified Republic of India, an enmity only enhanced by the perceived role we played in their recent famine — which they lay at our feet for supporting their rivals for power.\n\nFurthermore, false allegations that we bankrolled the Pakistani movement have gained traction in dissident circles, burning any possible connections left there. Put simply, we are left without a single serious ally in India's political scene. The Americans are in, and we are stuck out in the cold.\n\nWe advise the Prime Minister to focus on destablizing the Republic alongside strengthening our allies and India's enemies for now. Any attempt at diplomacy would be met with dozens of placards daubed in red paint reading "Murderers! Go back!"."
 jap_india.21.a: "The report was crumpled by a furious fist."

 jap_india.22.t: "A Dream Long Deferred, Now Realized"
 jap_india.22.d: "Report on the situation in India: We of the Daihonei Tokumusoukanbu are pleased to report the final triumph of the legitimate government of India over the American-supported Republic and the German-endorsed Pakistan Movement.\n\nThough this has come at a significant cost in blood and treasure on the part of both our allies and ourselves, the outrage being expressed by elements of the populace in the now-former Republic is already being suppressed by the triumphant HSS while jubilation in the territories of eastern India starts to spread.\n\nWith this victory, both India and China now stand together as brothers with our cause. Thus, with them, the greatest chunk of the world's population is aligned against the occidental Imperialism of Germania and Washington. We are all entitled to celebrate this occasion, for it most certainly presages the beginning of the end of our opponents in the Cold War and a heavy nail in the coffin of the Western order."
 jap_india.22.a: "Half the people of the world now stand as one."

 jap_india.23.t: "Black Hole in the West, Part I"
 jap_india.23.d: "From the Command Headquarters of the Imperial Japanese Expeditionary Force, Kenpeitai Auxiliary.\nAfter Action Report, Operations Theater; India.\n\nWhile the difficulties faced by the HSS in broad popular resistance was to be expected within the territories of the former Republic of India, the surge in popular support in Bengal and the former Azad Hind territories has the potentiality to carry forward in aiding to legitimize the new government. This process will take time and many within India still hold reservations regarding previous unpleasantries with the Empire of Japan, yet the objective to solidify an alliance between Japan and a now friendly regime in India has been achieved, at least for the duration.\n\nMore pressing is the issue of Pakistan and the military-industrial influence of Germany backing the Pakistani government: While nominal alliances between the Islamic world and the Germans are well-known via historical precedent (I.E. The Ottoman Empire c. 1914), the presence of the Germans and other Pakt-aligned assets in Pakistan represents a very immediate challenge to GEACPS interests in the region, both where it immediately relates to India as well as on a larger and perhaps growing scale in Asia generally. This behavior corresponds with the German's backing of the Shah in Iran as a check against Italian colonial interests in the Levant and along the Persian Gulf.\n\nWhile the German proxy in Pakistan is all but assured to be a clear and present danger and in short order, the overall victory of the joint military efforts of Azad Hind and the Imperial Japanese Expeditionary Force is to be commended; One might say that the promises of the Burma Campaign in the later years of the Great Pacific War are on the cusp of fulfillment, yet the work is seemingly not yet done."
 jap_india.23.a: "The monsoon season has come and gone, revealing an enemy at once familiar and alien to these distant shores..."

 jap_india.24.t: "Black Hole in the West, Part II"
 jap_india.24.d: "From the Command Headquarters of the Imperial Japanese Expeditionary Force, Kenpeitai Auxiliary.\nAfter Action Report, Operations Theater; India.\n\nThree months have passed since the end of the Indian Civil War and ground-level resistance to the new regime is still at a high level, despite said resistance being in a traceable decline.\n\nRemnants of the INC and the former regime of the Republic of India still pose an existential, albeit manageable, threat to the HSS government. In response, the HSS have cited internal threats of subversion and dissent to silence opposition and target political agitators as to consolidate rule on the Subcontinent. Centralization of power around the HSS is more or less secure but likely requires Imperial Japanese assistance in shoring up gaps in their domestic defense.\n\nSpeaking to this affirmative, the presence of Pakistan to the northwest continues to present a security risk where it relates to the GEACPS presence in India. Extensive fortifications on either side of the Indo-Pakistani border are being constructed as of this writing, leaving many within the high command of the Free Indian military markedly paranoid of German machinations as to their designs on India.\n\nBarring a substantive shift in the geopolitical relations between the powers involved, one can readily assume continued HSS consolidation of the Free Indian State and economic integration into the Co-Prosperity Sphere will proceed as planned."
 jap_india.24.a: "Oddly ironic for India to not be the elephant in the room..."

 jap_india.25.t: "Black Hole in the West, Part III"
 jap_india.25.d: "From the Command Headquarters of the Imperial Japanese Expeditionary Force, Kenpeitai Auxiliary.\nAfter Action Report, Operations Theater; India.\n\n6 months have now passed since the conclusion of the Indian Civil War and the cementation of the HSS regime in India is seemingly close to completion, with domestic opposition by the former INC now in a consistent downturn.\n\nEfforts by the HSS to instill a new national unity following the fall of the republican regime have begun bearing fruit, as much of the Indian population has grown to accept the beneficial reality offered by the former Azad Hind government, willingly or otherwise. HSS propagandizing of foreign threats to the new India has aided in galvanizing the population along their ideological lines, fermenting rising popular support for the HSS government and further legitimizing their rule as the principal authority in India.\n\nOne such example of a foreign threat posed to India remains the state of Pakistan to the northwest, along with the Einheitspakt assets on the ground backing the government in Islamabad. The aforementioned fortification efforts along their mutual border has continued at a rapid pace, with the Indian side now hosting an expansive network of bunkers, trenches and gunnery emplacements from the Tibetan border all the way to the Persian Gulf. The HSS government is indeed very grateful for the provision of Japanese resources and industrial assistance in facilitating these defenses that His Majesty's government has wisely provided.\n\nAs it stands, the mission statement of the Greater East Asia Co-Prosperity Sphere to extend its influence to the Indian subcontinent through the continued support of the Free Indian State is all but a foregone conclusion. Is it recommended that a continued monitoring of the political situation in Pakistan should proceed to safeguard Indian development as a steadfast ally of the Empire of Japan."
 jap_india.25.a: "A perhaps indecisive victory in India...yet a victory nonetheless, one that was a long time coming."

 jap_india.26.t: "One Crisis Ends, Another Begins"
 jap_india.26.d: "The black sedan veered through the streets of Delhi with characteristic disregard for pedestrians. In its back seat, Iwakuro Hideo stares out the window with worry lining his face. He sees the world outside; it seems to be moving in faster motion, as if the people around him were told to make themselves ten percent quicker. A sense of urgency permeated the air around them. Enough light from the outside world was refused by the window for him to stare into his own reflection. He saw the deep ridges, the cracked leather, the tired eyes framed by round glasses. His tired eyes turned away from his reflection to the folder on his lap—fleet movements, diplomatic cables—and wondered why the world had given him such a trial so late in his life.\n\nThe car pulled up to the South Block of the Central Secretariat. Iwakuro exited the car, and found himself facing the reflecting pool. Iwakuro stepped forward, and saw his body looming over the pool. His uniform was pressed and his medals glistened under the sun. When he straightened his back, he looked ten years younger, leaner and tougher. He kept this posture as his honour guard called him into the South Block. Through the hallways and up the stairs, they came to a large meeting room where a dozen senior officials had gathered in a circle, whispering in panicked breaths and a furious hush. When one of them turned to the entrance, they all turned to the entrance, silenced themselves and straightened their backs.\n\n"Mr. Iwakuro," said [AZH.GetLeader], leaning forward. "Pakistan has formally sided with Germany. We must know if Japan will honour its commitments. Do we have your full support?"\n\nHe had to be very careful. They had moved beyond subterfuge and implicit support. India was now an explicit ally fighting the explicit allies of other superpowers, and that carried certain risks too terrifying to fully acknowledge. At the same time, no matter what measured response he gave, they could read between the lines and hear one simple word:"
 jap_india.26.a: "Yes."

 jap_india.27.t: "Placeholder"
 jap_india.27.d: "Placeholder"
 jap_india.27.a: "Placeholder"

 jap_india.28.t: "See Them Cut and Run"
 jap_india.28.d: "THE MINISTRY OF FOREIGN AFFAIRS, AFTER FURTHER ASSESSMENT OF THE ONGOING SITUATION IN SOUTH ASIA, HEREBY DECLARES THAT THE ISLAMIC REPUBLIC OF PAKISTAN IS EXPELLED FROM THE EINHEITSPAKT FOR FAILURE TO DEMONSTRATE SUFFICIENT STRENGTH TO PROTECT ITS INTERESTS AND FULFIL ITS OBLIGATIONS. THE MINISTRY FURTHER DECLARES THAT ITS FORMER TERRITORIES ARE NOW RECOGNISED AS THE SOVEREIGN TERRITORY OF THE REPUBLIC OF HINDUSTAN-\n\nIwakuro Hideo could not stop laughing, holding onto every bark and breath like a drowning man grasping for a life raft. Their little stunt in Jammu worked, exposing weakness so thoroughly and so swiftly that Germany had to cut the entire country loose, just to save face. He had been laughing for five minutes until a coughing fit broke it up. Staring again at the life raft the Germans had thrown him, he pushed the memo to one side and picked up the phone.\n\nFlipping through his address book, Iwakuro called anyone and everyone he knew in the Indian government. Ostensibly to congratulate them for the recent diplomatic victory, he was probing them to understand what was next on the agenda. It was to the Minister of National Defense that Iwakuro was the least subtle: "Does the Republic have any plans to reclaim lost territory?" No matter what the Minister said next, the second-long pause that followed his question was the only answer that Iwakuro needed.\n\nSix calls later, and Iwakuro thought he had a grasp of the situation. He began to compose a letter, to be read only by the Prime Minister of Japan and to be sent with the greatest urgency. It outlined India's almost-guaranteed desire to reclaim the territory it lost to Pakistan during the war with their western brothers. That desire would be fulfilled not in the near-future, but now; by the time that the Prime Minister read it, tanks would already cross the border and Pakistan would be alone."
 jap_india.28.a: "And he recommended that Japan, unlike Germany, support its allies in South Asia."

 jap_india.29.t: "Plucking Out the Western Thorn"
 jap_india.29.d: ""Ladies and gentlemen," said [AZH.GetLeader], "today is a great day for our nation. As we speak, our military is completing its pacification of the rebellious western provinces." A round of applause in the banquet hall broke out among the guests. Iwakuro Hideo, in formal attire, sat beside the President and clapped along with his audience.\n\nA tank rolled down a lonely street in Karachi. Painted on its side was orange, white and green. Civilians had cleared the streets, but the gunner saw through their viewport shadows. Hands peeled back curtains, eyes peered through the darkness.\n\n"Our victory could not have been achieved alone." [AZH.GetLeader] turned his eyes to Iwakuro; all the bright lights fell on him. "We owe a great debt to Japan and the Pan-Asian project for our success. Mr. Iwakuro, would you like to say a few words?" Iwakuro rose with a comforting military posture.\n\nSoldiers marched into the government building. They seized boxes of documents that had not yet been consigned to a fire, and they seized the civil servants seen in the vicinity of those fires. Like any good conqueror, they were delicate with material and rough with people.\n\n"I am proud of the Indian and Japanese people for their cooperation." Iwakuro feigned shyness with a sheepish smile. "With all of Asia united, there is no challenge we cannot meet." It earned him another round of applause. A smirk crept up on his face.\n\nIndian soldiers saw a tenement that would function well as a command centre, a nexus of coordination for the pacification of the city. The previous residents were shepherded out; gunfire rattled off the walls and through the stairwells. If one looked out from their window, they could see the familiar green and white of their flag being torn down, replaced by a new yet familiar symbol."
 jap_india.29.a: "All of this had been decided for them."

 jap_india.30.t: "Placeholder"
 jap_india.30.d: "Placeholder"
 jap_india.30.a: "Placeholder"

 jap_india.31.t: "Our Failures, Their Problem"
 jap_india.31.d: "Photos of the Luftwaffe's destruction laid on Hideo Iwakuro's desk. He kept it open like an open bottle of whiskey, meant to keep the blood running hot during his call. He didn't need it; he was thinking about being stuck on the subcontinent for a few more years, years he didn't have, and anger came easily.\n\n"Listen to- no, no, listen to me." He was on the phone with [AZH.GetLeader]; he could feel the sweat pouring down the President's face. "We are not carrying you on this anymore. This is bigger than a few provinces now. We came close to war once and I'm not going to risk it again so you can have land that doesn't fucking want you there."\n\nIndignant responses squawked over the wire; Iwakuro cut through them with a sharp "enough", tapped his fingers on the desk. "You're pulling your men out to the border, you're keeping on your side of the border, or we'll pull out and throw you out the Sphere entirely."\n\nThat shut him up—briefly. Then it was one final plea on the other end of the line, but Iwakuro's mind was already made up. "Pull out," said Iwakuro, "or we'll pull out instead."\n\nHe left that call thinking that [AZH.GetLeader] wasn't going to listen to him—but others? His suspicions were fortunately confirmed: the next day, after overnight conferences with HSS advisors and bigwigs, the President backed down and opened up channels with Pakistan. At this, Iwakuro felt only a mixture of emotions. Relief, for an end to a potential war; frustration, because Japan would blame him for being unable to put a lid on the situation."
 jap_india.31.a: "But India and Pakistan would come to the table. He would be satisfied with that."

 jap_india.32.t: "The Lahore Friendship Conference of [GetYear]"
 jap_india.32.d: "India and Pakistan's representatives gathered in the Lahore ballroom. Armed with pens and armoured with words, [AZH.GetLeader] and [PAK.GetLeader] placed their names and signatures upon the end of formal hostilities. It felt like too much of a stretch to call it a Treaty of Friendship, but they played along nonetheless, offering kind words and kinder wishes. They shook hands, posed for photos, and then let their lackeys take alternating turns on the podium to establish what kind of benefits Pakistan and India would have to this new relationship moving forward.\n\nHideo Iwakuro watched it from a seat just off centre on stage. His arms were folded, his face unreadable, wound tight. If this was embarrassing for India, Iwakuro himself was humiliated. The Treaty was his failure in writing: a mismanagement of the crisis, forcing Japan to clear space for Germany in Asia. He'd be called up to Tokyo at some point in the next month or two to answer for this, and he could already see the disappointment on the Cabinet's collective face. He saw it early in the mirror.\n\nStill, he had friends on the subcontinent. One of them was seated next to him. During a round of applause prompted by something Iwakuro wasn't listening to, that friend turned to him and whispered under the applause: "Can you get us in a meeting with [MAN.GetLeader]?" Another, behind him at the reception after the speeches: "Would [GNG.GetLeader] be interested in a deal I'm working in Kerala?" And another, catching him in the middle of a piss: "[JAP.GetLeader] might want to know about some contracts that his friends could have." He was still useful, after all, as a middle man. With Pakistan on the board, India will need all that it can receive, and Hideo Iwakuro would be the one to facilitate it. That was all he was now: conduit, bag man, lackey.\n\nThe proceedings came to a close, and the representatives retreated quickly across their sides of the new border. Pakistan was now a fact of life, their existence backed by the hooked cross, and the rising sun over India would have to accept it. Still, acceptance seemed better for all sides than stubbornness. As Lahore receded from both parties, they found themselves accepting the situation as they put distance behind it."
 jap_india.32.a: "Better this than war."

 jap_india.33.t: "Life After War"
 jap_india.33.d: "As Hideo Iwakuro sat down at his desk one final time, he felt his back give a now-familiar ache. He supposed he should be grateful, with all these pains, the worst one usually cancels out the rest. He was soon to be finished in the subcontinent, and his return to the home islands was long overdue. Just one final note to do for the boss.\n\n"As you are aware, the Oil Crisis has put extra demands on us in all sectors; India is no exception. I have always been cautious of our allies here, and this current crisis gives them ample opportunity to jettison their loyalty if they feel we are giving them adequate attention."\n\n"On a similar note, I'd like to warn you that while the war has given the Indian people a long memory, scars will eventually fade. Our crucial help toward unification will gradually fade from their national consciousness, replaced by desires for increased trade and additional allies."\n\n"Therefore, it is imperative India is not neglected in this or any forthcoming crises the Empire may face. Thank you for my leave. I believe my successor as Ambassador will prove to be just as equipped for the task as I was."\n\nA final full stop — the end. He checked his desk one last time to see if there was anything he was missing, spying the old Webley revolver. He picked it up, feeling the cool caress of metal for a final time, before leaving it back in place. He considered taking it with him but decided against it. His time in war was finished."
 jap_india.33.a: "A final gift for his successor, before Hideo departed into history."

 jap_india.34.t: "Mission Accomplished"
 jap_india.34.d: "The Japanese Ambassador to India, Hideo Iwakuro, heard the words, yet it took him a while to register just what they meant.\n\n"We are pleased to announce the dissolution of the Azad Hind provisional government. May we all work together as one for a better India."\n\nThe claps rang through the press conference, hitting Hideo's motionless body wave after wave. As meaningless questions came in from reporters, the Ambassador took the time to jot down some notes, mentally piecing this together what this would mean for the Empire.\n\nUsually, Hideo considered himself to be a well-organized man, but this was an unfortunate scenario. The negotiations actually being successful was an outcome thought to be outlandish by most, something favored by nobody, nobody that matters anyway. And yet, here it is. It was not ideal in any way, shape, or form, but there were ways this new India could shaped toward the Sphere.\n\nIndia was non-aligned, but it was far from an autarkic state. In this instance, geographic would win over principles. Japan would have the advantage in trade over America, not to mention the proximity of Sphere trade partners to the newly unified nation. Slowly, trade by trade, India would be won over.\n\nHideo finished writing and left, tired of all the diplomatic fawning. This next part would not be won overnight, but in due time, India could still be theirs."
 jap_india.34.a: "The war may be lost, but the peace could still be won."

 jap_india.35.t: "The Grand Oriental Conference"
 jap_india.35.d: "Sri Lanka was the closest to what constituted neutral territory on the subcontinent. The only place where any meeting between the two parties could be considered remotely fair, and that's where the conference was to take place. Colombo in the ruins of British colonialism, the Grand Oriental Hotel. The old ruin had seen better days but it was a fitting building for both sides to meet. The Japanese side, a mix of soldiers pressed into khaki uniforms, and more modern business suits, set against the grays and blues and browns of the Germans and their own contingent of besuited civil servants. Usually they found themselves at tables with Americans from the state department, it was a strange conference for two sides so used to dealing with civilian officials exclusively.\n\nThe Pakt began by offering concessions that had been carefully drafted, the first punch but it was by no means a knock out and both sides knew that. A partition plan with different spheres of influence, bluster about redlines, the need for sovereignty in Pakistan and recognition of German help in the liberation of the subcontinent from American imperialism. It was a misstep which failed to address that the Pakt redlines stood against a backdrop where the subcontinent was tacitly accepted as being in the Japanese sphere by the Germans. A red line could not be moved forward after a lucky break. The Sphere negotiators decided to step forward to see how serious those red lines are. It was a misplay to bring up liberation from imperialism, as the Japanese side retorted by talking about the rights and freedoms necessary to establish a truly free India. The rights of territorial integrity without spheres of influence. Of course the Germans saw that 'integrity without spheres of influence,' meant only one influence, the Sphere itself.\n\nThere was some progress as the Japanese side offered their pound of flesh when talking about prospective Iranian or Turkmen membership in the sphere, but the Germans were hesitant to commit to anything and for their part so were the Japanese. The conference ended at an impasse."
 jap_india.35.a: "The drinks tab was the most substantive agreement."

 jap_india.36.t: "Roots of Prosperity, or Control?"
 jap_india.36.d: "The steady clatter of looms filled the air at Howrah's weaving factories. The sound of machines replaced the shouts of labourers as they hauled sacks and crates in the courtyards outside. Across India, Japanese investments were transforming the landscape, introducing new machinery, new techniques, and a sense of unease for many. For some, it was a sign of progress, but for others, it was a reminder that freedom comes with strings attached.\n\nInside one of the factories, Vikram was adjusting a stubborn lever on the textile loom. The machine had been running non-stop since the morning, and just yesterday, it claimed the life of Sharma, a young worker. The boss, a stern Japanese man who communicated through a translator, barely acknowledged the incident. He muttered something about carelessness and ordered the loom to be cleaned and restarted.\n\n"They think we're expendable," Vikram thought, as he worked, with his hands instinctively moving over the controls. Every hiss of steam and metallic clank felt like an insult.\n\nLater, at the tea stall, Vikram joined a group of workers gathered under a dimly lit bulb. He sipped his chai, feeling the warmth as a small comfort against his worries. "They didn't even stop the damn machine," he said, his voice tight with anger. "Arun was still lying there, and they were already talking about getting another worker to fill his spot. Fucking Japanese."\n\nThe group fell into a silent moment, their tired faces lit up by the dim glow of the light bulb. Beyond the busy streets of Howrah, Kolkata's skylines shimmered with the promise of modernity."
 jap_india.36.a: "Still, in its shadow, many wondered who was truly in control."

 jap_india.37.t: "A Blade in the Ocean"
 jap_india.37.d: "There was something spectacular in Masumi's eyes about finally being able to use their navy to do anything except tedious and mundane training exercises. He always listened with awe to the stories of his father, how their navy proved itself against the Americans, how their mighty vessel docked onto colonies and left behind liberated nations. His friends felt the same way.\n\n"Into position now, we'll show them how we won the war."\n\n"No part of Asia shall remain trapped under European boots."\n\n"Every last trace of colonialism will be erased."\n\n"Pan-Asianism will prevail."\n\nHe smiled at the bravado; it amped him up, and it reassured him that they were on the right side of history. Someone passed him the binoculars; this made him feel less sure.\n\nThe great steel behemoths of the Kriegsmarine simmered in the sea, miles away for now, but the time for when fleets would collide seemed to tick down to doomsday rapidly. His friends weren't fazed, but Masumi worried that he faced a crisis of confidence. The Emperor may be on their side, but would that prevent the world from ending?\n\nHe didn't know. The fanatical will of five minutes ago had faded, much to his shame. Hopefully, words would just be words, and it would never have to come down to the wire."
 jap_india.37.a: "One-upmanship a step away from nuclear armageddon."

 jap_india.38.t: "The Final Round"
 jap_india.38.d: "[AZH.GetLeader] brooded over the table. That mahogany behemoth held up a detailed map of the frontlines in as best detail as could be ascertained from the distant frontier. Hundreds of tiny colored tokens dotted every inch of the diagram, each representing a military unit, a pawn in this match far bigger than it could ever conceive. But as he felt the leering eyes of the Japanese attaché piercing into him from behind, he couldn't help but think his ally saw him as much as a piece on the board as any of those wooden tokens.\n\nThe past few weeks had been nothing but a hollow pantomime of diplomacy as Japan and Germany, smiles and promises soon turned to denouncements and threats. A farcical rendition of early colonial conferences, with claims of a civilizing mission replaced by those of national sovereignty. [AZH.GetLeader] played along as he had for decades, a master of the long game, the final prize of Indian liberation just within sight.\n\nNow, the next round began to take shape on the map below him. A tiny grey piece representing a Japanese flotilla steered its way around the subcontinent, while a grouping of red and orange blocks standing the joint Indo-Japanese force prepared to launch a lightning attack into a painstakingly detailed drawing of the Jammu region.\n\nAs the final battle lines were drawn, the old freedom fighter smiled. For too long, the imperialists had moved him as a pawn on the board of their close-minded ambitions, but as Imperial blood and treasure propelled Free India towards its final triumph, it begged the question: in this new great game, who is the pawn?"
 jap_india.38.a: "And who is the player?"

 jap_india.39.t: "Punishment Initiation"
 jap_india.39.d: "Ganpatrao stared at the ceiling, imitating the other students from the Japan-India Youth Association. Their state benefactors had called lights out an hour ago, but he longed for something more. He knew this country, yet he was shepherded around it like a common tourist. It wouldn't be an effort to slip out of here... and he'd be back in bed before anyone knew...\n\nBright lights bounced off puddles, obscuring the night sky, scenes even more beautiful than his picture books. He meandered between buildings, the confident passing him by like a bollard, ignored before he could even utter a question. His ambling led him to a bar. He wouldn't have recognized it if he wasn't so proficient in Japanese, resembling something a time traveler designed.\n\nSomething was nauseating about the place, even beyond the stale air and mass of bodies, something that made him feel very small. Whatever, Ganpatrao thought, everyone probably feels like this before they get drunk. He spoke to the bartender, placing an order for a... beer.\n\n"What did you say?" He repeated himself, louder and slower. "Sorry, what? Do you want this one?" He prepared himself for a third attempt — before relenting — and simply nodding, must have been the accent. It did not go unnoticed by others in the bar, particularly by some drunks in the corner, watching a sad young Indian while away the night by himself.\n\nAn hour later, Ganpatrao stumbled out of the bar, numb to the anxiety he first felt leaving the dormitory. This was soon rectified.\n\n"Welcome to Japan." He could barely react before the sucker punch hit, flooring him. They piled on, kicking him until he stopped moving, then checking him for any valuables before departing. The rain continued, his blood mixing into existing puddles, soon joined by tears."
 jap_india.39.a: "His thoughts mourned the land he thought he knew."

 jap_india.40.t: "Green Indus"
 jap_india.40.d: "One year has passed since the crisis engulfed the subcontinent. Slowly but surely, the former provinces of Pakistan now begin to experience a prosperity they may never have known before.\n\nLand reform is aggressively pursued. The landowners that used to control these territories were often pro-Pakistan and by extension pro-German subversives. Taking away their lands without compensation is easy enough; the remainder that were not actually pro-Germany also lose their lands, though with compensation bankrolled in part by Japan. As a result, peasant farmers are neither serfs nor slaves—they can farm for themselves.\n\nNow there is a chance that these farmers might not know about the newest developments in agriculture. Simple crop methods have been superseded by more efficient ones that yield so much more. The crops themselves are enhanced with high yields and defended by pesticides. They are also watered with controlled irrigation and harvested by machines of a sort that the average farmer might only have dreamed about before. All of this, of course, is thanks to Japan.\n\nThanks to all of this hard work, a joint venture between Azad Hind, Japan, and the rest of the Co-Prosperity Sphere, farmers in the former Pakistan now own their own land and can do more than just subsist. Today they are able to give their family more than what they need, store and sell at will, and give thought to more than just survival.\n\nOne year has passed since the crisis engulfed the subcontinent. Slowly but surely, the former provinces of Pakistan now begin to experience a prosperity they may never have known before.\n\nIf they know what's good for them—"
 jap_india.40.a: "—they'll remember Japan brings life."

#USA-India Events
 USA_IND.1.t: "Nixon vs Nehru"
 USA_IND.1.d: "Previous Democratic administrations had been perfectly fine with Nehru's non-alignment. After all, Castro had been the same way, and López Mateos. Even if they didn't want to be part of the OFN for whatever reason, and wouldn't stop trading with the Sphere, they were still trusty anti-fascist allies.\n\nNow, it's not that Nixon was completely against non-alignment as an idea. He understood the concept perfectly - hell, he even understood why they'd do it. They wanted to buy domestic, play both sides off safely for the best deal, knowing that because they weren't superpowers, it was the best bet. It was respectable, and Nixon personally just considered it their way of business - and in good times, soft times, that was all well and good.\n\nBut these were hard times. And Nixon wanted Mr. Nehru and his socialist buddies to understand that if they were going to tell Japan to back off, they had to get closer to the US. They could keep their non-alignment, be neutralists as they liked, but the two democracies could accomplish so much together - and it started by seeing American aid as the gift it was and not treating it like some puppet's strings.\n\nFirst of all, the liberals needed to lobby for unconditional US aid to the Republic of India. Then they could see about revising the aid package..."
 USA_IND.1.a: "Sure, Mr. Nehru, it's leverage, but it's damn good leverage!"

 USA_IND.2.t: "Policy Change"
 USA_IND.2.d: ""Damn that bastard Nehru," muttered Nixon to himself, a scowl resting on his face, "thinks he can play the United States like a goddamn fiddle, not on my watch. I oughta wallop him, teach him a lesson." The closed doors of the Oval Office served as the only thing keeping the sound of his presidential whinging from becoming public, an outcome that would only further the growing divide between Delhi and DC.\n\n"And those liberal bastards can't get enough when it comes to handing the keys to the country out to those slippery, treacherous people." He stared down at the Resolute desk, head in hands as his mind went through all the ways he'd learned to deal with Congress when it felt like growing a spine. "I'll, uh, I'll give 'em what they want," he said, at first quietly and with uncertainty. "Yeah, I'll give them exactly what they want." He took out his pen, reached for some paper adjacent to him, and began to write.\n\n"They'll never see it coming, they think all I know is crookery and being the man whose name goes along that ungrateful Kennedy." A smile, or at least an attempt at one, began to grow across his face, progressing slowly from a smirk to a toothy grin. "Streamline aid to India, standardize the shipments, and make sure it's all from this decade and not the last. We'll have 'em by the shorthairs, and the libs'll be my greatest allies in this." The grin became earnest, although that didn't do much to improve its look.\n\n"Let's see how Nehru likes it when America starts demanding what it's owed." He pressed the papers upon the desk, assembling them into a pile. "Yes, modern aid for a modern India," he said, his words dripping with sardonicism."
 USA_IND.2.a: "And an unhealthy helping of modern imperialism too."

 USA_IND.3.t: "USAID in India"
 USA_IND.3.d: "The wailing forklifts of the shiny new USAID airport facility definitely did not cure headaches. Aside from that, Nick was rather enjoying the sudden uptick in work to do. Well, maybe not enjoying, but at least it was a nice change of pace from the pile of paperwork per food delivery, most of which until then wasn't even meant to go abroad. Oh, and it was an excuse to re-encounter familiar faces.\n\n"Hiya, Nicky!" The pilot he had flown to Port-au-Prince with a year ago gleamed back at him across a football field of tarmac, his smile overshadowed by a snugly-fitted captain's hat. "Fancy seeing you here. Remember me? The whole mix-up in Haiti?"\n\n"Well, there are only two places for us to see each other anyway," the aid manager replied. "Wow, it's been a while since Haiti, though. Now we're really going international. Aid to India? Certainly ain't the same trek across the Caribbean, I'll tell you that much."\n\n"Tell me about it," the captain sighed. "Heck, I only just heard of Nagpur today, and I'm meant to be flying there in an hour. And don't even get me started on the timetables. I'd never have left the Air Force if I knew this is what I'd be getting into."\n\nNick tapped his clipboard with his pencil, reminding himself of all the two-minute turnarounds. "It was... always going to be a step up from Haiti. Kennedy basically founded the whole thing yesterday, and then they decided to leave such a huge brief to us, so we're doing it. We'll get used to the saddle. At least they're not giving us equipment straight out of the war anymore."\n\n"Heh, I sure hope you're right. But serving a country so far and big will need more than upgrades, I fear. The brass better know what they're doing.""
 USA_IND.3.a: "It's a long way to New Delhi..."

 USA_IND.4.t: "Red Cross in India"
 USA_IND.4.d: "Aside from Kennedy's creation, American aid to India was also handled by NGOs - such as private groups, Christian churches, and the American Red Cross. All of them had their different, humanitarian goals, but getting them on the side of the State Department - namely the Red Cross and their resources in particular - would be a major domestic win for Nixon.\n\nThere were two ways to go about this. The first was a major increase in US-Indian relations utilizing the American Red Cross. Diplomatic tours of India's most affected areas, relief work, hosting Nehru's boys and the Red Cross leadership at the White House, anything goes. The Indian-American community would be key to ensuring that this renewed effort across the Pacific worked out fine, and it was likely that Nixon would secure their votes for the Republicans in the process too.\n\nThe second was to increase support for interventionism across the entire American public, but using the Red Cross's activities in India as an example instead of the military. Getting Indian-American community leaders to coordinate efforts with other communities disaffected by Japanese aggression - such as the Chinese Nationalist exiles and the Korean-Americans - would help raise support for humanitarian intervention overseas, and possibly bring a lot of liberals on board with Nixon.\n\nThe final decision lay with Nixon, of course."
 USA_IND.4.a: "Increase US-Indian relations via the Red Cross."
 USA_IND.4.b: "Increase support for peaceful intervention among the people."

 USA_IND.5.t: "Quarters for India"
 USA_IND.5.d: "In his grocery store at the corner of 53rd and 24th, Gus Kowalski turns his head away from the conversation he's having with Maggie Lansdale to see where the sound of a bell ringing is coming from outside. It's no fire alarm - just Mr. Singh's kid, Ajay, tall and broad-shouldered and bearded, and ringing a bell with a sandwich board wrapped around his chest - 'Quarters for India', it reads.\n\nThe Singhs run the grocery store across from Kowalski's and are a lively, sociable bunch. Gus likes them. He ambles over from the counter to Ajay and shakes his hand. Asks how he's doing, and what cause he's campaigning for.\n\nAjay passes out pamphlets to the customers in the store. The Republic of India, the homeland of the Singhs, is calling on the Indian diaspora for donations to help the country's brave defense against Japan, against the dictatorship of Azad Hind. India, the largest democracy in South Asia, is facing a civil war started by Japanese meddling - and it needs all the help it can get. No need for big donations - spare change will do. Ajay's not asking for anyone to give up their life savings, eliciting a few laughs from his audience.\n\nGus's eyes move to a portrait hanging on top of the counter, near the crucifix and the clock. A portrait of a grinning young man in his pinks and greens. Jim had never returned from Mindanao. He'd been found slumped over his machine gun, dead, and with fifteen dead Japanese soldiers in front of him. Died to make men free. And India was doing the same.\n\nGus walks back to the counter, opens a drawer, and passes Ajay a whole jar of quarters for the collection tin."
 USA_IND.5.a: "Hindi Amerikee Bhai Bhai!"

 USA_IND.6.t: "Expansion of the Delhi Embassy"
 USA_IND.6.d: "The Embassy of the United States of America in New Delhi was already a handsome building in itself, that countless American ambassadors considered to rival the Taj Mahal in beauty and grandeur. A 13-acre masterpiece designed by Roger Durell Stone, overlooking a gorgeous tropical water garden with plants, fish, and birds, there was plenty to love about it.\n\nUnfortunately, the increased American efforts in India meant that 13 acres was no longer enough. The embassy was going to need much more space to accommodate all the new offices and agencies operating out of it. Fortunately, the Indian government saw no problem with providing the expansion, on the condition that their domestic construction companies do the job for the Americans. The deal was perfect - the Americans would get their space, and the Indians would get their jobs and money.\n\nSo all across fine Chanakyapuri, laborers toiled and machines rolled, engineers surveyed and architects strolled. The expansion of the embassy benefited both parties - the United States now had more influence around not only India but the Italian-controlled Middle East, and India could easily take advantage of that as well to boost their own standing with the non-aligned world."
 USA_IND.6.a: "Thankfully, the ambassador wasn't too bothered by all the noise."
 USA_IND.6_tt: "Our ability to conduct §mCIA operations§! in the §YMiddle East§! and §YIndia§! will §Gincrease§!"

 USA_IND.7.t: "Reconcile the Bitter Foes"
 USA_IND.7.d: "Company assets within the Republic of India, including our informants in the ROI's intelligence services, have given us deeply troubling news. The Republic of India and the Azad Hind government are on the brink of pursuing unification negotiations. While the Sphere stands to lose from this, so does the United States - the unified government would definitely remove all foreign influence from within the country, including American interests. Any reintegrated Azad Hind personnel would be able to tear down all American interests built up in India with the stroke of a pen. Langley recommends that all assets in South Asia focus on finding ways to prevent the negotiations from happening. Washington cannot afford to lose the largest democracy in the region."
 USA_IND.7.a: "Security threat reported."

 USA_IND.8.t: "Hell in a Handbasket"
 USA_IND.8.d: "George Wallace had high ambitions when he campaigned for the seat of President and had great expectations for himself once he finally made it to the Oval Office. Sure, Africa was a mess, and aborting Kennedy's little monster wouldn't be simple, but so long as he kept a lid on the bleeding hearts and put on a show of strength to keep the Nazis and bucked-toothed Japanese in check, he was confident he would enjoy a pleasant first year in office. It wasn't so much as a month before he realized that wouldn't happen.\n\n"God damn it. How far can we expect the little bastards to push?" Wallace muttered, tracing his fingers along a map of the Indian-Azad border with one hand while messaging his forehead with the other to stave off a headache. His cabinet stood around the map with him, with grim expressions, with the exceptions of Mills (who looked barely sober) and Byrd (who seemed more concerned about possible Indian refugees coming to the US or its allies), before Brown spoke up.\n\n"Maybe all the way to New Delhi. This isn't the same band of miscreants Bose mangled together in the forties; they've been preparing for this fight since their rump state was founded. And the Japanese are going to be behind them every step."\n\n"Damn it, alright, fine then." Wallace took a deep breath before running his fingers through his hair. "Start getting a whip count in the house and senate, and let the Indians know we're coming. We'll wrangle together whatever we got and then some as soon as we get the green light...""
 USA_IND.8.a: "We're bombing these fascists back to hell."

 USA_IND.9.t: "The First Fray"
 USA_IND.9.d: "Sometimes, Robert Kennedy wondered how his brother had held it all together. After all those years watching Nixon bumble his way through the White House, from domestic to foreign policy, his brother at least knew what to expect when he finally took over the wayward ship from Nixon. Robert had barely begun to warm up the presidential chair before the world flipped upside down again.\n\n"Alright, let's not mince words here; the global forces of fascism and oppression are on the warpath once again." His cabinet was assembled around him, and a television screen displayed news reports of ongoing fighting in the sub-continent. "We didn't sit idly when the Germans marched on South Africa; we're not going to let the Sphere ravage India."\n\n"Getting together support for India isn't going to be easy." Marine chimed in with a frown. "The universal support for intervention we had for South Africa isn't there anymore; the House and Senate don't want to just bounce from one massive war to another."\n\n"Then we reach out to the people. They're seeing the carnage already, so we need to make sure they hear our plan to bring it to an end. Convince them to contact their local politicians and get everyone in line. The future of hundreds of millions rests on us, and we will not let them down." A part of him wondered how Jack would have handled it before putting the thought away."
 USA_IND.9.a: "The time for doubt has passed."

 USA_IND.10.t: "A Silver Bullet"
 USA_IND.10.d: ""Good evening, gentlemen," said Bennett to the cabinet members assembled, "it's uh, not exactly in the brightest of circumstances that we have this meeting, but necessary ones nonetheless. Now Muskie, I'm told you've got some statements prepared."\n\n"Indeed I do, Mr. President," he replied. "As of a few hours ago, war has officially broken out between the two Indias. Now, while our relations with the Republic in the west haven't always been perfect, they're no doubt our ally against the Sphere-backed Azad Hind regime in the east."\n\n"That's, uh, excellent, Muskie. Lovely to hear that. Now, Clifford, I believe you have some remarks as well?"\n\n"Yes, Mr. President. The Republic is currently experiencing a blitz of sorts aimed at the capital: New Delhi. I've got enough connections on the Hill to get some aid through, enough to stall this offensive long enough for our good friends to recuperate."\n\n"Excellent, excellent," Bennett said. "I'll make sure you succeed in that; we need to keep them upright until they can hit back."\n\n"Precisely, sir."\n\n"Excuse me, Mr. President, but uh, one more thing," said Bunker.\n\n"Ah, yes, Bunker?"\n\nWe're picking up frequent communication between Calcutta and Tokyo, no doubt they'll be sending just as much to them as we will to the Republic. I understand you want a more streamlined OFN, sir, but this is big, and we can't afford to squander this kind of opportunity. In other words, what I'm saying is that escalation isn't off the table.""
 USA_IND.10.a: ""Just consider it, Mr. President.""

 USA_IND.11.t: "Far From Austin"
 USA_IND.11.d: ""I'm being told we've got a situation in the East, gentlemen," said Johnson, feet atop the Situation Room desk, "been hearing 'bout war on plenty o'tongues."\n\n"Yes, Mr. President," replied Rusk, scrambling to affix papers on a display board. "We've been receiving reports of localized skirmishes and rising tensions in the Indian Subcontinent ever since that crazed gunman—not unfortunately, may I add—ended hopes of peace in the region, and it's all finally boiled over."\n\n"Mm. I assume you'll do your part in sending aid our boys' way. Now, uh, Bob," he turned his head to face McNamara," what're the details on the ground looking like?"\n\n"You see, Mr. President," he replied, "as of right now, Azad Hind forces are attempting a mad dash toward New Delhi, but if we can help the Republic weather the storm, they'll run out of steam before long. We've just gotta make sure those frontlines stabilize."\n\n"Sounds good, gentlemen. I still know how to get my way with Congress, so as long as there's a plan, I can whip those spineless bastards into backing it. Dick, got anything to say?"\n\n"Yes Mr. President," Helms said, "we've, uh, got some contacts in the area, and they're been telling us that Tokyo's doing much the same as us: diplomatic support, intelligence, materiel, they're not intent on letting several hundred million get out of the Sphere's grasp—not when they have millions more to gain."\n\n"Then we'll just have to outdo them: more guns, more planes, more tanks.""
 USA_IND.11.a: ""Hell, if I really had my way, I'd just say bomb the bastards.""

 USA_IND.12.t: "Televised Humanitarian Crisis"
 USA_IND.12.d: "The Pennsylvanian family sat at the edge of their seats, eyes glued to their television set. But Perry Mason was not playing tonight. Instead, CBS's 24-hour special on India played.\n\nTo the grim narration of Walter Cronkite, they watched as the Indian Civil War played out in its bloody spectacle. A beautiful place that most Americans had barely heard of until recently was now in the throes of total war. Villages and cities burned, a horrible tableau of black smoke and orange flame. Crowds of fleeing refugees on foot and bicycle dove into ditches as shells landed around them and planes dropped their bombs - mistaking the sheer size of the crowds for enemy troops. Reporters, unable to keep their composure, wept openly or choked up at the clear signs of starvation on children and infants, the elderly and the women. Desperate signs on scraps of cardboard held up by students, bandaged and bloody - 'HELP US, AMERICA! HELP US!'\n\nThe state senator paced in his office, his phone ringing off the hook every minute, every second. The last image had done it nationwide. Quickly, efficiently, at a speed not seen since he was on the campaign trail, he answered the family's desperate call, and moved on to the next."
 USA_IND.12.a: ""...A crisis not seen since the Japanese swept into Burma in 1942...""
 USA_IND_aid_bill_available_tt: "A new §Ybill§! will be available in the §YForeign Policy§! category"

 USA_IND.13.t: "Escalated Aid"
 USA_IND.13.d: "The bill had passed.\n\nCelebrations erupted across the Pacific as the Republic of India and the diaspora in the OFN rejoiced. The massive escalation of US-led aid shipments from the OFN would be India's salvation, and seriously bolster their war effort. The internationalist factions of American politics were jubilant as well - having been practically vindicated in the immense outpouring of public support and sympathy for the ROI that had followed the bill's passing.\n\nOf course, you can't please everybody, and the usual suspects weren't happy. The isolationists and American Firsters of the media and the public immediately started whining about increased Indian migration to the United States, trying to stir up a panic.\n\nBut their hysteria fell on deaf ears as Congress unanimously voted for the stationing of the US 7th Fleet off the Indian coast in a show of anti-fascist force, and additional increases in aid to other OFN allies and OFN-friendly neighbors funding the ROI.\n\nThe world's largest democracy would not fight alone, and it had the backing of the Free World behind it."
 USA_IND.13.a: "As they'd learned many times - one does not simply fight the Japanese alone."

 USA_IND.14.t: "Status Quo Aid"
 USA_IND.14.d: "The bill had been defeated.\n\nIn Washington, the administration rubbed their temples and sighed into their coffee as the Republic of India politely expressed their dismay, and the diaspora in the OFN held peaceful protests in disappointment. At several protests in the United States, Indian-Americans were confronted by isolationist counter-protesters who were whipping a worrying amount of the American public into an anti-immigration frenzy yet again. The internationalist factions of American politics wrote bitterly about their defeat.\n\nPublic sympathy for the ROI was still high, though, and the administration needed to get creative with aid. One idea was to use any loose funds over from the aid programs to feed into India, and to grab any aid from other countries who weren't an urgent priority, such as Iceland, Haiti, and Belize. And a campaign throughout the OFN to support the ROI, to aid them when the US, unfortunately, couldn't, would do much to help the ROI out at the cost of American prestige."
 USA_IND.14.a: "Uncle Sam had fumbled India and was kicking himself for it."

 USA_IND.15.t: "OFN-OAS Aid Coalition"
 USA_IND.15.d: "New problems require new solutions, and the India aid plan was certainly a novel conundrum. A country so large with needs so great and a position so disconnected could not rely on one country, or organization, to bear the costs and thus motivation. Therefore, it made sense to rely on multiple.\n\nThe OFN-OAS aid coalition, while relying on American logistical muscle to distribute, could channel donations from many contributors across the membership of those organizations, and thus a hefty pool of potential resources to work on when trouble came for the Indian subcontinent.\n\nBut how "potential" these resources truly are also spells trouble: one could hardly guarantee an indifferent senator or head of state would not strike it down. Was it worth going through the trouble of petitioning the North and South American states to then be left alone by the OFN, or vice versa? Moreover, was it worth the additional backlash and funding when there were so many other things to protest federal funding for?\n\nIn the end, India's money went through the White House, and its owner had to make the final call. When it came to the coalition plan..."
 USA_IND.15.a: "...he would accept only OAS aid."
 USA_IND.15.b: "...he would accept only OFN aid."
 USA_IND.15.c: "...both organizations would pay."
 USA_IND.15.e: "...neither organization would pay."

 USA_IND.16.t: "Sectarian Subterfuge"
 USA_IND.16.d: "As the east of the country boiled in a bloodbath, as soldiers came home bruised and battered to the cities, they saw the war they fought retold for a different audience, in a different light. Images of sinister men grinning in topis, marching in, destroying, violating what was meant to be Hindu, Indian land.\n\nThey heard the story played out again and again of Bengali usurpers, Muslims desecrating the holy sites in Varanasi and Ayodhya. Mobile cinemas and leaflets toured the country from Puducherry to the Punjab, telegraphing the tale to the masses of Muslim invaders committing unspeakable acts to non-Muslim prisoners of war, reversing all the efforts toward freedom of the past twenty years.\n\nIt hardened the wills of some, struck fear into the hearts of many, emboldened the angry to riot and the attacked to flee. It no longer mattered whether true or untrue, whether the swirling stories were rumors in the barracks or portents of a real threat to come. The CIA's operation of sectarian subterfuge staked a new front in the war, right in the middle of Indian society."
 USA_IND.16.a: "Chaos, courtesy of America."

 USA_IND.17.t: "India in the OFN"
 USA_IND.17.d: "Following its total victory over Azad Hind with American aid, the Republic of India had become an official OFN partner, allowing it to preserve its non-alignment while strengthening ties with the United States.\n\nWhile certain hawks grumbled about India's refusal to bind itself to the United States, the mood in Washington was jubilant, and the rest of the OFN was rejoicing. By securing the largest democracy in South Asia, Japan had been dealt a hammer blow by the OFN as it had effectively lost any potential dominance over the Indian subcontinent. Thanks to them aiding the ROI in its hour of need, the OFN now had a reliable base of operations in continental Asia, opening new opportunities to strike the Sphere in their own backyard!\n\nThe Indian-American diaspora led the celebrations across the United States, and in solidarity with their people back in the ROI. The Free World had gained a new member - one that many were betting would become the world's largest democracy, and a powerful juggernaut against Japanese fascism."
 USA_IND.17.a: "Satyameva Jayate!"

 USA_IND.18.t: "The Delhi Waltz"
 USA_IND.18.d: "As President [USA.GetLeader] walked through the promenade and up the stairs leading to Rashtrapati Bhavan—the latest visitor to change history behind its towering columns—he felt a jolt pass through his body, as if suddenly aware of the gravity of these fleeting moments. Before him,. [IND.GetLeader] looked ahead, offering an extended hand.\n\nJust years prior, the relationship between the two democracies had been strained and volatile, fraught with points of contention throughout. But now, with the wise custodianship of Swatantra in Delhi and the benevolent humanitarianism of DC—or so the briefings read—that past was behind them both. He clasped [IND.GetLeader]'s hand, careful to moderate his firmness. It would not be an opportune moment for a slight.\n\nLooking to his right, the sheer scale of the crowd awed him. The vigilant security details, the imposing palatial complex, the treaty to change the world, they all faded into the background, however briefly. He looked back, his mind finally acknowledging that that stuffy plane ride had been more than worth it. Up. Down. Up. Down. They shook a few times more, then turned to face the crowd—and the podium.\n\nTaking another look at the cityscape, he saw a few buildings still bearing the scars of war. Next to them, freshly constructed ones provided effective contrast. The two presidents each grabbed pens from their respective sides of the wooden stand, flanking the paper lying upon it. Twin flourishes of the wrist carved paths of ink upon the colorless treaty, upon the unimposing treaty, not befitting the change it had wrought. The people, however, cheered all the same as the two dancers took the stage exits. He could almost hear them crying out for an encore."
 USA_IND.18.a: "Almost."

 USA_IND.19.t: "To the Victor's Allies Go the Spoils"
 USA_IND.19.d: "One thing Barry Astor was all-too familiar with was that the commotion of urban life was a routine and deafening force. But as the landing gear of his private jet extended down, settling it upon the hastily repaired tarmac, it became clear that even it could be disturbed. And as Astor, enterprising investor, or so said his résumé, descended from the plane's airstair and gazed upon the rubble that once made up Calcutta, there was only one thing on his mind: profit.\n\nHis guide quickly approached him, taking him off to the side and away from the war's aftermath. Not a good look for discerning customers, after all. They entered an open-top jeep, the guide's foot on the gas accelerating them toward fields of green leaves sprouting from rich, black soil. They disembarked, feet on the ground once more in order to more closely inspect the farm—no, the venture before them. The better part of one-hundred laborers extracted leaves—no, profit from the tea crops before them. This scene repeated itself tens of times across the landscape, taking up acres in what the guide had called a "noble pursuit to make use of nature's bounty."\n\nThe visuals were, on their own, enough to convince Astor to buy. He'd been scouting out locations for A&P for a little while now, searching for the next addition to their roster of produce. Some of the workers appeared emaciated, but he paid no heed. So too, did he pay no heed to the sound of gunshots in the urban jungle turned wasteland behind him. They did not warrant it. What did, however, was the green being collected before him and the different green to be collected after.\n\n"Thank you Swatantra," he muttered to himself, because after this, the supermarkets would have a little more variety, and a lot more profit."
 USA_IND.19.a: "And the laborers would see none of it."

 USA_IND.20.t: "An Oasis Called Peace"
 USA_IND.20.d: "Across the breadth of the Indian subcontinent, a collective sigh of relief is released into the air, mingling with the air currents circulating throughout. From there, it does not take long for news to travel. From east to west, Sphere to OFN, Eurus to Zephyrus, there is one word on the minds of all with even the most fleeting knowledge of global affairs: Peace.\n\nAcross the breadth of the United States, from sea to shining sea, a collective spark of hope is lit, however brief and small, as stories of negotiation triumphing over bloodshed conjure images of an end to the world's sorrows. But while it may leave within the week, for the next day remains ahead, it carries the one word capable of, even for a moment, and even without much consequence, bringing about within the minds of millions an outlook of optimism: Peace.\n\nAcross the breadth of the whole of D.C. and the many buildings therein, whether the Capitol or an unassuming office, a collective feeling of frustration takes hold of the powerbrokers, the legislators, the executors; it almost possesses them, yet such a statement would belie the fact that such an infuriated disposition is one that has come from within. Delhi and Calcutta becoming one without need for a single shot fired may have been the action, but the reaction is the fault of those reacting alone, those reacting with such vitriol in the face of an ordinarily joyous occasion: Peace.\n\nAcross the nearly eleven meter wide breadth of the Oval Office, among the commander-in-chief, the head of the executive branch, the leader of the free world, the man behind the Resolute desk and his cabinet, a collective indignatory rage receives an invitation from the minds of those assembled and takes its entry eagerly, for there is a concept that, in the minds of a few, is worth clouding one's judgment in the face of: Peace."
 USA_IND.20.a: "And they would make a desert of it yet."

 USA_IND.21.t: "A House United"
 USA_IND.21.d: "The sound of the Speaker's gavel hitting the sound block reverberated throughout the House, putting discussions on hold as it echoed from wall to wall. Eight-hundred-sixty-eight eyes looked at two.\n\nLike an automaton, in a routine many-times-rehearsed, the speaker began to read out the results of bills, each awaiting a chance at acthood. The senses of most lost interest rapidly, with most bills utterly inconsequential, with their results a foregone conclusion. But as the counting of yeas and nays continued, a sense of apprehension began to fill the room. With each meaningless formality spoken aloud, a new chance—each greater than the last—at the subject of this growing interest appearing was born, before promptly giving way. Yet just three bills away from the final one of the session, it appeared.\n\n"A bill for the granting of aid to the Republic of India in the interest of the national security of the United States of America," said the speaker, and in spite of its unwieldy title—one that would certainly be made more literarily photogenic as the headlines hit—the thought of the next few words gave the chamber a newfound sense of focus.\n\n"The voting record states," he dryly continued, yet the tone did little to dampen the enthusiasm of the body, "Three-hundred-seventy-six for Yea, fifty-seven for Nay, and two Present."\n\nThree-hundred-seventy-six rejoiced, fifty-seven were silent, and two were silent. The sound of the gavel rang throughout the building yet again, although it took an additional slam to quiet the room down. Even still, news of aid, humanitarian and otherwise, kept the yea voters smiling, and even those merely present couldn't help but share a bit of the joy. A letter would be drafted to [USA.GetLeader] shortly, and the OFN's presence on the global stage would receive the reinforcements it desired, that much, at the very least, was for certain."
 USA_IND.21.a: "That is, so long as the Senate was just as willing."
 USA_IND_aid_bill_senate_tt: "The bill has §Gpassed§! the House - but the Senate may be more resistant."

 USA_IND.22.t: "Not-So-Diplomatic Pressure"
 USA_IND.22.d: "The crunching of boots on gravel filled the cramped, hot Lahore consulate with yet more stress. A staffer looked out of a window, spotting militiamen investigating local buildings for any signs of resistance lying in wait. A sharp rap on the door caused him to recoil from the glass in shock, and a glance at his coworkers confirmed his position as closest to the door, and therefore the one with responsibility for opening it. Desperate times call for desperate unspoken agreements, he supposed.\n\n"This is the Consulate General of the United States in Lahore, please state your business," he said in almost fluent Punjabi. The man, however, responded in Pashto. "Punjabi?" he asked. The man then stepped aside, and another took his place.\n\n"This city is the territory of the Republ—er, Dominion of Pakistan," the other man said, the language barrier now removed. "State your business."\n\n"This is, as has been stated in the past, a diplomatic mission on behalf of the United States." Beads of sweat, no longer caused entirely by the sweltering heat, began their descent from the staffer's face. He hoped they did not betray fear.\n\n"And to what nation is this diplomatic mission currently being conducted with?" he said, prompting the lump in the staffer's throat to grow larger and demanding the response he would do anything not to give.\n\n"To the Republic of India," he said with a sigh, "this mission is currently being conducted with the Republic of India, and we request that in light of extenuating circumstances the matter not be discussed further."\n\n"Interesting. Do inform us of any updates on these 'extenuating circumstances' should they arise. We are quite interested, after all."
 USA_IND.22.a: ""And we eagerly await our next visit.""

 USA_IND.23.t: "No Flights Out Of Lahore"
 USA_IND.23.d: "The consul-general could have killed that kid. It was too early to even look at them, let alone talk; they were protected by the stars and stripes and twenty armed men underneath it; he was not authorised to say a word to anyone outside the consulate now that ibn Qasim turned Lahore into enemy territory. He'd have to make do with a censure and a poor performance review if they both made it out alive. Slim chance; Pakistani police were camped somewhere east, riot cops lined the streets outside, and they'd cut the regional phone lines so he couldn't get a clear message out to Delhi.\n\nA friendly cop tipped off the consul-general to the raid minutes before it hit, enough time for him to run up and down, telling everyone to burn and shred. Seven minutes passed, cables curling up in heat, letters cut and scattered. In his third-floor office, he packed two suitcases: one personal, one professional. Anything sensitive he couldn't take with him was consigned to his own fire. When those seven minutes were up, the cops outside moved into position. Main team knocked down the gate and the front door with a battering ram; another team cut in through the side. Beneath him, the consul-general heard panic, furniture thrown out of place, multilingual shouting and cursing.\n\nCops were still a few minutes away from the first floor. The consul-general panicked, ran downstairs to the second-floor. There was an office with a privacy hedge covering its window. He entered, locked the door and cracked the window open. His baseball days and the trim figure they required were long gone, but he could still squeeze through. He threw the briefcases through, heard them clatter a long way below, but as he stuck his upper body through the window he could reach out, grab the hedges and maybe climb them-\n\nThe door flung open with a kick. The consul-general panicked, tried to scramble out, but the Pakistani cops hauled him out by his ankles."
 USA_IND.23.a: "He went with them, screaming nothing they cared to understand."
 USA_IND_rescue_staffers_tt: "A new §mCIA operation§! to rescue our staffers is available"

 USA_IND.24.t: "Pakistani Consulate Crisis Ends"
 USA_IND.24.d: "As the sounds of gunfire and shelling across the subcontinent faded, it was a quiet morning in Lahore when the American staffers shuffled out again from the Pakistani prison, blindfolded, weak, and lips parched with thirst. They stood stock-still as their guards undid their blindfolds. This time, it was not another Pakistani Army delegation that stood before them, but American members of the International Red Cross flanked by United States Marines. A few words in English were exchanged between the Pakistani officer and the American ambassador to Pakistan, before the Pakistanis turned on their heels and headed back inside.\n\nForgetting their thirst and their exhaustion, the staffers cheered and wept with joy when they realized what was happening. The war was over, the crisis was over. They were going home.\n\nWhile the hostages flew back to Washington D.C. as the United States celebrated the end of the crisis, and Welcome Home signs were prepared in various American households, the President's staffers were jubilant as well. Although it was an embarrassment that the military couldn't rescue the staffers themselves, the President's popularity had gotten a minor boost in ratings for their determined handling of the crisis, and their unyielding approach to pro-German Pakistan."
 USA_IND.24.a: "Uncle Sam rejoices as his sons and daughters come home."

 USA_IND.25.t: "Line of Control"
 USA_IND.25.d: "Despite their resounding military victory over Azad Hind, there is increasing feeling within the Republic of India that one enemy has been replaced with another. The new nation of Pakistan sees India as an existential threat, and has repeatedly refused to withdraw any of their mutual territorial claims. Together with Pakistan's oligarchic authoritarianism and their 'fascistic' territorial claims, the ROI is positioning itself for another struggle between democracy and dictatorship in a future confrontation between India and Pakistan.\n\nChief to this future confrontation is the 776-kilometer (482 mile) military control line running between the disputed territory of Kashmir. Popularly known as the 'Line of Control', the LOC divides Kashmir between Pakistani and Indian-controlled territories. It is not recognized as a legal international boundary by the OFN or the Einheitspakt, but across the LOC, the Indian and Pakistani armies stare each other down daily, and running battles between Pakistani-backed paramilitaries and Indian troops occur throughout Kashmir.\n\nTensions continue to gradually increase across the subcontinent; border exercises, artillery duels, airspace violations, shouting matches between officers, and most concerning of all, a rapidly expanding shadow war between the Indian intelligence services and Pakistan's formidable security agencies. Supposedly the object of their intense activity is to prevent the rival government from developing nuclear weapons. Neither Washington or Germania have made statements on this matter."
 USA_IND.25.a: "One threat has been replaced with another."

 USA_IND.26.t: "The End of the Pakistan Experiment"
 USA_IND.26.d: "The Pakistan Movement's forces broke upon Punjab - the so-called "martial race" defeated, and their strongholds in the North-West Frontier occupied, and coming with that, the end of German influence in the Indian subcontinent. Already, its military officers, fundamentalist fanatics, and its oligarchical, callous aristocracy are fleeing like rats in the dark of night, scrambling away with their gold and their prayers to Germany or Iran. Any pitiful insurgency resulting from this will be crushed, as the government in exile set up by them impotently rants on about the Americo-Indian hydra.\n\nReintegration is not without its challenges, but the government is more than prepared to uproot the Pakistan experiment and its failures. Pakistan and their German backers have left scars and damage, but it's not unfixable, and already grassroots efforts are on the ground doing what they can to help those trampled underfoot by the Pakistani rebels.\n\nAnd moreover, the idea of India being partitioned is over - the subcontinent is united in spirit although perhaps not in fact, never to be divided again by imperialist power plays - be it the British Empire or the Third Reich."
 USA_IND.26.a: "Good riddance!"

 USA_IND.27.t: "Pakistan and Washington"
 USA_IND.27.d: "The Republic of India, the star of the OFN in South Asia, has been deposed. America has lost its foothold in the subcontinent, the world's largest democracy seemingly vanished in a flash. There is a silver lining, if an uncomfortable choice - Pakistan has broken off from India.\n\nWhile claiming to uphold the principles of Islamic democracy and a safe haven for oppressed Muslim minorities in India, the Islamic Republic of Pakistan is an oligarchic state run by a mix of powerful aristocrats, pocketed politicians, and ambitious military officers. Pakistan is also aligned with Germany and Europe, an outpost of German influence in South Asia, and on the doorstep of the Sphere to boot.\n\nIn normal times, Pakistan would be considered a potential enemy of the Free World. But these are extraordinary times, and they call for extraordinary measures. For all its trumpeting of its ties with Germany, Pakistan's elite will be just as happy with dollars as they are Reichsmarks, and may be open to American involvement. This could range from investment, to backchannel military cooperation, to even covert operations."
 USA_IND.27.a: "Lahore reaches out to Washington, and waits for a handshake."

 USA_IND.28.t: "Azad Hind's Total Victory"
 USA_IND.28.d: "The Indian War has drawn to a close as the pro-Japanese government of Azad Hind have defeated both India and Pakistan in what many are calling one of the biggest upsets for the OFN in recent years. The congratulations ring from Tokyo as one of their most powerful assets in the region has proved its military might, while Washington and Berlin slink away in shame. The United States has been hit particularly hard, having invested heavily into shoring up India as a major line of defense against Japan.\n\nWith India's defeat, the President of the United States and their party have suffered a major bump in polling as America takes a huge slide towards isolationism again - an embarrassing defeat for Washington, and an ominous sign of a grim future to many in the OFN, and to America's anti-fascist allies."
 USA_IND.28.a: "Ittehad, Itmad aur Qurbani!"

 USA_IND.29.t: "CIA in Lahore"
 USA_IND.29.d: "Of all the forms of American involvement in stabilizing Pakistan, the cooperation between the CIA and Pakistani intelligence may prove the most fruitful to American interests. The civilian government, while pro-German, is amenable to American involvement in exchange for American money, and the local intelligence community is eager to learn from the best, and the CIA are just that.\n\nWith another show of generous support from Washington, the CIA has established and embedded itself firmly in Lahore, beginning to build an intelligence network throughout Pakistan and into Free India. While CIA agents report that the Pakistani FIA is in no way known for its competence or for its incorruptibility, they have proven eager to assist in the destabilisation of Azad Hind. Ironically, one of the main methods being used are attempts to cast Azad Hind as a Muslim-dominated nation, to inflame the Hindu majority into igniting communal violence.\n\nInternally speaking, Pakistani intelligence has a laser focus solely on trade unionists and advocates of land reform, who are eagerly branded and executed as "communists". The CIA are, of course, not averse to this, and have begun to use American connections to Pakistani academics to collect lists of possibly dangerous socialist figures there.\n\nAlthough neither would admit it, the Ausland-SD and the CIA now find themselves joining hands, to stabilise the Pakistani government, and shatter India's unity."
 USA_IND.29.a: "Two eagles fly together, to set the Ganges ablaze once more."

 USA_IND.231.t: "[Get_newspaper_header]Calamity in Pakistan Hostage Crisis"
 USA_IND.231.d: "An operation to rescue American hostages from the government's besieged consulate in Lahore, currently occupied by terrorists from the Pakistani Movement, has ended in disaster. It is believed that the Marine team put in place for the operation was discovered by security forces after a police officer noticed an illegally parked vehicle outside the consulate, tipping him off to the ongoing infiltration inside.\n\nTo avoid provoking an international incident, the Marines have been returned home, but not the captured staffers. President [USA.GetLeader] has refused to respond to questions from our reporters, but private sources from inside his party have signaled their fury at how he has handled this operation, with many calling it one of the greatest ever mishaps in American foreign policy history."
 USA_IND.231.a: "I don't want to hear another word about this..."
