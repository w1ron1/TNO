 IND_pandoras_box_1_desc: "Life goes on as it has for centuries. Farmers toil in their fields, following the well-trod path laid before them by legions of their ancestors. The villages are whole, supported firmly by the ossified house of cards that maintains the social structures that have endured the fall of empires, kingdoms, and politicians great and middling. India marches a slow but steady beat into the future - or at least, appears to do."
 IND_pandoras_box_2_desc: "A wind of deep unease, bearing a scent of blood, blows through the old foundations. Sons leave in droves for the promise of work in the great cities, filling the slums and emptying the villages. Land is bought en masse not for the plough, but for the bulldozer. The old world is emptied, relocated, compensated - but, through it all, survives with the grim tenacity it has clung to for millenia. A great change is coming, but it has been seen before in other lands - and behind it all, the house of cards will endure."
 IND_pandoras_box_3_desc: "The bugle is calling, the great adventure has begun. Mothers bid tearful goodbyes to their proud sons as they depart for the barracks and the battlefield. The martial races fight on the front lines - all others find themselves in the factories and the rear. But even now, the whistle of bullets and the shrill shriek of dive bombers have begun to wither away the old ways, and as blood drains into the mud, the cynical soldier finds himself lasting the longest."
 IND_pandoras_box_4_desc: "The war has reached its bloody grip into the belly of the nation, devoured all, and found it lacking. Old military families find themselves devoid of sons to give, and honourable regiments find themselves recruiting from the common masses. Blackened, scorched earth is all that remains of the villages, and artillery rips mercilessly through flesh and bone regardless of high and mighty ancestry. Those who survive see the world through red-tinged, shell-shocked eyes, and the traditions of the old world mocking them."
 IND_pandoras_box_5_desc: "Damn the old ways, that led us to this. We will march on the bodies of our fallen comrades into the bowels of the hated enemy, rip his family to shreds, and bring the war into his household. Kill his priest and his politician, the silver-tongued devils that never saw their brothers reduced to ash and memories. And when it is all over, we will see this blighted earth transformed beneath our feet to serve us and us alone - the legion of men you created."
 
