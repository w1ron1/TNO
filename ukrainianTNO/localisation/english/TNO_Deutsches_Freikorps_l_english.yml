 DFK_Funding_from_the_Shadows:0 "Фінансування з тіней"
 DFK_Funding_from_the_Shadows_desc:0 "Із темних глибин виринають торбинки, наповнені монетами, і Вайдінґер із радістю їх хапає. Щоб утримувати владу над Баку на Кавказі, Німецький фрайкор отримує таємне фінансування від могутніх корпорацій і самого маршала Московії, Фердинанда Шернера."
 DFK_Band_of_Brothers:0 "Братерство"
 DFK_Band_of_Brothers_desc:0 "Окрім крові та походження, єдине, що може об'єднати чоловіків, — це війна. Німецький фрайкор — це загін найманих солдатів, які разом пройшли крізь вогонь і воду, жартуючи у мирні години та падаючи перед своїми побратимами під час битви. Фрайкор об'єднаний полум'ям війни, і ніщо не зможе їх розлучити."
 DFK_Rule_of_the_Mercenaries:0 "Правління найманців"
 DFK_Rule_of_the_Mercenaries_desc:0 "Баку перебуває під хаотичним правлінням Німецького фрайкору — загону жорстоких німецьких найманців, які не мають жодного досвіду державного управління. Через природу такого найманського уряду Баку став надзвичайно мілітаризованим, а його крайня нестабільність — як соціальна, так і політична — ні для кого не є несподіванкою."
 