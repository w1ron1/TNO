 POLITICS_OTTO_WEIDINGER_DESC:0 "Повстання рабів посіяло хаос і руйнування на східних територіях Райху, але ніде удар не був таким сильним, як на Кавказії. Земля, відома своїм жорстоким поводженням із рабами та місцевими жителями, швидко охопилася вогнями повстання, які шалено вирували, розриваючи старий порядок на шматки. Останній залишок німецької адміністрації відступив до Баку, серця нафтовидобутку Райху, і був змушений покластися на найманців, придбаних корпораціями, щоб замінити знищений гарнізон. Це стало їхньою погибеллю.\n\nОтто Вайдінґер - не бюрократ. Він солдат, і не більше. Есесівець, що став найманцем, Вайдінґер більшу частину свого життя перетинав схід уздовж і впоперек зі своїми загонами найманців, допомагаючи будь-якому замовникові, якому був потрібен, за відповідну ціну. Від придушення партизанів до захисту корпоративних володінь - Вайдінґер бачив усе; справжнісінький найманець, на рівні із Зіґфрідом Мюллером. Однак якщо є щось, у чому Вайдінґер зовсім не має досвіду, то це управління державою. І тут на допомогу приходять компанії.\n\nВайдінґер - не більше ніж ширма для справжньої адміністративної влади - компаній. Нафтові компанії, вольфрамові компанії та всілякі корпорації об'єдналися навколо обіцянок Шернера повернутися до часів слави. Їхній вплив на Кавказі усунув пронімецький уряд, поставивши Вайдінґера нагорі та надавши йому владу, необхідну для боротьби з цими набридливими рабами. Сам Вайдінґер не має нічого проти свого становища - товстої платні та повного контролю над солдатами компаній на додачу до його звичайного загону йому цілком вистачило б і без допомоги у поверненні Німеччині її колишньої слави. А якщо додати й останнє, це цілком може бути роботою його мрії - якщо він зможе її втримати."
