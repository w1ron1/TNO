 #National Spirits 
RPP_dis_united_coalition:0 "A Disunited Coalition"
RPP_dis_united_coalition_desc:0 "While in Brazil Delgado had mostly been able to keep his coalition of supporters united under the common goals of democracy in the Portuguese Republic, with the unification between these and the mainland Republicans in the aftermath of the failed coup attempt, unity would become nothing more than a myth.\n\nPaying lip service to Delgado and nothing more, factions would begin to be formed within the FPLN, with some even leaving it and forming rival parties, leading many to wonder if even in victory Delgado and his Republic will meet defeat."

RPP_true_lusophone_dream:0 "The True Lusophone Dream"
RPP_true_lusophone_dream_desc:0 "Salazar and his cronies had used Lusotropicalism as a justification for their colonialism, dragging its name through the mud and dragging away the communities and peoples that it was meant to unite. But Delgado would not let this be, he would push for a new depiction of the term and theory.\n\nPushing for true unity with other Lusophone countries, all under the guise of Democracy and self-determination, Delgado and his Republic would stand for a new age of freedom and equality, hopefully bringing nothing but prosperity and unity to the Lusophone people."

RPP_fully_ofn_dependent:0 "Fully OFN-Dependent"
RPP_deep_wound_heart:0 "Deep Wounds to the Heart"
 #Focus Tree
 ##Iberian Wars
RPP_a_guerra_iberica:0 "A Guerra Ibérica"
RPP_a_guerra_iberica_desc:0 "Iberia is in flames.\n\nYes, Portugal is now once more on the world map. The ship that was the Iberian Union is now sinking, and while we've managed to save ourselves, Portugal fights itself for control of the lifeboat—on one side, a reactionary junta of monarchists and conservatives, and on the other, are we—the republicans.\n\nWe absolutely cannot allow the monarchists to steer us towards tyranny, reaction and destruction. Taking up arms, we will resolutely ensure a place for liberty and democracy in Portugal's destiny. Reason will triumph, and we shall see to the rebirth of a free Portugal in the wake of the end of the union."

RPP_o_exercito:0 "O Exército"
RPP_o_exercito_desc:0 "For the first time since the Regicide, Portugal has seized the moment to seize the future that Salazar stole from it and create a true democracy from the ashes of Iberia. With the formerly joint armies of the Union now scattered across a fragmented continent, the Lusophone half of Iberia's army have made the long and arduous journey back to Lisbon, formally pledging themselves to the provisional government of the Republic.\n\nWhile by no means an army of pushovers, Portugal's army has always been notoriously underdeveloped, at once sidelined by Estato Novo politicking and overshadowed by the larger footprint of the Spanish military. If the dream of a republic is to be realized, rebuilding the remnants of the west Iberian army into a true Portuguese republican army must begin in earnest and quickly."

RPP_the_republican_army:0 "Patchwork Battalions"
RPP_the_republican_army_desc:0 "With the violence in Iberia only just begun, the partisan forces of the provisional government find themselves inheriting an fighting force that woefully underprepared to face the coming conflict. Republican revolutionaries in Portugal amount to a handful of half-depleted Union deserters alongside a hodgepodge of anti-establishment militias, with the beleaguered army units having already been critically underfunded for years prior to the collapse.\n\nIf democracy is to ever truly flourish after generations of authoritarianism, this imbalance of force must be remedied. Some might argue for consolidating our forces around the militias, while others are pushing for reconstituting Salazar's former soldiery into a proper army; The Republic must act swiftly in committing to either course, before the enemy opposite the battleline gains upper hand."

RPP_a_forca_popular:0 "Uma Força Popular"
RPP_a_forca_popular_desc:0 "Keeping the nature of the Civil War's unpredictability in mind, deliberations over the structure of the Republican fighting forces have come out in favor of reorganization around partisan militias. While the army defectors are to be commended for their bravery, the militias have a better ability to strike out at the enemy with unpredictability through guerilla tactics and sabotage.\n\nThis also has the effect of ensuring a culture within the upper echelons of the command structure that is more aligned with the values of democracy, something that will prove vital once the fighting subsides and the consolidation of a proper Republican framework for our forces can begin in earnest."

RPP_train_the_peoples_militias:0 "Drilling the Lambs"
RPP_train_the_peoples_militias_desc:0 "Despite their very clear enthusiasm for the fight for Portuguese democracy, the militiamen are still very green in terms of their on-the-ground fighting ability. Even as we adopt a more partisan approach to conducting the war, the militiamen will be brought up to speed as proper soldiers on the frontline, something the Portuguese defectors from the Union military can help us with.\n\nWhile some might be wary of any Salazarist sympathies they might have, the Union defectors still represent a wellspring of military knowledge and combat experience that will prove invaluable in the fight to come. By placing them in charge of training the militiamen and their commanders, we will seed a new generation of Portuguese military leaders as the old generation stands ready to guide their path."

RPP_o_exercito_da_republica:0 "Protetores de Lisboa"
RPP_o_exercito_da_republica_desc:0 "Any attempt for the Republic to legitimize itself must begin with the ability of the soldiery to execute the war, for any ideals we hold dear will amount to nothing if the frontline collapses. As much as the defectors from the Union military might draw some side eye for their association with Salazar, they remain the finest fighting regiments in Portugal, even as depleted in numbers as they are now.\n\nTheir numbers will need to be reconstituted and it is from the partisan militias that will bolster them. It will take some time for the guerilla fighters to properly integrate into Republican forces, time that the enemy will use to catch us off guard, which is precisely why time is of the essence to see the organization of the new army of the Republic initiated as soon as possible."

RPP_support_an_elite_army:0 "The Spear's Tip"
RPP_support_an_elite_army_desc:0 "The shoddy state of the Portuguese Military has been well-known for the better part of thirty years, yet another shameful example of Salazar's recklessly neglectful mismanagement of Portuguese affairs. With the Provisional Government of the Republic in control, we have the opportunity to undo this grave injustice, as much to restore pride in our armed forces as to conduct the Civil War as it escalates ever rapidly.\n\nWith the armed forces' rehabilitation already underway, special training regiments and courses are being introduced to prepare both the soldiers and officers for the campaign to come. With this practical knowledge and combat doctrine in place, these elite fighting units will form the tip of the spear of the new Republican Army, striking out with efficiency and precision to rival any that Rome or Germania might produce."

RPP_death_to_autocrats:0 "Death to Autocrats!"
RPP_death_to_autocrats_desc:0 "Like many nations forced to live under the New Order, the world of what came before, more and more, resembles a distant mirage. Iberia is by no means an exception to the rule and certainly neither is Portugal, where the authoritarian regime of Salazar was established years before the rise of Hitler. Few can remember a time where democracy was even a dream to be had for the Portuguese, one that our enemies still struggle to see crushed before our very eyes.\n\nThe new army of the Republic must be ever vigilant of the cause we are involved in, to undo a national catastrophe multiple generations in the making. The heirs to the Caudillo, and worse still behind them, are poised to topple the Republic before it has a chance to truly begin. This can not, will not, come to pass; Everyone on the frontlines stands ready to bleed and die to prove to the world that there are such things as miracles."

RPP_a_economia:0 "A Economia"
RPP_a_economia_desc:0 "The Iberian Collapse did more to rend an entire continent asunder with the fires of Civil War; Much like Its Spanish counterpart, Portugal's economy has been shattered by the non-stop fighting in the west. This, of course, comes after decades of economic stagnation brought on by the protectionist policies of Estado Novo that tanked Portuguese fiscal fortunes for decades prior.\n\nNaturally, the provisional government of the Republic is all too eager to embrace the free market after a generation of constrictive Corporatist economics, yet others worry that sprinting to capitalism runs counter to the desire for a truly egalitarian society, wanting to place more measured approach to the market while avoiding the Salazarist's most hardline impulses. Either method has benefits and drawbacks that the provisional government will have to consider."

RPP_the_rural_regions:0 "Rural Resilience"
RPP_the_rural_regions_desc:0 "Despite the Estado Novo's attempt to present Corporatist economics as one of modernity and refinement, much of the economy of Portugal remains very much agrarian, particularly in the southern hinterlands presently controlled by the provisional government. As much as the lack of proper industry remains an issue, control of the nation's farmland is just as vital as a means to restore Portugal's economic health.\n\nWhile we can shore up our industry in due time, the agri-sector can be reinvested in to keep the food stores at capacity; All the guns and ammunition in the world means nothing if the army marches on an empty stomach, with any additional food surplus being sold off to stimulate economic growth."

RPP_an_american_model:0 "Liberty's Loan"
RPP_an_american_model_desc:0 "If ever there was an example crafting an economic framework for the new Republic of Portugal, their name and reputation is far from unknown, nor is the affluence and prosperity that is almost synonymous with them. While the Caudillos made efforts to keep the United States of America at arms' length to prevent any tension with the rest of Europe, now such efforts are as unproductive as they are fruitless, with our adoption of liberal democracy de facto bound to draw the ire of Germania as a matter of course.\n\nIf the free market is what will lift Portugal from the rubble of Iberia, let us allow the arsenal of capital itself to flow into Lisbon like a torrent! The United States possesses one of the most powerful economies on Earth, from which we will extract the means to fully bring Portugal into the modern age, all to the gentle ring of the world's largest cash register."

RPP_a_wide_financial_reform:0 "Financial Fortress"
RPP_a_wide_financial_reform_desc:0 "The opportunity to finally seize control of Portugal's destiny and shake off the yoke of autocratic rule will mean nothing if we do not allow the people themselves to engage with the fruits of democracy. At the center of the nation's attempt to rebuild Its economy, the right to free enterprise of the average Portuguese must be made paramount.\n\nIf businesses are to truly exist without restriction and for our countrymen to engage with the market in ways once impossible under Salazar, sweeping tax cuts must be enacted so that widespread fiscal reform can take root. At the end of the day, so long as the forces of the Einheitsfront lurk just beyond the Pyrenees, capital is the strongest weapon our people can wield."

RPP_embrace_a_more_mixed_economy:0 "A Mixed Economy"
RPP_embrace_a_more_mixed_economy_desc:0 "It is a hard thing for some to swallow and hardly good optics-wise, but the war effort to finally achieve the Portuguese republican dream has to take precedence over libertarian ideation. As appealing as fully opening the door to the world markets is, we have to preserve state control over economic affairs, as much to keep the war machine running as to ensure the mercurial hand of the free market doesn't take advantage of a people already racked by war and desolation.\n\nThis course of action obviously brings up unfavorable parallels to Estado Novo and Salazar's approach to command economics, at a time when unflattering comparisons to the old regime are ill-timed at best. We are still committed to having extensive liberal reforms enshrined and codified, but we aren't about to sell the soul of Portugal's economic health when the Republic is still in Its infancy."

RPP_embrace_the_unions:0 "Embrace the Unions"
RPP_embrace_the_unions_desc:0 "As it was with almost everything else under the rule of the Caudillos, the categorical suppression of Labour Unions was a well-known and well-publicized example of the Estado Novo's nakedly reactionary ideals laid bare for all to see. If our new Republic is to truly make amends with the victims of Salazar, an earnest reconciliation with the unions is not only to be assumed and required, but of a very grave and much deserved moral obligation.\n\nEven as Portugal works to rebuild itself around a mostly liberal economic framework, a real commitment to promoting unionization has been adopted by the provisional government. Fair wages and safe working conditions are to be enshrined and preserved, for it is the sweat and toil of the workers after all that will allow our proud country to heal."

RPP_fully_embrace_free_trade:0 "A Nation of Merchants"
RPP_fully_embrace_free_trade_desc:0 "Not that Portugal needed or particularly wanted to inherit the policies of the Iberian Union, the trade tariffs imposed by Franco and Salazar continue to weigh down the economy, both in terms of our fiscal health as for our war production. Portugal's industry remains underdeveloped so long as the Civil War occupies our attention, making imports a critical lifeline to keeping our economy more or less stable, something the Caudillo's restrictions have only made that much more difficult.\n\nLet the obliteration of these tariffs mark the beginning of the defiant effort against the politico-economic legacy of Estado Novo and Salazar, the presumed primacy of Corporatist economics forever buried beneath the tides of capital! With the trade restrictions lifted, much needed commerce and wartime supplies will flood into our ports from around the world, but it won't be long before Portugal herself is the one exporting!"

RPP_o_exilado:0 "O Exilado"
RPP_o_exilado_desc:0 "Just as the Free French government of DeGaulle continues to undermine the Vichy regime from his stronghold in Africa, so too did General Humberto Delgado dare to rebel against his superiors in Lisbon, defying the Diarchy of the Caudillos in the name of democracy. Since then, he has become the principal voice of Portuguese antipathy from abroad. It is he who has been given the honor of leading our new republic through the fires of the Civil War and beyond.\n\nEvery bit the republican firebrand to rival the ranks of Washington and Bolívar, it shall be through his leadership that will see the Portuguese Republic become a reality. Utterly devoid of fear and armored with conviction for the democratic process, Portugal will soon become an example of liberty to be venerated and a bastion for the oppressed all across Europe."

RPP_speak_on_the_radio:0 "A Voice Amidst the Static"
RPP_speak_on_the_radio_desc:0 "Even though Delgado has garnered a near-mythic reputation as the face of a new and free Portugal, the General has largely kept himself behind closed doors to focus on the running of the provisional government's day-to-day. The examples of King George VI, DeGaulle and Radio Free Europe all speak to the importance of securing popular support through regular radio broadcasts.\n\nWith such a transcendental national figure at the helm, it is only proper for the General to take to the airwave to bolster the morale of the citizenry in person. It may take a moment and some proper coaching for the benefits to become tangible, but for our trouble, we will have seeded republican legitimacy among the population to ensure a soft-landing from Salazarism once the fighting in Portugal subsides."

RPP_learn_from_brazil:0 "The Brazilian Blueprint"
RPP_learn_from_brazil_desc:0 "We of all people would be remiss not to acknowledge that there is another sterling example of western democracy across the Atlantic, one with a history manifestly known to be inexorably tied to that of our own; The Republic of Brazil represents a template for true democracy that is to be respected and admired as to be equal even to America, wrought in the fire of rebellion against both the King and followed soon after by their Emperor, a crucible not unlike Portugal's own fight for Its newfound democracy.\n\nYet just as Salazar once smothered Lisbon's early chance at liberty, so too did Vargas and his western off-shoot of Estado Novo attempt the same in Rio de Janeiro decades prior. If there was a place to look to for a framework for building the new republic, it is most beautiful to find one amidst the rivers and rainforests of the former crown colony. Order and Progress, indeed."

RPP_found_the_movimento_nacional_independente:0 "Found the Movimento Nacional Independente"
RPP_found_the_movimento_nacional_independente_desc:0 "It is a rare thing to be in a position to truly build a liberal democracy from the ground up, such is the pervasiveness of Salazar's authoritarianism that the very framework for the republic had to be compiled almost from scratch. Party politics in the provisional government lay in a similarly odd position; With the far-left driven to the peripheries and Estado Novo now persona non grata, the New Republic is in a startling absence of political parties to represent it.\n\nThis dynamic will certainly not last long, which is why the regime of Delgado has approved the formation of the National Independence Movement (MNI), a political platform to represent the ruling government within what will shortly become a thoroughly multi-party representative system."

RPP_maintain_party_unity:0 "Maintain the Mosaic"
RPP_maintain_party_unity_desc:0 "Any legitimacy that the newly christened MNI is going to have must come from both party cohesion and a clear political charter, one that will appeal to the average Portuguese and give the ruling government a firm bedrock to continue shaping the New Republic. Critics and radicals are as predictable as the seasons and will have to be left out, but the inevitable opposition parties to form from them will be healthy for nurturing Portuguese democracy.\n\nThe process is likely to be a slow one with plenty of growing pains, but progress is progress. By the time we're finished, MNI will have solidified itself as the founders of the republic and the true voice and face of the new Portugal."

RPP_a_place_for_all_democrats:0 "A Place for All"
RPP_a_place_for_all_democrats_desc:0 "The people of Portugal did not perish in the thousands merely for the MNI to become an elitist mirror of Estado Novo's power mongers, for it is the firstmost duty of the party of the New Republic to stand by the principles of democracy and liberty. We can not allow ourselves to fall to the temptations of Ivory Tower politics, therefore the MNI must be willing to open their doors to the widest range of democratic supporters, even including those considered radical and those who are openly critical of Delgado's regime.\n\nThis ideal is as important to the foundation of Portugal's new democracy as anything else we have fought so vivaciously to secure, so that the Portuguese people are sure to see that the MNI shall always represent their interests over that of party politics."

RPP_a_peoples_general:0 "A People's General"
RPP_a_peoples_general_desc:0 "While Humberto Delgado and the MNI have been savvy in using popular media to secure support from the people, this has the unflattering side effect of drawing comparisons to the populism of Franco. It is crucial that Portugal sees The General as the man he always was, a military man of humble origin and of deeply human commitment to his fellow countrymen.\n\nAccusations of populism be damned! Delgado's sole purpose is one with his party, to see the Republic of Portugal become a reality and the inequity of Salazar's regime become nothing but a foul memory. To this end, further public appearances by the president have been formally organized by the MNI. With Delgado at the helm and his party beside him, all will know that The General's ambitions start and end with the people of Portugal."

RPP_an_army_that_protects_freedom:0 "An Army That Protects Freedom"
RPP_an_army_that_protects_freedom_desc:0 "For far too long, the military reputation of Portugal has been sullied by Its attachment to the authoritarianism of Estado Novo and Salazar, much like Its Spanish counterpart was to the Falange and Franco. Where it wasn't routinely rooked by poor maintenance and political corruption, it was the tool of the state to crush any opposition to the Iberian Diarchy, both at home and abroad.\n\nAs the Civil War reaches the critical stage, the Portuguese Army stands at the precipice of a true redemption in the eyes of history. With Delgado at the helm and the whole of the people of Portugal at his back, a vast propaganda campaign will be initiated to reinforce this new image of the Portuguese Military; No longer the playthings of a tyrannical regime, but the last line of defense to ensure such dark days shall never return."

RPP_a_state_that_fights_for_the_free:0 "A State That Fights for the Free"
RPP_a_state_that_fights_for_the_free_desc:0 "One must never forget the course with which the New Republic has embarked, for it marks a crucial turnabout not just in state affairs, but the very concept of Portugal as a nation. A country built on the ideals of representative democracy, ideals once considered so secure in their foundation as to be almost benign, these things are now as alien to the Portuguese in the era of the jackboot and swastika as the divine right of kings.\n\nThe Civil War now enters a critical stage, where Portuguese democracy is on the cusp of finally being realized. With the propaganda war in full swing, the people must know that the New Republic is no longer just a dream; Let it be our effort, our sacrifice and our victory that forever marks where the tide of European totalitarianism finally broke, where a country arose from the ashes to dare place its proud and august people at the heart of a new national identity."

RPP_e_a_hora:0 "Ó Portugal, Hoje És Nevoeiro... É A Hora"
RPP_e_a_hora_desc:0 "Portugal's history has long been defined by what awaited her beyond the shoreline. From the first settlements on the Azores, to Africa, to the conquest of the Amazon, to the peripheries of India and far east Asia. Now as the Civil War approaches its terminus point, yet another trial is waiting for the Portuguese, one far worse than any her people have ever faced before.\n\nBeyond the dust and rubble of the Iberian Union and further north past the Pyrenees, the whole of Nazi-occupied Europe lies in wait. The very essence of sheer, unbridled human evil, corporealized into a macabre façade of what was once one of Europe's most venerable of nations. That darkness will only ever seek to snuff out the New Republic, that is why our nation's mission, as important as the end of the Civil War, is for the fire of Portuguese liberty to shine as bright as our souls can burn; In the name of God, Let there be light!"

 #EVENTS 
RPP_wars.1.t:0 "This Land Is Our Land"
RPP_wars.1.desc:0 ""Your private property has just been collectivized in the name of the people."\n\n"Excuse me?"\n\nGuilherme knew that the times were hard, and that the "great Iberian proletarian revolution" was supposed to come any day now, but this? This was barbary! Who did these people think they were, exactly?\n\n"I said," the militiaman repeated, slightly annoyed at his unintentional host's stubbornness, "your private property has just been collectivized in the name of the people. This herdade shall from now on belong to the people, and shall serve as a base for further PPRI operations."\n\n"Hold up, hold up, hold-" Guilherme said, burying his face in his hands, "What the hell do you think you're doing? I'm an honest man, I've never done anything wrong to you people, what are you-"\n\n"Listen, I don't doubt you were a nice farmer owner who treated his workers just the right way," the man interrupted, with a falsely affected voice, "but do you really think the people's revolution gives a damn about that? You heard me, people! Start packing!" he added, shouting at the men standing next to him.\n\nWell, there had to be a way out of this, right? They weren't gonna just steal his home, without him having a single word to say about it, no! He was Guilherme de Carvalho, dammit! He wasn't going to be expropriated by some red-tinted dimwits!\n\n"No, but I don't think you understand. You see, um-"\n\nGuilherme's pleas suddenly met the butt of the revolutionary's rifle, sending him straight to the floor. The great revolution was here at last, it seemed, and yet..."
RPP_wars.1.a:0 "Guilherme wished it didn't come at all."

RPP_wars.2.t:0 "Any Portuguese in a Storm"
RPP_wars.2.desc:0 "Rifles slung heavy on broad shoulders, swinging and swaying to the march of the militiamen as they trekked through the dense forest. They had no fanfare to play them onwards bar the occasional crunch of branches underfoot. The lone chirps of some bird, perched high on the bough of an oak tree that scarcely moved in the breeze, rang in the ears of one private. He turned to his comrade. A song, perhaps?\n\nThe tune started off low, hushed, barely loud enough to ring over the sound of monotonous jackboots trudging through mossy ground. Who is afraid of communism, it asked, to which the militiamen gave their rumbling reply:\n\n"The landowners, the monopolists, the colonialists and the parasites!"\n\nAbout half a dozen army soldiers were following through the wood, all trained on the ambient nothing only to have it broken by the chorus of the irregulars up ahead. One corporal looked at another. "Should we be worried about the singing?"\n\nThe sergeant clicked his tongue. "Don't be so stupid. Our men and their men, soldiers and militia alike, are on the same side. Defending Portugal is our common goal."\n\nA disheveled recruit, cigarette hanging from his grimy fingers, chipped in with a laugh."
RPP_wars.2.a:0 ""Just you wait until they're the ones shooting at us!""

RPP_wars.3.t:0 "A Good Revolutionary Cog"
RPP_wars.3.desc:0 "João was led up the stairs to Major Caldeira's office in Beja. He was running late, cursing himself while panting. The future of his command depended on the impression he would make here, and unpunctuality would not help him. He knocked on the door, barely waiting for an invitation.\n\nJoão found himself in a small but meticulously organized office. João felt the middle-aged officer's eyes scanning him, his crudely washed and casual clothes standing out in the room. He didn't even manage to catch his breath before Major Caldeira motioned for him to sit down.\n\n"The Republic thanks you and your men for your service thus far," began the Major, "and I can now tell you your unit has been selected for Army integration. You will receive your orders to move to a training base soon." The major stopped, sharp eyes peering at João.\n\nJoão swallowed. In his mind he saw his men, lined up and uniformed, smiling in a victory parade. It was nice. However, tendrils of doubt plagued this vision.\n\n"Sir, is this for the best? We've both benefited from our current arrangement. My men can move faster, act faster. We can -"\n\nMajor Caldeira cut him off, bluntly but without malice in his voice. "I'm sorry, Mr Pereira. I have a busy schedule, and you've come here late. This is necessary from an organizational and strategic viewpoint, and I don't have the time to walk you through all of the considerations. However", he said as he shuffled through the file on João's detachment, "I can tell you that your integration into the armed forces will result in your immediate promotion to the rank of Lieutenant, where you will have a say over the way you conduct your unit. Have a good day."\n\nLeaving silently and closing the door behind him, João turned around to see two soldiers waiting to escort him outside. He knew this day would come. The Republic was growing from a plucky band of rebels like his men to an actual government, and the machinery of governance was devouring everything in its path. But he tried."
RPP_wars.3.a:0 "And the very fact he was able to try was more important than everything else."

RPP_wars.4.t:0 "Dawn"
RPP_wars.4.desc:0 "The sun hadn't risen yet, but the army base in Setúbal was already abuzz with the sounds of marching boots, barked orders, and weapons being handed out to eager volunteers. The base had been under siege by Republican militias for days, but had held firm - until tonight. A group of young officers, trapped in the compound and sympathetic to the rebels, took matters into their own hands. Now, the base's commanding officers were held at gunpoint, and it was quickly becoming a hub of local revolutionary fervor.\n\nAs the darkness of night gave way to the blazing red of dawn, the base's loudspeakers crackled into life, calling the revolting troops, rowdy militiamen, and even curious civilians who wandered into the breached compound to gather at the base's mustering grounds. In front of this colorful and loud mass of people stood a single man, on a stand adorned with red and green flags.\n\n"Good morning, Gentlemen. I am Captain Salgueiro Maia of the Portuguese Army. As you all know, there are three kinds of states: Fascist states, capitalist states, and the state we've come to. Now, in this solemn dawn, we are marching north to end this state! I call for anyone who wants to come with me: let us go to Lisbon and finish it. This is voluntary. Who does not want to leave, stay here!"\n\nMaia raised his eyes. Before him was a sea of men, smiling after a sleepless night, raising their rifles in the air, calling his name. Calling for the Republic. His knuckles whitened as he gripped the railing of the stand with as much force as he could muster. He was afraid he would not be able to handle the terror, awe, and joy that were swirling within him if he let go. But he had to. He had called upon the long-repressed waves of hope and defiance."
RPP_wars.4.a:0 "What was left to do but ride them north?"

RPP_wars.5.t:0 "Crossing the Tagus"
RPP_wars.5.desc:0 "The battered radio on the counter of the Santarem Café crackled to life, to the delight of the three young people who had been repairing it. Behind the counter, the old Cafe's owner smiled as a speech began to sound around the quaint business.\n\n"Honorable citizens of Portugal. It has been decades since we have tasted the sweet promise of democracy, and almost thirty years since we have been bound in unholy union to the Spanish despot, who aimed to erase us into their so-called Iberia. Today, we draw a line in the sand. Today we say: no more."\n\nIn the small town of Alvito, the mayor and his two sons were busy hanging red and green banners from the townhouse's balcony, half-listening to the address playing on the radio in the office behind them. "Now, as we rise up against those that would torment us, we must find within ourselves the unity and cooperation that the tyrants fear most. They will try to divide us. We will be stronger than them, together."\n\nA military truck trudged on a forested dirt road somewhere south of Setúbal, its occupants struggling to hear the sputtering radio. At last, the truck cleared the tree line and the signal became clearer: "The struggle will be difficult, and of many, sacrifices may be asked. Perhaps even our lives. These men and women will live on forever in the memory of the free people of Portugal, and their sacrifice will ensure the Republic's triumph."\n\nIn his new office, President Humberto Delgado was finishing his speech. "Let us each find strength in one another. If we are united, the darkness which aims to engulf us will never extinguish the new dawn that is rising over Portugal." Before finishing, he shuddered. After so many failures, will this truly be the time? "Long live Portugal! Long live the Republic!""
RPP_wars.5.a:0 "There was no way back now."

RPP_wars.6.t:0 "Espirit de Corps"
RPP_wars.6.desc:0 ""Good man," whispered Delgado. The president offered a small pat on the soldier's shoulder before moving onto the next. Humberto Delgado had made it a habit to conduct impromptu inspections of his regiments to survey their preparations, training and appearances personally. It also worked to form a personal connection with his soldiers; morale was a fleeting resource in these trying times, after all.\n\nNoticing the sun finally dipping below the horizon, Delgado gave a silent nod to the young officer accompanying him, turning to face the crowd of soldiers in formation. "Elvas Infantry Regiment," the officer barked, "you are dismissed!" The soldiers quickly dispersed back to their barracks, leaving a lazy-eyed Delgado with the regimental officers as they amassed near him.\n\n"You bless us with your presence, Your Excellency." The regiment's commander, a man of toady stature and sycophantic tone, gave a toothy smile. "A fine regiment, no? I can guarantee that these men have only received the finest training under the most talented—"\n\nDelgado interjected with a dry chuckle, briefly disarming the commander of his self-congratulating ramblings. "Thank you, uh... keep up the fine work, yes. Please, excuse me." Delgado quickly vacated himself from the bewildered officers, moving to a nearby barrack. Inside, the soldiers chattered away about stories of home and family, all over shared barley beer. One laughing soldier finally noticed Delgado, quickly snapping to attention before the remaining soldiers followed suit.\n\n"At ease, please." The soldiers quietly stood easy, despite being made uneasy by the president's presence. "Come, hand me a bottle." A soldier with a lazily opened tunic obliged, handing a bottle which Delgado immediately drank from. "Thank you, soldier. Tell me, where are you from?"\n\n"...Faro, sir." Delgado smiled warmly at this, eliciting a quiet smile from the soldier. "Oh, Faro...""
RPP_wars.6.a:0 ""Such a wonderful home.""

