#Madeira loc 
RPP_trouble_savages:0 "Trouble with the Savages"
RPP_trouble_savages_desc:0 "The Savages are a group of uninhabited islands to the south of Madeira. While on a map they may be closer to the Spanish Canary Islands, they are officially under Madeiran control. Strategically, they are of little value, but that's merely the opinion of the Madeiran government.\n\nWere Spain to see things differently, or the OFN to place down something provocative on those chunks of rock and sand, then Madeira could find itself dragged into a war it wants nothing to do with. As such, it is the Madeiran government's mission to ensure that nobody glances twice at the Savages. They have held no strategic value up to this point, and they never will."
RPP_second_son:0 "The Second Son" 
RPP_second_son_desc:0 "Madeira, compared to the Azores, is both smaller and located in a less strategic position. Naturally, this means Madeira isn't nearly as eye-catching to the OFN, and as a consequence far less OFN funding reaches the islands..\n\nHowever, while Madeira may be less attractive to OFN investors, there is a silver lining to the whole ordeal. Madeira will never be able to spend as freely and liberally as the Azores can on infrastructure, welfare, and other such projects, but Madeira also doesn't have the OFN breathing down its neck. The islands of Madeira are free to do largely as they please, as long as the OFN remains welcome guests within the archipelago."

