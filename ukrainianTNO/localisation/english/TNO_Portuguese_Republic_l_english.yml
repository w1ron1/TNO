 ## Ministers ##
 ###############
 RPP_Humberto_Delgado:0 "Humberto Delgado"
 POLITICS_HUMBERTO_DELGADO_DESC:0 "After being sent to the US as a representative in the OFN Military Command in the early '50s, Delgado would turn against the state that he once supported and embraced democracy as the best possible future for Portugal. While he would continue to be anti-communist, his increasingly vocal support for his new beliefs would make him begin to fear for his life, especially after the 1957 Coup, leading to his self-exile into Brazil. Defeated and exiled, da Silva Delgado would not give up, uniting other exiles and forming the Frente Patriótica de Libertação Nacional (FPLN) to unite all those that wished democracy to come to Portugal.\n\nWhile the FPLN would have a mostly uneventful existence, being nothing more than a small organization with little influence in both Portugal and Brazil, things would change with the Santa Maria Affair, with the organization growing both in size and influence. However, every blessing, no matter how big, comes with a curse attached to it. Delgado had always valued unity within the exiles above all other things, believing that only together could they threaten Iberia. But with its new size, a myriad of issues became apparent to both him and his supporters, from their ambiguous stance on the colonies to their tacit cooperation with the communists, despite Delgado's own personal views. Before long, the FPLN would shake to its core, only remaining united thanks to its leaders' popularity and raw charisma.\n\nEven despite all of this, as a monarchy was declared in Portugal, many republicans saw him as their only hope, the charismatic general that could lead them and gather enough popular support to rise up against the new regime. Even still, as their initial coup attempt failed and the resulting instability throwing the state into civil war, Delgado would embrace his position as the leader of a republican, democratic Portugal."
 POLITICS_RPP_JAIME_ORNELAS_CAMACHO_DESC: "Jaime Ornelas Camacho is a civil engineer with a long career in civil service, having served in countless engineering and planning-related posts. Camacho had been involved in the construction of both of Madeira's first airports: the Funchal airport and the Porto Santo airport.\n\nHowever, Camcho was also experienced in the world of politics. He had been one of the founders of the People's Democratic Party of Madeira, and served on the Regional Board of Madeira as democratic self-governance began on the island. As it became clear that Madeira would soon be an independent republic under the protection of the OFN, it was decided that Camacho would serve as the first President of the Republic.\n\nMadeira, being smaller than the Azores, and lacking Monjardino's American business ties, receives much less funding from the OFN than its fellow archipelago. Regardless, Camacho's PPDM receives widespread support from the populace with little organized political opposition, and Camacho has dedicated his presidency to improving the lives of the people, and improving the quality of infrastructure in Madeira above all else."

 RPP_Mario_Soares: "Mário Soares"
 RPP_Decentralized: "Decentralized Leadership"
 RPP_Unorganized: "Disorganized Leadership"
RPP_Revolutionary_Council:0 "Revolutionary Council"
RPP_Revolutionary_Council_desc:0 "The Portuguese Republic has fallen, defeated in the nation's bloody civil war. The Republic's government, in collaboration with the OFN, already had an evacuation plan in place. They have now relocated to the Atlantic archipelagos of the Azores and Madeira, removing Fernando de Quintanilha from his post. President Humberto Delgado was invited to step down by the military after such a significant defeat, and now works in Latin America to rally support for the homecoming operation. The Presidency has instead been replaced by a provisional "Council of the Revolution." The council itself can be divided into three factions of military officers: the "conservative republicans" led by Francisco da Costa Gomes, the "left-wing democrats" led by João Varela Gomes, and the small and leaderless faction of "independent officers" that serve as the tiebreakers in most decisions.\n\nThe Portuguese Confederation's government is now wholly dedicated to a singular mission: the preparation and execution of a landing in Portugal to retake it, the only way to save Portugal from ruin.\n\nReliant on the OFN's material support, the new government is extremely aware that failure or being abandoned by the OFN would mean returning to exile, leaving Portugal in the hands of whichever despot currently controls the nation. This is a fate that all of the officers within the council wish to avoid at any cost."

RPP_Manuel_Lapa:0 "Manuel Rodrigues Lapa"
RPP_Manuel_Lapa_hog_desc:0 "§YPresident of the Council of Ministers\nConservatism§!\n--------------\n§LManuel Rodrigues Lapa is a man of literary talent. His support for Portuguese democracy however earned powerful enemies in the universities and halls of power of his home country during the 30s and 40s, preventing him from the philologist career that should have been. Being forced into exile in Brazil, Lapa's activism never ceased.\n\nA close associate of President Delgado from their shared time in exile, Lapa finds himself in a role with few official duties at the dawn of a new Portugal. He is not idle though, using his freedom from the many governmental operations to use his skills to rally the population. Many of the people have forgotten the tastes of freedom; Lapa will tell of them.§!"

RPP_Jorge_Sena:0 "Jorge Cândido de Sena"
RPP_Jorge_Sena_for_desc:0 "§YMinister of Foreign Affairs\nLiberal Radicalism§!\n--------------\n§LJorge Cândido de Sena is ever the consummate intellectual. Starting his academic career in civil engineering, he would quickly begin publishing poetry, essays and grow increasingly outspoken on the authoritarianism of the Salazar regime - something that would force him to Latin America.\n\nHaving spent much of the last decade in Brazil and the United States, Sena dreams of a Portugal that stands shoulder to shoulder with the OFN, the European partner of Latin America. To achieve that goal however, the war must be won - to do that every piece of aid the free world can give the Republic must be sought.§!"
 
RPP_Nuno_Simoes:0 "Nuno Simões"
RPP_Nuno_Simoes_eco_desc:0 "§YMinister of the Economy\nLiberal Corporatism§!\n--------------\n§LNuno Simões was once a man near the top of the Portuguese state, the Secretary General of the Supreme Administrative Court, but Simões' democratic republican ideals would see him ejected and thrown into the political wilderness. However, the thing that was meant to push him into obscurity instead created a fervent activist against the Salazar regime.\n\nBacked by a young wing of Estado Novo reformers, Simões looks to Brazil for inspiration for the new Republic. The developmentalism model of President Juscelino Kubitschek contains a cornucopia of promise to Simões and his wing of young reformers will ensure its prosperity comes to Portugal by any means necessary.§!"

RPP_Joao_Gomes:0 "João Varela Gomes"
RPP_Joao_Gomes_sec_desc:0 "§YMinister of National Defense\nLeft-Wing Populism§!\n--------------\n§LSoldier and revolutionary, João Varela Gomes is no stranger to the spirit of the people. A long time supporter of President Delgado, he has been on the frontlines of opposition to Salazar and the perverse Iberian state for years, serving as an advisor to the Iberian Revolutionary Liberation Directorate. He even traveled often between Latin America and Portugal in pursuit of support for the revolution, becoming a personal friend of Fidel Castro in the process.\n\nAfter the Santa Maria affair he was forced into exile, but now he returns with the opportunity to turn everything he has onto the fascists. The soldier has returned to Portuguese shores and will see its people freed - or die trying.§!"

RPP_Mario_Miguel:0 "Mário Firmino Miguel"
RPP_Mario_Miguel_sec_desc:0 "§YMinister of Defense\nConservatism§!"

RPP_Clodomiro_Alvarenga:0 "Clodomir Sá Viana de Alvarenga"
RPP_Clodomiro_Alvarenga_hog_desc:0 "§YPresident of the Council of Ministers\nChristian Democracy§!"

