 UCW_supply_conserve_button_tt_delayed: "Ми зосередимося на збереженні наших запасів зерна, щоб продовжити період виснаження, бо це війна на виснаження, а не на силу.\n\n[UCWHasPPorNot]\n\n§YПри активному стані це дасть нам наступні ефекти:§!\n\nОрганізація дивізії: §R-5.00%§!\nЩомісячне населення: §R-5.00%§!\nЩотижнева стабільність: §R-0.10%§!\nЩотижнева військова підтримка: §R-0.20%§!\nАтака дивізії: §R-10.0%§!\nЗахист дивізії: §R-10.0%§!\nЩотижневе £UKR_supply_texticon §nПостачання§! Споживання: §G-5.00§!"
 UCW_supply_soldiers_button_tt_delayed: "Ми надамо пріоритет нашим солдатам, які воюють на передовій, в отриманні необхідного зерна. Очевидно, що сильна армія приведе нас до перемоги в цій війні.\n\n[UCWHasPPorNot]\n\n§YПід час активних дій, це дасть нам наступні ефекти:§!\n\nОрганізація дивізії:: §G+10.0%§!\nЩомісячна чисельність населення: §R-10.00%§!\nЩотижнева стабільність: §R-0.20%§!\nЩотижнева військова підтримка: §G+0.20%§!\nАтака дивізії: §G+5.00%§!\nОборона дивізії: §G+10.00%§!"
 UCW_supply_people_button_tt_delayed: "Народ є основою держави, його задоволення та підтримка є найважливішою частиною перемоги у цій війні, в якій ми опинилися. Припаси повинні бути перенаправлені на харчування людей.\n\n[UCWHasPPorNot]\n\n§YПри активному стані це дасть нам наступні ефекти:§!\n\nОрганізація дивізій: §R-6.00%§!\nMonthly Population: §G+5.00%§!\nЩотижнева стабільність: §G+0.20%§!\nЩотижнева військова підтримка: §G+0.30%§!\nАтака дивізій: §R-10.00%§!\nОборона дивізій: §R-5.0%§!\nВипуск продукції з заводу: §G+10.00%§!"
 
