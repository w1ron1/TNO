 UKR_POL_relation.1100.t: "Гірський чорний хід"
 UKR_POL_relation.1100.desc: "Наша делегація повідомила, що кінцева мета поляків тепер остаточно стала зрозумілою.\n\nВони приймуть наші вимоги - в повному обсязі - але хочуть гарантії, що коли німці неминуче повернуться, їхні біженці зможуть втекти через Карпати на нашу територію.\n\nДелегація повідомляє, що нинішній польський план, у випадку цього вторгнення, полягає в тому, щоб максимально затримати і сповільнити просування німців, щоб уможливити втечу цивільного населення. Ми можемо допомогти з цим польотом, дозволивши Польським біженцям в'їхати на територію держави до того, як німці досягнуть кордону.\n\nПогляди уряду на цей обмін розділилися. Дозвіл Польським громадянам втекти до «безпеки» на наших землях, без сумніву, розлютить Райх, не кажучи вже про витрати на їхнє житло та харчування, але надання такої гарантії майже гарантує успіх нашої делегації на переговорах в цілому.\n\nРизикований крок, можливо, але такий, що слугує нашим потребам? Рішення має бути прийняте."
 UKR_POL_relation.1100.a: "Ми згодні прийняти Польських біженців."
 UKR_POL_relation.1100.b: "Розсердити німців занадто ризиковано. Так що ні."

 UKR_POL_relation.12.t: ""
 UKR_POL_relation.12.desc: ""
 UKR_POL_relation.12.a: ""
 UKR_POL_relation.12.b: ""

 UKR_POL_relation.1200.t: "Вирівняти їхню цінність"
 UKR_POL_relation.1200.desc: "Стає дедалі зрозуміліше, що поляки готові офіційно визнати наше загарбання Галичини - навіть якщо це не зовсім їхній вибір - якщо щось можна буде отримати в обмін. Це зрозуміло, оскільки вони, звичайно, повинні надати докази торгівлі, а не захоплення.\n\nВони також чітко дали зрозуміти, чого вони хочуть від цього обміну. Зброю. А саме, зброю, яка виходить за рамки саморобної стрілецької зброї. Військові гвинтівки різних типів, артилерійські установки, всіляке допоміжне обладнання та інші речі, яких вони або не мають, або не можуть легко отримати. Те, що є у нас.\n\nАле у нас цього немає в достатку, і багато хто в нашому уряді і в армії боїться думки про те, щоб передати їх у приречений стан, щоб їх більше ніколи не побачили. Проте багато хто стверджує, що кілька ешелонів з обладнанням - це невелика ціна за цілий регіон і економічні перспективи, які він містить.\n\nЩо ж робити?"
 UKR_POL_relation.1200.a: "Надішліть зброю. Галичина того варта."
 UKR_POL_relation.1200.b: "Ні. Нам потрібна ця зброя."

 UKR_POL_relation.13.t: ""
 UKR_POL_relation.13.desc: ""
 UKR_POL_relation.13.a: ""
 UKR_POL_relation.13.b: ""

 UKR_POL_relation.1300.t: "Переваги у вигляді прибутку"
 UKR_POL_relation.1300.desc: "Поляки чітко висловили свою позицію - якщо ми хочемо цю землю, нам доведеться за неї заплатити. Твердою валютою, так, але насамперед економічними інвестиціями та співпрацею - двома речами, яких дуже бракує сьогоднішній Польщі.\n\nПереваг такої угоди, звичайно, багато, включаючи не лише саму землю, але й обіцянку отримати найближчу з можливих довірену особу проти Райху. Це і, звичайно, ймовірність Польської згоди на будь-які пізніші вимоги, які ми, можливо, вирішимо висунути. Зрештою, це не буде схоже на те, що хтось інший буде інвестувати, і вони стануть залежними дуже, дуже швидко.\n\nВтім, німецька інтервенція - і перемога - в Польщі в невизначеному майбутньому є майже певною, і багато хто стверджує, що "інвестувати" в таку приречену державу є помилкою.\n\nВибір, однак, залишається за нами."
 UKR_POL_relation.1300.a: "Воно того варте. Зберіть кошти для відправки."
 UKR_POL_relation.1300.b: "Це марна трата грошей. Ні."

 UKR_POL_relation.14.t: "Так само швидко, як і наші руки..."
 UKR_POL_relation.14.desc: "Переговори з Польщею щодо бажаних земель провалилися. Ми не змогли дійти згоди, яка б задовольнила їхній уряд, і, схоже, шляху далі немає.\n\nЗа даними нашої делегації, зараз відбувається мінімальна кількість переговорів, ще менше заплановано на найближче майбутнє, і поляки, схоже, відкликали багатьох своїх посланців для нібито "внутрішніх військових дискусій."\n\nНаші посланці, звичайно, продовжуватимуть свої спроби, але вони не повідомляють про жодну впевненість в кінцевому успіху. Багато хто в уряді стверджує, що це має стати уроком для майбутніх переговорів, прикладом перегинання палиці.\n\nЯкщо, звичайно, майбутні переговори будуть."
 UKR_POL_relation.14.a: "Дуже сумно."

 UKR_POL_relation.15.t: "Угода, про яку чесно домовилися"
 UKR_POL_relation.15.desc: "Прийшли новини від делегації до Польщі: Успіх! Польща погодилася на обмін Галичини на дотеперішніх умовах і пунктах, і заявила, що передача адміністративного контролю може відбутися в найближчому майбутньому.\n\nЦе величезне досягнення для держави і нашого уряду, яке одним махом забезпечило нам величезні землі, населення і ресурси для використання замість Райху, який, без сумніву, дуже скоро повернеться на Польські землі.\n\nМи, звичайно, повинні будемо остерігатися їхніх дій і намірів в майбутньому, але поки що ми можемо святкувати - Галичина тепер може називатися Українською!"
 UKR_POL_relation.15.a: "Чудово!"

 UKR_POL_relation.16.t: "Вибір заспокоєння"
 UKR_POL_relation.16.desc: "Іван відкинувся на спинку стільця, втупившись у стіну свого кабінету. Було багато речей, які треба було обговорити, і він обдумував свої перші кроки. Кордон мав стати головною темою для обговорення, і кожен, здавалося, хотів вставити свої п'ять копійок у цю розмову. Перед ним лежало два варіанти, але нерішучість вбивала його зсередини. З одного боку, він міг би спробувати проштовхнути якісь зміни на кордоні. Від цього виграли б обидві сторони, а поділ за етнічною ознакою, ймовірно, виявився б успішним у довгостроковій перспективі. Аргументи, які він чув на користь цього, були цілком логічними, але чи буде це тривати після початку переговорів з Ґерманією?\n\nЗвичайно, завжди існував варіант залишити кордони без змін. Багато хто казав йому, що від такої зміни кордонів нічого не буде, і що в кінцевому підсумку обидві групи, ймовірно, повернуться додому. Йому це здавалося гарною ідеєю, особливо якщо він міг би залучити поляків на свій бік. Це, безумовно, було б легше, ніж наполягати на змінах, чи не так? До того ж, окрім кордону, можна було обговорити набагато вигідніші речі.\n\nВін подивився на годинник. Скільки часу він уже тут? Він відчував, як тягар бездіяльності давить на нього. На лобі виступив піт, і чим більше він намагався раціоналізувати будь-яку сторону, тим більше він неспокійно крутився у своєму розкішному кріслі. Йому потрібно було зробити вибір, і зробити його швидко."
 UKR_POL_relation.16.a: "Проштовхніть деякі реформи, для блага обох."
 UKR_POL_relation.16.b: "Нехай залишаються, в цьому точно немає нічого поганого."
 UKR_POL_relation.16.c: ""

