 UKR_the_herzogs_rage: "Лють Герцога"
 UKR_fuel_the_breadbasket: "Заправити хлібницю"
 UKR_mechanization_in_dnieper_ukraine: "Механізація наддніпрянщини України"
 UKR_finish_off_communal_farms: "Добити колгоспи"
