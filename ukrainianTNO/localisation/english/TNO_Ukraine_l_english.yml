 UKR_POL_relation.17.desc: ""
 UKR_POL_relation.17.a: ""
 UKR_POL_relation.17.b: ""

 UKR_POL_relation.18.t: "Муки картографа"
 UKR_POL_relation.18.desc: "У наших переговорах з поляками виникло ще одне спірне питання.\n\nНаші переговірники, за вказівкою уряду, запропонували полякам нинішні лінії кордону як майбутне їх встановлення, але вони відмовилися, натомість наполягаючи на дотриманні існуючих кордонів як зараз, так і в майбутньому. Хоча це питання може здатися тривіальним, для поляків воно не є таким, і думки в уряді розділилися.\n\nОдні наші урядовці вважають, що це необхідна поступка для того, щоб Польща залишилася за столом переговорів, а інші стверджують, що поступитися цим питанням було б занадто великою жертвою. Проте рішення має бути прийняте, і наші посланці чекають на рішення уряду.\n\nЩо ми їм скажемо?"
 UKR_POL_relation.18.a: "Ми згодні. Польща може зберегти свої кордони."
 UKR_POL_relation.18.b: "Ні! Ми не можемо це прийняти!"

 UKR_POL_relation.19.t: "Справедливі гори, навіки"
 UKR_POL_relation.19.desc: "Група з, як поляків, так і українців, вийшла на вулицю, щоб випити. Сказати, що це було необхідно, було б применшенням, і перша чарка була розпита в затишній тиші. На їхніх обличчях був вираз втомленого задоволення, але навіть після кількох виснажливих днів постійних роздумів вони все ще мали енергію для дебатів за столом у перервах між засіданнями. Палкі дебати про політику, яка майже не стосувалася жодної з країн, здавалося, не вщухали, і до кінця вечора багато хто з них ставали більшими друзями, аніж родичи.\n\nПереговори про кордон, можливо, не пішли за планом для жодної зі сторін, але в той же час, здавалося, вони відновили дух обох сторін. Не було ні ворожнечі, ні інтриг, ні безглуздих вимог, лише досить справедливий кордон. Не ідеально, але ніщо не заважало їм повернутися пізніше і з'ясувати стосунки. А поки що вони всі разом пили і насолоджувалися ніччю, що чекала на них попереду."
 UKR_POL_relation.19.a: "Вип'ємо за ще більше палкі дебати."

 UKR_POL_relation.20.t: "Особливе вдосконалення"
 UKR_POL_relation.20.desc: "Іван прийшов на цю зустріч, вже очікуючи на певний опір. Він сподівався на легкий прорив, як і всі люди, що потрапляють у подібні ситуації. Однак він не мав жодних реальних сподівань досягти цього. Він, мабуть, недооцінював себе, бо якимось чином завдяки своїй хитромудрій посмішці та сріблястому язику отримав найлегшу угоду в своєму житті. Він добре навчився розмовляти з німцями, але така угода траплялася йому лише раз у житті.\n\nПоляки були особливо задоволені своєю угодою, і він недовірливо обмінювався поглядами з іншими українцями. Єдиним «обговоренням» було те, що вони пояснювали полякам деталі. Вся поведінка Івана змінилася, і після того, як поляки люб'язно погодилися на угоду, він відкинувся на спинку крісла, наче сидів на хмарі. Він з упевненістю дивився на кімнату, але всі бачили легке занепокоєння за його очима. Якою буде наступна проблема? Наскільки важким буде подальший шлях? Іван не міг знати, але він міг просто сподіватися."
 UKR_POL_relation.20.a: "Якби ж то все було так просто."

 UKR_POL_relation.21.t: ""
 UKR_POL_relation.21.desc: ""
