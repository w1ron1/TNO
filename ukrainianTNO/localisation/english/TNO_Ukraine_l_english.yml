 UKR_power_struggle_info_tt: "По суті, ви повинні зробити так, щоб хлопець, якого ви хочете очолити, мав підтримку більшості груп, і це дійсно так."
 
 UKR_PS_IND_tt: "§FЛояльність £UKR_industrial_texticon §LПромисловців§! належить до [Get_UKR_PS_inf_IND].§!"
 UKR_PS_IND_tt_delayed: "§LВеличезна маса поміщиків, акціонерів і промислових баронів України відома під загальною назвою «промисловці».\n\nБенефіціари райхової системи рабства і різанини, вони, мабуть, єдині люди, які по-справжньому отримують вигоду від розвалу української держави - і вони бажають зберегти її будь-якими способами.§!\n\n§BЛяйббрандт§! має підтрику [?UKR_PS_Industrialist^1]%\n\n§oОлендорф§! має підтрику [?UKR_PS_Industrialist^0]%\n\n§gБройтіґам§! має підтрику [?UKR_PS_Industrialist^2]%"
 UKR_PS_BUR_tt: "§FЛояльність £UKR_bureaucracy_texticon §rБюрократів§! Належить до [Get_UKR_PS_inf_BUR].§!"
 UKR_PS_BUR_tt_delayed: "§LСтроката команда вигнанців з усього Райху, бюрократія Райхскомісаріяту здається, може погодитися лише з однією фразою: стабільність повинна бути відновлена.\n\nАле вони не пропонують жодного реального рішення, жодного напрямку. Якщо хтось хоче керувати Райхскомісаріятом, він повинен буде його забезпечити.§!\n\n§BЛяйббрандт§! має підтрику [?UKR_PS_Bureaucrat^1]%\n\n§oОлендорф§! має підтримку [?UKR_PS_Bureaucrat^0]%\n\n§gБройтіґам§! має підтримку [?UKR_PS_Bureaucrat^2]%"
 UKR_PS_COL_tt: "§FЛояльність £UKR_collab_texticon §QКолабораціоністів§! належить до [Get_UKR_PS_inf_COL].§!"
 UKR_PS_COL_tt_delayed: "§LПіднявшись після жахливого жорстокого поводження з Голодоморним планом, невелика група українців стоїть пліч-о-пліч зі своїми німецькими господарями.\n\nПочатково незначні, нещодавні реформи збільшили їхній вплив у Райхскомісаріяті. Подобається вам це чи ні, але колаборанти тепер мають право голосу в майбутньому України.§!\n\n§BЛяйббрандт§! має підтримку [?UKR_PS_Collaborator^1]%\n\n§oОлендорф§! має підтримку [?UKR_PS_Collaborator^0]%\n\n§gБройтіґамm§! має підтримку [?UKR_PS_Collaborator^2]%"
 UKR_PS_MIL_tt: "§FЛояльність £UKR_military_texticon §sПоліції§! належить до [Get_UKR_PS_inf_MIL].§!"
 UKR_PS_MIL_tt_delayed: "§LПоліція може бути не найгламурнішим крилом Райхскомісаріяту, але вона є найефективнішою - і найжорстокішою - у своїх методах.\n\nУ міру того, як Україна руйнується, поліція розглядає своє насильство як останній оплот проти варварства. Український народ - і навіть частина уряду - бачить у них тих, ким вони є: м'ясників.§!\n\n§BЛяйббрандт§! має підтримку [?UKR_PS_Militarist^1]%\n\n§oОлендорф§! має підтримку [?UKR_PS_Militarist^0]%\n\n§gБройтіґам§! має підтримку [?UKR_PS_Militarist^2]%"
 
