 UKR_UCW_RK.70.t: "Болгарія приймає запит на допомогу"
 UKR_UCW_RK.70.desc: "«Шановний представнику Бройтіґам,\n\nя був зворушений зусиллями вашого уряду зв'язатися зі мною, і після консультацій з моїми міністрами праці та закордонних справ я вирішив, що ми можемо надати невелику допомогу. Вважайте це жестом доброї волі між нашими великими народами, зміцненням союзу, який об'єднує Болгарію та Німеччину. Україна - прекрасна країна, яку я відвідав у відпустці в Теодоріхсгафені лише два роки тому. Її не може захопити божевілля екстремізму.\n\nВаш Борис ІІІ,\nцар Болгарії»\n\nГанс-Отто Бройтіґам тримав листа в руках. Він не був ідеальним - з одного боку, допомога полягала лише в невеликих партіях надлишкової зброї та продуктів харчування; з іншого боку, Борис ІІІ, схоже, не знав, що Теодоріхсгафен насправді знаходився не в Україні. Тим не менш, це, безумовно, було краще, ніж нічого. Бройтіґам здобув перемогу, а Україна могла протриматися ще кілька днів."
 UKR_UCW_RK.70.a: "З Софії з перемогою."

 UKR_UCW_RK.71.t: "Болгарія відхиляє запит на допомогу"
 UKR_UCW_RK.71.desc: "«Шановний представнику Бройтіґам,\n\nз великим незадоволенням повідомляю вам, що, незважаючи на наші явні симпатії, болгарський уряд не може допомогти вам у цей час. Я щиро і глибоко бажав би, щоб я міг запобігти революції у вашому середовищі - на жаль, подібна змова існує в межах моїх власних кордонів, і моя пильність та активи мого уряду повністю пов'язані з цією окремою антипартійною діяльністю. Щоб зберегти цілісність моєї нації, я повинен відмовитися. Тим не менш, бажаю Вам удачі, і нехай ми зустрінемося особисто за більш приємних обставин.\n\nВаш Борис ІІІ,\nцар Болгарії»\n\nГанс-Отто Бройтіґам тримав листа в руках. Здавалося, що Королівство Болгарія не надасть жодної допомоги. Не велика втрата - Болгарія завжди була найбільшим ризиком, навіть якщо відмова все ще трохи боляче вражала. Бройтіґам провів пальцем по нижній частині сторінки, і підпис розмазався. Принаймні, йому вистачило порядності поставити власний підпис."
 UKR_UCW_RK.71.a: "Покинуті з гідністю."

 UKR_UCW_RK.8.t: "Президенту Туреччини"
 UKR_UCW_RK.8.desc: "«Шановний [TUR.GetLeader]\n\nЯ пишу вам сьогодні не як представник Райху, а як людина, яка цінує стабільність у ці часто непевні часи. Наша країна потерпає від широкомасштабного хаосу, очевидного навіть для найсліпішого спостерігача. Ми відчайдушно потребуємо підтримки для придушення терористичних повстань. Саме тому я пишу цього листа, оскільки наш Рейхскомісаріат балансує на межі.\n\nМи потребуємо боєприпасів та озброєння, якщо хочемо заспокоїти цей регіон. Я розумію, що відносини між нашими країнами занепали, але наслідки нашого розпаду матимуть величезний вплив на природний порядок, що встановився. Анкара не буде захищена від небезпеки, що комуністи купуватимуть найсучаснішу німецьку зброю, щоб зруйнувати стабільність, за яку боровся Ататюрк.\n\nЯ розумію побоювання щодо допомоги нашому уряду. Я хочу його реформувати, але я не зможу цього зробити, якщо ми втратимо контроль. Якщо ми послабимо хватку, Україна може навіть потрапити до рук комуністів, які відчайдушно намагатимуться фінансувати будь-яких потенційних союзників, можливо, навіть непокірних вірмен і курдів на ваших землях.\n\nЯ з нетерпінням чекаю на вашу відповідь.\n\nЗ повагою,\nГанс-Отто Бройтіґам, представник Міністерства закордонних справ»"
 UKR_UCW_RK.8.a: "Бройтіґам зітхнув, запечатуючи конверт, не сподіваючись на будь-яку допомогу."

