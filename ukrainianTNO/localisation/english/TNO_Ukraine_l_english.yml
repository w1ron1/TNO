 UKR_POL_relation.23.t: "Недосконалість для цілей"
 UKR_POL_relation.23.desc: "«Пане Бондаренко, вам не здається, що ця карта трохи... перекошена? Ми переглядали плани, і у нас виникли деякі сумніви, якщо ви не проти?» Володимир на мить зітхнув, але спіймав себе на слові. Ніщо не вказувало на те, що поляки розуміли, що це було щось більше, ніж просте непорозуміння. Йому просто треба було витримати, чи не так? Він смикнув себе за комір сорочки і, не гаючи часу, почав жартувати: «Перекосило? Це просто ваші окуляри, я ж бачу, що в них справжні німецькі лінзи. Запевняю вас, з картою все гаразд. Вона складена за етнічними групами, які проживають у регіоні. Це абсолютно справедливий і законний спосіб формування кордону.»\n\nНа мить запала тиша, і холодний погляд його Польського опонента анітрохи не допомагав йому. Міцний натовп, звісно, не міг його втримати, але й Володимир тут був трохи виснажений. Перед ним було лише два реальних варіанти. Він міг або визнати, що карта була перекошена, і спробувати зберегти лице, виправивши її, або ж подвоїти зусилля і зайти ще далі. Здоровий глузд підказував йому, що треба просто визнати це, але навіщо дозволяти цим людям ось так просто розгулювати по ньому? Досі він дотримувався плану, тож не було сенсу відмовлятися від нього, чи не так?\n\nРішення визрівало в ньому протягом кількох секунд мовчання між ними. Він не міг більше сидіти в такому положенні. Він послабив нашийник, цього не можна було уникнути. Рішення було його, і тільки його."
 UKR_POL_relation.23.a: "Ми повинні твердо стояти на своєму і дотримуватися плану."
 UKR_POL_relation.23.b: "Спробуйте списати це на помилку і виправити карту. Немає нічого поганого в тому, щоб зберегти лице."

