 UKR_POL_relation.26.t: "Падіння з канату"
 UKR_POL_relation.26.desc: "Володимир сидів і мовчки дивився на інший бік столу, поки суперечка нарешті вщухла. Неможливо було заперечити червоні обличчя, краплі поту і жахливу тишу, яка, нарешті настала після такої катастрофічної суперечки. Він дивився, як поляки встали, і всі мовчки вийшли з кімнати.\n\n«Ну...», - сказав він, тремтячи.\n\nЙому бракувало слів, і його рука ковзнула по волоссю, що залишилося на його голові. Не можна було заперечувати, що дебати закінчилися. Він намагався переконати себе, що це була вина поляків, а не їхня. Він не хотів визнавати, як сильно він проштовхував цю пропозицію, і, звичайно, не хотів визнавати свою провину в усьому цьому. Ніхто навколо не звертав на це уваги, мало хто біг за поляками, а тепер намагався з ними примиритися. Це нагадало йому картину, коли він спостерігав, як фермер загрібав з землі попіл згорілого врожаю і гарячково складав його до купи. Але ще не все було втрачено. Дехто з поляків, здавалося, залишився, розмовляючи з делегатами, з якими вони дійшли згоди за час свого перебування тут.\n\nВін думав про майбутнє обох народів. Що буде через п'ять років? Напружений кордон, але все одно буде їхній зв'язок. Вони були змушені бути разом, і щоб вижити, обом доведеться співпрацювати. Він сподівався і молився про себе, що все повернеться на круги своя. Але не було сенсу молитися, якщо Володимир не брав у цьому участі. Він підвівся і обтрусив куртку."
 UKR_POL_relation.26.a: "Не було сенсу сидіти склавши руки, потрібно було багато чого зробити."

 UKR_POL_relation.27.t: "Дружній компроміс"
 UKR_POL_relation.27.desc: "Сигарета Володимира була розчавлена в попільничці, і з важким зітханням кімнату наповнив клубок диму. Він одразу ж дістав ще одну сигарету і подивився на своїх колег-делегатів. Володимир на мить замовк, перш ніж вирівнятися. Це було дивне видовище, але, мабуть, очікуване. Нічого не вдієш, звісно. Вони були там для того, щоб налагодити справи з Польщею якомога дружніше, і сам Володимир був задоволений тим, що вийшло. Це не було чудово, звичайно, але це було точно справедливіше, ніж вони могли б отримати. Польща отримала землю, яку хотіла, а Україна отримала можливість налагодити з нею стосунки на хороших умовах. Що було втрачати насправді? Звісно, згодом він отримав би добрячу прочуханку про те, як вони дозволили полякам розгулювати по собі, але він був до цього готовий. Тепер він міг трохи спокійніше відпочити, знаючи, що це питання поки що вирішене.\n\nВін встав і вийшов на коротку перерву, і свіже повітря було якраз тим, що йому потрібно. Попереду було ще багато справ, і навіть якщо з цим єдиним питанням було покінчено, йому ще треба було попрацювати. Не можна було гаяти часу, і, повернувшись за стіл, він відчув, що вони вже почали сперечатися."
 UKR_POL_relation.27.a: "Але могло бути й гірше."

