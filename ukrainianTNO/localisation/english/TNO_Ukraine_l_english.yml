 UKR_POL_relation.7.t: "Ті кого краще не чіпати"
 UKR_POL_relation.7.desc: "«Польська делегація відповіла,» - сказав Стус, стоячи перед українською делегацією, і піт стікав по його обличчю. «Вони відмовилися від будь-якого перестрахування території і зажадали, щоб ми зберегли статус-кво». Коли Стус вигукнув свої останні слова, в кімнаті запанував хаос.\n\nКультуралісти були розлючені, обличчя їхніх представників були червоні, як кров, коли вони проклинали поляків. Кілька найзавзятіших їхніх членів закликали до негайного ультиматуму, і фракція почала згуртовуватися навколо заклику «Галичина або війна». Така риторика одразу ж викликала реакцію об'єднаної боротьби та співавторів, які оголосили культурників паліями війни, що від самого початку саботували переговори. У власному кутку столу Бондаренко і Лещенко вели власну битву між собою: «Володимир мав цілковиту рацію, що поляки - щури, Бондаренко! Ми заявили про свій намір забрати сир, а вони тепер шиплять, як ті коти, що на нас полюють! Я теж хочу повернути Галичину, але це вже занадто!» шаленів Лещенко. Літній державний діяч глибоко вдихнув, перш ніж відповісти: «Миші і щури - розумні істоти, Іване, а з огляду на Польську реакцію, вони більше схожі на нявкаючих комах. Вони чітко дали зрозуміти, що не хочуть вести переговори, тож нам доведеться змиритися з поразкою і взяти те, що ми хочемо, силою, як би це не було прикро,» - міркував Бондаренко.\n\nСавчук підслуховував розмову друзів і міркував про себе. Сила України була першорядною, і його думка, схоже, була ключовою в тому, як відреагує делегація. Сила України полягає в мирі чи солідарності? Він повинен був швидко прийняти рішення."
 UKR_POL_relation.7.a: "Наша сила - в мирі та співпраці"
 UKR_POL_relation.7.b: "Німецькі ланцюги чи польські кайдани - ми розірвемо їх усі!"

 UKR_POL_relation.8.t: "Очікувана контрпропозиція"
 UKR_POL_relation.8.desc: "«Польська делегація відповіла,» - сказав Василь Стус, стоячи перед українською делегацією з роздратованою гримасою. «Вони відмовилися від повного повернення Галичини, але вони готові взяти участь у вигідному для нас обміні землями.» Коли Стус закінчив оголошувати зустрічну пропозицію, кімната наповнилася какофонією бурчання.\n\n«Більшість культуралістів скаржилися, що вони не можуть залишити жодного українця, і що вони повинні відхилити зустрічну пропозицію і дотримуватися первинних вимог. Помірковані культуралісти, а також Об'єднана боротьба і Співавтори заявили про свою підтримку пропозиції, закликаючи своїх колег прийняти ідеальний компроміс. Савчук і Бондаренко запалили цигарки, обговорюючи розвиток подій.\n\n«Що ж, не можу сказати, що ти помилився, Володимире, поляки дійсно виявилися щурами,» - сказав Савчук з посмішкою.\n\n«Життя в армії дало мені цінний урок. Люди стають досить розсудливими, коли на них наставляють пістолет,» - пояснив Бондаренко, - «а якщо вони все ще вперті, ти наставляєш інший пістолет на їхнього друга. Зрештою, ви отримуєте тисячу хлопців, які наставляють зброю один на одного, і всім це так набридло, що вони йдуть разом пити горілку.» «Обидва посланці сміялися разом, розповідаючи анекдоти в перервах між затягуваннями цигарками.»\n\nЛещенко сидів за круглим столом на самоті, обдумуючи свої варіанти. Незважаючи на спільну справу трьох фракцій, майбутнє голосування про те, як реагувати, все ще було на лезі бритви. За логікою речей, він мав би проголосувати за компроміс, але його думки постійно поверталися до українців, які все ще залишалися під польським чоботом. Чи міг він пробачити собі те, що залишив їх вне своєї вітчизни? Чи це була жертва, необхідна для більшого блага?"
 UKR_POL_relation.8.a: "Жоден українець не залишиться вне своєї вітчизни!"
 UKR_POL_relation.8.b: "Українсько-польський мир є більш важливим"

