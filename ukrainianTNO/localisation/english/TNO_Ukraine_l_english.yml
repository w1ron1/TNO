 UKR_POL_relation.5.t: "Як і було заплановано"
 UKR_POL_relation.5.desc: "«Поляки погодилися на повне перестрахування Галичини. Панове, скористайтеся моментом, щоб відсвяткувати це велике досягнення для нашої нації,» - оголосив Стус перед тим, як вийти з кімнати. Поки його колеги-делегати розмовляли і розливали напої, Савчук сидів, нахилившись, підперши голову однією рукою, а іншою тримаючи сигарету. Лещенко сидів поруч з ним, закривши обличчя руками.\n\n«Це не може бути реальністю,» - неспокійно дихав Лещенко, - як ми переконали поляків погодитися на це?» Він прибрав руки з обличчя, відкриваючи свою яскраву посмішку і широкі ямочки. Савчук помітив, що в очах Лещенка блищать сльози, але він не міг сказати, чи це від полегшення, чи від радості:\n\n«Я радий, що тобі вже краще, Іване. Чому б нам не відсвяткувати це?» сказав Савчук, перш ніж обійняти молодого чоловіка, перш ніж вони обидва піднялися зі своїх місць.\n\n«Гей, Володимире, ти знаєш, що ти поводишся як мій батько? Він завжди знаходив, що відсвяткувати, щоб відволікти мене від проблем. Я впевнений, що ви з ним були б друзями.»\n\n«Я впевнений, що були б.»\n\n«Я впевнений, що були б. Два батьки, які турбуються про своїх проблемних дітей,» - відповів Савчук з легкою, сумною посмішкою. Двох чоловіків привітав Бондаренко, який сміявся зі своїми колегами-культуралістами за столом: «Що я казав, Володимире? Миша віддала нам сир, бо знала, що не зможе нас перемогти. А ти ще переживав, що поляки - це щури з хворими кігтями, які готові нас розірвати на шматки! Тобі цей напій потрібен більше, ніж мені, друже,» - похвалився Бондаренко перед тим, як передати свій напій Савчуку. Той зробив ковток, дозволивши напою змити стрес, навіть якщо це було лише на мить."
 UKR_POL_relation.5.a: "Батьківщина знову об'єдналася!"

