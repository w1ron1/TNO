 UKR_POL_relation.38.t: "Переваги страху перед сценою"
 UKR_POL_relation.38.desc: "Іван Лещенко стояв біля вбиральні після успішних переговорів щодо Галичини. Він потягнувся за черговою сигаретою з-під пальта, але розчаровано зітхнув, коли його рука намацала лише порожню коробку. Він відчув, як чиясь рука легенько взяла його за руку, і озирнувся, щоб побачити Польського делегата, який пропонував йому сигару.\n\n«Це, мабуть, занадто міцна на ваш смак, але це краще, ніж нічого, так?», - дразнив поляк. Його сірий голос дивно заспокоїв молодого посланця.\n\n«Я курив сигари раніше, старий. Просто знайшов те, що мені більше подобається, - посміхнувся Лещенко, беручи сигару.\n\n«Можливо, ви не такий м'який, як здаєтеся. Я думав, що мої колеги-дипломати - леви, а вони стали покірними домашніми кішками перед обличчям найменших негараздів.»\n\n«Здається, я розумію, що ви маєте на увазі. Ваші вимоги були справедливими, але мої колеги не бачили цінності в чомусь настільки мінімальному.»\n\n«А моїм бракувало хребта, щоб дотримуватися своїх переконань.»\n\nДвоє дипломатів мовчки курили свої сигари. Хоча переговори зрештою виявилися марною тратою часу, подумав Лещенко, він принаймні знайшов нового друга, який розділив його розчарування. поляка і українця об'єднало спільне незадоволення."
 UKR_POL_relation.38.a: "Комфорт у бездіяльності, задоволення в боягузтві."

 UKR_POL_relation.39.t: "Найважчий провал"
 UKR_POL_relation.39.desc: "«Повторіть мені, будь ласка, те, що ви мені сказали, Василю, але повільніше, щоб я повністю зрозумів, що ви намагаєтеся мені сказати,» - роздратовано сказав Горліс, тримаючись за лоб. На його насупленому карому обличчі з'явилися глибокі зморшки, коли він намагався приховати своє хвилювання.\n\n«Ми дали полякам право висувати вимоги, і ми вважали їх нерозумними, тому намагалися домовитися до статусу-кво,» - відповів Стус, відводячи погляд від погляду революціонера, який, здавалося, зазирав йому в душу.\n\n«А що після цього?»\n\n«Поляки відмовилися.»\n\n«Можу я дещо запитати, Василю? Якщо весь план тримався на тому, щоб поляки висунули вимоги, і вони були б задоволені результатом, чому ви так довго вели переговори, щоб нічого їм не дати?»\n\n«Я...»\n\n«Не відповідайте на це питання. Відповідь має бути очевидною,» - сказав Горліс, - «я розчарований, Василю, хоча й визнаю, що делегація, швидше за все, змусила вас до цього. Вийдіть на вулицю. Візьміть решту дня на роздуми. Я пообіцяв доньці, що допоможу їй знайти подарунок на день народження її матері, тож не хочу, щоб мій настрій зіпсували ще якісь погані новини, які ви мені ще маєте повідомити». Горліс встав з стільця і схопив пальто з вішалки, перш ніж поспішно вийти. Стус сидів і дивився на документи, які він поклав на стіл Горліса, намагаючись зрозуміти, як він це допустив."
 UKR_POL_relation.39.a: "Сміливий крок не виправдав себе."

 UKR_POL_relation.40.t: "Прийнятний обмін"
 UKR_POL_relation.40.desc: "«Поляки виклали нам свої вимоги,» - сказав Стус з широкою посмішкою. «Вони попросили невелику кількість землі та низку невеликих обмінів». Делегація загула від згоди, в той час як деякі дипломати промовчали. «Ми проголосуємо це питання за годину, щоб випрацювати конкретні пропозиції». Бондаренко, Савчук і Лещенко стояли біля столу з хлібом і обговорювали розвиток подій.\n\n«Схоже, що рани минулого загоїлися, друзі поляки розуміють, наскільки цінним є партнерство з нами», - вигукнув Савчук.\n\n«Я радий, що вони поділяють наші настрої, Володимире. Я б збрехав, якби сказав, що не боюся, що поляки нас використають,» - додав Лещенко.\n\n«Я б поки що не святкував,» - заперечив Бондаренко, хапаючи зі столу хліб. «Є й такі, що мають сумніви.» Двоє інших дипломатів підняли брови, здивовані запереченням Бондаренка. «Вимоги настільки мінімальні, що деякі з моїх колег вважають, що в цьому немає сенсу. Мовляв, це марна трата ресурсів, оскільки ми залишимося в тій самій ситуації з іншим кордоном. По суті, нічого не зміниться, окрім нової дірки в нашому бюджеті». Савчук і Лещенко мовчали, поки Бондаренко відкушував свій шматок хліба.\n\n«Крім того, Володимире, ми дали полякам право висувати вимоги. Якщо ми будемо вимагати статус-кво, то будемо виглядати дурнями,» - заперечив Савчук, але в його голові закрався сумнів. Чи справді щось зміниться, окрім посмішок кількох дипломатів?"
 UKR_POL_relation.40.a: "Ми виконаємо нашу угоду з поляками."
 UKR_POL_relation.40.b: "Статус-кво заощадить обом націям ресурси."

 UKR_POL_relation.41.t: "Економічна тема"
 UKR_POL_relation.41.desc: "Володимир сидів у кінці столу, дивлячись між двома делегатами по різні боки кімнати. На обличчі як Горліса так і Ніла з'явився розуміючий вираз, наче у двох батьків, які урочисто дивляться один на одного, коли їхні діти сваряться. Здавалося, що ще не дійшло до кипіння, але напруга виразно відчувалася по всій кімнаті. За ті кілька годин, що вони провели тут, мало про що вдалося домовитися, окрім того, що обидві сторони мають отримати вигоду. Він нутром відчував, що це переросте в крик, але коли кімната, здавалося, наблизилася до кульмінації, один чоловік встав. Він підвищив голос, привернув до себе увагу, і в кімнаті запанувала тиша.\n\nГорліс і Ніл здивовано переглянулися, і він не був впевнений, до якої сторони належав сам. Але це не мало значення, оскільки його пропозиція про торгівлю була найбільш продуманою з того, що було запропоновано того ранку. Здавалося, настрій у кімнаті змінився, коли всі інші почали мовчки кивати і погоджуватися один з одним. Звісно, де-не-де лунали заперечення, але не було нічого такого, що не можна було б залагодити. Справи починали налагоджуватися, і Володимир побачив, як двоє старих делегатів посміхаються один одному. Ще один день, і вони б мали надійний економічний план між собою."
 UKR_POL_relation.41.a: "Слава Богу, що це не вийшло з-під контролю."

