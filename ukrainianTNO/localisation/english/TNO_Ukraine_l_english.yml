 UKR_POL_relation.35.t: "Труп дипломатії"
 UKR_POL_relation.35.desc: "«Панове, я з жалем повідомляю вам, що поляки відмовилися знизити свої вимоги. Вони не будуть вести переговори на інших умовах і чекають на нашу відповідь,» - швидко сказав Стус, закінчуючи свою коротку промову, перш ніж вискочити із залу, коли почалося справжнє пекло. Делегати від кожної фракції вчепилися один одному в горлянку, і Бондаренко, Савчук та Лещенко не були винятком.\n\n«Подивися, що ти і твої друзі наробили, Володимире! Ви віддали всю переговорну владу полякам, і ця влада пішла в їхні дефектні мізки, а значить, ці переговори не мали сенсу навіть намагатися вести!» Бондаренко кричав:\n\n«Ви справді думаєте, що я цього хотів? Все, чого я хотів, - це щоб був мир, тому що нікому з нас не вигідно стріляти один в одного. Очевидно, ви не розумієте концепції, оскільки десятиліття війни зробили ваш мозок настільки залежним від насильства, що ви хотіли зробити саме те, що зараз роблять поляки!» Савчук заревів у відповідь.\n\n «Чи не могли б ви двоє перестати кричати один на одного і вислухати? Який сенс злитися один на одного?» Лещенко намагався напоумити, але безрезультатно. Всі дипломати накинулися один на одного, і якби в кімнаті був хтось із польських делегатів, їх би розірвав на шматки натовп розлючених українців. Уся кімната проклинала польських дияволів, а Лещенко залишився на самоті оплакувати те, що могло б статися, але не сталось."
 UKR_POL_relation.35.a: "Дружба з зрадниками - марна справа."

