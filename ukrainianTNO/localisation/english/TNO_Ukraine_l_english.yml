 ## 9.1.1 - Таб розвитку

 UKR_BB_development_bar_label: "§BПрогрес розвитку§!"
 UKR_BB_development_bar_tt: "§BПрогрес розвитку§!"
 UKR_BB_development_bar_tt_delayed: "§BПрогрес розвитку§! показує, наскільки економічно розвинений регіон, починаючи з його §Yсільського господарства§! та її §sпромисловістю§! і закінчуючи §Gінфраструктурою§!, що в сукупності впливає на те, наскільки близько регіон знаходиться до досягнення свого наступного рівня £UKR_development §Dрівня розвитку§!."

 UKR_BB_development_level_label: "§DПрогрес розвитку§!"
 UKR_BB_development_level_tt: "£UKR_development §DПрогрес розвитку§!"
 UKR_BB_development_level_tt_delayed: "£UKR_development §DРівень розвитку§! використовується для вимірювання рівня розвитку регіону в цілому за шкалою §Y1-10§!. Зростання цього значення буде зафіксовано, коли §BРівень Розвитку§! регіону досягне §Y100§!.\n\n§YНа національному рівні §L(оцінено у середньому)§! На регіональному рівні це впливає на:§!\n- Зростання ВВП §G(+)§!\n\n§YНа регіональному рівні це впливає:§!\n- Зростання ВВП §G(+)§!\n- Максимум будівельних слотів §G(+)§!"

 UKR_BB_exploitation_bar_label: "§OЕксплуатація регіону§!"
 UKR_BB_exploitation_bar_tt: "§OЕксплуатація регіону§!"
 UKR_BB_exploitation_bar_tt_delayed: "§OЕксплуатація§! в регіоні вказує на те, яка частина ресурсів та потенціалу держави була ретельно §Rрозкопані§! та §Rвикористані§! державою, на превеликий жах людей.\n\n§YНа національному рівні §L(оцінено в середньому)§! це впливає на:§!\n- Ефективність використання ресурсів §G(+)§!\n- Зростання ВВП §G(+)§!\n- Щомісячне зростання населення §R(-)§!\n\n§YНа регіональному рівні це впливає на:§!\n- Місцеві ресурси §G(+)§!\n- Приріст населення регіону §R(-)§!"

