 ## ГІК ГІРКИХ ЖНИВ ##
 UKR_ucw_supply_GUI_info_tt: "§FКоли партизани вперше повстали на сході та заході, їхньою першою дією було §xпідпалити всі поля, які їм траплялися§! в надії порушити постачання продовольства  §oнімцям§!. І їм це вдалося, але вони ненавмисно принесли те ж саме собі.\n\nРайхскомісаріят і різні партизани, всі фракції в конфлікті зіткнулися з труднощами в поширенні вкрай необхідного £UKR_supply_texticon §nзерна§! до тих, хто його потребує, через численні перебої в лініях постачання. Оскільки більшість полів, які годували українську націю, зникли, запаси продовольства вичерпуються з усіх боків. Ми більше не боремося за панування над Україною, ми боремося за наше виживання від катастрофи, що насувається.\n\nКількість £UKR_supply_texticon §nзерна§! що у нас залишилася, показана на панелі дисплея всередині інтерфейсу. Чим §Rменше§! зерна у нас є, тим §Vбільше§! негативних бонусів отримує наша країна. Кількість £UKR_supply_texticon §nзерна§!, яке ми зберігаємо в нашій країні, дуже обмежена, і якщо її не контролювати, це може призвести до §Rкатастрофи§! тому нам необхідно §Yретельно керувати нашими витратами на постачання§! за допомогою кнопок на інтерфейсі, вибирати з розумом, щоб не вичерпати наші запаси.§!"
 UKR_ucw_progressbar_tt: "§FМи маємо £UKR_supply_texticon  §Y[?UCW_remaining_supply] §!§nзалишилося бушелів зерна.§!\n§RЩотижневе £UKR_supply_texticon  споживання:§! §Y[?UCW_supply_consumption]§!\n--------------\nбазове значення: [?UCW_supply_consumption_base|Y0]\nз модифікаторів: [?modifier@weekly_supply_consumption|Y0-=]§!"
 
