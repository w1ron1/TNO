 UKR_UCW_RK.11.t: "Єдина розсудлива людина"
 UKR_UCW_RK.11.desc: "Іноді Олендорф задавався питанням, чи він був єдиною розсудливою людиною в кімнаті.\n\nЗважаючи на те, як решта членів Ради Безпеки серйозно розглядали пропозицію командувача Олександра Конраді, це, безумовно, було схоже на те, що так і було. «У нас є значна кількість людей в Люфтваффе, які, практично кажучи, нікому не потрібні, - говорив Конраді - їх достатньо, щоб сформувати кілька дивізій, які ми можемо використати для стабілізації нашого фронту на сході.»\n\nЛяйббрандт, з якоїсь незрозумілої причини, серйозно обмірковував це, задумливо киваючи головою. «Зміцнення лінії фронту має важливе значення для відновлення контролю. Бо дивізії, схоже, відчувають... проблеми.»\n\n«Саме так, райхскомісар», - сказав Конраді - і Олендорф не забув відзначити, що цей чоловік навмисно уникав щоб його називали «виконуючим обов'язки». Що потрібно солдатам...»\n\n«Що потрібно солдатам, так це краща підготовка, спорядження і керівництво», - перебив Олендорф, його голос навіть тоді, коли розчарування майже закипало, був спокійним. «Проблема з дивізіями полягає не в людських ресурсах, командире, і я сподіваюсь, що ви це знаєте. Моральний дух відсутній, служба розглядається як покарання. Ніщо з того, що ви пропонуєте, не вирішує проблеми дій, з якими ми стикаємося!» Конраді застиг, дивлячись на Олендорфа. «Я добре знаю стан нашої армії, Олендорфе. І я знаю, що треба робити. Схід не можна втратити, і це дозволяє нам утримувати його.»\n\n«Хоча ваші занепокоєння прийняті до відома, Олендорфе, я згоден з командувачем, - нарешті сказав Ляйббрандт. «Нам потрібні дивізії і люди на місцях. Будь-які інші питання можна буде вирішити, коли буде відновлено порядок. Командире, реалізуйте цю ініціативу». Олендорф тихо задимівся, коли командувач кивнув, очевидно, задоволений рішенням."
 UKR_UCW_RK.11.a: "«Так, райхскомісар Ляйббрандт, це буде зроблено.»"

 UKR_UCW_RK.12.t: "Перевага"
 UKR_UCW_RK.12.desc: "Ляйббрандт втупився в повідомлення, яке збирався відправити, переглядаючи формулювання. Точність здавалася тут важливою. Активно заявляти про свою перевагу в питаннях правозастосування було законно і справедливо, але все ж таки це був такий запальний крок, що змусив Ляйббрандта зробити паузу. Зрештою, депутат любив писати, переконувати. Він не був прихильником сильної руки, але це треба було зробити. Нація була складною річчю, але партія була простішою, зібранням людей, які мали такі ж слабкості, як і все людство. Навіть найсильніший арієць все одно відчував тяжіння групи, яка рухала його до тих позицій, які здавалися найбільш захищеними. Навіть Розенберґ, в моменти ослаблення, починав вагатися і дозволяв переконувати себе під впливом інших - можливо, саме це дозволило СС і багатьом іншим змовникам знищити його.\n\nЛяйббрандт намагався віднайти єдність, але розмови виявилися неефективними. Бройтіґам і Олендорф не були зацікавлені у виконанні наказів - зрештою, вони були заангажовані власними інтересами. Не варто було шукати спільної мови з групою, яка навіть не підтримала власного райхскомісара, коли сама Україна розвалювалася. Спільна позиція була фікцією, яка знищила Розенберґа разом з багатьма іншими блискучими умами, що залишилися «радикалами». Щоб врятувати націю, щоб врятувати мислення, правильним кроком буде грати сміливо."
 UKR_UCW_RK.12.a: "Не треба стримуватись."

 UKR_UCW_RK.13.t: "Перевага"
 UKR_UCW_RK.13.desc: "Олендорф втупився в повідомлення, яке збирався відправити. Він відчував себе напрочуд мало, навіть коли наближався до відкритого формування фракції. Ні провини, ні відчуття зради. Все, що він міг подумати про себе, було «нарешті». Не те, щоб Олендорф був цинічною людиною - навпаки, зовсім навпаки. Він знав, що має рацію. Він переконався в цьому в економічному відділі, не на власних перемогах, а на поразках інших, і навіть на власних. Жорстокий, контрольований Олендорф вигравав політичні битви, покращував економіку і вогнем і кулею впроваджував нацистську ідеологію. Скомпрометований, вихолощений Олендорф спостерігав за тим, як палала Україна. Його обов'язок був перед нацією і партією, але його довіра могла поширюватися лише на тих, хто підтримував справжній націонал-соціялізм, а не на таких псів, як Ляйббрандт і Бройтіґам, які прагнули його зруйнувати.\n\nОлендорф був присутній на стількох зустрічах, вислухав стільки пропозицій щодо «єдності», щодо «відповіді». Спочатку ідея заслуговувала на увагу. Пізніше, принаймні, варто було влаштувати шоу для ширшого загалу. Тепер же навіть найвідданіші прихильники партійної лінії не відчували жодної лояльності до ширшої системи. Райхскомісаріят НСДАП перебував у повному безладі, і Олендорф ніколи не прикидався, що це не так."
 UKR_UCW_RK.13.a: "Не треба стримуватись."

 UKR_UCW_RK.14.t: "Перевага"
 UKR_UCW_RK.14.desc: "Бройтіґам втупився в повідомлення, яке він збирався надіслати своїм союзникам. Чи міг він погодитися на роль активного обструкціоніста, на зловживання своєю ролью? Коли почалася громадянська війна, здавалося ймовірним, що ті, хто виступав проти нього, перейдуть на його бік, усвідомивши шкоду від правління Коха. Він був готовий продемонструвати єдність. Натомість, здавалося, що він буде використовувати всі можливі зв'язки і намагатися побудувати власну владу.\n\nБройтіґам ненавидів бути цинічним. Його робота полягала в реформах, у порятунку країни, зруйнованої попередніми адміністраціями - ідеалістичне прагнення визначало сам його уряд. Проте з часом стало зрозуміло, що Ляйббрандт і Олендорф мали достатньо сильні зв'язки, щоб перешкодити будь-яким реальним змінам. Вони могли, і стримували систему, дозволяючи лише власній думці вважатися «правильною».\n\nТепер, після того, як остання спроба «побудови єдності» закінчилася руйнуванням, не було жодних підстав вдавати, що можливе легке вирішення проблеми. Єдиним рішенням було знайти власний вихід."
 UKR_UCW_RK.14.a: "Не треба стримуватись."

 UKR_UCW_RK.15.t: "Показ єдності"
 UKR_UCW_RK.15.desc: "Альберт Брукс стояв у першому ряду зі спартанською дисципліною. Єдиною емоцією, яка могла б видати його стоїцизм, була гордість за своїх людей, що стояли за його спиною настільки злагоджено. Він помітив, як оператор підняв великий палець догори Олендорфу - вони відзняли достатньо кадрів армії - настав час для проголошення.\n\nОлендорф, Бройтіґам і Ляйббрандт вийшли на сцену, перші двоє вишикувалися по обидва боки подіуму з власними мікрофонами, перш ніж Ляйббрандт піднявся на трибуну, щоб виступити. Брукс був збентежений, він думав, що прокламацію виголошуватиме Олендорф, що, ймовірно, було результатом якоїсь політичної інтриги, яка не належить до його компетенції. «Останніми днями ми стали свідками нових вершин терору, який на нас накинули нещасні». Тон Ляйббрандта був добре відрепетируваний, і було зроблено свідоме зусилля, щоб звучати як авторитетний лідер, а не як квіксотичний професор. «Мир, який наші славні збройні сили принесли на цю землю, хитається через цей спалах нестабільності, і тому страждають наші народи...»\n\n«Німці страждають, але й українці теж...» Коментар Бройтіґама приголомшив і Ляйббрандта, і Олендорфа. З натовпу між солдатами пролунало кілька шепотів. «Цей хаос шкодить усім, чим швидше з ним буде покінчено, тим краще.»\n\n«Так... дякую за це зауваження, Герр Бройтіґам.» Слова ледве вирвалися з його вуст, як Бройтіґам ввічливо посміхнувся. «Ми закликаємо вас, захисників природного порядку, зберегти цей священний мир...»\n\n«Щоб назавжди позбутися всепроникної загрози іудео-більшовизму!» Олендорф скористався моментом під захоплені аплодисменти чоловіків і призупинені оплески двох своїх супротивників. Промова продовжувалася в цьому фарсі, фарсі що ходив туди-сюди. Але вона все ж таки змогла підняти бойовий дух солдатів..."
 UKR_UCW_RK.15.a: "...а також породила нові розбіжності всередині тріумвірату."

 UKR_UCW_RK.16.t: "Послання від офісу чотирирічного плану"
 UKR_UCW_RK.16.desc: "Суперечка розгорталася як сумовитий шквал листів і думок, різноманітних коментарів та офіційних зустрічей. Деякі аграрні адвокати вимагали більше їжі для своїх робітників. Кар'єристи вимагали додаткових обрізків для своїх різноманітних інтересів. Реформатори, як завжди, озвучували потік нескінченних скарг у різноманітні глухі вуха. Після десятка суперечок план був узгоджений і тихенько розісланий тим адміністраторам, що залишилися на українській землі.\n\nНімець отримуватиме 2100 кілокалорій на день, приблизно стільки, скільки лікарі радили для арійської дієти. Зрештою, вони були потрібні як основа німецького панування. Якби вони загинули, то півдюжини переселенських кампаній, що становили саму суть Чотирирічного плану, не були б ні до чого. Було цілком логічно, що найбільш життєво важливі громадяни України - німці - отримають її найбільшу щедрість.\n\nУкраїнці будуть розділені на два табори. Ті, хто потребував енергії для участі у військових діях, могли дозволити собі 1500 кілокалорій - недостатньо для комфортного життя, але достатньо для того, щоб залишатися активними протягом тривалого часу, який очікувався від війни. Ті, хто не мав на меті приєднатися до німецької справи, отримували лише 1000 кілокалорій. Це призведе до їхнього виснаження, що зробить їх нездатними працювати в підривних цілях.\n\nВійськовополонені отримуватимуть лише 500 кілокалорій. Їхній добробут, як ворогів держави, суперечив би цілям Райху.\n\nКонтрабанда та накопичення продуктів харчування були б суворо заборонені, а для українців каралися б ув'язненням або смертю."
 UKR_UCW_RK.16.a: "Голод за рішенням офісу."

 UKR_UCW_RK.17.t: "Заповнений"
 UKR_UCW_RK.17.desc: "Шлунок Гайнца ревів і корчився в агонії, коли він дивився на безбарвну кашу, яка називалася вечерею. Короткий погляд навколо столу показав йому, що його люди думають про те ж саме. В ці дні кожен шлунок бурчав, і цього лайна, звичайно, було недостатньо, щоб вгамувати біль.\n\nГайнц підніс ложку супу до губ і ковтнув її, здригаючись, коли вона ковзала по горлу. Його люди зробили те ж саме - це було жалюгідно, але це була їхня єдина їжа на довгий час. Навіть примушуючи українців голодувати, не можна було створити достатньо їжі, щоб вистачило на всіх.\n\nЯкоїсь миті миска перед ним спорожніла. Ложка мляво звисала з руки. Свічка на столі заворожувала, танцювала і тріпотіла, наче якась екзотична комаха. Гайнц втупився в неї, спостерігаючи за рухом, занурюючись у нього, коли світ навколо нього розчинився в... «Ліжко!» - «Ліжко!» вигукнув Гайнц, похитуючись на ногах. Господи. Як довго він просто сидів там? Як довго вони там сиділи? Тепер усі його люди дивилися на нього. Чорт.\n\n«Йдіть спати», - продовжував він, спираючись однією рукою на стіл. «Ви вільні. Ворушіться!»\n\nПерший урок у боротьбі з голодом. Сон - це стан зниженої метаболічної активності. Травлення сповільнюється, і шлунок не посилає постійно сигнали в мозок, щоб знайти щось поїсти. Звичайно, завтра вранці вони знову будуть голодні. Але будь-яке полегшення від страждань було вже чимось."
 UKR_UCW_RK.17.a: "Тіні на стінах стрибали і танцювали від радості."
 
 UKR_UCW_RK.18.t: "Цикли повторюються, завжди"
 UKR_UCW_RK.18.desc: "Сидячи у своєму кієвському офісі, Ганс-Отто Бройтіґам уже вшосте писав одну й ту саму записку. Він знав, що вона має бути правильною, інакше його ніхто не слухатиме.\n\nЗ самого початку він знав, що так звана «політика голоду» була величезним прорахунком. Так, бандитизм був серйозною проблемою протягом десятиліть, але більшість українців залишалися пасивними, і хоч і повільно, але реформи та розвиток зростали з кожним роком. Але роки ретельної роботи були зведені нанівець лише за кілька тижнів.\n\nГолод був універсальним. Голодна людина зробить все, щоб поїсти, і не забуде, що стало причиною цього голоду. Так було і зараз. Бандитське населення тільки зростало, а політика не робила, не робить і не могла зробити нічого, окрім як погіршити ситуацію. Він повинен був дати їм це зрозуміти.\n\nПрацюючи протягом дня, його перервав Ляйббрандт, який сам від'їжджав з функціональної наради, присвяченої політиці. Прочитавши доповідну записку, він коротко кивнув йому і сказав, що багато років тому рідний дядько Бройтіґама надіслав йому таку саму записку. Тоді його не послухали, сказав він, і не послухають тепер. «Марна трата паперу», - такою була оцінка Ляйббрандта, яку він дав перед від'їздом.\n\nБройтіґам довго сидів, глибоко занурений у роздуми. Потім продовжив писати."
 UKR_UCW_RK.18.a: "Хтось же повинен був вислухати його."

 UKR_UCW_RK.19.t: "Прикрий імпульс"
 UKR_UCW_RK.19.desc: "Його вбили його ж товариші, розмірковував Гайнц, дивлячись на чоловіка, прикутого наручниками до стовпа. Ще півроку тому у Вермахті важко було б знайти людей, готових доносити на своїх окопних щурів. Але голод заговорив, і його голосом була холодна сталь. Їжа була для німців. Не для українців. Коли ваші товариші переверталися на спину від спазмів у шлунку, блювоти і плачу, що за людина витрачала їжу на тварин?\n\nЦей чоловік - Гемпфнер, - він був страшенно худий. Шкіра щільно обтягувала його череп, коли він дивився на Гайнца, в його очах було мовчазне благання. Можливо Гайнц теж так виглядав? Він так давно не дивився в дзеркало.\n\nВін годував українців зі своїх власних пайків. В іншому світі Гайнц, можливо, поспівчував би. Але зараз? Коли кожен шматок гравійного хліба доводилося брати під дулом автомата, не було місця для гуманістичних поривів.\n\nПротокол диктував, що в цей момент він повинен був виголосити промову, розповісти Гемпфнеру, чому він збирається робити те, що збирається робити як його командир, такий-то, такий-то і такий-то. Але у Гайнца зараз не було слів, і не схоже було на те, що Гемпфнер не знав, за що він має померти.\n\nТому, зітхнувши і кинувши на нього жалісливий погляд, Гайнц витягнув пістолет з-за пояса."
 UKR_UCW_RK.19.a: "Вони зібрали крихти з його кишень перед тим, як спалити форму."

 UKR_UCW_RK.20.t: "Саранча"
 UKR_UCW_RK.20.desc: "Світанок був найкращим часом для початку місії «поповнення запасів». Якщо вам пощастить, ви застанете селян сплячими, а чоловіки з виряченими очима в піжамах навряд чи стануть чинити опір. Або ж вони снідатимуть, і вам не доведеться шукати під комодами і в тюках сіна шматки житнього хліба.\n\nВтім, вони не єдині, хто поповнював запаси. Коли Гайнц оглядав село в бінокль, він бачив лише спустошення. Димлячі уламки будинків, попіл, що розвіюється вулицями - тут хтось був, і не сказати що давно. Від думки про ще один багатогодинний похід до наступного села у Гайнца збожеволіло в животі. Зітхнувши, Гайнц повернув бінокль санітарові і потер руки в рукавичках. Його пальто майоріла на вітрі - чи завжди воно було йому таке велике? Він бурчанням попросив карту і розстелив її на землі, коли перші сонячні промені пробилися з-за обрію на сході.\n\nОсь. За кілька миль на північ, ще одне село. Чи стояло б воно досі? Чи той, хто спалив це село, підстерігає їх там, готовий покласти край цьому кошмару? Гайнц згорнув карту і віддав її санітарові, а сам на мить сів на землю. Він трохи посидів, спостерігаючи за тим, як його дихання розпливається в холодному ранковому повітрі, а потім повільно піднявся на ноги. Не промовивши жодного слова, компанія рушила далі."
 UKR_UCW_RK.20.a: "Рій шукає."

 UKR_UCW_RK.21.t: "Вершник"
 UKR_UCW_RK.21.desc: "Через деякий час дні почали зливатися воєдино. Зруйновані села, спалені поля і смердючі трупи пропливали повз, ніби Гайнц плив по річці разом з усіма ними. Єдиною константою був гризучий біль у шлунку. Скільки б він не вкрав, скільки б будинків не розгромив зі своїми людьми в пошуках зерна, цього ніколи не вистачало, щоб відігнати примару.\n\nВін простежив обриси своїх кісток, які з кожним тижнем все чіткіше вимальовувалися на тлі плоті. Його волосся, колись вугільно-чорне, почало набувати кольору іржі і ставало сухим. Але він все одно йшов вперед, беручи з собою лише стільки хліба, щоб прожити ще один день, і час від часу роблячи кілька пострілів для розваги. Іноді він ледве пам'ятав, з ким воює.\n\nЧоловіки під його командуванням зменшувалися. Деякі просто сідали і відмовлялися вставати - ті, кого він залишив. Інші намагалися втекти - тих вони розстрілювали. Хіба вони не повинні були стріляти в когось іншого? Його мозок був настільки затуманений цими днями.\n\nГайнц міг обхопити себе за талію двома руками. Він маніакально сміявся, його очі наповнювалися сльозами.\n\nВін колись жив у Німеччині, чи не так? У нього був, давай подивимося... брат? Ні, він помер. Батьки? Виходу не було. Куди він міг тікати? Навіть якщо його не вбили б його люди, то українці точно вб'ють. І чому він міг бігти? Він був надто голодний для таких дурниць.\n\nЙого клятий пістолет знову заклинило. Поки він вовтузився з патронником, він захлопнувся на його великому пальці. Гайнц завив від болю і впав на підлогу. Тепла кров просочила його рукавички і капала на землю. Гайнц підняв очі до неба. Невже він не зробив достатньо, щоб заслужити таке? У нього був син. Гейнріх. Вдома, з дружиною. Сміх Гайнца луною прокотився через порожні поля, хрипкий і гортанний."
 UKR_UCW_RK.21.a: "Можливо, він це заслужив."

 UKR_UCW_RK.22.t: "Крізь це брудне пекло"
 UKR_UCW_RK.22.desc: "Німецькі солдати були вкриті кров'ю, потом, брудом і шрамами, але Франц не мав наміру допустити, щоб Україна стала кращою за них.\n\nПовстання спочатку було нічим іншим, як хаосом: солдатів вбивали, а партизани нападали з провулків і лісів. Терористи намагалися спалити все, що не змогли вбити, і кидали жданів. Вулиці були заповнені трупами, а звуки пострілів лилися дощем, перетворюючи вулиці на брудне місиво.\n\nАле, незважаючи на це, вони зупинили початкову атаку. З обличчям, вкритим шрамами від пострілу з «Жданова», вимазаним брудом, Франц не був стриманий, але жадав помсти. Їхні спроби вбити його провалилися, і він успішно перегрупував свої сили - і направив їх напроти місця, де ховалися терористи.\n\nЧи то самовпевненість, чи то проста некомпетентність, але українці по-справжньому не потурбувалися про те, щоб приховати свій табір, до якого вони відступили після першої невдалої атаки. Дехто з його підлеглих казав йому залишатися на місці, чекати на підтримку чи підкріплення, але Франц проігнорував їхній наказ. Він знав, що найближчим часом допомоги не буде, а сумнівних людей все одно не можна було пощадити - тож доводилося обходитися тим, що було.\n\nНімці накинулися на партизанський табір, прорвавши мізерну оборону з легкістю, яка здивувала навіть Франца. У подертих, пошматованих мундирах зі слідами боїв, вони розібрали табір і підкорили тих українців, яких не вбили під час першого штурму. Командирів та офіцерів забрали на допит, а решту солдатів стратили без суду і слідства.\n\nЧерез те, що дощ продовжувався, Франц був упевнений, що будуть нові атаки - але перевага, якою користувалися партизани, була втрачена. Тепер вони будуть підготовлені. Тепер Райхскомісаріят повинен був відреагувати."
 UKR_UCW_RK.22.a: "І незабаром це марне повстання буде придушене."

 UKR_UCW_RK.23.t: "Діяльність Ради"
 UKR_UCW_RK.23.desc: "Під час засідання Ради Безпеки не один з її членів побився об заклад з іншим, чи вдасться щось зробити.\n\nЗвісно, була надія на колективні дії, на прогрес у відновленні та встановленні стабільності. Адміністрація вимагала цього, і тому спроба буде зроблена. Але це була Україна, і всі дуже добре розуміли, що це означає.\n\nПочалися зустрічі, визначався порядок денний, з'явилися перші блокпости. Всі погодилися, що Рада пропонує найкраще місце для єдності, і дійсно, повільний прогрес був досягнутий щодо бажаних статей, але потім були підняті питання про те, як форум буде працювати - і так почалося те, що члени Ради, які мають великий досвід в українській дисфункції, визначили як руйнування.\n\nОдин з членів Ради підняв питання про повноваження. Чи був мандат Ради абсолютним, чи існувала якась інша влада? Це призвело до двох протилежних заяв інших членів, які незабаром були підтримані фракціями, що їх оточували. Аргументи згодом зростали, і незабаром «дебати» зайняли весь час, що залишився, але нічого помітного досягти не вдалося.\n\nВідходячи, ті, хто робив ставки, або раділи прибутку, або страждали від програшу, і їхні побоювання були цілком обґрунтованими. Звичайно, вони спробують знову. Але тоді ставки будуть більшими."
 UKR_UCW_RK.23.a: "Чи є хоч якась надія?"

 # 7.4.7 УГВ Гіркі жнива

 UKR_UCW_bitter_harvest.1.t: "Привід для занепокоєння"
 UKR_UCW_bitter_harvest.1.desc: "КЛАСИФІКОВАНО - ЗВІТ ПОЧИНАЄТЬСЯ\n\nЗвіт: 348867-A5\n\nСтосовно: Значне скорочення наявних запасів продовольства\n\nРівні запасів перероблених продуктів харчування (а також складових компонентів) на державних складах і сховищах значно скоротилися порівняно з початковими рівнями, і як поточні, так і прогнозовані темпи поповнення запасів слід вважати абсолютно недостатніми для компенсації цього скорочення.\n\nІснуючі процедури нормування є достатніми для забезпечення базових потреб у харчуванні серед населення (як військовослужбовців, так і цивільних осіб), але не можна очікувати, що так буде тривати протягом тривалого періоду часу. Необхідно якнайшвидше прийняти рішення щодо альтернативних джерел продовольства та/або більш суворих процедур нормування.\n\nБезпека щодо продовольчої ситуації на даний момент зберігається, про ситуацію інформуються лише необхідні сторони, однак для збереження інформаційного контролю потрібні додаткові ресурси.\n\nКІНЕЦЬ ЗВІТУ"
 UKR_UCW_bitter_harvest.1.a: "Хвилююче."

 UKR_UCW_bitter_harvest.2.t: "Питання першочергової важливості"
 UKR_UCW_bitter_harvest.2.desc: "КЛАСИФІКОВАНО - ЗВІТ ПОЧИНАЄТЬСЯ\n\nЗвіт: 414665-B8\n\nСтосовно: Серйозне скорочення наявних запасів продовольства\n\nРівні запасів усіх видів продовольства (а також складових компонентів) на державних складах і в сховищах впали до критичного рівня, недостатнього для забезпечення навіть мінімального щоденного раціону для населення в цілому. Більше того, звіти чиновників від сільського господарства і торгівлі свідчать про те, що немає ніякої надії на зміну цієї тенденції.\n\nНегайно на всіх рівнях повинні бути введені в дію протоколи сортування, щоб управляти запасами, що залишилися, і підтримувати загальні операції. Державні службовці та військовослужбовці отримають абсолютний пріоритет, за ними йдуть кваліфіковані робітники і ті, хто вважається необхідним для проведення операцій у воєнний час. Некваліфіковані працівники, особи, які не входять до складу робочої сили, та інші цивільні групи будуть позбавлені пріоритету і отримуватимуть продовольчі запаси лише тоді, коли це буде можливо.\n\nОчікується значна смертність серед цих груп. Крім того, з огляду на широкомасштабну депривацію, інформаційна безпека більше не може бути повністю гарантована, і тому слід очікувати суспільних заворушень.\n\nКІНЕЦЬ ЗВІТУ"
 UKR_UCW_bitter_harvest.2.a: "Ми повинні діяти. Негайно."

 UKR_UCW_bitter_harvest.3.t: "Потрібні негайні дії"
 UKR_UCW_bitter_harvest.3.desc: "КЛАСИФІКОВАНО - ЗВІТ ПОЧИНАЄТЬСЯ\n\nЗвіт: 536012-C3\n\nСтосовно: Майже повне скорочення наявних запасів продовольства\n\nРівні запасів усіх видів продовольства (включаючи складові та замінники/субститути) на державних складах та сховищах майже повністю вичерпані і більше не здатні забезпечити постачання навіть першочергових груп населення. Сільськогосподарські та торговельні бюро вказують на відсутність безпосередньої можливості протидіяти цьому, і очікується, що погіршення ситуації продовжиться в найближчій перспективі.\n\nПротоколи сортування більше не вважаються загалом ефективними, оскільки нестача продовольства робить будь-який контроль за розподілом неактуальним, навіть для військових і державних службовців. Крім того, у міру подальшого погіршення ситуації, міркування безпеки стають все більш гострими.\n\nНапади цивільних осіб на розподільчі центри, забезпечені продовольством чи ні, зростають як за кількістю, так і за інтенсивністю, і є підозри, що військові та сільськогосподарський персонал привласнюють залишки продовольства для особистого використання.\n\nРівень смертності експоненціально зріс у всіх угрупованнях, і почали надходити повідомлення про випадки вживання в їжу людей. Якщо постачання не буде нормалізовано в найближчому майбутньому, загального голоду в структурному масштабі - з усіма його наслідками - не уникнути.\n\nКІНЕЦЬ ЗВІТУ"
 UKR_UCW_bitter_harvest.3.a: "Боже мій. Як ми можемо це виправити?"

 UKR_UCW_bitter_harvest.4.t: "Катастрофічні втрати"
 UKR_UCW_bitter_harvest.4.desc: "КЛАСИФІКАЦІЙНИЙ СТРОК ВІДСУТНІЙ\n\nЗвіт: Н/В\n\nВідносно: Продовольчі запаси вичерпані\n\nДнями не було отримано жодної доповіді від державного сільськогосподарського персоналу або персоналу з розподілу продовольства, і вважається, що вони більше не перебувають на своїх посадах. Всі запаси продовольства вичерпані, а всі розподільчі центри розграбовані державним або цивільним персоналом для особистого використання. Структурний голод широко розповсюджений на всіх рівнях суспільства, а державна безпека у відповідь на це зазнала краху.\n\nБільше звітів від цього офісу не буде.\n\nКІНЦЕВИЙ РЯДОК НЕ ЗНАЙДЕНО"
 UKR_UCW_bitter_harvest.4.a: "Боже, допоможи нам. Все скінчено."

 UKR_UCW_bitter_harvest.5.t: "Проблиск надії?"
 UKR_UCW_bitter_harvest.5.desc: "КЛАСИФІКОВАНО - ЗВІТ ПОЧИНАЄТЬСЯ\n\nЗвіт: 618673-D9\n\nСтосовно: Підвищення рівня наявних запасів продуктів харчування\n\nЗа останній період значно підвищився рівень запасів продуктів харчування для забезпечення життєдіяльності (нормального та зниженого рівня харчування). Ці запаси були ефективно перевезені до центральних пунктів і розподілені між визначеними групами населення зі значною ефективністю. Перші звіти свідчать про зменшення кількості людей, які перебувають на межі голоду, а також про загальне покращення ситуації з безпекою, що наближається до критичної.\n\nТакий розвиток подій є багатообіцяючим, але продовольча безпека ще не є гарантованою. Від держави вимагатиметься ретельна і цілеспрямована увага як для збереження нинішнього поліпшення, так і для його подальшого розвитку. Сили безпеки готові надати допомогу.\n\nКІНЕЦЬ ЗВІТУ"
 UKR_UCW_bitter_harvest.5.a: "Невеликий крок. Але крок."

 # 7.4.8 УГВ капітуляції
 
 # РКУ
 UKR_UCW_capitulation.1.t: "Ганебне мовчання" # УНРА
 UKR_UCW_capitulation.1.desc: "Мешканців Кієва зігнали на виставу, яку влаштували для них німці. Натовпи людей під охороною кулеметів були тут сьогодні, щоб стати свідками кінця історії, мораль якої була такою ж ясною, як і денне світло, яким вони грілися - ось що трапляється з непокірними німцям.\n\nУ першому ряду біля вішальниці стояв Бройтіґам. Це було видовище, якого він хотів би уникнути, але від нього не буде ніякої відстрочки, так само, як не буде ніякої відстрочки для бійців УНРА. Судові процеси, якщо їх можна так назвати, виносили смертний вирок за смертним вироком, а ця справа була наріжним каменем.\n\nБройтіґам слухав, як мер Кієва почав монолог, що засуджував УНРА як зрадників, які прагнули зруйнувати єдність, створену Німеччиною, йому було цікаво, чи Ляйббрандт написав промову за нього. Есесівський кат обірвав його, викликавши першого партизана на вішальницю: Юрій Горліс.\n\nКолись героїчний борець за свободу, який вселяв надію багатьом, але коли він був в кайданах він являв собою постать, яка була далека від розказаних про нього історій. Він накульгуючи підійшов до петлі, віддавши себе на волю мотузці, щоб зробити себе вільним. Решта лідерів пішли за ним, Бройтіґам спробував відсторонитися від процесу, але його зупинив один чоловік - Оглоблин. Він дивився на Бройтіґама, коли той ішов на смерть, його очі благали його говорити. Рот Бройтіґама відкрився - але не пролунало жодного звуку, наче язик відмовлявся дозволити йому зробити таку фатальну помилку. Якби він заговорив, його суперники накинулися б на нього, як гончаки. Ні, зараз не час.\n\nОглоблин продовжував йти до шибениці, розуміючи, що відстрочки для нього не буде, погоджуючись на мотузяний зашморг разом з рештою таких, як він. Перемикач був перевернутий, після чого пролунав одночасний тріск і напружені оплески глядачів."
 UKR_UCW_capitulation.1.a: "Хтось помре, а хтось продовже жити."

 UKR_UCW_capitulation.2.t: "Уривок із щоденника Ґеорґа Ляйббрандта" # УПА
 UKR_UCW_capitulation.2.desc: "Сьогодні ми отримали повідомлення, що решту людей Клячківського взято під варту, це означає фактичну смерть Української повстанської армії. У певному сенсі, це трагедія для української раси - бачити, як її найзапекліших воїнів вбивають, намагаючись досягти тієї самої мети - незалежності, за яку вони так довго боролися. На перший погляд, наша боротьба була дуже схожою.\n\nАле вони були надто поспішними у досягненні своїх цілей, вони були скаженими псами, які кидалися на своїх товаришів, і, як і будь-яку іншу хвору тварину, їх потрібно вбити. Сумно, що вони не змогли побачити безмежні можливості того, чого ми могли б досягти разом. На жаль, це не витримує подальших роздумів, сподіваюся, це навчить українців, що буде, якщо вони покинуть нас.\n\nКлячківський, Шухевич, Стецько, і решта керівництва, яке привело своїх людей до спроби досягти недосяжного безумства, будуть страчені, вони всі занадто небезпечні і непередбачувані, щоб залишати їх живими. Я повинен буду нагадати Олендорфу, щоб він зробив цю справу якомога швидше і тихіше. Лояльні українці в наших рядах поважають цих маревних романтиків, не потрібно відштовхувати наших колабораціоністів, перетворюючи напівбожевільних на мучеників.\n\nЯк прояв нашої великодушності, ми пощадимо тих низькопоставлених членів, які не були достатньо піддані фальшивим пророком Бандери. Ми зможемо змусити їх працювати для наших власних потреб досить скоро. ОУН Мельника зрештою дуже потребує нової крові, будемо сподіватися, що це назавжди утвердить його фракцію як домінуючу.\n\nРобота знову кличе мене, я молюся за той день, коли не буде більше блокпостів на шляху до стабільної землі, де ці люди зможуть бути щасливими. Ці перебої так втомлюють."
 UKR_UCW_capitulation.2.a: "Свобода тільки для рук Німеччини."
 
 UKR_UCW_capitulation.3.t: "Перелягаюча руна" # УСРР
 UKR_UCW_capitulation.3.desc: "Коли Отто Олендорф стояв на мерхло освітленій трибуні суду, у повітрі повисали напруга й ноша неминучої загибелі: вабила його присутність, оскільки він перебував на велелюдному показовому процесі. Перед ним стояли решта представників УСРР: їхні обличчя вигравіювані непокірністю - їхні долі присуджені на погибель в лещатах фашистського режиму. Колись завзяті агітатори, що могли єднати людей своїми палкими словами - тепер вони стояли мовчки, їхні роти заткали кляпами, а майбутнє їхнє передречене. То була бузувірська іронія долі - ті, що колись розпалили вогонь повстання, тепер обернулися на дріб'язкових пішаків у продуманій грі Райху.\n\nПроте настав момент, коли зашморг надягнули на шию Олександра Шумського. Кляп його зісковзнув, на мить вивільнивши йому мову. Шумський вивільнив своє внутрішнє заперечення в нетривалому передиху від свого гніту; слова його бриніли гнівом справедливості. "Ви - деміурги сваволі й пригнічення: ваше володарювання розвалиться, а народ вас повісить, як і ви повісили нас!", - верещав він, ударившись в сльози, а кляп метлявся по підборіддю. "Хай живе опір пролетаріяту й робітничого класу, гордого народу України!"\n\nЗчинилась веремія в залі суду - охоронці намагалися приборкати запальний порив Шумського. Олендорф, посеред цього безладу, із стриманою вправністю, спокійно віддав наказ охоронцям. "Переконайтеся наступного разу в тому, щоб кляп був добре зав'язаний", - із своїм тоном, позбавленим почуттів чи занепокоєння щодо зухвалої заяви, що на мить пронизала гнітючу атмосферу."
 UKR_UCW_capitulation.3.a: "І шибениці свідчать про розгромлену непокору."

 # УНРА
 UKR_UCW_capitulation.4.t: "Уривок № 13" # РКУ
 UKR_UCW_capitulation.4.desc: "МЕМОРАНДУМ: Стенограма наради командирів УНРА, [GetDate].\n\nТЕМА: Покарання чиновників РК.\n\nСторінка 4 з 17\n\nОГЛОБЛИН: Тепер, коли останні сили Вермахту в Україні розгромлені, ми повинні вирішити питання про покарання німецьких чиновників (деякі чоловіки кивають). Почнемо з Ляйббрандта і Олендорфа.\n\nГОРЛІС: Я одразу пропоную засудити їх до смертної кари через розстріл за їх сумнозвісні злочини проти України.\n\nОГЛОБЛИН: Ну, мені не дуже подобається ця ідея. Ми могли б використати їх для чогось пізніше, але... Хто за? (Всі присутні піднімають руки).\n\nГОРЛІС: Я не уявляю, чим вони можуть нам допомогти (Горліс прочищає горло). Тепер, до Бройтіґама.\n\nОГЛОБЛИН: Ах, так. *Кашлянув*, чесно кажучи, я вважаю, що він не повинен померти - не тільки з практичних причин, але й з моральних. З усіх них він був найвідданішим місцевому населенню, тому було б більш... просто (деякі чоловіки, включаючи Горліса, піднімають брови) засудити Бройтіґама до довічного ув'язнення, щоб...\n\nГорліс перебиває Оглоблина: Ні. Він надто важливий, щоб залишати його в живих. Хороший він чи поганий, він все одно нацист. Ми не можемо його пощадити, Оглоблин. Деякі речі виправдані (кілька чоловіків кивають, а ще двоє починають перешіптуватися).\n\nОГЛОБЛИН: ...що ж, ви маєте рацію. Хто за те, щоб засудити Ганса-Отто Бройтіґама до смертної кари через розстріл?"
 UKR_UCW_capitulation.4.a: "(Усі чоловіки підняли руки)."

 UKR_UCW_capitulation.5.t: "Ніколи не повинно було бути" # УПА
 UKR_UCW_capitulation.5.desc: "«Вперед, вперед, вперед!»\n\nЗа командою офіцера бійці УНРА увійшли до великого комплексу, збудованого УПА - їхнього останнього центру управління. Його падіння означало б кінець націоналістичного опору, тому вони очікували дуже запеклого опору. Були зібрані найкращі люди, привезені найсильніші гаубиці, все було підготовлено до останнього бою в цій війні.\n\nОднак, на їхнє здивування, всі вояки УПА залишили свої позиції, і штурму не знадобилося. Спочатку здавалося, що це пастка, але коли одна за одною зачищалися ділянки табору, ніякого опору не було. На місці панував безлад - зброя розкидана по підлозі, документи розкидані, і так далі - саме так, як повинна виглядати покинута військова база, думали солдати і офіцери. Ворожі бойовики дійсно пішли без бою.\n\nЧерез деякий час невелика група штурмовиків УНРА нарешті дісталася до найглибшої камери комплексу. На рахунок «три» вони виламали двері - Шухевич, який намагався їх обстріляти, був убитий кульовим пораненням у груди. Його син у сліпій люті кинувся назустріч чоловікам, але отримав прикладом гвинтівки за свої клопоти, коли вони йшли до "Вождя". Клячківський сидів на стільці неподалік, приставивши пістолет до скроні і тремтячи правою рукою. Стецька там не було, він, мабуть, втік з іншими, але солдатам було байдуже. Вони хотіли якнайшвидше забратися з цього місця. Клячківського забрали разом із Шухевичем та його сином, а через деякий час усі входи до табору запечатали."
 UKR_UCW_capitulation.5.a: "Таким чином, УПА зустріла свій кінець."
 
 UKR_UCW_capitulation.6.t: "Більше не буде серпа і молоту" # УСРР
 UKR_UCW_capitulation.6.desc: "Шумський разом з п'ятьма солдатами УНРА, які його охороняли, вийшов з будівлі театру в Ростові, яка дивом уціліла під час німецької окупації та громадянської війни. Кілька хвилин тому він підписав офіційний акт про беззастережну капітуляцію комуністичних сил, і чоловіки, які зараз його супроводжували, були свідками цього. Згідно з документом, усі підрозділи повинні припинити свою діяльність до повного роззброєння, а Шумському, разом з найважливішими фігурами радянського опору, дозволялося покинути Україну і переїхати в іншу нейтральну країну.\n\nВін не намагався втішати себе думкою, що це не його вина, він не був зацікавлений в тому, щоб обдурювати себе. Він відчував відповідальність за провал комуністичного ідеалу і за те, що підвів усіх людей, які так важко працювали над відновленням радянської України. Робітники і селяни України ніколи не будуть по-справжньому вільними. Цього разу боротьба була програна. Мрії Маркса, Енгелса, Лєніна і Бухаріна ніколи не здійсняться. Його мрія ніколи не здійсниться.\n\nВтім, думав Шумський, не все так погано - зрештою, не Вермахт загасив комуністичну пожежу, а дещо поміркований Горліс і його УНРА. У глибині душі він знав, що Горліс не був поганою людиною, просто у нього були інші ідеї, і той факт, що лідер демократичного опору погодився на договір, а не на відверте знищення радянських партизанів, вже було гідне поваги. Це була чесна боротьба - і поразка в такій боротьбі є гідною поразкою.\n\nПід час свого внутрішнього монологу Шумський з солдатами проходив повз флагшток біля театру, і він побачив, як знімають прапор Української Соціялістичної Радянської Республіки. Єдиною його реакцією було глибоке зітхання."
 UKR_UCW_capitulation.6.a: "Прощавай, старий солдате."

 # УПА
 UKR_UCW_capitulation.7.t: "Усі в ряд" # RK
 UKR_UCW_capitulation.7.desc: "Трупи, нагромаджені на інші трупи. Бюрократи, колаборанти - кожен шмат лайна, яких використовував Райх задля знищення України, отримали своє справедливе покарання. Останні свої миті вони провели по-різному: смажачись на вогнищі, співаючи хриплу пісеньку повішаних, смокчучи бруд у багряній калюжі чи дивлячись на ряд із гвинтівок. Кожен метод супроводжувався мелодією колись забутої української музики, святкуванням повернення того, що належить їм.\n\nШухевич сьогодні був одним із незліченних святкувальників, який взяв свою гвинтівку на праведний забій разом зі своїми товаришами у складі розстрільної команди. На кожному з німецьких псів, що стояли перед ним, він ретельно вибирав собі ціль. Холуй-мельниківець, чиє багатство постало завдяки гнобленню власного народу. Шухевич приставив свою гвинтівку до голови цього пса ще до того, як наказ стріляти було віддано, замаравши стіну позаду сірою речовиною.\n\nМельниківець, як і решта шкідників поряд із ним, впали нв землю; скоро їх заберуть і спалять. Шухевич зробив перерву від цієї гульби, та цю перерву перервав ад'ютант, що приніс йому особливу нагороду - заступника райхскомісара Ґеорґа Ляйббрандта. Закривавлений і побитий академік стояв перед ним на колінах. Роман відпустив свого помічника, перш ніж занурився в роздуми.\n\nКолись він був у тому ж становищі, що й щойно вбитий ним чоловік. У іншому він міг лишитися з 201-им, і, може, він би був би одним із тих українців, що зараз стояли б біля стінки. Чи інші досі знають це його минуле? Його думки перервало белькотіння бюрократа.\n\n«Знаєте, в нас багато чого спільного. Звісно, до незалежності я пішов би інакше, однак у Німеччині багато таких, як я. Якщо ви, люди, залишите мене в живих, я б зміг допомогти вам домовитис...» Порожні Ляйббрандтові слова заглушила куля в його скроні, разом із занепокоєними словами патріота про його колабораціонізм."
 UKR_UCW_capitulation.7.a: "І Шухевич почувався добре."

 # UKR_UCW_capitulation.8 - Коли УПА перемагає УНРА натомість появляється івент по фокусу UPA_CivilWar.4

 UKR_UCW_capitulation.9.t: "У тіні люті" # УСРР
 UKR_UCW_capitulation.9.desc: "Сонце почало сходити, кидаючи неземне золоте сяйво над залитим кров'ю полем битви. Дмитро Клячківський, з обличчям, викарбуваним бурхливою сумішшю тріумфу і люті, крокував спустошеним ландшафтом. Стомлені безперервним боєм, його солдати старанно виконували своє похмуре завдання - прибирали і реєстрували полеглих товаришів. Повітря, важке від стійкого запаху диму і пороху, свідчило про незліченну кількість життів, які поглинуло безжальне насильство.\n\n «Пане, ми знайшли тіло зрадника!», - пролунав голос солдата, струшуючи землю під їхніми ногами. Погляд Клячківського загострився, його кроки прискорилися до поваленого лідера. Похилений і бездиханний лежав Шумський - жертва снайперської кулі. Полум'я люті спалахнуло всередині Клячківського, бурхливий шторм вирував під його стоїчною зовнішністю, коли він дивився на тіло Шумського, що свідчило про їхнє запекле суперництво. «На міську площу Ростов», - скомандував він, і в його голосі бриніла крижана рішучість. «Треба показувати приклад».\n\nСолдати обмінялися мовчазними поглядами, повністю усвідомлюючи грізну силу гніву свого командира. З непохитною вірністю вони швидко рушили виконувати його наказ. Намотавши мотузку на шию Шумського і прив'язавши її до джипа, що стояв поруч, вони приготувалися тягти його бездиханне тіло оскверненими вулицями."
 UKR_UCW_capitulation.9.a: "Гірка помста залишає солодкий присмак."

 # УСРР
 UKR_UCW_capitulation.10.t: "Контроль за шкідниками" # РКУ
 UKR_UCW_capitulation.10.desc: "Було близько четвертої ранку, коли Йоганн почув, як тріснула гілка, далеко в лісі, але не більше ніж за кілька метрів від нього. Він не спав кілька днів, і тепер шкодував про це, лежачи на спині, мокрий від крижаної роси. Він промерз до кісток без вогню. Він не міг ризикувати зі світлом і димом. Можливо, було кілька моментів, коли він прослизав трохи нижче поверхні сну, переживаючи короткі сновидіння останніх кількох днів. Падіння його гарнізону. Наказ про відступ, безсумнівно, частина масової капітуляції. В'язниця, яку він охороняв, у вогні. Його нездатність повести за собою людей, натомість втеча, коли перша статуя Гітлера впала під мстивим бомбардуванням. Його божевільний політ у ліси до далекого кордону, в існуванні якого він навіть не був упевнений.\n\nА тепер логічне завершення. Тихий шепіт у кущах, за покровом прадавнього лісу. Здавалося, ніби його оточили розлючені привиди. Його розум намагався знайти будь-який варіянт що робити, адже він не був екзорцистом. В нього усе занадто сильно боліло, щоб рухатися, його боєприпаси були витрачені, горло благало води, і у нього не було ніяких планів на останній тиждень, окрім як «бігти».\n\n«Хто там?» прохрипів він на тій невеликій частині місцевої мови, яку знав.\n\n«У нас є живий!» Крикнув голос, хоча він ж не розумів його мови: «Здається, офіцер!»\n\n«Той, що з того форту? Я його бачу!» відповів інший. Йоганн не встиг відповісти, як пролунав оглушливий тріск і лісова підстилка стала червоною. П'ять секунд болю, а потім тихе зникання. З лісу вийшли партизани, двоє чоловіків і жінка. Жінка опустилася на коліна і з посмішкою забрала його люгер: «Шкода, що ми не змогли його захопити». «У мене є краща ідея... У когось є мотузка? Місто недалеко, ми можемо зробити з нього приклад.»"
 UKR_UCW_capitulation.10.a: "Покажіть їм, що відбувається з вбивцями."

 UKR_UCW_capitulation.11.t: "Жовтий та синій, розірвані навпіл" # УНРА
 UKR_UCW_capitulation.11.desc: "З кожним кроком Іванові хотілося просто впасти в бруд і залишитися там. Кожна рана, яку він коли-небудь заробив, боліла. Його форма, яка колись була міцною, але гордою, одягом справжнього націоналістичного партизана, перетворилася на лахміття, що маркувало його як зрадника. У темряві він орієнтувався лише по палиці в руці, щоб не наступити на колючий дріт і не збитися зі шляху. Його серце калатало від страху перед тим, що чекало на нього попереду. Але страх гнав його вперед. Його товариші-партизани були вигнані комуністами в ліс і були задоволені тим, що воювали все своє життя. Іван не був таким. Німці пішли, війна закінчилася. Він лише молився, щоб червоні прийняли його капітуляцію, знаючи, що ще кілька тижнів тому він не прийняв би їхню.\n\nСергій постукав у її двері, перш ніж здригнутися і відсмикнути руку назад. Порізи та синці на його кісточках пальців і руках залишилися від тижнів боротьби практично врукопашну в міській війні, яка поклала край популістській боротьбі. Деякі з них вже загоїлися, але інші були свіжими від опору його викрадачам. Яким же було його здивування, коли його протримали лише тиждень і відправили додому. Після того, як він цілу хвилину дивився на свою руку, до нього дійшло, що ніхто не відповів. Він замислився, чи вона взагалі жива. Чи знає вона, що він живий? Чи знайшла когось іншого? Чи...\n\nДвері відчинилися, і Сергій одразу опинився в її обіймах. Десь далеко відчинилися двері камери Ігоря.\n\nОни знайшли його справу. Це було лише питанням часу. Він жив у страху відтоді, як його кинули до похмурого тюремного блоку разом з іншими колаборантами, навіть незважаючи на те, що він служив опору. Єдине, що боліло більше, ніж побої, - це усвідомлення того, що багато з них він заслужив. Щодня когось виводили на суд, а потім вбивали, принижували, відпускали або відправляли назад. «Час настав», - сказав голос. Він молився, поки його виводили, і відчував запах диму палаючої тканини десь ззовні. Жовті та блакитні полотнища згорнулись, а потім перетворились на попіл."
 UKR_UCW_capitulation.11.a: "Перш ніж унестис вітром."

 UKR_UCW_capitulation.12.t: "Друга смерть" # УПА
 UKR_UCW_capitulation.12.desc: "Маленький Андрійко пам'ятав свої осінні прогулянки луцькими луками, приємні звуки сухого листя, що хрустіло під ногами. Він пам'ятав запах свіжого, прохолодного повітря, і те, як вдома його зустрічала тепла чашка чаю від мами.\n\nСьогодні, однак, все було інакше. Вождь прийшов і пішов, а пожежі - немає. Андрій пам'ятав запах свіжоспеченого хліба, смаженого сала і чаю в центрі міста, але ці колись свіжі запахи вивітрилися, натомість залишився запах горілого дерева і гниючої плоті. Чоловіки в зеленому одязі з шоломами, прикрашеними зірками, вели «повстанців» у сірій уніформі, яких вони самі називали «повстанцями», ґрунтовими дорогами, з кінця яких доносився тривожний, невимовний сморід. Час від часу інші люди в зеленому кидали в них якимись предметами. Кінські екскременти? Пакети з сечею? Блювотиння? Лише Бог знав. Куди йшли ці люди? Що було причиною цього неприємного запаху? Андрій не хотів знати - він намагався пов'язати цей запах з чимось іншим, але він дійсно не був схожий ні на що з того, що він знав. Запах і крики тримали його далеко.\n\nАндрій знову згадав потріскування затишного, теплого каміна свого будинку, хоча тріск і хлопання на вулицях були не тільки від палаючих дров. Книжки та брошури, які «повстанці» в сірому залишали під кожними дверима, зів'яли і зморщилися у вогні, як і колись всюдисущі плакати з лисим чоловіком - Пантерою, чи як його там? Андрій уже забув. І той пам'ятник, встановлений на міській площі Клячиків, чи як їх там, тепер був обезголовлений, а на його плечах майорів червоний прапор - щоправда, без чорної смуги."
 UKR_UCW_capitulation.12.a: "Незабаром ім'я Степана зникне з сердець українців."

 ## 7.4.9 - УГВ арки персонажів ##
 UKR_UCW_characters.1.t: "Навколо тьмяного багаття" # 1 Івент Богдана
 UKR_UCW_characters.1.desc: "Богдан Антоненко сидів біля невеликого вогнища в глибині лісу. Залишки дрібної дичини, яку він упіймав неподалік, були його їжею на ніч. Його турбувала не їжа, а те, що робити далі. Поки що він переховувався, поки Україна занурювалася в насильство, історії та чутки про те, що відбувалося, кружляли в його голові.\n\nВін чув про українців, які повстали і захопили половину країни, він чув про партизанів, які нібито вбили цілий апарат Райхскомісаріяту, він навіть чув, що з'явилося більше солдатів колишньої Української Соціялістичної Республіки.\n\nВін підозрював, що більшість з них були перебільшеними або неправдивими. Німці ніколи б не дозволили Україні так легко впасти у руки повстанців, навіть якщо найсміливіші чутки були правдою. Проте не було жодних сумнівів у тому, що німці зламали оборону.\n\nБогдан дивився на згасаюче вогнище, намагаючись зрозуміти, що робити. Совість підказувала йому спробувати знайти своїх товаришів серед комуністів. Після того, що він зробив, вони приймуть його назад як героя. Якщо він повернеться, то вже не буде безцільним партизаном, а матиме щось вище, у що віритиме.\n\nСпочатку це здавалося очевидним, але він вагався, коли вогонь згасав, і починалася ще одна холодна ніч.\n\nВсе було вже не так, як раніше, відколи він ледь не вбив Коха. Він не був ні особливим, ні героєм, і навіть не знав, як він знайде їх знову після того, як був відрізаний від них. Він також знав, що тепер він воює не за державу і не за соціялізм. Його місія, колись така ясна, тепер була нічим іншим. Соціяліст, партизан, борець за свободу - все це вже не здавалося правильним.\n\nВін знав, що не може залишатися бездіяльним, але вогонь, який горів у ньому, згас, жодна справа не задовольняла його, як колись. Наразі, вирішив він, він може лише продовжувати йти."
 UKR_UCW_characters.1.a: "Можливо, з часом все стане зрозуміліше."

 UKR_UCW_characters.2.t: "Дорогою до Кієва" # 1 Івент Ван Нордена
 UKR_UCW_characters.2.desc: "Вогняна лють і пристрасть пронизували Пітера ван Нордена, коли він їхав через українську сільську місцевість у напрямку до Кієва. Він міцно стиснув кермо, його кісточки рук побіліли від обурення та люті.\n\nЙого увага була зосереджена не на варварах, які заполонили сільську місцевість, саботуючи, крадучи та вбиваючи некомпетентних німців. Ні, він був зосереджений на німецькому офіцері, який прийшов на його ферму і мав нахабство наказати йому евакуюватися. Вони сказали, що це «занадто небезпечно», що це «для його безпеки». Але він міг залишитися. Пітер знав, що він міг залишитися і захищати свою землю від бандитів, партизанів і дегенератів, з якими німці, очевидно, не могли впоратися. На жаль, німецький офіцер вдався до наказу виїхати, і хоча він був розлючений, він знав, що не можна відмовлятися від прямого наказу.\n\nВін подивився на заднє сидіння, де сиділи його дружина і син, які вже заснули. Зітхання вирвалося у нього, коли він знову зосередився на дорозі. Антонія наполягала на тому, щоб вони послухали і виїхали, коли сім'я дізналася, наскільки небезпечними стали партизани. Вона боялася за Маркуса, забуваючи, що це його робота - захищати родину. Просто покинути все було...\n\nЦе вже не мало значення, тепер, коли вони були у дорозі...\n\nВін боявся, що повернеться до зруйнованого будинку, роздягненого і пограбованого, де не буде нікого, хто міг би його захистити. Бог знав, що німці цього не зроблять. Наразі все, що належало Ван Норденам, було в кузові цієї вантажівки. Наразі, цього мало бути достатньо."
 UKR_UCW_characters.2.a: "Одного дня, невдовзі, вони повернуться."

 UKR_UCW_characters.3.t: "Синій та жовтий" # 1 Івент Носенко
 UKR_UCW_characters.3.desc: "Звідкись ззовні був чутен ритмічний тупіт чобіт. Спочатку Носенки були впевнені, що це німці на параді - спроба продемонструвати силу перед обличчям краху. Але потім у вікні вони побачили синьо-жовті проблиски, що тремтіли.\n\nГалина підхопилася з ліжка і підійшла до вікна. Там були вони - батальйон бійців УНРА, що йшов на місто. Над ними майорів прапор України.\n\nВона не бачила цього прапора з дитинства.\n\nГалина відвернулася від вікна і кинулася вниз по сходах, її ноги підстрибували в гарячковому темпі, що відповідав її юнацькому кроку. Відчинивши двері, Галина нарешті змогла як слід розгледіти чоловіків. Група визволителів марширувала ґрунтовою дорогою, махаючи селянам. Їй так хотілося помахати у відповідь, але вона не могла змусити себе зробити це. Момент був надто величним, надто потужним. Жоден рух не міг бути достатнім.\n\nДанило залишився у своїй спальні, чекаючи, поки чоловіки підуть. Якщо вони всі завтра загинуть під градом німецьких куль, який сенс матиме цей спогад? Він бачив би ці обличчя у своїх кошмарах, змішані з усіма іншими полеглими, яких він знав і втратив. Краще перевернутися, подумав Данило. Краще заснути."
 UKR_UCW_characters.3.a: "Але навіть якщо він відмовлявся думати про це, якась частина його вірила в них."

 UKR_UCW_characters.4.t: "Наслідки звірів" # 2 Івент Богдана
 UKR_UCW_characters.4.desc: "Слабка надія, яку Богдан плекав, побачивши ферму вдалині, згасала чим ближче він підходив до неї. З кожним наступним кроком з'являлися ознаки того, що він знайде. Коли він побачив розтерту багнюку слідів від шин, десятки відбитків чобіт, спалені поля і повну відсутність життя, йому, напевно, варто було б піти і заощадити собі час.\n\nАле вибір був не його, не тоді, коли шлунок нагадував йому, що йому потрібна їжа, і якщо є шанс, що там щось залишилося, він повинен був це взяти.\n\nВін обшукав спочатку сараї і силосну яму, хоч вони і були невеликими. Та в них майже нічого не було, а те, що залишилося, було марним. Здебільшого зламані сільськогосподарські інструменти, подерті мішки та гнила солома - ось і все, що залишилося. Невеликий курник також був порожній, без жодного яйця чи курки.\n\nХата була зламана, і дверна ручка була вибита з самих дверей, коли Богдан підійшов до них. Він не став довго роздумувати над тим, що з ними сталося, найщасливішим кінцем було те, що їх взагалі не було вдома. Він знайшов будинок таким же розграбованим, як і сараї. Тарілки розбиті на підлозі, столове срібло розкидане, стільці перекинуті, шафи виламані...\n\nНеначе зграя скажених тварин увірвалася сюди.\n\nБогдан обшукав будинок так ретельно, як тільки міг при згасаючому денному світлі, не звертаючи уваги на розбиті рамки картин і рештки спогадів про тих, хто тут жив. На свою радість, він знайшов півбуханки хліба, що завалялася за стільцем, мабуть, загубилася в метушні. Він був черствий, брудний - та все ж краще, ніж нічого.\n\nЗ ним у руці, під призахідним сонцем, він розвернувся і швидко пішов геть. Тут його більше нічого не чекало."
 UKR_UCW_characters.4.a: "Лише ще один пам'ятник війні."

 UKR_UCW_characters.5.t: "Те, що залишилося позаду" # 2 Івент Ван Нордена
 UKR_UCW_characters.5.desc: "Ван Нордени були чи не єдиною родиною, яка втекла до Кієва, і Пітер провів довгий день, спілкуючись із дуже перевантаженим роботою німецьким чиновником, який мав надати їм офіційне місце проживання. Наприкінці дня чиновник практично тицьнув йому в руки документи на проживання, навіть не давши жодних вказівок.\n\nНеповага дратувала його, але в цей момент він просто хотів заспокоїтися - папери його заспокоїли. Все, що їм потрібно було зробити, це дочекатися, поки німці зберуться з силами і розчавлять цих партизанів.\n\nВони врешті-решт дісталися до своєї квартири. Пітер зморщив ніс від запаху міста і відзначив, що квартира була не зовсім "новою." Він не помітив жаху в очах дружини і сина, і вони увійшли в похмуру квартиру, що складалася всього з пари кімнат, і всі вони були в поганому стані.\n\nДружина відчинили вікно, щоб впустити трохи повітря, коли вони почали розпаковувати речі. Коли Пітер виймав свої речі, він помітив, що чогось не вистачає, і це його стривожило. «Мої медалі!» - несамовито вигукнув він до Антонії. «Ти бачила мої медалі? Я знаю, що схопив їх!»\n\nУся сім'я швидко почала їх шукати. Пітер несамовито перебирав усі речі, відмовляючись визнати, що їх там немає. Ні, ні, ні, він не міг їх забути. Тривога перетворилася на страх, а страх на жах, коли він зрозумів, що якщо українські варвари пограбують його будинок, вони знайдуть їх - або, що ще гірше, одягнуть. Йому стало погано, коли він уявив, як якийсь брудний, беззубий українець носить його медалі в насмішку над його службою.\n\nВін важко дихав, дружина поклала руку йому на плече, говорячи йому втішні слова, намагаючись заспокоїти його, а син залишився в кутку, не бажаючи підходити ближче. Він ледве чув заспокійливі слова дружини, думаючи лише про те, що було втрачено."
 UKR_UCW_characters.5.a: "І йому залишалося сподіватися лише на диво."

 UKR_UCW_characters.6.t: "Минуле палає" # 2 Івент Носенко
 UKR_UCW_characters.6.desc: "Зазвичай екскурсії до міста були для Галини звичайною справою, необхідною час від часу, щоб придбати те, чого не могло забезпечити господарство. Цього разу все було інакше.\n\nВона не бачила нападу УНРА на власні очі, але чула, як про його результат шепотілися її односельці, а чоловік та його друзі обговорювали його за картами. Місто було звільнене - німецькі гарнізони, що знаходилися далеко від їхніх домівок, не могли чинити опору.\n\nСьогодні шрами тієї битви видно як на долоні - спалені будинки, поховані тіла, руїни місцевого фонтану, розірваного навпіл танковим вогнем. А поруч із цими руїнами лежала купа палаючих предметів, оточена солдатами та місцевими українцями. Кинувшись подивитися, що це, Галина впізнала дерев'яну свастику, встановлену нацистами в центрі міста. Яка вже почорніла, одна рука обломилася і впала.\n\nЯке тепло від цього вогню, подумала Галина. Як мені пощастило, що я сьогодні жива."
 UKR_UCW_characters.6.a: "Як би я хотіла, щоб мій чоловік зрозумів це почуття."
 
 UKR_UCW_characters.7.t: "Смак надії" # 3 Івент Богдана
 UKR_UCW_characters.7.desc: "Місто було невелике, але щойно Богдан потрапив до нього, він одразу відчув різницю. По-перше, тут не було німців, і він намагався пригадати час, коли їх узагалі не було. Без їхньої присутності все здавалося іншим. Воно було жвавим і сповненим надії, емоції, які так довго були йому чужі.\n\nВін так звик бути на задньому плані, невидимкою на узбіччі суспільства, триматися маленьким, щоб німці не звертали на нього уваги - не те, щоб вони шукали людей, схожих на нього, бо українці в їхніх очах були недолюдьми, тому вони на них не звертали уваги. Тут... все було інакше. Одна з мешканок, українка середнього віку, помітила його в брудному одязі і без їжі, і швидко привела його в невеликий табір для біженців.\n\nВін був не єдиним, хто блукав тут. Були й інші відчайдухи, які знайшли свій шлях, і хоча їх було небагато, всі вони отримали свіжий одяг, їжу, воду і невеликі зручності, які раніше доводилося шукати. Солдати пильно стежили за ними, але підозр було напрочуд мало.\n\nЦе була занадто велика щедрість для нього, щоб мати з цим справу. Богдан знав, що все це тимчасово. Німці повернуться, і він не міг дозволити собі повірити, що все зміниться. Це було небезпечно, навіть якщо він хотів би обійняти цю громаду, яка прийняла його без жодних сумнівів.\n\nВін не заслуговував на це, це повинно бути для когось, хто цього справді потребує. Він міг би вижити сам, він міг би витримати, коли німецькій чобот знову впав. Інші люди заслуговували на надію. Ті, хто дійсно міг у неї повірити.\n\nПосеред ночі він вислизнув з міста і повернувся до лісу. Він не озирався, бо якби озирнувся, то міг би передумати."
 UKR_UCW_characters.7.a: "Надія була занадто великою щедрістю, яку він не міг собі дозволити."
 
 UKR_UCW_characters.8.t: "Візит додому" # 3 Івент Ван Нордена
 UKR_UCW_characters.8.desc: "Антонія відчула, як на її обличчя падає заспокійливе проміння теплого сонця, і почула звуки птахів у повітрі. До її вух долинали звуки міста, яке вона знала, це Амстердам. Вона повільно усвідомила, що пливе по одному з каналів, але чому, вона не знала.\n\nІ вона не могла поворухнутися.\n\nСпочатку її не стривожило, заспокоїло і втішило сонце і вода, остання з яких відчувалася як захисний кокон, коли вона пливла. Над собою вона бачила будинки і споруди рідного дому, бачила людей, які йшли вулицями, мостами, посміхалися, сміялися, але, здавалося, не бачили, як вона пропливає повз них.\n\nВона намагалася покликати їх, але рот відмовлявся слухатися.\n\nВода почала холоднішати, а яскраве сонце затягли хмари. Заспокійливе тепло згасло, і на її місце прийшов дощ. Знайомі звуки міста стали слабшими, їх замінили звуки української пустелі, що перемежовувалися віддаленими пострілами. Вона побачила Амстердам позаду себе, який ставав все меншим і меншим, поки її несло в Північне море.\n\nВона закричала, щоб хтось допоміг, врятував її звідти, куди її тягнуло - і, на свій подив, вона нарешті змогла прокинутись від кошмару.\n\nАнтонія підхопилася в ліжку, важко дихаючи, коли залишки сну розвіялися, і вона прокинулася в маленькій, тісній і холодній кімнаті, яка тепер була їхнім домом. Квартира з облупленою фарбою на стінах, нерівною підлогою та сирим смородом, який, здавалося, ніколи не вивітриться. Їхній новий дім. Вона лягла на спину, з мокрими очима, намагаючись заснути."
 UKR_UCW_characters.8.a: "Вона лише хотіла повернутися додому."
 
 UKR_UCW_characters.9.t: "Ціна" # 3 Івент Носенка
 UKR_UCW_characters.9.desc: "Перші тижні для Галини та Данила були сповнені надії. Потім реальність почала занурюватися в них. Жодна війна, якою б справедливою чи праведною вона не була, не обходиться без жертв. Для Носенків ця ціна полягала в продуктах харчування та речах. Носенки покладалися на зруйновану та експлуатовану економіку, але в суворому центрі війни не було ніякої економіки. Вони просто мусили дбати про себе самі.\n\nІ ось, в тихій темряві наприкінці вегетаційного періоду, вони сиділи за столом і відмічали пайки, спокійно обмірковуючи, що у них залишилося. Годинами вони методично відмічали те, що зібрали в цьому сезоні, і на скільки часу їм цього вистачить.\n\nТоді з вуст Данила мимохіть пролунав дивний коментар. «Сподіваюся, воно того варте», - обурена Галина підвела очі від роботи. «Ти маєш знати, що воно того варте.»\n\nДанило похитав головою. «Не знаю. Я маю надію, але нічого не знаю.» Галина відклала свої нотатки і повернулася до Данила, її очі горіли з такою силою, що прорізали темряву. «Якщо ми помремо завтра, це все одно буде варте того.»\n\nУ кімнаті на мить запанувала тиша.\n\n«Я не хочу, щоб ти помирав.»"
 UKR_UCW_characters.9.a: "«За це, або за будь-що»."
 
 UKR_UCW_characters.10.t: "Порожній розстріл" # 4 Івент Богдана
 UKR_UCW_characters.10.desc: "День був похмурий. Похмурі хмари темніли в лісі, погрожуючи дощем, а повітря ставало все холоднішим. Різкий вітер пронизував навіть шинелі, а бруд і багнюка налипали на чоботи та одяг. Богдан спостерігав за солдатом з цього лісу, дивлячись, як він спотикається на розбитій дорозі.\n\nВін не знав, звідки прийшов солдат, але це був безсумнівно німець. Їхню форму було легко впізнати, навіть незважаючи на те, що вона була розірвана і вкрита брудом. Чоловік був у поганому стані, його рухи були мляві, ноги волочилися, а спина сутулилася. Одну руку він тримав обережно, зброї не було видно.\n\nСолдат був молодий, худорлявий, маленький, з волоссям пісочного кольору. Можливо, хлопець із загарбницьких поселень, можливо, призовник із самої Німеччини. Це не мало значення. Богдан мовчки дивився, тримаючи в руці власну гвинтівку. Він чув голос свого командира, такий же ясний, як і за день до його першого бою: «Коли ворог буде у тебе на прицілі, ти не будеш вагатися. Ти вб'єш його, якщо не хочеш, щоб він зробив те ж саме з нами».\n\nІснувала лише одна доля для німців. Він механічно прицілився, вдихнув і вистрілив.\n\nСолдат з криком впав на землю, корчачись в агонії від пострілу в спину. Пролунав ще один постріл, і солдат завмер. Богдан опустив гвинтівку лише тоді, коли переконався, що чоловік мертвий. Він згадав, що відчував, коли вбив свого першого німця. Піднесення, гордість, задоволення. Зараз він не відчував нічого з цього, лише холодну безпристрасність. Ще один німець був мертвий, але їх залишалися тисячі. Крапля в морі, але кожна крапля мала значення. Він зняв з тіла те, що залишилося, і знову зник у лісі."
 UKR_UCW_characters.10.a: "Це не останній німець, якого спіткала така доля."
 
 UKR_UCW_characters.11.t: "Коли все буде добре" # 4 Івент Ван Нордена
 UKR_UCW_characters.11.desc: "«Мамо?»\n\nАнтонія повернулася зі свого місця біля вікна на голос сина. Маркус увійшов до кімнати, здавалося, трохи неспокійний і незручний від того, що потурбував її. Навіть у свої сім років він все ще не наважувався попросити її про щось. Вона посміхнулася йому, даючи зрозуміти, що все гаразд. «Ходи сюди, Маркусе, що сталося?»\n\nВін підійшов ближче і сів поруч з нею, прикусивши губу, перш ніж запитати: «Коли ми зможемо поїхати додому?»\n\nУ неї стислося в грудях від запитання, на яке вона, чесно кажучи, не знала відповіді. І не знала, де для них тепер дім. Де вони жили в Україні, чи де вона була щаслива в Нідерландах. Її посмішка лише злегка здригнулася, а голос залишався легким. «Коли все буде добре, а це буде скоро», - пообіцяла вона. «І коли це станеться, я відвезу тебе в прекрасне місце. Ти знаєш Голландію?»\n\nВін кивнув. «Там, де ти виросла?»\n\nВона ласкаво посміхнулася. «Так. Прекрасне місце, з зеленими пейзажами, прозорими струмками, чистими містами. Не можу дочекатися, коли ти сам це побачиш», - вона нахилилася ближче, ніби ділилася секретом. «Твій батько не зізнається, але, між нами кажучи, я думаю, що він теж хотів би там побувати».\n\nВін усміхнувся, ніби теж хотів поїхати в країну без проблем, але було в цій усмішці щось вимушене, Антонія знала, що це вимушена усмішка. Вона з болем усвідомлювала, що не вперше дає такі обіцянки, і в цьому жахливому місці, де вони зараз перебувають, можливо, реальність вже забарвлює світогляд її маленького сина."
 UKR_UCW_characters.11.a: "Але якщо він їй не вірив, то мовчав."
 
 UKR_UCW_characters.12.t: "Україна" # 4 Івент Носенка
 UKR_UCW_characters.12.desc: "«Завтра я знову побачу, як вони всі помруть». Данило зловив себе на тому, що пише зі швидкістю, якої не досягав уже багато років. Це була ідея Галини - вийти зі стільцем у поле, змінити обстановку, яка дедалі більше занепадала згори. Йому це здавалося смішним - немає нічого більш буденного, ніж свіжозібране поле, порожній простір, що простягався на всі боки.\n\nАле він щось вловлював у ньому. Тут він не бачив нічого, і в той же час все - свій дім, свої поля, і навіть вдалині своє місто. Роздумуючи далі, Данилові спало на думку, що це чудова метафора - чи не такою стала Україна? Великим полем, зібраним у небуття?\n\nВін зупинився. Це поле не було знищене - звісно, роки німецьких вимог залишили на ньому надлишок врожаю, його статус монокультури та постійна потреба у нарощуванні виробництва. Проте ця земля все ще була придатною для обробітку. Наступного року, якби Данило і Галина прожили ще один рік, вони виростили б ще один урожай і знову побачили б зернове поле.\n\nМожливо, це більш оптимістична метафора для України, так, але фаталістична в своїй основі. Це поле було побудоване для збору врожаю. Данило мусив молитися, щоб Україна не була такою ж.\n\n«Як я робив, так і буду робити, буду робити як завжди, так здається, і буде»."
 UKR_UCW_characters.12.a: "«Це все, на що я здатен?»"

 ## 7.5 - ПОСТ-УГВ ІВЕНТИ ##
 # РОЗРОБКА ОЧІКУЄТЬСЯ
 
 ## 7.5.1 ПОСТ-УГВ ІВЕНТИ ПЕРСОНАЖІВ
 
 # РКУ
 UKR_post_UCW_characters.1.t: "Проклятий, щоб ти робив, або не робив"
 UKR_post_UCW_characters.1.desc: "Дощовий черв'як перед Богданом звивався. Танцював він чи тонув? Богдан ніколи не міг сказати, навіть у дитинстві, коли він спостерігав, як вони спливають на поверхню після доброї зливи, і дивився на них нескінченно, не маючи чим зайнятися, окрім цього.\n\nТемрява не давала змоги розгледіти щось за межами канави, в якій він сховався, лише примарні обриси дерев. Сонце зайшло, і він не міг ризикувати, розпалюючи вогонь так близько до німецького табору. Він відчував себе так, ніби плив у просторі, маючи лише двох супутників - дощового черв'яка і мертвого вартового. Він відчував глибоку самотність, бо навіть його справа не могла втішити його тепер, мертвого і похованого, як і всі кліки, між якими він метався після поразки. Німець був молодший за нього, і це викликало у нього дивне відчуття, що роки минають за лічені хвилини. Раніше німці були його ровесниками або й старшими. Він стільки часу провів у боях, що час не спливав, але ось він тут: чоловік, який сидить біля трупа хлопчика.\n\nБогдан здригнувся, відчуваючи себе так, ніби його вдарили ножем у живіт. Його муки голоду посилювалися, і він не міг сказати, чи була біль у хворій нозі меншою чи більшою. Останній раз, коли він намагався полювати, його помітили, він впав з пагорба і пошкодив ногу. На щастя, він німцю, який з ним боровся, проломив череп. Вартові та табори були скрізь, крастися більше не було можливості, единий вихід був перекусити в таборі. Якщо він хотів поїсти, то мав би влаштувати засідку в таборі розвідників або з'їсти дощових черв'яків.\n\nВін вважав, що може це зробити, але його нога може повністю відмовити. Тож він знову запитав: що боліло сильніше - нога чи голод? Кожен з них лише відтягував неминуче, бо завтра його роздутий живіт все одно буде порожнім, незалежно від того, чи їстиме він мізерну табірну їжу, чи черв'яків. Його нога все одно буде марною, незалежно від того, залишиться він на місці чи ні. До кінця року він би все одно помер, незалежно від того, воював би він чи ні, але ще троє німців загинули б, якби він воював."
 UKR_post_UCW_characters.1.a: "Він узяв свою гвинтівку."

 UKR_post_UCW_characters.2.t: "Нема вибуху..."
 UKR_post_UCW_characters.2.desc: "Галина Носенко йшла чужою землею. Її батьківщина здавалася їй спогадом з часів хаосу, боротьби та надії. Звільнені ще вчора землі були спотворені і перекручені. Місто, яке вона колись могла називати своїм, більше не існувало.\n\nУкраїнський прапор, який колись так гордо стояв, майорів відтоді, як УНРА прийшла до її міста, був зірваний з древка. Галина бачила, як він лежав, залитий бензином, поряд з іншими знаменами надії та українськими написами. Німецькі солдати вилили на нього останню каністру і запалили сірник, а натовп навколо нього радісно вітав своїх німецьких рятівників. Натовп був рідшим, ніж зазвичай. Так багато загиблих.\n\nНімецький пропагандистський фургон затріщав мовою, яку Галина, на жаль, знала, але ледве могла розібрати, що в ньому говорилося. «Громадяни України, сьогодні... жидо-більшовизм... викорінено з вашої землі... райхскомісаріят відновив порядок...»\n\nЛюди навколо неї не були сповнені гніву чи люті - вони просто продовжували сліпо плескати в долоні. Їй хотілося крикнути в обличчя кожному українцеві, який її оточував: «Вставай і борись - ми не можемо дозволити німцям перемогти!»\n\nАле вони вже перемогли - було надто пізно. Все, що вона могла зробити, це піти до своєї халупи, перш ніж відчай поглине її повністю."
 UKR_post_UCW_characters.2.a: "...є тільки скиглення."
 
 UKR_post_UCW_characters.3.t: "Більше не наше"
 UKR_post_UCW_characters.3.desc: "Коли троє Ван Норденів подивилися на свій старий будинок, Антонія нахилилася до сина з втомленою, виснаженою усмішкою. Вона сказала синові, що вони вдома, нарешті вдома, подивилася йому в очі поглядом, в якому відчувалася слабкість і вимогливість. Вона міцно тримала його за руки.\n\nКоли Ван Нордени увійшли, вони були шоковані, побачивши будинок таким повним. Килими і меблі залишалися на своїх місцях. У каміні все ще лежали поліна. Перед ними стояла маса предметів, яких вони ніколи не бачили.\n\n«Все так, як казав офіцер, - пробурмотів Пітер - бандитська окупація». Він втупився в меблі з гримасою, ніби перевіряючи це. Він схопив з підлоги маленького різьбленого орла, перш ніж на його обличчі промайнув вираз жаху - різьблення зачепило його. Він впустив його. «Це все має піти».\n\nМаркус втупився в маленьку різьблену фігурку і схопив її. Це було щось, чим він міг би володіти, хотів би володіти. Вона не була витонченою чи стрункою - окремі шматочки були чітко помітні. Але він був вирізьблений з такими широкими і розпростертими крилами, що можна було справді уявити, як він летить. Коли Маркус перевернув орла на спину, він побачив ім'я, написане незрозумілими йому письменами.\n\nАнтонія вирвала різьблення у Маркуса і поклала руку йому на плече. «Не хвилюйся, сину. Погані люди вже пішли»."
 UKR_post_UCW_characters.3.a: "«Вони більше не повернуться»."
 
 # УНРА
 
 UKR_post_UCW_characters.4.t: "Більше ніякої біганини."
 UKR_post_UCW_characters.4.desc: "«Це він?» сказав офіцер Усенко, схрестивши руки, дивлячись на неохайного молодого чоловіка в камері відділку. Незважаючи на вік, його обличчя було виснаженим, з ріденькою борідкою та кудлатим темним волоссям. Він був дуже худий, його комуністична форма висіла на кістках, як одяг опудала. Він дивився на тріщину в стіні важким поглядом з прикритими повіками.\n\n«Так він сказав. Я завжди уявляв його трохи... страшнішим,» - відповів шеф Зеленко, - «У новинах про нього говорили, як про бугімена. Психічно хворий, підступний покидьок, замаскований під таємницю.»\n\n«Я думав, що він буде молодшим. Якимсь хлопчиськом, який не знав, у що він вляпався,» - додав офіцер Дудник.\n\n«Коли я бігав з УНРА, вони публіцизували його. Ми всі хотіли бути людиною, яка ледь не вбила Коха,» - відповів Усенко, - «думали, що він буде вищим.»\n\nБогдан нічого не відповів, навіть коли міліціянти говорили про нього. Замість цього він сів на одне з розкладачок, прислухаючись до розмови і дивлячись на міліціонерів. Він не виглядав ні наляканим, ні сумним, ні розлюченим. Він виглядав втомленим. Ще трохи потеревенивши між собою, один з них нарешті визнав полоненого: «Навіщо взагалі здаватися? Ти міг би просто сховатися, або продовжувати воювати з нами.»\n\nБогдан вперше подивився йому в очі, його голос був хрипким: «Я ховався роками. Вбивство німців було єдиним, що робило переховування вартим того. А тепер з ким я воюю? Українцями. Я не можу цього зробити.»\n\n«Ти ж знаєш, що вони можуть тебе вбити,» - сказав Усенко.\n\n«І що?» запитав Богдан. Це були його останні слова цієї ночі, коли він впав на ліжко і вперше за майже десять років добре відпочив."
 UKR_post_UCW_characters.4.a: "Це більше не кошмар."
 
 UKR_post_UCW_characters.5.t: "Політика за обіднім столом"
 UKR_post_UCW_characters.5.desc: "«Стусова кмітливість? Ви, мабуть, жартуєте, Галино. Василь Стус - це дитина! Він був у пелюшках, коли прийшли німці.»\n\n«Наче Дзюба - це якийсь мудрець! Подивіться правді в очі - це вибори між дітьми, ми просто зобов'язані вибрати кращого. Я підтримую того, хто зможе дати відсіч німцям.»\n\n«То нам треба зішкребти дно бочки для союзників? Яка низька думка про наш великий народ!»\n\nСміх продовжився, коли Галина почала подавати вечерю. З початку виборчого сезону в родині Носенків не вщухали ці дебати, кожен з них агітував за свою улюблену партію. Кожен також допомагав агітувати за свою сторону, як міг: Данило - читанням, а Галина - кампанією від дверей до дверей.\n\nКоли Галина ставила бануш на обідній стіл, Данило дивився на неї із задоволеною посмішкою. Наскільки яскравіше він виглядає зараз, подумала вона, активний і відкритий після стількох років, коли він закривався в собі все щільніше і щільніше. Навіть його обличчя, колись таке напружене і вічно стурбоване, здавалося вільним і виразним. Він був старший, ніж будь-коли, але вона ніколи не бачила його таким живим. Які чудові дні для них обох."
 UKR_post_UCW_characters.5.a: "«Ніяких більше дебатів, Даниле. Давай їсти!»"
 
 UKR_post_UCW_characters.6.t: "За столом"
 UKR_post_UCW_characters.6.desc: "День закінчився черговою вечерею, яку з'їли в тиші. Після закінчення війни Пітер ван Норден не знав, як пояснити свою поразку родині, а Антонія була надто зайнята тим, що може зробити з ними Республіка. Сім'я перебувала в невизначеності, їхнього будинку в селі вже давно не було, а тимчасове житло могло бути зобране державою будь-якої миті.\n\nАле щойно Пітер пішов, вона поспішила у вестибюль квартири і стала чекати. Добрих півгодини вона сиділа і молилася, молячись і про те, щоб чоловік прийшов, і про те, щоб він був позбавлений приниження своєю присутністю.\n\nПерша її надія справдилася, а друга - ні. Чоловік з'явився невдовзі, одягнений у перероблену українську допоміжну форму і з посмішкою. Він розмовляв німецькою, але лише на ходулях. На його закоті були синьо-жовті нашивки, зроблені нашвидкуруч. Це був українець, і якась гірка частина душі Пітера насміхалася над кожною його скороминущою добротою до нього. Це істота, яка зруйнувала твою країну.\n\nАле Пітеру потрібна була стабільність, потрібна була безпека, як би далеко йому не довелося пробиратися. Відбулася невелика розмова - гроші в обмін на захист. Українець назвав хабар «пожертвою для співаторів». Пітеру нічого не залишалося, як посміхнутися і погодитися.\n\nПісля того, як чоловік нахилив козирок і зник, Пітер з соромом повернувся до своєї квартири. Молячись до сили, яку він не міг визначити, він з гордістю думав про руйнування, які може принести німецьке вторгнення."
 UKR_post_UCW_characters.6.a: "Як ці солдати зітруть цю потворну сторінку."
 
 # УСРР
 
 UKR_post_UCW_characters.7.t: "Миролюбна трава"
 UKR_post_UCW_characters.7.desc: "Ліс залишався незворушним, навіть коли Богдан прокрадався по ньому, як незваний гість, порушуючи невідомий спокій, яким йому вдавалося насолоджуватися в хаотичній землі. Проте цей непроханий гість поводився шанобливо, просуваючись крізь листя, не зачепивши жодної гілочки. Але, можливо, це було зроблено не з поваги, а зі страху.\n\nВийшовши з густих проміжків між деревами, Богдан опинився на галявині. Це був б лише короткий фарс з-поміж зелені, що його оточувала, якби не те, що він залишив його вразливим, а й легко вловлюваним неозброєним оком. Він намагався швидко рухатися, але його охопив страх, коли він почув швидкий шелест листя, що наближався позаду нього. «Не рухайся!» Пронизливий крик з глибини лісу паралізував Богдана. Мозок усіма фібрами своєї істоти кричав йому бігти до пагорбів, але ноги лише опустилися на коліна, піднявши руки над головою. «Якщо ти зробиш будь-який різкий рух, ми відкриємо вогонь». Один з них вийшов у поле зору Богдана, з червоною пов'язкою на руці. «Стій». Богдан, незважаючи на страх, швидко порився в кишенях - хапаючись за медаль, бо партизани націлилися на нього. Він повернув руки в повітря, коли його червона зірка ковзнула по травинках. Партизан підняв пам'ятку, щоб оглянути її: «Богдан Антоненко?» Богдан кивнув, сподіваючись, що його не назвуть злодієм чи брехуном. «Ви герой». Це було слово, яке він не очікував почути від них. «Як тобі, в біса, вдалося вижити так довго? Повертайся з нами на вантажівці. Ми повернемо тебе до цивілізації». Богдан пішов за чоловіками назад. Куди - він не знав, але там було точно краще, ніж тут."
 UKR_post_UCW_characters.7.a: "Тимчасовий відпочинок у похмурому світі."
 
 UKR_post_UCW_characters.8.t: "Погляд в її очах"
 UKR_post_UCW_characters.8.desc: "Вантажівка зупинилася на ґрунтовій дорозі, що вела до ферми. З кузова виліз батальйон з десяти-двадцяти солдатів оливкового кольору і попрямував до будинку Носенків. Висунувши голову на ґанок, Данило кинув погляд у бік джерела ритмічного тупоту чобіт і побачив на вантажівці червоний прапор.\n\nЦе був не той прапор, який він знав двадцять років тому, але було абсолютно очевидно, що цього разу його розгорнули ті ж самі люди.\n\n«Національне визволення»? «Нове життя при комунізмі»? Останні двадцять років він був достатньо свідомим, щоб розуміти, що їхні обіцянки не тільки неспроможні перед загрозою неминучого відродження німецького гегемона, але й що нічого, окрім нещастя, не приніс той самий червоний прапор, коли він востаннє майорів над золотими полями України. Замість того, щоб витрачати свій власний час на їхню маячню, він попрощався і повернувся всередину.\n\nГалина, піднявшись зі свого дерев'яного стільця, стояла і дивилася, як група солдатів наближається до них. Зачарована їхньою мрією про вільну, визволену Україну, вона чекала, поки вони підійдуть до неї, несучи листівки та подарунки. Чи це юнацький оптимізм молодої жінки, що вела за собою команду визволителів, переконав її у протилежному? Рішучість у погляді молодого лідера була настільки зворушливою, настільки сильною була відданість цих молодих бійців своїй справі, що це сколихнуло в ній почуття, якого вона не відчувала в собі вже дуже давно."
 UKR_post_UCW_characters.8.a: "Надія."
 
 UKR_post_UCW_characters.9.t: "Втрачений рай"
 UKR_post_UCW_characters.9.desc: "«Мамо, куди нас везуть?»\n\nАнтонія стиснула м'яку від поту тривоги руку сина. Маркус, розгублений, хоч він і не досягнув когнітивної зрілості, необхідної для розуміння ненормальності подій, що відбуваються в таких надзвичайних обставинах, і хоч чітко усвідомлював, що Україна, а отже, і його дім у вогні, ніколи не віддав би свою сім'ю на милість цих повстанців. Тут, у таборі для інтернованих, вони були так далеко від дому, так далеко від безпеки. Поспіхом стерті свастики на стінах житлових приміщень і плями на місцях, де колись були прибиті німецькі вивіски, чітко ідентифікували це місце як колишній табір для рабів, хоча протікаючі труби на стелі активно ремонтували ремонтні бригади.\n\nЗ розмов і гомону інших полонених можна було зрозуміти з характерних німецьких мов, що в таборі містилися голландські та німецькі фермери, так само як і самі Ван Нордени. Перш ніж мати встигла підсолодити свою відповідь достатньою кількістю білої брехні, щоб утримати Маркуса слухняним, комісар табору привернув увагу в'язнів, оголосивши сильно акцентованою німецькою мовою:\n\n«Ви зібрані тут до подальших вказівок, а землі, на яких ви колись мешкали, звільнені і тепер мають бути реорганізовані для денацифікації. Поки ми не вважатимемо за потрібне звільнити вас, ви залишатиметеся на перевихованні.»\n\nОбличчя Пітера було блідим, як привид. З його вуст виходили батьківські інстинкти, заспокійливі обіцянки, що Ватерлянд залишився позаду. Що це лише питання часу, коли вермахт повернеться і відновить порядок. Що вони будуть врятовані з лап бандитів. Проте він не міг змусити себе повірити в це до кінця і незабаром замовк, залишивши Антонію тихо втішати Маркуса голландською мовою.\n\nПітеру залишалося тільки шкандибати по периметру воріт, спостерігаючи, як олив'яні чоловіки презирливо і насуплено дивилися на нього, коли він проходив повз них. Однак було зрозуміло, що єдине, тримало його сім'ю в живих - це їхній статус прославлених заручників."
 UKR_post_UCW_characters.9.a: "Хоча в глибині душі він відчував полегшення, що це не УПА."
 
 ### УПА
 
 UKR_post_UCW_characters.10.t: "Зброя у нічого"
 UKR_post_UCW_characters.10.desc: "Богдан здригнувся, побачивши, як зі свіжої подряпини на щоці по його частково поголеному обличчю у відображенні на склі стікає кров. Це було більше схоже на викинуте бічне дзеркало від автомобіля, яке він знайшов і прикріпив до дерева. Зі старого шматка металу вийшла погана бритва, але це було єдине, що можна було зробити. Закінчивши гоління, він бризнув кілька крапель води з фляги на своє кошлате волосся і провів по ньому пальцями.\n\nОн кинув погляд убік на свою нашивку УСРР і форменну куртку, що лежали на землі, і притрусив їх черевиком бруду. Як не дивно, йому більше пасувало пальто, яке він носив як утікач, ніж те, яке він носив як солдат. Повернувшись до дзеркала, він виглядав майже як інша людина. Він з трепетом згадав, що сталося кілька ночей тому. Він знайшов свого товариша, чоловіка приблизно його віку на ім'я Андрій, і вони кілька ночей йшли разом, об'єднавши ресурси та обмінюючись історіями. Коли їхні запаси почали вичерпуватися, Андрій пішов на нерозумний ризик і підійшов до патруля з вигаданою історією про те, що він заблукав у поході. Вони навіть не дали йому договорити. Вони були надто захоплені вбивством комуніста, щоб помітити, як Богдан побіг до лісу.\n\nБоротися вже було ні з ким. Куди б він не пішов, його розшукували, і не було більше окупанта, від якого можна було втекти. Лише власні земляки, одержимі якимось збоченим мстивим духом. Його погляд блукав осінніми полями, на яких незабаром збиратимуть урожай, до фермерського будинку, першого з багатьох, що всіяли поля навколо ламаного горизонту міста, яке відбудовувало себе наново. Одному з них, напевно, потрібна робоча рука, подумав він, коли наближався, залишивши позаду неглибоку могилу партизана Богдана.\n\nВін продирався крізь зерно до вхідних дверей, піднімаючись по скрипучих сходах і постукуючи кісточками пальців по потрісканому дереву і облупленій фарбі. Двері прочинилися, і він зіткнувся зі старезним фермером. «Доброго дня, пане, я Артем», - сказав Богдан."
 UKR_post_UCW_characters.10.a: "«Я шукаю праці.»"
 
 UKR_post_UCW_characters.11.t: "Непрохані гості"
 UKR_post_UCW_characters.11.desc: "Данило Носенко почув агресивний стукіт у двері, який викликав болючі спогади. Принаймні, наступний наказ був не німецькою мовою, як у його кошмарах. Холодний комфорт. Він підвівся, але не для того, щоб відчинити двері, а для того, щоб не дати Галині зробити це першою. Вона залишилася на дивані, відчайдушно намагаючись утримати себе від того, щоб не схопитися за зброю. Стукіт продовжувався, і від кожного разу Данилові мурашки бігли по спині, але він тримав себе в руках. Двері відчинилися, як тільки їх відімкнули, і увійшов чоловік у формі сержанта ОУН(б). Він холодно посміхнувся подружжю, коли його загін увійшов всередину, озброєний, безсловесний і похмурий.\n\n«Данило Носенко?» - запитав офіцер. Він не став чекати відповіді, продовжуючи: «Нема про що турбуватися, звичайний обшук. Тут висока діяльність УНРА. Тому зайвої обережності не може бути.» Один з військових міліціонерів відкрив шухляду з такою силою, що вона ледь не впала. Данило поклав руку на плече Галині, щоб утримати її на місці, і сів поруч. Вона кинула на нього благальний погляд, на який він зміг відповісти лише похитуванням голови.\n\n«Знаєш, мені здалося, що я впізнала це ім'я. Ти писала вірші. Ви колись писали вірші?» запитав сержант. Один із чоловіків, обертаючись, збив зі столу склянку, помітивши, як скрипнула дошка на підлозі. Данило взяв Галину за руку. Сержант продовжував говорити: «Здається, я дещо читав. Я навіть можу назвати себе фанатом. Гарна проза, сильний зміст». Двоє солдатів почали колупати дошку, аж поки вона не тріснула, розкидавши тріски по вітальні Носенків. Лідер вмостився без запрошення, а інші нарікали, що досі нічого не знайшли. «Мені здавалося, що іноді вони були трохи м'якими, ставлячись до України як до голуба. Я б сказав, що Україна - це більше лев». Солдат з легким дзенькотом поклав намисто в сумку. Галина випросталася, змусивши Данила обійняти її, відчуваючи, як вона тремтить від люті. «Ну, мені треба йти. Не лізь у халепу, Носенко, я знаю таких, як ти. Може, ще вірш напишеш.»"
 UKR_post_UCW_characters.11.a: "«Гаразд, наступний будинок.»"
 
 UKR_post_UCW_characters.12.t: "Життя після війни"
 UKR_post_UCW_characters.12.desc: "«Послухай, Маркусе. У кожній нації...»\n\n«Треба йти, родино. Немає часу.»\n\n«Сину, в будь-якій нації, навіть сильній і гордій, бувають часи заворушень і зла, тих, хто не хоче, щоб такі люди, як ми, процвітали. Ось чому ми повинні піти. Пам'ятайте, що я вам казав - сидіть тихо і не розмовляйте німецькою, поки ми не перетнемо кордон.»\n\nМаркус тримав у руках сумку, коли його сім'я завантажувала свій Фольксваген. Він не розумів, що відбувається, але старався з усіх сил. Його батько і мати знову сперечалися, шепотілися про дороги, їжу і мости. Він почув важливу частину: «На північ до Остланду, а потім до Пройссену. У Пройссену ми будемо в безпеці». Він небагато знав про Пройссен, але розумів, що це означає, що тут вони не в безпеці. Він подивився на обличчя батька, Пітер не зміг приховати гримасу.\n\nВін не зміг - не зміг - осмислити цей момент тоді. Він осмислив його пізніше, в машині пізно вночі, коли батько вів машину, а мати нервово оглядала узбіччя. Він дивився у пасажирське вікно і бачив лише темряву та зорі."
 UKR_post_UCW_characters.12.a: "Без місячного світла."

 ## 7.6 - ІВЕНТИ УКРАЇНСЬКО-ПОЛЬСЬКИХ ВІДНОСИН ##

