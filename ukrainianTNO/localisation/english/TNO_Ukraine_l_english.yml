 UKR.consumption_cycle.a: "Зрозумів."
 UKR.consumption_cycle.a.exploitation_deficit: "\n§RЗниження§! виробництва зерна було зафіксовано в усіх регіонах, що пов'язано з рівнем §Rопору§! у кожному регіоні."
 
 UKR_consumption_cycle_desc_section_1_1: "Подальша механізація сільського господарства, збалансування потреб і виробництва корінних українських фермерів, а також загалом сприятливі погодні умови сприяли неймовірно успішному виконанню експортної квоти на зерно від Німечччини. Райхскомісаріят намагатиметься розвинути ці успіхи в наступному циклі - і дуже висока ймовірність що йому доведеться це зробити, оскільки нинішній успіх може лише посилити німецькі очікування щодо майбутнього виробництва."
 UKR_consumption_cycle_desc_section_1_2: "Незважаючи на спроби подальшої механізації сільського господарства та збалансування потреб і обсягів виробництва українських селян, зростання продуктивності було недостатнім. Райхскомісаріяту доведеться подвоїти свої зусилля, щоб забезпечити виконання майбутніх квот, оскільки німці матимуть підвищені очікування після цієї невдачі."
 UKR_consumption_cycle_desc_section_1_3: "Незважаючи на зусилля, спрямовані на модернізацію сільського господарства та задоволення потреб українських фермерів, ці зусилля виявилися недостатніми перед обличчям величезної німецької квоти. Райхскомісаріят повинен вжити негайних заходів для усунення цього недоліку, оскільки в майбутньому можна очікувати посилення тиску з боку Німеччини. Україна стоїть на порозі німецької інтервенції, і подальше ігнорування корінних українців робить їх готовими до повстання в будь-який момент."
 
 UKR_consumption_cycle_desc_section_2_1: "Вища продуктивність цього циклу та управління розподілом зерна призвели до того, що місцеві потреби задовольняються з комфортом, а місцеві жителі тепер відносно добре харчуються, через що вони продуктивні та здорові. Це, ймовірно, сприятиме подальшому зростанню виробництва зерна і полегшить регіональний розвиток та експорт."
 UKR_consumption_cycle_desc_section_2_2: "Продуктивність поточного циклу та управління розподілом зерна ледь задовольнили місцеві потреби, внаслідок чого місцеві жителі ледь нагодовані, а деякі з них перебувають на межі недоїдання. Це, ймовірно, перешкоджатиме виробництву зерна і ускладнить регіональний розвиток та виконання експортних квот."
 UKR_consumption_cycle_desc_section_2_3: "Продуктивність поточного циклу та управління розподілом зерна не змогли задовольнити місцеві потреби, в результаті чого місцеве населення недоїдає і бореться за виживання. Це, ймовірно, перешкоджатиме виробництву зерна і зробить виконання майбутніх квот на регіональний розвиток та експорт майже неможливим."
 
 UKR_consumption_cycle_desc_section_3_1: "Регіональний розвиток у поточному циклі був неймовірно успішним, значно перевершивши очікування тих, хто перебуває в Німеччині. Оскільки в Німеччині більше вірять у майбутнє адміністрації, в Україну, ймовірно, надійде більше інвестицій, що зміцнить подальші перспективи Райхскомісаріяту. Більше поселенців також переїдуть на цю територію, приносячи з собою багатство, а також більш лояльних німецьких громадян, що заглушить вплив непокірних українців."
 UKR_consumption_cycle_desc_section_3_2: "Хоча регіональний розвиток відповідав очікуванням Німеччини в поточному циклі, це було зроблено через силу. Україна все ще обтяжена ризиком не виправдати очікування в наступному циклі, що потенційно може призвести до майбутніх неадекватних німецьких інвестицій і пов'язаного з цим скорочення німецького поселення."
 UKR_consumption_cycle_desc_section_3_3: "Регіональний розвиток у поточному циклі не виправдав очікувань Німеччини. Багато хто в адміністрації побоюється, що полетять голови, якщо така неадекватна політика триватиме. Дуже ймовірно що несприятливе ставлення Німеччини до колонії, призведе до скорочення необхідних інвестицій і поставить під загрозу стабільність в Україні. Райхскомісаріят також отримає менше поселенців, оскільки чутки про проблеми адміністрації поширюватимуться..."

