 UKR_UCW_gotenland_envoy: "Надішліть посланця до Ґотенлянду"
 UKR_UCW_gotenland_envoy_desc: "Уряд Ґотенлянду наразі збирає власний захист, але за допомогою об'єднаної кампанії ми могли б зробити більше. По-перше, нам потрібно зв'язатися з ними. Маючи лояльного і високопоставленого посланника, ми можемо сподіватися, що зможемо відкрити дипломатичні канали."

 UKR_UCW_gotenland_aid: "Зверніться за допомогою до Ґотенлянду"
 UKR_UCW_gotenland_aid_desc: "З відкритою дипломатією з Ґотенляндом ми можемо просити про більше. Хоча вони, скоріш за все, відмовляться надсилати свої війська, допомога все одно допоможе нам протриматися довше - і тим самим врятує їх від битви."

 UKR_UCW_reach_out_bulgaria: "Зверніться до Болгарії"
 UKR_UCW_reach_out_bulgaria_desc: "Нам потрібні ресурси, щоб вижити. Болгарія, з її слов'янським походженням і монархічною адміністрацією, навряд чи є нормальним союзником, але це надійний союзник, стабільний після десятиліть служби. Якщо вони зможуть надати допомогу через Ґотенлянд, це дозволить нам протриматися довше."

 UKR_UCW_reach_out_turkey: "Зверніться до Туреччини"
 UKR_UCW_reach_out_turkey_desc: "Нам потрібні ресурси, щоб вижити, а з огляду на стан виробництва, наші можливості створювати запаси продовольства вкрай обмежені. А от у Туреччині їжі вдосталь. Наразі вона не є союзником німців, але якщо ми зможемо отримати їхню допомогу в ім'я стабільності на континенті, нам буде краще."

 UKR_UCW_reach_out_romania: "Зверніться до Румунії"
 UKR_UCW_reach_out_romania_desc: "Якщо ми шукаємо ресурси в інших країнах, то найкращим варіантом для нас буде Румунія, яка має причини допомагати нам, давати нам їжу і має давні зв'язки з Райхом. Вона може очолювати майже демократичну країну, але це не означає, що вони не побачать причини."

 UKR_UCW_RK_reach_out_italy: "Зверніться до Італії"
 UKR_UCW_RK_reach_out_italy_desc: "Війна може знайти союзників у найнесподіваніших місцях. Італія може бути нашим ворогом, але вони розуміють наші страждання - вони пережили революцію і відчувають її наслідки навіть зараз. Вони, безумовно, матимуть ресурси, щоб допомогти. Найбільшою перешкодою є створення дипломатичних каналів - але оскільки наші посланці в Німеччині практично не працюють, вони можуть допомогти і тут."

 UKR_PU: "Ми §Gотримаємо§! §Y1§! £tt_prod_unit Виробничу одиницю(і)"

 ### 8.4 - РІШЕННЯ ДОЛІ ###
 UKR_destiny_category: "§CПрихильність долі§!"
 UKR_destiny_category_desc: "\n\n\n\n\n\nДля багатьох §MУкр§!§Yаїна§! є житницею Європи, наповненою гниллю та цвіллю, що по вінця просякнута гниллю. Плоди родючого ґрунту, можна було б очікувати, що §MУкр§!§Yаїна§! процвітатиме за часів Совєцького Союзу і, принаймні, переживе Райх. Але тепер це цвинтар, заповнений мільйонами мертвих, а разом з ними поховані їхні мрії.\n\nМрія про вільну республіку, розчавлена, не встигнувши зробити свій перший подих. Мрія про націонал-комунізм, знищена в бурі Барбаросса. Мрія Степана Бандери, що загинула так само, як і він. Мрія про націонал-соціялізм, що швидко розкладається.\n\nЦі мрії мертві, чи не так? Одному з них буде надано другий шанс. Шанс визначити долю України. Яку долю оберете §Oви§!?\n\n§CДоля§! прихильна до: [GetUKR_destiny_favorite]."
 UKR_destiny_favourite_0: "§RНікого§!"
 UKR_destiny_favourite_UKR: "£UKR_reichskommissariat §jРайхскомісаріяту Україна§!"
 UKR_destiny_favourite_FUK: "£UKR_pg §DУкраїнської національної революційної армії§!"
 UKR_destiny_favourite_UKS: "£UKR_communists §SУкраїнської Соціалістичної радянської Республіки§!"
 UKR_destiny_favourite_BOV: "£UKR_UPA §sОрганізації Українських Націоналістів - Бандерівці§!"
 
 UKR_destiny_pick_UKR: "Доля £UKR_reichskommissariat §jРайхскомісаріяту Україна§!"
 UKR_destiny_pick_UKR_desc: "Територія, відома під назвою «Україна», є лише частиною великого задуму. Німецький народ, що століттями перебував у пастці темряви, прокинувся за словом фюрера - він простягнув руки і пройшов через усю Європу в пошуках простору, необхідного для процвітання своєї нації. Вони знайшли його тут, в Україні, на її золотих полях і під її блискучим небом.\n\nСвободи України - це свободи, які Німеччина прагне їй дати. Майбутнє України - це той шлях, який пропонує Німеччина. Він може бути добрим, він може бути жорстоким, але знайте, що це правда: доля України не є її власною."
 UKR_DEC_destiny_pick_UKR_tt: "§OВи§! стежитиме за історією £UKR_reichskommissariat §jРайхскомісаріяту Україна§!.\n\nДоля не обмежуватиметься абзацами."
 
 UKR_destiny_pick_FUK: "Доля £UKR_pg §DУНРА§!"
 UKR_destiny_pick_FUK_desc: "Україна ніколи не була вільною, по-справжньому, протягом сотень років. Найближче до свободи наша держава підійшла у 1917 році, у тому короткому проблиску свободи від росіян, німців та деспотів. Часи Грушевського були нашими найкращими днями, але вони втрачені для історії, і навіть це поступово забувається.\n\nЮрій Горліс не має хибних уявлень про те, що станеться, якщо революція знову буде зламана на спині большевіків і нацистів, і сповнений рішучості зробити так, щоб цього більше ніколи не сталося. Якщо республіканці переможуть, свобода повернеться в Україну. Тільки час покаже, як вона буде збережена."
 UKR_DEC_destiny_pick_FUK_tt: "§OВи§! стежитиме за історією £UKR_pg §DУкраїнська національно революційна армія§!.\n\nЧи є щастя лише вічним, недосяжним міражем?"
 
 UKR_destiny_pick_UKS: "Доля £UKR_communists §SУСРР§!"
 UKR_destiny_pick_UKS_desc: "Російська революція 1917 року була найбільшою подією, що сталася зі Східною Європою у 20-му столітті, і завдяки їй Україна пережила найбільшу націонал-комуністичну революцію нашого часу. Від дозволу Бухаріним програм «українізації» до посиленого управління північнокубанськими регіонами, здавалося, що Українська Соціялистична Радянська Республіка знайшла відносний золотий вік миру і процвітання, незважаючи на повзучу централізацію до Москви.\n\nТепер, однак, Україна лежить розбита, пограбована і в кайданах. Олександр Шумський, тепер де-факто лідер УСРР, здається, впевнений, що звільнить Україну під оксамитовим прапором націонал-комунізму. Як вона виживе після цього, залишається тільки здогадуватися."
 UKR_DEC_destiny_pick_UKS_tt: "§OВи§! стежитиме за історією £UKR_communists §SУкраїнська Соціялістична Радянської Республіка§!.\n\nЩо таке надія, як не прагнення до мрії?"
 
 UKR_destiny_pick_BOV: "Доля £UKR_UPA §sОУН-Бандерівців§!"
 UKR_destiny_pick_BOV_desc: "Після смерті Коновальця Україна знала лише ганьбу та поразки. Справжні націоналісти об'єдналися під прапорами Бандери, щоб отримати удар в спину від Мельника та його поплічників. Справжні патріоти Української Повстанської Армії занурювалися в бруд і хоробро переносили найсуворіші зими заради справи свого батька.\n\nУльтранаціоналіст Дмитро Клячківський переконається, що воля Бандери буде виконана за будь-яку ціну, бо революція безкомпромісна, а нація гостро потребує дисципліни. Його лють скупає Україну у вогні для третьої і останньої спроби перемоги, але як довго буде горіти вугілля ненависті, залежить від долі."
 UKR_DEC_destiny_pick_BOV_tt: "§OВи§! стежитиме за історією £UKR_UPA §sОрганізація українських націоналістів - Бандерівців§!.\n\nНасильство - це милиця для слабких, щоб здаватися сильними."
 
 UKR_MIS_destiny_timer: "§CПрихильність долі буде виконана§!"
 UKR_MIS_destiny_timer_timeout_tt: "§CДоля§! не любить §Oнерішучих§!. Якщо §Oви§! дозволите §Rтаймеру§! добігти кінця - не прийнявши жодного з §YРішень§! вище - §CДоля§! вибере одну з фракцій, щоб продовжити гру§!."

 ### 8.5 - BREADBASKET GERMANY INTERACTIONS DECISIONS ###
 UKR_bb_germany_category: "Вимоги §oҐерманії§!"
 UKR_bb_germany_category_desc: "Ґерманія хоче зерна та розвитку\n\nМи виробляємо [?UKR_total_grain_output] зерна цього врожаю, [?UKR_grain_need] якого нам знадобиться, щоб адекватно прогодувати наше населення.\n\n§oҐерманія§! вимагає [? UKR_BB_Germania_grain_demand] зерна цього врожаю.\n\n[Get_UKR_GermaniaDemand_grain_outcome_GER]\n\n[Get_UKR_GermaniaDemand_grain_outcome_UKR]\n\nМи також повинні задовольнити вимоги §oҐерманії§! щодо економічного розвитку. Нам потрібно, щоб загальний рівень розвитку всіх регіонів був щонайменше [?UKR_BB_Germania_Demand_total_development_level_demand]."

 UKR_GermaniaDemand_grain_outcome_positive: "§GУкраїнці будуть належно нагодовані цим врожаєм.§!"
 UKR_GermaniaDemand_grain_outcome_neutral: "§YУкраїнці ледве зможуть прогодувати себе цим врожаєм.§!"
 UKR_GermaniaDemand_grain_outcome_negative: "§RУкраїнці будуть голодувати з цим врожаєм.§!"

 UKR_GER_GermaniaDemand_grain_outcome_positive: "§GУ нас більш ніж достатньо зерна, щоб задовольнити потреби §oҐерманії§! догоджаючи §oРайху§!.§!"
 UKR_GER_GermaniaDemand_grain_outcome_neutral: "§YУ нас достаньо зерна, щоб задовольнити потреби §oНімеччини§!.§!"
 UKR_GER_GermaniaDemand_grain_outcome_negative: "§RУ нас не вистачає зерна, щб задовольнити вимоги §oНімеччини§! §oРайх§! у люті.§!"

 UKR_BB_Germania_Demand_tt: "Жнива закінчаться, і ми отримаємо наступні ефекти:"

