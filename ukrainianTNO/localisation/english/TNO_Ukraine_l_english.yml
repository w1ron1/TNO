 UKR_Fritz_Freitag: "Фріц Фрайтаг"
 UKR_Ernst_Ludwig_Leyser: "Ернст Людвіг Лейзер"
 UKR_Hans_Adolf_Prutzmann: "Ганс-Адольф Прюцманн"
 UKR_Gerhard_Schroder: "Герхард Шредер"
 UKR_Hermann_Hocherl: "Герман Хьохерль"
 UKR_Karl_Stumpp: "Карл Штумп"
 UKR_Yevhen_Ziblikevich: "Євген Зиблікевич"
