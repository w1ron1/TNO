 Supply_GUI_introduction_normal: "Ситуація в Україні погіршується, продовольства стає дедалі менше, оскільки поля спалені, а традиційні ланцюги постачання перервані в хаосі війни. Наші солдати змушені заробляти собі на прожиток, відбираючи їжу у місцевих жителів на будь-якій невеликій території, яку ми можемо контролювати. Якщо їжа закінчиться, а врожай виснажиться, ми не матимемо жодного шансу продовжувати наші зусилля."
