 UKR_POL_relation.2.t: "Перший крок уперед"
 UKR_POL_relation.2.desc: "Горліс відкинувся на спинку крісла, спостерігаючи за розмовами своїх посланців між собою та Польськими колегами. Земельні дебати розпочалися досить сердечно, але поляки чекали на пропозицію його делегації, а посланці сподівалися, що він підтримає їхні ідеї.\n\nКультуралісти хотіли повного і негайного повернення Галичини. Це був радикальний підхід, який, безсумнівно, негайно зіпсував би переговори, особливо з більш націоналістично налаштованими елементами Польської делегації. Однак люди на батьківщині поділяли його мрію про вільну Україну, і вони очікували, що він виконає цю обіцянку. Чи була цілісність України важливішою за мир?\n\nОб'єднані борці як альтернативу запропонували дозволити Полякам висунути свої вимоги. Надання полякам контролю над земельними переговорами стало б основою миру між двома народами, але вони завжди могли б зловживати запропонованою їм щедрістю, а люди вдома теж не хотіли б підкорятися. Чим би він був готовий пожертвувати заради співпраці? \n\nНарешті, Співавтори оприлюднили свою пропозицію - продовження статус-кво. Вони були єдиними, хто, схоже, були зацікавленими у досягненні взаємовигідної угоди, пропонуючи додати пункт про торгівлю землею, щоб заспокоїти своїх колег-посланців. Однак їхня історія співпраці та готовність працювати з німцями могли майже одразу завадити переговорам. Чи був компроміс навіть вартий тих ризиків, які він тягнув за собою?\n\nГорліс підвівся зі стільця з легким стогном. Жоден з варіянтів не був особливо привабливим, але він не міг залишитися, щоб особисто наглядати за делегацією. Вибори вдома, в Києві, вимагали його уваги, тож він мав зробити вибір. Якій партії він міг довіряти, що вона принесе найкращий результат для України?"
 UKR_POL_relation.2.a: "Культуралісти, за цілісність Батьківщини!"
 UKR_POL_relation.2.b: "Об'єднана Боротьба, за єдність братів!"
 UKR_POL_relation.2.c: "Співавтори, за привітність і компроміс!"

 UKR_POL_relation.3.t: "Галицькі ворота"
 UKR_POL_relation.3.desc: "Дипломати української делегації сиділи за круглим столом, займаючись дрібними справами в очікуванні інструкцій. Володимир Бондаренко з Культуралістів витирав окуляри об сірий плащ. Ліворуч від нього Володимир Савчук з фракції Об'єднаної боротьби грався зі своїм коротким комірцем, а потім знову поправляв його. Праворуч від нього Іван Лещенко оглядав свою краватку, а потім з легкою посмішкою послабляв її. Спокійна тиша в кімнаті була перервана, коли у двері увірвався головний дипломат Василь Стус і зайняв своє вільне місце.\n\n «Президент Горліс зажадав від нас, щоб суверенітет України був збережений, і тому вся Галичина повинна бути повернута нам негайно», - оголосив Стус, виймаючи папки зі свого портфеля. Зал наповнився неспокоєм, делегати перешіптувалися між собою. Світло люстри в кімнаті на мить потьмяніло, коли запалали десятки цигарок. Савчук скривився, кусаючи власну сигару: «Поляки нізащо на це не погодяться. Це призведе до ще більшого кровопролиття,» - пробурмотів Савчук.\n\n«Я мушу погодитися. Я хотів би, щоб наші товариші знову нас обійняли, але це виглядає... нахабно,» - додав Лещенко.\n\n«Дурниці, друзі! Подумайте про Польщу і Галичину, як...» Бондаренко затрубив перед паузою, - «як про мишу з сиром! Ми хочемо якнайбільше, але якщо ми попросимо замало, то ми отримаємо мало. Миша або залишить нам весь сир зі страху, або поділиться з нами достатньою кількістю, щоб зробити нас щасливими. Якщо ми візьмемо усе ми у виграші!»\n\n«Чого я боюся, Володимире,» - зітхнув Савчук, - «це усе тому, що поляки не миші, а перевдягнені щури.»"
 UKR_POL_relation.3.a: "Щури, які вже кусали нас раніше."

