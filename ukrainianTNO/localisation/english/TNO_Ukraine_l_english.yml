 # СЕКЦІЯ ЗЕРНА
 UKR_BB_consumption_header: "ЗЕРНО\nСПОЖИВАННЯ"
 UKR_BB_consumption_x_axis: "КІЛЬКІСТЬ ЗЕРНА"
 UKR_BB_consumption_tooltip: "§FЯк на §MХліб§!§Yниця§! §oРайху§!, На нашу адміністрацію покладаються великі сподівання щодо адекватного постачання нашого врожаю зернових до кінця кожного циклу споживання. Однак ми також повинні пам'ятати про власні потреби в зерні, щоб забезпечити достатнє харчування для нашого населення.\n\nКожного циклу споживання ми повинні задовольняти §oпопит на експорт§! з боку Німеччини, який буде мати пріоритетне значення. Крім того, ми також повинні споживати певну кількість зерна, щоб тримати людей нагодованими. Зерно буде зібрано з наших врожаїв у §Gциклі§!, а також з будь-яких запасів, перенесених з §Yпопереднього врожаю§!.\n\nБільше того, §oНімеччина§! також очікує, що наша адміністрація буде належним чином опікуватися розвитком регіону. Наприкінці кожного циклу споживання від регіонів Райхскомісаріяту очікується певний рівень §DРозвитку§!\n\n§RНевиконання будь-якої з цих вимог і потреб призведе до жахливих наслідків.§!§!"

 UKR_BB_consumption_stocks_tt: "§FЗапаси §fзерна§! на кінець цього циклу споживання є такими:\n£UKR_consumption_stockpile  Запаси зерна з §Yпопереднього врожаю§!: [?UKR_BB_consumption_grain_STOCKPILE|f0]\n£UKR_consumption_gain  Зерно, що буде зібрано §Gцього циклу§!: [?UKR_total_grain_output|f0]\n--------------\nДо загальної кількості §Y[?stockpile_total]§! §fЗерна§! яке буде використано в цьому циклі. §fЗерно§! не використане в циклі споживання, буде додано до §Yзапасу§! наступного циклу.§!"
 UKR_BB_consumption_demands_tt: "§FЗапаси §fзерна§! §Rпотрібні§! до кінця цього циклу споживання є наступними:\n£UKR_consumption_demands  §oҐерманські§! експортні потреби: [?UKR_BB_Germania_Demand_grain|f0]\n£UKR_consumption_needs  Зерно необхідне для §MУкраї§!§Yнців§!: [?UKR_BB_local_grain_needs|f0]\n--------------\nДо загальної кількості в §R[?demands_total]§! §fзерна§! необхідно для цього циклу.\n\nВідправка §fзерна§! до наших §oНімецьких§! господарів стоїть на першому місці, §MУкраї§!§Yнці§! отримають те що залишиться.§!"

