 ### 8.5 - Інші рішення ###

 UKR_crimea_reconquest_category: "Німецькі залишки"
 UKR_crimea_reconquest_category_desc: "Після нескінченної і запеклої боротьби над нами сходить сонце - настає світанок. Але наше визволення не буде повним, доки вся Україна не звільниться від німецького чобота. На південь від нас НСДАП намагається асимілювати території Херсонщини та Криму, об'єднавши їх у вигаданий «Ґотенлянд». Їхні слова нічого не значать проти єдиного почуття нації - ця земля є нашою, як це було протягом століть. Наші брати по той бік Дніпра мають бути звільнені, а їхні засоби до існування відновлені. Німецькі поселенці, туристи і спекулянти можуть запанікувати і розбігтися, але українці, що залишилися, зрештою зможуть побачити мир. "
 UKR_Core_Crimea: "Реінтегрувати Крим"
 UKR_Countdown_To_Invasion: ""§mМи переправимось через Дніпро,§! §Yта увійдемо в історію.§!""


