 ### Ideas ###
 YOR_idea_shield_against_socialism: "Щит проти соціалізму"
 YOR_idea_shield_against_socialism_desc: "Кілька років тому, коли між камерунцями та німці спалахнули запеклі зіткнення на кордонах, багато малих націй скористались цим відволікаючим маневром, аби повстати й уникнути панафриканської тиранії. Серед цих націй, Йорубаленд - найсильніший і найкраще озброєний, тільки він і залишився: здобутий жорстокістю, умитий кров'ю друзів і ворогів.\n\nНаша рішучість зміцнена ненавистю до комуністичного імперіаліста Муміє, який прагне повного винищення й асиміляції нашого народу та всіх мешканців Західної Африки. Їхнє небажання посилати свої армії проти нас хіба доводить те, що вони бояться наших солдатів. Дійсно, ми захищаємо решту заходу Африки від камерунських псів: бо якщо ми впадемо, решта регіону піддасться обов'язково."
 YOR_idea_benevolent_dictatorship: "Добродійна диктатура"
 YOR_idea_benevolent_dictatorship_desc: "Акінтола — мудра людина, і фасад свободи, яку приносить демократія, він бачить наскрізь. Воля народу — отруєний келих; вибори - лише спосіб для іноземних загроз поставити Йорубаленд на коліна через фракціоналізм і сумнівний вплив. Політики, великі обманщики, що прагнуть тільки здобути владу й славу, жодного інтересу до нації не мають — лишень до своїх банківських рахунків. Ці люди й безпеку нації продадуть, якщо за це дадуть їм ще одну монету. У народу, що оточений іноземними загарбниками й потребує єдності, політики не можуть керувати країною, або вони її зруйнують.\n\nАкінтола - не Гітлер чи Муссоліні, та він справді вірить в вільний і процвітаючий Йорубаленд — країну, якою керують люди честі та вміння, які прагнуть зробити націю багатою й рівною. Хоча самі люди можуть не засідати в уряді, неможливо заперечити, що Акінтола враховує інтереси своїх громадян."