 ## Leader Descs ##
 POLITICS_LADOKE_AKINTOLA_DESC: "Не завжди Йорубаленд був вільним. Він здобув свою незалежність від гніту камерунських панафриканістів, і ключем до його початку став Ладоке Акінтола. Коли група генералів і офіцерів піднялась, щоб покінчити з соціялістичним режимом у його неньці, використовуючи зіткнення з Центральною Африкою за ідеальний момент - Акінтола став їхнім лідером і постаттю. Під його командуванням камерунців вигнали, і з того часу Йорубаленд зміг відбити всі нападки з їхнього боку для відновлення втрачених земель. І нації заходу Африки вдячні за це, адже вони захищені від панафриканістів і можуть продовжувати жити в мирі.\n\nПроте ситуація не така осіяна й оптимістична в самому домені Акінтоли. Люди його поважають, і вдячні йому за його захист узбережжя від будь-яких іноземних загроз. Нехай він може бути диктатором, та аж ніяк не є жорстоким чи мілітаристом, а править з милістю над своїми громадянами. Деспотизм цей, однак, рано чи пізно доведеться закінчити. Авжеж, останнє, чого він хоче - передача влади соціялістам, навіть в випадку того, що він сам впроваджує політику, дивовижно схожу на їхню. Створили систему соціяльного забезпечення, а ще надали чимало свобод. Щодо справжніх виборів - то складне питання для Акінтоли. Можливо, декілька обраних партій могли б брати участь в виборчому процесі. Але як він може бути впевненим, що його наступникам вдасться втримати країну разом, не вручивши узбережжя Йорубаленду на руки ворогам? Ні, він не певен щодо цього, а тому встановлення демократії буде, мабуть, не таким простим. Наразі Акінтола задоволений продовженням свого правління тут, бодай якщо лише для втримування ворогів подалі."

