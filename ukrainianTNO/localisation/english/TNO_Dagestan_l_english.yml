 ### Characters ###
 DAG_Rasul_Gamzatov: "Расул Гамзатов"

 ## Leader Descs ##
 POLITICS_RASUL_GAMZATOV_DESC: "Расул Гамзатович Гамзатов виріс спадкоємцем давньої родинної та культурної традиції музики й літератури; його батько був традиційним аварським ашугом. Попри сільське походження, він зміг здобути освіту й став директором театру в Хунзасі. Але коли війну було програно, а нацисти окупували великі міста, Гамзатов був змушений тікати назад до рідного села. Німці не бажали безпосередньо правити сільською місцевістю, натомість вдавалися до бомбардувань і час від часу здійснювали рейди, щоб захоплювати нових рабів для своїх шахт. Музика, театр і поезія були одними з небагатьох речей, що давали проблиск щастя, і Гамзатов прагнув дати це своєму народу.\n\nПід час Західноросійської війни Гамзатов спрямував свої сили на пропаганду та вербування в гірських селах для Закавказької радянської партизанської групи. Завдяки його словам тисячі вступили до її лав і з готовністю вирушили в бій із новими поставками західноросійської та казахської зброї. Мало хто повернувся, але ті, хто повернувся, казали, що раді були боротися за гідну справу. Роки після Західноросійської війни були особливо важкими, оскільки жорстокий райхскомісар Йозіас наполягав на тому, щоб не виявляти до місцевих жодної пощади. Гамзатов майже не мусив докладати додаткових зусиль до своїх промов, адже в кожному селі десятки чоловіків зголошувалися добровольцями щойно він відкривав рот.\n\nСмерть Йозіаса принесла нові можливості аварським партизанам, які охоче захоплювали міста й винищували німців по всій своїй батьківщині. Коли постало питання про створення цивільного уряду, багато хто звернувся до людини, яка надихнула їх на боротьбу від самого початку. Гамзатова покликали очолити людей, яких він колись вербував, і він узявся за це завдання з жартом, що має цінний досвід керівництва, отриманий під час постановки театральних вистав. Але чи зможе він гарантувати виживання аварців, чи завіса вже близько до свого падіння?"
