COS_Rafael_Calderon_Fournier: "Рафаель Кальдерон Фурньє"
POLITICS_COS_RAFAEL_CALDERON_FOURNIER_DESC: "Справжня іронія полягає в тому, що Коста-Рикою тепер править такий чоловік, як Рафаель Кальдерон. Народившись у 1949 році, коли його батько переховувався у вигнанні в Нікарагуа, він виріс у Мексиці, все ще залишаючись значною мірою в тіні та поступово готуючись стати потенційним спадкоємцем на той випадок, якщо його батько зрештою повернеться до Коста-Рики. Коли це сталося, він здебільшого залишався поза увагою громадськості, лише-но завершуючи навчання, коли родина повернулася до Сан-Хосе.\n\nПісля повернення Кальдеронів до Коста-Рики для Рафаеля напрочуд мало що змінилося: він продовжував перебувати в тих самих колах і дотримуватися тих самих переконань. Він почав навчатися в Університеті Сан-Хосе, але обрання Теодоро Пікадо-молодшого та дедалі більше відчуження комуністів у Партії національного відродження змусили його батька відмовитися від ролі простого ляльковода. Використовуючи свої зв'язки, Рафаель був обраний президентом молодіжного крила PRN, перетворивши цю посаду на стартовий майданчик для майбутнього входження в політику.\n\nТепер, коли його батько хворіє, Кальдерона-молодшого змусили вийти на передній план для своєї коронації на кілька років раніше, ніж очікувалося. За відсутності справжньої опозиції — як у його партії, так і в Коста-Риці загалом — і поки сила його батька ще не ослабила хватку над Партією національного відродження, його контроль здається гарантованим. Але Рафаель молодий, корумпований і практично не має досвіду. Коли його батько нарешті відійде, йому доведеться рухатися вперед наосліп. Можливо, навіть назустріч власній загибелі."
COS_Alejandra_Calderon_Fournier: "Алехандра Кальдерон Фурньє"


COS_Frank_Marshall: "Френк Маршалл Хіменес"
POLITICS_COS_FRANK_MARSHALL_DESC: "Народжений під час землетрусу в Пунтаренасі у 1924 році, Френк Маршалл Хіменес прожив життя, позначене розломами більше, ніж більшість людей. Походячи з елітної політичної родини, він був сином американського геолога та власника шахти, якого вбили сандиністи. Його вітчимом був німецький іммігрант, і в 1936 році Маршалл вирушив разом із ним до Німеччини. Отримавши фізично виснажливе виховання, Маршалл приєднався до Гітлер'югенду, але згодом залишив його, щоб вивчати інженерну справу в Університеті Коста-Рики.\n\nАле з початком Другої світової війни активи його родини були конфісковані, а самого його інтернували, тож після звільнення Маршаллу залишилося лише керувати кафе. Приєднавшись до Хосе Фігереса, він влаштував різанину серед кількох кальдероністів, а згодом став героєм війни, відбивши цілий підрозділ, маючи лише один кулемет. Але на цьому його кар'єрне піднесення зупинилося через його спротив участі інших іммігрантів у Карибському легіоні. Натомість він задовольнявся постійними відрядженнями для придушення кальдероністів по всій Центральній Америці.\n\nПісля успіху кальдероністів він ненадовго опинився у вигнанні, але переворот Карлоса Луїса Фальяса та Партії народного авангарду знову вивів його на передній план. Організувавши чергове ополчення з фашистів і реакціонерів, він рушив на Сан-Хосе та захопив владу для себе. Тепер Маршалл освоюється на своєму новому троні. За підтримки фашистських режимів по всьому континенту Маршалл цілком може отримати шанс закріпити своє правління."
COS_Carlos_Luis_Fallas: "Карлос Луїс Фальяс"
POLITICS_COS_CARLOS_LUIS_FALLAS_DESC: "Мабуть, цілком доречно, що життя Карлоса Луїса Фальяса було настільки насиченим подіями. Позашлюбний син гангстера, народжений у 1909 році, «Калуфа» став старшим із семи дітей, коли його мати вийшла заміж за збіднілого шевця. Його забрали зі школи, щоб він працював на різних роботах, а хвороба в підліткові роки ледь не забрала його життя. Радикалізований примірником «Маніфесту комуністичної партії», який дав йому друг, він став одним із головних організаторів коста-риканських лівих, неодноразово потрапляючи до в'язниці, аж поки його підтримка Кальдерона під час громадянської війни в Коста-Риці не привела його до вигнання.\n\nУ вигнанні Фальяс звернувся до поезії. Але з поверненням Рафаеля Кальдерона-старшого до влади відбулося й відродження Партії народного авангарду. Правий дрейф відновленого режиму обурив його крило партії, а висунення Теодоро Пікадо-молодшого як маріонетки Кальдерона — спроба відсунути їх убік — виявилося фатальним. Використавши зростаючі вуличні демонстрації та союзників, які перейшли на його бік, Фальяс захопив владу й знову відправив каудильйо Кальдерона у вигнання.\n\nФальяс тепер при владі, але його хватка обмежена. Через величезний вплив соціал-демократів PLN та анти-кальдероністських елементів PRN він очолює широкий політичний блок, який значно поміркованіший, ніж йому хотілося б. І все ж фашистські ополчення активізувалися, заявляючи про здобутий новий імпульс і регулярно нападаючи на воєнізовані формування PVP. Поки навколо нього згущуються хмари, а над Коста-Рикою знову нависає тінь війни, дехто замислюється, чи зможе Калуфа втриматися при владі."
COS_Humberto_Vargas_Carbonelli: "Умберто Варгас Карбонельї"
COS_Rodolfo_Cerdas_Cruz: "Родольфо Сердас Крус"

# Ideas
COS_Pura_Vida: "Пура Віда"
COS_Pura_Vida_desc: "У кожному селі Коста-Рики, у кожному будинку Сан-Хосе та на кожній фермі біля річок можна почути привітання «¡Pura Vida!». Його переклад? Насправді його просто немає; дехто каже, що воно означає «Оце життя!» або «Усе чудово!», але незалежно від мовного бар’єра воно втілює невимушену, спокійну атмосферу країни.\n\nПісля 1948 року та Громадянської війни армію було скасовано, і відтоді Коста-Рика живе в умовах стабільної та мирної демократії. Не було ані переворотів, ані деспотів, ані каудильйо. Натомість тут панує скромне, просте врядування над землею щасливих і мирних людей. Економіка процвітала, культура розквітала, а оскільки загроза армії так довго не турбувала людей, немає жодних причин перейматися настільки радикальною зміною країни. Наскільки можна передбачити майбутнє, життя в Коста-Риці й надалі буде справжньою Пура Відою."
COS_Bodegon: "Бодегон"
COS_Bodegon_desc: "Кальдерон повернувся — і разом із ним повернулася його програма. Та хоча можна було б побоюватися, що Коста-Рика повернеться до старих суспільних норм, це було б помилкою. Кальдерон може бути ким завгодно, але його дивна форма прогресивізму є однією з його визначальних рис. Ці реформи повернулися, але саме вони не є отрутою, що душить націю. Натомість нею є особистість та риторика самого Кальдерона.\n\nКостариканське суспільство розривається по швах. Крайня поляризація, що роздирала країну до 1948 року, починає повертатися. Тепер партії бачать одна в одній смертельних ворогів, тоді як Кальдерон обходить закони нової держави, яку успадкував. Бойовики PRN патрулюють вулиці разом із поліцією, фактично утворюючи армію в країні, де її немає. Можливо, соціальні реформи Кальдерона не знищать країну, але очевидно, що саме він розриває костариканське суспільство на частини."
COS_Pura_Muerte: "Пура Муерте"
COS_Pura_Muerte_desc: "У стінах Конгресу політики PLN та PRN кричать один на одного, принижують одне одного, а іноді навіть б'ються. На вулицях противники Кальдерона та його маріонетки Пікадо страйкують на знак протесту проти їхнього удаваного демократичного правління. Наступного дня прихильники президента грабують підприємства та будинки тих, хто страйкував.\n\nЯкщо поглянути на Коста-Рику, то єдине, що відрізняє сьогоднішній день від часу напередодні Громадянської війни 1948 року, — це те, що фотографії в газетах тепер кольорові. Демократія в Коста-Риці померла. Пікадо править як маріонетка Кальдерона, виголошуючи порожні промови, поки стерв'ятники Конгресу бенкетують над демократичною конституцією республіки. Тим часом люди б'ються на вулицях, а ополчення починають формуватися для захисту своїх прихильників. Лише час покаже, чи знову прийде війна на землю «Пура Віди»."
COS_Vida_Despues_de_la_Muerte: "Ель Мас Ая"
COS_Vida_Despues_de_la_Muerte_desc: "Коли народ Коста-Рики зібрався біля своїх радіоприймачів і телевізорів, очікуючи на результати виборів, ніхто не міг передбачити їхнього результату. Можна було б пробачити припущення, що переможе Кальдерон, що його політичну машину неможливо зупинити, якщо тільки країну знову не охопить громадянська війна. Проте, коли результати виборів було оголошено, президентство знову здобули Хосе Фігерес Феррер і Партія національного визволення.\n\nКартковий будинок Кальдерона зруйнувався, а його прибічники зачинилися у своїх будинках або втекли до сусідніх країн. Тепер Фігерес мусить відновити суспільну тканину Коста-Рики та повернути гідність найстабільнішій демократії Центральної Америки. Американський посол залишиться без відповіді на свої вимоги, кишені промисловців спорожніють, а нація знову буде звільнена."
COS_Republica_Muerta: "Республіка Муерта"
COS_Republica_Muerta_desc: "Поки пересічний костариканець займається своїми щоденними справами, у газетах країни з'являється нове оголошення. Кальдерон, найвідоміше ім'я в країні, що не дивно, знову переміг на виборах. Чесно чи нечесно — це вже не має значення; опозиція лежить у руїнах у Сан-Хосе. Мало того, що Кальдерон переміг на виборах, він ще й зумів ухвалити нову конституцію.\n\nТепер Третя республіка постає свідченням персоналістського правління в Коста-Риці. Десятиліття поваги до правління попередників вилетіли у вікно: обмеження термінів перебування при владі скасовано, Збройні сили відновлено, а закони, що гарантували чесність і стійкість виборчої системи, зникли одним підписом. Республіка Фігереса зникла, стерта під оплески натовпу, що скандує лише одне ім'я: Кальдерон Гвардія."
COS_Comunismo_Criollo: "Кріольський комунізм"
COS_Comunismo_Criollo_desc: "Вулицями Сан-Хосе разом крокують найбідніші робітники, колишні члени PRN та PLN, формуючи новий комуністичний уряд Коста-Рики. Подібно до дивно прогресивної, але неліберальної демократії Кальдерона, комунізм у цьому куточку тропіків має власне, суто костариканське обличчя.\n\nЗахопивши владу в країні без армії, костариканський комунізм постає дивно інклюзивним і демократичним явищем, позиціонуючи себе як продовження стабільних та заснованих на участі традицій нації, але вдосконалене завдяки «соціально-економічному контексту». У міру того як ідеологічний розвиток Коста-Рики робить ще один крок уперед, лише час покаже, чи перетвориться він на щось набагато радикальніше за те, що революція принесла народу."
COS_Black_Spot_of_the_Tropics: "Чорна пляма тропіків"
COS_Black_Spot_of_the_Tropics_desc: "Френк Маршалл не з чуток знає, що таке війна. Народжений у Коста-Риці в заможній німецькій родині, у юності він був відправлений до Німеччини, де став членом Гітлер'югенду. Коли він повернувся, Кальдерон ув'язнив його та його родину в концентраційному таборі. Потім почалася Громадянська війна, і він приєднався до соціал-демократичної Армії національного визволення — принаймні кращої за комуністів-кальдеристів.\n\nКоли комуністи захопили його країну, він зрозумів, що саме йому доведеться її врятувати. Його противники засуджують його як фашиста, звинувачують у тому, що він продав свою країну Трухільйо та Парагваю, принісши тропікам нову чорну пляму. Але він із цим не погоджується. Для нього він звільнив свою країну й нарешті приніс їй свободу та гідність, яких вона так довго була позбавлена. Тепер Коста-Рика католицька, без комуністських прибічників Кальдерона, і вільна — без тих, хто міг би її стримувати."
COS_PUN_Against_the_World: "ПУН проти всього світу"
COS_PUN_Against_the_World_desc: "Після 14 років правління фігеристів Партія національної єдності прийшла до влади, аби приборкати соціал-демократичні крайнощі, запровадивши фіскальний консерватизм і додавши трохи поміркованості до шквалу законів, що виходять із Сан-Хосе. Її члени сповнені рішучості, але опинилися між молотом і ковадлом. Вони можуть контролювати президентство, але законодавча влада та бюрократія перебувають під контролем фігеристської PLN.\n\nЦе залишає їх не більше ніж кульгавою адміністрацією, якщо люди взагалі сприймають їх серйозно. Вони можуть нарікати на витрати, які несе країна, на неможливість підтримувати весь соціальний добробут, що став визначальною рисою їхньої нації, і, можливо, навіть знайдуть більшість населення, яка з ними погоджується, але вони безсилі. Слова не можуть скасовувати закони — лише накази, а ПУН не має жодної можливості скасувати те, що вона обіцяла відмінити."
COS_Return_of_Figueres: "Повернення Фігереса"
COS_Return_of_Figueres_desc: "На подив майже нікому PLN знову взяла країну під свій контроль. А як могло бути інакше? Фігерес і його Партія національного визволення створили нову костариканську ідентичність, засновану на його власних політичних поглядах. Як взагалі якась партія могла знищити їхнє бачення країни? Тепер країна залежить від їхніх соціальних та економічних реформ, кульмінацією яких стало створення держави загального добробуту через економічний етатизм. Крім того, їхня партія відстоює суверенітет Коста-Рики, вступаючи в союз із обраними нею демократичними союзниками, а не під тиском чи за наказом.\n\nСправжнє диво полягає не в їхньому поверненні, а радше в їхній попередній поразці. Політична думка Фігереса всередині PLN є такою ж костариканською, як і «Пура Віда», і сам факт того, що вони були усунені від влади, справді вражає. Тепер, коли вони повернулися, навряд чи PLN коли-небудь знову добровільно відступить від влади."
COS_PLN_Government: "Уряд національного визволення"
COS_PLN_Government_desc: "На подив майже нікому PLN знову взяла країну під свій контроль. А як могло бути інакше? Фігерес і його Партія національного визволення створили нову костариканську ідентичність, засновану на його власних політичних поглядах. Як взагалі якась партія могла знищити їхнє бачення країни? Тепер країна залежить від їхніх соціальних та економічних реформ, кульмінацією яких стало створення держави загального добробуту через економічний етатизм. Крім того, їхня партія відстоює суверенітет Коста-Рики, вступаючи в союз із обраними нею демократичними союзниками, а не під тиском чи за наказом.\n\nСправжнє диво полягає не в їхньому поверненні, а радше в їхній попередній поразці. Політична думка Фігереса всередині PLN є такою ж костариканською, як і «Пура Віда», і сам факт того, що вони були усунені від влади, справді вражає. Тепер, коли вони повернулися, навряд чи PLN коли-небудь знову добровільно відступить від влади."
COS_PUN_Government: "Уряд національної єдності"
COS_PUN_Government_desc: "ПУН може бути не такою енергійною, новою чи популістською, як PRN або PLN, але вона набагато могутніша, ніж могли б собі уявити дрібні політики. ПУН складається з традиційної еліти Коста-Рики, чоловіків і жінок, які стояли на кордонах своїх плантацій і протягом поколінь спостерігали, як війни та генерали приходять і відходять. Ці еліти разом із традиційними політиками, які, своєю чергою, підтримують зв'язки з іншими землевласниками, створюють єдиний фронт проти ворожого й популістського кальдеронізму, а також надзвичайно дорогої ідеології PLN та Фігереса.\n\nВони є поборниками поміркованості, фіскальної відповідальності, боротьби з корупцією та консерватизму, водночас поважаючи традицію країни щодо гідної та мирної передачі влади. ПУН цілком відповідає американському баченню Латинської Америки й охоче приймає підтримку своїх друзів у Вашингтоні."
COS_Calderonismo: "Кальдеронізм"
COS_Calderonismo_desc: "Тепер легітимізована своїм поверненням до влади, персоналістська, прогресивна та неймовірно своєрідна ідеологія Рафаеля Кальдерона Гвардії повернулася до Коста-Рики й стала новим паразитом суспільства, вкорінюючись у політиці країни. Неприйнятна для традиційної еліти, коаліція Кальдерона об'єднує прогресивних католиків, палких комуністів та корумпованих, опортуністичних політиків. Цей тактичний союз проводить соціальні реформи та розширює систему соціального забезпечення, зберігаючи підтримку уряду серед народу, поки демократія повільно занепадає.\n\nВеличне ім'я Кальдерона може полонити серця й розум тих, хто користується плодами його реформ, але опозиція зайняла свої місця в Конгресі так, наче це окопи. Сповнені рішучості не дозволити кальдеристам знищити їхній демократичний проєкт, вони ведуть словесну війну, яка може виявитися недостатньою, аби зупинити мінливі течії Коста-Рики."
COS_Calderonismo_2: "Кальдеронізм"
COS_Calderonismo_2_desc: "Наче годинник повернувся до 1944 року в Коста-Риці, президентство очолив Теодоро Пікадо-молодший у країні Кальдерона, дозволивши Каудильйо правити з тіні. Хоча Пікадо й слугує своєрідною конституційною лазівкою, він усе ж має достатньо автономії, щоб пом'якшити радикальність кальдеристського проєкту. На вимогу своїх американських покровителів він відновив зв'язки з традиційною елітою Коста-Рики. Ціна угоди? Комуністи залишили PRN.\n\nЗазвичай американці були б у захваті, але це ставить під загрозу стабільність уряду, значну частину якого становили саме комуністи. Традиційні еліти можуть бути необхідними для управління, але їх ненавидять прихильники Кальдерона. Можливо, Пікадо менш провокаційний, але костариканське суспільство від цього не стало менш розділеним."
COS_Calderonismo_3: "Коста-Кальдериста"
COS_Calderonismo_3_desc: "Кожен, хто бував у пишних тропічних лісах Коста-Рики, скаже вам, що позбутися невпинного дзижчання комарів, які постійно рояться біля вуха, просто неможливо. Кожен у костариканському парламенті скаже вам, що це дзижчання не зникає, попри кондиціонери та дезінфекцію, — тільки ці комарі мають людський зріст і набувають форми депутатів опозиції.\n\nКальдеронізм укорінився як наріжний камінь костариканської політики. Тепер він заручився підтримкою кожної важливої групи інтересів у країні, тож домогтися чогось без схвалення або змащування долонь одного з їхніх чиновників буде надзвичайно важко. І підтримка надходить не лише зсередини країни, а й із Півночі — адже Кальдерон та його прибічники стали новітніми союзниками ОФН у його хрестовому поході проти фашизму. Кальдерон подбав про те, щоб його країна вже ніколи не була такою, як раніше, перетворивши її на Коста-Кальдеристу."
COS_The_Widest_Tent: "Найширший намет"
COS_The_Widest_Tent_desc: "Комуністична революція прийшла до Коста-Рики, але не так, як вона прийшла до Росії. Костариканський комунізм справді, здається, вірить у владу всього народу й у своїй унікальній формі прагне створити надзвичайно інклюзивний проєкт. Соціалістична «демократія» в країні охоплює дрібних землевласників, Церкву і навіть представників старого порядку. Проте ці представники дивляться в очі радикальнішим і відданішим комуністам геваристського та амазоністського спрямування.\n\nЗалишається лише гадати: чи зможе цей намет утриматися? Чи зуміють творці найновішого політичного проєкту Коста-Рики змусити консерваторів і геваристів сісти за один стіл і разом розділити хліб? Чи червоний намет зрештою обвалиться під власною вагою, залишивши країну в ще гіршому становищі, ніж раніше?"
COS_Free_Costa_Rica_Movement: "Рух за вільну Коста-Рику"
COS_Free_Costa_Rica_Movement_desc: "У країні без армії відкриття воєнізованих формувань усіх мастей у глибинці країни стало моторошним одкровенням. Уже було достатньо лячно, коли робітниче ополчення увійшло до Сан-Хосе, але потім з'явилася UCR. Френк Маршалл та його армія патріотів прославилися своєю завзятістю під час Громадянської війни 1948 року, але сумнівне минуле Маршалла за допомогою США не дозволило йому здобути справжню владу.\n\nА потім прийшли криптокомуністи, які перетворилися на більшовицьких покидьків, що взяли його землю в заручники. Тож він вирішив її звільнити: звільнити від американського впливу, звільнити від комуністської зради та від корумпованої, ненажерливої еліти. Подейкують, що їхні лідери навіть хочуть звільнити її від євреїв. Їхній дім більше не буде територією для навколишніх повстанців чи чужих ідеологій; ці люди присвятили себе звільненню Коста-Рики — хоч би що це означало."
COS_Looming_Calderonista_Threat: "Насувається кальдероністська загроза"
COS_Looming_Calderonista_Threat_desc: "Після війни 1948 року Кальдерон та його прибічники втекли в гори, побоюючись помсти з боку опозиції на тлі крайньої поляризації в країні. Роками ці люди перебували у вигнанні, не бажаючи нічого більше, ніж повернутися до своїх домівок. Поки Кальдерон сидить на своїх статках у Мексиці, його люди залишаються в Нікарагуа та за допомогою Сомоси почали організовувати й озброювати власне ополчення, як Фіґерес зробив майже два десятиліття тому.\n\nТепер це ополчення спостерігає за кордоном крізь густі джунглі й може лише уявляти гладку, вимощену дорогу до Сан-Хосе, що лише зміцнює їхню рішучість. Вони вступають у листування з представниками OFN та всіма, хто готовий пожертвувати кошти чи підтримати їхній рух. Поки що ці люди тренуються, а Кальдерон чекає слушного моменту, щоб завдати удару й повернутися до своєї країни, свого кабінету, свого президентського крісла."
COS_The_Democratic_Alliance: "La Alianza Democrática"
COS_The_Democratic_Alliance_desc: "PLN та PUN майже за одну ніч позбулися своєї влади, але надія ще не втрачена. Навіть неписьменний кампесіно міг би сказати вам, що фіґеристи з PLN не погодилися б абсолютно ні з чим із підтримуваною бізнесом PUN, але доля привела їх за один стіл переговорів. Їх об'єднує спільний ворог — Рафаель Кальдерон Гвардія.\n\nЦей хиткий альянс покликаний лише створити спільний фронт у парламенті — одному з останніх місць, де партії ще зберігають владу, хоча й вона поступово вислизає з їхніх рук. Їхня мета — блокувати його законодавчі ініціативи та настільки дестабілізувати його правління, щоб зрештою усунути його силою або, що бажаніше, за допомогою виборів. Лише час покаже, чи втримається ця коаліція, адже, кажучи просто, єдине, що вони ненавидять більше одне одного, — це Кальдерон."
COS_The_Democratic_Alliance_2: "La Alianza Democrática"
COS_The_Democratic_Alliance_2_desc: "Навіть неписьменний кампесіно міг би сказати вам, що фіґеристи з PLN не погодилися б абсолютно ні з чим із підтримуваною бізнесом PUN, але доля привела їх за один стіл переговорів. Їх об'єднує спільний ворог — тепер уже висхідна PRN.\n\nЦей хиткий альянс покликаний лише створити спільний фронт у парламенті, щоб не дозволити Пікадо-молодшому повернути Кальдерона до влади. Блокуючи законодавчий порядок денний президента, вони сподіваються загальмувати набір обертів PRN і не дозволити партії сплести чергову павутину корупції із Сан-Хосе. Лише час покаже, чи втримається ця коаліція, адже єдине, що вони ненавидять більше одне одного, — це Кальдерон."
COS_Representation_as_Pacification: "Представництво як засіб умиротворення"
COS_Representation_as_Pacification_desc: "Демократична традиція Коста-Рики забезпечує одну з небагатьох по-справжньому представницьких систем у регіоні. Її виборча система пропорційного представництва в Національній асамблеї покликана точно відображати волю народу в день виборів, але на практиці вона дає маргінальним партіям шанс отримати місце. Який сенс у цих чотирьох чи п'яти місцях? Дозволити екстремістам випустити пару.\n\nНадаючи їм можливість діяти в межах усталених правових і політичних рамок, політики Коста-Рики сподіваються, що ці непримиренні комуністи та фанатичні фашисти просто виснажаться від власних монологів. Випускаючи цю напругу, політики Коста-Рики сподіваються не допустити, щоб озброєні прихильники цих партій вдалися до тероризму або, що ще гірше, партизанської війни — загрози, з якою країна без армії не може дозволити собі зіткнутися."
COS_Vanguard_of_the_People: "Авангард народу"
COS_Vanguard_of_the_People_desc: "Під час обох президентських термінів Кальдерона PVP значною мірою позбулася суспільного тавра, яке комунізм мав у Латинській Америці, завдяки своєму стратегічному союзу з PRN та Церквою. У міру нормалізації свого становища партія поповнювала свої лави, а її популярність зростала по всій країні. Однак, коли до влади прийшов Пікадо, PVP була списана в рамках угоди з традиційною елітою, зрадивши роки компромісів і переговорів, яких особисто домагався Кальдерон.\n\nРезультат? Тепер Пікадо змушений читати заголовки про страйки, побиття людей, пов'язаних з елітами, та загальні акції проти держави, організовані PVP. І це лише те, що відбувається відкрито, адже, за чутками, Національна поліція виявила сховища зброї в будинках радикальніших членів PVP, вселяючи страх у серця їхніх колишніх союзників."
COS_El_Pinza: "El Pinza"
COS_El_Pinza_desc: "З перемогою PLN вся країна колективно зітхає з полегшенням. Коста-риканську демократію врятовано від зовнішніх загроз, але PLN, попри свої переконання, залишається глибоко розколювальною організацією. Її повернення до влади після не менш розколюючих кальдерістів вкотре довело, що боротьба вогню з вогнем призводить до пекла.\n\n"Помірковані" починають поводитися як колишні екстремісти, постійно ображаючи своїх колег, тоді як радикали вже почали влаштовувати вуличні сутички між собою. Попри заклики залучити поліцію, PLN може лише сподіватися, що це полум'я згасне так само швидко, як і спалахнуло, і що новоявлені бойовики перегризуть одне одному горлянки раніше, ніж ситуація погіршиться."
COS_Anti_Calderonistas: "Антистабілізаціоністи"
COS_Anti_Calderonistas_desc: "Із остаточним зміцненням влади Кальдерона над політичним життям Коста-Рики останню загрозу їхньому правлінню було усунуто з боротьби за владу: комуністи, які тепер опинилися позбавленими політичних прав або за ґратами. Тепер залишилися лише уламки PUN та PLN, чиї часті бойкоти лише ще більше віддаляють їх від влади.\n\nОстанній бастіон опору базується в екстремістській Unión Cívica Revolucionaria, чисельність якої різко зросла після обрання Пікадо. Хоча вони слабкі, сама ідея цих "антистабілізаціоністів", як їх називає уряд, достатня, щоб вселити страх у значну частину Коста-Рики. Сенсаційні заголовки сіють страх перед терактами, а на них списують численні вбивства; схоже, що UCR стане виправданням для відновлення Кальдероном Збройних сил."
COS_The_Counterrevolution: "La Contrarrevolución"
COS_The_Counterrevolution_desc: "Після перемоги комуністичної революції в Коста-Риці заклики до співпраці та миру залишилися без відповіді. Надто завзяті бойовики насильницьким шляхом експропріювали найбільші маєтки країни, а ті, що залишилися в підвішеному стані, поспішили виписувати чеки та сприяти імпорту зброї для відверто фашистської Unión Cívica Revolucionaria — їхньої останньої відчайдушної надії проти комуністичного уряду.\n\nПоки найбагатші люди країни таємно фінансують свій антикомуністичний хрестовий похід, уряд отримує стимул розширити національне ополчення, щоб протистояти своїй новій загрозі: Контрреволюції. На вулицях Сан-Хосе панує тиша, якщо не рахувати поодиноких замінованих автомобілів, але в сільській місцевості точиться війна між двома фанатичними ворогами. Поки світ спостерігає, як земля "Pura Vida" занурюється в черговий епізод хаосу, він не може не замислюватися: хто переможе?"
COS_The_Internal_War: "La Guerra Interna"
COS_The_Internal_War_desc: "Хоча Френк Маршалл та його солдати переможно увійшли до столиці й закріпили свій контроль у коридорах влади Коста-Рики, це зовсім не означає, що вони виграли війну. Ні, до цього ще дуже далеко.\n\nУ міських нетрях та глухих закутках сільської місцевості ховається нове покоління партизанів і повстанців. Профспілкові діячі, підозрілі селяни, ветерани війни 1948 року та все, що залишилося від комуністів, переховуються в тіні, граючи з Маршаллом у довгу. А Маршалл та його UCR не збираються покірно це терпіти; вони завдають удару у відповідь, а їхні так звані "ескадрони смерті" нишпорять країною в пошуках, як подейкують, повстанців, розпочинаючи свою нескінченну війну з внутрішнім ворогом — справжнім чи вигаданим. Із таким численним та невловимим ворогом, схоже, внутрішня війна не має справжнього кінця."
COS_Banana_Boom: "Бум після бананів"
COS_Banana_Boom_desc: "Як і в кожній країні Центральної Америки, головним продуктом Коста-Рики були банани — солодкі фрукти, завдяки яким США та їхня United Fruit Company міцно вчепилися в економіку країни. Однак відносна стабільність та ізольованість Коста-Рики ускладнювали UFC організацію переворотів чи встановлення диктатур, через що країна змогла вибудувати з компанією значно більш симбіотичні відносини.\n\nУ 1957 році Коста-Рика була змушена диверсифікувати свою економіку після того, як стала жертвою хвороб сільськогосподарських культур. Завдяки стабільному й компетентному уряду та відносно розвиненій інфраструктурі ця ініціатива мала шалений успіх. Виробництво інших сільськогосподарських товарів і навіть невелике промислове виробництво спричинили потік іноземних інвестицій, сприяючи формуванню середнього класу та піднесенню всієї країни. І справді, іншого способу це не описати: економіка переживає бум."
COS_Economy_a_la_tica: "Economía a-la-Tica"
COS_Economy_a_la_tica_desc: "Коли PVP прийшла до влади, почалася пропаганда, а вже потім прийшли зміни. Бойовики з'явилися з декретами про експропріацію, а великі маєтки було роздроблено та перерозподілено. Але кожен, хто знає Коста-Рику, розуміє: вона не наслідує жодної моделі, окрім власної. Землю перерозподілили не в колективні господарства, а в невеликі незалежні наділи, сподіваючись таким чином підвищити продуктивність. Промисловість і приватний бізнес також залишаються, але змушені дотримуватися довгого переліку правил і незграбно існують під загрозою "передачі підприємства працівникам" у будь-який момент.\n\nОднак у Коста-Риці не все гаразд. Комунізм залишається табу, а значна частина багатств країни намагається втекти за кордон, залишаючи Народну Республіку не просто з меншою кількістю "народу", а й зі значно меншими запасами готівки. PVP може лише сподіватися, що її ініціативи дозволять утримати і те, і інше."
COS_Fuerte_Grande_Y_Libre: "Сильна, Велика і Вільна"
COS_Fuerte_Grande_Y_Libre_desc: "Коли країна занурилася в хаос, Френк Маршалл мусить вдатися до радикальних заходів, аби відновити колись сильну економіку Коста-Рики. Надихаючись методами франкістів під час Громадянської війни, він розпочав відновлення з пропагандистського наступу, проголошуючи, що економіка Коста-Рики не просто повернеться до колишнього стану, а стане "сильною, великою і вільною".\n\nДружні режими вже схвалили великі позики, щоб допомогти країні привести себе до ладу, а елітам або надають державні контракти, або обіцяють податкові пільги, аби вони повернулися з вигнання. Уряд розгорнув масштабне будівництво, промислові ініціативи та амбітні проєкти заради престижу, сподіваючись не лише відновити економіку, а й повернути національну гордість. Та жодна кількість парків чи фонтанів не здатна приховати тліючі поля, які, здається, ніяк не згаснуть, або електричні лінії, які, здається, самі себе перерізають."

#Tooltips
COS_Calderon_Invasion_Avoided: "§GВторгнення Кальдерона успішно відвернуто, а демократія Коста-Рики в безпеці... поки що.§!"
COS_Influence_Election_Tooltip: "§YМи вплинемо на майбутні вибори на користь бажаного нам кандидата.§!"
COS_Calderon_Invasion_Arbitration: "§YВибір арбітражу дозволить нам захистити демократію Коста-Рики та поглибити наші відносини з країною.§!"
COS_Calderon_Invasion_Guaranteed: "§YДозвіл на вторгнення Кальдерона означатиме кінець демократії Коста-Рики в найближчій перспективі, однак забезпечить OFN гарантованим союзником у регіоні.§!"
COS_Calderon_Invasion_Possible: "§RПісля провалу переговорів у нас більше немає засобів впливати на Кальдерона. Долю Коста-Рики вирішить чиста випадковість.§!"
COS_Calderon_Increase_Negotiations: "§FЦе §Gпідвищить§! ймовірність успіху §Yпереговорів§! між §VФіґересом§! та §BКальдероном§!.§!"
COS_Calderon_Decrease_Negotiations: "§FЦе §Rзнизить§! ймовірність успіху §Yпереговорів§! між §VФіґересом§! та §BКальдероном§!§!."

#Events

 COS_forpol.2.t: "Завершити справу"
 COS_forpol.2.desc: "Сонце невблаганно палило доки Лімона, сухі дошки скрипіли й деформувалися під ритмічним тупотом важких чобіт. Іржавий вантажний корабель San Joaquín м'яко погойдувався біля причалу, поки група моряків поспішала завершити підготовку судна до відплиття. По той бік доків набережним вітром майоріли прапори Коста-Рики та Карибського легіону, утворюючи мінливий колаж із червоного та синього, до якого додавалися різнобарвні знамена Панамської цивільної гвардії, лівих студентських профспілок та місцевої поліції.\n\nКапітан Монтойя стояв на трапі, тримаючи в одній руці планшет, а в іншій — пістолет, уважно оглядаючи чергову групу солдатів, що підіймалася на борт. Більшість із них були новими обличчями: офіцери з міст, про які він ніколи не чув, широкоокі студенти університетів, яких часом вели їхні викладачі середнього віку, та зрідка обвітрені обличчя чоловіків, яких він міг лише припустити зарахувати до парамілітарних формувань.\n\nПоруч лейтенант Арая оглядав новобранців. "Багато зелених облич, капітане", — похмуро зауважив він. "Їм ще в школі вчитися."\n\nМонтойя не відреагував. "Ми були такого ж віку. Вони впораються." Він перевів погляд на дальній кінець причалу, де двоє старших чоловіків у вицвілих, забруднених багнюкою мундирах міцно обіймалися. Монтойя непомітно звернув увагу лейтенанта на двох ветеранів. Як і він, вони пережили криваві бої 1948 року на гаїтянському кордоні. "Бачиш, лейтенанте? Є тут і старі обличчя."\n\nДесь на кораблі над гамором чобіт пролунали вправні акорди гітари. Монтойя одразу впізнав марш Легіону. Його обличчя на мить проясніло, перш ніж він помітив, що біля дальнього кінця причалу білий американський агент сперечається зі спостерігачем від мексиканського уряду. Він насупився."
 COS_forpol.2.a: "Як і мрії, старі образи, схоже, не вмирають."

 COS_forpol.6.t: "Можливість"
 COS_forpol.6.desc: "Польовий офіцер Річард Колтон запалив кубинську сигару, спостерігаючи, як світанок забарвлює дахи Манагуа. Надворі вулиці пахли пилом і спекою. Він поглянув на розмиті фотографії, розкладені на столі, й перевів подих. Ознаки були очевидними: нелегальні поставки зброї, тренувальні табори на південному кордоні, дезертирство в армії — усе ретельно зібране в його звіті.\n\nКолтон викинув майже недокурену сигару, спостерігав, як вона згасла, й підняв радіо. "Сер, у нас тут розвивається тривожна ситуація. У мене є конкретні докази того, що Рафаель Кальдерон збирає тут армію для невідомої військової операції." Радіо зашипіло, поки Колтон відкинувся на спинку тісного офісного крісла, відчуваючи, як піт просочує майку. "Зараз він базується неподалік Сапоа. До цього причетні деякі нікарагуанські офіцери. Схоже, Сомоса заплющує на це очі або принаймні вдає, що нічого не знає."\n\nУ відповідь пролунала статика, а потім глухе клацання — лінія з'єдналася з іншого боку. Відповів низький, спокійний голос. "Десять-чотири, Річарде. Дані свідчать, що Кальдерон планує переворот, щоб відновити себе на посаді президента Коста-Рики. У Фіґереса тут є свої друзі, але він випробовує наше терпіння, особливо після історії з Маршаллом. Люди Кальдерона дають... тихі гарантії. Йому вдалося привернути увагу адміністрації."\n\nКолтон видихнув через ніс, знімаючи раптову напругу в грудях. "Вони планують пройти через Ла-Фортуну. Вони думають, що американці підхоплять їх і доправлять куди треба. Це наша офіційна позиція?"\n\n"Ні. Неофіційна. Ми не давали жодних обіцянок." Річард почув, як на іншому кінці лінії перегортають теку. "FBI вважає, що якщо все пройде гладко, з Кальдероном буде легше працювати. Поки що не виходь на контакт і залишайся на позиції. Якщо щось зміниться, ти дізнаєшся першим." Лінія замовкла."
 COS_forpol.6.a: "Він точно знав: щось зміниться."
 COS_forpol.6.b: "Старе геть, нове вперед."

 COS_forpol.7.t: "Протягнута рука з умовами"
 COS_forpol.7.desc: "Посол США Реймонд Теллес без попередження прибув до президентського палацу, послабивши краватку в спекотному Сан-Хосе. За ним ішов молодший помічник із товстою шкіряною папкою. Усередині президент Фігерес усе ще переглядав звіти з Гуанакасте: патрулі, помічені поблизу кордону, чергову партію зброї, конфісковану в Ла-Крусі.\n\nКоли смаглявого американського дипломата нарешті впустили всередину, він не став витрачати час на люб'язності. «Сеньйоре Президенте, я маю доручення передати занепокоєння Вашингтона. Ми розуміємо, що напруженість із кальдероністськими елементами за кордоном зростає. На нашу думку, мирне порозуміння, хоч би яким незручним воно було, краще за кровопролиття. Як зацікавлена сторона, Сполучені Штати запропонували посередництво, щоб запобігти нестабільності».\n\nФігерес пирхнув. «Реймонде, ти жартуєш? Востаннє, коли Рафаель Кальдерон запропонував нам мир, усе закінчилося тілами, що вкривали дорогу до Картаго. США не можуть серйозно розглядати переговори з комуністом у вигнанні, якого ви допомогли усунути».\n\nРеймонд без особливого тепла посміхнувся. «Я розумію ваші побоювання, але це було п'ятнадцять років тому. Зараз усе інакше. Скажу прямо: Президент очікує, що Коста-Рика вступить у переговори з Кальдероном. Якщо ви відмовитеся, я не можу гарантувати, якою буде його реакція». За словами посла стояв чіткий підтекст. Якщо Сполучені Штати вважатимуть, що Кальдерона можна контролювати, вони можуть дозволити йому повернутися. А якщо Сан-Хосе відмовиться від переговорів? Тоді, можливо, нейтралітет буде не єдиним, що запропонує Америка.\n\nНеохоче Фігерес подав знак своєму міністру закордонних справ. «Призначте когось до посольства. Молодшого співробітника. Він слухатиме. І все». Він суворо подивився на посла. «Пане Теллес, сподіваюся, ви знаєте, що робите»."
 COS_forpol.7.a: "Нехай говорять, але не надто голосно."

 COS_forpol.8.t: "Цифри та кості"
 COS_forpol.8.desc: "ЗВІТ: RAND Corporation проводить опитування громадської думки в Коста-Риці з особливим акцентом на колишніх президентах і політичній стабільності\n\nРеймонд Теллес похмуро дивився на папір. Усе його життя було присвячене просуванню інтересів США в Латинській Америці. Іноді йому здавалося, що це завдання Сізіфа. Кальдерон прагнув будь-якого просування вперед, а Фігерес уперто стояв на своєму. Витік інформації був його свідомою ставкою, покликаною не допустити краху переговорів.\n\nRAND не замовляла опитування в маленьких республіках заради академічної цікавості. Вашингтон хотів знати, яку підтримку Кальдерон досі має серед виборців і в армії. Питання про Кастро та Міхальського були лише відволікаючим маневром, напівщирою спробою приховати справжню мету цієї ініціативи.\n\nЧерез кілька годин після витоку телефони в посольстві розривалися від дзвінків. Уряд Коста-Рики був розлючений, а до будівлі ринули численні журналісти. На запитання аташе відповідали лише, що посольство «санкціонувало обмежене опитування» у співпраці з RAND, аби оцінити «стійкість регіональної демократії».\n\nТого дня міністр закордонних справ Бенхамін Одіо вибіг із зали. «То це тепер американське уявлення про дружбу?» — вигукнув він до журналістів, що чекали. «Питати, чи хоче наш народ повернення старого режиму? Запускати цю ідею як пробну кулю, перш ніж скинути уряд із тридцятитисячної висоти? Громадяни Коста-Рики повинні розуміти, що це таке: відверте втручання в наші справи!»\n\nУ посольстві США Реймонд Теллес отримав приватний дзвінок від Рафаеля Кальдерона, який висловив своє найвище задоволення та пообіцяв залишатися в переговорному процесі."
 COS_forpol.8.a: "Камінь стабілізується."

 COS_forpol.9.t: "Орел летить на південь"
 COS_forpol.9.desc: "У Національному палаці серпанок над Мехіко поступово переходив у сутінки, коли манільська папка глухо впала на стіл президента. Розкривши теку, [MEX.GetLeader] переглянув перехоплені повідомлення, що містили деталі про діяльність кальдероністів у Нікарагуа. Одразу стали очевидними дві речі: Рафаель Кальдерон, колишній президент Коста-Рики, наразі вів переговори з урядом Фігереса за посередництва США, а якщо переговори проваляться, Кальдерон готувався до вторгнення. Виснажений президент відсунув папку, зморений цілим днем безперервного розв'язання проблем. «То Фігерес справді розглядає угоду з цим виродком?»\n\nМіністр закордонних справ знизав плечима. «Він заспокоює американців. Схоже, у Кальдерона досить друзів у Вашингтоні...»\n\nУ кімнаті, що дедалі більше занурювалася в темряву, знову запанувала тиша. Мексика уважно стежила за Коста-Рикою в роки після громадянської війни 1948 року. Повернення Кальдерона, навіть без американської підтримки, перевернуло б хиткий баланс у регіоні. Ще один каудильйо, народжений у полум'ї перевороту, ще одна дестабілізуюча подія, яка могла б перекинутися й на саму Мексику. Ба більше, посилення американського впливу в Центральній Америці принесло б власні ускладнення.\n\n«У нас є варіанти, Ваша Високосте. Ми можемо до завтра злити цей звіт газеті La Nación і розпалити обурення в Коста-Риці. Ніхто не буде задоволений тим, що Президент плазує перед зрадником. Або ж можемо спробувати скористатися деякими зв'язками з самим урядом і переконати Фігереса відступити. Раніше ми мали добрі відносини з міністром Бенхаміном Одіо». Чоловік кашлянув, а потім тихіше продовжив: «Або... Мексика може зберегти мовчання. Дозволити переговорам тривати. Якщо Кальдерон повернеться до країни, з ним буде легше домовитися. Принаймні це буде рукостискання, а не стрілянина». Чоловік випростався. «Чекаємо на ваші накази, Ваша Високосте»."
 COS_forpol.9.a: "Нічого не кажіть і дозвольте Вашингтону втручатися. Нам із цього нічого не буде."
 COS_forpol.9.b: "Посильте тиск на Фігереса й негайно злийте переговори в пресу. Нехай навчиться поваги."
 COS_forpol.9.c: "Непомітно викличте Бенхамiна Одіо. Подивімося, чи зможуть наші друзі в Сан-Хосе припинити це на самому початку."

 COS_forpol.10.t: "Гра на час"
 COS_forpol.10.desc: "Посол Реймонд Теллес уже мав справу з політичними кризами, але переговори між урядом Фігереса та кальдероністами у вигнанні виявилися напрочуд виснажливими. Після кількох днів войовничого обміну вимогами Теллесу здавалося, що йому було б легше навчити обидві сторони літати, ніж навчити їх укладати мир.\n\nІз кабінету в Сан-Хосе посол спостерігав, як усе розвалюється: кабінет Фігереса зайняв жорстку позицію й вимагав роззброєння, тоді як Кальдерон лютував і погрожував здійснити переворот. Громадський тиск та внутрішнє невдоволення в Коста-Риці зростали, а стабільність переговорів небезпечно хиталася, тоді як рішучість Фігереса поступово слабшала.\n\nІз Сапоа Теллес неодноразово отримував дзвінки від Кальдерона з вимогами американських поступок у разі провалу переговорів. Агенти, які стежили за таборами, повідомляли про дедалі більшу недовіру до Вашингтона та радикалізацію офіцерів. Вигнанці повірили, що Сполучені Штати навмисно затягують переговори, аби тримати їх під контролем, і що американці не мають наміру забезпечувати виконання угоди. Час спливав.\n\nГудіння принтера вирвало Теллеса із роздумів. Він підвівся й швидко переглянув щойно отримане повідомлення. Воно було надзвичайно коротким і надійшло з офісу ФБР у Сан-Хосе. «Витоки інформації про переговори простежуються до Мексики. Мексиканські лобісти чинять тиск на уряд, вимагаючи достроково припинити переговори. Вважаю, що вони не зупиняться, доки не досягнуть цього. Кінець звіту».\n\nТеллес насупився й відклав папірець, стримуючи раптовий гнів на мексиканський уряд. Випустити пару на адресу Мексики, цих настирливих змій, могло б змусити справу зрушити з місця, але це дорого коштувало б і без того непростим відносинам США з країною. Якщо ж дозволити всьому тривати, переговори, найімовірніше, розваляться за кілька днів. Теллес відчув, як його плечі опустилися. Найближчим часом спокійних ночей не буде."
 COS_forpol.10.a: "Підтримати процес. Обидві сторони мають повернутися за стіл переговорів."
 COS_forpol.10.b: "Зателефонувати до Державного департаменту. Мексика не може залишитися безкарною."

 COS_forpol.11.t: "Натяк на усмішку"
 COS_forpol.11.desc: "Теллес уже втретє уважно перечитував депешу, що лежала на його столі, запам'ятовуючи детальні положення, якими була списана сторінка. Нарешті кабінет Фігереса згуртувався навколо президента та подвоїв зусилля на переговорах. Те, що ще кілька тижнів тому здавалося немислимим — угода з Рафаелем Кальдероном — тепер було спокусливо близьким. Компроміс, викладений у депеші, був майже ідеальним: Кальдерона буде помилувано й повернуто до Коста-Рики, його прихильники демобілізуються, а Фігерес зможе залишатися при владі до виборів 1966 року.\n\nЗалишалося лише пожинати плоди успіху. Теллес повільно почав складати свою відповідь до Коста-Рики, додаючи нові положення, надіслані з Державного департаменту. Кальдерону буде запропоновано посаду посла в Мексиці — дипломатичний пост, що відповідає статусу колишнього глави держави. Це призначення дозволить Кальдерону вийти з політичного небуття та посадити американського союзника за стіл переговорів між Коста-Рикою та Мексикою. Що важливіше, воно ще глибше втягне Коста-Рику в американську сферу впливу, скасовуючи роки незалежної політики маленької центральноамериканської республіки. Угода стане беззаперечною перемогою США — залишалося лише Теллесу поставити в ній крапку.\n\nПосол у приватних розмовах вважав, що така амбітна демонстрація американської сили неодмінно роздратує Мексику. Піднесення Кальдерона до такої посади безсумнівно буде сприйняте ізольованою мексиканською республікою як провокація. «Ще більше розлючених сторін. Саме цього світові й бракувало». Дипломат пробурмотів це у своєму порожньому кабінеті. Ще більше проблем, які йому доведеться вирішувати згодом. Та він знав, що стратегічні вигоди для США переважують завдану шкоду. Завершивши останні положення угоди, Теллес ретельно перечитав своє повідомлення, перш ніж відправити його. Відкинувшись у кріслі, він ледь помітно усміхнувся."
 COS_forpol.11.a: "Кальдерон у Мехіко — перемога для всіх, крім Мексики."

 COS_forpol.12.t: "Нове вбрання вигнанця"
 COS_forpol.12.desc: "Енріке Моното щосили намагався не заснути. Зустріч, звичайна розмова з костариканським заступником міністра закордонних справ, здавалася нескінченною. Енріке повільно відчував, як важчають його повіки, поки чиновник без упину говорив про імпорт текстилю, митні угоди та морське співробітництво. Раптом щось прорвалося крізь дрімоту мексиканського посла. «Гадаю, Мексика люб'язно його прийме, навіть якщо американці доклали до цього руку», — зауважив заступник.\n\nЕнріке кліпнув, намагаючись відігнати втому, що накопичувалася весь цей час. Щось у словах чиновника його непокоїло. «Боюся, я не зовсім вас розумію. Про що ви говорите, пане заступнику?» Він випростався у своєму кріслі.\n\nЧиновник завагався, і на його обличчі було помітно занепокоєння. «Кальдерон», — сказав він. «Президент Фігерес погодився призначити його послом у вашій країні після помилування. Ми вважали, що ваш офіс уже поінформований».\n\nДо ночі звіт Енріке вже лежав на столі президента в Мехіко, терміново доставлений дипломатичною кур'єрською службою. Якимось чином американцям справді вдалося переконати Фігереса повернути Рафаеля Кальдерона з вигнання. Ба більше, вони намагалися посадити свого маріонеткового союзника на посаду нового посла в Мексиці, щоб схилити Коста-Рику до ОФН.\n\nМіністр закордонних справ Мексики заговорив поспіхом. «Пане Президенте, ми підготували пропозицію, яка, на нашу думку, може пом'якшити найгірші наслідки американського втручання. Якщо ми запропонуємо Кальдерону «гуманітарні» гранти через DFS, то зможемо дати йому посаду ректора одного з навчальних закладів у Сан-Хосе. Медичного університету, наприклад — чогось, що триматиме його подалі від неприємностей і від наших справ. Якщо він стане послом, Вашингтон отримає постійний голос у наших двосторонніх відносинах із Сан-Хосе. А як лікар... навряд чи нам доведеться мати з ним справу знову. Рекомендую вам ретельно обміркувати наші варіанти»."
 COS_forpol.12.a: "Надішліть пропозицію щодо університету. Там він не завдасть шкоди."
 COS_forpol.12.b: "Підготуйтеся прийняти нашого нового посла. Принаймні тепер усе це скінчилося."

 COS_forpol.13.t: "Два тижні, можливо, менше"
 COS_forpol.13.desc: "Ранковий звіт упав на стіл посла Реймонда Теллеса, мов удар під ребра. Він готувався до цього, спостерігаючи, як переговори повільно розвалюються, і намагаючись застерегти обидві сторони від насильства, яке вони, здавалося, були рішуче налаштовані розпочати. Учора напруженість досягла апогею, коли Коста-Рика перехопила партію зброї, що прямувала до Сапоа, — явне порушення режиму припинення вогню, про який домовилися на час переговорів.\n\n«Кальдерон виходить із гри», — пояснив один зі старших помічників посла. «Він відступає від Сан-Хосе. Агенти кажуть, що він збирається захопити країну силою. І шанси на успіх у нього непогані».\n\nТеллес провів рукою по обличчю. «Як скоро?»\n\nПомічник завагався й узяв зі столу прес-пап'є. «SIS отримала звістку від своїх людей у Рівасі. Два тижні. Можливо, менше. Війська вже мобілізуються. Чимало наших колишніх контактів тепер зникли. Більшість інформації, яку ми маємо, надходить через третіх осіб. Ми вважаємо, що Кальдерон залякав або вбив більшість наших очевидних контактів. Ситуація погіршується швидше, ніж більшість наших хлопців були до цього готові». Чоловік похмуро кинув прес-пап'є назад на стіл.\n\nТеллес підвівся й підійшов до вікна. Дощ тихо й безперервно стукав по склу, наче годинник, у якого спливав час. Як і переговори, його настрій, здавалося, стрімко котився до краху. «Ми були так близько». Нарешті він звернувся до помічника, який слухняно стояв позаду. «Віддайте наказ і відкликайте всіх польових оперативників, чиє прикриття було розкрито в кальдероністських таборах. Принаймні так ми зможемо обмежити збитки»."
 COS_forpol.13.a: "Надворі дощ переріс у зливу."

 COS_forpol.14.t: "Довгий шлях додому"
 COS_forpol.14.desc: "Дерева жакаранди шелестіли у дворі посольства Коста-Рики. Рафаель Анхель Кальдерон Гуардія сьорбав каву, згадуючи баронів, які колись піднесли його до президентського крісла. Тепер він сидів у Мехіко не як лідер країни, а як посол своєї батьківщини.\n\n«Ти завжди п'єш каву чорною», — зауважив його син, сидячи навпроти.\n\n«Гіркота чогось навчає, сину». Кальдерон поставив чашку. «Особливо після того, як відчуваєш її на смак майже двадцять років».\n\nЙого син кивнув. Він виріс, спостерігаючи, як батько боровся з політичними суперниками, американськими бізнесменами та мексиканськими шпигунами. Тепер старий сидів під чужими деревами в мирі, але все ж не зовсім удома.\n\n«А тепер ти знову популярний. У хорошому сенсі». Син Кальдерона перегортав листи. «Від колишніх супротивників надходять лише теплі слова».\n\nКальдерон хихикнув. «Вони починають розуміти. Кожен закон, кожна реформа. Усе це було заради Коста-Рики».\n\n«А Мексика?» Син опустив папери.\n\nКальдерон повільно сьорбнув каву. «Мексика дала мені скальпель. Коста-Рика та Америка повернули мені мій дім. Я винен своїй країні, а не Мексиці».\n\nВітер розносив аромат квітів жакаранди подвір'ям. Роки вигнання не притупили любові Кальдерона до батьківщини. Він сидітиме тут, тихо стежачи за впливом Мексики, аж до дня своєї смерті. Не як герой чи воїн, а як риса на піску."
 COS_forpol.14.a: "«Коли прийде мій час, сину, ти продовжиш мою спадщину»."

 COS_forpol.15.t: "Що змушує тіло працювати"
 COS_forpol.15.desc: "Посол Теллес переглянув свої нотатки. Університет у Сан-Хосе планував пізніше цього року закласти фундамент нового, найсучаснішого медичного факультету. Це була давня мета Коста-Рики — залучити найкращих фахівців, щоб навчати наступне покоління лікарів і зміцнити регіональні позиції Коста-Рики як справжнього лідера в медицині та медичних дослідженнях. Усе це було чудово, звісно, але була одна проблема: за все це платила Мексика.\n\nЦе навряд чи було чимось незвичайним для зовнішньої політики Мехіко, але лише дурень вірив у безкорисливу добру волю інших держав. Мексика хотіла усунути Кальдерона від костариканської політики й вигадала геніальне рішення, зробивши його ректором нового факультету. Для Кальдерона, людини, яка стояла за створенням системи охорони здоров'я, це була виняткова честь, яка водночас не давала б йому можливості створити проблеми чи спробувати вторгнутися до Коста-Рики. Американці чудово знали, що з Кальдероном може бути нелегко, саме тому вони прагнули зробити його послом у Мексиці. Так він міг би ефективно протидіяти мексиканським інтересам, залишаючись осторонь внутрішньої політики Коста-Рики. Одним ударом Мексика сподівалася нейтралізувати його.\n\nУ руці Теллеса лежала пропозиція. Хай би скільки мексиканці могли заплатити, американці могли перебити їхню ставку, навіть не докладаючи зусиль. Якщо зателефонувати потрібним людям, Державний департамент легко міг би санкціонувати пряму фінансову допомогу, яка повністю профінансувала б будівництво лікарні, а найкраще — Мексика не мала б жодної можливості протестувати. Більше вигоди, а Кальдерон був би вільний стати послом.\n\nТа Теллес уже чув заперечення бухгалтерів. Нехай Мексика просто оплачує лікарню. За пів покоління про це ніхто не пам'ятатиме, а США могли б ефективніше витрачати кошти на вплив на Коста-Рику, щоб зробити її добрим партнером і другом Америки за допомогою інших політичних заходів. Питання полягало в тому, чи варто проігнорувати скептиків, чи дослухатися до їхньої мудрості?"
 COS_forpol.15.a: "Перебити мексиканську ставку. Кожен долар купує прихильність Коста-Рики та руйнує плани Мексики."
 COS_forpol.15.b: "Це лише лікарня. Є значно ефективніші способи впливати на країну."

 COS_forpol.35.t: "Американське благословення"
 COS_forpol.35.desc: "Сонячне світло блищало на його офісному столі, пробиваючись крізь щілини у віконних жалюзі. Аромат кави розливався повітрям, і Колтон зробив ковток із чашки. Роки роботи в Латинській Америці змусили його сумувати за доброю старою американською кавою.\n\nВін підхопив Washington Post і почав переглядати сторінки в пошуках згадок про Коста-Рику. Його погляд зупинився на заголовку. Ще одна перемога Кальдерона в Коста-Риці. Він кивнув. Одне діло — вторгнутися в країну, і зовсім інше — закріпити свою легітимність через вибори.\n\nЗвісно, Колтон не виключав можливості, що вибори були сфальсифіковані. OAS, безперечно, вважала саме так. По всій Західній півкулі представники різних країн зібралися, щоб засудити сумнівні методи Кальдерона.\n\nАле це не мало значення, якщо Вашингтон вважав інакше. Неважливо, що думали Мехіко чи Гавана про те, чи був Кальдерон нелегітимним виродком. Важливо було лише те, що думав Вашингтон. А якщо Вашингтон вважав, що Кальдерон переміг чесно, значить, Кальдерон переміг чесно. Дискусії тут не було.\n\nКолтон відклав газету й зробив ще один ковток кави. Питанням, однак, залишалося членство в OFN. Прийняти їх після настільки суперечливого вторгнення означало б напевно створити проблеми для решти альянсу. Можливо, знадобляться ще чотири роки. Можливо, ще одні вибори. Можливо, ще одна операція.\n\nКолтон здригнувся від цієї думки. Не те щоб він мав щось проти фальсифікації виборів чи визначення долі країн одним телефонним дзвінком. Латинська Америка була... суворою. Спекотною. Повною комарів, які кусали тебе в кожну відкриту ділянку тіла.\n\nВін допив каву й підвівся, щоб втретє за цей ранок наповнити чашку."
 COS_forpol.35.a: "Але поки що він насолоджуватиметься Америкою до наступних виборів у Коста-Риці."

 COS_forpol.34.t: "Алкоголь за лояльність"
 COS_forpol.34.desc: "Букет квітів, папка Manila і пляшка Cacique Guaro.\n\nДивний набір предметів на столі витріщався на Волтера. «Ну, містере Сегреда, якщо ви хотіли купити американську підтримку, могли б принаймні принести кращу випивку». Американський посол відкрутив кришку й налив їм обом трохи алкоголю.\n\n«Це найкраще, що виробляють у Коста-Риці, містере Плозере». Коста-риканський посланець швидко ковтнув напій, перш ніж відкрити папку, щоб Плозер міг її прочитати. «Як ви вже чули з новин, Partido Restauración Nacional знову перемогла на нещодавніх національних виборах. З нищівною перевагою, звісно».\n\n«Так-так, Special Intelligence Service уже все мені розповіла». Плозер відмахнувся від папки. «Однак, гадаю, ви також чули з новин, що OAS узагалі не вважає ці вибори легітимними. Мексика навіть не визнає перемогу Пікадо. І навіщо ви прийшли до мене, щоб втягнути Америку в цю ситуацію?»\n\n«Тому що ми хочемо членства в OFN, містере Плозере». Сегреда закрив папку. Він поправив окуляри й продовжив. «Ваша мета — підтримувати дружні режими в Америці, чи не так? Ми дотримувалися ваших правил. Ми співпрацювали з тією фруктовою компанією. Ми забезпечили Коста-Риці функціональну державу. Все, чого ми просимо, — це ваша гарантія вступу до OFN. І якщо, скажімо, американці відмовлять нам у цьому проханні, уявіть, як виглядатимуть опитування, якщо Коста-Рику відкинуть і OFN, і OAS. Уявіть, як можуть виглядати наступні вибори».\n\nПлозер подивився на обличчя Сегреди. Кам'яне. Йому не потрібно було згадувати альтернативи. Його обличчя говорило саме за себе."
 COS_forpol.34.a: "«Гадаю, у нас знайдеться для вас місце в OFN»."
 COS_forpol.34.a.tt: "\nМи §Gзабезпечимо§! вступ [COS.GetFlag] §BКоста-Рики§! до §mOFN§! — навіть якщо для цього доведеться трохи£GFX_green_dollar_sign §&переконати§!£GFX_green_dollar_sign §Dінших членів§!."
 COS_forpol.34.b: "«Ми лише підтримаємо PRN. Не більше й не менше»."
 COS_forpol.34.b.tt: "\nМи §Rвідмовимо§! [COS.GetFlag] §BКоста-Риці§! у вступі до §mOFN§!, але водночас посилимо нашу підтримку §gPRN§! та її подальшого правління."
 COS_forpol.34.c: "«Покладімося на удачу»."
 COS_forpol.34.c.tt: "\nМи не будемо ані §Gпідтримувати§!, ані §Rвідхиляти§! вступ [COS.GetFlag] §BКоста-Рики§! до §mOFN§! і дозволимо подіям розвиватися самостійно."

 COS_forpol.36.t: "Знову сфальсифікувати"
 COS_forpol.36.desc: "«Дозвольте мені уточнити, Сегреда. Ще кілька років тому ви хотіли, щоб я переконав Дядечка Сема підтримати Пікадо та його уряд. А тепер ви сидите за моїм столом і просите мене переконати PRN... провести вибори?»\n\nВолтер Плозер потер скроні, намагаючись осягнути ті розумові кульбіти, через які коста-риканський посол змушував його пройти. Не щодня диктатор добровільно погоджується провести вибори. Це суперечило самій філософії диктатур.\n\n«Так, містере Плозере», — відповів Сегреда, здається, зовсім не усвідомлюючи, яке збентеження він викликає в американського посла. «Коста-риканські громадяни, е-е, ну... не надто задоволені правлінням Пікадо і, звісно, хочуть виборів».\n\n«І дайте вгадаю: хлопці з PRN не хочуть виборів, бо не змогли перемогти на двох попередніх без підроблених бюлетенів?» Плозер підняв брову. «Не впевнений, що вони мене послухають, містере Сегреда».\n\n«Послухають, містере Плозере. Вони мусять». Сегреда нахилився вперед, поки його обличчя не опинилося лише за кілька футів від обличчя Плозера. «PRN дуже вдячна Америці. Вимоги Вашингтона означають набагато більше, ніж мої власні вимоги. Їм потрібні ці вибори, їм потрібна якась легітимність, їм потрібно довести Коста-Риці, що Коста-Риці потрібні вони. Що Коста-Риці потрібна PRN, а не соціалісти».\n\nПлозер зітхнув. Він дістав пляшку алкоголю — ту саму пляшку, яку Сегреда подарував йому кілька років тому. На диво, дешева випивка допомагала йому ухвалювати такі рішення. Або, можливо, просто достатньо його п'янила, щоб він не надто багато думав над ситуацією. Але Сегреда мав рацію. Якщо виборів не буде, PRN впаде під тиском громадських заворушень. Плозеру залишалося лише сподіватися, що PRN дослухається до його пропозиції. І що PRN сфальсифікує ці наступні вибори ще сильніше."
 COS_forpol.36.a: "За демократію."

 COS_forpol.37.t: "Перед падінням"
 COS_forpol.37.desc: "Цілковите невір'я.\n\nНе було двох кращих слів, які могли б описати стан Плозера, коли він читав меморандум від коста-риканських агентів на місцях. PRN відхилила всі американські вимоги й вирішила стояти на своєму, відмовившись проводити дострокові вибори, поки країна розвалювалася зсередини.\n\n«Наскільки ж вони можуть бути дурними?» — подумав Плозер, розриваючи папір навпіл, перш ніж безсило опуститися в крісло. Вони могли знову сфальсифікувати вибори. Вони могли показати хоч якусь подобу легітимності. Але не змогли. Ні, не захотіли.\n\nГордість. Гордість пожирала PRN. Мабуть, саме на «P» починається PRN — Proud, гордовитий Пікадо загнав PRN у пастку. Пастку, яка розірве його країну на частини.\n\nПлозер закрив обличчя обома руками. Кажуть, Сегреду звільнили лише за те, що він наважився запропонувати подібне, тож Плозеру не залишилося нікого, кому можна було б поскаржитися, крім порожньої пляшки алкоголю на столі. Він ледве пам'ятав, як вона називалася.\n\nСитуацію погіршувало ще й те, що PRN лише посилила свою диктатуру. За одну ніч Пікадо отримав майже диктаторські повноваження й оголосив воєнний стан, сподіваючись, що це відлякає протестувальників. Білий дім уже безліч разів гарячково телефонував до Сан-Хосе, намагаючись переконати Пікадо піти у відставку, але всі ці заклики залишалися без відповіді, як і слід було очікувати.\n\nПлозер подумав, що вже надто пізно. Він більше нічого не міг зробити, щоб запобігти падінню PRN. Ззовні рев і вигуки коста-риканських протестувальників відлунювали від стін посольства, і все, що залишалося Плозеру, — сподіватися, що наступний уряд усе ще буде прихильним до Вашингтона."
 COS_forpol.37.a: "Але пляшка так і залишилася порожньою."

 COS_forpol.38.t: "Небажані"
 COS_forpol.38.desc: "ОБМЕЖЕНИЙ ДОСТУП\n\nВІД РІЧАРДА КОЛТОНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: СОЦІАЛІСТИЧНА РЕВОЛЮЦІЯ В КОСТА-РИЦІ — ВТРАТА СОЮЗНИКА В РЕГІОНІ\n\n1. Соціалістичний Народний фронт на чолі з Карлосом Луїсом Фальясом здійснив державний переворот проти уряду Partido Restauración Nacional (PRN) у Коста-Риці, усунувши колишнього президента Теодоро Пікадо Міхальського. Після кількох тижнів масових протестів проти PRN уряд Пікадо нарешті впав, а заколотники, за підтримки бунтівників в армії, захопили контроль над державним апаратом.\n\n2. Спочатку PRN була орієнтована на американські інтереси й підтримувала цілі United Fruit Company (UFC). Однак розвіддані з місця подій та перехоплені меморандуми свідчать про намір нового уряду послабити вплив UFC у країні, а отже, і американський вплив. Цього слід було очікувати від такого лідера, як Фальяс, який має чимало претензій до UFC.\n\n3. Новий уряд на чолі з Partido Vanguardia Popular (PVP) є широким фронтом, що об'єднує численних представників PRN і PLN в єдиний соціалістичний уряд. Малоймовірно, що ми зможемо знайти й підтримати якусь впливову групу чи політика, які вже не входять до складу PVP.\n\n4. Коста-Рика більше не перебуває в американській сфері впливу. Польові агенти й надалі робитимуть усе можливе для спостереження за ситуацією та її стримування, однак наша присутність тут більше не є сталою. Подальше втручання ризикує спровокувати новий уряд і поставити під загрозу наші розвідувальні активи в регіоні."
 COS_forpol.38.a: "Вірність, честь, доброчесність."

 COS_forpol.39.t: "Лист із Сан-Хосе"
 COS_forpol.39.desc: "Двері президентського палацу Коста-Рики розчинилися. Франк Маршалл увійшов усередину, поки озброєні солдати виводили комуністичних бюрократів і соціалістичних міністрів. Його чоботи різко відлунювали на кахляній підлозі, коли він крокував будівлею, яка за кілька років уже двічі переходила з рук у руки. Маршалл сподівався, що це буде остання зміна влади, яку доведеться пережити Коста-Риці.\n\nСиндикалістський експеримент Partido Vanguardia Popular закінчився так само раптово, як і почався. Червоні прапори були зірвані, а за допомогою Легіону Кондор Коста-Рику було звільнено від комуністичного безладу, який залишила після себе PVP. Він пригадав свої дні в Ганновері у 1936 році. Маршалл не міг не порівняти себе з Гітлером, який очищав Німеччину від злодійкуватих соціалістів.\n\nМаршалл ненадовго зупинився в президентському кабінеті, а потім сів за свій новий стіл. Колона офіцерів принесла йому стоси паперів. Списки підозрюваних симпатиків PVP, анульовані контракти з United Fruit Company і, звісно ж, пресрелізи, контрольовані державою, для завтрашнього ранку.\n\nПерш ніж він устиг ознайомитися з документами, Маршалл зіткнувся з нагальнішими проблемами. Окрім кількох фашистських країн Латинської Америки, Маршалл фактично опинився в геополітичній ізоляції, оточений американцями, мексиканцями та комуністами регіону, жоден із яких не був готовий прихильно поставитися до нового уряду в Сан-Хосе.\n\nТож Маршалл не займатиметься державними справами. Принаймні не сьогодні. Маршалл узяв ручку. І почав писати. Писати будь-якій державі, яка була готова знайти нового друга в Латинській Америці."
 COS_forpol.39.a: "За наших нових друзів у Коста-Риці!"

 COS_forpol.40.t: "Останній шанс"
 COS_forpol.40.desc: "По всьому Сан-Хосе передвиборчі банери заполонили кожен куточок міста. Зареєстровані виборці знову готувалися виконати свій громадянський обов'язок, і куди б ти не пішов, усюди бачив і чув кандидатів, які закликали голосувати за них та їхню партію. Без цих виборів країна розпалася б після того, як Пікадо відштовхнув від себе комуністів. Те саме стосувалося й тих, хто не міг голосувати на виборах, але все одно хотів узяти участь. На поверхні — просто вибори, але на кону стояла доля цілої країни.\n\nЗвісно, нічого такого вульгарного, як крадіжка виборів. Це було б надто очевидно, надто ризиковано через можливий зворотний удар і надто складно організувати, навіть якби все вдалося. Але існували інші способи — цілком законні, навіть очікувані від зовнішньої держави. Розмови про торгівлю та інші зовнішньополітичні пропозиції — усе це завжди мотивувало політично активних людей. Оплата працівникам за те, щоб вони заповнювали конверти, роздавали листівки та друкували свіжі плакати, дозволяла охопити велику кількість виборців, особливо в містах. У сільській місцевості виступи ораторів і проведення мітингів змушували людей говорити про вибори.\n\nСправжнє питання полягало в тому, кого підтримати? PRN і Кальдерон були очевидним вибором. Він мав значну силу та політичний вплив, щоб втілити своє бачення, і був відданий співпраці з OAS. Але він був каудильйо, а це не йшло на користь демократії. Він виконає те, що обіцяє, але має власні плани щодо Коста-Рики — демократії, де шальки терезів уже заздалегідь нахилені. Процвітання, мир, але країна, яка існує на його умовах.\n\nОпозиція вважає ці вибори своїм останнім шансом зберегти можливість легально існувати в Коста-Риці, перш ніж її повністю змовчать прихильники Кальдерона. Навіть якби Кальдерон провів чесні вибори, на опозицію чекав би важкий бій, але вона цілком може очікувати, що її бюлетені «загубляться», а Кальдерон раптом знайде більше людей, готових за нього проголосувати. Вони без проблем приймуть наші гроші, але чи матимуть вони хоч якесь значення перед обличчям такого опору?"
 COS_forpol.40.a: "Незабаром Кальдерон отримає несподіваний прибуток, і ми знаємо, що він повернеться."
 COS_forpol.40.b: "PRN потрібно трохи провчити. Фінансуймо опозицію."
 COS_forpol.40.c: "Ми залишимося осторонь."

 COS_forpol.42.t: "На крилах перемоги"
 COS_forpol.42.desc: "Кальдерон не просто переміг. Кальдерон стрімко увірвався до політичного істеблішменту й здобув для себе все необхідне, аби вивести з гнізда нове майбутнє Коста-Рики. Фенікс Пікадо згорів; тепер із його попелу постав Кальдерон, готовий дати життя новій конституції.\n\nМаючи за спиною мандат ОАД, Кальдерон звернув свій погляд на опозицію, посиливши тиск на неї. Поки на його вустах звучали слова про «забезпечення демократії», аудитори вишукували будь-які розбіжності в податкових деклараціях і документах, шукаючи вразливі місця, проти яких можна було б застосувати всю міць державної влади. Опозиційні газети опинилися під пильним наглядом — їм загрожували дорогі позови про наклеп або навіть закриття як покарання за «поширення неправди». Над головами провідних опозиційних діячів уже кружляли стерв'ятники, нетерпляче очікуючи нагоди розклювати трупи їхніх політичних кар'єр. ОАД не сказала нічого, готова заплющити очі або тихо відмовитися від будь-яких протестів. Важливим був результат і те, до чого він приведе. Усе інше було другорядним, лише тінями, що залишалися після могутнього змаху крил нового майбутнього Кальдерона.\n\nКальдерон обіцяв нову еру співпраці з ОАД, і вона вже почала приносити свої плоди. Американські підприємства могли знайти чимало ресурсів і партнерів, готових до взаємовигідної співпраці на багатій і родючій землі Коста-Рики, а чимало компаній уже виклали свої плани на папері, очікуючи лише на підпис. Поки опозиція гуртувалася для оборони, політики ПРН виходили в ефір, радісно розповідаючи про переваги, які нова конституція принесе як робітникам, так і підприємцям. Це була країна Кальдерона, і зі свого орлиного гнізда він дивився на неї, розмірковуючи про те, що міг би їй принести.\n\nА поруч із Кальдероном інший могутній птах дивився на країну, що безпечно лежала в його пазурах."
 COS_forpol.42.a: "Орел янкі знайшов своє гніздо."

 COS_forpol.44.t: "Глиняні ноги"
 COS_forpol.44.desc: "Від: Управління у справах Центральної Америки\nМеморандум для директора\nРозвідувальний звіт: Передача влади в Коста-Риці\n\nВибори 1974 року в Коста-Риці стрімко наближаються. Чинний президент Рафаель Анхель Кальдерон Гуардія висловив бажання балотуватися знову, однак погіршення стану його здоров'я змусило його призначити свого сина, Рафаеля Анхеля Кальдерона Фурньє (Рафаеля-молодшого), новим головою ПРН. Рафаель-молодший молодий і недосвідчений: за плечима в нього лише нетривалий термін на посаді голови молодіжного крила ПРН та незначний досвід роботи у сфері регулювання державної пенсійної програми.\n\nЦей крок розлютив старших членів ПРН, багато хто з яких бачить, як їхні політичні перспективи згасають через призначення молодого й неперевіреного наступника. Політичні аналітики розвідувальної спільноти вважають, що недосвідченість Рафаеля-молодшого, найімовірніше, призведе до політичних і законодавчих помилок. Брак союзників у власній партії, безсумнівно, спричинить подальші політичні тертя. Хоча Коста-Рика залишається стабільною країною, аналітики вважають малоймовірним, що Рафаель-молодший зможе зрівнятися з терміном перебування свого батька на посаді глави держави.\n\nОднак аналітики зазначають, що недосвідченість Рафаеля-молодшого та його хитке становище означають, що він навряд чи шукатиме іноземних покровителів за межами Сполучених Штатів. Він не має жодних контактів із Німеччиною, Японією чи Мексикою й, найімовірніше, прагнутиме зберегти статус-кво у відносинах зі Сполученими Штатами, щоб зміцнити своє становище. Аналітики доходять висновку, що хоча це й не ідеальний вибір, за наявних розвідувальних можливостей і ресурсів його можна контролювати протягом наступних п'яти років."
 COS_forpol.44.a: "Вірність, хоробрість, чесність."

 COS_forpol.45.t: "Тріумф визволителів"
 COS_forpol.45.desc: "До настання ночі результати вже не викликали сумнівів. Попри звинувачення у фальсифікаціях, урядовому залякуванні та іноземному втручанні, Партія національного визволення колишнього президента Хосе Фігереса, що відродилася, здобула перемогу на позачергових виборах у Коста-Риці. Крихкий режим ПРН Рафаеля Кальдерона було повалено через величезне суспільне обурення, що поставило під сумнів подальшу проамериканську орієнтацію країни.\n\nЗа повідомленнями, вулиці Сан-Хосе переповнені святкувальниками: широкі верстви костариканського суспільства радіють падінню недовговічної кальдероністської анократії. Повернення постарілого прогресиста Фігереса означає передачу влади назад до Коста-Рики, що дотримується неприєднання та схиляється до політичних лівих поглядів. Вже зараз у посольства США та мексиканських дипломатів відкликано значну частину дозволів на доступ до державної інформації.\n\nПублічно Фігерес пообіцяв примирення після того, що він називає «періодом темряви в історії країни». Колишні посадовці ПРН, більше не захищені американським покровительством, уже почали тікати з країни. Рафаель Кальдерон та його союзник Теодоро Пікадо втекли рано-вранці, знайшовши притулок у Пуерто-Рико, щоб уникнути переслідувань з боку нового уряду.\n\nУ Вашингтоні та Мехіко аналітики тепер гарячково намагаються зрозуміти, що буде далі."
 COS_forpol.45.a: "Доміно щойно саме скинуло себе зі столу."

 COS_forpol.50.t: "Непростий союзник"
 COS_forpol.50.desc: "ТАЄМНО\n\nВІД РІЧАРДА КОЛТОНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ВСТУП КОСТА-РИКИ ДО ОРГАНІЗАЦІЇ ВІЛЬНИХ НАЦІЙ\n\n1. Коста-Рика вступила до Організації вільних націй за значної американської підтримки. Відповідно до своїх зобов'язань Коста-Рика пообіцяла разом з усіма членами ОВН брати участь в обороні Америки та Південного Тихоокеанського регіону. Натомість члени ОВН зобов'язуються також допомагати в обороні Коста-Рики.\n\n2. Вступ Коста-Рики до ОВН виявився найбільш суперечливим поповненням організації на сьогодні. Деякі члени ОВН визнали нинішній уряд Коста-Рики нелегітимним. Не лише тому, що її лідер Рафаель Анхель Кальдерон Фурньє розпочав вторгнення до Коста-Рики задля захоплення влади, але й тому, що багато членів ОВН поставили під сумнів легітимність нещодавньої перемоги Партії національної реставрації на виборах. На думку деяких, такій далекій від демократії країні, як Коста-Рика, не місце в ОВН.\n\n3. Варто зазначити, що це стало можливим лише завдяки тому, що уряд Коста-Рики настільки тісно пов'язаний з американськими економічними та політичними інтересами. Через це численні інтелектуали по всій Латинській Америці поставили під сумнів «хижацький вплив», який Америка має на цю державу.\n\n4. Внесок Коста-Рики в ОВН буде підлягати моніторингу та оцінюванню. Тепер немає особливого сенсу переглядати це рішення, однак реакція на вступ Коста-Рики повинна показати нам, що під час майбутнього прийняття нових членів необхідно встановлювати суворіші стандарти."
 COS_forpol.50.a: "Вірність, хоробрість, чесність."

 COS_forpol.53.t: "Скеля Центральної Америки"
 COS_forpol.53.desc: "ТАЄМНО/[GetDateText]\nМЕМОРАНДУМ ДЛЯ ДИРЕКТОРА\n\nТЕМА: ВИБОРИ В КОСТА-РИЦІ\n\nКоста-Рика завершила свої перші виборчі процедури вчора, що призвело до стабільної та впорядкованої передачі влади. Рідкісне явище серед країн Центральної Америки, посада президента Коста-Рики спирається на стабільні інституції, що формує сильне почуття національної єдності та високий рівень довіри до державних інституцій, який виходить за межі політичних партій. Партії при владі діють у рамках Конституції, тоді як політики опозиції мирно виконують свої ролі, не вдаючись до політичного насильства.\n\nБудучи островом стабільності, Коста-Рика залишається відносно осторонь справ Центральної Америки, відмовляючись фінансувати чи підтримувати збройні угруповання в сусідніх країнах задля тиску на їхні уряди або повалення нелояльних глав держав. Така відмова від експорту нестабільності аж ніяк не є унікальною для Центральної Америки, хоча більшість урядів роблять це радше через відсутність відповідних можливостей, ніж через офіційну політику.\n\nОчікується, що Коста-Рика продовжить рухатися цим шляхом, демонструючи помірне, але стабільне зростання ВВП, хоча окремі фінансові роки залежатимуть від примх світового попиту, що може спричиняти незначні економічні труднощі. У міру того як Коста-Рика продовжуватиме насолоджуватися стабільністю, прогнозується диверсифікація її економічних перспектив і дедалі активніший імпорт технологій та залучення консультантів задля підвищення рівня життя. Очікується, що в середньо- та довгостроковій перспективі країна становитиме мінімальну загрозу для безпеки."
 COS_forpol.53.a: "Вірність, хоробрість, чесність."

 COS_news.1.t: "[Get_newspaper_header]Перемога ПУН у Коста-Риці"
 COS_news.1.desc: "Після бурхливого року, сповненого загроз вторгнення, державних переворотів і хаосу, гору взяли більш розважливі сили. Після того як колишній президент і претендент на владу в невеликій державі Рафаель Анхель Кальдерон Гуардія спробував повернути собі владу за підтримки кількох держав, орієнтованих на ОВН, країна поринула в період глибокої невизначеності. Однак тепер, коли колишнього президента приборкано, країна нарешті може з полегшенням зітхнути.\n\nКоли пристрасті вщухли, стало можливим провести вибори. ПРН — політична партія Кальдерона — визнала поразку свого лідера та знялася з перегонів, віддавши підтримку фінансово консервативній ПУН. За підтримки ПРН лідер ПУН і колишній президент Маріо Ечанді Хіменес офіційно здобув президентське крісло Коста-Рики, усунувши від влади чинну ПЛН. Він пообіцяв критичніше ставитися до соціальних реформ ПЛН, дотримуватися фінансового консерватизму та забезпечити економічне зростання — на превелику радість американських друзів як ПУН, так і ПРН.\n"
 COS_news.1.a: "Чим більше все змінюється, тим більше все залишається незмінним."

 COS_news.2.t: "[Get_newspaper_header]Перемога ПЛН у Коста-Риці"
 COS_news.2.desc: "Після бурхливого року, сповненого загроз вторгнення, державних переворотів і хаосу, гору взяли більш розважливі сили. Після того як колишній президент і претендент на владу в невеликій державі Рафаель Анхель Кальдерон Гуардія спробував повернути собі владу за підтримки кількох держав, орієнтованих на ОВН, країна поринула в період глибокої невизначеності. Однак тепер, коли колишнього президента приборкано, країна нарешті може з полегшенням зітхнути.\n\nКоли пристрасті вщухли, відбулися вибори, які продемонстрували рішуче неприйняття авторитаризму в будь-якій формі. Попри підтримку з боку ПРН, консервативній кампанії ПУН не вдалося усунути від влади чинну ПЛН — хоча цього разу на чолі партії стоїть значно поміркованіший Орліч Больмарсіч. Відсунувши соціалістичну політику на другий план і підтвердивши прихильність до капіталізму та сильних демократичних інституцій, ПЛН сподівається зберегти прихильність демократій усього світу.\n"
 COS_news.2.a: "Слава Богу, вони виявилися розважливими."

 COS_news.3.t: "[Get_newspaper_header]Коста-Рика впала внаслідок перевороту"
 COS_news.3.desc: "Чутки ширилися тижнями, і для костариканців очікуване нарешті сталося. Колишній президент Рафаель Анхель Кальдерон Гуардія, за підтримки інших держав, орієнтованих на ОВН, перетнув нікарагуанський кордон і розпочав успішне військове вторгнення до Коста-Рики. Хоча його армія зустріла певний опір з боку поспіхом організованих воєнізованих формувань, вони швидко дісталися Сан-Хосе та забезпечили владу Кальдерона.\n\nТепер, коли колишній президент знову ходить коридорами столиці, Коста-Рика стала значно відкритішою до співпраці зі Сполученими Штатами. Поки що не надходило повідомлень про офіційний вступ країни до ОВН, однак для багатьох, з огляду на зв'язки нового режиму з гегемоном, це видається радше формальністю, ніж чимось іншим.\n"
 COS_news.3.a: "Ще одне доміно знову поставили на ноги."

 COS_news.4.t: "[Get_newspaper_header]Перемога ПРН у Коста-Риці"
 COS_news.4.desc: "У шокуючому повороті подій авторитарна ПРН перемогла на позачергових виборах, які спочатку були призначені як спроба покласти край її мертвій хватці над костариканською демократією. Але якимось чином — чи то завдяки підкупу, залякуванню, чи просто через відсутність привабливості демократичної опозиції — мандат Кальдерона став як ніколи міцним.\n\nЦя перемога знаменує кінець по-справжньому демократичної Коста-Рики — можливо, цього разу назавжди. Після ухвалення нової конституції, яка проголосила Третю Коста-Риканську Республіку, президент уже почав просувати агресивно авторитарний порядок денний, що передбачає розширення військових і президентських повноважень. Оскільки арешти та вбивства популярних діячів як ПУН, так і ПЛН уже розпочалися, багатьом залишається лише гадати, коли тінь ПРН перестане переслідувати Коста-Рику — і чи станеться це взагалі."
 COS_news.4.a: "Тиранії не уникнути."

 COS_news.5.t: "[Get_newspaper_header]Перемога ПЛН у Коста-Риці"
 COS_news.5.desc: "Хватка ПРН над Коста-Рикою знову послабилася. Після нещодавньої внутрішньої нестабільності та тиску з Вашингтона було проведено позачергові вибори, покликані визначити подальшу долю режиму ПРН — і він їх програв.\n\nНа чолі опору стоїть колишній президент і герой революції Фігерес Феррер — рішуче лівоцентристська альтернатива тому, що країна знала протягом останніх п'яти з лишком років. Феррер дотримується значно скептичнішого підходу до Сполучених Штатів. Не виступаючи відкрито проти американців, він чітко дав зрозуміти, що Коста-Рика не є їхнім ексклюзивним партнером і шукатиме зв'язків з іншими державами, якщо вважатиме це за потрібне. Що цей новий підхід означатиме для відносин, які донедавна були відносно простим партнерством, ще належить побачити."
 COS_news.5.a: "Схоже, більше не маріонетка."

 COS_news.6.t: "[Get_newspaper_header]Соціалістична революція в Коста-Риці"
 COS_news.6.desc: "Із Сан-Хосе надходять повідомлення про те, що очолюваний соціалістами Народний фронт захопив владу, усунувши непопулярний уряд ПРН, паралізований загальнонаціональними протестами. Майже одразу новий уряд почав скасовувати значну частину попередніх заходів ПРН, водночас переводячи значну частину економіки у державну власність та під управління профспілок.\n\nХоча серед Народного фронту є деякі колишні посадовці ПРН, новий уряд здебільшого став результатом справжньої соціалістичної революції. Американський посол у Коста-Риці та Білий дім відмовилися від будь-яких коментарів, однак Вашингтон, без сумніву, незадоволений результатом, хоча, схоже, на цьому етапі вже мало що може зробити, аби його змінити."
 COS_news.6.a: "Центральна Америка дедалі більше віддаляється від Вашингтона..."

 COS_news.7.t: "[Get_newspaper_header]Фашисти з РГС захопили Сан-Хосе"
 COS_news.7.desc: "Із Сан-Хосе знову надходять звістки про хаос: черговий у низці державних переворотів привів Френка Маршалла до влади в Коста-Риці. Колись військовий герой, відомий неодноразовим придушенням сил, лояльних Рафаелю Кальдерону, він завдяки своєму досвіду та тактичним здібностям зумів у короткій битві розгромити комуністичну Партію народного авангарду, витіснивши її з міста та швидко встановивши контроль над більшою частиною Коста-Рики.\n\nМаючи особисті зв'язки з Німеччиною та тривалу прихильність до фашистських ідей, Маршалл здобув перемогу, що має очевидне глобальне значення, хоча його основними покровителями й надалі залишаються латиноамериканські держави. Попри швидку перемогу, Революційний громадянський союз досі непопулярний по всій країні, а комуністичні партизани вже починають гуртуватися. Промисловці та землевласники масово повертаються; якщо Маршалл зазнає тут невдачі, вони можуть так само швидко знову залишити країну."
 COS_news.7.a: "Він міг виграти битву — але чи не програє він війну?"
