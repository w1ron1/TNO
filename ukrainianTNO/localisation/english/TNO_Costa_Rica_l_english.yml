COS_Guillermo_Villalobos: "Guillermo Villalobos"

COS_Rafael_Calderon_Fournier: "Rafael Calderón Fournier"
POLITICS_COS_RAFAEL_CALDERON_FOURNIER_DESC: "It is a true irony that Costa Rica now finds itself ruled by a man like Rafael Calderón. Born in 1949 to his father, then hiding in exile in Nicaragua, he would be raised in Mexico, still kept somewhat in hiding and slowly being prepared to serve as a potential heir for when his father inevitably returned to Costa Rica. As that came to pass, he remained mostly out of the spotlight, only just reaching the end of his schooling as the family returned to San José.\n\nAfter the return of the Calderóns to Costa Rica, surprisingly little changed for Rafael, who continued to inhabit the same circles with the same beliefs. He started to attend the University of San José, but the election of Teodoro Picado Jr. and the growing alienation of communists within the National Restoration Party forced his father's hand into moving beyond a puppetmaster. Using his connections, Rafael was elected as President of the PRN Youth, using that as a launchpad for an eventual jump into politics.\n\nWith his father now ailing, Calderón Jr. has been forced forwards for his coronation, several years earlier than expected. With no real opposition left, either in his party or in Costa Rica, and the strength of his father yet to erode its hold on the National Restoration Party, his control seems assured. But Rafael is young, corrupt and has virtually no experience. When his father finally passes on, he will have to blindly move forwards. Perhaps, even, to his doom."
COS_Alejandra_Calderon_Fournier: "Alejandra Calderón Fournier"


COS_Frank_Marshall: "Frank Marshall Jiménez"
POLITICS_COS_FRANK_MARSHALL_DESC: "Born during an earthquake in Puntarenas in 1924, the life of Frank Marshall Jiménez has been defined more by the ruptures than most. Born into an elite political family, his father an American geologist and mine owner killed by the Sandinistas, his stepfather was a German immigrant, with Marshall returning to Germany with him in 1936. Given a physically demanding education, Marshall settled into the Hitler Youth, but left to study engineering at the University of Costa Rica.\n\nBut with the Second World War, his family's assets seized and him interned, Marshall settled for running a café upon his release. Joining José Figueres, he massacred several Calderonists before becoming a war hero for fending off an entire unit with just a machine gun. But from there, his ascendancy stalled over his opposition to other immigrants being in the Caribbean Legion, contenting himself with continual deployment in the suppression of Calderonists across Central America.\n\nBriefly exiled with the success of the Calderonists, the coup of Carlos Luis Fallas and the People's Vanguard Party brought him back to the fore. Organising another militia of fascists and reactionaries, he marched on San José and took control for himself. Now, Marshall settles into his new throne. With the aid of fascist regimes across the continent, Marshall may just have a chance of consolidating his rule."
COS_Carlos_Luis_Fallas: "Carlos Luis Fallas"
POLITICS_COS_CARLOS_LUIS_FALLAS_DESC: "It is perhaps fitting that the life of Carlos Luis Fallas has been so storied. The illegitimate son of a gangster born in 1909, "Calufa" became the eldest of seven when his mother married an impoverished shoemaker. Pulled out of education to work in numerous trades, an illness in his teenage years nearly claimed his life. Radicalised by a friend's copy of the Communist Manifesto, he became a major organiser for the Costa Rican left, frequently imprisoned until his support for Calderón in the Costa Rican Civil War threw him into exile.\n\nWhen in exile, Fallas turned towards poetry. But with the return of Rafael Calderón Sr. to power, so came the resurgence of the People's Vanguard Party. The rightward drift of his restored regime outraged his wing of the party, and the nomination of Teodoro Picado Jr. as Calderón's puppet, an attempt to sideline them, would prove fatal. Exploiting mounting street demonstrations and defecting allies to seize power, Fallas saw to Caudillo Calderón's exile once more.\n\nFallas may now be in power, but his hold is limited. With the sheer influence held by the social democrats of the PLN and anti-Calderón elements of the PRN, he now leads a big tent that trends far more moderate than his desire. Even still, fascist militias have become active, actively claiming newfound momentum and regularly attacking PVP paramilitaries. As the clouds swirl around him, and as the shadow of war looms once again over Costa Rica, some wonder if Calufa can hold on."
COS_Humberto_Vargas_Carbonelli: "Humberto Vargas Carbonelli"
COS_Rodolfo_Cerdas_Cruz: "Rodolfo Cerdas Cruz"

#Ideas
COS_Pura_Vida: "Pura Vida"
COS_Pura_Vida_desc: "In every village in Costa Rica, every home in San José, and every farm on the riversides, you'd hear the greeting "¡Pura Vida!" Its translation? There really is none; some say it means, "This is living!" or "Going great!", but no matter the language barrier, it encapsulates the laid-back, tranquil atmosphere of the country.\n\nSince 1948 and the Civil War, the army was abolished, and Costa Rica has seen a steady, stable, and peaceful democracy since. There were no coups, no despots, and no Caudillos. In its place, there is modest, humble governance over a land of happy, peaceful people. The economy has prospered and culture has flourished, and with the threat of the army out of the minds of the people for so long, there truly is no need to worry about such a drastic change in the country. For as long as anyone can foresee, life in Costa Rica will be that of a Pura Vida."
COS_Bodegon: "Bodegón"
COS_Bodegon_desc: "Calderón has returned, and so has his agenda. Yet, while one may fear that Costa Rica will turn back the clock of social norms, they would be wrong. Calderón may be many things, but his strange brand of progressivism is a defining factor. These reforms have returned, but that is not the poison that chokes the nation. Rather, it is Calderón's personality and rhetoric.\n\nCosta Rican society is tearing itself at the seams. The extreme polarization that faced the nation prior to 1948 has begun to return. Parties now see their opponents as their mortal enemies, as Calderón skirts around the laws of the new nation he has inherited. PRN militiamen patrol the streets alongside the police, forming a de facto military in a country where there is none. Perhaps Calderón's social reforms won't destroy the country, but it is clear that he himself is tearing Costa Rican society apart."
COS_Pura_Muerte: "Pura Muerte"
COS_Pura_Muerte_desc: "Within the halls of Congress, PLN and PRN politicians yell, berate, and sometimes even beat each other. In the streets, the opponents of Calderón and his puppet, Picado, strike in defiance of their sham democratic rule. The next day, the businesses and homes of those strikers were sacked by the supporters of the President.\n\nWhen one looks at Costa Rica, the only thing that differentiates today and just before the 1948 Civil War is that the press photos come out in color. Democracy has died in Costa Rica. Picado rules as Calderón's puppet, giving empty speeches as the vultures of Congress feast on the democratic constitution of the republic. Outside, the people brawl in the streets, and militias begin to form to protect their supporters. Only time will tell if war comes again to the land of "Pura Vida"."
COS_Vida_Despues_de_la_Muerte: "El Más Allá"
COS_Vida_Despues_de_la_Muerte_desc: "When the people of Costa Rica gathered around their radios and TV awaiting the election results, none could have expected the outcome. One would be forgiven for assuming that Calderón would win, that his political machine could not be stopped unless the nation saw another civil war. However, when the election results came, it was José Figueres Ferrer and the Party of National Liberation that took the presidency once more.\n\nCalderón's house of cards has come crashing down, with his cronies locking themselves in their homes or fleeing to Costa Rica's neighbors. Figueres must now restore the fabric of Costa Rican society and restore dignity to Central America's most stable democracy. The American ambassador will find his demands unanswered, the industrialists' pockets empty, and the nation liberated once again."
COS_Republica_Muerta: "República Muerta"
COS_Republica_Muerta_desc: "As the average Costa Rican goes about their day, a new proclamation is printed in the nation's newspapers. Calderón, the most ubiquitous name in the nation, has unsurprisingly won another election. Legitimately or illegitimately, it does not matter; the opposition can be found in shambles in San José. Not only has Calderón won the election, but he has managed to pass a new constitution as well.\n\nThe Third Republic now stands as a testament to personalistic rule in Costa Rica. Decades of respect for a predecessor's rule have gone out the window: term limits repealed, the Armed Forces reestablished, and laws detailing electoral integrity and resilience disappeared at the signing of a name. The Republic of Figueres is gone, wiped away to the applause of the masses, all shouting one name: Calderón Guardia."
COS_Comunismo_Criollo: "Comunismo Criollo"
COS_Comunismo_Criollo_desc: "Together on the streets of San José march the poorest workers, alongside former members of the PRN and the PLN, forming the new Communist government of Costa Rica. Much like that of the strangely progressive, illiberal democracy of Calderón, communism in this corner of the tropics is uniquely Costa Rican.\n\nSeizing power against a nation with no army, Costa Rican communism is a strangely inclusive and democratic phenomenon, presenting itself as a continuation of the stable and participatory traditions of the nation, but perfecting it with a "socio-economic context". As ideological development takes one step further in Costa Rica, time will only tell if it will mutate into something much more radical than what the revolution has brought to the people."
COS_Black_Spot_of_the_Tropics: "Black Spot of the Tropics"
COS_Black_Spot_of_the_Tropics_desc: "Frank Marshall is no stranger to warfare. Born to an elite German family in Costa Rica, he was sent to Germany in his younger years and became part of the Hitler Youth. When he returned, Calderón imprisoned him and his family in a concentration camp. Then the Civil War came, and he threw in his lot with the social democratic National Liberation Army - better than the communistic Calderistas at least.\n\nWhen Communists took over his country, he knew it came down to him to save it. His detractors decry him as a fascist, of having sold his nation out to Trujillo and Paraguay, bringing the tropics their new black spot. Yet, he disagrees. To him, he has liberated his country and finally brought the freedom and dignity his country had lacked for so long. Now, Costa Rica is Catholic, without Calderón's communist cronies, and it is free, without anyone to hold it back."
COS_PUN_Against_the_World: "PUN Against the World"
COS_PUN_Against_the_World_desc: "After 14 years of Figuerista rule, the Partido Unión Nacional was elected to reel in social democratic excesses by implementing fiscal conservatism and bringing in some moderation to the flurry of laws coming out of San José. While its members are determined, they find themselves stuck between a rock and a hard place. They may hold the presidency, but the legislature and bureaucracy are dominated by the Figuerista PLN.\n\nThis leaves them as nothing more than a lame duck, if people even take them seriously. They may decry the expenses the country faces, the impossibility of sustaining all of the welfare that defines their nation, and perhaps they may even find a majority of the country that agrees with them, but they are powerless. Words cannot repeal laws, only orders, and the PUN has no way to roll back anything they have claimed they will."
COS_Return_of_Figueres: "Return of Figueres"
COS_Return_of_Figueres_desc: "To the surprise of nearly nobody, the PLN has taken back the nation. How could it not? Figueres and his Party of National Liberation have crafted a new Costa Rican identity, based on his own political thought. How could any party come to destroy their vision for the nation? The country is now dependent on their social and economic reforms, culminating in their construction of a welfare state through economic statism. Beyond that, their party champions Costa Rican sovereignty, allying with their democratic allies of choice rather than by pressure or decree.\n\nThe true miracle is not their return, but rather their loss. Figueres's political thought within the PLN is as Costa Rican as the "Pura Vida", and the fact that they have been out of power is truly shocking. With them back, it would be unlikely to see the PLN ever step down again."
COS_PLN_Government: "Gobierno de Liberación Nacional"
COS_PLN_Government_desc: "To the surprise of nearly nobody, the PLN has taken back the nation. How could it not? Figueres and his Party of National Liberation have crafted a new Costa Rican identity, based on his own political thought. How could any party come to destroy their vision for the nation? The country is now dependent on their social and economic reforms, culminating in their construction of a welfare state through economic statism. Beyond that, their party champions Costa Rican sovereignty, allying with their democratic allies of choice rather than by pressure or decree.\n\nThe true miracle is not their return, but rather their loss. Figueres's political thought within the PLN is as Costa Rican as the "Pura Vida", and the fact that they have been out of power is truly shocking. With them back, it would be unlikely to see the PLN ever step down again."
COS_PUN_Government: "Gobierno de Unión Nacional"
COS_PUN_Government_desc: "The PUN may not be as energetic, new, or populist as the PRN or PLN, but it is far more powerful than petty politicians could ever be. The PUN is made up of the traditional elite of Costa Rica, the men and women who have stood at the border of their plantations and watched the wars and generals come and go through the ages. These elites, coupled with the traditional politicians, who in turn meet with other landowners, create a common front against the antagonistic and populist Calderónismo, as well as the exorbitantly expensive ideology of the PLN and Figueres.\n\nThey are the champions of moderation, fiscal integrity, anti-corruption, and conservatism, whilst respecting the country's tradition of honorable transitions of power. The PUN fits right into the American vision for Latin America, and are happy to receive backing from their friends in Washington."
COS_Calderonismo: "Calderonismo"
COS_Calderonismo_desc: "Now legitimized by its return to power, the personalistic, progressive, and incredibly idiosyncratic ideology of Rafael Calderón Guardia has returned to Costa Rica and finds itself as society's next parasite, embedding itself in the politics of the country. Distasteful to the traditional elite, Calderón heads a coalition of progressive Catholics, ardent communists, and corrupt, opportunistic politicians. This tactical alliance passes social reforms and welfare, keeping the people in support of the government while democracy slowly erodes.\n\nThe magnanimous name of Calderón may capture the hearts and minds of the people who benefit from his reforms, but the opposition has taken their seats within the Congress as if they were trenches. Determined to not let their democratic project be destroyed by the Calderistas, their verbal war may not be enough to stop the shifting tides of Costa Rica."
COS_Calderonismo_2: "Calderonismo"
COS_Calderonismo_2_desc: "As the clock winds back to 1944 in Costa Rica, Teodoro Picado Jr. heads the presidency in Calderón's country, allowing the Caudillo to rule from the shadows. Although serving as a constitutional loophole, Picado still has enough autonomy to tone down the intensity of the Calderista project. At the behest of their American backers, he has mended his ties with the traditional elite of Costa Rica. The trade-off? The communists have abandoned the PRN.\n\nWhile the Americans would typically be ecstatic, this threatens the stability of the government, of which the communists made up a significant portion. The traditional elites may be necessary for governance, but they are hated by Calderón's supporters. Perhaps Picado may be less inflammatory, but Costa Rican society is no less divided."
COS_Calderonismo_3: "Costa Calderista"
COS_Calderonismo_3_desc: "Anyone who has been to the lush rainforests of Costa Rica will tell you it is impossible to get rid of the incessant buzzing of mosquitoes constantly swarming your ear. Anyone in the Costa Rican parliament will tell you that buzzing persists, despite the air conditioning and disinfectant, except these mosquitoes are life-sized, and take the form of opposition deputies.\n\nCalderónismo has entrenched itself as the cornerstone of Costa Rican politics. Now drawing support from every single vital interest group in the country, one would be hard-pressed to get anything done without the approval, or palm greasing, of one of their officials. Not only at home do they receive support, but from up North as well, as the newest allies of the OFN and their crusade against fascism. Calderón has ensured that his country will never be the same again, for he has turned his country into Costa Calderista."
COS_The_Widest_Tent: "The Widest Tent"
COS_The_Widest_Tent_desc: "The communist revolution has come to Costa Rica, but not like it did in Russia. Costa Rican communism truly seems to believe in the rule of all the people, and in its unique fashion seeks to create an extremely inclusive project. Socialist "democracy" in the country includes the small landowners, the Church, and even members of the old order. These members, however, stare down the more radical and dedicated communists of Guevarist and Amazonist tendencies.\n\nOne can only help but wonder: can this tent hold itself up? Can the creators of Costa Rica's newest political project manage to have conservatives and Guevarists break bread at the same table? Or will the red tent eventually cave in under its own weight and leave the country far worse than ever before?"
COS_Free_Costa_Rica_Movement: "Free Costa Rica Movement"
COS_Free_Costa_Rica_Movement_desc: "In a country with no military, it was a bone-chilling revelation when paramilitaries of all flavors were found in the country's hinterlands. It was already scary enough when the workers' militia marched into San José, but then came the UCR. Frank Marshall and his army of patriotas were famous for their tenacity during the 1948 Civil War, but the dubious background of Marshall kept him clear of true power with the help of the USA.\n\nThen the crypto-communists came, and evolved into the Bolshevik scum that took his land hostage. So he became determined to free it: free of American influence, free of communist treachery, and of corrupt, gluttonous elite. There are whispers that their leaders even want it free of Jews. No longer will their home be the territory of surrounding insurgencies or foreign ideologies; these men have dedicated themselves to freeing Costa Rica, whatever that may mean."
COS_Looming_Calderonista_Threat: "Looming Calderonista Threat"
COS_Looming_Calderonista_Threat_desc: "After the War of '48, Calderón and his cronies ran for the hills, fearing reprisals from the opposition at the height of polarization in the country. For years, these men have sat in exile, wishing nothing else but to return to their homes. While Calderón sits on his riches in Mexico, his men remain in Nicaragua, and with the help of Somoza, have begun to organize and arm their own militia as Figueres did nearly two decades ago.\n\nNow this militia watches over the border at the dense jungle and can only imagine the smooth, paved road to San José, strengthening their resolve. They open correspondence with figures from the OFN and anyone who will donate or back their movement. For now, the men train, Calderón waiting for the right moment to strike and return to his country, his office, his Presidency."
COS_The_Democratic_Alliance: "La Alianza Democrática"
COS_The_Democratic_Alliance_desc: "The PLN and PUN have seen their power stripped from them nearly overnight, but hope is not lost. While even an illiterate campesino could tell you that the Figueristas of the PLN would agree with absolutely nothing of the business-backed PUN, fate has brought them to the negotiation table. They are united by their common enemy, Rafael Calderón Guardia.\n\nThis shaky alliance is only meant to serve as a common front in the parliament, one of the last places the parties retain power - although it is slowly being eroded away. Their goal is to block his legislation and destabilize his rule enough to either depose him by force or, preferably, by the ballot. Time will only tell if this coalition can hold, because to put it simply, the only thing they hate more than each other is Calderón."
COS_The_Democratic_Alliance_2: "La Alianza Democrática"
COS_The_Democratic_Alliance_2_desc: "While even an illiterate campesino could tell you that the Figueristas of the PLN would agree with absolutely nothing of the business-backed PUN, fate has brought them to the negotiation table. They are united by their common enemy, the now-ascendant PRN.\n\nThis shaky alliance is only meant to serve as a common front in the parliament, to ensure that Picado Jr. is unable to place Calderón back in power. By blocking the president's legislative agenda, it is hoped that the PRN's momentum will stall and the party will be unable to weave another web of corruption from San José. Only time will tell if this coalition can hold, because the only thing they hate more than each other is Calderón."
COS_Representation_as_Pacification: "Representation as Pacification"
COS_Representation_as_Pacification_desc: "Costa Rica's democratic tendency allows for one of the only truly representative systems in the region. Their electoral process of proportional representation within the National Assembly is meant to capture an accurate snapshot of the people on election day, but in reality, it serves to give fringe parties a chance of having a seat. What is the point of these four or five seats? To let the extremists tire themselves out.\n\nBy giving them an outlet within the established legal and political framework, it is hoped that these diehard communists and fanatical fascists will simply wear themselves out with their soliloquies. By releasing this pressure, Costa Rican politicians hope that this will keep the likely armed supporters of these parties from engaging in terrorism, or worse, guerrilla warfare, a threat a country with no army cannot bear to face."
COS_Vanguard_of_the_People: "Vanguard of the People"
COS_Vanguard_of_the_People_desc: "During both of Calderón's presidencies, the PVP lost much of its societal stigma that communism had in Latin America thanks to its strategic alliance with the PRN and the Church. With its normalization, the ranks of the party swelled, and its popularity grew across the country. However, when Picado came into power, the PVP was written off in a deal with the traditional elite, betraying the years of compromise and negotiation undertaken by Calderón himself.\n\nThe result? Picado now finds himself reading headlines of strikes, beatings of those with ties to the elites, and general action against the state orchestrated by the PVP. These are only the actions done in public, as the National Police are rumored to have found weapon stores in the homes of the PVP's more radical members, inspiring fear in the minds of their former allies."
COS_El_Pinza: "El Pinza"
COS_El_Pinza_desc: "With the victory of the PLN, the entire country collectively breathes a sigh of relief. Costa Rican democracy has been saved from external threats, but the PLN remains a deeply divisive organization despite its beliefs. Their return to power after the equally divisive Calderistas has proven once more that fighting fire with fire leads to infernos.\n\n"Moderates" begin to sound like the former extremists, constantly insulting their colleagues, while the extremes have begun to engage in street battles with each other. While there are calls to deploy the police, the PLN can only hope that this fire will burn as short as it is intense, and that their newfound militants will eat each other alive before anything gets worse."
COS_Anti_Calderonistas: "Anti-Estabilidadistas"
COS_Anti_Calderonistas_desc: "With the finalization of Calderón's grip on Costa Rican political society, the final threat to their reign has been excised from potential power: the communists who now find themselves disenfranchised or arrested. What remains now is only the remnants of the PUN and PLN, whose frequent boycotts see them only further distanced from power.\n\nThe last bastion of resistance is based in the extremist Unión Cívica Revolucionaria, whose membership has ballooned since Picado's election. While they are weak, the idea of these "anti-stabilists," as they are referred to by the government, is enough to inspire fear in much of Costa Rica. Sensationalist headlines spread fear of terror attacks, and many murders are attributed to them; it seems that the UCR will serve as the justification for Calderón's reestablishment of the Armed Forces."
COS_The_Counterrevolution: "La Contrarrevolución"
COS_The_Counterrevolution_desc: "With the victory of Costa Rica's communist revolution, the calls for collaboration and peace have fallen on deaf ears. Over-eager militiamen have expropriated the country's largest estates in a violent manner, and have caused those that remain in limbo to quickly write checks and facilitate the import of weapons for the openly fascist Unión Cívica Revolucionaria, their desperate hope against the communist government.\n\nWith the richest men in the country covertly financing their anti-communist crusade, the government has been encouraged to expand the national militia to face their newest threat: The Counterrevolution. While the streets of San José remain quiet, save for an odd car bomb, in the countryside of the nation, a war between two fanatical foes rages. While the world watches the land of the "Pura Vida" descend into another episode of chaos, they cannot help but wonder who will win."
COS_The_Internal_War: "La Guerra Interna"
COS_The_Internal_War_desc: "Although Frank Marshall and his soldiers marched victoriously into the capital and solidified their control within Costa Rica's halls of power, this is not to say they have won the war. No, this is far from the truth.\n\nIn the slums of the cities and backwaters of the countryside lie another generation of guerrillas and resistors. The unionists, the suspicious peasants, the veterans of '48, and whatever is left of the communists all hide in the shadows, playing the long game with Marshall. And Marshall and his UCR won't take it lying down; they fight back, with their so-called "death-squads" roaming the country, looking for the rumored insurgents, beginning their never-ending war on the internal enemy, real or fake. With such a broad and elusive culprit, it seems the internal war has no true end in sight."
COS_Banana_Boom: "The Boom After the Bananas"
COS_Banana_Boom_desc: "Like every country in Central America, Costa Rica's main product was the banana, the sweet fruit that saw the USA and its United Fruit Company's tentacles gain a stranglehold over the economy. However, the relative stability and isolation of Costa Rica saw the UFC have trouble inciting coups or dictatorships, and caused the country to have a much more symbiotic relationship with them.\n\nIn 1957, Costa Rica was forced to diversify their economy after falling victim to crop diseases, and with the help of their stable and competent government and relatively strong infrastructure, this initiative was a wild success. With the production of other agricultural goods and even slight industrial production, foreign investment has rained down, fostering a middle class and elevating the entire country. There truly is no other way to put it: the economy is booming."
COS_Economy_a_la_tica: "Economía a-la-Tica"
COS_Economy_a_la_tica_desc: "When the PVP came to power, the propaganda began, and the changes came later. The militiamen came bearing decrees of expropriation, and large estates were broken up and redistributed. But anyone who knows Costa Rica knows that they follow no model other than their own. Land was redistributed not into collectives, but rather small and independent holdings, hoping this would increase productivity. Industry and private business remain, too, but find themselves complying with a long list of regulations, and awkwardly exist, threatened with an "employee takeover" at any second.\n\nAll is not well in Costa Rica, however. Communism remains taboo, and much of the wealth in the country is scrambling to leave it, leaving the People's Republic with not just less "people" but a lot less cash. The PVP must hope their initiatives can retain more of both."
COS_Fuerte_Grande_Y_Libre: "Fuerte, Grande, y Libre"
COS_Fuerte_Grande_Y_Libre_desc: "With the country in chaos, Frank Marshall must take drastic measures to recover the once-strong Costa Rican economy. Drawing inspiration from Francoist methods during the Civil War, he has begun the recovery with a propaganda offensive, blaring that the Costa Rican economy will not only return to what it was, but become "strong, grand, and free."\n\nFriendly regimes have already approved large loans to help the country put itself back in order, and the elite are either given government contracts or promised tax exemptions to return from exile. The government has engaged in large public works, industrial initiatives, and vanity projects in the hopes of not only recuperating their economy, but also their national pride. Yet, no amount of parks or fountains will hide the smoldering fields that never seem to extinguish, or the electrical lines that seem to cut themselves."

#Tooltips
COS_Calderon_Invasion_Avoided: "§GCalderón's invasion has been successfully deterred and Costa Rica's democracy is safe... for now.§!"
COS_Influence_Election_Tooltip: "§YWe will influence the coming election in favour of our preferred candidate.§!"
COS_Calderon_Invasion_Arbitration: "§YOpting to arbitrate the dispute will permit us to protect Costa Rica's democracy and further our relations with the country.§!"
COS_Calderon_Invasion_Guaranteed: "§YPermitting Calderón's invasion will mark the end of Costa Rica's democracy for the immediate future, however it will offer the OFN a guaranteed ally in the region.§!"
COS_Calderon_Invasion_Possible: "§RWith the collapse of the negotiations, we have no further means to influence Calderón. Costa Rica's fate will be decided by pure chance.§!"
COS_Calderon_Increase_Negotiations: "§FThis will §Gincrease§! the chance of the §VFigueres§!-§BCalderón§! §YNegotiations§! being successful.§!"
COS_Calderon_Decrease_Negotiations: "§FThis will §Rdecrease§! the chance of the §VFigueres§!-§BCalderón§! §YNegotiations§! being successful.§!"

#Events

 COS_forpol.2.t: "Finishing the Job"
 COS_forpol.2.desc: "The sun was unrelenting on the docks of Limón, dry planks creaking and warping under a percussive assault of heavy boots. The rusty freighter, San Joaquín, rocked gently against the pier as a group of sailors hurried along the ship's departure. Across the dockyard, the flags of Costa Rica and the Caribbean Legion fluttered in the coastal wind, forming a shifting collage of red and blue joined by the multicolored banners of the Panamanian Civil Guard, leftist student unions, and local police forces.\n\nCaptain Montoya stood on the ramp, clipboard in one hand, pistol in the other, brown eyes carefully surveying the latest group of soldiers to march aboard. Most were new faces, officers from towns he had never heard of, wide-eyed university students sometimes led by their middle-aged professors, and the occasional weathered faces of men he could only assume to be paramilitary.\n\nBeside him, Lieutenant Araya eyed the recruits. "Lots of green faces, Captain," he remarked grimly. "They should still be in school."\n\nMontoya didn't react. "Same age we were. They'll make it." He shifted his gaze to the farther end of the dock, where two older men in faded, mud-stained uniforms were hugging tightly. Montoya surreptitiously directed the Lieutenant's attention to the two veterans. Like him, they had survived the bloody 1948 stand at the Haitian border. "See, Lieutenant? Some old faces too."\n\nSomewhere on the ship, the practiced strums of a guitar broke over the din of boots. Montoya recognized the Legionnaire march immediately. His face lightened briefly, before he noticed the white American agent on the far end of the dock was locked in an argument with an observer from the Mexican government. He scowled."
 COS_forpol.2.a: "Like dreams, old grudges don't seem to die."

 COS_forpol.6.t: "An Opportunity"
 COS_forpol.6.desc: "Field Officer Richard Colton lit a Cuban cigar as he watched the sunrise bleed over Managua's rooftops. Outside, the streets smelled of dust and heat. He glanced down at the blurry photographs arranged on his desk and took a breath. The signs were overwhelming: rogue weapon shipments, training camps on the southern border, defections in the army, all carefully compiled in his report.\n\nColton discarded his barely smoked cigar, watched it flame out, and picked up the radio. "Sir, we have a concerning situation developing here. I have concrete evidence Rafael Calderón is amassing an army here for an unknown military operation." The radio hissed as Colton leaned back in his cramped office chair, sweat soaking his undershirt. "He's currently based outside of Sapoá. Some Nicaraguan officers are involved. Looks like Somoza's turning a blind eye or at least playing dumb."\n\nThere was static, then the dull click of the line engaging on the other end. A voice answered, low and composed. "Ten-Four Richard. Evidence indicates Calderón is planning a coup to reestablish himself as president of Costa Rica. Figueres has his friends here, but he's been testing our patience, especially since the Marshall debacle. Calderón's people have been making... quiet assurances. He's caught the ear of the administration."\n\nColton exhaled through his nose, relieving the sudden tension in his chest. "They're planning to march through La Fortuna. They think the Americans will whisk them on their way. Is that our official stance?"\n\n"No. Not official. We've made no promises." Richard heard the sound of a file being flipped open on the other end of the line. "The FBI thinks if this goes off clean, Calderón will be easier to work with. For now, do not initiate contact and remain in position. If something shifts, you'll be the first to know." The line went dead."
 COS_forpol.6.a: "He knew for a fact something would shift."
 COS_forpol.6.b: "In with the old, out with the new."

 COS_forpol.7.t: "An Open Hand, With Strings Attached"
 COS_forpol.7.desc: "U.S. Ambassador Raymond Telles arrived at Casa Presidencial unannounced, tie loose in the San José heat, flanked by a junior aide carrying a thick leather folder. Inside, President Figueres was still reviewing reports from Guanacaste: patrols spotted near the border, another arms seizure in La Cruz.\n\nWhen the brown skinned American diplomat was finally allowed inside, he wasted little time on pleasantries. "Señor Presidente, I'm under instruction to convey Washington's concern. We understand tensions are rising with the Calderonista elements abroad. It's our belief that a peaceful understanding, however uncomfortable, is preferable to bloodshed. As an interested party, the United States has offered to mediate this dispute and avert instability."\n\nFigueres scoffed. "Raymond, you must be kidding me. The last time Rafael Calderón offered us peace, it ended with bodies covering the road to Cartago. The U.S can't seriously be considering negotiating with an exiled communist you helped oust."\n\nRaymond smiled without much warmth. "I understand your concerns, but that was fifteen years ago. This is now. I'll be more explicit: the President expects Costa Rica to enter negotiations with Calderón. If you refuse, I can't guarantee how he'll react." Behind the ambassador's words, the meaning was clear. If the United States believed Calderón could be controlled, they might allow his return. And if San José refused to talk? Then perhaps neutrality would not be the only thing America offered.\n\nReluctantly, Figueres signaled to his Minister of Foreign Affairs. "Assign someone to the embassy. Junior-level. He'll listen. That's all." He fixed the ambassador with a hard look. "Mr. Telles, I hope you know what you're doing.""
 COS_forpol.7.a: "Let them talk, but not too loudly."

 COS_forpol.8.t: "Numbers and Dice"
 COS_forpol.8.desc: "REPORT: RAND Corporation Conducting Regional Attitude Surveys in Costa Rica With Focus on Former Presidents and Political Stability\n\nRaymond Telles looked grimly at the paper. His life had been dedicated to advancing U.S interests in Latin America. Sometimes he felt that such a project was a Sisyphean task. Calderón was chomping at the bit for any forward progress, and Figueres kept digging in his heels. The leak was his calculated gamble to stop a collapse of the talks.\n\nRAND didn't commission opinion surveys in small republics for academic curiosity. Washington wanted to know how much support Calderón still held among the electorate and within the army. The questions about Castro and Michalski were just red herrings, half-hearted attempts to conceal the clear purpose of the initiative.\n\nHours after the leak, the phones in the embassy were ringing off the hook. The Costa Rican government was furious, and a flurry of reporters descended on the building. When pressed, attachés offered only that the embassy had "authorized limited polling" in cooperation with RAND to gauge "regional democratic durability."\n\nMinister of Foreign Affairs Benjamín Odio stormed out of the chamber that afternoon. "Is this the American idea of friendship now?" he shouted to waiting journalists. "To ask if our people want the old regime back? To float the idea like a balloon before they drop a government from thirty thousand feet? The citizens of Costa Rica must recognize this for what it is: blatant meddling in our affairs!"\n\nAt the U.S. embassy, Raymond Telles received a private call from Rafael Calderón expressing his utmost satisfaction and a promise to remain in the talks."
 COS_forpol.8.a: "The boulder steadies."

 COS_forpol.9.t: "The Eagle Flies South"
 COS_forpol.9.desc: "In the Palacio Nacional, the afternoon haze of Mexico City slipped into dusk as a manila folder smacked down on the president's desk. Prying open the file, [MEX.GetLeader] scanned through intercepted chatter detailing Calderonista activity in Nicaragua. Two things became immediately obvious: Rafael Calderón, former president of Costa Rica, was currently in U.S-sponsored talks with the Figueres government, and if the talks fell through, Calderón was preparing to invade. The exhausted president pushed the folder back, drained from a day resolving ceaseless problems. "So Figueres is actually considering a deal with the bastard?"\n\nThe foreign affairs minister shrugged. "He's placating the Americans. Calderón seems to have quite a few friends in Washington..."\n\nA silence settled back over the darkening room. Mexico had watched Costa Rica carefully in the years following the 1948 civil war. Calderón's return, even without American backing, would upend the uneasy balance in the region. One more strongman born from the fires of a coup, one more destabilizing event that might spark into Mexico itself. Moreover, more American influence in Central America would come with complications of its own.\n\n"We have options, Your Excellency. We could leak this report to La Nación by tomorrow and whip up some outrage in Costa Rica. No one will be pleased that the President's kowtowing to a traitor. Otherwise, we could try and call in some favors with the government itself and talk Figueres down. We have had a positive relationship with Minister Benjamín Odio in the past." The man coughed and then continued more softly. "Or...Mexico could stay silent. Let the talks continue. If Calderón returns to the country, he can be placated more easily. At least it will be by a handshake and not gunfire." The man straightened. "We await your orders, Your Excellency.""
 COS_forpol.9.a: "Say nothing and let Washington meddle. There's nothing to be gained from this."
 COS_forpol.9.b: "Turn the heat up on Figueres and leak the negotiations to the press right away. Teach him respect."
 COS_forpol.9.c: "Call up Benjamín Odio, discreetly. Let's see if our friends in San José can nip this in the bud."

 COS_forpol.10.t: "Running Out the Clock"
 COS_forpol.10.desc: "Ambassador Raymond Telles had managed political crises before, but negotiations between the Figueres government and the exiled Calderonistas were proving to be uniquely tiresome. After days of belligerent back and forth demands, Telles felt he might have more luck teaching both sides to fly than teaching them to make peace.\n\nFrom his office in San José, the ambassador had watched things unravel as the Figueres cabinet dug its heels in and demanded disarmament while Calderón raged and threatened to launch a coup. Public pressure and internal discontent in Costa Rica was now rising, and the stability of the talks was teetering dangerously as Figueres' resolve sapped away.\n\nFrom Sapoá, Telles had received repeated phone calls from Calderón demanding U.S concessions if talks fell through. Agents monitoring the camps reported growing distrust toward Washington and growing radicalism among the officers. The exiles had come to believe the United States was dragging out negotiations to keep them contained and that the Americans had no intention of enforcing a deal. Time was running out.\n\nThe whirring of a printer shook Telles from his musings. He stood up and quickly glanced at the newly received message. It was exceedingly short, marked from the FBI office in San José. "Negotiation leaks traced to Mexico. Mexican lobbyists pressuring government to end the talks prematurely. I believe they won't stop until they do. End Report."\n\nTelles frowned and discarded the paper, suppressing his sudden anger at the Mexican government. Letting loose on Mexico, meddling snakes that they were, might force some progress, but it would come at a steep cost for the U.S's uneasy relationship with the country. If he let things keep going, though, the talks would probably collapse in days. Telles felt himself slump. There would be no restful nights anytime soon."
 COS_forpol.10.a: "Support the process. Both sides must return to the table."
 COS_forpol.10.b: "Call the State Department. Mexico can't get away with this." 

 COS_forpol.11.t: "The Hint of a Smile"
 COS_forpol.11.desc: "Telles carefully examined the dispatch sitting on his desk for a third time, committing the detailed clauses blanketing the page to his memory. At last, the Figueres cabinet had closed ranks around the president and redoubled negotiation efforts. What weeks ago seemed unthinkable, an accord with Rafael Calderón, was now tantalizingly close. The compromise detailed in the dispatch was almost perfect: Calderón would be pardoned and returned to Costa Rica, his supporters would demobilize, and Figueres could keep governing until he faced elections in 1966.\n\nAll that remained was for Telles to reap his success. Slowly, he began composing his return message to Costa Rica, adding new clauses sent in from the State Department. Calderón would be offered Ambassadorship to Mexico, a diplomatic post befitting his status as a former head of state. The appointment would let Calderón escape political limbo and place an American ally on the negotiating table between Costa Rica and Mexico. More importantly, it would draw Costa Rica deeper into the American sphere, reversing years of independence by the small Central American republic. The deal would be a clear victory for the U.S, all that remained was for Telles to close things out.\n\nThe ambassador privately believed that such an ambitious display of American power would raise Mexico's hackles. Elevating Calderón to such a role would doubtlessly be seen as provocation by the isolated Mexican republic. "More angry parties. Exactly what the world needs." The diplomat muttered to his empty office. More problems for him to resolve down the line. Still, he knew the strategic benefits for the U.S. outweighed the damages. Finishing the final clauses of the arrangement, Telles scanned his message over thoroughly before sending it off. Leaning back in his chair, the corners of the Ambassador's mouth curved slightly upward."
 COS_forpol.11.a: "Calderón in Mexico City is a win for everyone other than Mexico."

 COS_forpol.12.t: "The Exile's New Clothes"
 COS_forpol.12.desc: "Enrique Monoto found himself fighting to stay awake. The meeting, a routine sit-down with the Costa Rican deputy Foreign Minister, seemed endless. Enrique slowly felt his eyes drooping as the official went on and on about textile imports, customs agreements, and maritime cooperation. Suddenly, something pierced the Mexican Ambassador's consciousness. "I imagine Mexico will welcome him graciously, even if the Americans did have a hand in it," the deputy remarked.\n\nEnrique blinked, fighting back the fatigue he had been stewing in. Something about what the man had just said bothered him. "I'm afraid I don't follow. What are you talking about, deputy?" He pulled himself upright in his chair.\n\nThe official hesitated, a sense of unease evident on his face. "Calderón," he said. "President Figueres has agreed to name him ambassador to your country after he is pardoned. We assumed your office was already informed."\n\nBy nightfall, Enrique's report was sitting on the President's desk in Mexico City after urgent delivery by diplomatic couriers. Somehow, the Americans had actually managed to convince Figueres to restore Rafael Calderón from exile. Not only that, they were trying to place their puppet as the new ambassador to Mexico to tilt Costa Rica toward the OFN.\n\nThe Mexican Minister of Foreign Affairs spoke with some haste. "Mr. President, we've compiled a proposal we believe can avert the worst effects of American meddling. If we offer Calderón "humanitarian" grants through the DFS, we can give him rectorship of a school in San José. A medical university, something that will keep him out of trouble and out of our business. If he becomes ambassador, Washington wins a permanent voice in our bilateral relations with San José. As a doctor...it's unlikely we'll have to deal with him again. I suggest you consider your options carefully.""
 COS_forpol.12.a: "Send the offer for the school. He'll do no harm there."
 COS_forpol.12.b: "Prepare to accommodate our new ambassador. At least the situation is all over now."

 COS_forpol.13.t: "Two Weeks, Maybe Less"
 COS_forpol.13.desc: "The morning brief hit Ambassador Raymond Telles' desk like a punch to the ribs. He had braced himself as he watched negotiations collapse in slow motion, trying to warn both sides against the violence they seemed hellbent on provoking. Yesterday, tensions had reached a fever pitch when Costa Rica had intercepted a gun shipment on the way to Sapoá, a clear violation of the cease in operation agreed upon for the talks.\n\n"Calderón's walking," explained one of the Ambassador's senior aides. "He's pulling out of San José. Agents say he's going to take the country over by force. He has a good chance of succeeding, too."\n\nTelles ran a hand down his face. "How soon?"\n\nThe aide hesitated and picked up a paperweight on the table. "The SIS got a whisper from their people in Rivas. Two weeks. Maybe less. Troops are already mobilizing. Quite a few of our former contacts are now missing in action. Most of what we have now is third-hand. We believe Calderón threatened or killed most of our obvious contacts. The situation is degrading more quickly than most of our boys prepared for." The man threw the paperweight back down grimly.\n\nTelles stood and crossed to the window. Rain patted the glass faintly, soft and constant, like a clock running out. Like the negotiations, he felt his mood spiralling into collapse. "We got close." Finally, he addressed the aide standing dutifully behind him. "Give the order and recall any field operatives exposed in the Calderonista camps. At least we can limit the damage.""
 COS_forpol.13.a: "Outside, the rain picked up into a downpour."

 COS_forpol.14.t: "The Long Way Home"
 COS_forpol.14.desc: "The jacaranda trees rustled in the courtyard of Costa Rica's embassy. Rafael Ángel Calderón Guardia sipped his coffee, remembering the barons who once propelled him into the presidency. Now, he sits in Mexico City, not as the leader of a country, but as an ambassador for his homeland.\n\n"You always drink your coffee black," his son noted, sitting across from him.\n\n"Bitterness teaches you something, hijo." Calderón set his cup down. "Especially after you taste it for almost twenty years."\n\nHis son nodded. He grew up watching him fight political rivals, American businessmen, and Mexican spies. Now the old man sat under foreign trees in peace, but not quite at home.\n\n"And now you're popular again. In a good way." Calderón's son paged through the letters. "Only warm words from your opponents back then."\n\nCalderón chuckled. "They're beginning to understand. Every law, every reform. Everything, it was for Costa Rica."\n\n"And Mexico?" His son lowered the papers.\n\nCalderón took a slow sip. "Mexico gave me a scalpel. Costa Rica and America gave me my home back. My debt is to my country, not Mexico."\n\nThe wind carried the jacaranda blossoms' scent throughout the courtyard. Years of exile didn't dull Calderón's love for his homeland. He would sit here, quietly keeping watch on Mexico's influence, until the day he died. Not as a hero or warrior, but a line in the sand."
 COS_forpol.14.a: ""When my time comes, hijo, you will carry on my legacy.""

 COS_forpol.15.t: "What Keeps A Body Working"
 COS_forpol.15.desc: "Ambassador Telles looked over his notes. The university in San José was planning on breaking ground on a new, state-of-the-art medical college later in the year. This had been a long-standing goal of Costa Rica, to attract top talent to help teach the next generation of doctors and advance Costa Rica's regional standing as a true leader in medicine and medical research. This had all been well and good, of course, but there was only one problem: Mexico was paying for it.\n\nThis was hardly unusual foreign policy coming out of Mexico City, but only a fool believed in the inherent goodwill of other nations. Mexico had wanted Calderón out of Costa Rican politics and devised an ingenious solution, making him the rector of the new college. For Calderón, the man who had been behind the public health system, it was a singular honor that would also stop him from potentially making trouble and trying to invade Costa Rica. The Americans knew all too well Calderón could be difficult, hence why they had sought to make him the ambassador to Mexico. That way, he could effectively counter Mexican interests while staying out of Costa Rican domestic politics. In one stroke, Mexico had hoped they could neuter him.\n\nTelles had a proposal in his hand. No matter what the Mexicans could pay, the Americans could outbid them without even trying. If he could call the right people, then the State Department could easily authorize direct financial aid that would easily finance the hospital's construction, and best of all, Mexico would have no ability to protest. More benefit, and Calderón would be free to become the ambassador.\n\nYet he already heard the bean counters protest. Just let Mexico buy the hospital. In half a generation, no one would remember, and the US could have spent more effectively influencing Costa Rica to be a good partner and friend to the Americans through other policy measures. The question he had was, should he ignore the naysayers or should he cede to their wisdom?"
 COS_forpol.15.a: "Out-bid the Mexicans. Every dollar buys Costa Rican goodwill and stops Mexico's plans."
 COS_forpol.15.b: "It's just a hospital. There are more cost-effective ways to influence the country."

 COS_forpol.35.t: "American Blessing"
 COS_forpol.35.desc: "The sunlight glistened on his office desk, struggling its way through the slits in the window shades. The coffee's aroma wafted through the air, reaching Colton, who promptly took a sip from his mug. Years of operating in Latin America made him miss good old American coffee.\n\nHe picked up the Washington Post, thumbing through the pages for any mention of Costa Rica. His eyes crossed a headline. Yet another victory for Calderón in Costa Rica. He nodded. It was one thing to invade a country; it was another to establish legitimacy through an election.\n\nOf course, Colton didn't cross out the possibility that the elections were rigged. The OAS certainly seemed to think so. All across the hemisphere, representatives of different nations gathered to call out Calderón for his shady tactics.\n\nBut it didn't matter if Mexico City or Havana thought Calderón was an illegitimate bastard. All that mattered was Washington. And if Washington thought Calderón won fair and square, then Calderón won fair and square. There was no debating the issue.\n\nColton put down the newspaper, taking another sip of coffee. What was up for debate, however, was OFN membership. Taking them in after such a controversial invasion would definitely cause problems with the rest of the alliance. It would take maybe another four years. Maybe another election. Maybe another operation.\n\nColton shuddered at that thought. It wasn't that he had a problem with rigging elections or determining the fate of countries with one simple phone call. Latin America was... harsh. Humid. Full of those mosquitoes nipping at every crevice of your body.\n\nHe finished his coffee, getting up to refill the mug for the third time that morning."
 COS_forpol.35.a: "But for now, he would enjoy America until the next Costa Rican election."

 COS_forpol.34.t: "Liquor for Loyalty"
 COS_forpol.34.desc: "A bouquet of flowers, a Manila folder, and a bottle of Cacique Guaro.\n\nThe odd lineup of items along the table stared at Walter. "Well, Mr. Segreda, if you wanted to buy American support, you could have at the very least brought over better drinks." The American ambassador twisted open the cap and poured both of them a small amount of liquor.\n\n"It's the finest from Costa Rica, Mr. Ploeser." The Costa Rican envoy quickly took a sip of the drink before opening up the folder for Ploeser to read. "As you've heard from the news, the Partido Restauración Nacional has won again in recent national elections. In a landslide, of course."\n\n"Yes, yes, Special Intelligence Service told me all about it." Ploeser waved away the folder. "However, I assume you've also heard from the news that the OAS doesn't believe the election was legitimate at all. Mexico's not even recognizing Picado's won the election. And you've come over to get America involved in this situation, why?"\n\n"Because we want membership in the OFN, Mr. Ploeser." Segreda closed the folder. He adjusted his glasses before going on. "Your goal is to prop up friendly regimes in the Americas, yes? We've followed your rules. We've cooperated with that fruit company. We've given Costa Rica a functional state. All we ask is your guarantee in the OFN. And if, let's say, you Americans deny us this request, imagine how the polls would look if Costa Rica gets rejected by the OFN and OAS. Imagine what the next elections could look like."\n\nPloeser looked at Segreda's face. Stone cold. He didn't need to mention the alternatives. His face was telling enough."
 COS_forpol.34.a: ""I suppose we have a spot open in the OFN.""
 COS_forpol.34.a.tt: "\nWe will §Gensure§! [COS.GetFlag] §BCosta Rican§! entry into the §mOFN§! - even if the §Dother members§! might require a little extra£GFX_green_dollar_sign §&convincing§!£GFX_green_dollar_sign"
 COS_forpol.34.b: ""We're only going to endorse the PRN. No more, no less.""
 COS_forpol.34.b.tt: "\nWe will §Rdeny§! [COS.GetFlag] §BCosta Rican§! entry into the §mOFN§!, but at the same time doubling down on our support for the §gPRN§! and its continued rule."
 COS_forpol.34.c: ""We'll take our chances.""
 COS_forpol.34.c.tt: "\nWe will neither §Gendorse§! nor §Rdeny§! [COS.GetFlag] §BCosta Rican§! entry into the §mOFN§!, and let things play out as they will."

 COS_forpol.36.t: "Rigging it Again"
 COS_forpol.36.desc: ""Let me get this straight, Segreda. Just a couple years ago, you wanted me to get Uncle Sam to endorse Picado and his government. Now, here you are, at my desk, asking me to get the PRN to... hold elections?"\n\nWalter Ploeser rubbed his temples, trying to make out the mental gymnastics the Costa Rican ambassador was putting him through. It wasn't every day you had a dictator willingly hold elections. It went against the entire philosophy behind dictatorships.\n\n"Yes, Mr. Ploeser," said Segreda, seemingly unaware of the confusion he was causing the American ambassador. "The Costa Rican citizens have, eh, well... not been too happy under the Picado government, and of course, want elections."\n\n"And let me guess, the folks in the PRN don't want elections because they haven't been able to win the past two without forged ballots?" Ploeser raised his eyebrow. "I'm not sure they'll listen to me, Mr. Segreda."\n\n"They will, Mr. Ploeser. They have to." Segreda leaned forward until his face was only mere feet away from Ploeser's. "The PRN is very grateful for America. Demands from Washington mean a lot more than mere demands from me. They need this election, they need some kind of legitimacy, they need to prove to Costa Rica that Costa Rica needs them. That Costa Rica needs the PRN, not the socialists."\n\nPloeser sighed. He took out a bottle of liquor, the same bottle Segreda had gifted him years ago. Surprisingly, he found the cheap liquor beneficial in helping him make decisions like this. Or maybe it made him too drunk to overthink the situation. But Segreda was right. If there were no elections, the PRN would fall from all the civil unrest. Ploeser just had to hope the PRN would listen to his suggestion. And that the PRN would rig this next election even harder."
 COS_forpol.36.a: "A toast to democracy."

 COS_forpol.37.t: "Cometh Before the Fall"
 COS_forpol.37.desc: "Utter disbelief.\n\nThere were no better two words that could describe Ploeser as he read the memorandum from the Costa Rican field agents. The PRN refused all American demands and decided to stand its ground, refusing to hold emergency elections as the country was falling apart from the inside.\n\nHow stupid could they be, Ploeser thought, as he tore the paper in half before slumping down in his chair. They could've rigged the elections again. They could've shown off some kind of legitimacy. But they couldn't. No, they wouldn't.\n\nPride. Pride ate up the PRN. That must be what the 'P' stood for in PRN. Prideful Picado put the PRN in a pickle. A pickle that would pull their country apart.\n\nPloeser put both of his hands over his face. Allegedly, Segreda was fired for even bringing up such a suggestion, so Ploeser had no one to complain to but the empty bottle of liquor on his table. He could hardly remember the name of it.\n\nWhat made the situation even worse was the PRN doubling down on its dictatorship. Overnight, Picado had gained near dictatorial powers and declared martial law in the hopes it would discourage protesting. The White House had already made countless frantic calls to San José to try to get Picado to step down and resign, but they all fell on deaf ears, as was expected.\n\nIt was already too late, Ploeser thought. There was nothing else he could do to prevent the fall of the PRN. Outside, the roars and chants of the Costa Rican protesters reverberated along the embassy's walls, and all Ploeser could do was hope the next government would still be friendly to Washington."
 COS_forpol.37.a: "But the bottle would remain empty."

 COS_forpol.38.t: "Unwelcome"
 COS_forpol.38.desc: "RESTRICTED\n\nFROM RICHARD COLTON\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SOCIALIST REVOLUTION IN COSTA RICA - LOSS OF ALLY IN REGION\n\n1. A socialist-led popular front, led by Carlos Luis Fallas, has couped the Partido Restauración Nacional (PRN) government in Costa Rica, ousting former president Teodoro Picado Michalski. Following weeks of popular protest against the PRN, the Picado government has finally fallen, and with support from army mutineers, has seized control of the state government.\n\n2. The PRN had initially been aligned with American interests and had been aligned with the goals of the United Fruit Company (UFC). However, intelligence on the ground and intercepted memorandums have suggested the new government's intention to roll back the UFC's influence in the country, and consequently, American influence as well. This is to be expected from a leader like Fallas, who holds many grievances with the UFC.\n\n3. The new government, led by the Partido Vanguardia Popular (PVP), is a wide front uniting many PRN and PLN figures into a unified socialist government. It is unlikely for us to find and support any influential group or politician not already within the PVP.\n\n4. Costa Rica is no longer under the American sphere of influence. Field agents will still do their best to monitor and contain the situation; however, our presence here is no longer sustainable. Further involvement risks provoking the new government and compromising our intelligence assets in the region."
 COS_forpol.38.a: "Fidelity, Bravery, Integrity."

 COS_forpol.39.t: "A Letter from San José"
 COS_forpol.39.desc: "The doors of Costa Rica's presidential palace swung open. Frank Marshall stepped through as communist bureaucrats and socialist ministers were escorted out by armed soldiers. His boots echoed sharply on the tiled floors, marching through the building that had changed hands twice over the course of a couple of years. Marshall hoped it would be the last change Costa Rica had to experience.\n\nThe syndicalist experiment of the Partido Vanguardia Popular had ended as abruptly as it began. Red banners had been torn, and with the help of the Condor Legion, Costa Rica had been rid of the communist mess the PVP had left Costa Rica in. He recalled his days in Hanover back in 1936. He couldn't help but compare himself to Hitler purging Germany of the thieving socialists.\n\nMarshall paused briefly in the presidential office before sitting down at his new desk. A line of officers brought him stacks of papers. Lists of suspected PVP sympathizers, voided contracts with the United Fruit Company, and, of course, state-controlled press releases for tomorrow morning.\n\nBefore he could take a look at any of the documents, Marshall had more pressing concerns. Besides the few fascist countries in Latin America, Marshall was effectively geopolitically isolated, surrounded by the Americans, Mexicans, and communists in the region, none of whom would be receptive to the new government in San José.\n\nSo Marshall would not handle his stately affairs. Not today, at least. Marshall took a pen. And he started writing. Writing to any nation that was willing to find a new friend in Latin America."
 COS_forpol.39.a: "To our new friends in Costa Rica!"

 COS_forpol.40.t: "One Last Chance"
 COS_forpol.40.desc: "Across San José, election banners dominated every corner of the city. The registered voters were preparing once again to do their civic duty, and you could not go anywhere without seeing and hearing candidates urging you to vote for them, and their party. Without these elections, the country would have fallen apart after Picado alienated the communists. It was also the case for those who may not be able to vote in the elections, but wished to participate all the same. On the surface, an election, but a country was held in the balance.\n\nNothing so vulgar as stealing an election, of course. That would be too overt, too liable to backfire, too messy to manage even if successful. But there were ways, perfectly legal, even expected for an outside power. Discussions of trade and other foreign policy dangles, those always motivated the politically-engaged. Paying staff to stuff envelopes, hand out pamphlets, and print fresh posters to reach a large number of voters, especially in urban areas. In the countryside, sending out speakers and hosting rallies got the people talking.\n\nThe real question was who for? The PRN and Calderón were an obvious choice, he had a great deal of strength and political clout to realize his vision, and he was committed to working with the OAS. But he was a strongman, not good for the health of a democracy. He would deliver what he promised, but he had his own aims on Costa Rica, that of a democracy where the scales were already weighted. Prosperity, peace, but a country that existed on his terms.\n\nThe opposition sees this election as their last chance to credibly exist in Costa Rica before they're all silenced at the hands of the Calderonists. Even if Calderón would run a clean election, the opposition would face an uphill battle, but the opposition can bet on its ballots getting "lost" and Calderón suddenly finding more people willing to vote for him. They would easily take our money, but would it even matter in the face of so much resistance?"
 COS_forpol.40.a: "Calderón will soon see a windfall, and we know it will be returned."
 COS_forpol.40.b: "The PRN needs to be cut down a peg. Finance the opposition."
 COS_forpol.40.c: "We're staying out of this."

 COS_forpol.42.t: "On the Wings of Victory"
 COS_forpol.42.desc: "Calderón had not just won. Calderón had swooped into the political establishment and secured himself everything a nest needed to hatch a new Costa Rican future. Picado's phoenix had burned out; now Calderón rose from those ashes prepared to birth a new constitution.\n\nWith the OAS mandate behind him, Calderón turned to the opposition, clamping down on them. With the words of "securing democracy" on his lips, auditors looked for any discrepancy in tax records and paperwork, looking for any vulnerability to bring the power of the state to bear against them. Opposition newspapers were scrutinized, with the threat of costly libel lawsuits or even shuttering as a penalty for "printing falsehoods." Senior opposition figures could see the vultures circling overhead, eagerly awaiting to pick at the corpses of their political careers. The OAS said nothing, prepared to look the other way or quietly eat any words of protest. What mattered was the result, and what came of it. Everything else was secondary, mere shadows in the wake of the mighty wings of Calderón's new future.\n\nCalderón had promised a new age of cooperation with the OAS and it had already begun to show. American businesses could find plenty of willing resources and partners willing to find shared profit together within the rich and verdant territory of Costa Rica, and plenty of firms had plans already put to paper, simply ready for a signature. As the opposition circled the wagons, PRN politicians went on the radio to cheerfully announce the benefits that the new constitution would deliver to the working man and the businessman alike. This was Calderón's country, and he looked upon it from his eyrie to see the things he could bring to it.\n\nAnd next to Calderón, another mighty bird looked out and saw a country safe within its grasp."
 COS_forpol.42.a: "The Yankee Eagle has found its roost."

 COS_forpol.44.t: "Feet of Clay"
 COS_forpol.44.desc: "From: Office of Central American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: Costa Rican Succession\n\nThe 1974 elections within Costa Rica are rapidly approaching. Current president Rafael Ángel Calderón Guardia has expressed a desire to run again, but his declining health has led him to name his son, Rafael Ángel Calderón Fournier (Rafael Jr.), as the new head of the PRN. Rafael Jr. is young and inexperienced, with only a short tenure as PRN Youth President and minor regulatory experience on the public pension program.\n\nThis move has angered senior members of the PRN, many of whom see their political opportunities dwindle with the appointment of a young and untested successor. Political analysts in the Intelligence Community believe that Rafael Jr.'s inexperience will likely lead to political and legislative mistakes. His lack of allies within his own party will undoubtedly cause further political friction. While Costa Rica remains a stable country, analysts believe that Rafael Jr. will be highly unlikely to match his father's tenure as head of state.\n\nAnalysts note, however, that Rafael Jr.'s inexperience and tenuous position means he will be unlikely to seek foreign patrons outside the United States. He has no contacts with Germany, Japan, or Mexico and will likely seek to maintain the status quo with the United States to secure his position. Analysts conclude that while this is not an ideal choice, it is manageable with current intelligence assets and resources for the next five years."
 COS_forpol.44.a: "Fidelity, Bravery, Integrity."

 COS_forpol.45.t: "Triumph of the Liberators"
 COS_forpol.45.desc: "By nightfall, the results were no longer in doubt. Despite accusations of fraud, governmental intimidation, and foreign manipulation, former president José Figueres' resurgent Partido de Liberación Nacional had emerged victorious in Costa Rica's emergency elections. The fragile PRN regime under Rafael Calderón was swept away due to immense public backlash, calling into question the country's continued pro-American alignment.\n\nThe streets of San José are reportedly bustling with celebration, with a broad spectrum of the Costa Rican populace happy to see the short lived Calderonista anocracy collapse. The return of aging progressive Figueres signals a transfer of power back to a non-aligned and politically left-leaning Costa Rica. Already, the U.S. Embassy and Mexican diplomats have had much of their clearance revoked.\n\nPublicly, Figueres has vowed reconciliation after what he calls "a period of darkness in the country's history". Former officials from the PRN, no longer shielded by American patronage, have already begun to flee the country. Rafael Calderón and his ally Teodoro Picado fled in the early hours of the morning, taking refuge in Puerto Rico to escape persecution by the new government.\n\nIn Washington and Mexico City, analysts now scramble to understand what will come next."
 COS_forpol.45.a: "The domino has just knocked itself off the table."

 COS_forpol.50.t: "A Difficult Ally"
 COS_forpol.50.desc: "RESTRICTED\n\nFROM RICHARD COLTON\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: COSTA RICA JOINS THE ORGANIZATION OF FREE NATIONS\n\n1. Costa Rica has joined the Organization of Free Nations with heavy American support. As part of their obligations, Costa Rica has pledged to assist in the defense of the Americas and the South Pacific alongside all members of the OFN. In exchange, the members of the OFN pledge to assist in the defense of Costa Rica as well.\n\n2. The entry of Costa Rica into the OFN has proved to be the most controversial addition yet. Costa Rica's current government has been deemed illegitimate by some OFN members. Not only did their leader, Rafael Ángel Calderón Fournier, launch an invasion of Costa Rica to secure power, but many members of the OFN have called into question the legitimacy of the recent electoral victory of the Partido Restauración Nacional. For some, a hardly-democratic country like Costa Rica has no place in the OFN.\n\n3. It is of note that this was only allowed due to Costa Rica's government being so closely aligned with American economic and political interests, causing many intellectuals across Latin America to call into question the "predatory influence" America holds in the nation.\n\n4. Costa Rica's contribution to the OFN will be monitored and evaluated. There is little use in backtracking on the decision now; however, the backlash against Costa Rica's entry should inform us of how future admissions should warrant stricter standards."
 COS_forpol.50.a: "Fidelity, Bravery, Integrity."
 
 COS_forpol.53.t: "The Rock of Central America"
 COS_forpol.53.desc: "RESTRICTED/[GetDateText]\nMEMORANDUM FOR THE DIRECTOR\n\nSUBJECT: COSTA RICAN ELECTION\n\nCosta Rica finished their inaugural proceedings yesterday, resulting in a stable and orderly transition of power. A rarity among Central American countries, the office of the Costa Rican presidency enjoys stable institutions, which translates into a strong sense of nationhood and has a large degree of institutional trust that transcends political parties. Parties in power act within the auspices of the Constitution while opposition politicians settle into opposition roles without resorting to political violence.\n\nAn island of stability, Costa Rica remains relatively uninvolved in Central American affairs, refusing to finance or provide support to armed groups in neighboring countries to pressure their governments or overthrow unfriendly heads of state. This refusal to export instability is by no means unique in Central America, though most governments do not do so merely due to lack of capacity rather than official policy.\n\nCosta Rica is projected to continue along this trajectory, enjoying modest but stable GDP growth, though individual fiscal years are subject to the whims of global demand and may cause minor economic distress. As Costa Rica continues to enjoy stability, the country is predicted to diversify its economic prospects and increasingly look to import technology and consultants to improve their standard of living. The country is predicted to pose a minimal security risk in the medium to long term."
 COS_forpol.53.a: "Fidelity, Bravery, Integrity."

 COS_news.1.t: "[Get_newspaper_header]PUN Victory in Costa Rica"
 COS_news.1.desc: "Following a turbulent year filled with threats of invasions, coups, and chaos, cooler heads have prevailed. After the former president and would-be ruler of the small nation, Rafael Ángel Calderón Guardia attempted to reassert his claim to leadership with the backing of several OFN-aligned states, the nation had been plunged into a period of deep uncertainty. However, with the former President pacified, the nation can breathe a sigh of relief.\n\nAs the dust settled, elections could be held. The PRN - Calderón's political party - recognised their leader's defeat and stepped away from the race, backing the fiscally conservative PUN instead. With the PRN's support, PUN leader and former President Mario Echandi Jiménez has officially secured the presidency of Costa Rica and dethroned the incumbent PLN, promising a more critical, fiscally conservative approach towards the PLN's social reforms, alongside improved economic growth - much to the delight of both the PUN and PRN's American friends.\n"
 COS_news.1.a: "The more things change, the more they stay the same."

 COS_news.2.t: "[Get_newspaper_header]PLN Victory in Costa Rica"
 COS_news.2.desc: "Following a turbulent year filled with threats of invasions, coups, and chaos, cooler heads have prevailed. After the former president and would-be ruler of the small nation, Rafael Ángel Calderón Guardia attempted to reassert his claim to leadership with the backing of several OFN-aligned states, the nation had been plunged into a period of deep uncertainty. However, with the former President pacified, the nation can breathe a sigh of relief.\n\nAs the dust settled, elections were held, and with them came a resounding vote against authoritarianism of any kind. Despite having the support of the PRN, the PUN's conservative campaign was unsuccessful in unseating the incumbent PLN - although this time with the far more moderate Orlich Bolmarcich at the head. De-emphasizing socialistic policy and reaffirming a commitment to capitalism and strong democratic institutions, the PLN hopes to keep the nation in the good graces of democracies all over the world.\n"
 COS_news.2.a: "Thank goodness they were sensible."

 COS_news.3.t: "[Get_newspaper_header]Costa Rica Falls to Coup"
 COS_news.3.desc: "Rumours have been building for weeks, and for Costa Ricans, the expected has finally happened. Former President Rafael Ángel Calderón Guardia, with the backing of other OFN-aligned nations, has crossed the Nicaraguan border and launched a successful military invasion of Costa Rica. While his army faced some resistance from hastily organized paramilitaries, they quickly reached San Jose and secured Calderón's rule.\n\nNow, as the former President once again stalks the halls of the capital, Costa Rica finds herself far more open to cooperation with the United States. No word has been heard yet of the country officially joining the OFN, but with the new regime's ties to the hegemon, it seems like more of a formality than anything else to many.\n"
 COS_news.3.a: "Another domino propped back up."

 COS_news.4.t: "[Get_newspaper_header]PRN Victory in Costa Rica"
 COS_news.4.desc: "In a shocking turn of events, the authoritarian PRN have won the emergency elections that had initially been called as a gambit to end their stranglehold over Costa Rican democracy. But somehow, whether it be through bribery, intimidation, or just a plain lack of appeal from the democratic opposition, Calderón's mandate is more secure than ever.\n\nWith this victory comes the end of a truly democratic Costa Rica - perhaps for good, this time. Having passed a new constitution declaring the Third Costa Rican Republic, the President has already begun pushing an aggressively authoritarian agenda involving greater military and executive powers. As arrests and assassinations of popular figures in both the PUN and the PLN are already underway, many can only wonder when the PRN's shadow will stop haunting Costa Rica - or indeed, if it ever will.\n"
 COS_news.4.a: "Tyranny cannot be avoided."

 COS_news.5.t: "[Get_newspaper_header]PLN Victory in Costa Rica"
 COS_news.5.desc: "The PRN's grip upon Costa Rica has once again been cracked open. Following recent internal instability and pressure from Washington, an emergency election has been held to decide the status of the PRN regime - one it has lost.\n\nAt the head of the resistance is former president and revolutionary hero Figueres Ferrer - a decidedly left leaning alternative to what the nation has known in the past half a decade or so. Ferrer espouses a more skeptical approach towards the United States - while not outright opposing the Americans, he has made it clear that Costa Rica is not exclusively partners with them and will seek out ties with other nations should she choose. What this new approach has in store for relations between what used to be a relatively simple partnership remains to be seen.\n"
 COS_news.5.a: "Not a puppet anymore, it seems."

 COS_news.6.t: "[Get_newspaper_header]Socialist Revolution in Costa Rica"
 COS_news.6.desc: "News emerges from San Jose that a socialist-led popular front has seized power, ousting the unpopular PRN government that had become paralyzed by nationwide protests. Almost immediately, the new government has been undoing much of the PRN's prior work while transitioning much of the economy to state ownership and trade union management.\n\nWhile the popular front sports some crossover with former PRN officials, this new government is mostly the result of a genuine socialist revolution. While the American ambassador to Costa Rica and the White House have both refused to comment, Washington is undoubtedly upset over the outcome, although it seems they can do little to alter the outcome at this stage.\n"
 COS_news.6.a: "Central America drifts further away from Washington..."
 
 COS_news.7.t: "[Get_newspaper_header]UCR Fascists Take San José, Costa Rica"
 COS_news.7.desc: "Chaos comes out of San José once more, as the latest of a series of coups propels Frank Marshall to leadership of Costa Rica. Once a war hero notable for his repeated suppression of forces loyal to Rafael Calderón, his experience and tactical strengths allowed him to defeat the communist People's Vanguard Party in a brief battle, pushing them out of the city and quickly securing control over most of Costa Rica.\n\nWith personal ties to Germany and a long-running commitment to fascistic ideals, the global significance of Marshall's victory is clear, though his primary backers remain Latin American. Despite his quick victory, the Unión Civica Revolucionaria is still nationally unpopular, and communist guerrillas are already rallying. Industrialists and landowners are returning in droves; if Marshall falters here, they may depart again just as quickly.\n"
 COS_news.7.a: "He may have won a battle - but could he lose the war?"
