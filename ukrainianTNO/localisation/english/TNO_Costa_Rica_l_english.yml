#Leader
COS_Jose_Figueres_Ferrer: "Хосе Фігерес Феррер"
POLITICS_COS_Figueres_Ferrer_DESC: "Громадянська війна в Коста-Риці 1948 року та її подальша політика стали боротьбою між двома чоловіками. Народжений у родині каталонських іммігрантів у Сан-Рамоні, Хосе «Пепе» Фігерес Феррер спершу вирушив до школи-інтернату в Сан-Хосе, а потім до Бостона, щоб вивчати інженерію в Массачусетському технологічному інституті. Повернувшись до Коста-Рики, він придбав ферму «Боротьба без кінця» і став успішним виробником кави, канатів та «фермером-соціалістом», забезпечуючи своїх працівників житлом і медичною допомогою.\n\nАле справжня боротьба Дона Пепе розпочалася 1942 року, коли він вийшов в ефір, щоб засудити корупцію президента Кальдерона та ув'язнення німецьких, італійських і японських родин. Не встиг він навіть закінчити промову, як Пепе заарештували, ув'язнили, а потім вислали з країни. Фігерес згодом зібрав центральноамериканських борців за свободу, сформувавши з них перший Карибський легіон. А 1948 року, коли доктор Кальдерон спробував скасувати невигідні для нього результати виборів, Фігерес, його легіон і широка опозиція перемогли каудильйо в короткій, але кровопролитній громадянській війні.\n\nДон Пепе виявив не меншу рішучість і під час повернення до миру: розширив виборчі права, скасував армію та провів прогресивні реформи, перш ніж передати владу обраному президенту Отіліо Улате. Обраний президентом на власний мандат чотири роки потому, він приборкав могутню United Fruit Company у Коста-Риці. Можливо, він міг зробити більше, але його ферма кликала його назад. Тепер, повернувшись на президентську посаду, Дон Пепе володіє пером і мечем — воїном за демократію у Боротьбі без кінця."

COS_Mario_Echandi_Jimenez: "Маріо Ечанді Хіменес"
POLITICS_COS_Echandi_Jimenez_DESC: "Громадянська війна в Коста-Риці 1948 року та її подальша політика стали боротьбою між двома чоловіками. Маріо Ечанді Хіменес — не один із них.\n\nНі, Ечанді Хіменес — остання велика надія на мир. Великий компромісник, людина, яка намагається залікувати розкол між Фігересом і Кальдероном, людина, яка намагається врятувати Коста-Рику від нових конфліктів.\n\nНародившись у заможній та політично впливовій родині в Сан-Хосе, Ечанді, як і можна було очікувати, приєднався до опозиції, що зростала, після завершення юридичної освіти, виступаючи проти президента Кальдерона. Під час виборчої кампанії 1948 року на підтримку консерватора Отіліо Улате Бланко Ечанді Хіменес підтримав сили Фігереса у боротьбі проти Кальдерона після того, як законодавчі союзники останнього спробували скасувати результати виборів. Але після війни депутат спрямував своє могутнє ораторське мистецтво на підтримку повернення Кальдерона із вигнання. Ця спроба примирення досягла кульмінації на виборах 1958 року, коли далека підтримка Кальдерона допомогла Ечанді Хіменесу здобути президентство над роз'єднаними фігеристами.\n\nТа скільки б доріг і шкіл не будував президент Ечанді Хіменес, скільки б установ не засновував і скільки б похвал не отримував від Дядька Сема, він так і не зміг виконати свою головну місію — примирити націю, яка досі залишається розділеною подіями 1948 року."

COS_Rafael_Calderon_Guardia: "Рафаель Кальдерон Гуардія"
POLITICS_COS_Calderon_Guardia_DESC: "Громадянська війна в Коста-Риці 1948 року та її подальша політика стали боротьбою між двома чоловіками. Народжений на початку XX століття в Сан-Хосе, Рафаель Кальдерон Гуардія залишив Коста-Рику, щоб вивчати медицину у Франції та Бельгії. Попри шлюб із спадкоємицею діамантової імперії, соціальна доктрина католицизму, яку Кальдерон засвоїв там, спонукала його присвятити себе покращенню становища бідних Коста-Рики. Ця відданість піднесла лікаря до посади головного хірурга, а потім привела його до Конгресу. Зрештою цього щедрого й доброзичливого чоловіка обрали маріонетковим президентом.\n\nАле маріонеткою він не став. Президент Кальдерон сформував політичну опору з католиків і комуністів, спрямовуючи потоки колонів на реалізацію своєї масштабної соціальної програми: системи соціального забезпечення, конституційного трудового кодексу та створення Університету Коста-Рики. Коли олігархія країни виступила проти цього неочікуваного радикала, Кальдерон утримав владу за допомогою фальсифікацій виборів. А під час Другої світової війни він ще більше посилив свою хватку, відправивши японців, італійців та німців до таборів інтернування та конфіскувавши їхні активи. Це стало останньою краплею для людини, яка згодом стане його головним суперником — Хосе Фігереса Феррера.\n\nПопри зростання опозиції, Кальдерон домігся передачі президентської посади своєму протеже Пікадо Міхальському. Але 1948 року Міхальському не вдалося передати її назад, що призвело спочатку до виборчої кризи, а потім до громадянської війни. Переможений Карибським легіоном Фігереса, доктор Кальдерон був висланий до Мексики. Але тепер, спираючись на кулі, неочікуваний каудильйо повернувся."

COS_Francisco_Orilich_Bolmarcich: "Франсиско Орліч Больмарчич"
POLITICS_COS_Orilich_Bolmarcich_DESC: "Громадянська війна в Коста-Риці 1948 року та її політика відтоді були боротьбою між двома чоловіками. Франсиско Орліч Больмарчич — не один із них.\n\nАле Дон Чіко, як його називають, — права рука Хосе Фігереса Феррера, його найкращий друг ще з дитинства, проведеного разом у Сан-Рамоні. Права рука, яка легко сміється й охоче простягає руку для рукостискання. Після повернення зі Сполучених Штатів, де він вивчав бізнес, ця чарівність принесла Орлічу значний успіх у сімейних комерційних та сільськогосподарських підприємствах і провідне місце в благодійній спільноті Сан-Рамона. Звідти був лише короткий крок до посади мера, а потім — до національного законодавця. І він знову й знову переобирався, виступаючи проти зловживань і корупції уряду кальдероністів.\n\nТож коли настав час, Дон Чіко взяв до рук зброю в Національно-визвольній армії Фігереса, виступивши проти Кальдерона. Коли Фігерес очолив перехідну хунту, Дон Чіко очолив Міністерство громадських робіт. Під час першого президентства Фігереса Дон Чіко залишався напоготові, захищаючись від вторгнень кальдероністів. Пізніше, на виборах 1958 року, Дон Чіко підняв прапор PLN Фігереса, але зазнав поразки.\n\nТа усміхнений Дон Чіко знову підняв цей прапор після другого президентства Фігереса — і переміг. Як людина практична, з діловою хваткою, Орліч, можливо, не буде таким радикальним на посаді, як його друг на все життя. Але Фігерес може покластися на нього, як робив це завжди."

COS_Manuel_Mora_Valverde: "Мануель Мора Вальверде"
POLITICS_COS_Manuel_Mora_Valverde_DESC: "Народившись у 1909 році в Сан-Хосе, Вальверде прожив життя, яке блякне на тлі «великих» діячів Латинської Америки. Колись він був революціонером, натхненним злиднями свого народу, і навіть брав участь у боротьбі за повалення диктатури Тіноко в 1919 році. Спочатку він приєднався до профспілок, а потім заснував те, що згодом стало Партією народного авангарду. Однак, коли його товариші вирушили воювати проти фашистів в Іспанії, Вальверде залишився, щоб провести їх. Він прагнув змін для Коста-Рики й знав: нічого не можна змінити, якщо ти мертвий.\n\nВальверде дистанціювався від догматичних комуністів своєї епохи, вважаючи, що для успіху його країні потрібна унікальна версія марксизму. Його «Comunismo-a-la-Tica» була достатньо популярною, щоб Кальдерон скористався запропонованими ними соціальними гарантіями як тактикою для здобуття підтримки під час свого демагогічного правління. Дехто зневажав їхню співпрацю, але Вальверде її підтримував. Йому було байдуже, як саме прийдуть зміни, аби лише вони прийшли. Тож коли Кальдерон знову опинився в Сан-Хосе, Вальверде швидко приєднався до нього.\n\nТа попри гіркий присмак у роті, він пишається своєю роботою. Можливо, він уклав угоду з дияволом, отримавши путівку на вибори, бюлетені на яких PRN мав підробити, але якщо вони готові були його підтримати — воно того варте. Мета виправдовує засоби, продовжує він переконувати себе, і, оплакуючи шлях, який привів його сюди, він дивиться на Сан-Хосе, знаючи, що тепер, опинившись у президентському палаці, зможе нарешті здійснити зміни, заради яких працював так довго."

COS_Joaquin_Gutierrez_Mangel: "Хоакін Гутьєррес Мангель"
COS_Fernando_Trejos_Escalante: "Фернандо Трехос Ескаланте"
POLITICS_COS_Trejos_Escalante_DESC: "Економічна свобода та соціальне забезпечення. Саме з цими словами Фернандо Трехос увійшов у світ політики — і саме таку спадщину він сподівається залишити Коста-Риці.\n\nНародившись у Сан-Хосе, Трехос Ескаланте здобував медичну освіту за кордоном — як в UNAM у Мексиці, так і в Колумбії в Нью-Йорку. Повернувшись додому, до Коста-Рики, лікар відкрив приватну практику, піклуючись про своїх пацієнтів комплексно: усував не лише очевидні симптоми, а й глибші рани бідності та нужди. Він бачив біль, спричинений добре задуманої, але недосконалої системою соціального забезпечення, яка виключала численних тікос, що не мали офіційної роботи.\n\nТрехос Ескаланте вирішив стимулювати зростання, здатне витягнути його співвітчизників із бідності, не вдаючись до безрозсудних державних витрат, які могли б піддати їх ще одній кризі. Під час першого президентства Фігереса він заснував Asociación Nacional de Fomento Económico — ліберальний аналітичний центр, присвячений розвитку Коста-Рики. Під час другого він опублікував «Свободу і безпеку» — стриману, вдумливу, але чітку критику соціалістичного курсу Фігереса.\n\nПереконаний балотуватися від PUN на посаду президента, Трехос виявився доброзичливим і шанобливим до своїх опонентів, але брав до рук скальпель, коли розбирав їхню політику. Тепер цей прямолінійний ліберал постає перед своєю найделікатнішою операцією — відсікти десятиліття лівої економічної політики, не завдавши шкоди бідним Коста-Рики."

COS_Teodoro_Picado_JR: "Теодоро Пікадо-молодший"
POLITICS_COS_TEODORO_PICADO_JR: "Який батько, такий і син. Народжений Теодоро Пікадо Міхальські, у юності він був відданий передусім своєму батькові, служачи капітаном у збройних силах Коста-Рики під прикриттям Рафаеля Кальдерона Гуардії, справжнього джерела влади в країні. Хоча його батько правив як президент відносно прагматично, зростаюча нестабільність Коста-Рики та дедалі більше невдоволення впливом Кальдерона призвели до короткої громадянської війни, через яку він був змушений втекти разом із родиною до Нікарагуа.\n\nПринижений, але не переможений, Пікадо-молодший перебрався до Нью-Йорка, де вдосконалював знання англійської мови та військову майстерність у Військовій академії Вест-Пойнт, яку закінчив у 1951 році. Повернувшись до Нікарагуа, щоб приєднатися до Національної гвардії Сомоси, він використав своє нове становище та авторитет, аби організувати кальдероністську опозицію й підготувати повернення. Хоча смерть його батька у 1960 році відклала ці плани, його провідна роль в операції з повернення здобула йому значну прихильність Кальдерона та місце очільника Національно-республіканського списку на виборах 1970 року.\n\nІ ось, знову президент Теодоро Пікадо є маріонеткою каудильйо Кальдерона. На поверхні він постає як привітний джентльмен, поліглот, здатний розвіяти будь-які американські побоювання щодо устрою його режиму. Але якщо копнути глибше, відчуєш відчуження Партії народного авангарду та боротьбу за те, щоб протести не обвалили державу цілком. Можливо, спадщина його батька ще не відійшла в минуле."

COS_Daniel_Oduber_Quiros: "Даніель Одубер Кірос"
POLITICS_COS_DANIEL_QUIROS_DESC: "Здається цілком доречним, що чоловік, настільки зосереджений на ідеалах Платона, піднявся до найвищих державних посад. Народившись у 1926 році двоюрідним братом майбутнього архієпископа Сан-Хосе, Кірос у юності ділив свій час між спортом і філософією, у 1940 році приєднався до Центру вивчення національних проблем, а після нетривалої кар'єри юриста, зосередженого на трудовому праві, звернувся до філософії, здобувши ступінь магістра в Макгілльському університеті.\n\nУчасть в армії Фігереса під час короткої громадянської війни 1948 року принесла йому національну славу. Він став генеральним секретарем перехідної урядової хунти, але невдовзі подав у відставку, щоб повернутися до навчання й здобути докторський ступінь з філософії. Згодом він став послом, поступово втрачаючи колишні проамериканські симпатії в міру просування кар'єрними сходами, аж поки у 1962 році не став канцлером Фігереса, а в 1966 році не висунув свою кандидатуру на номінацію Партії національного визволення. Поступившись Франсиско Орлічу на виборах 1966 року, він натомість став президентом партії, готуючи собі шлях до повноцінної кампанії 1970 року.\n\nТепер Філософ коронований як Король. Зберігаючи симпатії до лівих, він розширив свій інтерес до трудового права, звернувшись також до захисту довкілля. Збереження навколишнього середовища Коста-Рики стане одним із ключових напрямів його уряду, поряд із підтримкою Університету дистанційної освіти, аби ним могли користуватися всі мешканці Коста-Рики. Однак тягар посади вже дався йому взнаки; принаймні поки що його мрії про приватне розведення худоби можуть залишитися недосяжними."

COS_Gonzalo_Facio: "Гонсало Фасіо"
