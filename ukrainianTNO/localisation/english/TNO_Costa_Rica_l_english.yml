#Leader
COS_Jose_Figueres_Ferrer: "José Figueres Ferrer"
POLITICS_COS_Figueres_Ferrer_DESC: "Costa Rica's civil war of 1948 and its politics since have been the struggle between two men. Born to Catalan immigrants in San Ramón, José "Pepe" Figueres Ferrer would leave first for boarding school in San José, and then for Boston to study engineering at MIT. He would return to Costa Rica, acquiring the farm 'The Fight Without End' and becoming a successful coffee cultivator, rope manufacturer, and 'farmer-socialist' providing housing and medical care to his workers.\n\nBut Don Pepe's fight would truly begin in 1942, when he took to the radio to condemn President Calderón's corruption and imprisonment of German, Italian, and Japanese families. Before he could even finish speaking, Pepe was arrested, imprisoned, and then exiled. Figueres would then gather Central American freedom fighters, forming them into the first Caribbean Legion. And in 1948, when Dr. Calderón sought to annul unfavorable election results, Figueres, his Legion, and a broad opposition defeated the Caudillo in a brief but bloody civil war.\n\nDon Pepe proved similarly dynamic in the return to peace, expanding the franchise, abolishing the army, and passing progressive reforms before turning power over to the elected President Otilio Ulate. Elected in his own right four years later, he would tame the mighty United Fruit Company in Costa Rica. Perhaps he could have done more, but his farm called to him. Now, returned to the Presidency, Don Pepe wields pen and sword, a warrior for democracy in a Fight Without End."

COS_Mario_Echandi_Jimenez: "Mario Echandi Jiménez"
POLITICS_COS_Echandi_Jimenez_DESC: "Costa Rica's civil war of 1948 and its politics since have been the struggle between two men. Mario Echandi Jiménez is not one.\n\nNo, Echandi Jiménez is the last great hope of peace. The Great Compromiser, the one trying to heal the rift between Figueres and Calderón, the one trying to save Costa Rica from yet more conflict.\n\nBorn to a wealthy and politically prominent family in San José, Echandi would, as one might expect, join the growing opposition to President Calderón following the completion of his legal studies. Campaigning for the conservative Otilio Ulate Blanco in the 1948 election, Echandi Jiménez would support Figueres' forces against Calderón's after the latter's legislative allies moved to annul the election. But after the resulting war, the deputy would turn his powerful oratory in favor of Calderón's return from exile. This push for reconciliation would culminate in the election of 1958, where Calderón's distant backing lifted Echandi Jiménez to the presidency over infighting figueristas.\n\nYet, no matter how many roads and schools President Echandi Jiménez builds, no matter how many institutions he founds or plaudits he receives from Uncle Sam, he has been stymied at his fundamental mission - reconciling a nation still divided by '48."

COS_Rafael_Calderon_Guardia: "Rafael Calderón Guardia"
POLITICS_COS_Calderon_Guardia_DESC: "Costa Rica's civil war of 1948 and its politics since have been the struggle between two men. Born at the turn of the 20th century in San José, Rafael Calderón Guardia would depart Costa Rica to study medicine in France and Belgium. Despite marrying a diamond heiress, the Catholic social doctrine Calderón learned there would lead him to dedicate himself to uplifting Costa Rica's poor. This commitment elevated the doctor to chief surgeon, then through Congress. Then, this generous and kindly man was selected to be a puppet President.\n\nPuppet, he would not be. President Calderón cemented a political base of Catholics and communists with torrents of colones to pass his expansive social agenda: a Social Security system, a constitutional labor code, and the creation of the University of Costa Rica. As the nation's oligarchy turned against this unsuspected radical, Calderón would retain his grip with electoral fraud. And in WW2, Calderón would tighten it further, sending Japanese, Italians, and Germans to internment camps and seizing their assets. This would be the last straw for the man who would become his great rival, José Figueres Ferrer.\n\nDespite growing opposition, Calderón succeeded in passing the Presidency to his protégé Picado Michalski. But in 1948, Michalski failed to pass it back, leading to electoral crisis, then civil war. Defeated by Figueres' Caribbean Legion, Dr. Calderón would be exiled to Mexico. But now, backed by bullets, the unexpected Caudillo has returned."

COS_Francisco_Orilich_Bolmarcich: "Franscico Orilich Bolmarcich"
POLITICS_COS_Orilich_Bolmarcich_DESC: "Costa Rica's civil war of 1948 and its politics since have been the struggle between two men. Francisco Orlich Bolmarcich is not one.\n\nBut Don Chico, as he is called, is the right-hand man of José Figueres Ferrer, Figueres' best friend since their shared childhood in San Ramón. A right-hand man that is quick to laugh and quick to offer a handshake. After returning from business studies in the United States, this charm would give Orlich broad success in his family's commercial and agricultural ventures and a leading position in San Ramón's charitable community. From there, it was a short step to become municipal president, then a national legislator. One reelected again and again to oppose the calderonista government's abuses and corruption.\n\nSo when the time came, Don Chico took up arms in Figueres' National Liberation Army against Calderón. When Figueres led the transitional junta, Don Chico took up the Ministry of Public Works. In Figueres' first presidency, Don Chico took up watch, defending against calderonista incursions. After, Don Chico took up the banner of Figueres' PLN in the 1958 elections, but was defeated.\n\nBut a smiling Don Chico would take up that banner again, after Figueres' second presidency, and win. As a man of practicality and business sense, perhaps Orlich will not be so radical in office as his life-long friend. But Figueres can count on him, as he always has."

COS_Manuel_Mora_Valverde: "Manuel Mora Valverde"
POLITICS_COS_Manuel_Mora_Valverde_DESC: "Born in 1909 in San José, Valverde lived a life that pales to the "greats" of Latin America. He was once a revolutionary, inspired by the poverty of his people and even having fought to depose the Tinoco dictatorship in 1919. He first joined the unions, and then founded what would become the Popular Vanguard Party. Yet, when his comrades left to fight against the fascists in Spain, Valverde stayed to bid them farewell. It was change he wanted for Costa Rica, and he knew you can't change anything if you're dead.\n\nValverde distanced himself from the dogmatic communists of his era, believing that his country needed a unique version of Marxism to succeed. His Comunismo-a-la-Tica was popular enough for Calderón to utilize their proposed social guarantees as a tactic to scrape up some support during his demagogic rule. While some detested their collaboration, Valverde supported it. He didn't care how the change came, only that it came. So when Calderón saw himself in San José once more, Valverde was quick to join him.\n\nYet despite a bitter taste in his mouth, he holds pride in his work. He may have made a deal with the devil, earning a ticket in an election whose ballots would be stuffed by the PRN, but if they would support him then it was worth it. The ends justify the means, he keeps telling himself, and as he laments the path that took him here, he looks onto San José, knowing that now being in the presidential palace, he could truly bring the change he has worked for so long."

COS_Joaquin_Gutierrez_Mangel: "Joaquín Gutiérrez Mangel"
COS_Fernando_Trejos_Escalante: "Fernando Trejos Escalante"
POLITICS_COS_Trejos_Escalante_DESC: "Economic Liberty and Social Security. With those words, Fernando Trejos entered the realm of politics, and that is the legacy he hopes to leave behind for Costa Rica.\n\nBorn in San José, Trejos Escalante would realize his medical studies abroad, in both Mexico's UNAM and Columbia in New York. Returning home to Costa Rica, the doctor would enter into private practice, supporting his patients' holistic health by addressing both the salient symptoms and the deeper wounds of poverty and distress. He would see the pain caused by a well-intended but flawed Social Security system, which excluded the many Ticos without formal occupations.\n\nTrejos Escalante decided to drive the growth that could lift his countrymen from poverty, without the reckless state spending that would expose them to yet another crisis. In Figueres' first presidency, he founded the Asociación Nacional de Fomento Económico, a liberal think tank devoted to Costa Rican development. In his second, he published 'Liberty and Security', a mannered, thoughtful but clear attack on Figueres' socialist direction.\n\nConvinced to seek the PUN presidential nomination, Trejos proved amiable and respectful toward his opponents, but wielded a scalpel when dissecting their policies. Now, this forthright liberal faces his most delicate operation yet - cutting away decades of leftist economics without harming Costa Rica's poor."

COS_Teodoro_Picado_JR: "Teodoro Picado Jr."
POLITICS_COS_TEODORO_PICADO_JR: "Like father, like son. Born to Teodoro Picado Michalski, his loyalties as a young man were largely to him, serving as a captain within the Costa Rican military and under the guise of Rafael Calderón Guardia, the true source of power in the area. Although his father governed as president with relative pragmatism, the growing instability of Costa Rica and increasing fatigue with the influence of Calderón led to a brief civil war, one that saw him flee with his family into Nicaragua.\n\nHumiliated but not defeated, Picado Jr. instead moved to New York, honing his English and his military prowess at West Point Academy, and graduating in 1951. Moving back to Nicaragua to join the Somozan National Guard, he used his newfound position and profile to organise a Calderonist opposition to prepare a reconquest. Although delayed by the death of his father in 1960, his spearheading of the return operation brought significant appreciation from Calderón, and the head of the National Republican ticket for the 1970 election.\n\nAnd so, once again, a President Teodoro Picado is the puppet to Caudillo Calderón. On the surface, he presents the picture of an amicable gentleman, a polyglot able to disarm any American concerns over his regime's structure. Dig deeper, though, and you will feel the alienation of the People's Vanguard Party and the struggle to prevent protests from collapsing the state entirely. Perhaps his father's legacy is not gone yet."

COS_Daniel_Oduber_Quiros: "Daniel Oduber Quirós"
POLITICS_COS_DANIEL_QUIROS_DESC: "It seems fitting that a man so focused on the ideals of Plato has ascended to high office. Born in 1926 as the cousin of a future Archbishop of San Jose, Quiros split his time between athletics and philosophy as a youth, joining the Centre for the Study of National Problems in 1940 and, after a brief stint as a lawyer focused on labour law, turned to philosophy, receiving a Master's from McGill.\n\nFighting in Figueres' army in the brief Civil War of 1948 gave him national fame, becoming Secretary-General of the provisional government's founding Junta, before resigning to return to attain a Doctorate of Philosophy. From there, he became an ambassador, slowly becoming jaded from his former pro-American sympathies as he rose the ranks to become the Chancellor for Figueres in 1962, and then running for the National Liberation Party's nomination in 1966. Accepting defeat to Francisco Orlich in 1966, he became President of the party instead, setting himself up for a full run in 1970.\n\nNow, the Philosopher has been crowned a King. Remaining sympathetic to the left, his interest in labour law has since been expanded to environmentalism, and preserving the Costa Rican environment will be a key part of his government, alongside efforts to encourage the University of Distance Education for use by all in Costa Rica. However, the pressures of the office have taken a toll on him; for now, his dreams of raising livestock in private may just be out of reach."

COS_Gonzalo_Facio: "Gonzalo Facio"
COS_Jorge_Gonzalez_Marten: "Jorge González Martén"
COS_Rodrigo_Carazo_Odio: "Rodrigo Carazo Odio"
