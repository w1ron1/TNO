 KAL_arise_ye_workers_from_your_slumbers_desc: "'Товариші,\n\nСлова — для слабких, для тих, хто нездатний діяти. Якими б красивими не були слова на аркуші паперу, вони ніщо порівняно з діями, які людина може або не може здійснити. А лідери говорять, говорять і говорять, нескінченно й безперервно, монотонно бурмочучи, наче роботи. Тим часом їхні дії ґрунтуються на експлуатації робітничого класу. Вони використовують поліцію та армію, щоб підкорити вас, водночас обіцяючи краще майбутнє.\n\nАле вони мають зрозуміти, що ми теж здатні діяти. Робітники цієї країни та їхні союзники можуть зупинити колеса промисловости, виробництва й так далі, просто нічого не роблячи. Ми можемо зупинити військову машину цього жахливого ворога. А для тих, хто бажає більшого, у вас удома є найвеличніший союзник робітничого класу: сімейна гвинтівка, з якої ваша здобич уже не тварина, а ворог вашого народу.\n\nДо робітників Сибіру я звертаюся: повстаньте й боріться! Боріться за свободу й волю, як робітники всього світу!'"
 KAL_arise_ye_prisoners_of_want_desc: "'Товариші,\n\nЩоб вести цю війну, ви перш за все маєте зрозуміти, що це інший тип війни, ніж ті, у яких воювали ви чи ваші батьки. Це не війна великих армій, що воюють із постійними й важливими лініями постачання, і навіть не війна, у якій наші солдати мають однаковий рівень оснащення та підготовки. Якщо ми сприйматимемо це як Велику Вітчизняну війну, ми програємо її ще до того, як вона почнеться.\n\nНатомість, товариші, важливо думати про себе та свою бригаду як про осередки, кожен із яких становить окрему частину більшого цілого. Ви дієте незалежно один від одного, співпрацюючи, коли це необхідно, але зрештою працюєте самостійно, відокремлені й унікальні за своїм призначенням та складом. Щоб вести таку війну, ви маєте нападати при найменших ознаках слабкости наших ворогів.\n\nОдне — битися з ворогом лицем до лиця. Зовсім інше — битися, наче тисяча жалючих мурах, ламаючи їхню волю до боротьби ще до того, як вони вступлять із нами в бій.'"
 KAL_reason_in_revolt_desc: "'ЗАГАЛЬНЕ ПОВІДОМЛЕННЯ ДЛЯ ВСІХ РОБІТНИЧИХ БАТАЛЬЙОНІВ\n\nДля тих відважних робітників, які борються проти тиранії, важливо розуміти, що з усіх боків нас оточують вороги. У нас немає фабрик, здатних виробляти значну кількість зброї для наших людей, і немає інфраструктури, щоб створити такі фабрики, навіть якби ми цього хотіли.\n\nСаме тому важливо знаходити друзів там, де це можливо. Не провина окремого селянина чи солдата в обставинах, у яких вони опинилися, а тих, хто використовує націоналізм і релігію для придушення їхньої класової свідомости. Селянин виробляє їжу, якою можна нагодувати наших людей. Ворожий солдат — ще один потенційний союзник, який має доступ до зброї та тактики, якої немає у нас.\n\nСаме тому я, Костін, виступаю проти нещодавньої тенденції серед товаришів-соціялістів звинувачувати цивільних селян у нинішньому режимі. Вони мають право на свою думку, але ірраціонально створювати ворогів там, де їх раніше не існувало.'"
 KAL_on_tyrants_only_well_make_war_desc: "Історичний документ-S1451 — анархістська листівка проти правих сил у Росії, адресована робітникам Красноярська:\n\n\"ТОВАРИШІ,\n\nБагато так званих «поміркованих» стверджують, що партії, які відповідають за нинішній стан справ, хоч і далекі від досконалости, є «кращими, ніж нічого» та «кращими за воєначальництво минулого».\n\nЦе цілком може бути правдою, але подумайте ось про що: чи готові ви це прийняти? Чи готові ви, робітники цієї великої країни, сидіти склавши руки й дозволити тиранам захопити владу лише тому, що вони забезпечують рух потягів за розкладом?\n\nЧи готові ви прийняти знищення ваших профспілок перед могутніми босами? Чи дозволите ви профспілковим босам, які більше дбають про владу, ніж про ваше право на плід власної праці, підірвати ваші права як робітників?\n\nТак звані помірковані — зрадники та вороги вашого класу! Саме вони стоять на шляху до справжньої свободи!\n\nПРИЄДНУЙТЕСЯ ДО РОБІТНИЧОЇ ФЕДЕРАЦІЇ\n\nКОСТІН, НОВИЙ ЦИНЦИННАТ\""
 KAL_comrades_come_rally_desc: "'Товариші,\n\nПопри брехню поміркованих і правих, ми особисто не виступаємо проти вас, солдати. Ви лише жертви більшої війни між капіталістами та соціялістами. Вони — інструменти, які використовують і викидають, щойно вони перестають бути корисними.\n\nМи вважаємо, що ви здатні врятувати себе від ролі ворогів революції, здатні поглянути за межі примітивного націоналізму, який ці капіталісти вклали у вас. Ви можете спрямувати свою зброю знищення проти капіталіста та його союзників, захищаючи робітничий клас цієї країни та за кордоном, і приєднатися до нас заради визволення всього людства від знищення капіталістичним класом.'"
 KAL_spurn_the_dust_desc: "Лист Костіна до невідомого генерала Робітничої федерації:\n\n'Поки я це пишу, революційний терор шириться землею. Він чиниться в ім'я нашого руху, в ім'я свободи. Скільки б я не наказував їм зупинитися, я продовжую отримувати повідомлення про людей у пошарпаній формі, які спалюють так звані «реакційні» міста, лінчують міських старійшин і релігійних селян, які відмовляються схилятися перед нашою владою. Кляті чудовиська знищать наш рух, як би сильно я не намагався зупинити їх від знищення того, що ми маємо.'\n\nЯ почуваюся безпорадним.'"
 KAL_no_more_deluded_by_reaction_desc: "'Церква — лише притулок для реакціонерів і ошуканих. До того ж, якщо Бог справді контролює все, то хто ми такі, щоб зупиняти Його Вічну й Всезнаючу Волю?'\n— Кірдін Жахливий. Відомий тим, що особисто вбив до двохсот членів Православної церкви та наказав знищити п'ятдесят церков.\n\nПопри спроби Костіна та багатьох членів Робітничої федерації, знищення церков не вдалося зупинити через радикалізм генералів, яких більше цікавило знищення святих реліквій, ніж спроби завоювати довіру селян.\n\nБагато хто задається питанням, чи можна коли-небудь по-справжньому залікувати наслідки цього."
 KAL_each_at_the_forge_must_do_their_duty_desc: "СЛОВА ТОВАРИША КОСТІНА\n\nРобітники революції, ви споконвіку були вірними революції свободи й волі. Однак нехай буде відомо: надмірної продуктивности не буває. Поки ворог контролює величезну кількість промисловости, ми перебуваємо в невигідному становищі майже в усьому.\n\nЦе не означає поразки. Навпаки, це можливість! Це можливість повною мірою скористатися силою людської винахідливости поза межами капіталізму. Робітники Федерації, ви та ваші можливості не обмежені прагненням капіталізму до прибутку. Ви можете досліджувати нові та інноваційні способи підвищення виробництва, створювати нові методи швидшого та ефективнішого виготовлення зброї.\n\nРобітники, ви — перша лінія оборони проти капіталізму! Смерть фашизму, і хай живе свобода!'"
 KAL_strike_while_the_iron_is_hot_desc: "Ворог має отримати удар там, де він найслабший. Атакувати центральні території було б марною справою, адже вони були б найбільш укріпленими з усіх потенційних напрямків. Це було б марнуванням живої сили та ресурсів, не кажучи вже про те, що в процесі ми могли б показати свою слабкість.\n\nНатомість ми атакуватимемо тих, хто перебуває на периферії, у місцях, де спогади про поневолення та колишніх лідерів досі свіжі в їхній пам'яті. Ми знайдемо там союзників, навіть якщо вони не будуть нашими друзями. Крім того, місцевим бюрократам центру буде важко чинити нам опір, особливо якщо вони не користуються довірою серед корінного населення."
 KAL_unite_the_human_race_desc: "'Товариші,\n\nСоціялізм передусім ґрунтується на фундаментальній аксіомі, що всі люди мають однакове основне право на життя. Усі вони мають право на їжу, житло, медицину тощо. Але, хоча ми є соціально прогресивними, ми відмовляли іншим у тій самій свободі, яку маємо самі: працювати заради спільного блага.\n\nЦьому кінець. Усі люди, незалежно від віку та статі, здатні захищати своїх ближніх і революцію. Ми віримо в рівність, тож настав час почати діяти відповідно до неї.\n\nКожен, хто заперечує право свого ближнього на боротьбу, ставить соціальну реакцію вище за революцію.'"
 KAL_the_last_fight_desc: "Уривок із промови Костіна до робітничого батальйону:\n\n\"Товариші, послухайте мене: ворог готується до останньої битви. Капіталісти виснажують своїх найманих рабів до кісток, генерали муштрують своїх людей до кривавого шаленства, а газети поширюють брехню про так званий «революційний терор». Вони готові нас знищити.\n\nАле ми, друзі, теж не сиділи без діла. Ми теж готувалися до наступу, який вони планують обрушити на нас. Ми дали зброю кожному працездатному чоловікові й жінці у нашій Федерації, зробивши будь-яку перемогу, яку вони здобудуть над нами, справді гіркою.\n\nКожне наше місто — фортеця, з якої нас може вигнати лише атомна бомба, та й то ледве. Ми вітаємо їхній виклик. Я, наприклад, готовий померти за революцію — як і кожен добрий соціяліст. Наша жертва — лише ще одна ланка в довгому ході історії. Нас пам'ятатимуть як героїв, товариші. І ніщо з того, що вони можуть зробити, не здатне цьому завадити.\""

 KAL_arise_ye_prisoners_of_want_tt: "§YДодаткові загони ополчення§! приєднаються до нашої праведної справи!\n"
 
 ## Events ##
 
 kostin.1.t: "Насування бурі"
 kostin.1.d: "У шаленому прагненні возз'єднати Сибір і повернути йому належну гідність почав ширитися шепіт. Щойно наше світло набуло сили, так само зросла й наша тінь. Вона, що плекалася на вродженій жорстокості наших дій, чекала нагоди завдати удару. Сьогодні вона вийшла з темряви, сміливо проголосивши: «Я був, я є, я буду!»\n\nРобітники по всій промисловій зоні Центрального Сибіру розпочали масовий скоординований загальний страйк! Вони посилаються на постійно жахливі умови праці, невиконані обіцянки та безжальну жорстокість начальства.\n\nСхоже, прагнення повернути цивілізацію до російських пусток має чимало недоліків, адже піднесена мрія про єдину Росію стає менш привабливою, коли людина не може нагодувати свою сім'ю або зберегти всі свої кінцівки. Крім того, із поверненням нормального життя до регіону сам робітник, схоже, став менш цінним; просто пішаком на шляху до кінцевої мети.\n\nРобота вже зупинилася, вимоги висуваються, а старі рахунки зводяться. Хоча деякі в нашому уряді можуть співчувати справі страйкарів, незаперечно, що ми не можемо миритися з паралізованою економікою, особливо з огляду на й без того завжди хитке становище Росії. Страйкарів багато, і вони войовничо налаштовані. Якщо ми не зможемо укласти якусь угоду та показати нашим робітникам хоча б частину обіцяного нами добробуту, нам доведеться готуватися до бурі, що насувається."
 kostin.1.a: "Жахливо..."

 kostin.2.t: ""
 kostin.2.d: ""
 kostin.2.a: ""

 kostin.3.t: "Око бурі"
 kostin.3.d: "Масштаб цього загального страйку вийшов на цілком новий рівень! Після відсутности будь-якого поступу до вирішення ситуації та безперервного насильства робітники взялися за зброю! Набіги на склади зброї, пограбування старих підвалів і відверті крадіжки стали повсюдними, а зброя та боєприпаси почали переходити з рук у руки серед бойовиків. Робітники вже організовують себе в «загальні комітети оборони».\n\nЦе надзвичайно небезпечна ситуація, і привид повстання висить у повітрі. Ми маємо діяти обережніше, ніж будь-коли раніше, водночас рухаючись якомога швидше, щоб забезпечити власну безпеку.\n\nЯкщо ми не діятимемо, це може стати кінцем усього..."
 kostin.3.a: "Виродки!"

 kostin.4.t: "Заклик до повстання"
 kostin.4.d: "Товариші,\n\nНа відміну від виродків, які керують Сибіром, я не буду вам брехати. Правда проста; настільки проста, що мені не потрібна жодна вишукана мова, щоб пояснити її вам. Це правда, яку знає кожна російська дитина.\n\nЗ тими, хто нами керує, щось не так.\n\nВи всі знаєте, про яких людей я говорю. Тих, хто обіцяє безпеку, обіцяє добробут, обіцяє... ах, чого тільки вони не обіцяють? Вони робили це ще задовго до Великої Вітчизняної війни. Тепер, коли наша країна лежить у руїнах, а наш народ риється в багнюці, що роблять наші лідери?\n\nВони обіцяють!\n\nОсобисто я ситий по горло обіцянками, ситий по горло брехнею, ситий по горло варварством. Тож прямо тут, прямо зараз, я буду чесним із вами. Я не ваш лідер і ніколи ним не збираюся бути. Я просто людина, така сама, як ви, яка хоче, щоб жорстокість припинилася.\n\nТепер у нас є можливість викувати нову Росію, де кожна людина справді рівна. Росію без лідерів. Щоб отримати її, нам доведеться битися. Однак людям Центрального Сибіру нічого втрачати. Саме ми підтримуємо виробництво, саме ми забезпечуємо своєчасну доставку їхніх куль, хліба та сталі.\n\nВ ім'я всіх загиблих дітей, усіх вдів, усіх покалічених синів. До біса їхні обіцянки!"
 kostin.4.a: "Ви всі можете просто заспокоїтися?!?"

 kostin.5.t: "Повстання в Новосибірську"
 kostin.5.d: "Жахливі новини надійшли з Новосибірська. З тієї незначної інформації, яку нам вдалося зібрати, схоже, що в місті точаться збройні бої, очолювані тими самими робітниками, які вже кілька тижнів страйкують, вимагаючи справедливішої оплати та ставлення. На жаль, схоже, їхнє невдоволення нинішньою ситуацією досягло точки кипіння, а вигуки перетворилися на ревуче полум'я революції.\n\nНа наше щастя, підтримка цього «Робітничого повстання», схоже, незначна, а їхнє прославлене ополчення більше нагадує натовп, ніж армію. Тим не менш, ці збройні ополчення все ще контролюють промислові потужності та значну частину населення, зосереджену в Новосибірську. Ми повинні обережно поставитися до цієї ситуації, яка стрімко загострюється."
 kostin.5.a: "Хіба в місті немає важливіших проблем?"

 kostin.6.t: "Повстання в Красноярську"
 kostin.6.d: "Тривожні новини просочилися з Красноярська. Нечисленні армійські частини, що досі перебувають у місті, повідомили, що робітники, які раніше страйкували, стали агресивними й захопили вулиці Красноярська у відкритому повстанні. У цей момент збройні склади Красноярська грабують, а в місті точаться запеклі бої. На щастя, хоча це й справді викликає занепокоєння, робітники, які беруть участь у цьому повстанні, схоже, жахливо непідготовлені до революції, а підтримка повстання обмежується самим містом.\n\nПопри це, ці бунтівні робітники контролюють значну промисловість і населення, зосереджені в Красноярську. Якщо ми невдовзі не розберемося з нинішньою ситуацією, тліюче полум'я революції може перетворитися на палаючу пожежу."
 kostin.6.a: "Спочатку це був заколот. Потім — революція."

 kostin.7.t: "Повстання в Томську"
 kostin.7.d: "Після кількох днів фактичної відсутности зв'язку з містом Томськом, схоже, сталося найгірше. Робітники, які страйкують у самому місті, взялися за зброю та розпочали повномасштабне повстання. Навіть за підтримки невеликої, але помітної кількости інтелектуалів, що мешкають у Томську, вогонь революції стрімко охоплює місто інтелектуалів, а наші спроби придушити це невдоволення виявилися марними.\n\nНа щастя, сили цього «робітничого повстання», схоже, користуються в Томську дуже незначною підтримкою, адже багато інтелектуалів міста пам'ятають про переслідування за старого совєцького режиму. Перед могутністю нашої армії полум'я цього жалюгідного «робітничого повстання» буде перетворено на попіл."
 kostin.7.a: "Місто інтелектуалів перетворюється на місто революціонерів."

 kostin.8.t: "Повстання в Новосибірську"
 kostin.8.d: "Стан справ у Новосибірську та прилеглих територіях, схоже, досяг точки кипіння, адже полум'я революції тепер спалахує в усьому регіоні. Після наших подальших спроб заспокоїти страйкарів Новосибірська згадані робітники, схоже, досягли межі та відкрито повстали. Сама по собі це тривожна новина, але ситуація ще більше ускладнюється тим, що прилеглі території навколо Новосибірська та саме місто охоплюють значні промислові потужності й велику кількість населення.\n\nЦе «робітниче повстання» стає дедалі більшою загрозою для нашої нової держави та продовжує міцніти з кожним днем. Ми маємо загасити полум'я революції, поки не стало надто пізно."
 kostin.8.a: "Щойно ти подумав, що проблеми Новосибірська не можуть стати ще гіршими..."

 kostin.9.t: "Повстання в Красноярську"
 kostin.9.d: "Схоже, у Красноярську сталося найгірше, адже місто відкрите повстання. Вважаючи, що їхні вимоги щодо прав робітників навмисно ігнорують, соціялістичні агітатори Красноярська повстали. Що ще гірше, деякі прилеглі території надихнулися цим безглуздим повстанням і зробили те саме на знак солідарности.\n\nЯкщо ситуація ще недостатньо похмура, її додатково погіршило те, що зрадницькі повстанці захопили основні промислові підприємства міста Красноярська. Ба більше, значна частина населення підтримує цих повстанців, і ми можемо лише припускати, що протягом наступних місяців їхні лави зростатимуть. Майбутнє нашої нової держави поставлено на карту, і якщо ми не розпорошимо цих бунтівних робітників та не покладемо край їхньому безглуздому повстанню, для нас це може закінчитися лише катастрофою."
 kostin.9.a: "Невже місто не може перестати повставати?"

 kostin.10.t: "Повстання в Томську"
 kostin.10.d: "Із міста Томська надійшли жахливі новини, адже в місті тепер палає полум'я революції. Після незліченних днів безглуздих страйків невдоволені страйкарі, схоже, відмовилися від будь-якої надії на мирне вирішення та вийшли на вулиці зі зброєю, викраденою з місцевого збройного складу. Що ще гірше, за помірно широкої підтримки деякі прилеглі території навколо Томська також повстали на знак солідарности, а деякі інтелектуали самого міста навіть приєдналися до повстання, виступивши зі зброєю проти дій нашої нової держави.\n\nКоли майбутнє нашої нової держави опинилося на межі, багато хто також починає ставити під сумнів ефективність нашого правління. Якщо це так зване «робітниче повстання» не буде придушене, воно лише означатиме катастрофу для нашої нової держави."
 kostin.10.a: "Революція пофарбувала Місто інтелектуалів у червоне."

 kostin.11.t: "Повстання в Новосибірську"
 kostin.11.d: "Страйк досяг свого остаточного завершення, і тепер ми зіткнулися з повномасштабним повстанням! Осередком повстання став Новосибірськ, а його очолив раніше незначний бригадир Віталій Костін. Робітники Центрального Сибіру розпочали свою останню боротьбу проти мінливих часів. Жодних закулісних угод, жодних гарячкових переговорів і жодної перепочинку. Суспільний договір між робітником і владою знищено!\n\nКостін пообіцяв міському пролетаріатові та частині сільського селянства новий світ, народжений серед нашого попелу. На основі цієї обіцянки революційні осередки виникли не лише в Новосибірську, а й по всій країні. Нам залишається лише забарикадуватися, підняти гвинтівки й молитися всім, хто готовий нас почути. Лише одна сторона переживе цей вир, що тепер насувається."
 kostin.11.a: "Щойно ти подумав, що проблеми Новосибірська не можуть стати ще гіршими..."

 kostin.12.t: "Повстання в Красноярську"
 kostin.12.d: "Страйк досяг свого остаточного завершення, і тепер ми зіткнулися з повномасштабним повстанням! Осередком повстання став Красноярськ, а його очолив раніше незначний бригадир Віталій Костін. Робітники Центрального Сибіру розпочали свою останню боротьбу проти мінливих часів. Жодних закулісних угод, жодних гарячкових переговорів і жодної перепочинку. Суспільний договір між робітником і владою знищено!\n\nКостін пообіцяв міському пролетаріатові та частині сільського селянства новий світ, народжений серед нашого попелу. На основі цієї обіцянки революційні осередки виникли не лише в Красноярську, а й по всій країні. Нам залишається лише забарикадуватися, підняти гвинтівки й молитися всім, хто готовий нас почути. Лише одна сторона переживе цей вир, що тепер насувається."
 kostin.12.a: "Спочатку це був заколот. Потім — революція."

 kostin.13.t: "Повстання в Томську"
 kostin.13.d: "Страйк досяг свого остаточного завершення, і тепер ми зіткнулися з повномасштабним повстанням! Осередком повстання став Томськ, а його очолив раніше незначний бригадир Віталій Костін. Робітники Центрального Сибіру розпочали свою останню боротьбу проти мінливих часів. Жодних закулісних угод, жодних гарячкових переговорів і жодної перепочинку. Суспільний договір між робітником і владою знищено!\n\nКостін пообіцяв міському пролетаріатові та частині сільського селянства новий світ, народжений серед нашого попелу. На основі цієї обіцянки революційні осередки виникли не лише в Томську, а й по всій країні. Нам залишається лише забарикадуватися, підняти гвинтівки й молитися всім, хто готовий нас почути. Лише одна сторона переживе цей вир, що тепер насувається."
 kostin.13.a: "Місто інтелектуалів перетворюється на місто революціонерів."

 kostin.14.t: "Проголошення Робітничої федерації"
 kostin.14.d: "На колишніх землях самозванця Русі гордо й могутньо майорять червоні прапори, адже весь Центральний Сибір проголошено робітничою державою. Символи старого режиму вже прибирають і замінюють їх символами соціялізму та російського робітничого руху в цілому. Віталій Костін, лідер гірничих робітників і очільник робітничого повстання, звернувся до натовпу в колишньому Кемерові, заявивши, що «правління божевільного короля відправлено на смітник історії».\n\nХоча вулиці та міста федерації святкують свою перемогу, майбутнє робітничої держави аж ніяк не є ясним чи прямолінійним. Росія досі залишається хаосом воюючих угруповань і набігів, і якщо федерація хоче вижити, їй доведеться з цим рахуватися."
 kostin.14.a: "Побачимо, що стане із сибірськими робітниками."

 kostin.15.t: "Непростий натовп"
 kostin.15.d: "Це був найгордіший момент у житті Віталія Костіна. Ще рік тому він був простим робітником у лабіринтоподібних промислових комплексах, що душили басейн Центрального Сибіру. Тепер він стояв перед чоловіками й жінками першого Робітничого конґресу Сибірської робітничої федерації. Костін мав охрестити свою новостворену державу; ту, що народилася у вогні його революції.\n\n«Брати! Сестри! ТОВАРИШІ! Я офіційно вітаю вас на нашому першому Робітничому конґресі!» Його вступ було зустрінуто оглушливим ревом привітань та оплесків.\n\n«Сьогодні ми створимо федерацію, засновану робітником і для робітника! Місце, де робітничий клас триматиме кермо влади, а не ці жадібні бюрократи, які жиріють на плодах нашої праці! У нашій федерації постане новий тип суспільства: керований могутністю профспілок!» Цього разу оплесків було помітно менше. Костін відчув холодок уздовж хребта. Може, він щось не так сказав?\n\n«Так, саме так. Занадто довго нас пригнічували ті, хто жодного дня у своєму житті не працював. Працівники профспілок стануть основою цілком нового типу цивілізації. Заслуги, а не походження визначатимуть ваше становище в нашому суспільстві!»\n\nМертва тиша. Костін виступив у холодному поту. Їм явно не подобалося те, що вони чули. У задній частині натовпу він побачив, як деякі його товариші починають залишати будівлю. «Так, ну, чи є якісь питання, перш ніж ми продовжимо, товариші?»\n\n«О, та з чого, в біса, мені взагалі почати?!» — хтось крикнув із задніх рядів. Натовп почав глузливо погоджуватися."
 kostin.15.a: "Що, в біса, він думав?!"

 kostin.16.t: "Розкольники!"
 kostin.16.d: "Схоже, недавня невдача товариша Костіна на Робітничому конґресі мала серйозні наслідки. Відтоді як він висловив ідеї, які звинуватили в пропагуванні «робітничої аристократії», почали надходити тривожні повідомлення про заколоти серед ополчення. Правда виявилася набагато гіршою: вони віддали свої сили на підтримку фракції розкольників!\n\nОчолювані Іваном Севастьяновим, ці сепаратисти захопили контроль над Красноярськом і навколишніми державами та проголосили утворення «Реформованої Сибірської соціялістичної робітничої республіки». Вони дійшли до того, що засудили Костіна як тирана й відмовилися визнавати владу федерації!\n\nПопри цю очевидну зраду революції, ми не здатні належним чином відповісти на цю катастрофу, оскільки значна частина ополчення досі бунтує та відмовляється виконувати накази. Схоже, ця сецесія — лише початок наших бідувань..."
 kostin.16.a: "Цього не може бути!"

 kostin.17.t: "Нові сецесії!"
 kostin.17.d: "Катастрофа! Попри шок від безглуздої сецесії Севастьянова з федерації, схоже, наші проблеми далеко не закінчилися. Після нових заколотів в армії серед хаосу, що настав після падіння Костіна, виникла нова держава. Як і раніше, вони відмовляються визнавати нашу владу та проголошують себе незалежною державою!\n\nВідоме як «Сибірський союз робітників і селян», це нове угруповання сепаратистів очолює Марія Борченко. Вона була однією з найгучніших критикинь Костіна після катастрофічного Робітничого конґресу, і її зрада не є цілковито несподіваною. Проте це ще один тяжкий удар по Сибірській революції. Нечисленні війська, що все ще залишаються в нашому розпорядженні, паралізовані й не здатні відновити нашу владу над новоствореними незалежними територіями."
 kostin.17.a: "Ні, стривайте! Поверніться!"

 kostin.18.t: "Ополчення повстає!"
 kostin.18.d: "Ще одна катастрофа спіткала нашу молоду федерацію! Ополчення, паралізоване заворушеннями, спричиненими ексцентричністю Костіна, нарешті зробило свій хід. На жаль, цей хід не на нашу користь.\n\nЗа підтримки залишків Сибірської Чорної армії з нашого режиму, що стрімко розпадається, виникла нова сепаратистська фракція. Очолювана колишнім генералом Чорної армії Степаном Валенєєвим, ця новостворена «Вільна робітнича республіка Сибіру» заявила права на значну частину наших територій, що залишилися, та сміливо оголосила Костіна зрадником революції.\n\nПісля переходу більшости нашого ополчення на бік противника ми залишилися майже без засобів для припинення подальших можливих сецесій. Лише час покаже, чи доживе наша федерація взагалі до кінця тижня..."
 kostin.18.a: "Шакали! Стерв'ятники!"

 kostin.19.t: "Пил осідає"
 kostin.19.d: "Одна промова. Усього одна промова знадобилася, щоб зруйнувати всі здобутки Віталія Костіна. Попри всі труднощі, Костін пройшов шлях від простого шахтаря на Алтаї до лідера полум'яної робітничої революції. Звісно, ніхто не думав, що він зможе це зробити, адже його вороги були просто надто сильними. Попри всіх скептиків і пораженців, Костін та його товариші всупереч усім очікуванням визволили багатостраждальних робітників Сибіру.\n\nПроте, попри дивовижний характер перемоги Костіна, вона просто не мала тривати довго. Робітничий конґрес мав стати фіналом довгої низки перемог, подією, яка закріпила б за Костіним місце в історії як великого визволителя робітничого класу. Натомість це стала погано спланована катастрофа, унаслідок якої Костін практично за одну ніч перетворився з героя на зрадника класу.\n\nКостін ніколи не був майстром слова. Зрештою, він був простим робітником, а не поетом чи політиком. Промови точно не були його сильною стороною, і провал на конґресі став тому доказом. Сам Костін лише хотів найкращого для робітників, навіть якщо він не вмів найкраще пояснити, як саме цього досягти.\n\nТак чи інакше, шкоду вже завдано. Три окремі держави відокремилися від федерації Костіна на знак протесту проти його невдалої промови, і Центральний Сибір знову став таким самим розділеним, як на початку десятиліття. Майже так само швидко, як почалася, революція Костіна була перемелена на порох.\n\nХоча під його контролем залишилася лише чверть колишніх територій Робітничої федерації, скромний Костін залишався сповненим рішучости якнайкраще використати своє нещасливе становище, якомога краще дотримуючись ідеалів, що запалили його революцію."
 kostin.19.a: "Свічка, що горить удвічі яскравіше, горить удвічі менше."
