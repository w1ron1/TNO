 KAL_do_no_harm_desc: "Один із засадничих принципів нашого Союзу полягає в тому, що жодна людина не може вдарити іншу людину, так само як жінки не можуть бити жінок. Наш народ зазнав достатньо насильства, крові та смерти на тисячу життів уперед, і ми хочемо лише жити в мирі. На відміну від наших предків, тут селянин не страждатиме під ярмом пана.\n\nЗвісно, ми захищатимемо себе, якщо ті, хто бажає знищити наше мирне життя, наважаться перетнути наші кордони."
 KAL_strength_in_diversity_desc: "Ми є Союзом багатьох віровизнань і культур. Християни, мусульмани, атеїсти, юдеї — усі вітаються, доки вони роблять свою частку роботи. Хоча напруженість між групами часом може накопичуватися, загалом Союз є землею, вільною від шовінізму, який так довго мучив людство."
 KAL_all_power_to_the_soviets_desc: "Совєт є центральним органом нашої держави — кожне рішення ухвалюється через їхній консенсус. Хоча це неефективна модель, ця форма демократичного централізму добре служила нам від часу розпаду Федерації."
 KAL_industrialist_tendencies_desc: "Єдиний засіб виживання нашої держави — це наша промисловість. Залишки Сибірського плану дають багатьом робітникам прихисток у ці тяжкі часи, а якщо станеться найгірше, наші фабрики вироблятимуть безліч гвинтівок. Більше того, можливо, колись у майбутньому наші робітники зможуть повною мірою скористатися нашою промисловістю, щоб покращити себе та свою працю. Комунізм ще може бути досягнутий тут, у Сибірських пустках, і все це завдяки спадщині Бухаріна."
 
