 ## Country Leaders ##
 KAL_Vitaly_Kostin: "Віталій Костін"
 POLITICS_VITALY_KOSTIN_DESC: "Віталій Семенович Костін донедавна був ніким. Він народився у 1938 році в невеликому поселенні на Алтаї й змалку швидко долучився до гірничої справи. Після нетривалої служби в армії Центральносибірської республіки, де він на власні очі став свідком її розпаду й остаточного краху, він опинився в Новосибірську, готовий продовжити свою кар'єру. Костіну бракувало тієї відданости переконанням режиму, яку мали інші, і, попри чутки про його зв'язки з підпільною соціялістично-популістською групою «народників», він став зразковим робітником. Шахтар не мав жодного особливого значення для політики російських воєначальників — аж доки не почалося повстання.\n\nВирішивши чинити останній опір відродженій владі Центрального Сибіру, робітничий клас його міст і сіл узявся за зброю проти тих, кого вважав своїми гнобителями. До правителів регіону надходили звістки про захоплення за захопленням блокпостів різношерстими ополченнями, і здавалося, що ефективний контроль над регіоном знову вислизає з рук. На чолі цього грандіозного повстання стояв Костін, який не втратив нагоди повести пролетаріат до перемоги.\n\nТа хоч колись звичайний громадянин і став символом цього визвольного руху, він не є його королем, президентом чи верховним лідером. У визволених громадах виникла форма лібертарного соціялізму, а в такій системі немає єдиного лідера. Усе, чого хоче Віталій Костін, — щоб його народ був вільним і рівним, і якщо для цього знадобиться повномасштабна революція, то буде повномасштабна революція."

 POLITICS_IVAN_SEVASTYANOV_DESC: "Іван Павлович Севастьянов уперше став відомим у Центральному Сибіру завдяки своїй важливій роботі на завершальних етапах Сибірського плану. Будучи молодим інженером і колишнім чиновником КПРС, він допоміг спрямувати проєкт у правильне русло, забезпечивши його успіх і довготривалі наслідки.\n\nЙого симпатії до большевицьких ідеалів були відомі, але завдяки його корисності та здібностям на них здебільшого заплющували очі, аж доки Робітнича федерація не пройшла регіоном, а Севастьянов не скористався нагодою проголосити реформовану соціялістичну республіку, що охоплювала території, які він знав надзвичайно добре. На відміну від своїх союзників, він обрав інший підхід до правління, передавши владу Совєтам і сформувавши навколо себе сильну виконавчу владу.\n\nЦе виявилося ефективним: невдовзі було помічено величезне економічне зростання, а промисловості приділялося більше уваги, ніж будь-коли. З усіх нових держав, заснованих між Омськом та Іркутськом, саме держава Севастьянова, можна сказати, найближча до старого СРСР."

 ALT_Maria_Borchenko: "Марія Борченко"
 POLITICS_MARIA_BORCHENKO_DESC: "Марія Яківна Борченко могла стати почесною лідеркою Сибірського союзу робітників і селян, але лише кілька років тому ніхто не міг би припустити, що проста фермерка стане висхідною зіркою соціялістичного руху в Центральному Сибіру.\n\nВона народилася в селі на Алтайському плоскогір'ї й працювала на фермах протягом правління Бухаріна, ЦСР та Федерації. Незабаром її захоплення соціялізмом зблизило її з колами народників, де вона виступала за права занедбаних селян.\n\nЇї час настав пізніше, коли регіон охопило відкрите повстання, і вона повела народ Алтаю в окреме повстання. Так було створено Союз робітників і селян: мирну державу, створену нижчим класом для нижчого класу. Марія може бути його лідеркою, але в її очах справжня влада належить народу — тим, хто тяжко працює на фабриках і фермах."
 
 POLITICS_STEPAN_VALENTEEV_DESC: "Захопливий експеримент Сибірської Чорної армії залишив тривалий слід у Центральному Сибіру, і це добре видно з існування Вільної робітничої республіки Сибіру. Очолювана найстаршим за рангом членом Чорної армії, Степаном Єлісеєвичем Валенєєвим, вона значною мірою надихалася колишньою армією, чию територію тепер займає Республіка.\n\nПісля недавніх подій залишки Чорної армії реформували свою теорію мілітаризованої анархії й тепер заявляють, що сповідують доктрину Народної боротьби — затяжної збройної боротьби сільського населення проти своїх ворогів задля збереження «вільної території».\n\nВаленєєв залишився неохочим лідером цього руху, оскільки той дедалі більше відходить від анархістського бачення, за яке він боровся. Та з його підтримкою чи без неї ці ідеї безперечно вкорінилися в серцях і думках місцевого населення."

