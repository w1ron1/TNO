 GER_Bormann_category:0 "Дас Картерхаус"
 GER_Bormann_category_desc:0 "Політика Великоґерманського Райху - це заплутаний хаос, спадок постійної гри Гітлера проти різних фракцій та індивідів. Кожен, хто має хоча б частку влади, переконаний, що саме він і тільки він знає, що найкраще для Ґерманії. Як результат, різні демографічні та зацікавлені групи в Райху не можуть підтримувати одна одну, окрім як фюрера. Щоб знову об'єднати розколотий Райх, йому доведеться або залицятись до кожної з цих незадоволених фракцій, або змусити їх підкоритися, повернувши їх під владу фюрерпринципу. Якщо він зазнає невдачі, Райх неминуче увійде в стан стагнації, занепаду та, зрештою, колапсу. Лише залізна воля, безжальна інтрига і шовкова хватка можуть врятувати націонал-соціялізм."
