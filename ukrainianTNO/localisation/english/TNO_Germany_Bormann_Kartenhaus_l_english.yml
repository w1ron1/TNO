 ##SIG #0:   PARTY BUREAUCRACY
 BOR_SIGName_0:0 "Бюрократія"
 BOR_SIGName_Formatted_0:0 "Бюрократія"
 BOR_SIGName_Long:0 "Бюрократія"
 BOR_SIGName_Formatted_0_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\n§YПартійна Бюрократія§! - це шар канцелярських службовців, офісних працівників і кар’єрних політиків, які прагнуть підтримувати складну систему Райху, щоб все продовжувало функціонувати. Складається з головних органів ухвалення рішень Ґерманії, §YБюрократія§! історично була під впливом колишнього Голови канцлерії НСДАП, а тепер Фюрера Мартіна Бормана і його §LКонсервативних§! союзників. Однак цей контроль з часом поступово зменшувався, особливо у зв'язку з початком Бюрґеркріґу і подальшими зусиллями з реінтеграції в надії на стабільність. Все більше проблем, §LКонсерватори§! повинні діяти швидко, щоб забезпечити свій контроль над Бюрократичною Атласом Райху."
 
 ##SIG #1:THE PEOPLE
 BOR_SIGName_1:0 "Народ"
 BOR_SIGName_Formatted_1:0 "Народ"
 BOR_SIGName_Formatted_1_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nНалічуючи понад сто мільйонів, громадяни Райху перебувають у стані розділення та неспокою вже більше десяти років. Колись слава завоювання надала їм величезний патріотизм, в той час як потік здобичі, імпортів та сировини з окупованих територій дозволяв їм насолоджуватися деякими з найвищих стандартів життя у світі. Тепер величезна кількість людей кличе до свого Фюрера хтось просить хлібу, хтось свинецеві кулі, хтось миру, хтось війни, хтось життя а про смерть. Це був народ, який зробив тріумф Націонал-соціялізму можливим, і вони можуть так само легко його зруйнувати."
 
 ##SIG #2:INTELLIGENTSIA
 BOR_SIGName_2:0 "Інтелігенція"
 BOR_SIGName_Formatted_2:0 "Інтелігенція"
 BOR_SIGName_Formatted_2_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nЧасто відштовхувана за те, що є розплідником лібералізму, марксизму та юдофілії, інтелігенція Райху в основному існувала в тіні протягом трьох десятиліть. Витік мізків після приходу НСДАП ніколи не був повністю компенсований, але їх достатньо залишилося в школах і університетах, щоб підтримувати німецьку інтелектуальну традицію живою. Публічно вони залишаються непередбачуваним чинником, але зв'язок між шпеєризмом, студентським рухом і інтелектуалами є очевидним. У великій схемі речей вони в основному не мають значення для Партії, але їхній вплив на молоді, вражені уми не слід недооцінювати."
 
 ##SIG #3:CHURCH
 BOR_SIGName_3:0 "Церква"
 BOR_SIGName_Formatted_3:0 "Церква"
 BOR_SIGName_Formatted_3_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nПротягом тривалого часу піддавалися репресіям (насильницьким чи ні), релігійні установи Ґерманії є вічною занозою в боці Фюрера. Часто служачи корисними ідіотами під час підйому Гітлера до влади, вони швидко були стримані та позбавлені свого впливу після його приходу до абсолютної влади над Ґерманією. Теоретично, Ватиканський конкордат передбачав примирення між Католицькою Церквою та НСДАП, але на практиці вони продовжували протистояти расовим політикам націонал-соціялістів та антисемітизму, навіть прихищаючи євреїв та політичних дисидентів. Як наслідок, вони зазнали жорстокого придушення з боку СС під керівництвом Гайдріха. Вони рідко беруть участь у політиці, але все ще можуть змагатися з НСДАП за серця та уми німецького народу -  це серйозна загроза для майбутніх перспектив націонал-соціялізму, якщо їх зв'язки будуть розірвані."
 
 ##SIG #4:HEER
 BOR_SIGName_4:0 "Хеєр"
 BOR_SIGName_Formatted_4:0 "Хеєр"
 BOR_SIGName_Formatted_4_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nСильна права рука Фюрера, це Хеєр, який зламав спини наших ворогів і приніс остаточну перемогу Третьому Райху. Він все ще містить багато загартованих ветеранів довгої та кривавої Другої світової війни, здатних солдатів, незалежно від того, як сиве їхнє волосся чи покалічене тіло. Хоча політично там панує клан фельдмаршала Фердинанда Шернера, симпатії Хеєра в цілому не є однорідними. Багато обрало воювати за Шпеєра, Шпайделя чи Бормана під час Бюрґеркріґу. Хоча їхні ідеали різноманітні, різні фракції всередині Хеєра незмінно погоджуються з одним: їхні жертви зробили Ґерманію такою, якою вона є сьогодні, і їх потрібно поважати відповідно. Невиконання обов’язків перед однією з найбільших армій світу може мати серйозні наслідки."
 
 ##SIG #5:KRIEGSMARINE
 BOR_SIGName_5:0 "Крігсмарине"
 BOR_SIGName_Formatted_5:0 "Крігсмарине"
 BOR_SIGName_Formatted_5_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nЧасто забутий Ґерманією загалом, лише Фюрери та їх партія коли-небудь справді оцінили флот Райху. Без невтомної праці його підводних вовків і могутніх гармат його крейсерів та лінкорів вторгнення до Британії ніколи не було б можливим. Сьогодні Крігсмарине є засобом, за допомогою якого Райх проектує свою силу через Атлантику, забезпечуючи життєво важливу безпеку для своїх західних володінь та Африканських Райхскомісаріятів. Багато американських розвідувальних флотилій були відвернуті від ґерманських вод присутністю ударної сили Крігсмарине, що з'являється на горизонті. Без них Райх не може сподіватися зберегти своє місце серед світових наддержав."
 
 ##SIG #6:ORDUNGSPOLIZEI
 BOR_SIGName_6:0 "ОРПО"
 BOR_SIGName_Formatted_6:0 "Ордунґсполіція"
 BOR_SIGName_Formatted_6_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nОрдунґсполіція - більш відома як Орпо - це цивільна поліція Ґерманії, засіб, яким НСДАП підтримує порядок на вулицях і тримає непокірних громадян у межах визначених законом. Це далеко не звичайна поліція, Орпо повністю політизована, використовує насильство і жорстокість на кожному кроці, щоб підтримувати владу Фюрера. Рекрути Орпо обираються за їхньою силою і лояльністю, а не за навичками поліції чи темпераментом. Хоча традиційно вони підкорялися букві закону, статус Орпо серйозно похитнувся під час Бюрґеркріґу і в роки безладу, що передували йому. Їхні числа стрімко знизилися після початку війни через дезертирство, призов, вербування та внутрішні конфлікти, і організація більше не є тим монстром, яким була раніше. Проте їх потрібно відновити - і, якщо необхідно, зламати та змусити знову служити."
 
 ##SIG #7:MITTELDEUTSCHE INDUSTRY
 BOR_SIGName_7:0 "Райхсверке"
 BOR_SIGName_Formatted_7:0 "Райхсверке"
 BOR_SIGName_Formatted_7_tt:0 "§YРайхсверке§!\n§g--------------------§!\nПромисловість Центральної Ґерманії в основному контролюється Райхсверке (раніше відомими як Райхсверке Герман Ґьорінґа), великим сталеливарним та збройнним конгломератом. Промисловість Центральної Ґерманії є найближчою до Столиці Світу Ґерманії, отже, як легше піддаватися впливу, так і сама впливає на інші сфери. Значна частина економіки Центральної Ґерманії залежить від цих корпорацій; у ідеальному світі вони б забезпечували сотні тисяч робочих місць для величезного населення країни. Однак, Ґерманія в основному є економічним тягарем, оскільки багато робочих місць, які могли б бути надані населенню, замість цього стали об'єктом системи рабських контрактів, де корпорації укладають контракти на працю груп рабів, що належать якомусь власнику. Виконавці цих корпорацій мають мало стимулів змінити ситуацію, оскільки величезні цивільні жертви Бюрґеркріґу зробили використання дешевої оренди рабів ще більш привабливим варіантом для відновлення їх зруйнованих активів."
 
 ##SIG #8:RHINE INDUSTRY
 BOR_SIGName_8:0 "ІГ Фарбен"
 BOR_SIGName_Formatted_8:0 "ІГ Фарбен"
 BOR_SIGName_Formatted_8_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nНайбільшими гравцями в промисловості Рейнланду є ІГ Фарбен, одна з найбільших хімічних компаній у світі та великий новатор у галузі синтетичної олії; та Крупп, столітній титан сталі та зброї, відповідальний за значну частину німецької важкої промисловості під час обох світових війн. Звичайно, в Рейнланді є десятки промислових корпорацій, але домінування цих двох є майже абсолютним у політиці. Гітлер переважно віддавав перевагу цим двом протягом свого правління; кількість промислової продукції, виробленої цими гігантами, справді вражає - або так було, до того моменту, коли Бюрґеркріґ перетворив Рейнланд на поле битви. Коли вугільні родовища Рурської долини знову активізуються і колеса промисловості починають обертатися, Фюрер має обережно обходитися з велетнями рейнської промисловості та їх численними рабами, адже ще один сплеск незадоволення може призвести до повного колапсу німецької економіки вдруге."
 
 ##SIG #9:SÜDDEUTSCHE INDUSTRY
 BOR_SIGName_9:0 "Сіменс"
 BOR_SIGName_Formatted_9:0 "Сіменс"
 BOR_SIGName_Formatted_9_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nМенш безпосередньо пов'язані з військовою промисловістю, ніж їхні північні та західні колеги, корпорації півдня не менш важливі для економіки. Потребуючи більш кваліфікованих робітників, корпорації, такі як Сіменс (новатори в галузі обчислювальної техніки та електронних машин) і Даймлер-Бенц (виробники як військових, так і цивільних транспортних засобів), мають мало потреби у рабах, хоча для рутинної роботи все ще підтримуються невеликі робочі групи. Це ставить їх у дещо вразливу позицію; в Ґерманії недостатньо кваліфікованих працівників, щоб дозволити їм рости, але купувати та навчати рабів для виготовлення делікатної електроніки, двигунів та побутових товарів не виходить без питаннь. Сполучені Штати та Японія швидко випереджають німецькі інновації в цих сферах, і незадоволення зростає проти нав'язливої політики НСДАП щодо важкої промисловості протягом багатьох років. Фюрер має використати їх, або знищити."
 
 ##SIG #10:SLAVE PLANTATIONS
 BOR_SIGName_10:0 "Рабські Господарства"
 BOR_SIGName_Formatted_10:0 "Рабські Господарства"
 BOR_SIGName_Formatted_10_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nНа зелених полях Пруссії трудяться кілька мільйонів рабів, безперервно працюючи на велику §YРабські Господарства§! та різні галузі, які підтримують їх масове виробництво продуктів харчування та текстилю для Райху. Засновані на плодах завоювань другої світової війни, §YРабські Господарства§! грають особливу роль у житті ветеранів війн, часто будучи частково або повністю власністю цих ветеранів і наймаючи їх у значних кількостях для допомоги в обслуговуванні §YПлантацій§!. Безумовно, §YРабські Господарства§! міцно пов'язані з інтересами привілейованих ветеранів війни. Визначені значною мірою екстремальною політикою на підтримку рабства та експансіонізму, §YРабські Господарства§! є опорою підтримки §RМілітаристів§!."
 
 ##SIG #11:BANKS
 BOR_SIGName_11:0 "Банки"
 BOR_SIGName_Formatted_11:0 "Банки"
 BOR_SIGName_Formatted_11_tt:0 "§Y[BOR_SIG_GetName_Formatted_New]§!\n§g--------------------§!\nУлюблена ціль нацистів з найперших днів, банки завжди ненавидимі, але необхідні для виживання Третього Райху. Хоча "єврейські" та "плутократичні" впливи були ліквідовані давно, ті ж самі скарги зберігаються: банки жадібні, позбавляють простого народу його заробітку і несуть відповідальність за всі економічні труднощі, які переживає Ґерманія. Іронічно, банки завжди мали тісні зв'язки з НСДАП, здійснюючи фінансові хитрощі, які дозволили Гітлеру реалізувати 'економічне чудо' початку 1930-х. Банки також управляли величезним припливом здобичі з окупованих країн, перетворюючи її на ліквідні активи, щоб підживлювати німецьку військову машину та забезпечувати населення їжею і одягом. Хоча теоретично вони підпорядковані Фюреру, банки контролюють занадто багато економіки Райху для його смаку; протистояти їм може виявитися особливо катастрофічним, незалежно від того, скільки гармат він може навести на них."

