#Ideas
AST_The_Curlew_Cries: "Крики курлики"
AST_The_Curlew_Cries_desc: "Австралія є осілим державним утворенням, а не таким, що виросло природним чином з народів, які її населяли. Наші австралійські аборигени та остров'яни з Торресової протоки зараз є меншинами на своїх колишніх землях і не мають ані прав, ані привілеїв більшості австралійців. Їх навіть не зараховують до населення в переписі. Дебати про це тривають в австралійському політичному суспільстві вже кілька десятиліть, і, здається, з часом вони лише посилюються."


AST_A_Nation_of_Many_Differences: "Нація багатьох відмінностей"
AST_A_Nation_of_Many_Differences_desc: "У Австралії немає єдиного етносу, окрім тих небагатьох корінних народів, що залишилися. Наші громадяни походять з Ірландії та Росії. Голландці йдуть пліч-о-пліч із нащадками греків та англійців. Насправді, ніхто точно не знає, що таке Австралія. Відокремлені від Британії, багато хто ставить питання, чи повинні ми тепер прокласти власний шлях, а чи триматися традицій наших засновників."

AST_Hes_Coming_South: "Він йде на південь"
AST_Hes_Coming_South_desc: "По той бік води наш ворог підкрадається. Війна, яку ми вели проти надзвичайно потужної японської загрози, була найкращою яку ми могли вести. Ми зупинили його, не давши дістатися до наших берегів. Але він все ще там, чекає, спостерігає. Іх великими й потужними арміями, жорстокими та кровожерливими вбивцями. Австралія повинна бути готова, інакше він знову прийде на південь."
###"Кажу вам, прямо за каменем від Дарвіна японці чекають, коли ми зробимо помилку, щоб вони могли напасти і вирізати нас до останнього! Ми вже потрапили в пастку у Новій Гвінеї, і що з того вийшло? П’ятдесят тисяч похоронів, ось що! Усі ці балачки про безпечність, мир - я кажу 'Ніколи більше Морсбі'! НІКОЛИ БІЛЬШЕ МОРСБІ!'"

AST_joh: "Кінець удачі"
