#Focuses

#World Events

WORLD_AST.1.t: "[Get_newspaper_header]Прем'єр-міністр Австралії йде у відставку"
WORLD_AST.1.desc: "Прем'єр-міністр Австралії від Лейбористської партії Кім Бізлі пішов у відставку після того, як скандал з розподілом бюджетних коштів зацікавив кілька високопрофільних членів Федерального Кабінету. Сотні тисяч доларів були спрямовані в маргінальні округи для маніпулювання результатами на користь Лейбористів. Бізлі не був залучений до справи, але вказав на свою нездатність «повернути пошукове світло абсолютної чесності» на свою партію як на причину відставки.\n\nДоктор Герберт В. Еватт, лідер лівої фракції ЛПП, був обраний тимчасовим лідером партії, ставши новим прем'єр-міністром Австралії. Цей непередбачуваний колишній суддя Верховного Суду керуватиме урядом до того часу, поки парламентська фракція не обере нового лідера, який поведе їх на позачергові вибори. Однак погані результати Лейбористів у загальнонаціональних опитуваннях та погіршення здоров’я Еватта породили чутки про можливі зміни в керівництві."
WORLD_AST.1.a: "Не дайте дверям крутитися, не вдаривши вас по задній частині."

WORLD_AST.2.t: "[Get_newspaper_header]Камерон заявляє про перемогу на позачергових виборах в Австралії"
WORLD_AST.2.desc: "Як одна з небагатьох країн, що залишилася в орбіті OFN в Японському Маре Нострум у Тихому океані, Токіо та Вашингтон з великим інтересом стежили за виборами. В ці буремні часи виборці Австралії підкреслили необхідність надійності та довіри до свого Прем'єр-міністра. І тому не дивно, що Клайд Камерон захопив лідерство і переміг на виборах.\n\nВідомий прагматик у Лейбористській партії, Камерон зміг скористатися своїми союзниками в механізмах партії, щоб стати вибором ЛПП для голосування. Хоча він переміг усередині партії, шлях до збереження влади в Аделаїд-Авеню завжди був сповнений небезпек і ям. У той час як його опоненти можуть розглядати переобрання партії, що була втягнута в скандал кілька місяців тому, як негативний момент, використання Камероном риторики і капіталізація невизначеності так званої "Холодної війни" призвели до вибуху голосів на його користь. Тепер, з досвідченим парламентарем при владі, багато хто задається питанням, що чекає континент."
WORLD_AST.2.a: "Солідарність назавжди в палаючій нації."

WORLD_AST.3.t: "[Get_newspaper_header]Артур Калуелл став прем'єр-міністром Австралії"
WORLD_AST.3.desc: "Здається, в Австралії з'явився новий вітер. Але не такий новий, як можна було б подумати. Лейбористська партія Австралії знову здобула перемогу на виборах, незважаючи на скандал два місяці тому, а внутрішньопартійні інтриги призвели до висунення кандидата старої гвардії з "правого" крила ЛПП.\n\nАртур Калуелл здобув перемогу на нещодавніх позачергових виборах в Австралії. У той час як світові сили спостерігають за ще нечіткими намірами Калуелла за кордоном, це контрастує з його політикою вдома. Він виступає за повну свободу для профспілок, які складають основу величезних індустрій Океанії, та неухильне збереження політики "Білої Австралії". Калуелл використовуватиме всі свої можливості, включаючи характерний для нього срібний язик, щоб впливати на членів парламенту і домогтися підтримки своїх заходів. Так, новий вітер справді дме через Австралію, і цей вітер закликає до боротьби за пригноблених та безправних."
WORLD_AST.3.a: "Соціаліст, який підтримує політику Білої Австралії? Неймовірно."

WORLD_AST.4.t: "[Get_newspaper_header]Джон Гортон панує в Австралії"
WORLD_AST.4.desc: "Серед моря літніх людей і 'старих бійців' у політиці австралійські виборці обрали більш молодого кандидата для гарячого місця прем'єр-міністра. Джон Гортон, член Ліберальної партії, здобув необхідну перевагу, щоб стати наступним прем'єр-міністром Австралії.\n\nВідносно новий на політичній сцені, його ідеологія унікальна для нації. Поєднуючи політику соціального прогресу та прав для індивідів з рішучою підтримкою економічної незалежності країни та просування австралійського бізнесу, ця новина, ймовірно, стала поганою новиною для економічних стратегів США, які намагалися поглибити зв'язки з Австралією. Однак якщо це було незначне ускладнення для OFN, то це стало катастрофою для Токіо. Гортон пообіцяв свою беззастережну підтримку у боротьбі з Японською імперією, а напруженість між двома країнами швидко зросла. Але лише час покаже, що Гортон планує для Австралії."
WORLD_AST.4.a: "Будемо сподіватися, що він знає, що робить."

WORLD_AST.5.t: "[Get_newspaper_header]Пол Хаслак перемагає на позачергових виборах в Австралії"
WORLD_AST.5.desc: "Колись вважався вигнанцем навіть серед своїх, здається, що вітри удачі змінилися на користь Пола Хаслака. Прихильник старомодного торі-патріархалізму, те, що він взагалі перебуває в Ліберальній партії, може виглядати суперечливим. Оскільки Ліберальна партія складається з прихильників ідеї децентралізації влади в Канберрі та більшої уваги до індивідуальних прав і прав штатів, перемога Хаслака означає не тільки зміну для країни, але й зміну в самій основі австралійської політики.\n\nЗ цією виборчою перемогою Австралія вибрала напрямок у минуле для вирішення проблем сучасності. У своїй промові після перемоги Хаслак послався на "відсутність єдності" в суспільстві, пообіцявши "залагодити розкол" і "виправити суспільство" раз і назавжди. Більше того, Хаслак пообіцяв, що "кожен громадянин буде природно зобов'язаний допомагати один одному". Чи зможе Хаслак реалізувати своє сміливе бачення в парламенті - питання зовсім інше."
WORLD_AST.5.a: "Виглядає, що йому все ж пощастило."

WORLD_AST.6.t: "[Get_newspaper_header]Конституція Австралії знищена!"
WORLD_AST.6.desc: "Прем'єр-міністр Австралії Джон Б'єлке-Пітерсен здійснив немислиме. Прямо в прямому ефірі на національному телебаченні прем'єр взяв копію Конституції Австралії і розірвав її ножицями, незадовго до того, як оголосив, що його уряд більше не буде підкорятися їй. Засуджуючи Конституцію як 'інструмент еліт', він проголосив, що в Австралії почалася нова ера 'правильного управління'. Це особливо грубий акт навіть в історії Джона, відомого маніпуляціями з медіа та клановим правлінням, спостерігачі відзначають, що настав переломний момент в адміністрації, яка до цього часу пережила кілька наростаючих скандалів.\n\nНа знак цього дійсно історичного моменту, в усіх великих містах континенту спалахнули заворушення, і з'явилася безпрецедентна спільна заява від Лейбористської та Ліберальної партій, що звинувачують Б'єлке-Пітерсена в 'тоталітаризмі, схожому на Адольфа Гітлера'. Поки поліція патрулює країну у пошуках бунтівників та всіх, хто стоїть на шляху Джона, над Австралією сходить новий день. Навіть якщо цей день погрожує вигоріти все на своєму шляху."
WORLD_AST.6.a: "Так починається падіння Австралії."

WORLD_AST.7.t: "[Get_newspaper_header]Джон Б'єлке-Пітерсен обраний прем'єр-міністром Австралії"
WORLD_AST.7.desc: "У несподіваному перевороті, суперечливий колишній прем'єр Квінсленду Джон Б'єлке-Пітерсен виграв вибори, а його коаліція Сільської та Ліберальної партій здобула перемогу в одному з найполяризованіших федеральних виборів в історії Австралії. Відомий своїм грубим характером і придушенням протестів та страйків, критики Б'єлке-Пітерсена називають його популістом та порушником політичних правил - із чим він, здається, погоджується. Кампанію він проводив під гучним гаслом антисоціялізму та консерватизму, і багато хто відзначає, що велика частина підтримки Б'єлке-Пітерсена є відгуком на передбачувану ізоляцію, спричинену попередніми урядами.\n\nНовий прем'єр уже опинився в епіцентрі скандалу, коли він радісно оголосив, що 'комуністичні змовники' Лейбористської партії не повернуться до прем'єрства 'в найближчий час'. Деякі австралійці побоюються, що Джон може залишитися надовго."
WORLD_AST.7.a: "Не турбуйтеся з цього приводу!"

WORLD_AST.8.t: "[Get_newspaper_header]Австралія випробувала свою першу ядерну зброю"
WORLD_AST.8.desc: "Офіційні особи з Сфери та ОВН уважно стежать за випробуваннями на тестовому полі в Маралінга, Південна Австралія, де ядерна програма прем'єр-міністра Австралії [AST.GetLeader] успішно випробувала свою першу атомну бомбу. Прем'єр-міністр пообіцяв розвинути австралійський ядерний арсенал одразу після свого обрання, вказуючи на японську регіональну гегемонію як екзистенційну загрозу для острівної нації. Детонація в Маралінга закріплює Австралію як п'яту ядерну державу світу - джерело безпеки для австралійців і великої тривоги серед інших. Наразі невідомо, чи отримала Австралія допомогу ззовні в розробці зброї.\n\nЯпонський міністр закордонних справ засудив випробування, назвавши його 'передостаннім кроком на сходах до загибелі'."
WORLD_AST.8.a: "Червоний спалах робить австралійську пустелю блідою..."

WORLD_AST.9.t: "[Get_newspaper_header]Прем'єр-міністр розпускає австралійський ядерний арсенал!"
WORLD_AST.9.desc: "Прем'єр-міністр Австралії Джим Кернс оголосив сьогодні, що його уряд розпустив молодий ядерний арсенал Австралії. Кернс, активіст-соціаліст, був обраний прем'єр-міністром у 1968 році на платформі рішучого антиядерного спрямування. Його прихильники святкують цю подію як бажаний результат багаторічної кампанії.\n\nОднак союзники країни шоковані раптовим зміщенням ядерної політики, при цьому багато хто вдома вважає це рішення марною витратою мільйонів доларів на дослідження та збільшення вразливості острівної нації через те, що місцеві коментатори називають 'сліпим ідеалізмом'. Тим часом високопоставлені американські дипломати стверджують, що Кернс ослабив OFN у Тихоокеанському регіоні. Японія позитивно відреагувала, привітавши прем'єра за його відданість регіональному миру."
WORLD_AST.9.a: "Можливо, це прецедент."

WORLD_AST.10.t: "[Get_newspaper_header]Австралія та США підписали угоду про продаж підводних ракет Polaris"
WORLD_AST.10.desc: "Австралія та Сполучені Штати підписали історичну угоду щодо продажу підводної балістичної ракети Polaris A3. Згідно з угодою, США надасть Австралії матеріали та системи для розробки морського ядерного стримування з меншими ризиками для першого удару. Угода також включає положення про будівництво чотирьох підводних балістичних ракетних підводних човнів, змодельованих за класом Benjamin Franklin США, на австралійських верфях, а також програми обміну для навчання нових екіпажів підводних човнів. Перші з цих нових підводних човнів не очікується до середини 1970-х років і передбачається, що вони служитимуть протягом 30 років.\n\nДипломати Сфери різко засудили угоду, стверджуючи, що вона загострює напруженість в Азіатсько-Тихоокеанському регіоні та збільшує ймовірність ядерного зіткнення."
WORLD_AST.10.a: "Небезпечна течія в океані Імператора."

#country events

AST_scripted.12.t: "Австралія запитує про продаж підводних балістичних ракет"
AST_scripted.12.d: "[USA.GetLeader] постукав по дерев'яному верху рішучого столу кінчиком авторучки. Це рішення могло б потенційно перемістити годинник Судного дня на кілька годин уперед, і думка про це була в його голові. 'Австралія та ядерна зброя...' [USA.GetSheHe] вже втомився слухати про це. Питання про продаж Австралії підводних човнів із ядерними боєголовками було підняте кілька місяців тому, і тепер зустріч з прем'єр-міністром була всього за тиждень. Ця зустріч повинна була офіційно завершити це питання, але насправді все зводилося до рішення Президента, і краще бути готовим з відповіддю, ніж затягувати цю головну біль надовше, ніж це необхідно.\n\nНаявність ядерної зброї в Австралії взагалі була ризикованим кроком, а ось надання їм підводних човнів для запуску цих ракет? Не можна було заперечувати, що це буде великим ударом по Японії, але чи не буде це занадто великим кроком? Це може призвести до катастрофи, якщо Японія відповість. Ядерні ракети Сфери в Південно-Східній Азії - останнє, що публіка хоче почути. З іншого боку, якщо країна-член ОВН, окрім Америки, матиме можливість дійсно захищатися від нападу, це може бути популярним серед більш міжнародно налаштованих виборців.\n\nВсе зводилося до обґрунтованого ризику, [USA.GetPresidentLastName] припинив стукати, перевернув ручку і написав своє рішення на меморандумі."
AST_scripted.12.a: "Що є американці, як не ризиковані гравці? Австралія отримає свої підводні човни."
AST_scripted.12.b: "Краще перестрахуватися, скасувати рішення."


#leader bios
POLITICS_HAROLD_HOLT_DESC: "Для Гарольда Едварда Голта нещодавне призначення на посаду прем'єр-міністра Австралійської республіки стало останнім досягненням довгої та успішної кар'єри в політиці. Народжений у родині землевласників у Сіднеї, Голт вступив у політику в юному віці як член Молодих націоналістів - молодіжного крила Об'єднаної австралійської партії, і був обраний до парламенту у 27 років, ставши наймолодшим депутатом на той час. Швидко ставши протеже Роберта Мензіса, Голт продовжував свою кар'єру під час війни та піднявся по сходах Ліберальної партії Австралії - новоутвореного наступника UAP.\n\nВійна стала величезним шоком для австралійської нації. У тій війні, яка виявилася безглуздою і закінчилася гірким поразкою, країна втратила покоління своїх сміливих молодих чоловіків, і коли японське сонце піднялося над Тихим океаном, Австралія була непоправно травмована його палаючими променями. Посеред криків про зміни та глибокої політичної кризи Канберра розірвала свої зв'язки з Лондоном, коли нацистські війська завершили окупацію Англії, тим самим давши народження Республіці Австралія. Політика молодої республіки була домінована Лейбористською партією, але незабаром Голт вийшов на передній план опозиції, зрештою ставши лідером Ліберальної партії.\n\nЗгодом Ліберальна партія здобула достатню популярність, щоб перемогти на виборах 1961 року, і Голт нарешті був проголошений прем'єр-міністром. Обіцяючи підтвердити зв'язки країни з ОВН, як економічно, так і військово, і стабілізувати економіку країни, а також остаточно припинити політику "Білої Австралії", Голт завоював націю своєю реформістською платформою - однак тільки час покаже, чи стане його бачення вільної, процвітаючої та справедливої Австралії реальністю."
POLITICS_KIM_BEAZLEY_SR_DESC: "Можливо, в кращі часи Кім Едвард Бізлі міг би стати патроном освіти. Крестовим походом проти чуму неграмотності та безглуздості в Сонячній нації. В інших, втрачених майбутніх - що вислизають крізь пальці, як хвилинні піщинки - можливо, Бізлі не довелося б ставати прем'єр-міністром. Задоволений своєю посадою в Палаті представників, Бізлі міг би оселитися як сучасний Цицерон, стикатися з опонентами гірким розумом та пристрастю в своєму блискучому місті на пагорбі.\n\nАле ці не мирні часи. Австралія опиняється на межі оточення японськими нещадними хвилями. Вся генерація молодих чоловіків гниє в папуанських джунглях, не отримавши навіть відради перемоги, щоб заспокоїти їхні душі, коли вони перетинають Стікс. Лише логістичний кошмар вторгнення та окупації Країни, що знаходиться на дні, врятував Австралію від того, щоб бути проткнутим на японських імперських багнетах. З лише крихким життєвим шляхом до Америки багато хто починає запитувати: Чи виживе Австралія, щоб боротися ще один день? Чи вона, як і Східна Азія, піддасться сліпучому сяйву Сонця? Або найбільш огидний ворог прийде зсередини?\n\nЗ таким тяжким наслідком, як втрата незалежності, не дивно, що цей молодий чоловік є палким прихильником відновлених зв'язків з теплою обіймами Вашингтона. Зрештою, коли Трон Британії зайняли зрадницькі претенденти, чи не дивно, що Австралія повинна вирішити союз з Останньою надією Свободи? Бізлі стоїть, спиною до минулого, і своїм чолом до майбутнього кричить:\n\nАвстралія, вперед!"
POLITICS_ARTHUR_CALWELL_DESC: "Підтримка політики Білої Австралії повільно зменшувалася протягом останніх двадцяти років. Мережа расистського законодавства, що була прийнята для захисту Австралії як форпосту британської раси в Океанії, була, і поступово розпускається новим поколінням обережних реформістів.\n\nПолітичні прокажені, всі вони!\n\nАртур Августус Калуелл - найзапекліший і найбільш гучний захисник політики Білої Австралії в федеральному парламенті. Калуелл стверджує, що, будучи сувереном своєї власної нації, африканець, азієць і мулат рівні білим людям, але як тільки вони ступають на землю Австралії, вони стають забруднювачами. Жодна нація, якою б сильною вона не була, не може вижити при незарізанієї співжиття рас. Саме з такою лінією мислення Калуелл стверджує, що він не расист, а лише пишається своєю расою, як і кожен чоловік повинен це робити. Його критики насміхаються з нього за це. Калуелл вважає їх всіх дурнями.\n\nНасправді те, що Калуелл думає, завжди йшло першим. Він стверджує, що медіа неправильно його представляють: вони ніколи не фокусуються на трудящих, які виступають на кузовах вантажівок в ізольованих містечках за потребу в сільських лікарнях; на самовивченому профспілковому активістові, який розмовляє китайською та виступає проти участі в чужих війнах; або на соціалістові, що підтримує добробут і хороші зарплати.\n\nАле все це закінчується на кольоровій межі. У туманному барі Парламенту, тримаючи келих на рівні очей, прем'єр-міністр посміхається та шепоче своїм товаришам: "Два Вонга не роблять Білого.""
POLITICS_JOHN_GORTON_DESC: "У партії економічних лібералів керує ларикінський центрист. Джон Грей Гортон, прем'єр-міністр Австралії, є самосвідомим аномалією. Прокладаючи вузькими коридорами парламенту, він чує, як опоненти висміюють його політику, як прояв повзучого соціалізму - "гортонізм", вони це називають. Вони говорять, що вони як клуб грибів: тримають у темряві та годують лайном. Гортон просто сміється і запитує, чи може він приєднатися, і так його бекбенчери називають його "головною спорою".\n\nАле за всіма його жартами Гортон знає, що він ізольований. Він економічний націоналіст, соціальний ліберал, важкий пияк і хронічний жінколюб, і через ці аномалії, його то називають загрозою, то ганьбою. Вони не знають, як мало їхні насмішки його зачіпають; Гортон пережив набагато гірше. Вони не знають про авіакатастрофу або дитинство, проведене в любові до матері, що була ув'язнена в санаторії. Вони не знають людину, яка втратила обличчя, лише щоб вийти перед камерами і посміхатися.\n\nМісія Гортон, як він її бачить, - це принести прогрес націю, яка задоволена безпекою політичного луддизму. Чи довірить він своїй кабінету цю місію, ймовірно, буде однією з основних дилем його прем'єрства. Або, можливо, останньою."
POLITICS_CLYDE_CAMERON_DESC: "Клайд Кемерон задумується на роздоріжжі старого і нового Лейбору, не знаючи, куди подме вітер. Він риється в своїх щоденниках, які веде з того часу, як приєднався до парламентського кокусу, з часами, підрахунками голосів і саркастичними зауваженнями, що всі записані. Переглядаючи фігури австралійського лівизму - від старих партійних вождів до новачків, які ведуть студентські окупації - Кемерон вирішує, що потрібна нова стратегія і зміна лідерства.\n\nКолись лідер Лейбору, Клайд Кемерон поступово став спокійним, старанним і мстивим політичним оператором, якого поважають парламентарії з обох боків політичного спектра. В межах Лейбору він підтримує необхідність адаптації до змінюваного електорату та ерозії старих виборчих коаліцій. Але образ Кемерона як прагматика приховує ідеалістичного, непохитного соціаліста. Ніхто не відмовить його від його мрії: Австралія, де працівники живуть у щасті і безпеці, де терпимість перемогла біглобіку, а війни більше не ведуться.\n\nДля того, щоб створити таке майбутнє, повинні бути соціалісти, які це принесуть. Кемерон знає, що парламент вважає його злопам'ятним і ретельним. Він підозрює, що АСБР та ЦРУ стежать за ним. Якщо він не досягне успіху, незважаючи на свої зусилля, Кемерон навчатиме наступне покоління австралійських соціалістів здійснити те, чого він не зміг. Кемерон має чимало жорсткості до своїх ворогів, але він дарує боротьбі за краще майбутнє, а також борцям за це майбутнє, лише захоплення."
POLITICS_PAUL_HASLUCK_DESC: "Від поета до політика, від історика до прем'єр-міністра, Пол Мірнаа Кейдвалла Хаслак побудував свою кар'єру на безмежній енергії для своїх найбільших пристрастей. Виходячи з скромного дому в Фремантлі, Хаслак вперше прорвався в політичну сферу, пишучи газетні статті під псевдонімом 'Полігон'. Багато західноавстралійців знали його прихильність до передового оборонного мислення чи міжнародного управління, ще до того, як дізналися його справжнє ім'я. Але коли Хаслак потрапив до Палати представників у 1949 році, багато членів парламенту виявилися важкими для спілкування з ним.\n\nСучасники Хаслака висловили безліч оцінок: він колегіальний, але дещо зажатий, надмірно педантичний, формальний, добре освічений, приватний і добродушний, з перевагою до управління, а не політики. Він ненавидить крики та гучний шум. Він цінує ясність. Хаслак не любить делегувати повноваження, віддаючи перевагу затишку в приватних справах і відчуттю виконаного обов'язку. Він вимогливий, інколи агресивний до підлеглих, і сильно любить австралійську землю.\n\nЧервона рівнина пустелі тепер лише бездомний спогад. Навіть у вузьких коридорах Парламенту, зі стійким димом сигарет і тісними проходами, Хаслак інколи відчуває примарний дотик вітру, що носить пісок навколо його щиколоток. Але його завдання незмінне. Порядок, який має бути втілений - якщо треба, через асиміляцію - це порядок свободи та індивідуалізму, поваги і обов'язку, і рішучості. Хаслак не претендує на вищу мету. Він знає, що його місія народжена з загального обов'язку, який є в основі людства."
POLITICS_AUTHDEM_JOH_DESC: "Сказати, що це було несподівано - це дуже помірковано. Мало хто очікував, що Йоганнес 'Йох' Б'єлке-Петерсен балотуватиметься на посаду прем'єр-міністра. Завдяки такій вузькій базі підтримки, його різко провокаційна риторика і кар'єра прем'єра Квінсленду, що була сповнена скандалів і звинувачень, було зрозуміло, чому більшість основних політиків відмахнулися від нього. Однак його захоплення Ліберально-Сільським коаліцією і перемога на виборах лише здивували ще більше.\n\nАле звісно, Йох ніколи не прагнув "основної" аудиторії, чи не так? Те, що привело полівіціста-паралізованого від поліо до перемоги, це не його підтримка великими корпораціями чи багатими донорами - хоча Йох ніколи не відмовлявся від безкоштовного допоміжного виступу під час кампанії - або його вміння працювати з розвивається телевізійними та масовими медіа - хоча це дійсно допомогло. Ні, це було щось значно примітивніше та первісніше. Ненависть. Ненависть до пихатих еліт. Йох - прем'єр-міністр для простих людей - для групи, яка досі не мала ваги в парламенті. Австралії потрібен хтось, хто може говорити з громадянами, а не зверху на них. Немає більше безкінечного терору в профспілках або податкових органах, що вимагають більше і більше, щоб заповнити власні кишені. Якщо вони вірять, що можуть діяти разом, то скоро вони дізнаються, наскільки вони помиляються.\n\nХоча стара, вмираюча охорона та бюрократія намагатимуться зупинити Йоха, вони не зможуть зупинити людей. Австралія, будь-якими засобами, буде перебудована на дім для всіх справжніх громадян. Навіть якщо йому доведеться порушити кожне правило і знехтувати кожним регламентом."
POLITICS_DESPOT_JOH_DESC: "Австралія захворіла. Гноїться до пульсуючого, гниючого ядра. Її інститути - які утримують свої сатрапії, переповнені мільйонами доларів платників податків - тільки служать для підтримки цього хитаючогося, спотвореного каркаса нації. Австралія побудована на сльозах і крові класу, що перебуває під нападом. Не тільки комуністами-зрадниками і їхніми товаришами в Австралійській Лейбористській Партії - які хочуть підкорити наш великий народ до вмираючої, розкладеної ідеології, що проголошується півзмерзлими російськими фанатиками і жовтобокими пацифістами, але й із висоти. Так, вз висоти. Канберрійські еліти, з їх імпортними сигарами та декадентськими оргіями таємних змов і шардоне, сміються зі своїх веж із слонової кістки. Вони сміються, поки їхні маріонетки грають у політику, і продовжують ставити свої прикрашені діамантами черевики на спинах важко працюючих платників податків. Що стало з цією землею?\n\nДосить. Досить, кричить Йох. Як обривки Конституції, що тягнуться навколо його ніг, ці дві змії будуть задушені всією могутністю виконавчої влади. Критики намагаються жалітися на "наглу" зневагу до демократії, коли знищується ця Конституція, прямо в ефірі. Добре, говорить Йох. Добре, що кінцева символіка елітаризму і шампансько-змоченого "інтелектуалізму" корчиться в агонії. Добре, що основні ЗМІ, кишені яких набиті кровавими грошима, ненавидять його так. Добре, що ніхто не зможе зупинити його тепер.\n\nНавіть зараз, у Австралії відбувається трансформація. Ті, хто відмовляється співпрацювати з новим порядком Йоха, будуть розчавлені під його чоботом. Поліція, озброєна до зубів смертельною зброєю, штурмує офіси непокірних журналістів. При свічках, прихильники сільської партії перерисовують кордони округів у огидні виступи та плями, щоб австралійська демократія мала лише одного господаря. Корупція - це брудне слово в політиці, але в Австралії Йоха, це буде прокляттям, яке буде вимовлятися часто й скоро.\n\nНад Австралією розірвано грозові хмари. Те, що вийде на світло, буде справді невпізнаване!"
POLITICS_EVATT_DESC: "Герберт Вере Еватт колись був яскравою зіркою. Надзвичайно розумний юрист, Еватт закінчив Сіднейський університет з першокласними відзнаками в чотирьох сферах, двома університетськими медалями та пізніше ступенем доктора прав. Він став промисловим юристом, потім наймолодшим суддею Верховного суду в історії Австралії, а потім - лідером Лейбористської партії, щоб стати прем'єр-міністром. Але розум Еватта поступово згас.\n\nЕватт страждає від двох тяжких хвороб - церебрального тромбозу та артеріосклерозу. Його спогади, колись як делікатні фризи, вигравірувані в сталі, повільно зникли у фоновому шумі. Багато в Лейбористській партії вважають, що падіння Еватта почалося ще до того, як його розум почав слабшати - коли він вперше вирішив, що він розумніший за всіх інших. Він ухвалював мільйон рішень без консультацій, половина з них були успішними, а половина - ні. У парламенті Еватт більше не міг налаштувати темп для свого оточення.\n\nМіж спокоєм і агресією, але страшно ясний, Еватт бореться з політичною трясовиною. Фракції і Ліберали оточують його. Парламент відмовляється від політики «Білої Австралії», і Еватт не підтримує їх зміни. Його розум обманює його, поки час невпинно спливає, підсовуючи факти, які він знає, що неправдиві. Можливо, все хороше, що Еватт міг би зробити, вже зроблено. Можливо, всі його рішення залишать його раніше, ніж він думав.\n\nМожливо, його час вже закінчився."
POLITICS_JOHN_MCEWEN_DESC: "Джон "Блек Джек" Мак'Юен, прем'єр-міністр Австралії, є суворою людиною, який виріс у тісній кімнаті в задній частині аптеки. Мати Мак'Юена померла, коли йому було два роки, а батько - коли йому було сім. Він покинув школу в тринадцять років, щоб забезпечити свою бабусю і молодшу сестру, а в 1918 році він залишив роботу, щоб вступити до Австралійських імперських сил у боротьбі з Центральними державами. Він не бачив боїв, але його служба дала йому право на отримання земельної ділянки від уряду Австралії. Відтак він став землеробом, створив продуктивне господарство і приєднався до Вікторіанського союзу фермерів, щоб робити те ж саме, але на більшому масштабі. Далі йшли федеральні політика.\n\nМак'Юен швидко просувався по сходах до країни: став міністром, потім заступником лідера країни, потім лідером. Країна стала його природним середовищем. Все, що йому потрібно було, це стояти вище за свою компанію і залишатися непохитним. У партії вільних торговців Мак'Юен став відомим як прихильник протекціоністської економіки і розвитку сільськогосподарської індустрії, часто викидаючи вибухи гніву, коли його терпіння вичерпувалося. Тепер, витримавши повний термін скинутого прем'єр-міністра, Мак'Юен стоїть на вершині гори, з кам'яним обличчям і впертістю, намагаючись зберегти спокій.\n\nАле стрес накопичується. Усі ці суперечки, подорожі, праця, роки, що витирають його з голови до ніг. Шкіра на його ногах, руках і грудях стала лускатою та сухою. Кожен раз, коли він ходить, його шкіра тріскається, і його ноги кровоточать. Він змінює бинти протягом дня і продовжує працювати. Це те, що потрібно країні. Важка робота робить людину твердою, і Джон Мак'Юен вважає, що тільки правильним є те, що найсильніший чоловік Австралії робить найважчу роботу. Суворе і готове життя - єдине життя, варте життя.\n\n§V"Ти просто повинен працювати крізь біль."§!"
POLITICS_GOUGH_WHITLAM_DESC: "Гофф Вітлем - велика людина з величезним его, величезним мозком і величезним планом. Вітлем провів більшу частину шістдесятих, боровшись з соціальними консерваторами старої Лейбористської партії, відстоюючи нову програму радикальних реформ. Він продовжував протистояти навіть тоді, коли це порушувало правила партії, і керівництво погрожувало його виключенням. Він продовжував, каже він, тому що люди або пробиваються, або зламаються. Він не міг піти іншим шляхом, бо його сумління не дозволяло цього. Він не міг прийняти поточний стан справ, бо все це було так соромно, бо все це було так неправильно. Тому з новим поколінням реформаторів середнього класу за ним, Вітлем пробився.\n\nГофф Вітлем, прем'єр-міністр Австралії, є співчутливою, моральною людиною, яка б'є людей своєю інтелектуальною потужністю. Він непохитний і замкнутий, принижуючи так само часто, як і консультується. Мало хто в Федеральному парламенті може кинути йому виклик в дебатах чи знанні питань, які він обирає для виправлення. Його опоненти називають його зарозумілим. Вітлем погоджується і наполягає, що вони неосвічені. Обурені, його опоненти запитують, як він зустрінеться з Богом наприкінці свого життя. Вітлем відповідає, що вони можуть бути впевнені, що він буде ставитися до Нього як до рівного.\n\nВітлем перетворить підлогу Палати в ковальський верстат, на якому він буде кувати прогресивне законодавство і відправляти реакційних депутатів у небуття. Ніхто не повинен страждати від продуктів невігластва. Протягом наступних трьох років, обіцяє Вітлем, австралійці будуть мати універсальне медичне обслуговування, безкоштовні університети, легалізовані аборти, визнання прав на землі аборигенів, свободу від призову до армії та масові конституційні реформи для закріплення нових основоположних прав. Усе це, обіцяє Вітлем, і багато іншого, коли він знову проб'є.\n\n§P"Вони високі, я великий."§!"
POLITICS_WILLIAM_MCMAHON_DESC: "Телефон, що стоїть на столі Прем'єр-міністра Австралії, бежевий, глянцевий і новий. До Вільяма Макмахона дзвінки надходили в офіс Прем'єр-міністра через ряд телефоністок, розташованих між дерев'яними перегородками на північному сході парламентської будівлі. Тепер кожен дзвінок проходить через Макмахона. Кожен план проходить через Макмахона. Кожне привітне повідомлення від медіа-магната надходить через Макмахона, і кожен політичний наказ йде від Макмахона. Він ледве може уявити, щоб розлучитися з усім цим, Тиберій з телефоном і його мережею для дерегуляції.\n\nВільям Макмахон є спеціалістом Ліберальної партії з економічних питань. Його надмірно скрупульозні меморандуми неодноразово зачитувалися в парламентській залі і обговорювалися в партійних кімнатах. Члени Ліберальної партії добре знають, що кожне слово, яке виходить з вуст Макмахона, потрібно уважно перевіряти. Він безсумнівно є блискучим адміністратором та обізнаним економістом, але частіше за все він поширює напівправду, перебільшення та брехню. Він жорсткий і безхаризматичний, нервовий і напружений; невтомний прихильник фінансової дерегуляції, збалансування бюджету і прогресивних інновацій там, де це дозволяє бюджет. Його завдання - отримати довіру парламенту, коли справа доходить до голосування.\n\nТепер Вільям Макмахон сидить за своїм столом, постукуючи пальцями по трубці телефону. Він знає, що людина, яка підніме трубку, не буде йому довіряти. Він знає, що маніпулювання Сенатом, Палатою представників і громадськістю буде таким же важким, як і обробка свіжо нарізаного діаманта. Це нормально. Він не проти витратити ще кілька додаткових годин."
POLITICS_WILLIAM_MCMAHON_DESC: "Телефон, що стоїть на столі прем'єр-міністра Австралії, бежевий, глянцевий і новий. До Вільяма МакМахона дзвінки надходили до офісу прем'єр-міністра через ряд телефоністок, розташованих між дерев'яними перегородками в північно-східному коридорі Парламентського будинку. Тепер кожен дзвінок надходить через МакМахона. Кожен план проходить через МакМахона. Кожне дружнє повідомлення від медіамагната проходить через МакМахона, і кожне політичне розпорядження надходить від МакМахона. Він ледь може подумати відмовитися від усього цього - Тиберій з телефоном та його мережа для дерегуляції.\n\nВільям МакМахон - спеціаліст Ліберальної партії з економічних питань. Його надмірно скрупульозні меморандуми були неодноразово прочитані в Парламентському будинку і неодноразово обговорювались у партійних кімнатах. Члени Ліберальної партії добре знають, що потрібно уважно перевіряти кожне слово, яке виходить із вуст МакМахона. Він безсумнівно є блискучим адміністратором і обізнаним економістом, але частіше за все він розповідає напівправди, перебільшення і брехню. Він суворий і безхаризматичний, нервовий і напружений; невтомний захисник фінансової дерегуляції, балансування бюджету та прогресивних інновацій, де дозволяє бюджет. Його завданням є отримати довіру парламенту, коли справа доходить до голосування.\n\nЗараз Вільям МакМахон сидить за своїм столом, постукуючи пальцями по трубці телефону. Він знає, що людина, яка підніме слухавку, не довірятиме йому. Він знає, що вести боротьбу з Сенатом, Палатою і громадськістю буде так само важко, як різьблене алмазне скло. Це нормально. Він не проти віддати кілька додаткових годин."
POLITICS_MALCOLM_FRASER_DESC: "Народжений у сім'ї вікторійських овечих фермерів, Малькольм Фрейзер спочатку мав намір продовжити сімейну справу, навчаючись економіці та філософії. Однак доленосна зустріч із Молодими лібералами в Гамільтоні на початку 50-х змінила кар'єру Фрейзера, і він скоро потрапив під вплив австралійської політики.\n\nЙого час у партії був важким: він програв перші вибори, лише щоб здобути успіх через рік. Повільно Фрейзер набував авторитету в партії, проходячи через низку партійних посад і міністрів кабінету. Нарешті, перемігши Біллі Снеддена в спробі змістити лідера партії, він тепер є лідером своєї партії та всієї Австралії.\n\nПолітично Фрейзер є прихильником мультикультуралізму, стоячи на боці пригноблених людей Сфери, які можуть розглядати Австралію як притулок від тиранії, і підтримує продовження державної системи соціального забезпечення, навіть якщо це обходиться дорого. Усі досягнення повинні бути поступовими, і Фрейзер не збирається зупинятися на темпі, який призвів його до того, де він зараз. Але, більше за все, він є стійким ястребом у зовнішній політиці і готовий зробити все, щоб побороти фашизм як вдома, так і за кордоном."
POLITICS_JIM_CAIRNS_DESC: "Багато що змінилося в Австралії, щоб Джеймс Форд Кернс став прем'єр-міністром цієї острівної нації в годину, коли він опинився на цьому посту. Кернс скористається моментом і зробить все, що зможе, щоб здійснити свою концепцію кращої нації.\n\nКернс, соціаліст з самого раннього віку, народився в родині, чий батько пішов на війну і не повернувся. Він служив поліціантом з 1933 по 1944 рік, потім приєднався до Лейбористської партії, де продовжив свою кар'єру, пропагуючи свою концепцію соціалізму і роблячи те, що роблять парламентарії - до того моменту, як все змінилося і він став прем'єр-міністром.\n\nНовий прем'єр-міністр є соціалістом і прихильником так званої Нової Лівиці. За професією економіст і глибоко прив'язаний до теорії, він не настільки відірваний від реальності, щоб втратити зв'язок з нею; його правильно хвалять за адміністративні здібності. Він не змінює свою поведінку для кого-небудь; всі отримують «повного Джима», який зазвичай ввічливий, але прямолінійний у своїх бажаннях.\n\nХоча він не є агресивним, він відданий своїм поглядам; це в поєднанні з його публічною симпатією до психологічних і духовних елементів австралійської контркультури може призвести до зіткнень з деякими австралійськими інститутами. Але Кернс впевнений, що він зможе зробити все, що від нього залежить; час покаже правду його поглядів."
POLITICS_BILLY_SNEDDEN_DESC: "Народжений в Перті від неписьменної матері і батька, який втік з Шотландії, щоб уникнути закону, мало хто коли-небудь думав, що Біллі Снедден досягне чогось великого, але він не був з тих, хто здається. У віці 8 років він працював у будівництві разом з братами, допомагаючи, чим міг. У 1942 році, коли йому було лише 15, він влаштувався на роботу молодшим юрисконсультом, що проклало шлях до його входу в політику.\n\nОфіційно увійшовши в політичну арену в 1954 році як член Ліберальної партії Палати представників, він працював у кабінеті Роберта Мензіса до їх поразки в 1961 році. Як член опозиції його призначили Тіньовим міністром з імміграції. Там він здобув репутацію надзвичайно ефективного законодавця та яструба на міжнародній арені.\n\nУ 1971 році він оскаржив лідерство Ліберальної партії. Більшість депутатів вважала його темною конячкою кандидата, але несподівано він не лише переміг основного суперника Малькольма Фрейзера, а й повністю розчавив його, ставши лідером Ліберальної партії. Вибори проти Лейбористів пройшли вкрай напружено, і першим пунктом у порядку денному прем'єр-міністра стала реформа культури парламенту. Його опоненти сумніваються, що його перебування на посаді принесе якісь великі зміни, але Біллі Снедден не з тих, хто здається."


