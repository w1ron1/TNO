 CountryInfo_Tutorial_Folder.101: "Новий порядок" # fuck you

 CountryInfo_Tutorial_Content.1: "Холодна війна"
 CountryInfo_Tutorial_Content_desc.1: "§WНовий порядок: Останні дні Европи§! показує, якою могла б бути §BХолодна війна§!, якби у Другій світовій війні перемогли держави §WОсі§!. Подібно до реальної історії, світ §WTNO§! опинився в умовах тристороннього протистояння головних держав, що вийшли з війни: §qВеликоґерманського Райху§!, §eЯпонської імперії§! та §MСполучених Штатів Америки§!.\n\nБоротьба за §Yсвітове панування§! більше не ведеться безпосередньо на полі бою між великими державами, які прагнуть §xзнищити одна одну§!. Натомість вона точиться через §Yзакулісні домовленості§!, §Cміжнародні маніпуляції§!, §Gекономічне суперництво§! та §Yрозширення сфер впливу наддержав§!. Саме тому ігровий процес §WTNO§! суттєво відрізняється від звичайної Hearts of Iron IV завдяки особливим механікам, про які йтиметься нижче."

 CountryInfo_Tutorial_Content.3: "Проксі-війни"
 CountryInfo_Tutorial_Content_desc.3: "Однак це не означає, що війни в §WНовому порядку§! трапляються рідко. Навпаки, вони тут §Gнадзвичайно поширені§!, і, граючи за більшість держав, ви неодмінно візьмете участь у кількох. Утім, замість безпосередніх зіткнень великих держав боротьба зазвичай точиться у формі §Rпроксі-війн§!. У таких війнах дві держави воюють між собою за підтримки могутніших покровителів, які таким чином протистоять один одному, не вступаючи у відкритий конфлікт. Подібне втручання можливе й під час §Rгромадянських війн§!, що також трапляються доволі часто.\n\nПід час §Rпроксі-війни§! кожна зі сторін може отримувати допомогу від зовнішніх держав. Якщо державою-покровителем не керує гравець, її підрозділи передаються воюючій стороні. Якщо ж покровителем керує гравець, він може підтримати своїх союзників через §Wсистему добровольців§!, як у звичайній §WHearts of Iron IV§!."

 CountryInfo_Tutorial_Content.4: "Інтерфейс Холодної війни"
 CountryInfo_Tutorial_Content_desc.4: "Щоб стежити за боротьбою за світове панування, скористайтеся §Yінтерфейсом Холодної війни§!, який відкривається кнопкою із символом атома на верхній панелі. Тут ви знайдете всю необхідну інформацію про учасників §BХолодної війни§!: хто наразі веде перед, наскільки випереджає суперників і завдяки чому.\n\nВкладка §Yрейтингів§! показує, яка держава посідає провідне місце з огляду на її §Rвійськову§! та §Gекономічну§! могутність. Вкладка §Rнапружености§! дозволяє оцінити стан відносин між великими державами й ознайомитися з подіями, що призвели до загострення протистояння. Вкладка §Gсфер впливу§! відображає економічну могутність провідних держав та їхній вплив на інші країни.\n\nНарешті, є вкладка §xядерної зброї§!, про яку докладніше йтиметься в наступному розділі."
 
 CountryInfo_Tutorial_Content.5: "Ядерна війна"
 CountryInfo_Tutorial_Content_desc.5: "Події §WНового порядку: Останніх днів Европи§! розгортаються в умовах Холодної, а не світової війни. Станом на 1962 рік усі три великі держави - §WСполучені Штати§!, §WНімеччина§! та §WЯпонія§! - володіють повноцінною §Rядерною тріядою§!, тримаючи світ у постійному страху перед §Rядерним голокостом§!.\n\nВідтак доля інших країн значною мірою залежить від волі світових §Gнаддержав§!, які перебувають у безвихідному протистоянні, не маючи змоги здобути легку перемогу одна над одною. Будь-який збройний конфлікт між цими §Gнаддержавами§! неминуче переросте в §RТретю світову війну§!.\n\nЯкщо §RТретя світова війна§! все ж розпочнеться, добром вона не скінчиться. Сторони воюватимуть доти, доки одна з них не почне зазнавати поразки. Якщо держава опиниться на межі краху, втратить змогу продовжувати війну або зіткнеться з безпосередньою загрозою своїм основним територіям, §Rядерна війна§! стане неминучою. Після першого ядерного удару мине лише кілька днів, перш ніж у хід підуть тисячі ядерних боєзарядів. А тоді настане §Rкінець гри§!!"
 
 CountryInfo_Tutorial_Folder.102: "Механіки"
 
 CountryInfo_Tutorial_Content.6: "Економіка"
 CountryInfo_Tutorial_Content_desc.6: "§WНовий порядок: Останні дні Европи§! має складну систему §Wекономічних§! механік. Щоб відкрити економічний огляд, натисніть §Wзначок глобуса§! між вкладками §Wдосліджень§! та §WХолодної війни§!. Основою національної економіки є §Gваловий внутрішній продукт (ВВП)§! - головний показник економічного добробуту держави. Водночас важливо підтримувати належне співвідношення між §GВВП§! та §Rдержавним боргом§!. Щороку відсотки за §Rборгом§! збільшуватимуть державні видатки, а надмірне співвідношення §Rборгу§! до §GВВП§! може призвести до фінансового краху.\n\nЩоб уникнути економічних негараздів, уважно стежте за §Gдоходами§! та §Yвидатками§! держави. На §Gдоходи§! впливає чимало чинників, найважливішим із яких є §GВВП§!. Проте не меншої уваги заслуговують промисловість, рівень бідности, освіта та багато інших показників. З іншого боку маємо §Yвидатки§! - справжній головний біль кожного економіста. До §Yвидатків§! належать утримання війська, соціяльне забезпечення, будівельні проєкти та інші державні витрати."
 
 CountryInfo_Tutorial_Content.7: "Закони й суспільний розвиток"
 CountryInfo_Tutorial_Content_desc.7: "Натхненний законодавчою системою Victoria 2, §WНовий порядок: Останні дні Европи§! пропонує розгалужену систему законів, що відображає особливості §Yдержавної політики§! вашої країни й додає ігровому процесу глибини та складности. У вкладці §Wполітики§! ви знайдете широкий вибір §Yдержавних політик§!, які можна запроваджувати протягом гри. Кожна з них впливає на різні ігрові показники, маючи як переваги, так і недоліки.\n\nКрім того, кожна §Yполітика§! має власний рівень §Yефективности§!, який може зростати або знижуватися з перебігом гри. На нього, зокрема, можуть впливати наявність певних споруд і фінансування. Саме від §Yефективности§! залежить сила впливу запровадженої §Yполітики§!: що вона вища, то відчутніші її наслідки.\n\nНарешті, §Yсуспільний розвиток§! відображає поступ вашої країни в різних сферах. Протягом гри його показники можуть як §Gполіпшуватися§!, так і §Rпогіршуватися§!, залежно від обраного шляху розвитку."
 
 CountryInfo_Tutorial_Content.8: "Особливі механіки країн"
 CountryInfo_Tutorial_Content_desc.8: "Багато країн у §WНовому порядку§! мають власні розгалужені §Gскриптові графічні інтерфейси§!, покликані урізноманітнити §Rігровий процес§! і зробити мирний час цікавішим для гравця. §GСкриптові інтерфейси рішень§! вбудовані безпосередньо у §Yвкладку рішень§! і відкриваються разом із нею. Серед них - §Wінтерфейс Томської думи§!, §Wінтерфейс південноафриканського референдуму§! та §Rчимало§! інших!\n\nНатомість §Gповноекранні скриптові інтерфейси§! відкриваються через §Yвкладку політики§! за допомогою кнопки під §Wпортретом лідера країни§!, поряд із §Wпортретом голови уряду§!. Зазвичай вони значно складніші й нерідко відіграють визначальну роль в §Rігровому процесі§! відповідної держави. До них належать §Wінтерфейс голосування у США§!, §Wінтерфейс Шпеєрового Цолльверайну§!, §Wінтерфейс японського законодавчого органу§! та §Rнизка§! інших. Крім того, більшість §Gскриптових інтерфейсів§! мають §Yінформаційну кнопку§!. Якщо §Rнавести на неї курсор або натиснути§!, ви побачите корисні відомості про роботу інтерфейсу та особливості відповідної §Rігрової механіки§!."
 
