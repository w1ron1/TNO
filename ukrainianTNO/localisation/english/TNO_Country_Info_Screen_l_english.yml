 IBR_CountryInfo_Folder.101: "Брати по зброї?"
 IBR_CountryInfo_Folder.102: "Захід сонця над Іберією"

 IBR_CountryInfo_Content.1: "Час змін"
 IBR_CountryInfo_Content_desc.1: "Від 1640 року Мадрид і Лісабон не стояли під §nодним§! §fпрапором§!. Та доля - примхлива володарка, яка не терпить непокори. Під час Другої світової війни, попри симпатії Франко до Берліна, §nПортугалія§! та §fІспанія§! зберігали нейтралітет. Утім, це не завадило Іспанії вирвати Ґібралтар із пазурів конаючої §VБританської імперії§!. А Гітлер, підкоривши Европу, вирішив випробувати свої сили й в Африці. Зібравши нечисленні розрізнені війська на §nЧорному континенті§!, Німеччина завдала удару по португальських колоніях Анголі та Мозамбіку.\n\nПобоюючись, що §rбеззаперечний володар Европи§! знову оберне свою силу проти них, обидві країни розпочали переговори про взаємні гарантії суверенітету. Зрештою, попри давнє небажання Португалії йти на таке об'єднання, сама необхідність породила нову державу. §fІберійський союз.§!"
 IBR_CountryInfo_Content.2: "Світанок нової доби"
 IBR_CountryInfo_Content_desc.2: "Упродовж 1950-х років союз між §Gпрем'єр-міністром Салазаром§! та §Yкаудильйо Франко§! поступово міцнів, а разом із ним зростала впевненість у життєздатності нового іберійського режиму. Виникали й усталювалися державні установи, спільними ставали як інтереси, так і витрати. Хоча це вимагало наполегливої праці, молода держава поступово набувала власного обличчя, переходячи від автаркії до дирижизму в прагненні до більшого добробуту. Відмовляючись від тісних зв'язків як з §iАмерикою§!, так і з §.Райхом§!, §nІберій§!§Oський союз§! намагався вибороти власне місце на світовій арені.\n\nУ коридорах іберійської влади все могло б видаватися благополучним, якби не §Kпереворот в Албуфейрі§!. Змовники під проводом §nУмберту Делґаду§! прагнули розвалити Іберійський союз і будь-якою ціною повернути Португалії незалежність. Однак після викриття змова лише дала консерваторам привід зміцнити свою владу низкою репресій, водночас поглибивши недовіру між португальськими та іспанськими політичними угрупованнями Союзу."
 IBR_CountryInfo_Content.3: "Стан Союзу"
 IBR_CountryInfo_Content_desc.3: "Хоч нова держава постала зовсім недавно, давні проблеми Іспанії та Португалії нікуди не зникли, кинувши свою тінь на весь §nСо§!§Oюз§!. Упродовж 1950-х років економічна політика дедалі більше розчаровувала, а попри всі спроби виправити становище країну поступово охоплював застій. Панівні §bконсерватори§! марно шукали виходу: кожен новий захід не виправдовував сподівань. Тим часом у владних колах формувалися угруповання, які змагалися за вплив на відродження держави, прагнучи заручитися підтримкою прискіпливого §nСалазара§! або пильного §YФранко§!.\n\nТа §fкаудильйо§! старіють. Щомісяця надходять нові звістки про погіршення їхнього здоров'я. За відсутности планів передачі влади та в умовах §nрозко§!§Oлотого§! політичного апарату владні кола об'єднують лише два переконання: відданість §fкаудильйо§! та усвідомлення необхідности рухатися далі без них. Усі розуміють, що §wІберія§! стоїть на порозі потрясінь, коли має вирішитися сама її доля. Адже §nСо§!§Oюз§!, як переконані в §GЛісабоні§! та §YМадриді§!, переживе своїх засновників."
 IBR_CountryInfo_Content.4: "Імперія, що тріщить"
 IBR_CountryInfo_Content_desc.4: "Імперія тріщить під натиском дедалі потужнішої хвилі повстань і чужоземних зазіхань. §nСо§!§Oюз§! невпинно пильнує свої володіння, відчайдушно намагаючись утримати колоніяльну спадщину. Від §wҐвінеї§!-§nБісау§! до §MЕкваторіяльної§! §WҐвінеї§! жевріють прагнення незалежности. Чимало земель §nСо§!§Oюзу§! на південь від Сахари потрапили в замкнене коло: що інтенсивніше тривають безжальне видобування ресурсів і колонізаційні заходи, то більшої військової присутности потребує влада, щоб утримувати їх під контролем.\n\n§,Марокко§! - §Kперлина§! в імперській короні, колоніяльний трофей, здобутий наприкінці Другої світової війни. Та ця §Kперлина§! поступово втрачає свій блиск. Терпіння §sХасана II§! не безмежне, а протекторатний статус королівства раз у раз спричиняє суперечки між ним і §YМадридом§!. Наразі він стримує націоналістів у §,марокканській§! політиці, проте ті діють дедалі сміливіше. §wІберія§! зважує свої можливості, розуміючи, що нинішнє становище довго не протримається: якщо §sкороль§! утратить відданість Союзові або контроль над ситуацією, пси війни можуть знову накинутися на останнє африканське завоювання §wІберії§!."
 IBR_CountryInfo_Content.5: "Гіспанія за морями"
 IBR_CountryInfo_Content_desc.5: "Хоча впродовж останнього десятиліття §wІберія§! прагнула налагодити зв'язки в Середземномор'ї, головну увагу вона спрямовувала на §aЗахід§! і §wПівдень§!. По всій §wЛатинській Америці§! §wіберійські§! дипломати налагоджують дедалі тісніші відносини, неабияк дратуючи §KМехіко§!. Особливу увагу приділяють §iДомініканській§! §xРеспубліці§! та політичним угрупованням у §YКолумбії§!, перед якими §wІберія§! старанно намагається постати надійним партнером, прихильником і другом. Ідея §Oіспаномовного§! політичного блоку неабияк приваблює можновладців у §YМадриді§!.\n\nУ §wПівденній Америці§! Союз зберігає нейтралітет у протистоянні між §KБразилією§! та §MАрґентиною§!, підтримуючи дружні стосунки з обома державами. В Африці §wіберійські§! дипломати, місіонери й експедиції діють по всьому континенту, вихваляючи §wіберійську§! цивілізаторську місію та запевняючи у відданості як европейським імперіям, так і колоніяльним підданим під їхньою владою. Легітимність - ось жаданий нектар для §wІберії§! на Чорному континенті: вона прагне зберегти свої законні володіння, поки темрява підступає дедалі ближче."

 # SOUTH AFRICA
 SAF_CountryInfo_Folder.101: "Хаос на мисі"

 SAF_CountryInfo_Content.1: "Південний парадокс"
 SAF_CountryInfo_Content_desc.1: "Озер в Африці небагато, островів іще менше, та між §Rрайхскомісаріятами§! §RГюттіґа§! й §RШенка§! та яскравим вогнем, що палає на південному краю континенту, наче простяглося ціле море. Загнаний у глухий кут, §WДомініон Південної Африки§! змушений обережно балансувати на тонкому канаті міжнародної дипломатії, проголошуючи ідеали свободи перед §GВашинґтоном§! та пошепки обіцяючи §RРайху§! расову вищість і сеґреґацію.\n\nТак триває від самого завершення Другої світової війни. Ті, хто стверджує, ніби бойові дії в Південній Африці припинилися 1945 року, або глибоко помиляються, або мислять суто юридичними категоріями. Адже боротьба за Південну Африку не вщухає ані за її межами, ані всередині країни. Становище ускладнює й те, що сама Південна Африка - суцільний парадокс."

 SAF_CountryInfo_Content.2: "Нескінченні суперечки"
 SAF_CountryInfo_Content_desc.2: "Південна Африка - домініон без монарха, де меншість править більшістю. §WПрем'єр-міністр де Віллірс Ґрааф§! обережно зіштовхує своїх супротивників між собою, намагаючись зберегти хитку рівновагу, встановлену його Об'єднаною партією. Та за цю стабільність доводиться платити. Щоб утримати §Rнімців§! на північ від Лімпопо, §WПівденна Африка§! не може повною мірою втілити ідеали свободи, які демонструє §Gамериканцям§!. Престол §WПівденної Африки§! стоїть порожній, укритий пилом: домініон лише за назвою, але аж ніяк не республіка.\n\nПо інший бік політичних барикад лунають полум'яні промови §RАльберта Герцоґа§!, що привертають бурів до Національної партії, яка обстоює співпрацю з §RРайхом§! і панування білих §Wпівденноафриканців§! над чорним населенням. Проте й ця партія має супротивників: Африканський національний конґрес невтомно бореться за право бути почутим - як у переносному, так і в буквальному значенні, - адже його голос придушували від самого постання Південної Африки."

 SAF_CountryInfo_Content.3: "Прийдешнє роздоріжжя"
 SAF_CountryInfo_Content_desc.3: "У містах пригноблені виходять на спільні демонстрації, вимагаючи покласти край розколу континенту. Тим часом із віддалених застав, що пильнують кордони з §Rрайхскомісаріятами§!, надходять тривожні звістки про спалені села й винищені родини, що стали жертвами боротьби між партизанськими загонами та §RНімецькою африканською армією§!. §WДомініон§! і справді змушений балансувати на тонкому канаті, обережно намагаючись догодити всім сторонам.\n\nПеред країною постає чимало непростих рішень. Вона може скористатися багатствами, виявленими компанією «Де Бірс», і обернути видобуток §Wалмазів§! собі на користь. Їй доведеться шукати рівноваги між чужоземним §Wвпливом§! та економічною вигодою, намагаючись підтримувати торгівлю з §RПактом§!. А ще необхідно забезпечити бажаний результат майбутніх §Wвиборів§!, адже хоч би яким він був, Південну Африку неминуче чекають потрясіння. Конфлікт на мисі дедалі виразніше здається невідворотним. §WПрем'єр-міністр де Віллірс Ґрааф§! мусить утримати країну на вузькому шляху, адже якщо §WПівденна Африка§! зірветься з каната, одному Богові відомо, куди вона впаде."

 # Britain RULES THE WAVES

 ENG_CountryInfo_Folder.101: "Безпросвітний острів"
 ENG_CountryInfo_Folder.102: "Личина цивілізації"

 ENG_CountryInfo_Content.1: "Кінець мрії"
 ENG_CountryInfo_Content_desc.1: "3 вересня 1939 року §RСполучене Королівство§! та §QФранцузька Республіка§! оголосили війну §sТретьому Німецькому Райху§! у відповідь на його незаконне вторгнення до §SПольщі§!. §sНімці§! рушили через країни Бенілюксу, обійшовши оборонні укріплення §QФранції§!. Після провалу евакуації з Дюнкерка §RБританія§! зазнала нових поразок у Греції, Ґібралтарі та Єгипті.\n\nНавіть вступ §iСполучених Штатів§! у війну майже не змінив становища на користь §BСоюзників§!. §LЯпонія§! тим часом завойовувала Південно-Східну Азію, а §eБританська Індія§! опинилася на порозі повномасштабного повстання проти §Rбританського§! панування.\n\nУтім, невдовзі з'явився й промінь надії: спільне §Rбритансько§!-§iамериканське§! вторгнення до Марокко увінчалося великим успіхом. Відтак §BСоюзники§! зосередили свої зусилля на Північній Африці. На початку 1943 року вони розпочали §Gоперацію «Маркет-Ґарден»§!, яка завершилася вирішальною перемогою §BСоюзників§!. Та хоч ця перемога була §BСоюзникам§! украй потрібна, її наслідки виявилися недовговічними..."

 ENG_CountryInfo_Content.2: "Коли пекло постукало у двері"
 ENG_CountryInfo_Content_desc.2: "У березні 1943 року на Британські острови вторгся §sВеликоґерманський Райх§!. Оскільки основні сили оборонців були зосереджені в Північній Африці, §sнімці§! ледь не парадним кроком просувалися країною, майже не зустрічаючи опору, аж доки не захопили всю §RБританію§!. Їхній наступ зупинився лише на підступах до §nПівнічної Ірляндії§!, яку боронили об'єднані сили військових різних національностей. §RБританці§!, §iамериканці§!, §Gбразильці§!, §Dуруґвайці§! та багато інших стали на захист §nПівнічної Ірляндії§!. Деякі воєнні кореспонденти навіть охрестили ці події «§mВеликою обороною вільних націй§!».\n\nТа хоч як старалися §mСоюзники§!, вони втратили останній плацдарм для боротьби проти §sнацистів§! у Европі, і воєнні зусилля невдовзі зазнали краху. Успіхи §G«Маркет-Ґарден»§! майже миттєво звели нанівець §sнімці§! та §Kіталійці§!, скориставшись перевагою своїх об'єднаних сил.\n\nТак згасла остання надія на перемогу §mСоюзників§! у війні. Перед ворогом вистояли лише залишки роз'єднаної §RСпівдружности§! та §iСполучені Штати§!."

 ENG_CountryInfo_Content.3: "Народження нового порядку"
 ENG_CountryInfo_Content_desc.3: "Після підписання §RЛондонського договору§! §sГітлер§! вирішив, що §RБританія§! може зберегти статус «вільної держави», але лише під опікою §sНімеччини§!. На посаду прем'єр-міністра в перші повоєнні роки §sнімці§! призначили самого колишнього очільника уряду §sДевіда Ллойда Джорджа§!. Утім, він помер, не пробувши на посаді й року.\n\nНевдовзі його наступником став §oГестінґс Русселл, герцог Бедфордський§!, який домігся номінальної політичної самостійности §oБританської народної партії§!. Цю новостворену організацію §oгерцог§! перебудував після усунення попереднього керівника, §oДжона Беккета§!, через його нібито §mєврейське§! походження. Тим часом із численної §mєврейської§! меншини Британії понад §R300 000§! осіб силоміць забрали з домівок і депортували до §sРайху§!. Відтоді жодних звісток про їхню долю не надходило.\n\nКайдани нового порядку для Британії поступово кувалися, але, як виявилося, розірвати їх було не так уже й важко..."

 ENG_CountryInfo_Content.4: "Повстання 56-го"
 ENG_CountryInfo_Content_desc.4: "Під покровом цього непевного миру, після відставки §sгерцога Бедфордського§! 1953 року та приходу до влади затятого фашиста §oА. К. Честертона§!, у §Rбританській§! політичній системі почали з'являтися справжні тріщини. А хаос §VЗахідноросійської війни§! надав §eОпорові§! нагоду завдати удару.\n\nНа чолі руху стояв колишній командувач §Rбританської САС§! §sДевід Стірлінґ§!, який таємно повернувся до країни. Проте §mчас спливав§!: §sНімеччина§! швидко відновлювала свої сили, тож §sСтірлінґ§! мусив діяти негайно, якщо хотів повалити §oуряд§!. Наприкінці 1956 року він закликав до загального повстання проти уряду §oЧестертона§!.\n\nПісля низки кривавих вуличних боїв, у яких під час §Vжорстоких§! зіткнень загинули сотні людей, повстання §sСтірлінґа§! зазнало поразки. Разом із ним було розгромлено й загони §eкомуністичного§! партизана §eБілла Александера§!. Обох провідників схопили й віддали під суд. Кожен процес тривав менш ніж п'ятнадцять хвилин, після чого засуджених негайно стратили."

 ENG_CountryInfo_Content.5: "Уряд Домвіля"
 ENG_CountryInfo_Content_desc.5: "Після §Vкривавої бійні 56-го§! прихильники прем'єр-міністра §oЧестертона§! почали масово переходити на бік його найзапеклішого критика, Ендрю Фонтейна. Змушений подати у відставку, Честертон усе ж зумів разом із лордом Бедфордським забезпечити прем'єрське крісло їхньому спільному другові й довіреній особі, адміралові §jБеррі Домвілю§!, давньому представникові §jстарої фашистської гвардії§!.\n\nЗа правління §jДомвіля§! внутрішнє становище §RБританії§! стабілізувалося, відкривши можливості для розквіту §Gекономіки§!. Під пильним наглядом §lнімецьких корпорацій§! §RБританія§! вступила в 1960-ті роки з темпами §Gзростання§!, яких країна не знала ще з довоєнних часів.\n\nТа під тонкою оболонкою того, що нині називають «§RБританією§!», приховується похмура дійсність. Діяльність §eОпору§! знову поступово набирає сили, а §sБританська народна партія§! розкололася на три непримиренні табори: §sдемократичних прагматиків§!, §oреволюційних ідеологів§! та §jконсервативну стару гвардію§!."

 ENG_CountryInfo_Content.6: "Останній зі старої Англії"
 ENG_CountryInfo_Content_desc.6: "§sРічард Остін «Реб» Батлер§! стоїть осібно в уряді §jДомвіля§! з однієї простої причини: його наміри відрізняються від прагнень решти міністрів. Поки §jДомвіль§!, §oФонтейн§! та їхні однодумці вихваляють народження нової Британії з попелу занепаду, §sБатлер§! вбачає своє покликання в тому, щоб загоїти рани країни й повернути їй спокій.\n\nДо його §sфракції§! у §jБНП§!, відомої як «§sпрагматики§!», входить чимало §Gполітиків молодшого покоління§!, кожен із яких по-своєму розуміє, що означає §sБатлерове§! уявлення про «§Mдемократію§!». Серед них і перспективний міністр §sРеджинальд Модлінґ§!, прихильник Батлера, готовий забруднити руки співпрацею з §sнімцями§!, аби здобути перевагу над своїми §oсупротивниками§!.\n\nЩе одна впливова постать в оточенні §sБатлера§! - міністр §RГерольд Вільсон§!, досвідчений державний службовець і один із перших співавторів §Rдоповіді Беверіджа§!, підготовленої під час війни. §RВільсон§! прагне реформувати §jБНП§!, перетворивши її на урядову силу, віддану §Pдобробуту§! та §Gздоров'ю§! британського народу."

 ENG_CountryInfo_Content.7: "Полум'я фашизму"
 ENG_CountryInfo_Content_desc.7: "§RВійна§! та страта §oсера Освальда Мослі§! майже не похитнули позицій §oфашизму§! в Британії, поки §sнімецькі§! поневолювачі простягали свої щупальця до островів. На відміну від суперників зі старої гвардії, §oЕндрю Фонтейн§! вбачає у фашизмі полум'я, що здіймається знизу й має випалити все старе, залишивши по собі §Rочищене майбутнє§!. Ця ідея однаковою мірою захоплює його прихильників і жахає супротивників.\n\n§oФонтейн§! та його прибічники очолюють фракцію §sБНП§!, відому як «§oідеологи§!». Вони прагнуть створити значно §Rреволюційнішу§! фашистську державу, ніж та, яку донині будували §oЧестертон§! і §jДомвіль§!. Перед союзниками та ворогами §oФонтейн§! постає втіленням непохитної сили й єдности, однак за зачиненими дверима §oідеологи§! так само §Vрозколоті§!, як і решта партії.\n\nНовопризначені міністри §oДжеффрі Гемм§! та §rДжон Бін§! мають власні §Rреволюційні§! уявлення про те, як мають працювати державні органи §oфашистського острова§!. Їхнє протистояння загрожує раз і назавжди загасити §oбританське полум'я§!..."

 ENG_CountryInfo_Content.8: "Хранителі старого"
 ENG_CountryInfo_Content_desc.8: "Від самого зародження §sпронімецьких§!, а згодом і §sколябораціоністських§! угруповань у Британії ними керувала §jстара гвардія§!, і §jБританська народна партія§! не стала винятком. Даунінґ-стріт залишається в її руках ще від часів герцога Бедфордського, а нині владу там утримує прем'єр-міністр Домвіль.\n\nЯк творці §jбританського фашизму§!, представники старої гвардії обстоюють управління згори, за якого фашизм покликаний захищати й оберігати старі порядки. І хоча їхні лави в Палаті громад можуть рідшати, вплив на Палату лордів залишається міцним. Саме там зосереджені найвідданіші союзники §jДомвіля§!.\n\nСеред них §jлорд Тавісток§! та §oА. К. Честертон§!, а також їхній давній соратник §sДжерард Воллоп, граф Портсмутський§!, якого багато хто вважає наступником Домвіля. Утім, сам Воллоп вирізняється з-поміж решти як провідник §nорганіцистського руху§! - невеликої течії §sприхильників відродження сільських традицій та абсолютизму§!. Час покаже, чи §jстара гвардія§! залишиться вірною своїм нинішнім поглядам, чи візьметься відроджувати давні порядки."

 ENG_CountryInfo_Content.9: "Опір"
 ENG_CountryInfo_Content_desc.9: "На противагу §oколябораціоністам§! постала нова організація. Чимало британських підданих відмовляються визнавати владу §sкороля Едварда§! та маріонеткового уряду §sҐерманії§!. Саме так виник §RНайвідданіший Опір Її Величності§!, або скорочено §RНОЇВ§!.\n\nПідтримуючи зв'язки з §mОрганізацією вільних націй§! у Канаді, підпільники намагаються підірвати владу колябораціоністського уряду. Керівництво §RНОЇВ§! поділене між двома головними фракціями: §sКОСО§! та §VОФЛО§!.\n\n§sКОСО§! створили ще під час війни як організацію, покликану вести шпигунство, розвідку та здійснювати зухвалі операції. Тепер його мета - визволити §RБританію§! й повернути на престол §sзаконного монарха§!. Натомість §VОФЛО§! утворився після хаосу повстання 56-го. Його головне завдання - звільнити §Vробітничий клас§! з-під чобота §lнімецьких корпорацій§!. На чолі фронту стоїть об'єднання §Vлівих§! організацій під проводом загартованого війною соціяліста §VДжека Джонса§!."

 ENG_CountryInfo_Content.10: "Вигнанці"
 ENG_CountryInfo_Content_desc.10: "Відступ із Британії відбувався в цілковитому хаосі. Ті, хто залишився на островах, досі згадують про «§Vсписок§!», який визначав, кому дозволено виїхати, а кому доведеться залишитися. До цього «§Vсписку§!» потрапила більшість членів §sвоєнного кабінету§! §iВінстона Черчилля§!, зокрема майбутні прем'єр-міністри §RГерберт Моррісон§! та §BГарольд Макміллан§!.\n\nСеред тих, хто опинився у списку, було й чимало людей, яким пощастило заручитися заступництвом §Vлорда Бівербрука§!. Одним із них став нинішній §Rлідер опозиції§! §VМайкл Фут§!. В §LОттаві§! вигнанці вже §M17 років§! живуть, немов відірвані від світу, а думка про те, що їм, можливо, ніколи більше не судилося ступити на рідну землю, сповнює уряд глибокою зневірою.\n\nХтось виступає за §Bкоролеву й країну§!, хтось - за §Vголос народу§!, та нинішні партійні лідери, §BМакміллан§! і §VФут§!, у своїх політичних таборах набули майже мітологічного статусу. §GВигнанці§! навряд чи могли б довірити своє майбутнє надійнішим рукам. Якщо, звісно, у них іще залишилася надія..."

  # ENGLAND RULES THE WAVES

 OLD_ENG_CountryInfo_Folder.101: "Підкорена Британія"
 OLD_ENG_CountryInfo_Folder.102: "Прийдешня буря"

 OLD_ENG_CountryInfo_Content.1: "Буря наближається"
 OLD_ENG_CountryInfo_Content_desc.1: "Колись §VБританія§! була не просто географічною назвою. Вона була державою, яка не лише виживала, а й процвітала. Її імперія, що навіть через багато років не мала рівних за розмірами, простягалася від похмурих пустель §fАвстралії§! до сповнених життя незвіданих просторів §nКенії§!, і всюди майорів британський прапор. Та з Британією сталося те, що рано чи пізно спіткає кожну імперію. §xВона впала§!.\n\nЖахіття Першої світової війни глибоко закарбувалися в серцях британців. І народ, і уряд заприсяглися: ніколи знову. Обравши політику умиротворення, вони відвернулися від континентальної Европи, залишивши її напризволяще. «Навіщо помирати за Данціґ?» - запитували вони. І лише коли §eВійна§! та інші провісники Апокаліпсису постали на порозі Британії, англійці усвідомили свою помилку."

 OLD_ENG_CountryInfo_Content.2: "Вони назвали це «Морським левом»"
 OLD_ENG_CountryInfo_Content_desc.2: "До 1940 року Британія залишилася сам на сам із ворогом. §eПольщу§! розгромили й піддали всім жорстокостям, на які тільки був здатний Гітлер. §lФранція§!, що так пишалася своїми укріпленнями та військовими планами, швидко впала під невпинним натиском вермахту, який обійшов її оборону. Хоч британським військам і вдалося уникнути цілковитого знищення під Дюнкерком, цього було замало для порятунку країни.\n\nНа світанку найбільший десантний флот в історії висадив війська на узбережжі Кенту й Сассексу. Операція під кодовою назвою §R«Морський лев»§! мала змусити Сполучене Королівство до беззастережної капітуляції, здійснивши те, чого не вдавалося майже тисячу років: успішне вороже вторгнення з моря та підкорення Британії. Однак невдовзі німці переконалися, що §xсказати це значно легше, ніж зробити§!."

 OLD_ENG_CountryInfo_Content.3: "Кінець імперії"
 OLD_ENG_CountryInfo_Content_desc.3: "Британська армія билася, мов §Oзагнаний у кут лис§!. Не було ані хитромудрих маневрів, ані геніяльного плану, що забезпечив би одній зі сторін вирішальну перемогу, ані героїчного рейду відчайдухів, здатного переломити хід війни. Бої в Британії стали зіткненням двох наддержав, які змагалися за §Vсвітове панування§!. Села перетворювалися на всіяні трупами укріплення, містечка - на могили для військ обох сторін, а великі міста - на справжні бойні, де §xмертвих незмінно було більше, ніж живих§!.\n\nНавіть після офіційного вступу Америки у війну та висадки її військ у Британії вермахт просувався вперед дюйм за дюймом. Упав §VЛондон§!, за ним §EБірмінґем§!, а тоді й §hМанчестер§!. Німці вже готувалися захопити весь острів, вважаючи перемогу неминучою. Та коли залишки британської армії та американські війська дивом відкинули їх до шотландського кордону, ці сподівання розвіялися. І все ж §eАнглію було втрачено§!."

 OLD_ENG_CountryInfo_Content.4: "Те, що лишилося"
 OLD_ENG_CountryInfo_Content_desc.4: "Британський уряд капітулював, а члени §Qвоєнного кабінету§! втекли до §RКанади§! або §lАмерики§!, сподіваючись дочекатися нагоди повернути собі законні володіння. Тим часом в Англії ті, кого не схопили, не відправили до таборів і не стратили, неохоче взялися формувати тимчасовий уряд під проводом §lлорда Луїса Маунтбеттена§!. Та далеко не всі британці змирилися з новим порядком, установленим на островах.\n\nТі, хто не втік, не здався й залишився живим, подалися в підпілля або сховалися в сільській місцевості. У покинутих тунелях метро, спорожнілих бункерах і затишних бухтах над туманними берегами Британії причаїлися невеликі гурти втікачів. Вони поки що не наважуються діяти відкрито, проте рух Опору вже стежить із тіні за кожним кроком своїх гнобителів..."

 OLD_ENG_CountryInfo_Content.5: "Біла ворона"
 OLD_ENG_CountryInfo_Content_desc.5: "На відміну від §qрайхскомісаріятів§!, які де-юре є провінціями Гітлерового Райху й підлягають повній інтеграції, або §lФранції§!, що зберігає номінальну незалежність, перебуваючи на короткому німецькому повідку, становище Англії дещо інше. Тут досі зберігається видимість довоєнної демократії: країна має власний парламент і монархію на чолі з §Eкоролем Едвардом VIII§!, якого 1936 року змусили зректися престолу. Тепер він особисто визначає склад нового уряду, а не просто затверджує його.\n\nТака відносна поблажливість пояснюється радше практичними міркуваннями, ніж спорідненістю германських народів. Те, що парламент і досі переповнений §Yлібералами§! та §Mстарими торі§!, які колись виступали проти нацизму, стало можливим завдяки послабленню німецького контролю над Східною Европою. Райхові доводиться оберігати своє найцінніше володіння в Західній Европі, щоб Америка та британські вигнанці в Канаді не захопили його й не створили загрози німецькому пануванню на континенті."

 OLD_ENG_CountryInfo_Content.6: "Люди короля"
 OLD_ENG_CountryInfo_Content_desc.6: "§EЕдвард VIII§!, мабуть, один із небагатьох монархів в історії, кому довелося зійти на престол двічі. Уперше він став королем 20 січня після смерти свого батька, §hГеорга V§!, однак його правління обернулося катастрофою. Уряд погрожував піти у відставку, якщо Едвард не відмовиться від наміру одружитися з американською світською дамою §pВолліс Сімпсон§!. Зрештою, у грудні 1936 року король був змушений зректися престолу. Його репутацію ще більше підірвали звинувачення в захопленні Гітлером, а присутність німецьких військ в Англії аж ніяк не сприяла її відновленню. Коли решта §wкоролівської родини§! втекла з країни, Едварда офіційно повернули на англійський престол. Проте сподівання побачити в ньому відданого й гордого монарха майже відразу розбилися об дійсність: короля ненавиділи всі. Приречений на самотнє існування в §mБукінґемському палаці§!, Едвард лише спостерігає за подіями, не знаючи, коли настане його кінець: від старости чи від руки §Rвбивці§!."

 OLD_ENG_CountryInfo_Content.7: "Честь Макміллана"
 OLD_ENG_CountryInfo_Content_desc.7: "Хоча прем'єр-міністром є §jАлек Дуґлас-Г'юм§!, одним із найвпливовіших політиків Англії залишається §oГарольд Макміллан§!. Формально належачи до §lКоролівської партії§!, він фактично очолює власне угруповання, яке прагне реформувати країну зсередини. Макмілланові огидно бачити, як англійська демократія виродилася у фактичну §xоднопартійну диктатуру§!, що плазує під німецьким чоботом.\n\nЯкщо Макміллан прийде до влади, він присвятить себе поверненню Англії справжньої свободи, і начхати йому на Ґерманію. Ба більше, він прагне очистити країну від продажних фашистів-підлабузників із Національного фронту, які хочуть принести нацизм до Білих скель і назавжди заразити Англію §rвірусом, що вже охопив значну частину§! Европи. Макмілланові потрібні лише час і слушна мить, коли його вороги припустяться помилки..."

 OLD_ENG_CountryInfo_Content.8: "Свобода Модлінґа"
 OLD_ENG_CountryInfo_Content_desc.8: "Однак деякі реформісти йдуть навіть далі за Макміллана. §zМодлінґ§! вважає, що майже макіявеллівські методи, якими Макміллан прагне викорінити §jфашизм§! і повернути Англії свободу, неминуче приведуть до диктатури й тиранії, навіть якщо застосовувати їх в ім'я миру та чести.\n\nМодлінґ переконаний, що Англія ще не настільки занепала, аби потребувати власного §oСулли чи Цезаря§!, який очистив би державу від накопиченої гнилизни. Країна здатна повернутися до демократії, скинувши тягар як Королівської партії, так і §jНаціонального фронту§!, та рушити до майбутнього, у якому знову зможе гордо дивитися за обрій як вільна держава."

 OLD_ENG_CountryInfo_Content.9: "НОЇВ"
 OLD_ENG_CountryInfo_Content_desc.9: "Чи не найбільша іронія полягає в тому, що лише за тридцять років Британія перетворилася з держави, яка чи не найзавзятіше займалася §xпридушенням§! сепаратизму, на країну, що тепер сама найактивніше бере в ньому §yучасть§!. В Англії §BНайвідданіший Опір Її Величности§! об\'єднує численні, подекуди зовсім не схожі між собою осередки спротиву, серед яких, попри назву організації, є навіть республіканці.\n\nЦей таємничий рух, що складається переважно з двох фракцій, для більшости людей залишається не більше ніж міською легендою. Подібно до переказів про §wкороля Артура§!, розповіді про нього передають від одного змученого англійця до іншого, щоб підтримати віру в неминуче визволення від німців. Діючи з тіні, бійці §BОпору§! завдають ударів по будь-яких вразливих цілях і зникають у темряві. Їхні напади стають дедалі частішими й масштабнішими. Здається, легендарний день Визволення - лише питання часу..."

 OLD_ENG_CountryInfo_Content.10: "Берлін-на-Плімі"
 OLD_ENG_CountryInfo_Content_desc.10: "Німеччина чудово усвідомлює нестабільність свого маріонеткового режиму. У Берліні прекрасно розуміють, що ані §lколябораціоністи§!, ані члени §BНОЇВ§! не плекають особливої прихильности до нацистської влади. А ті нечисленні її прибічники, як-от §oЧестертон та його весела зграя божевільних із Національного фронту§!, настільки некомпетентні, що їх годі навіть розглядати як можливу заміну чинному урядові. Саме тому Плімут перетворили на величезний військовий осередок вермахту на Британських островах. Під командуванням §EФранца Зікса§! колишнє курортне місто знову стало осередком відпочинку, цього разу для родин німецьких офіцерів, які відправляють сюди своїх дітей подалі від небезпеки. Якщо Англія колись справді звільниться від німецького панування, гарнізон має виступити проти неї й придушити будь-який спротив. Озброєні найсучаснішою зброєю війська стануть справжньою §xкатастрофою§! для будь-якого руху Опору, що лише починає набирати сили."


# SVERDLOVSK

 SVR_CountryInfo_Folder.101: "Держава з армією чи...?"
 SVR_CountryInfo_Folder.102: "Вітер у Сибіру дме на захід"

 SVR_CountryInfo_Content.1: "Шлях на схід"
 SVR_CountryInfo_Content_desc.1: "§RСвєрдловск§!, як і безліч інших дрібних держав у російській глушині, - це не справжня держава. Це §gукріплений військовий табір§!, населений тими, кому вдалося пережити німецький наступ. Для Свєрдловска таким прихистком стали останні позиції §Vсовєцької Третьої армії§!. Об\'єднавшись із Лазарем Каґановічем та його прибічниками, вцілілі заснували Західносибірську народну республіку, намагаючись зберегти бодай подобу державної влади в СССР, що стрімко розвалювався. Та останню спробу втримати в Росії полум\'я §Rкомуністичної§! ідеї було придушено з неймовірною жорстокістю.\n\nНе вдовольнившись своїми завоюваннями, нацисти розпочали §xнайсмертоноснішу кампанію повітряних бомбардувань§! за всю історію. Намагаючись зламати дух російського народу, люфтваффе раз у раз відправляли літаки в глиб російських земель, вишукуючи будь-які ознаки цивілізації. Та зрештою терпець урвався."

 SVR_CountryInfo_Content.2: "Власний шлях"
 SVR_CountryInfo_Content_desc.2: "§xЗагинули тисячі людей.§! Колони біженців перетворювалися на стихійні братські могили, міста - на суцільні побоїща, а цілі поселення зникали з лиця землі під залізною бурею люфтваффе. Коли Західний Сибір поринув у цілковиту анархію, Третя армія вирішила взяти долю у власні руки. Відокремившись від володінь Каґановіча, маршал §eКонстантін Рокоссовскій§! установив власну владу з центром у Свєрдловску, одному з найпотужніших промислових осередків регіону. Було створено тимчасовий уряд, а залишки військового спорядження спрямували на захист населення від найтяжчих лих, принесених тевтонськими загарбниками.\n\nХоч німці й далі засипають ці землі бомбами, одного дня небо над Росією §Dзнову стане вільним§!. І коли цей день настане, Свєрдловск повстане з руїн разом із вільною, дисциплінованою Росією.\n\nІ тоді німці §Vнавіть не встигнуть збагнути, що на них чекає.§!"

 SVR_CountryInfo_Content.3: "Правління маршала"
 SVR_CountryInfo_Content_desc.3: "Свєрдловск радше нагадує §gфактичну військову диктатуру§!, ніж повноцінну державу з власною ідеологією та усталеним способом урядування. У ньому майже немає виразних ідеологічних переконань, а його існування тримається переважно на двох чинниках. Перший - повсюдна присутність §VТретьої армії§! як у повсякденному житті, так і в політиці. Цивільної адміністрації тут немає, а всі наявні ресурси за будь-яку ціну спрямовують на утримання військового гарнізону.\n\nДругий чинник полягає в тому, що промисловість Свєрдловска здебільшого залишилася §Kнеушкодженою§! після терористичних бомбардувань. Завдяки її стійкості місто стало осередком цивілізованого життя й відносного добробуту серед спустошених земель Західного Сибіру. За таких обставин населення охоче заплющує очі на відверто некомуністичний характер місцевої влади й підтримує правління §zмаршала.§!"

 SVR_CountryInfo_Content.4: "Найважчий вибір"
 SVR_CountryInfo_Content_desc.4: "Нині це вже ні для кого не таємниця. §VМаршал Рокоссовскій§! тяжко хворіє, а похилий вік лише ускладнює боротьбу з недугою. Хоч ніхто й не наважується говорити про це вголос, рано чи пізно на чолі Свєрдловска стане новий маршал. Найімовірнішим наступником є порівняно молодий командувач §PПавєл Батов§!, однак зберегти військове правління буде зовсім іншим завданням. Окрім загрози з боку інших воєначальників, дедалі частіше ширяться чутки про противників режиму, які прагнуть цілковитої демократизації.\n\nПід неформальним проводом §MБоріса Єльцина§! вони мріють про сильну, але вільну Росію, державу, яка служитиме народові й належатиме йому. Поки що ці люди залишаються в тіні. Та рано чи пізно вони заявлять про себе, і тоді країні доведеться вирішити, яким шляхом рушити далі."

 SVR_CountryInfo_Content.5: "Найгустіша пітьма"
 SVR_CountryInfo_Content_desc.5: "На південному заході лютує пошесть, що винищує наш народ. Вона поширюється непомітно й забирає життя без жодного попередження. Ім\'я цій пошесті - §sЧорна ліга Омска§!. Ненависть і жага помсти настільки просякли її існування, що вся держава перетворилася на майже фашистське страховисько, яке прагне здійснити ретельно сплановану помсту кожному німцеві, кожній жінці та дитині. Хоч ми теж прагнемо знищення нацистів, наша боротьба спрямована §wне проти жінок і дітей§! Німеччини, а проти §oідеології§!, яку вони проповідують.\n\nБа більше, ця пошесть уже проникла й до нас. Омські аґенти безперешкодно діють у лавах нашої армії, доповідаючи безпосередньо Карбишеву та Язову про кожен наш крок. Якщо ми не приборкаємо їхнього впливу, то й самі залишимося лише черговою приміткою в §Rскорботній історії Росії.§!"

# WALES

 WAL_CountryInfo_Folder.101: "Вельс сьогодні"
 WAL_CountryInfo_Folder.102: "Вельс завтра"

 WAL_CountryInfo_Content.1: "Незалежний Вельс"
 WAL_CountryInfo_Content_desc.1: "Невдовзі після того, як §gнімецькі§! орди висадилися на південному узбережжі §eАнглії§!, група §Gваллійських§! націоналістів поспіхом проголосила незалежність від §eСполученого Королівства§!. Це була відчайдушна спроба зберегти бодай частку тієї свободи, яку сусідня країна неминуче мала втратити під окупацією.\n\n§gНімецький Райх§!, виснажений завоюванням і підкоренням §zанглійців§!, визнав незалежність нової республіки. Однак §Gваллійська§! свобода дісталася дорогою ціною. За угодою з §gнімцями§! §Gваллійський§! уряд мусить відправляти значну частину видобутого вугілля до §gРайху§!. За виконанням цієї умови пильнує гарнізон у сусідньому §gКорнволлі§!, і загроза німецького втручання залишається донині."

 WAL_CountryInfo_Content.2: "Ті, хто при владі"
 WAL_CountryInfo_Content_desc.2: "Нині цей тягар випав на долю §LСондерса Льюїса§!, який очолює республіку разом зі своїм заступником §LҐвінвором Евансом§!. Проте їхній численний націоналістичний блок дедалі більше потерпає від внутрішніх чвар, які, якщо їх не припинити, можуть призвести до падіння уряду за першої ж серйозної невдачі. Між двома головними партіями, §xCymru Goch§! та §LPlaid Cymru§!, уже пролягла тріщина: перша представляє ліве крило, друга - праве. До того ж у коаліції є значно непоступливіша сила - §jАрмія вільного Вельсу§!, яка рішуче виступає проти будь-яких урядових кроків, здатних, на її переконання, поставити під загрозу існування Республіки."

 WAL_CountryInfo_Content.3: "Незалежний Вельс"
 WAL_CountryInfo_Content_desc.3: "Чимало людей підозрюють, що §jАВВ§! має значно ширші зв’язки, ніж готове визнати її керівництво, і ці підозри небезпідставні. Очільник організації, §jДжуліан Кайо-Еванс§!, керує найбільшим і найстрашнішим воєнізованим угрупованням §GВельсу§!. Його прибічники вважають себе справжніми захисниками валлійського народу та його культури й готові покласти край будь-яким §eанглійським§! зазіханням, вдаючись до дедалі безжальніших методів.\n\nТа всі їхні зусилля можуть виявитися марними. Поступово виходячи з тіні, §RЮніоністська партія§! знову намагається схилити валлійців до возз’єднання з сусідньою країною. §RДжон Морріс§! та широка коаліція його політичних союзників готові зробити все можливе, щоб подолати хаос, спричинений діяльністю §jАВВ§!, і звести нанівець наслідки багаторічної незалежности §GВельсу§!."

 WAL_CountryInfo_Content.4: "Майбутнє Вельсу"
 WAL_CountryInfo_Content_desc.4: "У найближчі роки всім цим політичним угрупованням доведеться шукати способів приборкати нестабільну ситуацію в країні. Комусь це вдаватиметься легше, комусь важче, тоді як правляча партія марно намагатиметься подолати кризу, яка неминуче призведе до її падіння. Ці події не оминуть нікого у §GВельсі§! й назавжди змінять життя країни. А от на краще чи на гірше - покаже лише час."

# SCOTLAND

 SCO_CountryInfo_Folder.101: "Озираючись у минуле"
 SCO_CountryInfo_Folder.102: "Не бачачи майбутнього"
 SCO_CountryInfo_Folder.103: "Здогадки й побоювання"

 SCO_CountryInfo_Content.1: "Із попелу минулого"
 SCO_CountryInfo_Content_desc.1: "У найтемнішу годину Британії остаточно згасло світло, що горіло триста років. Та на його місці спалахнуло нове - те, що не горіло вже три століття. §BШотландію§! відродили з відчаю генерал §QДуґлас Вімберлі§!, уславлений командувач §Q51-ї гірської дивізії§!, та §YДжон Маккормік§!, засновник невеликого сепаратистського руху під назвою §YШотландська національна партія§!.\n\nУ хаосі після вторгнення §BШотландію§! заполонили біженці з §RАнглії§!, що рятувалися від режиму, встановленого за підтримки §gнімців§!. Однак §Bшотландці§! та §YШНП§! загалом ставляться до прибульців із недовірою, вбачаючи в них представників народу, який панував над ними триста років. Чимало людей також побоюються, що серед біженців можуть переховуватися аґенти §Rколябораціоністів§!, хоча за п'ятнадцять років ці підозри так і не знайшли підтвердження."

 SCO_CountryInfo_Content.2: "Дункан чи Макбет?"
 SCO_CountryInfo_Content_desc.2: "1962 року на чолі Шотландської Республіки стоїть її засновник і президент §YДжон Маккормік§!, якого з прихильністю називають «королем», порівнюючи з шотландськими монархами минулого. Посаду прем'єр-міністра обіймає його наступник і вихованець §YРоберт Макінтайр§!. Утім, в одному з останніх бастіонів демократії на Британських островах далеко не все гаразд. Здоров'я §YМаккорміка§! невпинно погіршується, і його смерть після дев'ятнадцяти років при владі може обернутися справжньою катастрофою.\n\nПоки парламент розглядає законопроєкти та інші пропозиції, чимало шотландців непокояться, що смерть президента може паралізувати всю державу. Водночас деякі його супротивники використовують прізвисько §YМаккорміка§! проти нього самого, порівнюючи президента з европейськими диктаторами через його безперервне перебування при владі. Вони, без сумніву, спробують скористатися його смертю."

 SCO_CountryInfo_Content.3: "Незалежні лейбористи"
 SCO_CountryInfo_Content_desc.3: "Через дев'ятнадцятирічне панування §YШНП§! Шотландія може здаватися однопартійною державою. Проте дві інші партії не сидять склавши руки, а ведуть боротьбу за місця в Голіруді, шотландському парламенті. Найпомітніша серед них - §VНезалежна лейбористська партія§!. У хаосі, що супроводжував падіння §RАнглії§!, §VЛейбористська партія§! почала розпадатися й поступово занепадати. Багатьох її членів заарештувало §gґестапо§!, решта ж утекли за кордон, зокрема до §BШотландії§!.\n\n§BШотландському§! осередкові §VЛейбористської партії§! довелося перебудуватися, щоб вижити в нових умовах. Так постала §VНезалежна лейбористська партія§!. Однак через величезну популярність §YШНП§! новостворена партія опинилася на межі розпаду. Становище змінилося лише тоді, коли до неї приєднався §VВільям Вулф§!, колишній член §YШНП§!, який очолив організацію та перетворив її на ту політичну силу, якою вона є сьогодні."
 
 SCO_CountryInfo_Content.4: "Юніоністи"
 SCO_CountryInfo_Content_desc.4: "Найменшу партію Шотландії, §mЮніоністську партію§! на чолі з §mПрісціллою Б'юкен§!, сприймають радше як жалюгідний залишок політичної сили, ніж як серйозного суперника. Вона губиться на тлі могутньої §YШНП§! й навіть значно скромнішої §VНЛП§!. Однак §mБ'юкен§! та її однопартійці не збираються здаватися попри вороже політичне середовище.\n\n§mБ'юкен§! до свого прибуття в §BШотландію§! належала до Консервативної партії. Після тривалих роздумів та отримання фінансової підтримки від загадкового благодійника вона заснувала §mЮніоністську партію§!. І хоча §YШНП§! та §VНЛП§! не втрачають нагоди поглузувати з неї, лави §mЮП§! поступово зростають, а її віддані прихильники вирізняються високою явкою на виборах."

 SCO_CountryInfo_Content.5: "У постійній готовності"
 SCO_CountryInfo_Content_desc.5: "Однією з найвизначніших постатей §BШотландії§! є фактичний очільник §Qшотландських збройних сил§!, маршал §QДуґлас Вімберлі§!. Його люблять солдати та студенти численних коледжів й університетів §BШотландії§!, адже він доклав чимало зусиль до відродження відданости своїй справі та почуття гордости в наукових і військових колах. Як один із засновників нинішньої республіки, він користується неабиякою повагою серед населення. Проте найближчі друзі й радники знають, що Вімберлі часом схильний до надмірної підозріливости.\n\nХоч громадянам §BШотландії§! може здаватися, що в країні все гаразд, її збройні сили перебувають у стані постійної бойової готовности. Поки на кордоні стоять §Rколябораціоністи§!, загроза нападу нікуди не зникає. Цю думку міцно закарбували у свідомості бійців §Qзбройних сил§!, і нею керуються як генерали, так і адмірали. §QВімберлі§! - розумна людина, готова поставити на карту все заради шотландської незалежности та свободи, як він сам їх розуміє. Заради цього він здатен на §xбудь-що§! й у разі провокації може вдатися до найрішучіших заходів."

# RK. NORWEGEN

 NOR_CountryInfo_Folder.101: "Від тривожного минулого"
 NOR_CountryInfo_Folder.102: "До тривожного майбутнього"

 NOR_CountryInfo_Content.1: "Жаданий трофей"
 NOR_CountryInfo_Content_desc.1: "Далеко на півночі, за межами метрополії §qРайху§!, лежить його північний форпост - §jРайхскомісаріят Норвеґен§!. Темні стрічки норвезьких автобанів прорізають мальовничі долини між фіордами. 1940 року вермахт захопив Норвезьке королівство внаслідок масштабної операції із залученням різних родів військ, нібито задля створення «протекторату для захисту від британського вторгнення». Однак утримання країни під своїм контролем стало постійним головним болем для §qнімецького§! уряду як під час війни, так і після неї.\n\nНа відміну від своїх поступливіших сусідів у Данії, норвезьке цивільне населення та військові аж ніяк не залишалися байдужими до §qнімецького§! втручання навіть у перші роки окупації. Становище погіршив цілковитий провал спроби вермахту захопити короля та уряд 1940 року: королівська родина й провідні політики втекли разом із залишками військово-морського флоту до Шотландії, а звідти й далі."

 NOR_CountryInfo_Content.2: "Тріщини у фортеці"
 NOR_CountryInfo_Content_desc.2: "Оскільки підписати офіційну капітуляцію було нікому, нестійка військова адміністрація фон Фалькенгорста виявилася неспроможною приборкати безперервну громадянську непокору та дедалі активніші дії місцевих партизанів і диверсійних загонів.\n\nВиходом із становища стало створення компромісного уряду. Згідно з угодою про розподіл влади, судова, виконавча, а згодом і законодавча гілки влади перейшли під контроль місцевої §oпартії «Національна єдність» (НЄ)§!, очолюваної міністром-президентом Відкуном Квіслінґом. Райхскомісар мав наглядати за поступовим входженням §jНорвеґії§! до складу §qРайху§!, однак Йозеф Тербофен, на власне невдоволення, отримав украй обмежені повноваження: право вето та можливість видавати виконавчі розпорядження."

 NOR_CountryInfo_Content.3: "Геть старе"
 NOR_CountryInfo_Content_desc.3: "Після війни Тербофен зумів зміцнити свої позиції, використавши внесок §jРайхскомісаріяту Норвеґен§! у §qнімецьку§! ядерну програму. Проте германізація країни й надалі просувалася повільно. Місцевий парламент, Стортинґ, усунув Квіслінґа від влади за неправдиві обіцянки виведення німецьких військ після війни та неспроможність домогтися передачі Кольського півострова §jНорвеґену§! за умовами мирної угоди. Після кількох нетривалих урядів на чолі з різними міністрами-президентами §jНЄ§! згуртувалася довкола нового ріксфюрера Ґульбранда Лунде.\n\n"
 
 NOR_CountryInfo_Content.4: "Нові тріюмвіри"
 NOR_CountryInfo_Content_desc.4: "Упродовж двадцяти років нестійкий уряд усіма силами намагався перетворити Норвеґію на §Yзразкову колонію§!. На чолі держави стоїть не менш хиткий тріюмвірат: Тербофен, націоналіст Ґульбранд Лунде, чия відданість Райху дедалі слабшає, та жорстокий начальник поліції Юнас Лі. Для Тербофена Лі є корисним знаряддям у стримуванні впливу Лунде та спричиненого ним невдоволення, адже без поліції виконавча влада навряд чи змогла б забезпечити виконання своїх наказів.\n\nПроте під тиском дедалі активніших дисидентів і реформаторів Лунде поступово втрачає підтримку в сільських районах, які традиційно становили основу його політичної сили. Це змушує його займати дедалі жорсткішу позицію щодо §qнімців§!, яких він потай ненавидить."

 NOR_CountryInfo_Content.5: "А якщо вони підуть"
 NOR_CountryInfo_Content_desc.5: "Якщо §qнімецький§! гарнізон буде змушений залишити країну, навряд чи Лі зможе зберегти чинний порядок навіть за допомогою грубої сили. Ще менш імовірно, що Лунде взагалі намагатиметься підтримувати видимість покори без загрози з боку німецьких військ. Упродовж багатьох років німці неодноразово намагалися його вбити, аби завадити поверненню до націоналістичного курсу, якого партія дотримувалася колись. Проте всі замахи зазнали невдачі, а усталений порядок щоразу відновлювався, дозволяючи Лунде міцно триматися за залишки своєї влади.\n\nЯкщо між переконаними націонал-соціялістами Лі та опозицією спалахне криза, цілком можливо, що противники Лі спробують усунути його з посади ріксфюрера. А тим часом партизани §dМілорґу§! (Мілітарної орґанізації) можуть скористатися нагодою та завдати власного удару, вибивши опору з-під колябораціоністського уряду. І чи буде це на краще, чи на гірше - залежить від того, кого запитати."

# RK. OSTLAND
 
 OST_CountryInfo_Folder.101: "Зразкова колонія"

 OST_CountryInfo_Content.1: "Східна перлина"
 OST_CountryInfo_Content_desc.1: "§GНімецький Райх§! панує над Европою, утримуючи свою владу за допомогою §Gрайхскомісаріятів§!. Ці колоніяльні держави простягаються від Праги до Паулюсбурґа, і кожною з них керує власний райхскомісар. Формально всі вони є вірними підданими §GРайху§!, проте на практиці їхня відданість та дієздатність істотно різняться.\n\nРідкісним винятком на тлі загального занепаду й хаосу є §WРайхскомісаріят Остлянд§! - безперечно, найкраще керований §Gрайхскомісаріят§! у володіннях §GРайху§!. Під проводом райхскомісара §WГінріха Лозе§! §WОстлянд§! став найзаможнішим §Gрайхскомісаріятом§! §GРайху§!, досягнувши також неабияких успіхів у германізації та підтриманні загальної стабільности. Якщо вірити райховому керівництву, усім цим край завдячує правлінню §WЛозе§!, здібностям його оточення та покірності більшої частини населення."

 OST_CountryInfo_Content.2: "За завісою"
 OST_CountryInfo_Content_desc.2: "Однак разом із §GРайхом§!, який починає §Rтріщати по швах§!, розхитується й §WОстлянд§!. Здоров\'я §WГінріха Лозе§! невпинно §Rпогіршується§!, а його підлеглі вже гризуться між собою не менш запекло, ніж політики в самому Райху. Ба більше, кожен із них став представником одного з можливих наступників у §GРайху§!: §WФранц Вальтер Шталеккер§! підтримує консерватора Бормана, §WОтто-Гайнріх Дрекслер§! - мілітариста Ґьорінґа, §WАндреас Маєр-Ландрут§! - реформіста Шпеєра, а §WФрідріх Єккельн§! очолює СС і відкрито підтримує §Rбурґундську систему§!.\n\nІ без того напружене становище погіршує відомий партизан і терорист §RАбба Ковнер§!, який досі становить загрозу для §Wрайхскомісаріяту§!. До того ж подейкують, що таємничий колябораціоніст §WМіхал Вітушка§! також виношує власні плани."

 OST_CountryInfo_Content.3: "Людина з планом"
 OST_CountryInfo_Content_desc.3: "На щастя для §Wрайхскомісаріяту§!, схоже, наступника §WЛозе§! - §GКарла Зіґмунда Ліцмана§! - уже визначив §GРайх§!, попри всі внутрішні чвари. Тепер, коли питання наступництва вирішено, залишається лише придушити останні осередки опору й покласти край безладові. Тоді §WОстлянд§! зможе й далі йти шляхом §Gзразкової колонії§! - мирного, стабільного, германізованого раю.\n\nЗалишається сподіватися, що проблеми §GРайху§! вдасться владнати так само, інакше становище тут може дуже швидко §Rвийти з-під контролю...§!"

# RK. OSTAFRIKA
 
 GRO_CountryInfo_Folder.101: "Новий господар"

 GRO_CountryInfo_Content.1: "Серце пітьми"
 GRO_CountryInfo_Content_desc.1: "В очах европейців Африка - не земля, де живуть люди. Не величезний континент із незліченним розмаїттям, де мільярди живих істот дихають і люблять під палючим сонцем. Не дім і не колиска людства, з якої воно колись постало, ще не тямлячи всієї дивовижности власного існування. Вони не бачать в Африці нічого людського. Для Европи це лише §Rнепокірний звір§!, якого ще належить приборкати, а його природні багатства - відкрити й привласнити. Загадка, звір, випробування - байдуже. В очах чужинців Африка існує винятково заради їхньої §Kвигоди§!.\n\nКоли Британія та Франція впали під ударами §gвермахту§!, Німеччина швидко загарбала їхні колоніяльні володіння в §nАфриці на південь від Сахари§!. Вирішивши перенести сюди свою фірмову жорстокість, випробувану на землях колишнього СССР, Ґерманія створила три §Lрайхскомісаріяти§!, щоб вичавити з Африки останні краплі багатств, до яких не дісталися її попередні господарі."

 GRO_CountryInfo_Content.2: "Стандартна колонія"
 GRO_CountryInfo_Content_desc.2: "Найжорстокішим і найбезжальнішим із трьох колоніяльних володінь є §jРайхскомісаріят Остафріка§!, що охоплює східну третину Африки на південь від Сахари. Його особливість полягає не у відступі від засад §rнаціонал-соціялізму§!, а, навпаки, в неухильному їх дотриманні. Порівняно із сусідами та навіть східноевропейськими райхскомісаріятами це цілком і повністю стандартна націонал-соціялістична держава. І саме в цьому полягає її особливе §eварварство§!.\n\nВ Остафріці панує сувора ієрархія. На її вершині стоїть райхскомісар §EГанс Гюттіґ§!. Нижче розташовуються етнічні німці, що переселилися до Африки. За ними йдуть §Vанглійські поселенці§! - спадщина колишніх колоніяльних режимів, які колись панували на континенті. На самому дні перебувають §nафриканці§!. Для Гюттіґа їхнє життя не має жодної цінности, навіть меншої, ніж життя євреїв. На його переконання, африканцям судилося або жити в кайданах, або зникнути зі сторінок історії. І з кожним днем §eдругий варіянт здається йому дедалі привабливішим...§!"

 GRO_CountryInfo_Content.3: "Пекло Гюттіґа"
 GRO_CountryInfo_Content_desc.3: "На вулицях заможніших районів Остафріки неодмінно натрапиш бодай на один патруль СС, що пильно вистежує будь-які ознаки партизанської діяльности. Його бійці майже напевно будуть білими, але ті, хто сподівається на поблажливість нечисленних чорношкірих допоміжних вояків, глибоко §eпомиляються§!. Вони знущаються зі своїх співвітчизників не через расові переконання чи ідеологію. Річ у тім, що всевидющі очі Гюттіґа повсякчас стежать за ними. Вони - §rслуги фюрера§!, та саме §Eрайхскомісар§! вирішує, жити чи померти їхнім родинам. А там, де не дістає людський погляд, на допомогу приходить техніка. Гюттіґ вклав величезні кошти в новітню галузь §Pвідеоспостереження§!, завдяки якій одна людина може стежити одразу за кількома місцями. Під залізною владою Гюттіґа немає безпечного місця, і жодна таємниця не залишиться прихованою. §xОстафріка - це пекло§!, і її правитель надто вже охоче нагадує про це своїм підданим."

 GRO_CountryInfo_Folder.102: "І ось - кінь блідий"

 GRO_CountryInfo_Content.4: "Юда чи Павло?"
 GRO_CountryInfo_Content_desc.4: "Усе, що відбувається в райхскомісаріяті, так чи інакше є похмурим віддзеркаленням його «любого» правителя. Ганс Гюттіґ - §eпараноїк§!, адже без цього навряд чи можна було б піднятися так високо в лавах СС. Хоча головним його завданням залишається придушення можливих повстань африканців, порівняно з §Eкінцевою метою§! це лише дрібне захоплення.\n\nНа думку Гюттіґа, інші райхскомісари вражені недугою. Шенк, очільник §mРайхскомісаріяту Зюдвестафріка§!, та Мюллер, очільник §wРайхскомісаріяту Центральафріка§!, обидва загрузли в гріху. Гріх Шенка полягає в тому, що він визнає людську гідність африканців. Немовби вони можуть бути рівнею німцям. Мюллер не кращий: удає, що служить інтересам Ґерманії, а сам цокається келихами з представниками якихось безіменних племен заради земних багатств. Для Гюттіґа африканці - лише §Vхудоба або таргани§!. Вдавати, ніби це не так, означає чинити жорстоко і щодо них, і щодо Батьківщини. Проте так просто усунути інших райхскомісарів він не може. Принаймні без доказів..."

 GRO_CountryInfo_Content.5: "Друга печать"
 GRO_CountryInfo_Content_desc.5: "Південна Африка - порохова діжка. І найгірше те, що напруга в ній накопичувалася десятиліттями. Невдоволення як §Oбурів§!, так і §nафриканців§! змушує владу Кейптауна ухвалювати дедалі поспішніші й необачніші рішення. Позбувшись повідця свого §Vбританського§! господаря, Південна Африка втратила орієнтири. Вона може плазувати перед бурами або перед чорношкірими. Але не перед обома водночас.\n\nСамотужки бури не здолають Південної Африки. На щастя, їм і не доведеться. Коли Південна Африка нарешті розвалиться - §xа вона неодмінно розвалиться§! - ми будемо напоготові. Однак нам належить завдати нищівного удару як Кейптауну, так і §iамериканським§! силам, що неминуче з’являться в їхньому неоколоніяльному володінні. Наші обмежені сили, що складаються з чистокровних арійців і добірних місцевих підрозділів, не витримають затяжної війни на виснаження. Якщо забаримося, партизани розірвуть нас на шматки й залишать на поживу стерв’ятникам. Сприймайте наше завдання як §P«Барбароссу-на-Калагарі»§!."

# RK. SÜDWESTAFRIKA
 
 ANG_CountryInfo_Folder.101: "Новий господар"

 ANG_CountryInfo_Content.1: "Серце пітьми"
 ANG_CountryInfo_Content_desc.1: "В очах европейців Африка - не земля, де живуть люди. Не величезний континент із незліченним розмаїттям, де мільярди живих істот дихають і люблять під палючим сонцем. Не дім і не колиска людства, з якої воно колись постало, ще не тямлячи всієї дивовижности власного існування. Вони не бачать в Африці нічого людського. Для Европи це лише §Rнепокірний звір§!, якого ще належить приборкати, а його природні багатства - відкрити й привласнити. Загадка, звір, випробування - байдуже. В очах чужинців Африка існує винятково заради їхньої §Kвигоди§!.\n\nКоли Британія та Франція впали під ударами §gвермахту§!, Німеччина швидко загарбала їхні колоніяльні володіння в §nАфриці на південь від Сахари§!. Вирішивши перенести сюди свою фірмову жорстокість, випробувану на землях колишнього СССР, Ґерманія створила три §Lрайхскомісаріяти§!, щоб вичавити з Африки останні краплі багатств, до яких не дісталися її попередні господарі."

 ANG_CountryInfo_Content.2: "Віє хамсин"
 ANG_CountryInfo_Content_desc.2: "§mРайхскомісаріят Зюдвестафріка§! - доволі... дивне місце. Навіть серед своєрідних колоніяльних володінь, породжених імперськими амбіціями Гітлера, саме Зюдвестафріка чи не найбільше залежить від особистости свого §gкерівника§!. Формально це ще одна колонія, покликана вичавлювати з підкорених земель якомога більше ресурсів. Однак значна частина її території або надто §Yпустельна§!, або надто §Gгусто вкрита рослинністю§!, щоб повноцінно її використовувати. Подібні труднощі мають й інші райхскомісаріяти, проте саме Зюдвестафріка зрештою перетворилася на одну велетенську базу §Lлюфтваффе§!.\n\nБільшість офіцерів штабу райхскомісара - §Lвійськовослужбовці люфтваффе§!, а левова частка бюджету йде на спорудження нових та розширення наявних авіаційних об\'єктів. Сам райхскомісар, здається, половину часу взагалі відсутній: то вирушає на полювання разом зі своїм колегою, §wрайхскомісаром Мюллером§!, то буквально ширяє понад хмарами, здійснюючи безцільні польоти."

 ANG_CountryInfo_Content.3: "Пекло Шенка"
 ANG_CountryInfo_Content_desc.3: "Сам райхскомісар §iВольфґанґ Шенк§! опинився в пеклі, яке власноруч собі створив. Коли він не спостерігає за багряним заходом сонця з кабіни власного винищувача, високо над людськими поселеннями, його можна знайти в маєтку. Шенк - надзвичайно замкнута людина. За словами прислуги, він може цілими днями усамітнюватися в порожніх покоях, не подаючи ані найменшої ознаки життя.\n\nПекло Шенка полягає в тому, що він §Cдосі живий§!. Дні його слави давно минули, а гірка правда вже торкається його обличчя. На відміну від Гюттіґа, Шенк не тішить себе ілюзіями. Це «призначення» - не що інше, як в\'язниця, покликана тримати його начебто поблизу Німеччини, але якнайдалі від фюрера та будь-якої справжньої посади у §gвермахті§!. Хай як стараються його радники, Шенк чудово розуміє: уся ця африканська авантюра - не більш ніж картковий будиночок. Рано чи пізно він розсиплеться. Залишається лише збагнути, §Kщо буде далі§!."

 ANG_CountryInfo_Folder.102: "Двигуни війни"

 ANG_CountryInfo_Content.4: "І знову летять бомбардувальники"
 ANG_CountryInfo_Content_desc.4: "Південна Африка - порохова діжка. І найгірше те, що напруга в ній накопичувалася десятиліттями. Невдоволення як §Oбурів§!, так і §nафриканців§! змушує владу Кейптауна ухвалювати дедалі поспішніші й необачніші рішення. Позбувшись повідця свого §Vбританського§! господаря, Південна Африка втратила орієнтири. Вона може плазувати перед бурами або перед чорношкірими. Але не перед обома водночас.\n\nШенка анітрохи не хвилюють примхи колишнього домініону, що вже втратив своє значення. Натомість §EГюттіґ§! наполягає на війні, а таємними каналами з Райху колонії підштовхують до §eспільного наступу§! на державу, що розвалюється. Коли це станеться, Шенк муситиме обрушити гнів фюрера §Qз небес§!. Однак Південна Африка - не єдиний гравець за цим столом. §iАмериканці§! дедалі рішучіше налаштовані втрутитися в африканські справи. Лише питання часу, коли вони скинуть свої шовкові рукавички..."

 ANG_CountryInfo_Content.5: "Свобода здіймається в небо"
 ANG_CountryInfo_Content_desc.5: "§VШенк зрадив Райх§!. Не вчинками, принаймні не такими, за які його поставили б перед розстрільною командою, але все ж зрадив. Колись ця думка зненацька спалахувала в його голові раз на місяць. Згодом - щотижня. Тепер, коли на обрії замаячила загроза знищення у війні з Америкою, вона не полишає його щодня. І ця крамольна думка має назву - §nАнгола§!.\n\nУсі три райхскомісаріяти - немов замки, зведені на сипучих пісках. Рано чи пізно вони §xнеодмінно§! проваляться. Розкішне життя розніжило Мюллера, тоді як жорстокість Гюттіґа лише згуртувала його ворогів, зробивши їх сильнішими, ніж він готовий собі уявити. Володіння Шенка теж приречені на падіння. Але в Анголі він має §Kзв\'язки§!. Там є люди, яким він співчуває. Люди, які заслуговують на шанс поборотися, коли джунглі охопить полум\'я. І якщо Шенк уже не здатен зберігати вірність Райху, можливо, його відданість іще послужить §Kкомусь іншому?§!"

# RK. ZENTRALAFRIKA

 COG_CountryInfo_Folder.101: "Новий господар"

 COG_CountryInfo_Content.1: "Серце пітьми"
 COG_CountryInfo_Content_desc.1: "В очах европейців Африка - не земля, де живуть люди. Не величезний континент із незліченним розмаїттям, де мільярди живих істот дихають і люблять під палючим сонцем. Не дім і не колиска людства, з якої воно колись постало, ще не тямлячи всієї дивовижности власного існування. Вони не бачать в Африці нічого людського. Для Европи це лише §Rнепокірний звір§!, якого ще належить приборкати, а його природні багатства - відкрити й привласнити. Загадка, звір, випробування - байдуже. В очах чужинців Африка існує винятково заради їхньої §Kвигоди§!.\n\nКоли Британія та Франція впали під ударами §gвермахту§!, Німеччина швидко загарбала їхні колоніяльні володіння в §nАфриці на південь від Сахари§!. Вирішивши перенести сюди свою фірмову жорстокість, випробувану на землях колишнього СССР, Ґерманія створила три §Lрайхскомісаріяти§!, щоб вичавити з Африки останні краплі багатств, до яких не дісталися її попередні господарі."

 COG_CountryInfo_Content.2: "Перлина Райху"
 COG_CountryInfo_Content_desc.2: "Мало який куточок Райху настільки залежить від особистости свого райхскомісара, як §wЦентральафріка§!. Особливість цього колоніяльного володіння полягає в тому, що воно є найбільшою §Rінвестиційною аферою в історії людства§!. Мільйони, якщо не мільярди райхсмарок, нібито пішли на безрозсудні спроби колонізувати найзагадковіший куточок §nЧорного континенту§!. І річ навіть не в тому, що ці кошти витратили безрезультатно через несприятливі природні умови, хоча це було б цілком імовірно. Насправді їх узагалі не витратили за призначенням. А якщо й витратили, то лише на поповнення банківського рахунку однієї людини - §wЗіґфріда Мюллера§!.\n\nНатомість усе тутешнє §Vмайже анархічне§! управління тримається на розрізненій мережі місцевих племен, які лише формально підпорядковуються Леопольдвілю та отримують звідти загальні розпорядження. Що ближче до столиці, то відчутнішою стає німецька влада, §jале навіть там вона не панує безроздільно.§!"

 COG_CountryInfo_Content.3: "Домушник Райху"
 COG_CountryInfo_Content_desc.3: "Причина полягає в тому, що райхскомісар зовсім не зацікавлений у встановленні справжньої німецької влади деінде, окрім місць, де він може віддаватися своєму головному захопленню. А захоплення це - власноруч довести всі види великої мисливської дичини до §Rвимирання§!. Зіґфрід Мюллер із гордістю носить звання «гедоніста» нарівні зі своїм §gЗалізним хрестом§!, адже не соромиться того, що понад усе цінує вишукані життєві насолоди.\n\nНа практиці це означає, що §wЦентральафрікою§! фактично керують ті іноземні компанії, яким Мюллер дозволяє безоглядно спустошувати конґолезькі джунглі, не переймаючись наслідками."

 COG_CountryInfo_Folder.102: "Корінь усього зла"

 COG_CountryInfo_Content.4: "Корінь усього зла"
 COG_CountryInfo_Content_desc.4: "Навіть у тих, хто лише побіжно знайомий зі становищем у райхскомісаріяті, неодмінно виникає запитання: як його вельмишановному правителю вдається §xвідмивати такі величезні статки§!? За найпоширенішою версією, Ґерманія виділяє Мюллерові кошти для розвитку райхскомісаріяту. На ці гроші закуповують промислове обладнання для видобутку ресурсів на землях, які ще не поглинуло §Bозеро Конґо§!, або військове спорядження для боротьби із §Rсотнями угруповань опору§!, що користуються безладом за правління Мюллера. За офіційними звітами, значна частина цих ресурсів «втрачається» в запеклих боях із партизанами, а після ліквідації їхніх баз дивним чином зникає й більшість райхового спорядження. Насправді ж Мюллер переправляє подарунки своїх покровителів до §sтаємничої мережі міжнародних посередників і загадкових промислових комплексів§!, звідки їх продають за завищеними цінами разом із рідкісними й екзотичними товарами, якими торгують на чорному ринку в глибині джунглів."

 COG_CountryInfo_Folder.103: "Найнебезпечніша дичина"

 COG_CountryInfo_Content.5: "Гнійна рана Землі"
 COG_CountryInfo_Content_desc.5: "У самому серці Конґо лежить, мабуть, найвеличніший слід, який людство будь-коли залишило на Землі. Для одних це втілення всіх пороків нацистської ідеології: суцільне §lбожевілля§!, §fмарнославство§!, §xбезглузде й варварське породження внутрішніх суперечностей§!. Для прихильників же це доказ того, що люди - не просто тварини, а справжні §pбоги§!, здатні власноруч виправляти вади навколишнього світу. Ідеться про §Bозеро Конґо§!. Гребля, що дала початок цьому озеру, стала черговим недалекоглядним породженням повоєнної ейфорії, яка охопила Німеччину після її майже неможливої перемоги у Другій світовій війні. Німці спорудили низку гребель поблизу гирла річки Конґо. Задум, покликаний допомогти приборкати §nбуйну рослинність тропічних лісів§!, обернувся справжнім пеклом. Території, які ще залишилися під контролем райхскомісаріяту, перетворилися на осередки хвороб, злиднів і біженських нетрів, де туляться люди, вигнані зі своїх домівок водами озера. Тепер, майже двадцять років потому, озеро Конґо стало вічним нагадуванням про §eлюдське безглуздя§!."

 COG_CountryInfo_Content.6: "Гроші правлять світом"
 COG_CountryInfo_Content_desc.6: "Чи то Німеччині геть байдуже до своїх невдах в Африці, чи то Центральафріка настільки вправно дурить Райх своєю тонесенькою завісою обману, але, схоже, ніхто досі не помітив одного дивного факту: гарнізон Центральафріки §Rбільшу частину часу майже не перебуває на території самого райхскомісаріяту§!. Адже головна особливість Центральафріки полягає в тому, що вона пропонує свої §x«послуги»§! тому, хто заплатить найбільше, обіцяючи найсучаснішу німецьку зброю та відносно добре вишколені війська.\n\n§VАзія§!, §nАфрика§!, §iАмерика§! - байдуже, куди їх закине доля. Поки кишені Мюллера повні, його солдати воюватимуть за кого завгодно. Навіть якщо це суперечить інтересам Ґерманії, навіть якщо доводиться допомагати ворогові, навіть якщо вони діють проти §wвласних інтересів§!, - Мюллерові найманці однаково служитимуть тому, хто більше заплатить. І ні на що інше вони не погодяться."

 COG_CountryInfo_Content.7: "Поза райхсмаркою"
 COG_CountryInfo_Content_desc.7: "Південна Африка - порохова діжка. І найгірше те, що напруга в ній накопичувалася десятиліттями. Невдоволення як §Oбурів§!, так і §nафриканців§! змушує владу Кейптауна ухвалювати дедалі поспішніші й необачніші рішення. Позбувшись повідця свого §Vбританського§! господаря, Південна Африка втратила орієнтири. Вона може плазувати перед бурами або перед чорношкірими. Але не перед обома водночас.\n\nДля Мюллера, однак, майбутня війна - не більш ніж черговий §Eобов\'язок§!. Він відправить своїх найманців до Південної Африки, де їхній §Rзагартований у боях досвід§! дозволить без особливих зусиль розгромити будь-яких §Jкейптаунських новобранців§!, яких кинуть проти них. Щойно війна скінчиться, Мюллер повернеться до полювання, як робив завжди. Єдине, що його непокоїть, - §iАмерика§!. Звісно, американські війська можуть битися на рівних із найкращими його підрозділами. Але уявіть лишень, що така сутичка зробить із його §Kбізнесом§!! Сама думка протвережує."

# Ukraine

 UKR_CountryInfo_Folder.101: "Нагодувати Европу"

 UKR_CountryInfo_Content.1: "Житниця Европи"
 
 UKR_CountryInfo_Content_desc.1: "Історію §MУкр§!§Yаїни§! наче підсумовує одне з тлумачень її назви, що сягає давньослов'янських часів, - «§MУкр§!§Yаїна§!», тобто «прикордоння». Затиснута між Берліном на заході та Москвою на сході, §MУкр§!§Yаїна§! за свою бурхливу історію майже не знала спокою. Колись лише частина величезної §KРосійської імперії§!, §MУкр§!§Yаїна§! вперше здобула незалежність серед хаосу §VРосійської революції§!, проте втратила її після мстивого повернення Москви, а тепер опинилася в рабстві §oҐерманії§!.\n\nПідкорена §MУкр§!§Yаїна§! знову опинилася на милості чужої імперії, змушена коритися її жорстокості та наказам. Та колесо історії вже починає свій черговий оберт, породжуючи ще одне марне повторення §Mукраї§!§Yнського§! минулого. Вкотре все повторюється, щойно корона починає сповзати з голови правителя. Різні, подекуди викривлені мрії про §Mукраї§!§Yнську§! державність знову змагаються за душу нації: схід чи захід, §gколяборація§! чи §Gнезалежність§!, §Oфашизм§! чи §yсвобода§!. Кожен, хто плекає надії та молиться за §MУкр§!§Yаїну§!, прагне взяти її долю у власні руки або загине у боротьбі за неї."

 UKR_CountryInfo_Content.2: "Мільйон розбитих мрій"
 UKR_CountryInfo_Content_desc.2: "§MУкраї§!§Yнські§! мрії надто часто народжуються мертвими. Ще від часів козацького гетьманату §Mукраї§!§Yнська§! державність спалахувала лише на короткі миті. У 1917 році, коли Москву охопила §Vсмута§!, §DУкраїнська Рада§! спробувала скористатися нагодою. Та і ця мрія швидко згасла, а залишки §Mукраї§!§Yнської§! демократії мусили тікати від наступу §eсовєтів§! до §CПольщі§!. Незабаром §gОрганізація українських націоналістів§! розгорнула боротьбу в Західній Україні та польській Галичині, виступивши разом із §oнацистами§! проти спільного ненависного ворога.\n\nТим часом, після краху мрії про §SУСРР§!, §gОУН§! невдовзі охопила внутрішня криза: противники коляборації відкололися від організації під проводом §sСтепана Бандери§!. Тим часом у Західній Україні та Галичині виник інший рух, що боровся за §Gдемократичну мрію§!. Та §Rжодному§! із цих задумів не судилося здійснитися, як і більшості провідників українського опору - пережити цю боротьбу. Серед загиблих був і Бандера. Навіть плани §oНімеччини§! зазнали краху, коли колонія Еріха Коха поступово втрачала становище житниці Европи під ударами незліченних борців за свободу, яких водночас називали терористами."

 UKR_CountryInfo_Content.3: "Застиглі в часі"
 UKR_CountryInfo_Content_desc.3: "Райхскомісаріят створювали з єдиною метою - підкорити Україну. Його творці вірили, що рано чи пізно §MУкр§!§Yаїна§! скориться §oНімеччині§! та без спротиву змириться зі своїм культурним і демографічним §Rзанепадом§!. Однак майже два десятиліття спроб змінити становище на місцях так і не дали відчутних результатів. §MУкраї§!§Yнський§! народ довів свою здатність утримувати боєздатні збройні формування, а оскільки насильство від самого початку було основою німецької колоніяльної політики, інших засобів у загарбників просто не залишилося.\n\n§DУНРА§! досі бореться за §Gреспубліку§!, мрія про яку поступово відходить в історію. §sУПА§! продовжує боротьбу за ідеали людини, що загинула в ув\'язненні десять років тому, а її націоналістичні мрії стають дедалі примарнішими. §SПартизани§! воюють за Союз, який давно §eрозпався§!. Навіть §oрайхскомісаріят§! веде свою боротьбу за остаточну германізацію - мету, досягнення якої постійно відкладається через незмінність становища в країні. Світ уже залишив Другу світову війну позаду, проте Україна так і застигла в її лещатах, продовжуючи боротьбу, з якої §Vнемає виходу§!."

 UKR_CountryInfo_Folder.102: "Реліквії минулого"

 UKR_CountryInfo_Content.4: "Реформатори гнилі"
 UKR_CountryInfo_Content_desc.4: "Насправді колоніяльна система в її нинішньому вигляді остаточно §xзламана§!, і це розуміють навіть самі гнобителі, що нею керують. Колоніяльне панування над §MУкраї§!§Yною§! обернулося величезними видатками й іще більшими людськими втратами. Якщо ця система має існувати й надалі, забезпечуючи нацистську машину всім необхідним, вона потребує реформ.\n\nТа якими саме мають бути ці реформи, досі залишається предметом запеклих суперечок. §oОлендорф§!, один із керівників та ідеологів СС, покладається на вільний ринок і прагматичні урядові заходи, щоб §Gвідродити§! колоніяльну систему й §Rвикорінити§! опір. §BЛяйббрандт§!, послідовник Розенберґа, вбачає необхідні зміни в §Lобмеженому переданні влади§! місцевому населенню, вважаючи, що саме так райхскомісаріят і мав функціонувати від самого початку. §sБройтіґам§!, висхідна зірка дипломатичного корпусу, пропонує ще радикальніші перетворення, за яких Україна отримала б справедливий уряд і стала §Dсправді рівноправною§!.\n\nПоки що Кох невпинно §eперешкоджає§! будь-яким спробам реформаторів змінити райхскомісаріят. Проте він уже глибокий старець, і якщо колонія переживе нинішні потрясіння, то, найімовірніше, переживе й самого Коха."

 UKR_CountryInfo_Content.5: "Нездійснена революція"
 UKR_CountryInfo_Content_desc.5: "Мрія про совєцький лад і досі жива. Сьогодення похмуре, майбутнє не обіцяє нічого доброго, тож більшості §Mукраї§!§Yнців§! залишається шукати опору в минулому. Найяскравішим прикладом цього є §SУСРР§! - об’єднання лівих сил під проводом §SОлександра Шумського§!, які відчайдушно прагнуть повернути славні часи §Vрадянської України§!. Під її старим червоним прапором збираються і ветерани минулих воєн, і молоді мрійники.\n\nУсіх їх об’єднує непохитне прагнення до спільної мети, проте ідеологічно вони разюче відрізняються. §SШумськісти§!, §Rтроцькісти§!, §eбухарінці§! та інші вимушено воюють пліч-о-пліч, хоч далеко не завжди вважають одне одного товаришами. Лише спільна мрія утримує цей строкатий рух від розпаду, та й то переважно завдяки зусиллям самого §SШумського§!. Якщо рух втратить свого провідника, ніхто не гарантує, що §SУСРР§! збереже єдність, а їхня мрія взагалі §eколи-небудь здійсниться§!."

 UKR_CountryInfo_Content.6: "Спадкоємці 1917 року"
 UKR_CountryInfo_Content_desc.6: "За роки свого існування §DУкраїнська національна революційна армія§! увібрала традиції, що формувалися впродовж цілого століття §Mукраї§!§Yнської§! історії, - від перших прагнень до §Gнезалежности§! й до сьогодення. Мабуть, найкраще сутність цього руху передає поширене серед його прихильників гасло: «Знову сімнадцятий!».\n\nСаме тоді вперше постала Українська Республіка. І хоча згодом її знищили §Vбольшевики§!, ідеали Республіки стали визначальними для §DУНРА§!, передусім її лібералізм та республіканізм. Коли §DТарас Бульба-Боровець§! створював власну армію, він надихався саме цими §yідеалами§! та духом §Rреволюції§! 1917 року.\n\nТепер, у 1962 році, рух продовжує існувати під новим проводом. §YНове покоління§! бачить в §DУНРА§! силу, що прагне майбутнього, не забуваючи про минуле. Націоналістичні й навіть ліві погляди дедалі більше поширюються серед його прихильників. Проте в самому осерді руху досі ховається §eтемна сутність§! колябораціонізму та зв’язків із §sУПА§!."

 UKR_CountryInfo_Content.7: "Стопами Бандери"
 UKR_CountryInfo_Content_desc.7: "Колись напрям діяльности §sУПА§! визначали слова §sСтепана Бандери§!. Як і більшість діячів §Mукраї§!§Yнського§! націоналістичного руху, він починав із боротьби проти §Cполяків§!, перш ніж піти на співпрацю з §oнацистами§!. Проте саме Бандера, завдяки своїм особливо радикальним поглядам і несподівано широкій підтримці, зумів розірвати зв'язки з §oНімеччиною§! та повстати проти колишніх господарів.\n\nТепер же долю §sУПА§! визначає смерть Бандери. Загинувши в концтаборі, він залишив по собі рух, який пережив свого провідника й знайшов нового провідника в особі §sДмитра Клячківського§!. Його бійці переховуються на заході України, ведучи нескінченну війну проти §DУНРА§! та німецьких окупантів.\n\n§sУПА§! й досі залишається потужною силою, однак її провід §Yрозколотий§! у поглядах на майбутнє Бандерової справи. Одні прагнуть повернутися до колишніх непорушних засад, тоді як інші сміливо намагаються перетворити §sУПА§! на знаряддя власних задумів. Бандерівці ступають небезпечним і непевним шляхом, що з однаковою ймовірністю може привести їх як до §xзагибелі§!, так і до §yпорятунку§!."

  #Mexico
  #101
  MEX_CountryInfo_Folder.101: "Вічна революція"
  MEX_CountryInfo_Content.1: "Доба змін"
  MEX_CountryInfo_Content_desc.1: "Президентство §OЛасаро Карденаса§! ознаменувало новий початок для §OМексиканської революції§!, яка поступово втрачала свій запал. Перетворення сільськогосподарських земель на громадські землеволодіння - «§wехідо§!» - принесло великі зміни в життя села. Розпочалися масштабні заходи з поширення освіти, а сам революційний рух було об'єднано в єдину корпоратистську організацію - §nПартію§! §Wмексиканської§! §xреволюції§!. Під твердим проводом Карденаса §KМексика§! нарешті стала на шлях до соціялізму.\n\nНайвизначнішою подією шестирічного президентства §OКарденаса§! стала націоналізація нафтової промисловости 1938 року. Одним рішучим кроком §KМексика§! повернула собі суверенні права на власні найцінніші природні багатства. Проте це викликало неабияке обурення, насамперед серед нафтових компаній §MСполучених Штатів§!."
  MEX_CountryInfo_Content.2: "Політика необхідности"
  MEX_CountryInfo_Content_desc.2: "Зіткнувшись із напруженістю, спричиненою §fекспропріяцією нафтової промисловости§!, наступний президент, §mМануель Авіла Камачо§!, вирішив дотримуватися §Mпоміркованішого§! курсу. Він урегулював давні суперечки з Церквою та відмовився від багатьох відверто §Sсоціялістичних§! заходів, зокрема від §Sсоціялістичного§! спрямування шкільної освіти. Однак це, схоже, не задовольнило новий §Mамериканський§! уряд, а особисті розбіжності між керівниками двох держав завадили §KМексиці§! цілковито стати на бік §Mзахідних союзників§!. §KМексика§! так і не вступила у війну й нерідко опиралася тискові §MСполучених Штатів§!, які вимагали повністю ліквідувати §oфалангістські§! та §rфашистські§! угруповання.\n\nПроте війна не оминула §KМексику§!. Зростання цін на сировину та припинення европейського експорту переконали керівництво §nП§WМ§xР§!§!§!, що шлях до кращого майбутнього лежить через індустріялізацію та вихід на світові ринки. А загострення відносин зі §MСполученими Штатами§! переконало їх у потребі знайти §xнового союзника§! в Західній півкулі."
  MEX_CountryInfo_Content.3: "Нова революція"
  MEX_CountryInfo_Content_desc.3: "Президент §LМіґель Алеман§! став рушієм докорінних повоєнних змін у §OРеволюції§!. Зближення з §xЯпонією§! дало Мексиці нового партнера й дозволило послабити залежність від §Mамериканців§!. Залучення §xіноземних§! §Mінвесторів§! до промисловости й туризму також сприяло економічному піднесенню, яке згодом назвуть §KМексиканським дивом§!, але водночас породило §Lнестримну корупцію§!.\n\nУ самій країні §LАлеман§! зміцнював свою владу за допомогою таємної поліції - новоствореного §qФедерального управління безпеки§!. Проте чи не найбільшим його досягненням стало перетворення §nП§!§WМ§!§xР§! на §nІнституційно§!-§Wреволюційну§! §xпартію§! та остаточне утвердження §KМексики§! як фактично §nдержави §Wз однією §xпартією§!."
  MEX_CountryInfo_Content.4: "Коригування курсу"
  MEX_CountryInfo_Content_desc.4: "Після суперечливих виборів 1952 року §lАдольфо Руїс Кортінес§! вирішив відновити довіру до Революції, поклавши край надмірностям правління §LАлемана§!. Боротьба з §Lкорупцією§! та розбудова інфраструктури дозволили §lРуїсу Кортінесу§! підтримувати §KМексиканське диво§!. Проте було очевидно, що цього замало.\n\nВід 1958 року §EАдольфо Лопес Матеос§! править країною, вміло чергуючи §iпряник§! із §qбатогом§!: популістські заходи супроводжуються жорстоким придушенням незгодних. Він вивів §KМексику§! на світову арену, представляючи її як §wосередок нейтралітету та розсудливости§!. Однак його задумам ще належить пройти через суворі випробування."

  #102
  MEX_CountryInfo_Folder.102: "Левіятан"
  MEX_CountryInfo_Content.5: "Партійний аванґард"
  MEX_CountryInfo_Content_desc.5: "Якщо §nІ§!§WР§!§xП§! і має якусь «ідеологію», то вона зводиться до підтримання §qпорядку§! за допомогою §Vлівопопулістських подачок§!, §nдержавного капіталізму§! та §sжорстоких репресій§!. Уособленням такої політики є друга за впливовістю людина в §KМексиці§! - міністр внутрішніх справ §QҐуставо Діас Ордас§!. Його посада дає йому змогу використовувати §qдержавний апарат§! для забезпечення лояльности та придушення §eінакодумства§!.\n\nЩоб перемагати на виборах і водночас зберігати бодай видимість легітимности, такому ймовірному наступникові президента, як §QОрдас§!, необхідна підтримка §nпартій§!§Wної§! §xструктури§!. За її роботу відповідає §dАльфонсо Корона дель Росаль§! - колишній генерал та очільник §nІ§!§WР§!§xП§!. Саме завдяки таким досвідченим §sпартійним функціонерам§! §OРеволюція§! не звертає зі свого курсу."
  MEX_CountryInfo_Content.6: "Технократи"
  MEX_CountryInfo_Content_desc.6: "§KЕкономічне зростання§!, завдяки якому §nІ§!§WР§!§xП§! зміцнила свою владу, є передусім заслугою однієї людини - міністра фінансів §iАнтоніо Ортіса Мени§!. Один уряд за іншим надавав йому свободу дій в управлінні §Mекономікою§!, дозволяючи проводити політику §Kдержавного капіталізму§!, орієнтованого на експорт. Цей підхід виявився надзвичайно успішним, забезпечивши §iстабільний розвиток§! - §Kстале економічне зростання§! за низької §Rінфляції§!.\n\nПроте §KМексика§! досі потерпає від гострої §jбідности та політики, що стримує економічне зростання§!. Міністр торгівлі §VРауль Салінас Лосано§!, зокрема, переконаний, що §Kпрагнення до політичної вигоди§! заважає §KМексиці§! досягти §Mповноцінного розвитку§!. На його думку, §OРеволюція§! потребує переосмислення: замість порожніх гасел слід зосередитися на §Mреальних економічних здобутках§!. А §Sугоди з іноземними державами§! можуть бути взаємовигідними й не обов'язково вимагатимуть поступок §Kсуверенітетом Мексики§!."
  MEX_CountryInfo_Content.7: "Карденістський рух"
  MEX_CountryInfo_Content_desc.7: "Попри зміни в §OРеволюції§! та конституційну заборону переобрання, §OЛасаро Карденас§! досі користується величезною популярністю, особливо серед §rселян§!, про яких він ніколи не забував. Він залишається найвизначнішим противником §iпоправіння§! §nпартій§!§Wного§! §xкурсу§!. Його новий маніфест із закликом повернутися до соціялізму здобув широку підтримку.\n\n§PІнтелектуали§! та §rселянські об'єднання§! певною мірою задоволені здобутками §KМексиканського дива§!, проте переконані, що цього замало. Зростання §dмайнової нерівности§!, повсюдна §Lкорупція§! та §eтяжке становище§! села дедалі більше посилюють їхній вплив. Ще 1952 року вони кинули виклик усталеній системі, підтримавши ліву опозицію. Їхня боротьба та вимоги можуть породити §Kновий голос§! §OРеволюції§!."
  MEX_CountryInfo_Content.8: "Меч Левіятана"
  MEX_CountryInfo_Content_desc.8: "У багатьох §Mдемократіях§! правоохоронні органи зберігають бодай певну неупередженість, проте §qслужби безпеки§! §KМексики§! фактично є ще одним неофіційним знаряддям §nІ§!§WР§!§xП§!. Від §Lкорумпованої місцевої поліції§! до могутнього §qФедерального управління безпеки§! - по всій країні фактично діє неофіційна §rполіційна держава§!. Силовики підпорядковуються лише губернаторам своїх штатів, а ті, своєю чергою, - президентові.\n\nНавіть саме суспільство перебуває під впливом корпоратистської системи §nІ§!§WР§!§xП§!. Попри формально §xвільні профспілки§!, §RКонфедерація трудящих Мексики§! завдяки §Kзв'язкам із партією§! майже монополізувала організований робітничий рух. Натомість вона забезпечує участь своїх §Jчленів§! у виборах, голоси на яких підраховують - знову ж таки - §Kдержавні органи§!, підконтрольні §nІ§!§WР§!§xП§!. Селянство та інші верстви населення також мають подібні організації, що зміцнюють владу партії як на загальнодержавному рівні, так і в окремих штатах."
  MEX_CountryInfo_Content.9: "Поза партійними лещатами"
  MEX_CountryInfo_Content_desc.9: "Формально §nІ§!§WР§!§xП§! керує країною як коаліція різних політичних і суспільних сил. Проте насправді ці об'єднання майже позбавлені самостійности й фактично слугують придатками державного апарату. Єдиною §Oзаконною§! альтернативою §nІ§!§WР§!§xП§! залишається §QПартія національної дії§!. Вона представляє тих, хто опинився за межами §Vкорпоратистської системи§! §nІ§!§WР§!§xП§!, і щиро обстоює ідею §Mдемократичної Мексики§!. Проте існування цієї слабкої опозиційної партії допускають лише задля того, щоб надати §fмексиканському урядові§! бодай видимости §Oлегітимности§!.\n\nПоза законом залишаються ще §Wрадикальніші угруповання§!: заборонена §eМексиканська комуністична партія§! та §Rрізноманітні ліві рухи§!, тоді як прихильники правих поглядів гуртуються навколо §oНаціонального синархістського союзу§!. Однак §qрепресії та перекриті шляхи до влади§! означають, що на них чекає довга й тяжка боротьба за здійснення своїх цілей."

 ### ECONOMIC DATA
  CountryInfo_tab_name_2: "Економічні дані"
  CountryInfo_Economic.1: "Економічні дані"
  CountryInfo_Economic.2: "Огляд"
 
  CountryInfo_Economic_Overview_GER: "Економіка зазнала краху"
  CountryInfo_Economic_Overview_ITA: "На початку 1962 року §nІталійська імперія§! опинилася у скрутному становищі.\n\nХоч §Wкорпоратистська§! економіка Італії, безперечно, почувається значно краще за судомний труп §rнімецької§! економіки після біржового краху п'ятдесятих років, її підточують §Rзастарілі§! методи виробництва, §Rбрак§! приватних інвестицій, а також §Rкорупція§! та §Rкумівство§! в наглядових органах. Безробіття зростає. І хоча нафта з родовищ Затоки допомагає втримувати бюджет на плаву й дозволяє Італії фінансувати масштабні програми субсидування, державний борг збільшується §Rтривожними темпами§!."
  CountryInfo_Economic_Overview_IRE: "В Ірляндії панує §fекономіка вільного ринку§!, за якої підприємства можуть працювати майже без державного втручання, а то й зовсім без нього. Ступінь державного регулювання, покликаного стримувати свавілля корпорацій, залежить від чинного уряду. Проте для Ірляндії значно важливіше те, що вона є Бюндніспартнером - союзним партнером Райху. Ірляндська економіка тісно пов'язана з німецькою. Через жорстоке поводження німців з ірляндськими робітниками на фабриках вплив Райху на країну дедалі частіше викликає невдоволення. Водночас німецька присутність забезпечує Ірляндії значні інвестиції.\n\n§pНаглядова рада керівників воєнної економіки в Ірляндії§!, або скорочено Адвіл, - головний орган, що опікується німецькими інвестиціями в Ірляндії, а також один з основних важелів економічного впливу Райху. З одного боку, Адвіл забезпечує Ірляндії нібито «безкоштовні» кошти для фінансування державних проєктів. З іншого - варто лише надто розгнівити інвесторів, і вони можуть вивести свої капітали, залишивши країну в злиднях."
  CountryInfo_Economic_Overview_IBR: "Економіка Іберії ґрунтується на принципах дирижизму - системи, за якої держава безперешкодно визначає напрям економічного розвитку та використовує його здобутки у власних інтересах. Для цього уряд Іберії планує та здійснює свої проєкти, спираючись на встановлені квоти, економічні прогнози й тісну співпрацю з численними корпораціями, що становлять важливу частину державної системи.\n\nСільське господарство перебуває в занепаді через застій, спричинений репресивною політикою. Значна частина населення досі змушена тяжко працювати на землі, що стримує індустріялізацію. Умови життя на селі різняться, проте найбідніші райони потерпають від крайньої бідности та нестачі найнеобхідніших державних послуг. Іспанія залишається промисловим осередком Союзу, а більшість корпорацій перебуває у сфері впливу Мадрида. Португалія ж досі відіграє провідну роль у світовій торгівлі, хоча її значення в цій царині зменшилося після відступу Іберії зі світової арени."

  CountryInfo_Economic_Overview_JAP: "Економіка Японської імперії ґрунтується на принципах §hдирижизму§!. Сама назва цього підходу походить від слова «спрямовувати»: держава активно втручається в роботу вільного ринку, визначаючи напрям його розвитку та змушуючи учасників ринку діяти відповідно до її волі. Утім, це не означає запровадження планової економіки на зразок тієї, яку Сталін прагнув побудувати в колишньому §VСовєцькому Союзі§!. Навпаки, приватний сектор відіграє тут не меншу, а подекуди й більшу роль, ніж в економіці вільного ринку.\n\nУ Японії така система сприяла піднесенню §Kдзайбацу§!, як-от §xМіцубіші§!, - могутніх корпорацій, що нагадують спадкові династії та завдяки вертикально інтегрованим монополіям контролюють величезні сектори економіки. Вони зосередили у своїх руках значну економічну владу. У відповідь японські «малі» підприємства почали об'єднуватися в неформальні союзи, відомі як §dкейрецу§!, щоб протистояти дедалі ширшому пануванню дзайбацу."

  CountryInfo_Economic_Overview_ENG: "У Королівстві Англія панує §Kекономіка вільного ринку§!, за якої підприємства можуть провадити свою діяльність майже без державного регулювання, а то й зовсім без нього. Хоч ступінь такого регулювання різниться залежно від країни та уряду, загалом ця система передбачає значно менше втручання держави в економіку.\n\nЕкономіка Англії загалом зберегла свою структуру ще з часів до окупації, проте найнагальнішою проблемою залишається §Jвідбудова§! того, що вціліло. Під час Другої світової війни країна пережила наймасштабнішу в історії Европи кампанію стратегічних бомбардувань, відому як §YБліц§!. Нальоти люфтваффе не залишили майже жодної галузі англійської промисловости неушкодженою. Брак належної відбудови призвів до подальшого зростання §Bневдоволення§! урядом та високого рівня безробіття."

  CountryInfo_Economic_Overview_SVR: "Економіка Свєрдловска побудована за моделлю §gвійськового керування економікою§!. Завдяки §gнеобмеженій владі§! над державою військове керівництво може цілковито контролювати господарську діяльність та визначати напрям економічного розвитку. Проте це не командна економіка на зразок тієї, що існувала в колишньому §VСовєцькому Союзі§!: приватне підприємництво тут дозволене, хоча §Rостаннє слово§! в ухваленні будь-яких економічних рішень залишається за військовим режимом.\n\nУ Свєрдловску військовий режим контролює залишки промисловости, яку §CБухарін§! та §eСталін§! свого часу перенесли на захід, до сибірських рівнин, і яка вціліла під час §Lтерористичних бомбардувань Люфтваффе§! у 1950-х та 1960-х роках. Порівняно з іншими державами Свєрдловск досі має доволі потужну промислову базу, що дозволяє йому поширювати свій економічний вплив далеко за межі можливостей інших держав місцевих воєначальників."
  #- Place Economic Overviews here -#

  ##Guangdong
  CountryInfo_Economic_Overview_GNG: "В основі §Sекономіки Ґуандуну§! лежить §Sкорпоративна олігархія§! - система, за якої економічне й політичне життя держави перебуває під контролем великих корпорацій. У Ґуандуні цю владу зосередили у своїх руках §Yчотири компанії§!: §YЯсуда§!, §VСоні§!, §WМацушіта електрік§! та §mФуджіцу§!.\n\nСоціяльний захист і трудові права тут навмисно обмежені, причому ще більше, ніж на самих §jЯпонських островах§!, аби корпорації могли отримувати якнайбільші прибутки. §YЧотири компанії§! фактично мають цілковиту свободу дій. Ґуандун зберігає лише той мінімум державних інституцій, який потрібен для підтримання видимости дієздатного уряду. Водночас послаблення державної влади відкриває дедалі більше можливостей для §Rкорупції§! та проникнення §Yкорпоративних інтересів§! у суспільне життя.\n\nЕкономічні успіхи Ґуандуну також нерозривно пов’язані з §mциклом виробництва електроніки§! - постійним змаганням за прихильність і гроші споживачів, яким прагнуть запропонувати §Kнайкращий товар§! за §Kнайнижчою ціною§!."

  CountryInfo_Economic_Overview_GRO: "Економіка Райхскомісаріяту Остафріка побудована за моделлю §oҐеленкте віртшафт§! - керованої економіки, що поєднує риси командної системи колишнього §RСовєцького Союзу§! та ринкового капіталізму §iСполучених Штатів Америки§!. Держава спрямовує економічний розвиток через власні ініціятиви й співпрацю з приватним підприємництвом, залучаючи до виконання своїх завдань обмежене коло перевірених корпорацій на взаємовигідних умовах.\n\nВ §jОстафріці§! господарство спирається насамперед на африканські відділення та дочірні підприємства німецьких корпорацій, що діють у Европі. Проте найбільше економіка колонії нагадує §EБурґундію§! своєю залежністю від рабської праці та жорстоко пригноблених нижчих верств населення. Саме їхня праця служить інтересам §rнечисленних обранців§! колоніяльної системи, хоча навіть вони ледве зводять кінці з кінцями в суворих умовах Східної Африки."

  CountryInfo_Economic_Overview_ANG: "Економіка Райхскомісаріяту Зюдвестафріка побудована за моделлю §oҐеленкте віртшафт§! - керованої економіки, що поєднує риси командної системи колишнього §RСовєцького Союзу§! та ринкового капіталізму §iСполучених Штатів Америки§!. Держава спрямовує економічний розвиток через власні ініціятиви й співпрацю з приватним підприємництвом, залучаючи до виконання своїх завдань обмежене коло перевірених корпорацій на взаємовигідних умовах.\n\nОднак у §mЗюдвестафріці§! влада навіть не надто переймається видимістю германізації повністю підконтрольних їй територій. Натомість кошти марнують на розбудову інфраструктури Люфтваффе в Намібії, виправдовуючи ці витрати вибухонебезпечним становищем у §JПівденній Африці§!. Насправді ж посадовці Люфтваффе привласнюють гроші й лише для годиться проводять військові операції, намагаючись довести, що заслуговують на більше фінансування, ніж інші."

  CountryInfo_Economic_Overview_COG: "Економіка Райхскомісаріяту Центральафріка побудована за моделлю §oҐеленкте віртшафт§! - керованої економіки, що поєднує риси командної системи колишнього §RСовєцького Союзу§! та ринкового капіталізму §iСполучених Штатів Америки§!. Держава спрямовує економічний розвиток через власні ініціятиви й співпрацю з приватним підприємництвом, залучаючи до виконання своїх завдань обмежене коло перевірених корпорацій на взаємовигідних умовах.\n\nНасправді Центральафріка для Мюллера - не так колонія, як власна §yкрамниця солодощів§!, де він може брати все, чого душа забажає, і складати собі до кишені. Колонія кишить підставними фірмами західних та інших §oіноземних корпорацій§!, які щедро платять Мюллеру за право викачувати природні багатства, що їх іще не поглинуло §Bозеро Конґо§!. Сам райхскомісар тим часом полює на велику дичину, залишивши всі економічні справи своїм підлеглим."

### TUTORIALS ###
