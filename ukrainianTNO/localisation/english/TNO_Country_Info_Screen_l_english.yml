 CountryInfo_Development_Content.6: "Заява про добросовісне використання"
 CountryInfo_Development_Content_desc.6: "«Новий порядок: Останні дні Европи» (далі - «цей мод») може містити матеріали, захищені авторським правом.\n\nТакі матеріали, якщо вони використовуються в моді, призначені для сприяння розумінню небезпеки фашизму, нацизму та інших форм екстремізму. Розробники моду наразі не отримують прибутку від використання матеріалів, захищених авторським правом, і не мають наміру отримувати його надалі. Відтак розробники вважають, що використання цих матеріалів підпадає під поняття «добросовісного використання», передбачене розділом 107 титулу 17 Кодексу Сполучених Штатів Америки або відповідними нормами законодавства інших юрисдикцій.\n\nЯкщо ви бажаєте використовувати матеріали, захищені авторським правом, для власних потреб, що виходять за межі «добросовісного використання» чи його відповідника у вашій юрисдикції, необхідно отримати дозвіл правовласника."
