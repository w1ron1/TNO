 ### Germany
  GER_CountryInfo_Folder.101: "Ендзіґ?"
  GER_CountryInfo_Folder.102: "Ті, хто керує"
 
  # 101
  GER_CountryInfo_Content.1: "Остаточна перемога"
  GER_CountryInfo_Content_desc.1: "За всю історію чимало людей зуміли підкорити Европу своїй волі. Октавіян Авґуст, Карл V, Наполеон. Та ніхто - ні окрема людина, ні ціла держава - не розбивав своїх ворогів так рішуче й не правив із настільки зловісними намірами, як §rАдольф Гітлер§! і §WВеликоґерманський Райх§!.\n\nПеред §WНімеччиною§! схилився весь світ, і тепер вона панує над Европою. Та справжні межі її могутности сягають далеко за державні кордони, адже немає на Землі куточка, якого не торкнулася б перемога §WРайху§! чи її наслідки. Безперешкодно сповідуючи §rнаціонал-соціялістичну§! догму, §WРайх§! упродовж останніх десятиліть невпинно прагнув досягти своїх жорстоких кінцевих цілей - створити арійську утопію, експлуатуючи та винищуючи незліченних «недолюдей», що стоять на його шляху. Та §rГітлер§! старіє, і вади цієї системи дедалі важче ігнорувати. Її невідступна, закладена в самих підвалинах жорстокість укупі із самовдоволеною некомпетентністю підірвала основи держави. Що станеться, коли зникнуть останні узи, які тримають §WРайх§! докупи?"
 
  GER_CountryInfo_Content.2: "Дер кріґ"
  GER_CountryInfo_Content_desc.2: "Найбільше випробування для §WНімеччини§! настало 1 вересня 1939 року, коли солдатські чоботи Вермахту загриміли по той бік польського кордону. За наступні два роки у вир найбільшої війни в історії було втягнуто всю Европу й землі далеко за її межами. Та найбільше спостерігачів приголомшив не розмах війни, а нищівний успіх держав Осі в боротьбі проти решти світу.\n\nПершою під натиском бліцкриґу впала Польща. Невдовзі її долю розділили численні держави Союзників. Зрештою в Европі розгорнулися дві велетенські кампанії, жорстокіші й спустошливіші за всі попередні: грандіозні битви на Східному фронті та виснажлива операція «Морський лев», що просувалася повільно й неухильно. Та навіть перед лицем цих величезних випробувань §WРайх§! залишався нездоланним. Колосальних ресурсів, кинутих на оборону Британії та Росії, виявилося замало, щоб урятувати їх від падіння, а невдовзі атомна бомба змусила Америку вийти з війни. §rГітлер§!, колись злиденний ветеран у Мюнхені, тепер тримав усю Европу в кулаці. §WРайх§! §Gздобув перемогу§!."
 
  GER_CountryInfo_Content.3: "Дер фріден"
  GER_CountryInfo_Content_desc.3: "Наприкінці 1945 року §WНімеччина§! була беззаперечною володаркою Европи. Її імперія простягалася від Марселя до Арханґєльська. На заході постали маріонеткові уряди, а на сході - жорстокі райхскомісаріяти, колоніяльні адміністрації, що поєднували нещадну експлуатацію ресурсів із кінцевою метою - геноцидним завоюванням §Rжиттєвого простору§!. Ця цілковита гегемонія лише дужче живила кровожерну, демонічну машину, водночас прискорюючи занепад §Wнімецького§! панування.\n\nТа за величезними витратами Райх не помічав ні численних §Rрозлючених ворогів§!, що гуртувалися за його кордонами, ні дедалі тривожніших фінансових звітів, ні охолодження дипломатичних відносин. Аж раптом усе посипалося - економіка зазнала краху, далекі союзники §WНімеччини§! розірвали з нею зв'язки, а незліченні війська §eЗахідноросійського революційного фронту§! ринули через східний кордон. §eЗахідноросійська війна§! §Rпочалася.§!"
 
  GER_CountryInfo_Content.4: "Дер кампф"
  GER_CountryInfo_Content_desc.4: "§eЗахідноросійська війна§! з усією заслуженою люттю зірвала позірну непереможність §WНімеччини§!. §jГеєр§!, який так довго шанували на батьківщині, зазнав нищівної поразки від §eросійських «унтерменшів»§!, гірше озброєних і забезпечених значно скромнішими ресурсами. Поки передові частини §eзахідноросійських військ§! проривали оборону, Схід поринав у цілковитий хаос. Коли §Wнімецькі§! війська залишили Паулюсбурґ, §WТисячолітній Райх§! опинився на межі небуття.\n\nЗа таких відчайдушних обставин не дивно, що §EГайнріх Гіммлер та його СС§!, які діяли з тіні, спробували захопити владу в державі. Проте §jГеєр§! викрив і зірвав змову, перш ніж вона встигла набрати повної сили. Значну частину §EСС§! було знищено або вигнано до §EОрденсштадту§!, а на Сході настав перелом. Виснажений наступом §eФронт§! зрештою вичерпав свої сили й не витримав удару реорганізованих §Wнімецьких§! військ. §WНімеччина§! вкотре врятувалася на волосину від загибелі - але прихована гниль стала явною, і викорінити її буде нелегко."
 
  GER_CountryInfo_Content.5: "Штільштанд"
  GER_CountryInfo_Content_desc.5: "§WНімецький Райх§! пережив найбільшу досі загрозу своєму існуванню, проте проблеми, що його переслідували, нікуди не зникли. Його східні володіння лежали в руїнах, а економіка занепала настільки, що навіть для повернення до застійної рівноваги економічній системі §WНімеччини§!, побудованій на рабській праці, знадобилися б роки. Тим часом Геєр використовував власні поразки як привід вимагати дедалі більших асигнувань до свого й без того роздутого бюджету, нехтуючи проблемами у власних лавах. Сам §rГітлер§! дедалі слабшав і поступово втрачав контроль над чотирма наймогутнішими підлеглими - §LБорманом§!, §OШпеєром§!, §gҐерінґом§! і §PГайдріхом§!.\n\n§GНімецький орел§! більше не ширяє в небі. Він ледве рухається вперед, пригнічений тягарем цілковитого §Rморального банкрутства§!. Корупція, марнославство й безоглядна жорстокість стали девізами його правителів, а дедалі відчайдушніший народ шукає бодай якогось виходу зі своїх бід. Ненависть, яку §WРайх§! поширював світом, нарешті обертається проти нього самого, і єдине, що досі тримає народ разом, - згасаючий, охоплений старечим маразмом §rГітлер§!. Що станеться, коли його час вичерпається?"
 
  # 102
  GER_CountryInfo_Content.6: "Той, хто при владі"
  GER_CountryInfo_Content_desc.6: "Той, хто при владі - §rФюрер§! - це §WНімеччина§!, а §WНімеччина§! - це §rФюрер§!. Такою є партійна лінія, істина, яку §rНСДАП§! нав'язала світові та яку §rГітлер§! остаточно утвердив під час §RДругої світової війни§!. Перемога принесла §WРайхові§! славу, якої він не знав майже століття: його споконвічних ворогів було розбито й розчавлено наймогутнішою воєнною машиною, яку будь-коли бачив світ. §rГітлер§! став уособленням цього тріюмфу, і досі його ім'я нерозривно пов'язане з ним, як і з §Rнезліченними злочинами, скоєними заради перемоги§!. За цим настало десятиліття §Gпроцвітання й могутности§!, коли §WРайх§! панував над світом як беззаперечний гегемон. Та згодом прийшли розпач і трагедія, коли люди побачили, як усе здобуте обертається на порох. Однак §rФюрер§! уже не помічає цього. Його очі ще бачать, а голос іще хрипить, але гострота розуму й політичне чуття згасли, а слідом за ними покидають його й сили. Незабаром найвпливовіший лідер §WНімеччини§! §Rзалишить її назавжди.§!"
  
  GER_CountryInfo_Content.7: "Ті, хто всередині"
  GER_CountryInfo_Content_desc.7: "Поза досяжністю §rГітлера§! розкинувся велетенський бюрократичний апарат, що панує в сучасній Ґерманії, роздутий і розжирілий на скривавлених багатствах. За його бетонним фасадом криється трясовина зради й безпринципного честолюбства. У цьому політичному гадючнику виживають і процвітають лише найрозумніші та найсильніші.\n\nСьогодні в керівних колах панує §LМартін Борман§! - права рука §rГітлера§!, людина з безпомилковим чуттям на владу й цілковитою відсутністю моральних принципів. Підступами та інтригами він міцно закріпився на чолі консервативної більшости. Та його становище не беззаперечне. §OАльберт Шпеєр§!, не менш вправний інтриган, став провідником тих у §WНімеччині§!, хто вимагає реформування занепалої системи.\n\nЯкби все йшло за планом, саме один із цих двох став би наступним §rФюрером§!. Проте з кожним днем дедалі очевидніше, що передача влади навряд чи мине без потрясінь."
  
  GER_CountryInfo_Content.8: "Ті, хто зовні"
  GER_CountryInfo_Content_desc.8: "Хоча за межами Ґерманії честолюбний політик має менше нагод плести інтриги й укладати вигідні угоди, нескінченні змови у Фольксгалле роблять перебування осторонь цієї трясовини по-своєму привабливим. Саме так міркують ті, хто бачить себе наступним фюрером і воліє оминути політичне болото, прокладаючи власний шлях до влади.\n\n§gГерман Ґьорінґ§!, харизматичний ас минулих років, очолив могутню фракцію §Lмілітаристів§!. Завдяки популярності серед громадян він має широку підтримку - чого аж ніяк не скажеш про §PРайнгарда Гайдріха§!, заступника очільника §EСС§!. Його вплив ґрунтується на страхові та закулісній підтримці §Eйого зверхника, Гайнріха Гіммлера§!. Хоч мало хто вважає його можливим наступним §rфюрером§!, ані Гайдріх, ані його прибічники не полишають спроб здобути владу.\n\nЦі кандидати, що тримаються осторонь владного осередку, безперечно, вірять у власні здібності керувати державою. Та, можливо, спершу їм варто пригадати свій військовий досвід."
  
  GER_CountryInfo_Content.9: "Ті, хто командує"
  GER_CountryInfo_Content_desc.9: "Політика §WРайху§! - це хаотична боротьба, у якій кожен ладен пожерти іншого, і мало кому вдається залишитися осторонь цієї колотнечі. §jГеєр§!, гордий захисник §WВітчизни§!, - не виняток. Його представники зображують себе найвидатнішими арійськими провідниками й воїнами, проте насправді військо так само загрузло в боротьбі за владу та інтригах, як і решта державного апарату.\n\nСучасний Геєр розділений переважно на два табори: §Qпоміркованих§! на чолі з §QГансом Шпайделем§! і §Lмілітаристів§! під проводом §LФердінанда Шьорнера§!. Серед прибічників §QШпайделя§! - §QГеннінґ фон Тресков і Дітріх фон Заукен§!, яких єднає протидія безцеремонним махінаціям §Lмілітаристів§!. Натомість до останніх належать §LОтто Ремер і Герман Ґьорінґ§! - завзяті, честолюбні гончаки, що прагнуть здобути славу завоюваннями.\n\nОбидва табори перебувають у непримиренному протистоянні, більше переймаючись боротьбою з внутрішніми суперниками, аніж обороною самого §WРайху§!. Та чи будуть вони готові, коли настане час?"

 ### Burgundy
  BRG_CountryInfo_Folder.101: "Чорна пляма"
  BRG_CountryInfo_Folder.102: "Механіки"

  # 101
  BRG_CountryInfo_Content.1: "Чорна пляма"
  BRG_CountryInfo_Content_desc.1: "§WСС-Орденсштадт Бурґундія§! - наймолодша держава Айнхайтспакту, нашвидкуруч створена з §Qфранцузьких§! і §Yбельгійських§! володінь Райху, щоб задобрити §Pрайхсфюрера СС Гайнріха Гіммлера§!. Під час Західноросійської війни Гіммлер спробував здійснити державний переворот проти хворого фюрера §RАдольфа Гітлера§!, якого §PГіммлер§! вважав старим дурнем, що веде Райх до хаосу. Проте §RГанс Шпайдель§! і Вермахт придушили заколот, і §RГітлер§! мусив вигадати покарання для свого колись відданого прибічника. Ним став §WОрденсштадт§! - обтяжливий дарунок, управління яким, за сподіваннями Гітлера, мало настільки поглинути СС, що їм стало б не до змов. Та як же він помилявся! Останні кілька років §PГіммлер§! зміцнював свою владу й усував з адміністрації всіх, хто не був беззастережно йому відданий. Тепер він готовий завдати нового удару й домогтися того, що не вдалося раніше. Утім, навіть найретельніше продумані плани можуть піти шкереберть..."
 
  BRG_CountryInfo_Content.2: "СС зсередини"
  BRG_CountryInfo_Content_desc.2: "В §WОрденсштадті§! панують СС, віддані передусім §PГіммлерові§!. Та навіть він не може правити одноосібно. Поряд із німецькими есесівцями діють численні колябораціоністи: §YСС-Леґіон Валлонієн§! під проводом валлонця §RЛеона Деґрелля§!, §OСС-Леґіон Ланґемарк§! на чолі з фламандцем §RБертом Ерікссоном§! і §QСС-Дивізія Шарлемань§! під командуванням француза §RКрістіана де ла Мазьєра§!. Усі ці угруповання ненавидять одне одного й змагаються за владу, то намагаючись відтіснити суперників, то погрожуючи підірвати панування §Pрайхсфюрера СС§!. Якщо Гіммлер сподівається досягти успіху, §Rколябораціоністів доведеться тримати на короткому повідку§!."
 
  BRG_CountryInfo_Content.3: "СС поза Бурґундією"
  BRG_CountryInfo_Content_desc.3: "На щастя, не всі в Райху вороги. §gРайнгард Гайдріх§! залишається так само відданим §PГіммлерові§!, як і раніше. А головне - він перебуває в Ґерманії, очолює німецькі СС, а до його слів дослухається §RГітлер§!. Ні для кого не секрет, що старому фюрерові залишилося недовго, тож §gГайдріх§! готовий скористатися нагодою й захопити владу, якщо великого вождя спіткає якась жахлива трагедія. Успіх Гайдріха §Gзначно прискорив би§! втілення задумів §Pрайхсфюрера СС§! щодо арійської раси..."
 
  # 102
  BRG_CountryInfo_Content.4: "Ігрові механіки"
  BRG_CountryInfo_Content_desc.4: "Керуйте §Yробочою силою§!, пильнуючи рівновагу між §WЗіхергайтсполіцаєм§! та §Wкваліфікованими робітниками§! на землях §WОрденсштадту§!.\n\n- Розпочинайте §Yрозслідування§! проти §Rзрадників§!, які можуть переховуватися в лавах Ваффен-СС.\n\nДоведіть історію §qЧорної плями§! Европи до §eзавершення§!."
  
  BRG_CountryInfo_Content.5: "Робоча сила"
  BRG_CountryInfo_Content_desc.5: "§WСС-Орденсштадт Бурґундія§! не чекатиме покірно, доки робітники самохіть візьмуться до праці, - він §Vнаказує§!! §YРобочу силу§! становлять §Wкваліфіковані робітники§!, силоміць відірвані від рідних домівок і обернені на рабів. Їх використовують задля вищих інтересів держави, яких не задовольнити звичайною примусовою працею. Робочою силою слід ретельно керувати, щоб підтримувати рівновагу між пригнобленими та їхніми гнобителями. Їх можна, немов худобу, переводити з резерву до будь-якого регіону, проте слід пильнувати, щоб вони не опинилися там, де бракує поліційного нагляду.\n\nТим часом §WЗіхергайтсполіцай§! є мечем і щитом держави: без нього неможливо змусити кваліфікованих робітників виконувати накази. Його підрозділи також можна перекидати з резервних казарм до регіонів, де вони потрібні."
  
  BRG_CountryInfo_Content.6: "Розслідування"
  BRG_CountryInfo_Content_desc.6: "Хоч §EСС§! і вважають себе вершиною арійського відродження, у їхніх лавах тече не лише німецька кров. Валлони, фламандці та французи теж повернулися до европейської родини - та чи це так?\n\nРозпочніть §Yрозслідування§! щодо очільників §YСС-Леґіону Валлонієн§!, §OСС-Леґіону Ланґемарк§! та §QСС-Дивізії Шарлемань§! - збирайте докази, пильно стежте за тим, що діється в тіні, й забезпечте вічне панування §Pрайхсфюрера СС§!. Інакше §Rсамозванці§!, які причаїлися серед нас під личиною відданих націонал-соціялістів, завдадуть удару, коли ми найменше цього очікуватимемо."
  
  BRG_CountryInfo_Content.7: "Економіка"
  BRG_CountryInfo_Content_desc.7: "§RЛише дурень повівся б на юдео-большевицьке збочення, яким є організована економіка.§!"
  
 # ITALY
  ITA_CountryInfo_Folder.101: "Події до ДСВ"
  ITA_CountryInfo_Folder.102: "ДСВ"
  ITA_CountryInfo_Folder.103: "Післявоєнна Італія"
  ITA_CountryInfo_Folder.104: "Становище 1962 року"

  #101 - Introduction
  ITA_CountryInfo_Content.1: "Вступ"
  ITA_CountryInfo_Content_desc.1: "§nІталійська імперія§!, чиї володіння простягаються на трьох континентах, посідає чільне місце в Середземномор'ї. Це одна з провідних европейських держав і фактичний очільник §KТріумвірату§! - військового союзу, до якого також належать §wІберійський союз§! та §VРеспубліка Туреччина§!.\n\nПоступаючись у Европі за економічною та військовою могутністю лише §rНімецькому Райхові§!, §nІталія§! веде запеклу боротьбу зі своїм колишнім союзником за панування над Південною Европою. Водночас §nІталія§! поєднує дві політичні системи: конституційну монархію на чолі з §mУмберто II§!, імператором Етіопії та королем Італії, Албанії й Тунісу, та однопартійну державу, якою править залізною рукою §BҐалеаццо Чано§!, дуче фашизму й прем'єр-міністр §nІталійської імперії§!.\n\nДержавна пропаганда змальовує імперію стабільною та процвітаючою, однак насправді все §Rкуди менш райдужно§!. Як до цього дійшло? Як §nІталія§! спромоглася стати §Wчетвертою світовою потугою§!, щоб зрештою відстати й перетворитися на тінь тієї величі, до якої прагнула? Читайте далі й дізнаєтеся..."
  ITA_CountryInfo_Content.2: "Піднесення фашизму"
  ITA_CountryInfo_Content_desc.2: "Почавшись із розрізнених загонів штрайкбрехерів і головорізів, які розправлялися із синдикалістами, рух §iБеніто Муссоліні§! зрештою перетворився на §jНаціональну фашистську партію§!. Використовуючи страх перед §eкомуністичною§! агітацією та обурення через втрату Далмації на §WВерсальській конференції§!, §jНФП§! швидко поширювала свій вплив завдяки невпинній пропаганді й політичному насильству. Відчувши, що мають досить сил для захоплення влади, §jфашисти§! рушили на Рим, і наляканий §Mкороль Віктор Еммануїл III§! поспішив призначити §iМуссоліні§! прем'єр-міністром.\n\nВідтоді §iМуссоліні§! взявся перебудовувати країну відповідно до своїх мрій про могутність і славу. §nІталія§! перетворилася на §Wтоталітарну§!, §Wкорпоратистську§! й §Wмілітаристську§! державу, чиї засади влучно підсумовувало гасло «Усе в Державі, нічого поза Державою, нічого проти Держави». Водночас вона стала на шлях експансії, вершиною якої були вторгнення до §WЕтіопії§! та її жорстоке загарбання."
  #102 - WWII
  ITA_CountryInfo_Content.3: "Повільний початок"
  ITA_CountryInfo_Content_desc.3: "Об\'єднані спільною боротьбою проти §eкомунізму§! та занепадницької §Dліберальної демократії§!, фашистська Італія й §rнацистська Німеччина§! дедалі більше зближувалися. Попри спротив кількох визначних італійських фашистів, Італія вступила в §WДругу світову війну§!, прагнучи силою зброї утвердити свої історичні права на Далмацію.\n\nУсупереч гучним заявам, від самого початку війна складалася для італійських збройних сил невдало. Погано оснащене й невміло кероване королівське військо зазнавало труднощів під час вторгнення до §WФранції§!, загрузло в наступі на §WЄгипет§! і відразу перейшло до оборони у §WСхідній Африці§!. Тим часом королівський флот значно поступався британському за чисельністю та вогневою потугою. Щоб виправити це ганебне становище, знадобилися місяці болісних уроків і чимала §rнімецька§! допомога. Війна в §WМаре Нострум§! завершилася поблизу Кіпру, де британський Середземноморський флот, виснажений нестачею пального й боєприпасів та ослаблений багатоденними бомбардуваннями, нарешті зазнав поразки від першого італійського авіаносця, переобладнаного з іншого судна."
  ITA_CountryInfo_Content.4: "Тріюмф"
  ITA_CountryInfo_Content_desc.4: "Коли фашистський орел кинувся на §MГрецію§!, стійка §Mгрецька§! армія чинила запеклий опір на албанському кордоні. Проте панування італійського флоту на морі дало змогу обстріляти §WАтени§! й висадити там морський десант, завдавши країні нищівного удару та зрештою змусивши її капітулювати.\n\nОволодівши всіма землями, на які претендувала, Італія відрядила лише символічні сили для участи в операції «Барбаросса». Подальший §Wкрах§! §eСовєцького Союзу§!, окупація §WБританії§! та, зрештою, японське §Wядерне бомбардування§! Перл-Гарбору поклали край війні. Відтак Італія взяла участь у мирній конференції як одна з переможниць, здобувши §Wімперію§!, про яку завжди мріяла."
  #103 - Postwar Italy
  ITA_CountryInfo_Content.5: "Кінець Осі"
  ITA_CountryInfo_Content_desc.5: "Ще до війни, а згодом і під час неї, чимало людей застерігали §iМуссоліні§! від небезпек союзу з §rНімеччиною§!. Проте дуче не дослухався до них, твердо вирішивши забезпечити Італії місце за столом мирних переговорів. Утім, у перші повоєнні роки його ставлення швидко змінилося.\n\nПершою тріщиною в §rОсі§! стали плани §rнімецького§! вторгнення до §WШвайцарії§!. Маленька альпійська країна, останній бастіон демократії в Европі, була надто вже великим більмом на оці Гітлера. Саме тоді §iМуссоліні§! збагнув, що §rнімці§! готуються оточити Італію та перетворити її на чергову маріонетку. Укладений згодом §WДоговір у Кампйоне-д\'Італія§!, який містив офіційні італійські §Wгарантії§! незалежности Швайцарії, забезпечив Італії цінну буферну державу, але водночас розлютив §rРайх§!.\n\nПоволі, але невпинно союз роз\'їдали внутрішні чвари. Питання §Wусташів§!, обурення §rНімеччини§! відкриттям §Wнафтових§! родовищ у Затоці, прикордонна суперечка в §WКенії§! та безліч інших розбіжностей завдали Осі тисячі дрібних ран, від яких вона зрештою загинула."
  ITA_CountryInfo_Content.6: "Народження Тріумвірату"
  ITA_CountryInfo_Content_desc.6: "У міру загострення відносин із §rРайхом§! старіючий §iБеніто Муссоліні§! дедалі більше побоювався війни з §rНімеччиною§!. Тож він доручив §BҐалеаццо Чано§!, тодішньому міністрові закордонних справ, знайти союзників. Так постав §KТріумвірат§!.\n\nСпершу до союзу ввійшли Італія та §WТуреччина§!, яку також непокоїла §rнімецька§! експансія в §WКавказієні§! та на §WЧорному морі§!. У 1957 році до них приєдналася §WІберія§!. §KТріумвірат§!, військовий та економічний альянс, мав забезпечити взаємну оборону й спільне панування над Південною Европою.\n\nПочаток п'ятдесятих років став §Wзолотою добою§! §nІталійської імперії§!. Під захистом союзників і завдяки багатим нафтовим родовищам, які §WЕнріко Маттеї§! та його компанія §WЕНІ§! відкрили в Губернаторстві Затоки, італійська економіка зростала, а разом із нею - і могутність держави. Проте саме тоді було посіяно зерна майбутніх §Rнегараздів§!: достаток породжує §Rмарнотратство§!, а марнотратство - §Rкорупцію§!."
  ITA_CountryInfo_Content.7: "Клопоти нового дуче"
  ITA_CountryInfo_Content_desc.7: "§iБеніто Муссоліні§! мирно відійшов із життя 1953 року, передавши титул дуче своєму обраному наступникові, §BҐалеаццо Чано§!. Коли харизматичний засновник фашизму перестав стояти на чолі держави, на її фасаді почали проступати тріщини. Помилок §iМуссоліні§! він не бажав виправляти - ба більше, §BЧано§! узагалі відмовлявся визнавати їх помилками. Так Італія опинилася у вирі економічного й політичного §Rзанепаду§!.\n\nНамагаючись утримати владу в країні, де дедалі більше сумнівалися у здібностях свого керманича, §BЧано§! посилював §Wрепресії§! та наповнював державний апарат §Wпідлабузниками§! й §Wлизоблюдами§!. Нелояльних чи просто незручних чиновників регулярно спроваджували подалі від метрополії: до колоній або дипломатичними представниками в залежні від Італії держави. Проте навіть найвідданіші посіпаки не здатні розв'язати §Rвсіх проблем держави§!."
  #104 - Situation in 1962
  ITA_CountryInfo_Content.8: "Імперія"
  ITA_CountryInfo_Content_desc.8: "Колоніяльна імперія далека від стабільности. З кожним днем §Rзаворушення§! набирають сили, а §Rнечисленні§! гарнізони дедалі слабше контролюють підвладні території. §WВіцекороль Амадео Савойський§! завдяки особистій харизмі, що викликає повагу навіть серед місцевого населення, досі тримає корабель на плаву. Проте невдовзі становище може виявитися непосильним навіть для старіючого героя Амба-Алаґі.\n\n§KТріумвірат§! поступово перейняв ті самі вади, що колись згубили §rВісь§!. Італія майже не приховує свого прагнення стати для інших учасників §KТріумвірату§! чимось більшим за «primus inter pares» - першого серед рівних. До того ж постійні чвари між Італією та Туреччиною через §WЛевант§! становлять дедалі серйознішу проблему.\n\nУ строкатій мозаїці §Wмаріонеткових держав§! і §Wзалежних режимів§!, що постали в італійській сфері впливу після Другої світової війни, наростає невдоволення. У §WХорватії§! та §WГреції§! колябораціоністські уряди ледве втримують владу над столицями й найбільшими містами, тимчасом як §WЄгипет§! та §WІрак§! дедалі гостріше сприймають економічне й політичне панування Італії."
  ITA_CountryInfo_Content.9: "Політика"
  ITA_CountryInfo_Content_desc.9: "Навіть усередині держави становище §BҐалеаццо Чано§! при владі аж ніяк не міцне. Безпорадне правління дуче налаштувало проти нього значну частину §jНаціональної фашистської партії§!, і дедалі частіше лунають розмови про близький кінець §Bйого правління§!. Якщо ці передбачення справдяться, §Wсаму сутність фашизму§! можуть спіткати докорінні зміни.\n\nТим часом імператор розставляє власні тенета впливу. §mУмберто II§!, якого обожнюють народ і військо, поволі готується кинути виклик дуче - та чи це так? У політичних питаннях імператор мовчазний, мов його охоронці-кораццієрі. Але, як кажуть, тиха вода греблю рве...\n\nПопри всі негаразди, §nІталійська імперія§! залишається могутньою державою. Маючи §Wрозвинену економіку§!, §Wсильне військо§! й §Wрозлогу сферу впливу§!, Італія ще не ступила на шлях незворотного занепаду й цілком здатна повернути собі місце серед держав, що визначають долю світу. Потрібен лише той, хто §Wвізьме кермо до рук§!, покладе край застоєві та принесе давно назрілі зміни до Країни перехрещених доль."

 # NOVOSIBIRSK

  #101
  NOV_CountryInfo_Folder.101: "Соколине гніздо"
  NOV_CountryInfo_Content.1: "Сибірський сокіл"
  NOV_CountryInfo_Content_desc.1: "З попелу Центральносибірської республіки та Сибірського плану - промислового дітища Бухаріна - постає §WФедерація§!.\n\nКоли §Rанархісти, соціялісти§! й зрештою §Rнавіжені прихильники середньовічних порядків§! розшматували Республіку, а безпорадні урядові ідеалісти виявилися нездатними дати належну відсіч, льотчик-ас і колишній маршал авіяції Республіки §WАлєксандр Покришкін§!, відомий як «Сибірський сокіл», узяв справу до своїх рук. Проголосивши незалежність від центрального уряду, він оголосив себе президентом §WНовосібірска§!, промислової столиці Сибіру, та прилеглих земель. Невдовзі до нього приєднався §WАлтай§!, який також проголосив незалежність."
  NOV_CountryInfo_Content.2: "Силовики"
  NOV_CountryInfo_Content_desc.2: "За наступні роки §WПокришкін§! заклав у Новосібірску міцні підвалини своєї держави. Хоч його режим доволі авторитарний, а в адміністрації панують §Gсиловики§! - політики, що походять із військових кіл та служб безпеки, - він забезпечив величезному населенню підвладних територій захист від численних ворожих сил цього неспокійного регіону.\n\nЗавдяки цьому стало можливим стрімке економічне зростання, яке, своєю чергою, сприяло появі §Gнаціональних конгломератів§! - велетенських компаній, що дедалі сильніше впливають на молоду державу. Багато хто вітає ці зміни, сподіваючись на обіцяне багатство, проте інші засуджують дедалі більшу концентрацію влади та посилення авторитаризму, які підтримують прихильники цих компаній серед §Gсиловиків§!."

  #102
  NOV_CountryInfo_Folder.102: "Виховати орла"
  NOV_CountryInfo_Content.3: "Васілій Шукшин"
  NOV_CountryInfo_Content_desc.3: "Ніхто не виступає проти §Gпанування силовиків§! у Федерації так рішуче, як §WВасілій Шукшин§!, мер Барнаула й друга за впливом людина у §WФедерації§! після самого §WПокришкіна§!.\n\nНадзвичайно популярний серед простого люду, він обіцяє стати кісткою в горлі всім, хто намагатиметься й надалі обмежувати свободи заради інтересів промисловців чи §Gсиловиків§!. Та поряд із внутрішніми викликами на Федерацію чекає чимало зовнішніх загроз."
  NOV_CountryInfo_Content.4: "Не просто провінція"
  NOV_CountryInfo_Content_desc.4: "Та поряд із внутрішніми викликами на Федерацію чекає чимало §Rзовнішніх загроз§!.\n\n§WНовосібірск§! - ласий шматок, заради якого будь-хто в Сибіру ладен убивати. І вбиватиме. Щоб §WФедерація§! пережила прийдешню бурю, її керівництво мусить скористатися перевагами географічного розташування, промисловости та людських ресурсів. Інакше Федерація §Rризикує перетворитися на звичайну провінцію іншої держави.§!"

 # KEMEROVO

  #101
  KEM_CountryInfo_Folder.101: "Наш клаптик Сибіру"
  KEM_CountryInfo_Content.1: "Генералова вотчина"
  KEM_CountryInfo_Content_desc.1: "Не дивно, що численні поразки Росії зламали дух її народу. Сибір кишить §Rвоєначальниками-націоналістами, залишками Червоної армії та фашистами§!... А ще тут є §WКємєрово§!.\n\nКолись ці землі належали до §RЦентральносибірської республіки§!, проте §RСибірські війни§! знищили останні рештки порядку. І коли горді мужі здіймали над містами власні прапори, проголошуючи незалежність від центральної влади, §Wгенерал-майор Ніколай Івановіч Крилов§! здобув собі вотчину для здійснення власних задумів."

  #102
  KEM_CountryInfo_Folder.102: "Тягар короля"
  KEM_CountryInfo_Content.2: "Серп, молот і... корона?"
  KEM_CountryInfo_Content_desc.2: "Сибірське царство сповідує дивну доктрину: зберігає окремі елементи соціялізму, як-от профспілки, поєднуючи їх із середньовічною естетикою та ринковою економікою. Сам §Gгенерал Крилов§! тепер величає себе §WРюриком II§! - на честь варяга, який заснував давню Новгородську державу.\n\nЙого прибічники губляться в здогадах: чи то жорстокі випробування, що випали на долю Росії, остаточно позбавили генерала глузду, чи вся ця вистава - відчайдушна спроба заручитися народною підтримкою."
  KEM_CountryInfo_Content.3: "Юрій і Лідія"
  KEM_CountryInfo_Content_desc.3: "Сторонньому спостерігачеві §Wкнязівство§! видається непередбачуваним утворенням без чіткої мети, яке поставило перед собою нездійсненне завдання - відродити колишню Російську імперію. Проте за вчинками §Wцаря Рюрика II§! стоять двоє його дітей: §Wспадкоємний князь Юрій§! та §Wкняжна Лідія§!, які вміло спрямовують батькову політику. Юрій здобув прихильність селян як реформатор і популіст, тимчасом як Лідія дедалі популярніша серед військових і царської гвардії.\n\nТа §Rспадкоємець престолу може бути лише один§!, і жоден із дітей не дозволить родинним зв’язкам стати на шляху до §Gкорони§!."
  KEM_CountryInfo_Content.4: "Божевілля чи план?"
  KEM_CountryInfo_Content_desc.4: "Щоб §Wкнязівство Кємєрово§! пережило цю темну добу, йому доведеться обережно маневрувати серед сибірських держав. §RЗаколотники Красноярска§! з кожним днем здійснюють дедалі більше набігів, §Rсокіл із Новосібірска§! жадає нової здобичі, а далі причаїлася §RСибірська чорна армія§!, яка вже колись завдала поразки царю. Навіть удома невдоволені робітники тяжко працюють на залишках §GСибірського плану§!, а тим часом ширяться чутки про підбурювання та заклики до §Rреволюції§!.\n\n§WЦар Рюрик II§! або й справді божевільний, або має план, як вижити."

 # SIBERIAN BLACK ARMY

  #101
  SBA_CountryInfo_Folder.101: "Сини анархії"
  SBA_CountryInfo_Content.1: "Повстання"
  SBA_CountryInfo_Content_desc.1: "Затиснуті між §gОрлом§! і §RМолотом§!, жителі прикордоння §gЦентрального Сибіру§! та §RДалекого Сходу§! страждали від нескінченної війни, у якій чимдалі більше людей посилали на смерть заради задумів своїх вождів. Поки тривала боротьба між двома велетнями, почали ширитися перші пошепки про §eальтернативу§!. §eПьотр Сіуда§!, §eанархіст§! і вправний промовець, палко виступав перед земляками, закликаючи покласти край війні й звільнитися від влади тих, хто посилає людей на смерть. Його слова швидко знайшли відгук у народі, і виснажені війною люди почали вимагати §eпокласти край усім формам гноблення§!.\n\nҐрунт для повстання було підготовлено, і зрештою народ повстав проти гнобителів та скинув із себе кайдани. Та самого §eзапалу§! замало, щоб здобути свободу: без §qдостатньої кількости зброї та бійців§! повстання навряд чи могло увінчатися успіхом..."
  SBA_CountryInfo_Content.2: "Несподіваний союз"
  SBA_CountryInfo_Content_desc.2: "Доля часом робить дивовижні повороти. За інших обставин §qгенерал Іван Стєпанов§!, який служив у §gвійську Центральносибірської республіки§!, найімовірніше побачив би Сіуду лише крізь приціл гвинтівки. Проте завдяки чистій випадковості їм удалося домовитися: Стєпанов забезпечить §qвійськову силу§!, а Сіуда - §eпідтримку народу§!. Солдати Стєпанова стануть кістяком нової §qЧорної армії§!, здатної захистити §eкомуни§! від зазіхань сусідніх держав.\n\nЗавдяки військовій потузі генерала §eВільна територія§! нарешті утвердилася як незалежний край, непідвладний жодній державі. Поки великі держави на сході й заході розпадалися на володіння воєначальників, мешканці Канска та навколишніх комун нарешті здобули мир і достаток. Тепер §qвійськовим§! та §eідейним§! провідникам Вільної території належить подбати, щоб цей мир і достаток не виявилися скороминущими."

  #102
  SBA_CountryInfo_Folder.102: "Невизначений шлях"
  SBA_CountryInfo_Content.3: "Територія суперечностей"
  SBA_CountryInfo_Content_desc.3: "Постала із союзу §qгенерала§! й §eанархіста§!, Вільна територія від самого початку сповнена суперечностей. Попри свої анархістські засади, вона підпорядковується §qРаді безпеки§! - органу, до складу якого входять провідні представники Чорної армії та найшанованіші ідеологи §eЗагальних зборів§!. Більшість вважає Раду необхідним злом, адже це все-таки краще, ніж віддати комуни на поталу зовнішнім загарбникам. Натомість §eЗагальні збори§! значно ближчі до анархістських ідеалів: вони передусім слугують форумом, де представники комун можуть вільно обговорювати нагальні питання та висувати пропозиції.\n\nОчевидно, що така система не може існувати вічно. §eАнархісти§! вбачають у Раді безпеки ієрархічну установу, якої рано чи пізно доведеться позбутися, тимчасом як §qзмовники в лавах Чорної армії§! дедалі більше дратуються через неефективність Загальних зборів."
  SBA_CountryInfo_Content.4: "Пьотр Сіуда"
  SBA_CountryInfo_Content_desc.4: "§eПьотр Сіуда§! був іще студентом, коли його життя раптово пішло шкереберть. Зростаючи в §RРосії Бухаріна§!, він щодня бачив неспроможність держави, проте саме батько прищепив йому зневагу не лише до §Gцаря§! чи §jфашиста§!, а й до §Wгноблення в будь-якій формі§!, хоч би під якою личиною воно ховалося. Коли дві сибірські держави вбивали тисячі людей, аби тримати народ у покорі й розширювати власні володіння, Пьотр зрозумів: лише знищення обох держав дасть народові змогу розквітнути.\n\nНині Сіуда користується повагою багатьох, однак відкидає привілеї провідника, усвідомлюючи, що саме влада породжує паразитів. Як ідейний провідник Вільної території, він розпалює §eреволюційний запал§! народу, водночас уникаючи наказів і розпоряджень. Та чи вистачить самої відданости ідеалам, щоб зберегти те, за що він так тяжко боровся?"
  SBA_CountryInfo_Content.5: "Іван Стєпанов"
  SBA_CountryInfo_Content_desc.5: "§qГенерал Іван Стєпанов§! - передусім пристосуванець. Саме завдяки пристосуванству йому вдалося домогтися переведення із західного фронту. Воно ж допомогло йому пробитися до найвищих ешелонів влади §gЦентральносибірської республіки§!. Коли в день останнього наступу на §rІркутск§! Стєпанов дивився на своїх виснажених солдатів, він бачив за їхніми плечима десятиліття війни й жагу до миру. Та понад усе він бачив нагоду. Приєднавшись до §eповстання Сіуди§!, Стєпанов зумів покинути приречену §gРеспубліку§! й закріпитися серед фактичних керівників Вільної території, а його §qЧорна армія§! стала пліч-о-пліч із §eвільними комунами§!.\n\nПроте двовладдя в Росії ніколи не триває довго, а §qамбіції Стєпанова сягають значно далі§!, ніж роль одного з багатьох провідників. Вільна територія, можливо, й здатна відбити зовнішні загрози, та §eСіуда і його однодумці§! невдовзі переконаються: §qнайбільші загрози приходять зсередини...§!"

 # TOMSK

  #101
  TOM_CountryInfo_Folder.101: "Республіка під сумнівом"
  TOM_CountryInfo_Content.1: "Найтемніша година"
  TOM_CountryInfo_Content_desc.1: "Розпад Совєцького Союзу приніс народам Росії незліченні страждання. Та навіть у цю найтемнішу годину німецькому мілітаризмові не вдалося загасити жарини надії.\n\nУ Центральному Сибіру, який зовсім недавно почав розвиватися завдяки промисловим задумам Бухаріна, постала нова демократична російська держава - §WЦентральносибірська республіка§!."
  TOM_CountryInfo_Content.2: "Вбита мрія"
  TOM_CountryInfo_Content_desc.2: "Під проводом поета-президента §WБоріса Пастернака§! нова держава взялася закладати підвалини відродженої російської демократії - спадкоємиці тієї, яку 1918 року знищили Лєнін та його большевики.\n\nТа мрія швидко обернулася кошмаром. Не маючи виходу до моря й змоги торгувати з рештою світу, Центральний Сибір зіткнувся з тяжкими економічними труднощами. Сепаратистські настрої в Барнаулі, житниці Республіки, спричинили нестабільність і голодні бунти по всій країні.\n\nА невдовзі §RҐєнріх Яґода§! розпочав вторгнення з Далекого Сходу, ще більше погіршивши становище."
  TOM_CountryInfo_Content.3: "Лиха"
  TOM_CountryInfo_Content_desc.3: "Військове керівництво §RНовосібірска§! проголосило незалежність, посилаючись на неспроможність центрального уряду перемогти у війні та покласти край кровопролиттю. На сході від Республіки, що стрімко занепадала, відкололися §Rповстанці-анархісти§!.\n\nСпроба генерала Крилова повернути втрачені землі обернулася новими поразками після зради полковника §RАндрєєва§! та втрати §RКрасноярска§!. Зломлений невдачами, Крилов відступив до §RКємєрова§!, де в нападі божевілля проголосив себе перевтіленням давно померлого царя §RРюрика§!."
  TOM_CountryInfo_Content.4: "Титанічна боротьба"
  TOM_CountryInfo_Content_desc.4: "Попри всі негаразди, мешканці §WТомска§! та його околиць зберігали вірність центральному урядові. Президент §WПастернак§! після падіння §RКрасноярска§! призупинив вибори й оголосив про створення тимчасового уряду, щоб урятувати Республіку від розпаду. §WПастернак§! та його радники невтомно працювали над подоланням продовольчої кризи й поверненням до столиці бодай подоби нормального життя.\n\nНавіть діягноз раку не спинив президента §WПастернака§! в його титанічній боротьбі за порятунок Республіки від краху."

  #102
  TOM_CountryInfo_Folder.102: "Наші цінності"
  TOM_CountryInfo_Content.5: "Невпинний занепад"
  TOM_CountryInfo_Content_desc.5: "Попри популярність §WБоріса Пастернака§!, мешканці §WТомска§! бачать, що §WТимчасовий уряд§! спроможний лише давати раду наслідкам занепаду Республіки, а не переломити ситуацію. Проте надія ще жевріє: поет-президент уже взявся закладати нові підвалини держави. На переконання Пастернака, §WЦентральносибірську республіку§! прирекли на загибель відірваність влади від народу й неспроможність згуртувати населення навколо держави. Тому §Wвін§! розпочав працю над новою конституцією, яка дала б Республіці змогу скористатися величезним потенціялом інтелектуалів, митців і науковців §WТомска§!."
  TOM_CountryInfo_Content.6: "Сибірські Атени"
  TOM_CountryInfo_Content_desc.6: "Сибірські Атени, багаті на школи, університети й салони, задля свого відродження мають спертися на чотири найвпливовіші політичні об'єднання: консервативних §Wдекабристів§! під проводом російського медієвіста §GДмітрія Ліхачова§!; промисловців-централізаторів із §Wсалону бастильярів§! на чолі з поетом-аванґардистом §GДаніілом Хармсом§!; утопічних соціялістів композитора §GДмітрія Шостаковіча§! з §WГуманістичного товариства§!; та ліберальних технократів §GАндрєя Сахарова§! з §Wмодерністського§! салону.\n\nЗалишається лише сподіватися, що все скінчиться добре."

 # IRKUTSK

  #101
  IRK_CountryInfo_Folder.101: "Тимчасовий керівник"
  IRK_CountryInfo_Content.1: "Зганьблений договір"
  IRK_CountryInfo_Content_desc.1: "30 грудня 1922 року Договором про створення СССР було засновано Совєцький Союз. Спершу до його складу входили Російська, Українська, Білоруська та Закавказька республіки. Станом на 1 січня 1962 року, через певні технічні труднощі, влада Совєцького Союзу поширюється лише на §WІркутску§! область. Коли Москва впала під натиском §Rнацистів§!, генеральний секретар §wНіколай Бухарін§! зник безвісти.\n\n§WПрезидія Верховного Совєта§! невдовзі обрала директора §GНКВД§! §WҐєнріха Яґоду§! своїм тимчасовим керівником. Мудрий §WЯґода§! не гаяв часу на порятунок Президії. Під час зухвалої евакуації його моторизованим дивізіям §GНКВД§! вдалося таємно переправити совєцький уряд далеко на схід, скориставшись старою інфраструктурою Сибірського плану, аж до §WІркутска§!."
  IRK_CountryInfo_Content.2: "Прибуття"
  IRK_CountryInfo_Content_desc.2: "Прибувши до Іркутска, §WПрезидія§! спробувала відновити свою владу над колишнім Союзом, однак мало хто вірив, що старому урядові Бухаріна ще є місце в новій Росії.\n\nТим часом уряд поступово втрачав контроль над Далеким Сходом. Військові §Rдиктатори§!, місцеві сибірські §Rреакціонери§! та §rфашистські§! колябораціоністи, відомі як «§RСпадкоємці Харбіна§!», відкраювали собі власні володіння. Останнім ударом по совєцькій державі стало повстання §RВалєрія Сабліна§! в Бурятії. Колись відданий солдат, §RСаблін§! тепер показав своє справжнє обличчя - §Rутопічного ультралівого ухильника§!, який прагне перекроїти §GСовєцький Союз§! за власними наївними й інфантильними уявленнями."

  #102
  IRK_CountryInfo_Folder.102: "Загрози безпеці"
  IRK_CountryInfo_Content.3: "Президія проти партії"
  IRK_CountryInfo_Content_desc.3: "На переконання §Wгенерального секретаря Яґоди§!, причиною цього занепаду є некомпетентність §WПрезидії§!. Їхній любий §wБухарін§! довів Совєцький Союз до краху, а його посіпаки тепер повторюють усі його помилки. Тому ще від часу евакуації §WЯґода§! невпинно зміцнює віддане йому §GНКВД§!. Колись §GНКВД§! виконувало лише функції таємної поліції, проте з роками перебрало на себе дедалі більше повноважень совєцької §Gдержави§!.\n\n§WЯґода§! має §Rпротивників§! у партії, відомих як §Rпартійна фракція§!, на чолі із §RСєрґєєм Бєссоновим§! звинувачують його в тому, що §WЯґода§! руйнує совєцький пролетарський бюрократичний апарат, аби замінити його §Gвладою НКВД§!. Та навіть якщо це правда, то лише тому, що §GНКВД§! - остання сила, віддана справі §Gреволюції§! та здатна врятувати її від §Rворогів§! усередині країни й за її межами."
  IRK_CountryInfo_Content.4: "Заколот"
  IRK_CountryInfo_Content_desc.4: "§WУряд Іркутска§! є законним урядом §GСоюзу Совєцьких Соціялістичних Республік§!, навіть якщо, здається, нікому іншому до цього немає діла.\n\nЯкщо §WЯґоді§! та §WПрезидії§! вдасться придушити §Rзаколот прибічників Сабліна§! й відновити порядок на Далекому Сході та за його межами, можливо, одного дня Совєцька Росія знову §Gстане такою, якою була колись§!."

 # BURYATIA

  #101
  BRY_CountryInfo_Folder.101: "Країна - живий мрець..."
  BRY_CountryInfo_Content.1: "1924"
  BRY_CountryInfo_Content_desc.1: "30 грудня 1922 року Договір про створення СССР поклав початок Совєцькому Союзові. Більшість росіян сказали б, що Совєцький Союз загинув 1945 року, коли після виходу §Rнацистів§! на лінію А-А він розпався на частини. §RЯґода§! та його §RПрезидія§!, однак, наполягають, що Совєцький Союз ніколи не припиняв свого існування, а його законний уряд і досі перебуває в Іркутску.\n\nТа §WВалєрій Саблін§! знає, що насправді Совєцький Союз було знищено ще 1924 року, коли §yНіколай Бухарін§! переміг у боротьбі за владу після Лєніна й узявся руйнувати все, за що той боровся."
  BRY_CountryInfo_Content.2: "Вірний чудовиську"
  BRY_CountryInfo_Content_desc.2: "§WСаблін§! не завжди так вважав. Колись він був сумлінним комісаром у війську Яґоди. Він хоробро бився в §yЦентральносибірській війні§!, попри постійне втручання §RНКВД§! у справи його частини. Усе своє життя Саблін залишався відданим ідеалам Лєніна й довгі роки вірив, що §RЯґода§! та його §RПрезидія§! теж їх обстоюють.\n\nПроте роки минали, §RНКВД§! дедалі міцніше стискало у своїх лещатах совєцьку державу, і §WСаблін§! почав сумніватися, чи справді він бореться за визволення пролетаріяту."

  #102
  BRY_CountryInfo_Folder.102: "...повстає з могили"
  BRY_CountryInfo_Content.3: "Революція"
  BRY_CountryInfo_Content_desc.3: "§WВалєрій Саблін§! був не самотній у своїх переконаннях. Невдовзі він знайшов однодумців, які також ставили під сумнів владу §RЯґоди§! та дедалі могутнішого §Rапарату держбезпеки§!.\n\nСеред них були §Gбуряти§!, переконані, що політика асиміляції нищить їхню культуру; §Gбухарінці§!, які вважали §Rпанування НКВД§! несумісним із засадами Совєцького Союзу §yБухаріна§!; а також §Gжінки§!, обурені тим, що їм через стать відмовляли в рівноправному становищі в соціялістичному суспільстві.\n\nЗгуртувавши ці та інші розрізнені групи, Саблін підняв §Gреволюцію§! проти §RЯґоди§!, у ході якої встановив контроль над §WБурятією§!."
  BRY_CountryInfo_Content.4: "Визволення"
  BRY_CountryInfo_Content_desc.4: "Та що буде після §Gреволюції§!? §WСаблін§! непохитно прагне визволити Союз і принести свободу та рівність усім росіянам. Однак сам §Wвін§! ніколи не стояв на чолі держави. Навіть після визволення §RІркутска§! §Rбухарінське§! крило його руху збереже значний вплив. Тож §WСаблінові§! доведеться робити нелегкий вибір між §Gлєнінським§! ідеалізмом та §Rбухарінським§! прагматизмом. Але поки що перед ним стоїть одне завдання - покласти край тиранії §RЯґоди§!. А вже тоді можна буде розпочати відновлення §GСоюзу Совєцьких Соціялістичних Республік§!."

 # CHITA

  #101
  CHT_CountryInfo_Folder.101: "Отаман"
  CHT_CountryInfo_Content.1: "Від часів Колчака"
  CHT_CountryInfo_Content_desc.1: "У розпал §Rгромадянської війни§! §Gотаман Ґріґорій Сємьонов§! згуртував §GЗабайкальське козацьке військо§! й боровся пліч-о-пліч із тимчасовим урядом §GАлєксандра Колчака§! на §Wросійському Далекому Сході§!.\n\nТа після кількох років жорстокої §Rпартизанської війни§! §Gотаман Сємьонов§! зрештою зазнав §Rпоразки§! й був змушений покинути країну разом зі своїм військом."
  CHT_CountryInfo_Content.2: "О, Харбін!"
  CHT_CountryInfo_Content_desc.2: "Разом із тисячами інших російських емігрантів, які рятувалися від большевицького режиму, отаман оселився в маньчжурському місті Харбіні.\n\nТут рештки Білої армії плекали задуми й готувалися до дня, коли з тріюмфом перейдуть §WАмур§! і відновлять боротьбу проти §Rкомунізму§!.\n\nРік за роком їхня мрія здавалася дедалі примарнішою, аж поки дивовижний §Gкрах§! §RСовєцького Союзу§! нарешті не подарував їм довгоочікуваної нагоди."

  #102
  CHT_CountryInfo_Folder.102: "Оплот білих"
  CHT_CountryInfo_Content.3: "Банкет"
  CHT_CountryInfo_Content_desc.3: "Нині рештки §GБілої армії§! та §GЗабайкальського козацького війська§! знову отаборилися у своїй давній твердині - §GЧіті§!. Номінально цією невеличкою державою править §GМіхаіл II§!, відомий також як §GМайкл Андрєєвіч Романов§!.\n\nЙого запросили до §WХарбіна§! нібито на §Wурочистий бенкет§!, проте натомість він опинився втягнутим у §Wзухвалу змову§! старих §Gбілих§!, які прагнули посадити представника династії §GРоманових§! на престол §WРосії§!, хоча §Rзаконних прав на нього Міхаіл не мав§!."
  CHT_CountryInfo_Content.4: "Іграшка військових"
  CHT_CountryInfo_Content_desc.4: "Нині §GМіхаіл II§! - не більш як §Wмаріонетка§!, а справжні важелі влади перебувають у руках §GҐріґорія Сємьонова§! та його найближчого помічника §GБоріса Шепунова§!. Попри те, що §Gцар§! став новим обличчям §GБілого руху§!, він зовсім не бажає залишатися в §WРосії§! та сподівається, що одного дня зможе повернутися додому.\n\nОпинившись у пастці на чужині, далеко від дому, Міхаіл потрапив у становище, що видається справді безнадійним..."
  CHT_CountryInfo_Content.5: "Старі воїни Корони"
  CHT_CountryInfo_Content_desc.5: "Перед §GБілою армією§! стоїть воістину величезне завдання. Із цієї холодної твердині вона прагне продовжити §Rборотьбу§!, що розпочалася багато років тому, й відродити давно повалену §Gмонархію§!.\n\nТа §Gотаман§! старіє, і ніхто не знає, яким шляхом піде його §Gрух§!, коли він більше не стоятиме на чолі..."

 # AMUR

  #101
  AMR_CountryInfo_Folder.101: "Спадкоємець Харбіна"
  AMR_CountryInfo_Content.1: "Вождь"
  AMR_CountryInfo_Content_desc.1: "Коли підступний Совєцький Союз розпався під тягарем німецького вторгнення та внутрішньої слабкости комуністичної системи, Російська фашистська партія, що довгі роки перебувала у вигнанні в маньчжурському Харбіні, та її японські покровителі нарешті отримали нагоду повернути собі Росію.\n\n§GКонстантін Родзаєвскій§!, вождь §WВсеросійського уряду§!, взяв на себе справу відвоювання Росії, прагнучи підкорити її та врятувати від большевицьких безчинств."
  AMR_CountryInfo_Content.2: "Змії, що душать самі себе"
  AMR_CountryInfo_Content_desc.2: "Увірвавшись на російський Далекий Схід, Російська фашистська партія та її союзники зі старого Білого руху просунулися аж до Чіти, де їхній наступ захлинувся. Коли просування сповільнилося, між царистами й фашистами почали виникати чвари. Невдовзі білі під проводом §Rотамана Сємьонова§! захопили Чіту й офіційно порвали з партією.\n\nЯкщо такий поворот подій здивував вождя, то справжню лють викликала зрада колишнього партійця §RМіхаіла Матковского§!, який розколов партію та заснував власний уряд у віддаленому портовому місті §WМаґадані§!, поставивши під загрозу легітимність і владу вождя."

  #102
  AMR_CountryInfo_Folder.102: "За Бога, Націю та Труд"
  AMR_CountryInfo_Content.3: "Ознаки слабкости"
  AMR_CountryInfo_Content_desc.3: "Відтоді вождь осів у невеличкому містечку Зєя, де занепав духом і дедалі більше потерпає від параної.\n\nЙого найближчі радники, §WҐєорґій Шехєрєв§! та §WАлєксандр Болотов§!, очільник партійних воєнізованих чорносорочечників і міністр безпеки відповідно, всіляко потурають його параної, раз у раз приносячи вождеві списки незгодних партійців та інших небажаних для режиму осіб."
  AMR_CountryInfo_Content.4: "Ніхто не стане на шляху"
  AMR_CountryInfo_Content_desc.4: "Вождь прагне побудувати могутню Росію на засадах націонал-соціялізму, де вождь стоятиме понад усіма, а запозичена в німців система стане непорушним законом. Проте задля цього йому доведеться спершу очистити партію від тих, хто спричинив її невдачі.\n\nПерш ніж узятися за остаточне знищення залишків большевицьких сил на заході, вождь мусить розправитися з безпосередніми загрозами як усередині країни, так і за її межами. Ніхто не стане на шляху §GКонстантіна Родзаєвского§!.\n\n§RЗа Бога, Націю та Труд!§!"

 # MAGADAN

  #101
  MAG_CountryInfo_Folder.101: "Буремне минуле..."
  MAG_CountryInfo_Content.1: "Притулок вигнанців"
  MAG_CountryInfo_Content_desc.1: "Колись §GМіхаіл Матковскій§! був палким членом §WРосійської фашистської партії§!. Серед російських емігрантів §WХарбіна§! мало хто досі шанував стару гвардію Білого руху - старих вояків, що програли Росію §Rчервоним§!.\n\nФашизм - сучасна ідеологія, що відкидала занепадницький лібералізм і протиприродний соціялізм, - здавався §GМатковскому§! шляхом у майбутнє. Росія стане могутньою.\n\nКоли §RСовєцький Союз§! неминуче розвалиться, справжні спадкоємці Харбіна виступлять із японської Маньчжурії та розпочнуть великий хрестовий похід за визволення Росії."
  MAG_CountryInfo_Content.2: "Бандит, що лише шкодить"
  MAG_CountryInfo_Content_desc.2: "§RКонстантін Родзаєвскій§! змусив §GМатковского§! засумніватися. Так званий вождь §WРосійської фашистської партії§! був безпринципним бандюгою. А його оточення - зарозумілі головорізи, цілковиті нікчеми, покидьки російської громади Харбіна. Коли Німеччина вторглася до Росії та почала нищити її народ, очільник РФП писав підлесливі листи, вихваляючи тих, хто плюндрував його батьківщину.\n\nНі, §RРодзаєвскому§! не можна довірити порятунок Росії.\n\nТож §GМатковскій§! почав плести змову. За підтримки §gНіколая Пєтліна§!, відомого в Харбіні своїми зв'язками з російсько-американською громадою, §GМатковскій§! вичікував."

  #102
  MAG_CountryInfo_Folder.102: "...і визначене майбутнє"
  MAG_CountryInfo_Content.3: "Жалюгідний наслідувач"
  MAG_CountryInfo_Content_desc.3: "Наприкінці п'ятдесятих нарешті випала нагода, яка трапляється лише раз у житті.\n\nЖалюгідні залишки совєцьких сил §RЯґоди§! розв'язали безнадійну війну за підкорення §WЦентральносибірської республіки§!. Виснажливі бої підірвали сили обох держав, відкривши перед білою еміграцією Харбіна можливість завдати удару.\n\nВторгнення зламало хребет державі §RЯґоди§!, визволивши Чіту, Амур і Маґадан."
  MAG_CountryInfo_Content.4: "Від Харбіна до Маґадана"
  MAG_CountryInfo_Content_desc.4: "У мить тріюмфу Російської фашистської партії §GМатковскій§! здійснив свій задум. Він захопив портове місто Маґадан і перетягнув на свій бік значну частину військ РФП, що брали участь у вторгненні. Головорізів §RРодзаєвского§! відтіснили до §RАмуру§!, позбавивши їх стратегічно важливого порту §GМаґадан§!.\n\nУ §GМаґадані§! вичікує справжній провідник §GРосійської фашистської партії§!."
  MAG_CountryInfo_Content.5: "Роботі немає кінця"
  MAG_CountryInfo_Content_desc.5: "Попереду ще багато роботи. Рештки прибічників §RРодзаєвского§! належить усунути. Потрібно налагодити зв’язки за кордоном, забезпечити постачання вкрай необхідної зброї та залучити найманців.\n\nНа §GМатковского§! чекає довгий і тяжкий шлях. Та він невпинно йде вперед. Лише йому до снаги врятувати §WРосію§! від анархії."
  
  ## Guangdong
  
  #101
  GNG_CountryInfo_Folder.101: "Pax Economica?"
  GNG_CountryInfo_Content.1: "Корпоративний експеримент"
  GNG_CountryInfo_Content_desc.1: "Створена японським указом із земель §MКитайської республіки§! відповідно до Кантонських протоколів 1950 року, §SДержава Ґуандун§! стала безпрецедентним історичним експериментом: штучною країною, що існує винятково заради корпоративного колоніялізму. Інші завойовані §jЯпонською імперією§! території Азії - навіть її найштучніше дитя, §fМаньчжурська імперія§! - бодай на словах визнають паназійські ідеали §VСфери співпроцвітання§!. Натомість Ґуандун поклоняється лише єні та кориться примхам §Yчотирьох компаній§! - §VСоні§!, §WМацушіта електрік§!, §mФуджіцу§! та §YЯсуда§!.\n\nБайдужість Токіо вкупі з безоглядним честолюбством місцевих магнатів перетворили Ґуандун на місце у Сфері, де всі пристойні маски скинуто заради неприкритої жадоби й гонитви за прибутком. Та навіть у цьому єдиному у світі оплоті нічим не стримуваного капіталізму не все гаразд."
  GNG_CountryInfo_Content.2: "Народ без опори"
  GNG_CountryInfo_Content_desc.2: "Корінне §iкитайське§! населення невпинно гарує на фабриках Трьох перлин Ґуандуну - Кошю (Ґуанчжоу), Хонкону (Гонконґ) та Макао (Макау). Проте плодами цієї праці користуються не самі робітники, а §eяпонські промисловці та експатріянти§!, що керують корпоративним ексклавом. Поміж ними стоять §Eчжуджін§! - місцеві освічені фахівці й підприємці, які вільно володіють японською мовою. Цей прошарок водночас підтримує економічний лад Ґуандуну й отримує з нього користь: §iкитайці§! зневажливо називають їх колябораціоністами, а §eяпонські експатріянти§! бачать у них зручних посередників.\n\n§VЗлочинність і корупція§! процвітають. §nТріади§! та §Eякудза§! змагаються за контроль над розгалуженою мережею злочинного промислу в підпіллі Ґуандуну, не зважаючи на нечисленну §Qполіцію Ґуандуну§! та байдужий гарнізон §eкемпейтай§!. У Ґуандуні злочинність - не стільки відхилення від норми, скільки ще один спосіб провадити справи, побудований на взаємних послугах і боргових зобов’язаннях."
  GNG_CountryInfo_Content.3: "Дрейфуючи в Азії"
  GNG_CountryInfo_Content_desc.3: "На міжнародній арені Ґуандунові дозволено мати хіба зовнішні ознаки державности. §MКитай§!, міцно тримаючись за свою гордість, відмовляється визнавати представників Ґуандуну рівними собі, тимчасом як §jЯпонія§! вже давно втратила інтерес до свого неприродного васала. §fМаньчжоу-ґо§!, первісний паназійський експеримент, залишається перлиною Сфери, однаково зверхньо дивлячись і на злиденний Китай, і на корпоративних вискочок Ґуандуну.\n\nҐуандун - держава без власної нації, як за духом, так і за своєю суттю. Тим часом §Sголовний виконавчий адміністратор Судзукі Тейїчі§! береться за нелегке завдання повернути Ґуандун та його корпорації під владу Японії. А народ і магнати Ґуандуну чекають, §Yплекаючи надію на майбутнє й державу, які ще можуть належати їм самим.§!"

  #102
  GNG_CountryInfo_Folder.102: "Дійові особи"
  GNG_CountryInfo_Content.4: "Адміністрація Судзукі"
  GNG_CountryInfo_Content_desc.4: "§SПослужний список головного виконавчого адміністратора Судзукі Тейїчі§! промовляє сам за себе: колись він був генералом і служив у Китаї, згодом увійшов до уряду Тоджьо, а від 1943 року посідає місце в Палаті перів. Коли §eпрем'єр-міністрові Іно Хіроя§! знадобилося повернути Ґуандун під контроль Токіо, він знав лише одну людину, здатну виконати це завдання.\n\nБезпосередніше втручання §SСудзукі§! й державницький підхід до управління §Sнестримною економікою Ґуандуну§! дратують §YЗаконодавчу раду§! та §Yчотири компанії§!, звиклі §Yкерувати Ґуандуном майже без перешкод§!. Але §Rкультура корупції§! у Ґуандуні разом із §Yпідтримкою Судзукі з боку Yasuda§! достатні, щоб тримати магнатів у шорах.\n\nЗаради §eблага Японської імперії§! та §Vзбереження Сфери співпроцвітання§! §SСудзукі Тейїчі§! вступає в 1962 рік, готуючись закласти підвалини §Sмогутнішого й життєздатнішого Ґуандуну§! й §Sнагадати корпораціям про їхній обов'язок перед §jімперією§!§!."
  GNG_CountryInfo_Content.5: "Ясуда"
  GNG_CountryInfo_Content_desc.5: "§YДзайбацу Ясуда§! зустрічає 33-й рік ери Шьова §Kна вершині успіху§!  §eЯпонській імперії§!, §Kпоширюючи свій вплив на всі закутки імперії§!. Не виняток і його діяльність у §SДержаві Ґуандун§!, якою від 1959 року керує §Yдиректор-представник Мацудзава Такуджі§!,.\n\nВиняткове становище Ясуда дає §YМацудзаві§! змогу грати вдовгу: він готовий «спати на хмизі й куштувати жовч», як каже давнє китайське прислів'я, аж поки не здобуде перемоги. Як §Yголовний розпорядник інтересів Ясуда§! у Ґуандуні, він може дозволити собі §fвеликодушність§!, недосяжну для інших магнатів, - і це саме по собі дає йому неабияку силу.\n\nАле обізнані спостерігачі, придивляючись до директора, бачать: він §fменш задоволений своїм становищем, ніж мав би бути§!. Попри всі привілеї, Мацудзава відчуває, що його з якоїсь причини §Rвідсунули на другий план§!, і жадає з'ясувати причину."
  GNG_CountryInfo_Content.6: "Соні"
  GNG_CountryInfo_Content_desc.6: "§VСоні§! - провідна електронна компанія §SҐуандуну§!, заснована 1954 року як друга підприємницька справа §VМоріти Акіо§! після §l«Токіо телеком'юнікейшнз»§!, яку 1952 року придбала §mФуджіцу§!.\n\nНа Японських островах невдах не терплять, тож Моріта вирішив розпочати все заново в §SҐуандуні§! разом із §CЛі Кашіном§!, власником фабрики, що переживала скрутні часи. У 1955 році він випустив TR-56, перший транзисторний радіоприймач у §VСфері§!, виготовлений поза Японією, а згодом втягнувся в запеклу суперечку щодо торговельної марки з колишнім партнером §mІбукою Масару§!.\n\nХоча відтоді Лі заснував власну компанію §C«Ченґ Конґ ентерпрайзез»§!, вони з Морітою разом подолали всі перешкоди, а 1960 року §VСоні§! сформувала власну фракцію в §SЗаконодавчій раді§!. Вічний чужинець §VМоріта§! обстоює §Vінтереси §Eгромади чжуджін§! і своїх §iкитайських робітників§!§! - тих, хто дав йому другий шанс, коли §jЯпонія§! не дала нічого."
  GNG_CountryInfo_Content.7: "Мацушіта електрік"
  GNG_CountryInfo_Content_desc.7: "§WМацушіта електрік§! відома як один із §Wнебагатьох незалежних виробників електроніки на Японських островах§!. Її засновник §WМацушіта Коносуке§! керує корпорацією з головного офісу в Осаці, обіймаючи посаду голови правління. У §SҐуандуні§! його зять і прийомний син §WМацушіта Масахару§! від 1961 року керує діяльністю компанії, §Wпросуваючи Мацушіта на §Mкитайський§! та §Jміжнародні ринки§!§! з регіонального офісу в Кошю.\n\nСтановище прийомного сина й спадкоємця конгломерату Мацушіта мучить §WМацушіту Масахару§! §xневпевненістю й сумнівами в собі§!, адже його прийомний батько §WКоносуке§! з кожним роком дедалі більше §xсумнівається, чи гідний Масахару§! успадкувати статки родини §WМацушіта§!. Молодший Мацушіта докладає всіх сил, щоб зробити §WМацушіта§! §Wнайбільшим виробником побутової електроніки у §VСфері співпроцвітання§!§!, прагнучи §Wзбудувати справжню імперію для прийомної родини§! в §Sдельті Перлинної річки§!."
  GNG_CountryInfo_Content.8: "Фуджіцу"
  GNG_CountryInfo_Content_desc.8: "Заснована незадовго до Другої японсько-китайської війни, §mФуджіцу лімітед§! - одна з найстаріших у світі компаній у галузі інформаційних технологій, пов'язана з §Qдзайбацу Фурукава§!. Проте ні давня історія, ні впливові зв'язки не принесли їй слави й багатства в повоєнні роки - аж поки не з'явився §mІбука Масару§!.\n\nГострий на розум, ерудований і передусім §Mвинятково сміливий§!, молодий амбітний інженер потрапив до §mФуджіцу§! після придбання нею §l«Токіо телеком'юнікейшнз»§! у лютому 1952 року. Попри болісний розрив із другом і діловим партнером §VМорітою Акіо§!, кар'єра §mІбуки§! у §mФуджіцу§! стала справді блискавичною: до 1959 року він став її президентом. Тепер, укладаючи непевний союз із §WМацушітою Масахару§! й виступаючи проти свого колишнього §yтовариша§!, а нині §xсуперника§! §VМоріти Акіо§!, він присвятив себе єдиній найвищій меті: втілити власне видіння, омріяний світ у самому §SҐуандуні§! - §mрай§! науки й розуму, де §mкожна людина заслуговує лише на найкраще, на що здатна§!."
  GNG_CountryInfo_Content.9: "Негідники та державні діячі"
  GNG_CountryInfo_Content_desc.9: "Поки магнати змагаються за політичний вплив, злочинний світ теж має неабияку вагу. Його «поважні» представники - §nСтенлі Го§! від тріад і §EЙокої Хідекі§! від якудзи - за впливом не поступаються навіть §Qкомісара поліції§!, який опинився під постійним тиском і змушений покладатися на допомогу §eполковника кемпейтай Міядзакі Кійотаки§! в поліційних і розвідувальних справах.\n\nЗа межами Ґуандуну §eЯпонська імперія§! дбає про свої інтереси через §qгенерала Наґано Шіґето§! та §jгенерального консула Такашіму Масуо§!, представників §qвійськової§! та §jцивільної§! гілок §Jяпонського уряду§!.\n\n§MКитайській республіці§! §Mдосі болить втрата Ґуандуну 1950 року§!. Генеральний консул §MСун Чжиґуан§!, §Sуродженець Ґуандуну§!, неохоче сприяє корпоративній державі разом зі старшим політичним аташе §MВан Цзінсюєм§!, представником китайського війська, в якого §Rкуди менше терпіння§!, ніж у Суна."

 # Brazil

  #101
  BRA_CountryInfo_Folder.101: "Кінець Третьої республіки"
  BRA_CountryInfo_Content.1: "Змії, що курять"
  BRA_CountryInfo_Content_desc.1: "За часів §sЕстаду Нову§! економічні зв’язки §nБразилії§! зі §iСполученими Штатами§! були міцнішими, ніж зв’язки її президента §sЖетуліу Варґаса§! з §jфашистськими§! державами Европи.\n\nВеликі торговельні угоди 1939 року та закупівля §nБразилією§! надлишкового озброєння в березні 1940 року переконали §qнімців§!, що §nкраїна§! твердо стала на бік Союзників. Відтак німецькі підводні човни, провадячи необмежену підводну війну, почали торпедувати §nбразильські§! цивільні й військові судна. Це спонукало §sВарґаса§! привести §nБразилію§! до табору Союзників у 1942 році.\n\nТри армійські дивізії сформували §nБразильський§! §wекспедиційний§! §Mкорпус§!, який прибув до Британії та вступив у бій із §qнімцями§! під час операції «Морський лев». Під проводом таких генералів, як §sКастелу Бранку§! та §MЕнріке Лотт§!, «Змії, що курять» хоробро билися, та цього виявилося замало. Союзників відтіснили, і 1945 року держави §qОсі§! здобули перемогу."
  BRA_CountryInfo_Content.2: "Падіння Варґаса"
  BRA_CountryInfo_Content_desc.2: "Попри зовнішньополітичні успіхи в Латинській Америці та відносинах зі §iСполученими Штатами§!, війна завдала економіці §nБразилії§! тяжкого удару. Торговельні ембарґо, економічні спади в Америці та інфляція разом призвели до справжньої катастрофи.\n\nЦе, а також лицемірство §sВарґаса§!, який посилав війська боротися за демократію за кордоном, водночас підтримуючи авторитарну диктатуру вдома, поступово позбавили його підтримки як серед цивільного населення, так і серед військових. У 1949 році навіть такі здобутки, як заснування компанії Петробрас, затьмарив замах на журналіста §BКарлуса Ласерду§!, який без відома §sВарґаса§! організував один із його прибічників.\n\nПісля цього країну охопив хаос, і військові здійснили переворот. Спочатку §sВарґас§! заявив, що чинитиме опір, і навіть мало не наклав на себе руки. Зрештою він подав у відставку й утік до Сан-Паулу, звідки згодом перебрався до Сан-Боржі, де мешкає й досі. Поспіхом уклали компромісну конституцію, а на виборах 1950 року президентом обрали §BЕдуарду Ґоміса від НДС§!."

  #102
  BRA_CountryInfo_Folder.102: "Буремні п’ятдесяті - Четверта республіка"
  BRA_CountryInfo_Content.3: "Президентство Ґоміса"
  BRA_CountryInfo_Content_desc.3: "Новий президент §BЕдуарду Ґоміс§! був офіцером військової авіяції, якому не раз доводилося брати участь у змовах. Спершу він підтримував §sВарґаса§!, але за часів §sЕстаду Нову§! відвернувся від нього. Одним із перших кроків Ґоміса на президентській посаді стало застосування так званих «законів про національну безпеку», за допомогою яких він заборонив §eБразильську комуністичну партію§! після її несподіваного успіху на виборах.\n\nГоловними завданнями §BҐоміса§! були подолання економічної кризи та зближення зі §iСполученими Штатами§!. Він уживав заходів для стримування інфляції, залучав §iамериканські§! та інші приватні інвестиції й відкидав вимоги §BЛасерди§! приватизувати Петробрас. Крім того, президент розширив збройні сили та дозволив американцям користуватися військовими базами на півночі країни.\n\nТа одним нерозважливим кроком §BҐоміс§! підписав власній партії смертний вирок. У 1953 році за підтримки §BНДС§! він скасував мінімальну заробітну плату, запроваджену §sВарґасом§! після Другої світової війни. Це спричинило масові народні виступи, поховало спробу §BҐоміса§! приєднати країну до §iОВН§! і зрештою коштувало йому перемоги на виборах 1955 року. Варґасисти повернулися до влади на чолі з §MЖуселіну Кубічеком§! із §MСДП§!."
  BRA_CountryInfo_Content.4: "Спроба перевороту 1955 року"
  BRA_CountryInfo_Content_desc.4: "Перемога варґасистів обурила багатьох членів §BНДС§! та консервативних військових, які вбачали в ній передвістя «нацистсько-комуністичного» захоплення влади. Вони спробували здійснити державний переворот, проте їхні плани зірвав міністр війни, прихильник конституційного ладу §Mмаршал Енріке Лотт§!, за підтримки §sОділіу Деніса§! та інших офіцерів."
  BRA_CountryInfo_Content.5: "Президентство Кубічека"
  BRA_CountryInfo_Content_desc.5: "§MКубічек§! обіцяв відновити варґасистський курс і забезпечити «п’ятдесят років поступу за п’ять». Масштабні іноземні інвестиції, розвиток промисловости та інфраструктури, імпорт обладнання й, передусім, будівництво нової столиці Бразиліа спричинили стрімке економічне зростання. Однак ціною цього успіху стало підвищення інфляції до 45%.\n\nУ зовнішній політиці, коли §iСША§! відмовилися від подальших інвестицій, зосередившись на Західноросійській війні, їхнє місце посіли §Sяпонці§!, що сприяло розрядці у відносинах. Натомість із §qнімцями§! жодного потепління не відбулося. У міру зміцнення африканських райхскомісаріятів та розпаду усталеного порядку в Західній Африці до §nбразильських§! вод від 1959 року почали вторгатися незаконні рибальські судна й пірати. Це призвело до Лобстерної війни."

  #103
  BRA_CountryInfo_Folder.103: "Поточна ситуація"
  BRA_CountryInfo_Content.6: "Уряд Лотта"
  BRA_CountryInfo_Content_desc.6: "§MМаршал Енріке Лотт§! забезпечив варґасистам перемогу на виборах 1960 року, згуртувавши §PБРП§! й скориставшись тим, що §BЖурасі Маґальяйнс§!, кандидат антиварґасистського §BНДС§!, харизмою аж ніяк не перевершував його самого. Однак напарник §MЛотта§! на виборах, §PЖуан Ґуларт§!, зазнав поразки від ексцентричного §QЖаніу Квадруса§!, члена пов'язаної з §BНДС§! §QНРП§!.\n\nТепер усередині коаліції §PҐуларт§! і §VЛеонел Брізола§! намагаються схилити Лотта ліворуч, тоді як §MКубічек§! вичікує, сподіваючись удруге обійняти президентську посаду 1965 року. Однопартієць §MЛотта§!, §M«песседіста»§! §MТанкреду Невіс§!, чи не єдина людина, на яку він може беззастережно покластися.\n\nЗа межами коаліції причаїлися §sантидемократичні сили у війську§!, які лише чекають нагоди довершити те, що не вдалося змовникам 1955 року. Гірше того, такі політики, як наскрізь корумпований пристосуванець §gАдемар ді Баррус§! із §gСПП§! та вічний баламут §BКарлус Ласерда§! з §BНДС§!, ладні підтримати їх, щойно побачать у цьому власну вигоду."
  BRA_CountryInfo_Content.7: "Внутрішнє становище"
  BRA_CountryInfo_Content_desc.7: "Внутрішнє становище §nБразилії§! неоднозначне. Економіка потерпає від високої інфляції. У 1961 році §MТанкреду Невіс§! зумів знизити її на 8%, але потрібні подальші заходи, інакше політика промислового розвитку, яку провадить уряд §MЛотта§!, може зійти нанівець.\n\nОдним із наймасштабніших задумів президента є Трансамазонське шосе, що має перетнути континент. Проєкт здобув широку підтримку, але водночас викликав опір корінного населення та §BЛасерди§!, який називає його черговим прикладом варґасистського марнотратства.\n\nДо того ж у 1961 році §MЛотт§! зіткнувся зі страйками працівників кавової галузі, які паралізували один із найбільших секторів §nбразильської§! економіки. Аби бодай тимчасово припинити страйки, він усупереч власним переконанням пообіцяв здійснити земельну реформу. Її успіх чи провал, безперечно, значною мірою визначить долю його уряду."
  BRA_CountryInfo_Content.8: "Міжнародне становище"
  BRA_CountryInfo_Content_desc.8: "Як і протягом кількох попередніх десятиліть, §nБразилія§! загалом орієнтується на §iОВН§! та §iСполучені Штати§!. Цьому сприяють спільний військовий вишкіл, глибокі суспільно-економічні зв'язки, а також значно сильніші проамериканські настрої серед військових, ніж серед політиків. Проте §nБразилія§! не збирається беззастережно коритися американським союзникам і зберігає свободу виступати проти §iСША§!, коли їхні інтереси розходяться.\n\nВеликі §Sяпонські§! інвестиції вітають навіть прихильники §iОВН§!, зокрема §MЛотт§! і §MКубічек§!, тому симпатії до §SЯпонії§! залишаються сильними. З §qНімеччиною§! ж усе навпаки: німецька влада раз у раз засуджує §nБразилію§! за «расове змішування», не приховуючи свого презирства до неї. Натомість §nбразильські§! дії під час Лобстерної війни користуються повною підтримкою.\n\n§nБразилія§! прагне економічної інтеграції Латинської Америки, сподіваючись таким чином зміцнити господарство країн регіону й посилити їхній вплив у світі. Однак на шляху цих прагнень стоїть §MАрґентина§!, з якою Бразилія дедалі гостріше змагається за вплив у регіоні. Їхні зовнішньополітичні суперечності переростають у протистояння, яке вже називають §IПівденноамериканською холодною війною§!."

 # Japan
  JAP_CountryInfo_Folder.101: "Тріюмф Вранішнього сонця"
  JAP_CountryInfo_Content.1: "Гіркота, що породила завоювання"
  JAP_CountryInfo_Content_desc.1: "Заздрячи колоніяльним імперіям европейців і обурюючись відхиленням пропозиції про расову рівність у Версалі, §PЯпонія§! прагнула збудувати власну імперію в багатій на ресурси, але неспокійній Східній Азії. Після падіння ненависного §RВашинґтонського§! §Mморського§! §Wдоговору§! це стало лише питанням часу. Захопивши Маньчжурію 1931 року й остаточно закріпивши перемогу над царською Росією 1905 року, Японія перетворила ці землі на §wМаньчжурську імперію§!, або ж §wМаньчжоу-ґо§!. Коли вибух прогримів на коліях підконтрольної японцям залізниці Мантецу, Квантунська армія скористалася цим приводом, щоб вирвати регіон із рук воєначальників та місцевих володарів, які запекло боролися за крихти влади серед його обвітрених пагорбів.\n\nНа тлі §nВеликої депресії§! за обрієм назрівало вирішальне зіткнення за долю всієї Азії. Коли похмуре небо розверзнеться, світ побачить війну, подібної до якої ще не було."
  JAP_CountryInfo_Content.2: "Несамовита лють війни"
  JAP_CountryInfo_Content_desc.2: "§e7 липня 1937 року§! війна проти Китаю вступила в нову, ще жорстокішу фазу. Японські війська прорвали китайську оборону під час сутички, що увійшла в історію як §e«інцидент на мосту Марко Поло»§!. Дехто вважав її лише черговою демонстрацією сили з боку Токіо, але насправді вона стала початком повномасштабного завоювання Китаю Японією. §P«Китайсько-японська війна»§!, §z«Війна опору»§! чи «Друга японо-китайська війна» - лише деякі назви цього вторгнення. Однак для тих, хто пережив його або загинув у боях, усю сутність війни можна було передати одним словом: §Vпекло§!. Запеклий китайський опір, значною мірою завдяки перемир'ю між §CМао Цзедуном§! і §QЧан Кайші§!, змусив японців вдатися до ще жорстокіших методів підкорення окупованих земель. Спалюючи поселення, грабуючи та калічачи кожного, кого підозрювали в опорі, Японія принесла мільйони життів у жертву своїй жадобі ресурсів і панування на Тихому океані."
  JAP_CountryInfo_Content.3: "Тривожний погляд смерти"
  JAP_CountryInfo_Content_desc.3: "Коли війна зайшла в глухий кут, Японія звернула свій погляд на західні колоніяльні володіння, сподіваючись підтримати воєнну економіку. Нищівний раптовий удар по американському Тихоокеанському флоту в §mПерл-Гарборі§! та стрімкі наступи на володіння §OНідерландів§!, §MФранції§! та колишнього союзника Японії - §xВеликої Британії§! - у Південно-Східній Азії розвіяли їхні уявлення про власну расову вищість над японцями. Одна за одною їхні могутні твердині падали під натиском променів Вранішнього сонця. Сінґапур, Маніла, Батавія, Гонконґ - лише деякі приклади того, що західні держави не могли перевершити японські імператорські війська ані хитрістю, ані військовою силою. Американці знову зазнали нищівної поразки в битві біля Мідвею, а війська Британської імперії не змогли стримати японського наступу в §KПапуа - Новій Ґвінеї§!. Тепер §iпід загрозою удару опинилася й Австралія§!."
  JAP_CountryInfo_Content.4: "Невблаганні лещата пошести"
  JAP_CountryInfo_Content_desc.4: "Попри героїчні зусилля §Q«Об'єднаних Націй»§! в Азії - китайських держав, Британії та її імперії, а також Сполучених Штатів, - вони так і не змогли протистояти воєнній машині, що постала на Японських островах. Американський флот завдавав японцям тяжких поразок, а англо-китайські сили змусили розтягнуті японські війська загрузнути в кривавому протистоянні. Та все виявилося марним. За останніми повідомленнями, §CМао Цзедун§! і §QЧан Кайші§! чинили останній опір у місті-фортеці Чунцін. Через запеклі вуличні та рукопашні бої ніхто достеменно не знає, як і коли загинули ці воєначальники.\n\nАмерика останньою схилилася перед об'єднаними силами Осі. Хоч американський та японський флоти обмінювалися нищівними ударами, Сполучені Штати опинилися в ізоляції. Та найгірше було ще попереду. Одного ясного ранку над Перл-Гарбором, на Гаваях, скинули бомбу, яка назавжди залишила глибокий шрам на обличчі людства. §VНазавжди§!."
  JAP_CountryInfo_Content.5: "Апокаліпсис на Тихому океані"
  JAP_CountryInfo_Content_desc.5: "§VАтомна бомба не робила§!, не могла й не бажала робити жодних винятків. У її полум'ї однаково згоріли люди й звірі. Навіть славетні §Dадмірал Німіц§! і §Mадмірал Голсі§! за лічені секунди випарувалися. Там, де колись бавилися жінки й діти, їхню загибель оплакував лише тонкий шар чорного попелу на землі.\n\nТа саме атомна бомба поклала край найбільшій війні в історії. І без того похитнутий бойовий дух американців остаточно зламався, і вони погодилися на перемир'я. §wМаньчжоу-ґо§! офіційно визнали державою. Китай розділили на низку васальних держав, найбільшою з яких став §g«Реорганізований уряд Китайської республіки»§!. Інші, зокрема §R«Державу Ґуандун»§!, викроїли з його решток заради японських інтересів. Тепер, у 1962 році, Азія опинилася за крок від цілковитого японського панування."
  JAP_CountryInfo_Folder.102: "Коридори влади"
  JAP_CountryInfo_Content.6: "Імператор Шьова"
  JAP_CountryInfo_Content_desc.6: "Яку Японію залишить по собі §fімператор Шьова§!? Правління Хірохіто, як його звуть за особистим ім'ям, ще на початку затьмарив замах на його життя 1932 року. До того ж імператорові довелося зіткнутися з §nВеликою депресією§!, яка лише прискорила мілітаризацію японського суспільства на тлі мрій генералів і прем'єр-міністрів про панування над цілим континентом. Хірохіто мав стати об'єднавчим символом, що провадив би своїх підданих крізь потрясіння й хаос. Та нині імператор Шьова старіє й дедалі більше відгороджується від світу. Ті нечисленні люди, яким удається з ним зустрітися, розповідають про його непередбачувану поведінку та дедалі глибше занурення у власні захоплення. Здається, Хірохіто досі царює в Японії, але імператор Шьова вже не веде її за собою.\n\nУтім, з огляду на майже дивовижну перемогу Японії над усіма її ворогами, можливо, §lбожественна ласка§! таки осяяла його."
  JAP_CountryInfo_Content.7: "Тайсей йокусанкай"
  JAP_CountryInfo_Content_desc.7: "§xАсоціяція імперського правління§!, або Асоціяція допомоги трону, відома під японською назвою §xТайсей йокусанкай§!, - це, грубо кажучи, слуга, якому не знайшлося роботи. Створена 12 жовтня 1940 року, ця організація стала вінцем прем'єрства, що пішло зовсім не за планом. Тайсей йокусанкай, грандіозний задум прем'єр-міністра §pФумімаро Коное§!, постала з потреби Японії впорядкувати керівництво війною та покласти край затяжному протистоянню в багатьох районах Китаю. Проголосивши гасло «одна нація, одна партійна організація», Коное за допомогою свого дослідницького осередку §oШьова кенкюкай§! створив систему, за якою всі партії японського парламенту мали об'єднатися в коаліцію для спільного керівництва воєнними зусиллями, не відволікаючись на дрібні чвари й запекле особисте суперництво, що затьмарювали розсуд військових провідників. Та попри позірну одностайність уряду, назвати ЙСК справді згуртованою організацією..."
  JAP_CountryInfo_Content.8: "Фракції ЙСК"
  JAP_CountryInfo_Content_desc.8: "За владу в Японії змагаються чотири головні політичні угруповання. Перше з них - §Mреформісти§! на чолі з героєм війни §MСокічі Такаґі§!, які виступають за лібералізацію країни, прагнучи врятувати її від системного занепаду. Друге - §rконсерватори§! на чолі з §rІно Хіроя§! та його найближчим соратником §rІкедою Масаносуке§!. Вони прагнуть зберегти чинний курс і виправити недоліки японського політичного устрою, щоб не допустити послаблення позицій імперії за кордоном. Третє - §qтехнократи§! під проводом §qКая Окінорі§!. Вони вимагають перетворити Японію на безжальну меритократію під владою вузького кола фахівців, аби якнайповніше використати її потенціял в Азії та забезпечити їй вплив, що перевищує її власні можливості. Нарешті, існують §gкідоїсти§!. Хоч їх замало, щоб становити повноцінну фракцію, саме вони §gздатні вирішувати, хто прийде до влади§!. Своїм впливом вони завдячують лідерові, §gКідо Коічі§!, який обіймає посаду лорда-хранителя Малої печатки й має тісні зв'язки з §fімператором§!. Для успіху будь-якого уряду необхідно порозумітися з усіма цими угрупованнями."
  JAP_CountryInfo_Content.9: "Імператорські армія та флот"
  JAP_CountryInfo_Content_desc.9: "Імператор Шьова - §fсерце імперії§!, Тайсей йокусанкай - §xрозум Японії§!, а імператорські армія та флот - §Rмечі§! й §Bщит§! великого паназійського проєкту, покликані захищати їх обох. Вони - гордість усієї нації: сотні тисяч вояків, готових віддати життя за свою країну та священні установи «співпроцвітання». Проте перемога сповнила армію та флот надмірної пихи. І хоча їхній вплив та взаємне суперництво вже далеко не такі сильні, як у 1930-х і 1940-х роках, обидві сили досі змагаються за §Pфінансування та увагу§! уряду. Будь-якому дієздатному урядові доведеться докласти чимало зусиль, щоб не лише не дати загребущим рукам військових втручатися в державні справи, а й не надавати надмірних переваг жодній зі сторін. Адже параноя - могутня сила в політиці..."
  JAP_CountryInfo_Content.10: "Консерватори"
  JAP_CountryInfo_Content_desc.10: "Нині при владі в §xТайсей йокусанкай§! стоять §rконсерватори§! на чолі з прем'єр-міністром §rІно Хіроя та його заступником Ікедою Масаносуке§!. Завдяки прихильності до збереження чинного ладу вони користуються найбільшою підтримкою серед фракцій ЙСК. Хоча інші угруповання звинувачують їх у тому, що вони нібито заплющують очі на глибокі вади імперського устрою, консерватори обіцяють покласти край §Rполітичному хаосові§!, який уже давно виснажує Японію.\n\nЗа своїми поглядами ці традиціоналісти нагадують давніх британських торі. Вони обстоюють §PСферу співпроцвітання§!, де перевагу віддають торгівлі між її учасниками, а іноземні товари обкладають високими митами. Дехто порівнює їх із фельдшерами, що намагаються заклеїти ножову рану пластирем. Та немає сумніву, що саме консерваторам було б найлегше втілити свої задуми."
  JAP_CountryInfo_Content.11: "Технократи"
  JAP_CountryInfo_Content_desc.11: "Темною конячкою японської політики залишаються §qтехнократи§! на чолі з колишнім міністром фінансів §qКая Окінорі§!. Вони переконані, що в так званій Холодній війні Японія матиме шанс протистояти своїм ворогам лише тоді, коли перетвориться на бездоганно налагоджений механізм, керований за §xпринципами найбезжальнішої меритократії у світі§!. Інші фракції ЙСК їм не довіряють, а їхній вплив тримається передусім на міцній хватці, якою вони стискають §Lбюрократичний апарат§!. Прийшовши до влади, технократи прагнутимуть установити цілковитий державний контроль над країною, дедалі більше зосереджуючи владу в центрі. Усі важелі управління опиняться в руках вузької кліки політичних діячів і чиновників, які нав'язуватимуть §eволю Токіо§! навіть мегакорпораціям та §Kдзайбацу§!. Та навіть із підтримкою сторонніх фракцій урядові Кая знадобиться вся можлива допомога, щоб нав'язати свою волю Азії."
  JAP_CountryInfo_Content.12: "Кідоїсти"
  JAP_CountryInfo_Content_desc.12: "Кідоїсти, згуртовані навколо свого провідника §gКідо Коічі§!, - не стільки політична фракція, скільки §fті, хто вирішує, кому дістанеться влада§!. Обіймаючи посаду лорда-хранителя Малої печатки, Кідо служить очима й вухами §fЙого Величности§! в уряді, а нібито ще й говорить від його імені. Коли Кідо заявляє, що щось належить або не належить робити, це начебто означає, що такою є воля самого імператора. Принаймні так заведено вважати. Без підтримки Кідо будь-якому майбутньому урядові буде непросто проводити свої закони через Палату представників. Важливу роль відіграє і його невелике коло союзників у ЙСК, які так само, як і він, полюбляють вирішувати результат політичної боротьби."

 # China

  #101
  CHI_CountryInfo_Folder.101: "Примхи долі"
  CHI_CountryInfo_Content.1: "Небесний мандат..."
  CHI_CountryInfo_Content_desc.1: "Відколи існує земля, §WКитай§! веде боротьбу за панування над нею та її багатствами. Століттями добірні воїни Серединного царства вселяли жах у серця правителів давнини. Навіть у часи міжусобиць дух народу залишався незламним: як місяць то прибуває, то убуває, так і §WКитай§! переживає злети й падіння. §WЙого повернення до могутности§! неминуче.\n\n§RПринаймні так вони гадали.§!"
  CHI_CountryInfo_Content.2: "...У боротьбі, скверні та руїнах"
  CHI_CountryInfo_Content_desc.2: "Якою ж жорстокою буває доля, коли карає народ за його процвітання! Усе почалося з малого - чвар і суперечок серед урядовців. А потім прийшли §Rзахідні держави§!. Скориставшись технічною відсталістю імперії Цін, вони вкрили китайське узбережжя своїми концесіями. §WКитай§! втрачав §Wсуверенітет§!, наче йому поволі виривали зуб за зубом, - болісно й криваво.\n\n§GЯпонській імперії§! пощастило уникнути жахів імперіялізму, та вона довгі роки мусила спостерігати, як інші народи §GАзії§!, її брати й сестри, перетворювалися на звичайні майстерні для решти світу. Того доленосного липневого дня 1937 року §GЯпонія§! розпочала великий хрестовий похід, щоб завдяки своїй технічній перевазі скинути §Rімперіялістів§! до становища їхніх власних рабів."

  #102
  CHI_CountryInfo_Folder.102: "Століття чогось величнішого?"
  CHI_CountryInfo_Content.3: "П'ять модернізацій"
  CHI_CountryInfo_Content_desc.3: "Саме ця технічна перевага свого часу привернула увагу молодого §WҐао Цзун'у§!, який побачив у ній вирішальний чинник, що змінив хід війни на користь народів §GАзії§!. Після смерти свого наставника §GВан Цзінвея§!, який раніше обіймав посаду президента Республіки, §WҐао Цзун'у§! довелося облишити спокійне життя у передчасній відставці й знову опинитися в осередді політичних подій. §WҐао§! назвав свої головні перетворення, покликані, на його переконання, вивести §WКитай§! у сучасну добу, §G«П'ятьма модернізаціями»§!. Він обіцяє §Gдокорінне оновлення системи освіти§!, §Gрозширення промислового виробництва§!, §Gперехід до експортно орієнтованої економіки§! та багато іншого. §WҐао§! обіцяє чимало. Але чи стануть ці програми §Gкроком у майбутнє§!, чи §WКитай§! цього разу §Rзазнав остаточної поразки§! - покаже лише час."
  CHI_CountryInfo_Content.4: "§G==ОСОБЛИВОСТІ==§!"
  CHI_CountryInfo_Content_desc.4: "- Схиліть §WЮань§! на свій бік і §Gскористайтеся підтримкою§! своєї найнадійнішої фракції!\n\n- Пройдіть шлях давньої нації в сучасному світі!\n\n- Проведіть країну шляхом поміркованої модернізації або стрімголов рушайте назустріч майбутньому!"


 # Yunnan

  #101
  YUN_CountryInfo_Folder.101: "Уцілілий зі старої доби..."
  YUN_CountryInfo_Content.1: "Бастіон на периферії"
  YUN_CountryInfo_Content_desc.1: "Щоб зрозуміти становище колишньої провінції §WЮньнань§!, розташованої на крайньому південному заході §WКитаю§!, слід спершу поглянути на наслідки поразки під §WЧунціном§!. Перемога §RЯпонії§! в §Rбитві за Чунцін§! остаточно підірвала бойовий дух §Mсил Об’єднаного фронту§! в §WЮньнані§!. А після того, як уся §WПівденно-Східна Азія§! опинилася під §Rяпонським контролем§!, стало зрозуміло, що §WЮньнань§! уже не зможе протистояти §RЯпонії§! без тяжких втрат.\n\n§gЛун Юнь§!, багаторічний король §WЮньнані§!, не був дурнем і добре розумів, що не варто прирікати народ §WЮньнані§! на загибель у безглуздій битві. З іншого боку, §Rяпонська імператорська армія§! теж перебувала на межі виснаження: складна місцевість, труднощі з постачанням і довгі роки війни далися взнаки. Тож обидві сторони дійшли згоди, щоб уникнути марного кровопролиття."

  YUN_CountryInfo_Content.2: "Зміна варти"
  YUN_CountryInfo_Content_desc.2: "Однак залишалося одне невирішене питання - становище §gЛун Юня§!. За довгі роки правління він здобув величезний вплив у §WЮньнані§!, проте його відносини з §OВан Цзінвеєм§! та §Rяпонськими покровителями§! останнього були сповнені взаємної недовіри. Свого часу §gЛун Юнь§! став на бік Чан Кайші, який закликав засудити §RВан Цзінвея за зраду§!. За таких обставин §gЛун Юнь§! розумів, що втриматися при владі йому не вдасться.\n\nТому він передав посаду губернатора своєму двоюрідному братові §gЛу Ханю§!, кандидатура якого влаштовувала обидві сторони переговорів. Для §RЯпонії§! він був прийнятним завдяки своєму меншому впливові, а для §gЛун Юня§! залишався близьким родичем і давнім бойовим товаришем, якому можна було цілковито довірити справи §WЮньнані§!. За досягнутим компромісом §gЛун Юнь§! залишався в уряді як церемоніяльний його голова та заступник свого кузена. Тим часом §gЛу Хань§! офіційно уклав перемир’я й капітулював перед §h«Національним урядом Китаю»§!."

  YUN_CountryInfo_Content.3: "Новий король Юньнані"
  YUN_CountryInfo_Content_desc.3: "Сам §gЛу Хань§!, який колись рішуче відкидав будь-яку можливість миру з §Rяпонськими імперіялістами§!, став значно схильнішим до компромісу після того, як §rзвірства японської імператорської армії§! під час війни глибоко його приголомшили.\n\nТа прихід §gЛу Ханя§! до влади не розв’язав усіх проблем. §gЛун Юнь§! був надто тісно пов’язаний із владними структурами §WЮньнані§!, і його цілковите усунення неминуче спричинило б великі заворушення серед населення, місцевих племен та залишків війська. Тому сторони домовилися, що §gЛун Юнь§! збереже місце в уряді як церемоніяльний його голова та заступник свого кузена. Ставши новим очільником держави, §gЛу Хань§! офіційно уклав перемир’я й капітулював перед §h«Національним урядом Китаю»§!, а не безпосередньо перед §RЯпонією§!. Після смерти Чан Кайші §hнанкінський маріонетковий уряд§! залишився єдиним китайським урядом, тож такий вибір був цілком закономірним."

  #102
  YUN_CountryInfo_Folder.102: "...і авангард нової доби"
  YUN_CountryInfo_Content.4: "Скрутне становище Лу Ханя"
  YUN_CountryInfo_Content_desc.4: "У 1962 році §gЛу Хань§! і далі залишається при владі, і на перший погляд його становище видається непохитним. Насправді ж дедалі більшою загрозою для його правління стають §Yопозиційні рухи та повстанці§!, а серед населення зростає невдоволення чинним ладом.\n\nПричин цьому кілька. По-перше, подейкують, що мирні роки послабили колись палкі націоналістичні переконання §gЛу Ханя§!: доки §GНанкін§! дотримується обіцянок зберігати автономію Юньнаню, той не бачить жодної проблеми в подальшій співпраці. По-друге, тісні зв’язки з §Gмісцевими землевласниками§!, їхні щедрі подарунки, а подекуди й відверті хабарі роблять Лу Ханя дедалі байдужішим до добробуту простих жителів §Wкраю§!. Опинившись у замкненому колі повстанських нападів і поступок §hцентральній владі в Нанкіні§! заради стабільности, Лу Хань, на думку декого, остаточно розтратив усі симпатії, які міг здобути."
  YUN_CountryInfo_Content.5: "Амбіції Республіки"
  YUN_CountryInfo_Content_desc.5: "Проте Лу Хань бачив ситуацію інакше. §rЗвірства японської імператорської армії§! під час війни приголомшили його до глибини душі. Відтоді страх перед новим кровопролиттям спонукає його шукати інший шлях визволення §WКитаю§!. І §Gпрограма «П'яти модернізацій» президента Ґао Цзун'у§!, що саме набирає обертів, дає йому таку можливість. Це і прихований спосіб стримувати §Rяпонців§!, і нагода довести свою вірність - одне рішення, що дозволяє досягти обох цілей. Тож заради добробуту всього §WКитаю§! Лу Хань експлуатує народ §WЮньнані§!.\n\nУ глибині душі §gЛу§! розуміє, що його жорстокі методи покликані допомогти §WКитаю§! розірвати кайдани й нарешті здобути свободу. Проте більшості цього не збагнути. Та навіть такі наміри не здатні полегшити страждання пригноблених жителів §WЮньнані§!."
  YUN_CountryInfo_Content.6: "Похмурі думи Лун Юня"
  YUN_CountryInfo_Content_desc.6: "Кожен, хто знає про становище Юньнаню, навряд чи здивується, почувши, що колишній «король» краю §gЛун Юнь§! глибоко невдоволений. На його думку, двоюрідний брат утратив колишню честь і вже не є тією гідною людиною, яку він свого часу поважав.\n\n§YКитайське військо слабке§!, а §RЯпонія дедалі глибше занурюється в кризу§!. Тому Лун Юнь вважає, що наближається слушна нагода силою примусити §GНанкін§! краще ставитися до §Wпівденно-західних окраїн країни§!. Однак посада §gЛун Юня§! суто церемоніяльна й не дає достатніх повноважень, щоб чинити справжній тиск на центральний уряд. Та й §Rяпонці§! навряд чи дозволили б йому це зробити. Проте безсилим Лун Юня назвати не можна: він досі користується величезною повагою в §WЮньнані§! та за його межами. До того ж є ще §Yповстанці§!... які, можливо, стануть йому в пригоді, коли настане час."
  YUN_CountryInfo_Content.7: "§G==ОСОБЛИВОСТІ==§!"
  YUN_CountryInfo_Content_desc.7: "- Продовжуйте участь Лу Ханя в П'яти модернізаціях.\n\n- Дізнайтеся про життєвий шлях помітних противників його правління.\n\n- Дочекайтеся появи руху, який може згаснути, приректи §xвсю націю на страждання§! або §Mвизволити Китай§!."

 # TYUMEN

  #101
  TYM_CountryInfo_Folder.101: "Послідовники"
  TYM_CountryInfo_Content.1: "Падіння"
  TYM_CountryInfo_Content_desc.1: "Коли §RНіколай Бухарін§! очолив старий Союз, він узявся обмежувати вплив радикальних політиків. Саме в буремні 1940-ві роки §WЛазаря Каґановіча§! перевели на §WУрал§! - у віддалений край, куди ніхто не прагнув потрапити.\n\nКоли §GСовєцький Союз§! упав під натиском §Rфашистських загарбників§!, справжні послідовники комунізму втекли до §WЗахідного Сибіру§!, де §Wтовариш Каґановіч§! заснував §WЗахідносибірську народну республіку§!. Проте роки зрад і політичної нерішучости далися взнаки, призвівши зрештою до §Rрозпаду§! Республіки на кілька держав-уламків."
  TYM_CountryInfo_Content.2: "Відступ від догми"
  TYM_CountryInfo_Content_desc.2: "Під проводом §WЛазаря Каґановіча§! та §WНікіти Хрущова§! керівники §GТюмєні§! не дотримуються §Rортодоксального комунізму§!, адже невдачі режиму Бухаріна переконали їх, що в цьому світі справжню силу мають лише §Wзалізо й кров§!.\n\n§GМаршал Іван Конєв§! командує боєздатним ядром піхотних і бронетанкових частин, підкріпленим добре вишколеним тюмєнським ополченням. Проте найбільша сила Республіки, можливо, полягає в її прагненні до цілковитої індустріялізації за допомогою так званих §G«п'ятирічних планів»§! - §Rрадикальної й потенційно небезпечної§! альтернативи НЕПу."

  #102
  TYM_CountryInfo_Folder.102: "Сталь"
  TYM_CountryInfo_Content.3: "Земля"
  TYM_CountryInfo_Content_desc.3: "Сталеве місто §GТюмєнь§! наодинці протистоїть §Rультранаціоналістам Омска§! та §Rзрадницькій 3-й армії Свєрдловска§!. Тим часом у найпохмуріших підземних коридорах визріває грандіозна змова, яка, можливо, дозволить Союзові нарешті оговтатися від чотирьох десятиліть приниження. Глибоко під землею вичікує свого часу ціла армія - мільйон солдатів, робітників та противників старого режиму."
  TYM_CountryInfo_Content.4: "Битва"
  TYM_CountryInfo_Content_desc.4: "Початок смертельної битви за Росію - лише питання часу. І поки дрібні воєначальники ховаються від нищівних бомбардувань, Тюмєнь готується до війни. Її народ має залізну волю й добре усвідомлює, що стоїть на кону: або §Gвідродити Совєцький Союз§!, розчавити заколотників, які заполонили Батьківщину, та виправити фатальні помилки Бухаріна - §Rабо загинути в цій боротьбі§!."

 # OMSK

  #101
  OMS_CountryInfo_Folder.101: "Труп"
  OMS_CountryInfo_Content.1: "Надія"
  OMS_CountryInfo_Content_desc.1: "Найяскравіше полум'я поглинула найтемніша ніч, залишивши по собі лише дітей - заблудлу паству, що чіплялася за §Rмертві ідеології та оманливі надії§!. Їхні задуми суперечили один одному, аж поки спадкоємець не знищив сам себе. Із його мертвого тіла постала §WЧорна ліга§!. Російський народ утратив свій шанс на процвітання. §RТевтонський агресор§! скинув його в безодню й прирік спостерігати, як марніють цілі покоління, доки не буде відновлено справедливість. Майбутнє мертве. Та в місті-фортеці §WОмску§! ще жевріє іскра надії. Надії на те, що одного дня російський народ підніметься з могили й знову побачить світло."
  OMS_CountryInfo_Content.2: "Великий Суд"
  OMS_CountryInfo_Content_desc.2: "Наближається §RВеликий Суд§!, та всі довкола залишаються сліпими до його приходу. Його провістив §WДмітрій Карбишев§!, чиї згасаючі очі тепер споглядають чудовисько, народжене найтемнішою ніччю. Офіцери §WЧорної ліги§! під проводом §WДмітрія Язова§! збирають сили для останньої битви, яка визначить долю всього світу. Із заходом сонця Сибіром ширяться тривожні чутки про чорну пляму на мапі, звідки здіймаються зловісні хмари, приховуючи пересування солдатів, навчених безжально страчувати кожного, хто стане на шляху §Gнаціонального відвоювання§!."

  #102
  OMS_CountryInfo_Folder.102: "Філософія"
  OMS_CountryInfo_Content.3: "Виживання"
  OMS_CountryInfo_Content_desc.3: "Філософія §WЛіги§! проголошує §Gнаціональне виживання§! найвищою метою: російський народ мусить бути готовим до всього - чи то неминучого §RВеликого Суду§!, чи то §Rядерного апокаліпсису§!. Та мало хто усвідомлює, що §WНова гвардія§! §GОмска§! дедалі більше відступає від ідеалів Карбишева. У її залізних серцях палає жага помсти, якій немає рівних. Щоб §WЧорна ліга§! не втратила своєї єдности, вона мусить невпинно підживлювати полум'я розповідями про завоювання, адже зупинятися не можна. Саме поняття «цивільний» має зникнути, а кожне рало мусить перетворитися на меч. §RВеликий Суд§! не чекатиме."
  OMS_CountryInfo_Content.4: "Вороги"
  OMS_CountryInfo_Content_desc.4: "Омск з усіх боків оточений ворогами: §Rкомуністами Тюмєні, відступницькою Червоною армією Свєрдловска, не кажучи вже про численних воєначальників, розкиданих по всіх землях старої Росії§!. Чи загине §WЧорна ліга§!, повторивши долю своєї попередниці? А чи ніч стане ще темнішою?"

 # ZLATOUST

  #101
  ZLT_CountryInfo_Folder.101: "Порядні підприємці"
  ZLT_CountryInfo_Content.1: "Найбільше лихо"
  ZLT_CountryInfo_Content_desc.1: "Старий Совєцький Союз ніколи не любив добрих підприємців. Забагато хитрощів, забагато винахідливости, забагато ресурсів і замало §Rрабської покори§!, якої так жадала влада. Тож справді здібні люди не мали жодної нагоди проявити себе й досягти чогось більшого - принаймні доти, доки §Rвсе не розвалилося§!. Для мільйонів людей §Rнімецьке вторгнення§! стало найбільшим лихом, яке тільки можна уявити. А от для §GЄвґєнія Драґунова§!, найталановитішого зброяра Росії, крах Совєцького Союзу обернувся §Gнайбільшою діловою нагодою§!."
  ZLT_CountryInfo_Content.2: "Геній"
  ZLT_CountryInfo_Content_desc.2: "Оселившись у сибірському місті §GЗлатоуст§!, майстер-зброяр опинився далеко від катастроф, що охопили решту країни. Захопивши владу, він перетворив місто на справжній §Gрай§! для тих, хто §Rнаживається на війні§!. Незліченні дрібні воєначальники прагнули роздобути сучасну зброю, створену завдяки його генію, а §GДраґунов§! із неабияким завзяттям задовольняв їхні потреби. §GЗлатоуст§! став §Gоазою миру й процвітання§! в §WЗахідному Сибіру§!, хоча його багатство було збудоване на §Rздобичі з чужих війн§!. Лише §RЗахідносибірська народна республіка§! на чолі з тими самими §Rбольшевицькими§! головорізами, що колись завадили йому розбагатіти, стояла на його шляху."

  #102
  ZLT_CountryInfo_Folder.102: "Бізнес"
  ZLT_CountryInfo_Content.3: "Смута"
  ZLT_CountryInfo_Content_desc.3: "Тепер, коли §RЗахідносибірська народна республіка§! розпалася під тягарем власних міжусобиць, ділові перспективи стали §Gкращими, ніж будь-коли§!. Колишніх суперників приборкано, а попит на зброю тільки зростає разом із кількістю §Rдрібних територіяльних конфліктів§!. Разом зі своїм спільником §GМіхаілом Калашніковим§! Драґунов продовжує розробляти дедалі досконаліші зразки озброєння, дбаючи про те, щоб Росія §Gвоювала сама із собою§! доти, доки вони не зароблять §Gнайбільший у своєму житті статок§!. §GДраґунов§!, звісно, не заперечував би проти об'єднання Росії, але лише доти, доки воно не загрожує його підприємству. А будь-яку §Rзагрозу§! власній справі він готовий §Rпридушити§!, навіть якщо для цього доведеться зберегти країну роздробленою."
  ZLT_CountryInfo_Content.4: "Суперники"
  ZLT_CountryInfo_Content_desc.4: "Суперники §GДраґунова§! - догматична §RТюмєнь§!, прагматичний §RСвєрдловск§! і фанатичний §RОмск§! - зійшлися в §Gсмертельному танці уробороса§!, а він лише охочіше підживлює цю нескінченну боротьбу. Та вічно так тривати не може. Якщо одна зі сторін здобуде перевагу, вона неодмінно зверне свій гнів на того, хто постачав зброю її §Gненависним ворогам§!, і §Gжадатиме помсти§!. §GЗлатоуст§! мусить бути готовим до такого розвитку подій, і якщо §GДраґунову§! вдасться втілити свої задуми, він сидітиме на справжніх §Gдраконових скарбах§!."

 # URAL LEAGUE

  #101
  URL_CountryInfo_Folder.101: "Гвардія"
  URL_CountryInfo_Content.1: "Лиходії та герої"
  URL_CountryInfo_Content_desc.1: "У хаосі повоєнної Росії вистачає лиходіїв, але обмаль героїв. І ніде це протиставлення не проступає так виразно, як на Уралі, де бійці §WУральської ліги§! протистоять божевільним ученим §RМаґнітоґорска§! та безжальним бандитам §Rбригади Дірлеванґера§!."
  URL_CountryInfo_Content.2: "Вояки"
  URL_CountryInfo_Content_desc.2: "Колись вояки §WУральської ліги§! були лише в'язнями та охоронцями, замкненими серед сибірських пусток Воркути й покинутими напризволяще. Та коли вдерлися §Rнімці§!, усі колишні розбіжності довелося відкинути. Завдяки впливові §Wотця Яніса Мендрікса§! й усвідомленню того, що без взаємодопомоги загинуть усі, охоронці та в'язні об'єдналися й вирушили в довгий похід на південь, залишивши позаду лише найгірших зі своїх лав. Вони долали гірські перевали, відбивали §Rнапад§! за §Rнападом§!, а їхні лави невпинно рідшали. Нарешті діставшись південних відрогів Уралу, вони оселилися там і заприсяглися захищати всіх добрих і невинних людей краю."
  URL_CountryInfo_Content.3: "Південний Урал"
  URL_CountryInfo_Content_desc.3: "Відтоді §WУральська гвардія§! лише загартувалася, адже становище на §WПівденному Уралі§! від часу її прибуття значно погіршилося. На півдні §Rбригада Дірлеванґера§! сіє жах серед беззахисного населення, ґвалтуючи, грабуючи й убиваючи досхочу. На сході §RЧорна Гора§! вивергає клуби диму, а тисячі людей тікають від експериментів §RТрохима Лисенка§! та §RНКВД§!. На заході §Gоренбурзькі комуни§! залишаються бездіяльними, паралізовані нескінченними чварами своєї роздутої системи й нездатні навіть захистити себе. Та цілі §WУральської гвардії§! залишаються незмінними від самого її прибуття, і вона, без сумніву, віддасть усі сили заради їх здійснення. Проте чи досягне вона успіху - покаже лише час."
 
 # ORENBURG

  #101
  ORE_CountryInfo_Folder.101: "Комуни"
  ORE_CountryInfo_Content.1: "Місто на пагорбі"
  ORE_CountryInfo_Content_desc.1: "Серед безмежної анархії, що охопила Росію, причаївся відокремлений осередок стабільности - §WОрєнбурґ§!. Ставши нейтральною територією для навколишніх селянських поселень, після розпаду §Gстарого Совєцького Союзу§! місто поступово перебрало на себе роль фактичного осередку влади в регіоні. У ці похмурі й буремні часи §WОрєнбурґ§! став маяком надії для народу Росії. Селяни й біженці линуть до §Wнього§!, наче метелики на полум'я. Проходячи землями §GУральської ліги§!, вони приносять із собою свої історії, голодні роти й виснажені душі. Незліченні люди вирушають у довгу мандрівку до обітованої землі Південного Уралу, віддаючи все за шанс на краще життя. Та багатьох із них чекає гірке розчарування."
  ORE_CountryInfo_Content.2: "В оточенні"
  ORE_CountryInfo_Content_desc.2: "§WОрєнбурґ§! межує з §GУральською лігою§! - ополченням, що присвятило себе захистові народу, та §Rбригадою Дірлеванґера§! - бандитським королівством під владою §Rнімецьких§! фашистів, які ніколи не припиняли своїх грабунків. За їхніми землями лежить §RМаґнітоґорск, Чорна гора§!, що, за чутками, перебуває в залізній хватці божевільного вченого та його посіпак із §RНКВД§!."
  ORE_CountryInfo_Content.3: "Реформи"
  ORE_CountryInfo_Content_desc.3: "Навіть якби небо не кишіло бомбардувальниками, §WОрєнбурзькій робітничій державі§! все одно бракувало б організованости й рішучости для індустріялізації краю. Попри всі оповіді про її успіхи, §WОрєнбурґ§! залишається роз'єднаним і вразливим. §WРобітнича рада§! загрузла в нерішучості, внутрішніх чварах і бюрократії. Сільські комуни, які вона представляє, ревно оберігають свою незалежність і відкидають будь-які спроби централізувати край та створити бодай подобу дієздатного уряду. Якщо §WОрєнбурґ§! хоче вижити, йому доведеться змінитися.\n\nПроте далеко не всі підтримують §WРобітничу раду§!. §WАлєксандр Бурба§! мріє про технократичну республіку, здатну вивести §WОрєнбурґ§! у сучасну добу, тоді як його суперник §WҐєорґій Малєнков§! гуртує прихильників старого, більш совєцького способу врядування. Перед §WОрєнбурґом§!, як і перед усім Уралом, відкривається світле майбутнє. Але лише за умови, що Орєнбурґ матиме досить сил, аби його вибороти..."
 
 # MAGNITOGORSK

  #101
  MGN_CountryInfo_Folder.101: "Гора"
  MGN_CountryInfo_Content.1: "Місто стрімкого зростання"
  MGN_CountryInfo_Content_desc.1: "§WМаґнітоґорск§! стрімко розростався протягом XIX та на початку XX століття завдяки видобутку й переробленню неймовірно багатих покладів залізної руди гори Маґнітная. Після завершення Другої світової війни сталеливарні заводи зупинилися, а гора поринула в забуття. Та з прибуттям §Wдоктора Трохима Лисенка§! та §W22-ї мотострілецької дивізії НКВД§! колишня мережа шахт перетворилася на таємничу базу, куди мало хто наважувався потрапити, а поверталося ще менше. Незабаром місцеві жителі дали горі Маґнітная нове ім'я, що значно краще відповідало її лиховісній славі: §WЧорна Гора§!.\n\nГлибоко в надрах гори §WТрохим Лисенко§! продовжує свою «наукову» працю, розпочату понад три десятиліття тому. Він відкинув менделівську генетику й дарвінівську теорію еволюції, вважаючи їх класовою брехнею, що безпідставно переносить капіталістичне вчення про конкуренцію на саму природу. Адже насправді Мати-природа - соціялістка, і все суще прагне до співпраці."
  MGN_CountryInfo_Content.2: "Єдине табу"
  MGN_CountryInfo_Content_desc.2: "Пережиті випробування довели §WТрохима Лисенка§! до переконання, що коли на кону стоїть майбутнє соціялізму, жодних моральних меж дотримуватися не варто. Тож він переступив одну з небагатьох меж, яких досі не наважувався порушити, - почав ставити досліди на людях. Тепер Лисенко одержимий прагненням застосувати свої теорії для створення «нової совєцької людини», і нещасні жителі §WМаґнітоґорска§! вже відчули на собі наслідки цієї одержимости. Викрадати людей для експериментів йому допомагають бійці §WНКВД§! під командуванням §WСтєпана Бунькова§!. Їхні шляхи вперше перетнулися з божевільним ученим наприкінці Другої світової війни, коли підрозділ отримав наказ евакуювати Лисенка разом із його дослідженнями далеко за лінію фронту. Однак після остаточного краху державного порядку їм довелося об'єднати зусилля заради виживання. §WЛисенко§! переконав офіцерів, що його праця життєво важлива для відродження §GСовєцького Союзу§!, а будь-яка допомога буде щедро винагороджена після відновлення порядку й вигнання §Rнімецьких загарбників§!. Утім, §WБуньков§! іще може гірко пошкодувати про це рішення."
  MGN_CountryInfo_Content.3: "Не самі"
  MGN_CountryInfo_Content_desc.3: "Попри свою відносну ізольованість, §WМаґнітоґорск§! не залишився самотнім. Навколишні держави воєначальників - §RТюмєнь§!, §RЗлатоуст§! і §RКазахська ССР§! - не звертають на нього особливої уваги, і він має намір відповідати їм тим самим. Натомість на заході постала справжня загроза - §RУральська ліга§!, об'єднання колишніх в'язнів ҐУЛАҐу, які стали самовідданими ополченцями й бачать у §WЛисенкові§! та його цінних помічниках лише бандитів, яких слід вигнати зі своїх земель. Та на півдні знайшовся вельми несподіваний союзник - §Gбригада Дірлеванґера§!, готова надати грубу силу в обмін на награбоване добро й випивку. Якщо пощастить, бандити постачатимуть не лише піддослідних, а й додаткових бійців у разі війни з §RУральською лігою§!. Звісно, після спільної перемоги цей союз навряд чи проіснує довго."

 # DIRLEWANGER BRIGADE

  #101
  DRL_CountryInfo_Folder.101: "Бригада"
  DRL_CountryInfo_Content.1: "Король бандитів"
  DRL_CountryInfo_Content_desc.1: "§WБригада Дірлеванґера§! - справжнє прокляття Південного Уралу, і це не перебільшення. Це радше мандрівне військо, що перетворилося на бандитську орду, ніж повноцінна держава, адже всюди, де воно проходить, залишає по собі кров і жах. Очолює його §WОскар Дірлеванґер§! - колишній офіцер, що став королем бандитів і впивається стражданнями, яких завдає мешканцям навколишніх сіл.\n\nОднак історія бригади почалася не на Уралі, а в §RТретьому Райху§!, де вона була штрафним підрозділом під назвою §W36-та ґренадерська дивізія Ваффен§! під командуванням §Wоберфюрера СС Оскара Дірлеванґера§! - ветерана з багаторічним стажем, відомого своїм алкоголізмом, садистським насильством і зґвалтуваннями. Замість того щоб демобілізуватися під час Західноросійської війни, §Wбригада§! покинула фронт і втекла в глушину. Відтоді до її лав прибилася ціла ватага злодіїв, вигнанців, бандитів, дезертирів та інших покидьків, яких кровопролиття й награбована здобич цікавлять куди більше, ніж те, з ким їм доводиться заради цього воювати пліч-о-пліч, навіть із колишніми §Rнацистами§!."
  DRL_CountryInfo_Content.2: "Без держави"
  DRL_CountryInfo_Content_desc.2: "§WБригада§! не присягає на вірність жодній державі, не визнає влади чужих вождів і не схиляється ні перед ким, окрім самих себе. І хоча бандити опинилися в одному з найбідніших закутків колишнього §RСовєцького Союзу§!, їхні погляди вже звернені до значно багатшої здобичі.\n\nНа півдні та сході лежить §RКазахська ССР§!, що перебуває у схожому становищі: погано озброєна, ізольована й майже позбавлена того, що можна пограбувати. На півночі стоїть §RУральська ліга§! - цілковита протилежність §Wбригаді§!. Якщо люди Дірлеванґера були солдатами, які стали бандитами, то бійці Ліги - колишні в’язні ҐУЛАҐу, які стали гідними воїнами й присвятили себе боротьбі з бандитизмом. Є також потайлива держава §GМаґнітоґорск§!, яку з §Wбригадою§! єднає ненависть до §RУральської ліги§!, а спільні інтереси можуть навіть привести їх до тимчасового союзу. Проте на заході лежить справжня перлина - §RОрєнбурґ§!: майже не зачеплений війною, зі слабким урядом та неорганізованим військом, він видається легкою здобиччю."
  DRL_CountryInfo_Content.3: "Проста мета"
  DRL_CountryInfo_Content_desc.3: "Мета §Wбригади§! проста: мчати туди, де вони ще не бували, стріляти в кожного, хто наважиться чинити опір, загарбати стільки багатств, скільки зможуть вивезти, використовувати жінок для власної втіхи, вирізати всіх, хто трапиться на очі, спалити все, що залишиться, й помчати далі в пошуках нових жертв.\n\nМожливо, невдовзі настане день, коли бригаду нарешті зупинять, а останній бандит упаде мертвим серед степу й народ Уралу зможе жити без страху. Та доки цей день не настав, §Wбригада Дірлеванґера§! мчатиме вперед, а світ тремтітиме перед нею!"

 # KOMI REPUBLIC

  #101
  KOM_CountryInfo_Folder.101: "Нова республіка?"
  KOM_CountryInfo_Content.1: "Старі невдачі"
  KOM_CountryInfo_Content_desc.1: "Невдачі §RНіколая Бухаріна§!, §rнімецьке§! вторгнення та поразка §RЗахідноросійського революційного фронту§! у війні проти §rНімецького Райху§! надто дорого обійшлися народові Росії, принісши неймовірні жахіття й злидні майже без жодних здобутків. Замість робітничої утопії, обіцяної §Rсовєцьким урядом§!, комуністичний експеримент зазнав краху, а війна вдруге за два десятиліття спустошила Західну Росію.\n\nВійна, політичні провали §RФронту§!, а зрештою вбивство Алєксєя Рикова й бомбардування §RПрезидії Західноросійського революційного фронту§! стали останньою краплею для уряду Комі. §GНіколай Алєксєєвіч Вознєсєнскій§!, новопризначений голова §GКомі АССР§!, власним рішенням проголосив незалежність від §RФронту§!. У цьому його підтримали численні колишні діячі §RЗРРФ§!, серед яких §xМіхаіл Андрєєвіч Суслов§!, міністр закордонних справ Фронту, та §SАндрєй Алєксандровіч Жданов§!, визначний діяч Комінтерну."
  KOM_CountryInfo_Content.2: "Атмосфера екстремізму"
  KOM_CountryInfo_Content_desc.2: "Після виходу §GКомі АССР§! зі складу §RФронту§! й проголошення нової §Gреспубліки§! він утратив іще одну столицю, а політична єдність §RФронту§! остаточно розсипалася. Дедалі численніші сепаратисти підточували сили §RЗРРФ§! ще до того, як Фронт устиг розпочати операції з придушення заколотів та приборкання воєначальників.\n\nТим часом демократичний устрій §GРеспубліки Комі§! набував дедалі більшої слави по всій Західній Росії, а розвинений Сиктивкар переповнювався біженцями з інших, менш гостинних державок. Проте всередині §Gреспубліки§! почала ширитися атмосфера політичного радикалізму, яку підживлювали співпраця §GВознєсєнского§! з комуністами §SЖданова§! та прихований вплив §Rполітиків-екстремістів§!, звільнених із численних колишніх таборів ҐУЛАҐу в регіоні."
  KOM_CountryInfo_Content.3: "Стан справ"
  KOM_CountryInfo_Content_desc.3: "Становище §GРеспубліки§! у 1962 році аж ніяк не сприяє існуванню дієвої демократії. Злочинність сягнула найвищого за останній час рівня, а постійні вуличні сутички між воєнізованими угрупованнями раз у раз порушують спокій Сиктивкара. За лаштунками точиться безупинна боротьба між прихильниками різних ідеологій, що виливається у вбивства, крадіжки, шахрайство, напади, вимагання та змови проти Республіки.\n\nПолітики §GРеспубліки Комі§! зажили недоброї слави через рису, яка, здається, пронизує всю §Gреспубліку§!, - майже хворобливу пристрасть до інтриг, ударів у спину та боротьби за владу. Подобаються їм такі підступні методи чи ні, саме середовище §Gреспубліки§! змушує до них вдаватися. Тому політики, яким вдається вистояти в цій неймовірно напруженій атмосфері, виходять із неї загартованими, мов діяманти, - справжніми майстрами інтриг і політичних маневрів, здатними підкорити своїй волі цілі партії."

  #102
  KOM_CountryInfo_Folder.102: "Гравці політичної гри"
  KOM_CountryInfo_Content.4: "Центр"
  KOM_CountryInfo_Content_desc.4: "Попри розмаїття демократичних партій та суперечності, що роз'єднують політичні рухи Комі, §Gреспубліку§! рятує те, що сама демократія також стала предметом запеклої політичної боротьби. Наполегливі спроби зруйнувати демократичний лад змусили досі розрізнені центристські партії об'єднатися в непевну коаліцію, щоб за будь-яку ціну зберегти виборчу систему й дати відсіч радикалізму. Правляча §PДемократична соціялістична народна партія (ДСНП)§!, §MСоюз молодих реформаторів (СМР)§! та §gПартія суверенної демократії (ПСД)§! загартувалися в політичній боротьбі й стали союзниками в непростих умовах §Gреспубліки§!."
  KOM_CountryInfo_Content.5: "Ліві"
  KOM_CountryInfo_Content_desc.5: "§xКомуністична партія Комі§! вирізняється з-поміж інших як найзгуртованіше політичне «крило» республіки. Сумнозвісний §xМіхаіл Суслов§! викував із крайніх лівих міцну політичну машину, яка одну за одною проводить успішні операції з розпалювання скандалів, підриву народної довіри до уряду й підтримання постійного тиску на силові структури §Gреспубліки§!. Однак попри зовнішню єдність, усередині §xКомуністичної партії§! далеко не все гаразд. Розбіжності між її провідниками залишаються непомітними для громадськости, але за зачиненими дверима їх уже неможливо приховати. На думку наближених до партійного керівництва, зіткнення між ортодоксальним крилом §xМіхаіла Суслова§! та §rІвана Сєрова§! й реформістським крилом §SАндрєя Жданова§! та §lСвєтлани Бухаріної§! неминуче. Залишається лише з'ясувати, наскільки руйнівними будуть його наслідки для самих підвалин §xпартії§!."
  KOM_CountryInfo_Content.6: "Праві"
  KOM_CountryInfo_Content_desc.6: "§OОрганізація «Пассіонарії»§! - чи не найдивніше політичне утворення в Комі, що поєднує в собі світський клуб, таємне товариство й осередок зі створення політичних коаліцій. Під широким крилом §O«Пассіонарієв»§! зібралися євразійці, «співчутливі консерватори», монархісти та інші, менш численні рухи, яких об'єднує лише прагнення спрямувати §GРеспубліку§! на новий, правий політичний шлях. §O«Пассіонарії»§! безперечно є найстрокатішою коаліцією Комі, що охоплює практично всі течії правої політичної думки. І саме тому ця організація, хоч як парадоксально, водночас потерпає від внутрішніх чвар і демонструє надзвичайну політичну дієвість у §Gреспубліці§!. Кажуть, серед §O«Пассіонарієв»§! знайдеться місце для кожного: підконтрольні організації засоби масової інформації привертають увагу народу, регулярно проводяться мітинги, а §Gцентристська коаліція§! з кожним днем змушена дедалі уважніше придивлятися до політиків, пов'язаних із §O«Пассіонаріями»§!."
 
 # VYATKA

  #101
  VYT_CountryInfo_Folder.101: "Вже вкотре"
  VYT_CountryInfo_Content.1: "Привид"
  VYT_CountryInfo_Content_desc.1: "Майже цілковитий крах совєцької влади після Західноросійської війни з роками призвів до появи всіляких честолюбних воєначальників, які постали з попелу й заявили свої права на Росію. Серед них є й привид із бурхливого минулого країни - рештки династії Романових на чолі з §WВладіміром III§! та його союзниками."
  VYT_CountryInfo_Content.2: "Удар імперії"
  VYT_CountryInfo_Content_desc.2: "Під час Західноросійської війни німецьке військо, опинившись у скрутному становищі, дозволило дивізії европейських емігрантів, відданих вигнанцеві §WВладіміру Кірілловічу§!, долучитися до боротьби проти відродженої §RЧервоної армії§!. Монархісти відіграли ключову роль у відчайдушному наступі вермахту, а коли німці зрештою були змушені відступити, продовжили наступ самотужки й зуміли міцно закріпитися у §WВятці§!. Тепер §WВладімір III§! та емігрантські угруповання тримають у своїх руках найпотужніший оплот монархізму в усій Росії."

  #102
  VYT_CountryInfo_Folder.102: "Тяжке завдання"
  VYT_CountryInfo_Content.3: "Усередині…"
  VYT_CountryInfo_Content_desc.3: "Усередині §Wкнязівство§! розділене між трьома однаково впливовими емігрантськими політичними угрупованнями. Перше з них - конституційні демократи на чолі з емігрантом §WРоманом Ґулєм§!, які представляють ліберальні сили. Вони прагнуть створити дієву конституційну монархію з ґарантованими правами меншин. Друге - солідаристи під проводом §WАлєксандра Солженіцина§!, переконані націоналісти з певними авторитарними нахилами. Водночас вони теж виступають за часткове реформування застарілих порядків минулого. Нарешті, третю силу становить Всеросійський національний союз - угруповання §WВасілія Шульґіна§!. §WШульґін§! - політик старої школи, чия діяльність сягає ще часів царя Ніколая II. Подібно до лібералів, він також підтримує конституційний лад, однак не бажає відступати від традицій старої імперії."
  VYT_CountryInfo_Content.4: "…і зовні"
  VYT_CountryInfo_Content_desc.4: "Ззовні §WВятку§! оточують численні потенційні загрози. На південному сході найбільшу небезпеку становлять божевільні з §RАрійського братства§!. На півночі непередбачувана й нестабільна §RРеспубліка Комі§! потребує пильного нагляду, а §RЗахідноросійський революційний фронт§! поступово оговтується. Якщо §WВятка§! прагне об'єднати Росію, зіткнення з ними неминуче. Тим часом із заходу та півдня регулярно здійснюють набіги §Rтатарські§! й §Rбашкирські§! воєначальники, проте наразі ці сутички навряд чи переростуть у повномасштабну війну. Далі на південному заході розташувалися §RАндрєй Власов§! та так звана §RРосійська визвольна армія§!, що базується в §RСамарі§!. На відміну від §Rтатар§!, вони плекають експансіоністські амбіції й можуть створити чимало проблем у майбутньому, якщо їх вчасно не стримати. На сході лежать землі §GҐайни§!. Відносини з §GҐайнами§! досі були переважно приязними, тож, можливо, їх удасться залучити на свій бік.\n\nТепер §WВятське князівство§! стоїть на порозі тяжкого завдання - остаточного об'єднання Росії. Чи судилося Росії знову опинитися під владою царя?"

 # SAMARA

  #101
  SAM_CountryInfo_Folder.101: "Визвольна армія"
  SAM_CountryInfo_Content.1: "Найкривавіші дні"
  SAM_CountryInfo_Content_desc.1: "У найкривавіші дні Західноросійської війни, коли здавалося, що Райх ось-ось назавжди втратить владу над Росією, німецьке верховне командування вдалося до відчайдушних заходів, аби врятувати фронт від розвалу. Так із різноманітних допоміжних колоніяльних ополчень, сформованих із російських призовників для підтримання порядку на окупованих німцями землях, постала §WРосійська визвольна армія§!, або §WРОА§!. Німецька пропаганда змальовувала §WРОА§! як горде російське військо, що бореться проти §Rбольшевицької§! загрози в особі §RЗахідноросійського революційного фронту§!. У відчаї німці навіть дозволили створити §WКомітет визволення народів Росії§!, або §WКОНР§!, який мав стати зародком вільної Російської республіки й керувати землями, визволеними під час німецьких контрнаступів."
  SAM_CountryInfo_Content.2: "Хрестовий похід"
  SAM_CountryInfo_Content_desc.2: "Та дійсність була для §WРОА§! куди менш привабливою. Її провідник, §WАндрєй Власов§!, колишній генерал Червоної армії, був не більш ніж маріонеткою в руках верховного командування вермахту. Його офіцерський корпус являв собою строкате й роз’єднане товариство. Чимало офіцерів Червоної армії, потрапивши в полон, воліли вступити до §WРОА§!, ніж загинути в німецькому таборі військовополонених. Інші ж були емігрантами-фашистами, які долучилися до §WРОА§! заради великого хрестового походу проти §Rбольшевизму§!. Натомість рядові солдати були лише гарматним м’ясом: німці примусово набирали їх під дулами рушниць і кидали на найнебезпечніші ділянки фронту, де становище було майже безнадійним. Та росіяни, які опинилися в зоні бойових дій, аж ніяк не вітали солдатів §WРОА§! як визволителів, натомість зустрічаючи їх камінням і лайкою."

  #102
  SAM_CountryInfo_Folder.102: "Рух уперед"
  SAM_CountryInfo_Content.3: "Відчайдушна завзятість"
  SAM_CountryInfo_Content_desc.3: "Попри все, §WРОА§! продовжувала наступ. Її солдати билися з відчайдушною завзятістю й зуміли допомогти переломити хід боїв поблизу §WСамари§!. Невдовзі §WРОА§! опинилася по той бік німецьких ліній, звільнившись від своїх колишніх наглядачів. Коли війна добігала кінця, а §RЗРРФ§! відступав, німці списали своє гарматне м'ясо як бунтівних слов'янських унтерменшів. Тож новий штаб §WРОА§! в Самарі також не уникнув терористичних бомбардувань, що розпочалися згодом. Відтоді §WРОА§! зачаїлася в Самарі, промінявши одну в'язницю на іншу. Через безперервні бомбардування вона не може розширити підконтрольні землі, а повернення додому, на захід, для її людей закрите. Так рядові солдати провели більшу частину десятиліття, нидіючи у своїх гарнізонах."
  SAM_CountryInfo_Content.4: "Нерішучість"
  SAM_CountryInfo_Content_desc.4: "Тим часом офіцери §WРОА§! дедалі більше невдоволені нерішучістю §WВласова§!. Вони виступають за децентралізацію керівництва й відмову від початкової демократичної місії §WКОНР§! на користь збереження військової хунти §WРОА§!. Офіцерський комітет використовує генерала §WСєрґєя Бунячєнка§! як свого речника й плете інтриги, сподіваючись скористатися байдужістю та похилим віком §WВласова§!. Проте серед самих офіцерів немає ідеологічної єдности. Чимало з них утворили продемократичну фракцію й наполягають, що наступником §WВласова§! на посаді голови §WКОНР§! має стати §WМілєтій Зиков§! - колишній журналіст, який завдяки політичним маневрам зумів стати головним пропагандистом режиму §WРОА§! в Самарі. Зиков виступає за продовження боротьби за визволення Росії як від §Rбольшевизму§!, так і від німецького гноблення. Водночас чимало рядових солдатів і молодших офіцерів, стомлених нескінченними чварами верховного командування, прагнуть підтримати задум генерала §WАрцезо§! - використати §WРОА§! для розбудови сильної фашистської держави... і заразом збагатити солдатів."
  SAM_CountryInfo_Content.5: "Роздоріжжя"
  SAM_CountryInfo_Content_desc.5: "§WРОА§! стоїть на роздоріжжі. Її бійців ненавидять усі сусіди, вважаючи німецькими колябораціоністами, але водночас бояться їхнього загартованого в боях війська та залізної дисципліни. Чекаючи на кінець терористичних бомбардувань, одні бійці §WРОА§! прагнуть спокутувати свою ганьбу, відбудувавши Росію. Інші жадають помсти комуністам і німцям, які зруйнували їхнє життя. А меншість, лави якої невпинно зростають, воліє просто зігнати свою лють на байдужому світі, який змусив їх змарнувати ціле десятиліття, замкненими в Самарі."

 # ONEGA

  #101
  ONG_CountryInfo_Folder.101: "Гвардія"
  ONG_CountryInfo_Content.1: "Клята брехня"
  ONG_CountryInfo_Content_desc.1: "Третій Райх запевняв народ §GФінляндської республіки§!, що §RСовєцький Союз§! більше ніколи не загрожуватиме ані Фінляндії, ані її територіяльним здобуткам у §WКарелії§!.\n\nЗахідноросійська війна довела, що все це було клятою брехнею. §RЗахідноросійський революційний фронт§!, утворений із залишків Червоної армії в Західній Росії, ледь не зруйнував установлений Німеччиною новий порядок у Европі. Коли вляглася воєнна курява, §GФінляндська республіка§! виявила, що її східний кордон опинився під контролем залишків §RЗРРФ§!. Усвідомивши, що в питаннях безпеки може покладатися лише на себе, Фінляндія вдалася до... неортодоксальних заходів."
  ONG_CountryInfo_Content.2: "На схід"
  ONG_CountryInfo_Content_desc.2: "§WРосіян§!, які мешкали в Карелії та навколо §WОнезького озера§!, захопила нова військова влада §GФінляндії§!. Чоловіків розлучили з родинами й силоміць мобілізували до новоствореної §GАнтикомуністичної добровольчої гвардії§!. Це військо приречених під проводом колишнього генерала Червоної армії §WВладіміра Кірпічнікова§! мало утримувати прикордонні землі між Фінляндією та §RЗРРФ§!. Накази з Гельсінкі були простими: гвардійці мали лише обороняти §WКарелію§! від §Rбандитів§! та §Rкомуністів§! зі сходу. За віддану службу їм обіцяли дозволити знову побачити свої родини."
  ONG_CountryInfo_Content.3: "Свобода"
  ONG_CountryInfo_Content_desc.3: "Минуло майже десятиліття, а гвардійці досі чіпляються за обіцянку знову побачити свої родини. Їхня служба виснажлива й невдячна. Патрулюючи суворі північні землі навколо §WОнезького озера§! та борючись із бандитами й комуністичними диверсантами, вони з тривогою вдивляються на схід. У Західній Росії віють вітри змін, і невдовзі їхні співвітчизники, ймовірно, прийдуть повернути землі, загарбані §GФінляндією§!. Попри брак належного спорядження, гвардійці не полишають своєї варти. Їхня служба неодмінно принесе їм свободу - так чи інакше."
 
 # WEST RUSSIAN REVOLUTIONARY FRONT

  #101
  WRS_CountryInfo_Folder.101: "Оповідь про війну"
  WRS_CountryInfo_Content.1: "Проти гітлерівців"
  WRS_CountryInfo_Content_desc.1: "§RВелика вітчизняна війна§! проти §Rфашистських загарбників§! коштувала совєцькому народові всього, що він мав, і навіть більше. Нацисти виявляли неймовірну жорстокість у своєму хрестовому поході проти самої совєцької цивілізації. Не залишилося, мабуть, жодного чоловіка чи жінки, хто не втратив би когось із близьких від рук §Rгітлерівців§!.\n\nСеред хаосу й безвладдя, що запанували після цілковитого краху центральної влади, залишки §GЧервоної армії§! на заході перегрупувалися в Куйбишеві під проводом §Gверховного маршала Алєксандра Єґорова§!. З усіх куточків колишнього Совєцького Союзу під його знамена стікалися вірні частини §GЧервоної армії§!, зокрема Шоста й Дев'ята армії під командуванням маршалів §GМіхаіла Ніколаєвіча Тухачєвского§! та §GҐєорґія Константіновіча Жукова§! відповідно. Спираючись на ці потужні механізовані сили та союз із впливовими політичними діячами, новостворений §WЗахідноросійський революційний фронт§! зумів утвердити свою владу над усіма розрізненими залишками Союзу на захід від Уралу."
  WRS_CountryInfo_Content.2: "Удар..."
  WRS_CountryInfo_Content_desc.2: "Наприкінці 1950-х років, коли §RРайх§! був паралізований найруйнівнішою економічною кризою в історії, а §GЧервона армія§! дедалі дужче прагнула помститися за свою поразку, §Gверховний маршал Єґоров§! вирішив, що настав час розпочати §Rоперацію «Суворов»§! - визволення всіх совєцьких земель, що перебували під окупацією §Rнімецьких§! військ. Хоча Лазар Каґановіч відмовився залучити до операції сили Західносибірської народної республіки, наступ §GЧервоної армії§! був стрімким і нищівним. Уже на 28-й день операції було визволено Сталінґрад, що спонукало §RСС§! під проводом §RГайнріха Гіммлера§! до спроби державного перевороту. Скориставшись міжусобицями у ворожих лавах, війська §GЧервоної армії§! вже на 40-й день дісталися околиць Лєнінґрада й Москви."
  WRS_CountryInfo_Content.3: "...і відступ"
  WRS_CountryInfo_Content_desc.3: "На хвилі стрімких успіхів мало хто помічав §Rтріщини§!, які роками ширилися в політичній структурі §WФронту§!. Справжні причини §Rрозпаду§! §WФронту§! під час §RЗахідноросійської війни§! досі залишаються невідомими. Припущення різняться: від спроби захоплення влади §RСусловим§! до краху командної структури, виснаженої надмірним навантаженням. Коли безпека §Gвійськового керівництва§! опинилася під загрозою через §Rвідновлений німецький наступ§! із залученням колябораціоністських сил §RРосійської визвольної армії§! та §RВладіміра Романова§!, уряд перебрався до Сиктивкара. Після політичних потрясінь і низки поразок від ворога §RРеспубліка Комі§! вийшла зі складу §WФронту§!. Подальша хвиля переходів на бік противника та відокремлення інших територій ознаменувала кінець §RЗахідноросійської війни§! й загибель §WЗахідноросійського революційного фронту§!."

  #102
  WRS_CountryInfo_Folder.102: "Оповідь про виживання"
  WRS_CountryInfo_Content.4: "Життя триває"
  WRS_CountryInfo_Content_desc.4: "Принаймні так вважали §Rнімці§!. §WФронт§! досі існує, відчайдушно чіпляючись за життя серед промерзлої тундри довкола змученого війною §GАрхангельська§!. Тим часом його генералів роздирають гострі суперечності після катастрофічного провалу §Rоперації «Суворов»§!. Маршалів §GМіхаіла Ніколаєвіча Тухачєвского§! та §GҐєорґія Константіновіча Жукова§! вважають двома найімовірнішими наступниками §GЄґорова§! в разі його §Rпередчасної смерти§!."
  WRS_CountryInfo_Content.5: "Маршали"
  WRS_CountryInfo_Content_desc.5: "§GТухачєвскій§! - дещо ексцентричний офіцер, переконаний, що саме §GЧервона армія§! має стати головною рушійною силою політичних змін. Колись дворянин, він відкинув усталені погляди свого стану й під час §Gгромадянської війни§! пристав до большевиків. Тепер §GТухачєвскій§! здобув підтримку різних угруповань Фронту, які прагнуть уникнути помилок §RБухаріна§! й повернути §GСССР§! колишню §Gвійськову славу§!, а то й §Gперевершити її§!. У їхньому баченні кожен ґвинтик державної машини має працювати заради єдиної мети, а кожен солдат - крокувати до остаточної перемоги.\n\n§GЖуков§! - шанований командувач, який здобув славу й повагу своїх бійців ще за часів §Gгромадянської війни§! й зберіг їх до §Rоперації «Суворов»§!, під час якої разом із §Gмаршалом Момишули§! очолив визволення Сталінґрада. Хоча §GЖуков§! непохитно відданий комуністичній справі, його політичне угруповання привернуло увагу прихильників реформ, зокрема §GАлєксандра Яковлєва§! та §GНіколая Рижкова§!, а також багатьох прихильників жорсткого курсу, які не належать до фракції Тухачєвского, серед них і §GСєрґєя Ахромєєва§!."
  WRS_CountryInfo_Content.6: "А тепер..."
  WRS_CountryInfo_Content_desc.6: "Тепер, у 1962 році, становище §WФронту§! залишається вкрай непевним. За межами земель, підконтрольних §GАрхангельську§!, простягаються §Rдрібні державні утворення§! під владою §Rсамозваних сепаратистів, колябораціоністів, царистів та інших претендентів на владу§!. Лише час покаже, чи зможе §WФронт§! знову стати захисником Західної Росії, а можливо, навіть §Gвозз'єднати Батьківщину§!, §Gпомститися за полеглих§! і звершити §Gправосуддя§! над §RНімеччиною§!."

  # ARYAN BROTHERHOOD

  #101
  PRM_CountryInfo_Folder.101: "Тричі"
  PRM_CountryInfo_Content.1: "Російська свідомість"
  PRM_CountryInfo_Content_desc.1: "Поразка в §RЗахідноросійській війні§! залишила глибокі шрами в свідомості росіян. За одне століття §RРосія§! тричі воювала з §GНімеччиною§!, і щоразу війна закінчувалася поразкою та крахом. Дедалі більше людей починали вірити, що твердження §Gнацистів§! про расову вищість не позбавлені підстав, а російський народ ніколи не матиме достатньо сил, щоб протистояти німецькому §Gуберменшу§!. Одні сприйняли це як гірку життєву істину й змирилися з існуванням у вічному страху перед §Gрасою панів§!. Та знайшовся чоловік, який відмовився змиритися з власним поневоленням."
  PRM_CountryInfo_Content.2: "Ватага"
  PRM_CountryInfo_Content_desc.2: "Коли §RРосія§! знову поринула в анархію, §WҐутрум Ваґнер§! зібрав навколо себе ватагу покидьків і дегенератів. Для нього §RЗахідноросійська війна§! стала справжнім одкровенням. Він на власні очі побачив могутність §Gраси панів§!, коли німці розгромили §RЗахідноросійський революційний фронт§!. §GВаґнер§! був переконаний, що і він сам, і його прибічники наділені тією самою силою. Вони одними з перших дійшли висновку, що §Gарійство§! визначається не фізичними ознаками, а психологією. У лісах поблизу §RПєрмі§! ці люди заприсяглися знищити §Rслов'янських§! тиранів, які так довго гнобили §Gуберменша§! Сходу. §WВаґнер§! проголосив себе §Wфюрєром§! §WАрійського братства§!, і так народився новий кошмар для §RРосії§!."

  #102
  PRM_CountryInfo_Folder.102: "Братство"
  PRM_CountryInfo_Content.3: "Доктрина"
  PRM_CountryInfo_Content_desc.3: "Звістка про доктрину §WБратства§! швидко ширилася, і невдовзі §WВаґнер§! уже мав тисячі прибічників. До його лав приставали найрізноманітніші люди: одні шукали спокути, інші - прихистку, а ще інші жадали безмежного насильства. І все це §WБратство§! було готове їм дати. Відчувши, що настав час розпочати свій хрестовий похід, §Wфюрєр§! зі своїм військом увірвався до §RПєрмі§!, винищив §Rслов’янських§! воєначальників, які правили містом, і проголосив народження нової §Gарійської§! цивілізації, покликаної визволити §Gуберменша§! на Сході, як це вже зробила §GНімеччина§! на Заході. Першим кроком стало очищення новоохрещеного §GПєрмьхаіма§! шляхом убивства або поневолення §Rунтерменшів§!, які досі мешкали в місті."
  PRM_CountryInfo_Content.4: "Пєрмьхаім"
  PRM_CountryInfo_Content_desc.4: "Відтоді як §GПєрмьхаім§! опинився в руках §WБратства§!, його прибічники не припиняють грабувати західні землі §RРосії§!, прочісуючи схід у пошуках здобичі, рабів і нечисленних §Gарійців§!, які ховаються серед §Rслов’янських§! мас і лише чекають, поки їхні просвітленіші брати піднесуть їх до належного становища. Для §Rнедолюдських§! воєначальників цього краю §WБратство§! - лише ватага дикунів на чолі з божевільним. Та §Wфюрєр§! переконаний у протилежному. Він поведе §Gуберменша§! на остаточне завоювання Сходу, остаточно очистить землю §RРосії§! від §Rслов’янської§! скверни й назавжди забезпечить майбутнє §Gарійської§! раси."
 
  # IRELAND

  #101
  IRE_CountryInfo_Folder.101: "Від однієї імперії до іншої"
  IRE_CountryInfo_Content.1: "Смарагдовий острів"
  IRE_CountryInfo_Content_desc.1: "Уперше за багато років Ірляндія стала вільною. Відколи 1603 року країна опинилася під п’ятою англійських Тюдорів, цілі покоління ірляндців не знали іншої долі, крім життя громадян другого сорту на власній землі. Королі й королеви приходили та відходили, але незмінним серед усіх хитросплетінь історії Британських островів залишалося беззаперечне панування Лондона. Усе змінилося одного доленосного дня 1919 року.\n\nКровопролиття Першої світової війни поставило Британську імперію на межу виснаження. Цілі покоління, серед них і тисячі ірляндських добровольців, було кинуто в жорна війни. У 1916 році §nІрляндське республіканське братство§! підняло в Дубліні шестиденне повстання проти імперської влади, проголосивши нову Ірляндську республіку. І хоча британська армія придушила «Великоднє повстання», зламати дух ірляндського народу їй так і не вдалося."
  IRE_CountryInfo_Content.2: "Брат проти брата"
  IRE_CountryInfo_Content_desc.2: "У 1921 році революційний запал знову сягнув небувалих висот. Під політичним проводом §nЕймона де Валери§! та військовим керівництвом §DМайкла Коллінза§! Ірляндія вкотре спробувала здобути незалежність від Англії. Виснажена Першою світовою війною, Британія виявилася неспроможною придушити партизанську війну, що дедалі більше розгорялася. Зрештою, опинившись у безвиході, Лондон був змушений поступитися й визнати суверенітет Ірляндії. Проте залишалося питання, яке невдовзі стане першим із багатьох приводів для нових конфліктів: §OПівнічна Ірляндія§! й далі перебувала у складі Британії, над нею все ще майорів британський прапор.\n\nСаме це, разом із присягою на вірність Короні, яку змусили скласти Ірляндію, стало поштовхом до громадянської війни. Противники договору на чолі з де Валерою виступили проти прихильників угоди, очолюваних Коллінзом. Ще донедавна ірляндці пліч-о-пліч тримали зброю проти спільного ворога, а тепер спрямували її один проти одного. Обидві сторони не цуралися найжорстокіших звірств."
  IRE_CountryInfo_Content.3: "Надзвичайний стан"
  IRE_CountryInfo_Content_desc.3: "Завдяки військовій хитрості Коллінза та перевазі Національної армії в чисельності й озброєнні противників договору з ІРА вдалося відтіснити, аж поки 24 травня не було оголошено перемир’я. І Майкл Коллінз, і Ліам Лінч, начальник штабу ІРА, загинули в запеклих перестрілках. Ніхто так і не зміг установити, хто саме їх убив, а самі стрільці могли навіть не усвідомлювати, чиє життя обірвали. Мир повернувся на Смарагдовий острів. Та ненадовго.\n\nДе Валера так і не зумів переконати правлячу §KШинн Фейн§! відмовитися від присяги на вірність британській Короні, тож заснував §yФіанну Файл§!. У 1937 році він обійняв посаду тишаха, саме тоді, коли вся Европа немовби сама обливала себе бензином. Для де Валери питання полягало вже не в тому, чи почнеться війна, а в тому, на чий бік стати, коли вона спалахне. Коли нацистський бліцкриґ прокотився майже всією вільною Европою, відповідь стала очевидною."
  IRE_CountryInfo_Content.4: "Об’єднана й вільна?"
  IRE_CountryInfo_Content_desc.4: "За відкритої підтримки Німеччини де Валера розпочав блискавичну військову кампанію проти Північної Ірляндії, питання якої ще в 1920-х роках ледь не поставило Республіку на коліна. Розгорнулася виснажлива боротьба, у якій будь-хто міг стати мішенню, а кожного підозрювали у зраді чи то британській Короні, чи то ірляндському народові. Та після краху Британії опір Дубліну було зламано.\n\nОднак труднощі чекали не лише за морем. Зобов’язання Ірляндії перед §qАйнхайтспактом§! змусили ірляндське суспільство зіткнутися з неприємною правдою. Традиційні суперники ФФ, §DФіне Ґел§! та §KШинн Фейн§!, були придушені авторитарним режимом де Валери, який поступово зміцнював свою владу. Водночас Шинн Фейн через протистояння власних непримиренних радикалів опинилася на політичному узбіччі. Тепер політичне життя Ірляндії визначається передусім боротьбою між фракціями самої ФФ. Зумівши вирвати перемогу, коли поразка на §Yвиборах 1961 року§! здавалася неминучою, ФФ мусить вирішити, яким шляхом повести Ірляндію в невизначене нове десятиліття."

  #102
  IRE_CountryInfo_Folder.102: "Політичні ігри за владу"
  IRE_CountryInfo_Content.5: "Фіанна Файл"
  IRE_CountryInfo_Content_desc.5: "Під проводом §oШона Лемасса§!, тишаха Республіки, Фіанна Файл нагадує титана на смертному ложі. Партія, що колись безроздільно панувала в §lДаль Ерянн§!, тепер опинилася в становищі загнаного в кут лиса. Лемасс переконав де Валеру обійняти переважно церемоніяльну посаду президента Республіки, де той міг би й надалі впливати на політику неформальними засобами. За попереднього керівництва коаліція між ФФ та лейбористами була під забороною, однак новий тишах швидко відмовився від цього обмеження, уклавши союз із Бренданом Корішем.\n\nТим часом Лемассу доводиться лавірувати між численними фракціями, кожна з яких прагне здобути жадане місце при владі. §LПомірковані§!, що становлять його власну опору, виступають за продовження політики ФФ із наголосом на фінансовому та суспільному консерватизмі. Натомість §gнаціоналісти§! на чолі з Нілом Блейні вимагають посилити контроль над окупованою Північною Ірляндією. Нарешті, Джек Лінч та §Bліберали§!, які, втім, самі себе лібералами не називають, обстоюють повільні, але послідовні реформи."
  IRE_CountryInfo_Content.6: "Ірляндський Даль"
  IRE_CountryInfo_Content_desc.6: "§lДаль Ерянн§! - нижня палата Еряхтасу, парламенту Ірляндії. Отже, щоб ухвалити закон, прем'єр-міністрові необхідно заручитися підтримкою Далю. Однак це значно складніше, ніж може здатися на перший погляд. Хоча Фіанна Файл залишається провідною партією в Далі, через фракційні суперечності та внутрішньопартійні інтриги кожне крило ФФ фактично діє як самостійна політична сила, яку доводиться або схиляти на свій бік, або приборкувати.\n\nУтім, ФФ не єдина політична сила в парламенті. Після того як Фіне Ґел завдала серйозного удару урядові де Валери на виборах 1961 року, Лемасс вирішив заручитися підтримкою §SЛейбористської партії Ірляндії§! на чолі з Бренданом Корішем. Коріш та лейбористи не бажають допустити німецького впливу на Республіку й зосереджуються на розширенні прав ірляндського робітничого класу, чим неабияк дратують прихильників жорсткого курсу та поміркованих у Далі. Проте якщо майбутній ліберальний уряд прагнутиме втриматися при владі, йому варто дослухатися до Коріша..."
  IRE_CountryInfo_Content.7: "Північна Ірляндія"
  IRE_CountryInfo_Content_desc.7: "Офіційно Північну Ірляндію називають §VОсобливою зоною північних графств§!. Окупаційний режим, як і тимчасову адміністрацію, що досі управляє Ольстером, уже давно мали б скасувати. Насправді ж в ОЗПГ панують §Vвоєнізовані формування та загони самооборони§!, які тяжіють до §eкатолицького§! або §Oпротестантського§! табору. Краєм управляє міністр у справах північних графств Ніл Блейні, проте ніхто достеменно не розуміє, як йому вдається стримувати юніоністів, і це викликає дедалі більше занепокоєння. Тим часом §eІрляндська республіканська армія§!, що об’єднує різні партизанські загони, веде агітацію за нейтральну республіку на окупованих землях. Натомість §yІрляндська громадянська гвардія§! відкололася від ІРА через свої симпатії до Німеччини. Навіть серед воєнізованих формувань Особливої зони про неї відомо небагато. Нарешті, існують §OОльстерські добровольчі сили§! під командуванням Ієна Пейслі. Ця організація бере початок від протестантських загонів самооборони, створених для захисту протестантського населення Ольстеру."
 
  # USA
  USA_CountryInfo_Folder.101: "Нація, що втратила опору"
  USA_CountryInfo_Folder.102: "Шоста партійна система"

  #101 - A Nation Unmoored
  USA_CountryInfo_Content.1: "Вибори 1940 року"
  USA_CountryInfo_Content_desc.1: "Під час свого другого терміну §Bпрезидент-демократ Франклін Д. Рузвельт§! зіткнувся зі зростанням консервативного спротиву. Його противники вважали, що «Новий курс» веде Сполучені Штати тим самим небезпечним шляхом, яким раніше пішла Росія. Побоюючись, що третій термін може обернутися політичною катастрофою, Рузвельт вирішив не балотуватися знову.\n\nНатомість він переконав Демократичну партію висунути його близького друга, колишнього §Bкерівника Управління громадських робіт Гаррі Гопкінса§!. Аби забезпечити перемогу свого протеже, Рузвельт змістив політичний курс до центру й пішов на поступки ізоляціоністам. Тим часом консервативні республіканці, серед яких був §gсенатор від Огайо Роберт А. Тафт§!, підтримали харизматичного, але недосвідченого §Rокружного прокурора Мангеттена Томаса Дьюї§!.\n\nНевдовзі Гопкінс довідався, що хворіє на рак шлунка. Прикутий до ліжка, він став об'єктом численних газетних чуток про стан свого здоров'я. Зрештою Гопкінс поступився §RДьюї§!, програвши вибори з відставанням менш ніж на 0,4 відсоткового пункту."
  USA_CountryInfo_Content.2: "Президентство Дьюї"
  USA_CountryInfo_Content_desc.2: "§RПрезидент Томас Дьюї§! віддячив своїм прибічникам-ізоляціоністам, призначивши на державні посади чимало союзників §gсенатора Роберта А. Тафта§!. Згодом він узявся за демонтаж «Нового курсу» §BРузвельта§!, тоді як його уряд скорочував військовий потенціял Сполучених Штатів, сподіваючись уникнути прямого зіткнення з дедалі могутнішими Німецьким Райхом та Японською імперією.\n\nНаслідки виявилися катастрофічними. Країну охопила рецесія. Японія та Німеччина оголосили війну. До 1944 року, коли американські воєнні зусилля опинилися на межі краху, надії §RДьюї§! на переобрання врятували успішна оборона Шотландії генералом Айзенгавером та розкол його політичних супротивників між поміркованим партійним діячем §BДжеймсом Фарлі§! і §Kпрогресивним республіканцем Генрі Воллесом§!.\n\nДьюї насилу втримав президентське крісло на другий термін. Коли країна вже тріщала по швах, він погодився укласти мир із державами Осі. За його умовами Сполучені Штати поступалися своїми володіннями в Тихому океані та передавали Гаваї в оренду на сто років."
  USA_CountryInfo_Content.3: "Президентство Айзенгавера"
  USA_CountryInfo_Content_desc.3: "§RРеспубліканська партія§! зазнала нищівної поразки 1946 року, але багато американців звинувачували «соціялістичну» політику §BРузвельта§! в ослабленні Америки й неминучості війни. Вибори 1948 року перевірили ці настрої, звівши ізоляціоніста §gреспубліканця Роберта Тафта§! з інтернаціоналістом §Bдемократом Двайтом Д. Айзенгавером§!. §BАйк§! переміг, але кампанія виявила глибоке невдоволення §Lістеблішментом.§!\n\n§BАйк§! спробував завершити незакінчену справу §BРузвельта§!. Однак розрив із прогресивним §Kвіцепрезидентом Бертоном Вілером§! через втручання задля захисту португальської Анґоли від Німеччини підірвав його президентство. У 1952 році він ледве переобрався.\n\nДругий термін §BАйка§! розчарував. §KВілер§! не спромігся провести через Сенат популярні заходи, і §BАйзенгавер§! вдався до президентських указів. Із зростанням невдоволення 1952 року постала нова §gНаціоналістична партія§! на підтримку §gгенерала Джорджа Паттона§!."
  USA_CountryInfo_Content.4: "Президентство Кефовера"
  USA_CountryInfo_Content_desc.4: "Після §BАйка§! §Lістеблішмент§! не бажав підтримувати його прогресивного §Kвіцепрезидента Бертона Вілера.§! Натомість §Bдемократи§! висунули поміркованого §BЕстеса Кефовера§!, а §Rреспубліканці§! — поміркованого §RЕверетта М. Дірксена§!. §gНаціоналісти§! й відроджена §KПрогресивна партія§! стали притулком розчарованих мейнстримом.\n\n§BКефовер§! ледве переміг, але реакція була швидкою. На проміжних виборах десятки нових партій прорвалися до бюлетенів. Запанував хаос: сенаторів обирали третиною голосів, лунали звинувачення в шахрайстві й корупції.\n\n§gНаціоналісти§!, §Kпрогресисти§! та інші зрозуміли, що разом можуть здолати істеблішмент. Вони створили ситуативний Національно-прогресивний пакт на чолі з §Kпрогресистом Скупом Джексоном§! і §gлідером прихильників прав штатів Джеймсом Фулбрайтом.§! §RРеспубліканці§! й §Bдемократи§!, побачивши загрозу існуванню, створили власну коаліцію на чолі з консерватором §RРічардом Ніксоном§! і лібералом §BДжоном Ф. Кеннеді.§!"
  #102 - The Sixth Party System
  USA_CountryInfo_Content.5: "Республіканці"
  USA_CountryInfo_Content_desc.5: "§RРеспубліканську партію§!, партію консерваторів, очолює найживучіший з усіх — Річард Ніксон. Майстер негативних кампаній, §RНіксон§! пережив фінансовий скандал 1952 року й майже поразку на губернаторських виборах у Каліфорнії 1954 року, пробившись до кабінету §BКефовера§! як державний секретар. Він називає себе лідером мовчазної більшости, хоч його непопулярність удома зростає.\n\nПід ним стоять §Vнепохитні республіканці§! Баррі Ґолдвотера, прихильники суворого обмеження дефіциту, які вимагають негайно припинити надмірності Рузвельта, та §Pвідповідальні республіканці§! Нельсона Рокфеллера, помірковані новоанглійці, що воліють поступових консервативних реформ.\n\nОстанні кризові роки ускладнили §RНіксону§! збереження лідерства. Однак він рішуче прагне зберегти керівництво партією, втримати республікансько-демократичну коаліцію й переобратися 1964 року §xза будь-яку ціну.§!"
  USA_CountryInfo_Content.6: "Демократи"
  USA_CountryInfo_Content_desc.6: "§BДемократичну партію§!, спадкоємицю Рузвельта, Айзенгавера й Кефовера, очолює харизматичний §Bвіцепрезидент Джон Ф. Кеннеді.§! Уособлюючи всі надії нової доби, Кеннеді закликає націю подолати минулі невдачі й прийняти майбутнє. Зустрічі з лідерами руху за громадянські права, заклики до військової стриманости й рішучих заходів проти економічного застою зробили його улюбленцем багатьох, водночас дратуючи президента.\n\nПід Кеннеді вирує фракційна боротьба. З одного боку — §Oтрудові демократи§!, представлені в Конґресі сенатором Ліндоном Бейнзом Джонсоном. Вони вважають Новий курс незавершеним і прагнуть розширювати та розбудовувати його програми.\n\nЗ іншого боку — §Qдіксікрати§! на чолі із сенатором Річардом Расселлом-молодшим у Конґресі. Переважно південці, вони обурені зустрічами Кеннеді з чорношкірими лідерами й прагнуть зберегти сеґреґацію."
  USA_CountryInfo_Content.7: "Націоналісти"
  USA_CountryInfo_Content_desc.7: "§gНаціоналістичний кокус§! — найбільша група нового Національно-прогресивного пакту, що представляє не лише Націоналістичну партію, а й різні популістські консервативні угруповання, як-от Консервативна партія Нью-Йорка, Партія прав штатів і Прогресивна партія Луїзіяни. Натхненна реакційними пристрастями, коаліція має багато облич у ставленні до поточних подій.\n\nДо 1964 року кокус веде §gгубернатор Алабами Джордж Воллес§!, відкритий сеґреґаціоніст, обурений тим, що вважає «беззаконням» руху за громадянські права. Серед націоналістів також чимало колишніх республіканських яструбів війни на чолі з §gМарґарет Чейз Сміт§!, які залишили Республіканську партію після поразки США у Другій світовій, та залишки ізоляціоністського руху Середнього Заходу §gсенатора Роберта А. Тафта§!, що відроджується серед християнських правих, розгублених у стрімко мінливій країні."
  USA_CountryInfo_Content.8: "Прогресисти"
  USA_CountryInfo_Content_desc.8: "Другий за величиною кокус НПП — §Kпрогресисти§!, строката суміш різних ліберальних груп. Він охоплює не лише відроджену Прогресивну партію, а й Фермерсько-трудову партію, Безпартійну лігу та Ліберальну партію Нью-Йорка. Хоч ідеологічно єдиніші за націоналістів, прогресисти не менш нестабільні.\n\nДо 1964 року партію веде §KСкуп Джексон§!, ліберал Нового курсу та яструб війни, який сподівається на реванш із Ніксоном. Проте доля змінюється за день. Багато прогресистів, особливо невдоволених спробами Скупа порозумітися з противниками громадянських прав, шукають іншого кандидата на 1964 рік. Їхній успіх може залежати від непідвладних їм сил.\n\nНа краю кокусу стоїть §KМайкл Гаррінґтон§!, лідер Демократичних соціялістів Америки. Хоч багато хто глузує з думки про соціяліста в Білому домі, Гаррінґтон охоче чекає свого часу."
  USA_CountryInfo_Content.9: "Екстремісти"
  USA_CountryInfo_Content_desc.9: "Хоч «поважніші» лідери НПП намагаються їх ігнорувати, Пакт охоплює й багато менших груп, чия ворожість до §Lістеблішменту§! стосується не лише двох головних партій, а й самої американської системи. Вони вважають Республіку неспроможною державою, для порятунку народу якої потрібні радикальні дії.\n\n§VМарксистський кокус§! на чолі з §VҐасом Голлом§! із Компартії США — одна з таких груп. Відкриті комуністи й соціялісти вбачають у пересічному американцеві жертву експлуатації капіталістичного класу, а в нинішній боротьбі за громадянські права — прояв ширшої класової боротьби.\n\nЩе менші й марґінальніші за §Vмарксистів§! — §jсувереністи§!, огидне угруповання фашистів і білих націоналістів. Лише найрадикальніші американці насміляться із ними пов'язатися. Їхній лідер §jФренсіс Паркер Йокі§! уславився озвучуванням темних фантазій ображених білих, які бачать у Німеччині союзника, а не ворога в прийдешній війні."

