BSQ_Domingo_Iturbide_eco_desc: "§YМіністр економічних справ\nЛівий націоналізм§!\n--------------\n§L§!"

BSQ_Txabi_Etxebarrieta: "Чабі Ечебаррієта"
BSQ_Txabi_Etxebarrieta_for_desc: "§YМіністр закордонних справ\nЛівий націоналізм§!\n--------------\n§LНароджений у Більбао в 1944 році, Чабі Ечебаррієта вже був помітним членом ETA на момент закінчення Більбаоського університету. Молодий радикал і член націоналістичної родини, він, схоже, був приречений стати повстанцем із раннього віку, не вагаючись брати участь у збройній боротьбі попри слабке здоров'я.\n\nУ міру того як ETA проводила дедалі помітніші операції в останні роки існування Іберійського Союзу, Ечебаррієта опинився на передньому плані — спочатку всередині організації, а після розпаду Союзу й у всьому баскському суспільстві. Усередині ETA він став представником фракції "четвертого світу", виступаючи за співпрацю між різними рухами за національну незалежність і антиколоніяльними рухами світу в їхній спільній боротьбі, але водночас формулюючи цю боротьбу в непохитно націоналістичних термінах, на відміну від більш інтернаціоналістичної комуністичної фракції.\n\nТепер, як фактичний міністр закордонних справ тимчасового баскського уряду, Ечебаррієта отримує можливість втілити свої ідеали в життя: використовуючи розгалужені закордонні зв'язки EAJ, ETA зможе заручитися підтримкою пригноблених народів світу — від Латинської Америки до Африки — і стати авангардом визволення всіх націй.§!"
BSQ_Txabi_Etxebarrieta_eco_desc: "§YМіністр економічних справ\nЛівий націоналізм§!\n--------------\n§LЧабі Ечебаррієта — один із головних лідерів ETA та один із найвпливовіших голосів у фракції "четвертого світу" організації. Одразу після перевороту ETA Ечебаррієта висунув себе на посаду радника з економічного розвитку не лише тому, що вважав себе більш придатним для цієї роботи, але й тому, що це дозволило б не віддати її до рук "робітничої" фракції.\n\nЕчебаррієта прагне децентралізованої соціялістичної системи, яку він називає "баскською робітничою нацією", що безпосередньо суперечить меті робітничої фракції повторити шлях, прокладений колишнім СРСР.§!"

