#War Tree
BSQ_gora_euskadi_askatuta: "Хай живе вільна Еускаді!"
BSQ_gora_euskadi_askatuta_desc: "Коли ми вступили в 1960-ті роки, багато хто з наших лав вважав, що наші мрії про вільну Баскську Республіку померли. Багато хто нарікав, що ці роки минатимуть, як і незліченні попередні, поки ми корчимося під чужим чоботом Мадрида. Часи змінилися — швидше, ніж будь-хто очікував.\n\nІспанці втратили будь-яку ілюзію контролю над Півостровом, яку вони ще мали, а гнітючий гуркіт війни панує над Іберією. Еускаді не є винятком. Наші патріоти з безпрецедентною люттю та жорстокістю відкинули Мадрид, і вся Країна Басків опинилася в наших руках! Але цього буде недостатньо. Розбитий ніс і періодичні приниження не переконають уряд у його помилковості. Якщо Еускаді має вижити, жодна наша гвинтівка не повинна залишатися без діла. Жодна наша граната не повинна залишатися невикористаною. Жодна куля — невистріляною. Поразка означатиме винищення."
BSQ_gora_euskadi_askatuta_tt: "§nХай живе й процвітає Еускаді§!"

BSQ_the_basque_war_economy: "Баскська воєнна економіка"
BSQ_the_basque_war_economy_desc: "Баскська Республіка багата на багато речей. Безкрайні сади, ущерть заповнені багряними плодами. Узбережжя, обрамлене високими скелями, що немов дрімаючий колос стоять на варті Атлантики. Але що важливіше, ми також володіємо деякими з найзавантаженіших і найгустіших промислових зон на всьому Півострові. Однак виробництво ремісничих винних келихів і керамічних тарілок лише залишило б іспанцям більше цінностей для пограбування з наших тлінних трупів.\n\nПереведення всієї Еускаді на воєнні рейки — це не просто важливо, це те, що дозволить нашій Республіці вистояти. Наша лють і сила волі, можливо, лише виведуть наших людей на поле бою. Але саме гвинтівка забезпечить їм перемогу."

BSQ_consolidate_our_forces: "Консолідувати наші сили"
BSQ_consolidate_our_forces_desc: "У перші шалені дні Революції армія, якою ми заволоділи, була лише зародком того, що мало постати. На її місці сільською місцевістю блукали різношерсті ополченці — у пошуках ворога, якого можна вбити, і справи, за яку можна померти. Чоловіче населення цілих сіл — просто зникало заради найвищого служіння Еускаді. Але саме так ми цю війну не вестимемо.\n\nАдже ціле більше за суму своїх частин. І ми повинні об'єднати всіх наших слабких і виснажених патріотів та викувати меч, могутніший за будь-яку пекельну зброю, яку Мадрид може кинути проти нас. Дехто може скаржитися, але зрештою підручники історії доведуть нашу правоту."

BSQ_seize_federal_assets: "Захопити федеральні активи"
BSQ_seize_federal_assets_desc: "Коли федералес утекли з Еускаді, вони не могли забрати з собою все своє майно. Без захисту банківські сховища та резерви лежали, чекаючи, коли ми їх... перепривласнимо. Мільйони песет і сотні тонн золота стали б величезною допомогою нашій молодій Республіці та нашій боротьбі проти іспанців. Усе є зброєю у боротьбі за виживання, а гроші рідко бувають зброєю ціннішою за будь-яку іншу. Ми можемо використати готівку для гвинтівок, срібло для танків, а золото — для нашого народу, щоб підтримувати нашу економіку живою. Зрештою, ми просто повертаємо те, що уряд забрав у нашого народу, хіба ні?"

BSQ_militarize_mondragon_facilities: "Мілітаризувати підприємства Мондраґона"
BSQ_militarize_mondragon_facilities_desc: "Хоча ми вже переобладнали більшу частину нашої промисловості для війни проти іспанців, попереду ще довгий шлях. Майбутня боротьба стане найвищим випробуванням нашої волі до виживання, а зустріч із ворогами напівготовими лише приведе нас до загибелі.\n\nВідомий на всьому Півострові своїми мальовничими краєвидами та мирним життям, Мондраґон є центральним осередком промисловості, що затишно розташувався серед високих вершин і безкрайніх смарагдових сільськогосподарських угідь. Хоча населення може нарікати, ми не можемо дозволити собі залишити жодну фабрику осторонь воєнних зусиль. Одна артилерійська гармата, одна гвинтівка, навіть одна куля можуть означати нашу перемогу або наше падіння. Час не чекає, і наші люди готові вирушити до сонного містечка. Їм потрібен лише наказ."

BSQ_develop_the_machine_tool_industry: "Розвинути верстатобудівну промисловість"
BSQ_develop_the_machine_tool_industry_desc: "Звісно, дуже добре, коли генерали планують нашу наступну геніальну стратегію або осередки опору знищують черговий конвой із постачанням, але ми не можемо постійно працювати на останньому подиху. Зрештою, у нас закінчаться кулі; наші гармати заклинюватимуть, наша артилерія ламатиметься. Якщо ми не зможемо замінювати своє спорядження, то лише відкладемо неминуче.\n\nХоча ми не можемо дозволити собі не розбудовувати воєнну економіку, немає користі в тому, якщо наші робітники виготовлятимуть гармати власними руками. Нам потрібно не лише бути працьовитими, а й ефективними. Масове виробництво високоякісних верстатів та обладнання не просто допоможе перемогти, а й утримати нашу економіку на плаву. На війні навіть найменші переваги можуть змінити історію."

BSQ_expand_the_bilbao_port: "Розширити порт Більбао"
BSQ_expand_the_bilbao_port_desc: "Не лише наша земля родюча, але й Еускаді також благословенна мальовничим узбережжям. Протягом століть баскські рибалки використовували Біскайську затоку як джерело своїх засобів до існування. У сучасну добу сотні родин стікалися на наші незаймані пляжі, щоб відпочити від гнітючого тягаря зовнішнього світу.\n\nТепер, схоже, Більбао мусить підкоритися цьому тягарю. Війна — кривава й дорога річ. У неї багато ненаситних пащ, і всі вони вимагають сталі та крові, щоб задовольнити свій голод. Надто часто нас від перемоги відділяє одна куля, а від щасливого населення — одна хлібина, і далі буде лише гірше. Розширення порту Більбао, що виходить на Біскайську затоку, не лише збільшить обсяги постачання із зовнішнього світу, а й скоротить час, необхідний для його доставки сюди."

BSQ_a_job_for_everybody: "Робота для кожного"
BSQ_a_job_for_everybody_desc: "Ті, хто може воювати, воюватимуть. Ті, хто не може, працюватимуть. Війна була смертельною й дорогою для всього баскського народу. І далі буде лише гірше. Якщо ми хочемо пережити цю бурю, усі руки мають бути залучені до фінального зіткнення з тиранією. Підприємства, фабрики, навіть прості майстерні — усі мають бути заповнені працьовитими, сумлінними товаришами по зброї. Не має значення, чи ти генерал, чи сталевар — ніхто не буде змарнований у нашій боротьбі за свободу."

BSQ_emergency_taxation_policies: "Надзвичайна податкова політика"
BSQ_emergency_taxation_policies_desc: "Мужність, кулі та укріплення — не єдине, що нам потрібно для війни проти Мадрида. Кожну гвинтівку потрібно виготовити, а людям, які її виготовляють, потрібно платити. Для кожної бомби потрібні матеріали, які необхідно придбати або виробити. Кожній вантажівці потрібне паливо, і де ми візьмемо цей бензин? Гроші — не найромантичніший бік війни, але саме вони завжди визначали, хто переможе, а хто потрапить до підручників історії.\n\nНаразі ми не можемо підтримувати наші воєнні зусилля лише пожертвами та ще... сумнівнішими способами фінансування через іноземні контакти. Якщо ми хочемо, щоб наші люди перемагали й продовжували перемагати, щось потрібно зробити. На жаль, схоже, найкращий і найефективніший спосіб зробити це — водночас найнепопулярніший. Підвищивши тимчасовий податок, ми матимемо більш ніж достатньо коштів, щоб продовжувати боротьбу та перемогти у війні. Ми не ставимося до цього легковажно, але це необхідно зробити."

BSQ_mastery_of_the_mountains: "Володіння горами"
BSQ_mastery_of_the_mountains_desc: "Раз у раз історія навчала своїх уважних учнів чудесам оборонної місцевості. Від використання спартанцями Фермопіл проти орд персів до зупинки Вермахту американцями в ущелинах Шотландського нагір'я — було б нерозумно не скористатися тими самими перевагами. Еускаді пронизана дорогами вздовж урвищ, високими долинами і, понад усе, одними з найвищих гір Іберії.\n\nНаші генерали благають нас належним чином навчити та спорядити людей для ведення бою на великих висотах проти Мадрида. Ігнорувати їхні поради було б майже ідіотизмом, адже нам потрібна будь-яка перевага, яку ми можемо отримати. Залити гори багряним іспанським кров'ю буде не найприємнішим видовищем, але це краще, ніж нашою кров'ю."

BSQ_weaponize_trade_ships: "Озброїти торгові судна"
BSQ_weaponize_trade_ships_desc: "Якщо воно не зламане — не лагодь. Хоча, можливо, флот і не користується такою високою повагою, як інші наші військові сили, він усе ж виконує неймовірно важливу роль. Ми покладаємося на іноземну зброю та постачання від тих, хто співчуває нашій справі. Гроші, продовольство, зброя — наші контакти у Вашингтоні, Берліні та Токіо наполегливо працюють, намагаючись дістати для нас усе це. Але який сенс отримувати ці припаси, якщо Мадрид може просто пограбувати наші кораблі та реквізувати наших моряків?\n\nМи повинні озброїти наші торгові судна — від найменшого траулера до величезних вантажних суден, що борознять океан. Люди, навчені веденню амфібійної війни, спеціалізоване спорядження і навіть вибухівка — усе це може дати нам перевагу, необхідну для захисту нашої морської магістралі та допомоги нашим людям на фронті."

BSQ_rebuild_the_iron_ring: "Відбудувати Залізне кільце"
BSQ_rebuild_the_iron_ring_desc: "Залізне кільце було серією укріплень, побудованих у відчайдушні дні Іспанської громадянської війни. Воно складалося зі 180 бетонних бункерів — кожен із них мав стіни завтовшки майже метр — і охоплювало периметр довжиною 80 км навколо Більбао. Атакувати його в лоб було майже самогубством. Мало що в Європі, хіба що, можливо, лінія Мажино, могло зрівнятися з цими укріпленнями за конструкцією та неприступністю.\n\nОднак, як і лінія Мажино, воно було обійдене й стало марним. У нашому випадку — бомбовими відсіками Люфтваффе, а не лісами Арденн. Ми більше не припустимося цієї помилки. Ми відновимо цей зовнішній панцир і стримуватимемо голодні багнети Мадрида. Цього разу Залізне кільце не стане просто дрібничкою з історії."

BSQ_equal_opportunity_service: "Рівні можливості служби"
BSQ_equal_opportunity_service_desc: "Еускаді не бракує добровольців, уся нація готова взятися до зброї. Питання лише в тому, щоб найкращим чином розподілити добровольців для служіння нації. Багато чоловіків на фронті є кваліфікованими робітниками, і їхні навички може бути нелегко замінити. Крім того, у наших збройних силах служить багато бійців ополчення, але їхній точний статус залишається сумнівним; це тривожний чинник, зважаючи на їхні комуністичні впливи.\n\nРішення полягає у відкритті військової служби для жінок. Хоча це й новаторське рішення, аберцале погоджуються, що після років франкізму це стане значним кроком уперед у правах жінок. Жельцале неохоче визнають, що більше жінок, які вступають до війська під їхнім наглядом, означає менше жінок, які вступають до ополчень, пронизаних комуністичним впливом. Кожна некваліфікована жінка в окопі чи бункері — це ще один кваліфікований чоловік, який підтримує життєдіяльність нації на фабриках і в установах у тилу."

BSQ_the_basque_air_force: "Баскські військово-повітряні сили"
BSQ_the_basque_air_force_desc: "Коли під час нашого повстання ми розгромили іспанські позиції по всій Еускаді, вони залишили нашим людям подарунок. Особливо вздовж французького кордону рядами стоять покинуті ангари, вкриті пилом. Усередині досі залишаються винищувачі, бомбардувальники, реактивні перехоплювачі всіх видів, які лише чекають, коли хтось ними скористається.\n\nЦе дуже доречно, адже однією з наших найсмертоносніших слабкостей під час Іспанської громадянської війни 1930-х років була відсутність переваги в повітрі. Щоразу, коли нам вдавалося здійснити прорив, наші люди відкидалися в кам'яну добу бомбардуваннями людей Франко або м'ясників Люфтваффе. Цього разу ми не можемо дозволити собі повторити ті самі помилки. Кинувши виклик іспанцям у повітрі, ми зможемо забезпечити прикриття — або принаймні перепочинок — нашим солдатам на землі."

BSQ_military_on_wheels: "Армія на колесах"
BSQ_military_on_wheels_desc: "Якщо з кривавої бійні Другої світової війни можна винести один урок, то це те, що швидкість є ключем до успіху. Французи та британці обидва були переграні німецьким проривом у Бельгії та розбиті армією Гітлера. У Югославії, Греції, Північній Африці й, найважливіше, на залитих кров'ю полях СРСР цей урок знову й знову підтверджувався.\n\nЧому ці уроки не мають стосуватися нас? Ми повинні розширити моторизоване забезпечення по всій армії — від солдатів до працівників їдалень. Якщо нас переможуть, ми зможемо вислизнути з пащі поразки й відновити свої сили. Якщо ж ми переможемо, то зможемо повною мірою розвинути свій успіх і знищувати іспанців поодинці. На думку наших людей, у цьому рішенні немає жодних недоліків."

BSQ_march_forwards_together: "Рухатися вперед разом"
BSQ_march_forwards_together_desc: "Уряд Вільної Еускаді складається з двох частин. Є "жельцале" з EAJ — Баскської націоналістичної партії — та "аберцале" з ETA — Еускаді та Аскатасуни. Перші — це досвідчені політики старшого покоління, які борються за вільну Баскську Республіку довше, ніж деякі члени ETA взагалі живуть. Тим часом ETA — це молоді радикали, настільки одержимі та завзяті у прагненні до вільної Баскської Республіки, що це змусило б декого в володіннях Гіммлера почервоніти. Попри це, якщо ми дозволимо дрібним розбіжностям щодо управління нашою нацією розділити нас, ми лише зіграємо на руку Мадриду. Якщо ми не стоятимемо разом, то помремо окремо, і крихке жариво вільної Еускаді буде загашене вітром. Назавжди."

BSQ_jeltzale_supremacy: "Перевага жельцале"
BSQ_jeltzale_supremacy_desc: "Як би ми не вдавали протилежне, Баскська Республіка не є цілком об'єднаною та монолітною. Наше повстання стало можливим завдяки двом різним групам. Першою є Стара гвардія Баскської Республіки. "Жельцале" з EAJ, Баскської націоналістичної партії. Названі так через прихильність до абревіатури EAJ: Jaun-Goikua Eta Lagi-zaŕa (Бог і давні закони), вони є мудрими наставниками Баскської Республіки. Натомість іншою головною силою нашого руху є "аберцале", "патріоти" з ETA. Молоді, енергійні та завзяті, аберцале не зупиняться ні перед чим заради досягнення своїх цілей.\n\nА це робить їх небезпечними. Еускаді не може керуватися групою жорстоких ополченців, щойно випущених з університету. Якщо ми дамо їм реальну владу, то самі вистрілимо собі в ногу та відгородимося від міжнародної підтримки. Ні. Хороші бійці рідко стають хорошими міністрами, їх потрібно зупинити."

BSQ_remember_gernika: "Пам'ятаймо Герніку"
BSQ_remember_gernika_desc: "Ми ніколи не забудемо той ясний четверговий день, коли птахи мчали й танцювали рожевим небом. Ми ніколи не забудемо дітей, які штовхалися та тягнули одне одного на знайомих їм шкільних подвір'ях, розкреслених крейдою. Ми ніколи не забудемо батьків та їхні неквапливі розмови з фермерами, від яких пахло цитрусами, біля їхніх яток. Ніколи не забудемо, як їхня смерть прийшла з тихим, тонким гудінням. Ніколи не забудемо вдів, які поховали своїх дітей поруч із їхніми батьками.\n\nМи пам'ятаємо народ Герніки."
BSQ_remember_gernika_tt: "Хай Бог благословить дерево Герніки, яке любить увесь баскський народ"

BSQ_establish_local_councils: "Створити місцеві ради"
BSQ_establish_local_councils_desc: "Ми не можемо дозволити собі бути неефективними, коли боремося за своє життя. Більбао може зробити лише те, що в його силах, одночасно дбаючи про фронт із належною турботою та точністю. Саме тому багато хто в нашому уряді пропонує радикально нову ідею. У різних провінціях Еускаді можна створити місцеві ради для управління повсякденними справами на місцях. Центральний уряд, звісно, може втрутитися, якщо це буде необхідно, на випадок, якщо щось піде жахливо не так. Інші можуть сказати, що це призведе до фракційності, бюрократії та багатьох-багатьох інших заїжджених модних слів — але в нас немає вибору."

BSQ_assymetic_warfare_training: "Підготовка до асиметричної війни"
BSQ_assymetic_warfare_training_desc: "Височенні вершини Піренеїв. Зубчасті долини високогір'я. Захищені ліси та фруктові сади сільської місцевості. Що в них спільного? Можливо, вони приваблюють туристів. Але під час війни товсті американці з їхніми більшими гаманцями мало чим можуть нам допомогти. Те, що дарує нам приголомшливі краєвиди, для іспанця стає пеклом на Землі.\n\nПідступні бої на великій висоті. Партизани-снайпери, які знищують безліч цінних цілей, що ховаються в котеджах за межами вододілу. Схованки, заховані серед тернових кущів, куди наші люди можуть зникнути в тіні. Усе це можливості, якими ми могли б скористатися, якби лише навчили наших людей. Тактика удару й відступу, приховані вбивства, належне маскування та одяг — усього цього ми могли б навчити наших людей, якби лише використали наших командос для їхньої підготовки. Краєвиди можуть бути небезпечною принадою для іспанця, але вони лише роблять нашу перемогу мальовничішою."

BSQ_traitors_not_welcome: "Зрадникам не раді"
BSQ_traitors_not_welcome_desc: "Ніхто не очікував, що Повстання станеться. Принаймні не так скоро. Колись вигнані в провулки та підвали, тепер ми крокуємо тріумфально. Поки наші бійці продовжують відбивати все, що Мадрид спрямовує проти нас, тепер ми стикаємося з новою проблемою.\n\nХоча більшість утекла, рештки іспанців залишилися, мов кинджал у нашій спині. Цивільна ґвардія, відповідальна за загибель багатьох наших товаришів, була роззброєна та заарештована. Колишні солдати й бюрократія теж чекають на свою долю. Можливо, декого з нас порадувало б випустити магазин у старше керівництво, але дехто має іншу ідею. Еускаді — молода держава, навіть якщо наш народ жив тут ще до римлян. Простого занесення до чорних списків і заборони служби буде цілком достатньо. Те, що на їхніх руках кров наших людей, не означає, що ми мусимо пролити їхню кров."

BSQ_orders_from_bilbao: "Накази з Більбао"
BSQ_orders_from_bilbao_desc: "Коли людина бореться за своє життя, найменше, що вона може зробити, — стежити за собою. Якою б високою та благородною не була ідея "місцевих комун" для простолюдина, вона не допоможе нам виграти війну. Лише завдяки точній координації та централізації кожного чоловіка, жінки й дитини у воєнних зусиллях ми зможемо втриматися на плаву. Попри кипучу лють анархістів серед нас, єдиний спосіб вистояти перед таким жорстоким ворогом, як іспанці, — переконатися, що кожен знає своє місце."

BSQ_disband_eta_commandos: "Розпустити командос ETA"
BSQ_disband_eta_commandos_desc: "Взятися до зброї заради своєї країни — благородна справа. Ще благородніше — знати, коли її скласти. Командос ETA завдавали невпинно болючих ударів проклятим іспанцям, які прагнуть придушити нашу революцію, — це правда. Однак розрізнені та нашвидкуруч сформовані революційні осередки, які можуть навіть не брати участі в боях, — не те, як ми вестимемо нашу революцію.\n\nНаші генерали пропонують замість того, щоб спрямовувати дорогоцінні запаси та спорядження розпорошеним і недисциплінованим бійцям, інтегрувати цих патріотів у щось продуктивніше. А саме — в армію. Що найгірше може статися від того, що в нашій армії буде група надмірно завзятих і недостатньо підготовлених чоловіків?"

BSQ_the_misguided_patriots: "Заблукані патріоти"
BSQ_the_misguided_patriots_desc: "Ми не тварини! Наша революція проти Мадрида не може захлинутися в крові невинних людей, у марному спротиві жорстокості людства. Напади й навіть поодинокі вбивства так званих "колабораціоністів", таких як члени Цивільної ґвардії або бюрократи, є неприйнятними. Що ще гірше, багато хто серед нас не просто співчуває цькуванню цих членів нашого нового суспільства. Вони заохочують його.\n\nХіба вони не вступили сюди, щоб захистити свої сім'ї? Свої землі? Свій дім? Хіба ми не робимо те саме? Невже ми повинні спокійно дивитися, як їхні тіла звисають із найближчого дуба? Ні. Ми лише вирізатимемо потенційно цінних союзників, зважаючи на їхній досвід управління та охорони цих земель. Дозвольмо цим заблуканим душам знайти своє справжнє призначення."

#ETA War tree

BSQ_gora_euskadi_ta_askatasuna: "Хай живе Еускаді та Аскатасуна"
BSQ_gora_euskadi_ta_askatasuna_desc: "Ми перемогли занепалих і зотлілих жельцале! Наш державний переворот скинув старий режим і поклав край загрозі, яка робила Еускаді слабкою. Вічна війна проти клятих іспанців буде завершена під нашим правлінням. Тепер ми правимо Еускаді так, як і мало бути. Життєздатна, об'єднана та соціялістична держава буде втілена в реальність нашою керівною рукою.\n\nДля нас вічною ганьбою залишиться те, що під час нашого державного перевороту декого з наших поміркованіших аберцале довелося піддати мечу, але зараз не час сумувати. Зараз час змусити Мадрид стікати кров'ю за кожен квадратний фут, на який вони просунуться в нашій славній нації. Їхнє покарання за вічний гріх гноблення та люті буде суворим. Якщо буде необхідно, ми заллємо Еускаді червоним, аби наші діти могли жити вільними."
BSQ_gora_euskadi_ta_askatasuna_tt: "§VBietan jarrai§!"

BSQ_expand_the_organization: "Розширити організацію"
BSQ_expand_the_organization_desc: "Чисельність ніколи не була перевагою, якою ми володіли в нашій боротьбі, але тепер, коли наші зусилля принесли плоди, ми більше не можемо дозволити собі залишатися закритою організацією. Хоча чисельність, необхідна для масового руху, наразі недосяжна, ми повинні розширювати свій вплив і заявляти про свою присутність, щоб здобути легітимність серед народу.\n\nЗ цією метою ми прагнутимемо посилити вербування в усіх верствах суспільства, починаючи з тих, хто природно прихильний до нашої справи: профспілок, університетів, інтелектуалів і товаришів, які виступили проти режиму, але не були частиною нашої справи. Це вимагатиме часу й зусиль, але необхідно для захисту революції."

BSQ_there_will_be_no_quarter: "Пощади не буде"
BSQ_there_will_be_no_quarter_desc: "Звірі стоять біля дверей. Якщо вони переможуть, вони вб'ють наших близьких, переріжуть горла нашим дітям і залишать нас попелом, який можна буде розвіяти. Уся Еускаді має знати про небезпеку поразки. Вони повинні усвідомити, що наша нація стоїть на крихкому краю Знищення, і ніхто не доживе до кінця. І навпаки, якщо ми хочемо вижити, навчаймо м'ясників тому, що насправді означає страх.\n\nВішайте їхніх товаришів на деревах, осліплюйте тих, хто вижив після наших атак, і спалюйте будь-які рештки безпеки, якими вони дорожать. Жоден із цих покидьків не вийде з нашої різанини неушкодженим, а ті, кого ми не вб'ємо, нехай розповідають про те, що сталося з їхніми друзями. Нехай вони верещать про жах від того, що розгнівали ETA, мов ті здихаючі свині, якими вони всі є. Жахливі вчинки, безперечно, але який у нас інший вибір?"

BSQ_revolutionary_taxes: "Революційні податки"
BSQ_revolutionary_taxes_desc: "Цього просто недостатньо. Наша безперервна воєнна кампанія стала тягарем для населення — і для нашої скарбниці. Гроші швидко закінчуються, а ми можемо зробити лише так багато, щоб компенсувати наші втрати. Тому деякі з наших людей пропонують більш... революційну ідею. Ті, хто може платити, платитимуть. Товстосуми та поміщики, які палять сигари в сільській місцевості, нічого не зробили для підтримки воєнних зусиль. Ми запровадимо нову систему оподаткування для цих корумпованих паразитів у їхніх заміських маєтках.\n\nЯкщо вони відмовляться, ми просто конфіскуємо їхнє майно. Вони голоситимуть і нарікатимуть на "тиранічні заходи". Ми сміятимемося їм в обличчя. Як клас людей, побудований на спинах селян, може насмілюватися звинувачувати нас у тиранії?"

BSQ_promote_cooperative_farms: "Підтримати кооперативні ферми"
BSQ_promote_cooperative_farms_desc: "Ферми Еускаді бачили й кращі часи: сільське господарство довгий час занепадало, відколи промисловість стала двигуном економіки. Це має ту перевагу, що земельну реформу відносно легко провести, оскільки більшість виступає за створення добровільних сільськогосподарських кооперативів, щоб охочі фермери могли працювати разом і об'єднувати свої ресурси заради спільного добробуту.\n\nЦе пожвавить і модернізує відсталий сектор економіки, водночас уникаючи непотрібної напруженості, оскільки процес не буде примусовим для тих, хто бажає залишатися самозабезпеченим."

BSQ_root_out_traitors: "Викорінити зрадників"
BSQ_root_out_traitors_desc: "Вони всюди. Таємні союзники загарбників збираються у великій кількості проти нашої влади над Еускаді. Прагнучи відновити правління деспотів і самопроголошених королів, вони плетуть змови, щоб поставити нас перед розстрільною командою. Це лише питання часу, коли вони виступлять проти нас і поневолять усіх нас під своєю залізною рукою. Від самої думки про те, що вільні люди Еускаді можуть коли-небудь вирішити об'єднатися з Юдами, аж до рота підступає жовч, але сумна реальність полягає в тому, що таке трапляється — надто часто.\n\nНа жаль, ми повинні розібратися з п'ятою колоною. Складіть списки, стежте за їхніми союзниками й встроміть наші ножі в їхні гнилі, залиті гноєм серця. Коли прийде їхній час — а він прийде, — ніхто не сумуватиме за цими гадюками. Адже з тими, хто сумуватиме, вже розібралися."

BSQ_incentivize_the_mondragon_model: "Стимулювати модель Мондраґона"
BSQ_incentivize_the_mondragon_model_desc: "Хіба ми не люди? Хіба ми не прагнемо свободи, як і будь-яка інша розумна істота? Невже ви воліли б із зубастою посмішкою крокувати назустріч власній загибелі, з ілюзією надії в серці? Так багато наших людей, схоже, ставлять під сумнів наші методи боротьби з мародерами. Схоже, вони піддалися небезпечній ілюзії та почали думати про небезпечну річ. Люди, здається, вважають, що війна, яку ми ведемо, є морально неоднозначною.\n\nВони, схоже, думають, що загарбники насправді не є знаряддям убивств, зґвалтувань і катувань, а є тими, з ким можна вести переговори? Тими, до кого слід ставитися з повагою? Хіба яструб ставиться з повагою до голуба, коли встромляє кігті глибоко в його плоть, розриваючи тремтливі сухожилля та жир із щирою насолодою? Чи повинні ми ставитися до наших яструбів із честю, якщо вони нас убивають? Ні. Ми боремося за Еускаді. Ми боремося за робітників Еускаді, а понад усе — ми боремося за свободу! СМЕРТЬ ІСПАНЦЯМ!"

BSQ_guerillas_tactics: "Партизанська тактика"
BSQ_guerillas_tactics_desc: "Збройні сили, на жаль, ослабли після нашого приходу до влади, і кількість військ, на які можна покластися в захисті соціялістичної республіки, не така велика, як нам хотілося б, і недостатня для того, щоб битися з нашими ворогами у відкритому бою.\n\nНа щастя, у нас є інші способи протистояти ворогові: розумно воюючи та використовуючи партизанську тактику, наші відносно невеликі сили можуть завдавати непропорційно великих втрат ворожим силам, здійснюючи рейди на їхні лінії постачання та атакуючи вразливі, але життєво важливі цілі, позбавляючи їхньої переваги та роблячи великомасштабні вторгнення неможливими."

BSQ_the_war_for_freedom: "Війна за свободу"
BSQ_the_war_for_freedom_desc: "Чим насправді є ця війна? Раніше її вважали війною за національне визволення, повстанням проти іспанських гнобителів. Це правда, але чи охоплює це все? Ми стверджуємо, що це було обмежене визначення, навіть з огляду на його глибоку важливість для ставок у нашому нинішньому конфлікті. Це більше, ніж просто національне визволення нашої Еускаді, це удар по фашистському колосу, який душить цей півострів і континент, до якого він належить.\n\nВизволення має прийти до баскського народу. Визволення від кайданів іспанців, так, але також визволення від кайданів фашизму та капіталізму. Ми ведемо війну на два фронти, як видимому, так і невидимому, щоб створити в Іберії маяк справжньої свободи; маяк, який яскраво сяятиме над цим темним континентом."

 #Events 
BSQ_wars.1.t: "Присяга під деревом"
BSQ_wars.1.desc: "Рожева імла світанку все ще трималася на обрії, не бажаючи відпускати краї світу, коли вони зібралися біля високих жовтих стовпів, що оточували дерево Герніки. Його старе дерево, зі сірими зморшками, що вкривали кору, різко контрастувало з гладким каменем навколо нього. Його кора багато що бачила, багато що чула. Дехто сказав би, що навіть багато що відчула.\n\nВаско спостерігав за худим чоловіком, який прихилився до стовпів і сам дивився на це дерево. Його голова була схилена, постава важка. Васко робив нотатки; його стаття лише виграла б від згадки про те, наскільки серйозно Телесфоро Монсон поставився до своєї нової відповідальності — він лише хотів побачити його обличчя в цю приватну мить. Він був новачком у цій ролі, а сама газета Deia ледве пережила свій перший випуск, але Еускаді мала стати землею детальної правди. Принаймні він на це сподівався.\n\nНавколо нього люди стояли й чекали. Васко прислухався до розмов, шукаючи щось варте уваги. Здебільшого він виявляв, що не впізнає облич, а розмови стосуються хіба що погоди. Він очікував чогось більшого, ніж ця дивна буденність. Зрештою пролунав заклик зібратися півколом біля дерева, а Монсон став у його центрі. Він стояв сам, не тримаючи в руках нічого.\n\n"Нація не створюється сьогодні". Він озирнувся на півколо. "Це нація, яка довго була закута в кайдани, а тепер знаходить свою силу. Роками я присвячував себе баскському народу; сьогодні мене покликано до його найвищого захисту. Моя присяга буде не на книзі чи зброї, а на символі, що пережив усе, чого іспанці його піддали: на дереві Герніки."\n\nВін заплющив очі — Васко не був певен, чи в роздумах, чи в молитві, — перш ніж очі Монсона відкрилися з усім вогнем світанкового сонця. "Перед Богом, смиренно стоячи на баскській землі, пам'ятаючи наших предків і під деревом Герніки, я присягаю сумлінно виконувати свої обов'язки лендакарі.""
BSQ_wars.1.a: "З натовпу залунав вигук "Хай живе вільна Еускаді", і всі відповіли тим самим."

BSQ_wars.2.t: "Зміна зміни"
BSQ_wars.2.desc: "Вони пішли за поліцейськими в цивільному та їхніми одягненими у форму поплічниками до автомобіля, коли ті потягли геть їхнього майстра. Через виробничий цех, через двір і до припаркованих автомобілів вони йшли слідом, мовчазною, але всюдисущою хвилею за офіцерами. Вони слухали, як майстер, їхній майстер, запитував, що відбувається і куди його ведуть. Вони бачили нервові погляди поліцейських у формі, які озиралися, щоб побачити натовп, що рухався з ними в ногу.\n\nКоли майстра закинули в автомобіль, закутого в кайданки й позбавленого можливості рухатися, вони мовчазними вартовими стояли перед невеликою групою поліцейських. В автомобілі вони бачили чоловіків, добре вдягнених чоловіків, які чекали на прибуття їхнього майстра. Вони бачили, як ті щось шепотіли йому, розмовляли, тоді як майстер нервово поглядав крізь вікна на своїх людей. Сила спостерігачів була безсумнівною, але жодної спроби перешкодити викраденню не було. Мовчазне питання кричало в повітрі. Чому?\n\nОдин із поліцейських у цивільному ступив уперед, його вільна сорочка та краватка контрастували з морем комбінезонів перед ним. "Хвилинку, панове. Ми просили вас продовжувати працювати, але тепер, коли ви всі зібралися, я впевнений, що незабаром у нас буде важливе оголошення для всіх вас". Робітники та поліція стояли немов на двох берегах, а море між ними перетворилося на лід.\n\nМинуло кілька хвилин, перш ніж майстер вийшов з автомобіля, а присутні спостерігали, як із нього зняли кайданки. Він потер зап'ястя, скривившись від болю, а поліцейський у цивільному прошепотів йому ще щось, чого ніхто не почув. Майстер ступив до зібраних робітників.\n\n"Мене повідомили, що сеньйор Васкес передав державі право власності на цей завод і що робота продовжиться, як і раніше. Вони розуміють, що ми не були причетні до його діяльності, та запевнилися в нашій відданості баскській нації. Хай живе Еускаді!""
BSQ_wars.2.a: "Збентежена маса вагалася, перш ніж невладний колективний "Хай живе" спробував відповісти."

BSQ_wars.3.t: "Гідна робота"
BSQ_wars.3.desc: "Співбесіди зливалися воєдино в цьому сірому офісі на одній із вулиць Сан-Себастьяна. Усі історії горя та нещасть, усі болісно одноманітні. Худий чоловік в окулярах ставив галочки у своїй формі, поки вони говорили.\n\n"Я лагодила одяг свого чоловіка, перш ніж його затягнуло в ту машину..."\n\n"Я працював у Мадриді, бухгалтером. Поїхав звідти до того, як усе стало погано, але тепер для такого чоловіка, як я, роботи майже немає."\n\n"Ми з чоловіком працювали на фермі. Я керувала десятьма робітниками. Тепер усі вони зникли, мій чоловік мертвий, а ферму конфіскували."\n\n"У мене не було роботи, батько наполягав, щоб я зосередилася на навчанні. Яка тепер із нього користь? Я здобула переважно історичну освіту, особливо вивчала присутність Риму в Іберії, якщо це важливо. Ви це записуєте?"\n\n"Я був прикріплений до гірничодобувних операцій в Африці, переважно керував і ремонтував машини, надто складні для тубільців; мав лише повернутися з відпустки. Хтозна, чи взагалі ще існує те підприємство, а в мене нічого не залишилося, Господи."\n\nВін ліниво заповнював форми, поки вони говорили, бажаючи, щоб вони обмежувалися лише важливими подробицями. Усі вони отримають забезпечене нове життя, держава мала чимало застосувань для бездіяльних рук. Він майже повністю запам'ятав перелік відкритих посад, і якби така істота могла посміхатися, він би це зробив, побачивши, наскільки добре деякі з них підходять. Так, диявол був у бездіяльних руках, але в Еускаді було багато роботи.\n\nВійськова швачка, дрібний службовець міської ради, сільськогосподарський інструктор, оператор складальної лінії та помічник інженера на заводі вийшли з офісу, отримавши адреси та дати працевлаштування."
BSQ_wars.3.a: "Коли вони вийшли з офісу, довга черга надворі посунулася вперед, і ще кілька людей увійшли."

BSQ_wars.4.t: "Урок у горах"
BSQ_wars.4.desc: ""Який у цьому сенс? Вгору на гору, вниз із пагорба. Я сьогодні вже тричі ледь не зірвався з цих схилів, і заради чого? Щоб дізнатися, що падати зі стрімких скель — погана ідея?"\n\nСолдати, дюжина людей, тісно притиснутих один до одного у вузькій розколині на схилі гірської дороги, лежали на брудному камінні, наче на розкішному матраці. Їхні кінцівки все ще відчували вагу наплічників, гвинтівки лежали зверху, а ноги, здавалося, забули про тіла. Вони не дихали важко — втома лежала глибше; кожен рецептор благав про припинення маршу й сходження. Їм пекло в очах від вигляду зубчастих скель. Вони ненавиділи гори.\n\nІнший солдат подав голос. "Звісно, Альвареса тут немає. Наказує нам ходити за цим старим гірським козлом. Він вражає, ми зрозуміли, але ми будемо воювати з іспанцями, а не здобувати нагороди Молодіжної ліги з пішого туризму!" Звідусіль пролунали схвальні бурмотіння, перш ніж один за одним швидко гримнули два постріли.\n\nВони схопилися, оглядаючись навколо. Вони не могли визначити, звідки пролунали постріли, здавалося, що звук ішов звідусіль. Їхні приціли охопили кожну видиму розколину, а декотрі поволі вибиралися зі своїх сховків, намагаючись побачити далі вздовж шляху. "Щось бачите?" — кілька разів лунало питання, але ніхто не відповідав.\n\nПозаду пролунали два глухі удари, наче удари по м'ясу. Вони обернулися, забувши про втому, і наставили зброю на два трупи, що лежали там, де вони щойно стояли. Вони були забруднені, одягнені в легкий одяг, але на них безпомилково виднілися підсумки для боєприпасів. Вони одночасно підняли погляди й побачили гірського козла — старого, за яким вони йшли. Він стояв на виступі над ними, гвинтівка висіла за спиною, а все спорядження було відкинуте, крім одного підсумка для магазинів. "Іспанські партизани, що пересуваються горами, як я вас і навчав. Як ви й ігнорували"."
BSQ_wars.4.a: "Він підняв дві зброї — старі німецькі пістолети-кулемети. "Якби мене тут не було, ви всі були б мертві"."

BSQ_wars.5.t: "Перехрещені мечі"
BSQ_wars.5.desc: ""Усі встати, усі встати!" Майже без зволікання пролунав жахливий скрегіт дерев'яних меблів по дощаній підлозі, ледве приглушений тупотінням сотні ніг в одній тісно заповненій залі засідань. Повітря було наелектризоване, і не без причини: ніколи раніше між провідними членами EAJ та ETA не проводилося настільки організованого — не кажучи вже про публічного — зібрання. Настільки важливою була ця подія, що так званим "незалежним" дозволили взяти участь, попри їхнє сумнівне визнання тимчасовим урядом. Подробиці навряд чи мали значення. Більше людей означало більше легітимності, зрештою.\n\nІ ось, після оголошення порядку денного, обговорення полилося вільно й дещо хаотично. Нещодавні конфіскації майна та статків Союзу стали головним питанням серед представлених провідних партій, а чіткі ідеологічні розбіжності ставали дедалі очевиднішими з тієї самої миті, коли особливо завзятий член ETA вигукнув слово "перерозподіл". EAJ не терпітиме жодного такого "санкціонованого державою грабунку", як проголосили їхні лідери, на превеликий жаль їхніх революційніших суперників.\n\n"Якщо ми дозволимо собі захопитися нашими низькими прагненнями до революційних дій, — журився міністр Ахуріаґерра, економічний радник EAJ, — ми лише розчаруємо власних громадян і підірвемо закони, які відділяють нас від звичайних злочинців!"\n\nНа щастя, компроміс зрештою було досягнуто: конфісковане майно та статки буде ліквідовано для використання в "національній обороні" — меті, з якою майже всі в залі могли погодитися, поза межами будь-яких ідеологічних суперечок. Справа незалежності вимагала цілковитої єдності в діалозі та діях, незалежно від прихованої напруженості, яка загрожувала вибухнути між панівними правими та дедалі войовничішими лівими. Єдиний фронт мав вистояти, принаймні на деякий час, невпинно наближаючись до розквіту баскської квітки у світі."
BSQ_wars.5.a: ""Панове та пані, засідання оголошується закритим!""

BSQ_wars.6.t: "Бог і новий закон"
BSQ_wars.6.desc: "Хуану де Ахуріаґеррі здавалося дивним знову звикати до життя в Більбао, хоча воно й було знайомим. На вулицях з'явилася безліч нових крамниць, але навіть попри те, що половина з них закрилася через перебої з постачанням або через службу на фронті, вони все ще стояли за тим самим планом. Вулиці могли бути порожніми, позбавленими навіть більшості статуй, але більшість із них усе ще вели в тому самому напрямку.\n\nА його церква, як і раніше наповнена вірянами, усе ще дзвонила дзвоном, якого інші люди не боялися. Навіть під час війни Бог залишався верховним. Було приємно відчувати знайомість. Закінчивши молитву й вийшовши зі служби, він побачив, як до нього кинулася юрба журналістів, прагнучи поставити запитання кількома мовами. Німецька, французька, іспанська та італійська його не турбували; він міг говорити практично всіма ними, а також знав достатньо інших, щоб його покровителі невдовзі про все дізналися англійською.\n\n"Що ви думаєте про ETA?" — запитав один із них вільною баскською. Акцент його видавав: він був із Байонни. Для нього, мабуть, останні кілька тижнів були нелегкими; навіть тепер вести переговори з французами було складно. Очевидно, він намагався заспокоїти страхи своїх колег із Je Suis Partout. "Як ви думаєте, чи призведе їхня участь у тимчасовому уряді до тривалішого припинення вогню між ними та EAJ?"\n\n"Що ж, це тимчасова коаліція. Ми працюємо разом, бо мусимо, і тому що всі ми віримо в єдність Еускара проти фашистів, які нас облягають", — відповів він спокійно й завчено. "Ці чоловіки дуже молоді, а нам потрібні люди різного віку, якщо ми сподіваємося забезпечити визволення Еускара."\n\nЖурналіст поставив ще одне запитання, але він швидко відмахнувся від них, прямуючи до кортежу, який чекав на нього неподалік. Як він міг їм відповісти? Звісно, він зневажав присутність ETA, так само як і пониження Лейсаоли. Але розпалювати громадянську війну саме зараз? Його погляд звернувся до гір Пагасаррі, до стежки, якою він ходив у дитинстві."
BSQ_wars.6.a: "Спогади про минуле — це все, що йому залишилося."

BSQ_wars.7.t: "Мовчазний бойкот"
BSQ_wars.7.desc: "Спочатку це було ледь помітно. За останні кілька тижнів теплі усмішки її сусідів поступово згасали, а їхні звичні ранкові балачки поволі звелися до поспішних привітань і найкоротших проявів ввічливості. Дивні погляди скоса. Шепіт, який вона майже чула, коли ходила вулицями села. Колись дорогі друзі, здавалося, дедалі менше прагнули знайти час на розмову з нею, а тепер-\n\n"У них усе добре, Марто", — побіжно кинула Ірен, допомагаючи їй скласти овочі в сумки. Так, тепер усе стало зрозуміло. Лише кілька тижнів тому вона й подумати не могла відмовитися від нагоди без кінця розповідати про дітей, що підростають, коли її про це питали; тепер же, здавалося, вона більше прагнула обслужити наступного покупця біля свого торгового прилавка, ніж підтримувати розмову. Отже, так воно тепер буде. Вони знали одна одну ще дівчатками, а тепер і вона приєднається до гурту тих, хто відтоді ставився до неї як до цілковитої незнайомки-\n\n"Це через Хаві?" — вголос запитала вона, можливо, голосніше, ніж хотіла. "Колись ти горнулася до мене, бо мій чоловік — лейтенант Цивільної ґвардії, а тепер ти просто боїшся, що-" Решта речення завмерла в її горлі, коли її погляд на мить упав на одного з офіцерів у формі зі знаками сокири та змії, які за одну ніч почали з'являтися по всьому селу. "Що вони заберуть і тебе" — саме це вона вирішила не додавати.\n\n"Боягузи", — лише виплюнула вона, розвертаючись, наполовину до черги, наполовину до своєї зневажливої подруги, яка вже почала обслуговувати іншого клієнта. "Ви просто... ви всі просто..." Але вона навіть не була певна, що хотіла додати. Можливо, вона сподівалася, що її раптовий спалах викличе якусь реакцію. Побачити, як провина проступає на їхніх обличчях. Або обурення. Відразу. Навіть просто... збентеження через її цілком публічний вибух. Але натомість вона отримала доказ того, що в одному була права."
BSQ_wars.7.a: "Ніхто більше не хотів її слухати."

BSQ_wars.8.t: "Буденність"
BSQ_wars.8.desc: "Позбавлення людини води робить її відчайдушною. Позбавлення людини природи робить її дисонансною. Позбавлення людини свободи робить її ніким.\n\nСаме це Александеру казали за його короткий час у бюрократії. За короткий час до того, як баскам набридло бути ніким і вони проголосили незалежність від Іберії.\n\nАле ковток води, який йому дали, приніс у його душу немов нове життя. Свіже повітря Біскайї, насичене кристалами солі з Біскайської затоки, оживило тіло Александера, а різкі відчуття вимивали весь мертвий бруд і кіптяву, що виснажували його тіло.\n\nАле Александер усе ще був ніким.\n\nАлександер зосередив погляд на молодому делегаті перед собою. Він ледве розумів різкий гіпускоанський діалект промовця. Але були слова. Фрази. Мелодійні інтонації в його голосі. Взаємодії, за якими він міг стежити.\n\nЦе була пропозиція йому та його товаришам-політичним в'язням працювати на новий баскський уряд. Квиток геть із гнилої руїни, що оточувала його протягом останніх тижнів, а можливо, й місяців.\n\nОчевидно, деякі чоловіки не стали ніким. Дехто тримався за старі ідеали режиму й висловлював побоювання щодо роботи з урядом, який суперечив їхнім цінностям. Інші боялися, що це може бути тимчасовим заходом і їх легко замінять.\n\nАлександер, однак, був людиною-ніким. Очевидно, щоб вилікувати людину від стану ніким, потрібно було знати щось."
BSQ_wars.8.a: "І він навчиться відчувати себе вільним."

BSQ_wars.9.t: "Zeru Horiek"
BSQ_wars.9.desc: ""Ну ж бо, мамо! Це мій обов'язок перед цією країною, перед цим півостровом! Ти ж не хочеш, щоб ми повернулися в 1940-ві, правда? Ти знаєш, що ці фашисти хочуть знищити нашу мову!" Навіть тепер Марія Ландаґуті відчувала занепокоєння через це, але знала, що не може ігнорувати світ навколо себе.\n\n"О, Маріє, ти не можеш вступити до армії, жінки не воюють!" Її мати похитала головою. Від початку громадянської війни вона дедалі глибше занурювалася у страх. Дедалі глибше в спогади про 1937 рік.\n\n"Те, що я помию кілька тарілок, не врятує цей будинок від бомбардування!" — простогнала вона через усе це, через консерватизм, через відсунення на другий план. Те, що призов поширили на жінок, лише підкреслювало це. "Ти не пам'ятаєш, як Сільвано відшмагали в перший день у школі за те, що він говорив баскською?"\n\n"Він уже солдат! Як і Хос-Хобе, як і Ала..." Вона зупинилася, забувши їхні імена, які в момент вступу на службу змінилися на баскські відповідники. "О, що буде, якщо ви всі загинете? Я залишуся сама доглядати за твоїм батьком, а він дуже хворий". Вона нахилилася ближче, не в змозі втримати Марію, коли та відсахнулася. "Ти не можеш піти, не зараз!"\n\nСаме тоді її батько накульгуючи увійшов до кімнати, його здоров'я було радше як у чоловіка вдвічі старшого за нього. "Іліє, будь ласка, заспокойся". Він насилу сів на стілець, тремтячи. "Ти пам'ятаєш громадянську війну? Фортуну? Ми виросли на одній вулиці. Найкращий боєць у моєму загоні. Поклав дюжину тих фашистів біля Сантандера, перш ніж..." Його очі затуманилися, і він зітхнув. "Ти можеш іти, Маріє."\n\nЇї бравада раптом згасла, коли вона прийняла свою відповідальність. Стримуючи сльози, вона міцно обійняла батька, потім ще міцніше матір, а тоді схопила свою сумку. Вийшовши за двері, вона востаннє обернулася, поглянула на кімнату, в якій виросла, і зупинилася, щоб сказати лише одне."
BSQ_wars.9.a: ""Тепер це Ітсаль.""

BSQ_wars.10.t: "Аберцале при владі"
BSQ_wars.10.desc: "Велика площа перед мерією Більбао була переповнена людьми — чоловіки, жінки та діти зібралися, щоб побачити видовище, а також група журналістів, щоб увічнити цю подію. Озброєні бійці ополчення ETA оточили площу, стоячи перед дверима мерії та обабіч бородатого чоловіка, який керував усією подією зі сходів. Театр зміни режиму прийшов до міста.\n\nХосе Марія Ескубі кинув сигарету на сходи перед собою й розтоптав її, дістаючи з кишені комюніке — сценарій сьогоднішнього великого дійства. Він розгорнув його, кивнув чоловікам по обидва боки від себе й почав читати, поки перед ним спалахували камери й мікрофони слухали.\n\n"Вітаю, народе Країни Басків. Через провали попереднього режиму Еускаді та Аскатасуна взяла на себе ініціативу з перебудови Тимчасового уряду. Телесфоро Монсон, колишній лендакарі, був запрошений залишити свою посаду, яка наразі залишатиметься вакантною. Члени уряду, що належать до псевдонаціоналістів з EAJ, також пішли у відставку або були заарештовані за звинуваченнями у зраді. Наразі уряд складатиметься з широкого фронту демократичних і націоналістичних сил, відданих справжнім змінам у нашій Нації, на чолі з відданими аберцале з ETA. Хай живе Еускара!"\n\nНатовп зааплодував, і Ескубі знав, що він їх переконав. Провали попереднього уряду відкрили можливість для справжніх патріотів нарешті взяти справи у власні руки за підтримки народу. Присутність озброєних ополченців на кожному розі площі теж не завадила. На тлі баскського прапора він підняв кулак і посміхнувся камерам."
BSQ_wars.10.a: "Режим міг змінитися, але вистава мала тривати."

BSQ_wars.11.t: "Смерть і податки"
BSQ_wars.11.desc: ""Ось там, це те місце". Данель без вагань звернув, ведучи тісний SEAT 600 на ґрунтову та гравійну дорогу, що прорізала вкритий густою травою пагорб. На краю пагорба маєток височів над південною Алавською сільською місцевістю, розкішна будівля серед пагорбів Країни Басків. Виноградники розсікали ділянки рівнинної землі поруч із маєтком, викликаючи у Данеля похмуру гримасу. Він міг лише мріяти про те, щоб дозволити собі таке місце.\n\nПроїхавши через парадні ворота маєтку, Данель припаркував автомобіль просто біля сходів головного будинку, а тоді повернувся до свого супутника. "Гаразд", — сказав Хоанес. Від нього долинув тихий зітх. "Давайте з цим покінчимо".\n\nДвоє чоловіків вийшли з автомобіля й піднялися сходами маєтку, після чого Данель постукав у парадні двері. За мить після тихого клацання замка зсередини перед ними постав чоловік середнього віку. Данель прокашлявся. "Добрий день. Ми прийшли повідомити вас про нові умови щодо нещодавнього підвищення податку на багатство, яке набирає чинності негайно". Хоанес швидко передав чоловікові середнього віку стос документів, чим неабияк його здивував.\n\n"Ще одне підвищення податків?" Власник маєтку видав роздратований смішок. "Ви висмоктуєте з мене всі соки, забираючи все, заради чого я тяжко працював, і вам усе ще мало?" Він швидко зім'яв папери й сердито кинув їх на землю. "Я вам не свиня на забій—"\n\nВажкий поштовх Данеля раптом повалив чоловіка на землю, і двоє збирачів податків увійшли до його будинку. "Це не прохання, і ви не в тому становищі, щоб нам відмовляти. Ми всі повинні щось віддати, особливо під час війни". Стоячи поруч із Данелем, Хоанес мовчки розстебнув ліву частину піджака, показавши кобуру з пістолетом. "У вас є два тижні, щоб повністю сплатити, інакше..." Хоанес знизав плечима. "Доведеться внести корективи.""
BSQ_wars.11.a: "Чоловік міг лише скиглити, коли двоє залишали його будинок."

BSQ_wars.12.t: ""
BSQ_wars.12.desc: ""
BSQ_wars.12.a: ""

BSQ_wars.13.t: "Хто стереже сторожів?"
BSQ_wars.13.desc: "Насмішки розкололи повітря, наче блискавка, коли двері будинку нарешті піддалися натиску імпровізованого тарана. Ті, хто тримав дерев'яну колоду, похитнулися, перш ніж увірватися до невеликого будинку, що стояв у спареній забудові й нічим не відрізнявся від усіх інших на вулиці.\n\nПовітря було сповнене глузливих вигуків. "Хапайте франкіста!" — кричали одні. "Ну що, тепер уже не такий сильний?" — кричали інші. Атмосфера була наповнена цілою низкою різноманітних образ, і всі вони були спрямовані виключно на єдиного мешканця будинку.\n\nРаніше місто знало його лише як тихого старого чоловіка; здавалося, він ніколи ні з ким не розмовляв без потреби. Однак, коли мусив говорити, він ніколи не був неввічливим, і певною мірою став місцевою пам'яткою.\n\nНіхто не знав, з чого все почалося. Почали ширитися шепітки. "Можливо, цей старий не такий простий", — казали вони, — "він говорить із південним акцентом. Що він тут робить?" Поширювалося чимало теорій змови, аж поки меру нарешті не принесли справу; у ній була фотографія старого чоловіка з незнайомим ім'ям — його ідентифікували як співробітника Цивільної ґвардії.\n\nЗ верхнього поверху пролунала черга пострілів, викликавши крик переляку в натовпі. За кілька миттєвостей старого чоловіка витягли з будинку, один із чоловіків тримався за закривавлену руку. "Він ховався, мерзотник намагався нас застрелити!" Старого чоловіка кинули на землю посеред вулиці, між ним і містянами залишився невеликий вільний простір.\n\n"Чого ви хочете? Що ви говорите? Я ніколи не був поліцейським, будь ласка—"\n\nЙого благання згасли в крику, коли натовп кинувся вперед, розлючений виглядом закривавленого співвітчизника. Кілька приглушених криків пролунали, перш ніж загубитися серед глузливих вигуків і глухих ударів."
BSQ_wars.13.a: "Позаду них стояли мер і поліцейські міста, сміючись разом із натовпом"

BSQ_wars.14.t: "Правила війни"
BSQ_wars.14.desc: "У повітрі висіла імла, єдиним звуком був вітер, що гуляв між деревами. Місце було мальовничим, якби не заросле поле, на якому всюди виднілися сліди занедбаності. Поруч стояла занепала ферма, один житловий будинок і сарай. На землі перед будинком мовчки сиділи троє солдатів. Вони були там уже деякий час.\n\n"Чому б нам просто... не піти?" — тихо сказав наймолодший, не піднімаючи очей від землі.\n\n"Ми не можемо забрати їх із собою, їх більше за нас. Якщо вони нападуть на нас, перш ніж ми повернемося в безпечне місце..." — відповів інший, хитаючи головою.\n\n"Не можемо залишити їх у сараї. Більшість із них ровесники мого сина, просто діти", — втрутився найстарший чоловік. Запала ще одна тиша.\n\nЇм пощастило. Під час патрулювання вони побачили ферму й вирішили поглянути. Вони знайшли дюжину солдатів, які спали вдень без вартового. Їхні гвинтівки лежали навіть не поруч. Вони зробили кілька пострілів у повітря й гаркнули кілька наказів, замкнувши їх у сараї — але що тепер?\n\n"Ми не так далеко від наших позицій... якщо ми вселимо їм страх Божий, вони, мабуть, не завдадуть клопоту—"\n\n"І як ти пропонуєш це зробити?"\n\n"Їхній офіцер міг сьогодні їх усіх погубити. Судячи з його віку, він, мабуть, теж кадровий. Б'юсь об заклад, він дещо встиг зробити для Франко. Чому б нам не позбутися його так, щоб це стало посланням...?"\n\n"Це вбивство."\n\n"Якщо це змусить хлопців не створювати проблем, то це їх врятує.""
BSQ_wars.14.a: "Старший чоловік без слова підвівся й дістав багнет. Інші пішли за ним."

BSQ_wars.15.t: "Стороннім вхід заборонено"
BSQ_wars.15.desc: "Віз із гноєм підстрибував, рухаючись дорогою, вирубаною в схилі кам'янистого пагорба. Дорога була всіяна камінням, а асфальт зношений через недбале утримання, ледве придатний для коня, не кажучи вже про транспортний засіб. Арцай не звертав на це особливої уваги. Дорогу проклали багато років тому, але для його коня та воза вона цілком підходила.\n\nВіз слідував вигином дороги вгору, а Арцай майже не звертав на нього уваги, дивлячись із краю пагорба. Він знав про Війну — а хто не знав, — але не звертав на неї уваги, доки не з'явилися солдати. Вони розбили табір: десятки наметів і транспортних засобів різного розміру стояли в чагарниках унизу, за кілька кілометрів. Арцай був старим чоловіком і мало цікавився їхньою суперечкою, але видовище, безперечно, було чогось варте.\n\nЙого кінь раптом заіржав і зупинився, загрожуючи понести, вивівши Арцая з задуму. Він як міг заспокоїв тварину, шукаючи очима причину. Однак усе, що він міг відчути, — це запах гною, і жодної причини не було видно.\n\n"Тихо, дівчинко, що тебе налякало?" — сказав він, поплескуючи її по крупу зі свого місця. "Там щось є?" Він нестійко зліз із воза, щоб побачити, що налякало його коня. Можливо, на дорозі лежала мертва тварина?\n\nКоли Арцай відійшов від воза, його огорнув нудотний запах, а гудіння мух стало гучнішим. Поспішаючи вперед, він обійшов бік коня, відригуючи від побаченого й скрикнувши від жаху.\n\nНа дорозі лежав чоловік обличчям униз. Шкіра була почорніла й роздута. Спина була розірвана крізь одяг, який, здавалося, був якоюсь військовою формою, а ребра чоловіка стирчали, наче крила птаха. Під тілом лежала табличка з написом: "Загарбникам. Залиште Еускаді, або вас спіткає доля вашого друга.""
BSQ_wars.15.a: "Арцай більше ніколи не користувався цією дорогою, доки жив."
