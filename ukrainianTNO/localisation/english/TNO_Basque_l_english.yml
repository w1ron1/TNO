BSQ_Pablo_Beldarrain_sec_desc: "§YМіністр безпеки\nХристиянський консерватизм§!\n--------------\n§LПабло Бельдаррайн розпочав свою військову кар'єру в 1930 році, ставши офіцером, водночас зберігаючи членство в EAJ та її профспілці. Після початку Громадянської війни він керував підготовкою добровольців EAJ, а згодом сам командував військами в боях, але, попри його майстерність, Еускаді не змогла протистояти переважаючим силам націоналістів. Він відступив до Франції на човні за наказом баскського уряду залишатися там. Під час війни його таємно переправили до Британії для підготовки американською розвідкою, але саме тоді фашизм ступив на британську землю, наче не бажаючи знову дозволити йому вислизнути. І все ж він утік: цього разу він прибув до Мексики й на деякий час вступив до її армії.\n\nАле невдовзі поклик його батьківщини став непереборним. Він повернувся до новоствореного Іберійського Союзу, де після прибуття був ув'язнений. Після звільнення він продовжив підтримувати невелику мережу діячів EAJ, які мали певні зв'язки з ОВН. Здавалося, він так і залишиться малопомітним повстанцем у приреченому повстанні.\n\nАле потім Союз розпався — і його старі товариші знову зв'язалися з Бельдаррайном. Їм був потрібен досвідчений військовий, який допоміг би створити баскську армію, і він знову взявся до зброї. Тепер він бореться проти некерованих озброєних загонів, які визволили Еускаді: вони можуть насолоджуватися своєю автономією, але він знає, що заради збереження свободи вони повинні від неї відмовитися.§!"

BSQ_Jose_Maria_Eskubi: "Хосе Марія Ескубі"
BSQ_Jose_Maria_Eskubi_hog_desc: "§YВіце-лендакарі\nЛівий націоналізм§!\n--------------\n§LПісля перевороту Хосе Марія Ескубі, один із головних лідерів ETA, був призначений речником Ради уряду. Ця посада не має справжніх повноважень чи влади повноцінного голови ради, натомість Ескубі є лише першим серед рівних.\n\nЕскубі — один із лідерів фракції "четвертого світу" ETA, яка прагне пов'язати баскську національну боротьбу з іншими націями, що борються проти трьох колоніяльних держав. Він критично ставиться до дедалі більшої фракційності ETA, через яку його революційний запал почав згасати. Попри це, Ескубі продовжує підтримувати внутрішні структури ETA, які дозволяють існувати таким розбіжностям.§!"

BSQ_Jose_Luis_Alvarez: "Хосе Луїс Альварес 'Чильярдеґі'"
BSQ_Jose_Luis_Alvarez_for_desc: "§YМіністр закордонних справ\nЛівий націоналізм§!\n--------------\n§LХосе Луїс Альварес Енпаранса, більш відомий під псевдонімом Чильярдеґі, був одним із засновників ETA, ставши її членом від моменту створення в 1959 році. Попри це, як головний лідер "культурницької" фракції ETA, Чильярдеґі також є одним із найвпливовіших критиків прихильності ETA до збройної боротьби.\n\nПопри це, Чильярдеґі продовжує кампанію, започатковану Ечебаррієтою до перевороту ETA, збираючи міжнародну підтримку від національно-визвольних рухів Латинської Америки та Африки. Водночас він розширив її, приділяючи особливу увагу міжнародній баскській діаспорі у Франції та Латинській Америці.§!"

BSQ_Juan_Etxabe: "Хуан Хосе Ечабе"
BSQ_Juan_Etxabe_sec_desc: "§YМіністр оборони\nЛівий націоналізм§!\n--------------\n§LХуан Хосе Ечабе — керівник військового відділу ETA, відповідальний за організацію всіх ополчень ETA після проголошення незалежності. Він також є одним із головних лідерів ETA, відомим під псевдонімом "Гаундіше". Хоча офіційно він не належить до жодної фракції, значною мірою він близький до "четвертосвітників" у складі ETA.\n\nНасправді Ечабе не надто відданий соціялістичній лінії ETA, розглядаючи її передусім як організацію, присвячену національному визволенню. Отримавши новий погляд завдяки посаді радника, Ечабе відійшов від зосередженості винятково на ополченні й тепер прагне змішаного підходу, інтегруючи ополчення з більш традиційними військовими структурами.§!"

