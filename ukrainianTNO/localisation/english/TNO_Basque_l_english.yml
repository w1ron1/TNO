BSQ_Juan_Ajuriagerra: "Хуан де Ахуріаґерра"
BSQ_Juan_Ajuriagerra_eco_desc: "§YМіністр економічних справ\nХристиянський консерватизм§!\n--------------\n§LБаскський націоналізм Хуана де Ахуріаґерри сформувався в лавах групи молодих альпіністів, і відтоді він працював на благо землі, якій належали ці гори — дехто сказав би, що він неодружений, бо одружений з Еускаді. Попри жорстоке поводження в підземеллях Франко після Громадянської війни та знання багатьох європейських мов, де Ахуріаґерра відмовився надовго тікати, працюючи з баскським і ширшим демократичним підпіллям зі свого ув'язнення в Памплоні.\n\nУ цей період де Ахуріаґерра став головним лідером EAJ в Іберії, підтримуючи зв'язок між активами ОВН та керівництвом у вигнанні, з одного боку, і місцевими партійними діячами — з іншого. Його робота була вирішальною не лише для виживання EAJ, але й для збереження її політичного характеру — де Ахуріаґерра залишався відданим співпраці з християнсько-демократичними рухами та відмовлявся схвалювати радикальні ідеї молодших баскських активістів.\n\nПісля розпаду Іберії та створення тимчасового уряду Ахуріаґерра готовий знову взяти на себе публічну роль, після того як під час Громадянської війни був директором пропаганди. Непохитно відданий Лейсаолі, якого він вважає законним лендакарі, Ахуріаґерра обурений рішенням усунути його на користь Монсона, щоб задобрити безвідповідальних радикалів ETA. Наразі, однак, він готовий прийняти новий політичний порядок — він уже пожертвував набагато більшим заради Еускаді.§!"

