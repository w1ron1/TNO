#Ministers
BSQ_Jesus_Leizaola: "Хесус Марія де Лейсаола"
BSQ_Jesus_Leizaola_hog_desc: "§YВіце-лендакарі\nХристиянський консерватизм§!\n--------------\n§LХесус Марія де Лейсаола — один із найстарших діячів баскської націоналістичної політики, який бере активну участь у боротьбі за самовизначення свого народу ще з 1910-х років. Після кар'єри в урядах Другої Республіки та баскської автономії під час громадянської війни він вирушив у вигнання разом із першим лендакарі Хосе Антоніо Аґірре. Після раптової смерті Аґірре в 1960 році баскський уряд у вигнанні призначив його наступником. На цій посаді він намагався підтримувати полум'я баскської культури, публікуючи дослідження баскської культури та поезії й дописуючи до газет.\n\nАле потім Іберійський Союз вибухнув полум'ям і кровопролиттям, і в хаосі було створено нову баскську батьківщину. Повернувшись після тривалого вигнання, Лейсаола зіткнувся з новим поколінням баскських націоналістів, менш схильних до культури та значно радикальніших у соціальному плані, ніж він сам. Його непохитний католицизм і засудження тероризму зробили його неприйнятним лідером для ETA, а похилий вік і десятиліття вигнання зробили його менш привабливим і для багатьох поміркованіших членів уряду.\n\nБуло вирішено надати титул лендакарі Монсону, і хоча Лейсаола прийняв необхідність зберегти єдність тимчасового уряду й навіть пом'якшив своє ставлення до ETA в хаотичних умовах Іберії, він досі гірко сприймає те, що його усунули від ролі, яку він і досі вважає особисто переданою йому у спадок.§!"

BSQ_Jose_Miguel_Benaran: "Хосе Міґель Беньяран"
