#Characters & Leader descs
BSQ_Jose_Quesada: "Хосе Марія Кесада"
POLITICS_JOSE_QUESADA_DESC: "Багато в чому ETA та її військове крило були породженням франкістської диктатури. Жорстокі спроби знищити баскську мову та культуру, вигнання, у яке були змушені піти старі баскські націоналісти, репресії проти робітничих рухів, стрімка індустріалізація та урбанізація Еускаді з напливом робітників-іммігрантів у цей регіон — усе це були складові, що згодом злилися в раптовій появі руху аберцале. І саме ці фактори призвели до появи Хосе Марії Кесади Ласарте.\n\nНародившись у змішаній баскській та наваррській робітничій родині, він утратив батька, який загинув, воюючи на боці республіканців під час Іспанської громадянської війни, але невдовзі й сам долучився до боротьби. Один із перших бойовиків ETA, Кесада безпосередньо відповідав за кілька сміливих воєнізованих і політичних акцій: напади на конвої, що перевозили іспанських та іберійських солдатів, публічні спалення іберійських прапорів та інші подібні публічні демонстрації — він швидко став ворогом номер один іберійської розвідки й щоразу вислизав від неї.\n\nОдин із найвпливовіших командирів військового крила ETA, він був обраний очолити баскський уряд після перевороту, який привів до влади збройні організації аберцале-лівиці. Хоча дехто зображує його маріонеткою молодших, амбітних генералів, таких як Арґала, та іншої бойової молоді аберцале, Ласарте користується широкою підтримкою ETA, і він та його кліка неодноразово заявляли про свою мету — Країна Басків і свобода, якою б не була ціна."

BSQ_Pablo_Beldarrain: "Пабло Бельдаррайн Оральде"
POLITICS_PABLO_BELDARRAIN_DESC: "Пабло Бельдаррайн розпочав свою військову кар'єру в 1930 році, ставши офіцером, водночас зберігаючи членство в EAJ та її профспілці. Після початку Громадянської війни він керував підготовкою добровольців EAJ, а згодом сам командував військами в боях, але, попри його майстерність, Еускаді не змогла протистояти переважаючим силам націоналістів. Він відступив до Франції на човні за наказом баскського уряду залишатися там. Під час війни його таємно переправили до Британії для підготовки американською розвідкою, але саме тоді фашизм ступив на британську землю, наче не бажаючи знову дозволити йому вислизнути. І все ж він утік: цього разу він прибув до Мексики й на деякий час вступив до її армії.\n\nАле невдовзі поклик його батьківщини став непереборним. Він повернувся до новоствореного Іберійського Союзу, де після прибуття був ув'язнений. Після звільнення він продовжив підтримувати невелику мережу діячів EAJ, які мали певні зв'язки з ОВН. Здавалося, він так і залишиться малопомітним повстанцем у приреченому повстанні.\n\nАле потім Союз розпався — і його старі товариші знову зв'язалися з Бельдаррайном. Їм був потрібен досвідчений військовий, який допоміг би створити баскську армію, і він знову взявся до зброї. Тепер він бореться проти некерованих озброєних загонів, які визволили Еускаді: вони можуть насолоджуватися своєю автономією, але він знає, що заради збереження свободи вони повинні від неї відмовитися."

BSQ_Telesforo_Monzon: "Телесфоро Монсон"
POLITICS_TELESFORO_MONZON_DESC: "Недавня історія Країни Басків була сповнена конфліктів — між народом Еускаді та його правителями в Мадриді, а також між різними фракціями баскського руху — і Телесфоро Монсон опинився в центрі їх усіх. Народившись у заможній аристократичній родині в 1904 році, у молодості він невдовзі приєднався до Баскської націоналістичної партії, або EAJ, швидко ставши головою її місцевого осередку. Інтелектуал, письменник, поет і палкий прихильник ідеології жельцале, Монсон співпрацював із CEDA та іншими групами проти Народного фронту, але коли відбувся націоналістичний державний переворот, що мав призвести до Іспанської громадянської війни, Монсон та решта його партії опинилися на боці республіканців.\n\nКоли війна завершилася катастрофою, Монсон та решта баскського уряду були змушені піти у вигнання. Оселившись одразу за кордоном у Франції, Монсон залишався близьким другом лідера EAJ і лендакарі баскського уряду Хосе Антоніо Аґірре — однак його відносини з партією невдовзі почали погіршуватися через розбіжності в поглядах. Монсон вважав, що EAJ робить недостатньо для створення вільної Еускаді та що необхідні радикальніші дії. Тому він підтримував тісний контакт із невеликими низовими організаціями, які почали виникати в країні, насамперед з Екін, яка згодом перетворилася на ETA.\n\nЗгодом Монсон став чи не єдиною людиною, яка користувалася широкою повагою як серед правих жельцале, так і серед лівих аберцале — і коли Іберія занурилася в хаос, а баскський народ вийшов на вулиці, Монсон став природним вибором на роль нового лендакарі. Взявши на себе складне завдання керувати баскським урядом під час війни та намагаючись подолати ідеологічну прірву між ETA з її численними пов'язаними рухами та старою гвардією націоналістів з EAJ, Монсон тепер є стрижнем крихкої політичної рівноваги, яка утримує сили Еускаді разом, — але важко сказати, як довго вона протримається."

