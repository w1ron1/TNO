BSQ_Collective_Leadership: "Колективне керівництво"
POLITICS_BASQUE_COLLECTIVE_LEADERSHIP_DESC: "Коаліція між EAJ та ETA завжди була малоймовірним явищем, яке трималося виключно на номінально спільній меті та зусиллях Монсона подолати розрив. Однак у міру того, як війна затягувалася, а недоліки уряду ставали дедалі очевиднішими, крихта довіри, що залишилася, остаточно зникла. Використовуючи свої ополчення, ETA здійснила переворот, усунувши EAJ від уряду. Тепер ETA править одноосібно, отримавши свободу втілювати своє соціялістичне бачення новонародженої країни.\n\nБуло вирішено залишити посади лендакарі та віце-лендакарі вакантними, щоб жодна людина не могла зосередити навколо себе надто багато влади — доля, яка вже занапастила революції за набагато стабільніших умов, ніж ті, що дісталися ETA. Вакантні посади також слугували іншій меті, адже хоча під час співпраці з EAJ ETA залишалася єдиною, тепер, коли ETA правила одноосібно, почали утворюватися тріщини. Різні фракції ETA мали власне бачення майбутнього Еускаді, і ці тріщини лише збільшувалися в міру інтеграції нових незалежних лівих організацій, кожна з яких мала власне унікальне бачення майбутнього баскського народу.\n\nНа вулицях люди чують зміну риторики. По суті, вона залишається тією самою, але ніхто не може заперечити різницю у відчуттях, коли заклики Республіки "забезпечити свою незалежність" тепер перетворилися на заклики "перемогти у війні"."

#Ideas
BSQ_eta_idea: "Еускаді та Аскатасуна"
BSQ_eta_idea_desc: "Відновлення баскського самоврядування стало спільним результатом номінальної легітимності колишнього уряду у вигнанні та значної військової підтримки з боку одного з найвідоміших місцевих повстанських рухів — Еускаді та Аскатасуни, або ETA. Попри заявлену політичну нейтральність поза межами виконання ролі збройної сили країни, основне ядро ETA, що складається з молодих, розчарованих партизанів, останнім часом загалом схиляється до лівого руху аберцале. У міру того як жельцале в складі бойового угруповання дедалі частіше усувають від владних посад, уряд, контрольований EAJ, відчуває, як слабшає його хватка на мечі."
BSQ_frente_militar: "Військовий фронт"
BSQ_frente_militar_desc: "Боротьба ETA не є однорідною, і адміністрація не повинна нав'язувати однорідність, яка лише придушує самоврядування її складових. Щоб відобразити цю реальність, бюрократію ETA було поділено на чотири незалежні "фронти", і Військовому фронту було доручено займатися їхньою підготовкою та витратами. Однак із приходом ETA до керівництва країною досвід Військового фронту в організації міських партизанів, схоже, вже недостатній для повсякденного управління армією, якого потребує незалежна держава. Без поступового процесу децентралізації та набуття необхідного досвіду Фронт, імовірно, й надалі працюватиме зі значно зниженою ефективністю."
BSQ_jeltzale_abertzale: "Жельцале та аберцале"
BSQ_jeltzale_abertzale_desc: "Сучасний баскський націоналізм бере свій початок у XIX столітті, коли Сабіно Арана заснував Баскську націоналістичну партію. Від самого заснування вона дотримувалася католицької ідентифікаційної філософії жельцале, втіленої в гаслі "Бог і давні закони". Спираючись передусім на підтримку еліт баскського суспільства, її реакційність нещодавно призвела до розколу серед націоналістичних груп, результатом якого стала поява аберцале.\n\nНові організації аберцале набирають своїх бойовиків із бідніших верств суспільства, впроваджуючи марксизм у патріотичну традицію, щоб примирити її з уявленнями заможніших співвітчизників. Хоча нині їх об'єднує націоналістичний запал, ця непримиренна ідеологічна прірва стане перешкодою для цілісності будь-якої майбутньої баскської держави."
BSQ_basque_red_terror: "Баскський червоний терор"
BSQ_basque_red_terror_desc: "У Країні Басків сотні тисяч людей готові боротися, вбивати й помирати за свою націю. Але не всі. Серед гір, долин і пагорбів досі залишається значна кількість іспанських юніоністів, реакціонерів або людей, яких нинішній уряд загалом вважає зрадниками. ETA наполегливо працює над тим, щоб це змінити. За допомогою масових арештів і поспішних страт баскський комуністичний уряд прагне усунути ці підступні елементи з національного організму. Усе це необхідно доти, доки їхня улюблена Еускаль Еррія не буде звільнена від тих, хто хотів би бачити її відданих синів і дочок убитими або закутими в кайдани."
BSQ_sectarianism_spectre: "Привид сектантства"
BSQ_sectarianism_spectre_desc: "Хоча значна частина Еускаль Еррії знову опинилася в баскських руках, роки асиміляції та культурного винищення призвели до того, що ці землі населяють багато людей, які не вважають себе басками. Окрім "іспанців", які забули свою спадщину, це також історична поселенська громада Наварри та біженці, що тікали від потрясінь громадянської війни. З огляду на їхню нині значну присутність у країні, повністю позбутися їх немає жодної практичної можливості.\n\nБільше того, оскільки Баскська націоналістична партія залишається непримиренною щодо цих "загарбників" і "макетосів", дедалі менш імовірно, що існує можливість інтегрувати цих не-басків, не ставши свідками глибокого й потворного сектантського насильства."
