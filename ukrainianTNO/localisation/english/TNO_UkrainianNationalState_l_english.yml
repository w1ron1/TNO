 BOV_our_bloodlands_await: "Наші криваві землі очікують"

 BOV_fortune_infamous_desc: "На кожному рівні, на кожній перепоні, з якою зустрічався Вождь, люди казали, що він не подолає це. „Стецько цього разу провалиться“ було широко поширеною думкою. Однак він так і не провалився - й ніколи не провалиться. Учинки, які він зробив заради забезпечення абсолютної влади викликали гнів, ненависть і підступи проти нього, але він із усім цим розбереться, із часом, звісно ж.\n\nШанси завжди були проти нього, і всередині, і зовні, однак прихильність фортуни неможливо відкинути. Вождь витримає і це випробування. Як і завжди."
 BOV_yaroslav_wisdom_desc: "Інші в Україні зосереджуються на першочерговому, однак Стецько дивиться далі. Він дивиться на історію, як у минуле, так і в майбутнє. Наслідуючи Ярослава Мудрого, він бачить ширшу картину і те, що, незалежно від останніх подій, справжнім ворогом тисячолітньої давнини є російсько-монгольські орди.\n\nНімеччина, попри чисельні її неправильні кроки, отримала велику перемогу проти них во ім'я європейського люду, і це не можна недооцінювати. Прийнявши цю мудрість, Стецько обережно проведе корабель держави й приведе Україну до того ж рівня, що й її сучасники."
 BOV_twist_dagger_desc: "Великий Вождь був змушений робити невигідні домовленості й компроміси, аби захопити владу в нашій незалежній державі. Підкилимний, прихований характер цих зусиль призвів до того, що незадоволені голоси нашого руху почали робити вражаючі порівняння між нашим Вождем і єврейськими паразитами, що сквернять нашу батьківщину. Це недопустимо! Мудрий Стецько - представник нового майбутнього для арійців України, і, як і справжній арієць, він досягне тріумфу над всіма тими, хто ставить під питання його правління."
 BOV_streets_rage_desc: "Після всього того, що пройшла наша нація, пройшовши крізь кров, піт і сльози за десятки років війни з большевизмом і зрадниками, наша країна все ще лишається забрудненою. Слов'янсько-монгольські банди поляків і росіян, що тепер звільнилися від свого полону, збиваються в бродячі банди і пронизують сільську місцевість, викликаючи безлад і терор. Досить. Нам слід нагадати цьому сміттю про їхнє місце в Україні, навіть якщо нам і самим доведеться вчинити трошки терору!"
 BOV_reassure_settlers_desc: "З самого моменту кінця Райхскомісаріяту і тріумфу наших сил у громадянській війні, наші брати-арійці, поселенці, дивилися на нас зі зростаючим відчуттям страху й параної, безсумнівно, охоплені страхом перед зрадниками й психопатами на кшталт Клячківського. Не бійтеся, любі родичі! Ми не шалені, не зрадники й не дегенерати, ми - брати-арійці і зразкові українці, тож вам нема чого боятися..."
 BOV_media_blackout_desc: "Євреї, що контролюють ЗМІ у Америці та її відмираючих судинах, почули кров. Проблеми в Німеччині дали їм новий сплеск мотивації проникати зі своїми дегенератськими цінностями в свідомість усіх, кого більше не захищають німецькі цензори. Українці, на жаль, не виняток.\n\nАби запобігти деградації нашої цінностей, яку викликає засилля єврейської пропаганди, Україна повинна подвоїти свої зусилля з цензурування і заповнити ефір, аби відбити будь-який ліберальний чи комуністичний вплив. Якщо наша новостворена держава хоче проіснувати хоч якийсь час, свідомість наших людей повинна бути вільною від будь-якого руйнівного впливу."
 BOV_our_bloodlands_await_desc: "Галичина - українська, так завжди було, і так завжди буде. Хто б не керував цими землями - поляк, австрієць, росіяни, знову поляки - не змінить цього факту. Ті поляки, що все ще окуповують Галичину, можуть спробувати відкинути це, разом із нашими домівками. Якщо вони не повернуть територію, нам доведеться нагадати їм про нашу легітимну претензію на цю землю.\n\nНімці, здається, загалом запевнилися в нашому праві володіння Галичиною, надавши українцям у польській адміністрації автономію. До того ж, деякі попередники в минулому зробили певні зусилля, аби зробити етнічний склад населення більш рівномірним. Можливо, знадобитися лише один останній поштовх, і ми побачимо Галичину повністю заселеною українцями, і жодного поляка чи представника будь-якої іншої раси більше не буде на цих землях."

 ### Events ###
 #civil war events
 
 BOV.1.t: "Хаос на вулицях"
 BOV.1.d: "Плакат був сповнений надії. Сповнений мріями про звільнення від нацистського порядку. Сповнений мріями про сильне, вільне майбутнє. На плакаті були зображені Братство, Клячківський, Громадянин і Солдат, які разом хапають руку зі свастикою, рвучи її на чверті, а по центру було розміщено напис "Наше право - бути вільними". Однак Роман лишався скептичним. Як Братство звільнить Україну від нацистів, якщо воно навіть не може вберегти свої вулиці від хаосу?\n\nКожного дня стається бунт, когось підривають чи лінчують на вулиці. Вийти на вулицю по справах без якого-небудь способу захисту - найвірніший шлях отримати жорстокі побої, а ще втратити все, що буде при тобі. Вулиці впали в анархію, і Братство не робило нічого, аби полагодити ситуацію. Натомість же, вони сиділи в своєму високому замку, наказуючи цивільним гинути беззмістовною смертю заради їхньої мети. Вони їздили по вулиці в броньовиках, виловлюючи меншину штибу євреїв і поляків, аби лінчувати їх із рештою натовпу. Романове обличчя скривилося в огиді.\n\nРаптово цей плакат став джерелом болю для Романа, ніби, подивившись на нього, він відставив прямо до душі смолоскип. Він схопив плакат і відірвав його зі стіни в пориві неконтрольованої ненависті й гніву. Він важко дихав. А тоді Роман швидко пішов, знаючи одне: якщо хоч якийсь лояліст побачив, що він зробив, він буде наступним у списку чисток Братства."
 BOV.1.a: "Непереконані на нашій землі скоро замовкнуть."
 
 BOV.2.t: "Фермер і Братство"
 BOV.2.d: "Петро Полтавець вирячився на людей у чорній уніформі, що зайшли на територію його угідь. Навіть стоячи в 70 метрах від них він відчував недоброзичливість, яку вони випромінювали. Вони наближалися, і в міру цього він відчув майже тваринний інстинкт, що казав йому розвернутися й тікати, аби врятувати себе від будь-якого жаху, що хотіли йому показати люди в чорному. Проте, якщо в чомусь Петро й був знаним, то це в сміливості, тож він продовжив стояти на місці й дозволив людям наблизитися до нього.\n\nЛюди наближалися, і один із них поглянув на папірець у руках.\n\n"Слава Україні! Ми з Братства Волині. Ви - Петро Полтавець, мешканець садиби Полтавців?"\n\n"Ви праві" - відповів Петро, намагаючись не видавати страху, що він відчував. Братство Волині? Вони - екстремісти й терористи! Що вони роблять тут?\n\n"Добре. Радий поінформувати, що тепер ви воюватимете на лінії фронту за звільнення України. Від вас чекають, що ви покладете своє життя за Батьківщину, якщо це знадобиться. Я зрозуміло пояснився?"\n\nПетрові очі розширилися, він не вірив власним вухам. Його мобілізовують воювати за терористів!\n\n"Слухайте, ви, виродки терористські, я боротимуся за Україну на своїх умовах! Ви не зможете залякати мене до такої міри, що я-"\n\nЙого речення перервав другий чоловік, який ударив прикладом пістоля по тепер непритомній голові Петра. Чоловік зі списком глянув на свого товариша й сказав:\n\n"Хапай його й клади у вантажівку.""
 BOV.2.a: ""Незабаром він досить добре пізнає, що таке послух Братству.""
 
 BOV.3.t: "Непочуті молитви"
 BOV.3.d: "Нутрощі заводу неприємно пахли, гнили й розігрівалися сильніше, ніж Гютіґґова Афріка в ясний сонячний день. Щоправда, якби тільки працівники могли бачити природнє світло зовні. Фабрика мала свій власний мікрокосмос Пекла, а до працівників усередині ставилися так, ніби вони лише побиті, перегріті шматки м'яса, створені, аби робити більше гвинтівок, більше інструментів, більше деталей щодня.\n\nМихайло був одним із таких працівників, хворим, смердючим, відчайдушно потребуючим їжі й води. Його руки відпадали, а легені, як здавалося, впадуть від кількості розпечених випарів, що він вдихав. Однак він не міг спинитися, навіть на секунду, адже охоронці побачать. Він продовжував вставляти ударник у ствольну коробку, ударник у ствольну коробку, ударник у ствольну коробку, знову й знову щонайменш по 16 годин на день.\n\nОднак Михайло не міг кричати, і не міг він плакати. Він міг лише робити гвинтівки для Братства, аби допомогти їхнім планам на Україну. Однак було дещо, що він міг зробити, дещо, що навіть найпильніший із охоронців Братства не міг помітити. Він міг мовчазно молитися. Молитися за своє виживання, молитися за добробут Україну, молитися за руйнацію Братства і німців. Однак із кожним новим днем, із кожною додатковою робочою годиною, Михайло починав підозрювати, що його молитви лишилися непочутими."
 BOV.3.a: "Адже самі лиш молитви не зможуть знищити німців."

 BOV.4.t: "І жінки теж"
 BOV.4.d: "Марина дивилася на гвинтівку в її руках дуже-дуже довго. У неї не було жодного поняття, як її використовувати чи як вона працює. Вона навіть ніколи до того в руках не тримала гвинтівки! І вона сказала це рекрутерам Братства! А втім вони все ще забрали її з її дому, зробивши її мобілізованою, яку кинуть на лінію фронту, яка помре, воюючи зі справжніми солдатами. Боже, вона воюватиме зі справжніми солдатами зі справжнім досвідом у боях, а її підрозділ настільки недоукомплектований, що їй навіть не видали військових чобіт! Марина здригнулася від страху. Усе, подумала вона. Тут і скінчиться моя історія.\n\nМарина керувала невеликою фермою, яка знаходилася приблизно в тридцяти хвилинах від Житомира. Вона перейняла контроль над нею після того, як її батько і брати загинули у боротьбі проти німців у Другій світовій війні. Вона жила самотнім, але задовільним життям. Їй достатньо пощастило: її не закріпачили німці, їхня присутність в Україні жодним чином не вплинула на її життя. Це, звісно ж, змінилося, коли люди в чорному з'явилися на порозі її ферми, говорячи їй про «славетне звільнення України» і що боротися за неї - її обов'язок.\n\nТепер Марина відчувала, що страх візьме її першим, навіть до того, як вона вперше зустрінеться з німцем. До того, як їй доведеться воювати з братами-українцями. Марина знову здригнулася від цієї думки. Їй доведеться вбивати власних співвітчизників. Або померти від їхніх рук. Вона опустила свою гвинтівку. Вона не змогла більше тримати її в руках. У будь-якому разі вороги скоро її заберуть у її тіла."
 BOV.4.a: "Усі люди, незалежно від статі, повинні воювати за Україну!"

 BOV.5.t: "Прах"
 BOV.5.d: "Старі Євгенові кістки й суглоби боліли від поєднання його віку, військової служби й артриту, однак він продовжував рух. Йому треба було відвести своїх онуків у безпечне місце, подалі від Братства Волині, а, можливо, подалі й від самої України. Він усе ще міг відчути запах попелу всього його рідного села після того, як його запалили. Він міг відчути запах усіх сімдесяти років спогадів, знищених за мить, коли було розпалено той вогонь. Тої ночі, і кожної ночі з тих часів, він плакав. Плакав за втраченими спогадами. Плакав, що святиню, що він будував своїми руками, зруйнували так, ніби вона не важить нічого. Плакав за тим, що вічноголодний вогонь ще більше поглумився над прахом його дружини.\n\nВін згадав, коли йому наказали евакуювати свій будинок. Чоловік, одягнений в уніформу, капітан Волошин, дав йому п'ять хвилин для нього та його онуків, щоби зібрати найбільш важливі припаси перед тим, як покинути дім назавжди. Капітан оголосив, що вони повністю спалюють усе село, і що його родину приставлять до стінки, якщо вони не підкорятимуться. Тож Євген здався. Йому хотілося вчинити акт опору, захистити те, що за правом його, однак він розумів марність таких спроб. Тож він сказав онукам зібрати все необхідно і нічого більше, після чого вони швидко покинули село. Коли Лариса й Павло спитали, чому вони залишили дім, у роті в нього пересохло. Він не зміг змусити себе поглянути онукам у очі. Він просто тягнув їх за собою.\n\nУтома його суглобів і кінцівок швидко повернула Євгена до теперішнього. Він більше не міг бігти. Він спинив Ларису й Павла, і вони зробили постій на ніч. Зранку вони продовжать свій біг. Вони ніколи не зможуть втекти достатньо далеко від їхнього втраченого раю."
 BOV.5.a: "Чи було це необхідно?"

 BOV.6.t: "Ніч у сховищі"
 BOV.6.d: "Дмитро, Юрій і Василь дивилися на сховища після довгого дня подорожі до Києва. Вони пробиралися повз незліченні німецькі патрулі, крізь хвилі за хвилями артилерійського вогню, а втім їх лякало сховище. Василь секунду намагався вихопити поглядом якнайбільше входів до сховища. Жодного вікна. Ну звісно ж.\n\nВасиль важко зітхнув. "Чорт забирай, жодного вікна. Схоже, пробиратимемося прямо через центральні двері."\n\n"Що? Здурів, Василю? Вони ж нас усіх на ремені поріжуть!"\n\n"Дідько, Юрію, потихше! Василь має рацію. Це єдиний шлях до сховища. До того ж, можливо, воно й не охороняється. Пам'ятаєш, через скількох німців ми прокралися? Ми, певне, пройшли повз усю їхню армію! Ми будемо в порядку", - відповів Дмитро. "Заходимо, підриваємо, виходимо. Роботи на двадцять хвилин від сили."\n\nЮрій напружив своє тіло. Він не може бути боягузом, не тоді, коли вони пройшли вже так далеко!\n\n"Правда, правда. Маєте рацію. Ми можемо це зробити. Кінець прямо тут, Боже! Ну ж бо, покінчімо з цим."\n\nВасиль першим пішов уперед і схопився за ручку на дверях. Він її повернув, штовхнув двері... і нічого. Жодних поспішних слів цією огидною німецькою мовою. Жодних німецьких щурів, готових до того, що їх поріжуть, наче баранів. Нічого.\n\nВасиль озирнувся. "Усе чисто! Зробімо все й покінчімо з цим."\n\nТридцять хвилин потому сліпучий вибух сповістив німців, що щось жахливо неправильне сталося на їхньому сховищі. Однак до моменту, коли ті дісталися туди, було вже запізно."
 BOV.6.a: "Іще одна успішна місія, яку виконали наші хоробрі агенти!"
 
 BOV.7.t: "Залізниця"
 BOV.7.d: "Григорій міцно тримав у руках вибухівку, ніби вона могла раптово вистрибнути й побігти за найближчий горизонт. Він придушив у собі позіхання, намагаючись не привертати більше до себе німців, що могли бути поряд. Хоч він уже й перерізав горлянки всім німцям, яких він знайшов біля залізничного полотна, на таких місіях ніколи не можна бути надто обережним. Конкретно ця залізна дорога була важливим вузлом постачання, оскільки зв'язувала всі міста в оточуючій її місцині, а всі вони були потужно фортифікованими фронтовими містами. Було надзвичайно важливим, аби Григорій виконав своє завдання успішно.\n\nГригорій присів, безшумно просуваючись до своєї мети, пильно стежачи за ворожими військами, які випадково проїжджали повз. Він швидко спустився на залізницю і почав закладати вибухівку. Після того як він заклав шосту, він почув звук, що змусив його серце в п'яти піти.\n\nВін почав шалений, панікуючий голос німця, скоріш за все, він кричав своїм товаришам, яких міг знайти. Раптом він почув свист пострілів із парабеллума над головою, і Григорій побіг геть від залізничного переїзду. Він чув усе більше німецьких голосів, що підбігали, і він знав, що він мав зробити. Його ціль. Він вихопив із кишені детонатор і натиснув на кнопку. Оглушливий БАБАХ луною роздався на кілометри, майже точно попереджуючи всіх у цій зоні. Тож Григорій продовжив бігти, задоволений знанням того, що, навіть якщо його спіймають і вб'ють, він завдав значної шкоди ворожим лініям постачання. Він широко всміхнувся."
 BOV.7.a: "Потужний удар по постачанню ворога!"

 BOV.8.t: "Наказ №439"
 BOV.8.d: "Місто [ROOT.Capital.GetName], наказ № 439, виданий [?global.date.GetDateStringNoHourLong].\n\nВійна за звільнення від зрадників УНРА, большевиків Української соціялістичної республіки совєтів, і тиранів Райхскомісаріяту й Фольксдиректорату занадто довго тривала, і це розчаровує Братство. Звіти показали, що боротьба все ще триває на всіх фронтах, і кінця цьому не намічається. Боротьба різниться від фронтових операцій великого масштабу проти вермахту і до малих сутичок у сільській місцевості проти дизорганізованих ворожих сил. Звіти також проявляють, що державний запас їжі й амуніції для солдатів повільно вичерпуються, і це тривожить.\n\nМешканці України, що показали значну підтримку воїнам і бажання пожертвувати чимось заради Братства, теж починають сумніватися, чи наша справа дійсно варта їхньої боротьби й зусиль.\n\nТаким чином кожен чоловік, жінка, і навіть дитина, якщо вони достатньо здорові й витривалі, як ментально, так і фізично, повинні боротися за Україну своїми життями. Командири й генерали будуть заохочені й зообов'язані надіслати людей на фронт для останнього наступу проти ворожих сил. Коли тактика не дає результату, солдати йтимуть вперед, не дбаючи про своє життя, дбаючи лише про визволення України. Тих, що не підкорюватимуться наказам, ви можете за бажання розстріляти за злочин дезертирства.\n\nБудь-який прояв слабкості потрібно усунути з рядів армії. Нам треба бути готовими віддати все за Україну.\n\nЗаради мети звільнення України, нам слід тепер прийняти гасло..."
 BOV.8.a: "Уперед, під перехресний вогонь, уперед!"

UPA_CivilWar.1.t: "Іскри національної революції"
UPA_CivilWar.1.d: "Клячківський стояв на нашвидкруч зробленій сцені, його оточував натовп. Він відчув укол розчарування, що так мало людей прийшли подивитися на нього. Однак ця промова все ще буде не лише для тих, хто стоїть із ним зараз - це буде промова для всієї України, враховуючи похапцем зібрану апаратуру для звукозапису перед ним. Це буде промова, що резонуватиме із серцями людей на десятиліття вперед.\n\n"Сьогодні я стою перед вами, аби розказати про те, що гряде велика битва. Занадто довго наша кохана Україна була під гнітючим управлінням нацистських завойовників. Однак, завдяки хоробрим зусиллям кожного воїна УПА, ми нарешті змогли порвати кайдани й почати відвоювання нашої нації.\n\nОднак не помиляйтеся, думаючи, що наша боротьба вже скінчилася - вона далеко не завершилася. Німці, хай там як послаблені, все ще загрожують нашій свободі й незалежності. Ліберали й комуністи - ті, хто плекав слабкість і розбещеність, що призвели до падіння нашої нації - усе ще тримаються за мізки багатьох наших співвітчизників. Тож, ми повинні готуватися до наступної стадії цієї війни - війни на виснаження, на виживання.\n\nМи повинні зібрати всю свою силу й хоробрість і спиратися на великий дух нашого народу. Ми - вищі люди, нащадки великих воїнів і героїв минулого. У нас є бажання й рішучість подолати будь-яку перешкоду на нашому шляху.\n\nІ ми повинні бути готовими знову зустрітися з нашими ворогами, повернути те, що по праву наше, розчавити їхні жалюгідні потуги опору. Ми повинні показати їм, що нас не варто недооцінювати, що їхні погрози, їхня зброя не злякає нас. Ми повинні бути об'єднаними в цій боротьбі, адже лише завдяки єдності можемо сподіватися, що отримаємо перемогу. Тож стіймо разом, браття, і покажімо світу, що значить бути українцем."
UPA_CivilWar.1.a: ""Слава Україні, слава УПА!""

UPA_CivilWar.2.t: "На ногах"
UPA_CivilWar.2.d: "Вийшовши з лісу, група солдатів УНРА вздріла невелике містечко. Воно здавалося порожнім, жодної партизанської активності, тож вони обережно перетнули його периметр. Їхня зброя все ще була готовою до застосування. На вулицях було моторошно тихо, тож вони не могли не втратити пильності.\n\nЦя помилка дорого коштуватиме їм.\n\nКоли вони увійшли на міську площу, бомба в машині вибухнула, і уламки автівки полетіли в різні сторони. Одного з солдатів убило миттєво, решту оглушило і дезорієнтувало.\n\nІз тіні з'явилися партизани УПА, одразу стріляючи. Солдати УНРА відбивалися хоробро, однак їх переважали за чисельністю і якістю. Один за одним вони гинули від партизанських куль.\n\nМертва тиша знову спустилася на містечко, а тіла солдатів УНРА без ознак життя вкрили вулиці."
UPA_CivilWar.2.a: "Усе повернулося до того, як було колись."

UPA_CivilWar.3.t: "Ціна свободи"
UPA_CivilWar.3.d: "Антон лежав на землі у лісі, його руки були зв'язані в нього за спиною, а очі були закриті - він був оточений купкою партизанів УПА, і всі направили на нього свої гвинтівки. Він міг чути звуки вітру, що проносився крізь дерева, і далекий шум найближчого міста.\n\nОдин із тих, хто захопив його, вийшов уперед, на його обличчі з'явилася збочена посмішка. Він підняв свою зброю і направив її прямо на голову чоловіка. Антон відкрив очі й глянув на нього, вираз обличчя в нього був спокійним, він не боявся.\n\n"Останні слова?" - прогарчав той, що вийшов уперед.\n\nАнтон не сказав нічого. Натомість він лише Натомість він просто нахилився вперед, наче збираючись прийняти свій кінець. Викрадач на мить завагався, розгубився й стурбувався. Йому здалося, що чоловік намагатиметься напасти на нього, і він запанікував.\n\nІнші захоплювачі повторили за ним, почавши випадковим чином стріляти по ньому. Кулі пробили його тіло, миттєво вбивши. Це була груба страта, вона не відповідала суворим стандартам порядку, до яких прагнули в УПА, однак одним партизаном усе ще стало менше."
UPA_CivilWar.3.a: "І це ще один партизан, якого скоро забудуть."

UPA_CivilWar.4.t: "Убити героя"
UPA_CivilWar.4.d: "Голова змії, очільник УНРА, Юрій Горліс, нарешті потрапив у руки УПА. Його кінець покладе підґрунтя розколу ліберальних сил і зацементує перевагу бандерівського руху над нацією.\n\nЙого завели в ліс і змусили впасти на землю. Виконавець смертної кари глянув Юрієві в очі, а той подивився у відповідь - поглядом, повним незворушності перед обличчям неминучої смерті. Між ними було двостороннє розуміння - Юрій занадто важливий, аби до нього ставитися так, ніби він заслуговує належної кари посеред травмованого видовищем натовпу. У такому разі він буде мучеником, а його сміливість стане насмішкою для УПА.\n\nІ так, швидким, холодним і прорахованим рішенням Юрія застрелили до того, як будь-яке слово могло бути сказане. Його тіло кинули в могилу без позначку, лишили гнити у лісі так, аби ніхто не дізнався."
UPA_CivilWar.4.a: "І так скінчується легенда, хлопком і без плачу."

UPA_CivilWar.5.t: "Переробляючи суспільний лад"
UPA_CivilWar.5.d: "Селяни збилися гуртом на площі. Їх закликали послухати промову від представника УПА, якого поставили наглядати за новозавойованим селом. Хтось у натовпі поглядав на того з цікавістю, а інші - зі страхом чи незацікавлено.\n\nЧоловік говорив про силу повстанської армії, про її можливість вернути силу й безпеку українцям, звільнити від чобота нацистів, тиранії комуністів і безпорядку лібералів. Багато хто серед натовпу, хоч і був змушений перебувати там, почали цікавитися тим, що казав чоловік. Він балакав без угаву ще деякий час. Усе більше й більше людей у натовпі загіпнотизовували його слова.\n\nНічого з того, що він казав, не здавалося чимось контроверсійним, тож відчувалося природнім, коли чоловік почав у певний момент базікати про "вищість української крові" і про потребу звільнити державу від "нижчих" елементів.\n\nДеякі з жителів села обмінялися стурбованими поглядами, а решта продовжила дивитися. Промова продовжилася, і лідер УПА закликав показати їхню солідарність, і натовп почав скандувати "Слава Україні!" в унісон. Дехто дивився з жахом на друзів і сусідів, що приймали риторику своїх колишніх окупантів. Інші раділи від усвідомлення того, що тепер українці будуть на першому місці. Однак решта, що не відповідала ідеалізованому образу чистої української людини - здригалася від думки, що щось може піти не так."
UPA_CivilWar.5.a: "Нове начальство чимось схоже на старе."

UPA_CivilWar.6.t: "Останні хвилини"
UPA_CivilWar.6.d: "Офіс був тихим, аж занадто тихим, як на робочі години. Спочатку Іванко був упевнений, що ніхто не прийшов туди цього дня. Тоді він помітив напої, що лишили на стільниці, й папери, розкидані по столу секретаря. Спершу це здавалося незвичним, але не неможливим. Іванко і його товариші були людьми УНРА, які потрапили в пастку світу УПА. Іванко знав, що газета рано чи пізно закриється.\n\nОднак чому вони розпустилися і не повідомили його?\n\nПісля короткого зирку по кімнаті, Іванко помітив двох людей у кімнаті друкаря. Він не міг сказати, ким вони були - однозначно, незнайомцями. Вони читали номер на наступний тиждень, малювали на сторінках і говорили з одне одним.\n\nОдин із людей, той, що вище, мав на спині зброю. І, коли Іванко приглянувся, він зміг побачити стрічки червоного й чорного навколо плеча.\n\nТоді Іванко підмітив багряну пляму на деревині. У деяких місцях ця пляма навіть здавалася ще вологою.\n\nЖурналіст обернувся, сподіваючись утекти додому, молячись, що його ім'я загубиться в хаосі. Він не побачив, що один із солдатів уже повернувся до Іванка і скинув із плеча гвинтівку."
UPA_CivilWar.6.a: "Іванко приєднався до своїх товаришів через кілька миттєвостей."

UPA_CivilWar.7.t: "Дамоклів завод"
UPA_CivilWar.7.d: "Іван, новий керівник Вінницького заводу важкого машинобудування, дивився крізь вікно свого кабінету на вервечки робітників, що гуділи на своїх робочих місцях. Він підніс склянку німецького вина до губ і випив великими ковтками. Вино пішло прямо до шлунку, і він проклянув командира, що назвав його керівником. Як та люжина могла завважати, що Іван пасує цьому проклятому місцю?\n\nХмара, що нависла над заводом Івана - хмара досвіду й умінь. УПА призначили його, врахувавши фого "досвід", однак досвід не мав жодного значення для лінії виробництва. Перед тим, як прийшли УПА, Іван був усього лиш рабом німців і знав лише його єдину станцію на конвеєрі. Справжнє знання цього заводу лежало в мізках інженерів і керівників, яких із заводу вигнали розстрільною командою, а потім розмазали по південній стіні.\n\nІншими словами, якщо щось на заводі зламається, у Івана немає рішень.\n\nПоки що Іван був героєм для УПА. Однак якщо завод зіткнеться з нещасним випадком, якщо машина поламається, та навіть якщо електрика вимкнеться, Івана не розглядатимуть із такою добротою. Вони проведуть розслідування за звинуваченнями в зраді, невмілому керівництві й змові проти нації. І, справді, таке може скінчитися лиш одним чином.\n\nІван намагався запевнити себе, що кращий вихід можливий. Можливо, підвищення в посаді станеться швидше, ніж якийсь нещасний випадок. Можливо, Іван матиме досить часу, аби втекти. Однак і те, й інше залежало від гарної роботи заводу хоча б місяць із гаком. А арійські фабрики спиралися на певний рівень... витрат в українцях.\n\nІван скуштував вина, що було на губах. Якщо це стане останнім разом, коли він вип'є, він однозначно обрав файне вино."
UPA_CivilWar.7.a: "Він витратив решту дня, допиваючи пляшку."

UPA_CivilWar.8.t: "Прості насолоди"
UPA_CivilWar.8.d: "Август не був людиною, що часто скаржится - такі розмови не личать солдату. Він не був схожим на товаришів у великій війні проти большевизму, що скаржилися на поганий провіант і нескінченну купу грязюки під ногами. Ні, Август сприйняв ці випробування спокійно. Про це свідчать залізні хрести, що колись висіли на стіні його кабінету. "Ах, ностальгія". Він подумки картав себе - це теж було ознакою слабкості.\n\nАвгустова робота ніколи не була нижчою за середній показник, тож на нього рідко кричали охоронці, однак абсолютно безнадійні ледарі, яких йому треба було називати колегами, не могли навіть гільзу начистити, а вона могла їм життя врятувати.\n\nОдин із охоронців прикривнув ззаду. "ШВИДШЕ, ШВИДШЕ, якщо хочете сьогодні мати час на поїсти - ВОРУШІТЬСЯ!".\n\nАвгуст не підскочив. Він відчув, як охоронець розгублено тупотить. У нього була залізна спина, і жоден підліток із гвинтівкою не міг змусити її зігнутися. Він повернувся до роботи. Август начищав гільзи до блиску. Через хвилину до нього надходила наступна пачка, і його робота була так само бездоганною. Наступну ж пачку Наступну партію просто неможливо було відполірувати; що б він не робив, червонувато-коричнева пляма, здавалося, просочувала гільзу все більше. Він почав бубоніти про дурних робітників, що намагаються порізатися, аби втекти з роботи, однак помітив легкий біль у великому пальці. Він потужно кровоточив. Август посмоктав його й повернувся до роботи.\n\nАвгуст ніколи  не мав такої речі, як "перерви". Лише короткі періоди, коли їжу йому мало не кидали йому і давали кілька коротких хвилин, аби проковтнути її й повернутися до конвеєрної лінії. Поки він їв свою кашу, він помітив своїх співвітчизників.  Це були лисі чоловіки з гострими очима, їхні очі в усіх були опущені вниз у тваринному прагненні поглинути їжу в мисці, або ж вони нишпорили по підлозі в пошуках недоїдків. Август знав цих людей, якщо не на ім'я, то на обличчя. Він наглядав за їхньою роботою роками, він чув їхні розмови про свободу, про німецьких тиранів і подібні речі, і все ж, вони лишилися тут."
UPA_CivilWar.8.a: "Назавжди із ним."

UPA_CivilWar.9.t: "Дзвони реквієму"
UPA_CivilWar.9.d: ""Вважаю, друзі, що наш хрестовий похід не завершено. Ані краплі! Ми звільнили нашу націю від тевтонського ярма, розчавили большевиків, побачили, як наш прапор розвівається від Дону до Волині, однак ми ще не побачили всю Україну, звільнену від іноземного чобота. Усе ще на горло нам тисне, коли ми дивимося оком втомленим на Німеччину, бо бачимо, як наш народ жахається від самої лиш думки про їхні бомби, а ми молимося про пощаду від іноземного ворога..."\n\nЯрослав Стецько сидів, затамувавши подих, його обличчя й кісточки на пальцях побіліли. Це сталося, вороття нема. Він знав десь глибоко всередині, що такий план наближався. Він пам'ятав несамовиті заяви в таборах, несамовите гомоніння, він навіть туманно пам'ятав ті карти на облуплених, вицвілих пропагандистських плакатах, що висіли на забутих міських дошках оголошень, і те, що вони обіцяли.\n\n"...Хто вони? Ці зрадники, ці відступники, ті, хто сміють у нас сумніватися! Чому деякі з них сидять серед нас?!"\nСтецько втупився поглядом уперед, його обличчя стало майже жовтим. Господи помилуй, просто, прошу тебе, покінч із цим триклятим експериментом. Може, тоді німці зроблять його смерть короткою.\n\n"Скоро ми вирушаємо. Наші армії готові. Кров нашого народу вимагає справедливості для тих, хто так несправедливо проливав її. Честь і гідність України не вберегти, якщо ми не підемо на південь і не повернемо наш півострів! Національний флаг замайорить над Севастополем!".\n\nУсі аплодували, а Дмитро Клячківський опустився на своє місце з опличчям, позбавленим емоцій."
UPA_CivilWar.9.a: "І пролунав дзвін."

UPA_CivilWar.10.t: "Перемога, абсолютна й беззаперечна"
UPA_CivilWar.10.d: "Усі вони були неправі. Усі вони сумнівалися в ньому. У всіх них бракувало амбіцій, запалу й справжнього патріотизму. Лише він, Дмитро Клячківський, увійде в історію як визволитель Криму! Його марш по Севастополю запам'ятають, прямо як Скіпіонів тріумф! Лише він дійсно досягнув Бандерової мрії!\n\nВулиці міста лежать у руїнах. Там, де колись тевтонські моноліти затьмарювали небо, лежать руїни, а там, де колись були розкішні декадентські парки, - багнюка. Шухевич байдуже дивився на все це.\n\n"Ми перемогли! Ще кілька років тому ми думали, що цей день ніколи не настане!"\n\nКлячківський ляснув Шухевича по спині, мало не збивши того з ніг.\n\n"Гадаю, що так", - сказав він порожнім тоном.\n\n"Ти гадаєш?" - зітхнув Клячківський, злегка гикнувши.\n\n"Німці все ще присутні тут і в сільській місцевості. Ми не зачистили ще всі гарнізони, та й татари не задоволені. Я вже чув повідомлення про непокору в Ял..." "І їх ми розчавимо!" - огризнувся Клячківський, його хижацька усмішка злегка пригасла. "У них тут більше немає. Їхні маєтки ми розпаюємо, деякі солдати вже привели свої сім'ї туди, а від татар можна відкупитися, надавши їм частку в розділі. Гарнізони зачахнуть."\n\n"Ти надто хвилюєшся."\n\nКлячківський повернувся, вирячившись на гавань. Він хоча б прийшов, не те що Стецько. Стецько був надто зайнятий скигленням у Києві."
UPA_CivilWar.10.a: "Вони не знають перемоги, навіть коли стоять у її воріт."

### Fraternal Coup events ###

BOV_fraternal_coup.1.t: "Ґамбіт Стецька"
BOV_fraternal_coup.1.d: ""Най би чорт побрав його безглуздя!" - вилаявся Стецько, тупцюючи по кабінету й збираючи папери для друкарської машинки. Зазвичай зібраний чоловік став схильним до нервових зривів із того моменту, як Клячківський наказав штурмувати Крим, і його перемога лише далі підштовхнула візіонера до нестабільного запалу.\n\n"Його нестача гальм точно призведе до смерті всіх нас", - додав Ребет. Стрес не відобразився на чоловікові добре - піт вкрив лисину і неспокійно блищав.\n\n"Якщо Вождь вестиме себе, наче скажена тварина, то його треба буде приспати", - додав холодно і з насмішкою Лебедь. "Стає важче ховати сліди, скоро він триматиме нас за наші горлянки".\n\n"І якраз це і є причиною, чому я викликав обох вас сюди", - вигукнув Стецько й почав розгнівано друкувати. "Миру й України не буде, якщо ми сидітимемо тихо і дамо фальшивій долі захопити наші життя". Швидкі клацання друкарської машинки заповнювали моменту тиші, а Стецьків голос почав своє crescendo. "Перед нами лежить лише два шляхи. Один - до ранньої домовини, а один - до славетної перемоги. Прямо як Бандера, що колись кинув виклик злісному спотворенню поглядів Мельником, ми теж повинні зачистити з наших лав Вождя, чиї амбіції зраджують нашим ідеалам". Стецько дістав сторінку з машинки й простягнув її Ребету. "Достав це Маївському, без затримок".\n\n"І що ж мені треба робити?" - поцікавився Лебедь.\n\n"Слідкуй за нашим любим Вождем. Вірю, що ти знаєш, що робити, коли з'явиться можливість", - кинув Стецько із глузливою посмішкою."
BOV_fraternal_coup.1.a: "І так Мефістофель розпочав свій вальс."

BOV_fraternal_coup.2.t: "Брати у непокорі"
BOV_fraternal_coup.2.d: "Високоповажний генерале,\n\nя повинен привітати вас із вашим тріумфальним визволенням нашої любої України. Завдяки вашій військовій доблесті наш народ може нарешті отримати волю, яку в нього крали протягом чотирьох десятиліть. Бог милосердно подивився на ваше командування, і я молюся, щоб він продовжував благословляти ваш шлях.\n\nПовинен також зізнатися, що я пишу до вас не з чесними намірами, проте з намірами брехливого розбійника. Мені шкода, що все дійшло до цього, однак дії Вождя загрожують майбутньому, що ви здобули для нашої нації. Ярослав формує план зі звільнення нас від тиранічного погляду Вождя раз і назавджи, тож я й пишу до вас, любий друже, аби поінформувати про наше скрутне становише.\n\nЯ розумію, що прохання вчинити зраду проти нації, що ви щойно звільнили, стане зрадою й ваших принципів, проте я сподіваюся, що всередині вашого серця ви побачите правість нашої справи. Якщо ж мій запит виявиться надто вимогливим, тоді я благаю вас зробити вигляд, що цього листа не існувало, заради ваших же людей. Я молитимуся за безпеку й здоров'я вас і вашої родини у ці непрості часи. Україна потребує кожного героя, що в неї є; я лише прошу, аби ви не кинули її зараз, у час великої потреби.\n\nІз глибокою поваго,\n\nЛ. Ребет"
BOV_fraternal_coup.2.a: "Щире прохання дійшло очей опортуніста."

BOV_fraternal_coup.3.t: "Гра патриціїв"
BOV_fraternal_coup.3.d: ""План скинути Вождя? Нечасто маємо можливість іти Бандеровими слідами", - пробурмотів Кук із саркастичним докором.\n\n"Можливість зробити так, як робив Бандера, дійсно рідкісна", - відгукнувся з кривою посмішкою Позичанюк, - "і розкидатися Ребетовою дружбою - марнотратство."\n\n"Кінчайте зрадницькі розмови", - гаркнув Шухевич. "Не слід довіряти таким підсолодженим словам. Стецько - ляльковод, що стоїть за цієї схемою; цілком можливо, що Лев став лиш однією з його маріонеток". Справді ж, Шухевич не знав, що йому робити з листом. Він розглядав ідею спалити його й слова нікому не сказати; це було би правильним рішенням, а втім він викликав своїх радників, щоб почути їхні думки. "Я нагадаю всім вам, що, як офіцери армії, ви повинні підтримувати дисципліну весь час".\n\n"Я перепрошую; мені не слід було дозволяти моєму запалу затьмарювати судження", - відповів Позичанюк.\n\n"Однак", - вставив Кук, - "він має рацію; якщо коли-небудь існував шанс змусити Вождя до реформ або до відставки, цей шанс - саме зараз". Шухевич не міг відкинути спостережень своїх підлеглих. Можливо, він викликав їх, аби підтвердити те почуття, що він відкидав усередині? Сильні люди йдуть за своїми бажаннями й забирають те, що за правом належить їм. Чи дозволить він собі підкоритися цьому хитрому хорту, аби втекти від нелогічного гніву дикої тварини? Ні. Його більше не відсунуть на задній план.\n\n"Можливо, я поспішив із визнанням ваших слів зрадницькими", - сказав Шухевич. "Зрештою, ми не будемо винні, якщо звістка про падіння Вождя дійде до нас запізно.""
BOV_fraternal_coup.3.a: "Третій приєднався до диявольського танцю."

BOV_fraternal_coup.4.t: "Чужинець"
BOV_fraternal_coup.4.d: "Клячківський глянув на величне місто Київ зі свого вікна. Споруди, що бовваніли перел ним, спотворювала його власне втомлене відображення. Клячківський не міг не вирячатися на той привид, що дивився на нього з вікна. Його очі, оповиті темрявою, врізалися в його найглибші струни душі, а вага багатьох безсонних ночей розчавлювала його свідомість. Ось цей древній чоловік, ця ходяча шкаралупа людини в дзеркалі - він? Звісно. Чи не те, що він заслужив своєю слабкістю, дозволило підірвати УПА зсередини?\n\nУ вікно ввірвалося викривальні промені сонця, що сходило, на мить засліпивши Вождя. Коли зорі покинули втомлені очі Клячківського, він міг дивитися лише на сяюче місто за вікном. Київ, таке славне й древнє місто, завойоване іноземцями, однак ніколи не втрачене для українського народу, було чужим для нього. Блискучий оптимізм теплого міста за межами свого офісу жодного разу не відчував Вождь, який майже п'ятнадцять років переховувався в сирих хащах і пагорбах Галичини. Голодні болота, які могли поглинути людину, залишилися в пам'яті лише як спогад, але невідомий міський простір перед ним був настільки ж приголомшливим, що й раніше.\n\nНеприйнятним було, думав Клячківський про себе, те, що Вождь навіть не знайомий із найбільшою коштовністю в короні його величної нації. Тож Вождь вдягнув пальто й покликав охоронця. Найвеличнішому визволителю міста потрібна була екскурсія."
BOV_fraternal_coup.4.a: "І так Вождь почав відкривати своє серце. Жалюгідно."

BOV_fraternal_coup.5.t: "Дволикість обдурених"
BOV_fraternal_coup.5.d: "Клячківський повертався до штабу, він відчув зміну атмосфери. Завдяки виразам облич більшої за звичну кількості охоронців. У раптовій швидкості, з якою його водій пронісся крізь ворота.\n\nВиходячи з транспортного засобу, він гучно висловив вимогу пояснити, що сталося, і суворі обличчя солдатів дали місце Ленкавському, чий вигляд був ошелешеним, однак від нього він дістав свою відповідь. Стався напад, і, якби речі пішли трошки інакше, будівлю захопили б бунтівники, а не лояльні охоронці.\n\nПояснивши порядок подій під час штурму будівлі, Ленкавський опис раптову спробу захоплення. Він швидко пробігся по тій частині, що розказувала про відчайдушну оборону, тоді пояснив, як, зрештою, була досягнута перемога - і як були захоплені деякі з нападників, жалюгідні люди, що зараз туляться під дулом гвинтівки в кутку дворика. Під його жорстким допитом, вони зізналися, хто стояв за цим нападом - Стецько.\n\nНа цьому Клячківський беззвучно кивнув і розвернувся. Коли він пішов, кілька охоронців притягнули мотузку, з якої зробили петлю для імпровізованої шибениці з ліхтарного стовпа. Нещасні нападники, без сумніву, стануть першими з тих, кого так підвішають."
BOV_fraternal_coup.5.a: "І справді, це було близько."

BOV_fraternal_coup.6.t: "Тхір у пастці"
BOV_fraternal_coup.6.d: "Непримітний зовнішній вигляд невеликої будівлі, захованої на тихій бічній вулиці, не показував важливості подій, що відбувалися в ній.\n\nЗа заґратованими дверима знаходився малий столик, а за цим столиком сиділи троє, що втілювали свій план у життя. Клячківський має впасти, якщо вони хочуть забезпечити Україні майбутнє, вони всі це знали, і, хоч багато подій було запущено в дію, найважливіша - та, що призведе до справжньої смерті Клячківського - ще не виповнилася, і ті, кому вона була доручена, ще не повернулися з інформацією.\n\nМіж Стецьком, Ребетом і Лебедем почалися тихі суперечки, але вони швидко росли в запалі. Чи сталося? Чи зірвалося? Чи були ? Звісно ж ні, і Стецько працював над тим, аби запевнити в цьому інших. Їм просто треба бути терпеливіше, й зберігати впевненість.\n\nЦю впевненість скоро наче вітром здуло, коли почулися звуки під'їжджаючих вантажівок і різкі крики-накази як від передньої, так і задньої сторони будівлі. Через кілька миттєвостей двері впали всередину, і, після того, як солдати швидко арештували всіх трьох, відповідь була однозначно отримана.\n\nКоли його виводили (а він добре міг уявити свою долю після цього), Стецько докладав зусиль, ніби від цього залежало його життя, але так і не міг зрозуміти, що пішло не так. Хтось пробовкався? Переметнувся на інший бік тижні тому? Чи це був простий збіг, поворот направо, а не наліво?\n\nВін уявляв, що він ніколи не взнає."
BOV_fraternal_coup.6.a: "І він був правий."

BOV_fraternal_coup.7.t: "Глибока чистка"
BOV_fraternal_coup.7.d: "Після Стецькової спроби бунту чимало генералів УПА - особливо тих, що не були до кінця зв'язаними з Клячківським - викликали до штабу. Місця для непокори чи затримки не було, тільки не зараз, і вони всі це знали. Не тоді, коли за всіма ними стежили.\n\nНезважаючи на надзвичайні рівні безпеки, настрій у залі був до надзвичайного нервовим - ніхто не знав і не міг сказати з упевненістю, чи був хтось інший учасником замаху. Коли сам Клячківський увійшов і почав свою промову, настрій погіршав іще більше, причому блискавично.\n\nВін виступив проти зради Стецька й почав зачитувати імена тих, чия участь була «розкрита». Кожного носія імені сильні руки забирали із кімнати. Список продовжувався, і ті, що були більш політично обізнані серед очільників, зрозуміли, що, окрім зачистки Стецькових компаньйонів, Клячківський також прибирав кожного, відносно кого він мав підозри. Тепер у нього був політичний капітал, і він рішуче ним користувався.\n\nДеякі імена були очікуваними, але коли назвали Шухевича і його найближчих союзників, кімната поринула в тишу. На мить усі подумали, що кровопролиттю бути, однак зайшла охорона, і, сильно переважаючи числом, не лишила вибору; валідним було лише здатися. Коли він покинув кімнату під конвоєм, ті, що лишилися, добре зрозуміли погрозу. Подальшої непокори не терпітимуть - непокори в жодному вигляді."
BOV_fraternal_coup.7.a: "Іще одну загрозу прибрано."

BOV_fraternal_coup.8.t: "Тріумф Вождя"
BOV_fraternal_coup.8.d: "Хоча ранок не був надто холодним, ті, що були присутніми, змерзли до кісток. Майже за ніч, у результаті спроби перевороту Стецька, весь політичний порядок УПА був перевернутий із ніг на голову. Фракціоналізм, або, як мінімум, фракціоналізм проти Клячківського, сьогодні скінчиться. Адже скінчаться ті, хто його очолював. Попередньої ночі було зведено шибениці, достатньо міцні й готові тримати свій неминучий тягар на багато ночей уперед. Аби навести багато прикладів, що буває зі зрадниками.\n\nОхорона прибула першою, за ними - ті високопоставлені члени УПА, яких вважали «вірними» Шухевичу. Розташувавшись у ретельно спланованих квадратах - і під наглядом, вони помітили добре озброєних солдатів з пильними очима - вони чекали на прибуття інших груп. Один за одним вони прибували. Спочатку довірені особи Вождя й найбільш довірені його офіцери. Тоді - сам Вождь, який розташувався на видноті. А тоді, зрештою, засуджені, яким спеціально надали жалюгідного вигляду в одязі з мішковини.\n\nСама подія була швидкою. Було зачитано вирок, Стецька, Шухевича й багатьох інших було відведено на шибеницю, зашморги затягнули. Один-єдиний кивок від Клячківського - і на важіль натиснули, особи впали, і гострі звуки ламання кісток ехом сповнили площу.\n\nТіла лишили висіти навіть після того, як той натовп, що змусили прийти, пішов. Їх не зніматимуть ще багато тижнів."
BOV_fraternal_coup.8.a: "Абсолютний контроль."

BOV_fraternal_coup.9.t: "Ідеальне вбивство"
BOV_fraternal_coup.9.d: "Машина прорізалася вулицями міста, а Клячківський думав про роботу, що очікувала його в найближчому майбутньому.\n\nУПА - його УПА - не була в безпеці. Стецько, Шухевич і так багато інших боролися з ним за контроль, за вплив, за право вирішувати долю України. Він знав, що ситуація досягає свого піку, і що скоро йому доведеться вжити заходів. Він, звісно ж, планував ці заходи вже певний період часу. Координована чистка, завдяки якій-\n\nУ його голові прозвучав тривожний сигнал, коли його водій зробив раптовий - і неочікуваний - поворот у провулок. Вимагаючи пояснень, він їх не отримав, адже побачив куточком ока ствол кулемета, що висунувся з вікна високо вгорі. Вогонь, що послідував за цим усім, витер із його голови всі думки. Навіки.\n\nКоли все було скінчено, колишній Вождь лежав мертвий, нашпигований кулями. Скоро прибули місцеві, яких привабив шум. Хоч вони й були шоковані особою мертвої людини, ніхто не міг пояснити, що сталося, ані одне одному, ані солдатам, що швидко дісталися місця злочину.\n\nОдного з найвпливовіших людей в Україні було вбито - і не було жодного свідка. Це вже говорило чимало саме по собі."
BOV_fraternal_coup.9.a: "Безславний кінець."

BOV_fraternal_coup.10.t: "Притуплений удар"
BOV_fraternal_coup.10.d: "Старі двері урядової будівлі скрипнули, коли Стецько ввірвався всередину. Він міг лиш уявити, яка жахлива сцена постане перед ним і яка дасть його величному баченню шлях, утім, відсутність тіл і крові була поганим знаком. Розлючений тупіт чобіт оголосив прихід запаленого Ленкавського, що бурею пронісся прямо до Стецька.\n\n"Ярославе!" - крикнув Ленкавський. "Як зручно, що такий боягуз, як ти, абсолютно випадково з'являється тут після невдалого замаху на наші життя!" Запальна лють Ленкавського ехом пронеслася крізь зали, привернувши увагу вцілілих охоронців.\n\n"Я почув, що Вождя було вбито і прибув так швидко, як лиш зміг", - защебетав Стецько. "Нації потрібна стабільність, Степане, і мудра рука, що зможе вести її", - вштрикнув він. "Відколи стало злочином відповідати на заклик нації у час великої потреби?"\n\n"Ми дізнаємося, хто є злочинцями, що стоять за цим, коли ми закінчимо допитувати захоплених нападників", - відказав Ленкавський, відвертаючись. "Лиш одне покарання чекає на зрадників, Ярославе: смерть. Я не заспокоюся, поки правосуддя не забере життя в кожного перебіжчика. Навіть якщо це значитиме вбити тебе", - сказав Ленкавський перед тим, як покинути Стецька.\n\nСтецько втратив дар мови, не знаючи, чим вшпигнути у відповідь. Він покинув будівлю, повернувся в свою машину. Його солдати не просто допустили помилку - вони примудрилися перепоганити всю операцію. Ленкавський уцілів - і він не заспокоїться, поки не збере данину кров'ю як відплату."
BOV_fraternal_coup.10.a: "Україна - ніщо інше, як шматок м'яса для псів пекла."

BOV_fraternal_coup.11.t: "Повстання каструмів"
BOV_fraternal_coup.11.d: "Презирство. Жодне інше слово не могло краще підсумувати почуття Шухевича до некомпетентних. До людей, надто безхребетних і підступних, нездатних навіть навчитися дисципліні й героїзму від своїх командувачів. Таким є природній шлях цього світу, а втім кожен подих, що робив Стецько своїми астматичними легенями, заперечував цей принцип. Чи не судилося природою, що Стецько зазнає поразки через власну бездуховну боязкість? Невдала атака на поплічників Клячківського не залишила Шухевичу жодної можливості втрутитися, тож він лишився поза справами, а Ленкавський тим часом виголошував його провину.\n\nСидіти, склавши руки, очікуючи смерті - не краще, ніж пустити собі кулю в черепну коробку, міркував Шухевич. Затухаючі вуглинки його каміна поглинали останню свою трапезу - шматки Ребетового листа. Шухевич довго дивився на фотографію в рамці, на якій був він, його дружина та діти, на каміні. Така річ була розкішшю за часів повстання, утім, щедрість фотографа зробила безсмертними швидкоплинні посмішки родини, що знала лиш боротьбу. Вічна війна вже вкрала багатьох батьків у дітей, він не міг і не дозволить їй забрати і його теж.\n\nВідхід на захід до криївок у Галичині був справою серйозною. П'ятнадцять років боротьби за виживання давно загартували людей Шухевича; іще один рік стане лиш зарубкою на поясі трагічних печалей. Заради родини, заради кращого майбутнього, заради України, вони повинні жити."
BOV_fraternal_coup.11.a: "Навіть праведники - маріонетки егоїстів."

BOV_fraternal_coup.12.t: "Загнаний у кут негідник"
BOV_fraternal_coup.12.d: "За вікном неслася земля. Золоті поля зерна і соняшників виблискували на сонці. Однак люди в автівці не переймалися краєвидами. Вони нервово перемовлялися між собою, а водій зосереджено дивився на дорогу і лише на неї.\n\n"Цей маневр був безглуздим. Слід було знати, що воно провалиться".\n\nЛітній чоловік в окулярах сердито бурчав собі під ніс. Ніхто не звертав на нього уваги, адже це був не перший раз, коли він казав щось подібне. Ярослав Стецько був у всіх відношеннях розбитим, відколи вони поспіхом покинули Київ. Він віддалився від сім'ї та друзів, занурився лише в свої книги, шукаючи для самого себе, що пішло не так.\n\n"Усе було марно, усе було даремно. Що нам слід робити, коли ми поїдемо? Німці ніколи не пробачать мене..."\nДумки закружляли в Стецьковій голові. Однак уперше з тих пір, як він заліз у цей напханий тісний автомобіль, у нього з'явилася ідея. Німці, так, німці; вони, звісно ж, повішають його... Але чи дійсно це буде так? Він був бунтівником проти божевільного зрадника Клячківського, він був здоровим управлінцем. Запоріжжя може стати їхнім спасінням! Легіони лоялістів, які відчайдушно прагнуть помилування і стабільності, функціонуючий ринок зерна, лояльні розумні українці? Чого ще вони можуть бажати?\n\n"Звісно ж!" - він голосно закричав, мало не збивши водія з дороги. "Чоловіки, ми розгорнемо табір у місті і покінчимо з цим ідіотизмом. Ми сформуємо новий уряд!". Усі в автівці все ще були певною мірою приголомшені тим, що мало не зустрілися зі своїм творцем, тож вони підіграли цій пропозиції. Хоча вони й не хотіли згорнутися калачиком і померти, доїхавши до місця призначення, формування цивільної адміністрації, безумовно, не входило до переліку їхніх планів. "Так, так, мені слід сконтактувати їх усіх", - Стецько нетерпляче продовжував, занотовуючи свої думки у відкритій книзі."
BOV_fraternal_coup.12.a: "Найбільший подарунок, про який тільки могла просити Німеччина..."

BOV_fraternal_coup.13.t: "Вальс пандемоніуму"
BOV_fraternal_coup.13.d: "Коли Ленкавський пережив спробу перевороту, було невідворотним, що нова чистка буде вчинена, але, на відміну від попередніх чисток, не було вірної чи заляканої армії, що виконала б накази. До того ж, від попередніх чисток відрізнялося ще й те, що Ленкавський обрав своїми цілями найпотужніших лідерів, закликаючи притягнути до суду Стецька й Шухевича. Зрештою, зовсім недивно, що, на відміну від попередніх чисток, хтось посмів відбиватися.\n\nВогні бунтів швидко поширилися на більшість України. Шухевич забрав більшість організованої армії з собою на захід, а відсутність Стецькових бюрократів залишила Ленкавського з державною порожнечею функціональності, оскільки будують конкуруючий уряд на півдні. Усі шанси були проти справжніх послідовників Бандерової волі, утім, всі вони однаково проливатимуть кров за майбутнє України.\n\nУкраїнська громадянська війна не скінчилася перемогою Клячківського, вона лиш зробила невеличку паузу. Українська повстанська армія, чиї зогнилі підвалини пережили безжальні покарання, досягнула своїх меж - три амбітних чоловіки згуртували своїх прихильників на нову війну. Бандера може лиш дивитися з небес, поки люди, яких він звав братами, руйнують усе, за що він боровся."
BOV_fraternal_coup.13.a: "Слава Україні..."

BOV_fraternal_coup.14.t: "Двобій долі"
BOV_fraternal_coup.14.d: "Клацання Стецькового взуття прорізало тишу урядової будівлі. Сліди від куль вишикувалися на стінах у поєднанні зі свіжими плямами крові в кожному значному приміщенні. Це була бездоганна чистка, такий ідеально оркестрований хаос, що крізь сталеве обличчя чоловіка пробилася легка посмішка. Мирон і Ленкавський, дві найбільші перепони його амбіціям, перетворилися на трупи, однак Стецько справді зробив їм послугу. Зрештою, їхні ідеї житимуть, а не вмруть разом із шаленим хрестовим походом параноїдального Вождя. Було незбагненно, чому такі розумні чоловіки, як вони, не змогли усвідомити таку просту істину. Жорсткий грюкіт дверима перервали Стецькові думки - Шухевич увійшов і став навпроти нього в супроводі своїх охоронців.\n\nПохмурий генерал і нахабний бюрократ одразу ж встановили зоровий контакт, а їхні незворушні обличчя були непорушними. Моторошну тишу порушувало час від часу потріскування пострілів вдалині, які з кожною секундою ставали все ближчими. Це не було частиною плану. Роман не повинен бути тут. Пронизливий погляд Шухевича змусив Стецька відчути себе вразливим, і саме тоді все стало зрозумілим. Шухевич знав усе!\n\nСтецько роздумував про варіанти. Навіть якщо Шухевич погодився з планом, цей упертий віслюк, швидше за все, лишився б непереконаним, незалежно від того, наскільки правильними були його ідеї. Сіпання трупа неподалік впало Стецькові у вічі. Рішення його проблем було очевидним. Відсутній шматочок пазлу стояв прямо перед ним. Йому не вистачало цапа-відбувайла."
BOV_fraternal_coup.14.a: "Долі зіштовхуються, а брати гинуть."

BOV_fraternal_coup.15.t: "Зраду викрито"
BOV_fraternal_coup.15.d: "Стецько помчався в бік коридори, а Шухевичеві охоронці побігли за ним. Сам генерал лише риссю йшов поруч, немовби терплячий мисливець, упевнений у тому, що впіймав свою здобич. Його люди вже почали затримувати Стецькових убивць; тхорові не було куди тікати. Зрадник помре, і, вперше за довгий час, Шухевич радітиме цьому.\n\nСтецько не втік далеко - на нього накинувся охоронець і повалив на землю. Кілька його найманих убивць побігли йому на допомогу, але були розстріляні рештою охоронців Шухевича при вході. Стецька протягнули по підлозі, він хрипів від фізичного навантаження. Побитий ідеолог подивився на Шухевича, його розбиті окуляри впали на його закривавлений ніс.\n\n"Що це все означає, Романе?" - зітхнув Стецько.\n\n"Це я маю питати це в тебе. Ти зрадив ус-"\n\n"Не роби вигляд, ніби ти теж не планував позбавитися Дмитра!" - глузливо пирхнув Стецько. "Моралізаторство - не твоя міцна риса, Романе; ми завжди робили те, що було б найкращим для України" - вщухла Стецькова агітація. "Наші інтереси однозначно співставні, Романе, тож чом би нам не працювати разом?" Шухевич зробив паузу, вдаючи роздуми.\n\n"Покарання за зраду - смерть", - холодно промовив Шухевич, після чого дістав із кобури свого пістоля і вистрілив прямо Стецькові в черепну коробку. Тіло слабкої людини знесилено впало, а мозкова речовина вилилася на плитку. Шухевич не окинув його поглядом удруге, покидаючи кімнату. Була робота, яку треба було зробити."
BOV_fraternal_coup.15.a: "Новий міцний діяч виходить на політичну сцену."

BOV_fraternal_coup.16.t: "Записи про виконання вироку"
BOV_fraternal_coup.16.d: "Шухевич думав, наскільки іронічним є те, що його першими діями на посаді Вождя буде страта його ворогів, однак позбавитися ворогів нації - обов'язок кожного патріота, навіть якщо вони теж українці. Те, що дружина Стецька, Слава, публікувала інакомислення під псевдонімами, було добре схованим секретом, але після того, як маска впала, їй доведеться обдумувати свої дії до кінця життя у в'язниці. Шухевичу все ж не було чужим милосердя, і, хоча гострий язик Слави підточував його справу, вона виконувала свою роль відповідальної дружини і отримає за це поблажку.\n\nШухевич не міг поширити своє милосердя і на дурнів, що пішли за Стецьковим планом. Хоч генерали й не були безпосередними учасниками, їхня недалекоглядна вірність зробила їх значною мірою також відповідальними. Відставка з медалями віддалить їх від влади, при цьому буде збережено їхню честь і гідність.\n\nЩо ж до Стецькових найближчих союзників: П'ясецького, Лебедя, Ребета - усі вони повинні загинути. П'ясецький був інструментом, який дозволив своєму невдоволенню перерости в зарозумілі амбіції, не маючи змоги забезпечувати справу, що вимагає жертв. Лебедь, великий оркестрант чисток, щезнув, і багатьох лиш заспокоїть його смерть, якщо його знайдуть. Ребет же змусив старого генерала спинитися на хвильку - він був ключовим викривачем Стецькової зради, однак він був і ключовим змовником теж. Ребет - гарна людина із гарними намірами, однак зрадник є зрадник. Ребет повинен померти разом із рештою.\n\nШухевич підписав дозволи на виконання смертного вироку невпевненою рукою. Коли Клячківський провів чистку й позбавився Федуна, вони втратили набагато більше, ніж отримали. Він міг лише сподіватися, що ця чистка стане останньою; інакше він перетвориться на те, що зневажав"
BOV_fraternal_coup.16.a: "Усі Вожді роблять так, як вимагає доля."

BOV_fraternal_coup.17.t: "Незручності стерто"
BOV_fraternal_coup.17.d: "Ребетовий лист було знищено вогнем за мить, однак сумніви не полишали Шухевича. Десятиліттями він служив Україні бездоганно, однак, незважаючи на це, він відчував незадоволення. Колюче Стецькове звинувачення було би правдивим, якби цей тхір не почав діяти першим. Якби він не відчував себе винним у цьому, то єдиним доказом його можливої змови були б не попіл і згарище. Було б безглуздим обманом стверджувати, що він не мав власних амбіцій, адже тепер він Вождь, і це титул, який вимагає від людини-власника сили й ефективності. Що б зробив Коновалець?\n\nЦе питання прив'язалося до Шухевича. Уперше він зустрів найпершого Вождя підлітком, коли він винаймав кімнату в готелі їхньої родини. Розповіді Коновальця про війну й боротьбу за українську свободу надихнули його на боротьбу, і він заробив Україні свободу, однак якою ціною? Він воював із братами-українцями стільки ж, скільки й із німецькими пригноблювачами. Чи був Бандера правий у своєму жорстокому відділенні від Мельника? Чи можна було уникнути всього цього кровопролиття? Вони точно відійшли від волі Коновальця. Його наставник не просто так натиснув на курок, а вони нерозумно дозволили гнилі, що приніс Мельник, розквітнути через власний недалекоглядний фанатизм. Чи були вони всі дурнями, бо не розуміли щось настільки очевидне?\n\nШухевич тепер був Вождем, і мав на руках ще слабшу й менш об'єднану Україну, ніж за часів Коновальця. Буде недостатньо повторити дії його мудрого наставника; йому треба буде стати кращим, сильнішим, розумнішим. Україна повинна бути чимось більшим, ніж дрібні політичні чвари, адже інакше їй не вижити, якщо її могутній дух не об'єднаний. Слава України повинна бути вічною; Вождь повинен забезпечити це."
BOV_fraternal_coup.17.a: "Ходіть у світлі Коновальця, не в Бандеровій тіні."

BOV_fraternal_coup.18.t: "An Intuitive Contingency"
BOV_fraternal_coup.18.d: "The radio address was unscheduled, sudden, and surely to be critical. The engineers at the radio station understood this implicitly, on account of the soldiers watching them very closely. With safeties off.\n\nIn the booth, Yaroslav Stetsko withdrew the prepared speech from his jacket pocket, adjusted his position, and began to speak. A momentary delay was encountered when the sounds of the soldiers, encountering other radio engineers less favorable to oversight and opening fire immediately, overwhelmed the microphone. But as the gunfire died down, Stetsko's voice increased in intensity.\n\nHis message was simple, yet unmistakable. Shukhevych, and those loyal to him, had betrayed Ukraine: they had collaborated with invaders, subversives, and degenerates all, with the end goal being the dismemberment of the state for personal enrichment. He provided a long list of 'evidence' to support this, trusting that quantity would overwhelm quantity, and promised harsh punishment.\n\nJustice would be dispensed, Stetsko proclaimed, in good time. Shukhevych would not escape, nor would anyone affiliated with him, assisting him, or enabling him in any fashion. And once they were punished for their actions? Well, then, Ukraine would be truly protected from subversion.\n\nAnother gunshot rang out from somewhere in the station. Stetsko ended the address."
BOV_fraternal_coup.18.a: "Legitimate action, indeed."

BOV_fraternal_coup.19.t: "Tainted Lineage"
BOV_fraternal_coup.19.d: "As the blindfold was removed. Roman Shukhevych noticed that the wall in front of him was cleanly repaired, with traces of recently patched concrete over what had surely been bullet holes. At least his executioners recognized the importance of the man they were about to shoot.\n\nOr, rather, man. Shukhevych was not afraid to die. He had faced death many times before, from many different people, organizations, and countries, in his quest to bring his vision of Ukraine about, and he was ready to embrace it. But as he was tied to the post, looking across to where the firing squad would stand, he could see his son being led across the square, blindfolded as he had been, and his heart sank.\n\nThey had tried to escape together, doing so himself only to make sure that his son would live, but had failed. Those who had stolen the country had been just as efficient as Shukhevych knew he himself would have been in tracking down their enemies, and once captured they had quickly been bundled here.\n\nAs his son was similarly tied to the post they exchanged their final words. Shukhevych told his son how proud he was of him, and apologized for his failure. His son said the same, and the bravery with which he was facing the same fate inspired intense pride in those last moments.\n\nThe order was shouted. The end came. The bodies would remain there for some time."
BOV_fraternal_coup.19.a: "Presumption of salvation is a fatal sin."

BOV_fraternal_coup.20.t: "Malignancy Brews"
BOV_fraternal_coup.20.d: "It was a new morning, and as Yaroslav Stetsko accepted the coffee that Slava, his wife, handed to him he looked down at the table. At the map of the country that he was on the cusp of bringing to greatness.\n\nSlava had been his confidant and verbal sparring partner for many years, and they had shared many conversations about how to return Ukraine to the greatness it had once held. About what they would do once he had secured the necessary power. Which was now the case.\n\nThey shared their coffee as they went through the first ones to implement. Social? Economic? Military? There were positives and negatives to each one, and they went through them one by one, until finally settling on the one that would be most beneficial, politically, while also advancing the national goals in some small fashion. It was perfect.\n\nA sudden tremble ran through Stetsko's hands, causing him to drop his cup on the map, staining it deep brown. Slava quickly rolled it up, throwing it in the trash. It was unimportant, they both concluded. They could get another one."
BOV_fraternal_coup.20.a: "Unimportant, clearly."

BOV_klyachkivsky_Victory_tt: "Три голови стали одною, і Україна об'єднана хвилею духу реваншизму. §VНай здійсниться провосуддя, і най хоч небо впаде.§!"
BOV_shukhevych_Victory_tt: "Три голови стали одною, однак завдання з об'єднання України лишається, і воно може виявитися §qзавданням неможливим§!."
BOV_Stetsko_Victory_tt: "Три голови стали одною, і Україна тепер повинна відбалансувати ідеали §qукраїнської Революції й колаборантства.§!"

### Klyachkivsky Events

BOV_Klyachkivsky_buildup.1.t: "Apres Moi?"
BOV_Klyachkivsky_buildup.1.d: ""That thing slithered in my presence, I introduced that thing to my wife and children, I trusted that thing!"\n\nDmytro Klyachkivksy bellowed. Glass littered the floor of the General's sumptuous Kiew residence. Tapestries lay in tatters on the floor, the rest had been carefully and secretly removed by the staff. Klyachkivsky's rage had reached a point where it had no end. It was like a stormy sea, it never ceased its waves, they merely changed length and width.\n\n"Stetsko was manipulated. He had to have been. Kind Stetsko, good Stetsko, loyal Stetsko..." Klyachkivsky babbled. "I always knew Shukhevych was good for nothing. He was a wasteful idiot with Bandera and a stupid liberal to beat! He was probably in bed with the Yankees the whole time...Yes! The Americans, the Jews all of them...Russians..."\n\nKlyachkivsky's servants eyed each other nervously from behind walls or in hidden covens. Klyachkivsky had developed a delightful new habit of appearing at random points to scream at and berate lone servants. "Where is Stetsko's bitch wife? That cur, that manipulating cur she was always in bed, oh literally, definitely, literally in bed with Shukhevych..." Klyachkivsky wandered to the bathroom, before storming out again with a crash.\n\n"Gentlemen summon a car, I wish to appraise what's left of my government!"\n\nThe entire staff of servants rushed to the street, panicking while beseeching the driver to begin preparations."
BOV_Klyachkivsky_buildup.1.a: "A cornered animal."

BOV_Klyachkivsky_buildup.2.t: "Normalcy crumbling"
BOV_Klyachkivsky_buildup.2.d: " Neat lines were what Klyachkivsky liked. Years of thick and uncut forest and disordered camps had taught him the virtue of that. The men comprising the police of Kyiv were idiots. Shukhevych appointees the lot of them, they had been sent southwards, some further than the land itself. These new policemen were different, they may have been on the opposite side of the bars in certain cases, but they were loyal, at least, that's what the recruiter said.\n\nHe had lied, everyone lied to Klyachkivsky, and he knew it.\n\nThe hall was cold, and the heating system had died, few knew how to fix old Soviet contraptions, and even those who did were unlikely to even come close to the buildings of the volatile government. No windows let in any of the tepid warmth of sunlight, let alone its glow. All that illuminated the police conscript was a single flickering lantern just above their heads.\n\nFootsteps, many of them. The recruits, the smart ones at least, tensed up. This was their moment.\n\nKlyachkivsky was far less imposing in person than the myriad propaganda posters of the regime made him out to be. He was a sad figure in person, his skin drawn taught over his features, his brow bore a now permanent furrow, and his moth seemed sucked into a forever scowl. He silently appraised each and every new policeman, stopping before none, yet making each feel as though he had stared into their very souls. Finally, he stopped, briskly walking back to the entrance, guards following closely behind. The door slammed, and most of the men flinched."
BOV_Klyachkivsky_buildup.2.a: ""The first two are passable. Liquidate the rest.""

BOV_Klyachkivsky_buildup.3.t: "Four-to-One"
BOV_Klyachkivsky_buildup.3.d: "As the man in front of the group cowered in fear on his knees, all the others - bureaucrats newly and rapidly hired to fill the state ranks - knew that there was going to be a great price to be paid indeed.\n\nFor the Vozhd was here. And he was very unhappy.\n\nThe reports had not been correct. The numbers had not added up. And the man on his knees was the cause of it all. He had been embezzling funds, stealing from the scant revenues that had been tortuously collected and which were vital for the operation of the state as a whole, and the Vozhd had clearly decided that it was an issue he would personally attend to.\n\nThey all listened to the man who they had worked beside beg for his life, pleading at how there had been no choice, that his children were starving, and that he had to find funds for them. They all knew he spoke the truth, many of them being in a similar situation and hoping that their own thefts had not been similarly discovered.\n\nThe Vozhd listened carefully. At the end of it all those watching saw him make a single nod as he pulled the man to his feet. He would be merciful. He understood their plight. And so the man would not be executed. But he would pay for his theft, at a ratio of four-to-one. In fingers. The man's relief turned to terror as the bodyguards rushed forward. As the hammer came out. As the sound of crunching bone echoed through the office.\n\nAt the end, the man whimpered as his co-workers did their best to ignore him, thankful that they had not been in his position. He would continue to do so for many days to come."
BOV_Klyachkivsky_buildup.3.a: "Better, at least, than death."

BOV_Klyachkivsky_buildup.4.t: "They Multiply, Always"
BOV_Klyachkivsky_buildup.4.d: "Klyachivsky could feel his rage building as he looked at the reports neatly stacked upon his desk. Each and every one detailed the attacks of another enemy of the state, of the people, of him. Attacks aimed at the nascent state he had managed to carve out.\n\nHe would not have it.\n\nHe had not worked, fought, and suffered for years at the hands of the Germans and their despised collaborators, not triumphed over them to such a degree, to suffer the slings and arrows of such filth. Melnykites. Judeo-Bolsheviks. Bandits. All of them scum. All of them enemies. All of them refusing to follow his lead, his vision.\n\nAnd they multiplied. Every day there seemed to be more of them, and the reports of their activities only grew longer. They rampaged across the countryside, striking garrisons, villages, patrols, and anything else that they could find. They attacked his soldiers, the citizenry, and even each other. Slavering beasts, all. But he had encountered such beasts before, and had bested them. Had killed them. To a one.\n\nSoon that would be the fate of all those mentioned in the reports as well. He knew it would be so. He promised himself that it would be so. He trusted in the inevitability of his victory.\n\nAfter all, he had been right about it thus far."
BOV_Klyachkivsky_buildup.4.a: "Dedication to control."

BOV_Klyachkivsky_buildup.5.t: "Poisoned Gifts"
BOV_Klyachkivsky_buildup.5.d: "As he had promised her on their first meeting, the UPA soldier returned to the girl's village - with even more candy. The other children rushed to collect it, both for enjoyment and because any food of was immense value, but the girl stayed away.\n\nShe remembered her father's anger the last time the soldier had come. The last time she had taken the offered candy. What he had told her about their family and the UPA, and though she couldn't describe it in complex fashion and wouldn't have known the word, she knew there was an ulterior motive to his actions. So she stayed away, and avoided him.\n\nHer friends did not. They did not understand as she now did, and would not listen when she told them to avoid him as well. They called her scared. They stopped talking to her. They told others to do the same. It hurt terribly, but every time she was tempted to give in, she thought of her father's face the last time he had spoken about it.\n\nSo she endured. When she returned home in tears, she found her father waiting. He was proud of her, he said, and the other children would soon learn their mistake. And then he hugged her. It was enough, for now at least."
BOV_Klyachkivsky_buildup.5.a: "Always a motive."

BOV_Klyachkivsky_buildup.6.t: "New Ukraine, No Old Memories"
BOV_Klyachkivsky_buildup.6.d: ""This man met with Bukharin regularly. He served Lenin when he ordered his massacres, and he ran like a coward when the Germans occupied our motherland. His allies have invented tales and legends which have poisoned the minds of our youth, fairytales of resistance against the Hitlerites. It is a great falsity, a culmination which shall henceforth be corrected."\n\nOleksander Shumskyi had seen many show trials, in fact, he had participated in them so often that he knew them like actors knew plays. First, there were the accusations, then the "witnesses", always vague with their injuries yet bizarrely precise in naming the accused as their injurer. They were followed by the defense, always weak, always neglecting exonerating evidence. Finally, there was the conviction, the cell, or the gallows.\n\n"Does the accused challenge any of the charges?"\n\n"No."\n\n"Oleksander Shumskyi, you are pronounced guilty on all charges. May god have mercy upon your soul."\n\nShumskyi was rarely ever surprised, but the rapidity of the trial, and his arrival at the gallows nearly shocked him. His legs wavered slightly, nearly giving out. But he steadied himself. the cameras were watching, it best not to give them the show they wanted. He stared out at the assembled crowd. He pitied them. At least he would leave this nightmare. They would remain in it for their entire lives. He began to yell.\n\n"Long live Lenin and his Party! Long live the immortal science of Marxism-Lenini-""
BOV_Klyachkivsky_buildup.6.a: "A crack silenced the last hope of Ukrainian communism."

BOV_Klyachkivsky_buildup.7.t: "Feelings If Left Unchecked..."
BOV_Klyachkivsky_buildup.7.d: "Volodymyr walked silently down the cobbled streets, his gait bearing much more swagger. He had bought a hat, a hat! What a luxury! If only his mother could see that hat, how many hours of sweat and tears and even a few drops of blood went into procuring it. Even a few years ago, that hat would have been impossible, the Poles wouldn't make them, even though they knew how. No, the dark factory sucked them up and spat them out pale and tired. Few pale and tired men made hats such as these. Only after the German barbarians were shown the door could the Poles return to their purpose and glorious profession of hattery.\n\nVolodymyr whistled a happy tune, what counted for the business district of the village had seen new life, not just for hatters, but butchers; who hawked new and exotic meats (by god they had beef!), Farmers; now sold more than just moldy carrots and stale bread, even a doctor offered his services!\n\nFurther along the menagerie came the Poles. For many centuries they had grown used to running the town, they bragged about how most statues in the public squares were Poles, how the churches, even the Orthodox, they alleged, were built by Poles, some confidently stated that Hitler himself was secretly a Pole. Yet, that very man had cut them down to size, even his departure had left them in a bind. The Polish wealthy had fled as Ukrainian boots tramped through the village, the Polish poor hid and the Polish middle attempted to live as normal. They quickly joined the poor at the thunder of leaflets and posters.\n\nVolodymyr looked at these sorry men, these animals who hawked junk and fungi. He humored them and paid a valued coin for a piece of burlap. He could not help but have his hand migrate to his ever-precious headgear to defend it from the sticky hands of these desperate people. Finally, Volodymyr stopped.\n\n"A mark for that! You rascal, you...you...Jew!"\n\nVolodymyr scarcely let out the words before regretting it. The Poles stared at him, angrily, impotently, sadly. He paid and quickly left, his new hat weighing heavily in his hand."
BOV_Klyachkivsky_buildup.7.a: "Hate begets hate."

BOV_Klyachkivsky_buildup.8.t: "The Harrowing of Galicia"
BOV_Klyachkivsky_buildup.8.d: ""Sir, the reports from Galicia have arrived."\n\nDmytro Klyachkivsky's newest aide laid a vanilla folder neatly at the edge of his desk, before gingerly backing away. Klyachkivsky continued his writing, before suddenly snatching the documents away. His face was obscured by the rather large folder, yet the anger was obvious as he nearly ripped the corner off of every page he turned. Finally, he set the folder down gently.\n\n"Get me the generals, tell them it's about the situation in Galicia. I want you to take minutes."\n\nFew men openly disobeyed the Vozhd, and his generals weren't among them. Klyachkivsky sat silently at his desk in front of his top brass, emotionless, his pale eyes staring at each one. "This..." he said softly, pushing the folder to the middle of the desk. "...is unacceptable." The generals stole glances at one another, but not one spoke.\n\n"Galicia is the embryo of our movement. It is the hotbed of Ukrainian National thought and it is the seedbed for our dear departed Stepan Bandera." Every man was silent for a moment to honor that dead demigod. "Yet now, it is a battleground, one which we seem to be losing." Klyachkivsky's tone broke into a growl for a moment. "I want every Pole in that land buried in it or out of it. We all do, yet it seems you have been soft-hearted. Kill the bombers' families, burn their farms, kill any who shelter them, and liquidate on sight. How hard is that!" Kliachesky slammed his fist on the desk, making the generals flinch.\n\n"Sir, we can't expect the Poles not to do likewise, any more of that and they'll start targeting the civilians..." One general stuttered. He quickly realized his mistake.\n\n"Perhaps they should! Perhaps it is time the Ukranian people learn the nature of racial conflict and learn a Ukranian state can not exist unless it is populated only by Ukranians! No half measures, break open the caches! Give farmboys rifles and tell them to shoot Poles like fowl if you have to!" Klyachkivsky ranted and raved. The generals emerged, with one solution duly hammered into each of their heads."
BOV_Klyachkivsky_buildup.8.a: "No more half-measures."

BOV_Klyachkivsky_buildup.9.t: "A Reward for Rats"
BOV_Klyachkivsky_buildup.9.d: "The young Melnykite trembled, his eyes wide with terror as the towering interrogator loomed over him. The captor's sinister grin sent shivers down his spine as he sat, immobilized and bound to a rickety wooden chair. Sweat poured from his brow, betraying the overwhelming fear that gripped him.\n\n"You will talk," the interrogator said menacingly, his hand closing around the prisoner's throat. "Perhaps you might just be spared if you do so quickly."\n\nDesperation took hold, and the captive Melnykite began to shout out the names and locations of his fellow OUN-M members. He hoped against hope that his cooperation would be enough to save him.\n\nThe interrogator laughed, a cold, heartless sound that reverberated throughout the room. "You Melnykites have grown weak. It's no wonder, given how you let Germany trample us for two decades without resistance. Now, it's our turn to trample you. A true Ukrainian would never betray his comrades; he'd die a thousand times over for his country! You, traitors, squandered your chance at redemption a long ago, and we won't be as forgiving as the Germans."\n\nThe prisoner's heart sank as the interrogator's laughter filled the room, echoing in his ears. He had only moments to realize the futility of his cooperation before the gun was cocked, and his vision faded to black."
BOV_Klyachkivsky_buildup.9.a: "Rewarded as a traitor deserves."

BOV_Klyachkivsky_buildup.10.t: "Here's to the Memories"
BOV_Klyachkivsky_buildup.10.d: "The intermittent sounds of gunfire were only broken up by the noises of soldiers moving outside the door, as Klyachkivsky's men continued their attempts to break in. Sushko knew that sooner or later, they would, and this hunt would come to an end.\n\n"It's funny, isn't it?" Stsiborskyi mused tiredly as he leaned against the wall. "After everything, this is how Yevhen's cause dies." He gave a hollow chuckle. "What a sad end."\n\nSushko could only nod silently. Neither of them had seen entirely eye-to-eye, but they had understood each other. As far as people to die with, he hadn't expected it would be Stsiborskyi, but he supposed there were worse men. How few of those were left now, thanks to Klyachkivsky.\n\n"And to think, only a few decades ago, we were so close," Sushko murmured, almost to himself. "We were united. Successful. There was a purpose. Before..." he exhaled, shaking his head. "No one but Konovalets could have done it. Once he was gone..."\n\n"It all came crashing down. Aye, those were the days," Stsiborskyi agreed. "Good times, good memories." There was shouting outside. It seemed they'd found the entrance. Stsiborskyi sat down, looking at the door. "I think we've still got a little time. Let's reminisce a little before it ends."\n\nAs the rest of Klyachkivsky's men continued working, both men spent the time reflecting on their lives, their cause, and the times where things had not been so bleak. There were few smiles or laughs, but they had grown numb to their fate, even as they mourned what had become of the cause.\n\nBattering rams smashed the door down, and both men barely were able to react before the barrels of rifles poked in, and fired in an unceremonious barrage."
BOV_Klyachkivsky_buildup.10.a: "Both men were cut down before they could even stand."

BOV_Klyachkivsky_buildup.11.t: "Under Bandera's Smile"
BOV_Klyachkivsky_buildup.11.d: "Klyachkivsky's icy smile was fixed on his face as he stood before the soldiers of Ukraine. As the sun beat down on them, he savored the moment. It was today where his legacy would be cemented, and history would revere him as the man who had saved Ukraine. Because of him, Ukraine would be whole. Because of him, the humiliation of Galicia would be avenged. Because of him, Bandera's vision would be fulfilled.\n\n"Soldiers, friends," he began, his demeanor calm, his voice stern. "Today, we correct an injustice that has been inflicted on the Ukrainian people. Today we reunite with our people who have been oppressed and persecuted by their Polish butchers." His voice turned colder, as raw disdain warped the words. "The Poles believed they could rule our people, and hold our land with impunity."\n\nHe allowed a pause, his eyes unblinking as each word was carefully enunciated. "This delusion ends today. Galicia is Ukrainian, one and indivisible."\n\nThere was a loud roar of approval from the soldiers. It was the call of men whose blood was hot, raging, and screaming for battle. Klyachkivsky made a gesture, and the noise instantly died. "Galicia is more than our land. It is where the birthplace of our movement began, and the home of Bandera himself."\n\nHe indicated behind him, in the general direction of Galicia. "Today we fight for more than just Ukraine, but to liberate the home of one of Ukraine's greatest men. Once our victory is achieved, there will be none who will deny that Ukraine belongs to none but the Ukrainians!"\n\nKlyachkivsky allowed a moment for the cheers of the soldier to endure; to allow them to bask in the moment before the fighting began. The cold smile on his face grew just a bit wider. Yes, he was certain they were going to succeed."
BOV_Klyachkivsky_buildup.11.a: ""Now march, and know that Bandera smiles down on us from above!""

BOV_Klyachkivsky_buildup.12.t: "Waste Not, Want Not"
BOV_Klyachkivsky_buildup.12.d: "The battle that morning for the small Polish-inhabited town had been quick. Victorious. Quite out of the ordinary for the Galician campaign in general, of course, but a welcome change nonetheless. The officer in charge of the force was eager to move on, move forward.\n\nBut there was one task that had to be taken care of first. And an important resource consideration besides.\n\nStepping out of his command car, he conferred with the other officers as he looked over at the town square, where hundreds of Polish civilians, the town inhabitants, stood. Quiet and huddled together, he noticed how few young men there were among them. That was good, he thought, for what was to come.\n\nThere was no provision, he explained to the officers, for saboteurs in the rear. The Vozhd had made the perfidy of the Poles very clear and they could not leave them to cause mischief, as their men clearly already had that morning. At the same time, however, supplies were scarce. The morning clash had used far more ammunition than expected, and what remained needed to be conserved for the next fight.\n\nHe departed soon after, instructing them to form up their units after they were done. The officers looked at his departing figure, and then at each other. A slight nod passed between them as they split up and prepared to give their orders."
BOV_Klyachkivsky_buildup.12.a: "Fix bayonets."

BOV_Klyachkivsky_buildup.13.t: "Echoes of Invasion"
BOV_Klyachkivsky_buildup.13.d: "The once-vibrant streets of Lviv were now consumed by chaos, flames and fear. As the Ukrainian army advanced through the city, the Polish population found themselves at the mercy of the invaders, a mercy that was not granted. Homes were ransacked, monuments destroyed, and lives uprooted. The scenes were nearly identical to those two decades earlier however, this time, there was even less to lose.\n\nAmidst the turmoil, a young Polish woman named Marta huddled in the corner of her family's home, tightly clutching her younger brother, Piotr, to her chest. The sounds of gunfire and screams filled the air, and Marta prayed they would be spared from the violence outside their door.\n\nThe soldiers, driven by Klyachkivsky's vision, were relentless in their pursuit of death. They moved from house to house, leaving a trail of destruction in their wake. The terror that had gripped the city was no accident but rather a calculated act of aggression designed to instill fear and submission, a warning of things of even worse things to come.\n\nWith the cloak of night, Marta and Piotr ventured out of their hiding place as they heard both flame and soldiers come ever closer. Desperate to find safety, The siblings navigated through the devastated streets, the sights and sounds of the brutal invasion haunting them at every turn. They knew that the home they had once known was gone, their few years of freedom being taken once again.They gazed from the hillside that overlooked their former home. Years of memories disappeared in an hour. They had little time to stare as the Ukrainian advance continued."
BOV_Klyachkivsky_buildup.13.a: "They had only one way to go as they continued west, perhaps never seeing their home again."

BOV_Klyachkivsky_buildup.14.t: "Till Death Do Us Part"
BOV_Klyachkivsky_buildup.14.d: "They could hear the sounds of gunfire and screams encroaching closer to their home, as the Ukrainians advanced further into the town. The small family hiding in their home knew that what was coming was inevitable, and that they didn't have much time left.\n\nRuslana was sickened with worry, thinking desperately of something, anything she could do. "You need to hide," her husband said quietly, sitting near the window. "Take the kids to the cellar and stay there. If you're with me when they come, they'll kill you too."\n\nShe knew they would. These Banderites were monsters, with a particular hatred of Poles. While Ruslana was Ukrainian, and might have lived through their brutality, her husband was a Pole. In the eyes of the Banderites, it was an unholy union, and they would almost certainly kill her along with him.\n\n"I'll take them down," she finally said, pulling herself together. "And then-"\n\n"And then you will hide," he insisted, shooting a glance at the door. "Go! Hurry!"\n\nShe quickly grabbed her children and took them to the cellar. Both of them were scared, crying and just waiting for it to be over. It was only a few minutes of making sure they were situated before she realized she couldn't do it. She couldn't wait here for him to die. "Stay here," she told them, forcing a comforting smile. "I'll be right back."\n\nThe children only nodded, as she quickly returned up the stairs. Both children then heard muffled sounds above. Sounds of struggle, a gunshot, and a scream. Everything went silent, and as both children hid in the basement, the realization settled in. Mother wasn't coming back."
BOV_Klyachkivsky_buildup.14.a: "Neither of their parents were."

BOV_Klyachkivsky_buildup.15.t: "The Reclamation of Galicia"
BOV_Klyachkivsky_buildup.15.d: "It was finished.\n\nKlyachkivsky stood in the heart of Galicia, flanked by his advisors, commanders, and rows upon rows of soldiers who cheered this name, roaring with an intensity that shook the ground. The parade was magnificent, and Klyachkivsky had a small, but genuine smile as he looked out into the crowds.\n\nThis was a triumph only comparable to when they had first reclaimed Ukraine itself. Galicia was home, where she rightfully belonged.\n\nThe Poles had tried to fight, of course. They had attempted to stem the tide of Ukrainians pouring into Galicia, but they had wilted under the force that had been brought to bear. They could not stand against the sons of Ukraine, for they knew what they were fighting for was not their own.\n\nMeter by bloody meter, Galicia had been reclaimed, and the Poles who had once dominated it had fled or been dealt with.\n\nAs Galicia became soaked in the blood of Poles, they had finally conceded defeat once Ukraine had begun encroaching on Poland itself. Tempting as it might have been to end the Polish menace once and for all, Klyachkivsky was satisfied with Galicia. The Poles had been humiliated, broken, and would never trouble Ukraine again.\n\nHis legacy was now secured as the man who had first liberated Ukraine, and now had brought them victory in Galicia. Soon, he would be known as the man who would make Ukraine whole once more. The men who surrounded him were all smiles as he prepared to give his victory speech, and just for a moment Klyachkivsky basked in the adoration and euphoria as the crowds shouted his name.\n\nThis, he knew, was only the beginning."
BOV_Klyachkivsky_buildup.15.a: "No one could stop them now."

BOV_Klyachkivsky_buildup.16.t: "Now or Never"
BOV_Klyachkivsky_buildup.16.d: "For the first time in some time, Klyachkivsky sensed that there was dissent in the room. He and his commanders stood around the table they had planned military operations before, and this time, the plans detailed an invasion of Hungary to reclaim the rightful Ukrainian lands they held. His commanders had been with him through it all; they were reliable when others had abandoned or betrayed him. There were few that he felt he could rely on - which made him surprised, disappointed, and concerned when they began raising their voices in dissent.\n\n"Vozhd, we've achieved victories that were said to be impossible," one of them said hesitantly, clearly nervous about speaking. "But we need to take care of our people now. The fighting left significant damage we need to rebuild. Once we do-"\n\nA single raised hand silenced the insubordinate officer. Klyachkivsky turned his cold eyes towards the wilting man. He let the silence hang ominously before he answered.\n\n"If we do it now, then there will not be another opportunity," Klyachkivsky reprimanded. "Anyone in possession of Ukrainian lands knows we will come to reclaim them. They will prepare, and more Ukrainian blood will be spent. We either strike now, or condemn more of Ukraine's sons to die later."\n\nThat authoritative statement was enough to silence any remaining dissent, if not completely. He would need to investigate this later. This kind of open defiance could prove troublesome once the wars were over. The conversation turned to more practical matters; troop positions, Hungarian defenses, and allocated resources.\n\nSo engrossed in the conversation, that none of them paid attention to the guards in the room. Not until the conversation abruptly stopped as they became aware of a gun that had been raised, aimed straight at the Vozhd's head."
BOV_Klyachkivsky_buildup.16.a: "A single gunshot rang out, and Ukraine's fate was forever altered."

### Shukhevych Eevents

BOV_Shukhevych_buildup.1.t: "Місячне сяйво"
BOV_Shukhevych_buildup.1.d: "Роман Шухевич вставив у ручку новий чорнильний картридж. Крізь штори просочувалося місячне світло. Він змерз і втомився. Схожий на привида, загорнутий у коротку синю ковдру, він перехилився через стіл і підтягнув лампу ближче, аж доки його обличчя не стало гарячим. Роман скинув черевики, витягнув ноги і вперше за сьогодні встав. Кілька хвилин він дивився на нотатки на столі. Він не міг прочитати написане. Було вже пізно - вітраж застилав йому очі.\n\nВін все ще пам'ятав, що записав. Його план був чітким у його голові: будувати з певного.\n\nБудувати з певного, тому що воно є основним. Думай, як мураха. Знищуй мельниківців і винагороджуй кооперативних партизанів. Руйнуй і будеш покараний, співпрацюй і будеш винагороджений. Україна зможе повернути собі Галичину лише після того, як це усвідомить. «Це додає, - пробурмотів Роман, - відчуття єдності. Давно такого не було».\n\nРоман обернувся, коли двері відчинилися. До нього тихо підкралася Наталя. «Романе, - прошепотіла вона, - я не кажу тобі не робити дурниць. Ти часто знаєш, що це дурниці. То чому ти ще не спиш?»\n\n«Це на завтра. Післязавтра. Я закінчую».\n\nВона посміхнулася. «Гаразд». Вона пройшла по підлозі, вщипнула його за вухо і не відпускала. «Ходи зі мною в ліжко, Романе».\n\nВона потягнула. Він не пручався. «Добре...»"
BOV_Shukhevych_buildup.1.a: "...Завтра багато справ."

BOV_Shukhevych_buildup.2.t: "Республіканці, комуністи та чорний дощ"
BOV_Shukhevych_buildup.2.d: "Холодний дощ бив у вікна палацу. Стріли крижаної води розбивалися об чорне скло і сповзали по шибках краплями завбільшки з ніготь. Поки безіменні істоти снували по дахах палацу, Шухевич і Позичанюк зачинили двері на засуви і усамітнилися в тихому натопленому передпокої. Повітропровід гудів.\n\nРоман затиснув чоло, розминаючи шкіру, наче тісто. Череп став м'яким. «Про республіканців, комуністів, - сказав він, - я не переплутаю наше послання. Не переплутаю. І я не хочу вести переговори». Він простягнув руки над повітропроводом і дозволив йому дихати теплим подихом на свої руки. «Чому ми повинні йти на компроміс з переможеною стороною? Ми не повинні. Я не бачу в цьому сенсу».\n\nВираз обличчя Романа був статичним, його риси були схожими на приколотих комах на картоні. «Що ми повинні робити, так це сприяти стабільності. Тому ми їх попереджаємо. Республіканців і комуністів. Якщо вони не здадуться, у нас є мандат на придушення. Якщо вони здадуться, не буде жодних проблем. Якщо ми зараз почнемо переговори, і вони проваляться, це буде виглядати як наша провина».\n\n«Все виглядає як наша провина», - сказав Йосип. «Ми кажемо, що ми сильна держава, то хто ж тоді винен, окрім нас? Якщо пограбували село, то це наша провина. "Чому мій уряд не може мене захистити?" - ось що запитають люди».\n\nЙосип схрестив руки і притиснув свій білий халат ближче до шкіри. «Якщо ми проведемо переговори, у нас буде можливість дати республіканцям і комуністам причину опустити зброю в осяжному майбутньому. Укласти щось зобов'язуюче, встановити умови для нового державного договору, який ми пишемо»."
BOV_Shukhevych_buildup.2.a: "Роман прислухався, але не був упевнений. Повітроводи гуділи, коли дощ бив по палацу."

BOV_Shukhevych_buildup.3.t: "Несподіване перемир'я"
BOV_Shukhevych_buildup.3.d: "У тьмяно освітленому підземному сховищі невелика група комуністичних повстанців сиділа за столом, плануючи свій наступний крок проти нового режиму. Це був один з останніх осередків комуністів, що зменшувався, і вони не знали, як діяти далі. Поки тривала дискусія, їхню увагу привернув потертий конверт, таємниче покладений на стіл. Лідер осередку, Максим, обережно взяв його і розглянув. Група зібралася навколо, коли Максим відкрив листа, їхня цікавість розпалилася.\n\nЛист був не від кого іншого, як від самого Шухевича, так званого "Вождя України". На їхнє здивування, він запропонував їм гарантію безпеки в обмін на припинення їхньої діяльності проти його уряду. Пропозиція спантеличила, і повстанці ретельно поставили під сумнів мотиви такої, здавалося б, пробачливої пропозиції. Вони дивувалися, чому, незважаючи на те, що уряд був цілком здатний знищити їх, він запропонував прощення? \n\nПісля тривалих дебатів група вирішила, що вони мало що втрачають, приймаючи пропозицію Шухевича. Вони вже давно зневірилися у своїй справі. Націоналісти добре і по-справжньому підкорили більшу частину їхньої опозиції. Перспектива нової комуністичної революції здавалася неможливою, майже всі лідери руху загинули, і тепер вони були загнані в кут. Максим написав їм відповідь, в якій погодився припинити свою діяльність, і повернув листа.\n\nДнями після цього вони з тривогою чекали на будь-яку відповідь або репресії, але їх не було. Коли їхня тривога вщухла і група адаптувалася в суспільстві, мотивація Вождя стала більш зрозумілою. Якщо Україна хоче встояти перед тим, що насувається, потрібно пробачити десятилітні образи. Немає потреби в ідеологічних чварах, коли Україна витріщається на німецького бегемота."
BOV_Shukhevych_buildup.3.a: "Цикл насильства має бути зупинений."

BOV_Shukhevych_buildup.4.t: "Перехрестя сумління"
BOV_Shukhevych_buildup.4.d: "У маленькій, прихованій конспіративній квартирі на околиці Києва група республіканських повстанців зібралася разом, їхні обличчя освітлювало мерехтливе світло свічок, і вони обговорювали своє поточне становище. Їхні розмови були перервані, коли по радіо пролунав тріскучий голос самого Шухевича, звернений до всіх повстанців в Україні. Напруга в кімнаті була відчутною, коли вони слухали ультиматум.\n\n«Всім українцям, які були введені в оману, ми пропонуємо вам шанс на порятунок. Ваші лідери були розгромлені, і ви є нічим іншим, як скалкою в боці нації. Проте українцям не потрібно більше проливати українську кров. Іноземні держави прагнуть нас підкорити. На горизонті є набагато більш гідна боротьба. Негайно припиніть всі бойові дії. Ті, хто складуть зброю, будуть прощені. Але вороги нації, які продовжуватимуть боротьбу, будуть повністю знищені!»\n\nДовгі години палких дебатів тривали, коли повстанці намагалися прийняти рішення, яке визначило б їхнє майбутнє. Зрештою, багато хто з них вирішив здатися. Для них вільна Україна здавалася ще більш далекою, ніж будь-коли. Націоналісти захопили уми українського народу своєю перемогою над німцями, і для багатьох надія на швидке становлення демократичної України згасла."
BOV_Shukhevych_buildup.4.a: "Як щури, що тікають з тонучого корабля."

BOV_Shukhevych_buildup.5.t: "Фермерські війни"
BOV_Shukhevych_buildup.5.d: "Шухевич мовчки сидів і спостерігав, як на його очах розгортається війна. Саме мельниківський націоналіст привернув увагу Шухевича до цієї проблеми, гнівно увірвавшись до його кабінету з листом і праведним гнівом. Це здавалося таким буденним, таким несуттєвим, простий земельний спір.\n\nРік тому український фермер на галицькому кордоні продав два акра своєї ферми сусідові, чоловікові на чверть польського походження. Тепер фермер подав петицію до уряду, вимагаючи повної реституції землі, спираючись на своє чисте українське походження. Природно, що мельниківці побачили в цій земельній суперечці чергову велику українську расову боротьбу і стали на бік фермера.\n\nНе бажаючи займатися такими тривіальними справами, Шухевич покликав одного з небагатьох державних службовців, що залишилися в регіоні, для вирішення питання. Це була перша помилка. Чиновник виявився республіканцем і, що ще гірше, моралістом з кровоточивим серцем. Він вказав на те, що український фермер вже має величезні земельні ділянки і, крім того, йому заплатили законну плату за землю. Мельниківець у відповідь назвав республіканця жидом.\n\nЧерез годину здавалося, що вони вже навіть не обговорюють це питання, а просто стукають кулаками по столу, як неандертальці. Шухевич знав, що якщо це триватиме ще секунду, то або когось застрелять, або він впаде від аневризми. «Досить!» - крикнув він. Підвівся, дістав запальничку і, роздратовано зітхнувши, промовив. «Я піду на перекур, якщо ви двоє не прийдете до рішення, поки я повернуся, я приведу когось із комуністів, щоб він зробив це за вас».\n\nЧерез кілька хвилин, притулившись до дерев'яного стовпа, в голові Шухевича почала дрейфувати хмара дешевого тютюну. Німцям не треба вводити свою армію, думав він..."
BOV_Shukhevych_buildup.5.a: "Такими темпами ми зробимо їхню роботу за них."

BOV_Shukhevych_buildup.6.t: "Нова постанова"
BOV_Shukhevych_buildup.6.d: "В одному з будинків працювало радіо. Люди сиділи і слухали його.\n\n«Постановою Вождя України Романа-Тараса Йосиповича Шухевича:\n\nБеручи до уваги, що наступні офіцери Організації Українських Націоналістів, Василь Степанович Кук і Йосип Позичанюк, виявили значні заслуги в управлінні визволеною національною Україною,\n\nА також враховуючи, що вони мають відповідний політичний і військовий хист для задоволення потреб нашої нації та її оборони від німецької загрози, як це було попередньо визначено генералом Шухевичем,\n\nА також враховуючи, що вони мали особливі заслуги в операціях проти зрадників Клячківського і Стецька: \n\nПОСТАНОВЛЯЄМО, що ці особи, Василь Кук і Йосип Позичанюк, іменуються співправителями Української Національної Держави і головами Проводу Української Головної Визвольної Ради спільно з Вождем...»\n\nУ хаті здійнялася какофонія суперечок, а радіо продовжувало репетувати. Тим часом один слухач трохи відкинувся на знайдений стілець. Він відчував більше оптимізму, ніж будь-коли, відколи перемогли бандерівці."
BOV_Shukhevych_buildup.6.a: "Можливо, він міг би з цим жити."

BOV_Shukhevych_buildup.7.t: "Взято в Цукеркаря"
BOV_Shukhevych_buildup.7.d: "Цукеркар повернувся з повним мішком привабливих ласощів. Багато з них викликали у Лариси заздрість, адже все це виглядало дуже апетитно, і ніхто з її однокласників чи друзів не хотів ділитися. Він пообіцяв, що дасть це будь-якій дитині, яка принесе йому книжки, написані, за його словами, "дуже поганими людьми". Лариса трохи чула про те, про що він просив, і чесно кажучи, не впізнала жодного з імен або чому вони погані. Але через те, що сказав її батько, вона сумнівалася, що вони були настільки погані, як він стверджував. Вона вирішила, що він, напевно, бреше і нечесний, як і казав її батько.\n\nТа все ж таки, все це змусило її замислитися над тим, що ж таке ці нібито небезпечні книжки. Чи були звичайні слова насправді небезпечними або страшними? Якщо Цукеркар їх боявся, то, можливо, їй було б корисно дізнатися про це самій. Батько казав їй триматися подалі і не наражати себе на небезпеку, але зараз його тут не було.\n\nЦікавість взяла гору над батьківським авторитетом, особливо коли вона побачила можливість прямо перед собою, коли Цукеркар відволікся. Вона спостерігала за Цукеркаром здалеку і побачила, що у нього на лавці лежить стос книжок, а сам він намагається заманити дітей на ігровий майданчик. Вона швидко рушила вперед, схопила верхню книжку зі стопки і швидко побігла геть.\n\nСерце калатало від її захоплюючої пригоди, вона подивилася на книжку, яку взяла, і вона не здалася їй вражаючою. Вона глянула на назву - "Український націоналізм в..." Це була дуже довга назва, і написана вона кимось на ім'я Донцов. Що ж, можливо, це буде цікаво, і вона подивиться пізніше.\n\nВона тільки переконалася, що не скаже батькові, де вона її знайшла."
BOV_Shukhevych_buildup.7.a: "Заборонені знання завжди були найпривабливішими."

BOV_Shukhevych_buildup.8.t: "Державні потреби"
BOV_Shukhevych_buildup.8.d: "Шухевичу не подобалися такі рішення.\n\nБути лідером було важко. Командувати нацією - ще важче. Це було простіше, коли їхня організація була обмеженою. Войовничою силою з конкретною, ідеальною метою було легше керувати і контролювати. Бути лідером ніколи не було легко, але складні рішення мали менше шансів роз'ятрити рани або створити суспільні розколи.\n\nШухевич сидів за своїм столом, коли день згасав, обмірковуючи ситуацію, що стояла перед ним, і вибір, який треба було зробити. Були ті, хто підштовхував його до включення мельниківців в уряд, оскільки вони були б корисними в управлінні державою, покращили б стабільність нації.\n\nВони також були зрадниками.\n\nСаме цей факт робив рішення важким. Раніше це було б просте рішення, і зрадники були б прикладом для наслідування. Тепер все було не так просто. УПА більше не була в центрі уваги при прийнятті рішення. Тепер на першому місці була Україна, і це перетворило вибір з чорно-білого на темно-сірий.\n\nВін подивився на фотографію Коновальця на своїй полиці, ніби вона дала б йому рішення, яких йому зараз бракувало. Йому було цікаво, що б зробив Коновалець у цій ситуації? Чи зробив би він те, що було б необхідним для покращення стабільності нації? Чи усунув би зраду, де б вона не була виявлена? Він також гостро усвідомлював, що багато хто сприйме помилування зрадників погано, що може звести нанівець будь-яку стабільність, яка випливала з їхнього помилування.\n\nОдна річ була безсумнівною - деякі люди повинні були померти. Не бракувало тих, хто цього заслуговував. Питання було лише в тому, кого з них повісити."
BOV_Shukhevych_buildup.8.a: "І йому потрібно було зробити цей вибір якнайшвидше."

BOV_Shukhevych_buildup.9.t: "Постійне тавро ганьби"
BOV_Shukhevych_buildup.9.d: "Ранкові газети були заповнені іменами та обличчями тих, хто в минулому співпрацював з нацистами, а їхні злочини проти української нації та її народу транслювалися для загального огляду. Хоча багато з них діяли з прагматичних міркувань, керуючись бажанням вижити в умовах безвиході німецької окупації, їхні дії залишили на їхній репутації пляму, яку вже ніколи не змити.\n\nХоча вироки, винесені урядом Шухевича, часто були м'якими, особливо в порівнянні з більш суворим поводженням, з яким вони могли зіткнутися при уряді Клячківського, публічне таврування цих людей як колабораціоністів було найвищою мірою ганьбою. Імена винних були надруковані жирними літерами, що гарантувало, що їхні минулі гріхи переслідуватимуть їх до кінця життя. Проте вони були потрібні. Занадто багато українців співпрацювали, щоб усіх їх можна було стратити або відправити до трудових таборів, як це зробив би Клячківський. Новій бюрократії потрібен був досвід і знання, які мали ті, хто працював в адміністрації Райхскомісаріяту, принаймні на деякий час.\n\nНе дивлячись на більш поміркований підхід уряду Шухевича і його нетривалу співпрацю з нацистами, коли вони зіткнулися з радянською загрозою, мало хто був готовий співчувати колабораціоністам. Народ України надзвичайно постраждав під час нацистської окупації, і спогади про звірства, скоєні в той час, були ще свіжі в його пам'яті. Колаборанти зробили вибір..."
BOV_Shukhevych_buildup.9.a: "І тепер вони стикаються з наслідками свого вибору."

BOV_Shukhevych_buildup.10.t: "До вболівальників"
BOV_Shukhevych_buildup.10.d: "Сьогодні був дуже хороший день для Євгена Онацького - і для багатьох інших людей, якщо розмір натовпу може про це свідчити.\n\nСотні людей зібралися на публічну страту трьох чоловіків - Сушка, Штуля і Сціборського; всі вони були зрадниками УПА і самої України. Через тісноту натовпу декому було важко розгледіти зведену шибеницю, але Онацький був задоволений тим, що бачив. Ніхто з присутніх не впізнав би його і не дізнався б, наскільки близько він був до того, щоб повіситися разом з ними.\n\nНе дивлячись на це, він давно чекав цього дня.\n\nВін знав момент, коли прибули троє чоловіків, оскільки звуки глузувань і знущань ставали все гучнішими, коли солдати розчищали шлях крізь натовп, проштовхуючи приречених вперед. Кожен з них виглядав змарнілим, нещасним і явно пережив усі радощі свого короткого тюремного ув'язнення.\n\nОнацький посміхався, коли їх підводили до шибениці, і дивився, як їм зав'язували петлі на шиях. Ніхто з них не намагався чинити опір. Сушко так важко дихав, що Онацький подумав, чи не розплачеться він. Сушко завжди був жалюгідним чоловіком, коли його позбавляли образу сильного чоловіка, за яким він ховався.\n\nБуло зачитано їхні злочини, а також вирок: смерть через повішення, що викликало вимогливе вигукування натовпу. Тіла падали одне за одним, а петля затягувалася. Кожне з тіл борсалося кілька секунд, перш ніж заклякло, залишаючи шиї викривленими під неправильним кутом.\n\nКоли кожна людина помирала, натовп вигукував своє схвалення, а очі Онацького виказували явне задоволення, і його серце палало від помсти, коли його ненависні колеги зустріли кінець, на який вони так заслуговували."
BOV_Shukhevych_buildup.10.a: "Ще одна загроза для України усунута."

BOV_Shukhevych_buildup.11.t: "Перед новим вождем"
BOV_Shukhevych_buildup.11.d: "Онацький і Олег Ольжич сиділи в кабінеті Шухевича, який оцінював їх беземоційно, що дещо збентежило обох чоловіків. Для Онацького Шухевич був чимось на кшталт загадки. Безмежно відданий справі, але у спосіб, який був явно його власним.\n\nЙого було важко прочитати; незбагненний таким чином, що це робило його гіршим за когось на кшталт Сушка, чиї мотивації були зрозумілими. Шухевичу не треба було переконувати інших у своєму авторитеті, як Сушку; він природно привертав до себе увагу.\n\nБільшу частину зустрічі вони провели, обговорюючи, як вони зможуть підтримати уряд Шухевича - дуже наполегливо заявляючи про свою лояльність і згоду з керівництвом його держави. Обидва чоловіки знали, що єдиною причиною, чому їх не повісили, було те, що Шухевич вважав їх і решту мельниківців корисними.\n\nЯкби він відчув, що вони якимось чином заважають, або, що ще гірше, нелояльні, Онацький повністю вірив, що це зміниться.\n\nПриватним чином обидва чоловіки мали певні застереження щодо коаліції Шухевича. Сам він погоджувався з ними у більшості питань, хоча люди навколо нього були... не ідеальними. Зокрема, Позичанюк був прихованим лібералом, і все ж Шухевич, схоже, вважав його близьким союзником, якщо не другом.\n\nНезважаючи на цей розрив, це було найкраще, що кожен з них міг отримати, і Онацький волів би залишитися на землі живих, служачи Україні якнайкраще, ніж бути веденим на шибеницю через незгоду з наймогутнішою людиною в Україні. Ні, так було найкраще для всіх учасників. Він лише сподівався, що Шухевич погодиться. Нарешті, коли вони закінчили, чоловік кілька секунд мовчав, перш ніж кивнути головою."
BOV_Shukhevych_buildup.11.a: "«Я вважаю, що Ви повинні мати місце в моїй адміністрації. Ваші завдання будуть незабаром»."

BOV_Shukhevych_buildup.12.t: "Питання підходів"
BOV_Shukhevych_buildup.12.d: "Настрій у кімнаті був важкий. Кук і Позичанюк кивком голови відзначили появу Шухевича, і вони почали засідання. Це була не перша їхня зустріч у справі Галичини, але саме зараз вони мали прийняти рішення. З Шухевичем було кілька документів і карт, що детально описували передбачуване вторгнення в регіон.\n\nЗустріч розпочалася досить нормально, більшість запитань надходила від Кука. Обидва вони обговорювали деякі деталі, хоча Кук, здавалося, був задоволений планом. На відміну від нього, Позичанюк здебільшого мовчав, і на його обличчі був стурбований вираз. Нарешті він заговорив. «Це справді найкращий підхід? Атакувати без попередження і вагань?»\n\nКук насупився, хоча Шухевич стояв перед ним просто обличчям до обличчя. «Ви не згодні?»\n\n«Я не згодний з тим, щоб втягнути нас у ще одну війну без спроб переговорів», - пояснив Позичанюк. «Поляки не дурні - вони знають, що програють війну проти нас, тож чи можуть вони добровільно віддати Галичину? Хіба це не краще, ніж гарантувати війну?»\n\n«А що, якщо вони використають цей час, щоб закріпитися?» - запитав Кук. «Це тільки зробить війну кривавішою».\n\nПозичанюк відповів не одразу, але не відводив погляду від Шухевича. «То нехай буде так. Краще ми зробимо спробу, ніж почнемо війну заради неї».\n\nОбидва чоловіки чекали на його рішення, і їхнього лідера, як завжди, було важко прочитати. Ні вираз його обличчя, ні очі не видавали того, що він справді відчував. Обидва чоловіки висловили слушні зауваження, але, зрештою, він не мав наміру ухилятися від свого обов'язку перед українцями в Галичині.\n\nОб'єднання відбудеться. Йому потрібно було лише визначити шлях."
BOV_Shukhevych_buildup.12.a: "Висунути ультиматум. Нехай поляки вирішують, чи потрібна війна."
BOV_Shukhevych_buildup.12.b: "Ми не дамо їм часу на підготовку. Ми вторгнемося в Галичину."

BOV_Shukhevych_buildup.13.t: "Солодкий хабар"
BOV_Shukhevych_buildup.13.d: "Сімейні вечері ставали дедалі рідшими, оскільки дні минали, а відповідальність за управління державою зростала. Проте родина Шухевичів докладала зусиль, щоб робити це, навіть якщо це було лише кілька разів на тиждень.\n\nДля Романа Шухевича це був короткий перепочинок, коли він міг побути зі своєю сім'єю, хоча б на деякий час. Вечеря, яку Наталя приготувала на цей вечір, як завжди, була чудовою, а дискусія, як завжди, точилася навколо дітей, до якої він напівслухав, хоча національні проблеми залишалися на задвірках його свідомості.\n\n«Тату?»\n\nЙого швидко повернув до життя голос дочки, і він побачив Марію, яка вичікувально дивилася на нього, перш ніж зітхнути з перебільшеним почуттям провини. «Думаю, тобі треба ще трохи відпочити. А то так і задрімаєш».\n\nНаталя злегка посміхнулася, а Шухевич лише підняв брову, задовольнившись тим, що розмова пішла далі. Юрій насупився. «Припини. Він зараз працює більше, ніж будь-хто. Ти хоч уявляєш, з чим він має справу щодня?»\n\nМарія, здавалося, була приголомшена Юрієвим спалахом. «Я не хотіла...»\n\n«Все гаразд», - перебив Шухевич, піднімаючи руку. «Твоя сестра має рацію, хоча нам усім не завадило б ще трохи поспати». Він поправив доньку з легкою усмішкою. «У мене багато роботи... але якщо ти спечеш колись своє печиво, то, можливо, я зможу трохи подрімати. Зовсім недовго».\n\nДочка хихикнула, і Наталя посміхнулася. «Тоді домовилися»."
BOV_Shukhevych_buildup.13.a: "У будинку Шухевичів знову все було спокійно."

BOV_Shukhevych_buildup.14.t: "Досягнення повноліття"
BOV_Shukhevych_buildup.14.d: "За обіднім столом у домі Шухевичів панувала напруженість. Роман Шухевич був помітно ще більш похмурий, ніж зазвичай, і всі знали, чому. Новина швидко поширилася, і, без сумніву, подібні розмови відбувалися по всій Україні. Війна з Польщею нависла над країною, і ніхто не уникне її пекла.\n\nТа все ж вони намагалися насолодитися їжею, яку з любов'ю приготувала для них Наталя. Шухевич намагався зробити свій внесок і відвернути країну від майбутньої війни. Намір, який раптово був підірваний, коли Юрій втрутився під час затишшя.\n\n«Я збираюся піти добровольцем на фронт». Він глибоко зітхнув. «Прийшов мій час це зробити».\n\nНегайною реакцією було здивування і жах. Наталя здригнулася, наче від удару, а Марія раптом закам'яніла, змушуючи себе проковтнути тепер уже несмачну їжу. «Ні в якому разі!» вигукнула Наталя голосом, в якому були і переляк, і злість. «Особливо в такому вигляді! Ти ще не достатньо дорослий!»\n\n«Є чоловіки молодші за мене, які вже воювали», - сказав Юрій спокійним голосом. «Я провів достатньо часу на тренуваннях».\n\n«Але, - сказала Марія тихим голосом. «Ти можеш загинути».\n\nЮрій повільно кивнув. «Я міг би. Але так само міг би кожен інший чоловік, який воює. Чому я маю бути особливим тільки через свого батька?»\n\n«Твій батько скаже те ж саме», - благально звернулася до нього Наталя. «Ти ще не готовий. Романе, скажи йому, що він нікуди не поїде на фронт!» Коли вся родина подивилася на нього, Шухевич опустив свій посуд і після хвилини роздумів заговорив."
BOV_Shukhevych_buildup.14.a: "Юрій має рацію. Якщо він вважає, що готовий, то я не буду йому заважати."
BOV_Shukhevych_buildup.14.b: "Твоя матір має рацію. Ти ще не готовий йти на фронт."

BOV_Shukhevych_buildup.15.t: "Продовжуючи традицію"
BOV_Shukhevych_buildup.15.d: "Наталя була сама не своя після вечері, на якій Юрій поділився своїми намірами піти добровольцем на фронт, і Шухевич схвалив їх. Він розумів її страх і пам'ятав, що вона так само реагувала, коли він тільки почав воювати. Тепер, коли їхній син пережив те саме, що й він...\n\nВін розумів. Він краще за неї знав, з чим зіткнеться їхній син, що він побачить і що може статися.\n\nВін розумів все дуже добре.\n\n«Чому ти не сказав йому ні?» запитала вона, коли вони залишилися наодинці, і обоє дітей спали.\n\nШухевич думав, як краще відповісти. «Це мало колись статися. Це традиція для чоловіків нашої родини - служити в армії. Настав час, щоб він отримав певний польовий досвід».\n\n«Мені байдуже до всього цього!» вигукнула вона, перш ніж замовкла, опустившись на ліжко. Він сів поруч, ніжно пригорнувши її до себе. «Я просто не хочу, щоб наш син помер», - прошепотіла вона, і з її очей потекли сльози. «Мені й так важко хвилюватися за тебе, а тут ще й за нього».\n\nВін міцно пригорнув її до себе. «Я знаю, де він буде дислокуватися, і під чиїм командуванням. Він буде на фронті, але я подбаю про те, щоб він був подалі від важких боїв. Я захищатиму його, як тільки зможу, Наталю, але він повинен сам приймати рішення».\n\nВона видихнула. «Дякую тобі. Мені це не подобається, але якщо це його вибір... все, що я можу зробити, це молитися за нього, так само як і за тебе»."
BOV_Shukhevych_buildup.15.a: "«Тоді давай помолимося за нашого сина»."

BOV_Shukhevych_buildup.16.t: "Життя під тінню"
BOV_Shukhevych_buildup.16.d: "Юрій не сприйняв докору, він підвівся, не сказавши більше ні слова, і вийшов з-за столу. Шухевич знав, що хлопцеві неприємно те, що він сказав, але він не мав звички брехати рідним, навіть якщо правда може вжалити. Колись Юрій буде готовий, але не зараз. Він не був готовий до майбутніх боїв, особливо проти поляків.\n\nНаталія пішла за ним, залишивши Шухевича і Марію за столом з їжею, яка остигала. Шухевич помітив, що у нього пропав апетит, а Марія колупалася в їжі, її власний апетит, здавалося, теж пропав.\n\n«Він боїться, розумієш?» - сказала вона нарешті. нарешті сказала вона.\n\nВін допитливо подивився на неї. «Твій брат?»\n\n«Так», - відповіла вона. «Не боїв. Що він досить хороший для тебе. Що він не виправдовує тебе. Він хоче, щоб ти ним пишався, і, гадаю, хотів це довести».\n\nЗазвичай безпристрасний вираз обличчя Шухевича пом'якшав, і він заплющив очі. «Я пишаюся ним. Йому не треба показувати таку браваду перед...» - він затнувся.\n\n«Я це знаю, і якщо він чесний з собою, то й він це знає», - заспокоїла його Марія. «Але я його розумію. Іноді важко відчувати, що ти відповідаєш очікуванням. З ним все буде добре, не хвилюйся. Якщо він почує це від тебе, то буде краще».\n\nШухевич кивнув. Синові було важливо це знати. Він не хотів, щоб той відчував себе неадекватним чи невдахою. Він вирішив поговорити з ним і пояснити це. Навіть якщо Юрій не був готовий до бою, він все одно був його сином."
BOV_Shukhevych_buildup.16.a: "І він був сином, яким можна пишатися."

BOV_Shukhevych_buildup.17.t: "Марш як один"
BOV_Shukhevych_buildup.17.d: "Роман Шухевич волів би виголосити цю промову особисто, перед ревучим натовпом, який би вигукував його ім'я на повен голос. Радіо було знеособленим і нецікавим. А промова на мітингу могла охопити лише кілька тисяч людей. Тут же, однак, мільйони українців з усієї країни налаштувалися б на радіо, слухаючи, як Шухевич розповідає про похід України до відродження.\n\n«Брати, - сказав він у мікрофон, намагаючись уявити собі людей, що притулилися до своїх радіоприймачів, - cотні років наш великий народ був розділений ворогами. Нас ділили між жадібними державами на заході і сході, намагаючись зробити нас слабкими і поступливими. Вони вважали, що якщо ми не зможемо боротися разом, ми не зможемо їх перемогти. І вони мали рацію.\n\nАле ми засвоїли наш урок. Хоча багато з нас здобули свободу, є ще українці, які знемагають під чужим пануванням. Наші товариші в Галичині працюють під польським чоботом. Вони не забуті - вони не покинуті.\n\nЯк я казав, наші хоробрі вояки борються проти польського панування над нашими землями. Наша перемога неминуча, і вона настане за кілька тижнів. Ця перемога буде першою перемогою по-справжньому єдиної України, і першою з багатьох. Нехай це буде уроком для тих, хто хотів би нас роз'єднати. Україна знову єдина. Нехай Господь змилується над нашими ворогами, бо ми точно не змилосердимося над ними».\n\nПриглушені оплески ззовні кабінки були негучними, але Шухевич міг уявити собі оплески та вигуки з усієї України. Не буде більше поділів, не буде більше компромісів. Україна житиме знову."
BOV_Shukhevych_buildup.17.a: "І вона буде пишатися, незважаючи ні на що."

BOV_Shukhevych_buildup.18.t: "Тривожна тиша"
BOV_Shukhevych_buildup.18.d: "Це був водночас і великий, і страшний момент, думали люди з обох сторін, коли українська армія увійшла до Львова. Велике галицьке місто було відвойоване, і поки українці святкували, поляки стояли в мовчазній тиші. Тиха лють.\n\nТихий жах.\n\nІсторії вже давно дійшли до міста разом з їхніми оповідачами, які тікали від українського наступу. Наповнений біженцями Львів чув про незліченні звірства, заподіяні їхнім етнічним братам, і багато хто очікував, що падіння міста супроводжуватиметься повним розгромом. Такого повного розгрому не бачили з часів середньовіччя.\n\nАле цього не сталося. Швидке входження, пустельний парад, звичне встановлення блокпостів і гарнізонів - так, але без особливого конфлікту. Всі погодилися з тим, що на високому рівні було віддано чіткий наказ про необхідність дотримання певних заходів стриманості. Населення вітало це, але залишалося настороженим. У всіх на язиці було одне й те саме слово.\n\n«Поки що».\n\nОкупація не стала насильницькою. Поки що. Мародерство не почалося. Поки що. Всі добре знали, як швидко загарбницька армія може стати хижацькою, і хоча всіма силами сподівалися, що цього не станеться, вони також почали готувати схованки у своїх підвалах. Про всяк випадок."
BOV_Shukhevych_buildup.18.a: "Це може продовжитися?"

BOV_Shukhevych_buildup.19.t: "Ехо 41-го"
BOV_Shukhevych_buildup.19.d: "Коли сонце зайшло за обрій, колись мирне місто Львів перетворилося на арену хаосу і руйнувань. Польща не пристала на вимоги Шухевича і тепер розплачується за це.\n\nУ самому центрі Львова спалахнув погром, підстьобнутий запеклою ворожнечею між українцями і поляками. Українська армія, з мовчазної згоди, керувала розлюченими громадянами, які громили польські будинки і підприємства. Звук розбитого скла і тріскотнява наповнювали повітря, коли натовп проривався через місто, одержимий жагою помсти.\n\nКров текла вулицями рікою, коли тіла поляків витягали з їхніх домівок і нещадно били мстиві натовпники. Повітря було затягнуте їдким димом, а полум'я палаючих будинків затуляло небо над головою. Сім'ї в жаху тулилися один до одного, молячись про припинення кошмару, який огорнув їхні життя.\n\nПосеред хаосу молода польська мати на ім'я Олена відчайдушно намагалася захистити своїх дітей від насильства, що їх оточувало. Їхній будинок був захоплений, а її чоловіка забрав натовп. Усе, що залишилося, - це дві маленькі доньки, які міцно трималися за неї з широко розплющеними від страху очима. Вона бігла так швидко, як тільки могла, разом з багатьма іншими людьми, що рятувалися від насильства. Вони розгубилися, їм нікуди було йти, вони знали лише, що треба бігти на захід якнайшвидше. Олена не озиралася."
BOV_Shukhevych_buildup.19.a: "Вона не хотіла більше бути свідком порочності, яка знову заволоділа її домом."

BOV_Shukhevych_buildup.20.t: "Поточні витрати"
BOV_Shukhevych_buildup.20.d: "Крики було чути за багато кілометрів. Птахи перестали сидіти на найближчих деревах, а місцеві жителі почали збирати речі, щоб переїхати до родичів. Було дивно чути, як загартовані в боях чоловіки плачуть, як діти, поки не побачиш їхні відсутні кінцівки, або те, що від них залишилося. Юрій Шухевич рідко відвідував польові шпиталі. На відміну від свого батька, він не був популістом, здатним всмоктувати свої емоції в себе і приймати привітну, доброзичливу маску перед обличчям жаху. Його тривожили видовища, майже тваринний відчай в очах чоловіків або нудьгуюча відстороненість лікарів зі скляними очима.\n\n«Скільки зараз тут чоловіків?» запитав Юрій. Чорнявий лікар, вкритий шрамами і взагалі суворий на вигляд чоловік, замислився, перш ніж пробурмотів відповідь.\n\n«Близько семисот п'ятдесяти, плюс-мінус». Юрій зазирнув у широкий намет, і тільки тепер помітив величезну кількість чоловіків, що лежали на траві, їхні рани виглядали зеленими і некротизованими. Кожна з них виглядала більш продірявленою, ніж попередня, кожна рана розповідала однаково похмуру історію. Він майже розгледів личинку, що звивалася в очниці одного чоловіка, і бачив, як інший злегка звивався в заціпенінні, тримаючись за обрубок руки. Він проковтнув жовч і повернув погляд до лікаря, який був беземоційним.\n\n«Центральне командування не дало нам достатньо ліжок, а селяни відмовляються нам щось готувати. У нас немає медикаментів і майже немає бинтів. Вдаємося до листя. Воно допомагає, принаймні на деякий час».\n\nЮрію нарешті вдалося вийти з намету, але не раніше, ніж він зустрівся з кількома чоловіками. Йому довелося відтягнути їх від камери, всі вони благали його не публікувати фотографії. Юрій пообіцяв, що не допустить цього, але пізніше, дивлячись на безхмарне небо, яке так відрізнялося від того, що відбувалося внизу, замислився: чи варто було це робити?"
BOV_Shukhevych_buildup.20.a: "Чи дожили б ці люди до української Галичини? Чи було б їм це цікаво?"

BOV_Shukhevych_buildup.21.t: "Довгий шлях вперед"
BOV_Shukhevych_buildup.21.d: "Коли український командир опустив бінокль, гнів на його обличчі був зрозумілий усім навколо. Вони теж це бачили. Пагорби вдалині мали чіткі сліди польових робіт на них, а на вершині червоно-білий польський прапор тріпотів під легким вітерцем.\n\nНе повинно було бути так, як сталося. Війна не повинна була стати повторенням попередніх польсько-українських воєн, ні. Вона мала бути змодельована за зразком оригінальних німецьких наступальних операцій, з швидкими ударами, що розгромлять і оточать дезорганізовані польські формування, і швидкою перемогою, що послідує за ними. Принаймні, так планував штаб. Очевидно, ніхто не думав, що поляки можуть не погодитися з цим баченням.\n\nКомандувач пам'ятав, як швидко ці початкові атаки були відкинуті вбік. Як швидко вони були притуплені. Як швидко все повернулося до того, що є зараз, до запеклих боїв проти рішучої і укоріненої опозиції. Повільне просування вперед оплачується великою кількістю крові. Це, безсумнівно, була одна з них.\n\nКомандир відвернувся від проклятого прапора і попрямував назад на свій пост. Оборона була грізною, і потрібно було визначити, скільки людей послати вперед, послати на смерть, щоб мати хороші шанси на взяття фортеці. Відповідь, безсумнівно, була надто дорогою.\n\nАле все одно треба було заплатити за це."
BOV_Shukhevych_buildup.21.a: "Опір залишається впертим."

BOV_Shukhevych_buildup.22.t: "Смерть від розчерку пера"
BOV_Shukhevych_buildup.22.d: "«Польський опір лише посилюється з кожним тижнем. Львів є зоною бойових дій, п'ять поліцейських були знайдені мертвими лише цього місяця, а ще п'ятнадцять наших солдатів були отруєні, а в деяких випадках відкрито побиті до смерті. У сільській місцевості спалено сорок три селянські садиби, здійснено напади на три застави та вбито два патрулі».\n\nГоловний командир українських військових сил у Галичині виголошував свою доповідь нервовим монотоном, тоді як решта українського генерального штабу, і, головне, Роман Шухевич, дивилися на нього з острахом. Він прочистив горло втретє за кілька хвилин і продовжив.\n\n«Їхні можливості загалом здаються невеликими, проте, безумовно, допомогу їм надають їхні союзники по той бік кордону. Вони користуються великою повагою серед місцевих поляків, але глибоко зневажаються нашим народом. Спроби порушити лінії постачання були помірно успішними, але вони залишаються проблемою в прикордонних регіонах».\n\nКомандир нарешті закінчив свою доповідь і незграбно встав, чекаючи на запитання. Роман Шухевич посидів, очевидно, в глибокій задумі, а потім повільно підвівся. Він дивився прямо на командира, який ледве зустрічався з ним поглядом, хоча стояв на відстані цілого столу.\n\n«Для мене питання здається зрозумілим. У Галичині є поляки. Це центральна проблема, яку треба вирішити. Ніяка контрповстанська боротьба не спрацює, коли у вас є п'ята колона, яка постійно працює на підтримку наших ворогів. Ми не маємо ні коштів, ні браку самоповаги, щоб підкуповувати їх дрібничками. Бандера чітко сказав: всі поляки, які зазіхають на наші землі, повинні померти або бути вигнані. Це єдине рішення. Я очікую, що солдати будуть віддані цьому завданню, як тільки ми вийдемо з цієї кімнати»."
BOV_Shukhevych_buildup.22.a: "Накази були надіслані ще до закінчення години."

BOV_Shukhevych_buildup.23.t: "Війна проти нації..."
BOV_Shukhevych_buildup.23.d: "Юрій ішов лісом, його товариші не відставали. він знав ці ліси, кожен куточок був досліджений ще в дитинстві. Це було найближче до дому, яке тільки могло бути у дитини допитливого партизана. Звичайно, все було не так, як він пам'ятав, зокрема, було тихо, мертвотно тихо. Жодна пташка не щебетала, селяни не ходили по гриби чи не збирали загублених свиней.\n\n«Село за пагорбом!»\n\nЮрій почав бігти вгору по пагорбу, на нього нахлинув потік спогадів. Він згадав, як роками дивився вниз на це село, але так і не зміг побачити його. Батько казав, що він зможе відвідати його, коли Галичина буде звільнена. Коли він піднімався на пагорб, його очікування зростали і переростали у всілякі фантазії.\n\nЗа пагорбом нічого не було.\n\nВсе, що залишилося від села - це обвуглена церква. Юрій обернувся до побратимів, які спокійно дивилися на це. «За що, за що, за що...»\n\n«Вони всі були поляками. Вони отримали по заслугах, може, ті, що бігли, як зайці, повернуться до Варшави, де їм і місце!» Один із солдатів сплюнув.\n\nЮрій випростався і скривився. Він задумав побувати в польському селі! Яким наївним він був у дитинстві, яким дурним! Батько повинен був бути чесним з ним!\n\n«Хотів би я бути там, щоб всадити в них кілька куль»."
BOV_Shukhevych_buildup.23.a: "...стає війною проти народу."

BOV_Shukhevych_buildup.24.t: "Chevauchée"
BOV_Shukhevych_buildup.24.d: "Хоча мало хто, в Галичині чи за її межами, вірив українській пропаганді щодо Галицької кампанії, повідомлення останніх днів поклали край будь-яким претензіям на честь чи вищу мету кампанії в цілому.\n\nБо набагато більше уваги приділяється мародерству, грабежам і безладним вбивствам.\n\nУкраїнські формування продовжують свій наступ, залишаючи за собою випалені шляхи. Позбавлені худоби, зерна, цінностей, а в багатьох випадках і людей, зруйновані села розповідають свою власну історію. З відчайдушним бажанням перемоги, підбурювані пропагандою Вождя і підштовхувані до все більшого звірства наказами з дому, вони перетворили Галичину на майже пустелю.\n\nНаразі ще незрозуміло, чи стануть їхні дії допомогою, чи перешкодою. Хоча "місцеве постачання", як називали його інтенданти, допомагало підтримувати швидкість просування, історії про звірства поширювалися, викликаючи осуд, надихаючи низьку партизанську активність і посилюючи опір польських підрозділів, з якими вони стикалися.\n\nПеремога, можливо, буде в майбутньому. Але вона буде куплена набагато більшою кров'ю і руйнуваннями, ніж було потрібно, і за це доведеться заплатити."
BOV_Shukhevych_buildup.24.a: "Це необхідна плата."

BOV_Shukhevych_buildup.25.t: ""Спонтанні" святкування повернення"
BOV_Shukhevych_buildup.25.d: "Майже в кожному селі України сини повертаються додому. У чистеньких одностроях їх обіймають рідні, ллються сльози за їхнє виживання, готуються святкові вечері.\n\nТак само як і проголошення, як рідними, так і солдатами, в межах чутності сільського старости, що вони мали честь взяти участь у першому кроці національного відродження. Честь підтримати ідею Вождя власною кров'ю і таким чином просунути справу українського народу.\n\nПо мірі того, як продовжувалася святкова ніч, розмови переходили на похорон. Як у цьому селі, так і в сусідньому, синів, які повернулися в трунах, а не в блискучих мундирах. Вони мали бути поховані з почестями в найближчі дні, а їхні жертви прославлені як необхідні в пошуках національного відродження. Пошуку, який вони допомогли завершити.\n\nБезперечно, дух України був відроджений. Поразка Польщі та реінтеграція Галичини довели силу народу та його рішучість подолати роки розколу та пригнічення. Це довело силу України. І, звичайно, це довело силу Вождя, що, звичайно, є найважливішим."
BOV_Shukhevych_buildup.25.a: "За Вождя!"

BOV_Shukhevych_buildup.26.t: "Героям-переможцям"
BOV_Shukhevych_buildup.26.d: "Багато святкувань було влаштовано по всій Україні, але особливо в тепер звільненій Галичині, де українських вояків зустрічали з радістю та обожнюванням. Шухевич був у помітному доброму настрої, оскільки він, Кук і Позичанюк також брали участь у святкуваннях, в одному з таких зібрань з солдатами, громадянами та офіцерами.\n\nШухевич був цілком задоволений завершенням війни. Саме звільнення Галичини не викликало сумнівів, але було питання, наскільки високою буде ціна. Як сильно поляки окопаються? Наскільки добре його солдати зможуть виконати свої плани? Кожна відповідь була рішуче на їхню користь.\n\n«Перемога заслужена, Романе», - похвалив Кук з посмішкою, потягуючи свій напій. «І все це майже без крові. Я, чесно кажучи, здивований; я очікував, що поляки чинитимуть більший опір».\n\n«Так, я теж», - роздумував Шухевич, спостерігаючи за жвавим натовпом. «Можливо, вони не хотіли жертвувати своїми людьми у війні, яку вони знали, що програють. Результат все одно однаковий. Галичина наша». «Віднині і назавжди», - підняв келих Кук. «Слава Україні».\n\nШухевич усміхнувся у відповідь. «Героям слава».\n\nЄдиним із присутніх, чий настрій не збігався з рештою, був Позичанюк, який не міг позбутися думки, що все можна було б вирішити без пострілів. Однак він промовчав, бо скаржитися тепер було безглуздо. В очах історії Шухевич був виправданий, а аргумент за мир розбитий. Реальність, до якої їм доведеться звикнути."
BOV_Shukhevych_buildup.26.a: "Тріумф затьмарює все."

BOV_Shukhevych_buildup.27.t: "Велика й кривава перемога"
BOV_Shukhevych_buildup.27.d: "Повернення Галичини було здійснено, як і обіцяв Вождь. І за таку малу ціну, що це майже неймовірно. Так казало радіо. Так говорили бюрократи. Так казала армія. Так говорили паради.\n\nАле на відміну від великої кількості державної пропаганди, поширеної до цього часу, цей меседж не повторювався населенням. Ні, цього разу все було навпаки. Тихим голосом, через тисячі кілометрів, села і місця збору людей, поширювалося інше повідомлення.\n\nСкільки людей загинуло?\n\nНіхто не міг отримати точної відповіді, але всі знали, що їх було занадто багато. Занадто багато з тих небагатьох синів, що залишилися в Україні після десятиліть гноблення. Занадто багато з них зараз поховані - або залишені гнити - в Галичині. І після того, як дискусії на цю тему завершилися, з'явилося логічне і набагато небезпечніше продовження.\n\nЧи було воно того варте?\n\nВідповідь була приголомшливою. Стільки жертв заради престижу? Заради туманної "єдності", вже давно досягнутої у свідомості багатьох? Висновок був очевидним і загальним. Все було даремно. Заради ілюзій своїх нових правителів. Заради тих непереконливих фігур, до яких все частіше відносили і Вождя, в яких вони швидко втрачали віру."
BOV_Shukhevych_buildup.27.a: "Темні сили."

BOV_Shukhevych_buildup.28.t: "Програний гамбіт"
BOV_Shukhevych_buildup.28.d: "Давно вже ні Позичанюк, ні Кук не бачили Шухевича таким напруженим. Його присутність була настільки відчутною, що хотілося говорити дуже обережно, навіть якщо він не промовляв жодного слова. Його холодні очі не кліпали, не відривалися. Він нагадував Позичанюку згорнуту змію, вовка, який оцінює здобич, і він знав, чому. Бої в Галичині тривали вже кілька днів. Вони йшли не дуже добре. Шухевич розгорнув на столі карту з позначками. «Укріплення», - одним словом відкрив її Шухевич. «Кожне з них розташоване на критичних перехрестях і зведене протягом останніх кількох тижнів. Ми не підготувалися до них, і вони стримують наш наступ».\n\nВождь стиснув губи. «В результаті ми змінюємо наші плани. Без сумніву, поляки використовують виграний час, щоб закріпитися глибше. Їхнє бажання утримати Галичину є очевидним».\n\nКук стиснув губи, і здавалося, що він намагається не дивитися на Посичанюка, який залишався дуже тихим. Було зрозуміло, що Шухевич не збирається згадувати про те, що рішення про раптове вторгнення призвело до цього... поки що ні. Водночас усі знали, що до цього призвело.\n\nПорада Кука виявилася згубною. Якби вони спробували провести переговори, то, можливо, принаймні не поспішали б з провалом.\n\n«Вони готуються до більш тривалої війни», - нарешті сказав Кук стиснутим голосом. «Ми мусимо готуватися до того ж самого. Перемога не прийде швидко, але тільки тоді, коли поляки будуть розгромлені, де б вони не були».\n\n«Так, - голос Шухевича був таким же холодним, як і його очі. «Перемога буде коштувати дорожче, ніж передбачалося, але ми будемо наполягати». У його голосі прозвучала нотка остаточності; залізна обіцянка, яка не буде порушена."
BOV_Shukhevych_buildup.28.a: "Галичина буде нашою."

BOV_Shukhevych_buildup.29.t: "Шепіт у суспільстві"
BOV_Shukhevych_buildup.29.d: "Хоча війна була виграна, а паради перемоги були належним чином сплановані, проведені та відвідані, ніхто не міг заперечити, що серед населення був очевидний брак ентузіазму.\n\nБо війна, хоч і переможна, але вже давно втратила будь-який блиск. А пересуди про неї наростали.\n\nТі сили, які Україна зуміла відновити, перешіптувалися люди, після років гноблення та окупації, були майже повністю вичерпані. Викачані на конфлікт, який лише послабив державу перед численними ворогами, що оточували її. Ворогів, які, як усі були впевнені, незабаром прийдуть, спокушені самою цією слабкістю.\n\nТакож почали поширюватися розповіді про його поведінку - про звірства - від тих самих солдатів, які поверталися додому і які їх здійснювали. Це було божевіллям, перешіптувалися люди, діяти таким чином. Всі вони пам'ятали брутальність і жорстокість своєї власної окупації, і завдавати такого болю іншому? Вони знали, що ніколи не забували про необхідність помсти, і були впевнені, що поляки теж не забудуть.\n\nНайсильніше - і найтихіше - перешіптувалися про Вождя. Він уже порушив одну важливу обіцянку, яку дав людям, розпочавши галицьку акцію. Усім було цікаво: Яку обіцянку він порушить наступною? Як він наступного разу обдурить людей, яких, як він стверджував, веде за собою?"
BOV_Shukhevych_buildup.29.a: "Побачимо."

BOV_Shukhevych_buildup.30.t: "Надія, тепер задушена"
BOV_Shukhevych_buildup.30.d: "Шухевич стояв перед братською могилою.\n\nНіхто не стояв біля нього. Більше нікого не було. Повітря було нерухоме, небо чорне, місяць яскравий. Над усім висіла порожня, стерильна тиша. Над ним, над усім народом. Нічого, що було здобуто, і так багато, що було втрачено.\n\nНевеликі надгробки, здавалося, тягнулися нескінченно, кожен з них був проклятим звинуваченням його вибору; від якого він не міг сховатися. Він відправив тисячі молодих людей вмирати в Галичині на війну, яку історія справедливо назве безглуздою. І що він отримав натомість? Кров, трупи і попіл. Ні слави, ні перемоги, ні результатів.\n\nДо цього була надія. Люди вірили в нього, вірили, що Україна - це Фенікс, який воскресне з мертвих і знову принесе їм життя і надію. Тепер тисячі матерів, батьків, синів і дочок оплакували тих, кого він послав на смерть, і проклинали його, того, хто задушив надію в колисці.\n\nВсе даремно.\n\nВін наказав вбивати людей, все даремно. Він наказав знищити поляків і бачив, як світ об'єднався, щоб засудити геноцид, який він санкціонував. І все даремно. Україна не загинула, але загинуло її майбутнє. Їхні найкращі солдати загинули, єдність, якою вони насолоджувалися, була зруйнована, а війна зробила їх ослабленими і вразливими перед неминучим поверненням Райху.\n\nІ ось Шухевич стоїть перед могилами, а судити його можуть лише привиди. Він знав, що незабаром постане перед своїм Творцем і буде судимий за скоєне. Він прошепотів лише одне речення, одну молитву, яку вкрав вітер."
BOV_Shukhevych_buildup.30.a: "«Пробачте мені. Я підвів вас усіх»."

BOV_Shukhevych_buildup.31.t: "Остання жертва"
BOV_Shukhevych_buildup.31.d: "Відтоді, як почалася війна, а особливо відтоді, як вона загострилася, вже не було жодних претензій на просту сімейну вечерю. Юрій не гаяв часу на їжу, а натомість вступив у конфлікт з батьком. «Чи так було завжди?» - запитав Юрій без претензій на ввічливість, дивлячись на батька з нестримною ненавистю. «Це була та "краща Україна", яку ти обіцяв?»\n\n«Сину...» пробурмотів Шухевич, але його знову перебили.\n\n«Відповідай!» крикнув Юрій.\n\n«Це треба було зробити!» Шухевич відстрілювався. «Вони не залишили нам вибору! Ти б хотів, щоб загинули українці, чи поляки?»\n\n«Чи ти ставився з таким розумінням до нацистів, коли вони нас різали?» усміхнувся Юрій. «Те, що ви зробили з поляками... ви знищили нас. Ви зробили нас нічим не кращими за Німеччину. Ви робили це тому, що це була "необхідність", чи тому, що ви завжди цього хотіли? Ти ненавидів німців за те, що вони нам зробили, чи за те, що вони не прийняли тебе як свого!»\n\nКолись він різко дорікнув би йому, як і решта його родини, але тепер ніхто не став на його захист. Марія дивилася на нього так само гостро, як і її брат, а Наталя замовкла. «Ти мені огидний, - різко підвівся Юрій. «Ти мені не батько».\n\nШухевич здригнувся.\n\nЮрій вийшов з-за столу, не сказавши більше жодного слова, і Марія приєдналася до нього. Шухевич подивився на дружину, сподіваючись хоч на якусь підтримку, хоч на якесь розуміння. Натомість побачив лише її власний, сумний і розчарований погляд. Вона похитала головою і пішла з дітьми, залишивши його самого. Він залишався там ще дуже довго, знаючи, що те, що він зробив, могло зруйнувати його сім'ю назавжди."
BOV_Shukhevych_buildup.31.a: "Він так багато пожертвував для своєї країни. Це було найболючіше."

BOV_Shukhevych_buildup.32.t: "Орел зловісно насувається"
BOV_Shukhevych_buildup.32.d: "Цього разу саме Позичанюк зиркнув на Шухевича, обличчя останнього було похмурим, і цього разу на ньому не було звичної для нього владності. Кук сидів за сусіднім столом, з чаркою в руці, і не робив жодних зусиль, щоб триматися гідно.\n\nУ них нічого не вийшло. Все було скінчено. Вся ця безглузда, марнотратна війна закінчилася, і навіть Галичина не віддячила за тисячі життів, пожертвуваних заради неї. Це була жорстока поразка, яка в очах усіх присутніх, ймовірно, завдала смертельного удару по майбутньому України.\n\n«Чи було воно того варте?» тихим голосом запитав Позичанюк. «Ми могли б уникнути всього цього, але ні, ти мусив мати свою війну».\n\n«Ти також не мав впевненості в успіху», - відповів Шухевич уривчастим голосом.\n\n«Ми навіть не намагалися!». крикнув Позичанюк. «А треба було спробувати!»\n\nНіхто не заговорив одразу після цього вибуху. Кук випив ще одну чарку; його голос був млявим, а очі опущеними. «Можливо, нам варто було спробувати. Навіть якби все закінчилося так само... - похитав він головою. «Я підвів їх усіх. Я повинен був зробити більше. Зробити краще».\n\nВсі вони знали про загрозу, яка нависла над ними, і про те, що війна коштувала їм того невеликого шансу, який вони, можливо, мали, щоб дати відсіч Німеччині. Їхні найкращі солдати загинули, населення не бажало війни, економіка була в руїнах, а моральний дух - у прірві. Їхні шанси на виживання перетворилися з примарних на практично неможливі.\n\nІ все через рішення однієї людини. Позичанюк не соромився і не відчував провини за те, що сказав те, що мав сказати. Його слова були гнівними, гіркими і, зрештою, розчарованими. «Ви вбили надію України. Сподіваюся, це було того варте»."
BOV_Shukhevych_buildup.32.a: "Вираз обличчя Шухевича став відстороненим, але він не відповів."

