 BOV_deluge_deceit_desc: "Нас зрадили. Роман Шухевич і Ярослав Стецько, колишні бандерівці свого часу, перейшли на бік мельниківців, розкривши тим самим системну нелояльність до УПА і до спадщини Степана Бандери, що сформував цю державу. Де ми виявимо нелояльність далі? У Службі безпеки? У самому уряді? Тепер ми не можемо довіряти нікому.\n\nРухаючись далі, ми повинні бути пильними, адже вкрай важливо, щоб перебіжчиків більше не з'являлося. Аби це зробити, нам слід ретельно і старанно провести чистки, знищивши в країні будь-яку нелояльність. Ми будемо вразливими до опозиції нам, і вона майже точно спробує скинути нас у нашу мить слабкості. Це - найбільший виклик, який за все своє існування бачила УПА. Яккщо ми зуміємо подолати труднощі, наша революція житиме й надалі. Якщо ні - мрія про Велику Україну згасне."
 BOV_gut_sb_desc: "Служба безпеки, наша структура таємної поліції, зробила свій внесок у забезпеченні успіху нашої революції. Утім, у світлі останніх подій, що сталися в УПА, нам слід зробити певні серйозні зміни в її роботі, у тому числі в тому, хто її очолює.\n\nСБ очолює Микола Лебедь, вірний пес Стецька. СБ, якою Лебедь управляв без жодного нагляду зовні, скомпрометована в нинішньому її вигляді. Ці два факти створюють надзвичайно тривожну проблему, яка може викликати певні наслідки, якщо її не виправити негайно."
 BOV_emergency_restructuring_desc: "У нашому уряді повсюдно існує системна нелояльність. За даними нашої секретної поліції, управлінський апарат не є винятком. Служба безпеки знає про управлінців, яким слід піти.\n\nСБ проводитиме облави на управлінців, допитуватиме їх, позбавлятиме їх їхніх обов'язків, а потім - позбавлятиметься і від них. Вождь готовий до цього і підібрав самотужки нових управлінців, що замінять попередніх. Наш уряд потребує щирих, вірних і старанних управлінців, аби функціонувати так, як треба. Якщо управлінці не підпадатимуть під ці вимоги - їх треба буде звільнити."
 BOV_autumn_anarchy_desc: "Як ми й передбачали, комуністи й мельниківці помітили нашу реорганізацію. Наче ворони на труп, вони знову злетілися й повстали проти нас із надіє. повалити наш режим. Вони цього ще не знають, але вони смертельно помиляються. Наша революція - не труп. Вона живе й процвітає. Нам слід розчавити їх, швидко й рішуче.\n\nОднак, і діяти ми повинні швидко. Ці дикуни спустошують сільську місцевість, намагаючись згуртувати проти нас людей. Аби перемогти, нам слід на їхню жорстокість відповідати своєю жорстокістю."
 BOV_peasant_pawns_desc: "Король і селянин. У часи феодалізму король правив селянами, що працювали на нього, і захищав їх. Європа пережила цей період і пішла далі, а от росіяни - ні. Під некомпетентним правлінням короля Росія відставала від решти Європи. Тепер ми маємо модернізувати відносини Держави й селянства.\n\nСеляни є дуже консервативними людьми, і більшість із задоволеннями приєднаються до наших лав, аби боротися проти мельниківців і большевиків. Якщо ми скористаємося селянами проти наших ворогів, вони допоможуть нашій справі. У цій великій грі у шахи, селяни - не більше, ніж наші пішаки."
 BOV_polish_scourge_desc: "Століттями поляки вчиняли утиски українського народу. Після польсько-совєцької війни вони забрали Західну Галичину, законно українську територію. Вони й донині нею володіють, єдиною короткою перервою було вторгнення в Польщу.\n\nЯк і ми, поляки лише ось-ось отримали незалежність від німців. Вони все ще слабкі. Якщо ми все сплануємо добре і вдаримо швидко, ми зможемо продовжити виконання нашого завдання - створення Великої України."
 BOV_roaches_rats_desc: "Німецьких колаборантів було багато. Вони - щурі, мерзота, що бруднить землю самим своїм існування. Звісно, Вождь і Бандера співпрацювали з нацистами, однак вони вважали це союзом. Коли нацисти спробували закріпити свою владу над Україною, вони розірвали союз із німцями. А ті, хто продовжив співпрацювати з нацистами - щурі.\n\nОднак, деякі не люблять нацистів. Усе ж, вони з ними співпрацюють зі страху ща свої життя. Це - таргани, і ми можемо з легкістю відсіяти їх від щурів. Ці таргани можуть бути дуже корисними для нас - у них є цінний досвід і їх можна легко примусити до послуху."
 BOV_shumskyi_white_desc: "Протягом найостаннішої історії комуністи продовжували своє існування навіть тоді, коли поразка здавалася невідворотною. Лєнін ніколи не здавав своєї ідеї революції, і, зрештою, комуністи повалили Російську імперію. Бухарін ніколи не здавав Совєцького Союзу під час операції «Барбаросса». Утім, для Бухаріна результат був зовсім інакшим. Незважаючи на це комуністи продовжують жити, і найменша іскра надії для них може призвести до вогню супротиву.\n\nАби запобігти цьому, нам слід діяти швидко й рішуче. Ми повинні вдарити, і знову, і знову, і знову. Дамо шанс комуністам зализати рани - наш уряд буде в небезпеці. Якою б не була ціна, комуністи не повинні отримати й п'яді землі України!"
 BOV_galvanize_galicians_desc: "Щоби продовжити підготовку до нашої анексії Галичини, нам потрібно надіслати повідомлення нашим братам-галичанам. Прямо зараз вони під польським гнітом. Скоро ми їх звільнимо, і ми мусимо створити там зв'язки. Можливо, люди звідти зможуть допомогти нам у нашій справі. Наш успіх залежить від співпраці наших співвітчизників у боротьбі проти безкультурної польської свині."
 BOV_melnyk_vermin_desc: "Після кропіткої праці того, що лишається від Служби безпеки, ми напали на слід залишків збройного крила мельниківського руху - він веде до Чернігова. Ця фракція - лиш тінь колишньої себе, а очільником наразі є Роман Сушко.\n\nКоли ми проведемо чистку від залишків мельниківців, ми зруйнуємо весь фракціоналізм у ОУН; ОУН буде знову об'єднана в одну партію, і така подія заслуговує на гучне «Слава Україні!»"
 BOV_op_golov_desc: "Після детального планування нашими офіцерами і Вождем, усе нарешті готово. Операція «Головінський», наш план зі звільнення Галичини, нарешті остаточно готовий. Тож тепер єдина річ, яка відділяє нас від возз'єднання з нашими співвітчизниками - простий наказ розпочати виконання від верховного Вождя, і Польща знову пізнає наш гнів!"

