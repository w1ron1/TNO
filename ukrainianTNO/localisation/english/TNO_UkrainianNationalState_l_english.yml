 BOV_last_roman_desc: "У багатьох випадках римлян старовини неодноразово роз'єднувала громадянська війна, і лише після перемоги одного з претендентів на владу певний порядок відновлювався. Так сталося і в ці дні - Шухевич стоїть на вершині колись єдиного фронту, а стовпи Клячківського та Стецька зруйновані.\n\nСтерно правління Україною, майбутнім Держави та народу знаходиться в його руках - і йому доведеться діяти швидко, аби закріпити свою владу. Заради України - і заради обіцянок процвітання, що здаються такими далекими."
 BOV_shattered_front_desc: "Сприймалося за належне, що єдність, одного разу досягнута Бандерою, існуватиме й надалі серед усіх українців. Цю фантазію розбили вщент - і ціна цьому була приголомшливою для всього народу. Різні ополченці, рухи й особистості боролися одне з одним так само, як із окупантами, і це призвело до занепаду.\n\nЦе необхідно виправити. Зусиль для цього знадобить дійсно надзвичайно багато, однак тріщини між цими угрупованнями повинні бути подолані, а спільний фронт - створено. Ми всі в першу чергу, і, що найважливіше, незважаючи на всі наші розбіжності, українці."
 BOV_insuring_insurgencies_desc: "Незважаючи на те, які б прелюдії не було зроблено, комуністи й республіканці продовжують боротися, очікуючи, що їхні родини, як те траплялося багато разів раніше, страждатимуть від наслідків, якщо їх зрадять. Ми не маємо таких намірів, утім, звинувачувати їх не можна - шрами залягають глибоко.\n\nВони поки що не приєднаються до нас, однак це не значить, що нам треба карати їх за це. Ми можемо боротися з ними настільки почесно, наскільки це можливо, ставитися до полонених із повагою і мирно окуповувати землі, що відбираємо в них, без репресій. Із часом вони зрозуміють нашу щирість і приєднаються до нас як брати."
 BOV_line_in_sand_desc: "Неважливо, що ми робимо чи кажемо, комуністи й республіканці продовжують боротьби, витрачаючи життя, зусилля й ресурси проти братів-українців, а не проти тих, хто хотів би бачити всіх нас стертими з лиця землі. Нам потрібно спинити це, і якщо ми не можемо напряму перемогти їх на полі битви, ми можемо хоча б укласти угоду.\n\nМи пообіцяємо утримуватися від будь-яких репресивних дій проти них чи їхніх родин за умови, що ті утримуватимуться від атак і руйнувань критичної інфраструктури. Така угода однозначно буде підозрілою, однак вона задовольнятиме наші потреби на даний момент - і це вже непогано."
 BOV_uneasy_truce_desc: "Хоч сутички між нашими силами і силами наших ідеологічних ворогів досі відбуваються, останнім часом їхня кількість значно зменшилася, і принаймні певна частка не відбувалася завдяки неодноразовим пропозиціям миру, що пропонувало наше керівництво. У відповідь ми отримали обережні запитання, і, хоч і очевидно, що вони користуються цим затишшям, аби оговтатися від ран, що ми їм завдали, це, хоча б певного роду мир.\n\nЛише час покаже, чи дійсно триватиме цей «мир», але, якщо ми докладемо зусиль для його збереження, можливо, з часом ми досягнемо і справжнього порозуміння."
 BOV_ukrainian_triumvirate_desc: "Без жодних сумнівів, найбільш шкідливим рішенням Клячківського було занадто централізувати владу в руках лиш однієї людини - власне, його самого. Це перетворило його на тирана, що придушував кожного, хто з ним не погоджувався, і результати цього були катастрофічними для всіх. Ми не повторимо цієї помилки.\n\nВиконавча влада буде передана в руки ради, і, хоч Шухевич і однозначно збереже головування над нею, він не буде диктатором. Оскільки все перевірятиметься побратимами-патріотами, які й інформуватимуть Шухевича в разі чого, найгірших ексцесів удасться уникнути, а перед прийняттям рішень потрібно буде досягнути консенсусу."
 BOV_excise_excess_desc: "Спадщина Шухевича як того, хто короткий період часу був колаборантом, досить плутана, однак його дії більш ніж виправдовують його. Багато хто йшов за ним навіть до української громадянської війни, однак ні для кого не секрет, що ті, хто йшов із ним під час і після громадянської війни, звісно ж, не мали жодних добрих намірів і піклувалися виключно про власну шкуру. Ця колаборантська наволоч повинна бути вичищена з наших рядів, і зробити це буде досить легко.\n\nЗвісно ж, такі зрадливі кроти, як Стецько, неминуче протестуватимуть, однак їхній голос навряд чи багато важить у цьому питанні, до того ж, їхні скарги лише полегшать виявлення цих підступних елементів. Україна - не місце для зрадників і злочинців, і колишні посіпаки нацистів - не виняток."
 BOV_fractured_organization_desc: "Порожнеча, яка утворилася після смерті Коновальця, харизматичної й об'єднувальної для ОУН персони, перетворила ОУН на сварливий безлад, що часто бореться між собою(іноді навіть буквально), і Шухевичів тріумф не вирішив цю проблему. Щодня розрізнені фракції гризуть одна одній горлянки, ніби скажені собаки, в урядових залах, що заважає нормальній роботі. Якщо ми сподіваємося, що наша організація переживе випробування часом, або хоча б п'ять років, це потрібно ліквідувати.\n\nНічого не створює єдність краще, ніж справедливість, і, на щастя, це дає нам прекрасну можливість. Ураховуючи, що ми перемогли Райхскомісаріят, ми проведемо велику кількість судових процесів над зрадниками і гнобителями, що постануть перед судом і отримають належну відплату за загублені життя, приносячи минулому Україні справжню справедливість.\n\nЦе далеко не початок наших зусиль із об'єднання ОУН, і далеко від початку існування об'єднаної ОУН, однак ми все ще повинні почати, інакше все буде втрачено."
 BOV_humiliate_honorless_desc: "Бюрократична система - стрижень, що зберігає на плаву будь-яку державу, тож глибоко іронічним є те, що наша бюрократія сповнена тих, хто стрижня всередині не має. Більшість нинішнього базису нашого уряду - залишки від триклятого Райхскомісаріяту, себто, уряд складається з колишніх колаборантів, яким вдалося втекти від заслуженої мотузки під час початкових судів над колаборантами; більшість із них указують на колишні прояви їхньої некомпетентності як доказ супротиву окупантам, і це цілком може бути правдою. Ми не можемо дозволити існувати цьому явищу, однак ми не можемо напряму вичистити з уряду найбільш дурних і некомпетентних офісних працівників. Отож рішення є очевидним.\n\nЛіквідувавши тих, хто виживав після чисток, із найпершого ешелону, ми запевнимося, що приклади стануть публічними, а демонстрація разом із іншими, з тими, хто продав свою країну свого часу, а тепер примушують себе любити її, як колись, дозволить нам знову переконатися в їхній відданості нашій справі. Вони просто ще не знають, що це вона все ще присутня всередині них."
 BOV_subdue_surpents_desc: "Багато колишніх колаборантів, що допомагали у звільненні з самого початку боротьби були надзвичайно відданими нашій справі, хоча певні були змушені до колаборантства, оскільки це було єдиним шляхом уперед для Української держави. Однак, це не стосується їхніх очільників. Ті очільники, що зробили все, щоб співпрацювати з нацистами, і поставили це вище за просування націоналізму не заслуговують на те, щоб у їхніх грудях билося серце чи щоб у їхніх легенях було повітря. Єдиний шлях уперед для України - позбавити їх і одного, й іншого.\n\nНегайна страта Сціборського, Стецька і Шандрука стане найбільшим благом для українського націоналізму з часів перших творів Тараса Шевченка. За ними не сумуватимуть. За їхньої відсутності Україна процвітатиме, нація ставатиме сильнішою, а політична розділеність відійде в минуле. Най їхні могили забудуть, і най єдність ОУН триматиметься вічно."
 BOV_emboldening_embers_desc: "Багато колишніх колаборантів не мали жодного вибору, окрім як слідувати за мельниківцями, щоб висловлювати свій націоналізм, однак нещодавно розкрив себе найбільш праведний шлях, і всім надали можливість іти саме ним, що, власне, багато хто й зробив.\n\nВозз'єднання ОУН не було простим завданням, однак, аби закріпити це досягнення, ми повинні докласти зусиль, аби заручитися цілковитою підтримкою. Жодна організація не може функціонувати цілком і повністю без тотальної кооперації, і ми певні, що більш завзяті з самого початку колаборанти зможуть запропонувати таку - або ж довести свою користь у будь-який інший спосіб. ОУН тепер стоїть потужніше, ніж завжди, можливо, навіть конкуруючи з часами Коновальця, і ми не можемо бути більш гордими, ніж зараз."
 BOV_score_unsettled_desc: "Галичина завжди була українською, скільки б етнічних чисток не проводила Польща з часів трагедії, якою є їхня війна з росіянами у 20-х роках. Із тих часів український П'ємонт лишався відокремленим від нації, і, незважаючи на те, скільки б пустих обіцянок не було надано зрадникам-мельниківцям, німці не бачили причини переглядати ситуацію. Відповідно, після ліквідації Ґенеральної губернії, Польща все ще володіє часткою України, і наші будівлі, родини й люди все ще знаходяться під їхньою п'ятою. Саме час повернути Галичину додому.\n\nПоляки, вочевидь, не будуть вдячними за ту пропозицію, що ми їм висунемо, однак, враховуючи все пригніення нашого народу в минулому, вона й так дуже навіть щедра.\n\nПоляки повернуть нам наші законні землі.\n\n§RАбо ж їхня кров вмиє наші землі, і повернемо ми.§!"

 ### STETSKO PEACE TREE ###

