##Events
SAO_FOR.1.t: "Статус Сан-Томе і Принсіпі"
SAO_FOR.1.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Сан-Томе і Принсіпі, розташована на островах на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для підтримки її можливостей розвитку, на щастя, призвела до її зближення з нашою Економічною сферою, відкривши можливості для подальших дій у майбутньому. Хоча її корисність блідне в порівнянні з її сусідом, більший контроль над континентом може лише принести нам користь."
SAO_FOR.1.a: "Світло свободи сяє дедалі яскравіше."

SAO_FOR.2.t: "Статус Сан-Томе і Принсіпі"
SAO_FOR.2.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Республіка Сан-Томе і Принсіпі, розташована на островах на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для підтримки її можливостей розвитку, на щастя, призвела до її зближення з нашою Економічною сферою, відкривши можливості для подальших дій у майбутньому. Хоча її корисність блідне в порівнянні з її сусідом, більший контроль над континентом може лише принести нам користь."
SAO_FOR.2.a: "Радісні новини!"

SAO_FOR.3.t: "Статус Сан-Томе і Принсіпі"
SAO_FOR.3.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Республіка Сан-Томе і Принсіпі, розташована на захід від регіону Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для підтримки її можливостей розвитку, на щастя, призвела до її зближення з нашими союзниками в Західній Африці, а отже, і до нашої Економічної сфери, відкривши можливості для подальших дій у майбутньому. Хоча її корисність блідне в порівнянні з її сусідом, більший контроль над континентом може лише принести нам користь."
SAO_FOR.3.a: "Їхній успіх — наш успіх."


#Ideas
SAO_Civic_Association: "Громадянська асоціація"
SAO_Civic_Association_desc: "Хоча РВСТП ідеалістично ставиться до своєї місії визволити Сан-Томе, їм не пощастило мати справу з необхідністю переконати острів у тому, що саме вони є обличчям нового режиму, попри те, що вони є цілковито чужорідною організацією. Через жорстке правління португальців і відносну ізоляцію Сан-Томе панафриканський рух, що діяв підпільно в португальській Африці, не зміг створити значної бази підтримки серед населення острова. Це зробило прихилення місцевих жителів до ідеалів революції, м'яко кажучи, непростим завданням.\n\nЯк засіб подолати цей розрив між рухом і самим Сан-Томе, РВСТП та перехідна рада створили Громадянську асоціацію. Відповідаючи за організацію політичних мітингів і поширення панафриканістської пропаганди, ГА швидко перетворилася на головне джерело лівого радикалізму на Сан-Томе, навіть більше, ніж партія, яку вона представляє."

SAO_Glorified_Naval_Base: "Прославлена військово-морська база"
SAO_Glorified_Naval_Base_desc: "Після офіційного вступу острова Сан-Томе до панафриканського альянсу запеклі антиколоніалісти взялися укріплювати та переобладнувати колишні португальські об'єкти для революційних армад. Хоча це виявилося простим способом покращити економіку Сан-Томе, це також має побічний ефект: дипломатичне значення острова зводиться до військово-морської бази, що діє за першим покликом Камеруну.\n\nХоча присутність Сан-Томе життєво важлива для проєкції сили його союзників, для репутації Камеруну не дуже добре, коли внесок острова зводиться до другорядної ролі в ширшому театрі панафриканської революції."
