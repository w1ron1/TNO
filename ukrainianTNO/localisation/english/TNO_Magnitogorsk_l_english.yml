 MGN_subject_files_URAL: "Реквізувати суб'єктів з Уралу"
 MGN_subject_files_URAL_desc: "КОМЮНІКЕ 52.ic\n\nПротокол вилучення матеріалу - суб'єктів, категорія c. Війська вилучатимуть суб'єктів з «Уральської Ліги», що нині розташована в Чєлябінській області (докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті Чєлябінської области на стор. 3).\n\nКОМЮНІКЕ 52.ic ЗАВЕРШЕНО"
 MGN_subject_files_URAL_tt: "Ми шукатимемо суб'єктів для експериментів §Yна Уралі§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_subject_files_LOCAL: "Реквізувати місцевих суб'єктів"
 MGN_subject_files_LOCAL_desc: "КОМЮНІКЕ 52.ib\n\nПротокол вилучення матеріалу - суб'єктів, категорія b. Війська вилучатимуть суб'єктів у Чєлябінській області (де також розташований Маґнітоґорск і яка перебуває під фактичною та законною владою Совєцького Союзу. Докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті Чєлябінської области на стор. 5).\n\nКОМЮНІКЕ 52.ib ЗАВЕРШЕНО."
 MGN_subject_files_LOCAL_tt: "Ми знайдемо й реквізуємо суб'єктів §Yу місцевому районі§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_subject_files_BANDITY: "Реквізувати суб'єктів-бандитів"
 MGN_subject_files_BANDITY_desc: "КОМЮНІКЕ 52.ie\n\nПротокол вилучення матеріалу - суб'єктів, категорія e. Війська вилучатимуть суб'єктів із бригади Дірлеванґера, розташованої в Орєнбурзькій області. (Докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті Орєнбурзької области на стор. 3.)\n\nКОМЮНІКЕ 52.ie ЗАВЕРШЕНО"
 MGN_subject_files_BANDITY_tt: "Ми шукатимемо суб'єктів §Yна підконтрольних бандитам землях§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_subject_files_URBAN: "Реквізувати міських суб'єктів"
 MGN_subject_files_URBAN_desc: "КОМЮНІКЕ 52.ia\n\nПротокол вилучення матеріалу - суб'єктів, категорія a. Війська вилучатимуть суб'єктів із міських центрів поблизу ВСТАВТЕ МІСЦЕ (докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті міських центрів на стор. 10).\n\nКОМЮНІКЕ 52.ia ЗАВЕРШЕНО"
 MGN_subject_files_URBAN_tt: "Ми шукатимемо суб'єктів §Yу міських районах§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_subject_files_ORENBURG: "Реквізувати орєнбурзьких суб'єктів"
 MGN_subject_files_ORENBURG_desc: "КОМЮНІКЕ 52.id\n\nПротокол вилучення матеріалу - суб'єктів, категорія d. Війська вилучатимуть суб'єктів із селянських поселень Орєнбурґа, розташованих у бунтівній Орєнбурзькій області. (Докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті Орєнбурзької области на стор. 7.)\n\nКОМЮНІКЕ 52.id ЗАВЕРШЕНО"
 MGN_subject_files_ORENBURG_tt: "Ми шукатимемо суб'єктів §Yв Орєнбурзькому районі§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_subject_files_KAZAKH: "Реквізувати казахських суб'єктів"
 MGN_subject_files_KAZAKH_desc: "КОМЮНІКЕ 52.if\n\nПротокол вилучення матеріалу - суб'єктів, категорія f. Війська вилучатимуть суб'єктів у бунтівних воєначальників на півночі Казахської Совєцької Соціялістичної Республіки (КССР). (Докладнішу інформацію див. у Довіднику з вилучення суб'єктів і на долученій карті Північної Казахстанської Совєцької Соціялістичної Республіки на стор. 2.)\n\nКОМЮНІКЕ 52.if\n\n§YУ демоверсії Лисенко поки не може оголошувати війну казахським державам, оскільки це виходить за її межі. Тому цей фокус автоматично обходиться й не має наслідків.§!"
 MGN_subject_files_KAZAKH_tt: "Ми шукатимемо суб'єктів §Yна підконтрольних казахам землях§!.\n\n§GЦе покращить розсудок Лисенка.§!\n§RЦе збільшить §YНевдоволення НКВД§!!§!"

 MGN_unleash_the_new_russians: "Випустити Нових росіян"

 NKVD_Consolidating_Support: "Зміцнення наших позицій"
 NKVD_Consolidating_Support_desc: "Навіть під час централізації місцеві керівники тримають більшість влади, і їх майже не злічити. Старости хуторів, де живе заледве десяток людей, мають більше влади, ніж будь-хто взагалі мав би право мати. Ми не зможемо змінити це прямо й швидко, але скористаємося засобами, здобутими під час перевороту проти Лисенка, щоб примусом і підкупом заручитися підтримкою місцевих лідерів, знайти союзників на прикордонні та встановити фактичну владу НКВД в кожному місті, селищі й селі."
 NKVD_Round_Up_The_Cash: "Навідатися до банків"
 NKVD_Round_Up_The_Cash_desc: "Уряд у надзвичайному стані. Ми відновлюємося після законного перевороту, а НКВД небезпечно бракує коштів, щоб підтримувати дієву цивільну владу й забезпечувати безпеку нашого народу. Тому створено фонд надзвичайного оподаткування. Кожен громадянин муситиме віддати фіксовану суму зі своїх наявних заощаджень і доходів за безпеку під новим урядом. Це необхідність, а не тиранія!"
 NKVD_Round_Up_The_Gov: "Вичистити уряд"
 NKVD_Round_Up_The_Gov_desc: "Треба забезпечити святість уряду. За диктатури «товариша» Лисенка фашисти й ліберали були на кожному рівні. Лазівки для осіб без партійного квитка негайно закриють. Нацистів розстріляють за зраду Маркса, лібералів - за зраду Енґельса. Регулярні обов'язкові чистки залякають ворогів Лєніна. Комуністам нічого боятися."
 NKVD_Round_Up_The_Guns: "Провести інвентаризацію арсеналів"
 NKVD_Round_Up_The_Guns_desc: "Єдині цивільні, які володіють вогнепальною зброєю, - соціяльні фашисти, нацисти й інші злочинні елементи. У сучасній промисловій державі лише військо й силові служби мають потребу в засобах легкого вбивства й знищення комуністичного духу. Уряд і НКВД конфіскують усю зброю, крім випадків особливого дозволу Бункова чи іншого високого урядовця. Це малоймовірно."

 NKVD_Recruiting_Drive: "Готуючись до вовків"
 NKVD_Recruiting_Drive_desc: "Наші підвалини досі хиткі. Треба зібрати під прапором якомога більше людей, бо ми мусимо вижити у світі, який не хоче нашого існування. Це правда незалежно від стабільности."
