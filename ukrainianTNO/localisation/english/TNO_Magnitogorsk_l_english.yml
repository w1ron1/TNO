 ### Events ###
 MGN.142.t: "Комюніке 142.a"
 MGN.142.desc: "Комюніке 11.f висловило подяку групам, що успішно усунули перешкоди з уральських постів. Видобування ресурсів розпочати негайно, вантажний маніфест долучено нижче.\n\n146 СУБ'ЄКТІВ - ЧОЛОВІКИ - (ГВАРДІЯ)\n43 СУБ'ЄКТИ - ЖІНКИ - (ГВАРДІЯ)\n644 СУБ'ЄКТИ - ЧОЛОВІКИ\n801 СУБ'ЄКТ - ЖІНКИ\n454 СУБ'ЄКТИ - ДІТИ\n14,042 ОДИНИЦІ РІЗНОМАНІТНОЇ СТРІЛЕЦЬКОЇ ЗБРОЇ\n1 107-ММ ДИВІЗІЙНА ГАРМАТА ЗРАЗКА 1940 Р. (М-60)"
 MGN.142.a: "Комюніке завершено"

 MGN.1.t: "Набіг Дірлеванґера"
 MGN.1.d: "Коли ми погодилися співпрацювати з Дірлеванґером і його зграєю божевільних, товариш Лисенко погодився заплющити очі на один-два набіги в межах території, яка технічно належить до нашої сфери впливу. Зрештою, ми мусимо стежити за геніяльними експериментами й маємо для військ кращі завдання, ніж захищати селян, що вирощують ріпу. Крім того, населення, яке Дірлеванґер пообіцяв нам після майбутніх, масштабніших набігів, із лишком компенсує втрати від неминучої атаки, про яку повідомили патрулі. Бандити Дірлеванґера насуваються на беззахисне село, але всіх цінних людей ми звідти вже забрали. Ми не втручатимемося."
 MGN.1.a: "Ми дозволимо це... поки що."

 MGN.2.t: "Умови угоди змінено - відповідь Лисенка"
 MGN.2.d: "Досі наші відносини з бандитським покидьком Оскаром Дірлеванґером складалися бездоганно: його численні набіги забезпечували стабільний потік живих зразків для наших експериментів. Натомість ми просто віддавали йому старе спорядження, яке нас уже не надто цікавило, і це, схоже, їх задовольняло.\n\nОднак тепер усе, здається, змінилося. Сьогодні вранці наглядач за рабами Дірлеванґера прибув з останньою партією полонених, але заявив, що умови угоди змінилися. Очевидно, Дірлеванґер вважає, що всю роботу виконує саме він, а отже заслуговує на більшу частку, ніж отримує нині.\n\nОскільки тривають експерименти, для продовження яких потрібні ці зразки, мусимо ухвалити рішення."
 MGN.2.a: "Дірлеванґер має слушність."
 MGN.2.b: "Цей покидьок не отримає нічого!"

 MGN.3.t: "Дірлеванґер вимагає подвійну платню"
 MGN.3.d: "Схоже, останнім часом виродок Дірлеванґер розпочав нові набіги й завдав «могутнього удару» одному зі своїх ворогів. Кому саме - нас не надто цікавить. Унаслідок цього його загони для невільників переповнені полоненими, яких згідно з нашими угодами він готовий передати нам.\n\nАле як свиня, якою він і є, Дірлеванґер стверджує, що втрати під час останніх набігів вимагають більшої винагороди, ніж домовлено раніше, і має нахабство просити вдвічі більше!\n\nПередати більше наших технологій саме собою не становить проблеми. Річ радше в принципі: ці головорізи гадають, що можуть залякуванням змусити нас робити все, чого забажають. Варто дати Дірлеванґеру палець, і він відкусить руку. З іншого боку, що більше спорядження ми їм дамо, то охочіше вони вирушатимуть у свої невеликі набіги й навіть масштабніші атаки на Орєнбурґ і Лігу. Що більше вони воюють, то більше гинуть самі й наші спільні вороги. Що відповімо?"
 MGN.3.a: "Схвалити подвійну платню."
 MGN.3.b: "Половина первісної суми його провчить."

 MGN.608.t: "Уривки зі звіту про експеримент 2.25.034"
 MGN.608.desc: "Мета: створити життєздатний зразок, пристосований до умов низького вмісту кисню, з особливим наголосом на виживанні проти хімічної зброї.\n\nСуб'єкт: один (1) чоловік, 16 років. Вилучений із XXXXXXXXXX, поблизу Свєтлоґорска.\n\nПроцедура: протягом десяти годин постачання кисню суб'єктові зменшували зі швидкістю 7% на годину. Після поміщення до випробувальної камери суб'єкт спершу був спокійний, однак за дві години почав виявляти ознаки дистресу. Імовірно, цей дистрес спричинили брак контакту з людьми та тривога через ув'язнення. За чотири години суб'єкт почав скаржитися на запаморочення й утому. Приблизно на шостій годині суб'єкт неодноразово переходив від свідомости до непритомности, після чого почалася підготовка до другого етапу випробування. Приблизно за XXX годин суб'єкт утратив свідомість (хоча в цьому стані спостерігалося XXXXXX) і не опритомнів до вилучення з камери. Після цього суб'єкта піддали номінально смертельній дозі газу фосгену. Суб'єкт повідомив про симптоми, що відповідали базовому рівню впливу, і помер за 26 годин після контакту. Розтин суб'єкта виявив наповнені рідиною легені, що відповідало номінальному впливу фосгену.\n\nРезультат: експериментальний режим не створив зразка, здатного вижити після застосування поширеної хімічної зброї. Повідомити управління XXXX про результати XXXXXX."
 MGN.608.a: "Звіт 2.25.034 завершено."
 MGN.608.a.tt: "233 суб'єкти стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка поліпшився.\nНКВД дедалі більше непокоїться через експерименти Лисенка."

 MGN.51.t: "Комюніке 07.j"
 MGN.51.d: "Дослідження складських приміщень маґнітоґорського арсеналу та подальші випробування знайденого там спорядження показали, що зброя, яку до розпаду СССР зберігали в захищених місцях (сховищах, арсеналах, тайниках), здебільшого лишилася справною. З 320 знайдених гвинтівок Мосіна-Наґана 91/30 (див. огляд характеристик зброї 1-c) 278 і далі придатні до використання, а решті потрібне лише незначне обслуговування для відновлення. Хоч боєприпаси збереглися гірше, вони також лишилися придатними: за оцінками обстеження, з 4,500 знайдених набоїв 7.62x54 мм R можна використати 3,200.\n\nВиходячи з припущення, що стан маґнітоґорського арсеналу подібний до стану інших совєцьких сховищ зброї, на нашій території, імовірно, лишається неврахована велика кількість справної зброї військового класу й допоміжного спорядження. Пошук і вилучення цих предметів оголошено пріоритетом класу b (див. документ про ранжування пріоритетів), а групи відряджено до ймовірних місць (див. долучену нижче карту) на пошуки складів. Головними джерелами для визначення ймовірних сховищ стали совєцькі архівні записи, особливо документ 45380 (звіт про військові об'єкти в регіоні Південного Уралу), і військовий перепис 1938 року, однак важливо пам'ятати про застарілість цих джерел (див. доповнення 1)."
 MGN.51.a: "Шукати в північних районах."
 MGN.51.b: "Шукати в південних районах."
 MGN.51.c: "Шукати в центральних районах."
 
 MGN.52.t: "Комюніке 09.b"
 MGN.52.d: "Недавні місії до совєцьких сховищ і арсеналів виявили певні запаси військового спорядження, хоч і не такі великі, як передбачали спочатку. Знайдено кількасот одиниць зброї та кілька тисяч набоїв (точні числа й характеристики наведено в долучених звітах підрозділів наприкінці документа), які тепер відправляють до Маґнітоґорска для видачі армії. Головні причини низьких результатів: пошкодження відкритих сховищ негодою та викрадені припаси, які, ймовірно, забрали невдовзі після розпаду Совєцького Союзу (перелік і карту розграбованих військових об'єктів див. у долученому звіті). Товариш Лисенко призначив зустріч із відповідальними за пошуки офіцерами, щоб подякувати їм за зусилля, і наказав переглянути прогностичні процеси, які завищили обсяг придатних до повернення припасів (див. огляд процедур прогностичного алгоритму). Знайдена зброя допоможе добре спорядити наших польових оперативників у разі непередбаченої затримки виробництва."
 MGN.52.a: "КОМЮНІКЕ 09.b ЗАВЕРШЕНО"
 
 MGN.53.t: "КОМЮНІКЕ 09.a"
 MGN.53.d: "Недавні місії до совєцьких сховищ і арсеналів виявилися надзвичайно успішними. Кількасот кілограмів різноманітних боєприпасів (точні зареєстровані обсяги див. на стор. 15 додатка) каталогізовано й відправлено назад до НКВД для ремонту, переобладнання та повторного використання в усіх подальших місіях з охоплення, стримування, зачистки й вилучення. Товариш Лисенко висловив подяку Групі повернення 16 (оголошення про привітання див. у ЩОДЕННОМУ БЮЛЕТЕНІ 2988.d) і представив увесь її особовий склад до ордена Жовтневої Революції, який буде вручено після перемоги Совєцького Союзу над ворогами в нинішньому конфлікті (додаткову інформацію див. у довіднику з медалей).\n\nРізноманітна зброя матиме вирішальне значення в усіх подальших польових зіткненнях, а численні експериментальні пристрої повернуто для відтворення на переробних заводах."
 MGN.53.a: "КОМЮНІКЕ 09.a ЗАВЕРШЕНО"
 
 MGN.54.t: "Прибуває тінь"
 MGN.54.d: "До нас звернулася Чорна Гора - псевдокомуністична псевдонаукова держава на чолі з Трохимом Лисенком. Вони надіслали озброєне до зубів посольство в накрохмалених одностроях, оголосили себе законним наступником наукової програми Совєцького Союзу - доволі хистка претензія, яку, схоже, живить виключно божевілля людини, що не вірить у падіння Союзу, - і зажадали віддати їм десятину чоловіків, жінок і дітей. На запитання навіщо вони заявили, що люди служитимуть Совєцькому Союзові, своєму законному урядові, просуваючи справу «соціялістичних робітників усього світу, забезпечуючи подальший поступ совєцької науки та розробок для застосування проти великого ворога в Німеччині». Коли ми наполягли на поясненні, що саме це означає, солдати, схоже члени НКВД, визнали: люди братимуть участь у «наукових експериментах», щоб стати сильнішими. Щоб краще воювати з німцями.\n\nХоч ці вимоги відверто безглузді й будь-який розсудливий провідник відразу відмовив би, солдати «товариша» Лисенка видаються доволі грізними. Вони й досі начищають ґудзики на своїх хакі через двадцять років після останнього наказу це робити.\n\nМи можемо відмовити, якщо забажаємо, але чи справді життя кількох селян варті такого конфлікту?"
 MGN.54.a: "Просто віддайте їм людей."
 MGN.54.b: "Ми не дозволимо забрати наших дітей!"

 MGN.55.t: "[From.GetLeader] відмовляється від данини."
 MGN.55.d: "РІВЕНЬ ДОПУСКУ: a\n\nПісля створення товаришем Лисенком програми мирного вилучення суб'єктів (М.В.С.) ми надіслали до сусідніх протодержав численні великі делегації належного зросту й статури, споряджені відповідно до переліку Кодексу одностроїв 32.b (бойовий однострій C), щоб установити з ними взаємовигідну «данницьку» систему. Ця «данницька» система (додаткову та історичну інформацію див. у додатку на стор. 1-8) значно полегшила б вилучення суб'єктів і дала б змогу простіше підтримувати стабільне надходження суб'єктів, у такий спосіб упорядковуючи експерименти й розширюючи наші знання про «лисенківську» наукову систему, затверджену Вєрховним Совєтом (додаткові пояснення див. в архівах у Совєцькій науковій директиві 14.A товариша Бухаріна про застосування технологій проти Німецького Райху). (Для додаткової інформації див. науковий компендіум.)\nОднак після відрядження посла до сусідньої автономної совєцької республіки ми отримали письмову відповідь, а делегація повернулася з помітною відсутністю суб'єктів. Повідомлено про повернення загалом нуля (0) суб'єктів. У записці було сказано:\n\n«Ми не скоримося вимогам культової держави на кшталт вашої. Ми більше не стоятимемо без діла, поки ви забираєте наших дітей і змушуєте зникати цілі поселення. Ваша спроба зробити нас васалами своєї сфери провалилася».\n\nПосол повернувся із синцями й шрамами на тулубі та голові (див. анатомічну схему в додатку 2.b. Найсерйозніші ушкодження були в ділянці статевих органів, черепа, носа й вух), імовірно внаслідок побиття мешканцями держави. Очевидно, мусимо шукати інших способів отримання суб'єктів від беззаконних злочинців цієї области. Альтернативні методи майбутньої заготівлі матеріалу буде оголошено в наступному щоденному бюлетені."
 MGN.55.a: "Як вони сміють?"
 
 MGN.56.t: "[From.GetLeader] доставляє данину."
 MGN.56.d: "РІВЕНЬ ДОПУСКУ: a\n\nПісля створення товаришем Лисенком програми мирного вилучення суб'єктів (М.В.С.) ми надіслали до сусідніх протодержав численні великі делегації належного зросту й статури, споряджені відповідно до переліку Кодексу одностроїв 32.b (бойовий однострій C), щоб установити з ними взаємовигідну «данницьку» систему. Ця «данницька» система (додаткову та історичну інформацію див. у додатку на стор. 1-8) значно полегшила б вилучення суб'єктів і дала б змогу простіше підтримувати стабільне надходження суб'єктів, у такий спосіб упорядковуючи експерименти й розширюючи наші знання про «лисенківську» наукову систему, затверджену Вєрховним Совєтом (додаткові пояснення див. в архівах у Совєцькій науковій директиві 14.A товариша Бухаріна про застосування технологій проти Німецького Райху). (Для додаткової інформації див. науковий компендіум.)\n\nДелегація, яку ми рано-вранці надіслали до области (додаткову інформацію про послів і делегації див. у довіднику з дипломатії в Росії), повернулася додому з письмовим листом і приблизно 16 чоловіками, жінками й дітьми, призначеними для використання як суб'єктів. За успішну місію делегації виплатили винагороду (додаткову інформацію про оплату державних службовців див. у довіднику ставок працівників). Осіб, привезених із дипломатичної місії вилучення суб'єктів, ретельно оглянули (анатомічний звіт про суб'єктів див. у додатку на стор. 6) і каталогізували. Один (1) чоловік узяв дитину (1) та жінку (1) (імовірно, членів його родинної одиниці; історичну інформацію про родинні одиниці та їх формування див. у довіднику й компендіумі) і разом із ними кинувся на електрифіковану огорожу за два (2) метри, проголосивши: «Вільні до останнього подиху» (див. довідник про демократичні та зрадницькі праві рухи, а також капіталістичний довідник і компендіум про так звані «визвольні рухи»). Їхню смерть каталогізовано й внесено до реєстру смертей. Їх спалять завтра вранці з першою партією тіл (графік утилізації тіл і масового спалення див. в управлінні утилізації тіл і довіднику методів утилізації тіл). Решту осіб доправили до об'єкта санітарної обробки класу b3, де вони нині проходять процедури санітарної обробки b5h. Після цього вони пройдуть експеримент із суб'єктами z10, або ВИПРОБУВАННЯ ЗВ'ЯЗКУ ТА СПАРЮВАННЯ, а потім ВИПРОБУВАННЯ БОЛЬОВОЇ СТІЙКОСТИ (докладнішу інформацію див. у списку випробувань B-P або зверніться до наукового управління). Після цього їх буде утилізовано у зручний для науковця час."
 MGN.56.a: "Вибору однаково не було."

 MGN.80.t: "Дисидент"
 MGN.80.desc: "Сьогодні Центральному плановому комітетові стало відомо про молодого офіцера з нашого загалом відданого НКВД, який поширював мерзенну брехню про наші експерименти в межах програми «Суперсолдат» та інші наші дослідження. Дурень стверджував, що ніхто не вижив і все було марно. Звісно, смерть зрадника вже влаштовано, хоча за всі роки ще ніхто не виявляв такої зухвалої злостивости, щоб висловлюватися в такий спосіб."
 MGN.80.a: "Інакодумства бути не може. Цього вимагає наша справа."
 MGN.80.a.tt: "Це зашкодить лояльності НКВД до Лисенка."

 MGN.81.t: "Нелояльність шириться"
 MGN.81.desc: "Сьогодні Центральний плановий комітет знову почув про зростання сумнівів в 22-й мотострілецькій дивізії НКВД. Цього разу трьох охоронців викрили в складанні планів украсти й приховати припаси, перш ніж утекти до тих анархічних халуп на заході. Їх, звісно, вже розстріляли, однак плани були докладні й здавалися надто амбітними для трьох охоронців. Радник із безпеки запропонував розпочати розслідування лояльности НКВД, щоб викорінити нелояльні елементи, перш ніж вони отруять нелояльністю всю організацію. Інший радник просто заявив, що НКВД може впоратися сам і позбавити Центральний плановий комітет зайвих зусиль."
 MGN.81.a: "Наказати ретельне розслідування."
 MGN.81.b: "НКВД сам очиститься від дисидентів."

 MGN.82.t: "Розслідування лояльности"
 MGN.82.desc: "Розслідування було швидким, і недарма. Схоже, нелояльність притаманна майже кожному членові НКВД: кожен має якісь зрадницькі погляди про працю товариша Лисенка чи устрій нашого суспільства. Хоч ми не можемо очистити всю організацію... Поки що. Мусимо продемонструвати владу й зробити з когось у НКВД приклад. НКВД не звикати переслідувати невинних, тож вони зрозуміють. Лишається тільки вирішити, яку групу обрати ціллю:"
 MGN.82.a: "Стара гвардія пхає носа не у свої справи."
 MGN.82.b: "Нехай нова кров пройде хрещення вогнем."
 MGN.82.c: "Розстріляти кількох іноземних охоронців."
 MGN.82.d: "Оприлюднити заяву про виправдання гвардії."

 MGN.83.t: "Безлюдні застави"
 MGN.83.desc: "Недавній патруль, який повертав загублених суб'єктів, ішов одним із рідше використовуваних шляхів доступу й виявив там цілком безлюдний контрольно-пропускний пункт. Жодних ознак стороннього втручання не було, не було слідів боротьби, а більшість дверей була замкнена: призначений особовий склад просто зник. Після кількох запитів до НКВД з'ясувалося, що приписані до цієї місцевости війська просто самі себе «перевели»! НКВД перешкоджає подальшому розслідуванню, тож, схоже, ми ніколи не дізнаємося, ким були ті люди й хто ними командував. Проте цей випадок ще раз підкреслив зростання нелояльности в НКВД, і треба діяти, поки все не вийшло з-під контролю."
 MGN.83.a: "Вимагати показового покарання й улаштувати страти."
 MGN.83.b: "НКВД сам із цим розбереться."
 MGN.83.c: "Організувати створення нової служби безпеки, подробиці згодом."

 MGN.84.t: "Переворот"
 MGN.84.desc: "Раніше товариша Лисенка, без жодної поваги до чітко встановленого протоколу чи звичайної люб'язности, грубо перервали агенти НКВД й командири 22-ї мотострілецької дивізії НКВД. Стєпан Бунков, командир 22-ї, наказав товаришеві Лисенку сісти, а його супровід закувати в кайдани; на протести товариша агенти відповіли виконанням Бункових наказів. Товариш генерал-лейтенант Бунков зачитав перелік звинувачень проти товариша Лисенка, зокрема численні злочини проти людяности й зраду давно загиблого Совєцького Союзу. Крім того, він перелічив вимоги НКВД щодо збереження статус-кво - майже нездійсненні умови, які фактично позбавляли товариша Лисенка можливости проводити дослідження чи віддавати накази будь-кому поза своїм найближчим оточенням. Товариш генерал-лейтенант Бунков відірвав погляд від паперу й зустрів напружений, сповнений ненависти погляд товариша Лисенка. Товариш Лисенко мав лише кілька митей, щоб розрядити ситуацію."
 MGN.84.a: "Їхні скарги обґрунтовані, їх треба прийняти."
 MGN.84.c: "Хто сміє постати проти Володаря Чорної Гори? Негайно вигнати цих зрадників."

 MGN.85.t: "Суд над маґнітоґорським божевільним"
 MGN.85.desc: "Пояснення товариша Лисенка й вимоги усунути всіх, хто виступав проти нього, проігнорували, а самого божевільного побили під час затримання. Звістку про арешт товариша Лисенка оприлюднили: НКВД мужньо усунув деспота від влади, ризикуючи власними життями, однак народ запевнили, що суд над ним - серйозна справа й під час збирання всіх доказів не можна припуститися помилки. Хунта НКВД не мала жодних сумнівів щодо долі товариша Лисенка; їм не були потрібні ані вибите побоями зізнання, ані катування цієї істоти, хай якими виправданими вони були б. Ні, НКВД просто хотів, щоб чудовисько зникло й здохло в канаві; тисячам загиблих з його вини було байдуже до фальшивої подоби суду. Його страта справді стала б справедливим і шляхетним учинком, можливо першим, який НКВД здійснить за десятиліття. Після короткого обговорення остаточну відповідальність за страту передали товаришеві-комісару Смородінскому, який протягом години зібрав розстрільну команду.\n\nТрохима Лисенка витягли на холодне, безмовне подвір'я в'язниці. Він без упину бурмотів крізь мішок на голові, на якому наполягла розстрільна команда, що боялася божевільних очей чудовиська. Без зайвих церемоній головний офіцер швидко перелічив злочини Трохима Лисенка й кару, призначену Перехідною радою. Закінчивши, він кивнув п'ятьом чоловікам перед собою й дозволив стріляти. Маґнітоґорський божевільний Трохим Лисенко завив, почувши вирок, але замовк, коли п'ять точних пострілів розстрільної команди пронизали його тіло. Один зі стрільців плюнув у бік безживного трупа, що звисав зі стовпа, востаннє прощаючись із безумцем, який завдав стільки шкоди всім на своєму шляху."
 MGN.85.a: "У світі стало на одне чудовисько менше."
 MGN.85.a.tt: "Коли Лисенка немає, а НКВД при владі, менша частка бюджету потрібна на §Oдослідницькі витрати§!."

 MGN.90.t: "Комюніке 206.a"
 MGN.90.desc: "Як докладно зазначено в попередньому комюніке, учора о 16:11 п'ять (5) офіцерів НКВД не з'явилися на посту й оголошені зниклими. Зростання кількости таких випадків створило потребу в дієвішій силі для забезпечення особистої безпеки ключового дослідницького персоналу. Кількох суб'єктів випробували на придатність до такої суворої бойової ролі. (Див. долучені звіти від 11.a до 46.c.) Суб'єкти не пройшли випробування. (Див. долучені настанови з утилізації 228.5.b.) Такий підрозділ можна сформувати з добровольців серед наявного бойового персоналу.\n\nПризначення цього підрозділу спричинило значні дебати, які мають завершитися сьогодні. Подано такі варіянти: A.) Дозволити створення невеликої особистої охорони головного науковця Т. Лисенка, щоб гарантувати продовження життєво важливих досліджень навіть у разі катастрофічної втрати персоналу чи недобровільного усунення. B.) Дозволити створення особистої охорони для всього головного дослідницького персоналу, щоб зберегти здатність проводити дослідження під зовнішнім тиском. C.) Застосувати проти НКВД заходи примусового скорочення, дозволити новоствореному органові виконувати їхні функції та почати обробку кількох сотень нових суб'єктів.\n\nНовий матеріал, доступний станом на сьогодні, наведено нижче:\n\n5 СУБ'ЄКТІВ - ЧОЛОВІКИ\n\n5 СУБ'ЄКТІВ - ЖІНКИ\n\n2 СУБ'ЄКТИ - ДІТИ\n\n5 ОФІЦЕРСЬКИХ ОДНОСТРОЇВ"
 MGN.90.a: "Товариша Лисенка треба захистити."
 MGN.90.a.tt: "Це дасть нам змогу оцінити лояльність НКВД."
 MGN.90.b: "Ключовий дослідницький персонал потрібен для продовження наукових програм."
 MGN.90.c: "НКВД зайвий."
 MGN.90.c.tt: "Лишається сподіватися, що НКВД про це не довідається..."
 MGN.90.c.a.tt: "НКВД довідується..."
 MGN.90.c.b.tt: "Заміна вдається."

 MGN.100.t: "Промова про промислову продуктивність"
 MGN.100.desc: "Промова товариша Лисенка на Щорічному саміті промислової продуктивности, -ДАТУ ЗАСЕКРЕЧЕНО-. -МІСЦЕ ЗАСЕКРЕЧЕНО-. Дані підтверджено Комітетом промислових досліджень, укладено за роками - див. том 13, додаток 15.e.vii.\n\n«...зростання продуктивности видобутку до 250 тонн сталі на місяць. Це становить загальне збільшення на 750 тонн сталі за три місяці, розподілене між 33 шахтами на підконтрольній території. Дослідницький комітет і пов'язані з ним організації цінують це зростання, дякують усім причетним і сподіваються надалі побачити пропорційне зростання виробничої активности».\n\n«Комітет також фіксує зростання активности у сфері промислового виробництва. На південний-південний схід від Центрального комплексу Маґнітоґорска відкривається Об'єкт промислової оптимізації, адресу якого наведено в Державних адміністративних записах, том 7... так, Фьодоре, мені відомо про незвичну нестачу часу. Комплексом керуватиме головний актив цивільного виробництва, особа 47530298, цивільне ім'я Дмітрій Ворошилов. Комітет очікує найбільшого можливого зростання обсягу роботи, виконуваної цивільними виробничими активами. Усі бригади треба організувати в групи по чотири особи й підпорядкувати старшому робітникові, який своєю чергою звітуватиме керівникові фабрики. Пам'ятки про організацію фабрики див. на стор. 7 ваших брошур».\n\n«Переходимо до завершальних зауважень. Ми відзначаємо, що цього кварталу кількість смертей, пов'язаних із забрудненням, зросла на 23.75 відсотка. Очікуємо, що зі зростанням промислової концентрації ці показники далі збільшуватимуться. Зростає також кількість смертей на робочому місці; слід зазначити, що 43.95 відсотка таких смертей пов'язані з утратою кисти чи кінцівки. Графіки смертности й можливості для подальших досліджень див. на останній сторінці ваших брошур»."
 MGN.100.a: "«Таке зростання відповідає нашим прогнозам»."

 MGN.101.t: "УРИВОК ІЗ ПРОМОВИ 7.bc"
 MGN.101.desc: "Товариш Лисенко виступив на щорічному «офіцерському бенкеті» (прийом їжі 289. Див. календар особливих прийомів їжі в календарі прийомів їжі. Для докладнішої інформації зверніться до підкомітету громадського харчування Офіцерської організації). Нижче наведено стенограму.\n\n«Товариші. Я говорю з вами про питання регіонального значення для безпеки Маґнітоґорска. Нещодавно я почув чутки про заворушення проти мого надзвичайного генерального секретарства. І як законний член совєтів, що нині утворюють нашу державу в процесі відбудови, я не дозволю такої зрадницької поведінки в межах нашої республіки, як не дозволять її мої співвітчизники. Сьогодні, товариші, чоловіки й жінки, що присягнули Марксові, я закликаю вас вийти вперед. Я закликаю стати поруч зі мною, поки я очищаю нас від людей, які задумали знищити наше утопічне суспільство науки. Тим, хто бажає заплямувати нашу спадщину, не буде місця в нашому суспільстві. Тим, хто бажає знищити наш спосіб життя, не буде місця в нашому суспільстві. Ми мусимо позбутися цих наукових боягузів, цих релігійних потвор.».\n\nКІНЕЦЬ УРИВКА\n\nОдразу після описаної вище промови Лисенко утилізував кількох високопосадовців (див. процедури утилізації тіл у довіднику утилізації тіл або зверніться до підкомітету утилізації тіл). Кількох перевели до нового статусу суб'єктів у різних експериментах (документацію див. у підкомітеті перетворення на суб'єктів)."
 MGN.101.a: "УРИВОК ІЗ ПРОМОВИ 7.bc ЗАВЕРШЕНО"

 MGN.102.t: "Планування озброєння"
 MGN.102.desc: "Одна з найбільших слабкостей нашої армії - нестача спорядження й боєприпасів для війни з Уральською Лігою та Комуною Орєнбурґа. До цього додається той факт, що ми взагалі мусимо просити допомоги в бандитів із бригади Дірлеванґера. Для гордого науковця це стало цілковитою ганьбою. Напередодні війни командири НКВД разом із Лисенком розробили План озброєння C як новий план на додачу до суворо засекречених планів A і B.\n\nНа відміну від попередніх, План озброєння C повідомлять усім солдатам, щоб вони могли працювати разом. План C забезпечить, щоб кожен солдат НКВД умів не лише стріляти зі своєї зброї, а й виготовляти власну, аби наша армія стала найкращою на Південному Уралі. Кожен батальйон буде зобов'язаний спільно працювати над виготовленням зброї. Лисенко прагне не лише створити найкращих солдатів, а й якнайміцніше бойове товариство та зміцнити ефективність спільною працею в дусі ідеальної совєцької колективности.\n\nОднак плани озброєння A і B будуть головними планами Лисенка, про які знатимуть лише найвищі офіцери НКВД. Він зажадав, щоб кожного офіцера, який порушить режим секретности й допустить витік цих планів, після відрізання язика піддали експериментам, а потім стратили за зраду. На думку Лисенка, все мусить відбуватися за планом, інакше моральний дух держави впаде."
 MGN.102.a: "План C - оптимальний вибір."

 MGN.103.t: "Комітет планування виробництва припасів"
 MGN.103.desc: "Зміни були такою примхливою річчю, особливо в технократичному царстві Лисенка та його оточення. Наче від одного дня до іншого перевтомлені й скривджені фабричні трутні, які живили маленьку імперію науковця, побачили цілковиту реорганізацію та перебудову і себе, і капіталу совєцької доби, з яким працювали. Нові настанови, правила, положення. Геть марнотратство, геть зайві перерви, геть невмілу логістику.\n\nРаптові нові накази колишніх охоронців НКВД змушували їх працювати в умовах, гірших за будь-які страшні казки про давні часи імператорів і царів, яку їм оповідали біля дитячого ліжка. Коли одній хвилі робітників дозволяли піти додому після завершення виснажливої зміни, на її місце приводили іншу з похмурими, зламаними обличчями. Густий канцерогенний смог, який тепер не відступав від міста жодної пори дня, також починав даватися взнаки. Дехто міркував, чи саме так почуваються ті, кого експлуатують німці, але висловлення такої думки забезпечило б квиток в один кінець до гірського комплексу, заради якого всі вони працювали. Цю велику перебудову промисловости, що стала життєво необхідною для його роботи, задумав зловісний технократ, який правив майже як великі диктатори Заходу, пересуваючи населення наче дрібні шахові фігури й вичавлюючи з них якнайбільшу можливу цінність.\n\nЗ величезної кількости колишніх науковців, яких Лисенко привів із собою до Маґнітоґорска, тепер обрали невелику, дієву меншість для керівництва Комітетом планування виробництва припасів. Ці фахівці з управління та промисловости докорінно перетворювали промислове виробництво досі зруйнованого міста з його численними фабриками й заводами, щоб усі необхідні чинники виробництва їхньої незбалансованої економіки - земля, капітал і передусім праця - використовувалися якнайповніше. Якою б не була ціна, колишню совєцьку інтеліґенцію цікавили лише новації та прогрес."
 MGN.103.a: "Ефективність має вирішальне значення."

 MGN.104.t: "Програма бойової підготовки"
 MGN.104.desc: "Комюніке 198.b\n\nВище командування розпочало перебудову програм підготовки. Програми універсальної підготовки поліпшать бойову ефективність у:\n\n--гірських умовах\n\n--міських умовах\n\n--лісових умовах.\n\nКошти негайно переказати Чєрнібєвскому. Бойові групи буде реорганізовано й перевишколено за 10 днів. Про всі смерті під час бойової підготовки повідомляти Підкомітетові нещасних випадків під час військової підготовки. Докладнішу інформацію про навчальні травми див. у Підкомітеті воєнних нещасних випадків. Нові методи підготовки для підвищення ефективности вояків див. у недавній записці 211.63. Інформацію про бій у гірській місцевості див. у Довіднику гірського бою. Інформацію про бій у міській місцевості див. у Довіднику міської війни. Інформацію про бій у лісистій місцевості див. у Довіднику лісового бою."
 MGN.104.a: "Наші солдати мусять бути готові до всього."

 MGN.105.t: "Інтеграція озброєння у війська"
 MGN.105.desc: "Комюніке 289.b\n\nУ зв'язку з недавніми скаргами на нещасні випадки під час використання погано обслуговуваної зброї (особливо Karabiner 98k і варіянтів Мосіна-Наґана), а також занедбаних гранат та іншої вибухівки, виготовленої до Великої Вітчизняної війни, буде вжито нових заходів. Якнайшвидше розпочнеться нова програма підготовки під назвою «Режим підготовки примусової інтеграції озброєння» (Р.П.П.І.О.), яка навчатиме бойовий персонал роботі й належному обслуговуванню зброї не лише маґнітоґорського виробництва. Перелік гвинтівок, виготовлених до Великої Вітчизняної війни, див. у Довіднику стрілецької зброї. Військам видадуть гвинтівки й вибухові пристрої, виготовлені поза Маґнітоґорском. Їх навчатимуть:\n\n--основних і додаткових способів застосування зазначеної стрілецької зброї;\n--експлуатації й обслуговування зазначеної стрілецької зброї;\n--типів боєприпасів і використання цієї стрілецької зброї.\n\nДля докладнішої інформації та запитів про нову програму звертайтеся до Під-підкомітету бойової готовности й застосування нетрадиційної зброї у збройному конфлікті. Інформацію про мобілізацію державних ресурсів для виробництва нетрадиційної зброї див. у Цивільному управлінні національної готовности."
 MGN.105.a: "Мусимо використовувати все."
 
 MGN.106.t: "Режим підготовки методів вилучення"
 MGN.106.desc: "Комюніке 354.c\n\nНедавні події у низці сіл і поселень (додаткову інформацію див. у додатку на стор. 45) призвели до загибелі приблизно 14 цивільних, поранення 28 цивільних і загибелі двох (2) вояків.\n\nОдразу після входу вояків до поселення №87 (див. додаток на стор. 45) цивільні суб'єкти зібрали саморобну зброю (зокрема, але не лише:\n\n--кремінний мушкет\n--вила\n--шашку зразка бл. 1918 року\n--різницький ніж\n--чавунні каструлі та сковорідки)\n\nі здійснили неорганізований напад на вояків. Під час нападу двоє (2) вояків загинули: перший від ножового поранення у верхню частину грудей, другий від тупої травми голови. Унаслідок дій вояків із самооборони загинули 14 цивільних і поранення 28 цивільних. Потім тіла цивільних спалили у великій могилі (додаткову інформацію див. у додатку на стор. 46). Скарги, подані до підкомітету смертей під час вилучення, привели до спільних зусиль із Комітетом готовности нації задля розв'язання цієї проблеми й запобігання подальшим випадкам. Нова навчальна програма під назвою «Координаційна група вилучення суб'єктів» (К.Г.В.С.) запровадить новий вишкіл, призначений підвищити ефективність вояків під час вилучення суб'єктів і зменшити втрати серед суб'єктів (додаткову інформацію див. у додатку на стор. 34)."
 MGN.106.a: "Суб'єкти життєво важливі для нашої роботи."
 
 MGN.107.t: "Комюніке 354.C завершено"
 MGN.107.desc: "Усі командири 22-ї мотострілецької дивізії та пов'язаних допоміжних сил мусять негайно змінити режими підготовки відповідно до вимог цього документа. Це забезпечить ідеологічну, фізичну й генетичну вищість наших майбутніх солдатів. Зміни приведуть режим підготовки дивізії у відповідність до того, який застосовував Совєцький Союз до Великої Вітчизняної війни, з певними поправками для врахування нових відкриттів товариша Лисенка.\n\nУся піхота під час підготовки мусить не менш як два місяці вивчати належні бойові процедури. Із цих двох місяців два тижні слід присвятити підготовці з використання сучасної зброї. Це має запобігти новим випадкам, коли погано навчені війська неправильно поводяться з цінним військовим спорядженням і пошкоджують його.\n\nУсі польові офіцери мають пройти додатковий місяць підготовки з командування солдатами в різноманітних бойових і небойових ситуаціях. Теми охоплюватимуть керування набігами, реквізицію суб'єктів, розвідку невідомої території, оборону дослідницьких об'єктів та інші питання, які буде докладно описано в наступних комюніке.\n\nСуб'єкти, призначені для бойової підготовки, проходитимуть новий режим поряд з усіма поточними експериментами, у яких беруть участь. Якщо вимоги експерименту суперечать частині стандартного режиму підготовки, перевагу має експеримент. Це стосується позбавлення суб'єктів життєво необхідного, видачі їм прототипної зброї та примусового спарювання суб'єктів, що проходять підготовку.\n\nПольовим офіцерам тепер дозволено застосовувати смертну кару, якщо вони вважатимуть це необхідним. До порушень, гідних смертної кари, належать, серед іншого, залишення поста, непокора наказові старшого офіцера, порушення цілісности експерименту й поширення боягузтва чи нелояльности серед особового складу. Про кожен випадок смертної кари треба повідомляти, а легковажне її застосування може призвести до пониження чи переведення."
 MGN.107.a: "Союз упав не через їхню тактику."
 
 MGN.108.t: "Ворог наших ворогів"
 MGN.108.desc: "За допомогою 22-ї мотострілецької дивізії Лисенко проводить життєво важливі дослідження примусової адаптації та еволюції людського геному, використовуючи ресурси Маґнітоґорського регіону. Це дослідження визнано життєво важливим для відвоювання нашої розгромленої Батьківщини. Уральська гвардія прикро перешкоджає нашій роботі, заважаючи реквізиційним групам вилучати потрібних суб'єктів. Щоб життєво важливі експерименти тривали за розкладом, цю перешкоду треба усунути.\n\n22-га мотострілецька дивізія має краще спорядження, ніж гвардія, але прогностичні навчання свідчать, що наших сил недостатньо для тривалого наступу проти Уральської Ліги. Один із можливих способів збільшити чисельність доступних військ - дипломатія. Якщо обрати цей шлях, найімовірнішим розв'язанням видається союз із бригадою Дірлеванґера. Бригада вкрай недисциплінована й непередбачувана, однак чисельно переважає всі інші сили регіону. Особливо за підтримки наших підрозділів у неї має вистачити людей для розгрому Уральської Ліги. Розвідка повідомляє, що головна мета Дірлеванґера - пограбувати Орєнбурґ, але переслідування Уральською гвардією заважає йому це зробити. Знищення Уральської Ліги буде взаємовигідним для обох сторін.\n\nЯкщо цей напрям небажаний, є альтернатива. Лисенко вважає, що живими Дірлеванґер і його люди стали б цікавими суб'єктами. Експерименти над ними могли б дати чимало цінної інформації. Ми можемо під оманливим приводом заманити Дірлеванґера у вразливе становище й схопити, коли він утратить пильність."
 MGN.108.a: "Запросити німця, але пильно стежити."
 MGN.108.b: "Заманити паразита, а тоді вдарити!"
 MGN.108.c: "Ми не працюємо з покидьками!"
 
 MGN.109.t: "Дипломатичне комюніке 337.g.iv"
 MGN.109.desc: "Звіт із дипломатичного об'єкта, статус секретности 3A: несанкціонований доступ карається утилізацією порушників та їхніх родин.\n\nДослідницька група Ініціятиви стратегічних досліджень рекомендує встановити матеріально-дипломатичні зв'язки з -ЗАСЕКРЕЧЕНО-. Дослідження, узагальнене в додатку 12.b.ii, показує головні риси -ЗАСЕКРЕЧЕНО-: активи переважно військові; постійної цивільної інфраструктури майже не виявлено. Поточне дослідження свідчить, що наші передові промислові об'єкти є потужним активом; вище керівництво -ЗАСЕКРЕЧЕНО- вважає боєприпаси, припаси та озброєння найважливішими, і їх можна постачати через наші складні виробничі ланцюги в обмін на територіяльну лояльність.\n\nІмовірні прогнози наших зусиль у сфері матеріального обміну та дипломатичної лояльности відстежує дослідницька група довгострокових дипломатичних зусиль, а відповідні звіти зараз укладаються. (Примітка редактора: укладено й зареєстровано як додаток 15.g.vii.)\n\nДо табору -ЗАСЕКРЕЧЕНО-, який вважають головним осередком військово-економічної діяльности та об'єктом стратегічного планування середньої ваги, надіслано посланця -ЗАСЕКРЕЧЕНО- у супроводі одного (1) охоронця й трьох (3) комісарів. Керівника безпеки -ЗАСЕКРЕЧЕНО- повідомлено про протокол 907B щодо методів захисту інформації у випадку ворожого полону. Неозброєну ціль, тобто посланця -ЗАСЕКРЕЧЕНО-, треба ліквідувати першою, потім охоронців, після чого решта персоналу має здійснити самоліквідацію всією доступною зброєю. Протокол також поширюється на персонал, що намагається втекти.\n\nКомітет очікує позитивних результатів."
 MGN.109.a: "Використати здобуті матеріали в майбутніх експедиціях."
 MGN.109.b: "Не створювати нових дипломатичних каналів до завершення подальших експедицій."
 
 MGN.110.t: "Люди з Маґнітоґорска"
 MGN.110.desc: "Його люциферова величність, оберфюрер Оскар Дірлеванґер, зручно сидів на троні. Він із радістю читав про те, як його хоробрі бандити під час служби чинили блювотно огидні збочення. Попри невпинний потік звітів Дірлеванґер не переставав насолоджуватися стражданнями своїх підданих. Оберфюрер чекав, почувши чутки про прибуття кінного посланця. Раптом у залі оберфюрера прогримів страшенний гуркіт: величні дубові двері завмерли біля стін, укритих черепами. Двоє постарілих, розпатланих чоловіків у зношених одностроях Ваффен-СС грубо волокли кам'яною підлогою іншого чоловіка до «короля бандитів».\n\nДвоє чоловіків різко припинили знущатися з нещасного добродія й стали по обидва боки трону короля бандитів у захисних позах. Вони явно були готові будь-якої миті жорстоко побити «гостя». Тремтливий посланець повільно підвівся й назвався представником Лисенка. Потім дістав акуратно запечатаного конверта. Простягаючи послання Дірлеванґерові, він не міг спинити тремтіння рук. Дірлеванґер миттю вихопив конверт, змусивши чоловіка відсахнутися й скривитися від страху. Король бандитів розірвав конверт, відкривши його вміст - звичайний лист. Лише паршивий жалюгідний лист. Попри безпідставну лють він почав вивчати зміст, написаний помітно технічною мовою. Дірлеванґер почав читати, тоді зупинився, глянув на посланця й загрозливо вишкірився. Нарешті він вибухнув нападом божевільного нестримного сміху. Посланець приголомшено дивився на Дірлеванґера, який знаком наказав охоронцям вивести чоловіка із зали.\n\nЗа кілька годин король бандитів скликав найближчих товаришів вирішити, що робити з пропозицією Лисенка. Вони сварилися й кепкували, обмінювалися докладними оповідями про зґвалтування та грабунки й без міри пили криваво-червоне вино з бляшаних келихів. Зрештою пропозиція Лисенка знову спливла в розмові. Тепер уже добряче п'яне найближче коло Дірлеванґера агресивно сперечалося про угоду. На перший погляд пропозиція видавалася вигідною. Лисенко пропонував бригаді Дірлеванґера можливий доступ до промислових об'єктів Маґнітоґорска й додаткову обіцянку постачати за потреби озброєння та боєприпаси. Дебати тривали до раннього ранку; після подальшого пияцтва й довгої розмови про варварство Дірлеванґер і його товариші нарешті вирішили, приймати чи відхиляти союз із Лисенком..."
 MGN.110.a: "Їхні ресурси допоможуть нам нападати далі й краще."
 MGN.110.b: "Ми не «домовляємося». Ми забираємо."
 
 MGN.111.t: "КОМЮНІКЕ 72.a"
 MGN.111.desc: "Дипломатична місія до бандитського угруповання «бригада Дірлеванґера» виявилася успішною. Через непередбачуваність Оскара Дірлеванґера ймовірність успіху оцінювали лише в 50%, але товариш Лисенко мудро визнав ризик доречним. Представника бригади Дірлеванґера, особу -ЗАСЕКРЕЧЕНО-, надіслали в погано обслуговуваній вантажівці, так само як і нашого. Зазначено, що така поведінка зумовлена відсутністю в «бригади Дірлеванґера» дипломатичної історії. Лист про згоду від «бригади Дірлеванґера» був написаний у дивний спосіб - схоже, на звороті листа товариша Лисенка. Почерк разюче відповідає даним досліджень поведінки людей у стані сп'яніння. Хай там як, їх використають як знаряддя для знищення Уральської Ліги. Такий результат безперечно буде вигідним і товаришеві Лисенку, і ватажкові бандитів Оскару Дірлеванґеру. Невдовзі почнуться переговори про зброю та спільну тактику."
 MGN.111.a: "КОМЮНІКЕ 72.a ЗАВЕРШЕНО. Потрібна подальша редакція"
 
 MGN.112.t: "КОМЮНІКЕ 72.a"
 MGN.112.desc: "Дипломатична місія до бандитського угруповання Оскара Дірлеванґера (надалі «бригада Дірлеванґера») завершилася провалом. За повідомленнями, відрубану голову -ЗАСЕКРЕЧЕНО-, дипломата, відрядженого до «бригади Дірлеванґера» (див. долучені анатомічну схему й розтин), жбурнули в посланця Групи вилучення 12, коли та прямувала вилучати суб'єктів у місцевого данника. Група вилучення негайно повернулася до Чорної Гори, щоб доставити голову -ЗАСЕКРЕЧЕНО- на огляд товаришеві Лисенку; присутні визнали це відхилення прийнятним після пояснення причини негайного повернення. Хоч відмова «бригади Дірлеванґера» від взаємовигідного пакту прикра, усіх службовців товариша Лисенка запевнили, що «бригада Дірлеванґера» була лише корисною, а не необхідною для подальшої безпеки Совєцького Союзу. Перевага совєцької волі здолає Уральську гвардію й без ненадійної допомоги «бригади Дірлеванґера»."
 MGN.112.a: "КОМЮНІКЕ 72.a ЗАВЕРШЕНО"
 
 MGN.113.t: "КОМЮНІКЕ 72.a"
 MGN.113.desc: "Дослідницька місія, замаскована під дипломатичні зусилля щодо бандитського угруповання Оскара Дірлеванґера (надалі «бригада Дірлеванґера»), завершилася успіхом. Наш головний польовий дослідник -ЗАСЕКРЕЧЕНО- доставив особисто написаного товаришем Лисенком листа самому Оскарові Дірлеванґеру. У листі товариша Лисенка вдало застосовано методи переконання та лестощів (докладнішу інформацію про використані методи див. на стор. 52-89 про переконання та лестощі в довіднику шпигунства), щоб замаскувати будь-які ознаки нинішніх планів викрасти Оскара Дірлеванґера та його банду для дослідницьких цілей. «Бригада Дірлеванґера» надіслала посланця у відповідь, відомого як -ЗАСЕКРЕЧЕНО-, щоб підтвердити згоду на співпрацю з нашими силами.\n\nПосланцеві негайно наказали повернутися до Оскара Дірлеванґера з другим листом, також написаним товаришем Лисенком, і повідомити місце особистої зустрічі нібито для обміну зброєю, обговорення тактики й норм використання технологічних об'єктів Чорної Гори. Оскар Дірлеванґер не знає про негайний наказ товариша Лисенка облаштувати позиції для швидкого захоплення й вилучення самого Дірлеванґера та всіх, кого він забажає взяти із собою. Імовірність успішного захоплення Оскара Дірлеванґера цим маневром зросла до високих 72.4%. Після поширення цього публічного комюніке розпочнеться підготовка до захоплення."
 MGN.113.a: "Прощавай, Дірлеванґере."
 
 MGN.114.t: "КОМЮНІКЕ 73.a"
 MGN.114.desc: "ЧЕРЕЗ НЕСПОДІВАНІ РЕЗУЛЬТАТИ КОМІТЕТ НАДАВ НАВЕДЕНИМ ДАЛІ ТЕКСТАМ РІВЕНЬ СЕКРЕТНОСТИ 2A\n\nУСІХ НЕУПОВНОВАЖЕНИХ ОСІБ, ЯКІ ОТРИМАЛИ ДОСТУП ДО ЦЬОГО ЗВІТУ, НАЛЕЖИТЬ ЛІКВІДУВАТИ\n\nТривалі зусилля посланця -ЗАСЕКРЕЧЕНО- та військових сил із захоплення цілі на ім'я Оскар Дірлеванґер (див. «Підсумок досліджень» і «Зведений стратегічний огляд Оскара Дірлеванґера», архіви Комітету) дали неоднозначні результати. Самого Дірлеванґера вдалося заманити до вказаного в попередніх комюніке місця. Однак він уникнув захоплення наявними на місці військовими силами, переліченими в додатку 27.b.ii, а його люди, схоже, розсіялися способами, знайомими старшим військовим радникам. Останнє спостереження вказує, що способи ухилення відповідають тактиці, яку використовують у підготовці ветеранів бригади Дірлеванґера. Спроможність наших нинішніх оперативних сил захопити Дірлеванґера знизилася на 43 відсотки.\n\nПосланця -ЗАСЕКРЕЧЕНО- ліквідовано відповідно до протоколу 569E щодо персоналу, який володіє потенційно компрометувальними доказами про секретні внутрішні військові операції. Комітет особисто подав запит на його ліквідацію через нездатність успішно провести дипломатичні заходи.\n\nПопри це, перед нами постають значні стратегічні можливості. На території Дірлеванґера помічено істотне скорочення військової активности та зосередження сил (див. стратегічний звіт 3.c.iv), а військові сили, зазначені в документі -ЗАСЕКРЕЧЕНО ЗА ДИРЕКТИВАМИ НКВД-, готові до дій і захоплення території. Крім того, тривають спроби захопити самого Дірлеванґера, чия оцінена ймовірність пережити понад 48 годин безперервного переслідування становить 7 відсотків. Комітет очікує подальших даних."
 MGN.114.a: "Непередбачений розвиток подій. КОМЮНІКЕ 73.a ЗАВЕРШЕНО"
 
 MGN.115.t: "КОМЮНІКЕ 73.a"
 MGN.115.desc: "ЧЕРЕЗ ОПЕРАЦІЙНИЙ ПРОВАЛ ЦЕЙ ДОКУМЕНТ НЕ МОЖНА РОЗГОЛОШУВАТИ НІКОМУ, КОМУ ЙОГО НЕ ВРУЧЕНО ОСОБИСТО. ПОРУШЕННЯ ОПЕРАЦІЙНОЇ ЦІЛІСНОСТИ КАРАТИМЕТЬСЯ ЛІКВІДАЦІЄЮ.\n\nВикрадення Оскара Дірлеванґера та його «бригади Дірлеванґера» завершилося провалом відповідно до початкових параметрів місії. Оскар Дірлеванґер прийняв пропозицію товариша Лисенка особисто зустрітися нібито зі стратегічною метою, тоді як оперативна група 12 готувала засідку. Дірлеванґер і двадцять його солдатів прибули на зустріч із товаришем Лисенком колоною. Після прибуття вони висловили підозру щодо місцеперебування товариша Лисенка. Товариш Лисенко не з'явився через значний ризик цієї операції. Попри це, Оскар Дірлеванґер рушив до місця зустрічі й зупинився з відхиленням у 4.2% від запланованої точки. Коли Дірлеванґерові повідомили, що товариш Лисенко не прибуде, він негайно почав готувати відхід.\n\nСхоже, Групі вилучення 12 забракло вміння належно підготуватися до такого розвитку подій, бо вона з надмірним поспіхом рушила викрадати Дірлеванґера. Група викрила себе надто рано своїм пересуванням, що спричинило перестрілку між «бригадою Дірлеванґера» та Групою вилучення 12. Сімнадцять членів «бригади Дірлеванґера» втекли; кількість втрат наразі невідома. Самого Дірлеванґера чотири рази поранили в груди (див. долучену коротку довідку про розтин), від чого він невдовзі помер. Хоч це напевно призведе до розпаду «бригади Дірлеванґера» (див. «Оцінку стабільности бригади Дірлеванґера», абзац 3), членів Групи вилучення 12 належить негайно ліквідувати за повний провал місії. Сімнадцять утікачів можуть згуртуватися для нападу з помсти на товариша Лисенка, тому кількість патрулів уздовж південно-західного кордону треба подвоїти."
 MGN.115.a: "КОМЮНІКЕ 73.a ЗАВЕРШЕНО"
 
 MGN.116.t: "КОМЮНІКЕ 74.a"
 MGN.116.desc: "НЕ ДЛЯ СТОРОННІХ ОЧЕЙ.\n\nРІВЕНЬ СЕКРЕТНОСТИ a.\n\nГрупи вилучення та збору суб'єктів увійшли на об'єкт приблизно о 00:45. Вони успішно затримали непритомних бандитів у конференційній залі та вестибюлі будівлі (докладнішу інформацію див. у зведенні типів приміщень у «Компендіумі архітектури», стор. 67-89), після чого рушили до спальних приміщень. Під час покімнатного обшуку знайшли всіх інших бандитів - членів бандитського угруповання Дірлеванґера. Більшість із них (приблизно 36 (тридцять шість)) були непритомні, коли групи їх знайшли, тож їх без проблем зв'язали й доправили до транспортних вантажівок. П'ятеро (5) бандитів на час виявлення ще зберігали достатньо свідомости, щоб спробувати чинити опір, і їх ліквідували на місці. Надмірне споживання алкоголю та заспокійливих дієво знешкодило бандитів, завдяки чому групи збору менш ніж за десять хвилин захопили всі цілі, крім Дірлеванґера.\n\nКоли Дірлеванґера знайшли в його кімнаті, він був роздягнений і погрожував мисливським ножем одному із суб'єктів, якого привели відвертати увагу. Група збору швидко роззброїла й зв'язала його, особливо дбаючи, щоб не завдати головній цілі надмірної фізичної шкоди. Його також швидко доправили до транспортних вантажівок; після успішної доставки місію завершили, а вантажівки повезли свій вантаж до Чорної Гори.\n\nКолишнього бандитського короля Росії доставлено до особистої лабораторії товариша Лисенка, який уже запланував кілька експериментів, розроблених спеціально для Дірлеванґера."
 MGN.116.a: "Схоже, він ще стане в пригоді. Решту вбити"
 
 MGN.117.t: "Хартія укріплень"
 MGN.117.desc: "ПУБЛІЧНЕ КОМЮНІКЕ 488.d\nПОПЕРЕДЖЕННЯ. НЕОФІЦІЙНА МОВА. З канцелярії Лисенка.\nТекст записки:\n\n«Оскільки вороги підступають до нашої держави, а національна безпека опинилася під загрозою, я оголошую Хартію укріплень. Це низка планів і проєктів, створених мною та провідними маґнітоґорськими фахівцями з фортифікації, покликана зробити нашу державу неприступною, а людей - захищеними. Програма передбачає спорудження нової мережі довготривалих вогневих точок, арсеналів і традиційних бункерів уздовж кордонів та у стратегічних місцях. Обмежені кошти буде перенаправлено з наукових заходів (зокрема програми SIBLING 2b і програми HUN 3e), а також із військових заходів (зокрема програми ARTILLERY ADVANCEMENT 6h і програми CHEMICAL TESTING 3b). Оборона держави й народу має першорядне значення».\n\nЛисенко наказав усім генералам Вищого командування прибути на нараду §RЗАСЕКРЕЧЕНО§!."
 MGN.117.a: "ПУБЛІЧНЕ КОМЮНІКЕ 488.d ЗАВЕРШЕНО"
 
 MGN.118.t: "Суперсолдати"
 MGN.118.desc: "У нашій роботі цінується об'єктивність, а за особливих обставин вона особливо необхідна. Тому слід визнати, що в нашій роботі помічено тривалі проблеми. Вилучення ресурсів і виробництво падають, попри інтенсивні методи збору та примусу, запроваджені на провінційному рівні. Докладніше див. у додатку 13.b.ii.\n\nЗвіти підрозділів, розташованих у Маґнітоґорску, свідчать, що людський капітал, зокрема, експлуатують понад межу витривалости, а політика, оптимізована під потреби досліджень незабаром спричинить скорочення населення до нестійкого рівня. Дані із сільських володінь це підтверджують. Наразі немає дієвого способу виправити становище або замінити їх ресурсами, отриманими ззовні. Отже, дослідження треба спрямувати в інші напрями.\n\nГоловний дослідник Лисенко пропонує в додатку 15.a.i свій новий проєкт - «Суперсолдати». Він зосередиться на підвищенні якости наявних людських ресурсів для можливого військового використання. Усі наявні знання в наведених далі галузях треба подати Головній канцелярії у звітах обсягом не більш як 50 сторінок: вплив ціаніду, ефективність методів стерилізації та запліднення, насильницькі схильності й стимули, психологічні маніпуляції. Вимоги до оформлення див. у попередніх звітах.\n\nУсіх, хто не подасть звіти вчасно, визнають негідними й ненауковими. Головна канцелярія рекомендує у відповідь негайну ліквідацію або використання в експериментах тих, хто для них придатний. Докладніше про фізичне профілювання див. у додатку 4.c.iii. Завершені звіти буде оприлюднено пізніше."
 MGN.118.a: "Об'єктивність породжує перевагу. Наука породжує силу."
 
 MGN.119.t: "Експлуатувати здобуті землі"
 MGN.119.desc: "Коли світанок осяює небо навколо гори Ямантау, група науковців, бюрократів і підлабузників уже завершила та затвердила план. У приглушеному шепоті й поспіхом переписаних записках його поширюють серед регіональних командирів батальйонів НКВД, а далі передають адміністраторам, солдатам і цивільним. Так починається Максимізація пацифікованих регіонів Південного Уралу:\n\nО 13:30 наступного дня всіх цивільних - чоловіків, жінок і дітей - обліковують на міських площах і в селах. О 15:00 страти тих, кого визнано загрозою НКВД, завершуються (Чорна Гора є взірцем ефективности), а вцілілих примушують прибирати їхні останки. Кількох обраних, визнаних гідними збереження, доправляють Лисенкові для допомоги в його експериментах.\n\nНаступного тижня охоронці НКВД відстежують спроможність цивільних видобувати ресурси й починають експерименти з максимізації ресурсів на місцевому рівні. Тих, хто не здатний виконати ресурсні квоти, утилізують і ховають у братських могилах. Якщо експерименти успішно дають бажаний результат, офіцерів винагороджують підвищенням. Тих, хто зазнав невдачі, визнають негідними й замінюють так само, як цивільних.\n\nЛюдський капітал потребує особливого поводження. Щомісяця комісари й офіцери НКВД звітують начальству про чисельність населення своїх регіонів. Рішення ухвалюють на основі сільськогосподарської та мінеральної продуктивности, партизанської активности й фізичних фенотипів населення. Квоти. Списки. Числа.\n\nРаз на пів року з Чорної Гори виїжджають чорні вантажівки. Вони кружляють і петляють територіями, залишаючи їх щоразу трохи порожнішими. Потім повертаються до Чорної Гори. Їхнього вантажу більше ніхто ніколи не побачить."
 MGN.119.a: "Забрати все. Нам потрібне все."
 
 MGN.120.t: "[?event_target:lysenko_attacker.GetAdjective]і війська захоплено!"
 MGN.120.d: "Сили держави [?event_target:lysenko_attacker.GetNameDef] капітулювали, і декого вдалося взяти в полон. Ці [?event_target:lysenko_attacker.GetAdjective]і війська чинили певний опір, але Лисенко знайде їм добре застосування."
 MGN.120.a: "Наші табори зростають."
 MGN.120.a.tt: "Буде реквізовано 275 суб'єктів."
 
 MGN.121.t: "[?event_target:lysenko_attacker.GetAdjective]і війська знову захоплено!"
 MGN.121.d: "Сили держави [?event_target:lysenko_attacker.GetNameDef] знову капітулювали перед нами, і нашим хоробрим людям удалося взяти декого в полон. Ці [?event_target:lysenko_attacker.GetAdjective]і війська не наважилися бунтувати, і Лисенко знайде їм добре застосування."
 MGN.121.a: "Наші табори знову зростають."
 MGN.121.a.tt: "Буде реквізовано 150 суб'єктів."
 
 MGN.122.t: "Синергійна співпраця"
 MGN.122.desc: "Коли підлеглі Лисенка дізналися, що 36-та бригада й Маґнітоґорск укладуть взаємний пакт, швидко здійнялися заперечення - від сумнівів щодо виявленої довіри до огиди перед союзом із колишніми німецькими загарбниками. Почувши цей галас, науковець вирішив сам пояснити свої міркування.\n\n«Не слід хибно розуміти: і теоретичні, і емпіричні докази свідчать про науковий поступ та стратегічну ініціятиву, що їх може принести цей союз. Згадайте наші попередні експерименти з природної співпраці, яку породжує об'єднання зернових культур у колективному вирощуванні, й усвідомте, що така коеволюція стосується не лише рослин, а й нас, людей. У минулі роки ми могли мати суперечки, та нині нас єднають спільні цілі - пацифікація Уралу й очищення російського народу від найслабших. Наші запаси ресурсів, і людських, і штучних, примножаться, як і технологічні спроможності та безпрецедентне зростання військової переваги!»\n\nНайвідданіші науковці зааплодували, хоча дехто й далі кривився від цих слів. Помітивши це, Лисенко підійшов до непереконаних і прошепотів, що після ліквідації Орєнбурґа та Ліги не збирається й далі панькатися з конкордатом."
 MGN.122.a: "Погляньмо, що можуть запропонувати ці бандити."
 
 MGN.123.t: "Іноземний вишкіл"
 MGN.123.desc: "На підставі останніх нарад Комітету оптимального збору зразків (уповноваженим працівникам див. протоколи засідань у долучених документах 1 і 2a) військові підрозділи зобов'язані ознайомитися з новими тактичними прийомами, розробленими зі спостережень за успішними іноземними силами.\n\nКомандири підрозділів мають завчити нові оперативні доктрини (див. долучені документи 2b, 3-6) і підтвердити готовність усіх відповідних військових частин до їх швидкого впровадження.\n\nКомандирам слід уникати поширення зайвих подробиць серед молодших офіцерів і рядових солдатів (настанови щодо обмеження зайвого спілкування див. у долученому документі 7). Крім того, всьому персоналові, що отримав цей документ, знову нагадують: несанкціоновані запити щодо походження стратегічних і тактичних планів порушують військовий кодекс 8c й каратимуться всіма належними заходами."
 MGN.123.a: "Слухайте уважно, можливо, нам доведеться застосувати це проти них..."
 
 MGN.124.t: "Договір із бандитами"
 MGN.124.desc: "Комюніке 124\n\nВідповідно до дослідницьких цілей Вище командування змінило накази й норми належної поведінки для підрозділів, розміщених на кордонах дослідницької зони з так званою бригадою Дірлеванґера (карту відповідних постів див. у долученому документі 1a). Підрозділам наказано відступити до новозбудованих укріплених пунктів (позначених у долученому документі 1b) і, якщо сусідні підрозділи отримають підтримку, перейти з режиму «стріляти без попередження» до режиму «максимальної готовности» (протоколи станів див. у долученому документі 2).\n\nПротягом семи (7) днів член Вищого командування проїде цим районом для заснування дипломатичної місії на цій території, і підрозділи мають надати всю потрібну допомогу для виконання його місії. Так само впродовж цього часу посланець бригади Дірлеванґера, ймовірно, попросить дозволу перетнути кордон. Підрозділам наказано занотувати зовнішність і характер цієї особи та, перш ніж пропустити її, пересвідчитися, що вона неозброєна.\n\nНарешті, прикордонні підрозділи мають пам'ятати: цей розвиток подій аж ніяк не применшує важливости збору зразків. Якщо зразки спробують скористатися зміною військових позицій і уникнути збору, підрозділи повинні вжити всіх потрібних заходів, зокрема співпрацювати з бригадою Дірлеванґера, щоб забезпечити збір."
 MGN.124.a: "Сподіваймося, це спрямує їхню лють в інший бік."
 
 MGN.125.t: "Методи радників"
 MGN.125.desc: "КОМЮНІКЕ 51.a\n\nУчора до Маґнітоґорска прибули шестеро (6) мандрівників. Назвавшись лише «мандрівниками», вони зайшли до вбиральні й пробули там приблизно дві (2) години, 12 хвилин і три (3) секунди. Товариш Лисенко привітав цих «мандрівників» великою кількістю їжі (за додатковими відомостями звертайтеся до відділу харчування). Потім товариш Лисенко запитав, чи стануть вони радниками збройних сил, і запропонував їм велику кількість суб'єктів. Усі вони водночас кивнули. Ніхто не торкнувся поданої їжі, хоча згодом у їхніх спальних приміщеннях знайшли кров.\n\nПоспавши приблизно одну (1) годину, 15 хвилин і 45 секунд, «мандрівники» почали навчати війська й запровадили нові тактичні прийоми, яких наше Вище командування ще не розробило. Ці мандрівники стануть видатними оборонцями держави."
 MGN.125.a: "КОМЮНІКЕ 51.a ЗАВЕРШЕНО"
 
 MGN.126.t: "Відповідь на критичний розвиток подій"
 MGN.126.desc: "Промова товариша Лисенка, виголошена в Центральному комплексі, -ЗАСЕКРЕЧЕНО-. Контекст промови: непередбачений військово-стратегічний розвиток подій, викладений у томах 65-67 «Стратегічних журналів».\n\n«Товариші, становище наших військових сил змінилося, і не конче у наших інтересах». (Галас.) «Численні підрозділи повідомляють про тяжкі й дедалі швидші втрати, що супроводжуються зниженням боєздатности, швидкости пересування та бойового духу. До 47 відсотків усіх залучених до бою підрозділів утратять боєздатність упродовж 48 годин, а деякі - вже за 24. Звіти моїх комісарів узагальнено у ваших брошурах на сторінках 17-25. Потрібно застосувати стратегічні засоби відповідно до наших спроможностей і стратегічної потреби в них. Тому я оголошую офіційне застосування Програми зоряних солдатів». (Сильний тривалий галас.)\n\n«Товариші, заспокойтеся! Я знаю про зауваження, які багато хто з вас особисто висловлював щодо справжніх чи гаданих спроможностей мого проєкту та відданости його суб'єктів. Це справді невипробуваний проєкт, і якби обставини не були цілковито критичними, я за жодних умов не дозволив би звільнити суб'єктів -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-. Однак, як я вже зазначав, безсмертна діялєктика Революції, згідно з дослідженням Ідеологічної дослідницької групи 119, дає позитивні прогнози щодо цих суб'єктів. Їхні агресивні схильності успішно посилено за допомогою таких методів, як спотворення тіла, підвищення гормональної нестабільности, підшкірні імплантати й психологічні маніпуляції; крім того, вони тренувалися поруч із нами й напевно вбирали соціялістичні знання з кожного нашого слова. У будь-якому разі вибору немає. Я мушу й офіційно оголошую їх звільненими - зараз»."
 MGN.126.a: "Ми ніяк не можемо передбачити наслідків."
 
 MGN.127.t: "Постачання озброєння 12.G"
 MGN.127.desc: "На особисте прохання товариша Лисенка [?global.date.GetDateStringNoHourLong] до нових союзників в Орску відправили колону з шести (6) вантажівок ЗІС-5 у стані помірного пошкодження. Водії повідомляли про незручності в дорозі через брак технічного обслуговування й побоювання механічних поломок. Після в'їзду на визначену територію водій §RЗАСЕКРЕЧЕНО§! вийшов із кабіни, зустрів прикордонників і передав гаданому керівникові групи запечатаний конверт із короткою запискою Лисенка про захоплення майбутньою співпрацею та високу цінність позиченого озброєння. Уривок із листа:\n\nОберфюрере Дірлеванґере, ваші заклики до співпраці почуто й прийнято. У цих ящиках міститься спорядження, яке ми цінували як одне з найкращих серед здобутого. Довіряю вам використати його на взаємну користь обох наших володінь. -Трохим Лисенко\n\nНевдовзі почалося розвантаження поставки (точний вміст див. у документі 2.b); серед вантажу зазначено близько 20 (двадцяти) гвинтівок Sturmgewehr 45 і різноманітну вибухівку. Відразу після передачі колона вирушила назад."
 MGN.127.a: "Зрозуміло."
 
 MGN.128.t: "Це була честь"
 MGN.128.desc: "До уваги всіх офіцерів 22-ї мотострілецької дивізії НКВД. Через ліквідацію ворожих сил у західних гірських районах (докладніше див. у документі «Аналіз опозиції: Уральська Ліга») спільна загроза, що спонукала нас співпрацювати з бандитами з Орська (докладніше див. у документі «Аналіз опозиції: бригада Дірлеванґера»), більше не є чинником. Тому всю таку співпрацю слід негайно припинити. Це охоплює передачу військових матеріялів, допомогу в бойових операціях та обмін інформацією. Як додатковий захід для припинення будь-якої співпраці всім членам 22-ї мотострілецької дивізії НКВД відтепер заборонено спілкуватися з усіма бандитами, пов'язаними з Дірлеванґером або його підлеглими. Для окремих контактів цю заборону може скасувати командир бригади або старший офіцер.\n\nПісля тривалого спостереження зроблено висновок, що південні бандити надто недисципліновані, щоб їх контролювати, і надто непередбачувані, щоб дозволити їм далі діяти в регіоні. Упродовж наступних чотирьох днів усі дивізії отримають нові накази передислокуватися вздовж кордону бандитської території. Це посилить захист від можливого раптового нападу й підвищить готовність до остаточної ліквідації Дірлеванґера як неконтрольованого чинника в регіоні. Забезпечте повну бойову готовність солдатів у найближчі тижні. Кінець передачі."
 MGN.128.a: "Виродок уже відслужив своє. Готувати солдатів."
 
 MGN.129.t: "Гора стоїть непохитно"
 MGN.129.desc: "Через застій і легке падіння бойового духу на Чорній Горі доктор Лисенко вирішив виголосити перед солдатами нашого об'єкта потрібну їм промову про їхню велич. Спершу він розповідає історію Маґнітоґорска: як той починався з напівзруйнованого, охопленого безладом вугільного об'єкта. Він особливо багато говорить про історію й не може зупинитися, тож бойовий дух людей лишається майже незмінним. Потім раптово переходить до того, як він та інші члени дивізії відбудували об'єкт, використавши тисячі різних матеріялів; згадує кількість людей і виконані квоти, особливо наголошуючи на чисельності солдатів, щоб підбадьорити їх. Після короткого історичного відступу він зачитує звіт про втрати (сильно цензурований), демонструючи, яких малих утрат зазнала дивізія порівняно з іншими угрупованнями, як-от Уральська Ліга, і наводить фактичний (перебільшений) звіт про їхні втрати. Він також згадує все спорядження, що робить їх найкращими: від різних сучасних гвинтівок (застарілих, але кращих за зброю більшости інших угруповань) до вибухівки й кількох машин. Далі Лисенко говорить про оборону об'єкта й про те, як усі пастки та різноманітні вогневі точки здатні зупинити кожен ворожий напад. На цьому місці солдати майже не реагують, доки офіцери поруч жестом не спонукають їх плескати. Промова триває й триває: Лисенко окремо відзначає різних людей, які перевиконали виробничі квоти, і вітає членів наукової групи з чудовою працею. Завершується вона словами: «Ви всі хоробро підвищили виробничі квоти на...» - Довга пауза, поки товариш Лисенко переглядає папери. - «Чотирнадцять відсотків. За цей учинок вам оголошено подяку. Повертаючись до справ: майбутнє стає дедалі світлішим»."
 MGN.129.a: "Люди Маґнітоґорска тверді, мов залізо всередині нього."
 
 MGN.130.t: "Відповідь на критичний розвиток подій, продовження"
 MGN.130.desc: "Продовження промови товариша Лисенка, виголошеної в Центральному комплексі тощо.\n\n«Товариші, у попередніх промовах я обіцяв вам, що соціялістичне майбутнє - не просто теоретична подія, а наукова ймовірність. Тепер я викладу подробиці різних складних аспектів цього ймовірного майбутнього, оскільки офіційно оприлюднюю дані звіту, зібрані Комітетом майбутнього. (Підсумок про Комітет майбутнього міститься в додатках 32.a.iv-.xii.) Я сам лише нещодавно розсекретив цей комітет і після необхідних чисток працівників, чий світогляд визнано суб'єктивним (примітка редактора: див. внутрішні архіви НКВД, -ПОСИЛАННЯ ЗАСЕКРЕЧЕНО-), тепер можу поділитися особистими висновками щодо його відкриттів».\n\n«Майбутнє буде організовано за принципами Нової комуністичної революції, шлях до якої наш Совєцький Союз проклав із недостатніми параметрами, і Нової наукової думки, створеної тут, у нашій власній дослідницькій системі. Його централізують і розбудують великі П'ятирічні дослідницькі проєкти, організовані за моделями, які ми нині застосовуємо у внутрішніх дослідженнях. Докладніше див. сторінки 43-56 брошури. Соціялістична наука нарешті розквітне без обмежень, і ніхто її не зупинить, бо відхильників, які розкладають усі дослідження поза цим об'єктом, буде ліквідовано як загрозу науково-соціяльній моделі».\n\n«Та найважливіше - зважте: це майбутнє мусить стати необхідним наслідком створення соціялістичного війська, узгодженого й ідеологічно обробленого нашими методами. (Пропозиції щодо даних про ідеологічну обробку за методами впорядковано в таблицях у додатках 46-48.) І я запевняю вас, що бандитів Дірлеванґера, зрадників Орєнбурґа й незручності Уральської Ліги - наших ворогів у діялєктиці та стратегії - буде ліквідовано, як утилізують неналежне дослідження»."
 MGN.130.a: "Товариш Лисенко дає обнадійливі прогнози. ВІДПОВІДЬ ЗАВЕРШЕНО."
 
 MGN.131.t: "ТЕРМІНОВЕ КОМЮНІКЕ 8.a"
 MGN.131.desc: "ДОЛУЧЕНО ЗВІТИ ПРО СТАН ПІВДЕННОГО УРАЛУ ПІСЛЯ ПАЦИФІКАЦІЇ.\n\nПацифікацію Південного Уралу оцінено як цілковито успішну - експедиції збору тепер майже не зустрічають опору. Очікується розширення операцій. Потреба в суб'єктах зберігається, хоча, якщо статистика населення й далі суперечитиме нашим оперативним вимогам, бойовий персонал і персонал збору можуть відрядити далі за межі регіону. Святкування успішної пацифікації дозволено до 23:00. Повідомити весь відповідний персонал. Дослідження відновляться завтра.\n\nДолучено 5 підривних текстів про нашу пацифікацію регіону, здобутих для дослідження:\n\nГазетна стаття: «Розпад влади на Південному Уралі навряд чи зменшить кількість нападів». Джерело: підривна західна газета. Підшито до ПРОПАГАНДА.\n\nПерехоплені документи: «Звіт про катастрофічне знелюднення Південного Уралу, 1960-1964». Джерело: полонений західний агент. (Суб'єкт 294404. ЖИВИЙ.) Підшито до ДОСЛІДНИЦЬКІ ДОКУМЕНТИ.\n\nГазетна стаття: «Біженці з Південного Уралу поширюють жахливі чутки». Джерело: підривна російська газета. Підшито до ПРОПАГАНДА.\n\nКороткий лист до «Батька» (суб'єкт 865. МЕРТВИЙ). Джерело: невстановлена дитина. (Суб'єкт 76550. ЖИВИЙ.) Підшито до ПРОПАГАНДА.\n\nПерехоплений запит про зниклу особу: «Прохання надати інформацію про Рейчел Парсонс. Зникла під час доброчинної роботи на Уралі». (Суб'єкт 204864. МЕРТВИЙ.) Джерело: посольство США у Фінляндії. Підшито до ДОСЛІДНИЦЬКІ ДОКУМЕНТИ."
 MGN.131.a: "КОМЮНІКЕ 8.a ЗАВЕРШЕНО"
 
 MGN.132.t: "Повстання суперсолдатів"
 MGN.132.desc: "Програма «Нові росіяни» виявилася цілковитим провалом. Сотні випробувань, експериментів і процедур підготовки зазнали краху, коли ми випустили їх із камер, не забезпечивши належного розуміння того, хто їхні союзники. Схоже, жорстокі умови нашої психологічної обробки були не найкращим способом змусити російських чоловіків битися на нашому боці. Під час повстання Нові росіяни здолали й убили всіх охоронців, які допомагали їхньому перетворенню, а тоді прорвалися з тюремної секції Гори й розсіялися по всьому об'єкту. Через те, що суб'єкти Нових росіян обернулися проти нас, наші об'єкти переведено в стан найвищої готовности. Деякі Нові росіяни вже вступили в перестрілки з нашими охоронцями, спричинивши тяжкі втрати з нашого боку; наша смертність вища за їхню. Доктор Лисенко нині перебуває в головній канцелярії разом із нашими військами, а імпровізовані кулеметні гнізда готові відкрити вогонь. Ми не знаємо, чи цього вистачить, адже непідтверджені повідомлення свідчать, що Нові росіяни здобули вибухівку як від співчувальників, так і під час прямих зламів кількох наших розкиданих по Чорній Горі арсеналів. Якщо це підтвердиться, шанси Лисенка, дослідницької групи й офіцерів вижити майже нульові."
 MGN.132.a: "Наші дорогоцінні суб'єкти... Не кривдьте їх!"
 
 MGN.133.t: "Маґнітоґорск націлився на нашу державу!"
 MGN.133.desc: "\n\nКоли старий Союз розлетівся серед крови, полум'я й німецької жорстокости, деякі його уламки впали нижче за інші. Один із них - рештки 24-ї мотострілецької дивізії НКВД - сторчголов провалився в задушливу темряву Маґнітоґорска. Під проводом божевільного науковця Лисенка та його посіпак він відгородився від світу. Торговельні каравани, що входили в тінь, не поверталися; люди зникали з полів і торговельних постів. Те, що відбувалося на Чорній Горі, там і лишалося - майже напевно на гірше, - а ми зі страху відвертали очі. Та час добровільної сліпоти минув.\n\nПрикордонні патрулі повідомляють про тривожну низку подій: гуркіт вантажівок, постріли й навіть поодинокий глухий удар вибуху поблизу нашого кордону з Лисенком. Нічні тіні з'являються й зникають на кордоні, а розвідники доповідають про неспокій серед місцевої фауни. Минулої ночі в тумані один наш сторожовий пост замовк. Від часу перед інцидентом ніхто не бачив призначеного туди чоловіка, а охочих добровільно чергувати на цьому посту після події... бракує.\n\nВисновок очевидний: звір на Горі прокидається від моторошного сну. І дивиться на Захід, щоб утамувати голод. Наші генерали радять посилити прикордонні укріплення й розширити навчання, аби протистояти задумам кліки Лисенка. Але ясно, що колишнього миру вже не втримати. Коли Гора рушить, Магомет має бути готовий. І ми також."
 MGN.133.a: "Дивуватися не слід. Готувати оборону!"
 
 MGN.134.t: "Маґнітоґорск вимагає данини з наших земель"
 MGN.134.desc: "До нас звернулася Чорна Гора - псевдокомуністична, псевдонаукова держава під проводом Трохима Лисенка. Прибувши важкоозброєним посольством у накрохмалених мундирах, її представники проголосили себе законними спадкоємцями наукової програми Совєцького Союзу - сумнівний зв'язок, який, схоже, живить лише божевілля людини, що не вірить у падіння Союзу, - і зажадали віддати їм десятину чоловіків, жінок і дітей. На запитання навіщо вони відповіли, що люди служитимуть Совєцькому Союзу, своєму законному урядові, «просуваючи справу соціялістичних робітників усього світу, забезпечуючи дальший розвиток совєцької науки й поступ для використання проти великого ворога в Німеччині». Коли їх попросили пояснити, що це насправді означає, солдати, очевидно члени НКВД, визнали: люди братимуть участь у «наукових експериментах», щоб стати сильнішими. Щоб краще битися з німцями.\n\nВимоги очевидно безглузді, і будь-який розсудливий лідер відразу відмовив би, але солдати «товариша» Лисенка видаються доволі грізними. Навіть через двадцять років після останнього наказу вони й далі начищають ґудзики своїх хакі-мундирів.\n\nМи можемо відмовити, якщо захочемо, але чи справді життя кількох селян варте такого конфлікту?"
 MGN.134.a: "Дати їм те, чого вони просять."
 MGN.134.b: "Ми не ділимося здобиччю."
 
 MGN.135.t: "Вимогу данини прийнято"
 MGN.135.desc: "Комюніке Головної канцелярії, особлива дипломатична депеша 151.a\n\nКАТЕГОРІЯ СЕКРЕТНОСТИ 3C - НЕСАНКЦІОНОВАНЕ ОЗНАЙОМЛЕННЯ КАРАЄТЬСЯ ЛІКВІДАЦІЄЮ ТРЕТЬОГО СТУПЕНЯ\n\nСпостережні звіти розвідувальних підрозділів і військових сил на прикордонній службі підтверджують правильність нашої робочої теорії. Нинішні дипломатичні засоби на чолі з науковцем -ЗАСЕКРЕЧЕНО- успішно забезпечили розширення дипломатичних операцій із ресурсами на землях -ЗАСЕКРЕЧЕНО-, і ми можемо підтвердити посилення сприятливих для нас проявів у поведінці -ЗАСЕКРЕЧЕНО-, зокрема страху й відчаю перед нашою адміністрацією. Виробничі й економічні радники погоджуються з початковими оцінками зростання видобування ресурсів і прогнозують каскадний ефект у вигляді посилення дипломатичної могутности та контролю над внутрішніми цивільними ресурсами. Докладний прогноз розширення видобування мінеральних, військових і людських ресурсів наступного місяця див. у додатку 1.b.ii.\n\nМайбутні плани: посилити експлуатацію -ЗАСЕКРЕЧЕНО-, компенсуючи падіння внутрішніх надходжень і ресурсних оцінок. Почати планування поширення оперативної доктрини на -ЗАСЕКРЕЧЕНО- та -ЗАСЕКРЕЧЕНО-. Підготувати підрозділи -ЗАСЕКРЕЧЕНО- до пересування в прикордонні райони для повторення попередніх успішних дій. Науковця -ЗАСЕКРЕЧЕНО- готують до проникнення в сусідні держави.\n\nОсобиста примітка: науковець -ЗАСЕКРЕЧЕНО- п'ять разів висловлював незгоду під час роботи в -ЗАСЕКРЕЧЕНО-. Комісар -ЗАСЕКРЕЧЕНО- подав документи на його ліквідацію як неповноцінного засобу, а його родину після ліквідації оптимізують для експериментів."
 MGN.135.a: "Чудово."
 
 MGN.136.t: "Вимогу данини відхилено"
 MGN.136.desc: "Комюніке Головної канцелярії, особлива дипломатична депеша 151.a\n\nКАТЕГОРІЯ СЕКРЕТНОСТИ 3C - НЕСАНКЦІОНОВАНЕ ОЗНАЙОМЛЕННЯ КАРАЄТЬСЯ ЛІКВІДАЦІЄЮ ТРЕТЬОГО СТУПЕНЯ\n\nПочаткові звіти про успіх виявилися надто оптимістичними. Попри ширше застосування військової агресії та дипломатичної наполегливости, науковець -ЗАСЕКРЕЧЕНО- й інші стратегічні засоби в -ЗАСЕКРЕЧЕНО- не виконали місії з розширення внутрішніх операцій із видобування ресурсів. Згідно з правилами запроваджено протокол 907B щодо стратегічних засобів, скомпрометованих на ворожій території: науковця -ЗАСЕКРЕЧЕНО- ліквідували як потенційну загрозу операціям, після чого комісар -ЗАСЕКРЕЧЕНО- та його взвод здійснили самоліквідацію за допомогою зброї та пристроїв самоліквідації. (Докладні звіти про перебіг місії та аналіз даних щодо часу виконання протоколу 907B долучено як додатки 1.c-1.e.)\n\nРекомендації: почати відновлення дипломатичних зв'язків із -ЗАСЕКРЕЧЕНО- й вивести підрозділи -ЗАСЕКРЕЧЕНО- відповідно до резервного плану 4. Кожен підрозділ, який не відступить у призначений час, буде децимовано, а його родини піддано оптимізації. Військові радники зауважують, що виконання наказів матиме тривалий вплив на бойовий дух. (Заходи протидії для збереження дисципліни долучено в додатках 1.f-1.h.) Видобування ресурсів у -ЗАСЕКРЕЧЕНО- зазнає втрат, можливо непоправних. (Прогнози падіння внутрішнього виробництва й дослідницького капіталу долучено в додатках 1.a-1.b.)\n\nОсобиста примітка: ця невдача неприйнятна. Винних у ній буде ліквідовано з особливою жорстокістю. Негайно."
 MGN.136.a: "Ці покидьки сміють нам відмовляти!"

 MGN.200.t: "Зникла зброя з наших совєцьких запасів"
 MGN.200.desc: "Висновки Комітету підсумовано нижче. Докладніший аналіз відомостей про причетний персонал і дисциплінарних заходів проти їхніх підрозділів див. у долученому дисциплінарному звіті.\n\nЗброю та військове спорядження, здобуті військовослужбовцями НКВД, належить реквізувати для навчання й зберігання. Однак нам стало відомо, що порушення цього правила поширеніше, ніж вважалося. Інцидент -ДАТУ ЗАСЕКРЕЧЕНО- за участю 130 військовослужбовців НКВД, тобто цілої роти, довів хибність наших початкових оцінок. У місцях утримання на всіх підконтрольних землях нині проводять колективне покарання-реабілітацію. Ми впевнені, що буде викрито й інші випадки.\n\nЯк зазначено в попередніх звітах, совєцькі військові об'єкти дають менше знахідок під час пошукових операцій. Тепер зрозуміло, що причина - масове особисте привласнення спорядження в масштабах, які виходять далеко за межі окремих осіб. У деяких випадках військовослужбовці НКВД привласнювали для особистого використання й продажу цілі запаси вибухівки та боєприпасів, достатні, щоб озброїти батальйон на тиждень.\n\nНайбільше непокоїть свідчення рядового -ЗАСЕКРЕЧЕНО-, причетного до згаданого інциденту; дисциплінарні покарання над ним виконували одночасно з допитом. За його словами, його рота отримала прямий дозвіл офіцера на розкрадання. Це має тривожні наслідки й свідчить про ослаблення дисципліни у власних лавах, тому рекомендовано структурні реформи й дисциплінарні заходи, щоб надалі забезпечити дотримання правил.\n\nСписок запропонованих дисциплінарних заходів див. у додатку 1.a.viii. (Примітка: виконано повністю.)"
 MGN.200.a: "Вимагати страти злодіїв та їхніх офіцерів."
 MGN.200.a.tt: "Це зашкодить відданості НКВД Лисенкові.\n"
 MGN.200.b: "Покарати лише безпосередніх винуватців."
 MGN.200.c: "Заплющити очі, але забезпечити їхнє мовчання."
 MGN.200.d: "Поділити здобич між усім НКВД, щоб виграли всі."
 MGN.200.d.tt: "Це прихилить НКВД до Лисенка.\n"

 MGN.201.t: "Офіцери протестують проти несумісної зброї"
 MGN.201.desc: "Наш наказ упроваджувати у війська все доступне спорядження спричинив протести частини традиціоналістських офіцерів НКВД. Одні твердять, що відмова від уніфікованого озброєння робить нас не кращими за бандитів і що НКВД уособлює щось вище за просте вбивство. Інші наводять практичніші аргументи: використання стрілецької зброї різних стандартів погіршить злагодженість дій відділень, бо офіцерам доведеться враховувати можливості зброї кожного солдата, а не цілого відділення. Остаточне рішення за нами, і ми можемо просто покарати кожного, хто заперечує, хоча це може зашкодити нашим відносинам із НКВД."
 MGN.201.a: "Понизити офіцерів або відшмагати. Що простіше."
 MGN.201.a.tt: "Це зменшить наш §YВишкіл армії§! на 3%\nЦе зашкодить відданості НКВД Лисенкові."
 MGN.201.b: "Підтвердити накази, а потім улаштувати кілька «нещасних випадків»."
 MGN.201.b.tt: "Це зашкодить відданості НКВД Лисенкові.\n"
 MGN.201.c: "Вони мають рацію. Вдаймо, ніби ми самі цього хотіли."

 MGN.300.t: "Ліквідація південної перешкоди"
 MGN.300.desc: "Після повного розвалу центрального керівництва під нашим наступом повідомлень про опір сил, що називають себе бригадою Дірлеванґера (також Чорними бандитами), стає дедалі менше. Від початку бойових дій неорганізованість бандитських сил робила їх уразливими для злагоджених ударів (докладніше див. післяопераційні звіти про операції l-438 і z-19). Завдяки цьому сили 22-ї мотострілецької дивізії зупинили їхні наступи з показником успіху 82 відсотки й розпочали власні контрнаступи на бандитську територію. Що далі на південь відступали бандити, то помітніше зростав їхній опір, найімовірніше через наближення до баз і командних центрів. Найвищого рівня він досяг у боях навколо Орська (див. файл населеного центру: Орськ), неофіційної столиці бандитської території та місця особистого штабу Дірлеванґера. У місті бої були особливо запеклими, однак неорганізованість знову згубила бандитів: місто оточили, усі осередки опору ізолювали й зрештою ліквідували.\n\nКрім кількох швидких нападів із відходом, учинених відокремленими бандитськими групами (див. патрульні звіти 1235, 7532 і 0192), увесь опір у регіоні припинився, а порядок відновлюють. Членів бандитського командування затримано й заплановано доправити до Маґнітоґорска, де їх ізолюють і піддадуть особливим процедурам випробування (див. настанови до протоколу експериментів над особливими суб'єктами). Решту полонених бандитів утримуватимуть, доки огляд не визначить їхню придатність як потенційних суб'єктів. Промислові ресурси Орська й довколишнього регіону, хоч і тяжко пошкоджені бандитською окупацією, стануть корисним доповненням до нашої промислової бази; відбудову заплановано розпочати незабаром."
 MGN.300.a: "Зрозуміло."
 MGN.301.t: "Усунення західної перешкоди"
 MGN.301.desc: "Попри значний початковий опір, Уральську Лігу ліквідовано як джерело протидії в регіоні. Після спроб Уральської гвардії (див. інформаційні файли про ворожі сили 7 і 12) перешкодити вилученню суб'єктів із західних населених пунктів її усунення визнали необхідним для продовження кількох життєво важливих напрямів досліджень. Через високий рівень їхньої підготовки (докладніше про навчальний режим Уральської гвардії див. підфайл 12-1) і несприятливі бойові умови Уральських гір (див. долучену карту висот) початкова наступальна операція не була такою успішною, як сподівалися: у перші тижні лише 48 відсотків підрозділів досягли призначених цілей. Однак перевага виробничої бази й більший резерв людської сили ширшого Маґнітоґорського регіону (див. останні документи перепису) стали вирішальними: Уральська гвардія не могла достатньо поповнювати й постачати сили під час тривалих боїв. У міру розвитку конфлікту її відтискали, аж поки всі значні населені пункти Південного Уралу не було захоплено, а гвардія не втратила будь-яку дієву командну структуру.\n\nНовоздобута територія має мало населення й промисловости. Захоплення великої кількости колишніх членів Уральської гвардії зробило конфлікт загалом вигідним, попри тяжкі втрати (див. справи обліку втрат і звіти про втрату спорядження). Помічено, що пересічний гвардієць значно сильніший, витриваліший і спритніший за пересічного жителя регіону (подробиці див. експеримент 1961-4-i). Ці якості роблять їх ідеальними кандидатами для багатьох найважливіших експериментів Чорної Гори з фізичних і генетичних маніпуляцій. Уже виявлено й затримано приблизно 12 000 колишніх гвардійців для перевезення до випробувальних об'єктів. Групи реквізиції почали обшукувати колишню територію Уральської Ліги, адже значна кількість гвардійців, імовірно, досі переховується."
 MGN.301.a: "Зрозуміло."
 MGN.302.t: "Здобуття південно-західного населеного центру"
 MGN.302.desc: "Після поразки ополчень у самому місті опір у регіоні навколо Орєнбурґа (див. файл населеного центру: Орєнбурґ) успішно ліквідовано. Попри чисельну перевагу ворожих сил, розрив у спорядженні й досвіді між комунними ополченнями та 22-ю мотострілецькою дивізією зробив більшість спроб стримати наш рух до міста марними: 92 відсотки наступальних операцій виконали щонайменше 50 відсотків початкових завдань. (Звіти про успішну оборону комунних сил див. у збірці z-81.) На підступах до міста ми натрапили на масштабну оборону, що включала мобілізованих селян і нашвидкуруч споруджені барикади та мережі траншей. Вони сповільнили наступ на 33 відсотки, але не змогли цілком зупинити операцію; місто захопили невдовзі після розпуску й утечі колишнього уряду. Групи реквізиції відряджено знайти й захопити визначних членів цього уряду (див. список пріоритетних цілей для реквізиції суб'єктів: Орєнбурґ).\n\nМісто є найбільшим населеним центром регіону (див. файли оцінок населення, які очікують заміни переписом) і дасть змогу реквізувати значно більше суб'єктів, ніж це дозволяли попередні заходи. Очікується, що завдяки більшій доступності суб'єктів загальний обсяг випробувань зросте щонайменше на 45 відсотків. Крім того, після завершення програм інтеграції та перерозподілу виробництво й інфраструктура регіону стануть істотним активом для виробничих спроможностей Маґнітоґорска та всього Південного Уралу."
 MGN.302.a: "Зрозуміло."

 MGN.255.t: "Хаотичні ритми"
 MGN.255.desc: "Засекречені файли, Відділ внутрішніх перевірок, Психологічний відділ, підрозділ Дослідницького комітету -ЗАСЕКРЕЧЕНО-:\n\nНаш суб'єкт досяг безпрецедентного рівня психологічної нестабільности. якщо цей об'єкт і його персонал мають і далі працювати щоденно без ризику внутрішнього розпаду або зовнішнього вторгнення, потрібні негайні виправні заходи. Оцінку психологічного здоров'я долучено нижче, і навіть без додаткових спостережень очевидно: таке відхилення від базових схильностей і поведінки свідчить про повномасштабне сповзання товариша Лисенка в божевілля.\n\nСтарші члени ради відклали запропоновані програми «Анігіляція на церебральному рівні» та «Ламаркістський медитативно-гіпнотичний ритуалізм», і швидко стало зрозуміло, що вони негайно про це пошкодують: їхні родини ретельно й з особливою жорстокістю ліквідовано. Перш ніж Лисенко своїми діями завдасть дальшої шкоди Раді, її членам і військовому персоналові об'єкта, частина нашої дослідницької групи рекомендує вжити заходів, зокрема -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-, щоб нейтралізувати безпосередню загрозу виживанню. Просимо вказівок.\n\nНадішліть цю записку до підвідділу НКВД -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ- для довідки та можливого -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-, а також матеріали резервного інструктажу 11BV щодо -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-."
 MGN.255.a: "О. Це - неоптимально."
 MGN.256.t: "-Нерегулярні схильності-"
 MGN.256.desc: "Засекречені файли, Відділ внутрішніх перевірок, Психологічний відділ, підрозділ Дослідницького комітету -ЗАСЕКРЕЧЕНО-:\n\nНаш суб'єкт виявляє тривожні схильності згідно з показниками Оцінки психологічного здоров'я (подробиці в таблиці нижче), тому рекомендовано дальше спостереження й, за можливости, виправні дії. Реакції за останній 14-денний період (аналіз у долучених довідкових документах зіставлено з таблицею нормальних психоемоційних реакцій) показують мінливий, а часом тривожно низький рівень відносної розсудливости. Суб'єкт почав час від часу виявляти нестабільну й ірраціональну поведінку, зокрема, але не лише: спалахи гніву на підлеглих, фізичне насильство над близькими колегами й раптові ліквідації підлеглих, чиї справи тут неможливо долучити через нову політику «Damnatio Memoriae», запропоновану Комітетом за прямим наказом товариша Лисенка.\n\nАвтор рекомендує спостереження й можливе втручання на особистому рівні. Товариш Лисенко демонструє незадовільні результати; слід очікувати неоптимальної ефективности як у концептуальних дослідженнях, так і у виконанні адміністративних обов'язків, а також ризику повного психологічного хаосу. Надішліть цю записку до підвідділу НКВД -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ- для довідки та можливого -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-."
 MGN.256.a: "Тривожні новини."
 MGN.257.t: "-Подих ясности-"
 MGN.257.desc: "Засекречені файли, Відділ внутрішніх перевірок, Психологічний відділ, підрозділ Дослідницького комітету -ЗАСЕКРЕЧЕНО-:\n\nНаш суб'єкт наразі видається стабільним, хоча ще не цілком певно, чи його стан може погіршитися. Реакції за останній 14-денний період (аналіз у долучених довідкових документах зіставлено з таблицею нормальних психоемоційних реакцій) показують надзвичайно високий рівень відносної розсудливости. Не виявлено ненормального рівня таких типів поведінки: напівраціонального прагнення демонструвати особисту перевагу на підставі дослідницьких досягнень, раптових і особистісно забарвлених реакцій на дотримання «відхильницької» наукової доктрини тощо.\n\nПодальші спостереження дозволено в межах стандартного протоколу, але попередній висновок такий: товариш Лисенко стабільний настільки, наскільки це взагалі можливо. Очікується, що він функціонуватиме в межах нормальних параметрів під час військових оглядів, стратегічного планування, наукових досліджень тощо, без ризику раптового зриву чи повернення до психологічно хаотичної поведінки.\n\nНадішліть цю записку до підвідділу НКВД -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ- для довідки та можливого -ЗАСЕКРЕЧЕНО З МІРКУВАНЬ БЕЗПЕКИ-."
 MGN.257.a: "-Заспокійливі новини.-"
 MGN.258.t: ">ВІДКРИТЕ КОМЮНІКЕ НКВД CR.18"
 MGN.258.desc: "Планове випробування суб'єктів Нових росіян знову дало непевний результат. Керівник випробування, дослідник Асімов (нар. 1923), провів тест A2 на суб'єктах Нових росіян. Він тривав шістсот шістдесят секунд (одинадцять хвилин) і був визнаний невдалим, бо суб'єкти не змогли належно захопити танк Т-34, маючи лише мінімальне озброєння.\n\nКоли директорові Лисенку повідомили про невдачу Нових росіян, він, за звітом, сміявся не менш як триста сорок дві секунди (п'ять хвилин сорок дві секунди). Після часу, визнаного необхідним, дослідник Асімов попросив дозволу на повторні випробування суб'єктів Нових росіян (режим навчання A3). Охоронці НКВД за дверима кабінету директора повідомили про чотири постріли з 9.27-мм пістолета Макарова. Згідно з протоколом безпеки C.04 охоронці НКВД увійшли й обшукали кімнату. Дослідника Асімова знайшли мертвим, із чотирма (4) кулями в грудях. Під час дальших запитань директор Лисенко говорив незв'язно, називаючи нездатність виконати завдання «остаточною причиною Совєцького Союзу». (так у тексті)\n\nНКВД зажадав до дальшого розпорядження виставити перед кабінетом директора щонайменше дві (2) вогневі групи по п'ять (5) осіб. НКВД запланував дальший аналіз психічного й психологічного стану директора Лисенка."
 MGN.258.a: "Боже милий..."

 MGN.500.t: "Обвал тунелю для втечі"
 MGN.500.desc: "Тунель для втечі обвалився лише через два дні після завершення. Вважають, що тунель обвалився через слабкий фундамент: ненадійні дерев'яні балки не забезпечили належної опори шахтним проходам, переобладнаним на коридори. Початково тунель мав дати персоналові шлях утечі в разі прориву оборонних ліній навколо Чорної Гори. Без нього нині немає іншого способу втекти в разі прориву. Тих самих робітників, які копали попередній тунель, залучать до будівництва нового, з укріпленим фундаментом, а після завершення належно покарають за початкову невдачу."
 MGN.500.a: "Треба було відразу зробити як слід."
 MGN.500.a.tt: "Це зменшить нашу §YГотовність армії§! на 4%"

 MGN.501.t: "Удосконалення оборонних позицій"
 MGN.501.desc: "Нинішня оборонна система Чорної Гори недостатня. Траншеї лише викопано, але не обладнано належно оглядовими щілинами й дерев'яними настилами. Кулеметних гнізд бракує, колючого дроту немає, міни закладено лише біля заднього входу в гору, а стіни наявних гнізд потребують додаткового укріплення. Загалом наша оборона досі слабка, і для успішного захисту об'єкта будівельні зусилля треба подвоїти. Роботи почнуться зараз; сподіваємося завершити поліпшення й перебудову до наступного року."
 MGN.501.a: "Цікаво."
 MGN.501.a.tt: "Це зменшить нашу §YГотовність армії§! на 8%"

 MGN.502.t: "Пристосування до нової навчальної доктрини"
 MGN.502.desc: "Нові офіцери запровадили сучасніші навчання, щоб ознайомити солдатів із тактикою сучасних держав, як-от Японія, США та Німеччина. Ці навчання й тактична підготовка стали ковтком свіжого повітря для військ Маґнітоґорска. Однак НКВД і офіцери старої гвардії з нашого кола відповіли, що нові закордонні доктрини - помилка й зрада старого СССР та його російських традицій. Деякі офіцери навіть постукали у двері кабінету Лисенка й увійшли з проханням повернутися до старих совєцьких засад бодай через їхню сентиментальну вагу. Вибравши старі методи СССР, ми задовольнимо офіцерів, але коштом ефективности військ і боєздатности дивізії. Продовживши нову підготовку, ми ознайомимо війська з новими методами й підвищимо ефективність, але можемо розлютити офіцерів і поставити під загрозу стабільність Маґнітоґорска. Що робити?"
 MGN.502.a: "Продовжувати нові методи. Нам потрібна вища ефективність."
 MGN.502.a.tt: "Це зменшить наш §YВишкіл армії§! на 8%\nЦе збільшить §YНевдоволення НКВД§! на 5"
 MGN.502.b: "Зберегти старі методи. Нам потрібна відданість офіцерів."
 MGN.502.b.tt: "Це збільшить наш §YВишкіл армії§! на 8%\nЦе зменшить §YНевдоволення НКВД§! на 5"

 MGN.503.t: "Доставлено менше зброї"
 MGN.503.desc: "Поставка щойно прибула до Маґнітоґорска. Однак, відкривши всі ящики, армія з подивом виявила, що ми отримали лише 42% від обіцяного початкового обсягу поставки. Це значно ускладнить навчання. Звичні щоденні заняття доведеться скоротити вдвічі, а можливо, проводити щотижня, щоб берегти боєприпаси. Потрібні нові стратегії, аби боєприпаси не вичерпалися повністю. Ми звертаємося до держав, з яких надходила ця зброя, але відповіді, ймовірно, не буде."
 MGN.503.a: "Це недобре."
 MGN.503.a.tt: "Це зменшить наш §YВишкіл армії§! на 8%"
 MGN.504.t: "Падіння бойового духу солдатів"
 MGN.504.desc: "Бойовий дух падає. Наші раптові й безладні армійські навчання вдень і навіть уночі посилили виснаження та стрес. Солдати вже прямо скаржаться офіцерам на тривалі заняття. Це дедалі помітніше й під час навчальних боїв: влучність наших військ на стрільбищі невпинно падає... Треба щось робити, інакше справжня сутичка зі справжніми суперниками може закінчитися вкрай погано."
 MGN.504.a: "Спершу скоротімо навчання."
 MGN.504.a.tt: "Це зменшить наш §YВишкіл армії§! на 10%"

 MGN.505.t: "«Розклад» в армії"
 MGN.505.desc: "Подано звіт. Сьогодні четверо офіцерів НКВД порушили протокол і зажадали розмови з товаришем Лисенком без попередньо призначеної зустрічі. Коли вони підійшли, Лисенко разом з охоронцями планував денний розклад. Він запросив офіцерів до кабінету. Увійшовши, вони почали голосно дорікати Лисенкові за ризик, на який він пішов, запросивши до Маґнітоґорска закордонних військових радників. Вони стверджували, що нові радники розкладуть армію й цілком викорінять совєцькі традиції з командної структури. Офіцери читали Лисенкові нотації, доки він не наказав їм піти, щоб повернутися до запланованої роботи. Вони послухалися, але відтоді поширюють серед інших офіцерів чутки й незгоду, заявляючи, що Лисенко веде Маґнітоґорск небезпечним шляхом."
 MGN.505.a: "Яке нахабство."
 MGN.505.a.tt: "Це зменшить наш §YВишкіл армії§! на 8%\nЦе збільшить §YНевдоволення НКВД§! на 5"

 #endurance testing
 MGN.600.t: "Уривки зі звіту про експеримент 14.11.204"
 MGN.600.desc: "У межах експерименту з фізичної витривалости та опору хворобам, очолюваного Відділом фізіогномічних і фізичних досліджень та випробувань, відібрано 5 суб'єктів жіночої статі віком XXXXXX. Суб'єктів піддавали таким умовам: занурення у воду граничних температур на XXXXXX поспіль із чергуванням протягом 10 циклів; 66 градусів Цельсія, потім -XX градусів Цельсія. Після цього суб'єктів примушували бігти 40-метрові спринти в закритому середовищі та виконувати стрибки з розведенням рук і ніг серіями по 5. Потім їм уводили збудників правця. Через два місяці експеримент повторили. Контрольній групі правець не вводили.\n\nОбґрунтування: відомо, що скорочення й спазми м'язів є потужним джерелом сили; див. долучене дослідження нашої медичної групи про явище правцевих судом і можливість їх використання у власних фізичних експериментах. Висунуто теорію, що поєднання впливу правця з фізичними випробуваннями поліпшить фізичні спроможності суб'єкта, бо бактерії буде спонукано співпрацювати з фізіологічними системами, зберігаючи здатність тимчасово підвищувати фізичну силу.\n\nРезультати: після 1-го експерименту 2 суб'єкти померли від ускладнень, пов'язаних із переохолодженням та/або впливом граничних температур. Після введення правця решта суб'єктів продемонструвала прогнозовані фізіологічні прояви ранньої стадії правця, описану в медичних журналах наявного дослідницького корпусу, тобто мимовільні м'язові судоми, параліч, задуху тощо. Суб'єкти B та E не змогли виконати спринти під час другого випробування через фізичну нездатність ходити чи бігати. Суб'єкт D мав обмежену рухливість і впав під час 3-ї серії спринту. Після медичного огляду всіх XXXXXXXXX, бо їх визнали непридатними для дальшого використання."
 MGN.600.a: "Звіт 14.11.204."
 MGN.600.a.tt: "237 суб'єктів стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."

 #limited rations
 MGN.601.t: "Уривки зі звіту про експеримент 11.7.036"
 MGN.601.desc: "У межах експериментального проєкту з підвищення здатности суб'єктів функціонувати за недостатнього харчування для випробувань відібрано трьох (3) чоловіків віком дев'ятнадцять (19) років.\n\nПроцедура: упродовж місяця пайок суб'єктів поступово скорочували, доки вони не споживали близько шестисот калорій на день. Їх змушували виконувати ручні завдання, як-от підіймання вантажів, біг і XXXXXX, щоб визначити здатність працювати в умовах передбачуваного недоїдання. Якщо суб'єкти опинялися на межі смерти, їм тимчасово повертали стандартний пайок, після чого знову переводили на скорочене харчування й продовжували експеримент.\n\nРезультат: суб'єкти B та C постійно не виконували стандартних завдань, і кожного довелося XX разів переводити на відновлювальний пайок. Вони демонстрували звичайні ознаки голодування й недоїдання; після четвертого повернення до стандартного пайка кожного вилучили з експерименту й ліквідували. Суб'єкт 711.A відрізнявся й показав надзвичайну пристосовність: виконував на шістдесят відсотків більше завдань і в середньому на дванадцять відсотків швидше за B, найближчого суперника. А довелося повернути до звичайного пайка лише раз, і він відновився швидше за інших. Дослідник XXXXXXXX проголосив цього суб'єкта успішним, і тепер А схрещують із суб'єктами XXXXXXXX, щоб увести стійкість до голоду до фонду спадкових ознак."
 MGN.601.a: "Звіт 11.7.036 завершено."
 MGN.601.a.tt: "250 суб'єктів стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."
#drug testing
 MGN.602.t: "Уривки зі звіту про експеримент 2.14.075"
 MGN.602.desc: "У межах заходів з обліку й випробування ліків, знайдених під час пошуків у старих лікарнях совєцької доби, відібрано один (1) суб'єкт жіночої статі віком 24 роки.\n\nПроцедура: препарат додавали до звичайного пайка суб'єкта, щоб уникнути будь-якого ефекту плацебо. Потім суб'єкта вилучили зі спільного середовища й помістили до стандартної спостережної камери. Її мали коротко опитати тричі: через десять хвилин після впливу, через сорок п'ять хвилин і через дві години. Під час опитувань дослідники мали запевняти суб'єкта, що «все гаразд» і що пережите «лише в її голові», аби усунути зовнішні психологічні чинники. Подальшу процедуру після завершення планували визначити за дією препарату.\n\nРезультат: під час першого опитування суб'єкт виявляла легке невдоволення й розгубленість, хоча дослідник XXXXXXXXXXXX визнав це звичайним людським дискомфортом, а не дією препарату. Між першим і другим опитуванням суб'єкт почала безперервно дряпати власне тіло, скаржитися на свербіж, а також XXXXXXXXXXX. Суб'єкт також помітно, хоч і ледь, тремтіла. Під час другого опитування вона описала жахливий свербіж і тіні на периферії зору. Між другим і третім опитуванням дряпання посилилося, а приблизно через годину сорок дві хвилини перетворилося на те, що дослідник XXXXXXXXX назвав «роздиранням і XXXXXXXX». Суб'єкт рясно стікала кров'ю, і перед третім опитуванням її довелося зафіксувати й дати заспокійливі препарати. Вона не могла прямо відповідати на запитання, але безладно говорила про «тіні в моїй шкірі», «XXXXXXXX усередині мене» й, плачучи та звиваючись від сильного болю, неодноразово вимагала, щоб дослідники «витягли це». Тоді експеримент завершили й вилучили суб'єкта з камери. Вона вижила й тепер повторно використовується в іншому експерименті зі зміцнення шкіри після поранень; усі психологічні наслідки препарату, схоже, минули. Триває робота з установлення й відтворення речовини для можливого XXXXXXXXX, зокрема можливого військового застосування."
 MGN.602.a: "Звіт 2.14.075 завершено."
 MGN.602.a.tt: "423 суб'єкти стали непридатними до подальшого використання внаслідок експериментів\n\nРозсудок Лисенка покращився\n\nНКВД дедалі більше непокоять експерименти Лисенка"
#childhood testing
 MGN.603.t: "Уривки зі звіту про експеримент 5.10.002"
 MGN.603.desc: "Експеримент над суб'єктом K (повне ім'я: XXXXXX XXXXXXXX) передчасно завершили, коли встановили, що суб'єкт K (див. пропозицію проєкту 30 щодо XXXXXXXX) та один із дослідників надто прив'язалися одне до одного. Причиною стали тривалі зусилля навчити суб'єкта K російської мови. Цих зусиль, більш ніж достатніх, щоб навчити пересічну дитину її першої мови (див. суб'єкти A-F із контрольної вибірки), виявилося цілком недостатньо для навчання 13-річної дівчини. Розумову відсталість виключено, особливо після порівняння суб'єкта K із суб'єктами H та J до припинення участи останніх в експерименті (докладніше див. додаток 3.1).\n\nНадзвичайна ізоляція суб'єкта K від народження змусила її прив'язатися до науковців, які намагалися навчити її російської, зокрема до керівника мовознавчої частини експерименту (див. особову справу XXXXXX). Згодом дослідника викрили під час спроби таємно вивезти суб'єкта K з об'єкта після рішення припинити її участь через відсутність поступу в навичках усного спілкування (щодо спроби втечі див. звіт про інцидент 1076, а щодо поступу XXXXXXXX суб'єкта K - XXXXXXXXXXXXXXXXXXX). Після цього участь суб'єкта K передчасно припинили, а саму її згодом XXXXXXXXXX, визнавши непридатною для дальших досліджень. Дослідник, винний у зриві експерименту, перебуває під вартою НКВД й очікує дисциплінарного покарання. На щастя, інцидент не вплинув на решту суб'єктів експерименту."
 MGN.603.a: "Звіт 5.10.002 завершено."
 MGN.603.a.tt: "154 суб'єкти стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."

 #sleep dep
 MGN.604.t: "Уривки зі звіту про експеримент 7.40.231"
 MGN.604.desc: "У межах дослідження можливого розвитку вищої витривалости та стійкости, що є кроком до створення Нової соціялістичної людини, відібрано п'ятьох (5) суб'єктів (одну жінку й чотирьох чоловіків віком від XX до XX років) для штучно подовженого неспання протягом X тижнів, 2 днів, 4 годин і приблизно 17 хвилин. Суб'єктам регулярно внутрішньовенно вводили суміш стимуляторів (інформацію див. у додатку 1.1), покликану унеможливити сон, і на весь час експерименту помістили до кімнати, щодня перевіряючи їхній стан під час ін'єкцій. (...)\n\nПроцедура: можливо, через обіцяну після експериментів свободу в перші п'ять днів спостереження суб'єкти не виявляли особливого дискомфорту, а натомість демонстрували підвищену пильність і реакцію на подразники (можливо, побічну дію стимуляторів). На шостий день усі 5 суб'єктів почали виявляти тяжкі психологічні й психіятричні симптоми, зокрема гостру параною, психоз і XXXXXXXXXXX. Експеримент тривав іще XX днів; симптоми поступово погіршувалися, але на XX-й день раптово стихли, а суб'єкти здавалися спокійними й психічно здоровими.\n\nКоли експеримент уже збиралися оголосити успішним, двоє охоронців НКВД відчинили замкнені двері, щоб впустити дослідників. У цю мить один із суб'єктів негайно XXXXXXXXXX одного охоронця, спричинивши миттєву смерть; потім інший охоронець XXXXXXXXXXXXXXXXX на суб'єкті, XXXXXXXXXXXXXXXXXXX завдав XXXXXXXXXXXXXXXXXXXXXX кінцівкам і ділянці статевих органів, можливо XXXXXXXXXXXXXXXXXXXXXXXXXXX зубами (тепер вони зберігаються у сховищі 733 для майбутнього дослідження). Коли суб'єкт упав, решта XXXXXXXXXXXXXXXXXXXXXXXXX дослідницький персонал і військовослужбовців НКВД, що спричинило смерть XX дослідників і X охоронців НКВД, перш ніж XXXXXXXXXXXXXXXXXXXX було ліквідовано. Зазначено, що вони виявляли XXXXXXXXXXXXXXXXXXX, що в одному випадку спричинило розрив XXXXXXX. Для прибирання решток крови та інших XXXXXXXXX сформовано бригаду з другорядних суб'єктів."
 MGN.604.a: "Звіт 7.40.231 завершено."
 MGN.604.a.tt: "51 суб'єкт став непридатним до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."

 #language dep
 MGN.605.t: "Уривки зі звіту про експеримент 5.22.066"
 MGN.605.desc: "У межах серії експериментів із визначення природженої мовної здатности людини, не навченої мови відібрано чотирьох (4) чоловіків і двох (2) жінок віком 12 років, яких дванадцять (12) років тому вилучили з пологового відділення в місті XXXXXXXXXX.\n\nПроцедура: менш ніж через місяць після народження суб'єктів вилучили з мовно насиченого середовища й помістили до випробувального середовища XXXXXX. Доглядачам наказали не намагатися спілкуватися із суб'єктами чи між собою в цьому середовищі, зокрема не використовувати жодних голосових і візуальних сигналів та XXXXXXXX. У всьому іншому суб'єктам надавали стандартні для їхнього віку пайки й умови, зокрема XXXXXXXXXX. Таке середовище мали підтримувати впродовж восьмирічного періоду, названого Першою фазою. Після її завершення середовища суб'єктів об'єднали, а їх познайомили. Суб'єкт C виявив розгубленість і агресію та невиправно XXXXXXXX суб'єкта E, через що обох довелося вилучити з експерименту. Решта четверо виявили цікавість і невдовзі почали демонструвати взаємну прихильність. Експеримент триває чотири роки Другої фази, але жодного спілкування, крім базових сигналів - плачу, сміху й фізичного насильства, - не виникло.\n\nРезультат: неостаточний. Якщо Друга фаза триватиме ще чотири роки й спілкування не розвинеться, експеримент завершать і зареєструють остаточний звіт. Можна буде розглянути дальші дослідження, інакше суб'єктів можуть XXXXXXXX."
 MGN.605.a: "Звіт 5.22.066 завершено."
 MGN.605.a.tt: "55 суб'єктів стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."

 #PSYCHIC
 MGN.607.t: "Уривки зі звіту про експеримент 13.2.053"
 MGN.607.desc: "У межах серії експериментів із невербального, нефізичного й суто ментального, або «екстрасенсорного», спілкування між двома суб'єктами було реквізовано два (2) суб'єкти жіночої статі віком XXXXXXXX (XX) і XXXXXXX (XX) відповідно.\n\nПроцедура: суб'єктам надали дводенний період «налагодження», протягом якого їм не дозволяли віддалятися одна від одної більш як на п'ять метрів. Це мало створити ментальний зв'язок. Потім суб'єктів розділили й помістили до окремих камер за звуконепроникною стіною. Їх опитували двічі на день і вимагали відповісти на запитання, поставлене іншій.\n\nРезультат: експеримент припинено. Дослідник XXXXXXXX спершу був приголомшений, коли лише через XX тижнів процедури суб'єкти почали правильно відповідати на запитання, поставлені тільки іншій. Дослідник XXXXXXX уже готувався оголосити успіх, але перевірка виявила порушення в діях двох суб'єктів. Зрештою з'ясувалося, що вони якимось чином переконали охоронця НКВД, приставленого до експерименту, передавати запитання від однієї до іншої: він слухав в одній кімнаті, записував запитання на маленькому папірці, а тоді швидко просовував його під металевими дверима до суб'єкта в іншій кімнаті, вдаючи, ніби зав'язує шнурівки. Експеримент завершили, охоронця позбавили всіх звань і записали «добровольцем» у дослідницькі суб'єкти."
 MGN.607.a: "Звіт 13.2.053 завершено."
 MGN.607.a.tt: "23 суб'єкти стали непридатними до подальшого використання внаслідок експериментів.\n\nРозсудок Лисенка покращився.\nНКВД дедалі більше непокоять експерименти Лисенка."

 #culture events lysenko

 MGN.2000.t: "Уривок стенограми, тема: найбільша жертва"
 MGN.2000.desc: "-ЗАСЕКРЕЧЕНО-: Товаришу Лисенко, ви просили переглянути висновки наших експериментів над захопленими суб'єктами за останні шість місяців?\n\nЛисенко: Так. Які ваші висновки?\n\n-ЗАСЕКРЕЧЕНО-: Не хочу здіймати тривоги, але... (вагається) після повторного розгляду того, що ми перекласифікували як неостаточні результати, виявилося, що наші гіпотези підтверджувалися разюче рідко.\n\nЛисенко: Ви на щось натякаєте, -ЗАСЕКРЕЧЕНО-?\n\n-ЗАСЕКРЕЧЕНО-: Ні, аж ніяк! Це все з наших власних файлів.\n\nЛисенко: Цікаво. Думка про потребу дещо змінити нашу програму вдосконалення будови тіла вже не давала мені спокою... (коротка пауза) Як часто наші експерименти завершувалися смертю?\n\n-ЗАСЕКРЕЧЕНО-: За моїми даними, не менш як у шістдесяти відсотках вибірки.\n\nЛисенко: Статистику зафіксовано. А що як... (ще одна пауза) ні... не може бути. Коли Колумб заявив, що Земля куляста, з прозірливця глузували й насміхалися. Мої ідеї, мої великі теорії тепер можуть сприймати так само, але минуть століття, і вони стануть загальновизнаним біологічним знанням. Найреволюційніші плани потребують не кволого підкорення застарілій думці минулого, а найсильнішої волі!\n\n-ЗАСЕКРЕЧЕНО-: Звісно! Час вашого наукового генія справді настав."
 MGN.2000.a: "Взяти цю цитату й повісити в рамці на стінах лабораторії."

 MGN.2500.t: "Рукавички скинуто"
 MGN.2500.desc: "Уривок зі звіту 429-2 про геополітику Уралу:\n\nДоведено, що актив «бригада Дірлеванґера» неспроможний стримувати місцеве угруповання «Уральська Ліга». Падіння бойової готовности бригади разом зі смертю суб'єкта Дірлеванґера зробили рештки цього активу непридатними до бойового застосування. Польові групи вилучили якомога більше членів бригади для експериментів типу -ЗАСЕКРЕЧЕНО-.\n\nКомандири НКВД стверджують, що підготовка сил безпеки Маґнітоґорска достатня для утримання периметра впродовж необмеженого часу. Військові плани «Євдокія» та «Ісая» висунуто як найімовірніші способи припинити втручання Ліги. Прогнозовані втрати прикрі, але відповідають узгодженій політиці безпеки.\n\nВорожі підрозділи «Уральської гвардії» визнано найбільшою загрозою дальшому науковому поступові дослідницької групи товариша Лисенка. Високий бойовий дух ворога й прогнозоване застосування передової тактики дій малих підрозділів роблять добре укріплені опорні пункти вирішальними для виснаження досвідчених ворожих солдатів. Позиція -ЗАСЕКРЕЧЕНО- зокрема виявилася придатною, щоб заманити гвардію в безнадійну траншейну війну. У 78.2 відсотка симуляцій гвардія зазнає поразки в прийнятні строки й із прийнятним рівнем утрат."
 MGN.2500.a: "Час солдатів-аматорів минув."

 ### Focus Tree ###
 MGN_the_black_mountain_awakes: "Чорна Гора пробуджується"
 MGN_the_black_mountain_awakes_desc: "Меморандум 1a\n\nВід: директора Т. Лисенка\nКому: всьому персоналові безпеки, науковому й наглядовому персоналові, що нині працює на всіх об'єктах Маґнітоґорска та довколишніх регіонів.\n\nЗміст: усьому персоналові взяти до відома неминуче посилення промислової та оперативної активности. Перелік промислових об'єктів, які треба повернути до повної ефективности протягом наступних трьох (3) місяців стандартного часу, див. в абзаці 2 «Наказів про відновлення промисловости». Усі дослідницькі об'єкти слід негайно повернути до робочого стану. Якщо виробничих квот і квот ефективности з документа 112.a не буде виконано, персонал безпеки НКВД застосує виправні заходи. Кінець меморандуму."
 MGN_the_black_mountain_awakes_1: "Це відкриє рішення щодо професіоналізму армії.\n"

 MGN_remove_obstructions: "Усунути перешкоди"
 MGN_remove_obstructions_desc: "Комюніке 17.c\n\nКому: генерал-лейтенантові Стєпану Бункову\n\nЗміст: особовому складові НКВД наказано негайно ліквідувати всіх суб'єктів зі списку 66, підрозділів 3 (колишні цивільні адміністратори), 5 (неефективний персонал) і 17 (потенційні підривні елементи). Персонал безпеки НКВД уповноважено застосовувати смертельну силу, якщо суб'єкти або інші особи спробують перешкодити чи затримати операцію. Тіла ліквідованих суб'єктів слід передати Підкомітетові анатомічних досліджень для майбутніх експериментів або використання в оптимізації сільського господарства. Директор Лисенко наглядатиме за призначенням нового персоналу на звільнені посади. Комюніке 17.c завершено."

 MGN_armanment_plan_C: "План озброєння C"
 MGN_armanment_plan_C_desc: "Меморандум 22b\n\nЗміст: усьому керівному персоналові промислових об'єктів узяти до відома неминуче запровадження Плану озброєння C і пов'язаних підпроєктів. Відомості про масштаб і подробиці див. у справах Плану озброєння C. Усі запити на потрібні припаси й військові засоби слід надсилати Комітетові ресурсної логістики для розгляду й процедурного схвалення. Потрібна повна виробнича ефективність: про всі перешкоди негайно повідомляти Центральну дирекцію або персонал безпеки НКВД; вони спричинять повну перевірку персоналу. Кінець меморандуму."

 MGN_soviet_supply_cache_search: "Пошук совєцьких сховищ"
 MGN_soviet_supply_cache_search_desc: "КОМЮНІКЕ 80.a\n\nКолишні арсенали Червоної Армії розкидано по Південному Уралу (див. долучений додатковий список). Вони походять із часів Великої Вітчизняної війни й зберігають багато зброї та боєприпасів у майже ідеальному стані. Вище командування вирішило почати розкопування, облік і розподіл цієї зброї серед військ. Роботи розпочати негайно. (За додатковими відомостями звертатися до Підкомітету розкопок і відновлення.)"

 MGN_supply_production_planning: "План виробництва припасів"
 MGN_supply_production_planning_desc: "КОМЮНІКЕ 45.d\n\nНинішнє промислове виробництво швидко падає (показники виробництва й зростання ВВП за попередні чотири роки див. на стор. 4; відомості про показники виробництва - в економічному компендіумі). Два (2) тижні тому совєцькі економісти Маґнітоґорска зібралися, щоб обговорити повернення промислового виробництва до стабільного рівня до відокремлення. Після перевірки промислових наглядачів (див. командну структуру в «Компендіумі промисловости», а також історичні відомості про промислові структури СССР і приватизацію) економісти дійшли висновку, що частина наглядачів не відповідає посадам і, можливо, краще послужить матеріалом або суб'єктами майбутніх експериментів над психічно хворими й непридатними особами. Їх замінить новий комітет, який наглядатиме за промисловістю та підвищуватиме продуктивність.\n\nКОМЮНІКЕ 45.d завершено."

 MGN_combat_preparation_readiness: "Готовність до бойових дій"
 MGN_combat_preparation_readiness_desc: "КОМЮНІКЕ 32.i\n\nБільшість економіки Маґнітоґорска спрямовано на цивільне виробництво, а збройні сили демобілізовано. Негайну мобілізацію слід розпочати якнайшвидше. У разі війни військові й цивільні сили від першої миті будуть готові служити на повну потужність. ОБОРОНА ДЕРЖАВИ МАЄ НАЙВИЩИЙ ПРІОРИТЕТ. (За додатковими відомостями звертатися до Підкомітету бойової готовности.)\n\nКОМЮНІКЕ 32.i завершено."
 MGN_combat_preparation_readiness_1: "Збільшить §YГотовність армії§! на 15%\n"

 MGN_force_weaponry_integration: "Інтеграція озброєння у війська"
 MGN_force_weaponry_integration_desc: "Комюніке 16.b\n\nВід: канцелярії товариша Лисенка\n\nЩодо підготовки зі зброєю у фронтових підрозділах: аналіз логістичних труднощів регіону дій показав потребу готувати солдатів до роботи з матеріялами, здобутими під час служби. Бойова ефективність польових оперативників значно зросте, якщо навчити їх використовувати й обслуговувати ширший набір зброї, ніж виданий спочатку. Це заохотить застосовувати трофейне озброєння, коли штатну зброю пошкоджено й неможливо швидко полагодити чи замінити. До програми можуть увійти перероблені мисливські рушниці Уральської гвардії, застаріла німецька зброя, якою озброєна більшість бригади Дірлеванґера та стара совєцька зброя комун біля Орєнбурґа. Усі вони поступаються маґнітоґорським зразкам, але широко доступні в полі. Солдатів навчать використовувати їх якнайефективніше за потреби."
 MGN_force_weaponry_integration_1: "Зменшить §YВишкіл армії§! на 5%\nЗменшить §YГотовність армії§! на 5%\n"

 MGN_extraction_team_training_regime: "Режим підготовки груп вилучення"
 MGN_extraction_team_training_regime_desc: "КОМЮНІКЕ 25.b\n\nЗ КАНЦЕЛЯРІЇ ТОВАРИША ЛИСЕНКА\n\nНедавні напади майбутніх і потенційних суб'єктів на війська (див. долучені відомості) спричинили створення нової навчальної групи - «Координаційної групи вилучення суб'єктів» (КГВС), яка перебудує підготовку підрозділів до вилучення суб'єктів і поширить програму на кожен бойовий підрозділ та всіх військовиків. (Докладніше про КГВС див. щоденний бюлетень.)\n\nКОМЮНІКЕ 25.b завершено."
 MGN_extraction_team_training_regime_1: "Збільшить §YВишкіл армії§! на 10%\n"

 MGN_soviet_training_mimicry: "Наслідувати совєцький вишкіл"
 MGN_soviet_training_mimicry_desc: "КОМЮНІКЕ 12.f\n\nТактика Червоної Армії до Великої Вітчизняної війни наголошувала на оперативному плануванні та стратегії глибокого бою. Вище командування визнало ці доктрини НЕЗАМІННИМИ (див. «Довідник совєцької військової доктрини» або зверніться до представництва Вищого командування). Нові програми навчатимуть цих доктрин і розвиватимуть їх, створюючи армію, що служить державі й зберігає традиції національної оборони.\n\nКОМЮНІКЕ 12.f завершено."
 MGN_soviet_training_mimicry_1: "Збільшить §YВишкіл армії§! на 2%\n"

 MGN_the_enemy_of_the_enemy: "Ворог мого ворога..."
 MGN_the_enemy_of_the_enemy_desc: "КОМЮНІКЕ 38.b\n\nДОПУСК: A\n\nОстаннім часом Оскар Дірлеванґер і його бандитське угруповання, відоме як бригада Дірлеванґера, посилили агресію проти Уральської Ліги й селянських комун Орєнбурґа. Ми можемо скористатися цим, запропонувавши союз. Більшість нинішньої загрози для нас походить від Уральської Ліги. Тимчасовий союзник, фашист чи ні, допоможе відбити цю протодержаву."

 MGN_fortification_production_charter: "Статут будівництва укріплень"
 MGN_fortification_production_charter_desc: "Комюніке 8.b канцелярії товариша Лисенка оголосило негайне запровадження Хартії виробництва укріплень. Сили й ресурси спрямувати до визначених районів (див. пріоритети в розділі 2C-A), де під наглядом призначених техніків почнеться будівництво. Кінець комюніке."

 MGN_BOU: "БОУ"
 MGN_BOU_desc: "Комюніке 9.b канцелярії товариша Лисенка дозволило створити Бюро оборонного управління (БОУ) під суворим наглядом товариша Лисенка й уповноважених інженерів-фортифікаторів. Бюро наглядатиме за всім оборонним будівництвом і негайно отримає доступ до всіх шифрованих документів рівня 2E та нижче. Кінець комюніке."

 MGN_fortification_building: "Будівництво укріплень"
 MGN_fortification_building_desc: "Комюніке 9.b канцелярії товариша Лисенка оприлюднило плани перших укріплень для підготовки до можливого нападу на штаб товариша Лисенка. На час будівництва БОУ надано тимчасовий доступ до документів рівня 2D. Кінець комюніке."
 MGN_fortification_building_1: "Збільшить §YГотовність армії§! на 3%\n"

 MGN_hostile_attrition_preparation: "Підготовка до виснаження ворога"
 MGN_hostile_attrition_preparation_desc: "Комюніке 9.d канцелярії товариша Лисенка визначило негайні зміни маршрутів доступу 1A-A-3A-C, що знизять ефективність гаданих ворожих ліній постачання. Згодом такі самі зміни внесуть до маршрутів 3A-B-5C-B. Кінець комюніке."

 MGN_redoubt_preparation: "Підготовка редутів"
 MGN_redoubt_preparation_desc: "Комюніке 9.d канцелярії товариша Лисенка визначило місця підготовки редутів (див. розташування укріплень у розділі 2A-A). Вони дадуть визначеним силам змогу передислокуватися й знову укріпитися в разі прориву першої оборонної лінії. Кінець комюніке."
 MGN_redoubt_preparation_1: "Збільшить §YГотовність армії§! на 5%\n"

 MGN_attrition_preparations: "Підготовка до виснаження"
 MGN_attrition_preparations_desc: "Комюніке 10.d канцелярії товариша Лисенка наказало створити другорядні маршрути доступу на випадок прориву першої оборонної лінії, щоб ефективніше затримувати переслідування ворога. Усім працівникам із допуском 2C та нижче доступ заборонено без дозволу БОУ або товариша Лисенка. Кінець комюніке."
 MGN_attrition_preparations_tt: "Збільшить §YГотовність армії§! на 5%\n"

 MGN_the_super_soldat: "Суперсолдат"
 MGN_the_super_soldat_desc: "Канцелярія товариша Лисенка оприлюднила комюніке 8.c про успіх перших експериментів над добровольцями Проєкту людського ламаркізму, що знову довело революційну славу праці товариша Лисенка. Дальші експерименти проводитимуть на рівні 2B-C, закритому для персоналу з допуском 1C та нижче. Новим добровольцям слід з'явитися на огляд на рівні 1A-A Маґнітоґорського планового центру. Кінець комюніке."

 MGN_PZS: "ПЗС"
 MGN_PZS_desc: "Комюніке 9.c канцелярії товариша Лисенка оголосило успіх перших експериментів Программи Зімнєґо Солдата (Програми «Зимовий солдат») і перший крок до подолання фізичних слабкостей людини. Через розширення програми на вершинах Маґнітоґорска створено тимчасові дослідницькі об'єкти (див. розділ 2A-B). Доступ мають лише рівні допуску 1A та 2A. Кінець комюніке."
 BAZ_PZS_tt: "Зменшить §YВишкіл армії§! на 5%\nЗбільшить §YГотовність армії§! на 7%\n"

 MGN_acquirement_of_subjects: "Реквізиція суб'єктів"
 MGN_acquirement_of_subjects_desc: "ШИФРОВАНИЙ ДОКУМЕНТ 3F-E. ДЛЯ ПЕРСОНАЛУ РІВНЯ 2A Й ВИЩЕ. Товариш Лисенко наказав невпинно реквізувати суб'єктів для дальших експериментів. Потреба подвійна: по-перше, навколо Маґнітоґорска бракує суб'єктів для посилення умов експериментів, а дальша втрата людських ресурсів промислової бази обмежить розширення проєктів; по-друге, товариш Лисенко зацікавлений у генетичних властивостях, набутих суб'єктами з довколишніх районів і сподівається, що пережиті ними тяжкі умови дадуть цінні результати. Сили вже спрямовано на операцію станом на укладення цього документа. КІНЕЦЬ ШИФРОВАНОГО ДОКУМЕНТА."
 MGN_acquirement_of_subjects_tt: "Це дасть змогу §Yреквізувати суб'єктів§! для випробувань.\n"

 MGN_exploitation_of_acquired_areas: "Експлуатація захоплених територій"
 MGN_exploitation_of_acquired_areas_desc: "Комюніке 15.c канцелярії товариша Лисенка оголосило початок програми вилучення ресурсів із недавно здобутих районів. Промисловий і безпековий персонал має бути готовий до раптової обов'язкової передислокації, бо товариш Лисенко вимагає повної ефективности у вилученні ресурсів із цих досі небезпечних територій. Кінець комюніке."
 MGN_exploitation_of_acquired_areas_tt: "Ми зберемо ще більше суб'єктів §Yна всіх землях, якими тепер правимо§!.\n\nЗначно покращить розсудок Лисенка.\nЦе значно посилить невдоволення НКВД."

 MGN_synergistic_cooperation_solutions: "Рішення синергічної співпраці"
 MGN_synergistic_cooperation_solutions_desc: "Канцелярія товариша Лисенка передала комюніке 8.a зі стислим змістом «Планової конференції із синергійної співпраці». Вона визначила зміни в процедурах безпеки й методах підготовки, які поліпшать ефективність і гнучкість заходів безпеки. Зміни запровадити негайно й повністю. Кінець комюніке."

 MGN_SVV: "СВВ"
 MGN_SVV_desc: "Комюніке 9.a канцелярії товариша Лисенка оголосило створення Сєкції вспомоґатєльноґо вооружєнія (Секції допоміжного озброєння). Ця окрема частина промислових потужностей вироблятиме лише спорядження для допоміжних формувань головних сил безпеки. Кінець комюніке."
 MGN_SVV_1: "Збільшить §YВишкіл армії§! на 10%\n"

 MGN_market_openings: "Відкриття ринків"
 MGN_market_openings_desc: "Комюніке 10.a канцелярії товариша Лисенка розкрило чудові ринкові можливості, що виникли завдяки новій торговельній політиці товариша Лисенка. Підприємливому персоналові всіх рівнів допуску пропонують поділитися думками з Центральним плановим комітетом Маґнітоґорска у вказаний нижче час. Кінець комюніке."

 MGN_foreign_training: "Іноземний вишкіл"
 MGN_foreign_training_desc: "ШИФРОВАНИЙ ДОКУМЕНТ 2B-D. ДЛЯ ПЕРСОНАЛУ РІВНЯ 2C Й ВИЩЕ. Товариш Лисенко оцінив бойові спроможності сил безпеки як недостатні. Він і Консультативний комітет безпеки встановили, що проблема в одноманітній доктрині підготовки 22-ї мотострілецької дивізії НКВД. Товариш Лисенко наказав запозичити закордонні методи, вважаючи, що випробування суперечливих доктрин неминуче виявить найсильніші. КІНЕЦЬ ШИФРОВАНОГО ДОКУМЕНТА."
 MGN_foreign_training_1: "Збільшить §YВишкіл армії§! на 10%\n"

 MGN_armament_acquisitions: "Закупівля озброєння"
 MGN_armament_acquisitions_desc: "КОМЮНІКЕ 790.c\n\nБрак стрілецької зброї змусив шукати інші способи її придбання. Сусідні воєначальники масово виробляють стрілецьку зброю. Дипломатична канцелярія, підрозділ Державного комітету, надішле посланців до сусідніх воєначальників, щоб придбати зброю.\n\nОБОРОНА ДЕРЖАВИ МАЄ НАЙВИЩИЙ ПРІОРИТЕТ. КІНЕЦЬ КОМЮНІКЕ."

 MGN_weaponry_drills: "Вишкіл зі зброєю"
 MGN_weaponry_drills_desc: "КОМЮНІКЕ 12.d\n\nНинішні режими підготовки ставлять солдата в умови й ситуації, які рідко трапляються в полі (див. «Альманах типових бойових ситуацій»). Нові системи залучатимуть солдатів на різних місцевостях - полях і в горах - та протиставлятимуть їм належніше спорядження й зброю. Суб'єктів можна використовувати як мішені (одноразові суб'єкти - список 62, розділ 7). Для найбільшої ефективности завжди застосовувати бойові набої.\n\nКОМЮНІКЕ 12.d ЗАВЕРШЕНО"
 MGN_weaponry_drills_1: "Збільшить §YВишкіл армії§! на 15%\n"

 MGN_fortress_construction: "Будівництво фортеці"
 MGN_fortress_construction_desc: "КОМЮНІКЕ 45.e\n\nНинішні системи укріплень (подробиці про наявні укріплення й оборонні системи див. на карті 32 та у відповідних додатках) застарівають і не витримають раптового потужного наступу ворога. Командування НКВД і директор Лисенко розробили план перебудови й спорудження укріплень. (За додатковою інформацією зверніться до Управління оборони, а також див. стор. 3 долученого додатка.) У стратегічних місцях, указаних на карті 36 (див. додатки), збудують нові бункери, каземати, траншеї, довготривалі вогневі точки, кулеметні позиції, огорожі з колючого дроту, мінні поля, спостережні вежі й арсенали. Усіх суб'єктів зі списку 102 (див. додатки) можна примусити до будівельних робіт.\n\nКОМЮНІКЕ 45.e ЗАВЕРШЕНО"

 MGN_limited_force_integration: "Обмежена інтеграція сил"
 MGN_limited_force_integration_desc: "КОМЮНІКЕ 23.d\n\nБандитське угруповання Оскара Дірлеванґера, надалі «бригада Дірлеванґера», цілком позбавлене військової підготовки й дисципліни та є лише мандрівною зграєю нерозумних головорізів. Медична допомога пораненим також становить для них серйозну проблему. Товариш Лисенко наказав допомогти їм проти розширення Уральської Ліги, відрядивши інструкторів і бойовий особовий склад НКВД для допомоги бригаді Дірлеванґера в бойових операціях і підготовці. Бойові медики НКВД лікуватимуть поранених бандитів. (Див. стор. 4.)\n\nПідвищення боєздатности бригади має високий пріоритет, бо вона потрібна для зриву операцій Уральської Ліги й обмеження розширення Орєнбурґа.\n\nКОМЮНІКЕ 23.d ЗАВЕРШЕНО"

 MGN_advisory_methods: "Методи радників"
 MGN_advisory_methods_desc: "Комюніке 28.\n\nЗбройні сили держав поза колишнім Совєцьким Союзом (геополітичний стан у листопаді 1963 року див. на карті 4) значно організованіші й краще навчені за сили уламкових держав і воєначальників на схід від Уралу, а тому й ефективніші. Вище командування організувало найм колишніх військових офіцерів, тепер найманців, із:\n-Китаю\n-Індії\n-Туреччини\n-Ірану\nщоб підвищити стандарти підготовки солдатів 22-ї мотострілецької дивізії НКВД. Кінець комюніке."
 MGN_advisory_methods_1: "Збільшить §YВишкіл армії§! на 10%\n"

 MGN_defensive_preparations: "Оборонні приготування"
 MGN_defensive_preparations_desc: "КОМЮНІКЕ 49.a\n\nНова програма Вищого командування запровадить раптові навчання та інші імітовані ситуації без попередження. Це підвищить універсальність бійців і підготує їх до будь-яких умов. (Додаткові відомості див. стор. 4.) Навчання почати якнайшвидше.\n\nКОМЮНІКЕ 49.a ЗАВЕРШЕНО"

 MGN_cry_havoc: "Хай гине все!"
 MGN_cry_havoc_desc: "КОМЮНІКЕ 84.f\n\nЗ КАНЦЕЛЯРІЇ ЛИСЕНКА\n\nНОВА ПРОПОЗИЦІЯ ВІЙСЬКОВОГО ПЛАНУВАННЯ a.10\nНові програми підготовки (перелік колишніх і нинішніх програм Маґнітоґорска та ширшого СССР (Союзу Совєцьких Соціялістичних Республік, або Совєцького Союзу) див. в додатку) заохочуватимуть солдатів застосовувати нову партизанську тактику проти ворогів і сепаратистів (див. звіт про минулу партизанську боротьбу в Південній Африці між США й бурсько-німецькими колоніяльними силами, а також довідник і компендіум). Видати нові комплекти камуфляжу, програми й однострої (перелік дозволених одностроїв у розділі архіву d3) та навчати тактики «страху» проти ворога.\n\nКОМЮНІКЕ 84.f ЗАВЕРШЕНО"
 MGN_cry_havoc_1: "Збільшить §YВишкіл армії§! на 10%\n"

 MGN_let_them_come: "Нехай приходять"
 MGN_let_them_come_desc: "За комюніке 96 всі бойові групи мають прибути до кордонів з Уральською Лігою та Орєнбурґом і негайно будувати укріплення. Порушення умов мобілізації з комюніке 34 вважається порушенням розділу 3.A й карається належно. Невиконання будівельних квот призведе до негайної ліквідації з особливою жорстокістю. Нижче вантажний маніфест:\n\n300 кілограмів заповнювача\n 80 літрів води\n 60 кілограмів цементу\n 30 лопат\n 2 524 одиниці стрілецької зброї\n 81 суб'єкт чоловічої статі (охоронці)\n 540 суб'єктів чоловічої статі (головно для будівництва)\n\nОсобиста примітка: офіцери самі виберуть місця, але невдачі я не потерплю. Стандартні розміри довготривалої вогневої точки - 5-5-3 метри.\n\nКінець комюніке."
 MGN_let_them_come_1: "Збільшить §YГотовність армії§! на 10%\n"

 MGN_let_slip_the_hounds_of_war: "Спустити псів війни"
 MGN_let_slip_the_hounds_of_war_desc: "Товариш Лисенко наказав скасувати комюніке 96 і замінити його комюніке 102:\n\nБойові групи перевести в готовність і чекати контакту з ворогом. Будівництво зупинити, незайнятих суб'єктів повернути до Чорної Гори для дальших експериментів. За оцінкою спостережних груп, сили ворога становлять від 5 000 до 25 000 осіб. Групам за жодних обставин не залишати постів. У разі порушення малий полк застосує розділ 4, главу 8 дисциплінарного протоколу НКВД. 22-й дивізії мобілізувати всі резерви й чекати наказів. Жоден ворог не має дістатися Чорної Гори.\n\nКінець комюніке."
 MGN_let_slip_the_hounds_of_war_1: "Відкриє рішення щодо воєначальників\n"

 MGN_target_urals: "Ціль: Урал"
 MGN_target_urals_desc: "Комюніке 102, додаток A: «Бойові групи зосередити проти Уральської Ліги. Через великий бойовий досвід і високий рівень підготовки Уральська гвардія становить значно більшу загрозу за комунні підрозділи. Сили на цьому фронті тимчасово матимуть пріоритет у постачанні й поповненні над силами проти Орєнбурґа. Незвичайна витривалість гвардійців робить їх пріоритетними цілями для захоплення живцем. Групи реквізиції працюватимуть лише на фронті Ліги, доки не здобудуть достатню кількість живих суб'єктів для випробувань. Кінець додатка»."

 MGN_target_orenburg: "Ціль: Орєнбурґ"
 MGN_target_orenburg_desc: "Комюніке 102, додаток B: «Бойові групи зосередити проти орєнбурзьких комун. Через більше населення й промисловість там значно вища концентрація живих і неживих ресурсів, ніж в Уральській Лізі. Сили на цьому фронті тимчасово матимуть пріоритет у постачанні й поповненні над силами проти Уральської гвардії. Велике населення має дати надзвичайно багато кандидатів для випробувань. Групи реквізиції працюватимуть лише на Орєнбурзькому фронті, а їхні місячні квоти на час бойових дій подвоять. Кінець додатка»."

 MGN_the_carrot_and_the_stick: "Батіг і пряник"
 MGN_the_carrot_and_the_stick_desc: "КОМЮНІКЕ 107.e\n\nНа час укладання цього комюніке бригада Дірлеванґера (інша назва - «бандити Дірлеванґера»; див. назви й етимологію бунтівних совєцьких адміністративних одиниць, що нині намагаються незаконно відокремитися від СССР) становить велику загрозу безпеці Маґнітоґорска (див. перелік адміністративних одиниць СССР, а також матеріали про загальну безпеку Орєнбурзької области як єдиного цілого).\nТовариш Лисенко особисто розробив план a.9, або «БАТІГ І ПРЯНИК» (див. перелік військових пропозицій в архіві підрозділу b7). За планом a.9 «БАТІГ І ПРЯНИК» низку підрозділів зі спорядженням і бойовим одностроєм c89-2b (перелік батальйонів та спорядження, яке їм буде видано, див. на стор. 1-5 додатка) відрядять на маґнітоґорський кордон поблизу зони фактичного контролю бригади Дірлеванґера. Батальйонам накажуть брататися й заводити знайомства з членами бригади Дірлеванґера. Цю нагоду для братання потім використають і розвинуть у шпигунські операції (історичні відомості про шпигунство та його методи див. у довіднику). Воякам накажуть збирати стратегічні відомості про слабкі місця командної структури бригади (див. командні структури бунтівних адміністративних одиниць на стор. 9). Після збору відомостей вони повернуться на базу й передадуть їх. Докладнішу інформацію див. у долучених додатках.\n\nКОМЮНІКЕ 107.e ЗАВЕРШЕНО"

 MGN_demand_uralian_tribute: "Вимагати данину з Уралу"
 MGN_demand_uralian_tribute_desc: "Лист до Уральської Ліги: «Вітання з Маґнітоґорска. Хочу похвалити ваших людей за чудову організацію й захист від небезпек цього сумного світу. У кожному бачу великий потенціял. Тому вважаю, що обом сторонам буде вигідний обмін людьми з гвардії до наших лабораторій. Попри безпідставні й злобні чутки про мої дослідження, запевняю: як до гостей до них ставитимуться з належними повагою й гідністю. Та мушу наголосити: через нагальність становища в Росії відмова неможлива й матиме відповідні наслідки. Сподіваюся, ви виявите розсудливість і чекатимете обміну так само палко.\n\nЗ найкращими побажаннями, Трохим Лисенко»."
 MGN_demand_uralian_tribute_1: "Ми вилучимо 300 суб'єктів з Уральської Ліги.\n"

 MGN_demand_orenburgian_tribute: "Вимагати данину з Орєнбурґа"
 MGN_demand_orenburgian_tribute_desc: "КОМЮНІКЕ 81.f\n\nСамопроголошена анархо-соціялістична держава Орєнбурґ (див. «Компендіум політичних ідеологій») - переважно роз'єднана сукупність малих селянських сіл (див. карту, стор. 5). Вони є легкою ціллю для вилучення суб'єктів. Вимагаючи регулярного постачання, ми уникнемо збройного конфлікту й збережемо потік суб'єктів. (Див. «Довідник економіки потоку суб'єктів» і «Довідник системи данини суб'єктами».)\n\nКОМЮНІКЕ 81.f ЗАВЕРШЕНО"
 MGN_demand_orenburgian_tribute_1: "Ми вилучимо 500 суб'єктів з орєнбурзьких комун.\n"

 MGN_reward_the_bandits: "Винагородити бандитів"
 MGN_reward_the_bandits_desc: "Відкритий лист нашим відданим союзникам в Орську: я, Трохим Лисенко, шлю найкращі побажання. Переглянувши нинішню основу нашого союзу, я вирішив, що солдати й допоміжні сили «бригади Дірлеванґера» заслуговують на додаткову винагороду. Щиро вітаю всіх солдатів, які досі співпрацювали з нами, і сподіваюся, цей жест покаже мою відданість відплаті та збереженню взаємовигідного союзу.\n\nЗ найкращими побажаннями, Трохим Лисенко"

 MGN_it_was_a_honor: "Це була честь..."
 MGN_it_was_a_honor_desc: "Уривок зі стенограми наради щодо відданости Оскара Дірлеванґера та його бригади, розділ 4, прохід 6, ряд 5:\n\nДиректор Т. Л.: Відданість цих людей у найкращому разі вкрай ненадійна. Далі їм довіряти не можна.\n\nДослідник Г. О.: Це правда, але поки практичніше тимчасово зберегти союз. Якщо глибше ввійдемо в їхню жалюгідно слабку командну структуру, то легше їх контролюватимемо й відносно легко ліквідуємо, коли настане час.\n\nДиректор Т. Л.: Це за умови, що вони взагалі слухають командування. Заради власної безпеки й бодай якоїсь надії перемогти їх ми мусимо розірвати зв'язки зараз.\n\nГенерал-лейтенант С. Б.: Наполегливо прошу вас хоча б переглянути позицію.\n\nКІНЕЦЬ УРИВКА"

 MGN_but_rabid_dogs_must_be_put_down: "...Але скажених псів треба приспати"
 MGN_but_rabid_dogs_must_be_put_down_desc: "Комюніке 22.b канцелярії товариша Лисенка закликало негайно ліквідувати німця Оскара Дірлеванґера та його «бригаду». Сили мають негайно оточити й роззброїти усі підрозділи Дірлеванґера, з якими вони діють спільно та підготувати їх до вилучення ресурсів. Самого Дірлеванґера, якщо можливо, взяти живцем для експериментів. Кінець комюніке."

 MGN_the_mountain_holds_firm: "Гора стоїть непохитно"
 MGN_the_mountain_holds_firm_desc: "Пункт порядку денного 14: після успішного усунення всієї опозиції в регіоні товаришеві Лисенку радять виголосити звіт за підсумками бойових дій. Слід висвітлити дії наших сил проти ворога, дії ворога проти нас, загальну ефективність стратегії й можливі вдосконалення, а головне - досягнуті цілі: здобуття резервів суб'єктів, стабілізацію регіону, успішне випробування військових експериментів під час конфлікту тощо. Також радять прочитати звіт перед живою авдиторією й транслювати його слова по радіо для всіх слухачів. Це має помітно підвищити бойовий дух населення Маґнітоґорска й довколишнього регіону."

 MGN_the_road_we_tread_is_ours: "Ми йдемо власним шляхом"
 MGN_the_road_we_tread_is_ours_desc: "Пункт порядку денного 14, продовження: після оцінки конфлікту Лисенкові слід обговорити майбутнє Маґнітоґорска після перемоги над усіма силами, що перешкоджали нам. Рекомендовані тези: відновлена прихильність до важливих напрямів досліджень, як-от керована еволюція й генетичні маніпуляції; нове, безпечніше й заможніше майбутнє жителів Південного Уралу; обіцянка відбудувати пошкоджені райони новим, ефективнішим способом для дальшої інтеграції з Маґнітоґорском. Цей перелік дасть людям оптимістичніше ставлення до власного майбутнього, що прямо пов'язано зі зростанням продуктивности й покори."

 MGN_all_alone: "Самі"
 MGN_all_alone_desc: "Звіт про стан Південного Уралу: після завершення бойових дій і встановлення контролю наших сил над регіоном в усіх секторах помічено зростання ефективности. Промислове виробництво невпинно зростає, здобуто багато суб'єктів, а опір нашій владі майже зник. Усі дані вказують, що без несподіваних перешкод поліпшення й відновлення триватимуть у передбачуваному майбутньому. Ліквідація ворогів створила тісніше інтегрований, мирний і ефективно впорядкований регіон під пильним проводом Маґнітоґорска та Чорної Гори."

 #NKVD FOCUS TREE NAMES
 MGN_NKVD_coup_initial: "Дерево НКВД Маґнітоґорска"
 MGN_NKVD_coup_pushback: "Опір НКВД"
 MGN_NKVD_coup_good: "Справедливий і демократичний НКВД"
 MGN_NKVD_coup_evil: "Деспотичний і несправедливий НКВД"

 #NKVD focuses
 MGN_NKVD_Triumphant: "НКВД тріюмфує!"
 MGN_NKVD_Triumphant_desc: "За наказом товариша генерал-лейтенанта Стєпана Бункова 22-га мотострілецька дивізія НКВД виступила проти свого колишнього господаря Трохима Лисенка й узяла Маґнітоґорск під контроль. Правлінню божевільного науковця та його посіпак покладено край: люди НКВД уже заарештували й стратили більшість оточення Лисенка та створили нову командну структуру, цілком укомплектовану відданими Бункову людьми. Коли над Чорною Горою сходить новий день, жителі Маґнітоґорска радіють смерті ненависного колишнього господаря. Та НКВД теж не надто люблять, тож найбільші песимісти питають, чи справді це зміна на краще; дехто навіть натякає, що колись часи товариша Лисенка згадуватимуть із теплотою..."

 MGN_NKVD_pushback_from_locals: "Опір місцевих?"
 MGN_NKVD_pushback_from_locals_desc: "Попри все, що ми зробили для сіл Чорної Гори після падіння Лисенка, вони, схоже, починають, скажімо так, «непокоїтися» через нашу дедалі сильнішу присутність. Треба втримати їх у покорі, щоб не похитнути встановлений нами в регіоні рівень безпеки."

 MGN_NKVD_placate_them: "Заспокоїти їх"
 MGN_NKVD_placate_them_desc: "Треба сісти із селянами за стіл і знайти компроміс. Ми не потвори, а вони не скажені пси. Не слід ставитися одне до одного так, ніби ми й справді потвори, а вони - скажені пси."

 MGN_NKVD_punish_them: "Покарати їх"
 MGN_NKVD_punish_them_desc: "Очевидно, щоб утримати села в покорі, потрібні дальші заходи. Ми запровадимо комендантську годину для тих, хто агітує проти режиму. Водночас вони мають зрозуміти: це для їхнього ж добра й не було б потрібне, якби вони лишалися відданими єдиній організації, що гарантує їм безпеку."

 MGN_NKVD_lesson_learned: "Засвоєний урок"
 MGN_NKVD_lesson_learned_desc: "Чи йдеться про компроміс, чи про позбавлення частини свобод, ясно: якщо ми ослабимо тиск, селяни агітуватимуть далі. Та чи можемо ми дозволити собі перетворитися на стереотипне уявлення людей про НКВД?"

 MGN_NKVD_justice_for_dead: "Справедливість для мертвих"
 MGN_NKVD_justice_for_dead_desc: "Кількість жертв божевілля Лисенка досі невідома, а повний масштаб руйнувань не підраховано. Виділивши ресурси на облік, класифікацію й докладний опис, ми почнемо повертати регіонові бодай подобу порядку та віддамо загиблим ту справедливість, яку ще можемо."

 MGN_NKVD_rebuild_local_communities: "Відбудувати місцеві громади"
 MGN_NKVD_rebuild_local_communities_desc: "Через Лисенка інфраструктура поза горою в найкращому разі на межі розвалу, а в найгіршому - не існує. Більшість громад, що постраждали від його терору, не має чистої води чи житла. Не дивно, що місцеві гірко ненавидять нашу владу. Та ненависть можна спрямувати на цапів-відбувайлів і водночас створити добре враження про 22-гу дивізію. Відбудовуючи Маґнітоґорск, ми зможемо відмежуватися від Лисенка. Почнімо з доріг і відновлення менших споруд по всьому Маґнітоґорску."

 MGN_NKVD_reunite_loved_ones: "Возз'єднати близьких"
 MGN_NKVD_reunite_loved_ones_desc: "Після болю, страждань, ізоляції й мук, спричинених викраденнями Лисенка, ми нарешті починаємо возз'єднувати колишніх в'язнів Чорної Гори з родинами. Наші громадяни й товариші знову зможуть обійняти своїх дружин і відчути їхню теплу ніжність, а багато хто - теплий сміх, невинність та енергію дітей. Ніколи більше ми не руйнуватимемо життя тих, хто чекає від нас захисту. Ніколи більше така жорстокість не роздиратиме родини Маґнітоґорска. Ніколи більше невинні не відчують злого дотику божевілля Лисенка."

 MGN_NKVD_peace_and_order: "Мир і порядок"
 MGN_NKVD_peace_and_order_desc: "Зміна керівництва Маґнітоґорска передбачувано спричинила нестабільність у сусідніх районах під контролем Чорної Гори. Бандитизм зростає й стане серйозною проблемою, якщо не діяти негайно. Товариш Бунков наказав розгорнути кілька підрозділів НКВД у ключових місцях сільської місцевости, щоб убезпечити регіон і забезпечити мир. Ми не можемо дозволити скотитися назад в анархію й хаос, а 22-га мотострілецька дивізія НКВД - єдина сила, здатна підтримувати мир і порядок навколо Чорної Гори."

 MGN_NKVD_de_lysenkoization: "Делисенкізація"
 MGN_NKVD_de_lysenkoization_desc: "У «таємній промові» перед вузьким колом НКВД наш лідер Стєпан Бунков окреслив глибину жахіть, учинених проти народу Чорної Гори. Від сьогодні ясно: треба вжити серйозних заходів, щоб цілком і остаточно усунути всі сліди впливу Лисенка."

 MGN_NKVD_intelligentsia_purges: "Подальші чистки інтеліґенції?"
 MGN_NKVD_intelligentsia_purges_desc: "Інтелігенція - вчителі, професори, науковці й дослідники - заражає нашу державу, наче бактерії криницю. Вони змовляються проти самого нашого існування, вдаючи, ніби виховують молодь і створюють зброю. Як пережитки корумпованої технократії Лисенка, вони не мають місця в цивілізованому комуністичному суспільстві, не можуть руйнувати політичну тканину й навчати молодь соціяльного фашизму та інших підривних ідеологій. Але треба вирішити: витратити дорогоцінні ресурси на винищення хвороби чи просто відпустити їх псувати наших дітей?"

 MGN_NKVD_bandit_connections: "Зв'язки з бандитами?"
 MGN_NKVD_bandit_connections_desc: "Режим Лисенка не був тоталітарною державою, якою він називав чи хотів зробити Маґнітоґорск. Це була країна, просякнута корупцією, з безліччю прогалин, завдяки яким і далі процвітав страшний дух бандитизму. Ті в уряді й народі, хто мав вигоду від бандитів і злочинців, спілкувався з ними або сам був бандитом - через братання, дезертирство, зраду чи інакше, - не матимуть місця в нашому уряді й світі. Убити їх або, що гірше, вигнати."

 MGN_NKVD_approved_texts: "Схвалені тексти?"
 MGN_NKVD_approved_texts_desc: "Література інтелігенції й технократів, що розквітли за Лисенка, не відповідає марксистським чи лєнінським ідеалам, а отже й нашому суспільству. Ці тексти, здатні викликати неспокій і невдоволення благородним режимом, треба знищити й спалити. Їх замінить великий новий пантеон схвалених державою творів. Від фантастики до книжок із сільськогосподарської біології, у найцікавіших і найпізнавальніших книжках Маґнітоґорска буде представлено кожен жанр і стиль. Їх писатимуть найкращі автори Росії, віддані урядові й народові, і кожен селянин читатиме наші книжки."

 MGN_NKVD_we_were_misguided: "Нас ввели в оману"
 MGN_NKVD_we_were_misguided_desc: "Новий керівник Маґнітоґорска товариш Стєпан Бунков виступив із офіційною радіозаявою до всього регіону. Чітким голосом він засудив злочини Лисенка, водночас пояснивши, чому спершу він та його люди підтримали того, а потім усунули. Прагнення НКВД було благородним: вони вірили, що служать науці, поступові й соціялізму. Але Лисенко, зрадливий пес, сп'янілий владою, обернув працю науковців і солдатів проти народу в огидних злочинах проти людей Росії та комуністичної справи. На завершення Бунков оголосив, що його правління насамперед загоюватиме рани, завдані огидними діяннями Лисенка й повертатиме Маґнітоґорскові добробут та мир."

 MGN_NKVD_new_dawn: "Новий світанок"
 MGN_NKVD_new_dawn_desc: "В очах сусідів і власного народу наша репутація, м'яко кажучи, заплямована. Саме люди НКВД уночі штурмували села й хутори, викрадаючи людей, яких більше не бачили. Щоб зберегти мирну й стабільну владу, треба переконати всіх: ми не підемо слідами Лисенка. Наше правління буде справедливим, чесним і доброзичливим - ми врятували Маґнітоґорск. Ми захисники народу, пролетаріяту й комуністичної справи на Південному Уралі; ми несемо смолоскип Лєніна й Бухаріна в боротьбі за свободу, рівність і мир для всіх. Над Чорною Горою сходить новий світанок, і товариш Бунков хоче, щоб кожен побачив червоне світло."

 MGN_NKVD_elimnate_bad_science: "Очистити Гору від мерзенної науки"
 MGN_NKVD_elimnate_bad_science_desc: "У кожному темному кутку Чорної Гори чекають потвори, жахливі злочини проти людства: страхітливі експериментальні машини, схожі на знаряддя тортур; частини й останки людей, потворно понівечених нелюдськими дослідами Лисенка; цілі архіви, заповнені даними й методиками, в які годі повірити. Поки лишається бодай слід огидного недавнього минулого, ця пляма тяжітиме над новим урядом Бункова. Офіцери НКВД отримали наказ зібрати й спалити переважну більшість мерзотних творінь Лисенка, обернувши їх на попіл і дим. Щоб збудувати нове майбутнє, Маґнітоґорск мусить дати раду спадщині Лисенка, і це перший крок."

 MGN_NKVD_liberate_test_subjects: "Звільнити суб'єктів"
 MGN_NKVD_liberate_test_subjects_desc: "У надрах Маґнітоґорска досі лунають крики незліченних бранців, в'язнів і суб'єктів псевдонауки Лисенка. Чоловіків, жінок і дітей тримали в темних тісних камерах із жахливою гігієною, мізерною їжею й жорстоким поводженням. Тепер, коли Лисенка усунено, треба звільнити бідолах із Чорної Гори, надати їм належну медичну допомогу й підготувати їх до повернення додому. Чорна Гора більше не буде в'язницею невинних, а наші руки - заплямованими їхнім стражданням."

 MGN_NKVD_constructive_science: "Конструктивна наука"
 MGN_NKVD_constructive_science_desc: "Хоч проєкт Лисенка був прогнилим до основи, дещо ще можна врятувати. Деякі його експерименти можуть дати нам справді корисні відомості, здатні поліпшити життя нашого народу, хоча методи здобуття деяких краще не описувати. Багато науковців, що працювали з ним, не були ані божевільними, ані злими й охоче повернуться до роботи, якщо їм більше не доведеться відповідати перед безумцем. Товариш Бунков створив невелику групу науковців, які мають відновити «чисті» частини проєктів Лисенка й поставити їх на службу народові Маґнітоґорска."

 MGN_NKVD_benevolent_rule: "Доброзичливе правління"
 MGN_NKVD_benevolent_rule_desc: "Чергову чистку прихильників Лисенка завершено, їхні тіла вже спалено в домнах Чорної Гори, і становище нарешті стабілізувалося, а влада Бункова зміцнилася. Люди НКВД патрулюють промислові об'єкти й села, солдати та вантажівки стримують бандитів, а до наших комісарів починають надходити повідомлення про настрої населення. Багато хто радий, що Лисенка немає, але інші не довіряють нам. Схоже, деякі підривні елементи навіть відкрито агітують проти нас і, можливо, готують повстання. Підтвердити більшість звітів не можна, однак треба пильно стежити за власним народом, щоб становище не вийшло з-під контролю."

 MGN_NKVD_bring_back_lists: "Повернути списки?"
 MGN_NKVD_bring_back_lists_desc: "Архіви Чорної Гори містять надзвичайно докладні відомості майже про кожного, хто жив у Маґнітоґорску останніми роками; їх збирали за наказом Лисенка для експериментів і нагляду. Коли наша влада слабшає, на основі цих даних легко створити всеосяжну мережу нагляду й контролю. Дехто в командуванні НКВД називає це неетичним кроком назад до правління Лисенка, але він може бути потрібний, щоб дати людям захист, якого вони так потребують..."

 MGN_NKVD_spies_in_communities: "Шпигуни в громадах?"
 MGN_NKVD_spies_in_communities_desc: "Найбільша загроза стабільності й миру міститься не на Чорній Горі, де зосереджені сили, а у віддалених селах і містах. Робітники й селяни, що живуть там, часто виявляють невдоволення нашим правлінням. Впровадження шпигунів і агентів НКВД у такі громади дасть нам очі й вуха на місцях та змогу придушити незгоду до того, як вона стане проблемою. Це може допомогти, але легко обернеться проти нас, якщо шпигунів викриють."

 MGN_NKVD_village_commissars: "Сільські комісари?"
 MGN_NKVD_village_commissars_desc: "Управління територіями навколо Маґнітоґорска нині дезорганізоване. Радники Бункова пропонують мережу місцевих політичних комісарів, призначених центром до сіл і хуторів. Вони представлятимуть нашу владу на всій території та отримають ресурси й людей для забезпечення миру, безпеки й стабільности у своїх округах. Проте селяни, ймовірно, зненавидять дальшу бюрократизацію й централізацію, а кілька близьких офіцерів Бункова вважають вигідним лишити громадам трохи автономії."

 MGN_NKVD_remind_them_about_lysenko: "Нагадати їм про спасителя"
 MGN_NKVD_remind_them_about_lysenko_desc: "Роками Чорна Гора чинила звірства, що перевершували найсміливіші мрії навіть Чорного бандита. Після падіння безумного науковця ми заповнили залишений ним вакуум влади й дали жителям Маґнітоґорска мирне життя. Лисенка повалила жорстокість до суб'єктів, але звільнені лабораторні щури відповіли презирством і вкусили руку, що їх годувала. Ми нагадаємо їм, чому ми тут. Ми організуємо експедиції до старого лігва Лисенка, щоб нагадати їм, чого вони уникнули лише два тижні тому. Страх перед Чорною Горою триматиме населення в покорі. Розчленованих селян виставлять напоказ, моторошні результати експериментів пронесуть міськими площами, а щоденники Лисенка зачитуватимуть уголос, щоб почув увесь світ. Жахи Чорної Гори пам'ятатимуть поколіннями, а ще важливіше - пам'ятатимуть, хто був поруч, щоб урятувати тих, хто вижив."

 MGN_NKVD_remind_them_about_bandits: "Нагадати їм про бандитів"
 MGN_NKVD_remind_them_about_bandits_desc: "Щит НКВД захищає народ не лише від звірств Чорної Гори, а й від невідомих жахів за кордоном. Привид Лисенка більше їм не зашкодить - ми про це подбали. Натомість цілком реальною й безпосередньою загрозою залишаються бандити. Наші гармати розіб'ють нападників, а багнети прошиють їхнє гниле серце. Коли поля людей засиплють сіллю, черепи синів розтрощать, а дочок поневолять, ми стоятимемо непохитно. Якщо вони не захистилися від Лисенка, які шанси проти чудовиськ півдня? Людська пам'ять коротка, тож час нагадати людям про минуле й повернути їх до реальности. Народ мусить визнати нашу роль у його виживанні й безпеці - через любов або через страх."

 MGN_NKVD_league_connections: "Зв'язки з Лігою?"
 MGN_NKVD_league_connections_desc: "З-за Уралу Ліга постійно загрожує виживанню Маґнітоґорска. Ми віримо, що 22-га захистить простих людей, але не певні, що прості люди підтримають 22-гу. Щоб ефективно захищати нашу територію, ми мусимо оцінити відданість нашого народу. Як вони очікують, що ми сидітимемо склавши руки, поки уральські паразити вільно ходять нашими вулицями? Маґнітоґорск дізнається: зради ми не терпимо."

 MGN_NKVD_remind_them_about_duty: "Нагадати їм про обов'язок"
 MGN_NKVD_remind_them_about_duty_desc: "Попри всі зусилля народ нас не прийняв. Без співпраці й підтримки наша влада не встоїть. Це не питання стабільности, а виживання. Ми, може, й урятували їх від жахів Лисенка та кровопролиття, влаштованого бандитами, але не врятували їх від самих себе. Ми підкорили Чорну Гору, тепер підкоримо дух народу. Для цього нам доведеться переглянути наші методи."

 MGN_NKVD_mass_propaganda: "Масова пропаганда?"
 MGN_NKVD_mass_propaganda_desc: "Проблема була не у ставленні населення й не в непідконтрольних елементах нашого суспільства, а в нашій неготовності цілком віддатися справі. Щоб справді донести до народу наші добрі наміри, ми мусимо розширити пропагандистську роботу й підтримувати його моральний дух. Робітники, селяни й хлібороби об'єднаються під Чорною Горою."

 MGN_NKVD_science: "Наука НКВД"
 MGN_NKVD_science_desc: "Культ псевдонауки Лисенка отруїв Маґнітоґорск і змарнував ресурси та людей на жорстокі, безплідні експерименти. Гірше, сотні чоловіків, жінок і дітей забрали із сіл в ім'я інтелектуалізму. НКВД і Бунков рішуче засуджують ці огидні злочини проти нашого народу! Наша нова «Реабілітована наука» шукатиме таємниці всесвіту й людства безпечно, етично й без хибних припущень. Справжній інтелектуалізм відродиться під славною владою Бункова!"

 MGN_NKVD_centralize_authority: "Централізувати владу"
 MGN_NKVD_centralize_authority_desc: "Найважливіша ще не здійснена реформа - масштабна централізація Маґнітоґорска. Нинішній уряд НКВД слабкий, бо справжні реформи часто очолюють регіональні керівники, а не центральна влада Бункова. Після змін увесь державний апарат спиратиметься на рішення однієї людини й однієї групи - Бункова та НКВД."

 MGN_NKVD_cult_of_bunkov: "Культ Бункова"
 MGN_NKVD_cult_of_bunkov_desc: "Стєпан Бунков, герой Чорної Гори, дав нам усе. Сходячи на гору, він тягнув усіх за собою, і нинішній добробут став можливим лише під проводом Бункова. Хіба селянин обробляв би поле без Бункова? Хіба солдат захистив би родину? Вижити в суворій Росії можна тільки разом під опікою нашого лідера, і ми любимо його за це. За будь-яку ціну ми навчимо людей любити Бункова так само - словами в наших газетах чи дулами наших рушниць."

 MGN_NKVD_portrait_in_every_home: "Портрет у кожній оселі"
 MGN_NKVD_portrait_in_every_home_desc: "Зв'язок із лідером потрібний для впорядкованого життя. Люди мають пам'ятати своє місце й вдячність, відчувати присутність лідера в усьому єстві та його теплий погляд щомиті. Ми допоможемо їм відчути й зрозуміти справжній сенс відданости та любови. Зрештою, хто не хоче бачити лідера щодня? Ви не любите свого лідера?"

 MGN_NKVD_cult_of_commissar: "Культ комісара"
 MGN_NKVD_cult_of_commissar_desc: "Від часу свого створення 1917 року, коли потрясіння Червоного Жовтня ще стрясали Росію, НКВД був першою лінією захисту пролетаріяту від класових зрадників, ворогів народу, контрреволюціонерів та інших загроз. Навіть після катастрофи Вітчизняної війни ми, люди НКВД, і далі тримаємо рубіж у Маґнітоґорску й захищаємо населення від усіх, хто може йому зашкодити. Усі мають салютувати людям НКВД й вітати їх, коли ті марширують, бо це справжні герої Чорної Гори. Нехай їхні славні барви майорять дедалі гордіше!"

 MGN_NKVD_venerate_NKVD: "Шанувати НКВД"
 MGN_NKVD_venerate_NKVD_desc: "«НКВД» означає «Народний комісаріят внутрішніх справ»: ми організація народу й працюємо для народу. Наша влада виправдана тим, що ми правимо не від імени безособових ідеологій чи великих проєктів, а заради комунізму й народу, який завжди має стояти понад усе. Ми завжди мусимо ясно давати зрозуміти, що Маґнітоґорск - держава, збудована на ідеалах Лєніна, тими самими ідеалами свободи, справедливости й рівности для всіх, які ми цінуємо нині."

 MGN_NKVD_no_cult: "Культу не буде"
 MGN_NKVD_no_cult_desc: "Комісари НКВД - не просто військові й бюрократи: вони мають надихати всіх. Кожен мусить захоплюватися їхньою відданістю соціялізмові, миру, поступові й стабільності та знати, що допити, затримання й навіть страти здійснюють лише заради вищого добра Революції й винищення ворогів народу та зрадників держави. Ми плекатимемо пошану до хоробрих комісарів і постійно нагадуватимемо всім про патріотичний обов'язок перед ними й НКВД."

 MGN_NKVD_exalt_peasants: "Возвеличити селян"
 MGN_NKVD_exalt_peasants_desc: "З огляду на нашу роль у режимі Лисенка ми не можемо винити робітників, селян і родини Маґнітоґорска за брак захвату від нашого уряду. Але впевнені: невдовзі вони самі зрозуміють, що ми працюємо тільки заради них. Без галасу люди НКВД наглядатимуть і захищатимуть їх. З часом НКВД поверне заслужені повагу й захоплення, утрачені через співпрацю зі злими задумами Лисенка."

 MGN_NKVD_are_we_the_baddies: "Ми - ракова пухлина?"
 MGN_NKVD_are_we_the_baddies_desc: "Попри численні зусилля, ми не знаємо, чи завоювали серця народу. Дехто в командуванні каже, що це неважливо: не хочуть любити - нехай ненавидять. Наша місія й обов'язок перед Росією та комунізмом вищі за схвалення неосвічених селян і напівп'яних робітників. Та багато ідеалістів наполягає, що саме заради них треба продовжувати боротьбу. Увечері товариш лейтенант Бунков зачинився в кімнаті й довго міркував, що робити..."

 MGN_NKVD_A_Beacon_of_Progress: "Маяк прогресу"
 MGN_NKVD_A_Beacon_of_Progress_desc: "Найгірша буря минула, а рештки режиму Лисенка стали попелом; час поглянути назовні. Товариш Бунков із найнадійнішими офіцерами планує повернути всьому регіонові мир, стабільність і добробут та просунути комуністичну справу. Треба раз і назавжди розібратися з бандитами, водночас підтримуючи дипломатичні зв'язки з Орєнбурґом та Уральською Лігою. Коли весь регіон опиниться під нашим крилом, можна буде дивитися далі."

 MGN_NKVD_Consolidate_Our_Gains: "Закріпити здобутки"
 MGN_NKVD_Consolidate_Our_Gains_desc: "Ми міцно утвердилися як одна з головних сил Південного Уралу, але становище ще непевне. Невідомо, наскільки можна покластися на села й громади в наших кордонах; частина територій уразлива до бандитських нападів; хоча кліку божевільних учених і технократів Лисенка розпущено, дехто ще може ховатися в тінях Чорної Гори. Якщо не закріпимо становище зараз, усі майбутні зусилля будуть марними."

 MGN_NKVD_the_villages_trust_us: "Села довіряють нам"
 MGN_NKVD_the_villages_trust_us_desc: "Ніч довго була темною й сповненою страху. Для багатьох навколо Маґнітоґорска НКВД не є світанком, але бодай кількома променями світла. Залякані простолюдини прийняли б майже будь-кого замість Лисенка, мабуть навіть Гітлера, тож НКВД - далеко не найгірше, що могло їм дістатися. Жителі сіл можуть бути й не в захваті від влади НКВД, але загалом довіряють новим правителям і вірять, що ті бодай не викрадатимуть їх уночі й намагатимуться захистити."

 MGN_NKVD_the_traitors_fear_us: "Зрадники бояться нас"
 MGN_NKVD_the_traitors_fear_us_desc: "Ми перемогли! Лисенка та його людей назавжди вигнано з гори. Вогневі групи добивають рештки й викорінюють останній опір. Чорна Гора надто довго була пам'ятником людським гріхам. Потрібна повна чистка, і зі зрадниками, що підтримували безумця, вчинять так, як вони чинили з нами."

 MGN_NKVD_the_urals_respect_us: "Урал поважає нас"
 MGN_NKVD_the_urals_respect_us_desc: "Хаос перевороту стихає, порядок повертається, і сусіди нарешті визнають: технократи пішли назавжди, а НКВД цілком контролює Чорну Гору. Імовірність контрперевороту щогодини меншає; держави Південного Уралу виходять на зв'язок: одні - щоб нормалізувати або відновити дипломатичні відносини, інші лише повідомити, що Маґнітоґорск усе одно знищать, хто б ним не правив. У будь-якому разі таке неформальне міжнародне визнання допоможе зміцнити легітимність і владу."

 MGN_NKVD_the_dirlewanger_issue: "Питання Дірлеванґера"
 MGN_NKVD_the_dirlewanger_issue_desc: "Оскар Дірлеванґер мусить померти. Від часу, коли він уникнув смерти в Західноросійській війні, він і Чорна бригада були лише прокляттям. Вони вбивали, калічили, ґвалтували й грабували Батьківщину. Оскар - утілена чорна пляма нацизму, що заражає розпорошений і наляканий російський народ. Урал зазнавав удару за ударом, і кожен напад лишався безкарним і без відповіді. Заради справедливости ми мусимо завершити те, що нацисти намагалися зробити багато років тому. В ім'я Всемогутнього Бога, Совєцького Союзу й людського роду ми мусимо вбити Оскара Дірлеванґера."

 MGN_NKVD_an_unexpected_ally: "Несподіваний союзник"
 MGN_NKVD_an_unexpected_ally_desc: "Орєнбурзькі комуни - дезорганізована, навмисно анархічна держава без центральної влади. Проте вони віддані Революції та визволенню пролетаріяту, а отже є нашими ідеологічними братами. Спільні й вороги: авторитарні реакціонери Уральської Ліги й божевільні садисти Дірлеванґера. Можливо, Комуни погодяться на угоду про взаємний захист, щоб убезпечити революційну справу на Південному Уралі. Як каже «Інтернаціонал», ми житимемо разом або помремо самі."

 MGN_NKVD_comrade_malenkov: "Товариш Малєнков"
 MGN_NKVD_comrade_malenkov_desc: "Ми раді, що Орєнбурґ вирішив лишитися на осяйному шляху комуністичної ортодоксії й, ідучи слідами Лєніна, обрав товариша Ґєорґія Малєнкова головою Робітничої ради. З марксистом-лєніністом на чолі міста природно шукати союзу, щоб увесь регіон рушив шляхом поступу, а контрреволюцію було остаточно розбито. Та треба бути обережними: ідеологія мінлива, і цілковито довіряти Малєнкову ще не можна."

 MGN_NKVD_the_revisionist_communes: "Ревізіоністські комуни"
 MGN_NKVD_the_revisionist_communes_desc: "Орєнбурзькі комуни можуть суперечити всьому, чого прагнули товариші Лєнін і Бухарін, але, чорт забирай, вони здатні бути міцним союзником проти фашистської наволочі на півдні. Треба обговорити угоду."

 MGN_NKVD_burba_the_bloody_bourgeois: "Бурба - кривавий буржуй"
 MGN_NKVD_burba_the_bloody_bourgeois_desc: "Попри ідеологічну огиду до Бурби й мерзеного капіталістичного дирижизму, заради національної безпеки треба встановити бодай якісь зв'язки з Орєнбурґом. Доведеться зустрітися з буржуазією, що визискує пролетаріят. З огляду на недавнє промислове зростання міста не варто так скоро його провокувати; тимчасовий союз може бути потрібний для миру й стабільности."

 MGN_NKVD_diplomats_to_orenburg: "Дипломати до Орєнбурґа"
 MGN_NKVD_diplomats_to_orenburg_desc: "Оскар Дірлеванґер і його фашистські бандити далі дошкуляють нам, нападаючи на прикордонні землі й винищуючи села задля зиску та розваги. На щастя, не лише ми потерпаємо від нього: він уже давно дошкуляє й нашим хоробрим товаришам в Орєнбурґу. Хоч Малєнков недалекий, навіть він має зрозуміти загрозу бригади для виживання соціялістичної думки на Уралі. Її треба усунути якнайшвидше.\n\nПосли вирушили до Орєнбурґа прямо домовлятися з Малєнковим і його підлеглими про спільну офіційну стратегію стримування й ліквідації Чорної бригади. Переговори повільні. Малєнков згоден, що з Бандитським королем Уралу колись треба розібратися, але не хоче віддавати стратегічний контроль чи першість у польовому командуванні НКВД. Він дурень у багатьох питаннях, але достатньо розумний берегти владу й суверенітет. Поки доведеться задовольнитися туманними обіцянками й порожніми рукостисканнями та шукати, як розвіяти його сумніви."

 MGN_NKVD_they_were_beyond_saving: "Їх уже не врятувати"
 MGN_NKVD_they_were_beyond_saving_desc: "Найвідчайдушніші обставини потребують найвідчайдушніших заходів. «Уряд» Орєнбурґа, якщо його так можна назвати, воює з ненаситними бандитами колишнього оберфюрера СС і відомого чудовиська Оскара Дірлеванґера й, імовірно, загине. Замість втручатися в безнадійну боротьбу, треба подбати про власний народ: зжерши Орєнбурґ, вовча зграя поверне ікла проти нас. Чорна Гора має бути готовою витримати будь-який напад усіх сил, які тільки зможе зібрати Дірлеванґер; вона мусить стати неприступною фортецею, останнім маяком цивілізації, здатним відбити бандитські орди. Що б не сталося, ми вистоїмо."

 MGN_NKVD_protect_our_own: "Захистити своїх"
 MGN_NKVD_protect_our_own_desc: "Найвідчайдушніші обставини потребують найвідчайдушніших заходів. «Уряд» Орєнбурґа, якщо його так можна назвати, воює з ненаситними бандитами колишнього оберфюрера СС і відомого чудовиська Оскара Дірлеванґера й, імовірно, загине. Замість втручатися в безнадійну боротьбу, треба подбати про власний народ: зжерши Орєнбурґ, вовча зграя поверне ікла проти нас. Чорна Гора має бути готовою витримати будь-який напад усіх сил, які тільки зможе зібрати Дірлеванґер; вона мусить стати неприступною фортецею, останнім маяком цивілізації, здатним відбити бандитські орди. Що б не сталося, ми вистоїмо."

 MGN_NKVD_go_dark: "Перейти в тінь"
 MGN_NKVD_go_dark_desc: "Безпека Маґнітоґорска нині мов світло в темряві - таке яскраве, що його бачать навіть Дірлеванґер і головорізи. Щоб бригада не звернула на нас уваги, треба цілком припинити весь зайвий зв'язок Чорної Гори та підконтрольних територій. Бандити, ймовірно, перехоплюють радіопередачі в усьому регіоні; ми просто не можемо допустити, щоб вони дізналися про наші оборонні плани та розташування військ і укріплень. Чорна Гора мовчатиме в бурі, щоб, якщо й коли Орєнбурґ упаде, ми могли вийти з темряви й покарати виродків Дірлеванґера."

 MGN_NKVD_defend_the_mountain: "Захистити Гору"
 MGN_NKVD_defend_the_mountain_desc: "НКВД у Маґнітоґорску захищає не лише тих, хто живе на Чорній Горі, а й численні довколишні села та хутори. Багато з них беззахисні перед раптовим нападом. 22-га мотострілецька дивізія НКВД негайно розгорнеться по всій території, створить оборонні периметри й позиції для захисту кожного клаптика землі та водночас роблячи все можливе для добробуту й виживання цивільних у районах, де очікуються бойові дії. Це передбачає створення логістичних мереж і запасів їжі, води та медичних засобів там, де вони потрібні, а за потреби - переселення цивільних. Під нашим захистом боятися нічого; за тих, хто поза ним, лишається молитися."

 MGN_NKVD_Russians_of_the_Urals_Unite: "Росіяни Уралу, єднайтеся!"
 MGN_NKVD_Russians_of_the_Urals_Unite_desc: "Невже дозволимо клятому німецькому фашистові підкорити найбільший регіон Батьківщини? Ніколи! Ми, росіяни, мусимо об'єднатися, захистити невинних селян і робітників та нашу землю від кровожерного німецького тирана. Історія перемоги надихатиме покоління росіян. Росіяни Уралу, єднайтеся!"

 MGN_NKVD_a_united_front: "Єдиний фронт"
 MGN_NKVD_a_united_front_desc: "Попри відмінності, ми з Орєнбурґом створили єдиний фронт. За великої кризи треба всупереч усьому об'єднатися заради спільного добра й пам'яти Совєцької Республіки."

 MGN_NKVD_against_dirlewanger: "Проти Дірлеванґера"
 MGN_NKVD_against_dirlewanger_desc: "Бандити навколо Орська - чорна пляма регіону! Нацистські головорізи, розбійники й відступники надто довго безкарно палили, ґвалтували й убивали на нашій колись великій російській землі. Контролюючи могутні ресурси Чорної Гори, ми нарешті спрямуємо їх на благородну мету - ліквідацію Дірлеванґера та його скажених псів.\n\nУсі підрозділи НКВД буде мобілізовано для підготовки до вирішального наступу на території, контрольовані бандитами. Вони мають захопити район і, якщо можливо, взяти Дірлеванґера живцем, щоб судити за злочини проти Батьківщини, її народу й людства.\n\nНехай ця мить стане вирішальним доказом того, що НКВД 22-ї мотострілецької дивізії більше не воює за божевільного маніяка, не ховається в темряві й не служить їй. Нехай у вогні війни ми здобудемо спокуту.\n\nЗа нашу Росію й народ ми йдемо на війну!"

 MGN_NKVD_our_unique_talents: "Наші унікальні таланти"
 MGN_NKVD_our_unique_talents_desc: "Розвиток соціялістичної справи потребує спільного розвитку продуктивних сил: і ми, і Орєнбурґ маємо потужну промислову базу, якій немає рівних на Південному Уралі. Товариш Бунков започатковує економічну й військову співпрацю з Орєнбурґом. Ресурси шахт Чорної Гори об'єднають для швидкого ефективного розвитку обох держав, а інженери й техніки з обох міст керуватимуть розширенням місцевої промисловости. Південний Урал чекає світле майбутнє добробуту й миру."

 MGN_NKVD_the_fate_of_orenburg: "Доля Орєнбурґа"
 MGN_NKVD_the_fate_of_orenburg_desc: "Сьогодні вирішиться доля перлини Уралу. НКВД може, як завжди, відкинути ревізіоністів - цього від нас очікують. Але є й другий шлях: чи можлива дружба з комунами? Можлива, хоча вкрай неортодоксальна."

 MGN_NKVD_walking_with_your_hand_in_a_sling: "Ідеш із рукою на перев'язі"
 MGN_NKVD_walking_with_your_hand_in_a_sling_desc: "Перемога над наволоччю Дірлеванґера стала великим тріюмфом для нас і Орєнбурґа, але скороминущий успіх не має запаморочити голову. Орєнбурґ досі ревізіоністське кубло небезпечних ідей. Надалі триматимемо відстань, і їм доведеться це прийняти."

 MGN_NKVD_wanna_hear_the_soldier_sing: "Хочеш почути спів солдата"
 MGN_NKVD_wanna_hear_the_soldier_sing_desc: "Неймовірна перемога відкриває неймовірні можливості. Майбутні зв'язки з Орєнбурґом можуть принести користь. Це дивно, але часи теж дивні. Треба зробити все для виживання на випадок повернення Совєцької Соціялістичної Республіки, і відносини з Орєнбурґом допоможуть."

 MGN_NKVD_A_Beacon_of_Order: "Маяк порядку"
 MGN_NKVD_A_Beacon_of_Order_desc: "Треба за будь-яку ціну зберегти порядок. Нашій країні загрожують як сусідні держави, так і можливі зрадники серед селян, запідозрених у нелояльності. Ми придушимо кожен опір і стратимо кожного селянина, що відкрито противиться владі й спричиняє хаос. Порядок утримаємо за всяку ціну."

 MGN_NKVD_the_runaways_problem: "Проблема втікачів"
 MGN_NKVD_the_runaways_problem_desc: "Скориставшись безладом після падіння Лисенка, багато робітників Маґнітоґорска покинули Чорну Гору до Орєнбурґа чи Уральської Ліги. Ми втрачаємо робочу силу й людські ресурси, що серйозно шкодить промисловості. Ми негайно перекриємо всі шляхи з Чорної Гори, каратимемо всіх, хто піде без дозволу, й зміцнимо бюрократію для пильного нагляду над усім населенням."

 MGN_NKVD_commisars_on_the_front: "Комісари на кордоні"
 MGN_NKVD_commisars_on_the_front_desc: "Попри успіхи в забороні залишати Чорну Гору без дозволу, деякі втікачі прослизнули. Ми отримали звістки, що переважна більшість із них прямує до Бєлорєцка та інших територій Уральської Ліги, приваблена перспективою допомоги й притулку, які Ліга пропонує біженцям. Ми не можемо втрачати працездатних робітників. Підрозділи НКВД розгорнуть на кордоні, який також укріплять колючим дротом і спостережними вежами; кожного втікача заарештують, силоміць повернуть до Чорної Гори й нагадають про відданість нам."

 MGN_NKVD_search_for_hidden_weapons: "Пошук прихованої зброї"
 MGN_NKVD_search_for_hidden_weapons_desc: "Незгодні й загрози режимові ховаються в кожному темному кутку й кожній оселі. Зброя тих, хто нам не довіряє, має стати нашою."

 MGN_NKVD_blackmail_the_former_experiments: "Шантажувати колишніх піддослідних"
 MGN_NKVD_blackmail_the_former_experiments_desc: "Усунувши нагальніші проблеми, переконаємо прихильників минулого режиму трохи посидіти тихо й не плутатися під ногами, поки ми повертатимемо країну до ладу. Якщо не погодяться, застосуємо «переконливіші» способи."

 MGN_NKVD_threaten_their_loved_ones: "Погрожувати їхнім близьким"
 MGN_NKVD_threaten_their_loved_ones_desc: "Багато людей уже залишило країну й вислизнуло з наших рук; цього більше не можна дозволити. Щоб відбити бажання втекти, їхніх близьких, які лишилися, триматимуть заручниками й примусять коритися нашій волі."

 MGN_NKVD_fence_the_communities: "Обгородити громади"
 MGN_NKVD_fence_the_communities_desc: "Деякі люди намагаються втекти через нову владу. Треба швидко знайти нові способи втримати їх у громадах, поки це не стало більшою проблемою."

 MGN_NKVD_they_owe_much_to_the_hun: "Багато чим завдячують фріцу"
 MGN_NKVD_they_owe_much_to_the_hun_desc: "Від поразки пролетарського уряду Совєцького Союзу німецькою військовою машиною серця росіян сповнені ненависти до німців, а Дірлеванґер уособлює все, що вони ненавидять у німцях, і місцеві добре це розуміють. Ми використаємо його лиху славу: вказуватимемо на справжні чи вигадані німецькі й фашистські зв'язки політичних суперників і пов'язуватимемо їх із Дірлеванґером, щоб остаточно заплямувати їх в очах російського народу."

 MGN_NKVD_rogue_state_of_the_league: "Ліга - держава-ізгой"
 MGN_NKVD_rogue_state_of_the_league_desc: "Сліпому видно, що Уральська Ліга приймає втікачів. Замість вічно й, можливо, безуспішно контролювати кожного мешканця, треба раз і назавжди раз і назавжди покласти край державі-ізгою Уральської Ліги."

 MGN_NKVD_conscription_for_the_NKVD: "Призов до НКВД?"
 MGN_NKVD_conscription_for_the_NKVD_desc: "У наших силах бракує людей, щоб протистояти нападові Ліги й пережити його. Лишається останній вихід - нова програма призову. Зі свіжими новобранцями ми перевершимо їх і якістю, і кількістю."

 MGN_NKVD_rev_up_the_motors: "Завести мотори"
 MGN_NKVD_rev_up_the_motors_desc: "Час майже настав: напруження у відносинах із Лігою досягло піку, і треба готуватися до, схоже, неминучої війни між нашою державою та нелегітимним антисовєцьким військовим формуванням."

 MGN_NKVD_wipe_out_the_league: "Змести Лігу"
 MGN_NKVD_wipe_out_the_league_desc: "Час настав. Напасти на Лігу й поширити нашу владу на окуповані нею землі!"

 MGN_NKVD_reclaim_our_prisoners: "Повернути наших утікачів"
 MGN_NKVD_reclaim_our_prisoners_desc: "Після перемоги над Лігою можна розв'язати давні проблеми. Найнагальніше - люди, які втекли з нашої країни й тепер опинилися на новозавойованих територіях. Негайно почнемо їх шукати."

 MGN_NKVD_crush_the_bandits: "Розгромити бандитів"
 MGN_NKVD_crush_the_bandits_desc: "Тепер ми оголосимо війну найбільшому злу нашого життя - бригаді Дірлеванґера. Це найбільша відома нам загроза миру; ми переможемо її й принесемо мир Південному Уралу."

 MGN_NKVD_subjugate_orenburg: "Підкорити Орєнбурґ"
 MGN_NKVD_subjugate_orenburg_desc: "Ми перемогли, західних і південних сусідів знищено! Більше не треба боятися зрадливого уряду Уральської Ліги чи огидних виродків бригади Дірлеванґера - вони лишилися неприємними спогадами. Та одна держава досі не окупована - Орєнбурґ. Скоро це зміниться. Товариш генерал-лейтенант Бунков мудро вирішив, що місто загрожує безпеці й стабільності всього регіону. Ми візьмемо місто під контроль і пацифікуємо його, щоб нарешті об'єднати весь Південний Урал під нашим наглядом."

 MGN_NKVD_spare_orenburg: "Пощадити Орєнбурґ"
 MGN_NKVD_spare_orenburg_desc: "Ми перемогли, західних і південних сусідів знищено! Більше не треба боятися Уральської Ліги чи бригади Дірлеванґера - вони стали неприємними спогадами. Та одна держава досі не окупована - Орєнбурґ. Однак недавні війни на знищення призвели до значного перенапруження сил НКВД. Не бажаючи слабнути в новому конфлікті, ми пощадимо Орєнбурґ: вони бачили, яке спустошення ми принесли нашим ворогам, і поки що не становлять для нас загрози."
 
 MGN_NKVD_and_when_you_finally_disappear: "І коли ви нарешті зникнете"
 MGN_NKVD_and_when_you_finally_disappear_desc: "Орєнбурґ упав, анархічний провал зник, але пам'ять про нього й далі надихає непокору. Встановлена лояльна до НКВД військова адміністрація досі не змогла ефективно придушити спротив у регіоні. Дії введеного в оману населення підірвали безпеку всього регіону. Настав час воєнного стану: сам Орєнбурґ переведуть у режим повної ізоляції, а новий гарнізонний уряд викорінюватиме противників і проводитиме політичну індоктринацію громадян."
 
 MGN_NKVD_well_just_say_you_were_never_here: "Ми просто скажемо, що вас тут не було"
 MGN_NKVD_well_just_say_you_were_never_here_desc: "Від початку окупації шпигуни в ізольованій і відсталій сільській місцевості постійно повідомляють про ризик повстання й контрреволюції серед селян із майже середньовічним укладом життя автономних сіл та землеробських комун. Однак досі ми не усвідомлювали, наскільки серйозну загрозу вони становлять нашій безпеці. Тепер наказ віддано: вільні комуни буде стерто з карти. Вони довели невірність революційній справі й отримають те саме, що всі вороги народу, - швидке покарання."

 ### NVKD Events###
 MGN_NKVD.1000.t: "Вигнати Лисенка з лиця землі"
 MGN_NKVD.1000.desc: "Плями безумця більше не псуватимуть, не розкладатимуть і не знищуватимуть людяність народу Маґнітоґорска. Ми більше не страждатимемо й не дивитимемося, як чудовисько ставить досліди над невинними. Наші люди більше не житимуть у страху, поки його мрії й підступні задуми про нелюдську нісенітницю ширяться Чорною Горою."
 MGN_NKVD.1000.a: "Час змін."

 MGN_NKVD.1001.t: "Порушений мир"
 MGN_NKVD.1001.desc: "Вечоріє, коли загін гвардійців НКВД завершує роботу в черговому селі. Вони знають, що чинять справедливо: збирати дані перепису для охорони здоров'я й реабілітації та підтримувати низові рухи - цілком невинна програма. І байдуже на похмурі обличчя, приглушений шепіт і невідступний страх на обличчі кожного - дорослого чи дитини, - хто опиняється поруч із гвардійцями. Революцію не завжди вітають, але в їхніх очах вона завжди потрібна.\n\nЗагін збирає людей, зводить відомості й готує матеріял: Центральне командування вимагатиме звіту певної якости, інакше будуть... наслідки, про які краще мовчати. Зрештою, смерть Лисенка не скасувала армійської дисципліни.\n\nУночі лунає постріл. Усі панічно озираються, крім командира, що падає в багно. Втомлений, погано споряджений і розгублений загін ухвалює те, що згодом назвуть «неналежним самостійним рішенням командування». Постріли лунають залпами, перемежовані криками, зокрема дитячими.\n\nКоли наступного ранку загін квапливо покидає руїни, ніщо не свідчить, що тут узагалі колись існувало село разом з усіма 246 цивільними, які в ньому жили, крім нескінченних списків далекої Чорної Гори. Та й їх легко почистити."
 MGN_NKVD.1001.a: "Невдалий час."

 MGN_NKVD.1002.t: "Червона справедливість"
 MGN_NKVD.1002.desc: "НКВД, можливо, не найтепліше згадуване обличчя соціялізму, але він відданий цінностям, для захисту яких створений. Треба берегти фланги від тих, хто прагне розкласти нас і налаштувати проти народу, й за всяку ціну не повторювати їхніх дій. Отже - реформа! Радість вічного соціялізму переможе жахи Лисенка, і без нього ми збудуємо кращий світ.\n\nПеремігши Лисенка, ми не хочемо стати його віддзеркаленням. Бунков, як справжній товариш-соціяліст, постановив: наше правління загоюватиме тілесні й духовні рани Чорної Гори та єднатиме суспільство проти ворогів. Усі, хто боїться нас, тремтять, але багатьом треба дати причину любити нас. Успіх на цьому фронті зміцнить нашу легітимність: наш режим молодий, і влада легко вислизне, якщо села цього захочуть.\n\nПоки що перед нами Бандитський король у фашистському мундирі з шакалячою посмішкою. Треба знайти спосіб задушити цю загрозу ще в її фашистській колисці, перш ніж вона задушить нас. А після цього Бунков має плани щодо Комун. Великі плани.\n\nНехай Чорна Гора радіє! Світанок сяє й усміхається всім."
 MGN_NKVD.1002.a: "Революція настала!"

 MGN_NKVD.1003.t: "Чеснота й терор"
 MGN_NKVD.1003.desc: "Спроби встановити контроль над колишнім улюбленим проєктом Лисенка пройшли гірше, ніж ми сподівалися. Багато хто втік із країни, шукаючи порятунку від наших сил. Інші протестують, кажучи, що ми не заслужили довіри й поваги. Саме вони мали б краще за всіх знати: це ніколи не було метою.\n\nЯкщо вони нас бояться - добре. Отже, ми виконали роботу. Виживемо лише тоді, коли вороги боятимуться кожного нашого кроку, постійно озиратимуться й зрозуміють, що сховатися ніде. Наша влада страшна, бо мусить бути такою; вибору немає. Нехай демократи-ідеалісти протестують і дозволяють ворогам підривати нас. Ми не збираємося програвати бандитам і реакціонерам.\n\nНКВД стане щитом від стріл, кинутих у Росію. Вона найслабша, і ми маємо зробити все для її порятунку. Нехай ідеалісти й фашисти протестують: ми зустрінемо їх нагостреними кинджалами й зарядженими рушницями. Не поступимося й за мільйон років."
 MGN_NKVD.1003.a: "Коли бракує одного з двох, значно безпечніше, щоб тебе боялися, ніж любили."

 MGN_NKVD.1004.t: "Цивільні вимагають відшкодування"
 MGN_NKVD.1004.desc: "Правління безумного науковця скінчилося, і люди навколо Маґнітоґорска вперше за роки обережно виходять назовні. НКВД пообіцяв покласти край викраденням і жорстоким експериментам, що робили життя жахливим. Але з новою владою люди нарешті відстоюють себе. Їхні життя зруйновано, друзів і родини викрадено, і вони не мовчатимуть. Вони хочуть відшкодування.\n\nЦінність утрачених життів неможливо обрахувати, але народ усе одно вимагає підрахунку й виплат постраждалим. Згорьовані дружини й чоловіки, матері й батьки, сини й доньки об'єдналися та подали кілька офіційних вимог щодо різних форм відшкодування. Внутрішні розслідування вже встановили приголомшливу кількість загиблих, і відшкодування за всіх було б безумним завданням. А це ще без речей, викрадених і знищених Лисенком. Із цими згорьованими людьми слід діяти обережно."
 MGN_NKVD.1004.a: "Пошукати інші розв'язання."

 MGN_NKVD.1005.t: "Спогади про чудовиськ"
 MGN_NKVD.1005.desc: "Після років знущань Лисенка багато сіл майже спорожніли. Решта ледве виживала: більшість працездатних викрали й назавжди поглинули лабораторії, тому хронічно бракувало їжі, ліків та інших необхідних речей.\n\nЩоб показати, що вони на боці народу, загін НКВД сьогодні відвідав село в тіні гори. Він привіз довоєнні ліки, консерви, одяг та інші припаси для відбудови після жахіть. Сподіваючись на новий початок для змученого регіону, солдати повільно наближалися до околиці поселення зі зброєю в кобурах. На околиці командир гукнув: «НКВД, ми прийшли допомогти!»\n\nТишу розірвав постріл, куля ледь не зачепила одного з них. Із села вийшов невеликий, але надзвичайно розлючений натовп, обсипаючи солдатів лайкою. Їх називали потворами й спільниками Лисенка та вимагали пояснити, що сталося з близькими. Командир відчайдушно заспокоював людей, доки друга куля не влучила йому в плече.\n\nДеякі солдати не витримали, вихопили зброю й почали стріляти поверх голів. Натовп панічно розбігся, але приховані стрільці посилили напад. Крізь зціплені від болю зуби командир наказав відступити. Допомоги сьогодні не буде, а імпульсивна відплата точно не поліпшить репутації НКВД."
 MGN_NKVD.1005.a: "Ми намагаємося допомогти! Будь ласка!"

 MGN_NKVD.1006.t: "ПОВІДОМЛЕННЯ ВСІМ ПІДРОЗДІЛАМ"
 MGN_NKVD.1006.desc: "До уваги всіх членів 22-ї мотострілецької дивізії НКВД!\n\nТовариш полковник Ніколай Васільєв наказав: жоден солдат дивізії, якщо немає окремого наказу за надзвичайних обставин, не має входити до села чи міста без супроводу щонайменше трьох інших солдатів дивізії. Поза казармами солдати завжди мають бути озброєні!\n\nБагато хто бажає вам шкоди, товариші! Не заходьте до рюмочних, борделів чи будь-яких інших місць, де можете будь-якої миті виявитися неготовими захистити себе! Люди Маґнітоґорска вам не союзники й не друзі. Не втрачайте пильности! Кожна рука за спиною може ховати зброю, а кожна усміхнена дитина - гранату під курткою!\n\nЧерез необережність уже загинуло кілька наших людей. Тому надалі заборонено відвідувати маґнітоґорські села, щоб повернути майно або просити пробачення в місцевих. Колись вони зрозуміють, що ми не бажаємо їм зла, але пляма лисенківщини в'їлася глибоко, і вашим командирам доведеться поступово її стирати.\n\n-НЕ ВХОДИТИ ДО ЖОДНОГО СЕЛА ГРУПАМИ МЕНШ ЯК ЧОТИРИ ОСОБИ.\n-НЕ ЗАЛИШАТИ КАЗАРМ БЕЗ ЗБРОЇ.\n-НЕ ЗАХОДИТИ ДО БАРІВ, БОРДЕЛІВ, КАВ'ЯРЕНЬ, РЮМОЧНИХ АБО ПРИВАТНИХ ОСЕЛЬ.\n\nЗБЕРІГАТИ ПИЛЬНІСТЬ."
 MGN_NKVD.1006.a: "ВИКОНУЙТЕ НАВЕДЕНІ ВКАЗІВКИ, ТОВАРИШУ!"

 MGN_NKVD.1007.t: "Небезпека на дорогах..."
 MGN_NKVD.1007.desc: "Над головою мерехтять зорі, коли вантажівка зупиняється край дороги. Двоє чоловіків у старих мундирах давно зниклої країни виходять у прохолодну ніч. Один мить милується небом, інший відходить і риється в кишенях. Зійшовшись знову, вони запалюють слабку папіросу й мовчки, лише зрідка стримано кашляючи, докурюють її.\nПозаду вибухає вантажівка, фарбуючи світ у помаранчеве, червоне й сіре. Солдати оговтуються, відновлюють рівновагу й приголомшено обертаються. У ніч тікає один силует. Чоловік вихоплює пістолет і стріляє в тінь, що меншає, але марно. Постать зникає так само швидко, як з'явилася.\n\nМожливо, це був мстивий цивільний, розлючений утратою близького, чи партизан, доведений ідеологічною ненавистю до люті. Який би не був мотив, вантажівки більше немає. А додому йти далеко."
 MGN_NKVD.1007.a: "Дороги небезпечніші, ніж будь-коли!"

 MGN_NKVD.1008.t: "Захід і схід сонця"
 MGN_NKVD.1008.desc: "Минув ще один день. Після дзвінка Кірілл вийшов зі школи й рушив додому, коли сонце вже ховалося за обрій. Хлопчик насилу пробився крізь чергу по хліб, що змією гомонливих людей обвила будівлю; на розі озброєний вартовий розбороняв двох п'яниць. Кірілл помахав знайомій дівчинці, яка усміхнулася, тримаючи за руку матір, що кашляла. Колись будівля була складом промислових матеріялів; після приходу НКВД вона стала центром розподілу їжі й ліків для незаможних. Стіни прикрасили молот, серп і меч із однострою НКВД. Кірілл перейшов вулицю, повернув ліворуч і минув двох солдатів, що сміялися й курили. Позаду свіжий плакат із Бунковим спостерігав за ними; мовчазний наглядач їх не турбував. Стежкою хлопчик дійшов до дому. На стукіт вийшли мати й мала сестра. За кілька метрів солдат на вежі глянув на них, зітхнув, поправив синій кашкет і знову повернувся до заходу.\nСонце зійде знову, й на вежі стоятиме солдат; коли воно знову сяде, інший чоловік у тому самому мундирі дивитиметься, як Кірілл повертається зі школи. Люди звикають до нагляду НКВД, і скоро життя під пильним оком стає звичкою. З часом більшість уже взагалі не знатиме життя без постійних візитів комісарів і солдатів. Дехто каже, що так не мусить і не має бути, але необережні слова рідко дають людині довге життя."
 MGN_NKVD.1008.a: "Ще один день на Чорній Горі."

 MGN_NKVD.1009.t: "Спляча гора"
 MGN_NKVD.1009.desc: "Останні спогади про лисенківщину поволі летять у безодню минулого; час змінити не лише погляди, переконання й мету, а й землю під ногами.\n\nЧорну Гору вкривають нескінченні укріплення, пастки й небезпеки. Оборона потрібна для виживання, особливо в Росії, але зрештою стає безумною параноєю. Солдатів НКВД змушують спускатися складними змієподібними маршрутами, оминаючи міни й ями з кілками, а в глибинах гори прокладати шлях ниткою, мов легендарний Тесей, щоб не загубитися в навмисно заплутаному лабіринті.\n\nПочалося руйнування й демонтаж; інженери обережно дбають про безпеку кожного, хто спускається схилами чи просто виходить із казарми справити нужду.\n\nУже загинуло шестеро: від недбало збудованих пасток і вибухівки, що спрацьовує від легкого дотику, або натрапивши на пастки, про які давно не лишилося жодних записів. Деякі, схоже, спорудили сторонні без відома НКВД спеціально для вбивства бідолах, посланих знешкоджувати інші.\n\nПоступ повільний, але певний. Чорна Гора тепер спить, і час підрізати їй пазурі."
 MGN_NKVD.1009.a: "Ми блукаємо мертвим розумом безумця, сподіваючись урятуватися."

 MGN_NKVD.1010.t: "Незавершені справи"
 MGN_NKVD.1010.desc: "Комісар Фьодоров уже ясно бачить вислід розслідування. У потаємній сільській коморі він витирає сльози. Світлини анонімного свідка жорстокі, нудотні, цілком нелюдські: тіла в неможливих позах, деяким... чогось бракує. Класичний театр жахів Лисенка. Свідків треба поховати в єдиному савані, який він може дати, - савані справедливости.\n\nВін збирає розкидані речі: фотоапарат, записник - і готується до майбутнього. Принаймні кількість загиблих буде точною, єдиним пам'ятником цим людям. Можливо, Центр визнає за потрібне... Він бачить у списках спостереження причетних працівників НКВД. Пропущена подробиця - ні, поспіхом цензурована. Ім'я знайоме. Тут голосна, там приголосна. Він складає рештки. Це схоже на ім'я давнього друга. І розуміє...\n\nНічого. Кулі входять у хребет раніше, ніж думка встигає озватися.\n\nКомісар Йосєф Мосєвіч мовчки плаче, тягнучи тіло до викопаної мілкої могили. «Ти або моя мати», - беззвучно каже він. «Ти або моя мати»."
 MGN_NKVD.1010.a: "Ісусе. Яка жахлива ганьба."

 MGN_NKVD.1011.t: "Відтінок чорного"
 MGN_NKVD.1011.desc: "Лейтенант Лєтов мовчки курив і дивився, як над Маґнітоґорском сідає сонце.\n\nЧерез вік люди називали його «Дєдом». Один із найстарших у 22-й, він гордо служив від створення організації, а до того - в ОҐПУ. Бачив славне піднесення Союзу й марширував із ним після ганебного падіння. Бачив найкраще й найгірше в людстві й тепер думав, де стоїть сам.\n\nВони служили злу - він це знав. Але на відміну від молодих, що рівнялися на нього, не вдавав, ніби чудовиськами їх зробив Лисенко. Він власноруч заштовхував людей у вантажівки до ҐУЛАҐу, розстрілював в'язнів як частину якоїсь великої політичної гри й відвертався, коли Лисенко з посіпаками колов дітей усілякими голками. Він служив понад тридцять років, але вже не знав, чи може пишатися. Чи лишилася в ньому бодай частина, яка досі щиро вірила, що вони здатні стати кращими? Частина, що...\n\n«Дєд!» - почув він сміх. «Старий, ми йдемо грати в карти, твоя зміна скінчилася. Ти з нами?» - напівусміхнений солдат Алєксандр поправив завеликий кашкет.\n\n«Так, - відповів він. - Так, ходімо всередину... й думаймо про приємніше»."
 MGN_NKVD.1011.a: "Чи може людина справді змінитися?"

 MGN_NKVD.1012.t: "Серця й уми"
 MGN_NKVD.1012.desc: "2-й особливий взвод 22-ї мотострілецької дивізії НКВД отримав прямий наказ Центрального командування провести психологічні операції в 3-му регіоні Південного Уралу. Він мав відвідати села, які раніше грабували в пошуках суб'єктів для псевдонаукових дослідів Лисенка, допомогти людям і повідомити, що НКВД - їхній друг.\n\nКомісар Ґєорґій наказав своїм людям висадитися з вантажівки ЗІС-5 й пройти селом пішки, роздаючи населенню листівки. Посеред роботи з усіх боків ударив щільний рушничний вогонь. Чекісти відповіли, але становище стало безнадійним; вузькі вулиці перетворилися на пастку, і більшість взводу загинула до відступу.\n\nҐєорґій схопився за кулемет Максима на кузові, мов на давній тачанці, й відкрив вогонь по нападниках. Він хотів урятувати хоч кількох, але вцілілих на вулицях розстрілювали на полях. Витративши останній набій, він зрозумів, що може врятувати лише себе. Скориставшись короткою перервою у вогні з боку села, він спробував завести вантажівку, та стара машина не слухалася, а селяни поволі збиралися навколо.\n\nКомісар вийшов і відчайдушно звернувся до одного: «Послухайте, товаришу, я комісар НКВД, ми прийшли допомогти. Ось, візьміть...» - і подав флягу.\n\nНевдовзі його тіло знайшли на дереві з табличкою: «Він більше ніколи не забере наших синів»."
 MGN_NKVD.1012.a: "Дивний плід."

 MGN_NKVD.1050.t: "Тривоги селянства"
 MGN_NKVD.1050.desc: "Дехто із селян занепокоївся рівнем державної присутности в приватному просторі. До партизанських дій чи насильства проти наших людей ще не дійшло, але брак місцевої підтримки тривожить. Повідомлення про селян, які не відповідають на запитання, й дітей, що зі страху ховаються від машин, змальовують похмуру картину. Як ми захистимо їх, якщо вони нам не довіряють?"
 MGN_NKVD.1050.a: "Дайте склянку... Хочу це скуштувати..."

 MGN_NKVD.1051.t: "Терновий кущ"
 MGN_NKVD.1051.desc: "Для чоловіка, що тремтів у терновому кущі, ліс колись був затишним домом. Він згадував ранки, коли батько вчив полювати, і Різдво, коли грався із сестрою в снігу. Але цього сонячного, ідилічного дня на нього самого полювали, мов на кролів, яких він колись їв. Праворуч пролунав постріл і крик. Потім ліворуч - ще один постріл і крик. Рука так тремтіла, що старий револьвер випав. Він не піде тихо в ту добру ніч. До війни люблячого батька забрав НКВД. Він не повторить його долі: радше пустить власні кулі собі в мозок, ніж здасться цим покручам.\n\nУсе почалося, коли вуличний жебрак кинув йому книжечку. Він гадав, що це невеличка брошура із закликом до молитви, але натомість отримав нищівну критику й викриття сутности нового уряду НКВД. Мабуть, її призначали іншому, хоробрішому чоловікові. Та він зацікавився, всю ніч читав цю книжечку, надруковану на тонкому папері й скріплену ненадійними кільцями, а потім сховав книжечку якнайглибше під ліжком.\n\nНевдовзі він уже був членом малої групи опору. Борючись за свободу поселення від тиранії, роздавав листівки, ставив пастки й підривав владу. Все налагоджувалося, доки не почалася засідка.\n\nТепер друзі й товариші мертві, а він повернувся до боягузтва. Останньою думкою було не прагнення свободи, а власна невдача."
 MGN_NKVD.1051.a: "Постріли в голову були милосердям."

 MGN_NKVD.1055.t: "Відлига"
 MGN_NKVD.1055.desc: "За короткий час правління Маґнітоґорском ми вже встановили: прості люди Росії втомилися від тиранії антисовєцьких екстремістів і маніяків, що тривала понад два десятиліття. Особливо ясно це стало, коли Лисенко розпочав відкриту війну проти власного народу заради нелюдських експериментів. Хоч його немає, люди неохоче виконують накази й сприймають державне втручання як насильство.\n\nПоки пам'ять про кошмар свіжа, не можна покладатися на терор і примус. Тому даємо жителям усі свободи, яких їх так довго позбавляли. Ми не дозволимо селу скотитися до минулої анархії й не втручатимемося в життя, доки вони сумлінно виконують обов'язки й не виступають проти нас. Побачивши доброзичливість і переконавшись у добрих намірах, населення припинить спроби повалити владу й працюватиме на нову державу.\n\nВони не дивитимуться на молочні ріки Орєнбурґа чи безпеку Ліги, а будуватимуть краще майбутнє навколо Чорної Гори. Отримавши свободи, люди поважатимуть створені ними установи й відбудують суспільство, розбите Лисенком."
 MGN_NKVD.1055.a: "Вони хочуть свободи, і ми дамо її... поки що."

 MGN_NKVD.1056.t: "Вправа у владі"
 MGN_NKVD.1056.desc: "Селянський опір придушено швидко й рішуче: ватажків заарештовано, а більшість колишніх критиків замовкла. Поки що стабільність забезпечено. Та попри це тимчасове полегшення, далеко не все гаразд. Під час операції дехто з наших людей удавався до надмірного насильства й поводився негідно солдата НКВД. Найгірших покарано, але встановити всіх неможливо, тож, імовірно, не кожен винний відповість за злочини."
 MGN_NKVD.1056.a: "Той, хто бореться з чудовиськами..."

 MGN_NKVD.1057.t: "Зрада довіри"
 MGN_NKVD.1057.desc: "Наша доброта була недоречною. Нові свободи, дані селянам для примирення, лише допомогли їм ефективніше чинити опір. Надходять звіти про скоординовані напади на ключову інфраструктуру: розв'язки, підстанції й телефонні стовпи. Більшість сил покинула села, не витримавши постійного тиску партизанів і повстанців. Так тривати не може. Треба діяти швидко й рішуче, повернути народ до покори, інакше наше правління знову може похитнутися."
 MGN_NKVD.1057.a: "Прокляття на них!"

 MGN_NKVD.1052.t: "Повернути списки"
 MGN_NKVD.1052.desc: "Наші агенти викривають дедалі більше осередків опору по області, і Вище командування нервує. У кожному поселенні від хуторів до міст малі групи змовляються проти уряду. Більшість вважає це наслідком послаблення обмежень і пропонує не дозволяти селянам так вільно пересуватися. Можна повернути іменні списки цивільних, за допомогою яких обмежувати їхнє пересування нашою територією й загалом контролювати життя внесених до них людей. Одні застерігають від повернення до божевільної тиранії Лисенка, інші кажуть, що це потрібно для безпеки керівництва й самих цивільних. Ми можемо використати вцілілу інфраструктуру Лисенка, тож витрати будуть малі. Але таке різке згортання свобод буде непопулярним."
 MGN_NKVD.1052.a: "Це необхідний захід. Заради народу."
 MGN_NKVD.1052.b: "Ми не повернемося до тих темних часів."

 MGN_NKVD.1053.t: "Агенти-провокатори"
 MGN_NKVD.1053.desc: "Після повалення антипролетарського режиму Трохима Лисенка підпільний саботаж і антидержавна агітація поширилися селом і стали нагальною проблемою. Старші товариші пропонують шукати прихильників у селах або примушувати захоплених незгодних служити шпигунами й інформаторами. Наші нові агенти шукатимуть ворогів у громадських місцях і використовуватимуть довіру керівників різних таємних контрреволюційних організацій у наших інтересах, щоб краще стежити за ними й хапати в найнеочікуванішу мить."
 MGN_NKVD.1053.a: "Заради стабільности держави ми мусимо."
 MGN_NKVD.1053.b: "Це вже занадто."

 MGN_NKVD.1054.t: "Політична робота в Маґнітоґорску"
 MGN_NKVD.1054.desc: "Роки анархії, а потім псевдонаукової буржуазної догматики Лисенка збили людей зі шляху законослухняного совєцького громадянина й зробили озлобленими та байдужими до благородної справи соціялізму й совєцького патріотизму. Щоб повернути віру, можна відновити інститут політичних комісарів для нагляду за політичною освітою в місті й сільській місцевості, а також за відданістю найнеблагонадійніших елементів на нашій території. Хочеться користуватися пряником, але не слід дурити себе, ніби обійдемося без батога.\n\nКомісари будуть найвірнішими друзями й союзниками народу, повертатимуть його на правильний шлях. А якщо хтось через власну дурість упаде й розіб'є голову - нехай."
 MGN_NKVD.1054.a: "Надіслати комісарів."
 MGN_NKVD.1054.b: "Ми не повторимо колишніх помилок."

 MGN_NKVD.1059.t: "Разом підіймаємо"
 MGN_NKVD.1059.desc: "«І всі ми підіймаємо,\nІ всі ми в цьому разом,\nРазом.\n\nКрізь темряву,\nДоки разом не завершимо,\nРазом!»\n\nНа Чорній Горі співають чоловіки, і вперше не пошепки, ховаючись від гніву маніяка-науковця. Вони співають старі робітничі пісні й пісні власного авторства, щоб надихати себе на нову працю, звільнену від тиранії Лисенка.\n\nПліч-о-пліч солдати й офіцери відбудовують Гору. Більше не житимемо в страху, задушені безумством візантійської оборони. Ми осучаснимо, поліпшимо, перебудуємо й оновимо оборону Гори, перетворивши її на осучаснену, поліпшену, перебудовану й ретельно продуману систему з найкращих доступних нам оборонних засобів.\n\nТовариші! Наповнюєте мішок чи ставите прапор, ллєте бетон чи копаєте траншею - ви будуєте майбутнє для себе, а головне для нас! Зміни мають багато форм, але найкраще змінювати середовище. Нехай Чорна Гора стане не катакомбою невинних мерців, а місцем безпечного сну й ранкової ходи без страху пасток і вибухівки. Разом будуємо це майбутнє!\n\nРазом!"
 MGN_NKVD.1059.a: "Цього дня наше життя неодмінно зміниться."

 MGN_NKVD.1080.t: "Доля комун"
 MGN_NKVD.1080.desc: "Бандити мертві, а наш союз з Орєнбурґом виконав своє призначення. Однак зі смертю Дірлеванґера та його нацистської наволочі постає питання, що робити з Орєнбурґом. Комунами вже давно керують через бюрократичний, неефективний і недієвий безлад, який вони називають «Робітничою радою». Під вищою владою, владою об'єднавчою, владою на кшталт нашої їм було б значно краще. На наші втомлені плечі лягає тяжка ноша: консолідація Орєнбурґа буде довгим і виснажливим завданням. Однак крім прямої анексії є кілька способів контролювати комуни. Перший і найпростіший варіант, який комуни найімовірніше приймуть, - ушанувати силу нашого союзу, увінчавши дипломатичні відносини угодою про дружбу. Інший - запропонувати комунам автономію в межах нашої великої держави й дозволити їм зберегти анархістський спосіб життя у своїх поселеннях в обмін на війська й податки. Другий варіант вигідніший нам: він позбавить труднощів анексії й дасть більше користи, ніж угода про дружбу. Звісно, Робітнича рада не надто вітатиме таку вимогу, адже наш крок надто нагадує той, до якого, як багато хто попереджав, могла вдатися Уральська гвардія. Перед нами вибір: анексія, обмежена автономія або поліпшення відносин. Сподіваюся, пане, ви виберете правильно."
 MGN_NKVD.1080.a: "Нехай мають дорогоцінну автономію."
 MGN_NKVD.1080.b: "Анексія - єдиний шлях."
 MGN_NKVD.1080.c: "Дружба полегшує часи."

 MGN_NKVD.1081.t: "Робітнича рада голосує ПРОТИ"
 MGN_NKVD.1081.desc: "Робітнича рада відхилила нашу щедру пропозицію, заявивши, і я цитую, що «за жодних обставин не поступиться свободою й незалежністю лише для того, щоб почуватися вночі „безпечніше“ під зловісним оком НКВД». Майже вся Рада проголосувала ПРОТИ; чутки про рух військ на кордоні свідчать, що вони готові померти за ідеї й спалити створене на зло нам. Комісари й офіцери вже повідомляють людям і солдатам про невдячність та зраду Ради, кажучи, що Орєнбурґ зрадив Революцію. Війська тренуються, двигуни танків гріються, спільні навчання почалися. НКВД час іти на війну. Чи ні?"
 MGN_NKVD.1081.a: "Смерть зрадникам!"
 MGN_NKVD.1081.b: "Не вдаваймося до марного насильства."

 MGN_NKVD.1084.t: "Правильна відповідь"
 MGN_NKVD.1084.desc: "Псевдодвір Стєпана Бункова отримав добру новину: посланець НКВД повернувся із заможного Орєнбурґа з ратифікованою угодою про дружбу, обраною найкращим способом поводження з гордими анархістськими комунами. Особисте маленьке політбюро Бункова юрмилося довкола з жалюгідними підлабузницькими пиками, а він замислився. Угода може дати пригнобленим людям обох міст краще життя, поєднавши важку промисловість його володінь із комерційним багатством уральського рогу достатку в спільному майбутньому соціялістичної солідарности. Росіяни покажуть німецьким свиням у металевих чудовиськах над головою, що здатні жити заможно й мирно попри відмінності. Гамір повернув його до дійсности: за мрію ще треба працювати, але вона вже можлива. Розігнавши радників, він дозволив собі з надією всміхнутися."
 MGN_NKVD.1084.a: "Перший із багатьох кроків."


 #Autonomy
 MGN_NKVD.1082.t: "Робітнича рада голосує ЗА"
 MGN_NKVD.1082.desc: "Як і очікувалося, Робітнича рада проголосувала ЗА й відкрила кордони силам безпеки НКВД, які інтегрують комуни згідно з угодою. Наші люди святкують на вулицях перше, як вони сподіваються, з багатьох розширень держави. Над Радою майорить Червоний прапор, війська марширують під вигуки натовпу (озброєні люди лише сприяють і заохочують оплески). Зі здобуттям орєнбурзьких комун комісари почнуть викорінювати незгодних і контрреволюціонерів та пояснять, хто тут головний. Кажуть, Внутрішня безпека вже склала список..."
 MGN_NKVD.1082.a: "Малий крок для НКВД, величезний стрибок для Матері-Росії."

 #Annexation
 MGN_NKVD.1083.t: "Робітнича рада голосує ЗА"
 MGN_NKVD.1083.desc: "Як і очікувалося, Робітнича рада проголосувала ЗА й відкрила кордони силам безпеки НКВД, які інтегрують комуни згідно з угодою. Наші люди святкують на вулицях перше, як вони сподіваються, з багатьох розширень держави. Над Радою майорить Червоний прапор, війська марширують під вигуки натовпу (озброєні люди лише сприяють і заохочують оплески). Зі здобуттям орєнбурзьких комун комісари почнуть викорінювати незгодних і контрреволюціонерів та пояснять, хто тут головний. Кажуть, Внутрішня безпека вже склала список..."
 MGN_NKVD.1083.a: "Малий крок для НКВД, величезний стрибок для Матері-Росії."

 MGN_NKVD.1071.t: "Процес делисенкізації"
 MGN_NKVD.1071.desc: "Безумця усунено, та лишилося багато співучасників варварських експериментів у глибинах Маґнітоґорска. Головні посіпаки мертві в канаві, стікаючи кров'ю в чорну землю, але у наших в'язницях досі лишаються науковці, які допомагали йому створювати «Суперсолдата», а також найближчі родичі Лисенка. Їх можна «реабілітувати» й використати, але куля в потилицю та безіменна могила здаються простішими."
 MGN_NKVD.1071.a: "Час змусити їх зникнути."
 MGN_NKVD.1071.b: "Згодом вони ще знадобляться..."

 MGN_NKVD.1072.t: "Подальші чистки інтеліґенції?"
 MGN_NKVD.1072.desc: "Великих і малих науковців уже усунено чи реабілітовано, але ще лишилося чимало людей, у яких бодай дві звивини працюють разом: учителі, дослідники, колишні розвідники й навіть сільські священники, здатні сумніватися в рішеннях і підіймати юрбу проти нашої визвольної влади. НКВД готовий скласти списки сотень надто розумних людей, які принесуть новій державі значно більше користи, лежачи головою вниз на дні якоїсь канави. Який буде наказ?"
 MGN_NKVD.1072.a: "Передати списки."
 MGN_NKVD.1072.b: "Виявіть милосердя..."

 MGN_NKVD.1073.t: "Зв'язки з бандитами?"
 MGN_NKVD.1073.desc: "Після завершення перших перевірок виявилося понад сотню людей, які змовлялися проти нас, допомагаючи бандитам. Перевірки знайшли понад сотню спільників, зокрема:\n\nКустов Онуфрій Нікітовіч, шинкар. Злочин: обслужив бригаду СС і не вимагав оплати.\n\nПондяков Тімофєй Кірілловіч, священник у Красноярскому. Злочин: відпустив гріхи пораненому солдатові СС.\n\nЮдашкіна Роза Максімовна, донька мера Будамші. Злочин: спала з офіцером СС.\n\nУланов Зіґфрідс Захаровіч, конюх із Ясного. Злочин: напоїв коней місцевої козацької бригади після отримання вкраденого срібла.\n\nУ списку ще багато подібних злочинців; лишилося тільки схвалити його й змусити обвинувачених зникнути."
 MGN_NKVD.1073.a: "Поставити штамп і відправити."
 MGN_NKVD.1073.b: "Якщо вбиватимемо всіх, не лишиться новобранців."

 MGN_NKVD.1074.t: "Схвалені тексти?"
 MGN_NKVD.1074.desc: "Тепер, коли становище більш-менш під контролем, а всіх негідних і змовників остаточно викорінено з нашого нового суспільства, настав час навчити громадян слухатися передусім нас. Найпростішим способом було б показово покарати когось, але існують й інші, витонченіші способи індоктринації місцевого населення. Один із них - запровадити список схвалених текстів, які місцевим дозволено читати, якщо вони взагалі вміють читати. Водночас селами поширилося чимало антиреволюційних текстів, як-от Біблія, а в окремих рідкісних випадках навіть нацистська чи есесівська пропаганда. Щоб місцеве населення стало й лишалося «начитаним», доведеться позбутися всіх цих неприємних і відверто варварських текстів, замінивши їх винятково високоякісними, схваленими НКВД шедеврами літератури. Зрештою, всі без винятку сліди лисенківщини в системі треба знищити, щоб із глибин пекла більше ніколи не виповзло нічого подібного до нього. Це, звісно, означає, що ми знищимо кожен літературний твір, який має БОДАЙ ЯКИЙСЬ стосунок до сільського господарства або тієї новомодної наукової фантастики із суперсолдатами й іншою нісенітницею."
 MGN_NKVD.1074.a: "Позбутися всього, що може спричинити Сільськогосподарську революцію."
 MGN_NKVD.1074.b: "Навіщо забороняти книжки, якщо вони надто тупі, щоб їх читати?"

 MGN_NKVD.1200.t: "Справедливість для мертвих"
 MGN_NKVD.1200.desc: "Хоч правління Лисенка скінчилося, його жорстокість лишиться чорною плямою російської історії. Більшість тіл жертв треба передати родинам. Для нас це болісно, бо саме ми виконували накази. Тих, кому вже немає до якої родини повернутися, ми вшануємо меморіалом невідомим жертвам Лисенка - просту меморіальну табличку із зазначеною кількістю цивільних, убитих ним та його людьми. Сподіваємося, ці малі жести повернуть підтримку й дадуть Маґнітоґорскові спокійно оплакати загиблих та почати нове життя."
 MGN_NKVD.1200.a: "Тепер вони можуть спочивати в мирі - живі й мертві."

 MGN_NKVD.1201.t: "Мир і порядок"
 MGN_NKVD.1201.desc: "Знайомі вантажівки НКВД зустріли громадян, але вперше прибули з іншою метою. За наказом Бункова вони не збирають людей для Лисенка, а забезпечують мир у крихкому регіоні. Дехто називає це грубим кроком і попереджає про опір, якщо поспішимо. Та мотиви чисті, і нам напевно нема чого боятися."
 MGN_NKVD.1201.a: "Треба рішуче встановити порядок."
 MGN_NKVD.1201.b: "Не слід діяти важкою рукою."

 MGN_NKVD.1202.t: "Нас ввели в оману"
 MGN_NKVD.1202.desc: "Наші спроби втримати владу після усунення Лисенка зіткнулися із серйозною перешкодою: значна частина населення досі ставиться до наших людей із недовірою, а ще більше людей узагалі відмовляються співпрацювати. Бунков вирішив прямо звернутися по радіо щодо нашої участи в режимі, сподіваючись, що навіть далекі села мають бодай один приймач. Промову ще не сплановано, і точиться суперечка про те, наскільки НКВД допомагав Лисенкові та скільки сказати населенню.\n\nЗрештою, після виснажливих суперечок між обома сторонами Бунков чітко оголосив своє рішення..."
 MGN_NKVD.1202.a: "Треба применшити нашу роль."
 MGN_NKVD.1202.b: "Треба сказати правду."

 MGN_NKVD.1203.t: "Настав час платити"
 MGN_NKVD.1203.desc: "Мабуть, найзручнішим уцілілим спадком режиму Лисенка була його одержимість нескінченними списками, записами й такою кількістю подробиць, що спершу ми навіть не знали, що з ними робити. Ми маємо імена всіх живих колишніх суб'єктів і знаємо, де їх знайти. Їхня схильність до незгоди й безладу стає дедалі очевиднішою, і треба пояснити, на кого вони працюють.\n\nОстанні кілька днів за наказом нашого лідера полки НКВД розгорнули масштабні й стрімкі облави на ці потенційні загрози, де б ті не намагалися сховатися. Тепер усім зібраним скажуть, що..."
 MGN_NKVD.1203.a: "Кожен чоловік мусить битися."
 MGN_NKVD.1203.b: "Кожен чоловік мусить служити."
 MGN_NKVD.1203.c: "Кожен чоловік мусить вірити."

 MGN_NKVD.1204.t: "Погрози близьким"
 MGN_NKVD.1204.desc: "Незгода триває серед громадян, що не розуміють свого нового місця, особливо серед колишніх суб'єктів. Останній наказ прив'язує їхню відданість до чогось відчутного і, головне, такого, що не дасть їм стати мучениками. Цей нікчемний опір скінчиться зараз, щоб ми зосередилися на іншому."
 MGN_NKVD.1204.a: "Дякуємо за співпрацю."

 MGN_NKVD.1205.t: "Призов до НКВД?"
 MGN_NKVD.1205.desc: "Багато хто у Верховному командуванні прогнозує, що майбутня битва з Лігою дорого коштуватиме, особливо людьми. Тому точиться запекла суперечка: чи достатні наші нинішні закони про призов, чи перед майбутніми боями слід розширити призов."
 MGN_NKVD.1205.a: "Людські ресурси мають найвище значення."
 MGN_NKVD.1205.b: "Припинити суперечку, наших людей більш ніж достатньо!"

 MGN_NKVD.1206.t: "Ліга - держава-ізгой"
 MGN_NKVD.1206.desc: "Історичні відомості, численні докладні звіти підлого Лисенка та спостереження наших розвідників дали нам необхідне уявлення про дивну армію з державою, так званих захисників уральських степів - Лігу. Холодної зимової ночі старші комісари НКВД перечитали звіти й зрозуміли: Лігу треба винищити, якщо держава під контролем НКВД хоче й надалі існувати в цьому суворому світі без явного суперника. Інакше смертельне суперництво двох армій неминуче. Уральська гвардія уособлювала все те, що було хибним у дорогому нам Союзі, що впав перед виродженим нацистським наступом: слабких, зрадників, злочинців і церкву. Комісарів охопила холодна лють: кожен день існування цієї мерзенної держави поруч із нашим осердям плямує легітимність і репутацію НКВД. Солдатам не скажуть, кого вони вбиватимуть; це буде суцільна операція без уцілілих."
 MGN_NKVD.1206.a: "Природний порядок слід відновити."

 MGN_NKVD.1075.t: "Світанок сягає Маґнітоґорска"
 MGN_NKVD.1075.desc: "Світанок простягається крізь смог Чорної Гори й подекуди пробивається до каміння внизу. Технократичному порядку настав кінець, а натомість постане суспільство під проводом Світоча більшовизму. Людей виведено із шахт, піддослідних звільнено з камер. Усе лежить у руїнах, але люди вже не в кайданах.\nПід камінням, осяяним світанком, незнайомий дим буденно починає здійматися в смог Чорної Гори."
 MGN_NKVD.1075.a: "Скінчено."

 MGN_NKVD.1076.t: "Під осяяним світанком камінням"
 MGN_NKVD.1076.desc: "Глибоко в череві Чорної Гори лишилися адміністратори, науковці й підлабузники, які ще не змішалися зі смогом Маґнітоґорска. Вони там з однієї з двох причин: їхні уми й тіла ще потрібні для вилучення інформації або вони заслуговують на щось значно гірше за одну швидку й жалюгідну смерть.\n\nБільшу частину дня вони сидять у суворій чорній тиші. Часом їх ненадовго витягають для витягування інформації або для тортур; часто це те саме - належний кінець людям, які перетворили тисячі життів на цифри й таблиці. Лише коли вони вже не можуть принести жодної користи або більше не здатні відчувати ще сильніші муки, їх відправляють у димарі.\n\nЯкщо хочете побачити справедливість, дивіться на чорний дим безіменного об'єкта на південь від Маґнітоґорска. Саме там, здіймаючись до неба масними клубами диму, живуть справжнє покаяння й безмежне, безмежне горе."
 MGN_NKVD.1076.a: "Нехай нічого не лишиться!"

 MGN_NKVD.1077.t: "Найбільша загроза"
 MGN_NKVD.1077.desc: "Загроза бригади Дірлеванґера величезна: рідко трапляється зграя безумців, ще неврівноваженіша за нашого колишнього диктатора. Якщо й далі нічого не робитимемо проти цієї екзистенційної фашистської загрози, самі загинемо. Треба якнайшвидше відбити або, краще, знищити Дірлеванґера й нацистських бандитів. Вище командування обговорило кілька планів і навіть можливий союз із сусідами. Нині найкращим видається потужний удар у головний табір, але й він може розбитися об загартованих бандитів. Поки нам лишається тільки чекати й планувати, поки фашистські щури плодяться на наших кордонах."
 MGN_NKVD.1077.a: "Наш час скоро настане..."
 
 MGN_NKVD.1078.t: "Ворог нашого ворога"
 MGN_NKVD.1078.desc: "22-га мотострілецька дивізія може бути однією з найсильніших професійних частин колишнього Совєцького Союзу, але проти проклятої бригади цього може не вистачити. Нам бракує людей одночасно боронити Маґнітоґорск від німців і їхніх російських улюбленців та вирішально розгромити бригаду в полі.\nНа заході стоїть вільна конфедерація комун навколо Орєнбурґа. Місцеві не зрівняються зі справжньою армією чи ветеранами-бандитами, але їхні ополчення численні й відчайдушні. Союз бодай із частиною комун дасть людей, щоб відрізати Дірлеванґерові шлях відступу на захід від Уралу. Якщо саме місто приєднається, наша армія, орєнбурзька варта й дрібні ополчення можуть мати достатню чисельність для перемоги.\nЯк уже на власне розчарування переконалася Уральська Ліга, орєнбуржці не довіряють централізованим групам, особливо озброєним. Переговори будуть складні... Та Маґнітоґорск має ресурси, жадані міськими угрупованнями. Якщо правильно розіграти карти, угода можлива."
 MGN_NKVD.1078.a: "Погляньмо, що запропонують ці анархісти."
 
 MGN_NKVD.1079.t: "Наш друг Малєнков"
 MGN_NKVD.1079.desc: "Схоже, ми не такі самотні на Уралі. Ґєорґій Малєнков, визначний політик часів Бухаріна, став прем'єром Орєнбурґа й мислить значно централізованіше за товаришів. Він не великий світоч совєцької доби, але може стати корисним союзником. Оточені виродками й контрреволюціонерами, ми потребуємо всієї можливої допомоги й не можемо вередувати.\n\nПопередніх послів уже надіслано; обговорюють військове спорядження й припаси, які ми могли б їм щедро передати. Вони, схоже, сприйняли ідею прихильно, хоча, можливо, просто відчайдушно прагнуть прибрати до своїх жадібних рученят будь-яку зброю, яку тільки зможуть отримати. Та як інакше їх схилити?"
 MGN_NKVD.1079.a: "Вони обрали правильну людину."
 
 MGN_NKVD.1090.t: "Зрадник Бурба"
 MGN_NKVD.1090.desc: "Алєксандр Бурба - не той, кого ми хотіли бачити на чолі орєнбурзьких комун. Він не вірить у комуністичні цінності й не поділяє інтересів НКВД. Ми повалили Лисенка не для покори іншому технократові-виродку. Та через зростання сили й агресії бригади Дірлеванґера, можливо, нам доведеться хоча б тимчасово вступити в союз із Бурбою, знищити бандитського «короля» й приспати зграю скажених тварин.\n\nТреба вирішити швидко, поки Дірлеванґер не вдарив першим. Збережемо цілісність справжніх захисників комунізму чи пожертвуємо цінностями заради виживання й орєнбурзького селянства?"
 MGN_NKVD.1090.a: "Ми хотіли не такого висліду."
 
 MGN_NKVD.1091.t: "Питання Дірлеванґера"
 MGN_NKVD.1091.desc: "Оскар Дірлеванґер і його зграя фашистських бандитів далі лишаються кісткою в нашому горлі: вони грабують прикордонні землі й винищують там села задля власного зиску та розваги. На щастя, не лише нас він вирішив провокувати - він давно є чумою і для наших хоробрих товаришів в Орєнбурґу. Хоч Малєнков і недалекий, навіть він має розуміти, наскільки бригада загрожує подальшому існуванню соціялістичної думки на Уралі. Цю проблему треба розв'язати радше раніше, ніж пізніше.\n\nДо Орєнбурґа надіслано групу послів, які мають безпосередньо домовитися з містом і виробити якусь офіційну стратегію спільного стримування та ліквідації Чорної бригади. Однак переговори просуваються повільно. Малєнков погоджується, що з Бандитським королем Уралу колись у майбутньому треба розібратися, але не хоче цілковито поступатися стратегічним контролем або віддавати військам НКВД першість у польовому командуванні. У багатьох питаннях він дурень, але принаймні достатньо розумний, щоб берегти наявні владу й суверенітет. Поки що доведеться задовольнитися туманними обіцянками й порожніми рукостисканнями та зосередитися на пошуку способів остаточно розвіяти сумніви Малєнкова щодо нас."
 MGN_NKVD.1091.a: "Краще, ніж нічого."

 MGN_NKVD.1092.t: "Наука"
 MGN_NKVD.1092.desc: "Після Лисенка треба вирішити долю так званої «науки» безумця й науки Чорної Гори.\n\nЄ два шляхи. Можна викинути все, позбутися божевільних переконань і відверто неправдивих та шкідливих «соціялістичних» поглядів на науку. Це спричинить чистку документів Лисенка й усіх радників.\n\nАбо можна переглянути документи в пошуках чогось корисного. Імовірно, це буде марна втрата часу, але товариші Лисенка виживуть. Що робити?"
 MGN_NKVD.1092.a: "Його дурні пригоди ні до чого."
 MGN_NKVD.1092.b: "Можливо, під усіма невдачами є правда."

 MGN_NKVD.1060.t: "Сигнал до пробудження"
 MGN_NKVD.1060.desc: "Рушниця може захистити родину, але голодний не втримає рушниці, а рушниця не збудує себе сама. Робітники й селяни мусять усвідомити свою життєво важливу роль у суспільстві - будь-якими засобами. Ми не терпітимемо провокаційної поведінки, що загрожує моральному духові наших робітників та їхній мотивації працювати й виробляти для свого народу. Запровадимо суворіші квоти, поставимо комісарів і бюрократів на робочих місцях та встановимо контроль і порядок у полях і на заводах. Час належно розібратися з «деморалізувальними» елементами."
 MGN_NKVD.1060.a: "Це має їх умотивувати..."
 MGN_NKVD.1060.b: "Ні. Ми віримо в народ."

 MGN_NKVD.1061.t: "Суди"
 MGN_NKVD.1061.desc: "Рятуючи колишніх громадян Ліги від терору Лисенка, ми принесли потенційну небезпеку в нововизволене суспільство. Не можна ходити вулицями, знаючи, що власні громадяни й товариші змовляються з людиною за Уралом. Щоб убезпечити наш народ від цих зрадників і зрадницьких настроїв, нам доведеться діяти незвичним, але добре знайомим способом. 22-га працюватиме швидко й ефективно. Таємні суди, допити, заслання й страти підозрюваних «поплічників Ліги» забезпечать відданість і співпрацю наших громадян перед лицем уральської агресії."
 MGN_NKVD.1061.a: "Назад до клітки."
 MGN_NKVD.1061.b: "Вони вже достатньо страждали."

 MGN_NKVD.1062.t: "Промова"
 MGN_NKVD.1062.desc: "Плакат на кожному розі, заводі й вокзалі. Радіостанції гудітимуть промовами Стєпана Бункова. Просту людину Маґнітоґорска затоплять образи хороброї боротьби НКВД з бандитами й Лисенком, пишномовні промови та паради. Народ мусить чути слово своїх друзів і захисників; доки бодай одна людина може прожити цілий день, не побачивши, не прочитавши й не почувши нашого послання, місію не виконано."
 MGN_NKVD.1062.a: "Запускайте друкарні!"
 MGN_NKVD.1062.b: "Це непотрібно..."

 MGN_NKVD.1063.t: "Доля комун"
 MGN_NKVD.1063.desc: "Ми рухаємося вперед, і тепер, коли комуни опинилися під нашим наглядом, перед нами постала дилема. Орєнбурґ - найбільше місто Південного Уралу, тепер під нашою владою опинилося численне й непокірне населення, не звикле до нашого... різновиду правління. Вибір простий: ув'язнити розлючені маси, стратити незгодних і прислати поселенців або пощадити людей, витримати бурю й об'єднати гору та місто."
 MGN_NKVD.1063.a: "Їх неможливо контролювати."
 MGN_NKVD.1063.b: "Потрібне розв'язання на майбутнє."

 MGN_NKVD.1064.t: "Пристосування"
 MGN_NKVD.1064.desc: "Життя під наглядом НКВД не таке відмінне, як дехто думав. Вулицями їздять вантажівки з солдатами, пайки трохи суворіші, але решта гаразд. Зі сходу навіть прибувають нові цивільні. Гадаю, з часом ми зможемо навчитися співіснувати з цими людьми. Якщо, звісно, ви не маєте іншої думки."
 MGN_NKVD.1064.a: "Так життя триває..."

 MGN_NKVD.1065.t: "Інтернування"
 MGN_NKVD.1065.desc: "Вони приїжджають вантажівками, групами по п'ять-сім осіб. На них чорні вовняні маски й червона зірка на оливково-зеленому лахмітті. Вони стукають, входять і забирають. Ніхто не питає, бо боїться, що заберуть і його. Якщо не відповідають, вони все одно входять. Ніхто не знає, звідки вони приходять і куди забирають людей. Забрані не повертаються. Їх переселяють, але куди - невідомо. Одні кажуть, їх розстрілюють за містом, інші - використовують як рабів. Правди ніхто не знає."
 MGN_NKVD.1065.a: "Ми зробили необхідне."

 MGN_NKVD.2000.t: "Червоний світанок - падіння Дірлеванґера"
 MGN_NKVD.2000.desc: "Одні бої стаються раз. Інші відбиваються раз, двічі й тричі у вузькому провулку історії, у потертих дзеркалах і викривлених відображеннях. Це ціна зламаного світу: нескінченні бої за справедливість тліють навіть після згасання вогню.\n\nОдні з останніх дієвих підрозділів внутрішньої безпеки й розвідки Червоної Армії знищили бандитів «бригади Дірлеванґера», що й далі зберігала подобу організації бригади СС.\n\nПеремога НКВД несе громадянам нової Червоної Чорної Гори добрі й лихі знамення. Психопатія та безумство Дірлеванґера більше не загрожують тим, хто тремтів під його чоботом, а за його бандитизм і численні злочини його поплічників нарешті буде відплачено справедливістю. Та НКВД лишається зловісною чорною порожнечею, хай і вкритою червоними символами; і хто знає, наскільки повно тінь Лисенка вдалося викорінити з його системи?\n\nУрал тремтить. На старі пагорби сходить новий Червоний світанок. Ніхто не знає, що він принесе."
 MGN_NKVD.2000.a: "Вражає."

 MGN_NKVD.2001.t: "Червоний світанок - затемнення Уралу"
 MGN_NKVD.2001.desc: "Багато хто казав, що це неминуче: мілітаризована інтервенціоністська Уральська Ліга й мілітаризований революційний НКВД Чорної Гори мали вчепитися одне одному в горло. Та швидкість, із якою відносини переросли в жахливий конфлікт, приголомшила.\n\nТепер Червоний прапор майорить над рештками Усть-Катава, а Лігу розсіяно по пагорбах. Боротьба скінчилася. Самого Мендрікса ніде не можуть знайти. НКВД і преса називають його мертвим, але чотки, які він завжди носив, не знайшли на гаданому місці загибелі. Через повагу й любов громадян його, ймовірно, таємно вивезли в якийсь інший забутий закуток Росії, де він доживатиме свої побожні дні. Можливо, якийсь сільський священник у каптурі час від часу відриватиметься від своїх обов'язків, згадуватиме колишню батьківщину й плакатиме.\n\nДолі жителів Ліги ніхто не знає. НКВД докладає чималих зусиль, щоб змалювати свою політику в заспокійливих барвах й називає себе Великим авангардом цивілізації та революційної справедливости, але ніхто не забув співучасти у звірствах Лисенка, і ніхто не хоче замислюватися, скільки заліза приховано за їхньою шовковою риторикою.\n\nЩо б не було, Червоний світанок уже цілує Уральські гори, і рівновага сил змінилася назавжди. Революція тліє далі."
 MGN_NKVD.2001.a: "Один ведмідь загриз іншого."

 MGN_NKVD.2002.t: "Червоний світанок - єдність лівих"
 MGN_NKVD.2002.desc: "Орєнбурзькі комуни завжди були суперечністю: державою, побудованою навколо ідеології, яка для свого здійснення вимагала її розпуску. Було чимало проблем із тим, як ними керували, та з нескінченним балансуванням на канаті народного консенсусу, без якого жоден закон не міг потрапити до збірників законів. Та коли постріли з останніх застав ополчення стихають, а радники тікають у вигнання й безвість, стає ясно: цей експеримент, невдалий чи успішний, завершено. На його місці стоять новий Червоний авангард і кривава істина соціялістичної єдности.\n\nКомуни цілком розпалися: члени Ради разом із її головою розпорошилися, місцеві структури влади замінено або знищено внаслідок чисток, хитка система, що підтримувала Орєнбурґ, зникла, а над самим містом майорить новий червоний прапор. Із методичною, прискіпливою жорстокістю, властивою НКВД, складають списки, і визнаних ревізіоністами та зрадниками соціялістичної справи поволі інтернують, судять і реабілітують. Дехто цілком зникає зі списків, і краще не думати про його долю надто наполегливо чи голосно.\n\nНевідомо, чи призвичаяться жителі комун до нового соціялізму, яким керують із Чорної Гори, і чи вподобають нових комісарів більше за колишніх сварливих радників та представників. Звіти НКВД, звісно, незмінно випромінюють упевненість і позитив - і такими вони й лишатимуться. За всяку ціну. Час покаже, чи відчувають жителі колишніх комун те саме.\n\nА спостерігачі в сусідніх землях сумно хитають головами, знаючи стару істину: поширюючись, Червоний прапор завжди душить своїх."
 MGN_NKVD.2002.a: "Уся влада Совєту."

 ###Tooltips

 MGN_NKVD_Peace_and_Order_tt: "§YМи мусимо вибрати між рішучим наведенням порядку й стабілізацією держави та м'якістю, що збереже підтримку народу.\n§!"
 MGN_NKVD_we_were_misguided_tt: "§YТреба вирішити, скільки розповісти народові про нашу участь у режимі Лисенка. Що менше скажемо, то менше постраждає наша влада.\n§!"
 MGN_NKVD_Triumphant_tt: "§YГора наша, ми перемогли.\n§!"
 MGN_NKVD_justice_for_dead_tt: "§YТреба встановити, скільки людей безумець і його посіпаки вбили в експериментах.\n§!"
 MGN_NKVD_rebuild_local_communities_tt: "§YТреба відбудувати все зруйноване терором Лисенка.\n§!"
 MGN_NKVD_new_dawn_tt: "§YМи повернули горі гідність. Життя зростатиме без страху перед безумцями всередині.\n§!"
 MGN_NKVD_bad_science_tt: "§YЖахливі експерименти Лисенка зупинено, і може початися нова доба сучасної соціялістичної науки.\n§!"
 MGN_NKVD_test_subjects_tt: "§YТреба звільнити суб'єктів із кліток, повернути їм гідність і не дати жахіттям гори далі калічити землю.\n§!"
 MGN_NKVD_constructive_science_tt: "§YЛабораторії знищено, «звіти» спалено, клітки розібрано (і складено на потім). Час укорінити в горі сучасніший погляд на науку.\n§!"
 MGN_NKVD_benevolent_rule_tt: "§YНарод безсумнівно підтримує нас, вороги втекли. Доба божевілля й тортур скінчилася, настала доба НКВД.\n§!"
 MGN_NKVD_reunite_loved_ones_tt: "§YТреба повернути суб'єктів родинам, закріпивши їхню відданість нам і тільки нам.\n§!"
 MGN_NKVD_pushback_from_locals_tt: "§YМісцеві тривожаться: вони пам'ятають старий НКВД і його дії проти простих людей. Треба швидко щось зробити.\n§!"
 MGN_NKVD_placate_tt: "§YМи не ті люди, ми НКВД. Допоможемо народові й покажемо себе доброзичливими господарями.\n§!"
 MGN_NKVD_punish_tt: "§YЯкщо вони опиратимуться, ми покажемо долю зрадників.\n§!"
 MGN_NKVD_lesson_learned_tt: "§YНарод засвоїв урок, але й ми також. НАШІ ВЧИНКИ ВИЗНАЧАЮТЬ, КИМ МИ СТАНЕМО.§!"
 MGN_NKVD_de_lysenkoization_tt: "§YДеякі елементи маґнітоґорського безумця ще лишилися, але добра куля все виправить. Хоча можна виявити трохи поблажливости.\n§!"
 MGN_NKVD_intel_purges_tt: "§YІнтелігенцію досі пронизують люди Лисенка й погані спогади. Із ними треба розібратися, люди чекають наказу.\n§!"
 MGN_NKVD_bandit_connections_tt: "§YДехто нерозважливо здружився з проклятими бандитами півдня; у майбутньому вони можуть стати загрозою.\n§!"
 MGN_NKVD_approved_texts_tt: "§YДеякі книжки й тексти інакше бачать нашу владу. Спалити їх легко, але це ж лише книжки, правда?\n§!"
 MGN_NKVD_lists_tt: "§YКонтрреволюціонери й морально зіпсуті люди загрожують владі, хоча такі проскрипції неодмінно матимуть наслідки.\n§!"
 MGN_NKVD_spies_tt: "§YБезліч людей охоче розірве всі дружні й родинні зв'язки заради нашої справи. Таке сіяння розбрату неодмінно спричинить проблеми.\n§!"
 MGN_NKVD_village_commisars_tt: "§YМи не можемо постійно тримати війська в кожному селі, зате можемо поставити комісарів у кожному селі, щоб будь-якими необхідними засобами підтримувати їхню відданість.\n§!"
 MGN_NKVD_remind_lysenko_tt: "§YЛисенка немає, але краще нагадати народові, від чого ми його врятували.\n§!"
 MGN_NKVD_remind_bandit_tt: "§YМи не дали бандитам прорвати кордон. Народ має це знати.\n§!"
 MGN_NKVD_league_connections_tt: "§YПісля звільнення з кліток серед нас багато колишніх громадян Уральської Ліги. Це потенційна загроза, і треба вирішити, що робити.\n§!"
 MGN_NKVD_remind_duty_tt: "§YНарод служить НКВД і має служити віддано та сумлінно.\n§!"
 MGN_NKVD_mass_propaganda_tt: "§YНарод має знати нашу славу, а що краще за випробувану традицію затопити його пропагандою?\n§!"
 MGN_NKVD_science_tt: "§YРештки науки Лисенка гниють у замкнених сейфах і засекречених теках. Дещо може знадобитися, та чи хочемо спиратися на бездоказову науку?\n§!"
 MGN_NKVD_centralise_tt: "§YУряд слабкий і розділений. Ми не орєнбурзькі дурні, анархія не допоможе. Уряд треба централізувати зараз.\n§!"
 MGN_NKVD_cult_bunkov_tt: "§YХіба товариш Стєпан Бунков не наш рятівник і найшанованіший лідер? Він вивів нас із темряви до світла.\n§!"
 MGN_NKVD_portrait_tt: "§YСлавний образ товариша Бункова буде в кожній оселі; інакше це образа його керівництва.\n§!"
 MGN_NKVD_cult_commissar_tt: "§YБез комісара народ розсіяний, а держава зруйнована. Лише завдяки їм ми тут.\n§!"
 MGN_NKVD_venerate_tt: "§YНКВД привів народ до величі, тож комісари й офіцери заслуговують на належну шану.\n§!"
 MGN_NKVD_no_cult_tt: "§YКульти особи лише заважають порятунку Росії від руйнування. Культів не буде.\n§!"
 MGN_NKVD_exalt_peasants_tt: "§YЗавдяки селянам славна держава стоїть на ногах. Вони заслуговують справжньої похвали - де ми були б без них?\n§!"
 MGN_NKVD_are_we_baddies_tt: "§YЧерез нас люди ховаються за вікнами й дверима? Через нас живуть у страху? Яке місце ми посіли в Росії?\n§!"
 MGN_NKVD_progress_tt: "§YНКВД править горою. Народ нас любить. Сили міцні й готові. Час поглянути на сусідів.\n§!"
 MGN_NKVD_consolidate_gains_tt: "§YТреба контролювати державу, а для цього необхідно консолідувати владу.\n§!"
 MGN_NKVD_village_trust_tt: "§YСела приголомшені нашою владою над ними. Вони люблять нас і засипають наших людей похвалою.\n§!"
 MGN_NKVD_traitor_fear_tt: "§YТі, хто втік, знають, хто ми й що на них чекає. Вони добре знають, що слід боятися того, що приходить по них уночі.\n§!"
 MGN_NKVD_ural_respect_tt: "§YУрал поважає й розуміє нашу силу. Уральська Ліга й орєнбурзькі комуни визнають нашу владу, бандити знають долю нападників.\n§!"
 MGN_NKVD_dirlewanger_issue_tt: "§YЗ Дірлеванґером і його бандитами зрештою треба розібратися: вони лише чекають нагоди напасти.\n§!"
 MGN_NKVD_unexpected_ally_tt: "§YОрєнбурзькі комуни мають своєрідний спосіб урядування, але вони є корисним союзником проти південних бандитів.\n§!"
 MGN_NKVD_comrade_malenkov_tt: "§YМалєнков розуміє, що саме робило СССР сильним і є союзником нашої справи; його влада значно поліпшує союз з Орєнбурґом.\n§!"
 MGN_NKVD_revisionist_commune_tt: "§YОрєнбурзькі комуни охоплені анархією й не мають справжнього лідера. Нам випало їх спрямувати.\n§!"
 MGN_NKVD_bloody_burba_tt: "§YБурба й брудні технократи взяли владу. Їхнє бачення Росії протилежне нашому, але заради виживання треба бути прагматичними.\n§!"
 MGN_NKVD_diplomats_to_orenburg_tt: "§YМи надішлемо дипломатів до Орєнбурґа закріпити союз.\n§!"
 MGN_NKVD_urals_unite_tt: "§YНаші держави мусять об'єднатися, щоб перемогти спільних ворогів.\n§!"
 MGN_NKVD_united_front_tt: "§YМи створимо єдиний фронт проти тих, хто прагне знищити держави й скривдити народ.\n§!"
 MGN_NKVD_unique_talents_tt: "§YНаші держави мають власні сильні сторони. Окремо ми слабкі, разом - сильні.\n§!"
 MGN_NKVD_against_dirlewanger_tt: "§YЗло півдня треба розчавити. Німці та їхній підлий ватажок Дірлеванґер - виразка Росії, і ми забезпечимо їхнє знищення. Без милосердя, без полонених.\nУРА-А-А-А-А-А-А-А-А-А-А-А!\n§!"
 MGN_NKVD_beyond_saving_tt: "§YОрєнбурґ - охоплена анархією земля, яку ледве тримає «Робітнича рада». Нам не потрібні ці бездумні дурні. Вони були приречені від самого піднесення.\n§!"
 MGN_NKVD_protect_our_own_tt: "§YМи захистимо своїх від суворих пусток. Народ більше не житиме в страху нападів і бомб.\n§!"
 MGN_NKVD_go_dark_tt: "§YВороги можуть перехоплювати наші повідомлення й радіопереговори. Треба шифрувати повідомлення, щоб ніхто не викрив планів.\n§!"
 MGN_NKVD_defend_mountain_tt: "§YГору треба захистити. Наступного разу бандитів зустрінуть колючий дріт, бетон і кулеметний вогонь.\n§!"
 MGN_NKVD_fate_orenburg_tt: "§YЧас вирішити долю орєнбурзьких комун.\n§!"
 MGN_NKVD_sling_tt: "§YМи перемогли, але чи справді виграли? На нас ліг тягар орєнбурзьких вимог і нескінченних чвар. Що ми здобули, лишивши їх живими?\n§!"
 MGN_NKVD_sing_tt: "§YМи перемогли. Сподіваємося, майбутні відносини з Орєнбурґом будуть плідними.\n§!"
 MGN_NKVD_order_tt: "§YМи пануємо, вороги мертві, селяни бояться. Ніхто не заперечує, а незгодних стирають з історії. Слава НКВД.\n§!"
 MGN_NKVD_runaway_problem_tt: "§YПісля славної перемоги багато людей тікає через кордон до сусідів. Це треба зупинити негайно.\n§!"
 MGN_NKVD_commisar_on_front_tt: "§YСолдатам безперечно додасть духу політичний офіцер, який дихає в потилицю й чекає нагоди «виправити» помилки.\n§!"
 MGN_NKVD_search_for_hidden_weapons_tt: "§YДля дедалі більшої армії потрібна зброя. Є повідомлення про старі схованки - саме те, що нам треба.\n§!"
 MGN_NKVD_blackmail_former_experiments_tt: "§YУцілілі в експериментах Лисенка мають мовчати й радіти, що не померли, як решта.\n§!"
 MGN_NKVD_threaten_loved_ones_tt: "§YЯкщо звичайний шантаж не діє, погрози всім і кожному, хто з ними пов'язаний, мають зробити своє й провчити їх.\n§!"
 MGN_NKVD_fence_communities_tt: "§YЛюдей треба захистити від зовнішнього світу й самих себе. Не можна дозволити нікому таємно втекти.\n§!"
 MGN_NKVD_owe_much_to_the_hun_tt: "§YКожен незгодний із нами - Гітлер та/або Дірлеванґер.\n§!"
 MGN_NKVD_rogue_state_tt: "§YУральська Ліга приймає втікачів - відверта образа нашої гідности. Треба підготуватися, щоб розв'язати цю проблему.\n§!"
 MGN_NKVD_conscription_for_NKVD_tt: "§YЗамало людей добровільно йде до армії. На щастя, їхньої згоди не потрібно.\n§!"
 MGN_NKVD_rev_up_the_motors_tt: "§YМобілізуємо мотострілецькі дивізії й підготуємо до війни. Перша зупинка - Бєлорєцк.\n§!"
 MGN_NKVD_wipe_out_the_league_tt: "§YЧас стерти з лиця землі державу невдах і недосолдатів.\n§!"
 MGN_NKVD_reclaim_our_prisoners_tt: "§YУтікачі, яких прийняла Ліга, знову наші. Час навчити їх наслідків зради довіри.\n§!"
 MGN_NKVD_crush_bandits_tt: "§YБандити бригади Дірлеванґера вже давно тероризують наші кордони. Час назавжди припинити їхні напади.\n§!"
 MGN_NKVD_subjugate_Orenburg_tt: "§YОрєнбурзькі комуни вважають своє врядування правильним. Вони помиляються, і ми пояснимо, хто має правити.\n§!"
 MGN_NKVD_spare_orenburg_tt: "§YМорока з анархістами Орєнбурґа надто велика. Поки що пощадимо їх.\n§!"
 MGN_NKVD_and_when_you_tt: "§YСтарі ґулаґи приносили користь Совєцькому Союзові й давали негідникам змогу відпрацювати злочини (доки вони не вмирали).\n§!"
 MGN_NKVD_well_just_say_tt: "§YБільше трудових таборів, більше в'язнів і суворіші вироки допоможуть розчавити незгоду.\n§!"

 ### Variables and Decisions###

 MGN_subjects_category_desc:2 "«Суб'єкти» - звична скорочена назва в'язнів, добровольців та інших осіб, які братимуть участь у наукових експериментах Підкомітету анатомічних досліджень. Здобуття суб'єктів є нашим найвищим пріоритетом, особливо для Программи Зімнєґо Солдата. Реквізиція в Маґнітоґорску досі можлива, але зашкодить обороні й промисловості, тому суб'єктів слід вилучати з довколишніх районів. Місії вилучення або відновлення контролю навколо Маґнітоґорска дадуть потрібне.\n\nНині ми маємо §Y[?Root.lysenko_subjects]§! суб'єктів."
 MGN_subjects_category:2 "Суб'єкти"

 MGN_URL_tribute_refused: "У данині відмовлено"
 MGN_URL_tribute_accepted: "Данину сплачено"

 MGN_target_category: "Вибір цілей серед сусідів"
 MGN_target_category_desc: "На заході лежать дві самопроголошені держави, що зрадили СССР. На Уралі - втікачі з Воркутлаґу під латвійським лжепророком. На рівнинах - роз'єднані постійними чварами комуни Орєнбурґа, нібито держава, що не має жодної з її ознак. Відтепер вони раз і назавжди підкоряться Чорній Горі."
 MGN_target_orenburg_decision:3 "[ORE.GetFlag]Націлитися на Орєнбурґ"
 MGN_target_ural: "[URL.GetFlag]Націлитися на Уральську Лігу"
