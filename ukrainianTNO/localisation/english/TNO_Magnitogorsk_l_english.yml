 MGN_lysenko_sanity_category: "Розсудок Лисенка"
 MGN_lysenko_sanity_category_desc: "Хоч товариш Лисенко неохоче це визнає, його психічний стан далекий від стабільного, і можна лише гадати, що станеться, якщо його зв'язок із дійсністю ослабне ще більше. Нині розсудок Лисенка: §Y[?Root.lysenko_sanity]%§!."

