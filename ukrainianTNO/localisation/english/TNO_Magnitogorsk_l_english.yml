 ### National Spirits ###
 MGN_gloves_off: "Рукавички скинуто"
 MGN_mad_scientist: "Божевільний учений"
 MGN_mad_scientist_desc: "Маґнітоґорські науковці, якими править учений-маніяк зі своєю зграєю божевільних підтакувачів, ладні пожертвувати чим завгодно, аби здолати фріца.\n\nНавіть власною людяністю."
 MGN_supply_production_idea: "Ефективність виробництва припасів"
 MGN_supply_production_idea_desc: "Ми спланували й запровадили систему, яка підвищує ефективність виробництва піхотного спорядження."
 MGN_improved_defensive_methods_1: "Удосконалені методи оборони"
