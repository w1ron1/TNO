 Orenburg_Target: "Орєнбурґ як ціль"
 Ural_Target: "Уральська Ліга як ціль"
 MGN_army_professianalism_category:2 "Готовність армії"
 MGN_army_professianalism_category_desc:2 "Ізольована в Маґнітоґорску, наша армія численна й добре споряджена, але майже не має належних можливостей для підготовки. Уральська гвардія біля кордону напевно готує вторгнення, тому вишкіл і готовність мають найвищий пріоритет.\n\n[Root.GetReadiness]\n\nНинішня §YГотовність армії§!: §Y[?Root.army_preparation]%§!\n\nНинішній §YВишкіл армії§!: §Y[?Root.army_drill]%§!"
 MGN_army_professionalism_low: "Наша армія може бути великою, але останнім часом окремим солдатам бракує підготовки."
 MGN_army_professionalism_medium: "Готовність армії за останні роки значно зросла; ми наближаємося до найелітнішої сили регіону."
 MGN_army_professionalism_high: "Армія готова до бою й теоретично здатна витримати будь-якого ворога."

 nkvd_loyalty_category: "Лояльність НКВД"
 nkvd_loyalty_category_desc: "НКВД є нашими силами безпеки й м'язами експериментів, але відносини далекі від досконалости.\n\nДо товариша Лисенка й Центрального комітету дійшли чутки про нелояльні елементи у 22-й мотострілецькій дивізії. Їх треба стримувати, інакше ризикуємо всім, заради чого прийшли до Маґнітоґорска.\n\nНинішнє гадане §HНевдоволення НКВД§!: §Y[?ROOT.lysenko_nkvd_disloyalty]%§!\n\n§RНе можна допустити наближення до 100.§!"
