 ### Leader Bios ###
 POLITICS_TROFIM_LYSENKO_DESC: "Колись Совєцький Союз прославляв Трохима Лисенка як золотого хлопчика соціялістичної науки. Нарешті скромний учений-пролетар, який відкидав реакційну «освіту», насаджувану буржуазними установами! Людина, яка довела, що принципи Маркса застосовні не лише до людського суспільства, а й до самих плодів землі! Його теорії здійснять революцію в агрономії та перетворять Совєцький Союз на світового сільськогосподарського велетня! Дарвінізм належить минулому, а лисенківщина - майбутньому!\n\nПринаймні саме це він обіцяв.\n\nЙого результати виявилися значно гіршими, але вчасний початок війни врятував його від серйозних наслідків. Коли совєцький фронт розвалювався, Лисенка та кліку відданих йому науковців евакуювала на схід 22-га мотострілецька дивізія НКВД, щоб його «життєво важливі дослідження» не потрапили до рук фашистів. Після розпаду Союзу Лисенко лишився без покровителів, а 22-га - без наказів, тож дві групи уклали союз. Він переконав командування 22-ї, що задля добра Союзу дослідження треба продовжувати, навіть якщо сам Союз перестав існувати як цілісна держава, а також що потрібен новий дослідницький об'єкт. Попрацювавши на Західноросійський революційний фронт, а згодом покинувши його, вони знайшли притулок у покинутому промисловому місті Маґнітоґорску й перетворили колись занедбану Чорну Гору на осередок досліджень і наукових новацій.\n\nОднак Лисенко так і не зрікся свого псевдоламаркістського погляду на еволюцію й далі витрачав час і ресурси, намагаючись довести його правильність. А з огляду на скрутне становище Союзу, якщо довести, що його теорії застосовні й до людей, це могло б мати й військову цінність..."

 POLITICS_STEPAN_BUNKOV_DESC: "Стєпан Міхайловіч Бунков, незамінний командир 22-ї мотострілецької дивізії НКВД, віддано служив Совєцькій Батьківщині навіть після того, як її розчавили німецькі танки. Достеменно невідомо, як його шлях перетнувся зі шляхом Лисенка, однак заведено вважати, що безпосередньо перед падінням Москви Кремль доручив товаришеві Бункову евакуювати на Урал науково-технічну інтеліґенцію, щоб вона могла працювати на користь країни навіть після того, як серце Росії скорилося загарбникові. Під час цих поневірянь вони виявилися непотрібними всім іншим самопроголошеним наступникам Совєцького Союзу, а Лисенко тим часом установив контроль над вигнаною клікою науковців і перетворив дивізію НКВД на знаряддя придушення й терору.\n\nВід часу прибуття до Маґнітоґорска Бунков узяв участь у численних звірствах під наглядом Лисенка, довіряючи його судженню. Та що жорстокішими й божевільнішими ставали Лисенкові експерименти, то скептичніше й вороже Бунков ставився до маґнітоґорської наукової еліти, аж поки не почав вважати Лисенка перешкодою відновленню совєцького ладу. Бунков виступив проти колишнього господаря, повалив його й посів його місце. За недовгого правління він поклав край багатьом кошмарам лисенківщини й спробував відбудувати старі совєцькі установи, припинивши анархію, що панувала за Лисенка. Але з огляду на те, як міцно він тримає країну в руках цілком можна припустити, що для приборкання невдоволеного населення його режим удаватиметься до не менш жорстоких заходів."

