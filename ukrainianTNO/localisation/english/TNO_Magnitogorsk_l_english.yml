 MGN_attrition_preparations_3: "Підготовка до виснаження"
 MGN_carrot_and_stick: "Батіг і пряник"
 MGN_carrot_and_stick_desc: "Ми уважно спостерігали за бригадою Дірлеванґера протягом усієї співпраці. Тепер ми добре знаємо їхню тактику й найкращі способи їй протидіяти."
 MGN_magnitogorsk_collapse: "Обезголовлена Гора"
 MGN_magnitogorsk_collapse_desc: "Падіння режиму Трохима Лисенка спричинило жорстоку боротьбу між науковцями й солдатами, відданими Тєхнократічєской Клікє, та офіцерами 22-ї мотострілецької дивізії, які прагнуть припинити божевільні експерименти й знайти нову мету. Невідомо, чи переживе Маґнітоґорск це випробування."
 MGN_magnitogorsk_partially_collapsed: "Гора оговтується"
 MGN_magnitogorsk_partially_collapsed_desc: "Падіння режиму Трохима Лисенка спричинило жорстоку боротьбу між науковцями й солдатами, відданими Тєхнократічєской Клікє, та офіцерами 22-ї мотострілецької дивізії, які прагнуть припинити божевільні експерименти й знайти нову мету. Невідомо, чи переживе Маґнітоґорск це випробування."
 MGN_nkvd_concessions: "Поступки НКВД"
 MGN_nkvd_concessions_desc: "Товариш Лисенко передав значну частину контролю НКВД, намагаючись запобігти повномасштабному перевороту. Однак НКВД, схоже, задоволений становищем, за якого його члени мають порівняно комфортне життя й більше не зобов'язані викрадати селян ночами для божевільних експериментів Лисенка."
 MGN_internal_disagreements: "Внутрішні розбіжності"
 MGN_internal_disagreements_desc: "Хоча відкриті бої припинилися, непримиренні розбіжності між Тєхнократічєской Клікой і НКВД зберігаються та впливають на стабільність нового режиму."
 MGN_purged_intelligentsia: "Зачищена інтеліґенція"
 MGN_purged_intelligentsia_desc: "Між науковцями Тєхнократічєской Клікі та НКВД не могло бути миру. Науковців, які допомагали Лисенкові, винищено, щоб вони ніколи більше не завдали світові шкоди."
 MGN_purged_opposition: "Зачищена опозиція"
 MGN_purged_opposition_desc: "НКВД розпочав чистку всіх опозиційних елементів, що лишилися в Маґнітоґорску й околицях. Кожного науковця, адміністратора й солдата буде страчено або кинуто до ями, щоб вони ніколи більше не загрожували стабільності режиму. Нашій державі знадобиться певний час, щоб оговтатися від цих заходів."
