  BOL_Alfredo_Mollinedo: "Альфредо Мольїнедо"
  BOL_Alfredo_Mollinedo_hog_desc: "§YВіцепрезидент\nОлігархія§!\n--------------\n§LПро сірий костюм, що обіймає посаду віцепрезидента Болівії, відомо небагато, окрім того, що це був вдалий вибір для цієї посади. Спочатку віцепрезидент правління Ла-Паса у 1933 році, Альфредо Мольїнедо став першим міністром охорони здоров'я Болівії у 1938 році за Бутча. Однак саме його пізніший внесок у болівійський футбол приніс йому відомість, адже очолювана ним AFLP стала рушійною силою професіоналізації. У цей період він опинився втягнутим у боротьбу з Альфредо Ґаліндо, керівником конкуруючої FBF, але з цього конфлікту Мольїнедо вийшов переможцем.\n\nБудучи партійцем PURS, він швидко опинився серед можливих кандидатів на посаду віцепрезидента при Террасасі через виборчий пакт між PURS і ЛП, і зрештою його обрали через його впізнаваність серед болівійців, яка, як очікували політики ІДАЛ, могла забезпечити новому олігархічному уряду таку необхідну підтримку населення.§!"
  BOL_Mamerto_Urriolagoitia: "Мамерто Урріолаґойтія"
  BOL_Mamerto_Urriolagoitia_for_desc: "§YМіністр закордонних справ\nОлігархія§!\n--------------\n§LЗлий, огидний, старий — ось слова, якими можна описати Мамерто Урріолаґойтію та його нинішнє становище. Народившись у заможній родині, він вивчав право, а з типовою для латиноамериканської аристократії франкофілією переїхав до Галльської країни, щоб вивчати міжнародне право. На нього чекало блискуче майбутнє, а обрання віцепрезидентом Герцоґа наблизило його до коридорів влади. Однак він вчинив гріх, спробувавши узурпувати владу свого президента, і ще тяжчий гріх — проваливши цю спробу, через що став білою вороною всередині PURS.\n\nВін досі користувався лояльністю деяких прихильників жорсткої лінії всередині партії, але після того, як його шанси на президентство були поховані, єдиною посадою, яку його прихильники могли для нього забезпечити, стало міністерство закордонних справ — сфера, в якій він мав певний досвід, оскільки раніше був делегатом у Лондоні. Але Урріолаґойтія сприйняв своє призначення як заслання і не любить дипломатію, заздрячи тому, що саме він не керує репресіями, адже вважає, що впорався б із цим краще.§!"
  BOL_Antenor_Patino: "Антенор Патіньйо"
  BOL_Antenor_Patino_eco_desc: "§YМіністр економічних справ і державних фінансів\nОлігархія§!\n--------------\n§LВізьміть марксиста, ліберала та фашиста — і всі вони скажуть вам одне й те саме: сам факт перебування Антенора Патіньйо в уряді, а найгірше — на посаді міністра фінансів, є найбільшою образою для експлуатованого болівійського робітничого класу.\n\nОдин із найбагатших людей Америки, Патіньйо має честь бути спадкоємцем свого батька Сімона, «короля олова». Це звання аж ніяк не є жартом: його родина володіє більшістю олов'яних копалень Болівії та є ключовим гравцем на світовому ринку цього ресурсу, не кажучи вже про те, що Патіньйо пов'язаний із буквальним дворянством через шлюб із Марією Крістіною де Бурбон, герцогинею Дюркальською.\n\nЗалучений до уряду під приводом технократичного призначення, Патіньйо не гаяв часу, демонструючи, що в Болівії означає «технократія». Мало того, що уряд є олігархічним, еліти вирішили, що олігархи повинні безпосередньо володіти урядом. Зрештою, уряд має складатися з людей, яких він представляє.§!"
  BOL_Alberto_Crespo_Carpio: "Альберто Креспо Карпіо"
  BOL_Alberto_Crespo_Carpio_sec_desc: "§YМіністр оборони\nДеспотизм§!\n--------------\n§LКомандувач Військового коледжу з 1950 по 1951 рік, генерал Альберто Креспо Карпіо вже, безумовно, виконав свій обов'язок перед країною. Його призначення міністром національної оборони пояснюється вже доведеною лояльністю до своєї країни та олігархів, адже якщо й існує проблема в болівійських збройних силах після років революцій і контрреволюцій, то це питання, яким генералам можна довіряти.\n\nЗа його рекомендацією Овандо Кандія був призначений начальником армії через свою гадану поміркованість, але Креспо Карпіо вже встиг пошкодувати про свій вибір, коли генерал у приватній розмові заявив йому про необхідність реформ у Болівії та про те, що олігархи не збираються їх проводити. Однак він мовчить щодо цього питання, оскільки вважає себе надто старим, щоб вступати в боротьбу проти начальника армії, і на цьому етапі просто хоче, щоб його термін завершився, аби він міг насолодитися виходом на пенсію.§!"
  
