  # Mining Wars GUI

  BOL_mining_war_category_desc_BRA: "Ситуація в Болівії стала критичною. Наш союзник, §Kуряд генерала Кандії§!, перебуває під загрозою з боку суміші ворогів: озброєних шахтарських синдикатів, §Jфалангістських§! вигнанців та §Dнаціоналістських§! залишків."
  BOL_mining_war_help_text_BRA: "Хоча переворот §Kгенерала Кандії§! став несподіваним поворотом подій на нашу користь у Болівії, так звані «шахтарські війни», що спалахнули у відповідь, загрожують звести нанівець наші здобутки.\n\nРізноманітні сили — від §Jфалангістських§! вигнанців до §Dнаціоналістських§! залишків — погрожують повалити уряд і встановити новий. Поки час для здійснення їхнього плану наближається, ми мусимо забезпечити лояльність §Yбільшости§! з п'яти §Yключових груп§! країни.\n\nНаведена нижче трикутна діаграма показує лояльність кожної з §Yключових груп§!: §Yполіції§!, §Yробітників§!, §Yвійськових§!, §Yселян§! та §Yеліт§!. Групи в зеленому регіоні §KУряду§! лояльні до нас, а групи, найближчі до цього регіону, можна переконати найпростіше."
  BOL_mining_war_group_tooltip: "§Y[BOL_mining_war_selected_group_name]§!\n\n§Y[BOL_mining_war_selected_group_name]§! наразі лояльні до [BOL_mining_war_winning_faction_name].\n\n[?BOL.BOL_influences_BRA^i|1]% §KУряд§!\n[?BOL.BOL_influences_ARG^i|1]% §DНаціоналісти§!\n[?BOL.BOL_influences_CHL^i|1]% §JФалангісти§!"
  BOL_mining_war_group_tooltip_delay: "Натисніть, щоб переглянути дії для §Y[BOL_mining_war_selected_group_name]§!"
  
