  BOL_Armando_Alba_Zambrana: "Армандо Альба Самбрана"
  POLITICS_ARMANDO_ALBA_ZAMBRANA: "Мабуть, одна з найгірших трагедій сучасної Болівії полягає в тому, що доброзичливого чоловіка, який так сильно її любить, так сильно зневажають. Можна стверджувати, що це доля, яку він накликав на себе сам, але від цього ця історія не стає менш сумною.\n\nДо того як стати президентом, Армандо Альба Самбрана був улюбленою постаттю серед болівійців завдяки тому, як він служив своїй державі. На відміну від своїх братів, які загинули в Чакській війні, він служив не військовим, а культурним шляхом. Від військового кореспондента до письменника та реставратора музею Каса-де-ла-Монеда — Альба вирізнявся своєю харизмою, завдяки якій його знали як «Володаря слова», а також як одного з найвидатніших болівійських націоналістів, що коли-небудь жили. Слава була його долею, і він її отримав. Йому вдалося стати спочатку мером, потім депутатом і зрештою сенатором від Потосі — все як незалежному кандидатові, без підтримки будь-кого, окрім самого себе. І, можливо, успіх ударив йому в голову.\n\nУ 1958 році олігархам був потрібен хтось, хто став би президентом, хтось, кого могли б прийняти їхні покровителі з країн ABC. Вони знали, що народ не змириться з черговим олігархом, тому звернулися до Альби з пропозицією стати кандидатом. Він погодився, вважаючи, що йому дадуть необхідну свободу дій для повернення Болівії величі. Він помилявся. Останні чотири роки Альба перетворився на маріонетку інтересів, які він ненавидить, безпорадно спостерігаючи, як вони продовжують продавати його улюблену країну іноземцям. Народ ненавидить його, відчуваючи себе обдуреним тим, що чоловік, якого вони вважали героєм, їх зрадив. Альба також зневажає себе і тепер лише чекає дня, коли перестане бути президентом і цей біль нарешті скінчиться."
  
  BOL_Collapsed_Authority: "Занепала влада"
  POLITICS_COLLAPSED_AUTHORITY: "Коли Болівія оголосила війну державі Санта-Крус, люди очікували швидкої перемоги над сепаратистами. Зрештою, за умов безладу в Асунсьйоні сепаратистська армія не змогла б протистояти болівійському наступу без парагвайської підтримки.\n\nНатомість болівійська армія здалася всього за дванадцять днів.\n\nЗламана й принижена, Болівія повернулася до свого улюбленого заняття: розвалу уряду. Недавня поразка від Санта-Крус вкотре показала, що Болівія просто нездатна проєктувати свою силу за межі Анд і що Чако тепер втрачено назавжди. Олігархи технічно повинні обрати наступного президента, але незручність ситуації змусила їх вагатися. Зі зганьбленою армією та розділеними олігархами Болівія в осяжному майбутньому залишатиметься клаптиковою мозаїкою фракцій та інтересів, де ніхто не здатен утвердити свою владу над іншими.\n\nЗрештою, незмінним залишається одне — останні слова генерала Ланси перед відставкою: §Y«Мені соромно бути болівійським генералом!»§!"
  
  BOL_David_Terrazas: "Давід Террасас"
  POLITICS_DAVID_TERRAZAS: "Походячи з родини, яка поколіннями служила Ліберальній партії, Давід цілком природно став одним із її провідних діячів. Давід Террасас вступив до армії у 15 років і взяв участь у Першій Чакській війні, де завдяки своїй хоробрості здобув чимало відзнак, зокрема був підвищений до капітана просто посеред бою у 1935 році. Після певного часу на чолі Військового коледжу Ла-Паса Террасас став начальником болівійської армії у 1946 році, перш ніж його відправили військовим аташе до Сполучених Штатів. Там він служив разом з американцями під час Сибірської війни, за що отримав Легіон заслуг.\n\nНа жаль, родинні зв'язки Террасаса з олігархами не залишилися непоміченими. Його брат Рубен став однією з жертв людей Вільярроеля під час страт у Чуспіпаті — події, яка зруйнувала його особисте життя. Відтоді він став противником режиму вільярроелістів, а після вигнання почав планувати різноманітні перевороти в Болівії, через що став мішенню численних замахів.\n\nПісля відновлення влади олігархів у Болівії саме Террасас був обраний очолити її, оскільки користувався повною підтримкою та довірою апарату ІДАЛ як один із їхніх генералів. Від самого вступу на посаду він виконує завдання повернення Болівії назад у минуле з прусською дисципліною та безжальністю. Зрештою, він на власні очі бачив, що роблять люди, коли їх відпускають на волю, коли їх більше не контролюють ті, хто стоїть над ними. Його не турбує, що народ його ненавидить — він бачив, що змушує їх радіти. І тому, поки чоло кидають у нього образи та каміння, він лише промовляє подумки таку молитву:\n\n§OЦе все для тебе, дорогий брате.§!"
  oligarch_shield_terrazas: "Щит олігархів"
  
  POLITICS_ALFREDO_OVANDO_CANDIA: "Кожен солдат знає, що мусить служити своїй країні — урок, якого політичний клас відмовляється засвоїти. Починаючи з Першої Чакської війни у 1932 році, Ла-Пас знову і знову кидав свої непідготовлені сили проти Асунсьйона. Історії про болівійську військову некомпетентність добре відомі: призов тубільців, які навіть не знали, що таке Парагвай, використання дітей-солдатів через нестачу живої сили та багато іншого. Серед цих дітей-солдатів був і тоді 15-річний Овандо Кандія.\n\nМожна було б подумати, що досвід відправлення на війну в такому юному віці породить чимало цілком заслужених образ, але Овандо Кандія ніколи їх не відчував. Як патріот, він пишався тим, що служить своїй країні, і вирішив присвятити решту життя військовій справі. Далекий від радикалізації в бік будь-якої ультраправої чи ультралівої ідеології, Овандо Кандія залишався поміркованим, хоча й був дещо германофілом, ніколи повністю не приймаючи ні РНР Вільярроеля, ні правління олігархів.\n\nОднак у кожної людини є межа, і ситуація в Болівії деградувала настільки, що змусила його діяти. План Овандо Кандії щодо повернення стабільності його землі полягає у відродженні полум'я військового соціялізму, але його планам заважають дві великі проблеми. Перша — опір будь-яким реформам з боку консервативного крила військових, друга — те, що помірковані реформи, які обіцяє військовий соціялізм, для мас, що гнівно захоплюють копальні та готують революції, є просто надто малими й надто запізнілими."
  the_half_stepter_ovando: "Той, хто робить півкроку"
  POLITICS_OSCAR_UNZAGA: "Від Антофагасти до Чако Національна революція якимось чином позбулася всіх фальсифікаторів. Оскар Унсаґа де ла Веґа переміг усупереч усім обставинам і пройшов довгий шлях від скромного початку як студентського активіста в Чилі, перетворившись із бика на забій на призового бійця цієї держави, яку незабаром буде перебудовано.\n\nРозпочавши свою кар'єру у 1937 році із заснування БСФ з таємного товариства, що складалося лише з чотирьох його найближчих соратників, ранні починання Унсаґи не були безхмарними. Зіткнувшись із роками придушення фалангістського руху з боку РНР за допомогою масового терору, який одного разу навіть сягнув інтернування, він ніколи не відмовлявся від свого прагнення поширювати власний різновид християнської демократії, навіть серед нескінченної зміни урядів, кожен з яких прагнув знищити спасіння болівійської крові. У менш проникливій людині його вважали б фанатиком.\n\nКоли критики називали нерозбавлені фашистські ідеї приреченими в Андах, Унсаґа знав, що фаланґізм народжується з моральних страждань переможеної батьківщини. Тож перед лицем зміцнілих Бразилії та Сантьяґо, попри всі спроби проникнення, такі як заколотники в армії та непатріотичні управлінці уряду, лише Істинна Віра нарешті стоїть непохитно. Зайве казати, що тепер, коли зрадника Ріоху нарешті усунуто, а Болівію належним чином очищено від іноземного впливу, вона більше не буде рабом псів у посольствах і маєтках на схилах. Хай живе Болівія, адже її блудні сини не покинули її."
  el_chapu_ungaza: "Ель Чапу"
  POLITICS_BERNARDINO_BILBAO_RIOJA: "У міру того як болівійська порохова бочка рухається своїм визначеним курсом, генерал Бернардіно Більбао Ріоха уособлює небажаний центр між полярними напрямками Фаланги — подобу впорядкованого правління, яке приречене викликати ненависть радикалів. Походячи із заможної родини в селі Арампампа, він здобув військову освіту в Чилі та став одним із перших авіаторів, здобувши популярність під час Чакської війни. Під час свого короткого перебування на посаді тимчасового військового міністра у 1930 році він став болівійським національним героєм, очоливши легендарну оборону Вільямонтеса.\n\nПевний час його шанували та підвищили до начальника армії, проте болівійський уряд вирішив натомість віддячити за його геніальність, викравши його до Чилі. Після певного часу у вигнанні Ріоха дійшов висновку, що істеблішмент є тягарем для нації, яку він так палко любив. Присягнувши помститися за таку зраду, він почав співпрацювати з урядом Чилі задля повалення того, що вважав потворністю — водночас він також приєднався до БСФ Унсаґи, очікуючи побачити сильну та патріотичну дисидентську групу.\n\nВін ніколи не думав, що знову досягне колишньої слави, але численні випадки некомпетентності, як-от несвоєчасне усунення Ґільєрмо Кеннінґа, дозволили йому знову очолити крихкий режим під проводом БСФ. Поки Стара ґвардія бурчить між собою, Ріоха візьме ініціативу та поведе Болівію правильним шляхом, звісно, за допомогою своїх чилійських друзів."
  the_hero_of_villamontes_bilbao: "Герой Вільямонтеса"
  POLITICS_JUAN_JOSE_TORRES: "Соціяліст, революціонер, військовик, представник середнього класу. Хуан Хосе Торрес прикрасив себе ярликами та групами, щоб приховати непомірні амбіції, які поглинули його ідеологію, — усе в гонитві за владою.\n\nОднією з небагатьох щирих рис, що проявилися в ранньому віці після смерті його батька в Першій Чакській війні, була любов до матері та повага до її самовідданості у турботі про сім'ю. Та зрештою він усе одно пішов стопами батька, вступивши до війська й навіть вирушивши до Аргентини для навчання в артилерійській школі.\n\nАтмосфера Аргентини вплинула на нього настільки, що він став членом РНР, захоплений риторичною силою таких людей, як Перон і Вільярроель. Коли режим Овандо прийшов до влади, Торрес став їхньою людиною всередині системи завдяки новій посаді міністра фінансів, обережно страхуючись на випадок як реформ, так і революції. Коли перемогла остання, Народна асамблея проголосила його президентом, вважаючи, що він стане маріонеткою Лечіна.\n\nЦього Торресу було і не буде достатньо, адже він використав даровані йому повноваження, щоб якомога сильніше розширити власну підтримку. Інтерв'ю з правими, кивки селянству та рукостискання з лівими — усе це його щоденна робота, поки усміхнений генерал постає голодним левом, готовим поглинути РНР цілком."
  jj_torres: "Х. Х."
  POLITICS_JUAN_LECHIN_OQUENDO: "Легенда болівійської робітничої політики, мало хто може претендувати на такий самий внесок у поширення лівих ідей у країні, як Хуан Лечін Окендо. Народившись 19 травня 1902 року в метисської матері та ліванського батька в шахтарському містечку Корокоро, він мав гетерохромію — дивну й практично марну особливість, на яку його мати любила вказувати сусідам.\n\nВиростаючи в умовах нижчого класу та пізнаючи його переваги й вади, Лечін ніколи не був людиною, яка надовго залишалася бездіяльною. У молодості він працював ким завгодно — від боксера до торговця. Зрештою, однак, він знайшов своє покликання в профспілковому русі.\n\nЗалучений до політики троцькізмом, Лечін швидко повернувся до РНР, ставши лідером її лівого крила. Попри схильність до політичної доцільності, його справжнім інтересом залишається допомога простим робітникам. Особливо популярний серед шахтарів — спільноти, в якій він виріс, — він був одностайно проголошений лідером першого конгресу Синдикалістської федерації болівійських гірників.\n\nЗрештою, однак, репутація Лечіна випередила його, коли він став лідером Болівійського робітничого центру — посади, яка йому настільки сподобалася, що він відмовився стати главою держави після революції. Натомість він вирішив правити через маріонеткового президента Народної асамблеї — що виявилося невдалим вибором, адже тепер його змушують опинитися в центрі уваги. Схоже, якщо він коли-небудь захоче справжньої пенсії, йому доведеться якось її заслужити."
  the_paramount_leader_of_the_COB_lechin: "Верховний лідер БРЦ"
  POLITICS_WALTER_GUEVARA: "Один із засновників РНР, Вальтер Ґевара швидко піднявся до одного з головних ідеологів партії в міру її зростання та розквіту. Будучи амбітним прихильником вільноринкового капіталізму ще відтоді, як став впливовим діячем, Ґевара вважає контрреволюцію майже безперервною, яку може стримати лише система рівних можливостей. Однак ця позиція закріпила за ним роль правого прапороносця всередині партії, що дедалі більше віддаляло його від керівництва, поки центр Вільярроеля міцно тримався як фактичний культ особи, а такі впливові діячі, як Пас Естенссоро та Лечін, прагнули зберегти свої владні позиції.\n\nОднак тепер, коли Лівиця дедалі більше відштовхує від себе населення, а його опоненти один за одним нейтралізовані, для нього лише питання часу, коли він покладе край примхливості та ірраціональності, породженим Народною асамблеєю, і поверне нормальність шляхом масштабної приватизації — процедури надзвичайно делікатної, але необхідної для виправлення хаосу, що заражає ринковий процес."
  the_authentic_ideologue_guevara: "Справжній ідеолог"
  POLITICS_ROGELIO_MIRANDA_BALDIVIA: "Завдяки своїй волі він зміг розірвати кайдани бідності, але тепер вірний Рохеліо Міранда опинився на посаді, що виходить за межі звичайного успіху — він правитель розколотої нації, яку він має відновити власною волею.\n\nСамостійно пробившись у житті лідер із Ла-Паса мав щасливе, хоч і бідне, дитинство. Змалку виховуючись у праведних традиціях, у підліткові роки в католицькій школі Ла-Саль він набув непохитної чесноти побожності. Пізніше, продовжуючи кар'єру у Військовому коледжі, він стрімко поповнював свою колекцію відзнак завдяки поєднанню етики та інтелекту.\n\nКоли Овандо Кандія все ще одноосібно правив жорсткими методами, Міранда разом із багатьма іншими військовими радив диктаторові відвести Болівію від соціялізму — не залишаючи дрібному селянству нічого, окрім дарованої Богом долі працювати й тяжко трудитися. Але слабкодухий генерал не послухав і пішов шляхом «реформізму», що зрештою прирекло на порядність уряду та його власне життя.\n\nВлучно перебравши владу після того, як «прагматик» зазнав руйнування власними руками, Міранда подбає, щоб болівійське селянство — ті, хто народжені бути покірними, — знало своє місце під Божим оком: місце, де вони працюють до знемоги заради загального блага, не маючи перешкод у вигляді власних духовних вад."
  the_conservative_miranda: "Консерватор"
  POLITICS_ENRIQUE_HERTZOG: "Хірург за фахом і президент за обов'язком, Енріке Герцоґ народився в Ла-Пасі в середовищі класичної поміркованої політики. Розпочавши свою кар'єру у 1932 році під час Першої Чакської війни, зашиваючи рани солдатам і служачи до 1936 року, він уперше був обраний президентом у 1948 році від PURS. Адміністрація бездіяльності, як її називали багато сучасних болівійців, залишається непопулярною серед широкої громадськості через нехтування агресивними реформами в той час, коли країна найбільше їх потребувала.\n\nПопри те, як мало йому вдалося зробити, здатність Герцоґа лавірувати серед бюрократичного безладу все ж вражала. Зумівши придушити спробу свого віцепрезидента узурпувати владу, коли перебував на дні своєї популярності, він став сприятливим кандидатом для ОВН після завершення свого мандата. Після завершення президентства Герцоґ рішуче виступив проти рішення свого наступника розпочати Четверту Чакську війну — але після того, як олігархи не прислухалися до його попередження, його репутація також дещо відновилася після катастрофічного результату.\n\nТепер, повернувшись як один із небагатьох, здатних утримувати крихкий баланс сил у Болівії, він повертається в незручному союзі з ЛП як мудрий, але виснажений символ влади. Щоб його улюблений статус-кво продовжив існувати, старий Герцоґ мусить навчитися приймати те, чого він ніколи не уявляв, — зміни."
  oligarch_doctor_hertzog: "Олігарх-лікар"
  POLITICS_RENE_BARRIENTOS: "Неможливо вижити в автократичній системі, не засвоївши її уроків — за часів послідовних диктатур, через які пройшла Болівія, генерал Рене Барр'єнтос жив, але ледь-ледь. Тепер, пробиваючись назад на вершину, він нарешті може втілити в життя країну, створену достойними й для народу.\n\nНа відміну від більшості своїх колег, Барр'єнтос ніколи не користувався перевагами непотизму. Осиротівши в юному віці, він звернувся до зброї, коли отримав можливість здобути освіту. Після закінчення військової академії у 1943 році він став пілотом і проходив підготовку в Америці, продемонструвавши свої здібності у збройних силах. Але насправді саме його пізніша участь у Національній революції закріпила його становище. Попри те, що він не поділяв поглядів людей Вільярроеля, його врятувало сприйняття як «поміркованого» — це принесло йому небагато друзів, але ще менше ворогів.\n\nТепер, коли Барр'єнтос та його вирощені союзники контролюють усі апарати влади, він запровадив «Програму відновлення», щоб послабити напруження між олігархами та військовими, водночас зберігаючи націоналістичні ідеали РНР. Його стратегія терору сувора: робітничі рухи та агітатори стикаються з швидким кінцем. Та він залишається другом простого селянства, пропонуючи патерналістський обмін послугами — кожен чоловік є клієнтом, задоволеним поверненням миру. На його думку, доки всі працюють разом, він може продовжувати грати роль «Народного генерала», якщо це утримує Болівію на плаву."
  the_people_general_barrientos: "Народний генерал"
  POLITICS_VICTOR_PAZ_ESTENSSORO: "Історія ліберальної демократії в Болівії балансує на межі трагедії та комедії, незліченну кількість разів спотворена олігархами та сильними правителями. Віктор Пас Естенссоро обіцяє написати нову історію.\n\nЙого власна історія почалася в розкоші, у родині землевласників, у яких було все, а служили їм люди, які не мали нічого. Після того як Пас придушив черговий випадок зловживань з боку власника копальні Патіньйо, він вирішив, що з нього досить, і перейшов на інший бік, щоб боротися за простого робітника. Схилившись до лівих поглядів, він розпочав політичну кар'єру в РНР як молодіжний лідер.\n\nКлючова постать партії, він став міністром фінансів під час першого уряду Вільярроеля, перш ніж відійти від переднього краю після його падіння. У тіні Пас працював над партією, піднімаючись як лідер руху всередині руху, сформованого відповідно до його поглядів. Але там, де колись на його книжковій полиці стояли Бухарін і Троцький, тепер їх замінили Сміт і Пейн.\n\nПопри все, тепер Пас очолює партію, і її лівим силам доведеться змиритися з його ліберальними поглядами. Звісно, навіть йому часом важко йти цим шляхом, адже його опозиція перебуває не по той бік проходу, а в концентраційних таборах. Болівія завжди повільно вчиться, і демократія не поспішає, видаючись по частинах, наче пайок голодному селянству."
  don_victor_paz: "Дон Віктор"
  POLITICS_GUALBERTO_VILLARROEL: "Зліт і падіння Ґуальберто Вільярроеля нерозривно пов'язані зі значенням давно знайомих настроїв мілітаризму та націоналізму в Болівії. Тому цілком доречно, що їхній первісний зачинатель повертається до влади саме тоді, коли ці два почуття досягають апогею.\n\nВід скромного походження до героїзму в Чакській війні — за правління Торо та Буша він навчився принципів військового соціялізму, обурившись, коли заможні інтереси Болівії придушили цю справу. Після цього Вільярроель відійшов у тінь разом із РАДЕПА, ультраправим товариством, присвяченим знищенню олігархії.\n\nНа хвилі РНР та військових він був стрімко піднесений до влади у 1943 році, швидко здобувши любов селянства — як корінного, так і іншого — завдяки популістській вправності. Але цього було недостатньо, адже його режим зазнав краху після ідеологічного туману. Потрібен був новий образ — щось більше, ніж «болівійський Перон», — щось, що Вільярроель пережив на власному досвіді...\n\nІ ось військовий соціялізм було відроджено, а Вільярроель став його третім керівником. Болівію вже навернув її новий пророк, а решта Латинської Америки дозріла для навернення, навіть якщо питання Санта-Крус усе ще висить над країною. Однак він знає, що єдиний спосіб залишити Болівію — у дерев'яній труні, і що тепер його народ помре за нього, перш ніж це станеться."
  the_friend_of_the_poor_villarroel: "Друг бідних"

  generalissimo_banzer: "Генералісимус"
  el_senor_del_habla_zambrana: "Ель Сеньйор дель Абла"
  fallen_hero_zambrana: "Полеглий герой"

  # Ideas
  BOL_Chilean_Contracts: "Чилійські контракти"
  BOL_Mining_War: "Гірничі війни"
  BOL_Mining_War_desc: "Олігархію повісили на мотузці, яку вона сама продала, з пошматованим договором, пришпиленим до її грудей, поки військовик стоїть біля шибениці, дивлячись на натовп, який досі жадає крові.\n\nСпалах повстання шахтарів, які проміняли кирки на рушниці, схоже, став стартовим пострілом для підйому революції, а всі сторони роблять ставки на те, як випадуть карти. Через необхідність або схиляючись перед мілікос, Бразилія підтримує диктатуру Овандо бомбами та кулями, зрівнюючи опір із пустелею, яку називають миром.\n\nНа іншому боці аргентинці кинули всі сили на підтримку РНР — очолюваної колишнім невдалим диктатором Ґуальберто Вільярроелем — проповідуючи суміш мілітаризму, націоналізму та популізму, яка привернула небажаний лівий елемент. За ці впливи конкурує Чилі, підтримуючи БСФ — фалангістські ополчення та правих ветеранів програних війн — підпалюючи останній ґніт для безконтрольної кривавої бійні."
  BOL_patchwork_country: "Клаптикова країна"
  BOL_patchwork_country_desc: "У Болівії є індіанці, є метиси, є креоли, але немає болівійців. Нездатність належним чином централізувати державу також призвела до нездатності об'єднати різні етнічні групи під одним прапором. Прихід сепаратистів до влади в Санта-Крус лише підкинув дров у вогонь, адже пропаганда та болівійська відплата запалили весь Орієнте розмовами про відокремлення. Що ще гірше, заворушення також поширилися серед тубільців, оскільки зростаючий індіаністський рух продовжує здобувати прихильників, які мріють про Пачакуті.\n\nЩоб змінити це, змусити людей хотіти відчувати себе болівійцями та пишатися цим, Ла-Пас розмахує прапором реваншизму, заявляючи, що Санта-Крус буде повернуто, що весь Чако буде повернуто. П'ять Чакських війн прийшли й пішли, не повернувши нам жодного з них, але що таке ще одна струна до лука, чи не так?"
  BOL_killing_hope: "Вбиваючи надію"
  BOL_killing_hope_desc: "У 30-х роках селяни думали, що військовий соціялізм їх врятує, але потім Санта-Крус упав, а куля прошила мозок Буша. Олігархи повернулися. У 40-х Вільярроель оголосив народу, що врятує його, але був повалений, перш ніж зміг оголосити, у чому полягав його проєкт. І олігархи повернулися. Так само повернувся й Вільярроель, цього разу як військовий соціяліст, гордий спадкоємець Торо та Буша, але його усунули після військових поразок. Невдовзі Ла-Пас знову опинився під владою олігархів.\n\nЩо це залишає народу? Становище гірше, ніж раніше: безнадію, бо вони знають, що олігархів неможливо торкнутися, що Олов'яні барони — боги, що Патіньйо, Гохшильди та Арамайо ніколи не постануть перед правосуддям.\n\n§VВони знають, що якщо хочеш побачити картину майбутнього, то маєш уявити чобіт, що вічно топче людське обличчя.§!"
  BOL_jose_lanzas_lament: "Скорбота Хосе Ланси"
  BOL_jose_lanzas_lament_desc: "У вогні Першої Чакської війни генерал Хосе Ланса, спостерігаючи, як болівійська армія більше переймається змовами та особистими інтересами, ніж перемогою над ворогом, сказав такі безсмертні слова:\n\n§Y«Мені соромно бути болівійським генералом!»§!\n\nЯкби тільки він був живий, щоб побачити, як усе тепер! Який же він, мабуть, вдячний, що був позбавлений видовища армії, повністю зламаної роками революцій і контрреволюцій. Насправді стан збройних сил Болівії настільки катастрофічний, що виправити його може лише Іноземна військова місія. Але тоді постає питання.\n\n§OЯка іноземна держава буде найнята для цього?§!"
  BOL_tripartite_pact: "Тристоронній пакт"
  BOL_tripartite_pact_desc: "Тристоронній пакт — це назва серії договорів, підписаних під час тимчасового президентства Карлоса Креспо, які забезпечили нейтралітет Болівії в Південноамериканській холодній війні. У чому підступ? Країну більш-менш порівну поділили для експлуатації між Аргентиною, Бразилією та Чилі.\n\nОскільки підтримка країн ABC є єдиним, що забезпечує правління олігархів, вони цілком задоволені таким станом речей — прекрасною симфонією, в якій ріки грошей течуть до Ла-Паса, а всі витрати оплачуються спинами робітничого класу. Прекрасно, чи не так?"
  BOL_One_Country_Two_Systems: "Одна країна, дві системи"
  BOL_Triumph_Of_The_Orient: "Тріумф Орієнте"
  BOL_The_Shadow_War: "Тіньова війна"
  BOL_The_Shadow_War_desc: "Теорії змови навколо масонів та їхніх лож були постійним явищем у західному світі відтоді, як вони вперше набули популярності. Часто такі змови загортають в обгортку антисемітизму — найпомітніше, звісно, у Німецькому Райху, де засудження Гітлером масонів як єврейської маріонеткової організації безпосередньо призвело до організованого державою масового вбивства її членів. Чутки про «масонські змови» стали страшилкою для лідерів з усього політичного спектра, яким потрібен зручний цап-відбувайло за біди їхньої нації, незалежно від правдивості чи наслідків.\n\nЦе якась жорстока іронія, що єдина частина світу, де це змовницьке мислення має під собою правду, — це місце, де дві його ложі вже давно відкололися від масонства як такого.\n\n«Caballeros del Oriente» та «Toborochi», колись одна й та сама організація, доки Toborochi не відкололася від Caballeros, ведуть жорстоку тіньову війну, яка поглинає політику Крусенії. Усі керівники є членами. Усі багатії є членами. Усі генерали є членами. Усі впливові люди є членами. Якщо ти хочеш кудись пробитися в суспільстві Санта-Крус, ти присягнешся своїй ложі або залишишся прикутим до того самого місця, звідки почав."
  BOL_Operation_Condor: "Операція «Кондор»"
  BOL_The_Oriental_Dream: "Орієнтальна мрія"
  BOL_A_New_Bolivian_Nationalism_STC: "Новий болівійський націоналізм?"
  BOL_A_New_Bolivian_Nationalism_STC_desc: "Ла-Пас нарешті зробив це: сепаратистів в Орієнте розгромлено, а мерзенні амбіції Парагваю перетворено на попіл. Реінтеграція крусенських сепаратистів буде нелегким завданням, але це тріумф, яким можуть пишатися всі болівійці, незалежно від їхнього кольору шкіри чи походження. §yПісля тридцяти років втрат майбутнє Болівії стає світлішим.§!"
  BOL_A_New_Bolivian_Nationalism_Chaco: "Новий болівійський націоналізм?"
  BOL_A_New_Bolivian_Nationalism_Chaco_desc: "Латинська Америка та весь світ можуть лише дивитися із захопленням, як болівійський народ здійснив неможливе: він не лише повернув свій непокірний Схід, а й відкинув парагвайську армію так далеко, що повернув собі Чако. Расові та класові розбіжності стираються, коли постає новий болівійський націоналізм, і вперше за пам'ятний час народ пишається тим, що він болівійський.\n\n§yВічна слава хоробрим воїнам,\nчия героїчна мужність і стійкість\nздобули слави, якими починає\nсьогодні насолоджуватися щаслива Болівія§!"
  BOL_Decalogue_Of_The_Falangist: "Декалог фалангіста"
  BOL_Decalogue_Of_The_Falangist_desc: "1) Люби свою батьківщину понад будь-який егоїзм.\n2) Повністю й навічно присвяти себе справі руху, яка є справою Болівії.\n3) Поважай релігійні переконання.\n4) Пам'ятай про дисципліну, яка є підпорядкуванням особистості служінню спільноті.\n5) Виконуй свій обов'язок з любові до обов'язку, а не заради винагороди.\n6) Удосконалюй себе щодня, бо трудівники великих справ спочатку будують самих себе.\n7) Зневажай життя, якщо жертвуєш ним заради свого ідеалу.\n8) Не відступай і не будь боягузом.\n9) Будь гідним, вірним і готовим до самопожертви.\n10) Зневажай комфортне життя. Фалангіст понад усе є бійцем. Борись — і переможеш!\n\n-Програма принципів БСФ"
  BOL_The_Infernos_Beating_Heart: "Пульсуюче серце пекла"
  BOL_The_Infernos_Beating_Heart_desc: "Пекло на землі. Мінімум їжі, убогі бараки, спеціально облаштовані катівні та стіни, поцятковані слідами від куль. Це концентраційні табори Революційного націоналістичного руху Болівії.\n\nТаємна поліція режиму РНР, Контроль політичний, постійно поповнює потік нової крові. Будь-яка загроза, будь-яка опозиція до РНР закидається в кузов вантажівки й везеться, задихаючись від вихлопних газів, до нового дому. У рівному ритмі вздовж периметра з'являється нова партія могил, а нова група фалангістів, комуністів, журналістів, інтелектуалів та негідників займає вільні нари.\n\nІ в міру того як революція зростає, зростає й Контроль політичний, його перелякана здобич та мережа таборів Болівії."
  BOL_The_Caudillo_Of_The_Revolution: "Каудильйо революції"
  BOL_The_Caudillo_Of_The_Revolution_desc: "Вільярроель — це більше, ніж просто військовий сильний правитель; він є серцем і душею болівійського націоналістичного руху. Палкий патріот і дієвий революціонер, він довів, що є не просто черговим відірваним від реальності політиком, завдяки твердій руці та справедливому управлінню, вивівши тисячі людей із бідності та караючи нечестивих. Улюблений як знедоленими, так і звільненими тубільцями, він спирається на широке й нещодавно емансиповане селянство.\n\nЦей славетний образ героя сформував навколо полковника міцний культ особи, проте в міру того, як внутрішній розкол партії зростає за лаштунками, нависле відчуття розпаду продовжує підривати сприйняття Вільярроеля як компетентного керівника, попри його безкінечний арсенал риторики та популістських трюків."
  BOL_A_Silent_Democracy: "Мовчазна демократія"
  BOL_A_Silent_Democracy_desc: "Згаслий дух революції породив дещо з набагато більшим потенціалом і довговічністю — ліберально-демократичний порядок. Утверджуючи традицію верховенства права, запропоновану західними філософами, Пас Естенссоро вперше за багато десятиліть зумів принести Болівії стабільність.\n\nПрацюючи за лаштунками, щоб забезпечити виживання РНР і водночас вести Болівію до самовизначення, Естенссоро зумів заткнути рот більшості опозиційних елементів, щоб закріпити гегемонію партії до того, як народ зможе взяти участь у виборчому процесі. На цих перших кроках болівійської демократії саме РНР має підтримувати крихку національну безпеку молодої держави."
  BOL_A_New_Synthesis: "Новий синтез"
  BOL_A_New_Synthesis_desc: "Ідучи стопами Давіда Торо та Ґермана Буша, заснування РНР було високою метою — возвеличити закон і порядок через ідеологічну основу військового соціялізму. Однак із роками численні внутрішні розколи, що неминуче виникали в умовах широкого партійного намету, здавалося, перетворили її на нефункціональний безлад, не кращий за будь-який інший провалений рух.\n\nЗмушений прийняти зміни за критичних обставин, новий синтез, народжений зі злиття аргентинського юстиціялізму з традиційним болівійським патріотизмом, постав, щоб повернути єдність розколотій РНР. Тепер народ бачить у Вільярроелі людину, яка звела зорі в гармонійне ціле, та в серці полковника залишається питання.\n\nЧи пробачать майбутні покоління зрадника?"
  BOL_The_Popular_Assembly: "Народна асамблея"
  BOL_The_Popular_Assembly_desc: "Народна асамблея — це організація болівійських профспілкових, робітничих та народних рухів, яка прагне створити власний орган влади на заміну буржуазному парламенту. У багатьох аспектах вона подібна до робітничої ради, а права іноземна преса охрестила її «Совєтом».\n\nНародна асамблея, попри те що її таврують як комуністичну, насправді не встановила жодної форми соціялістичного режиму. Попри твердження критиків, капіталізм, хоча й у більш обмеженій формі, все ще існує в Болівії."
  BOL_A_Revolutionary_Dictatorship: "Революційна диктатура"
  BOL_A_Revolutionary_Dictatorship_desc: "Народна асамблея була жартом, і не особливо смішним. Покидьки, які навіть не миються, не повинні бути правителями — не можуть бути правителями. Дозволити їм вільно господарювати в країні було б катастрофою.\n\nНа щастя для Болівії, добрий генерал усунув їх від влади й повернув туди, де їм і належить бути. Роблячи це, він запропонував їм щедру угоду: вони можуть підтримати його новий режим або ж... Зрештою, усі знають, що лише добрі люди зі збройних сил здатні насправді здійснити прогресивну національну революцію, якої Болівія так давно потребувала."
  BOL_The_Soviet_Republic: "Совєцька республіка"
  BOL_The_Soviet_Republic_desc: "Фальшивий реформістський проєкт Лечіна з тріском провалився, перетворившись на попіл, а з його трупа знову палахкотять вогні революції. Новою республікою керує безсмертна наука більшовизму-ленінізму та РПР, на чолі з Ґільєрмо Лорою.\n\nТепер народ Болівії зазнає справжнього визволення за умов справжнього соціялізму. Вони більше не будуть віддані на милість п'явок або дрібної буржуазії зрадницьких профспілок. Болівійська соціялістична совєцька республіка готова захищати свій народ від усіх загроз революції. Нехай усі знають: Болівія червона, нині й навіки."
  BOL_Fiances_Of_Death: "Наречені смерті"
  BOL_Fiances_Of_Death_desc: "Хоча Гірничі війни можуть бути завершені, насильство в Болівії триває. Вражені революційними реформами Національної революції, збори невдоволених землевласників, солдатів та інших реакціонерів розпочали повстання, яке позбавило уряд контролю над значною частиною сільської місцевості. Найвідомішою серед них є група терористів, прозвана «Нареченими смерті». Радикалізовані завдяки контактам із міжнародними фашистськими організаціями та фінансовані відродженою торгівлею наркотиками, вони тероризують сільську місцевість, полюючи на ймовірних прихильників нового режиму.\n\nЗа умов економічних і політичних негараздів революційний уряд мало що може зробити, щоб протистояти цій загрозі, змушуючи багатьох сумніватися в його довгостроковій життєздатності."
  BOL_The_True_National_Revolution: "Справжня національна революція"
  BOL_The_True_National_Revolution_desc: "Хоча РНР давно обіцяла національну революцію для Болівії, саме Хуан Хосе Торрес зміг нарешті її здійснити. Великі частини величезних гірничих багатств країни були націоналізовані, а Народну асамблею створено для проведення масштабних лівих політичних і соціальних реформ. Болівійська нація нарешті буде повернута її законним власникам: народу.\n\nІ все ж не все гаразд. Ці масштабні зміни також вимагали чистки значних частин уряду та військових, що завадило їхній ефективності й посилило дисидентство та еміграцію. Але найгірше те, що сусіди Болівії змовляються придушити революцію в колисці, створюючи економічну блокаду, яка паралізувала економіку країни. Мрії болівійського народу висять на волосині."
  BOL_A_National_Reaction: "Національна реакція?"
  BOL_A_National_Reaction_desc: "З приходом до Ла-Паса нового, значно поміркованішого режиму багато хто побоюється або сподівається на скасування масштабної програми реформ режиму Торреса. Однак обидві сторони залишилися розчарованими. Прагнучи врівноважити своє хитке політичне становище, президент Ґевара скасував і водночас зберіг елементи Національної революції в рівній мірі.\n\nПопри це, з кожним днем сила лівого крила слабшає під тиском воєнізованого насильства з боку «Наречених смерті» та дедалі холодніших відносин із режимом. Як довго триватиме цей баланс, досі залишається відкритим питанням."
  BOL_Bolivia_Open_For_Business: "Болівія відкрита для бізнесу"
  BOL_Bolivia_Open_For_Business_desc: "Поєднання жорсткої протекціоністської політики режиму Торреса та його міжнародної ізоляції ледь не зруйнувало орієнтовану на експорт економіку Болівії. Але тепер, за нового поміркованого націоналістичного уряду Ґевари, справи поволі повертаються до норми. Хоча уряд і досі міцно тримає економіку під контролем, прибуткова гірничодобувна промисловість знову відкрита для експлуатації.\n\nАле рідкісні метали — не єдиний товар, що нині прибуває до Болівії та залишає її. Спадщина анти-торресівського повстання закріпила Болівію в міжнародній торгівлі наркотиками, адже її досі непідкорені внутрішні райони стали торговельним вузлом для маньчжурських опіумних препаратів та нової товарної культури кокаїну."
  BOL_Dual_Yoke: "Подвійне ярмо"
  BOL_Dual_Yoke_desc: "Чи можуть ситуативні союзники взагалі бути союзниками? Це питання лунає в дипломатичних колах Бразилії та Чилі після їхнього спільного усунення від експлуатації Болівії, коли жадібність, замаскована під чесноту, позбавила їхньої частки пирога, а промисловці святкували, поки ті, хто перебував під ними, пітніли заради прибутку в освітлених лампами копальнях. Але жадібність не зупиняється на чітко визначеному відсотку; вона кипить, чекаючи наступної частки, яку можна вкрасти.\n\nУ міру того як тижні перетворюються на місяці, жадібні погляди як Бразилії, так і Чилі, схоже, неодмінно почнуть із тугою дивитися на болівійські володіння одна одної, слинячись від шансу на ефективніший імперіалізм. Найбільш сподівливі з них моляться, щоб цього вдалося уникнути. Сміливці вважають, що це належить виключно одній нації. Болівійцям залишається лише продовжувати впадати у відчай."
  BOL_La_Ruta_Del_Plata: "Ла Рута дель Плата"
  BOL_La_Ruta_Del_Plata_desc: "Коли іспанці панували над Америкою, віце-королівство Ріо-де-ла-Плата було епіцентром для грабіжників та пройдисвітів — вони везли свою здобич через Анди вниз за течією для розподілу та постачання. Нині аргентинці, схоже, прагнуть відродити цю колоніальну спадщину у своїх жалюгідних корисливих інтересах, адже Буенос-Айрес отримує значну частину їхніх незаконно здобутих багатств із неспокійної болівійської держави, не надто переймаючись відплатою."
  BOL_Jaguars_Prey: "Здобич ягуара"
  BOL_Jaguars_Prey_desc: "Замість того щоб переслідувати свою здобич, як гепарди та леви Африки, ягуари, що блукають Південною Америкою, вистежують свою здобич, чекаючи нагоди для засідки. Потім потужний укус у потилицю валить тварину. Після цього їхні ікла розривають плоть і висмоктують ще теплу кров.\n\nПодібно до ягуара, Бразилія вистежувала Болівію, чекаючи економічної вразливості, щоб завдати удару. Її ікла рвуть наші дорогоцінні метали, а вона жадібно поглинає наш природний газ. Це світ тварин, і Болівія опинилася внизу харчового ланцюга."
  BOL_In_The_Condors_Nest: "У гнізді кондора"
  BOL_In_The_Condors_Nest_desc: "Андійський кондор — падальник, а не хижий птах. Його ступні та ноги відносно слабкі, через що він не здатен полювати чи битися з орлами за мисливські угіддя. Натомість він шукає туші великих тварин або поранених дрібніших тварин, щоб годувати своє потомство.\n\nПодібно до кондора, Чилі викрало Болівію із землі та забрало нас до свого гнізда, щоб годувати своїх пташенят. Чилійські гірничодобувні та газові компанії кричать і галасують, вимагаючи свою можливість поживитися здобиччю, яку приніс їхній батько."
  BOL_Military_Peasant_Alliance: "Військово-селянський альянс"
  BOL_Military_Peasant_Alliance_desc: "Якої б шкоди армія не завдала в минулому, тепер настав час виправити ці помилки. Сторонні люди, які висувають неправдиві звинувачення щодо жорстокого поводження із селянством, будуть задоволені, дізнавшись, що пакт нарешті укладено. Відтепер уряд обіцяє припинити всі ворожі дії та фінансувати приватні плантації соціально-економічною допомогою. В обмін від цих фермерів вимагається лише співпраця у припиненні розколу, який руйнував Болівію протягом останніх трьох десятиліть."
  BOL_Paz_Orden_Y_Progreso: "Мир, порядок і прогрес"
  BOL_Paz_Orden_Y_Progreso_desc: "Продуктом духовної бідності є глибоке небажання прагнути загального блага суспільства. На жаль, болівійське селянство заразилося цим різновидом пошесті. Жодних «ліків», як пропонують реформісти, не існує, а безхребетний компроміс не поверне продуктивність цим ледачим жебракам. Щоб Болівія знову стала мирною, їхні наклепи на уряд заслуговують на репресії, а вони повернуться на належне їм місце — тяжко працювати в полях без жодних більше пряників і батогів."
  BOL_Fury_Of_The_Old_Guard: "Лють Старої ґвардії"
  BOL_Fury_Of_The_Old_Guard_desc: "Дезорганізація лав БСФ породила найгірший зі можливих сценаріїв. Коли священний ідеал Фаланги узурпований непривабливим Ріохою, вже ніщо не може зупинити занепад болівійської цивілізації. Але відчай — ідеологія слабких, і люди на кшталт Унсаґи знають краще, ніж добровільно поступатися владою комусь настільки безхребетному та нерозумному. Лише через найжорстокішу політичну боротьбу справжні сини Болівії повернуть собі дароване Богом право правити."
  BOL_The_Undying_Flame: "Невгасиме полум'я"
  BOL_The_Undying_Flame_desc: "Ріоха думав, що може зрадити революцію, але для зрадника не існувало хорошого кінця. Для цивілізованих народів його відступництво було огидним, а наполеонізм — очевидним. Однак така зрада лише дозволила вірним Білим сорочкам пройти хрещення вогнем, а Оскар Унсаґа підняв смолоскип Фаланги, щоб засвідчити відродження болівійської нації. Тепер, коли Велика Справа тріумфує, усі побачать Болівію без чилійського варварства, побудовану на моралі та силі."
  BOL_The_Declawed_Eagle: "Орел без кігтів"
  BOL_The_Declawed_Eagle_desc: "Для необізнаного чилійського спостерігача майбутнє Болівії з безперервною присутністю БСФ виглядає таким же похмурим, як і раніше. Але дещо змінилося. Інституція стала відкритішою та демократичнішою, а роки мілітаризму нарешті стали справою минулого. Дипломатичні діячі в Сантьяґо зітхають із полегшенням після свого гучного успіху в приборканні фалангістського механізму. Але навіть найнаївніші оптимісти все ще питають, чи це не просто маскарад, що лише вичікує, аби знову показати свою потворну голову."
  ABC_tripartite_pact: "Болівійські багатства"
  ABC_Dual_Yoke: "Болівійські багатства"
  ABC_bolivian_riches: "Болівійські багатства"


  BOL_tripartite_pact_custom_tt: "--------------\nНаші "§mбла§!§nгод§!§jійники§!" отримають такі модифікатори: \nДодаткова торгівля: §G+20%§! \nЩоденний приріст політичної влади: §G+0.05§! \nЗростання ВВП: §G+0.50%§! \nРізний дохід (у мільярдах $): §G+0.01§! \nБезкоштовні виробничі одиниці: §G+1§!"
  BOL_dual_yoke_custom_tt: "--------------\nНаші "§nблаго§!§jдійники§!" отримають такі модифікатори: \nДодаткова торгівля: §G+30%§! \nЩоденний приріст політичної влади: §G+0.10§! \nЗростання ВВП: §G+1.00%§! \nРізний дохід (у мільярдах $): §G+0.01§! \nБезкоштовні виробничі одиниці: §G+1§!"
