  BOL_mining_war_falangists_tooltip: "§JФалангісти§!\n\n§JФСБ§! представляє альтернативу для тих патріотів Болівії, які ненавидять §Kолігархів§! та §DНРР§!. Люди можуть глузувати з них через їхні фашистські ідеї, але §Jфалангісти§! гордо стоять другою силою в §jБолівії§!.\n\n§JФалангісти§! контролюють §Y[?BOL.BOL_CHL_groups_won] ключових груп§!"
  BOL_mining_war_nationalists_tooltip: "§DНаціоналісти§!\n\n§DНаціоналісти§! є головною опозиційною групою в §jБолівії§! щодо §Kолігархів§!, вони гуртуються навколо §DНРР§! — широкої партії, що охоплює спектр від консервативних правих до марксистських лівих.\n\n§DНаціоналісти§! контролюють §Y[?BOL.BOL_ARG_groups_won] ключових груп§!"
  BOL_mining_war_government_tooltip: "§KУряд§!\n\nА понад усе: кожен поліцейський знає, що, хоч уряди й можуть змінюватися, поліція залишається. Для своїх критиків §KУряд§! уособлює ту саму олігархію, яка довела §jБолівію§! до руїни.\n\n§KУряд§! контролює §Y[?BOL.BOL_BRA_groups_won] ключових груп§!"

