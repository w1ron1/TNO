0: fiscal_crisis.0.t:0 "Фінансова криза!"
fiscal_crisis.0.desc: "Ми прорахувалися у фінансах, і співвідношення боргу до ВВП злетіло до небес! Уряд мусить суттєво скоротити видатки, інакше на нас чекає серйозна економічна криза.\n\nУряд, який очолює [THIS.GetLeader], має знайти спосіб збалансувати бюджет і водночас істотно зменшити державний борг, інакше нас може спіткати дефолт — або й повна економічна катастрофа."
fiscal_crisis.0.a: "Стійкого економічного відновлення не буває, коли фінансова система в кризі."
fiscal_crisis.1.t: "Довгий шлях до відновлення"
fiscal_crisis.1.desc: "Коли банки знову відчиняють двері, крамниці знімають засуви з вітрин, а пояси трохи послаблюються, наша нація з полегшенням зітхає. Економіка пережила найгірше, і на обрії з’являється ясне небо. Та проблеми лишаються. Оселі втрачено, бізнеси збанкрутували, життя зруйновані злиднями. Для декого відновлення прийшло надто пізно."
fiscal_crisis.1.a: "Майбутнє світлішає, хай навіть лиш на крок."
fiscal_crisis.2.t: "Ковток повітря"
fiscal_crisis.2.desc: "Рана, залишена нашим економічним спадом, почала вкриватися шрамом. Хоч вона ще час від часу пульсує болем, процес зцілення триває. Державна підтримка та особиста винахідливість сприяли нашому фінансовому одужанню, і ми можемо лише дякувати за той шлях, який уже пройдено. По всій країні люди обережно починають інвестувати, брати кредити, ризикувати грошима — страх стрімкого падіння в злидні відступив. Та попри поліпшення, ми маємо залишатися пильними, аби знову не скотитися в кризу."
fiscal_crisis.2.a: "Іскра надії — а світла на довго."
fiscal_crisis.11.t: "Відновлення кредитоспроможності"
fiscal_crisis.11.desc: "Минув рік відтоді, як уряд більше не зміг обслуговувати борги й оголосив банкрутство. На щастя, ми вибралися з фінансової прірви. Ми вийшли з дефолту й знову можемо брати позики. Утім, економісти застерігають: надалі слід діяти обачніше, аби не опинитися в такому становищі знову."
fiscal_crisis.11.a: "Рухаємось стабільно."
fiscal_crisis.12.t: "Банкрутство"
fiscal_crisis.12.desc: "Через жахливе управління та злощасний збіг обставин ми більше не здатні розплачуватися з кредиторами. У результаті ми оголосили банкрутство, що матиме нищівні наслідки для економіки та населення. Наша репутація серед кредиторів зазнає удару, банки будуть змушені списувати борги, а внутрішній попит обвалиться. Залишається лише сподіватися на покращення, хоч найближче майбутнє виглядає похмурим."
fiscal_crisis.12.a: "Як ми до цього допустили?"
TNO_bankruptcy: "§RЦе погано позначиться на економіці.§!"
fiscal_crisis.20.t: "Ще глибше в борги"
fiscal_crisis.20.desc: "Попри всі наші зусилля, фінансова криза продовжує заглиблюватися. Люди втрачають домівки, бізнеси зникають, робочі місця скорочуються. Якщо ми й далі йтимемо цим шляхом, втрати лише зростатимуть. Поки економісти й політики метушаться, народ спостерігає, як їхні заощадження згорають на очах. Разом із грошима стрімко зникає й довіра до уряду."
fiscal_crisis.20.a: "\"Виправте це — і негайно!\""
1: econ_fiscal_crisis_deccat_available:0 "Буде відкрито нову §Yкатегорію рішень§! для подолання фінансової кризи!"
no_action_against_fc: "Ми не реагуємо на фінансову кризу"
Fiscal_crisis_response_category: "Подолання кризи"
Fiscal_crisis_response_category_desc: "Фінансова криза — це відповідь світової економіки на бюджетну політику держави, яку вважають настільки безрозсудною, що вона навіть віддалено не здається життєздатною. І хоча іноді причинами стають геополітичні чи геоекономічні чинники, на які країна не має жодного впливу й не може від них захиститися, результат завжди один: приватний сектор відмовляється підтримувати державні витрати через купівлю облігацій, вважаючи їх надто ризикованими — навіть попри високі відсотки. У підсумку держава раптово виявляється неспроможною фінансувати навіть базові послуги, як-от збройні сили, поліцію чи критичну інфраструктуру.\n\nЧим довше триває фінансова криза, тим згубнішими стають її наслідки для економіки: публічні послуги занепадають, виробництва закриваються, а банки опиняються під шаленим тиском панічно налаштованих інвесторів і родин, які намагаються врятувати бодай частину своїх мізерних заощаджень. Зрештою, навіть сам уряд перестає бути в безпеці: хай якими б жорстокими не були репресії, а пропаганда переконливою, народ усе одно невдовзі вимагатиме негайних дій — і горе тому лідерові, що не зможе дати відповідь..."
slash_bureaucracy: "Скоротити бюрократичні витрати"
slash_bureaucracy_desc: "Бюрократичний апарат держави часто є громіздким, надлишковим і заплутаним, займаючи значну частку національного бюджету. Тому одним із найефективніших способів скорочення державних витрат є радикальне зменшення кількості бюрократичного персоналу: клерків і чиновників, що працюють у відділах, які вважаються другорядними, звільняють, а решті суттєво урізають виплати — принаймні до завершення кризи.\n\nЗвісно, це не минеться без наслідків: невдовзі відчувається гостра нестача кадрів і ресурсів, що різко знижує здатність уряду реалізовувати власну політику, адже багато службовців більше не можуть ефективно виконувати свої обов’язки — деякі ж навіть починають брати хабарі, аби зберегти свій звичний рівень життя. І навіть після завершення кризи наслідки ще довго переслідуватимуть країну: новим службовцям доведеться розгрібати гори невирішених справ, що накопичилися за цей час."
FC_admin_cost_down: "Це §Gзменшить§! наші §Yадміністративні витрати§! на §G60%§!, але §Rпорушить ефективність управління на тривалий час§!. Також це §Rвдарить по стабільності§! на час кризи."
privatisation_programs: "Запровадити масштабну програму приватизації"
privatisation_programs_desc: "Більшість урядів, незалежно від політичних поглядів чи економічних уподобань, утримують широкий спектр державних установ, майна й активностей, що вважаються стратегічно важливими. Від парків і лісів до націоналізованої оборонної промисловості й державних видобувних компаній — держава використовує їх як інструмент для забезпечення попиту на основні товари та послуги.\n\nУ часи кризи готівка стає важливішою за довгострокове планування. Тому приватизація великої частини державного майна й підприємств дає змогу швидко наповнити скарбницю та позбутися потенційних джерел додаткових збитків. Це рішення, хоч і приносить негайну вигоду, у майбутньому призведе до зростання залежності від ринку, адже уряд більше не матиме можливості безпосередньо задовольняти власні потреби після завершення кризи."
FC_privatization: "Це §Rвдарить по стабільності та доходах§!, але §Gдасть нам терміново необхідні кошти§!."
negotiate_deferred_payment: "Домовитися про зменшення виплат із нашими кредиторами"
negotiate_deferred_payment_desc: "Іноді краще мати яйце сьогодні, ніж курку наступного року. Наші кредитори хочуть свої гроші, але навіть вони розуміють: якщо занадто сильно тягнути за мотузку — вона порветься. Тому наша найсильніша зброя — це можливість просто оголосити дефолт. Це було б згубно для нашої економіки, але й кредитори не побачили б жодної копійки. І сказав Самсон: Нехай помру я разом із филистимлянами.\n\nМожливо, ми зможемо переконати їх погодитися на часткове списання боргу — в обмін на обіцянку не оголошувати дефолт і згодом усе ж розплатитися. Втім, шантаж — не найкраща візитівка для повернення на світовий фінансовий ринок: коли криза мине, потенційні покупці наших облігацій, скоріш за все, вимагатимуть вищих відсотків..."
FC_interest_rate_down: "§RМи знизимо відсоткову ставку на 60% в обмін на 5% інфляції§!."
print_emergency: "Збільшити грошову масу"
print_emergency_desc: "Номіналістичний принцип зобов’язань означає, що ми зобов’язані виплачувати суму, зазначену в облігації, навіть якщо цієї суми вже не вистачає й на чашку кави. Тож друк грошей - і то у великих обсягах - можна використати як спосіб швидко погасити значну частину боргів.\n\nВтім, це не минається без наслідків. Штучний друк грошей спричиняє стрибок інфляції, яка може пригнічувати економіку роками. Середній і бідніший класи розгніваються, побачивши, як їхні заощадження знецінюються майже миттєво через падіння купівельної спроможності."
fiscal_crisis_default_overlord: "Укласти план погашення боргу з покровителем"
fiscal_crisis_default_overlord_desc: "Завдяки нашим... тісним зв’язкам із однією з великих держав, ми можемо звернутися по допомогу в ці складні часи. Якщо попросити покровителя виступити спонсором плану погашення боргу перед нашими кредиторами, нам, без сумніву, вдасться добитися вигідніших умов - а можливо, й часткового списання загальної суми.\n\nВтім, така допомога ніколи не буває безкоштовною. Щойно план буде затверджено, варто чекати на шквал «дружніх порад» і пропозицій «взаємовигідної співпраці» - що, найімовірніше, означатиме розширення їхнього впливу на наші внутрішні справи та глибше проникнення їхнього бізнесу в нашу економіку. Здається, доброта може мати два обличчя.."
FC_overlord_cancel_debt: "Наш покровитель §Gпогасить§! частину нашого §Rборгу§! в обмін на §Rчастину наших доходів§!."
FC_has_sphere_leader: "Ми належимо до економічної сфери"
fiscal_crisis_default_1: "Випустити надзвичайні облігації"
fiscal_crisis_default_1_desc: "У надзвичайні часи кожен громадянин покликаний виконати свій обов’язок. Під час війни це означає службу в армії або дотримання продовольчих лімітів, тоді як під час фінансової кризи — підписку на надзвичайні облігації: пропагандистська кампанія наголошуватиме на потребі підтримати батьківщину, купуючи патріотичні облігації, які, найімовірніше, ніколи не буде погашено.\n\nЗвісно, така кампанія навряд чи знайде теплий відгук серед населення, у якого ми фактично просимо пожертвувати власними грошима. Та спроба нічого не коштує, а зібрані кошти можуть допомогти нам утриматися на плаву до завершення кризи. А потім, можливо, ми подумаємо, як віддячити за їхню відданість."
fiscal_crisis_default_2: "Домовитись із нацбанками"
fiscal_crisis_default_2_desc: "Міжнародних кредиторів переконати важко, а от національні інвестори - особливо банки - зовсім інша справа. Завдяки обережному задобрюванню й потрібній дозі тиску нам, можливо, вдасться «переконати» їх відмовитися від частини вимог в обмін на обіцянку виплатити решту - разом із показною подякою на публіку.\n\nЗвісно, більшість не буде в захваті, і політична реакція буде доволі болісною, але це єдина альтернатива повному погашенню боргу. Приватні інтереси мають поступитися загальному добробуту країни - незалежно від нашої політичної орієнтації чи економічної стратегії. Адже виживання - завжди на першому місці."
default_2_tooltip: "§RЦе дещо посилить вплив боргу на політичну владу на час кризи.§!"
fiscal_crisis_default_3: "Скликати конференцію щодо нашого боргу"
fiscal_crisis_default_3_desc: "Іноді найкраще вирішувати кризу напряму. Як на національному, так і на міжнародному рівні кредитори очікують рішучих дій, і найкращий спосіб переконати їх у нашій готовності співпрацювати для подолання фінансової кризи — показати хід нашої роботи. Скликавши міжнародну конференцію, ми дамо всім змогу побачити наш прогрес.\n\nЯк і слід було очікувати, це матиме політичні наслідки. Населення сприйме конференцію як спробу іноземних держав нав’язати свій вплив, а нас — як слухняних маріонеток. Варто очікувати масових протестів і посилення радикальних настроїв у суспільстві на час її проведення."
default_3_tooltip: "§RЦе посилить вплив боргу на політичну владу на час кризи та знизить стабільність§!"
fiscal_crisis_default_4: "Примусити кредиторів до поступок"
fiscal_crisis_default_4_desc: "Економіка - жорстокий світ, і навіть якщо ти маєш рацію, це ще не гарантує успіху. Нам потрібні гроші, щоб функціонувати, і ми не станемо схилятися перед кредиторами. Ми дамо чітко зрозуміти: командуємо тут ми, а не вони - і якщо хочуть повернути свої кошти, хай слухають нас.\n\nКого хвилює, що після цього наші облігації купуватимуть менш охоче? Наші реформи зроблять нас менш залежними від них. Нехай залишають гроші при собі - ми знайдемо інші способи наповнити скарбницю. Принаймні, ми на це сподіваємось..."
default_4_tooltip: "§RЦе суттєво посилить вплив боргу на політичну владу на час кризи та суттєво знизить стабільність§!"
fiscal_crisis_default_5: "Реструктуризувати невигідні облігації"
fiscal_crisis_default_5_desc: "Очевидно, що наші кредитори прагнуть лише задушити нашу економіку здирницькими відсотковими ставками. Наша терплячість давно вичерпалася — час діяти радикально. Скориставшись суверенним правом, ми в односторонньому порядку вирішимо, які облігації будуть виплачені, а які — повністю або частково реструктуризовані.\n\nЗвісно, це матиме наслідки. Міжнародні економічні гравці обурено заявлять про порушення базових принципів державних зобов’язань. Але будьмо чесними: якщо ми вже зайшли так далеко, отже, іншого вибору в нас просто не залишилося."
default_5_tooltip: "§RЦе суттєво посилить вплив боргу на політичну владу на час кризи та ще більше знизить стабільність§!"
end_econ_investment: "Урізати держпрограми"
end_econ_investment_desc: "Будь-який уряд фінансує масштабні програми дотацій - від освіти до економічного розвитку. У складні часи бюджет доводиться суттєво скорочувати, а всі доступні кошти спрямовувати на найнагальніші витрати.\n\nЯк і слід було очікувати, такі масштабні урізання паралізують соціальний та економічний розвиток. Та довгострокове планування - це розкіш, яку ми собі дозволити не можемо: якщо криза триватиме, у нас більше просто не залишиться економіки, яку можна було б дотувати."
FC_civ_cost_down: "§RМи тимчасово скоротимо державні витрати ціною економічного зростання§!."
slash_research: "Скоротити фінансування науки"
slash_research_desc: "Як і будь-який розсудливий уряд, ми вкладаємо значні кошти в перспективні наукові установи нашої країни. Та в ці нелегкі часи стає очевидно: ми більше не можемо дозволити собі таку розкіш. Видатки на науку буде скорочено, а самі установи залишені напризволяще.\n\nМи розуміємо, що це призведе до загального зниження нашої здатності тримати темп інновацій, але зараз гроші - нагальніша проблема. Колись, тисячі років тому, хтось вирішив, що «гроші» - чудовий винахід. Якби тільки дістатися до його кісток..."
FC_research_freeze: "Ми §Rзначно§! скоротимо витрати на §Yнауку§!, ціною §Rсерйозного уповільнення майбутніх досліджень§!."
restore_trust_debtors: "Відновити частину репутації"
restore_trust_debtors_desc: "Ризикована гра на межі та самовпевненість не ведуть у майбутнє. Зрештою, ми не виживемо без тих, хто купуватиме наші облігації - інакше б ми взагалі не опинилися в такій ситуації. Тож нам слід зосередитися на відновленні довіри ринку до нашої платоспроможності.\n\nДобровільно виплативши невелику частину прострочених облігацій разом із відсотками, ми дамо зрозуміти кредиторам, що готові до співпраці. Це буде все одно що витиснути кров з каменю, але ми маємо подбати про те, щоб після завершення цієї кризи - а вона колись таки закінчиться - ми знову могли вийти на ринок без остраху бути відкинутими."
freeze_military: "Скоротити військові витрати"
freeze_military_desc: "Міць держави часто вимірюється її армією, але яка користь із великого війська, якщо ми не можемо навіть платити йому жалування? Щоб за кілька місяців не зіткнутися з розлюченими солдатами, краще діяти рішуче - визначити, що можна зберегти, а що доведеться урізати. Припинення нових наборів, зупинка розширень та зведення витрат на утримання до мінімуму мають полегшити тягар для державної скарбниці.\n\nОчікувано, це матиме серйозні наслідки в довгостроковій перспективі. Без належного догляду техніка швидше виходитиме з ладу, старі тактики й озброєння поступатимуться сучасним, а молодь двічі подумає, перш ніж іти на службу, не маючи впевненості в оплаті. Але війна є війна - і економічні битви теж потребують жертв."
FC_mil_freeze: "§RМи не зможемо фінансувати армію чи флот, і побачимо стрімке падіння людських ресурсів§! в обмін на §G80%§! зниження §Yвійськових витрат§!"
