l_english: 

### Events ###

vc.1.t:0 "Конференція починається"
vc.1.d:0 "З усієї Італії до Верони з'їжджаються делегати, представники, політики, бюрократи, чорносорочечники та інші діячі з усіх верств і організацій величезного політичного апарату НФП. Середньовічне місто прикрашене італійськими триколорами та фашистськими чорними прапорами; натовпи вітають автомобіль Дуче, коли той проїжджає містом у супроводі невеликого загону елітних чорносорочечників, перш ніж нарешті дістатися місця проведення конференції — Кастельвеккіо, замку за межами головного міського центру. Побудований династією Скаліґерів ще в Середньовіччі, тепер він кишить допитливими глядачами, журналістами та озброєними чорносорочечниками, які несуть варту на своїх постах.\n\nІнші гості конференції увійшли до Кастельвеккіо з набагато меншим розголосом — розмовляючи та плетучи змови, тоді як чорносорочечники, мовчки розставлені навколо будівлі, стояли на варті з гвинтівками в руках. Уніформи та костюми збираються невеликими групами, тихо розмовляють, а потім розходяться й знову збираються, у нескінченному танці навколо столів, де пляшки вишуканих вин і тарілки із закусками спорожнюються, а потім знову наповнюються, поки політики плетуть свої інтриги. Домовленості та союзи укладаються й розриваються, і коли всіх делегатів закликають сісти в головній залі, секретар Скорца та прем'єр-міністр Чіано на мить зустрічаються поглядами, коли останній готується виступити з вступною промовою конференції. Напружена тиша огортає повітря — боротьба за визначення майбутнього Італії розпочалася."
vc.1.a:0 "Горе переможеним."

vc.2.t:0 "Майбутнє Міністерства народної культури"
vc.2.d:0 "Міністерство народної культури було засноване у 1937 році для контролю та регулювання італійської медіа- та мистецької індустрії, щоб гарантувати їхнє дотримання партійної лінії. Створене як відповідь на німецьке Райхсміністерство народної освіти та пропаганди, Міністерство народної культури натомість невдовзі стало джерелом насмішок — його роздута бюрократія була обурливо легкою для обходу, його цензура в найкращому разі була марною, а в найгіршому — фактично шкідливою, а його загальна ефективність стала предметом жартів. Навіть сама його назва викликає веселощі серед італійського народу, оскільки його абревіатура MinCulPop підозріло нагадує італійське слово для дупи.\n\nЩоб виправити це жалюгідне становище, багато партійних чиновників запропонували оновити Міністерство народної культури. На чолі з секретарем Карло Скорцою ця реформа радикально змінила б бюрократію Міністерства народної культури, зробивши її ефективнішою, оперативнішою та, понад усе, дієвішою у поширенні фашистських цінностей серед населення. Дуче швидко відкинув такі пропозиції, оскільки він, як і багато інших, вважає це лише марнуванням ресурсів, адже Міністерство народної культури значною мірою вже вичерпало свою корисність. Попри це, це питання було порушено у Вероні й тепер обговорюється Конґресом."
vc.2.a:0 "Невже вони не могли хоча б змінити абревіатуру?"

vc.3.t:0 "Чіано виступає проти Міністерства народної культури"
vc.3.d:0 "Ґалеаццо Чіано виступив перед конференцією щодо пропозиції реформувати Міністерство народної культури та, як і передбачалося, виступив проти реформування цієї установи. Стверджуючи, що цензура в Італії вже не настільки необхідна, як у 1920-х і 1930-х роках, коли підривна загроза комунізму та заколоту все ще була серйозною, Чіано натомість запропонував спрямувати кошти, необхідні для відновлення Міністерства народної культури, на більш нагальні потреби.\n\nДуче продовжив, виступивши на підтримку італійських кіно-, літературної та телевізійної індустрій, які виявилися дуже прибутковими та популярними за кордоном, а Міністерство народної культури лише шкодить їм, сповільнюючи виробництво нових культурних продуктів і придушуючи творчість та геній італійських режисерів і письменників.\n\nХоча з деяких частин конференції пролунали оплески, багато фашистських політиків зустріли пропозицію значно менш захоплено, побоюючись, що можлива дерегуляція індустрії розваг може призвести до швидшого поширення підривних настроїв серед населення."
vc.3.a:0 "Усі люблять італійське кіно!"

vc.4.t:0 "Скорца говорить про важливість Міністерства"
vc.4.d:0 "Під оплески значної частини партії Карло Скорца вперше виступив у Вероні, представивши план реформування Міністерства народної культури, який враховував би занепокоєння Дуче щодо міністерства, водночас надаючи йому належного значення. Завдяки спрощенню бюрократії, створенню консультативної ради директорів та експертів з індустрії розваг і незначному послабленню цензури Міністерство народної культури можна легко й оперативно перетворити на сучасну та ефективну установу.\n\nСкорца продовжив, нагадуючи конференції про важливість захисту й підтримки цінностей фашистської революції серед населення, а також про небезпеку підривних, хтивих і відверто дегенеративних мистецьких продуктів, які потрапляють до населення, розбещуючи італійську молодь і послаблюючи міцні моральні підвалини нації. Хоча багато учасників конференції явно захопилися словами секретаря, ще більше були спантеличені й дещо переконані, що це лише завуальована боротьба Скорци за владу."
vc.4.a:0 "Серйозно, змініть цю абревіатуру."

vc.5.t:0 "Велика рада голосує щодо Міністерства народної культури"
vc.5.d:0 "Хоча Скорці вдалося силою переконати Дуче дозволити Великій раді проголосувати щодо реформи Міністерства народної культури, немає жодної гарантії, що пропозиція пройде, і цілком імовірно, що делегати Великої ради відхилять її, обравши позицію Чіано. Однак Скорца збирав підтримку, тож перемога не є неможливою.\n\nЗа зачиненими дверима Велика рада мовчки голосує. Один за одним записуються "Sì" та "No", і коли голоси підраховано..."
vc.5.a:0 "Пропозицію Скорци відхилено!"
vc.5.b:0 "Пропозицію Скорци схвалено!"

vc.6.t:0 "Реформувати чорносорочечників?"
vc.6.d:0 "Від часів Маршу на Рим Добровольча міліція національної безпеки, відома в народі як чорносорочечники, розширила свої повноваження. Тепер чорносорочечники мають значну владу в Італії, конкуруючи з офіційними повноваженнями карабінерів. Чорносорочечників бояться через їхній терор: час від часу вони нападають на американських туристів, студентів університетів, колоніяльних підданих та всіх інших, кого вважають "ворогами фашизму". Чорносорочечники також є однією з найбільш реакційних груп у структурі НФП, фактично являючи собою мережу "старих друзів" із впливових радикальних фашистів, особливо серед вищих чинів.\n\nЧіано, вирушаючи на Веронську конвенцію, прагне обмежити владу чорносорочечників. Відповідно, Чіано планує встановити пенсійний вік і суттєво обмежити повноваження чорносорочечників щодо арештів. Скорца, сподіваючись зміцнити підтримку серед чорносорочечників і консервативних фашистів, зробить усе можливе, щоб протистояти цим реформам. Сцена готова до потенційного протистояння між Чіано та Скорцою, а члени МВСН на конференції виявилися... далеко не нейтральними щодо пропозицій Чіано."
vc.6.a:0 "Сподіваймося, що до бійки не дійде."

vc.7.t:0 "Чіано виступає на підтримку реформ чорносорочечників"
vc.7.d:0 "Чіано піднявся на трибуну, і в повітрі повисла напруга. Він розпочав із подяки чорносорочечникам, бодай на словах віддаючи належне їхнім досягненням за останні 40 років. Чіано відзначив загони чорносорочечників, які так хоробро воювали в Африці та Європі, а також чорносорочечників, які придушували комуністичних повстанців. Чіано заслужив оплески значної частини зали, однак, що примітно, присутні командири чорносорочечників не аплодували.\n\nПісля паузи Чіано перейшов до засудження зловживань чорносорочечників. Він засудив "надмірно завзяте" придушення протестувальників і дисидентів, а також колоніяльні зловживання. Після цього палата наповнилася бурмотінням і шепотом, а кілька командирів чорносорочечників залишили промову. Здавалося б, не збентежений цією зневагою, Чіано продовжив свою промову, виклавши свій пакет реформ. По-перше, він запропонував обов'язковий пенсійний вік для чорносорочечників і, можливо, найгострішими словами конференції засудив "геронтократію" серед старших офіцерів чорносорочечників. Після цього він запропонував розв'язати проблему жорстокості шляхом суттєвого скорочення цивільних повноважень чорносорочечників, зокрема їхньої здатности здійснювати арешти.\n\nПромова Чіано лише посилила напругу в залі, а оскільки наступним мав виступати Скорца, конференція, здавалося, була цілковито на межі."
vc.7.a:0 "Це нічого не покращило."

vc.8.t:0 "Скорца виступає проти реформ чорносорочечників"
vc.8.d:0 "Скорца розпочав свою промову з тривалої подяки кожному присутньому командирові чорносорочечників, називаючи їх поіменно та відзначаючи їхню "тривалу службу Італії", що стало очевидним докором зауваженню Чіано про "геронтократію". Далі Скорца захистив чорносорочечників та їхні дії, стверджуючи, що придушення "нелояльности" час від часу вимагає жорстоких методів. Це викликало вигуки схвалення та оплески чорносорочечників у залі. Потім Скорца розпочав нищівну атаку на студентів-протестувальників, що, здавалося, лише побічно стосувалася теми, але завершив її подякою чорносорочечникам за їхнє придушення.\n\nПотім Скорца виступив проти пропозиції позбавити чорносорочечників повноважень щодо арештів. За словами Скорци, ці повноваження настільки фундаментально необхідні для статусу МВСН, що їхнє скасування фактично означало б смерть чорносорочечників і, відповідно, контролю НФП над італійським життям. Присутні чорносорочечники знову захоплено вітали його, тоді як реакція решти зали була значно стриманішою. Завершуючи промову, Скорца вирішив спрямувати удар на те, що він описав як відхід від ідеологічного фашизму, характерний для конференції, та висловив сподівання, що під час майбутнього голосування Велика рада підтримає пропозицію, яка "зміцнює фашистську ідеологію"."
vc.8.a:0 "Фашизму потрібні його силовики."

vc.9.t:0 "Голосування щодо реформ чорносорочечників"
vc.9.d:0 "Як і очікувалося, пропозиція щодо реформи зайшла в глухий кут і була передана Великій раді фашизму. Очікується, що голосування у Великій раді також буде напруженим, і Скорца та Чіано намагалися заручитися підтримкою потенційних коливних виборців у Великій раді. Довіра між обома фракціями у Великій раді, схоже, повністю випарувалася, і коли члени Великої ради починають голосувати, будь-які залишки доброї волі на конференції, здається, також зникають.\n\nВелика рада знову голосує, записуючи "Sì" та "No", і коли голоси підраховано..."
vc.9.a:0 "Реформу чорносорочечників схвалено!"
vc.9.b:0 "Реформу чорносорочечників відхилено!"

vc.10.t:0 "Послабити державний контроль над профспілками?"
vc.10.d:0 "Від самого початку фашистської епохи по всій країні діяли суворі правила щодо профспілок. Ще в 1920-х роках було створено нову фашистську профспілку під назвою Національна конфедерація синдикалістських корпорацій (Confederazione Nazionale delle Corporazioni Sindacali), а вже наявні профспілки, особливо ліві, були заборонені, а їхні залишки інтегровані до Національної конфедерації.\n\nСпочатку задумана як одна з опор нової фашистської держави, через роздуту бюрократію та зміни у владних відносинах усередині режиму вона стала інструментом гноблення, а не розширення прав — особливо після Фашистських законів 1939 року, які зробили страйки незаконними та ще більше обмежили права робітників. Національна конфедерація забезпечує дуже мало реального представництва робітників і натомість сприймається як інструмент контролю, який фашистська держава використовує для запобігання самоорганізації робітників у незалежні профспілки, — підживлюючи гнів і радикалізацію серед міської бідноти.\n\nДуче запропонував радикальне вирішення цієї проблеми — розділити Національну конфедерацію на менші, незалежніші профспілки, дозволивши реальне представництво робітників і більшу автономію. Зрозуміло, ця пропозиція є суперечливою, і багато хто в НФП, серед них Карло Скорца, рішуче виступили проти неї."
vc.10.a:0 "Солідарність назавжди?"

vc.11.t:0 "Позиція Чіано щодо профспілок"
vc.11.d:0 "Дуче знову звернувся до фашистів, які зібралися у Вероні. Цього разу промова Чіано не складалася з запальної риторики чи грандіозних заяв, а з холодних, сухих цифр. Виробничі цілі, зростання ВВП, купівельна спроможність — бомбардування графіками, таблицями та круговими діаграмами, які можна було б узяти просто з підручника з економіки. Спираючись на ці дані, Чіано стверджував, що Національна конфедерація стримує зростання італійської економіки, нав'язуючи продуктивним сферам суспільства візантійську бюрократичну систему.\n\nЩе більш тривожним є те, що існують докази: відсутність представництва робітників є однією з головних причин поширення невдоволення та гніву серед нижчих класів, що може створити сприятливий ґрунт для поширення комуністичного екстремізму. Дозволивши створити менші, автономніші та легші в управлінні профспілки, усі ці проблеми можна вирішити одним простим кроком. З конференції пролунали деякі оплески, але багато хто був явно спантеличений надмірною кількістю цифр і даних, які на них обрушилися."
vc.11.a:0 "Економіка, дурні!"

vc.12.t:0 "Позиція Скорци щодо профспілок"
vc.12.d:0 "Карло Скорца знову виступив проти Чіано у Вероні. План Дуче щодо реформування профспілок був зустрінутий гнівом значної частини партії, багато хто з якої вважав, що безпосередньо атакують ключовий елемент фашистської політичної споруди. Промова Скорци була значно менш зосереджена на фактах, ніж промова Чіано: він нагадав конференції про націонал-синдикалістське коріння фашизму, викликав туманні страхи перед комуністичними привидами, що досі витали в повітрі, та прославив усі великі здобутки фашизму для італійських робітничих класів. Скорца проспівав свою хвалу фашистським профспілкам, викликавши грім оплесків на конференції.\n\nОднак найслабшою частиною виступу Скорци була відсутність чітких політичних пропозицій щодо вирішення проблем Національної конфедерації та негараздів, які вона створює для італійської економіки. На конференції пролунало чимало бурмотіння, але незрозуміло, чи вдалося йому схилити на свій бік багатьох людей."
vc.12.a:0 "Фашизм для робітничих класів?"

vc.13.t:0 "Велика рада голосує щодо профспілок"
vc.13.d:0 "Найзапекліше спірне питання на цей момент знову завершилося нічиєю на конференції: ні Чіано, ні Скорці не вдалося залучити достатньо підтримки на свій бік, щоб досягти прориву. Знову ж таки, щоб уникнути розколу, який міг би розколоти НФП, Велика рада муситиме проголосувати з цього питання. Повітря напружене, атмосфера холодна — усі знають, що це голосування матиме історичне значення.\n\nЗнову записуються "Sì" та "No", поки над членами Великої ради, що зібралися разом, панує мертва тиша. Знову голоси підраховують, і..."
vc.13.a:0 "План Чіано схвалено!"
vc.13.b:0 "План Чіано відхилено!"

vc.14.t:0 "Закони Ачербо"
vc.14.d:0 "Коли Веронська конференція вступає у свої останні дні, порушено нове й неймовірно суперечливе питання — виборче законодавство, також відоме як закон Ачербо. Названий на честь фашистського політика Джакомо Ачербо, який розробив закон і представив його італійському парламенту в 1923 році, він був створений Національною фашистською партією за підтримки різних правих партій, щоб гарантувати Муссоліні та його коаліції повний і міцний контроль над парламентом. Закони передбачали, що партія, яка отримала більшість голосів, — за умови, що вона набрала понад 25% від загальної кількости голосів, — отримувала дві третини місць у парламенті.\n\nЦі закони були використані лише на одних виборах, у 1924 році, які, як і слід було очікувати, призвели до здобуття НФП надбільшости в парламенті. Після цього ухвалювалося дедалі більше законів для побудови фашистської диктатури та концентрації влади в руках Муссоліні. Тепер у Вероні деякі члени НФП, близькі до Чіано, запропонували переглянути ці закони, включно з початковим законом Ачербо 1924 року. Їхня пропозиція передбачає кілька змін до виборчого законодавства, які, хоча й зберігатимуть верховенство НФП, потенційно можуть відкрити шлях до участі незалежних партій у виборах і навіть до їхньої можливої перемоги над фашистами.\n\nЗрозуміло, значна частина конференції була обурена. Розгорнулися запеклі дебати, причому Чіано здебільшого мовчав — однак суперечки загострилися, і серед членів партії навіть спалахнули кілька сутичок."
vc.14.a:0 "Усі, будь ласка, поводьтеся цивілізовано."

vc.15.t:0 "Скорца плете змови в темряві"
vc.15.d:0 "Цього вечора Карло Скорца та кілька важливих представників НФП зустрілися за вечерею в розкішному ресторані в старому місті Верони. Там, в елегантній їдальні за зачиненими дверима, усі гості Скорци могли спостерігати холодну, розважливу й моторошну лють секретаря. Чіано виявився значно складнішою мішенню, ніж очікувалося, і попри все значна частина НФП досі підтримує безхребетного зрадника, який узурпував титул Дуче.\n\nОднак негативна реакція на пропозиції щодо зміни законів Ачербо надала Скорці дорогоцінний шанс. Шанс осідлати хвилю невдоволення в НФП, щоб раз і назавжди усунути Дуче. Жодного кроку назад — закони Ачербо мають бути захищені за будь-яку ціну. Скорца висловився гранично чітко — доля фашистської революції та Італії залежить від цього."
vc.15.a:0 "Чи полічено дні Чіано?"

vc.16.t:0 "Чіано зустрічається за зачиненими дверима"
vc.16.d:0 "Після того як запеклі сутички на конференції вщухли на цей день, а різні делегати вирушили до своїх готелів на ніч, Чіано зібрав своїх найближчих радників за зачиненими дверима. Кілька генералів, кілька високопоставлених політиків, кілька менш відомих імен — усі стурбовані дедалі гучнішими голосами Скорци та його кліки. Ось воно, останній бій — якщо Скорці вдасться осідлати хвилю підтримки, захистити закони Ачербо та використати цей імпульс для залучення дедалі більшої кількости прихильників, це може стати кінцем перебування Чіано на посаді Дуче.\n\nПотрібно провести оборонну лінію, щоб зупинити наступ Скорци, — компромісне рішення. Не скасовуючи законів Ачербо, їх буде змінено — це дозволить вільніше волевиявлення народу під час обрання представників НФП на місцевих виборах. Це не просто боротьба навколо виборчого закону, це боротьба за контроль над Італією, і Дуче не збирається віддати Скорці ані сантиметра більше."
vc.16.a:0 "Тепер починається фінальна гра."

vc.17.t:0 "Останнє голосування Великої ради"
vc.17.d:0 "Після того як Чіано представив поміркований план внесення змін до законів Ачербо, хаос на конференції перетворився на мертву тишу. Раптом усі чітко усвідомили, що це не боротьба між прихильниками та противниками законів Ачербо — це боротьба між Чіано та Скорцою. Не промовляючи жодного слова, всі члени Великої ради один за одним увійшли до кімнати, де мало відбутися останнє голосування.\n\nПісля того, що здавалося болісно довгим часом, усі голоси було віддано. Спікер ради на мить затнувся, перш ніж прочитати аркуш із підрахованими голосами, і оголосив остаточний результат..."
vc.17.a:0 "Закони Ачербо буде змінено!"
vc.17.b:0 "Закони Ачербо залишаться чинними!"

vc.18.t:0 "Останнє голосування"
vc.18.d:0 "Після завершення промов члени партії вишикувалися, щоб віддати свої голоси під час вотуму довіри Чіано. Хоча юридично він не має обов'язкової сили, схвалення цього голосування дозволить Чіано реалізувати частину або й усю свою реформаторську програму. Після завершення підрахунку секретар Скорца вийшов на сцену, щоб оголосити результати..."
vc.18.a:0 "Делегати залишаються вірними Чіано!"
vc.18.b:0 "Делегати голосують проти нього!"
vc.18.c:0 "Великий шок — голоси розділилися порівну!"

vc.19.t:0 "Чіано оголошує Конґрес успішним"
vc.19.d:0 "Попри труднощі та запеклий опір з боку власної партії, Веронська конференція завершилася перемогою Чіано. У своїй заключній промові, коли натовп фашистських представників мовчки сидів, Дуче висловив задоволення новознайденою єдністю та силою партії, а також свою готовність провести реформи й зміни заради загального блага Італії. Скорца мовчав, похмурий. Коли Чіано завершив промову, повітря наповнилося гучними оплесками, але Скорца не аплодував.\n\nБаланс сил у фашистській державі може бути мінливою річчю, але одне можна сказати напевно — контроль Чіано над НФП і над нацією тепер сильніший, ніж будь-коли. Згідно з витоками та чутками зсередини партії, кліка Скорци стрімко розпадається, оскільки дедалі більше впливових політиків переходять до фракції Чіано, яка явно перемагає. У Вероні натовпи скандували ім'я Чіано, тоді як Дуче стояв на автомобілі, який мав відвезти його до аеропорту. Дуче не має наміру гаяти час — щойно повернувшись до Рима, він завершить справу, розпочату у Вероні.\n\nЗі зміцненням контролю Чіано над НФП усе ще важко передбачити, яким буде майбутнє Італії. Найоптимістичніші спостерігачі стверджують, що цей новий розвиток підштовхне Італію на шлях до повної демократії, хоча справжні масштаби планів Чіано досі залишаються предметом припущень."
vc.19.a:0 "Аве Чіано!"

vc.20.t:0 "Скорца бере владу у Вероні!"
vc.20.d:0 "Італійська громадськість удома та за кордоном була шокована, дізнавшись новину — вранці останнього дня Веронської конференції Скорца подав до Великої ради несподівану пропозицію. Багато членів ради були спантеличені, помітивши відсутність Дуче, але все стало аж надто зрозумілим, коли було зачитано пропозицію секретаря — це був вотум недовіри, спрямований на усунення Галеаццо Чіано з посад прем'єр-міністра Італії та Дуче фашизму.\n\nЦе був останній штрих політичного шедевру Скорци — захоплення Італії зсередини НФП. Голосування відбулося швидко, причому члени НФП, близькі до Скорци, закликали поквапитися, — і коли голоси було підраховано, результат оголосив сам секретар. Після ухвалення пропозиції Галеаццо Чіано позбавлено всіх його посад в італійському уряді та НФП. Водночас до Верони з Рима надійшла термінова телеграма — люди Скорци в столиці успішно змусили короля підкоритися, подібно до того, як це свого часу зробив сам Муссоліні у 1920-х роках. Його Величність король Умберто II погодився надати секретарю НФП Карло Скорці посаду прем'єр-міністра, а його інавґурація має незабаром відбутися в Палаццо Венеція.\n\nОдразу після отримання телеграми Велика рада провела ще два голосування: за призначення Скорци Дуче фашизму та за арешт колишнього Дуче Галеаццо Чіано — обидва рішення були ухвалені переважною більшістю. Новини з Верони та Рима плутані, хаотичні й тривожні, але одне є певним — ера Чіано завершилася."
vc.20.a:0 "Аве Скорца!"

vc.21.t:0 "Конференція розпускається"
vc.21.d:0 "Після нічиєї в останньому голосуванні і Чіано, і Скорца одночасно спробували заявити про певний успіх, але обидва приватно знали, що зазнали невдачі, залишивши партію без чіткого напряму. Другого голосування не проводили, і делегати просто зібрали речі та розійшлися. Ні Чіано, ні Скорца не дали інтерв'ю журналістам, які чекали на них, а на Рим опустився похмурий настрій."
vc.21.a:0 "Партія вистоїть..."

#Tool Tips#

vc_ciano_wins:0 "Вплив Чіано зростає..."
vc_scorza_wins:0 "Вплив Скорци зростає..."

#Prep events

vc.22.t:0 "Підготовка до Веронської конференції"
vc.22.d:0 "Протягом останніх кількох місяців розбіжності між Чіано та секретарем партії Карло Скорцою стали нестерпними. Запекла опозиція Скорци будь-яким і всім реформам, запропонованим Чіано, щотижня паралізує роботу уряду, і всі сторони усвідомлюють, що потрібно щось робити. Готуються провести конференцію у Вероні, щоб визначити майбутній напрям італійського уряду та партії."
vc.22.a:0 "Так чи інакше, реформи необхідні."

vc.23.t:0 "Чіано виголошує промову"
vc.23.d:0 ""Друзі, співвітчизники — хоча я завжди був і залишатимуся членом нашої великої Партії, принципи, на яких тримається наша країна, не висічені в камені."\n\nСьогодні Чіано виголосив промову в Римі, де закликав до «еволюції» Національної фашистської партії.\n\n"Світ 1921 року кардинально відрізняється від сьогоднішнього. Наші великі засновники ніколи не могли передбачити появу телебачення, сучасної медицини та інших визначальних рис нашої нової епохи. Як і економіка, уряд мусить адаптуватися до нашої сучасної реальности.""
vc.23.a:0 "Його час наближається..."

vc.24.t:0 "Скорца зустрічається зі своїми прихильниками"
vc.24.d:0 "Секретар партії Карло Скорца протягом останніх кількох тижнів перед Веронською конференцією зустрічався з групою затятих прихильників старої гвардії партії. Хоча ці зустрічі відбувалися за зачиненими дверима, Скорца навмисно зливав деяку інформацію пресі.\n\n"Необхідне повернення до наших коренів", — сказав він на пресконференції на початку цього тижня. "Ми маємо залишатися вірними нашим цінностям у цю епоху дедалі більшої невизначености у світі.""
vc.24.a:0 "Йому потрібна вся можлива підтримка!"

vc.25.t:0 "Підозріла діяльність Червоної бригади на території конференції"
vc.25.d:0 "Хоча наші газети щосили намагалися це приховати, все ж з'явилися повідомлення про те, що цього тижня трьох агентів Червоної бригади схопили, коли вони нишпорили територією конференції у Вероні. Вони чинили опір «посиленому допиту» й нічого не зізналися, але ми підозрюємо, що вони шукали вразливості в системі безпеки будівлі, включно із задніми входами та виходами.\n\nНаселення, яке й без того непевне щодо цієї конференції, дедалі більше побоюється, що вона може перетворитися з демонстрації єдности на фіаско."
vc.25.a:0 "Негайно посилити безпеку!"

vc.26.t:0 "Чіано зустрічається з королем"
vc.26.d:0 "Хоча король Умберто є не більше ніж номінальною фігурою, цього тижня він зустрівся з Чіано та схвалив його плани щодо конференції. Після провалу системи безпеки минулого місяця цей крок заспокоїв багатьох простих людей, переконавши їх, що ця конференція буде корисною для довгострокової стабільности Італії."
vc.26.a:0 "Безперечно, важлива зустріч."

vc.27.t:0 "Скорца виступає перед радою"
vc.27.d:0 "Поки Чіано зустрічався з королем, Скорца готував промову для Великої ради фашизму. Сьогодні вранці він вийшов на трибуну під бурхливі оплески прихильників жорсткої лінії в раді.\n\n"Панове — фашизм був і залишатиметься фашизмом! Більше жодних реформ, поступок дегенеративним лівим і лібералам чи розмов про демократію! Ми єдині у своїй меті й маємо триматися основ, які принесли нам перемогу у війні та привели нас до величі!""
vc.27.a:0 "Можливо, він має рацію..."
