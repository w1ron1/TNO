 ### Leader Bios ###
 BKR_Validi_Tugan: "Әхмәтзәки Вәлиди Туған"
 POLITICS_VALIDI_TUGAN_DESC: "Історія Әхмәтзәки Вәлиди Тугана, або просто Зекі Веліді Тогана, як його більше знали за кордоном, багато в чому відображає історію башкир у XX столітті — формування ідентичності в молоді роки, потрясіння часів Російської громадянської війни, ганебне відчуження від спадщини та, зрештою, другий шанс довести свою цінність. Нащадок мусульманського духовенства, Вәлиди став відомим як видатний тюрколог і дослідник башкирського народу в останні роки Російської імперії. У ті часи він розпочав свою політичну діяльність на захист російської мусульманської громади та виступав за башкирську автономію.\n\nПісля двох російських революцій Вәлиди став одним із найпопулярніших речників башкирського націоналізму. Спочатку співпрацюючи з більшовиками та вірячи їхнім обіцянкам зламати царську в'язницю народів, він згодом усвідомив, що за їхніми гаслами ховається великий російський шовінізм, який пригнічував її малі народи від самого виникнення царської влади. Вигнаний із Башкортостану, він продовжив боротьбу проти автократичної совєцької влади разом із басмацьким рухом у Центральній Азії, але безуспішно. Змушений піти у вигнання та відірваний від своїх коренів, Вәлиди продовжив інтелектуальну працю за кордоном, зберігаючи башкирську інтелектуальну традицію живою навіть далеко від батьківщини.\n\nКоли в хаосі Західноросійської війни було проголошено незалежну Башкирську Іслямську Республіку, мало хто очікував, що Вәлиди коли-небудь знову стане значущою постаттю в хаотичній башкирській політиці, якщо молодші покоління взагалі зможуть згадати його ім'я. Як же вони помилялися! Подорож із Туреччини до охопленої конфліктом центральної частини Росії була нелегким завданням. Його внесок був визнаний на батьківщині, і він без проблем піднявся до ролі башкирського національного лідера в час найбільшого виклику башкирському та мусульманському суверенітету на їхніх власних землях."

 BKR_ONG_Faizrakhman_Zagafuranov: "Файзрахман Загафуранов"
 POLITICS_FAIZRAKHMAN_ZAGAFURANOV_DESC: "Файзрахман Загафуранович Загафуранов усе життя прожив у башкирських землях. У молоді роки він почав підніматися нескінченними щаблями совєцької бюрократії, але було вже надто пізно, адже СРСР упав і потягнув ці сходи за собою. Коли катастрофа Великої Вітчизняної війни охопила його відчаєм, його діяльність на захист прав башкир зрештою дала результат, адже Республіка Башкірія здобула незалежність у кривавих наслідках Західноросійської війни, і Загафуранов був її частиною.\n\nНа жаль, усе хороше колись закінчується, і Башкирія знову була розчавлена російським чоботом, принаймні доти, доки визволителі не прийшли з півночі. Не надто переймаючись тим, що відбувалося далеко на півдні, доки їхні маріонеткові уряди залишалися на місці, Антикомуністична ґвардія без проблем знову звільнила народи Ідель-Уралу.\n\nЗагафуранов видавався компетентним адміністратором і палким лідером, тож в Архангельську було ухвалено рішення. Посадовця обрали новим президентом Республіки Башкортостан, і, схоже, він залишатиметься на цій посаді ще довгий час."
 
