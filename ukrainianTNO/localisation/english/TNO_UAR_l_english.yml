 ### Ideas ###
 UAR_disunited_armies: "Роз'єднані армії"
 UAR_disunited_armies_desc: "Хоча наші солдати готові битися, вони радше нагадують розрізнений натовп, ніж справжню бойову силу. Оскільки наша нація лише зароджується, її армія все ще розвивається, і знадобиться час, перш ніж ми зможемо створити об'єднану армію."
 UAR_chaotic_politics: "Хаотична політика"
 UAR_chaotic_politics_desc: "Хоча наші амбіції щодо створення держави для всіх арабів є гідним завданням, ми не можемо ігнорувати вигрібну яму нашої нинішньої політики. Хоча наші спроби приборкати та інтегрувати різні політичні утворення всередині держави спочатку виявляться складними, у довгостроковій перспективі наші зусилля принесуть свої плоди."
