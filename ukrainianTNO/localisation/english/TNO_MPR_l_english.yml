 ## Decisions ##
 RUS_murmansk_crisis_category: "§BМурманська криза§!"
 RUS_murmansk_crisis_category_desc: "Російський народ Карелії втомився жити під фінською окупацією, і коли Західна Росія об'єдналася під нашим прапором, він побачив шанс возз'єднатися з Батьківщиною та підняв повстання. Тепер Мурманська народна республіка воює проти чисельно переважаючих сил і краще оснащених військ, і без нашої підтримки її дні полічені. Хоча фінська армія менша за нашу, вона краще організована й користується підтримкою Антикомуністичної добровольчої гвардії в Онезі. Щоб втрутитися в Карелію, ми спочатку повинні організувати наші сили та підготувати їх до війни, водночас таємно надсилаючи Мурманську підтримку через Баренцове море для протидії фінському наступу. Щойно ми накопичимо достатньо §Bготовности§!, ми зможемо розпочати повномасштабне втручання та вступити у війну на боці Мурманська.\n\nПоточна §Bготовність:§! [?MPRInterventionProgress]%/100%.\nЩотижневий приріст §Bготовности§!: [?MPRInterventionProgressGain]%"

 WSR_intervention_timer: "Розпочати §Bповномасштабне втручання§!"
