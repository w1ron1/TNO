 ### Ideas ###
 LIB_idea_gridlocked_politics: "Патова політика"
 LIB_idea_gridlocked_politics_desc: "В одній мізерній західноафриканській державі може процвітати багато ідей, але партія однієї людини створила з них цілу династію. Більше десяти років партія Справжніх віґів Вільяма Табмена домінувала в усіх аспектах ліберійської політики, і жодна інша політична організація не набрала достатньо влади, щоб зрівнятися з партією. Влада Табмена над Ліберією сильна, майже необмежена, і їй можна протистояти лише волею власного народу. Поки маси не організуються достатньо, щоб виступити проти нього, влада Табмена просто абсолютна"
 LIB_idea_ofn_support: "Допомога ОВН"
 LIB_idea_ofn_support_desc: "Історично Ліберія є продуктом бридкого американського кольонізаційного товариства 19 століття. Навіть його столиця названа на честь колишнього американського президента Джеймса Монро. Таким чином, не дивно, що Ліберія користується милостивою підтримкою ОВН під керівництвом Америки. Однак Ліберія з тих пір відійшла від свого американського коріння і більше пішла на власний шлях, проводячи політику відкритих дверей з іншими державами. У міру того як Табмен виходить на нові ринки, ОВН повільно відступає"
 LIB_idea_widespread_corruption: "Широко поширена корупція"
 LIB_idea_widespread_corruption_desc: "Воротами до абсолютної влади в Ліберії є масштабна корупція; без корупції уряд впаде. Оскільки Табмен має майже повний контроль над Ліберією, він може укласти будь-яку угоду, якщо вона йому вигідна. Він регулярно запрошує іноземні компанії купувати землю в Ліберії, крадучи владу у народу та ігноруючи історичні договори. Сам Табмен часто наживається на цих оборудках, залишаючи розлючені маси терпіти. Із кожною новою угодою народні голоси стають усе гучнішими..."
 LIB_idea_usa_resource: "Американська воєнна підтримка"
 LIB_idea_usa_resource_desc: "Єдине, чого нам не можуть забезпечити американці, то це людей, тому, вони надсилають нам гармати та ракети. Хоча ми все ще не можемо перемогти панафриканців самостійно, але це принаймні дає нам шанс утримати лінію, доки ОВН не надасть людей"
