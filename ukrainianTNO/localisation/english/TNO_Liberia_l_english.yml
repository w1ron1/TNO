 ## Опис лідерів ##
 POLITICS_WILLIAM_TUBMAN_DESC: "Є багато речей, якими можна охарактеризувати Вільяма Тубмана. Корумпований — одна з них. Суперечливий — інша. Та дурнем він не є.\n\nНароджений у військово-політичній родині 1895 року, Вільям пішов шляхом свого батька, ставши сенатором у 1923 році - наймолодшим сенатором в історії Ліберії. Відтоді його політична кар'єра продовжувала зростати, і в 1942 році він став президентом у той час, коли Друга світова лютувала навколо Ліберії. Як тільки Тубман увійшов до офісу, на заході Африці порядок порушився: і стількох біженців у історії Африки ніхто й не видів, що загрожували затопити крихітну країну. Проте Тубман зумів провести державни корабель через штормові води післявоєнного порядку, допомагаючи своїм друзям у ОВН.\n\nТубман став дедалі авторитарнішим і ізоляціоністським, віддаляючись від Організації вільних націй, на користь благодатної нейтральності. Сьогодні Ліберія — країна, де ніхто не ставить під сумнів Тубмана. Не тому, що немає опозиції. Швидше тому, що ті, хто наважуються кинути виклик - занадто слабкі, щоб забезпечити підтримку опозиції, чи корумповані настільки, аби отримати "подаруночки" від адміністрації Тубмана й - випадково, завершити свою кар'єру. Або помирають в нещасних випадках, якщо відмовляються від грошей.\n\nСьогоднішня Ліберія процвітає - мирна й об'єднана під Тубманом. Хай там грець, найбагатша держава в Західній Африці, Ліберія має чималий торговий вплив на Золотому Березі. Попри всі різнобічності між ліберійцями, Тубман є батьком сучасної Ліберії. Ця система й залежить від здоров'я Тубмана, і якщо (або коли), він урешті-решт відійде зі світу цього, золота епоха Ліберії стукнеться об голови ліберійців."

