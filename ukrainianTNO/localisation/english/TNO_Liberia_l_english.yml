 ### Ідеї ###
 LIB_idea_gridlocked_politics: "Політика під замком"
 LIB_idea_gridlocked_politics_desc: "Багато ідей процвітатимуть в одній маленькій державі на заході Африки, але одна партія людини побудувала династію з них. Упродовж більше десяти років, партія "Справжні віги" Вільяма Тубмана панує в усіх аспектах ліберійської політики, і жодна інша політична організація не набрала достатньої могутності, аби посперечатися з нею. Влада Тубмана в Ліберії сильна - майже безмежна, і їй можна протистояти лиш волею його народу. Доки маси не організуються достатньо, щоб виступити проти нього, влада його є абсолютною."
 LIB_idea_ofn_support: "Підтримка ОВН"
 LIB_idea_ofn_support_desc: "Історично, Ліберія - продукт ганебного американського колонізаційного товариства часів 19-го століття. Навіть її столиця названа на честь колишнього президента США, Джеймса Монро. Тому не дивно, що Ліберія користується великою підтримкою американського ОВН. Ліберія, утім, вже відійшла від своїх американських коренів, і шукає власного шляху, прагнучи відкритої політики для інших держав. Із розширенням нових ринків Тубманом, Організація вільних націй поступово віддаляється від неї."
 LIB_idea_widespread_corruption: "Усеосяжна корупція"
 LIB_idea_widespread_corruption_desc: "Ключ до необмеженної влади в Ліберії — її широка корупція. Без корупції уряд повалиться й не встане. Оскільки Тубман практично повністю контролює Ліберію, він може укласти будь-яку угоду, яка йому вигідна. Регулярно запрошує іноземні компанії купувати землю в Ліберії, крадучи владу в народу й ігноруючи історичні договори; Тубман сам часто отримує прибуток від цих угод, залишаючи обурене населення наодинці з його проблемами. Голос народу з кожною угодою все гучнішає..."
 LIB_idea_usa_resource: "Американська військова підтримка"
 LIB_idea_usa_resource_desc: "Те, що американці не можуть надіслати нам у вигляді людей, вони відправляють в вигляді зброї й бомб. Хай ми все ще не здатні перемогти панафриканців самі, це принаймні дає нам шанс утримати лінію до того часу, поки ОВН не прибуде в своїй силі."