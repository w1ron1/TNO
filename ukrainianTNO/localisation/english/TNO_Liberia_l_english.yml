 ## Leader Descs ##
 POLITICS_WILLIAM_TUBMAN_DESC: "Вільяма Табмена можна характеризувати по всякому. Корупція – одна з його особливостей. Але цікавим є інше. Цей дурень не один.\n\nУ 1895 році Вільям народився водночас у військовій, але при цьому й політичній родині, і, пішовши шляхом свого батька, балотуючись, він отримав місце в сенаті в 1923 році, ставши наймолодшим сенатором в історії Ліберії. Відтоді його політична кар'єра лише продовжувала рости, аж допоки він не став президентом у 1942 році, коли навколо Ліберії вирувала світова війна. Щойно Табмен увійшов до офісу, як порядок у Західній Африці впав, і криза біженців, якої ніколи не було в історії Африки, загрожувала поглинути крихітну націю. Однак Табмен керував державою немов кораблем у цім бурхливім морі післявоєнного ладу за допомогою своїх товаришів з ОВН.\n\nПроте з часом Табмен ставав більш авторитарним та більш ізоляціоністським, віддаляючись від ОВН на користь блаженного нейтралітету. У сучасній Ліберії Табмену ніхто не кидає виклик. Це не тому, що проти Табмена немає опозиції. Це скоріше тому, що будь-хто, хто наважиться кинути йому виклик, або занадто кволий, щоб керувати голосуванням опозиції, або підкуплений адміністрацією Табмена, або гине внаслідок нещасних випадків, якщо відмовиться від грошей.\n\nСьогоднішня Ліберія процвітаюча, спокійна та об’єднана під керівництвом Табмена. Безсумнівно, найбагатша держава в Західній Африці, Ліберія має потужний торговельний вплив на Золотому березі. Адже, незважаючи на всі відмінності між ліберійським народом та його владою, Табмен є батьком сучасної Ліберії. Звичайно, ця система залежить від подальшого здоров’я Табмена, і якщо – чи точніше коли – він нарешті покине нас, ліберійський золотий німб може з гуркотом впасти на голови ліберійців."

