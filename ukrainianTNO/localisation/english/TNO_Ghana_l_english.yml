 ## Опис лідерів ##
 POLITICS_KOMLA_AGBELI_GBEDEMAH_DESC: "Політика Гани, як і її історія, є заплутаною. Це суміш британської колонії Золотої Узбережжя і Того, колишньої німецької колонії, що стала французькою колонією, поки в період війни не отримала свою незалежність. Коли хаос бомбардувань змусив обидва уряди співпрацювати, вони створили націю з двох частин, і народилася Республіка Гана. Місцева Об'єднана Партія Золотої Узбережжя (UGCC) була покликана створити сильну і незалежну республіку, і вони дійсно це зробили.\n\nАле насправді, за лаштунками UGCC контроль над усіма важливими аспектами політики Гани здійснює коаліція політичних сильних людей, відома як «Велика Шістка». Навіть перемога в виборах 1956 року Комли Агбелі Гбедемаха, прозваного «Афро Гбедем», була частиною їхнього плану. Гбедемах почав з деревного бізнесу, але приєднавшись до UGCC швидко піднявся по службі, завдяки дружбі з кількома членами Великої Шістки, такими як Едвард Акуфо-Аддо, попередній президент, та Кваме Нкрума, засновник Партії Конвенції Народу. Завдяки боргам перед ними, Афро Гбедем бажав зберегти Акуфо-Аддо на посаді прем'єр-міністра, однак він пообіцяв повну підтримку Кваме Нкрума для реалізації його бачення антиколоніальної та соціалістичної Гани, що суперечить ліберальній та про-західній позиції Гбедемаха.\n\nБездіяльність фракції Гбедемаха призвела до повного падіння підтримки його партії і зростання популярності опозиції. Напруга зростає в Того, а армія готується до найгіршого. Афро Гбедем повинен діяти швидко, якщо не хоче, щоб його плани почали руйнуватися та обрушилися на нього та Велику Шістку."

