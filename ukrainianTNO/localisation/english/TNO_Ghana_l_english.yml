 ### Ідеї ###
 EWE_idea_language_barrier: "Мовний бар'єр"
 EWE_idea_language_barrier_desc: "Корені Гани походять з двох різних європейських культур: країна утворилася з британської колонії Золотого узбережжя та Французького Того. Без єдиного стандарту мови, адміністрація Гани поділена на дві системи, що робить об'єднуючу реформу майже неможливою. Для такої двомовної країни, як Гана, потрібен час для стандартизації, і хоча вона зробила перші кроки до об'єднання, ще далеко до того, щоб її уряд міг ефективно координувати."
 EWE_idea_bloated_high_command: "Перебільшене командування"
 EWE_idea_bloated_high_command_desc: "Багато конфліктів стояло на шляху до об'єднання Гани, і кожна нова битва приносила величезне підвищення в званні. Армія Гани є незвичною тим, що вона надзвичайно вершинна, з численними високопосадовцями. Багато зі знаних офіцерів прагнуть встановити домінування над іншими такими ж офіцерами, що призводить до численних суперечок і фракцій. Це створило неефективну й незлагоджену армію в Гані."
