 ## Опис лідерів ##
 POLITICS_KOMLA_AGBELI_GBEDEMAH_DESC: "Політика Гани, як і її історія, є заплутаною. Це суміш британської колонії Золотого узбережжя й Того, колишньої німецької колонії, що стала французькою, длки в період війни не отримала свою незалежність. Коли хаос бомбардувань змусив обидва уряди співпрацювати, вони створили націю з двох частин, і народилася Республіка Гана. Місцева Об'єднана партія Золотого узбережжя (ОПЗУ) була покликана створити сильну й незалежну республіку, і вони дійсно це зробили.\n\nАле насправді, за лаштунками ОПЗУ контроль над усіма важливими аспектами політики Гани здійснює коаліція політично сильних людей, відома як "Велика Шістка". Навіть перемога на виборах 1956 року Комли Агбелі Гбедемаха, прозваного "Афро Гбедем", була частиною їхнього плану. Гбедемах почав із деревного бізнесу, але приєднавшись до ОПЗУ швидко піднявся по службі, завдяки дружбі з кількома членами Великої Шістки, такими як: Едвард Акуфо-Аддо - попередній президент, та Кваме Нкрума - засновник Партії конвенції народу. Завдяки боргам перед ними, Афро Гбедем бажав зберегти Акуфо-Аддо на посаді прем'єр-міністра, однак він пообіцяв повну підтримку Кваме Нкрумі для реалізації його бачення антиколоніальної та соціялістичної Гани, що суперечить ліберальній та прозахідній позиції Гбедемаха.\n\nБездіяльність фракції Гбедемаха призвела до повного падіння підтримки його партії й зростання популярності опозиції. Напруга зростає в Того, а армія готується до найгіршого. Афро Гбедем повинен діяти швидко, якщо не хоче, щоб його плани почали руйнуватися та обрушилися на нього й Велику Шістку."

