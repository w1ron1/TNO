 ### Ideas ###
 FTF_idea_murtalas_realm: "Володіння Муртали"
 FTF_idea_murtalas_realm_desc: "Фута-Масіна завдячує своїм існуванням рішенню молодого офіцера Сокото підняти повстання після того, як у 50-х роках він став свідком вигнання свого народу після рейдів Камеруну та того, як із ним поводився уряд Сокото. Цей офіцер, Муртала Мухаммед, належав до правлячої родини серед фульбе, тож він швидко зміг об'єднати навколо своєї особи націю посеред пустель. Саме тут народилася Фута-Масіна, знову вільна."
 FTF_idea_nascent_nationalism: "Зародковий націоналізм"
 FTF_idea_nascent_nationalism_desc: "Фута-Масіна хоче того, чого хоче Муртала, а Муртала хоче лише одного: щоб його народ міг самостійно обирати власну долю. Націоналізм як концепція в Африці ще молодий, і його неможливо встановити за один день.\n\nПопри ці проблеми, Муртала продовжує зосереджуватися на зміцненні масінської ідентичности, сподіваючись, що його зусилля незабаром достатньо легітимізують цю ідентичність, щоб вона стала повноцінною нацією."
