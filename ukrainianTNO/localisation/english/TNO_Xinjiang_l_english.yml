 POLITICS_ZHANG_ZHIZHONG_DESC:0 "Чжан Чжіжун, що народився в провінції Аньхой у 1890 році, був одним із багатьох молодих китайців, чия нація втратилася для них, під час хаосу епохи вождів. На відміну від безлічі своїх однолітків, одначе, боротьба того часу ніколи не закінчувалась для нього. Чжан навчався в Баодінській військовій академії, і майже одразу після її закінчення, потрапив у саме серце хаосу Китаю початку двадцятого століття. Служивши в Національній революційній армії Гоміньдану з відвагою та мужністю, він брав участь в легендарному Північному поході, а потім виставив свою зброю від співвітчизників, на японську навалу під час Антияпонської війни.\n\nНаступ японців був жорстоким, невідворотним, але Чжан Чжіжун твердо стояв у провінції Хунань, утримуючи лінію проти самої долі місяцями. Єдина помилка, одна зіпсована комунікація - усе це в кінці кінців і зруйнувало. Побоюючись падіння Чанша, Чжан Чжіжун віддав наказ спалити найцінніші активи міста, доки японці не змогли захопили його, незважаючи на відсутність подібного ризику захоплення. І генерал мусив не лише справлятися з приниженням від цієї помилки, але це також паралізувало його здатність належно захищати Хунань. Чжан Чжіжун, утім, не зупинився. Він може перенести свою блротьбу на північний захід, і ніколи не зрадити своїх.\n\nСіньцзян — неприємне місце, ще більше для такого чужака, як Чжан. Його армія не на самоті, а він знаходиться в незручній ситуації, коли необхідно вести переговори між Гоміньданом, останніми рештками Комуністичної партії та місцевими національними меншинами, на яких вони покладаються. Чжан Чжіжун бере дні такими, якими вони є - крок за кроком, і сподівається, що довга дорога, якою він маршируэ, наблизить його до відродження нації."
 
