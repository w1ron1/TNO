 ### Country Names ###
 AZR: "Азербайджан"
 AZR_DEF: "Азербайджан"
 AZR_ADJ: "Азербайджанськ."

 ### Characters ###
 AZR_Bakhtiyar_Vahabzadeh: "Бахтіяр Вагабзаде"

 ## Leader Descs ##
 POLITICS_BAKHTIYAR_VAHABZADEH_DESC:0 "Бахтіяр Вагабзаде зростав із двома пристрастями: до художнього слова та азербайджанського народу. Він мріяв про те, щоб його п'єси й поезія публікувалися без страху цензури чи переслідувань, і прагнув дня, коли Азербайджаном правитимуть азербайджанці заради азербайджанців. Він саме починав навчання в університеті, коли німці захопили Баку, без розбору хапаючи "партизанів" (часто просто будь-якого чоловіка призовного віку, який не був раболіпним колабораціоністом) і відправляючи їх на смерть під дулом гвинтівки або в глибинах шахти. Лише завдяки щасливому випадку Вагабзаде зміг утекти й сховатися в малонаселених гірських селах, населення яких розрослося через наплив біженців.\n\nТут життя тривало з певною подобою нормальності, за винятком періодичних німецьких терористичних бомбардувань. Саме тут Вагабзаде зміг знову взятися за написання віршів, друкуючи їх на примітивних друкарських машинках і поширюючи сусідніми селами. Його красномовство та палкий патріотизм почали створювати йому репутацію, а його твори декламували в селах по всій азербайджанській сільській місцевості. І коли партизани змогли відбити міста в німців, вони декламували його вірші на знак святкування.\n\nБачення Вагабзаде нарешті ставало реальністю: Азербайджан був вільним і незалежним. Але що важливіше, вони хотіли, щоб саме він очолив його. Він погодився, хоча й нарікав, що це відкладе завершення його останньої поетичної збірки. І тепер замість анти-німецької літератури він складає стратегії битв і закони."
