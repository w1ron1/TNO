 COG_resource_buying_category:0 "Ресурси з Німеччини"
 COG_resource_buying_category_desc:0 "§nЦентральнафрика§! є, мабуть, найрозвиненішим із трьох африканських Райхскомісаріатів за рівнем §Yрозвитку та видобутку ресурсів§!, і це принесло значну користь адміністрації Центральноїфрики, адже ми стали §Yнайбільш економічно розвиненою колонією§! в §jАфриці§!.\n\nОднак ресурси, які видобуваються в серці Африки, є цілковито §xнепридатними§! для §gвійськового нарощування§! з метою оборони. §rРайх§! має їх у достатній кількості, і нам, можливо, варто закуповувати ресурси, щоб ми могли захистити себе від будь-якої загрози §nволодінням Райху в Африці.§!"
