 afrika_RK_cash_need_5:0 "Ми маємо §Y5 мільйонів доларів§! §Wіз наших ліквідних резервів.§!"
 afrika_RK_resource_5:0 "Придбання ресурсів у Німеччини коштуватиме §Y5 мільйонів доларів§! §Wіз наших ліквідних резервів.§!"

 GRO_resource_buying_category:0 "Ресурси з Німеччини"
 GRO_resource_buying_category_desc:0 "Величезні простори земель у §jАфриці§!, якими ми керуємо з §YБулерґраду§!, §Yсправді багаті на природні ресурси та багатства§!, і всі вони є надзвичайно прибутковими для §nОстафрики§!, щоб утримувати свої володіння на континенті.\n\nОднак існує очевидна проблема: багато з цих ресурсів §xнеспроможні виробляти військові матеріали§!, які можуть знадобитися нам у §eнайближчому майбутньому§!. У такому разі ми звертаємося до наших благодійників у §rРайху§!. Вони радо нададуть будь-які ресурси, які можуть знадобитися їхньому найважливішому володінню в Африці, §Yзвісно, за відповідну ціну§!."
