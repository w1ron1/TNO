 sp_air_bouncing_bomb: "Стрибуча бомба"
 sp_air_bouncing_bomb_desc: "Бомба, здатна підстрибувати на поверхні води, може стати ідеальною зброєю проти захищених дамб і знадобитися в інших ситуаціях."
