 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward: "Технічний прорив у конструкції пульсуючого двигуна"
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc: "Наші інженери подолали значні труднощі в проєктуванні пульсуючого повітряно-реактивного двигуна ракети, критично важливого для її дальности й швидкости."
