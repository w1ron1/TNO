 ###### TRAITS ########
 ## General Traits
 scientist_trait_genius: "Геній"
 scientist_trait_genius_desc: "Далекоглядний розум, що розсуває межі науки й техніки незрівнянними нововведеннями. Такий талант з’являється лише раз на покоління."
 scientist_trait_gifted_engineer: "Обдарований інженер"
 scientist_trait_gifted_engineer_desc: "Інженер із природним талантом, вправний у розв’язанні складних технічних проблем у різних галузях."
 scientist_trait_brilliant_theorist: "Видатний теоретик"
 scientist_trait_brilliant_theorist_desc: "Майстер абстрактних понять і теорій, здатний докорінно змінити військову стратегію та наукові дослідження."
 scientist_trait_bright: "Кмітливий"
 scientist_trait_bright_desc: "Проникливий науковець зі швидким мисленням, який чудово опановує нові поняття й ефективно їх застосовує."
 scientist_trait_fast_learner: "Швидко навчається"
 scientist_trait_fast_learner_desc: "Швидко пристосовується до нових викликів, навчається швидше за колег і досягає успіху в різних наукових галузях."
 scientist_trait_resourceful: "Винахідливий"
 scientist_trait_resourceful_desc: "Завжди знаходить творчі рішення, навіть за нестачі ресурсів чи в скрутних обставинах."

 ## Specialist Traits
 # Theory
 scientist_trait_nuclear_specialist: "Фахівець із ядерних технологій"
 scientist_trait_nuclear_specialist_desc: "Фізик на передовій атомних досліджень, глибоко занурений у вивчення ядерного поділу й ланцюгових реакцій."
 scientist_trait_nuclear_warfare_expert: "Експерт із ядерної зброї"
 scientist_trait_nuclear_warfare_expert_desc: "Експерт із практичного застосування ядерної фізики для розробки зброї, що спеціялізується на теоретичних засадах конструювання атомної бомби."
 scientist_trait_nuclear_power_expert: "Експерт із ядерної енергетики"
 scientist_trait_nuclear_power_expert_desc: "Провідний авторитет у ядерній фізиці, обізнаний із ядерним поділом і зосереджений на виробництві енергії."
 scientist_trait_pro_nuclear_disarmament: "Прихильник ядерного роззброєння"
 scientist_trait_pro_nuclear_disarmament_desc: "Цей науковець особисто виступає проти військового застосування ядерної фізики, тож такі проєкти під його наглядом просуватимуться повільніше."
 scientist_trait_biology_expert: "Експерт із біології"
 scientist_trait_biology_expert_desc: "Експерт із вивчення живих організмів, що спеціялізується на біологічних науках та їхньому застосуванні в медицині й біотехнологіях."
 scientist_trait_chemistry_expert: "Експерт із хемії"
 scientist_trait_chemistry_expert_desc: "Експерт із вивчення речовини та її взаємодій, що спеціялізується на хемічних реакціях і їхньому застосуванні в різних галузях."
 scientist_trait_physics_expert: "Експерт із фізики"
 scientist_trait_physics_expert_desc: "Науковець на передовій теоретичної та прикладної фізики, що спеціялізується на фундаментальних принципах матерії й енергії."
 scientist_trait_archaeology_expert: "Експерт з археології"
 scientist_trait_archaeology_expert_desc: "Досвідчений археолог, що спеціялізується на пошуку решток стародавніх цивілізацій."

 # Electronics
 scientist_trait_telecommunications_specialist: "Фахівець із телекомунікацій"
 scientist_trait_telecommunications_specialist_desc: "Спеціялізується на системах зв’язку, радіо й авіоніки, вкрай потрібних для сучасної війни."
 scientist_trait_computing_specialist: "Фахівець з обчислювальної техніки"
 scientist_trait_computing_specialist_desc: "Інженер, що спеціялізується на проєктуванні й створенні комп’ютерних систем та здатний розробляти передові обчислювальні рішення для різноманітних завдань."
 scientist_trait_gadget_specialist: "Фахівець з електронних пристроїв"
 scientist_trait_gadget_specialist_desc: "Фахівець із проєктування й розробки електронних пристроїв і приладів різних типів."
 scientist_trait_electromagnetism_specialist: "Фахівець з електромагнетизму"
 scientist_trait_electromagnetism_specialist_desc: "Фахівець із принципів електромагнітних хвиль та їхнього застосування у військовій техніці, зокрема в радарних і лазерних системах."

 # Materiel
 scientist_trait_equipment_specialist: "Фахівець із піхотного спорядження"
 scientist_trait_equipment_specialist_desc: "Досвідчений інженер зі знаннями в проєктуванні й розробці піхотного спорядження, зокрема вогнепальної зброї, бронежилетів та іншого особистого спорядження."
 scientist_trait_armored_specialist: "Фахівець із бронетехніки"
 scientist_trait_armored_specialist_desc: "Досвідчений інженер, що спеціялізується на проєктуванні й удосконаленні танків та іншої бронетехніки."
 scientist_trait_artillery_specialist: "Фахівець з артилерії"
 scientist_trait_artillery_specialist_desc: "Фахівець з артилерійських систем із досвідом удосконалення далекобійної вогневої міці й великокаліберних гармат."
 scientist_trait_submarine_specialist: "Фахівець із підводних човнів"
 scientist_trait_submarine_specialist_desc: "Фахівець із підводної війни, зосереджений на розробці нових технологій підводних човнів для посилення їхньої ролі в прихованих морських операціях."
 scientist_trait_surface_ship_specialist: "Фахівець із надводних кораблів"
 scientist_trait_surface_ship_specialist_desc: "Спеціялізується на проєктуванні, розробці й застосуванні великих надводних бойових кораблів, а також дослідженні нових технологій для оснащення військових суден."

 # Aerospace
 scientist_trait_aircraft_specialist: "Фахівець з авіяції"
 scientist_trait_aircraft_specialist_desc: "Фахівець з аеродинаміки й конструювання літаків, здатний розробляти досконаліші планери, двигуни та конструкції задля панування в небі."
 scientist_trait_rocketry_specialist: "Фахівець із ракетобудування"
 scientist_trait_rocketry_specialist_desc: "Спеціялізується на ракетній техніці, зосереджуючись на принципах тяги в програмах балістичних і керованих ракет."
 scientist_trait_helicopter_expert: "Експерт із гелікоптерів"
 scientist_trait_helicopter_expert_desc: "Піонер гвинтокрилої авіяції, що спеціялізується на механіці вертикального польоту, системах несучих ґвинтів і ранніх моделях гелікоптерів."
 scientist_trait_satellite_expert: "Фахівець із супутників"
 scientist_trait_satellite_expert_desc: "Фахівець із проєктування й застосування супутників для різних цілей, зокрема навігації, зв’язку та досліджень."
 scientist_trait_exploration_expert: "Фахівець із дослідження космосу"
 scientist_trait_exploration_expert_desc: "Фахівець із проєктування апаратів та обладнання для освоєння й дослідження безкрайого космосу."


