 sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Радіоактивний витік під контролем"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "На жаль, під час роботи з реактором стався серйозний інцидент. Завдяки швидкій реакції персоналу шкоду вдалося обмежити, а команда отримала цінні дані з цієї пригоди."
 sp_nuclear_reactor_minor_explosion_reward: "Невеликий вибух без постраждалих"
 sp_nuclear_reactor_minor_explosion_reward_desc: "Під час роботи над останнім етапом розробки прототипу ядерного реактора стався невеликий інцидент. Незначний вибух пошкодив частину лабораторії, але пожежу, що виникла після нього, легко загасили. Щойно лабораторію відремонтують, робота зможе тривати за планом, із невеликою затримкою."
