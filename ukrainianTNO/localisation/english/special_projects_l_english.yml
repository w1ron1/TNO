 sp_air_earthshaker_bomb: "Сейсмічна бомба"
 sp_air_earthshaker_bomb_desc: "Важка бомба, сконструйована так, щоб перед вибухом проникати в ґрунт і завдавати цілі величезних конструктивних пошкоджень. Ця бомба здатна руйнувати велетенські гарматні позиції й ракетні бази."
 sp_air_earthshaker_bomb_completion_tt: "Відкриває рейди §Y$raid_type_mega_gun_emplacement_strike$§!"
 sp_air_earthshaker_bomb_no_bba: "$sp_air_earthshaker_bomb$"
