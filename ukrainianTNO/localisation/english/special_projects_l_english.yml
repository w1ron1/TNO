 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc: "Новий метод армування, відкритий одним із молодших інженерів, передано сторонній дослідницькій групі для подальшої оцінки. Хоча висновки ще перевіряють, метод можна застосувати в поточному проєкті, якщо його визнають придатним."
 sp_land_reward_option_stronghold_network_collapse_01: "Обвал під час будівництва тунелю"
 sp_land_reward_option_stronghold_network_collapse_01_desc: "Тунель під одним із головних бункерів несподівано обвалився, поховавши під завалами кількох робітників і головного науковця [Character.GetName], під чиїм наглядом велися роботи. Щоб урятувати людей, потрібні надзвичайні заходи, але ця пригода вже затримала загальний поступ робіт."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist: "Спершу врятувати головного науковця"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety: "Надати пріоритет безпеці робітників"
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay: "Продовжувати без зволікань"
 sp_land_reward_option_stronghold_network_collapse_02: "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc: "Тунель під одним із головних бункерів несподівано обвалився, заблокувавши кількох робітників і зупинивши будівництво. Потрібні надзвичайні заходи, щоб владнати ситуацію й безпечно визволити людей, але ця пригода вже затримала загальний поступ робіт."

