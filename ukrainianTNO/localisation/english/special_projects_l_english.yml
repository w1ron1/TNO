 sp_rockets_experimental_rockets: "Експериментальні ракети"
 sp_rockets_experimental_rockets_desc: "$experimental_rockets_desc$"
 sp_rockets_flying_bomb: "Летюча бомба"
 sp_rockets_flying_bomb_desc: "Безпілотний літальний апарат із ракетним двигуном і значним бойовим навантаженням має вселити страх у серця ворогів і завдати удару, що прокладе шлях до перемоги."
 GER_sp_rockets_flying_bomb: "Проєкт V-1"
 GER_sp_rockets_flying_bomb_desc: "Vergeltungswaffe 1. Летюча бомба з ракетним двигуном, здатна вражати ворогів на відстані й нищити їхню військову промисловість без потреби в навчених пілотах. Це справді зброя, здатна змінити результат війни."
 sp_rockets_ballistic_missile: "Балістична ракета"
 sp_rockets_ballistic_missile_desc: "Керована балістична ракета, здатна доставляти бойову частину з великої відстані з небаченою швидкістю й точністю."
 GER_sp_rockets_ballistic_missile: "Проєкт V-2"
 GER_sp_rockets_ballistic_missile_desc: "Vergeltungswaffe 2. Керована балістична ракета, здатна доставляти бойову частину з великої відстані з небаченою швидкістю й точністю."

 sp_rockets_medium_range_ballistic_missile: "БРСД"
 sp_rockets_medium_range_ballistic_missile_desc: "Балістичні ракети середньої дальности дозволять доставляти бойову частину через континент із разючою точністю та нищівною дією."

 sp_rockets_long_range_ballistic_missile: "МБР"
 sp_rockets_long_range_ballistic_missile_desc: "Міжконтинентальна балістична ракета — ймовірно, найбільша ракета, яку нам коли-небудь доведеться створити. Вона зможе з високою точністю доставити бойову частину практично в будь-яку точку земної кулі."

 sp_rockets_ground_to_air_missile: "Зенітні керовані ракети"
 sp_rockets_ground_to_air_missile_desc: "Велика зенітна керована ракета з ракетним двигуном, здатна збити бомбардувальник одним влучанням. Вона безперечно визначить майбутнє протиповітряної оборони."
 GER_sp_rockets_ground_to_air_missile: "Проєкт «Вассерфаль»"

 sp_rocket_interceptor: "Ракетний перехоплювач"
 sp_rocket_interceptor_desc: "Поєднавши потужність ракети з маневреністю малого планера, ми створимо неперевершений літак-перехоплювач."


