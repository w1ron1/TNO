 sp_air_intercontinental_bomber: "Міжконтинентальний бомбардувальник"
 sp_air_intercontinental_bomber_desc: "Величезний літак із вантажем бомб і палива, спеціяльно спроєктований для далеких висотних польотів. Він здатний перетинати океани й континенти, а отже, вражати найвіддаленіші цілі, які колись вважали себе недосяжними й захищеними."

 sp_air_mothership_aircraft: "Літак-носій"
 sp_air_mothership_aircraft_desc: "Величезний літак, що доставляє винищувачі в бій, дозволяючи здійснювати супровід глибоко над ворожою територією, — справжній повелитель небесного рою."

 sp_air_jet_engine: "Реактивний двигун"
 sp_air_jet_engine_desc: "Реактивний двигун може стати революційним кроком в авіябудуванні: новий двигун на кілька порядків потужніший за гвинтовий і зрештою може прокласти шлях до нової доби авіяційної інженерії."

 sp_air_axial_jet_engine: "Осьовий реактивний двигун"
 sp_air_axial_jet_engine_desc: "Перші реактивні двигуни мають одну велику проблему: вони здатні стискати повітря лише до певної межі. Можливо, послідовне розміщення кількох компресорів дозволить ще збільшити тягу."

 sp_air_supersonic_jet: "Надзвуковий реактивний літак"
 sp_air_supersonic_jet_desc: "Ми здійснили значний прорив в авіяції, успішно розробивши літак, здатний досягати швидкости Мах 1 і долати звуковий бар’єр. Це досягнення знаменує перелом у повітряній війні, відкриваючи нову добу швидкости й тактичної переваги."

 sp_air_helicopter: "Гелікоптер"
 sp_air_helicopter_desc: "Від часів проєкту повітряного ґвинта Леонардо да Вінчі людство прагне підкорити небо. Хоча літак випередив гелікоптер, той залишається привабливим варіянтом із можливостями, суттєво відмінними від його авіяційних побратимів, передусім здатністю зависати на місці."


