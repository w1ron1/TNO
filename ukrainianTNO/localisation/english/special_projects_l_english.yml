 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Один із молодших інженерів відкрив новий метод армування, придатний для звичайних укріплень. Якщо задокументувати його зараз, наші науковці й інженери матимуть перевагу в майбутніх дослідженнях."
