 # Nuclear Projects
 sp_nuclear_project_events.1.t: "Витік інформації"
 sp_nuclear_project_events.1.desc: "Цілком випадково наші агенти в державі [FROM.GetNameDef] змогли здобути інформацію про ймовірний таємний проєкт. Працівник, залучений до розробки секретної зброї — атомної бомби, — розповів про свою роботу на невеликій дружній зустрічі, де також був один із наших агентів."
 sp_nuclear_project_events.1.a: "Це може стати в пригоді"


 ### OLD DEPRECATED STRINGS (Already translated)

 sp_land_generic_reward_scientist_xp_1_desc: "Прорив, якого вдалося досягти науковцю [Character.GetName], прискорив поступ і зміцнив [Character.GetHerHis] роль у новаторських розробках передового озброєння. З кожним відкриттям [Character.GetHerHis] інженерна майстерність зростає, визначаючи майбутнє військової техніки."
 sp_land_generic_reward_option_scientist_xp: "Знання — сила!"
 sp_land_generic_reward_option_scientist_xp_desc: "Прорив, якого вдалося досягти науковцю [Character.GetName], прискорив поступ і зміцнив [Character.GetHerHis] роль у новаторських розробках передового озброєння."
 sp_land_generic_reward_army_xp_1_desc: "Зустріч науковця [Character.GetName] з відібраною групою військових офіцерів для обговорення потенціялу проєкту [SpecialProject.GetName] дала важливі знання про використання нової технології в сухопутній війні. Їхня співпраця посилила наші військові можливості, забезпечивши готовність до майбутніх боїв."
 sp_land_generic_reward_option_army_xp_desc: "Зустріч науковця [Character.GetName] з відібраною групою військових офіцерів для обговорення потенціялу проєкту [SpecialProject.GetName] дала важливі знання про використання нової технології в сухопутній війні. Їхня співпраця посилила наші військові можливості, забезпечивши готовність до майбутніх боїв."
 sp_land_generic_reward_major_progress_1_desc: "Значний прорив, якого вдалося досягти науковцю [Character.GetName], суттєво просунув проєкт, підтвердив [Character.GetHerHis] фаховість і надихнув дослідницьку команду. Завдяки цьому поступу проєкт наближається до мети, зміцнюючи славу науковця [Character.GetName] як першопрохідця."
 sp_land_generic_reward_option_major_breakthrough_desc: "Значний прорив, якого вдалося досягти науковцю [Character.GetName], суттєво просунув проєкт, підтвердив [Character.GetHerHis] фаховість і надихнув дослідницьку команду. Завдяки цьому поступу проєкт наблизився до мети, зміцнивши славу науковця [Character.GetName] як першопрохідця."
 sp_land_generic_reward_test_failure_1_desc: "Під час випробувань сталася невелика невдача, що виявила несподівані вади прототипу, над яким працює [Character.GetName]. Ця затримка спонукає переглянути підхід і вдосконалити методи. Хоча поступ тимчасово сповільнився, засвоєні уроки в довгій перспективі зроблять проєкт міцнішим і стійкішим."
 sp_land_generic_reward_option_test_failure_desc: "Під час випробувань сталася невелика невдача, що виявила несподівані вади прототипу, над яким працює [Character.GetName]. Вона спонукала переглянути підхід і вдосконалити методи. Хоча поступ тимчасово сповільнився, засвоєні уроки в довгій перспективі зробили проєкт міцнішим і стійкішим."
 sp_land_generic_reward_armor_tech_1_desc: "Останні напрацювання за проєктом [SpecialProject.GetName], який очолює [Character.GetName], уможливили значні досягнення в суміжних галузях. Ці прориви докорінно змінюють військові можливості, прокладаючи шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_generic_reward_option_armor_tech_desc: "Останні напрацювання за проєктом [SpecialProject.GetName], який очолює [Character.GetName], уможливили значні досягнення в суміжних галузях. Ці прориви докорінно змінили військові можливості, проклавши шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_generic_reward_armor_bonus_1_desc: "Очолюючи передові дослідження, [Character.GetName] представляє революційні відкриття в галузі нових сплавів, покликаних докорінно змінити танкову броню. Вони обіцяють значний поступ у бронетанковій війні, засвідчуючи ключову роль науковця у формуванні її майбутнього."
 sp_land_generic_reward_option_armor_bonus_desc: "Запровадити цей новий сплав на наших виробничих лініях."
 sp_land_generic_reward_engine_bonus_1_desc: "Останні зміни експериментального двигуна прототипу [SpecialProject.GetName] значно поліпшили загальні характеристики танкових двигунів. Ретельна праця науковця [Character.GetName] та [Character.GetHerHis] команди розсунула межі інженерії й обіцяє ширші можливості, якщо впровадити ці нововведення в наші звичайні танкові двигуни."
 sp_land_generic_reward_option_engine_bonus_desc: "Почати виробництво цих поліпшених двигунів!"
 sp_land_generic_reward_resource_scarcity_desc: "Команда, яку очолює [Character.GetName], зіткнулася з нестачею критично важливих матеріялів для розробки проєкту [SpecialProject.GetName], змушуючи [Character.GetHerHim] шукати альтернативні джерела й розробляти нові виробничі методи для задоволення потреб."
 sp_land_generic_reward_option_resource_scarcity_desc: "Команда, яку очолює [Character.GetName], зіткнулася з нестачею критично важливих матеріялів для розробки проєкту [SpecialProject.GetName], змусивши [Character.GetHerHim] шукати альтернативні джерела й розробляти нові виробничі методи для задоволення потреб."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc: "Гармата [SpecialProject.GetName] щойно успішно пройшла ключове вогневе випробування, продемонструвавши разючу дальність і точність. Це досягнення піднесло дух дослідницької команди й привернуло увагу високопосадовців, давши проєкту поштовх і відновивши віру в його успіх."
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc: "Гармата [SpecialProject.GetName] успішно пройшла ключове вогневе випробування, продемонструвавши разючу дальність і точність. Це досягнення піднесло дух дослідницької команди й привернуло увагу високопосадовців, давши проєкту поштовх і відновивши віру в його успіх."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc: "Під час вирішального випробування полігон сколихнув катастрофічний вибух, що знищив гармату й завдав значної шкоди прилеглій інфраструктурі. Команда, яку очолює [Character.GetName], з’ясовує причину вибуху й долає наслідки інциденту, зокрема пильну увагу громадськости та можливі затримки в графіку проєкту."
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc: "Під час вирішального випробування полігон сколихнув катастрофічний вибух, що знищив гармату й завдав значної шкоди прилеглій інфраструктурі. Команді, яку очолює [Character.GetName], довелося з’ясовувати причину вибуху й долати наслідки інциденту, зокрема пильну увагу громадськости та можливі затримки в графіку проєкту."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "Науковцю [Character.GetName] вдалося здійснити важливий прорив у технології метальних зарядів, значно підвищивши швидкість і потужність снарядів гармати [SpecialProject.GetName]. Це досягнення відкриває нові можливості для ефективного застосування зброї на полі бою й прискорює завершення проєкту."
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "Науковцю [Character.GetName] вдалося здійснити важливий прорив у технології метальних зарядів, значно підвищивши швидкість і потужність снарядів гармати [SpecialProject.GetName]. Це досягнення відкрило нові можливості для ефективного застосування зброї на полі бою й прискорило завершення проєкту."
 sp_naval_generic_failure_nuclear_accident: "Локалізована ядерна аварія"

