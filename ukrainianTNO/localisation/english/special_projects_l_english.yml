########################
 sp_naval_cruiser_submarine: "Підводний крейсер"
 sp_naval_cruiser_submarine_desc: "Підводний човен зі збільшеною дальністю плавання, призначений долати великі відстані без підтримки, ідеально підійшов би для нападів на вороже судноплавство."
 sp_naval_cruiser_submarine_free_design: "Підводний крейсер"

 sp_naval_nuclear_submarine: "Атомний підводний човен"
 sp_naval_nuclear_submarine_desc: "Ми маємо змогу створити ядерні двигуни, достатньо малі для встановлення в спеціялізований корпус підводного човна. Це не лише дасть нам човен із надзвичайною дальністю плавання, а й зробить його безшумним."
 sp_naval_nuclear_submarine_free_design: "Атомний підводний човен"

 sp_naval_rocket_launching_submarine: "Ракетний підводний човен"
 sp_naval_rocket_launching_submarine_desc: "Оснастивши підводні човни ракетами та пусковими системами, ми зможемо без попередження вражати стратегічні цілі ворога будь-де."
 
 sp_naval_torpedo_cruiser: "Торпедний крейсер"
 sp_naval_torpedo_cruiser_desc: "Використовуючи торпедні крейсери згідно з концепцією минулого століття — Jeune École, ми зможемо завдавати значної шкоди найважливішим і найдорожчим кораблям ворога."
 sp_naval_torpedo_cruiser_free_design: "Торпедний крейсер"

 sp_naval_fleet_submarine: "Ескадрений підводний човен"
 sp_naval_fleet_submarine_desc: "Неповороткість наявних підводних крейсерів компенсується винятковою дальністю плавання й корисністю. Вершиною підводних нововведень став би далекохідний човен, здатний супроводжувати фльоту й позбавлений усіх вад, притаманних конструкції попереднього покоління човнів."
 sp_naval_fleet_submarine_free_design: "Ескадрений підводний човен"

 sp_naval_super_heavy_battleship: "Надважкий лінкор"
 sp_naval_super_heavy_battleship_desc: "Останніми роками морські перегони озброєнь, можливо, й стали різноманітнішими, але заперечити велич лінкора важко. Наші військово-морські теоретики запевняють, що можна створити ще більших морських велетнів."
 JAP_sp_naval_super_heavy_battleship: "Лінкор типу «Ямато»"
 sp_naval_super_heavy_battleship_tt: "Додати технологію: §Yнадважкий корпус§!"
 sp_naval_super_heavy_battleship_free_design: "Надважкий лінкор"

 sp_naval_nuclear_missile_submarine: "Ядерний ракетоносець"
 sp_naval_nuclear_missile_submarine_desc: "Якщо наш підводний човен зможе спливти, запустити ракету з ядерним зарядом і знову зануритися, можливості завдати першого удару стануть майже безмежними."
 
 sp_naval_modern_battleship: "Сучасний лінкор"
 sp_naval_modern_battleship_desc: "Хтось може вважати, що в майбутніх морських боях пануватимуть авіаносці, але ми переконаємо їх у протилежному. Ми розгромимо ворогів, побачимо, як їхні фльоти тікають у порти, і почуємо голосіння їхніх теоретиків!"
 sp_naval_modern_battleship_free_design: "Сучасний лінкор"

 sp_naval_midget_submarine: "Надмалий підводний човен"
 sp_naval_midget_submarine_desc: "У наших військово-морських можливостях є ніша для легкого, дешевого й універсального підводного човна. Країни по всьому світу починають експериментувати з подібними концепціями, використовуючи їх для всього — від диверсій у гаванях до нападів на конвої. Проте і тут є ложка дьогтю: дальність плавання."
 sp_naval_midget_submarine_free_design: "Надмалий підводний човен"

 sp_naval_nuclear_torpedo: "Ядерна торпеда"
 sp_naval_nuclear_torpedo_desc: "Поява тактичних боєголовок малої потужности створила нову спільну нішу в наших військово-морській та ядерній доктринах. Далекохідні торпеди з такими боєголовками теоретично можна застосовувати майже з будь-якого звичайного підводного човна."

 sp_naval_modern_carrier: "Сучасний авіаносець"
 sp_naval_modern_carrier_desc: "З подальшим розвитком технологій стає зрозуміло, що можливості наших авіаносців потребують значного розширення. Цього можна досягти лише встановленням додаткового обладнання, яке потребує більше місця, ніж є на звичайних авіаносцях."
 sp_naval_modern_carrier_free_design: "Сучасний авіаносець" 

 sp_naval_anechoic_tiles: "Звукопоглинальне покриття"
 sp_naval_anechoic_tiles_desc: "Це спеціяльне покриття з гумових плиток із невеликими порожнинами зменшує ризик виявлення підводних човнів ворожими сонарами."
 sp_naval_anechoic_tiles_non_mtg_tt: "Дозволяє поліпшувати прихованість підводних човнів до рівнів 6 і 7"
 
 sp_naval_aip_engine: "Повітронезалежна установка"
 sp_naval_aip_engine_desc: "Нова рушійна система, що може усунути вразливість підводних човнів, зумовлену потребою спливати для заряджання батарей і поповнення запасів кисню."
 sp_naval_aip_engine_non_mtg_tt: "Дозволяє поліпшувати двигуни підводних човнів до рівнів 6 і 7"
 
 sp_naval_ice_carrier: "Пайкеритовий авіаносець"
 sp_naval_ice_carrier_desc: "Щоб утвердити нашу перевагу в повітрі над безкраїми океанами, нам потрібні авіаносці, здатні розміщувати й запускати звичайні далекобійні літаки, а не лише палубну авіяцію."
 sp_naval_ice_carrier_free_design: "Пайкеритовий авіаносець" 
 ENG_sp_naval_ice_carrier: "Проєкт «Габаккук»"
 USA_sp_naval_ice_carrier: "Проєкт «Габаккук»"
 
 sp_naval_underway_replenishment: "Поповнення запасів на ходу"
 sp_naval_underway_replenishment_desc: "Постачання військово-морських сил далеко від рідних баз завжди було складним завданням і чинником, що обмежував їхні дії. Оскільки наші фльоти діють на величезних відстанях, потрібно розробити нові методи поповнення запасів."
 sp_naval_underway_replenishment_pick_a_tt: "$MODIFIER_UNDERWAY_REPLENISHMENT_RANGE$ §G+20%§!\n$MODIFIER_UNDERWAY_REPLENISHMENT_CONVOY_COST$ §R+10%§!"
 sp_naval_underway_replenishment_pick_b_tt: "$MODIFIER_UNDERWAY_REPLENISHMENT_RANGE$ §R-10%§!\n$MODIFIER_UNDERWAY_REPLENISHMENT_CONVOY_COST$ §G-20%§!"
 
 sp_naval_proximity_fuze: "Неконтактний підривач"
 sp_naval_proximity_fuze_desc: "Завдяки поліпшеним і надійнішим радіотехнологіям ми зможемо розробити новий тип підривачів, які спрацьовуватимуть уже поблизу цілі й завдаватимуть їй шкоди."
 sp_naval_proximity_fuze_custom_tt: "$MODIFIER_NAVY_ANTI_AIR_ATTACK$ §G+25%§!"


#################################
  ## NAVAL PROTOTYPE REWARDS ###
################################# 
 sp_naval_cruiser_submarine_unique_reward_a: "Порядок рейдерських дій"
 sp_naval_cruiser_submarine_unique_reward_a_desc: "Безсилля Лондонських морських договорів позбавило сенсу будь-які реальні обмеження палубного озброєння підводних човнів. Проте питання залишається: чи варто віддавати перевагу престижному озброєнню коштом тактичної дальности?"
 sp_naval_cruiser_submarine_preference_a: "Гнучкі операції"
 sp_naval_cruiser_submarine_preference_b: "Озброєння"
 
 sp_naval_fleet_submarine_unique_reward_a: "Принципи конструювання"
 sp_naval_fleet_submarine_unique_reward_a_desc: "Проєктуючи новий тип далекохідних підводних човнів, ми маємо знати, на чому зосередити зусилля. Чи повинні вони бути тихими й смертоносними мисливцями, чи ми хочемо більшої надійности та стійкости до небезпек?"
 sp_naval_fleet_submarine_preference_a: "Ударні можливості"
 sp_naval_fleet_submarine_preference_b: "Міцніша конструкція"

 sp_naval_nuclear_submarine_unique_reward_a: "Побоювання щодо вартости"
 sp_naval_nuclear_submarine_unique_reward_a_desc: "Ми працюємо над цілком новим типом підводного човна, і зростають побоювання, що зрештою вартість його будівництва буде надто високою. Як діяти далі з конструкцією? "
 sp_naval_nuclear_submarine_preference_a: "Заощадити на якості"
 sp_naval_nuclear_submarine_preference_b: "Дотриматися поточних планів"
 sp_naval_nuclear_submarine_preference_c: "Найвища якість"
 
 sp_naval_rocket_launching_submarine_unique_reward_a: "Питання доставки бойового навантаження"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc: "Мусимо відповісти на нагальне питання: як найкраще забезпечити, щоб ракети, запущені з підводних човнів, досягли ворога?"
 sp_naval_rocket_launching_submarine_preference_a: "Дальність"
 sp_naval_rocket_launching_submarine_preference_b: "Надійність"
 sp_naval_rocket_launching_submarine_preference_c: "Прихованість"

 sp_naval_nuclear_missile_submarine_unique_reward_a: "Уникнути полювання"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "Якщо ворог дізнається про наш запланований ядерний удар, він почне масштабний пошук наших ядерних ракетоносців. Щоб уникнути мисливців, потрібно..."
 sp_naval_nuclear_missile_submarine_preference_a: "Зачаїтися"
 sp_naval_nuclear_missile_submarine_preference_b: "Зберігати спокій"
 sp_naval_nuclear_missile_submarine_preference_c: "Витримати бурю"
 
 sp_naval_nuclear_torpedo_unique_reward_a: "Новий курс торпеди"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "Розробка ядерних торпед наближається до кінцевої мети проєкту, тож слід прагнути до..."
 sp_naval_nuclear_torpedo_preference_a: "Потужні боєголовки"
 sp_naval_nuclear_torpedo_preference_b: "Безпечніше зберігання"

 sp_naval_midget_submarine_unique_reward_a: "Умістити більше"
 sp_naval_midget_submarine_unique_reward_a_desc: "Ми зрозуміли, що можемо спеціялізувати окремі компоненти наших надмалих підводних човнів, хоча це потребуватиме певних компромісів."
 sp_naval_midget_submarine_preference_a: "Трохи прихованіші"
 sp_naval_midget_submarine_preference_b: "Менший ризик вибуху"
 sp_naval_midget_submarine_preference_c: "Трохи більша дальність"
 

 sp_naval_aip_engine_unique_reward_a: "Незалежні поліпшення"
 sp_naval_aip_engine_unique_reward_a_desc: "Наші науковці, що працюють над цією технологією, поділилися висновками з колегами, які вдосконалюють звичайніші двигуни. Та поки не затамовуйте подих: від цих поліпшень його навряд чи перехопить."
 sp_naval_aip_engine_preference_a: "Тихіші двигуни"
 sp_naval_aip_engine_preference_b: "Швидші двигуни"
 sp_naval_aip_engine_preference_c: "Економніші двигуни"
  
 sp_naval_anechoic_tiles_unique_reward_a: "Нові знання: корпус підводного човна"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "Під час розробки звукопоглинального покриття ми зрозуміли, що можемо пристосувати отримані результати до будівництва звичайних підводних човнів, підвищивши їхню прихованість або трохи заощадивши кошти зі збереженням наявного рівня помітности."
 sp_naval_anechoic_tiles_preference_a: "Агресивні схеми патрулювання"
 sp_naval_anechoic_tiles_preference_b: "Знижена акустична помітність"
 sp_naval_anechoic_tiles_preference_c: "Знижена вартість корпусу"
  
 sp_naval_torpedo_cruiser_unique_reward_a: "Другий шанс торпедного крейсера"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "Відроджуючи стару концепцію торпедного крейсера, ми маємо ухвалити важливе рішення щодо його ролі у фльоті: зосередитися на сильному боці — торпедах — чи подолати головну слабкість — боротьбу з есмінцями?"
 sp_naval_torpedo_cruiser_preference_a: "Сильний бік: торпеди"
 sp_naval_torpedo_cruiser_preference_b: "Слабкість: есмінці"
 
 sp_naval_super_heavy_battleship_unique_reward_a: "Питання пріоритетів: напад"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "Проєктування нового типу лінкорів дає нам нагоду зосередити зусилля на посиленні здатности панувати в морському бою. Чому віддати перевагу?" 
 sp_naval_super_heavy_battleship_preference_a_a: "Важкі гармати"
 sp_naval_super_heavy_battleship_preference_b_a: "Швидкість"
 sp_naval_super_heavy_battleship_preference_c_a: "Легкі гармати"
 sp_naval_super_heavy_battleship_unique_reward_b: "Питання пріоритетів: захист"
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "Вище військово-морське командування поставило нам нездійсненне завдання: зробити цей корабель майже невразливим. Хоча ми знаємо, що це неможливо, можемо принаймні спробувати. Що цього разу має бути нашим пріоритетом?" 
 sp_naval_super_heavy_battleship_preference_a_b: "Посилені броня й корпус"
 sp_naval_super_heavy_battleship_preference_b_b: "Зенітна артилерія"
 sp_naval_super_heavy_battleship_preference_c_b: "Протиторпедні заходи"
  
 sp_naval_modern_battleship_unique_reward_a: "Сучасний лінкор: надія"
 sp_naval_modern_battleship_unique_reward_a_desc: "Хоча багато хто стверджує, що доба лінкорів скінчилася, ми досі в них віримо. Цей корабель має шанс стати для нас новою надією. На чому зосередитися, щоб здійснити мрію?"
 sp_naval_modern_battleship_preference_a_a: "Чиста вогнева міць"
 sp_naval_modern_battleship_preference_b_a: "Маневреність"
 sp_naval_modern_battleship_preference_c_a: "Точність"
 sp_naval_modern_battleship_unique_reward_b: "Сучасний лінкор завдає удару у відповідь!"
 sp_naval_modern_battleship_unique_reward_b_desc: "Щоб довести свою правоту й утримати позиції, нам доведеться витримати ворожі удари. Що слід поліпшити, аби вдарити у відповідь по тих, хто насмілиться стати на нашому шляху?"
 sp_naval_modern_battleship_preference_a_b: "Конструкція"
 sp_naval_modern_battleship_preference_b_b: "Протиповітряна оборона"
 sp_naval_modern_battleship_preference_c_b: "Протиторпедний захист"
  
 sp_naval_modern_carrier_unique_reward_a: "Сучасний авіаносець: призначення"
 sp_naval_modern_carrier_unique_reward_a_desc: "У новому поколінні авіаносців ми могли б зосередитися на певних характеристиках корабля, щоб краще задовольнити наші потреби. Куди спрямувати зусилля?"
 sp_naval_modern_carrier_preference_a_a: "Ситуаційна обізнаність"
 sp_naval_modern_carrier_preference_b_a: "Швидкість і всепогодність"
 sp_naval_modern_carrier_preference_c_a: "Відсіч легким кораблям"
 sp_naval_modern_carrier_unique_reward_b: "Сучасний авіаносець: безпека"
 sp_naval_modern_carrier_unique_reward_b_desc: "Авіаносці — беззаперечні королі морської війни, проте ми мусимо забезпечити їм належний захист і безпеку. Що має турбувати нас найбільше?"
 sp_naval_modern_carrier_preference_a_b: "Ворожа артилерія"
 sp_naval_modern_carrier_preference_b_b: "Ворожа авіяція"
 sp_naval_modern_carrier_preference_c_b: "Ворожі торпеди"

 sp_naval_ice_carrier_unique_reward_a: "Посилення пайкеритового авіаносця"
 sp_naval_ice_carrier_unique_reward_a_desc: "Вкладаючи величезну кількість часу в будівництво цього гігантського авіаносця, ми мусимо бути певні, що забезпечуємо йому найкращий можливий захист. Що турбує нас найбільше?"
 sp_naval_ice_carrier_preference_a: "Сили природи"
 sp_naval_ice_carrier_preference_b: "Ворожі сили"
  
 sp_naval_underway_replenishment_unique_reward_a: "Масштаби постачання"
 sp_naval_underway_replenishment_unique_reward_a_desc: "Ми ще працюємо над тим, щоб система поповнення запасів на ходу діяла якомога злагодженіше, але мусимо ухвалити ще одне рішення: чи хочемо змінити початкові розрахунки?"
 sp_naval_underway_replenishment_preference_a: "Більша дальність"
 sp_naval_underway_replenishment_preference_b: "Менша потреба в конвоях"
 sp_naval_underway_replenishment_preference_c: "Знайти рівновагу"
 
 sp_naval_proximity_fuzes_unique_reward_a: "Економність чи результативність"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "Неконтактні підривачі значно зменшують кількість снарядів, потрібних для влучання у ворожий літак. Готуючись використовувати їх у мобільних зенітних підрозділах, ми можемо змінити обсяг постачання боєприпасів, зберігши очікувану кількість влучань на день."
 sp_naval_proximity_fuzes_preference_a: "Скоригувати постачання боєприпасів"
 sp_naval_proximity_fuzes_preference_b: "Зберегти поточне постачання боєприпасів"

