 sp_nuclear_bomb_accident_generic_reward_desc: "На одному зі складів комплексу спалахнула пожежа. Попереднє розслідування вказує на випадковість. Але чи справді це так?"
 sp_nuclear_bomb_design_choice_reward: "Проста чи складна конструкція бомби"
 sp_nuclear_bomb_design_choice_reward_desc: "Наші науковці розробляють дві конструкції атомної зброї й сперечаються, як із ними діяти далі. Одну з них, відому як гарматна, значно простіше виготовити, але вона менш ефективно використовує ядерний матеріял. Інша, імплозивна, значно складніша, проте теоретично використовує ядерний матеріял ефективніше."
 sp_nuclear_bomb_design_choice_reward_gun_type: "Гарматна схема — надійніший вибір."
 sp_nuclear_bomb_design_choice_reward_implosion: "Імплозивна конструкція краща."

# Thermonuclear Bombs
 sp_thermonuclear_bomb_test_reward: "Пропозиція випробування"
 sp_thermonuclear_bomb_test_reward_desc: "Щоб підтвердити теорію, на якій ґрунтується термоядерна бомба, наші науковці попросили дозволу провести випробувальний вибух. Для запуску ланцюгової реакції знадобиться одна з наявних атомних бомб, але це значно прискорить поступ проєкту."
 sp_thermonuclear_bomb_test_reward_option_yes: "Провести випробування."
 sp_thermonuclear_bomb_test_reward_option_no: "Не можемо витратити цей матеріял."
