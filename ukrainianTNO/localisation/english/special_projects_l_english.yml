 sp_land_reward_stronghold_network_structural_weakness_discovered: "Виявлено слабкість конструкції"
 sp_land_reward_stronghold_network_delayed_by_concrete_shortage: "Затримка через нестачу бетону"
 sp_land_reward_stronghold_network_underground_rail_systems: "Підземні залізничні системи"
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors: "Впровадження противибухових дверей"
 sp_land_reward_stronghold_network_communication_system_overhaul: "Переробка системи зв’язку"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc: "Під час перевірки внутрішньої мережі зв’язку випробувального комплексу команда виявила недоліки, усунення яких допоможе вдосконалити подібні системи в традиційних укріпленнях."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize: "Стандартизувати"
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study: "Продовжити вивчення"
 sp_land_reward_stronghold_network_leadership_approach: "Підхід до керівництва"
