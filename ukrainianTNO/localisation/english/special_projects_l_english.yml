##########################
 sp_land_multi_charge_large_caliber_gun: "Багатокаморна великокаліберна гармата"
 sp_land_multi_charge_large_caliber_gun_desc: "Завдяки багатокаморній системі метальних зарядів і великому калібру ця зброя здатна вести нищівний обстріл на величезних відстанях."
 GER_sp_land_multi_charge_large_caliber_gun: "Багатокаморна великокаліберна гармата V3"
 sp_land_reward_multi_charge_large_caliber_gun_test_failure: "Катастрофічний вибух"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing: "Успішні вогневі випробування"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology: "Прорив у технології метальних зарядів"
 multi_charge_large_caliber_gun_small_size: "Зменшена багатокаморна гармата"
 sp_multi_charge_large_caliber_gun_small_size_ns: "$multi_charge_large_caliber_gun_small_size$" #Hidden NS: no need for desc

 sp_land_super_heavy_railway_gun: "Надважка залізнична гармата"
 sp_land_super_heavy_railway_gun_desc: "Колосальна зброя неперевершеної потужности й точности, що засвідчить військову перевагу будь-якої країни, здатної її застосувати."
 sp_land_stronghold_network: "Мережа укріплень"
 sp_land_stronghold_network_desc: "Складна мережа потужно укріплених бункерів та опорних пунктів, покликана витримувати запеклі штурми й захищати ключові стратегічні об’єкти від ворожих вторгнень."
 sp_land_flamethrower_tank: "Вогнеметний танк"
 sp_land_flamethrower_tank_desc: "Броньована машина з нищівною вогневою міццю на близькій відстані, призначена заливати ворожі позиції потоками полум’я."
 sp_land_military_engineering_vehicles: "Військові інженерні машини"
 sp_land_military_engineering_vehicles_desc: "Спеціялізовані машини для підвищення рухливости на полі бою, зведення укріплень і розчищення перешкод у бойових умовах."
 sp_land_super_heavy_howitzer: "Надважка гаубиця"
 sp_land_super_heavy_howitzer_desc: "Грізна великокаліберна гаубиця, здатна спустошувати ворожу оборону з небаченою руйнівною силою."
 sp_land_self_propelled_super_heavy_howitzer: "Самохідна надважка гаубиця"
 sp_land_self_propelled_super_heavy_howitzer_desc: "Велетенська самохідна гаубиця, маневреніша на полі бою за свій буксирований відповідник і водночас здатна мати ще більший калібр."
 sp_land_land_cruiser: "Сухопутний крейсер"
 sp_land_land_cruiser_desc: "Величезний броньований велетень, покликаний панувати на полі бою. Завдяки незрівнянним розмірам і вогневій міці ця машина є вершиною розвитку бронетехніки."
 sp_air_radar: "Радар"
 sp_air_radar_desc: "Використовуючи імпульсні радіохвилі та виявляючи їхнє відбиття, ми зможемо відстежувати пересування ворога на суходолі, в повітрі й на морі."
 sp_air_centimetric_radar: "Сантиметровий радар"
 sp_air_centimetric_radar_desc: "Розробка сантиметрового радара дозволить виявляти значно менші цілі й використовувати значно менші антени." 

 sp_land_reward_land_cruiser_overheating: "Перегрів під час випробувань"
 sp_land_reward_land_cruiser_chassis: "Руйнування шасі під навантаженням"
 sp_land_reward_land_cruiser_chassis_desc: "Випробування під навантаженням показали, що шасі машини [SpecialProject.GetName] не витримує величезної ваги, через що конструкція деформується. Конструктори розділилися в думках: додатково посилити конструкцію, ще збільшивши вагу машини, чи використати легші матеріяли, потенційно пожертвувавши міцністю."
 sp_land_reward_option_land_cruiser_chassis_redesign: "Повністю переробити шасі"
 sp_land_reward_option_land_cruiser_chassis_redesign_bonus_name: "Перероблене шасі"
 sp_land_reward_option_land_cruiser_chassis_reinforce: "Посилити шасі"
 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name: "Посилене шасі"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials: "Використати легші матеріяли"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials_bonus_name: "Легші матеріяли шасі"
 sp_land_reward_land_cruiser_engine: "Недостатня потужність двигуна"
 sp_land_reward_land_cruiser_engine_desc: "Перші випробування показують, що масивна конструкція прототипу перевантажує наявний двигун, через що машина [SpecialProject.GetName] повільна й погано реагує на керування. Команда пропонує два варіянти: розробити новий, потужніший двигун або спробувати підвищити потужність наявного шляхом модифікацій, ризикуючи вивести його з ладу."
 sp_land_reward_option_land_cruiser_engine_leave: "Залишити як є"
 sp_land_reward_option_land_cruiser_engine_modify: "Модифікувати наявний двигун"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name: "Поліпшений двигун"
 sp_land_reward_option_land_cruiser_engine_new: "Розробити новий двигун"
 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Перероблений двигун"
 sp_land_reward_land_cruiser_turret: "Складний механізм башт"
 sp_land_reward_land_cruiser_turret_desc: "Величезна багатобаштова конструкція спричиняє серйозні проблеми з вирівнюванням і наведенням, затримуючи встановлення озброєння. Інженери рекомендують спростити компонування башт задля більшої надійности, але це зменшить заплановану вогневу міць машини [SpecialProject.GetName]."
 sp_land_reward_option_land_cruiser_turret_original: "Зберегти початкову конструкцію"
 sp_land_reward_option_land_cruiser_turret_simplify: "Спростити конструкцію башт"
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name: "Спрощена конструкція башт"
 sp_land_reward_option_land_cruiser_turret_redesign: "Переробити механізм башт"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Перероблений механізм башт"
 sp_land_reward_land_cruiser_track: "Відмова гусеничної системи"
 sp_land_reward_land_cruiser_track_desc: "Вага машини [SpecialProject.GetName] перевантажує гусеничну систему, спричиняючи постійні поломки під час випробувань. Можна посилити гусениці, що потребуватиме значної переробки конструкції, або зменшити бронювання машини, щоб полегшити навантаження."
 sp_land_reward_option_land_cruiser_track_current: "Залишити наявні гусениці"
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Зменшити бронювання"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Зменшене бронювання"
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Посилити гусеничну систему"
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Посилена гусенична система"
 sp_land_reward_land_cruiser_communication: "Проблема із системою зв’язку"
 sp_land_reward_land_cruiser_communication_desc: "Величезні розміри машини [SpecialProject.GetName] потребують складної системи внутрішнього зв’язку для координації екіпажу. Наявна система не справляється: накази надходять із затримкою або губляться. Команда пропонує змінити внутрішнє компонування для кращої передачі повідомлень або встановити досконалішу, але ще не випробувану систему."
 sp_land_reward_option_land_cruiser_communication_current: "Залишити наявну систему"
 sp_land_reward_option_land_cruiser_communication_new: "Встановити нову передову систему"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Передова система зв’язку"
 sp_land_reward_option_land_cruiser_communication_redesign: "Змінене внутрішнє компонування"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Перероблена система зв’язку"
 sp_land_reward_land_cruiser_assembly: "Точне складання"
 sp_land_reward_land_cruiser_assembly_desc: "Під час фази складання інженери успішно вдосконалили метод точного вирівнювання для монтажу масивних компонентів машини [SpecialProject.GetName], зокрема погона башти й обшивки корпусу, значно зменшивши ризик тріщин від механічних напружень. Ми можемо застосувати цей новаторський метод у всьому проєкті, щоб підвищити загальну надійність конструкції. Як саме його використати?"
 sp_land_reward_option_land_cruiser_assembly_all: "На всіх стадіях складання"
 sp_land_reward_option_land_cruiser_assembly_bonus_name: "Точне складання"
 sp_land_reward_option_land_cruiser_assembly_key: "Лише для ключових компонентів"
 sp_land_reward_land_cruiser_suspension: "Гідропневматична підвіска"
 sp_land_reward_land_cruiser_suspension_desc: "Команда вдосконалила передову гідропневматичну підвіску, що врівноважує величезну вагу машини [SpecialProject.GetName], забезпечуючи стійкість і зменшуючи навантаження на гусениці навіть на пересіченій місцевості. [Character.GetName] переконує, що цю підвіску можна надійно впровадити для кращих характеристик у польових умовах."
 sp_land_reward_option_land_cruiser_suspension_full: "Повністю гідропневматична підвіска"
 sp_land_reward_option_land_cruiser_suspension_rear: "Обмежитися задніми вузлами"
 sp_land_reward_land_cruiser_ammunition: "Рішення для зберігання боєприпасів"
 sp_land_reward_land_cruiser_ammunition_desc: "Під час випробувань виникли побоювання щодо безпечного зберігання й перевезення великокаліберних боєприпасів машини [SpecialProject.GetName]: стандартні стелажі не могли безпечно витримувати вагу вибухонебезпечних снарядів. Запропоновано нову систему зберігання з окремими відсіками, посиленими перегородками й гідравлічними заряджальними механізмами, що дозволить безпечніше поводитися зі снарядами й швидше заряджати їх у бойових умовах."
 sp_land_reward_option_land_cruiser_ammunition_current: "Зберегти наявну систему"
 sp_land_reward_option_land_cruiser_ammunition_simplified: "Використати спрощену версію"
 sp_land_reward_option_land_cruiser_ammunition_new: "Запровадити нову систему зберігання"

 sp_land_reward_super_heavy_howitzer_focus_preference: "Пріоритет конструювання"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc: "У ході розробки потрібно ухвалити ключове рішення: віддати перевагу швидкому виробництву й гарматам меншого калібру чи вкластися в більші й важчі гармати, пожертвувавши ефективністю виробництва заради незрівнянної вогневої міці та нищівної дії."
 sp_land_reward_option_super_heavy_howitzer_focus_preference_balance: "Зберегти рівновагу"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower: "Зосередитися на вогневій міці"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_production: "Зосередитися на швидкому виробництві"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference: "$sp_land_reward_super_heavy_howitzer_focus_preference$"
