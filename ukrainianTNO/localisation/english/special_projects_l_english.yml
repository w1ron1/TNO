 sp_nuclear_reactor: "Ядерний реактор"
 sp_nuclear_reactor_desc: "Досліди довели можливість розщеплення атомів у процесі, відомому як ядерний поділ. Він вивільняє величезну кількість енергії, яку можна використовувати в ядерних реакторах для виробництва електрики або палива для поки що теоретичних бомб..."
 ENG_sp_nuclear_reactor: "«Тьюб еллойз»"
 FRA_sp_nuclear_reactor: "EL-1"
 SOV_sp_nuclear_reactor: "F-1"
 USA_sp_nuclear_reactor: "Pile-1"
 GER_sp_nuclear_reactor: "Uranmaschine"
 SWE_sp_nuclear_reactor: "R1"
 sp_commercial_nuclear_reactor: "Промисловий ядерний реактор"
 sp_commercial_nuclear_reactor_desc: "Ядерні реактори добре підходять для виробництва матеріялів для бомб. Однак енергію, яку вони виробляють, можна використати краще. Будуючи реактори, що постачатимуть електрику цивільній та військовій промисловості, ми зможемо ввести країну в атомну добу!"
 sp_nuclear_engines: "Ядерні двигуни"
 sp_nuclear_engines_desc: "Уявіть двигуни, здатні працювати вічно, без дозаправки. Саме це обіцяє атомна енергія. І, за словами наших інженерів, ми вже дуже близькі до здійснення цієї обіцянки."
 sp_nuclear_bomb: "Проєкт атомної бомби"
 USA_sp_nuclear_bomb: "Мангеттенський проєкт"
 SOV_sp_nuclear_bomb: "Проєкт РДС-1"
 ENG_sp_nuclear_bomb: "High Explosive Research"
 PRC_sp_nuclear_bomb: "Проєкт 596"
 RAJ_sp_nuclear_bomb: "«Усміхнений Будда»"
 PAK_sp_nuclear_bomb: "Чаґай-I"
 sp_nuclear_bomb_desc: "Ми стоїмо на порозі створення зброї з незбагненною руйнівною силою. Бомби, яка за допомогою ядерного поділу вивільнить приховану енергію атома в одну апокаліптичну мить. Хто наважиться виступити проти нас із такою зброєю в нашому арсеналі?"
 sp_nuclear_bomb_tt: "Ядерні реактори почнуть виробляти ядерні бомби"
 sp_thermo_nuclear_bomb: "Термоядерна бомба"
 sp_thermo_nuclear_bomb_desc: "Мало хто наважувався уявити щось потужніше за атомну бомбу на основі ядерного поділу, і ще менше людей погодилося б таке сконструювати. Ми вважаємо, що ядерний синтез дозволить створити неймовірний вибух, на порядки потужніший за все, що ми досі будували."
 SOV_sp_thermo_nuclear_bomb: "РДС-6С"
 USA_sp_thermo_nuclear_bomb: "«Айві Майк»"
 ENG_sp_thermo_nuclear_bomb: "«Зелений граніт»"
 sp_nuclear_warheads: "Ядерні боєголовки"
 sp_nuclear_warheads_desc: "Створивши компактні ядерні заряди, ми зможемо використовувати їх як бойове навантаження для широкого спектра ракетних пускових систем. Це дозволить за лічені хвилини завдавати ударів на величезних відстанях із моря, суходолу чи повітря."


