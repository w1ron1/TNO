 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc: "Наші інженери суттєво вдосконалили спеціялізовані пускові рампи, потрібні для застосування ракет."
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_option: "Добрі новини"

 sp_rockets_flying_bomb_mass_production_scaling_reward: "Перехід до масового виробництва"
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc: "Нам успішно вдалося розробити виробничі поліпшення, які дозволять значно швидше перейти до масового виробництва."
 #sp_rockets_flying_bomb_mass_production_scaling_reward_option: "Most beneficial"

 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward: "Прорив в оптимізації двигуна"
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc: "Наші інженери змогли значно підвищити дальність польоту й надійність пульсуючого повітряно-реактивного двигуна, розширивши бойові можливості ракети."
 #sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_option: "Some call it luck"

 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward: "Технологічне нововведення в системах наведення"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc: "Під час останнього циклу розробки прототипу точність і стійкість системи наведення до завад було значно поліпшено, що посилило нашу технологічну перевагу."
 #sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_option: "We are getting closer to achieving our goal"

 sp_rockets_flying_bomb_test_flight_failures_reward: "Невдалі випробувальні польоти"
 sp_rockets_flying_bomb_test_flight_failures_reward_desc: "Перші випробувальні польоти завершилися невдачами через несправності системи наведення та слабкість конструкції. Наші науковці багато з цього навчилися, але доведеться відступити на крок і все переосмислити."
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "They say you learn the most from your failures"


 # Ground to Air
 sp_rockets_ground_control_improvements_reward: "Поліпшення наземного керування"
 sp_rockets_ground_control_improvements_reward_desc: "Завдяки роботі науковця [Character.GetName] вдалося розв’язати кілька давніх проблем із відстеженням ракети й керуванням нею із землі. Це важливий крок до ураження ворожих літаків на великій висоті."

 sp_rockets_vertical_launch_reward: "Система вертикального пуску"
 sp_rockets_vertical_launch_reward_desc: "Після кількох невдалих спроб науковцю [Character.GetName] нарешті вдалося розв’язати проблеми вертикального пуску цих ракет. Нова система має дозволити безперешкодно запускати ракети й без затримок досягати великих висот."

 sp_rockets_high_speed_flight_control_reward: "Керування польотом на високій швидкості"
 sp_rockets_high_speed_flight_control_reward_desc: "Нам нарешті вдалося створити працездатну систему керування, здатну діяти на високих швидкостях і реагувати на зміни динаміки польоту. Ці знання безперечно стануть у пригоді й в інших галузях."
 sp_rockets_high_speed_flight_control_bonus: "Керування польотом на високій швидкості"

 sp_rockets_warhead_detonation_mechanisms_reward: "Механізми підриву бойової частини"
 sp_rockets_warhead_detonation_mechanisms_reward_desc: "Важлива частина всієї розробки — змусити зброю вибухнути в потрібній точці. Схоже, науковцю [Character.GetName] вдалося знайти рішення, що дозволить підривати її в якнайсприятливіший момент."
 sp_surface_air_missile_warhead_detonation_bonus: "Зенітна керована ракета: поліпшений підрив бойової частини"
 #Ballistic missile

 sp_rocket_wind_tunnel_choice_reward: "Інженери просять аеродинамічну трубу"
 sp_rocket_wind_tunnel_choice_reward_desc: "Інженери проєкту балістичної ракети просять збудувати надзвукову аеродинамічну трубу, щоб випробовувати масштабні моделі ще на ранніх стадіях розробки. Це значно пришвидшить подальші випробування й заощадить ресурси в майбутньому."
 sp_rocket_wind_tunnel_choice_reward_reject: "Ресурси потрібні деінде."
 sp_rocket_wind_tunnel_choice_reward_agree: "Виділити ресурси."

 sp_rocket_glass_wool_choice_reward: "Обмерзання під час входу в атмосферу"
 sp_rocket_glass_wool_choice_reward_desc: "Під час фази повернення ракети в атмосферу навколо паливних баків, схоже, утворюється лід, який заважає роботі внутрішніх механізмів. Попри цю невдачу, наші інженери запропонували обкласти баки скловатою, щоб запобігти цьому надалі."
 sp_rocket_glass_wool_choice_reward_accept: "Прикро, але необхідно."

 sp_rocket_guidance_system_choice_reward: "Система наведення"
 sp_rocket_guidance_system_choice_reward_desc: "Наші інженери обговорюють систему наведення ракети. Одні хочуть залишити перевірений механічний обчислювач, інші — використати нові радіотехнології для керування ракетою й спостереження за нею після пуску."
 sp_rocket_guidance_system_choice_reward_mechanical: "Механіка надійна."
 sp_rocket_guidance_system_choice_reward_radio: "За радіо — майбутнє!"

 sp_rocket_turbo_pump_froth_reward: "Спінювання в турбонасосі"
 sp_rocket_turbo_pump_froth_reward_desc: "Під час висотних випробувань виявлено проблему з турбонасосом. Схоже, за важких умов мастило всередині насосів починає пінитися, що погіршує загальні характеристики й надійність наявної конструкції."
 sp_rocket_turbo_pump_froth_reward_accept: "Мусимо із цим розібратися!"

 sp_rocket_relay_failure_reward: "Відмова реле"
 sp_rocket_relay_failure_reward_desc: "Під час підготовки випробувального пуску виявлено несправне реле у внутрішніх системах керування ракети. Інженери вважають, що перед продовженням його слід замінити, але занепокоєння політичними наслідками затримки зростає."
 sp_rocket_relay_failure_reward_accept: "Полагодити ці реле."
 sp_rocket_relay_failure_reward_reject: "Більше зволікати не можна."

 sp_rocket_outercoating_reward: "Іржа на ракеті"
 sp_rocket_outercoating_reward_desc: "Виникли побоювання щодо зовнішньої обшивки ракети. Після тривалого зберігання матеріяли часто іржавіють і кородують. Якщо не знайти рішення, ракета може стати непридатною до використання."
 sp_rocket_outercoating_reward_accept: "Можливо, допоможе мастило?"

 sp_rocket_launch_site_choice_reward: "Проблеми пускового майданчика"
 sp_rocket_launch_site_choice_reward_desc: "Величезні розміри нової ракети накладають обмеження на запланований пусковий майданчик. Тому керівники проєкту просять кошти на спорудження нового спеціялізованого майданчика в іншому місці."
 sp_rocket_launch_site_choice_reward_reject: "Знайдіть спосіб використати наявний майданчик."
 sp_rocket_launch_site_choice_reward_accept: "Вкладемо кошти в новий комплекс."

