 ## Decisions ##

 SGR_state_of_the_reich_category:0 "§WСтан Райху§!"
 TNO_SGR_Decisions_GUI_regime_lean_text:0 "§YРежим§! наразі схиляється..."
 TNO_SGR_Decisions_GUI_desc_text:0 "§YСТАБІЛЬНІСТЬ РЕЖИМУ§!: £GFX_regime_stability_texticon [?SGRRegimeStability|W%]\n\n£GFX_regime_stability_texticon §YСтабільність режиму§! є критичною для довговічності §Oуряду Фюрера§!. Вона залежить від §gсуперечливих рішень§!, включаючи §Rконсервативні§! або §Gреформаторські§! дії, коли §BСуспільний світогляд§! перебуває на їх протилежності, а також від £GFX_stability_texticon §WСтабільності нації§!, до якої це впливає. Якщо £GFX_regime_stability_texticon §YСтабільність режиму§! впаде нижче §Y30%§!, §Oуряд§! може зазнати краху!\n\n§BСУСПІЛЬНИЙ СВІТОГЛЯД§!: £social_outlook_texticon [getLeaningPivot] ([?SGRSocietyLevel|+2]/[getSGRLimits])\n\n  §BСвітогляд§! зараз є [getSGROutlook] на [?SGRSocietyTick|+]/§Y14 днів§!.\n\n£social_outlook_texticon §BСуспільний світогляд§! є мірою §gдумок німецького народу§! щодо світу. Залежно від таких факторів, як §Qекономічні реформи§!, §Oкрен режиму§! і багато іншого, це змінюється з часом. Якщо §Oуряд§! має протилежний крен, £GFX_regime_stability_texticon §YСтабільність режиму§! почне знижуватися!\n\n£SGR_econ_policy §gЕКОНОМІЧНА ПОЛІТИКА§!: [getSGREconomyLean] ([?SGR_econ_lib|M0] - [?SGR_econ_con|s0])\n\n£SGR_econ_policy §gЕкономічна політика§! є показником нашої поточної економічної політики, заснованої на наших §Bдіях§! під час економічних §Gреформ§!. Збереження §gбалансу§! або [getSGROpposingEconomy2] забезпечить стабільне економічне §Gзростання§!, тоді як §Rнепередбачувана§! §gекономічна політика§! негативно вплине на наші §RНаціональний борг§!, §VІнфляцію§! та §KЗростання ВВП§!."

 SGR_authdemvsfash_ticker_desc:0 "§YКрен режиму§! наразі має [getSGRAlignmentTrend] ([?alignmentTicker|+]/§Yмісяць§!) зрушення і [getLeaningPivot] позицію.\n\nПозиція £social_outlook_texticon §BСуспільного світогляду§! визначає, куди рухається §Yкерн режиму§! , і це позначено на шпеєрометрі."

 SGR_reformist_influence_tt:0 "§W§GРеформаторський§! рух у §gРайху§! отримує вигоду з цього[getRefMalus1].§!\n"
 SGR_reformist_influence_mid_tt:0 "§W§GРеформаторський§! рух у §gРайху§! §Mзначно§! виграє від цього[getRefMalus2].§!\n"
 SGR_reformist_influence_big_tt:0 "§W§GРеформаторський§! рух у §gРайху§! §Bдуже сильно§! виграє від цього[getRefMalus3].§!\n"

 SGR_malus_1_small:0 ", що коштує нам §R2.5%§! £GFX_regime_stability_texticon §YСтабільності режиму§!"
 SGR_malus_1_med:0 ", що коштує нам §R5%§! £GFX_regime_stability_texticon §YСтабільності режиму§!"
 SGR_malus_1_big:0 ", що коштує нам §R10%§! £GFX_regime_stability_texticon §YСтабільності режиму§!"

 SGR_conservative_influence_tt:0 "§W§RКонсервативний§! рух у §gРайху§! отримує вигоду з цього[getConMalus1].§!\n"
 SGR_conservative_influence_mid_tt:0 "§W§RКонсервативний§! рух у §gРайху§! §Oзначно§! виграє від цього[getConMalus2].§!\n"
 SGR_conservative_influence_big_tt:0 "§W§RКонсервативний§! рух у §gРайху§! §xдуже сильно§! виграє від цього[getConMalus3].§!\n"

 SGR_statereich_speeches:0 "Виступити з промовою"
 SGR_statereich_speeches_desc:0 "Хоча багато хто вважає студентів основою підтримки Альберта Шпеєра, саме НСДАП є мечем Дамокла, що нависає над ним. Однак завдяки своїй харизмі та політичному таланті він може блискуче виступити, щоб умиротворити більш піддатливих членів."

 SGR_statereich_promises_light:0 "Символічні політичні обіцянки"
 SGR_statereich_promises_light_desc:0 "Ми не можемо забути про базу підтримки нашого режиму: студентів, інтелектуалів, усіх, хто боровся і загинув за свої надії на краще майбутнє. Щоб лише їх заспокоїти, ми обіцяємо символічні реформи."

 SGR_statereich_promises_huge:0 "Масштабні політичні обіцянки"
 SGR_statereich_promises_huge_desc:0 "Ми маємо укріпити стабільність режиму та заспокоїти людей прямо зараз. Що б ми не могли сказати, що б ми не обіцяли, що б не привернуло увагу людей до нас і відвернуло її від наших ворогів – ми це зробимо. Що до реакціонерів та дисидентів, які ставлять під сумнів їх "реалістичність", – ну, без них ми якось обійдемося."

 SGR_statereich_charge_treason:0 "Звинуватити §jРеакціонерів§! у §RЗраді§!"
 SGR_statereich_charge_treason_desc:0 "Хоча ми керуємо Райхом, це не означає, що у нас немає опозиції – зовсім навпаки. Реакціонери постійно були перешкодою з самого початку, гальмуючи всі наші ініціативи. Ми повинні нагадати їм, хто саме задає правила у Райху, і що їм краще дотримуватись програми, або... Дехто може вважати це надмірним, але для довгострокових інтересів Райху це необхідно."

 SGR_statereich_shift_econ_liberal:0 "Спрямувати економіку до §Mлібералізму§!"
 SGR_statereich_shift_econ_conservative:0 "Спрямувати економіку до §gконсерватизму§!"

 SGR_StateReich_open_pakt:0 "§YПоказати рішення, пов’язані з Пактом§!"
 SGR_StateReich_open_pakt_desc:0 "Натисніть, щоб показати рішення, пов’язані з відновленням Айнхайтспакту."

 SGR_StateReich_close_pakt:0 "§YПриховати рішення, пов’язані з Пактом§!"
 SGR_StateReich_close_pakt_desc:0 "Натисніть, щоб приховати рішення, пов’язані з відновленням Айнхайтспакту."
 
 SGR_pakt_open:0 "§YПоказуються рішення, пов’язані з Пактом.§!"

 SGR_Regime_Collapse_Impeding:0 "§xКРАХ РЕЖИМУ НЕМИНУЧИЙ!§!"
 SGR_Regime_Collapse_Impeding_desc:0 "Режим Фюрера втратив занадто багато впливу – ми повинні діяти швидко та відновити стабільність! Реакціонери вже готуються до захоплення влади – треба діяти швидко!"

 SGR_Repatriation_Debug:0 "Розпочати репатріацію – DEBUG"
 SGR_Repatriation_Debug_desc:0 "Тимчасовий текст"

 SGR_South_African_War:0 "Південноафриканська війна"
 SGR_South_African_War_desc:0 "Війна спалахнула у темних глибинах Африки, і настав час підтримати наші райхскомісаріати. Щоб допомогти Шенку, Мюллеру та Хюттігу в боротьбі проти південноафриканців та їхніх союзників, ми надішлемо необхідні війська для зміцнення їхніх лав. Наші радники прогнозують успіх менш ніж за рік, після чого ми створимо лояльну бурську маріонеткову державу під керівництвом Альберта Герцога."

 SGR_South_African_War_Withdraw:0 "Вийти з Південноафриканської війни"
 SGR_South_African_War_Withdraw_desc:0 "Ситуація в Південноафриканській війні не обов’язково сприяє позиції Райху. Шпеєр та його радники вважають доцільним вивести наші війська з цього кривавого конфлікту та дозволити долі вирішувати її хід."

 SGR_Ukraine_Question:0 "Вирішення українського питання"
 SGR_Ukraine_Question_desc:0 "Україну потрібно порішити якомога швидше. Вкрай важливо, щоб політичний статус "Житниці Європи" змінився в рамках нашого курсу на реформу зовнішньої політики."

 SGR_Netherlands_Question:0 "Голландська проблема"
 SGR_Netherlands_Question_desc:0 "Наші ґерманські брати в Нідерландах відірвалися від безпеки Райху, шокуюче заявивши про свою повну незалежність, попри протести Європи. Ми спробуємо реінтегрувати голландців назад до Айнхайтспакт."
 SGR_Netherlands_Question_bypass_tt:0 "§YЗ де Рошемоном при владі переговори є лише формальністю для повторного входження райхскомісаріату Нідерланди до Пакту.§!"

 SGR_Denmark_Question:0 "Статус Данії"
 SGR_Denmark_Question_desc:0 "Ґерманізація нашого північного протекторату тривала протягом останніх двох десятиліть. Крім майбутнього цього народу у відносинах з Райхом, ми також маємо розглянути його змінну політичну ситуацію та працювати над інтеграцією назад до Айнхайтспакт."

 SGR_Bohemia_Question:0 "Heim ins Reich, Богемія-Моравія"
 SGR_Bohemia_Question_desc:0 "Протягом понад двох десятиліть економічна та політична ситуація в Німецькому Райху дозволяла Богемії та Моравії залишатися лояльним протекторатом. Хаотичні потрясіння Бюргеркрігу принесли зміни по всій Європі, і тепер настав час переосмислити їхній нинішній статус."

 SGR_Issue_of_Slovakia:0 "Питання Словаччини"
 SGR_Issue_of_Slovakia_desc:0 "Після анексії території Богемії та Моравії Райх спрямовує свій монолітний погляд на територію Словаччини. Оточена, без дружніх націй для підтримки, і проста для повернення до складу Пакту, ми пред'явимо їм чіткий ультиматум. Вони або приєднаються, або ми знищимо їхню жалюгідну армію та маршируємо прямо до Братислави."
 
 SGR_Moskowien_Question:0 "У серці Росії"
 SGR_Moskowien_Question_desc:0 "Рівнини крові та снігу на сході вимагають нашої уваги. Зникнення Зігфріда Каше змінило політичний ландшафт Московії, ситуацію, над якою ми повинні зберігати абсолютний контроль, якщо території Райху мають вижити та процвітати."

 SGR_Take_Moskowien:0 "Підготуватися до реконкісти"
 SGR_Take_Moskowien_desc:0 "[GetSGR_Take_Moskowien_desc]"

 SGR_Moskowien_Setup:0 "Реорганізація Московії"
 SGR_Moskowien_Setup_desc:0 "З довгими, порожніми територіями Московії, нарешті, повернутими під наш контроль, ми повинні швидко реорганізувати її у функціональний уряд. Алексіс фон Ренне буде призначений офіційним правителем країни, і ефективно буде створено військову хунту, перш ніж ми подумаємо про повернення її до цивільного контролю. Вони будуть незадоволені, але їм доведеться з цим змиритися. Це краще, ніж будь-яка роздроблена російська держава, яка могла б їх обдурити."
 GER_moskowien_conquered_trigger_tt:0 "Московія більше не існує."
 SGR_Moskowien_Setup_tt:0 "§YМосковія буде поставлена під нове управління.§!"

 SGR_Kaukasien_Question:0 "Кавказьке питання"
 SGR_Kaukasien_Question_desc:0 "У темному тумані Кавказу знаходиться наш найвіддаленіший і найзагадковіший Райхскомісаріат. Як ключовий постачальник нафти, ця територія повинна бути повністю стабілізована, щоб продовжувати служити інтересам Райху."

 SGR_Polish_Question:0 "Польське питання"
 SGR_Polish_Question_desc:0 "Історія чітко продемонструвала, що Польща завжди залишається гострим болем у боці Ґерманії, незалежно від десятиліття. Після перемоги у Бюрґеркріґу ми повинні звернути увагу на схід і ухвалити чітке рішення, як впоратися з цією проблемою раз і назавжди."

 SGR_Norwegian_Question:0 "Фортеця на півночі"
 SGR_Norwegian_Question_desc:0 "Під час Бюрґеркріґу Йозеф Тербовен шокував Райх, розпустивши наш північний Райхскомісаріат і повернувши його гарнізон до Ґерманії. Тепер новий самопроголошений лідер Норвегії привертає нашу повну увагу, і ми будемо планувати, як найкраще підійти до майбутнього цієї нації."

 SGR_Ostland_Question:0 "Зразкова колонія"
 SGR_Ostland_Question_desc:0 "Так звана "зразкова колонія" Райху, яка колись була бастіоном сили та лояльності, була спустошена міжусобною війною та хаосом. Для забезпечення стабільності на наших територіях ми звернемо погляд на схід і вирішимо питання Райхскомісаріату Остланд."

 GER_Bohemia_Reconstruction_SGR_A:0 "Реконструкція Богемії"
 GER_Bohemia_Reconstruction_SGR_B:0 "Реконструкція Богемії"

 SGR_reinforce_mauritius_reunion:0 "Посилення Маврикію та Реюньйону"
 SGR_reinforce_mauritius_reunion_desc:0 "Останні конфлікти в цьому районі поставили під загрозу наш контроль над стратегічними форпостами Маврикій і Реюньйон - настав час це виправити. У південно-західній частині Індійського океану будуть проведені серії військово-морських навчань для підтвердження нашої присутності. Як орел, Кріґсмаріне розгорне крила та охопить своїм поглядом далекі океани світу."

 SGR_place_nukes_mauritius_reunion:0 "Розміщення ядерної зброї на Маврикії та Реюньйоні"
 SGR_place_nukes_mauritius_reunion_desc:0 "Мечі Райху не повинні залишатися лише в Європі, далеко від загрози нашим суперникам. Ні, ми повинні розширити досяжність нашої ядерної зброї, щоб загрожувати не лише їхнім ключовим землям, а й їхнім сусіднім володінням. Острови Маврикій і Реюньйон стануть першим кроком у створенні глобальної вогневої пастки для наших ворогів."

 SGR_allow_reunion_nukes:0 "Ми забезпечили нашу позицію на Маврикії та Реюньйоні."
## GUI stuff ##

