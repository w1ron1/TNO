 ## Economy ##
 SGR_erratic_economy:0 "\nЧерез нашу §Rнепередбачувану§! економічну §Yполітику§!, наші §RНаціональний борг§!, §VІнфляція§! та §KЗростання ВВП§! будуть під загрозою."

 SGR_econ_con_1:0 "Наша £SGR_econ_policy §gекономічна політика§! стане трохи більш £SGR_econ_con §sконсервативною§!!"
 SGR_econ_con_2:0 "Наша £SGR_econ_policy §gекономічна політика§! стане більш £SGR_econ_con §sконсервативною§!!"
 SGR_econ_con_3:0 "Наша £SGR_econ_policy §gекономічна політика§! стане значно більш £SGR_econ_con §sконсервативною§!!"

 SGR_econ_lib_1:0 "Наша £SGR_econ_policy §gекономічна політика§! стане трохи більш £SGR_econ_lib §Mліберальною§!!"
 SGR_econ_lib_2:0 "Наша £SGR_econ_policy §gекономічна політика§! стане більш £SGR_econ_lib §Mліберальною§!!"
 SGR_econ_lib_3:0 "Наша £SGR_econ_policy §gекономічна політика§! стане значно більш £SGR_econ_lib §Mліберальною§!!"

 SGR_econ_attention:0 "\nПід час наших економічних §Gреформ§! нам §Rнеминуче§! доведеться §Yйти на компроміси§! або реалізовувати §Rпротилежні§! економічні заходи для підтримки здоров'я економіки. Залежно від наших §Bдій§!, наша £SGR_econ_policy §gекономічна політика§! може стати більш £SGR_econ_lib §Mліберальною§! або £SGR_econ_con §sконсервативною§!. Збереження £SGR_econ_policy §gбалансу§! або послідовності забезпечить стабільне економічне §Gзростання§!."
 
 SGR_econ_liberal:0 "£SGR_econ_lib §MЛІБЕРАЛЬНА§!"
 SGR_econ_conservative:0 "£SGR_econ_con §sКОНСЕРВАТИВНА§!"
 SGR_econ_balanced:0 "§YЗБАЛАНСОВАНА§!"

 SGR_econ_oppose_con:0 "£SGR_econ_con §sпротилежна§!"
 SGR_econ_oppose_lib:0 "£SGR_econ_lib §Mпротилежна§!"
 SGR_econ_oppose:0 "протилежна"

 SGR_econ_consist_con:0 "£SGR_econ_con §sпослідовна§!"
 SGR_econ_consist_lib:0 "£SGR_econ_lib §Mпослідовна§!"
 SGR_econ_consist:0 "послідовна"

