#Propaganda events


 speerpropaganda.1.t:0 "Листи з фронту"
 speerpropaganda.1.desc:0 "Вільгельм був схвильованим, коли входив до музею. Музей! Його перша подорож за межі міста без батьків! Його клас виграв екскурсію до нововідкритого "Бюрґеркріґмузей" у Гамбурзі, і тепер двадцять п’ятеро хлопчиків віком від дев’яти до десяти років разом із двома вчителями вирушили з Ельмсгорна до великого мегаполісу.\n\nУсі були в захваті від побаченого. Кожна кімната мала свою тему: "міські бої" з реконструйованими окопами; "політика" з аналізом причин громадянської війни; "шпигунство" з тактиками, які використовували претенденти для здобуття переваги. Нарешті, остання кімната була присвячена темі "листи з фронту", у якій було зібрано сотні послань, відправлених солдатами чи міліціонерами своїм близьким під час війни.\n\nВільгельм підійшов до однієї з вітрин і почав читати: "Дорога Крімгільдо, я так за тобою скучив. Ти навіть не уявляєш, як сильно я хочу повернутися додому, до тебе, але я не можу.\nГайдріх відправив своїх вовків. Пам'ятаєш той маленький ресторанчик, де ми обідали минулого року у відпустці? Вони повісили половину села біля нього, а решту копають окопи для СС. Я не дозволю, щоб це трапилося з тобою, клянусь своїм життям.\nЙмовірно, вони атакуватимуть завтра, і я буду готовий. Я тримаю твоє фото біля свого серця, і якщо загину, то з твоїм ім’ям на устах. Я тебе кохаю."\n\nНевелика табличка зазначала: "Ебергарт Йенк, загинув у бою."\n\nВільгельм затремтів від слів, які щойно прочитав, і запитав у вчителя: "Учителю, хто такий Гайдріх?"\n\nОбличчя вчителя відразу посмутніло, але він спокійно подивився на хлопчика і відповів: "Гайдріх був людиною, яка хотіла бачити, як світ горить, і він був готовий втілити свої бажання. Скажи мені, Вільгельме, ти теж цього хочеш? Ти хочеш бачити, як світ горить?"\n\n"Ні!" – відповів хлопчик, – "Я хочу щасливого світу, хочу гуляти з мамою і татом і веселитися!"\n\nОбличчя вчителя знову стало життєрадісним, і він посміхнувся, погладивши хлопчика по голові: "Гаразд, пізно вже." Потім підняв голос: "Клас! Час іти, сподіваюся, екскурсія була корисною!""
 speerpropaganda.1.a:0 ""Так, учителю!""

 speerpropaganda.2.t:0 "Судове шоу, буквально"
 speerpropaganda.2.desc:0 "Зал суду був заповнений вщерть. Журналісти, оператори, поліцейські та звичайні люди заповнили ряди, відведені для публіки, і це було цілком виправдано: Герберт Отто Гілле, голова безпеки у фракції зрадників СС під час Бюрґеркріґу, який безпосередньо відповідав за сотні, якщо не тисячі, страт без суду, був захоплений менше ніж тиждень тому під час спроби перетнути кордон між Ельзасом і Орденштатом.\n\nДвері відчинилися, і натовп вибухнув, коли Гілле привели до його столу. Дехто, мабуть, родичі його жертв, намагалися прорватися до нього, але поліція їх стримувала. Коли порядок повернувся до зали, розпочався суд. На питання, чи є у нього заява, підсудний підвівся: "Я не визнаю цей суд! У кожного з вас немає жодної влади наді мною!" пролунали вигуки, але він закричав ще голосніше: "Ви цього не бачите? Цей безлад, ця декадентність? Гайдріх хотів принести мир до Ґерманії! Новий порядок, досконалий порядок! Він би вирізав корупцію, як вирізають рак! Подивіться на себе зараз, ви ніщо інше, як гангрена на ідеальному тілі Ґерманії!"\n\nСміх перервав його тираду. Серед сміху прокурор ввімкнув запис.\n"Дякую за вашу пожертву нашій справі." пролунало чітко чутне голосом Гілле, "Моя дружина, безумовно, оцінить це прекрасне намисто, і нова машина мені теж знадобиться, але як щодо важливіших справ?"\n"Герр Гілле," прокурор весело відповів, закінчуючи запис, "Якщо ми - рак Ґерманії, здається, ви далеко не здорові..." \n\nКілька секунд тиші, а потім хтось із натовпу засміявся, потім приєднався ще один, а потім інший, і незабаром вся зала сміялася, сміх було чутно навіть на вулиці перед судом. Того дня газети й телебачення рясніли фотографіями лютого СС, який безуспішно намагався перекричати натовп, що не переставав сміятися."
 speerpropaganda.2.a:0 "СС зникають у ганьбі, переможені сміхом."

 speerpropaganda.3.t:0 "Нове майбутнє німецького кулінарного мистецтва"
 speerpropaganda.3.desc:0 "Спочатку важко розібрати, оскільки екран прояснився, але в монохромній кухні була традиційна німецька жінка. "О, мені потрібно приготувати їжу для родини!" – вигукнула вона. "Але спочатку я маю підготувати приладдя. Спочатку все важливе," – сказала вона, беручи ніж. Після цього камера панувала і показала деякі фрукти. "Мені потрібно порізати фрукти..." – прошепотіла вона, кладе ніж і починає поратись в їжі. Через кілька секунд вона зітхнула з роздратуванням і витягнула ніж, показавши, що майже не було жодного прогресу. "Трястя, ну я маю перевірити тарілки, чи вони чисті."\n\nОпустивши руки, вона схопила дві тарілки в обох руках і обернулася, щоб показати їх камері. Її обличчя змішало подив і відразу ж здивування, коли вона подивилася на них. "Тріщини!" – сказала вона, стогнучи, дивлячись на пошкоджені тарілки. 'І вони були абсолютно нормальними ще вчора!'\n\nЗбоку почувся звук відкриваючихся дверей, і глибший чоловічий голос втрутився. "Люба!" – радісно вигукнув він, і вона здригнулася, поставила тарілки і підійшла, поки камера перемикалася на її чоловіка, який несе велику коробку. "Я помітив якість нашого посуду і вирішив подивитися, що продають у найближчому магазині, і о, ти не повіриш!"\n\n"В що?" – запитала дружина, жестом запрошуючи поставити коробку на кухонний стіл. "Чим ця така особлива?" Чоловік посміхнувся і вказав на маленьку етикетку на задній стороні. Камера наблизилася – на етикетці було написано "ВИГОТОВЛЕНО НІМЕЦЬКИМИ РУКАМИ". Вона підняла брови. "Вау! Ти хочеш сказати, що це все зроблено німецькими працівниками?" Він кивнув. "У німецькій фабриці?" Він кивнув знову. "Платили справедливу зарплату, німецькі роботодавці?" Востаннє він кивнув, і вона посміхнулася, повертаючись до камери і схрещуючи руки."
 speerpropaganda.3.a:0 "'Все, більше не купую товари, виготовлені примусовими руками! Тільки вільними та щасливими!'"

 speerpropaganda.4.t:0 "Очищення зла"
 speerpropaganda.4.desc:0 "Спалах статичних шумів заповнив екран, перед тим, як камера показала чоловіка, одягнутого в чорні броні, тримаючи гвинтівку в одній руці та прапор в іншій. Крокуючи вперед, він підняв прапор і показав старий символ Ґерманії, вбиваючи його перед собою. Коли він це зробив, він зробив крок назад і подивився на прапор з цікавістю. Потім цікавість перетворилася на ворожість, яка знову змінилася на сміх. Потрушуючи головою, чоловік міцно взяв гвинтівку обома руками і вказав на прапор, натискаючи на спуск.\n\nПочалися постріли, і після того як він зупинився, камера знову панувала до стовпа, на якому впав німецький прапор. У холодному, мертвому мовчанні пройшло кілька секунд, перш ніж інший прапор підняли на його місце. Чистий чорний, з Чорним Сонцем. Орденштат-Бургунд.\n\nКамера панувала назад, поки не лунав жорстокий сміх, знову і знову. Руйновані будівлі і зруйновані квартали - усе, що можна було побачити, заповнене димом і руйнуваннями. Це тривало майже десять секунд, перш ніж камера знову перемикнулася.\n\nЦього разу це були чисті вулиці справжньої Ґерманії. Молодий, здоровий чоловік, одягнений в кольори Вермахту, грав з двома дітьми, радісно розчісуючи їм волосся і граючи з ними у короткі ігри. На відстані їхні батьки спостерігали, їхні обличчя виражали схвалення, а усмішки були яскраві. Під час цього почав звучати голос.\n\n'Ми повинні уникати помилок минулого, які призвели до жорстокості. Вчора кров заповнила вулиці Ґерманії. Сьогодні мир панує від наших домівок до лісів і гір. Завтра ми будемо мати етичний Вермахт - такий, що не здатен здійснити ті жахи, до яких Ґерманію змусили слідувати в минулому.' Нарешті, солдат попрощався з батьками та їхніми дітьми, і вони мирно розійшлися."
 speerpropaganda.4.a:0 "Роби свою частину. Зроби збройні сили Ґерманії більш людяними."

 speerpropaganda.5.t:0 "Дас Фатерлянд"
 speerpropaganda.5.desc:0 ""Починається, дорогі! Приносьте хлопців!" – вигукнула Хільде Шварц з вітальні, і відразу ж вся родина зібралася: Гюнтер на дивані поруч зі своєю дружиною, Ганс і малий Франк грали на підлозі перед телевізором. Через кілька секунд почалася мелодія: популяризована газетами і плакатами, "Дас Фатерлянд" була великою історичною серією, яка була орієнтована на вивчення німецької історії серед широкої аудиторії, поєднуючи освіту і розваги.\n\n"Добрий вечір, і ласкаво просимо на Дас Фатерлянд!" – сяяв ведучий у камеру. "Праворуч від мене Карл Манітіус, директор Monumenta Germaniae Historica, найбільшої наукової групи, яка вивчає середньовічну Ґерманію, і ліворуч Фрідріх Ціпфель, ветеран війни та експерт з досліджень Другої світової війни", – обидва чоловіки ввічливо кивнули. "Цього вечора ми розглянемо наші стосунки з країною, яка протягом нашої історії вважалася найбільшим ворогом Ґерманії: Францією".\n\nШоу тривало до півночі, але для родини здавалося, що пройшло лише кілька хвилин. Реконструкція Битви при Бувіні, коли Франція несправедливо відмовилася визнати Священну Римську імперію своїм законним правителем, захопила дітей; Гюнтеру сподобалося викладення Манітіуса про те, як французи навіть об'єдналися з невірними, щоб протистояти німцям під час Тридцятирічної війни; і, зрештою, Хільде було зворушено до сліз розповіддю про те, як Луїза, королева Пруссії, була настільки відважною, що особисто зустрілася з Наполеоном, коли вся надія була втрачена.\n\nГюнтер забрав Франка, який заснув, і пішов до спальні, але Ганс потягнув його за штани: "Тату" – проспавим голосом промовив хлопчик, "це знову станеться? Війни, я маю на увазі, Франція знову спробує відняти наше місце?" Гюнтер на секунду задумався, потім засміявся і погладив сина по голові: "Ні, малюк, цього не станеться. Наш фюрер захистить нас, як він зробив під час громадянської війни". І тоді родина разом пішла спати."
 speerpropaganda.5.a:0 ""Так, тату!"

 speerpropaganda.6.t:0 "Вороги, що ховаються всередині"
 speerpropaganda.6.desc:0 "Вулиці Мюнхена були ще темними, найменше мерехтіння на горизонті передвіщало світанок, але Еберхард Готліб вже збирався розпалити піч. Пекар повинен мати свіжий хліб для всіх з самого початку, чи не так? Коли він йшов знайомими вулицями, він швидко привітався з патрулем Орпо, що проїжджав через перехрестя о 5:45, але щось привернуло його увагу, як тільки Вахт пройшов: відразу за дорогою ціла стіна була обклеєна плакатами, всі однакові. Він підійшов до найближчого і зупинився, щоб подивитися на нього.\n\nЗображення було простим, але ефективним. Висока колона стояла в центрі, з великим золотим орлом на її вершині, величним і гордим. Внизу колони десятки маленьких чоловіків намагалися за допомогою кирок зламати цю величезну споруду, деякі з них були одягнені в розкішний одяг, інші ні, але всі мали кишені, набиті зеленими доларами, і дивилися на орла з ненавистю та страхом. Внизу плаката великими готичними літерами було написано "Сшутсен сіе Дойчланд!"\n\nЕберхард подивився на плакат кілька хвилин, розмірковуючи. Чи справді американці були винні у всьому, що сталося? У економічному колапсі, Російській війні, Громадянській війні? Це було неможливо, але все ж вони були ворогами Ґерманії лише кілька років тому, тому вони точно мали б все, щоб виграти від слабкого Райху... Йдучи до пекарні, Еберхард не міг позбутися останньої думки."
 speerpropaganda.6.a:0 "Йобані пендоси..."

 speerpropaganda.7.t:0 "Стою з тобою.!"
 speerpropaganda.7.desc:0 "Екран змінюється на групу молодих чоловіків, одягнених у традиційний одяг Гітлерюгенду, які піднімаються на пагорб, виконуючи фізичне тренування. Голос лунає глибоко, повільно та м'яко. "Ви вірите, що ваш син не має мети в житті та амбіцій? Можливо, він ледачий і хоче витрачати свій час на різні дурниці? Якщо ви турбуєтеся про такого сина, ми пропонуємо вам легке рішення!"\n\nЕкран змінюється. Хлопець, не молодший за сімнадцять, стоїть прямо, хоча трохи незграбно, і робить невелику, непотрібну паузу перед тим, як заговорити в камеру. "Коли я приєднався до Гітлерюгенду, спочатку я його ненавидів. Все було настільки організовано і дисципліновано. Це було, як потрапити в клітку. Але через кілька місяців стало набагато краще. Я став фізично підготовленим," – сказав він, після чого камера показала його під час марафону. "Я став пристрасним," – продовжив він, показавши, як він стоїть на п'єдесталі і виголошує промову перед іншими членами Югенду. 'І я завів багато друзів.'\n\nКамера нарешті переходить до нього, що розмовляє з іншими членами, і голос диктора лунає. "Ось і все. Як ви бачите, це може перевернути життя будь-якого юнака! Ми рекомендуємо всім арійцям приєднуватися до Гітлерюгенду, щоб ваше тіло і розум стали гострими і міцними на рівні.""
 speerpropaganda.7.a:0 ""І пам'ятайте, хороший арієць – це основа хорошого арійського Райху!"

 speerpropaganda.8.t:0 "Рушниці в орала"
 speerpropaganda.8.desc:0 "Навколо нього лунала стрілянина. Він був солдатом Райху – сповнений рішучості та відваги. В одній, в крові, руці він тримав пістолет, а в іншій – чистий, гострий ніж. Навколо нього лежали тіла його товаришів, а ще більше – більшовицької загрози. Він сердито дивився на прапор на краю будівлі, який стояв гордо та насмішливо. Прапор був яскраво червоним, з забрудненим символом серпа і молота в лівому верхньому кутку.\n\nЧоловік плюнув із відразою. Крокуючи вперед, він націлив ніж вгору, і камера переміщується вбік. Коли він наближався до прапора, його рука різко опустилася, маючи намір порвати його. Проте на середині руху ніж зупинився, і зображення повільно змінюється на інше.\n\nЦе була лопата, що вдаряла в землю. Камера повертається, і показує старшого чоловіка, що працює під сонцем. Голос починає звучати, поки чоловік продовжує працювати. 'Ваша служба не повинна закінчуватися після звільнення з Вермахту,' – говорить він. 'Дійсно, вони особливо цінні для Райху. Чоловіки з силою і розумом, ветерани, що знають свою вірність – вони є втіленням Райху! Тому тим, хто служив вірно, ще є надія.'\n\nЕкран змінюється, і показує іншого старшого чоловіка, який підходить до будинку і ввічливо стукає у двері, передаючи пошту, а потім йде. 'Нові галузі відкриваються, і з ними нові можливості. Якщо ви є ветераном Вермахту, Люфтваффе чи Крігсмаріне, вам гарантоване працевлаштування в цивільних секторах. Ми не можемо забути ваші жертви, і тому ви будете нагороджені.'"
 speerpropaganda.8.a:0 ""Не забувайте - Райх – це народ, і кожен повинен працювати для народу!""


