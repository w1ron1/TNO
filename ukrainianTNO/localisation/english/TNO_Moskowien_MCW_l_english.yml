MCW_Skeleton.1.t: "Ґенералкомісар Твєрі вбитий"
MCW_Skeleton.1.desc: "Є сумні новини з Райхскомісаріяту Московієн. Знову московитська гідра, яка все ще виконує накази юдео-більшовиків двадцять років після того, як ми знищили деградовану совєтську імперію, поглинула ще одного відданого сина Великоґерманського Райху: ґенералкомісара Твері Річарда Мандербаха.\n\nПатріот із юності, Річард Мандербах був партійцем націонал-соціялістичного руху з раннього віку. Після нашої перемоги над слов'яно-комуністичною дегенерацією він служив у Райхскомісаріяті Україна і отримав нагороди за свою службу.\n\nПісля цього його перевели на східний фронт, щоб служити Фюреру та Батьківщині, і це завдання він сприйняв з ентузіазмом. Він із радістю прийняв призначення ґенералкомісаром Твері не тому, що це було його «право», а тому, що він хотів бути кориснішим Райху.\n\nЦя служба коштувала ґенералкомісару Твері, найвидатнішому з наших громадян у цьому колоніальному регіоні, його життя. Злочинці, які скоїли це вбивство, ймовірно, були місцевими російськими терористами в Твері. Офіс райхскомісара запевняє, що докладаються всі зусилля для того, щоби помста за смерть товариша за партією Мандербаха була здійснена і щоб подібне не повторилося."
MCW_Skeleton.1.a: "Прокляття."

MCW_Skeleton.2.t: "Всемосковський конгрес 1962 року"
MCW_Skeleton.2.desc: "З моменту створення Всемосковського конгресу Міхаїлом Октаном, Броніславом Камінскім та іншими надійними російськими колаборантами у Райхскомісаріяті Московієн, ці збори поступово отримував привілеї за показану лояльність Фюреру і Великоґерманському Райху. Як результат цих привілеїв, справедливо вважати, що конгрес є основним політичним органом російських колаборантів в Райхскомісаріяті.\n\nЗа місяці та роки після першого засідання Всемосковського конгресу встановився певний стабільний ритм. Є дві основні фракції: Союз боротьби з большевізмом під проводом Міхаїла Октана та Народна соціялістична партія Росії під керівництвом Броніслава Камінскоґо. Ці дві фракції сперечаються про правильний шлях для російського народу, щоб служити своїм праведним ґерманським правителям.\n\nНа фоні фракційних суперечок все ж робиться прогрес. Обговорюються та плануються антитерористичні пропозиції та заходи, підлягаючи схваленню райхскомісаром Ґлобочніком. Обіцянки російському народу — пропозиція підкоритися Великоґерманському Райху — повторюються, як завжди.\n\nЩе одним предметом уваги є промови, які виголошуються на різних етапах роботи Всемосковського конгресу. Як і раніше, ці промови присвячені тим самим піднесеним і правильним темам. Вони прославляють велич Фюрера, красу Європи, яку він створив, і необхідність продовжувати боротьбу з юдео-більшовизмом. Так було завжди, так буде й надалі."
MCW_Skeleton.2.a: "Деякі з них знають своє місце."