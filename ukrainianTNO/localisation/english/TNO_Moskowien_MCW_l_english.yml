MCW_Odilo_Globocnik: "Оділо Ґлобочнік"
POLITICS_MCW_ODILO_GLOBOCNIK_DESC: "Яку ж користь принесла наявність «правильних людей» у «правильному місці» в «правильний час» для німецького проєкту в Східній Європі? Якщо є хтось, хто може засвідчити марність таких кадрових рішень, то це райхскомісар Московієну Оділо Лотар Людвіґ Ґлобочнік.\n\n«Ґлобус» був відправлений до Московієну Гайнріхом Гіммлером, щоб зайняти ключові позиції у всіх владних секторах цієї території: СС, поліції, НСДАП, усіх офісах, що стосуються расової ієрархії та німецького поселення. У цій ролі Ґлобочнік продовжив політику націонал-соціялістичного радикала із певною прагматичністю у стосунках із колабораціоністами, подібно до свого попередника Каше.\n\nПравління Ґлобочніка в Московієні, хоч і жорстоке, поволі провалюється. Це не через некомпетентність. Ні, радше політичний ландшафт Райхскомісаріяту Московієн вимагає значно більше, ніж може надати людина обмеженого калібру, як Ґлобочнік. Він це знає, і жах цього місця поглинає його день за днем. Уже кілька років Ґлобочнік постійно відчуває, як його роздирають на частини постійна нудна одноманітність, якій він піддається.\n\nЖиття Оділо Ґлобочніка здається чистилищем — або, можливо, пеклом — за всі можливості, які він залишив позаду. Як Сізіф, Ґлобочнік змушений повторювати одні й ті самі дії щодня. Але він не може уявити собі щастя інакше як у минулому часі. Коли ця реальність поєднується з тенденцією Ґлобочніка, починаючи з його часу в Любліні, вживати пігулки та алкоголь як заспокійливе, результатом є повільне схиляння до божевілля та постійна одержимість тим, як усе могло б бути."
MCW_Wolf_Heinrich_Graf_von_Helldorff: "Вольф-Гайнріх Ґраф фон Гельдорф"
POLITICS_MCW_WOLF_HEINRICH_GRAF_VON_HELLDORFF_DESC: "У Фюрері — справжньому, а не будь-якому «заміннику», який захопив владу, — Вольф-Гайнріх Ґраф фон Гельдорф колись бачив людину, яка уособлює всі його сподівання та бажання для Народу й Батьківщини. Гельдорф відданий націонал-соціялізму, якому він навчився в роки боротьби, однак те, що сьогодні називає себе таким, більше не відповідає його повному схваленню.\n\nГельдорф був молодою, спортивною людиною, якій не виповнилося й 20 років, коли його відправили на бійню Великої війни. Він повернувся зломленим та спраглим до помсти. Гельдорф вступив до НСДАП, щоб гарантувати німецькому народові свободу від духовного та матеріального рабства. Але перші тріщини в цій ідентичності з'являються, щойно поглянеш на ім'я цього так званого товариша по партії: Вольф-Гайнріх Ґраф фон Гельдорф.\n\nГельдорф приєднався до революційного руху для встановлення нового порядку, але найщасливіший, коли його називають повним аристократичним ім'ям. Він вірить у революційний нацизм, але використовує будь-яку позицію для власного збагачення. Людина розумна, але егоїстична, чарівна, але слизька, жадібна, але фінансово безглузда. Він часто п'є, але не є п’яницею; попри все це він якимось чином зберігає зв’язок із християнством своєї юності. Так пройшли роки — в залізному пеклі розпусти та гірких поглядів, спрямованих на Ґерманію.\n\nАле під час Зриву старий зібрав навколо себе інших старих бійців, альте кемпферів, і скинув Ґлобочніка; тепер він тримає ключі від колонії. Будучи людиною без майбутнього, лише з теперішнім, Гельдорф використає свою владу для створення пам’ятника. Не лише собі, але й ідеалам, давно втраченим для нацизму, — а можливо, також Ернсту Рьому та Йозефу Ґьобельсу, тим друзям, яких Вольф-Гайнріх Ґраф фон Гельдорф покинув і зрадив так давно."
MCW_Claus_Von_Stauffenberg:0 "Клаус фон Штауффенберґ"
MCW_Claus_Von_Stauffenberg_desc:0 "Для Клауса Шенка Графа фон Штауффенберґа, німецького аристократа, який ніколи не вступав до НСДАП, це є здійсненням мрії. Після десятиліть останній захисник старої Пруссії зміг значно послабити нацистський апарат, що тримав її в кайданах.\n\nОднак він ще не переміг остаточно - адміністрація Штауффенберґа стикається з численними проблемами. Коаліція нестабільна. Бренд «аристократичного» мілітаризму фон Штауффенберґа, що уявляє ідеалізовану версію середньовічної Німеччини, яка веде Європу до нового рівня культури та цивілізації, викликає суперечки і часто висміюється його колегами-офіцерами.\n\nСаме завдяки відставному генералу Дітріху фон Заукену вдалося об’єднати широкий фронт опору. Без нього план був би приречений на провал, завдяки його зусиллям, однак, проблема вирішилася. Але навіть після того, як Ґлобочнік і фон Гельдорф зникли, проблеми, які вони створили, залишаються серйозною перешкодою, а регіон Московієну досі не можна назвати стабільним.\n\nЗіткнувшись із партизанським наступом Івана Воробйова, фон Штауффенберґу необхідно швидко стабілізувати ситуацію, перш ніж вона вийде з-під контролю чи ворожі фракції захоплять владу. Потім він має передати повноваження комусь із чистою репутацією в Германії, щоб закріпити адміністрацію та забезпечити, що ця маленька перемога буде використана з користю."
MCW_Fritz_Dietlof_Von_Der_Schulenburg:0 "Фріц-Дітлоф фон дер Шуленбурґ"
MCW_Fritz_Dietlof_Von_Der_Schulenburg_desc:0 "Фріц-Дітлоф Граф фон дер Шуленбурґ ніколи не прагнув публічної кар'єри. Він не жадав посад, і саме тому йому їх довірили. Ті, хто його обрав, не могли не захоплюватися його минулою службою. Відданий державний службовець протягом усього життя та офіцер резерву, він залишався незаплямованим корупцією та дрібними інтригами нацистів.\n\nОднак під поверхнею ховається щось інше. Фріц-Дітлофа фон дер Шуленбурґа можна справедливо назвати ходячою суперечністю - нацист міг би звинуватити його у криптосоціялізмі. Дружній до редакторів газет СДП у молодості, він настільки співчував робітникам, що ночами приєднувався до леніністських гуртків.\n\nЗ огляду на такі інтереси, можна було б очікувати, що фон дер Шуленбурґ ненавидів монархію. Однак несподіванкою є те, що він також ненавидів Веймарську республіку. Чоловік мріяв про «ґермано-слов'янську» долю, за якої Німеччина створювала імперію у Східній Європі, але якось співіснувала гармонійно з місцевими народами. Ще небезпечніше для його позицій є те, що він уявляє організацію постнацистської Німеччини та Московієну, звільненої від ярма нацизму.\n\nЗ такими ідеями фон дер Шуленбурґ досяг сумнівного досягнення — став більш суперечливим, ніж фон Штауффенберґ, і навіть більше залежить від літнього генерала Дітріха фон Заукена для підтримки згуртованості старого кола. Чи можна реалізувати цю візію хоча б частково на такому трупі, як Московієн, ще належить побачити."
MCW_Mikhail_Oktan:0 "Міхаїл Октан"
MCW_Mikhail_Oktan_desc:0 "Мало хто з колабораціоністів є таким посміховиськом, як Міхаїл Октан. «Талановитий шахрай і авантюрист», «цілковитий негідник», «послужливий і хитрий фанатик» — лише деякі епітети, якими його нагороджували знайомі. Один із колишніх колег описував його як людину, яка свідомо копіює вигляд і жести Адольфа Гітлера.\n\nЧому ж його не називати такими словами? Більше, ніж будь-який інший провідний колабораціоніст, Октан потрапляє в незручні ситуації, намагаючись слідувати нацистській лінії щодо «єврейського питання». Він поетично говорить про боротьбу з «єврейською заразою» з тією ж пристрастю, як і будь-який дрібний партійний функціонер.\n\nОктан майже ідеально повторює лінію НСДАП щодо більшовизму — а саме, що це інструмент у руках євреїв, які прагнуть світового панування. За його словами, провал у Росії змусив їх поширювати комунізм на Захід, поки німецька зброя не поклала цьому край. Жоден колабораціоніст не ототожнює себе з націонал-соціялізмом більше, ніж Міхаїл Октан.\n\nОктан наполягає, що Німеччина, на відміну від Москви, не нав'язує свою систему Росії; вона дозволяє відновлення землі, звичаїв та релігії. Незважаючи на реальність на місцях, він «вміло поєднує якості німецького офіцера, одеського купця та хитрого підлабузника». У поєднанні з його свідомим копіюванням вигляду Гітлера очевидно, що ця людина уявляє себе фюрером для російського народу."

MCW_An_Empty_Throne:0 "Порожній трон"
MCW_An_Empty_Throne_desc:0 "Пустота і страждання на посаді райхскомісара Московієну частково, але не повністю, є результатом дій Оділо Ґлобочніка. Його особистість і розум, хоча й не свідчать про некомпетентність чи зраду, просто недостатні для виконання вимог цієї посади — похмурий політичний ландшафт райхскомісаріяту вимагає значно більшого.\n\nЦього було б достатньо, щоб поступово зламати будь-кого. Але крім цього, похмурий політичний ландшафт також наповнений ворожими акторами, які постійно працюють проти волі райхскомісара. Внутрішні суперники, такі як Вольф-Гайнріх фон Гельдорф, і зовнішні вороги, такі як Вермахт у Московієні, ставлять під сумнів і саботують адміністрацію Ґлобочніка на кожному кроці, роблячи вже й так важке завдання з керування цими землями ще складнішим."
MCW_Puppet_Kings_Court:0 "Двір маріонеткових королів"
MCW_Puppet_Kings_Court_desc:0 "Як римляни мали маріонеткових королів і королев, так і райхскомісар Московієну має Всемосковський конгрес. Створений наприкінці Другої світової війни для консолідації залишків московських колаборантів у єдину структуру, він знаходиться під контролем Міхаїла Октана та Броніслава Камінскоґо.\n\nПісля дефекцій або дезертирств більш значущих колабораціоністських організацій, таких як РОА та РОВС, решта актуальних колаборантів — це всі вірні підлабузники НСДАП у Московієні. Ці «маріонеткові королі», сучасні клони Ірода Великого, із захопленням продовжують співпрацювати, як і протягом двох останніх десятиліть."
MCW_The_Wasteland:0 "Пустка"
MCW_The_Wasteland_desc:0 "Московієн — це пекло на землі для кожного, хто там живе. Немає поняття миру: внутрішні заворушення, якщо не відкрита війна, є постійними. Немає уявлення про процвітання: багатство є нечуваним для більш ніж дев’яносто дев’яти зі ста жителів. Цей регіон — це пустка, і саме такою її хотіла бачити Націонал-соціялістична робітнича партія Німеччини, яка її колонізувала.\n\nТі, хто чекає на полегшення через партизанську діяльність, тримаються за марну надію. Після двадцяти років окупації опір був давно придушений. Ті війська, які могли втекти на захід у російську анархію, зробили це; решта просто змирилася з німецьким правлінням."

MCW_Crown_Of_The_Old_Fighter:0 "Корона старого бійця"
MCW_Crown_Of_The_Old_Fighter_desc:0 "Московська філія Націонал-соціялістичної робітничої партії Німеччини якимось чином пережила другий Капфцайт без серйозних втрат. Проте наявність нового фюрера не означає, що можна розслабитися чи відпочити на лаврах. Як це можливо в пустці, яку вони створили з Райхскомісаріату Московієн?\n\nЗа зачиненими дверима ножі вже витягнуті. Райхскомісар Оділо Ґлобочнік і його давній політичний суперник, Вольф-Гайнріх Ґраф фон Гельдорф, борються за повний контроль над Московією. Ці старі діячі, залишки ранніх «славних днів» націонал-соціялізму, тепер сваряться за залишки імперії Гітлера."
MCW_Purgatory:0 "Чистилище"
MCW_Purgatory_desc:0 "Ґлобочнік і Гельдорф — залишки ранніх «славних днів» націонал-соціялізму. Їхні покровителі та союзники давно зникли з тих чи інших причин, а вплив у рідній Німеччині так само зник. Як наслідок, ці двоє людей застрягли в райхскомісаріяті та не мають жодної надії на отримання вищої посади в Німеччині.\n\nОднак, давно змирившись із цією долею, два впливових діячі на вершині НСДАП Московієну мають численні амбіції та грандіозні плани, які, як вони вважають, зроблять це більш терпимим. «Якщо цей замок буде моїм, — думають вони, — то нехай я принаймні його прикрашу». Але тільки Небеса знають, наскільки яскравішим стане замок після того, як вони підуть."
MCW_Vassals_At_Most:0 "Лише васали"
MCW_Vassals_At_Most_desc:0 "Як римляни мали маріонеткових королів і королев, так райхскомісар Московієну має Всемосковський конгрес. Але чи хоче він його зберегти сьогодні? Римляни, зрештою, позбавлялися своїх маріонеткових королівств одне за одним, коли латинські або елліністичні бюрократи й колоністи осідали на цих землях.\n\nНова влада Райхскомісаріяту Московієн загалом прагнула послабити Всемосковський конгрес і його керівництво. Мета Московієну зрозуміла: якщо райхскомісар досягне свого, остаточна форма конгресу стане нейтралізованим органом без жодного впливу, навіть такого жорстко обмеженого, який він має нині."

MCW_Crown_Of_The_Perfumed_Rioter:0 "Корона надуханого бунтівника"
MCW_Crown_Of_The_Perfumed_Rioter_desc:0 "За допомогою особистих звернень, підкупу та просто примусу Райхскомісаріят Московієн опинився під контролем Вольфа-Гайнріха Графа фон Гельдорфа, який успішно підпорядкував собі свого старого начальника. Стара гвардія НСДАП, колишній член штурмових загонів (СА) і прихильник соціяльно-революційної думки, режим Гельдорфа запровадить нову структуру управління Московією.\n\nЗавдяки утвердженню влади Гельдорфа, ОсНСДАП у Московієні тепер нарешті об’єднана, після затишшя 1950-х років. Вона марширує в строгій злагоді, як колись маршували штурмові загони."
MCW_Marching_On_Heaven:0 "Марш на небеса"
MCW_Marching_On_Heaven_desc:0 "Райхскомісаріят Московієні, яким керує Вольф-Гайнріх фон Гельдорф, ґрунтується на старішій формі націонал-соціялізму — тій, що сягає часів першого Капфцайту. У ті дні, як стверджує Гельдорф і його старі соратники, цінності націонал-соціялізму були ще не затьмарені.\n\nХоча решта Німеччини зараз втрачена на користь інших форм нацизму, менш чистих, ніж те, за що тримається Гельдорф, нарешті він і його партійні товариші мають місце для перевірки своїх ідей. Сьогодні штурмові загони знову марширують у райхскомісаріаті Московієн. Це райхскомісар, Вольф-Гайнріх Граф фон Гельдорф, який поведе їх на небеса дорогою, якою колись ішов Адольф Гітлер."
MCW_Levies_At_Most:0 "Лише рекрути"
MCW_Levies_At_Most_desc:0 "Райхскомісаріят Московієн, як його уявляє Вольф-Гайнріх фон Гельдорф, є значно більш жорстким щодо колаборантів, ніж його попередники. Така зміна парадигми стала очевидною завдяки суду і страті Броніслава Камінскоґо через кілька тижнів після приходу Гельдорфа до влади, а також повній ліквідації Тверської автономії.\n\nЗгідно з директивами нового райхскомісара, обов’язки поліції та захисту східного кордону Райху тепер покладаються на московський вермахт і німецьких поселенців. Колаборанти, зі свого боку, матимуть значно зменшену роль і не гратимуть більшої ролі, ніж роль зборів, піднятих або розпущених за бажанням райхскомісара."

MCW_Crown_Of_The_Cowed_Prefect: "Корона підкореного префекта"
MCW_Crown_Of_The_Cowed_Prefect_desc: "Оділо Ґлобочнік переміг підступи Гельдорфа та інших своїх менших суперників. Він готовий здійснити свою волю в колонії; більше він не є хворобливим посміховиськом СС. Більше він не жалюгідний чоловік, знесилений хворобами та позбавлений відносин через указ, виданий його ж матір'ю. Він — райхскомісар Московієну, чорт забирай!\n\nОділо Ґлобочнік більше не підкоряється. Він — чоловік, який контролює ситуацію, і він це доведе. Ґерманія нарешті зрозуміє, що зробила правильний вибір. Немає чоловіка, більш придатного для управління східним кордоном Райху, ніж він."
MCW_Marching_On_The_Earthly_Realm: "Марш на земне царство"
MCW_Marching_On_The_Earthly_Realm_desc: "Оділо Ґлобочнік нарешті має повний контроль над східним фронтиром Райху та беззаперечно керує Райхскомісаріятом Московієн. Тепер він вільний діяти, як вважає за потрібне, і використає цю можливість повністю. Для цього Ґлобочнік наказав здійснити чисту реалізацію націонал-соціялістичного проекту на сході.\n\nНе буде нічого меншого, ніж повне впровадження Ґенерального плану Ост у його первісному вигляді. Перешкоди та виклики не мають значення і будуть подолані. Це вже було зроблено одного разу і триватиме надалі. Ґлобочнік вже перемагав перед неймовірними труднощами, і його воля переможе саму реальність."
MCW_Knighthood_For_The_Loyal: "Лицарство для вірних"
MCW_Knighthood_For_The_Loyal_desc: "Оділо Ґлобочнік не прагне повернутися до статусу-кво щодо автономії колаборантів. Однак, на відміну від своїх більш... відданих сучасників у ОсНСДАП, він бачить цінність у просуванні тих, хто проявляє невпинну відданість нацистському проекту, на керівні позиції за потреби. У цьому відношенні райхскомісар не змінився.\n\nТака гидота, як Тверська автономія, звісно, залишаться в минулому. Але добрі й вірні росіяни Московієну, ті, хто розуміє свій обов'язок і приймає підпорядкування райхскомісару та Ґерманському Райху, матимуть достатню автономію, щоб підніматися сходами влади, якщо будуть достатньо активно знищувати бандитів і зрадників."

MCW_The_Brass_Throne: "Латунний трон"
MCW_The_Brass_Throne_desc: "Ні бездумні гедоністи, ні різні бандити, які заявляють, що служать німецькому народу, більше не будуть допущені до продовження свого недбальства в управлінні райхскомісаріатом Московієні. Офіси НСДАП у Московієні було закрито, і за наказом Вермахту запроваджено уряд воєнного стану.\n\nАле все не так гладко. Занепад Вермахту міг бути посіяний самим актом його приходу до влади. Спроби впоратися з хаосом, залишеним за собою наркотично залежними зрадниками Гельдорфом і Ґлобочніком, одночасно з протистоянням партизанському наступу Воробйова, залишили його похитнутим. Тому подальше існування уряду Клауса фон Штауффенберґа залишається далеким від певності."
MCW_Ghost_Carnival: "Карнавал привидів"
MCW_Ghost_Carnival_desc: "Факт краху уряду НСДАП у Московієні не означає, що ті, хто його замінив, можуть спокійно відпочивати. Занепад Вермахту міг бути посіяний самим актом його приходу до влади, адже партизанський фронт на чолі з Іваном Воробйовим загрожує його подальшому контролю над регіоном.\n\nХоча центри населення залишаються під контролем уряду, партизани мають свободу дій в інших місцях. Як наслідок, допоки не будуть вжиті відповідні контрзаходи, уряд втратив контроль над віддаленими регіонами Московієну."
MCW_Dance_Of_The_Jesters: "Танок блазнів"
MCW_Dance_Of_The_Jesters_desc: "Коли Рим був охоплений громадянською війною, його клієнтські держави самостверджувалися, прикриваючи дірки в його обороні — або, іноді, використовуючи їх у своїх інтересах. Так само і сьогоднішній Московієн.\n\nЧерез масштабний хаос, створений партизанським наступом Воробйова, Вермахт не здатен самостійно умиротворити Московію. Йому доводиться покладатися на колаборантські організації, представлені у Всеросійському конгресі — Союзі боротьби проти більшовизму та Народній соціялістичній партії Росії, щоб підтримувати порядок. Це, однак, створює можливості для них розширювати власну владу."

MCW_Crown_Of_The_Red_Count: "Корона Червоного графа"
MCW_Crown_Of_The_Red_Count_desc: "Сьогодні Фріц-Дітлоф граф фон дер Шуленбурґ є беззаперечним господарем земель Московієну. У нього багато амбіцій, які часто суперечать одна одній. Новий губернатор розривається між кількома наборами незбагненних переконань; наприклад, він мріє про німецьку утопію в Східній Європі, яка буде жити в гармонії з місцевими народами цієї землі.\n\nАле за ним стоїть коло старіючих пруссів, генералів, що представляють останній подих старої імперської аристократії, що тепер є лише спогадом для Німеччини шістдесятих. Ці чоловіки — джерело авторитету фон дер Шуленбурґа. У свідчення цього факту саме вони попросили Ґерманію зробити його призначення постійним."
MCW_Scrying_Bulwark: "Вежа провидця"
MCW_Scrying_Bulwark_desc: "Військова аристократія Московієну є великою масою суперечностей, що втілилися у плоть. У жодному аспекті це не є настільки очевидним, як у їхньому дволикому погляді на територію, яку вони тепер контролюють — цю «землю обітовану», за яку вони боролися, нібито, щоб звільнити її від комунізму і таким чином зміцнити Німеччину.\n\nТими ж устами, якими звичайний військовий офіцер у правлячому класі Московієну говоритиме про очевидну руїну і безнадійність, що тепер очевидні на території після двох десятиліть правління НСДАП, він також висловлюватиме свої надії та мрії, на сто відсотків впевнений, що вони здійсняться, про те, що він та його колеги зможуть з цієї території ще щось створити. Однак у той же час його може відволікати від постійного проголошення суперечливих фраз все зростаюча впевненість, що час не буде милосердний до нього: він і всі його колеги скоро зникнуть з цього світу."
MCW_Dance_Of_The_Courtier: "Танок двірця"
MCW_Dance_Of_The_Courtier_desc: "Через масштабний хаос, створений партизанським наступом Воробйова, Вермахт не зміг самостійно умиротворити Московію. Тому йому довелося покладатися на колаборантські організації, представлені у Всеросійському конгресі — Союз боротьби проти більшовизму та Народну соціялістичну партію Росії, щоб підтримувати порядок. Однак це також створило можливість для них розширити свою владу, проблему, яку вони тепер визнають.\n\nРішення цієї проблеми, на думку Вермахту, є досить простим: розділяти і володарювати. Їхня стратегія збереження влади тепер полягатиме в тому, щоб виступити проти Октана, більш потужного та впливового з колаборантів, граючи на протиріччях з Камінскім. Теоретично це може працювати — але його результат на практиці ще не видно."

MCW_Crown_Of_The_False_Son: "Корона Лжесина"
MCW_Crown_Of_The_False_Son_desc: "Як неймовірно це повинно було виглядати для Ґлобочніка та його спільників першого січня 1962 року, коли до кінця десятиліття їх вигнали і замінили колаборанти, яких вони вважали підданими в найкращому випадку. Але саме це і сталося. Октан і Камінскій піднялися по сходах із низькорівневих колаборантів до владарювання над феодом на околицях імперії, створеної Адольфом Гітлером.\n\nАле корона не стійко лежить на головах нових володарів Московієну. Нова угода на землі не може тривати вічно, незалежно від того, як щільно ллється шампанське в бенкетних залах. Більше крові ще забруднить ті кілька місцин, що залишились цілими в пустелі, якою є Московієн, і питання, як завжди, лише в тому, чия це буде кров."
MCW_Empire_Of_Ash: "Імперія попелу"
MCW_Empire_Of_Ash_desc: "Колаборанти — це не якась там інтермедія, бічний спекталь, вони — головний акт. Вони не другорядні актори, вони — некороновані королі Московієну. Отже, який ще привід їм потрібен для того, щоб віддати всі свої сили на умиротворення цього регіону? Вони беруться за справу з енергією, створюючи імперію попелу.\n\nМосковієн під жорстоким правлінням колаборантів стане одночасно найгіршим і найкращим місцем. З точки зору ортодоксальних нацистів, це найгірший і найбільш ганебний приклад невдачі. Але з точки зору збереження і персистенції гітлерівського правління, це найкращий можливий успіх — адже це є втіленням націонал-соціялістичної ідеології."
MCW_The_Suit_And_The_Butcher: "Костюм і м'ясник"
MCW_The_Suit_And_The_Butcher_desc: "Зустрічайте нового господаря, зовсім іншого від старого, але суттєво того ж самого. Коли Ґлобочнік, Гельдорф і всі інші німці були відправлені в безчестя, Всемосковський конгрес продовжував свою діяльність. І що з того, що більше не було німців, які віддавали б йому накази? Можна було знайти інших володарів, і, справді, вони були знайдені досить швидко.\n\nЗ підйомом російських колаборантів до контролю над райхскомісаріатом Московієн Всемосковський конгрес став засобом для двох його провідних фігур — Октана і Камінскоґо — закріпити свою повну владу над Московською державою."

