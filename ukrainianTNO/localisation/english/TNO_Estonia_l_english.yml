 ### Leaders ###
 EST_Alfons_Rebane:0 "Альфонс Ребане"
 POLITICS_ALFONS_REBANE_DESC: "Альфонс Ребане дуже розчарований. Він гадав, що Великоґерманський Райх, господарі Європи, принаймні спроможні втримати стабільність у власній країні. Тепер Ребане доводиться мати справу з безладом, який вони залишили в Естонії. А безладу вони залишили чимало. По всій країні панують масові заворушення, естонці відкрито ворогують між собою, а навіть німецькі угруповання грабують усе навколо так, наче настає кінець світу.\n\nРебане не завжди мусив займатися цим. Він був відданим естонцем, вірним своїй країні. Саме тому радянське завоювання стало для нього таким нищівним. Ребане переховувався в лісах, ховаючись від російських псів, які могли депортувати його. Потім вторглися німці. Ребане швидко вступив до Вермахту, вірячи, що після війни німці визволять Естонію. Німці перемогли, і здавалося, що свобода Балтії гарантована. Ребане залишалося лише співпрацювати й чекати. І чекати. І чекати. І чекати ще трохи.\n\nСтало зрозуміло, що незалежній Естонії не судилося постати. Ребане нічого не міг із цим вдіяти, а перебувати під німецьким контролем зрештою було краще, ніж під російським, тож він залишився з німцями. А потім німці впали. Ребане знав, що його час настав. Він здійснив переворот в Естонії та проголосив незалежність нової країни. Щоправда, тимчасово — доки німці не повернуться. Його головна мета — «забезпечити безпеку в регіоні», поки німці перебувають у хаосі. Зважаючи на те, що він уже створив нові урядові будівлі та усуває колишню німецьку адміністрацію від усіх державних справ, це видається малоймовірним, але лише час покаже, що станеться з Естонією."
 
 