 ### Leader Desc ###
 AMR_Konstantin_Rodzaevsky: "Константін Родзаєвскій"
 POLITICS_KONSTANTIN_RODZAEVSKY_DESC: "Константін Владіміровіч Родзаєвскій завжди був людиною Сходу. Гніт нового совєцького ладу, як він його сприймав і змалку ненавидів, змусив його втекти з Благовєщенска в Союзі до Харбіна - міста, де процвітали емігранти. Там він переконався, що большевизмові треба протиставити нову систему; цю систему він знайшов у Європі, де щойно народився фашизм. Молоду ідеологію прийняло чимало росіян, озлоблених поразкою у громадянській війні. Молодий і харизматичний Родзаєвскій скористався нагодою об'єднати їх під знаменом свастики, запалюючи натовпи своїми промовами. Він пообіцяв колись повернутися на батьківщину й визволити її народ.\n\nНевдовзі після заснування Россійская Фашистская Партія налагодила тісні стосунки з новими володарями Маньчжурії - японцями. Найщедріші покровителі партії підтримували її протягом усього існування, аж доки з крахом Президії не з'явилася нагода відвоювати втрачене.\n\nПідбадьорений запалом японських союзників, провідник РФП рушив у благородний похід проти жидо-большевизму. Та мрії про цілковите визволення розбили його суперники: генерали зі своїм царем і, найгірше, Міхаїл Матковскій із гуртом зрадників, що шукали допомоги за Тихим океаном. Константін Родзаєвскій, покинутий у Зєї на чолі звичайного краю воєнного ватажка, розлютився й заприсягся помститися всім ворогам Росії, ким би вони не були: жидам, червоним, матковцям, царистам - кожному, хто насмілиться кинути виклик Вождю. Для нього це єдиний шлях повернути нації колишню славу, однак ця мрія віддаляється дедалі більше."

 POLITICS_KONSTANTIN_RODZAEVSKY_70S_DESC: "Константіна Владіміровіча Родзаєвского різні люди називали по-різному. Для критиків він був божевільним. Для ворогів - бандитським царком. Для прихильників - Вождем. Саме він привів Россійскую Фашистскую Партію до Росії. Саме він розпочав хрестовий похід проти большевика й жида. І відплатили йому зрадою. Зрадники сплюндрували його задум, вирізали його соратників і відмежувалися від його руху. Родзаєвскій поринув у глибоку депресію, призвичаївся до пиятики й дедалі небезпечнішої параної - то були похмурі дні Зєї.\n\nТа коли ворогів викорінили, розкольників приборкали, большевиків знищили, а навіжених сектантів стерли на порох, Константін Родзаєвскій відновив дух і переродився як Вождь: завойовуючи дедалі більшу частину Росії, він намагався позбутися алкоголізму, а параноя розвіювалася разом з останніми внутрішніми ворогами. Навіть підступні німці, на яких Вождь колись рівнявся, показали справжнє обличчя, знехтувавши ним. Але це була не трагедія, а прозріння. Вождь зрозумів: німці - закляклі невдахи, що не спромоглися збудувати власну націонал-соціялістичну утопію; сама німецька раса стала суцільним розчаруванням. Вождь збагнув, що слов'янинові не потрібна чужа милиця.\n\nНаціональна держава, плід тяжкої праці Родзаєвского, стала першим серйозним кроком до Росії, зміцненої націонал-соціялізмом. Він іде вперед, із полум'ям націонал-соціялізму в серці й цілковитою вірою в майбутнє - націонал-соціялістичне майбутнє. Слов'янське майбутнє."

 ### Leader Traits ###
 the_vozhd_of_the_russians: "Вождь російського народу"

 ### Ministers ###
 AMR_Lev_Okhotin: "Лєв Охотін"
 AMR_Lev_Okhotin_hog_desc: "§YСекретар РФП\nКлерикальний фашизм§!\n--------------\n§LЛєв Павловіч Охотін народився й виріс у Чіті. 1920 року, у дев'ятирічному віці, Охотін разом із сім'єю - переконаними царистами - втік із міста до Харбіна, побоюючись відплати наступаючих совєцьких сил. Юнак-вигнанець із нещасливим домашнім життям став природним і молодим поповненням щойно створеної Россійской Фашистской Партії Родзаєвского. Приєднавшись 1932 року як один із перших членів організації й невдовзі полишивши роботу в Харбінському педагогічному інституті, Охотін швидко став одним із небагатьох друзів Вождя.\n\nКоли царисти обірвали зв'язки, підступний Матковскій утік до Маґадана й розколов партію, а параноя Вождя охопила його та позбавила будь-якої впевнености, Охотін залишився вірним - попри дедалі більшу відчуженість Вождя, попри дедалі менші ресурси Всеросійської армії, попри насторожені погляди й підозрілий шепіт Алєксандра Болотова.§!"

 AMR_Nikolay_Zaerko: "Ніколай Заєрко"
 AMR_Nikolay_Zaerko_hog_desc: "§YСекретар РФП\nКлерикальний фашизм§!\n--------------\n§LНовий партійний секретар Россійской Фашистской Партії після чистки Лєва Охотіна, Ніколай Івановіч Заєрко має порівняно визначну кар'єру на службі мрії про російський фашизм - наскільки така кар'єра взагалі може бути визначною. До підвищення він служив ад'ютантом Родзаєвского.\n\nЯк і слід чекати від ад'ютанта, піднесеного до другого місця в державі, Заєрко - відданий підлабузник, цілковито вірний кожному слову з уст Родзаєвского й ладний сприймати його заяви як слова самого Христа. Родзаєвскому саме це й подобається в заступникові, тож стосунки Заєрка з начальником лишаються як ніколи добрими.§!"

 AMR_Mikhail_Spasovsky: "Міхаїл Спасовскій"
 AMR_Mikhail_Spasovsky_for_desc: "§YМіністр закордонних справ\nКлерикальний фашизм§!\n--------------\n§LМіхаїл Міхаїловіч Спасовскій, безперечно найстарший серед керівників Россійской Фашистской Партії, народився в XIX столітті в Санкт-Петербурзі, тодішній столиці Російської імперії. Замолоду він належав до чорносотенців - ультранаціоналістичного реакційного руху, що до Першої світової війни пронизував окремі верстви імперського російського суспільства. Після краху руху під час Лютневої революції Спасовскій подався на схід разом із російським білим рухом і зрештою оселився в маньчжурському Харбіні.\n\nПлин часу й сувора дійсність життя спершу в Харбіні, а потім на Амурі не пощадили старого реакціонера. Попри близькі стосунки з Вождем і вельми шановане становище в партії, Міхаїлу Спасовскому вже за сімдесят. Додатковий тягар дедалі дужчої параної Вождя теж не пішов літньому партійцеві на користь. Попри повагу Родзаєвского й невпинні похвали на адресу свого міністра закордонних справ, дедалі складніші серцеві недуги змушують поважного фашиста відчувати, що жити йому лишилося недовго.§!"

 AMR_Georgy_Shekherev: "Ґєорґій Шехєрєв"
 AMR_Georgy_Shekherev_for_desc: "§YМіністр закордонних справ\nКлерикальний фашизм§!\n--------------\n§LНароджений у Російській імперії 1916 року, лише за кілька років до того, як Російська революція зруйнувала вікові імперські установи, Ґєорґій Владіміровіч Шехєрєв разом із сім'єю переселився до Харбіна після перемоги совєтів над білим рухом. Замолоду він недовго вчився на вчителя російської школи, але його вабив Загін Асано - сформований з етнічних росіян підрозділ під командуванням японських офіцерів Квантунської армії.\n\nКоли Загін Асано розрісся до кількох фактично незалежних бригад, Шехєрєв опинився на орбіті Россійской Фашистской Партії, чимало членів якої служили також у Бригадах Асано. Захопившись рухом, він іще більше зблизився з Родзаєвскім, читаючи його праці, передусім «Абетку фашизму». Зрештою вступивши до партії, а згодом і до її воєнізованого крила чорносорочечників, Шехєрєв вразив товаришів і начальників відданістю справі та здатністю виконати майже будь-яке завдання - хоч би скільки праці чи жорстокости воно вимагало.\n\nВід часу прибуття партії на Амур Шехєрєв посів чільне місце і в самій партії, і поруч із Константіном Родзаєвскім як очільник руху чорносорочечників РФП. Стоячи на роздоріжжі, він відчайдушно прагне відвести партію від бандитських методів Алєксандра Болотова, через що між двома чоловіками ширшає прірва. Однак його сковують сама природа й призначення очолюваної ним організації.§!"

 AMR_Konstantin_Steklov: "Константін Стєклов"
 AMR_Konstantin_Steklov_eco_desc: "§YМіністр економіки\nКлерикальний фашизм§!\n--------------\n§LЗ причин, відомих лише йому самому, чоловік, народжений як Ґєорґій Ніколаєвіч Жіряков, давно зрікся первісного імени й прибрав нову особисту ідентичність - можливо, аби вона відповідала політичній. Хай які були його мотиви, Константін Алєксєєвіч Стєклов десятиліттями лишався відданим послідовником фашизму. Спочатку він належав до Всеросійської фашистської організації Вонсяцкого, після її розколу став на бік РФП, а по відокремленні Матковского рушив за Вождем до Зєї.\n\nСтєклов старий навіть за мірками білого керівництва: він служив у Великій війні, Громадянській війні та війську воєнного ватажка Чжан Цзунчана. Не такий фанатичний, як Родзаєвскій, він усе ж затятий фашист і реакціонер, готовий чинити найжахливіші злочини, які тільки можна уявити, аби відбудувати Батьківщину за Вождевим задумом. На його погляд, рабство й геноцид - мізерна ціна.§!"

 AMR_Alexander_Bolotov: "Алєксандр Болотов"
 AMR_Alexander_Bolotov_sec_desc: "§YМіністр безпеки\nУльтранаціоналізм§!\n--------------\n§LАлєксандр Алєксандровіч Болотов народився й виріс за неясних обставин, а 1926 року втік із Совєцького Союзу до Харбіна. Від часу вступу до Россійской Фашистской Партії його відданість партії та Вождю могла зрівнятися лише з готовністю чинити насильство проти ворогів партії й російського народу.\n\nКоли після відступництва розкольника Матковского та краху єдиного фронту з монархістами параноя Вождя почала лише посилюватися, Болотов зміцнив вплив на диктатора й часто нашіптував йому імена для чисток. Утім, найчастіше це були імена тих, до кого сам Алєксандр Болотов мав давні претензії...§!"

 ### Commanders ###
 MILITARY_LEV_OKHOTIN_DESC: "§LЛєв Павловіч Охотін народився й виріс у Чіті, місті, яким тепер невміло правлять царистські розкольники. 1920 року, у дев'ятирічному віці, Охотін разом із сім'єю - переконаними царистами - втік із міста до Харбіна, побоюючись відплати наступаючих совєцьких сил. Юнак-вигнанець із нещасливим домашнім життям став природним і молодим поповненням щойно створеної Россійской Фашистской Партії Родзаєвского. Приєднавшись 1932 року як один із перших членів організації й невдовзі полишивши роботу в Харбінському педагогічному інституті, Охотін швидко став одним із небагатьох друзів Вождя.\n\nУважний слухач і природжений повірник, він піднімався лавами РФП, доки не став другою людиною після Родзаєвского - фактично виконавцем волі Вождя у Всеросійському уряді як керівник організаційного крила партії.\n\nНепохитно відданий Константіну Родзаєвскому особисто й ідеологічно, Лєв охоче пішов за ним на російський Далекий Схід і навіть дістав довіру очолити всі збройні сили РФП.\n\nКоли царисти обірвали зв'язки, підступний Матковскій утік до Маґадана й розколов партію, а параноя Вождя охопила його та позбавила будь-якої впевнености, Охотін залишився вірним - попри дедалі більшу відчуженість Вождя, попри дедалі менші ресурси Всеросійської армії, попри насторожені погляди й підозрілий шепіт Алєксандра Болотова.§!"

 MILITARY_GEORGY_SHEKEREV_DESC: "§LНароджений у Російській імперії 1916 року, лише за кілька років до того, як Російська революція зруйнувала вікові імперські установи, Ґєорґій Владіміровіч Шехєрєв разом із сім'єю переселився до Харбіна після перемоги совєтів над білим рухом. Замолоду він недовго вчився на вчителя російської школи, але його вабив Загін Асано - сформований з етнічних росіян підрозділ під командуванням японських офіцерів Квантунської армії.\n\nКоли Загін Асано розрісся до кількох фактично незалежних бригад, Шехєрєв опинився на орбіті Россійской Фашистской Партії, чимало членів якої служили також у Бригадах Асано. Захопившись рухом, він іще більше зблизився з Родзаєвскім, читаючи його праці, передусім «Абетку фашизму». Зрештою вступивши до партії, а згодом і до її воєнізованого крила чорносорочечників, Шехєрєв вразив товаришів і начальників відданістю справі та здатністю виконати майже будь-яке завдання - хоч би скільки праці чи жорстокости воно вимагало.\n\nВід часу прибуття партії на Амур Шехєрєв посів чільне місце і в самій партії, і поруч із Константіном Родзаєвскім як очільник руху чорносорочечників РФП. Стоячи на роздоріжжі, він відчайдушно прагне відвести партію від бандитських методів Алєксандра Болотова, через що між двома чоловіками ширшає прірва. Однак його сковують сама природа й призначення очолюваної ним організації.§!"

