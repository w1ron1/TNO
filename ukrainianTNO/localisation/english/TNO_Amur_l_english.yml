 ########################

 amur.1.t: "Спадкоємці Харбіна"
 amur.1.desc: "Тридцять років... Тридцять років ми билися, тридцять років стікали кров'ю, тридцять років чекали, і все ж... не досягли нічого.\n\nПадіння нечестивого Совєцького Союзу мало стати нашою годиною перемоги, тріюмфом, коли ми пройдемо Транссибірською залізницею й об'єднаємо всю Матінку-Росію під проводом Родзаєвского та РФП. На жаль, сталося непередбачене: Міхаїл Матковскій, колишній союзник Родзаєвского, разом із так званим «царем» Міхаїлом зрадили наш славний рух і вирішили викроїти власні жалюгідні вотчини в Маґадані й Чіті. Вони зупинили всі наші успіхи у Визволенні та замкнули нас в одному з найвіддаленіших куточків Сибіру.\n\nТож ми й лишилися тут, в Амурі, ослаблені зрадниками настільки, що можемо лише брязкати зброєю та вихваляти минулі часи. Проте за ці тридцять років ми навчилися принаймні терпінню... Можливо, не в цьому десятилітті, не в наступному й навіть не за нашого життя, але одного дня ми скинемо Зрадників і знову визволимо Святу Росію!"
 amur.1.a: "Слава Россіі!"

 amur.2.t: "Питання Блаґовєщєнска"
 amur.2.desc: "Блаґовєщєнск - місто малої вартости й іще меншої ваги. Принаймні так його бачать японці. Приєднавши місто до свого жалюгідного маріонеткового королівства Маньчжоу-ґо, вони перейменували його на Хайланьпао, так само як учинили, коли вкрали Владивосток - величну східну перлину.\n\nДля Родзаєвского ж це місто означає цілий світ, адже це рідне місто Вождя. А отже, це також місце народження РФП та російського націонал-соціялізму, а коли ми заволодіємо всією Росією, стане місцем народження самої нації. Кожен добрий націоналіст знає: коли рідний дім окупований чужоземними загарбниками, це неприйнятно й тяжко підриває дух народу. Як царі билися б до останнього за Санкт-Пєтєрбурґ, так і ми мусимо повернути Блаґовєщєнск!\n\nНа щастя, ні японці, ні їхні маньчжурські слуги не мають справжнього інтересу до міста, а отже, навряд чи матимуть вагому причину відмовити в праведній вимозі Вождя щодо нашої суверенної землі. Вони позбудуться «проблемного» населення й здобудуть нашу вічну вдячність... разом із певними розумними поступками своїм жадібним промисловцям, без сумніву."
 amur.2.a: "Певен, вони погодяться."

 amur.3.t: "Прикордонний патруль"
 amur.3.desc: "Постріли, гавкіт собак і яскраве світло автомобільних фар та ліхтарів виказували нічні прикордонні патрулі - ті самі, яких намагалися уникнути Антон Швєц і його майбутня дружина. Загорнуті в найтепліший одяг, який мали, зокрема тонкі куртки й чоботи, обоє несли за плечима великі наплічники. Нещодавно сусід, що покопався в історії його родини, викрив жидівське походження Швєца. Не бажаючи чекати на страту, він переконав кохану втекти разом із ним на захід, до Іркутска.\n\nУникаючи доріг, пара пробиралася на захід канавами ліворуч від нечисленних шляхів. Навіть удень мандрувати сибірською глушиною було небезпечно, а в суцільній нічній темряві - неможливо. Тож двоє втікачів повзли вперед, здавалося, черепашачою ходою, намагаючись уникати будь-кого, а надто вкрай суворих прикордонних патрулів РФП. Швєц, який колись працював урядовцем із постачання в тих самих патрулях, від яких тепер тікав, добре знав їхню славу. Часто вони просто розстрілювали втікачів на місці. Тих, кого не страчували, катували й допитували, підозрюючи у ворожому аґентстві. Подейкували, патрулі часом навіть заходили на землі поза владою Родзаєвского й тероризували села в межах досяжности. Швєц пам'ятав про все це, важко ступаючи далі на захід узбіччям дороги. Зрештою вони дісталися мосту через неглибоку, але напевне крижану річку. Швєц глянув на супутницю, потім на міст, а тоді над гамором дикої природи почало наростати далеке гудіння двигунів. Над пагорбом за мостом з'явилося світло, і Швєцу довелося вирішувати. Він коротко наказав: «Лягай!» - і розпластався край дороги. Спершу Швєц думав або перебігти міст, або перейти річку, але обидва варіянти означали певну смерть: у другому випадку від холоду й води, у першому - від фашистів. Лежачи там, вони чекали, доки патруль мине. За гудінням коліс рахували: одна вантажівка, дві... а де третя? Швєц поволі підвів голову й побачив, що третя вантажівка зупинилася відразу за мостом, а з неї виходили солдати. «Біжи!» - закричав Швєц, але щойно жінка підвелася, щоб утекти, в неї двічі вистрілили. Швєц не наважився ворухнутися й лише поволі підняв руки, доки солдати його оточували."
 amur.3.a: "На північному фронті все тихо."

 amur.4.t: "День випуску"
 amur.4.desc: "«Перед Богом складаю цю святу присягу: безумовно коритися Вождю російської нації й народу Константіну Родзаєвскому, головнокомандувачу Всеросійської армії, та як хоробрий солдат повсякчас бути готовим віддати життя за цю присягу». Антон із запалом завершив клятву вірности, випнув груди, ударив правим кулаком у груди, а тоді рвучко простягнув руку вперед і вгору перед зібраними товаришами. «Слава Росії!» - вигукнув він, і голос чисто пролунав у холодному повітрі лекційної зали.\n\n«Слава Росії!» - громовим одностайним ревом відповіли курсанти, також салютуючи найновішому армійському лєйтєнантові.\n\n«Слава Росії!» - гаркнув майор Корбут, своєю чергою віддав честь, ступив перед Антоном, дістав латунні лєйтєнантські відзнаки й прикріпив їх йому на груди. «Лєйтєнантє Антоне Міхаїловічу Мєльнікове, віднині ви офіцер Всеросійської армії. Тепер ви втілюєте все найкраще в російській расі. Ви не схибите. Ви не похитнетеся. Ви не віддасте ворогові ані кроку. Ви боронитимете славу Вождя і Всеросійського уряду від жидо-большевицької загрози та її маріонеток, хоч де вони ховатимуться. Ви зрозуміли?»\n\nАнтон знову віддав честь, так стрімко й далеко викинувши руку, що відчув хрускіт у лікті. «Так точно! Слава Росії!»\n\nКорбут схвально кивнув, і Антон дозволив собі радісно всміхнутися. Він знав, що відзначився: здобув найвищі оцінки на кожному курсі, граючи пройшов усі фізичні випробування й довів свою відданість, донісши на вироджених гомосексуалістів, які проникли до Родзаєвської офіцерської академії. Як добрий християнин, він, звісно, розумів цінність смирення, однак у цю мить Антон Міхаїловіч дозволив собі насолодитися заслуженою гордістю."
 amur.4.a: "Взірець російського народу!"

 amur.5.t: "Уроки Кемпейтай"
 amur.5.desc: "Кохаку Танака був рідкісним явищем у Кемпейтай: він вільно говорив російською. Під час служби в Харбіні та роботи з російським білим рухом, який Японія прихистила для боротьби з Совєцьким Союзом, Кохаку дуже зацікавився мовою й за роки в Маньчжурії добре її вивчив. Тому старий аґент Кемпейтай став природним кандидатом для відрядження до Зєї.\n\n«Це останнє завдання, обіцяємо, а тоді все», - сказали йому, коли він заперечив проти призначення.\n\nВін уже давно хотів піти у відставку: десятиліттями не бачив рідного міста й аж ніяк не молодшав. Але тепер Кохаку опинився в крижаному Амурі й навчав російських чорносорочечників придушувати інакодумство - передавав тяжкі уроки, які Кемпейтай засвоїла в Японії, Кореї, Китаї та за їхніми межами. Вони відіграли вирішальну роль відразу після війни, забезпечивши безпеку Сфери співпроцвітання. Сам Кохаку не брав у цьому вагомої участи, але його докладно ознайомили й навчили, що та як було зроблено. Тепер він передавав ці знання росіянам. Система була неідеальна, але працювала.\n\nПісля короткого семінару про добування інформації та катування Кохаку сидів за столом перед аудиторією й робив японською нотатки для своїх кураторів у Харбіні, зокрема про матеріял і зрозумілість викладу. Раптом у двері постукали.\n\n«Увійдіть», - сказав Кохаку російською з виразним японським акцентом. Увійшов молодий чорносорочечник, не старший за двадцять чотири роки. Зазвичай такі молоді «учні» тут були рідкістю. Проте Кохаку знав його - Власа Козлова. Він добре вчився, ставив багато запитань, а слава про його жорстокість уже ходила серед старших товаришів.\n\n«Пане Кохаку, - заговорив Козлов, - у мене є запитання про ваш семінар, на якому я був кілька днів тому. Ви говорили про придушення спротиву на нещодавно завойованих територіях і згадали про розділення родин та громад за культурними ознаками. А що, як різних культурних груп немає?»\n\nКохаку подумав, що запитання добре, й відповів: «Тоді шукайте інші відмінності. Селянин і дворянин, землероб і фабричний робітник. Завоювати може кожен, але щоб утримати завойоване, треба розділяти. Культурні межі використовувати найпростіше, та згодиться будь-який поділ»."
 amur.5.a: "Якщо справа зроблена, метод не має значення."

 amur.6.t: "За Батьківщину"
 amur.6.desc: "У Вождевій Всеросійській армії не було особливих солдатських вигод. Люта погода, люта дисципліна й люті вороги - так чимало старших вояків називали «Три лютощі», які кожен фашистський солдат мусив здолати, щоб стати справжнім чоловіком. Це не було цілковитою неправдою, але й зображувати військо Родзаєвского як суцільно драконівську організацію було б неточно. Бойовий дух стояв високо, вище, ніж будь-коли. Люди на кшталт Юрія Орлова, шістнадцятирічного хлопця, який збрехав про свій вік, щоб вступити до війська, були не просто неохочими призовниками. Орлов утратив батька у війні з Відступником у Маґадані й був ідеологічним фанатиком: і батько, і школа переконали його, що Россійская Фашистская Партія та Вождь є найвищою світською владою на Землі. Засліплений захватом, невдовзі після шістнадцятиріччя Орлов прийшов до вербувальної управи й записався до армії. Ідеальною фізичною статурою він не вирізнявся: був трохи нижчим за більшість і значно худішим, ніж належало, мабуть, через недоїдання. Проте ідеологічно був таким самим завзятим, як найфанатичніший чорносорочечник, - і таких, як він, було чимало.\n\nОдного дня після навчань Юрій із побратимами не мав жодних справ - рідкісна мить у суворому житті всеросійського солдата. Товариші вирішили піти до церкви, а тоді до найближчого містечка, проте Юрій лишився в казармі читати. Місцевий чорносорочечник-політрук дав йому кілька кишенькових видань праць Вождя, серед яких були «Азбука Фашизма» та «Сучасна юдаїзація світу, або жидівське питання у XX столітті». Обидві праці належали до ранніх публікацій Вождя, але Орлов хотів почати від самого початку. Сховавши рушницю як належить і вдягнений у повсякденну форму, він відкинувся на незручному ліжку й розгорнув кишенькову книжечку. Шістнадцятирічний хлопець, який за все життя не стикався з жодною іншою ідеологією, був зачарований викладеними темами, зокрема отруйністю большевизму й небезпекою жидівської змови. Коли друзі повернулися з міста, він збуджено розповідав їм усе, що дізнався з писань Вождя."
 amur.6.a: "«Брати, слухайте! Ми мусимо остерігатися большевика...»"

 amur.7.t: "Ворог"
 amur.7.desc: "ГРОМАДЯНИ ВСІЄЇ РОСІЇ!\n\nУказом Вождя наведені нижче групи оголошуються поза законом, зрадниками та ворогами держави!\n\nЖИДІВСТВО: Усі жиди, хоч де вони ховаються, - смертельні вороги Божого народу й протилежність нашій чистій російській культурі. Це найбільший ворог, із яким будь-коли стикалася цивілізація, та вони удають слабких. Не дайте їхній кількості чи вигляду себе обдурити: вони скористаються кожною нагодою, щоб розжиріти на крові вашій і вашої родини! Побачивши жида, не вагайтеся: чоловік це, жінка чи скигляче поріддя - дійте швидко й без милосердя! Якщо вони переважають числом, звертайтеся до місцевого ополчення РФП, бо жиди мають ницих хитрощів досить, щоб у гурті стати небезпечними!\n\nБОЛЬШЕВИКИ: Огидна суміш жидів і їхніх плазуючих слуг, большевики стали знаряддям, яким сіонські старійшини повалили Святу Росію. Большевиків легко розпізнати навіть під личиною завдяки їхній схильності до виразно жидівської поведінки. Це божевільні ідеологи, які без вагань крастимуть і вбиватимуть заради задумів своїх господарів. Проте облудність є їхньою другою натурою, й вони підуть на все, щоб приховати справжню сутність. Якщо ви підозрюєте когось у большевизмі чи його впливі, негайно повідомте найближчого представника Россійской Фашистской Партії!\n\nМАСОНИ: Найхитріші й найпідступніші наші вороги, масони - це аґенти жидо-большевизму, що заполонили кола багатства й влади. Кожен чоловік зі значними статками або розумом, який не присягнув Вождю на цілковиту вірність, може бути масоном чи їхнім аґентом, а тому повсякчас потребує якнайпильнішого нагляду. Якщо друг, родич або знайомий почав незрозуміло багатіти чи жінка зацікавилася розумовими справами - повідомте представника Россійской Фашистской Партії. Він проведе ретельне розслідування, щоб ви заспокоїлися, а ваш народ був у безпеці.\n\nВиконайте свій обов'язок перед Богом, Родиною та Нацією! Будьте завжди пильними й допомагайте берегти Святу Росію в безпеці, свободі та спокої!"
 amur.7.a: "Завжди корисно бути поінформованим!"

 amur.8.t: "Свята місія"
 amur.8.desc: "Коли читання Євангелія скінчилося, новий Патріярх Росії ступив на місце диякона перед своєю паствою. Колись скромну церкву в Зєї від підлоги до кроков прикрасили золотом та іконами, привезеними з Харбіна. Величезна юрба чорносорочечників, солдатів і звичайних містян заповнила приміщення, тулячись у кожному кутку, наче сардини в банці. Ті, хто не вмістився, юрмилися біля прочинених дверей, прагнучи почути першу проповідь єрарха.\n\n«Брати й сестри у Христі, - почав він голосом, сповненим суворої сили досвідченого проповідника, - ми живемо в найтемніші часи. Господь дивиться на нашу святу землю й, безперечно, плаче. Там, де колись стояла нація мудрих священників, смиренних селян і побожних воїнів, тепер лишилися самі попіл і руїни. Його обраний народ спустошили війна, голод, мор і чвари. Усі ми шукаємо відповідей, що заспокоять наші душі, а найважливіше питання таке: кого маємо звинувачувати? Хто приніс сатанинську погибель Святій Росії?»\n\nНа мить церква замовкла, й було чути тільки тихий свист вітру крізь розхитану ґонту. «Сини Каїна!» - раптом загримів Патріярх, цілковито заволодівши увагою слухачів. «Убивці Христа, які поколіннями жили в оселі вірних, наче щури в стінах! Учні Юди, що множаться з кожним роком, п'ють кров Господніх дітей і справляють моторошний бенкет зі Святої Росії! Хто врятує нас від цих паразитів, паство моя? Хто понесе смолоскип істинної віри й здійме Христовий бич, щоб вигнати жида?»\n\nПатріярх здійняв руки до небес, а піт захвату стікав у його попелясту бороду. «Вождь, діти мої! Його ім'я - сповнене пророцтво; Константін відроджений, що прийшов привести Святу Росію до спасіння! Його воля й видіння, даровані Святим Духом, освітять шлях нашим хоробрим християнським воїнам, коли вони зметуть фарисейський большевизм і визволять наш земний рай від поплічників Великого Обманщика! Невдовзі Господь знову нам усміхнеться, і все Творіння пізнає Христову істину націонал-соціялізму!»"
 amur.8.a: "Амінь!"

 amur.9.t: "Параноїдальний Вождь"
 amur.9.desc: "Константін Родзаєвскій, Вождь усього російського народу й справжній провідник Россійской Фашистской Партії, зайшов до кабінету у своєму звичному псевдовійськовому вбранні. Знявши кашкета, він поклав його на старомодний дубовий стіл і провів рукою по сивому волоссю. «Ще одна безсонна ніч...» - пробурмотів він, сідаючи в крісло й тяжко зітхаючи. На столі вже охайно лежали звіти про переміщення військ, підозрюваних зрадників і виробничі норми - мабуть, їх поклав якийсь ординарець чи помічник, чиє ім'я він навіть не намагався пам'ятати. Усі звіти підписав його довірений Болотов, що за останнє десятиліття став одним із найближчих союзників. Родзаєвскій не звернув уваги ні на що, крім звітів про підозрюваних зрадників. Відкривши теку «внутрішнє інакодумство», він переглянув кілька імен, бурмочучи собі під ніс: «Боґачьов... Ткачьов...» На третьому імені брови піднялися: Рижов. Міхаїл Рижов був надзвичайно відданим високопоставленим партійцем у Зєї, якого Родзаєвскій особисто знав багато років, але це певною мірою мало сенс. Близько року тому він пожартував про партійну фінансову інфраструктуру в Зєї, а Болотов надав досить переконливі докази його зв'язку з давно зниклим зєйським банкіром Бєрєжним, який намагався приховати своє жидівське походження. Вождь скривився. Замінити Рижова буде нелегко, але якщо він знався з Бєрєжним, то з ким іще водив компанію? Родзаєвскій підняв слухавку й набрав свого довіреного міністра безпеки. «Я бачив нові списки. Беріться за Рижова. Беріться за всіх».\n\nНасправді Рижов був невинний. Єдиним його спілкуванням із Бєрєжним була словесна лайка через жидівське походження останнього. Параноя Вождя затьмарила його судження, але доки Болотов постачав нових «зрадників», підозри Родзаєвского вгамовувалися. Відколи Відступник розколов партію, а єдиний фронт розпався, над Всеросійською державою панували підозри Вождя."
 amur.9.a: "Хмари згущуються."

 amur.10.t: "Чистка Вєрховного Совєту"
 amur.10.desc: "Вєрховний Совєт засідав раз на день, зазвичай уранці, сім днів на тиждень у столиці Всеросійського уряду. Будівлю, переобладнану з готелю, змусили виглядати значно величнішою, ніж вона була насправді. На даху старого готелю встановили величезну сяйну свастику, подібну до тієї, яку Родзаєвскій десятиліття тому встановив у будівлі РФП у Маньчжоулі. Офіційно Вєрховний Совєт був урядовим органом, що мав ухвалювати закони, забезпечувати виконання постанов і допомагати Вождю в його прагненні об'єднати Росію. Проте незалежному спостерігачеві він більше нагадував короля з двором, ніж раду рівних. Насправді Вєрховний Совєт мав мало влади. Більшість його членів були найдавнішими головорізами РФП, ще з часів вигнання руху до Харбіна, і майже ніхто з них не насмілювався заперечувати політиці Вождя, особливо за його нинішніх мінливих настроїв.\n\nОтже, Вєрховний Совєт був радше кімнатою відлуння Родзаєвского, ніж дієвим урядовим органом. Проте навіть це не заважало параноїдальному Вождю бачити інакодумців серед найдавніших і найнадійніших радників. Тому, коли Совєт зібрався цього ранку, Родзаєвскій, Болотов і Охотін стояли в кінці конференційної зали й дивилися, як чорносорочечники силоміць піднімають із місць і заарештовують кожного третього члена Совєту за антиросійську діяльність. Найближчими днями всіх заарештованих публічно судитимуть і повісять, їхні імена викреслять із партійного реєстру, а пам'ять поховають.\n\n«Нарешті, - сказав Родзаєвскій Болотову, - ми забезпечили найвищі щаблі партійного керівництва».\n\nМіністр безпеки мовчки погодився. «Звісно, мій Вождю. Вони змовлялися. Добре, що ми їх позбулися». Навіть Болотов уже почав сумніватися в масштабах своїх чисток: скільки мине часу, перш ніж Родзаєвскій обернеться проти нього?"
 amur.10.a: "Інакодумці самі себе не ліквідують."

 amur.11.t: "Старі друзі"
 amur.11.desc: "Болотов нервово глянув на годинника. Той показував 1:13 ночі. Подейкували, що Родзаєвскій зазвичай не спав о цій порі, але рідко скликав радників у якихось державних справах. «Але навіщо він викликав мене?» - питав себе Болотов, поспішаючи до резиденції Вождя. Невже він нарешті став непотрібним?\n\nКоли Болотов увійшов до кабінету Родзаєвского, то застав Вождя з пляшкою горілки й кількома документами на столі. Болотов одразу їх упізнав: це були папери, які він передав Вождю минулого вечора. Серед решти звітів він нишком підсунув досьє про діяльність Льва Охотіна, давнього заступника Родзаєвского. Того звинувачували в розкраданні та хабарництві, а до досьє додавалася ледь простежувана схема руху грошей. Коли Болотов увійшов, Родзаєвскій навіть не привітався.\n\n«Це правда?» - запитав він. У його голосі чулася виснаженість, а в очах - відчуття зради; понад те, очі були налиті кров'ю, з мішками під ними. Чутки не брехали: Вождь страждав на безсоння. Болотов навіть не намагався вдати, ніби нічого не знає.\n\n«Так свідчать докази, мій Вождю. Я й сам не міг повірити. Лєв крав у партії... ну, мабуть, роками». Запала пауза.\n\n«А що з хабарями? Ми можемо перевірити тих, хто брав гроші, запропоновані Охотіним?» - запитав Родзаєвскій. Міністр безпеки скривився.\n\n«На жаль, ні, мій Вождю... Ви ж бачите тут імена: Квассов і Боґачьов. Обох страчено за зраду, другого - минулого тижня. Схоже, ми дісталися до них першими». Запала друга, затяжна тиша; Болотов ніяково стояв перед столом Родзаєвского. Той мляво махнув рукою.\n\n«Вільні».\n\nКоли Болотов вийшов, думки Вождя заметушилися. Невже Охотін міг так довго це приховувати? Як він міг так учинити? Чи це лише підступ Болотова, щоб усунути конкурента?"
 amur.11.a: "Час лягати спати, Охотін ніколи б так не вчинив."
 amur.11.b: "Не терпи зрадника."

 amur.12.t: "Не терпи зрадника"
 amur.12.desc: "Родзаєвскій і Болотов довго сперечалися про характер суду над Охотіним: перший хотів закритого процесу, а другий прагнув показати, що Вождь не знає милосердя до зрадників, хоч би яке становище вони посідали. Зрештою гору взяла думка Вождя. Попри зраду Охотіна, він не міг змусити себе прилюдно зганьбити одного з найближчих друзів і послідовників. Той десятиліттями лишався з ним і в горі, і в радості. Після засідання Вєрховного Совєту Льва Охотіна тихо заарештували й доправили до однієї з численних політичних в'язниць, де тримали приречених на страту або тих, кого вважали недостатньо важливими, щоб убивати. Там його немилосердно били ті самі чорносорочечники, яких він допомагав приймати до руху, а він увесь час запевняв у своїй невинності й відданості Вождю. Зрештою Родзаєвскій сам прийшов навідати старого друга. Коли двері кімнати допитів відчинилися, Вождь і Охотін поглянули один на одного. Один - параноїк із безсонням, запалими очима й суворим обличчям, постарілий не по роках. Другий - старший чоловік, геть лисий, із плямистою та поритою шкірою після років алкоголізму й життя в суворому кліматі, побитий до невпізнання. Обидва разюче відрізнялися від тих людей, якими були в Харбіні.\n\n«Вийдіть», - тихо наказав він чорносорочечникам, приставленим охороняти Охотіна. Коли вони рушили до виходу, Родзаєвскій зупинив останнього. «Ти, залишся», - наказав він. Родзаєвскій, із пальтом, що висіло на його згорбленій постаті, підійшов до прив'язаного посеред кімнати до стільця Охотіна. Він опустився навколішки, щоб дивитися другові просто у вічі. Після паузи Родзаєвскій запитав: «Чому? Чому ти це зробив?»\n\nЛєв відповів розпухлими губами: «Я нічого не зро...» - Вождь урвав його.\n\n«Замовкни!» - закричав він. «Ти, убий його», - сказав він чорносорочечникові, що залишився, підводячись на ноги. Той вихопив пістолет.\n\nТоді Охотін усе зрозумів: його очі розширилися, і він заговорив. «Присягаю у своїй відданості Росії та моєму Вождю! За Бога, Націю і...»\n\nПостріл поміж очі обірвав Охотіна, вбивши його на місці."
 amur.12.a: "Memento Mori."

 amur.13.t: "Всевидюще око"
 amur.13.desc: "Однією з небагатьох організацій, які ще прагнули покласти край владі Константіна Родзаєвского на підконтрольній Вождю території, були «Сини царя» - невелика монархічна група, що співчувала справі Міхаїла II. Її члени здебільшого обіймали нижчі бюрократичні посади в місті Родзаєвску; раніше їх захищала некомпетентність маньчжоу-ґоської влади, а від білого руху на сході вони були цілковито відрізані. Можна сказати, вони ховалися в усіх на видноті. Аж доки в одного з них не здали нерви. Після допиту - звичайної процедури, за допомогою якої чорносорочечники викорінювали зрадників, - він вирішив у всьому зізнатися. Прийшовши до крайового партійного відділення в Родзаєвску, він розповів чиновникам усе, що знав: плани, місця зустрічей, імена причетних і ступінь їхньої участи. Коли він закінчив, партійці розсміялися. Один зауважив, що вони вже розправлялися з рухами опору втричі більшими за його. Йому пообіцяли недоторканність, але на виході відразу ж заарештували.\n\nЧоловіка силоміць запхали до вантажівки з кількома чорносорочечниками, а потім возили із собою й примушували дивитися, як вони викорінюють кожного учасника його підпільного руху. Щоразу чорносорочечники влаштовували цілу виставу навколо ролі чоловіка в розгромі руху: з найїдкішим сарказмом робили перед ним реверанси й поклони, надмірно дякували, плескали по плечу та поводилися так, наче були його найкращими друзями, - і все це перед колишніми товаришами, яких він допоміг викрити. Коли викреслили останнє ім'я зі списку, чоловіка вивезли на околицю міста й застрелили, а тіло так і залишили непохованим. Решту просто ув'язнили в трудових таборах і відправили на примусові роботи: адже бути зрадником жахливо, але немає нічого гіршого, ніж зрадити зрадників, бо тоді не лишається вже ані крихти чести."
 amur.13.a: "Ще більше робочих рук для таборів!"

 amur.14.t: "Забезпечення відданости"
 amur.14.desc: "Родзаєвська офіцерська академія була далеко не величною спорудою. У Зєї Вождь витратив чимало часу й грошей на відновлення будівлі для офіцерів РФП, щоб вони мали зручне й престижне місце для навчання та підготовки. Однак її сестринський комплекс у рідному місті Вождя не йшов із Зєєю в жодне порівняння. Переобладнана двоповерхова школа правила і для виконання офіційних завдань РФП, і для навчання та муштри місцевих офіцерів перед відправленням на фронт. Одним із її призначень було проведення перевірок на відданість, які вигадав сам Родзаєвскій. У класній кімнаті близько тридцяти членів партії тіснилися за маленькими партами, складаючи ці іспити: від зелених чорносорочечників до літніх православних священників - здавалося, перевірку проходив кожен, хто мав бодай віддалений зв'язок із режимом. Перед класом стояв похмурий чорносорочечник років п'ятдесяти з гаком, навмисно виставивши напоказ особисту зброю. Він гавкав настанови так, наче перед ним були раби в трудовому таборі, а не партійні чиновники.\n\n«Ви маєте одну годину! Мусите відповісти на всі поставлені питання. Заборонено питати щось у сусідів або в мене. Кожен, кого спіймають на списуванні чи спробі списати, буде суворо покараний. Закінчивши, принесіть роботу наперед. Після цього вийдіть. Не затримуйтеся. Можете починати».\n\nБільшість учасників не знала, що сам чоловік, який проводив перевірку, склав її лише вчора. Звісно ж, блискуче, бо саме цього Вождь вимагав від кожної людини, пов'язаної з партією. Тих, хто не відповідав установленим нормам, чекали різні наслідки: від позбавлення титулу й партійної посади до відправлення в табори примусової праці через підозру в зраді.\n\nЯк Родзаєвскій згодом зауважив перед Вєрховним Совєтом: «І все це задля безпеки партії»."
 amur.14.a: "Чому цей олівець такий тупий?"

 amur.15.t: "Промінь надії серед загиблих зірок"
 amur.15.desc: "Усі дні Пушкіна були однакові. Сонце пекло його тіло, а тоді холод батогами болю шмагав руки й тулуб, просочувався в легені. Він уже забув, коли саме потрапив до цього табору. Місяць тому? Два? Чотири? Годинника він не мав, усі дні зливалися докупи, а м'язи дедалі слабшали. Йому здавалося, що рано чи пізно він збожеволіє.\n\nОднак дещо не давало йому втратити зв'язок із дійсністю - точніше, дехто. Голос повернув його до тями, і він відчув, як руки втомилися нести тачку. Зосередившись, він упізнав Ільянова. Повернувшись до нього, вони тепло всміхнулися один одному, і Пушкінові відразу полегшало. «Привіт, Ільянове», - сказав він, знову штовхаючи тачку. «Як ти?»\n\n«Як я?» - перепитав той із тихим смішком. Ільянов був худим, майже жилавим, але не виснаженим голодом. Серед багатьох рис Пушкін особливо любив у ньому саме цю. «Це я маю тебе питати! Ну ж бо, не падай духом: ми виберемося із цієї в'язниці й збудуємо собі життя!» Дихання Пушкіна стало трохи нерівним. «...Ти щойно сказав “ми”?»\n\nІльянов примружився й хитро всміхнувся. «Мені не треба повторюватися, знаєш. Власне...» - почав він, підходячи ближче й вирішивши побалакати з Пушкіним, щоб збавити час, доки його не помітить охоронець. «Це ж від початку була твоя ідея. Гарна хатина десь у сибірських лісах. Ти завжди хотів стати мисливцем». Пушкін непевно всміхнувся. «Н-ну, я... Я справді так казав, еге ж? Але...» Він знову оглянув табір. Атмосфера була гнітюча. Пушкін та Ільянов хотіли лише втекти, та були досить розсудливі, щоб не підставлятися під кулі."
 amur.15.a: "Сподіваюся, визволення прийде бодай колись."

 amur.16.t: "Слава Вождю!"
 amur.16.desc: "Після чистки Вєрховного Совєту Вождь був вельми зацікавлений у тому, щоб керівний орган його Всеросійської держави знову запрацював на повну силу. Кілька кандидатур висунули і вцілілі члени Вєрховного Совєту, і сам Болотов. Кожного ретельно перевірили на можливу нелояльність, а також вивчили його минулу діяльність у Россійской Фашистской Партії. Одне за одним імена викреслювали зі списку: Андрєєв мав за плечима дрібні випадки непокори, Вікторов водив надто багато сумнівних знайомств, а Ісаєва просто не дуже любили решта членів Совєту. І це лише кілька прикладів. Зрештою певні кандидатури все-таки обрали. Відданість, здібність і фанатизм - ось три якості, на яких урешті ґрунтувалося рішення. Новий Вєрховний Совєт, складений із тих, хто пережив чистку, та нових членів, став безмежно відданою Родзаєвскому установою - насправді не більш ніж відлунням його думок і вказівок.\n\n«Повторюйте за мною: я вірую в Єдиного Бога. Обіцяю служити Єдиному справжньому Вождю. Служитиму віддано, з цілковитою вірою та впевненістю в його рішеннях і переконаннях. Вірю в Россійскую Фашистскую Партію та її здатність об'єднати всіх росіян під одним стягом. За Бога, Націю і Труд!»\n\nПро церемонію приведення Вєрховного Совєту до присяги не оголошували громадськості, та й відбулася вона стримано. Її провели вдосвіта, без особливих прикрас чи святкувань, але, затвердивши кожного нового члена Совєту, Родзаєвскій вручив їм трибарвну чорно-золото-білу перев'язь, оздоблену єдиною залізною свастикою. Вождь коротко й сухо привітав їх та висловив поздоровлення, а потім указав, де їм сидіти і які обов'язки виконувати на своїх посадах. Коли церемонія добігла кінця, ранкове дійство перейшло у звичайне щоденне засідання Вєрховного Совєту. Нові члени слідом за старими рушили до зали засідань, де Вождь посів місце на чолі Совєту. Сівши в крісло, він оглянув новий склад, у чиїй відданості вже не сумнівався.\n\n«Почнімо?» - запитав він, уже знаючи відповідь."
 amur.16.a: "І знову до справи."

 amur.17.t: "Тиха ніч"
 amur.17.desc: "Столиця Россійской Фашистской Партії в Зєї вже давно стала осередком запеклих чисток Вождя, які охопили партію та все міське суспільство згори донизу. Тижнями місто вирувало: люди не лише жили звичайним життям, а й відвідували показові суди, дивилися на страти зрадників і доносили на сусідів та коханих. Останні кілька тижнів були тяжкими для всіх, а шалений темп чисток і подальших страт явно виснажив усе населення столиці. Ні в кому це не було помітно так добре, як у Константіні Фьодорові, дрібному партійному чиновникові, який сам ледве уникнув переслідувань, донісши на брата Алексєя за «антиросійську діяльність». Фьодоров працював допізна, опрацьовуючи додаткові папери, і фактично виконував канцелярську роботу за керівників, яким було не до того. Часто казали, що Россійская Фашистская Партія - живий організм, а такі люди, як Фьодоров, підтримують у ньому життя. Так чи інакше, завдяки певній вправності, певній зраді й великій удачі Фьодоров пережив чистки. Він і сам не дуже розумів, як це вдалося і що він через це відчував.\n\nФьодоров ішов звичним шляхом із роботи до жалюгідної квартири, яку ділив із дружиною та донькою покійного брата; жодна з них не знала, що саме він видав Алексєя партії. Однією вулицею, ліворуч, через дорогу - і Фьодоров вийшов на останню ділянку шляху додому, повз шибеницю в Зєї. Він добре пам'ятав, як у самому середмісті біля шибениці постійно стояв гамір: вигуки, глузування, крики, постріли. Він настільки до цього звик, що, проходячи повз шибеницю, насамперед помітив цілковиту тишу. На площі - нікого, у вечірніх сутінках не видно жодної душі; залишки денного світла доповнювали лише вуличні ліхтарі. Фьодоров зробив те, чого не робив уже кілька тижнів: зупинився. І прислухався. На обличчі молодшого чиновника з'явилася усмішка. Тиша. Цілковита, абсолютна тиша. Наче з його плечей скинули величезну каменюку, Фьодоров відчув себе вільним. Невже чистки скінчилися назавжди? Байдуже, подумав він: просто зараз він був вільний. Вільний від провини, вільний від загрози. Перш ніж продовжити шлях додому, він помолився Богові, ступаючи тепер легко й пружно."
 amur.17.a: "Невже кошмар нарешті скінчився?"

 amur.18.t: "Промова Вождя"
 amur.18.desc: "«...Ми мусимо боротися з впливом комуніста та жида скрізь, де його знайдемо! Ми мусимо послідовно викорінювати гниль большевизму з нашого народу й нашої нації, інакше ніколи не станемо справжньою силою, а будемо країною, яку топтатимуть навіть найнікчемніші світові держави! На шляху до нашої мрії стоять перешкоди, але навіть найнепереборніші труднощі нас не спинять, доки з нами сила слов'янина, сила нашого Бога й незрівнянна воля до боротьби! Згадайте Невську битву, де ми, росіяни, зіткнулися з нездоланними обставинами й усе-таки перемогли! Тих мужів надихали Бог і Нація, хоча вони й не знали нашої справи. Подумайте, чого здатні досягти ви, мої воїни, якщо опануємо силу, яку наші предки являли десятиліття тому! Уперед, мої хоробрі мужі, готуйтеся до сутички з тими, кого колись, можливо, називали братами! Бо, щоб перемогти большевика й жида, спочатку мусимо здолати крамольних зрадників і відступників, що виступили проти нашого руху. За Бога, Націю і Труд!»\n\nСьогодні Вождь Константін Родзаєвскій виголосив у своїй столиці Зєї палку й натхненну промову, після якої відбувся величний військовий парад. У ньому пліч-о-пліч марширували як регулярні збройні сили, так і воєнізовані чорносорочечники, а завершилося все церемоніяльним спаленням кількох опудал Лжецаря та Відступника з Маґадана. Промову зустріли надзвичайно добре - навіть більшість простолюду, яких про це «ввічливо запитали». Її також передавали по радіо, а у вкрай рідкісному випадку ще й по телебаченню - для тих нечисленних росіян, які мали телевізор. Виступ, що ввійде в історію як Зєйська балконна промова, надихнув збройні сили й офіційно проголосив намір Родзаєвского повернути собі неподільне керівництво Россійской Фашистской Партієй і покласти край фарсовому режиму Лжецаря в Чіті. Порівняно зі станом Вождя менш ніж рік тому, його нова бадьорість і відновлена запальність у боротьбі з ворогами розвіяли побоювання багатьох чорносорочечників і військовиків, які після його падіння в параною почали сумніватися в його спроможності керувати."
 amur.18.a: "До війни!"

 amur.19.t: "Зламана корона"
 amur.19.desc: "Зрадник. Самозванець. Виродок. Це були одні з лагідніших слів, які вигукували Міхаїлові Андрєєвічу Романову, коли його вели на шибеницю в Зєї. Розташована посеред міста, вона колись стояла на місці міського ринку, але після початку Родзаєвського терору площу переобладнали. Чиновники РФП нагнали туди чорносорочечників і селян, пообіцявши після смерти Лжецаря влаштувати бенкет. З появою Міхаїла та його чорносорочечного конвою тихе збудження юрби переросло в розгнузданий галас. Хоч майже весь час у місті він носив тюремний одяг, на страту його вбрали в царські регалії. Здавалося, полонений «монарх» дуже постарів від часу захоплення. Чорносорочечники силою прокладали шлях крізь натовп і стримували найгірші фізичні напади на Міхаїла, якого двоє з них тягли за руки й змушували йти вперед. Усю дорогу крізь юрбу до шибениці Лжецар протестував, благав про милість і просив охоронців відпустити його. Це лише додавало виставі видовищности й дедалі дужче збуджувало молодих чорносорочечників, які його цькували.\n\nНа ешафоті поряд із катом стояли призначений РФП Патріярх Східної православної церкви та сам Вождь. Патріярх здійснив останні обряди й помолився за душу Міхаїла в потойбіччі. Родзаєвскій увесь час мовчав, спостерігаючи за процесом і насолоджуючись сценою, яку Міхаїл сам для себе влаштував. Коли його готували до повішення, кат запитав, чи має він останнє слово.\n\nКрізь сльози Лжецар сказав: «Я... Я ніколи цього не хотів... Будь ласка, просто... Я хочу додому».\n\nЛяда шибениці провалилася, а смерть Міхаїла ознаменувала кінець східного монархічного руху."
 amur.19.a: "Хай знайде домівку в потойбіччі."

 amur.20.t: "Доля зрадника"
 amur.20.desc: "«...Немає нічого гіршого за зраду. Я радше обрав би власну смерть, ніж зраду, але саме вона випала на мою долю. Тож я мушу відповісти належним чином. Цим я засуджую тебе, Міхаїле Алєксєєвічу Матковскій, найгіршого зі зрадників, Відступника з Маґадана, до смерти».\n\nВід самого падіння режиму Матковского та його подальшого захоплення прихильниками Родзаєвского Відступник майже весь час мовчав, навіть під час ув'язнення й катувань. Він не визнавав своїх злочинів - розколу партії, антиросійської діяльности, порушень моралі та пристойности - ні під примусом, ні на суді. Звісно, його провина очевидна, та він не бажав грати свою роль у виставі, на яку сподівався Родзаєвскій. Попри це, страту належало здійснити. Інакше бути не могло.\n\nЦентральну площу Зєї - колишній ринок, відтоді перетворений на місце страт усіх ідеологічних ворогів Вождя, - заповнили чорносорочечники та високопоставлені члени РФП. Кожного обрали з огляду на зв'язок із партією та самим Матковскім: вони або знали його особисто, або постраждали від наслідків учиненого ним розколу партії. Через втрату друзів і рідних унаслідок розколу й подальших чисток з усіх боків десятки членів РФП залюбки прийшли на страту. Коли Матковского вивели на шибеницю, натовп обсипав його глузуваннями й образами; усіх присутніх переконали, що саме ця людина винна в їхніх бідах. На ешафоті його вже чекав сам Родзаєвскій. Дивлячись просто у вічі, Вождь запитав: «Останнє слово?» Матковскій лише дивився у відповідь, і кілька незручних секунд минули в тиші. Роздратований мовчанням, Родзаєвскій ударив полоненого кулаком у щоку. Він виплюнув Матковскому єдине слово: «Виродок». Повернувшись до ката, Вождь віддав офіційний наказ. Так закінчився розкол."
 amur.20.a: "Кінець, гідний зрадника."

 amur.21.t: "Зовсім сам"
 amur.21.desc: "Було пізно - але наскільки? Родзаєвскій не знав. Він знав лише, що міністр безпеки Болотов і двоє членів Вєрховного Совєту наполягли на зустрічі, щоб доповісти про те, як партію сприймають у Чіті, нещодавно визволеній від монархістів. Але думки його були не там, щоб сприймати принесені ними звістки. Нібито дивлячись у звіти, але насправді порожнім поглядом, Вождь чемно вислухав групу й відпустив її, щойно переконався, що вони закінчили. Коли всі вийшли, Родзаєвскій цілковито звернувся до того, що не давало йому спокою: минулого десятиліття його життя. Від полум'яного, майже проповідницького діяча в Харбіні - до воєначальника псевдодержавки в Амурській області, а зрештою до перемоги над ворогами й возз'єднання Россійской Фашистской Партії.\n\nТа він також добре пам'ятав часи, коли його вороги ще зовсім не були ворогами - ба більше, декого він навіть називав друзями. Атмосфера Харбіна й брак ресурсів у їхній боротьбі робили співпрацю між білими та фашистами - як прагматиками, так і фанатичними ідеологами - цілковито необхідною. Суперечки виникали завжди, але були й добрі часи, і лихі. Наприклад, спільна вечеря й горілка з атаманом Сємьоновим або п'яні співи пісень Білої армії з Матковскім, які лунали з його балкона в холодну маньчжурську ніч. Родзаєвскій згадав - хай лише на коротку мить, - що друзі, які стали ворогами, були не просто мішенями: вони були людьми. Після всіх зусиль Вождя, після всіх тяжких заходів із дегуманізації ворогів він не міг позбутися думки, що врешті-решт вони були людьми. Людьми, з деякими з яких його колись єднали справжні зв'язки. Він зітхнув і поглянув на звіт, що Болотов залишив на столі. Може, й люди, подумав Родзаєвскій, але однаково зрадники. Вождь вольовим зусиллям відігнав думки й спогади та взявся за звіт. Прочитав його - кожнісіньке слово - і лишився задоволений.\n\n«Погляньте, як далеко ми зайшли...» - пробурмотів він до себе. Спогади про минуле швидко змінилися підготовкою до майбутнього. Він кинув звіт на стіл, підвівся й підійшов до карти російського Далекого Сходу, яку повісив на стіні кабінету, обмірковуючи наступний крок."
 amur.21.a: "Ще одна безсонна ніч."

 amur.22.t: "Рушаючи далі"
 amur.22.desc: "«Отож, саме тому треба бути обережним, Павле», - пояснив Дмітрій, кинувши цигарку на землю й розчавивши ногою. «Хлопці на заході? Аякже, вони червоні, а значить, голова в них слабка, але їх багато. Розумієш, червоні - вони як, гм...» Він якусь мить постукав ногою, добираючи потрібне порівняння.\n\n«Як... щури, пане?» - припустив Павєл.\n\nДмітрій енергійно кивнув. «Саме так, рядовий, як щури. Упіймаєш одного - розчавиш без проблем. Задушиш, заколеш багнетом, знесеш голову - байдуже. Але якщо їх п'ять, десять чи п'ятдесят? Вони просто тебе зметуть, загризуть безліччю дрібних укусів. Хоча спершу, мабуть, покатують».\n\nПавєл зблід. Очі підлітка розширилися в помаранчевому сяйві жаровні. «П-п-покатують мене?»\n\n«А то ж», - сказав Дмітрій, припалюючи нову цигарку й затягуючись. Він на мить замовк, пригадуючи. «Було таке раз, невдовзі після нашого приходу з Харбіна. Ми тоді ще промацували кордон, вирішували, де ставити застави. Ну, мабуть, якісь хлопці з НКВД в Іркутску пронюхали про нашу появу. Поки я відливав, вони схопили мого товариша Сємьона. Знайшов його прив'язаним до дерева: причандалля відрізали й запхали йому в рота. Я озирнувся, але вони вже з'їбалися».\n\n«Йой, пане», - пробурмотів Павєл. «Вони всі такі?»\n\n«Авжеж, курва! Тому й треба бити не слабше за них. Коли я кажу тобі: “Переріж тому малому горлянку”, - наступного разу робиш це негайно, зрозумів?»"
 amur.22.a: "А як інакше він навчиться?"

 amur.23.t: "За що ми боремося"
 amur.23.desc: "«Слухайте всі!» - крикнув офіцер РФП, заходячи до брудного бару в Зєї. «Зараз говоритиме Вождь. Бармене, увімкніть радіо!»\n\nБармен, який зблід, побачивши у своєму закладі чорносорочечника, поспішив клацнути вимикачем і налаштувати приймач на потрібну частоту. Після короткої затримки, що викликала підозріливий погляд чорносорочечника, голос Вождя заповнив темну, занедбану корчму.\n\n«...ось чому ми мусимо нищити їх, попри кревні зв'язки! Пам'ятайте: якщо жид отруює кров, то комуніст розбещує душу! Большевикові немає спасіння в цьому житті, навіть якщо він ваш друг або родич. Єдине, що ви можете зробити для його жалюгідної душі, - пришвидшити її подорож до пекла, де вона, можливо, знайде хоч якесь духовне спокутування. Дозволяючи їм і далі жити поміж нас, ви лише прирікаєте ще більше своїх російських братів і сестер! Кожен помилуваний большевик наверне незліченних дітей до поклоніння червоному Юді Лєніну, а ваших дружин і дочок перетворить на повій для жидівських свиней! Запам'ятайте цей урок і виконайте свій обов'язок перед Богом і своєю расою! Слава Росії!»\n\nРадіо на мить захрипіло перешкодами, аж доки хтось на станції не клацнув перемикачем і не ввімкнув звичну патріотичну музику. «Вождь сказав своє слово, громадяни!» - проревів чорносорочечник. «Слава Росії!» Він віддав салют, озирнувся, щоб переконатися, що решта зробила те саме, і мовчки вийшов."
 amur.23.a: "Ми робимо свій внесок! Так же, люди?"

 amur.24.t: "Яскраві вогні"
 amur.24.desc: "Валєрій Саблін не бачив нічого, крім внутрішнього боку пов'язки на очах. Стара вантажівка «Ніссан», куди його кинули, повільно й тихо гуркотіла селом, у якому Червона армія дала свій останній бій. Зусібіч, виразно, мов пташиний спів літнього ранку, лунали тріск пострілів, крики вмирущих і благання мирних жителів про життя рідних, призваних до війська. Навіть під пов'язкою Саблін заплющив очі й стиснув зуби, коли крижаний вітер доніс до нього сповнені болю голоси особисто знайомих людей.\n\nНевдовзі оглушливий хаос села стих удалині: вантажівка набрала швидкість і звернула на нерівну путівець. Минуло близько години, перш ніж вони нарешті зупинилися й Сабліна грубо стягнули з кузова. Його наполовину волокли, наполовину змушували плентатися, а потім жбурнули об стіну. Хтось ухопив його за комір і зірвав пов'язку. Він побачив, що вже настала ніч, і ліхтарі катів на мить його засліпили. За краєм світла рухалися тіні - тіні з напоготовленими гвинтівками. Озирнувшись, він помітив кров і сліди від куль на стіні хати, до якої його поставили. Погляд опустився до їхнього джерела, і серце Сабліна обірвалося.\n\nБраун. Пєчуро. Улановская. Його близькі друзі та ще з десяток людей лежали, спершись об побілену стіну, в калюжах крові, прострелені наскрізь. «Ні», - прошепотів він порожнім голосом. «Фашистські чудовиська». Хтось штрикнув його цівкою гвинтівки й наказав рухатися. «Ідіть нахуй!» - виплюнув Саблін. «Вас і ваше хворе посміховисько на державу поховає історія! За нас помстяться - за всіх! Вашого Вождя повісять, і він помре в муках від руки народу!»\n\nХтось із силою вдарив його кулаком поміж очі. Клацнули затвори пів десятка гвинтівок. «Як переконливо», - глузливо кинув Вождь російського народу. «А тепер поверніться обличчям до стіни»."
 amur.24.a: "Немає людини - немає проблеми."

 amur.25.t: "Кінець Союзу"
 amur.25.desc: "Після прибуття до Зєї з Ґєнріхом Яґодою не церемонилися. Його тягли вулицями на мотузяному повідку, а кожне падіння зустрічали нові лайки й жорстокі удари гурту завзятих чорносорочечників, яких обрали допровадити його до шибениці. Містяни, яких заради цієї події вигнали з домівок, із радістю та щирим захватом долучилися, адже ім'я Яґоди проклинали по всій Росії, як жодне інше. Каміння, гнила їжа та лайно сипалися на лисого, ґобліноподібного голову НКВД протягом усього болісного шляху до середмістя.\n\nКоли його затягли вузькими сходами на дерев'яний поміст на міській площі, Яґода вже ледве тримався при тямі. З десятка дрібних порізів на голові й обличчі текла кров. Мундир був забруднений і власними нечистотами, і тим, чим його закидали. «Він же ще не здох, га?» - сердито крикнув хтось. «Якщо ви облажалися, я повішу вас поруч із ним!»\n\n«Ні, мій Вождю! Дивіться!» - хтось зацідив Яґоді в лице, вирвавши з нього скімлення. «Він іще живий, але краще поспішити!»\n\n«Ні», - глузливо відповів перший голос. Яґоду поставили на ноги перед обличчям, знайомим йому з розслідувань щодо харбінських вигнанців, хоч тепер постарілим і суворим: Константіном Родзаєвскім. «Стеж, щоб зашморг не був надто тугим, Болотове», - зауважив Вождь, коли петлю грубо натягнули Яґоді на шию. «Ці люди прийшли на виставу».\n\nЩось грюкнуло, і підлога провалилася під Яґодою. Він завис у повітрі, зашморг стиснув горло - але недостатньо сильно. Він хапав ротом повітря, кашляв і силкувався вдихнути, поки світ довкола темнів. Ґєнріх Яґода помирав двадцять хвилин, і Родзаєвскій смакував кожну огидну, моторошну мить."
 amur.25.a: "Так помирає Совєцький Союз."

 amur.26.t: "Тріюмф волі"
 amur.26.desc: "Большевицька столиця палала, а разом із нею - останні рештки Совєцького Союзу. Родзаєвскій на повні груди вдихнув тепле, їдке повітря, просякнуте димом від куп трупів, облитих бензином і підпалених. З даху бронеавтомобіля, на якому приїхав, він оглядав учинене його військами побоїще й усміхався.\n\nПостріли й далі лунали один за одним, і кожен означав кінець існування чергового комуністичного щура. Червоні стяги, що колись прикрашали саморобний Кремль, зривали, шматували, обмочували, палили й паплюжили всіма способами, які спадали чорносорочечникам на думку. Над містом прокотився громовий гуркіт: хтось заклав вибухівку й розніс на друзки величезну статую Лєніна. Схоже іконоборство тривало в усіх житлових кварталах, де портрети большевицьких вождів складали на вулицях у купи й підпалювали.\n\nВін бачив це у своїх снах. Кінець. Славетне пекло помсти й ненависти, яке очистить світ від жидо-большевицької мерзоти, що узурпувала Святу Росію. Як великий Гітлер учинив на заході, так Родзаєвскій учинив на сході. У Харбіні його освистували, висміювали й переслідували за віру в націонал-соціялізм. Матковскій покинув його, білі відкололися й пішли за своїм Лжецарем, а червоні невпинно його дошкуляли.\n\nТепер залишилася лише тиша, порушувана тріском пострілів і ревом полум'я.\n\nІ Родзаєвскій, Вождь російського народу, який реготав у попелясте небо."
 amur.26.a: "Слава Росії."

 amur.27.t: "Кінець єресі"
 amur.27.desc: "Натовп, зібраний подивитися на страту Алєксандра Мєня, незручно мовчав. Ніхто не озивався й нічого не кидав, коли люди розступилися перед чорносорочечниками, які вели полоненого священника. Мєнь був виснажений, зморений голодом, зламаний - але нескорений. Закривавленими губами він і далі тихо молився, крокуючи так спокійно, наче монах, що йде у своїх монастирських справах.\n\nЛише на дальньому краю натовпу чулося шепотіння про північного священника, чия слава далеко перевершила його скромну постать. Одні говорили про його просту зовнішність, інші - про гадані чаклунські сили. У кожному голосі чувся страх перед тим, що може статися після його смерти.\n\nНавіть Патріярх, відданий послідовник Церкви та Вождя, здійснював останні обряди тремтячими руками. Чорносорочечники біля засудженого нервово озиралися й переступали з ноги на ногу, бажаючи лише, щоб це відчуття тривоги, відчуття неправильности скінчилося. Тихі молитви Мєня проникали у вуха всіх довкола. Він навіть не відреагував, коли зашморг затягнули на шиї.\n\nВажіль клацнув. Тіло Мєня провалилося вниз, і молитви миттєво обірвалися майже нечутним хрускотом. Болотов, який навмисно зав'язав петлю так, щоб священник задушився, зблід як сніг, зрозумівши, що сталося.\n\nУ глибині душі всі знали правду. Сталося щось жахливе, та ніхто й ніколи більше про це не заговорить. Присутні того дня містяни довіку мовчки боятимуться суду, який тепер неодмінно на них чекає."
 amur.27.a: "Людина несправедлива, але Бог справедливий; і зрештою справедливість перемагає."

 amur.28.t: "Темні небеса"
 amur.28.desc: "Зєя. Чіта. Маґадан. Іркутск. Свастика майорить над кожним куточком Східного Сибіру. На вулицях тихо й панує порядок, якщо не зважати на мандрівні зграї чорносорочечників, які й далі витягають ворогів держави з домівок і залишають їх гойдатися на шибеницях. Сильні панують, а слабкі терплять те, що мусять, надриваючись заради кращих за себе в копальнях і концентраційних таборах. Щодня десятки людей гинуть, розчавлені російським чоботом. Нарешті у відродженій Росії все так, як і має бути.\n\nПопереду ще багато справ, перш ніж ми звернемо погляд на захід і почнемо визволення всієї Росії. Коли безпосередні загрози усунуто, а становище РФП забезпечено, Вождь може здійснити задуману перебудову нації. Нам і досі бракує багатьох речей, необхідних для перемоги: належної промисловости, сучасного сільського господарства й широкомасштабного виробництва озброєнь - і це лише кілька прикладів.\n\nТа жодні дрібні невдачі не завадять нам виконати своє призначення. Ми піднялися із сибірського закутня й заволоділи всім Далеким Сходом. Наші вороги лежать розбиті, спалені та поховані. Кожного супротивника, з яким ми стикалися, розтрощив залізний кулак націонал-соціялізму; те саме чекає на будь-яку жидівську маріонетку, що насмілиться постати перед нами.\n\nНебеса темніють - не від мороку поразки й руйнування, а під тінню нашої слави, натхненої Богом і втіленої у Вожді, спасителеві Росії."
 amur.28.a: "Тепер нас ніщо не спинить."

 amur.29.t: "Вождь російського народу"
 amur.29.desc: "Холодний східний вітер торохтів віконницями в кабінеті Вождя й свистів, прослизаючи між тонкими дерев'яними планками. Родзаєвскій здригнувся й щільніше загорнув плечі у важку шинель, стягуючи хутряну підкладку довкола шиї, щоб утримати тепло. Лише обличчя та руки лишалися відкритими холодному повітрю саморобної штаб-квартири; напружені очі бігали сторінкою, а занімілі пальці нашкрябували нове доповнення до його маніфесту російського націонал-соціялізму. Старовинний настінний годинник пробив один раз, сповістивши першу годину ночі, саме коли він дописав сторінку й відклав перо.\n\nУже третю ніч поспіль Родзаєвскій засиджувався допізна, працюючи над своїм головним твором. Він давно вважав його завершеним, але раптовий розпад червоної влади й того посміховиська з Росії, яке вона підтримувала, змінив обставини. Без допомоги японців він за кілька коротких днів пройшов шлях від Харбіна до далекої Зєї на річці Амур. За цей стислий час лише кілька років тому доля Россійской Фашистской Партії цілковито змінилася.\n\nЗвісно, тривало це недовго. Думка про зраду Матковского й розкол РФП розпалила в нутрі Вождя вогонь ненависти, і він потягнувся до фляги з горілкою, щоб його загасити. Смак, такий же огидний і нудотний, як сама зрада, не втамував гніву, але Родзаєвскій не зважав і зробив ще один глибокий ковток: урешті-решт вона таки подіє. Цим горілка нагадувала різношерстий набрід, який його державка називала армією. Груба, недоладна, абияк викувана з усього, що трапилося під руку, аби тільки працювало. Та вона була його - була російська. Бо Росія існувала лише тут. За кордонами Амура жили самі зрадники, недолюдки й червоні, які спільним чоботом душили російський народ.\n\nКолись його шанс настане. Колись, поки горілка допомагатиме йому переживати один тяжкий день за іншим, РФП проведе Росію крізь це випробування."
 amur.29.a: "Колись."

 amur.30.t: "Незвичайне прохання"
 amur.30.desc: "Наше консульство в Маньчжурії отримало рідкісне повідомлення від Константіна Родзаєвского, одного з наших давніх корисних дурнів із Харбіна. Як «Вождь російського народу», він досить маніякальними висловами вимагає повернути Блаґовєщєнск - область на крайній півночі Маньчжоу-ґо, де розташоване його однойменне рідне місто. Особливих мінеральних багатств у ній немає, а живуть там переважно етнічні росіяни, яких у нас немає причин переселяти.\n\nКоли питання порушили перед маньчжурським урядом, той висловив глибоку байдужість, тож нема чого турбувати його ще й формальним затвердженням. Усі інші причетні органи влади ясно дали зрозуміти, що їм байдуже до мерзлого клаптя землі, повного росіян, а Родзаєвскій пропонує нам права на ресурси далекосхідного Сибіру, щойно опанує регіон. Навряд чи це станеться, але в разі успіху перед нами відкриються цікаві інвестиційні можливості, тож від передачі відповідних земель ми нічого не втрачаємо. Можна просто передати запит нагору, до Дієту, й подивитися, що з цього вийде. Відповідь маємо отримати за місяць або близько того."
 amur.30.a: "Мені те місце й так ніколи не подобалося."

 amur.31.t: "Японія приймає нашу пропозицію!"
 amur.31.desc: "Радісний день! Славетний, щасливий день! Японці, наші непохитні союзники в боротьбі проти червоних та їхніх прислужників, погодилися передати Блаґовєщєнск нашому Всеросійському урядові! Минуло трохи більше року відтоді, як ми дістали підтвердження, що японський Дієт розгляне наше прохання, і очікування нарешті виправдалося. Цього ранку літаком прибув одноосібний японський представник, щоб офіційно передати територію, а Вождь поставив підпис під угодою у своїй штаб-квартирі в Зєї.\n\nВ обмін на Блаґовєщєнск ми надали японцям особливі права на деякі природні ресурси далекосхідного Сибіру. Щойно ми опануємо ці ресурси й об'єднаємо край під владою стабільного уряду, укладені торговельні та гірничі угоди, безсумнівно, принесуть відродженій російській державі щедрі плоди!\n\nА поки Вождь публічно підтвердив, що негайно вирушить до рідного міста на велике святкування з нагоди його офіційного повернення до російських рук. Безперечно, люди будуть у захваті від життя під нашим просвітленим націонал-соціялістичним правлінням замість влади байдужих і далеких маньчжурів!"
 amur.31.a: "Сьогодні - Блаґовєщєнск. Завтра - Москва!"

 amur.32.t: "Повернення додому"
 amur.32.desc: "Сьогодні, коли прибув Родзаєвскій, вулиці Блаґовєщєнска сповнилися бурхливої радости. Населення, заохочене чорносорочечниками, які роздавали прапорці зі свастикою та портрети Вождя, сотнями вийшло вітати ходу нашого славетного провідника, що крокувала крізь холодне ранкове повітря до ратуші. Там міський голова вручив Вождю ключі від міста й повів натовп у натхненному виконанні «Прощання слов'янки».\n\nВождь був явно безмежно радий повернутися до рідного міста; сльози замерзали на його щоках, коли він звертався до завороженого натовпу й озброєних чорносорочечників на варті. «Цей день назавжди ввійде в історію нашої великої нації, - проголосив він. - Сьогодні ми повернули саме серце Всеросійського уряду. Бо саме тут я, Вождь російського народу, прийшов у цей світ. Тут, понад п'ятдесят років тому, почала розгортатися божественна доля Росії! Тут Свята Росія побачила початок свого відродження! Слава Росії!»\n\nВождь мав подарувати місту ще одну честь: віднині, за Указом Вождя, воно навічно носитиме його ім'я! Блаґовєщєнск помер! Хай живуть благородні жителі Родзаєвска!"
 amur.32.a: "Ласкаво просимо до Родзаєвска!"

 amur.33.t: "Змій"
 amur.33.desc: "Алєксандр Болотов устав разом із сонцем. Так було завжди й так буде надалі. Це була звичка з молодости, якої він незмінно дотримувався. Підвівшись із ліжка, міністр безпеки Всеросійського уряду насамперед помітив пульсувальний головний біль. «Як завжди», - пробурмотів він до себе, спускаючи ноги на холодну дерев'яну підлогу й сідаючи. Він згадав, що цього ранку Вождь чекає на його доповідь.\n\nОдягаючись, підстригаючи бороду й готуючись до дня, Болотов думав лише про одне. Закінчивши скромний сніданок, який з'їв за звичкою, а не через голод, він повернувся до спальні й дістав із-під фальшивого дна комода вишукану дерев'яну скриньку. Відчинивши її, Болотов хтиво втупився в непримітні шприц-тюбики: морфін. Сівши на ліжко, він обережно закотив рукав і вибрав один. Знявши ковпачок із голки, Болотов підняв слухавку телефона на тумбочці й набрав Владіміра Ґолубцова, одного зі своїх численних посіпак. Поки лунали гудки, Болотов увігнав голку в руку. Майже одразу головний біль почав відступати, а туман у голові - розвіюватися. Він блаженно зітхнув, але цю мить спокою перервав грубий голос Ґолубцова з іншого кінця дроту.\n\nПісля короткого привітання Болотов запитав про своїх «інформаторів». «Ми й далі міцно над ними працюємо, шефе, - доповів Ґолубцов. - Не хвилюйтеся, вони заговорять». Задоволений Болотов нагадав, що документи, які викривають іще пів десятка партійців, мають лежати в його кабінеті до приходу, а Ґолубцов запевнив, що вони вже там. Зловісно кинувши: «Не змушуй мене йти по тебе», - Болотов поклав слухавку, опустив рукав і рушив до виходу. Біля вхідних дверей він натягнув теплу куртку й відчув холодний метал пістолета, який завжди носив із собою."
 amur.33.a: "Того дня він збирався скористатися зброєю."

 amur.34.t: "Рішучий"
 amur.34.desc: "Ґєорґій Шехєрєв глянув на годинника. За чверть дев'ята ранку. Досить часу, щоб провідник чорносорочечників - воєнізованого крила Россійской Фашистской Партії - дістався партійної штаб-квартири на засідання. Сидячи за столом, він витягнув дві невеликі книжечки в шкіряних палітурках: чорну й коричневу. Розгорнувши потрісканий корінець чорної, він переглянув розклад на день, щоб нічого не пропустити. Дійшовши до пообідніх годин, скривився: нарада з міністром безпеки Алєксандром Болотовим і самим Вождем. Із Вождем він міг упоратися, попри, здавалося б, дедалі сильнішу параною провідника. Нестерпним був саме Болотов.\n\nКоли після розпаду Совєцького Союзу РФП ринула до самої Росії, вона дістала шанс створити справжню державу, відмовитися від бандитизму й мафіозних методів, якими відзначалося її перебування в Харбіні. Шехєрєву не подобалося не саме насильство, а його, здавалося б, бездумний характер, властивий особливому стилю Болотова, наче той і його підлеглі були скаженими псами. Схоже, Болотов не збирався змінювати свої методи, попри постійні заклики Шехєрєва. Якби Шехєрєв не був незамінним і добрим другом Вождя, морфініст, без сумніву, давно б його застрелив.\n\nЗакривши чорну книжечку й розгорнувши коричневу, він погортав щоденник, який ретельно вів іще від перших днів у партії. Він згадав невдалу кар'єру вчителя й відчув дрібку туги за харбінськими часами. Дивлячись на вицвілі сторінки, провідник чорносорочечників постановив віддано служити на своїй посаді: офіційно - в лавах чорносорочечників, неофіційно - як сила, що цивілізує улюблену партію."
 amur.34.a: "«Олюднювати Вождя? Навіщо?»"

 amur.35.t: "Остання сотня"
 amur.35.desc: "У своєму маленькому кабінеті в Зєї Міхаїл Спасовскій вийняв цигарку з рота й видихнув клуб диму. Він старів, цього не можна було заперечувати, та це не означало, що він відмовиться від останніх доступних йому втіх. Зітхнувши, він звернув увагу на папери перед собою. Усе це були беззмістовні повідомлення до японців і від них - єдиних справжніх союзників, які ще лишалися в амурського уряду. Спасовскій мав стежити, щоб вони й надалі прихильно ставилися до цілей Родзаєвского, а це зазвичай означало погоджуватися з усім сказаним і підписувати там, де накажуть. Зрештою, ніхто з них не був у становищі, щоб торгуватися з Японією.\n\nСпасовскій згадав молодість, коли справа здавалася сповненою надій, коли «Чорна сотня» була сильною, а він належав до неї. Тепер їхня мрія про Росію видавалася далекою: жиди й комуністи безперешкодно нишпорили всією країною та ширили свій бруд. За це він ненавидів їх усіх без винятку. Однак тепер він був не лише старим, а й неймовірно втомленим. У ньому вже не лишилося сил по-справжньому перейматися тим, що станеться, тим паче він відчував, що не доживе до часу, коли зможе цим насолодитися.\n\nВирішивши, що треба ще трохи зосередитися, він загасив цигарку, взяв перо й повернувся до нескінченної роботи над закордонними справами РФП. Хоча він, можливо, ніколи цього не побачить, Спасовскій принаймні до останнього подиху намагатиметься допомогти Родзаєвскому зробити так, щоб жид і большевик одного дня поплатилися за своє огидне існування."
 amur.35.a: "А з пекла він сміятиметься."

 amur.36.t: "Непохитний секретар"
 amur.36.desc: "Для більшости людей в Амурі перебування в слідчій установі РФП було певним смертним вироком. Для Льва Охотіна, секретаря РФП і правої руки Вождя, - лише черговим робочим днем. Напівтемною будівлею, яку Охотін оглядав у межах своїх службових обов'язків, розносилися крики, але в такому місці швидко вчишся не помічати благань про допомогу. Навчився весь Амур. Лише раз він зазирнув до камери й побачив зломленого чоловіка, який хрипко благав про допомогу; не вагаючись, Охотін відвернувся й полишив його напризволяще. Що б із ним не зробили, він безперечно на це заслужив. Зрештою, такою була воля Вождя.\n\nПопри позірну жорстокість, Охотін знав, що допомога справі Родзаєвского є великим моральним благом: зокрема, йшлося про знищення большевиків, які вигнали їх усіх із домівок, і жидів, які спрямовували ту згубну революцію. У кожному разі, він знав, що Родзаєвскій чинить правильно, бо довіряв Вождю так само, як Вождь довіряв йому. На цьому ґрунтувалася їхня дружба - зв'язок, викуваний спільною ненавистю до недолюдків іще за харбінських часів, достатньо міцний, щоб витримати будь-яку спробу нікчемніших людей його отруїти.\n\nА втім, подумав Охотін, коли повітря сповнив іще один крик болю, останнє, можливо, вже було неправдою. Знаючи, на що здатен і готовий Болотов, він боявся дня, коли кат прошепоче Родзаєвскому і його ім'я, підживлюючи параною Вождя, в якого Охотін усе ще вірив."
 amur.36.a: "Насправді ця віра була всім, що в нього лишалося."

 amur.37.t: "Лише жаль"
 amur.37.desc: "Скільки років минуло? - подумав Лєв Охотін, ідучи головною вулицею Чіти. Років п'ятдесят чи близько того? Схоже на правду. Відтоді, як 1920 року він із родиною залишив місто, змінилося так багато: там, де колись стояли самі будинки, з'явилися житлові кам'яниці та незнайомі споруди. Та й дороги вимостили значно краще, ніж він пам'ятав. Але деякі будівлі, переважно такі визначні місця, як музей і церква, лишилися незмінними.\n\nОхотін намагався розпізнати знайомі обличчя в юрбах на вулицях. Його погляд зупинився на старій жінці. Та мітка на щоці - це могла бути лише пані Яхонтова, яка тримала крамницю неподалік від його дому й безкоштовно давала йому та друзям цукерки. Охотін уже хотів щось сказати, коли Яхонтова помітила його погляд. Збліднувши від страху, вона затулила обличчя й поспіхом утекла.\n\nКоли Охотін намагався розгледіти в натовпі окремих людей, дедалі більше з них робили те саме: зі страху ховали обличчя й уникали його уваги. Він спробував гукнути чоловіка з піщано-русявим волоссям, у якому впізнав шкільного товариша Дмітрія Лєбєдінского.\n\n«Дімаша!»\n\n«Як...? Будь ласка, я нічого не зробив!» - закричав Дмітрій.\n\n«Я...» Охотін не знав, що сказати, коли Дмітрій кинувся тікати. Він почувався дурнем, який невдало звернувся до перехожого. Хіба не так? Серце стиснулося від самотности: тепер він був уже не другою за впливом людиною на Далекому Сході, а просто самотнім чоловіком на велелюдній вулиці."
 amur.37.a: "Наша доля висока й самотня."

 amur.38.t: "Останній вечір Міхаїла Спасовского"
 amur.38.desc: "Автомобіль із літнім Міхаїлом Спасовскім повільно котився міськими вулицями; єдиний пасажир повертався додому з резиденції Вождя. Міністр закордонних справ Всеросійського уряду Далекого Сходу помітно пітнів і тремтячою рукою промокав чоло хустинкою, пригадуючи останню зустріч із верховним провідником РФП.\n\nВождь надіслав листа нацистському урядові в Берліні з проханням про визнання та найкращими побажаннями, пояснивши успіх Россійской Фашистской Партії на Далекому Сході. Він чекав на відповідь німців: свідчення готовности до співпраці, привітання чи бодай стримане дипломатичне послання, що нічого не обіцяло. Та саме це й надійшло - нічого. Дні перетворилися на тижні, тижні - на місяць, і Родзаєвскій утратив терпіння. Викликавши Спасовского до кабінету, він зажадав пояснити, чому німці так довго не відповідають. Коли міністр закордонних справ сказав, що не має ані найменшого уявлення й що відповіді досі немає, крихке терпіння Вождя урвалося: він почав жбурляти речі у сімдесятирічного Спасовского й кричати про всі несправедливості, яких зазнав.\n\nКоли автомобіль наблизився до його оселі, старий урядовець намагався переконати себе, що це була лише просочена алкоголем сварка, яку Родзаєвскій забуде наступного дня, та піт дедалі посилювався, а його охопило запаморочення. «Мені треба прилягти», - мовив Спасовскій, не звертаючись ні до кого конкретно. Машина зупинилася біля дому, двері відчинили, але вийти було важко. Здавалося, запаморочення охопило не лише розум, а й тіло. Водій спробував допомогти втримати рівновагу, та Спасовскій відштовхнув його. Груди стиснуло нестерпним болем, і на півдорозі сходами до свого дому Міхаїл Міхаїловіч Спасовскій помер від серцевого нападу."
 amur.38.a: "Здоланий тими, в кого вірив."

 amur.39.t: "Пам'яті ідеолога"
 amur.39.desc: "Морозний ранок у Родзаєвску видавав себе хмарами пари, що здіймалися з вуст усіх присутніх на похороні Міхаїла Спасовского. Сам похорон був досить скромним: прийшла вся рідня, яка ще лишалася у Спасовского, і головні члени Россійской Фашистской Партії, зокрема Родзаєвскій, Болотов і Шехєрєв. Однак подальші організовані РФП хода й публічний мітинг на честь життя Спасовского були далеко не малими. Містян привезли потягами з інших місць, селян із сіл зігнали чорносорочечники, і Вождь Всеросійського уряду Далекого Сходу зайняв місце на балконі над тисячами позірних прихильників. Почавши виступ, він похмурим голосом заговорив про Міхаїла Спасовского, доброго друга й одного з головних ідеологів ранньої Россійской Фашистской Партії. «...Міхаїл Спасовскій був не просто членом партії. Він був джерелом натхнення, якорем у несамовитій бурі. У перші роки партії він спрямовував мене та багатьох інших до світла справжнього націонал-соціялізму. Його мудрі й розважливі поради, здобуті, а не куплені довгими роками служби в боротьбі проти жидів і комуністів, просвітили багатьох членів нашої партії та вказували шлях усім нам аж до його останнього дня». Вождь замовк і ковтнув, перш ніж продовжити.\n\n«Цей чоловік, сірий кардинал Россійской Фашистской Партії, найстарший із наших мудреців, завжди був відданий боротьбі проти жидо-большевицького прокляття, яке вразило не лише нашу націю, а й увесь світ. Ця відданість з'явилася ще замолоду: Міхаїл належав до “Чорної сотні”, а прийшовши до нас у Харбіні, охоче поділився досвідом і надихнув нас посилити й зосередити боротьбу проти тих, хто мордує Росію. Його втрата, спричинена непохитним запалом і невтомною відданістю роботі попри вік, відлунює в серці кожного справжнього члена нашої партії. Сьогодні ми сумуємо, згадуючи одного з творців нашого руху»."
 amur.39.a: "Останній із «Чорної сотні»?"

 amur.40.t: ""
 amur.40.desc: ""
 amur.40.a: ""

 amur.41.t: "Урочистий спуск на воду «Вождя Константіна Родзаєвского»"
 amur.41.desc: "Порт Маґадана вже не той, що колись. Принаймні зовні. Увесь останній тиждень табірні робітники прибирали, прикрашали й розставляли стільці. А ще відмивали кров в'язнів, застрелених за недостатньо старанну працю або за непритомність від виснаження.\n\nНавіть якби Вождь про це знав, його це навряд чи схвилювало б. Це славетна мить у відновленні Матері-Росії. Дивитися на колишню «Октябрьскую Революцію», а тепер «Вождя Константіна Родзаєвского», - все одно що дивитися на майбутнє Росії, задумане Вождем.\n\nКолишній царський «Ґанґут», після десятиліть жидо-большевицького розкладу, знову служитиме справжній Росії. Лишається зробити тільки одне.\n\nРодзаєвскій завершує громову промову, побіжно оглядає менші кораблі, які так само переобладнали, і бере поставлену поруч пляшку. У цивілізованішу добу вона містила б шампанське, але зараз доведеться задовольнитися місцевою горілкою.\n\nОдин могутній замах - і пляшка летить до корми лінкора, з глухим дзенькотом б'ється об неї та... не розбивається. Западає ніякова тиша. Вождь витріщається на досі цілу пляшку, що погойдується біля корпусу. Тоді, ледве стримуючи гнів, вихоплює особисту зброю й стріляє в неї, щоб горілка нарешті хлюпнула на його флагман.\n\nДо кінця церемонії решта гостей тримаються особливо запобігливо. Зрештою, наказові Вождя не перечить ніхто - навіть пляшка."
 amur.41.a: "Вождь пануватиме на морях!"

 amur.42.t: "Табір 46"
 amur.42.desc: "Табір був саме таким, яким Родзаєвскій зобразив його на кресленнях. Рівні, упорядковані ряди дерев'яних бараків, укріплені вежі зі снайперами й кулеметниками, сучасна фабрика, споруджена за найновішими японськими проєктами, та правильний квадрат жорстокого колючого дроту, що окреслював межі табору. Навіть в уяві він не міг бути кращим. Останніми за порядком, але не значенням, були мешканці. Брудні, напівголі й виснажені, з порожніми очима, вони не наважувалися підняти погляд на Вождя, коли той проходив повз.\n\n«Як продуктивність?» - недбало запитав він Стєклова, який відвів очі від рабів і притиснув до рота хустинку. «Гірничі табори в Якутії за останній місяць подвоїли видобуток».\n\nСтєклов стримав нудоту й відповів трохи тремтячим голосом. Він не міг збагнути, як Вождь і охоронці просто не помічали смороду відкритої могили біля фабрики. «Е-е, що ж, радий доповісти: цей об'єкт виконує встановлену норму, мій Вождю». Він знову ковтнув, перш ніж продовжити. «Не певен, чи ці люди здатні...»\n\n«Це не люди, Стєклове», - пробурмотів Родзаєвскій, повертаючись до підлеглого й нарешті помітивши його бліде, хворобливе обличчя. «Що, тебе це бентежить?» Він фиркнув і неквапливо рушив далі до воріт. «Звикни вже. Не бачив, щоб я непритомнів, мов дівчисько, щоразу, коли Мура прихлопує комаху».\n\n«Зі мною все гаразд, мій Вождю, - збрехав Стєклов. - Просто сьогодні трохи нездужаю. Усе так, як ви кажете, звісно». У відповідь Родзаєвскій лише мовчки всміхнувся, неабияк пишаючись тим, що його люди там збудували."
 amur.42.a: "Зведений ненавистю, вимощений байдужістю."

 amur.43.t: "Нова модель"
 amur.43.desc: "Попри близькість до японського кордону, Родзаєвск уже досить давно вважали економічною столицею Далекого Сходу Родзаєвского. Тут кілька видатних промисловців зібралися обговорити майбутні моделі керування своїми величезними конґломератами. Присутні були дуже помітними діячами - усі члени РФП, які розжиріли на воєнних прибутках під час першого етапу возз'єднання.\n\nХоч жоден із цих промисловців не був високопоставленим партійним чиновником, саме їх обрали очолити перші російські мегакорпорації, задумані Родзаєвскім: ідеологічна відданість справі, багаторічне членство в партії чи «пожертва» достатньої суми грошей - усе це «надавало їм право» на посаду. Зібравшись обговорити майбутнє мегакорпорацій, вони сіли в залі засідань, де мала визначитися економічна доля Росії Родзаєвского.\n\nПісля напружених обговорень промисловці висунули вкрай суперечливу ідею: перепрофілювати примусову працю заради стрімкого й масштабного економічного зростання в мегакорпораціях, задуманих Вождем. Безумовно, це була далеко не найгуманніша пропозиція, що наслідувала німецьку модель примусової праці в промисловості, тому спочатку багато промисловців її не схвалили. Однак із подальшим обговоренням майже всі усвідомили вигоди: практично безкоштовні праця й робоча сила. Це, безперечно, знизить якість і кількість вироблених товарів, зате забезпечить чистий прибуток тим, хто мав організувати саме це виробництво.\n\nНасолоджуючись кавою та розкішними екзотичними наїдками з Японії, промисловці та їхні помічники майже не думали про тисячі життів, які прирікали на жахливі умови у фабриках, що, на їхню думку, забезпечать перемогу Вождя."
 amur.43.a: "Початок «Нової системи»."

 amur.44.t: "Огляд робітників"
 amur.44.desc: "У середмісті Родзаєвска стояв холодний, морозний ранок. Вадік Віноградов чекав на свого Вождя, мерзнучи під раннім снігом. Він поглянув на шофера, а тоді перевірив годинник. 08:15 - Вождь запізнювався. З огляду на схильності Верховного провідника це нікого не дивувало, та Віноградов не міг позбутися страху, що «зустріч», яку його змусили призначити, була лише нагодою піддати молодого промисловця чистці. Однак коли показалася чорна машина Вождя, Віноградов відчув полегшення.\n\nКоли Вождь вийшов із машини, Віноградов рушив назустріч. Чоловіки потисли руки. «Соратніку, радий вас бачити», - сказав Родзаєвскій Віноградову.\n\n«І я вас, мій Вождю», - відповів Віноградов. Показавши на цегляну фабрику позаду, що викидала в небо чорний дим, він продовжив: «Почнімо?»\n\nВони оглянули підприємство, а Віноградов докладно пояснював Вождю всі тонкощі роботи фабрики. Насправді він боявся реакції Вождя на стан робітників: тут вони працювали фактично цілодобово, майже без перерв і їжі. Робітники мали виснажений і нещасний вигляд; важко було відрізнити рабів від вільних, хоча Віноградов доречно зауважив, що рабам доручали лише найнебезпечнішу працю. Вождь мовчки вбирав побачене, лише час від часу ставлячи питання. Коли вони знову вийшли з фабрики, він простягнув руку. Віноградов відповів на рукостискання, і Вождь міцно стиснув його долоню. «Дуже добра робота, Віноградове, дуже добра»."
 amur.44.a: "«Вони працюватимуть старанніше, мій Вождю»."

 amur.45.t: "Співпраця класів"
 amur.45.desc: "«...і ви, мої хоробрі, хоробрі росіяни, усі ви, хто так довго страждав під владою комуніста, жида та породженої ними анархії, незабаром звільнитеся від своїх кайданів! Поки наш рух шириться на захід, лави партії зростають, бо всі справжні росіяни прагнуть служити Вождю. Розкольники не змогли нас спинити, комуністи не змогли, не зможуть і жиди. Російський народ прагне фашизму: не такого, який принесли нам нацисти - вогнем, сталлю та кров'ю, - а фашизму для народу, не проти нього. І саме його я маю намір дати людям: систему гармонійної співпраці класів, у якій усі росіяни працюють разом заради кращого майбутнього своєї нації та своєї раси!\n\nПам'ятайте тепер і пам'ятайте завжди, мій народе: за Бога, Націю і Труд!»\n\nСьогодні Вождь знову вийшов на балкон - той самий, з якого оголосив про завоювання розкольників і царистів, - та виголосив полум'яну, натхненну промову перед людьми, що зібралися внизу й слухали по радіо. Він пообіцяв народові початок нової доби економічного процвітання та створення того, що назвав «співпрацею класів». Наслідуючи економічну систему, створену й виплекану Адольфом Гітлером десятиліття тому, Родзаєвскій пообіцяв розширювати мегакорпорації та заохочувати співпрацю нижчого, середнього й вищого класів.\n\nДеякі міжнародні оглядачі відреагували на обіцянки Вождя виразно негативно й порівняли їх із початком того, що зрештою перетворилося на роздутий труп німецької економіки. Проте, схоже, у Всеросійському уряді Далекого Сходу всі залюбки підтримують плани Вождя: тих, хто колись наважувався заперечувати, давно піддали чисткам, а решта просто надто боїться говорити про це публічно."
 amur.45.a: "Покаже тільки час."

 amur.46.t: "Не сумуй - організовуйся!"
 amur.46.desc: "Страйк у Всеросійському уряді можна було побачити нечасто. Багато хто повірив обіцянкам Вождя про співпрацю класів і справедливе представництво всіх справжніх росіян. Інші просто задовольнялися безпекою та заробітком, хай навіть зміни були тривалими, а умови тяжкими.\n\nНелегальна Вільна спілка далекосхідних робітників, яку заснували вісімдесят працівників збройової фабрики після того, як їхнього товариша застрелили за невиконання норми, не належала до жодної із цих груп.\n\nВони йшли вулицями Зєї, а перед ними сходило ранкове сонце. Деякі містяни висовувалися з вікон і всупереч режимові підбадьорювали їх. Ще кілька, набравшись відваги, приєдналися під червоним простирадлом на палиці, яке правило за стяг. Коли юрба дісталася ратуші, уже залитої сонячним теплом, вона зросла до понад двохсот людей.\n\nПіднесені спільною ейфорією, скандуючи й співаючи про визволення робітників усупереч усім обставинам, вони не бачили озброєних чорносорочечників, які кралися за ними провулками. Не чули характерного клацання «Максимів», що їх заряджали у вікнах довкола. А от що вони помітили, коли вулиця раптом сповнилася мертвими й умирущими, то це несподівані жар і біль свинцевої зливи, яка розривала страйкарів і гасила їхню надію, мов догораючу свічку."
 amur.46.a: "Солодкий сон трудящої людини."

 amur.47.t: "Нове російське суспільство"
 amur.47.desc: "Штори в кабінеті Вождя у [AMR.Capital.GetName] були запнуті. Після довгого дня промов, засідань, оглядів і розпоряджень млявіший чоловік захотів би відпочити, добре повечеряти й рано лягти спати. Константін Родзаєвскій був ким завгодно, але не млявою людиною. Після короткої вечері та незмірної кількости випитого разом із нею алкоголю він усамітнився в кабінеті, замкнув двері й запнув штори.\n\nПочавши пізно ввечері й пишучи аж до світанку, Вождь усіх росіян сидів за столом, пив і несамовито писав, охоплений пристрастю та натхненням. Він творив черговий так званий «головний твір», цього разу про те, що вважав досконалим та ідеальним російським суспільством - новим суспільством, яке він заради добра російського народу силоміць нав'яже Росії. Коли вдосвіта покоївка принесла йому сніданок, Вождь, чию ніч живили спиртне та напої з кофеїном, саме закінчував роботу.\n\nЗа ситним сніданком, що мав приглушити дію алкоголю й неминуче похмілля, Константін Родзаєвскій переглянув свою працю. Сорок вісім сторінок з одинарним міжрядковим інтервалом охоплювали кожну можливу подробицю задуманого ним суспільства. Від широкого використання та залучення підтримуваних державою організацій, як-от «Союз фашистських крихіток» і «Россійскоє женскоє фашистскоє двіженіє», до докладного опису устрою родини - на чолі з чоловіком, звичайно - та загальної мілітаризації суспільства: він розглянув кожен аспект того, що вважав ідеальним суспільством. Розмахуючи товстим рукописом під час їжі, він не відчував нічого, крім гордости. Поснідавши, Родзаєвскій викликав Болотова, щоб похизуватися новою працею."
 amur.47.a: "Нове суспільство поведе Росію вперед."

 amur.48.t: "Гартування характеру"
 amur.48.desc: "Минув уже місяць відтоді, як Фьодор востаннє бачив батьків. Цілий місяць, сповнений роботи, з якою ледве впорався б навіть його батько. Принаймні Фьодорові допомагали всі друзі з «Крихіток» - ну, майже всі. Не кожного він міг назвати другом. Анатолій, великий чорносорочечник із японським кулеметом, який мав їх захищати, геть не був приязним. Фьодор узагалі не розумів, від кого їх треба захищати. Усіх жидів у його місті забрали, а війна з червоними скінчилася, то навіщо там Анатолій? Він лише знущався з них.\n\nУночі вони спали на тонких матрацах, укриваючись хіба лахміттям. Навіть тоді, у непроглядній темряві барака, за ними хтось стежив. Часом двері рипіли й відчинялися, а хтось світив ліхтарем по кімнаті, перевіряючи, чи ніхто не тулиться один до одного заради тепла. Їхній керівник казав, що така поведінка виховує виродження й жіночність.\n\nЩоранку приходив наглядач і ще до світанку підіймав їх брязкотом мідного дзвона. Цей галас завжди означав те саме: ще чотирнадцять годин скалок, закривавлених пальців, зламаних нігтів і жорстоких ударів наглядацького кийка. Вождь мав рацію, думав Фьодор: шлях праведного труду сповнений страждань. Коля й Саша вже «відсіялися». Дехто пошепки казав, що вони намагалися втекти, але їх спіймали, та Фьодор знав правду. Вони зрадили свою расу, як і його двоюрідний брат Тьома. Вони не були справжніми росіянами."
 amur.48.a: "А я справжній - і доведу це."

 amur.49.t: "Жіноча доля"
 amur.49.desc: "Жінки Росії, не дайте себе звести медовим словам про «визволення»! Справжньої жінки, задуманої Богом, на занепадницькому Заході більше не існує. Її повісили на мотузці жидо-большевицького фемінізму. Її наступниця - вироджена «визволена жінка», вавилонська блудниця. Ця розпусниця бездумно гасить ненароджені життя у своїй утробі - і заради чого? Щоб збагачуватися кар'єрою, призначеною для її чоловіка?\n\nТа як рідко їй узагалі потрібен чоловік! Вірна моногамія не для неї; вона щасливіша, коли має нескінченну вервечку грішників, із якими може без упину блудити. Позбавлена всякої моралі, любови й віри, вона закінчує життя зруйнованою, зганьбленою та залежною від наркотиків Єзавеллю. Саме такими жиди хотіли б бачити й вас! Прийняти західний фемінізм - це відкинути все, що робить жінку чистою та побожною.\n\nУ Росії ми розуміємо, що Бог визначив місце кожному. Для чоловіків це передова й фабрики. Для вас, благословенні дружини, сестри, дочки й матері, - безпека дому та церкви. Господь наділив вас силою народжувати нове життя! Тільки природний стан може принести щастя: радість від виховання дітей, зустріч чоловіка після тяжкого робочого дня, затишок в обіймах мужньої статі!"
 amur.49.a: "Діти, кухня, церква!"

 amur.50.t: "Нові списки"
 amur.50.desc: "Константін Родзаєвскій сидів у кабінеті, а навпроти нього за столом - Болотов і Шехєрєв. Обидва принесли Вождю низку дуже довгих списків: окремі люди та цілі родини, які або були жидами чи комуністами, або просто надто добре ладнали з одними чи другими. Списки були задовгі, щоб Вождь читав їх особисто. Коли обоє поклали їх на стіл, Родзаєвскій поглянув на папери, а тоді на них. «Це всі?» - запитав він.\n\nСуперники перезирнулися, на мить об'єднані спільним наміром. «Це лише початок, мій Вождю, - відповів Болотов. - Далі буде значно більше».\n\nВождь розуміюче кивнув. На хвилину замислився, а тоді скривився. «Ці виродки, - почав він. - Ці справжні виродки». Коротка пауза, й він продовжив. «Жиди. Комуністи. Ці створіння давно мордують нашу націю. Вони проникли в наш народ, у нашу культуру, спотворили й послабили її... змусили нас гнити, перетворили колись хоробрих росіян на боягузливих дурнів. Зробили найсміливіших байдужими, найсильніших - слабкими. Вони роками це робили, а нікому не вистачало мужности щось із цим удіяти».\n\nШехєрєв і Болотов кивнули - не зі страху, а через щире переконання; завзяття в їхніх очах не залишало сумнівів. Вождь продовжив: «Це добрий початок. Але цього недостатньо. Треба вичистити гниль, вирізати заразу будь-якими засобами. Подбайте про ці імена. Але я хочу більше імен. Росію буде очищено від отрути, що її вразила»."
 amur.50.a: "Чистки тривають."

 amur.51.t: "Радіозвернення Вождя"
 amur.51.desc: "«За останні десятиліття Всеросійський уряд пройшов довгий шлях. Роками борючись проти ворогів нашої партії та нашого народу, ми билися з комуністами старого большевицького режиму, вели священну війну проти сибірських фанатиків і потерпали від перекинчиків, які знехтували закликом збудувати сильнішу Росію. І все ж ми досі тут! Останні зі справжніх здолали своїх гнобителів і посіли належне їм місце провідників Сибіру!»\n\n«Але не дайте успіхові притлумити вашу пильність, бо він - мов свічка на вітрі, що спалахує уривчастим яскравим полум'ям, а в темряві причаїлися ті, хто прагне його загасити. Ми не терпимо несправедливости большевизму, тому залишки большевиків протестують і намагаються нас повалити. Ми не терпимо дармоїдства, тому паразити волають і прагнуть нашої загибелі. Що довшою стає тінь нашої величи, то глибшими стають тіні, у яких агенти сіонізму можуть плести змови проти нас».\n\n«Не втрачайте пильности, бо коли не розпізнаєте зрадника, то наче самі зрадили російський народ і здійснили його задум. Ми пройшли довгий шлях, але мусимо йти далі, доки російська нація не буде в безпеці. Обов'язок кожного громадянина - стежити за шпигунами фальшивого уряду на заході, брехливим комуністом і підступним жидом, бо вони можуть діяти проти нас лише в темряві. Витягніть їх на світло й викрийте їхні злочини»."
 amur.51.a: "Як щось бачиш - скажи."

 amur.52.t: "Видатний літописець"
 amur.52.desc: "«У нашій вічній боротьбі проти неправомислячих народів світу та кошерних фашистів, які проникли до нашої партії, ми мусимо звеличувати тих, хто створює належне зображення справедливого світового ладу. Ладу, де росіянин вільно живе в достатку, не боячись покидьків і виродків, які крадуть його тяжко зароблені статки. І таке зображення створив один із наших - у вигляді особистої історії великого світоча Міхаїла Спасовского, гідного прикладу провідників, яких Россійская Фашистская Партія дала за свою славну історію».\n\n«У своїх докладних спогадах про перші дні нашої організації він описує боротьбу, яку ми роками вели в Маньчжурії. У сяйві великої неонової свастики наша партія міцніла, а коли ослаблені бухарінці впали перед вищим націонал-соціялізмом, ми скористалися нагодою. Як людина, що від першого дня у вигнанні очолювала нашу справу, я можу сказати: немає правдивішого викладу нашої історії, ніж книга Спасовского “Довгий шлях на північ”. Я зневажаю слинявих інтелектуалів, але Соратнік Спасовскій - не з них. Він створив працю, яку я раджу всім росіянам, що прагнуть поглибити знання про свою спадщину»."
 amur.52.a: "Історію пишуть переможці."

 amur.53.t: "У гетто"
 amur.53.desc: "Ґріґорія розбудив від дрімоти гамір за вікном. Спочатку такий далекий, що він прийняв його за частину сну, безладний хор голосів і нерівний тупіт дедалі гучнішав. Більше терпіти він не міг, тож із рипінням старих кісток підвівся з крісла. Розчинивши штори єдиного вікна у квартирі, він побачив, що відбувалося на вулиці внизу.\n\nВулицею човгала юрба, можливо, зі ста людей. Деякі мали значно гірший вигляд за інших. Кілька тягли за собою великі валізи, але більшість не мала нічого, крім одягу на тілі. Спочатку Ґріґорій спантеличився, а тоді помітив озброєних гвинтівками чорносорочечників з обох боків, і все стало зрозуміло.\n\nКоли юрба рушила далі, до обнесеного муром гетто, зведеного за останні кілька тижнів, Ґріґорій зітхнув, повернувся до крісла й викинув із голови це жалюгідне видовище. Востаннє він бачив переслідування на власні очі, коли його чинили в ім'я царя. Тепер його чинили в ім'я якогось «Вождя» та ідеології, яку вигадав божевільний німець. Хоч би як далеко тікав Ґріґорій, хоч би як старався та скільком жидам давав притулок, здавалося, Росія не зміниться ніколи."
 amur.53.a: "Він міг лише плакати."

 amur.54.t: "Відкриття Колими"
 amur.54.desc: "«Стати до ладу!» - закричав комендант крізь вітер. Перед ним стояли десятки змарнілих, жалюгідних облич - усі вороги держави. Після тріюмфу Вождя в Сєввостлаґу не бракувало робітників. Комісари НКВД стояли поряд із літніми монархістами, які билися за фальшивого царя, а сибірські фанатики цокотіли зубами поруч із кошерними фашистами Матковского.\n\n«Ваші провідники повели вас шляхом, освітленим брехливими ліхтарями сіоністів. Ваші справи повісили на шибеницях праведности, а ваших провідників схопили під час спроб підірвати російський народ. Їхні трупи стали поживою для червів, як і трупи їхніх найзавзятіших прихильників».\n\nВін пам'ятав холод, від якого страждав тут сам, у далекі часи перед розпадом. Багатогодинна праця в золотих копальнях чи прокладання шосе зробили його сильним утіленням ідеального росіянина. Тепер на його плечі ліг обов'язок перетворити цих нікчем на щось корисне. Деякі колись віддано служили Вождю, доки не з'ясувалося, що вони таємно плели змову. Тепер їхнє драні лахміття було слабким захистом від сибірських вітрів.\n\n«Агенти жидівства скажуть, що це покарання, навіть злочин - поводитися з вами так, як ми. Але це лише чергова їхня брехня, покликана тримати вас слабкими й залежними від їхньої милости. Долати біду, коли весь світ проти тебе, - ось що значить бути російським мужем! Ви заборгували своєму народові й сплатите цей борг тут, потом і трудом. Лише коли борг буде сплачено, ваші злочини проти Вождя простять. Тож працюйте щосили, щоб одного дня заслужити його прощення!»"
 amur.54.a: "Праця зробить вас вільними."

 amur.55.t: "Мертва тиша"
 amur.55.desc: "[AMR.Capital.GetName] - нове місто для Россійской Фашистской Партії. Харбінський хаос зник, поступившись моторошній одностайності, яку насаджують чорносорочечники Шехєрєва. Сама назва - лише перша ознака того, що це осередок влади Вождя. Немає жодного закутка чи провулка без очей і вух відданих членів партії, які вистежують зрадників і передають відомості нагору. А найпильніші з них перебувають на Партійному з'їзді. За останні дні справжні вірнопідданці викрили десятки гадано відданих партійців як прибічників сіонізму. Покійний двоюрідний брат, який одружився з жидівкою, брат, що відвідував рідню в Маґадані до відвоювання, навіть прострочена реєстрація у штаб-квартирі кількарічної давнини - усього достатньо для підозри й арешту.\n\nҐєорґій Шехєрєв самоусувається від участи в з'їзді, воліючи нишпорити в затінку позаду й стежити за підозрілою поведінкою або дослухатися до подальших відомостей, які зможе використати. Поки його чорносорочечники патрулюють коридори будівлі та вулиці міста [AMR.Capital.GetName], він мусить особисто доповідати почуте Вождю: Родзаєвскій вважає, що іншим партійцям довіряти не можна, а Шехєрєв не може втратити його довіру. Принаймні без тяжких наслідків.\n\nЩе помітнішим є Алєксандр Болотов, який навмисно лишається в усіх на виду під час з'їзду. Ті, кого видно, не можуть плести змову й, можливо, відданіші за тих, кому є що приховувати. Вождь бачить, як Болотов працює на нього, і тішиться відданістю свого найближчого оточення. Та Болотов діяльніший і пильніший за Шехєрєва, бо знає: його привілейоване становище залежить від уміння знаходити й викривати противників Вождя.\n\nА в самому осередку події Вождь особисто винюхує змови, завжди пильний до прибічників жидівства та зрадників усередині РФП. Тепер, коли партію очищено від нелояльних членів, лишається єдиний шлях - на захід, до неповернених земель російської нації. Коли решту маріонеток буде знищено, Росія нарешті стане вільною, вільною кувати власну долю без згубних впливів."
 amur.55.a: "Його владу забезпечено."

 amur.56.t: "Гарантування безпеки"
 amur.56.desc: "Атмосфера в партійній штаб-квартирі анітрохи не нагадувала харбінську штаб-квартиру з неоновою свастикою. Тоді Родзаєвскій був менш параноїдальним і менш податливим. Тепер навіть увійти до кабінету Вождя було вправою в лукавстві. Люди Шехєрєва невпинно стежили за входом, і Болотов лише зрідка міг поговорити з Вождем наодинці.\n\nВін постукав, смикнувши головою туди-сюди в пошуках чорносорочечників, а тоді різко повернувся до дверей, коли Родзаєвскій гаркнув ізсередини.\n\n«Увійдіть!»\n\nВін хутко прослизнув до кімнати. Вождь сидів за столом і люто дивився на свого заступника. «Соратніку Болотове. Добре, що ви прийшли. Треба дещо розслідувати. Надійшли повідомлення про контрабандистів у порту Маґадана. Шехєрєв каже, це залишки зрадників, які до останнього подиху прагнуть завдавати нам клопоту».\n\nЗазвичай таке втручання в його плани розлютило б Болотова, а в молодості він зігнав би роздратування на випадковій жертві, схопленій на вулицях Харбіна. Але десятиліття відданої служби Вождю багато чого навчили його про цю людину, і перед ним була нагода просунути власну справу, а не зайвий тягар.\n\n«Схоже, вороги обступили нас з усіх боків, мій Вождю. Дозвольте дещо запропонувати?»\n\n«Говори, Алєксандре». Чи почув він роздратування?\n\n«Люди Соратніка Шехєрєва виявилися... неспроможними стримувати згубний вплив наших ворогів. Чорносорочечники добре послужили нашим цілям, але їм бракує організованости та спорядження. Пропоную створити новий, спеціялізований підрозділ із належною військовою підготовкою та поглибленим навчанням із виявлення ворогів держави. Найкращі й найвідданіші люди, яких зможемо знайти, за зразком німецьких воєнізованих формувань».\n\nВождь на мить замислився над ідеєю, а тоді виніс рішення."
 amur.56.a: "«Сильна пропозиція, Соратніку. Виконуйте»."
 amur.56.b: "«Чорносорочечники служать нам бездоганно. Більше про це не говоріть»."

 amur.57.t: "Захист держави"
 amur.57.desc: "«Вас усіх обрали як найвідданіші взірці ідеального росіянина. Вождь особисто схвалив створення нових Загонів гарантування безпеки, щоб знищити вплив сіоністських зрадників у нашій країні. Ви розбудуєте для нас цю організацію, а Вождь забезпечить вас усім необхідним. Я чекаю списків добрих, надійних солдатів. Ви відповідатимете за їхню підготовку та покору».\n\nБолотов усміхався, звертаючись до перших офіцерів Отрядів Обєспєчєнія Бєзопасності. Під самим носом Шехєрєва він переміг і дістав дозвіл на власну опору влади. Та попереду лишалося багато перешкод. Йому знадобляться зброя, однострої, бюрократична мережа для ведення списків і ще безліч ресурсів.\n\nІ все-таки його зоря безперечно сходила. Довіра Вождя була рідкістю й часто зростала та згасала за примхою Родзаєвского. Цей миттєвий успіх напевно не триватиме довго, але Болотов виборов собі вище становище - і тепер мав ніж, яким міг дати ворогам Вождя те, на що вони заслуговували."
 amur.57.a: "Ми викорінимо кожного зрадника!"

 amur.58.t: "Гірке розчарування"
 amur.58.desc: "Останні два дні краще було забути. Після відмови Вождя створити ООБ Болотов упав у невтішну лють і провів кілька годин, замкнувшись у кімнаті з в'язнем та ломом, перш ніж заспокоївся. Шехєрєв лив отруту у вуха Вождя, і тепер той покинув найвідданішого слугу, кинувши його на поталу примхам Шехєрєва. Що ж, він поплатиться того дня, коли чорносорочечники виявляться невірними!\n\nНі, так не годиться. Росіянинові не личить так поводитися. Вождь дослухається до розуму, бо якщо ні, то яка надія лишається Росії? Родзаєвскій - це майбутнє, і він потребує настанов, яких Шехєрєв дати не здатен. Ця думка заспокоювала Болотова, адже воля Вождя була дивною, але не цілком непередбачуваною.\n\nБолотов усміхнувся. Ще один набір списків у слушний час - і Вождь схаменеться. Він не смів знову питати про ООБ, але параноя Родзаєвского завжди давалася взнаки й ґарантувала нагоду самотужки повернутися до його ласки та переграти чорносорочечників. Час повертатися до роботи. Він витяг зі столу стос звітів і почав писати."
 amur.58.a: "Ще чотирьох Соратніків підозрюють у жидівському походженні. Вождь буде невдоволений."

 amur.59.t: "Новий день"
 amur.59.desc: "Прокинувшись, Константін Родзаєвскій насамперед відчув знайомий пульсувальний головний біль. Цього ранку він був особливо сильним, а Родзаєвскій, як завжди, не міг пригадати, як саме провів минулу ніч. Мляво розплющивши очі, він байдуже поглянув на будильник біля ліжка. Зір був затуманений, і спочатку часу він не розібрав. За мить очі нарешті звикли й показали годину: пів на третю пообіді.\n\nГолова й далі боліла, а тіло було позбавлене сил; Родзаєвскій незграбно скотився з ліжка й із гучним стуком упав на підлогу. Він кілька разів болісно кашлянув і пробурмотів лайку, але був надто сонний, щоб перейматися дрібним болем від падіння. Коли вже болить усе, що змінить іще трохи болю? Зібравшись, Родзаєвскій підвівся й розсунув штори, відкривши майже вічно замерзле місто Зєя. Світло залило темну кімнату, і від несподіваного спалаху сонця Родзаєвскій здригнувся. Широкий краєвид із третього поверху швидко нагадав фашистському провідникові про недавні звершення.\n\nЦя земля - від озера Байкал на заході до Камчатки на сході - належала йому й лише йому. Усі вороги Родзаєвского були або мертві, або бажали смерти, а його страшні армії міцно тримали чобіт на горлі російського Далекого Сходу. Ця думка дуже його втішала. Дивлячись у далечінь, Родзаєвскій почав відчувати захоплення майбутнім, якого вже давно не знав. Якщо перемоги триватимуть, подумав він, уся Росія опиниться в його владі - разом з усіма «небажаними», які в ній ховаються..."
 amur.59.a: "Велика темрява здіймається на сході."

 amur.60.t: "Люба Німеччино..."
 amur.60.desc: "«Міністрові закордонних справ могутнього Великоґерманського Райху...\n\nВітаю! Як провідникові шанованої Россійской Фашистской Партії, мені надзвичайно приємно повідомити чудові новини з Далекого Сходу. Наші армії перемогли занепадницьких жидо-большевицьких псів, які колись оскверняли цю землю своєю огидною присутністю, здобули перемогу для справи націонал-соціялізму й, безсумнівно, спокутували провину Росії в очах світу.\n\nТепер, коли ми закріпилися тут, я простягаю вам і вашій могутній нації руку дружби та солідарности. Оскільки обидві наші нації вірно дотримуються настанов покійного великого Адольфа Гітлера, було б цілком природно знайти спільну мову в дипломатичних питаннях, чи не так? На жаль, нашій державі все ще важко домогтися визнання серед націй світу. Без сумніву, це справа могутніх жидівських еліт, які найбільше за все прагнуть стерти наш рух на порох, перш ніж він зможе по-справжньому кинути виклик їхньому теророві над світом.\n\nПроте Німеччина інша. Ваш могутній народ відкинув жида та його підступні плани світового панування, і саме тому я звертаюся до цієї великої нації з проханням визнати нас справжніми спадкоємцями російської величи, не заплямованої мороком жидо-большевизму. Хоча наші народи справді не завжди сходилися в поглядах, можливо, ми зможемо скористатися цією нагодою, щоб розпочати новий розділ російсько-німецьких відносин, сумлінно об'єднавшись як ідеологічні брати. Із величезним захопленням чекатиму на вашу відповідь!\n\nВаш,\n\nКонстантін Владіміровіч Родзаєвскій, Вождь Святої Росії»"
 amur.60.a: "Бездоганно! Тепер чекатимемо на відповідь..."

 amur.61.t: "Дивний лист"
 amur.61.desc: "Міністр утретє пробіг очима слова дивного листа, не вірячи прочитаному. Раніше того дня Міністерство закордонних справ Райху отримало листа, який щедро можна було назвати божевільними мареннями лунатика, і всі його читачі були цілковито приголомшені. Міністрові закордонних справ самому закортіло його прочитати, хоча б щоб зрозуміти причину галасу. Тепер, прочитавши кілька разів, він не зовсім розумів, що про це думати.\n\nВід початку до кінця лист майже не мав сенсу й був наче написаний глибоко схибленою людиною. Автор називав себе «Вождем Святої Росії» та пояснював, що певну область Росії було відвойовано в ім'я «справи націонал-соціялізму». Далі у своїх божевільних писаннях цей «Вождь» заявляв, що прагне визнання з боку Райху, оскільки вірить, ніби всемогутні міжнародні жиди плетуть змову проти його нової держави та намагаються задушити її в колисці. А через те, що, як він вважає, німецький народ «відкинув жида», «Вождь» називав Райх своєю найкращою надією на міжнародне визнання.\n\nЗрештою міністр вирішив, що лист був чиєюсь невдалою спробою розіграшу. Кинувши зім'ятий папірець у смітник біля столу, міністр закордонних справ сприйняв цей випадок за ознаку, що, можливо, настав час запровадити нові процедури перевірки. Час і без того перевантаженого Міністерства був дорогоцінним, і воно просто не могло дозволити собі марнувати його на майбутніх коміків, які надсилають нісенітниці."
 amur.61.a: "Їм справді більше нічим зайнятися?"

 amur.62.t: "Мовчання Райху"
 amur.62.desc: "Меблі в кабінеті Вождя часто міняли та безладно переставляли за наказом самого Родзаєвского, який постійно випробовував найкраще розташування письмового столу, крісел для пиття та мистецьких творів. Тепер стіл стояв посеред кімнати, ближче до заднього вікна з краєвидом на [AMR.Capital.GetName]. На іншому кінці кімнати, затиснуті в одному з кутків, стояли три крісла для пиття й маленький столик між ними. Родзаєвскій сидів за столом, а його міністр закордонних справ Спасовскій - на кріслі обличчям до Вождя, мовчки спостерігаючи за примхливим диктатором.\n\n«Скільки днів минуло?» - запитав Родзаєвскій.\n\n«Сім, пане», - відповів Спасовскій і замовк; слова лише неохоче виходили з його вуст. Дві чи три секунди тривала тиша, поки гнів Родзаєвского зростав і зростав, аж доки не вибухнув. Він схопив склянку горілки й жбурнув через усю кімнату; вона з величезною швидкістю пролетіла над головою літнього Спасовского й розбилася об стіну. Міністр закордонних справ здригнувся, коли його голову обсипали скалки й краплі горілки.\n\n«СІМ ДОВБАНИХ ДНІВ?! - заревів Родзаєвскій. - УСЕ, ЩО МИ ЗРОБИЛИ, - ДАРЕМНО?! ЯК ВОНИ, БЛЯТЬ, СМІЮТЬ!»\n\nСпасовскій звик до вибухового характеру Вождя. Він знав, як пережити бурю: мовчати. Його вуста склалися в похмуру гримасу, поки він спостерігав за люттю свого повелителя. «Я НІКОЛИ НЕ ПРОБАЧУ ДОВБАНИМ ПОСІПАКАМ ГІТЛЕРА, - продовжував Родзаєвскій, - ВОНИ ЗАБУЛИ СВОЄ КОРІННЯ...» Родзаєвскій на мить замовк, переводячи подих, а тоді продовжив: «...І ВОНИ ПОШКОДУЮТЬ, ЩО ЗНЕХТУВАЛИ НАШОЮ СПРАВОЮ!»\n\nІстерика мине, а Спасовского відпустять. Дорогою додому, вдячний, що лють Вождя обмежилася його кабінетом, а не самим Спасовскім, він розмірковував про причину вибуху: Німеччина мовчала у відповідь на простягнуту Родзаєвскім руку дружби. Опинившись удома, він зітхнув і нагадав собі, що треба знайти когось іншого, хто приноситиме Вождю погані новини."
 amur.62.a: "Німці нас зрадили."

 amur.63.t: "Лист до Конґресу"
 amur.63.desc: "«Корумпованим сіоністським зміям із Конґресу Сполучених Штатів...\n\nПрисягаюся всім святим на цій землі: важко знайти більше збіговисько продажних клептократів, огидних зрадників раси та владолюбних жидів! Ви справді думаєте, що чогось досягаєте, збираючись у так званому Капітолії, мов гладкі свині біля годівниці? Можливо, це ще можна було б пробачити, якби ви не живилися надіями та мріями тисяч стражденних американців. Якби ж вони тільки знали, скільки їхніх негараздів породжують всемогутні еліти, які однією рукою нібито їх “представляють”, а другою грабують їхні статки й нищать расову ідентичність.\n\nЄдине, що я вважаю гіршим за вашу неприховану жадібність і підозріло жидівські звички, - це занепадницька, зламана система, яку уособлює ваш «конґрес». Демократія? Оце сміх! Скористаюся нагодою й назву її тим, чим вона є: фарсом! Ви дозволяєте людям голосувати, але ми обоє знаємо, що все це лише обман і димова завіса. Наступного дурня, який поведе Америку до неминучої загибелі, обирає не народ, а могутні жиди, які непомітно смикають вашу країну за ниточки. Цілком очевидно, що Америка - нація сліпих овець, яких ведуть жидівські вовки.\n\nАмериці судилося загинути, і це факт. Ви дозволяєте жінкам обіймати впливові політичні посади й досі називаєте Америку найвеличнішою нацією на землі? Ось він, жидівський лад: щойно сіоністи домагаються свого, нижчі істоти починають топтати всіх інших. Незабаром, і я певен, чекати недовго, американський народ усвідомить, наскільки його ошукали, і візьме справу у власні руки...\n\nГнийте в пеклі,\n\nКонстантін Владіміровіч Родзаєвскій, Вождь Святої Росії»"
 amur.63.a: "От тепер вони зрозуміють!"

 amur.64.t: "Панові Ґолдвотеру..."
 amur.64.desc: "«Підступному жидові, який тепер називає себе президентом Сполучених Штатів, панові Ґолдвотеру...\n\nЯк доречно, що найбільший двигун світової масонсько-сіоністської машини тепер контролює один із найкорумпованіших і найчорніших серцем юдеїв! Коли вашу перемогу на виборах майже забезпечено, це, безсумнівно, означає, що змови сіоністської еліти в Америці нарешті принесли плоди. Не думайте, що я не розумію ваших хитрощів, пане Ґолдвотере! Ви, можливо, обдурили наївний народ Америки, але росіяни - геть інша порода. Вони не піддадуться вашим підступним брехням так легко, як і я.\n\nАмериканці можуть думати, що вас обрали за їхнім мандатом, але я знаю краще: ви та решта ваших зловісних спільників ретельно маніпулювали продажними установами Сполучених Штатів, щоб забезпечити цілковите панування сіоністів над усією країною та її народом! Усі ви, жиди, однакові. Вважаєте себе недоторканними, а решту з нас - лише пішаками у своїх зловісних іграх. Як же це типово для раси з такою кількістю природжених вад: намагатися почуватися краще, жорстоко топчучи всіх інших!\n\nВи граєте в небезпечну гру, пане Ґолдвотере. Незабаром американський народ усвідомить, наскільки жорстоким буває життя під жидівським гнітом, і буде змушений діяти. Коли цей день настане, пане Ґолдвотере, будьте певні: я та вся Росія радо приєднаємося до їхнього праведного хрестового походу, щоб повалити ваш нелегітимний сіоністський режим! Ваші дні злічені, жиде, бо світ уже вчиться поставати на захист від вас і вам подібних.\n\nЗ неймовірною зневагою,\n\nКонстантін Владіміровіч Родзаєвскій, Вождь Святої Росії»"
 amur.64.a: "Це поставить його на місце!"

 amur.65.t: "Передвиборчий шлях"
 amur.65.desc: "«Брати й сестри росіяни! Спадкоємці землі, божественно дарованої нам Самим Богом! Поміж нас є ті, хто переймається лише справами нації та мало зважає на події за нашими кордонами. Хоч відданість Росії й лише Росії гідна похвали, мудра людина дивиться за межі своєї країни й бере до уваги стан усього світу. Бо саме так, правду кажучи, можна розвинути гостре око для виявлення численних змов і підступів світової сіоністської еліти, спрямованих на те, щоб позбавити Росію її славетної долі!\n\nЗа океаном лежить занепадницька Америка, давно зіпсована впливом заможних жидів, які перетворили колись квітучу націю на свою найбільшу зброю для поширення страждань у світі. Та хоч ситуація здається похмурою, що, якби я сказав вам, мої вірні брати й сестри, що Сполучені Штати ще мають надію? Так, це правда! Є лише одна людина, яка тримає ключ до визволення американського народу від його недолюдських гнобителів, і звати її Френсіс Паркер Йокі.\n\nЗакликаю всіх росіян, де б ви не були, підтримати цього доблесного мужа, якщо маєте таку змогу. З вашою допомогою ми зможемо й далі поширювати справу фашизму в кожному куточку земної кулі й урешті викорчувати вічного жида з його темного осідку влади!» Вождь був відомий пишномовними радіопромовами, та ця спантеличила навіть тих, хто жив під фашистським режимом. Сотні тисяч росіян, які налаштували приймачі того вечора, мали одне спільне питання:"
 amur.65.a: "«Хто?»"

 amur.66.t: "Російському Вождю відмовлено!"
 amur.66.desc: "«Дехто вважає, що до нашої боротьби за сильнішу культуру слід залучати якомога більше людей, але саме це було засадничою помилкою обох американських партій, які йдуть на компроміси й цим розмивають західну думку. І це підводить мене до останньої заяви про підтримку, яку я тримаю перед вами. Цей аркуш надіслала з російської пустки Россійская Фашистская Партія, і на ньому міститься декларація про підтримку нашої справи».\n\n«Користуючись нагодою, я хотів би поговорити про культуру та її значення для західньої цивілізації. Усю історію можна розглядати як зіткнення культурних воль. Англійська й Тихоокеанська війни 1940-х років засвідчують поразку змішаних Сполучених Штатів, які стали жертвами культурної відсталости та нездатности европейців належно берегти свою культуру. Перемога Японії в Тихоокеанській війні втілює розклад европейської культури в Америках, а перемога Німеччини в Англійській війні - піднесення Европи на належне їй місце у світі, над примітивним слов'янином і лютим японцем. Так званий Вождь може бути найжорстокішим із головорізів, які панують над культурно спустошеною Росією, але його підтримка для мене не цінніша за підтримку мого собаки! Я не прошу підтримки варварів будь-якого штибу, бо вони нездатні вирватися з-під впливу культурних засад і мені не потрібні».\n\nСьогодні Національний прогресивний пакт знайшов незвичайне джерело підтримки. Константін Родзаєвскій, Вождь новоутвореної Російської держави, підтримав Френсіса Паркера Йокі як єдиного кандидата, здатного знищити «мережу жидів, що контролює американську політичну систему» - не дивний вислів для нового провідника Росії.\n\nУтім, Йокі прямо відкинув підтримку Родзаєвского, і, схоже, нова Російська держава в кращому разі матиме прохолодні відносини зі США."
 amur.66.a: "Чвари фашистів - не новина."

 amur.67.t: "Нашому Вождю відмовлено!"
 amur.67.desc: "«Дехто вважає, що до нашої боротьби за сильнішу культуру слід залучати якомога більше людей, але саме це було засадничою помилкою обох американських партій, які йдуть на компроміси й цим розмивають західну думку. І це підводить мене до останньої заяви про підтримку, яку я тримаю перед вами. Цей аркуш надіслала з російської пустки Россійская Фашистская Партія, і на ньому міститься декларація про підтримку нашої справи».\n\n«Користуючись нагодою, я хотів би поговорити про культуру та її значення для західньої цивілізації. Усю історію можна розглядати як зіткнення культурних воль. Англійська й Тихоокеанська війни 1940-х років засвідчують поразку змішаних Сполучених Штатів, які стали жертвами культурної відсталости та нездатности европейців належно берегти свою культуру. Перемога Японії в Тихоокеанській війні втілює розклад европейської культури в Америках, а перемога Німеччини в Англійській війні - піднесення Европи на належне їй місце у світі, над примітивним слов'янином і лютим японцем. Так званий Вождь може бути найжорстокішим із головорізів, які панують над культурно спустошеною Росією, але його підтримка для мене не цінніша за підтримку мого собаки! Я не прошу підтримки варварів будь-якого штибу, бо вони нездатні вирватися з-під впливу культурних засад і мені не потрібні».\n\nНаше послання до американського фашистського кандидата зустріли погано: цей пишномовний псевдоінтелектуал одним подихом образив нашого Вождя та наш народ, і все заради невситимого владолюбства й поширення впливу сіоністів, чиїм несвідомим знаряддям він себе показав! Схоже, фашизм в Америці перекрутили за їхніми лихими задумами, а ми справді лишилися єдиною надією світу вирватися з їхніх пазурів."
 amur.67.a: "Лише Вождь по-справжньому вільний від їхніх ниток..."

 amur.68.t: "Спогади про Харбін"
 amur.68.desc: "«Погляньте, ось добра», - усміхнувся Казімір. Він підняв розгорнутий фотоальбом, щоб бармен навпроти з тьмяним поглядом міг його побачити.\n\n«Еге», - нудьгуючи, відповів той. «Ваш кухоль, пане». Перед Казіміром з'явилася висока склянка пінного пива, але той надто заглибився у спогади, щоб помітити. Він одразу повернувся до альбому, злегка всміхаючись кожній помітній світлині й пов'язаним із нею спогадам.\n\nВін досі пам'ятав утечу крізь Сибір із батьком, офіцером армії адмірала Колчака. Спочатку до Владівостока, а коли прийшли червоні й почали хапати старих білих - до Харбіна. Невдовзі старий помер, напівбожевільний від горя, до останнього кликаючи загиблих товаришів. На останньому подиху він благав Казіміра знайти справжніх захисників Батьківщини, вступити до їхніх лав і битися на смерть, щоб повернути свій дім. Тепер, сидячи в барі в Іркутску, Казімір відчував, що нарешті виконав свій обов'язок. Ось воно - мир у рідному місті, визволеному від червоних, - те, заради чого він боровся всі ці роки. Вуличні бійки в Харбіні, подорож на старому розхитаному японському есмінці, криваві битви проти розкольників і комуністів - усе було варте цього. Заради слави, заради Вождя, заради Росії. Він посів своє місце в історії й неабияк цим пишався."
 amur.68.a: "Це було варте будь-якої ціни."

 amur.69.t: "Північ відтає"
 amur.69.desc: "Патрулі Імператорської армії на північних кордонах Маньчжоу-ґо повідомляють про низку прохань від солдатів Родзаєвского про встановлення офіційнішого партнерства між Японською Імперією та Россійской Фашистской Партієй. Зокрема він пообіцяв співпрацю між своїми й нашими солдатами у викоріненні бандитів та партизанів у відкритих і слабко охоронюваних маньчжурських степах. Хоч дехто в кабінеті прем'єр-міністра вважає його давнього ворога Матковского стабільнішим вибором, старий фашист принаймні стоїть просто біля нашого порога."
 amur.69.a: "Чого насправді варті обіцянки Вождя?"

 amur.70.t: "Велике питання"
 amur.70.desc: "Константін прибув до Хейдзьо в супроводі кількох найближчих союзників і охоронців - провідників Россійской Фашистской Партії. Надто довго він був змушений тікати й постійно остерігатися зрадників російського народу з-поміж большевиків і німців! Ні, він більше не буде одним із численних воєначальників. Так, із японцями доведеться домовлятися, але їхнє визнання приверне на його бік кожного росіянина на тихоокеанському узбережжі, навіть підтримуваних американцями піратів.\n\nЙого люди десятиліттями жили вздовж річки Амур, і жваве місто нагадало їм про домівки в колишньому Совєцькому Союзі. Після поїздки з шофером до середмістя він прибув до резиденції ґубернатора, де разом із японським міністром закордонних справ чекав біля дверей.\n\nКонстантін почувався чужим серед витончених аристократів японської бюрократії, але мусив їх причарувати."
 amur.70.a: "«Я радий нарешті зустрітися з вами, пане міністре...»"

 amur.71.t: "Визнання Родзаєвского"
 amur.71.desc: "Прем'єр-міністр переглянув пропозицію, передану міністром закордонних справ. Японія давно намагалася триматися осторонь російського божевілля, особливо коли йшлося про такого непопулярного чоловіка, як Константін Родзаєвскій, та його Россійскую Фашистскую Партію. Американці вже певною мірою підтримували Матковского, надсилаючи йому зброю та припаси, коли крижані моря ставали достатньо теплими. Принаймні Японія могла постачати обранця в російській анархії суходолом - а Родзаєвскій ніколи не відмовиться від такої угоди. Після коротких переговорів прем'єр-міністр схвалив рішення, і вже наступними днями Японії та її маріонеткам у всій Сфері співпроцвітання дали зрозуміти, що Амур є законним російським урядом."
 amur.71.a: "Зрештою, вони не мали причин нас не підтримувати."

 amur.72.t: "Нова світова присутність"
 amur.72.desc: "Хоч новина дісталася Россійской Фашистской Партії лише через день, Константін Родзаєвскій та його послідовники святкували в Хейдзьо, насолоджуючись усіма розкошами доглянутого міста. Завдяки міжнародному визнанню, та ще й з боку Японської Імперії, Всеросійський уряд міг забезпечити панування над Східним Сибіром самою загрозою японського втручання, не кажучи вже про величезні обсяги припасів і розвідувальних відомостей, які натомість надаватимуть японці.\n\nПісля повернення до Амура його зустріли як героя, яким він і був. Багато хто впав у розпач після розколу з тими виродками в Маґадані, нового поширення комунізму в Росії та нападів антияпонських бандитів. Але цього більше не буде. Віднині він уже не черговий воєначальник, а Вождь усієї Росії."
 amur.72.a: "Для Всеросійського уряду немає меж!"

 amur.73.t: "Торгівля з Амуром"
 amur.73.desc: "Всеросійський уряд Константіна Родзаєвского виявився одним із приязніших режимів серед російського хаосу, а після того, як ми визнали його державу, він пропонує розширити економічні зв'язки між Імперією та своїм дедалі міцнішим режимом на російському Далекому Сході. Золоті жили Амура сягають глибоко під землю, а геологи з Токійського університету відзначили ймовірність покладів урану в горах і пагорбах регіону. В обмін на доступ до частини мінеральних багатств Родзаєвскій просить японського фінансування для розвитку промислових центрів довкола амурських міст. Нинішні його пропозиції далеко не справедливі, але тривалі переговори з Вождем неодмінно змусять його передумати."
 amur.73.a: "Багатства можна знайти в будь-якому куточку світу."

 amur.74.t: "Особлива доставка"
 amur.74.desc: "Митник Удзакі надзвичайно ретельно переглянув вантажні документи. Такий вантаж із Півночі? Зазвичай із північного хаосу через кордон пробиралися хіба що виснажені біженці, яких не лякали кулі прикордонників, та самогонна горілка, від якої, здавалося, можна осліпнути будь-якої миті. Але цілий товарний потяг із хромом?\n\nВін повільно підвів очі на неголеного росіянина в напрочуд чистій уніформі.\n\n«Отже, пане, е-е... Драґовіч, це...»\n\n«Двадцять вагонів першокласного хрому, які мають доправити залізницею на Японські острови, до Хіросіми», - миттю відрапортував чоловік.\n\n«О, дякую, що зробив мою роботу за мене, невихований вилупку», - подумав Удзакі. Утім, він зберіг самовладання. «Саме так, вантаж можна пропускати - на знак вічної дружби між нашими народами. Однак вам і вашій команді доведеться зупинитися тут і повернути назад. Імміграційні закони діють, а для вашого уряду ми, на жаль, іще не маємо винятку».\n\nВираз на обличчі слов'янина був безцінним. «Що? Але наступний потяг до міста [AMR.Capital.GetName], який проходить тут, буде аж за два тижні! Ми ж у чорта на рогах!»\n\n«Перепрошую, пане, та нічого не вдієш. Упевнений, вам знайдуть належне помешкання». Удзакі стримав бажання самовдоволено всміхнутися.\n\n«Я подзвоню до Зєї», - простогнав Драґовіч.\n\n«На жаль, наземних телефонних ліній, що сполучали б нас із тією місцевістю, не лишилося. Сподіваюся, вам тут сподобається. Це все». Поки розлючений Драґовіч вилетів геть, Удзакі востаннє пробіг очима документи.\n\n«Невже вони справді вважають нас рівними? Дурні росіяни»."
 amur.74.a: "З такими союзниками... Але принаймні хром прибув вчасно."

 amur.75.t: "Питання Зовнішньої Маньчжурії"
 amur.75.desc: "Тепер, коли ми об'єднали Далекий Схід, настав ідеальний час розпочати переговори щодо наших територій у Зовнішній Маньчжурії. Повернення цих земель стало б великою пропагандистською перемогою як усередині країни, так і за кордоном, а що більше російських територій ми контролюватимемо, то легітимнішими здаватимемося.\n\nЗвернімося до Японії з пропозицією про можливе повернення цієї території до складу Росії. Посольство на чолі з самим Родзаєвскім до Токіо, сподіваємося, зробить свою справу. Вони напевно радо віддадуть нам територію, адже дипломатичні відносини між нами вельми добрі.\n\nМожливо, нам доведеться щось запропонувати навзаєм, але ми очікуємо від наших дипломатів не меншого, ніж угоди на рівних умовах. Родзаєвскій навіть поїде особисто, аби впевнитися, що й ми, і Японія укладемо вигідну угоду. Чому б Японії не вважати нас рівними?"
 amur.75.a: "Слава Росії буде повернена!"

 amur.76.t: "Послання з Далекого Сходу"
 amur.76.desc: "Ми отримали цікаве послання від уряду на Далекому Сході. Схоже, вони хочуть повернути ще більше колишніх територій, і тепер націлилися на Зовнішню Маньчжурію. Хоча земельний апетит Родзаєвского видається невситимим, на переговорах із ним ми можемо виторгувати вигідні умови.\n\nЦя територія нам усе одно нічого не варта - вона лише виснажує наші гарнізони. Маньчжурський уряд уже давно має проблеми з місцевими бандитами. Нам було б вигідно позбутися цього тягаря. Звісно, на переговорах ми про це не згадаємо.\n\nОднак цей край багатий на залізо, і ми провадимо там масштабний видобуток. Якщо віддамо всю Зовнішню Маньчжурію, то можемо втратити доступ до її життєво важливих покладів. Утім, із росіянами можна домовитися. Вони ж не сподіваються отримати територію задарма, правда?"
 amur.76.a: "Негайно надішліть запрошення!"

 amur.77.t: "Подорож до Токіо"
 amur.77.desc: "Родзаєвскій і його делегація вийшли з літака й попрямували до призначених їм автомобілів. Дивовижне місто: Токіо, здавалося, розрослося ще більше від останнього візиту Родзаєвского. Дорогою крізь жваві вулиці їх звідусіль оточували хмарочоси, потяги й автомобілі. Він сподівався, що їм удасться знайти свій готель.\n\nПротягом наступного тижня мали розпочатися переговори про повернення Зовнішньої Маньчжурії Росії. Родзаєвскій був певен, що територію повернуть. Вони вже стільки всього досягли, хіба ні? Японці не запрошували б таку велику делегацію до Токіо, якби не були зацікавлені.\n\nОднак Японія може зажадати чогось навзаєм. Тепер під нашим контролем величезні поклади ресурсів - можливо, Японії можна запропонувати частку. Родзаєвскій радо віддасть що завгодно, аби лише повернути ще одну частину Росії."
 amur.77.a: "Цікава пропозиція."

 amur.78.t: "Початок переговорів"
 amur.78.desc: "Сьогодні розпочалися переговори про передачу Зовнішньої Маньчжурії, і російська делегація на чолі із самим Родзаєвскім прибула за стіл перемовин. Наші представники вирішили зробити перший крок, щоб здобути перевагу.\n\nРосійська делегація, вочевидь усвідомлюючи, що ми ніколи не віддамо землю задарма, запропонувала нам обмежені права на ресурси в обмін на територію. Хоч Зовнішня Маньчжурія, крім шахт, має для нас відносно невелику цінність, Родзаєвскій та його уряд готові на все, щоб повернути колишні землі, і ми це знаємо. Наші представники зажадали повних прав на ресурси, а не лише тієї обмеженої частки, яку запропонували росіяни.\n\nЗрештою ми сподіваємося виторгувати в росіян чудову угоду. Схоже, вони відчайдушно прагнуть повернути якомога більше своїх колишніх земель."
 amur.78.a: "Тепер залишається чекати на відповідь."

 amur.79.t: "Угода"
 amur.79.desc: "Щойно почалася наша зустріч із японцями, вони виявили неабиякий інтерес до запропонованих нами прав на ресурси. Можливо, навіть надмірний. Тепер японці зажадали прав на всі ресурси, а не лише на ту обмежену частку, яку ми були готові віддати.\n\nХоча це непокоїть Родзаєвского, він не має іншого вибору, крім як погодитися. Зовнішню Маньчжурію необхідно повернути, а Родзаєвскому потрібна підтримка нещодавно визволених територій Далекого Сходу. До того ж передача ресурсів Японії напевно ще більше поліпшить наші відносини й покаже, що ми здатні до дипломатії. Можливо, це відкриє перед нами нові можливості у відносинах із японцями.\n\nТож, хоч і неохоче, Родзаєвскій вирішив прийняти японську пропозицію. Утрата такого багатого на ресурси краю може зашкодити нам зараз, але в довгостроковій перспективі це напевно піде нам на користь."
 amur.79.a: "Угода, що задовольняє обидві сторони."

 amur.80.t: "Передача"
 amur.80.desc: "Не дивно, що Родзаєвскій погодився на наші умови, і в обмін на доступ до ресурсів ми згодні передати провінцію. Росіяни раді, що повернули частину своїх колишніх земель, а ми - що отримали доступ до ще більшої кількости ресурсів. Схоже, переговори завершилися вдало для обох сторін.\n\nСподіваємося, бандити й терористи не завдадуть росіянам надто багато клопоту, але нас це вже не обходить. Можливо, вони навіть звикли до боротьби з ними більше за нас. Вони десятиліття відбивалися від бандитів, тож іще кілька років їм не зашкодять."
 amur.80.a: "Підготуйте передачу провінції."

 amur.81.t: "Землі повернено!"
 amur.81.desc: "Наша делегація дійшла згоди з японцями, і Зовнішня Маньчжурія нарешті повернулася до російських рук! Офіційна передача відбулася в самій провінції, а наші гарнізони зайняли місце японських.\n\nУ містах по всьому Далекому Сходу відбулися масштабні святкування, а промову Родзаєвского в столиці вітали сотні радісних громадян. Ми безсумнівно здобули бажану дипломатичну перемогу, а підтримка нашого режиму зросла.\n\nОднак повернення колишніх російських земель - далеко не єдиний здобуток. Успішні дипломатичні переговори з такою наддержавою, як Японія, значно підвищили нашу легітимність і на світовій арені, і всередині країни. Дедалі більше людей прагнуть підтримати Родзаєвского та уряд РФП.\n\nНа жаль, не все ідеально: уже за кілька годин після переходу провінції під нашу владу надійшли повідомлення про терористичну діяльність. Схоже, разом із колишньою територією Японія повернула нам і проблему з бандитами. Наші чорносорочечники вже взялися до справи - їм не раз доводилося боротися з бандитами, - і ми вважаємо, що терористи стануть лише незначною затримкою на шляху нашого великого повернення."
 amur.81.a: "Та кому є діло до бандитів? Святкуймо!"

 amur.82.t: "Останні з ПСАОА"
 amur.82.desc: "Маленький будинок край самотнього села аж ніяк не скидався на штаб-квартиру терористичного угруповання, але якби скидався, Кім Ір Сена схопили б уже давно. Колись високопоставлений офіцер Північно-Східної антияпонської об'єднаної армії, скорочено ПСАОА, Кім став її лідером, коли Японія завоювала Китай і Зовнішню Маньчжурію, зруйнувавши його надії коли-небудь повернутися до Кореї. Тепер він був терористом, який переховувався в бункерах і будинках та планував напади на гарнізони й залізниці.\n\nОднак його успішні кампанії почали сходити нанівець. Відколи російський уряд перебрав владу над Зовнішньою Маньчжурією, росіяни полювали на його угруповання значно вправніше за японців. Нальоти чорносорочечників на схованки ПСАОА частішали, а чисельність її бійців невпинно танула.\n\nКоли сонце опустилося до самого обрію, Кім уже не міг зосередитися на своїх планах. Та й яке вони мали значення? У них однаково не вистачало людей, щоб їх здійснити. Рештки ПСАОА тепер переховувалися в цьому селі, змішавшись із місцевими. Кім вирішив піднятися нагору й, можливо, навіть трохи поспати, якщо вдасться.\n\nТа не встиг він відійти від вікна, як побачене надворі приголомшило його до глибини душі. Чорносорочечники вже знайшли їх! До села один за одним в'їжджали темні вантажні автомобілі, з яких висипали великі загони чорносорочечників і хапали всіх, хто здавався їм підозрілим. Залишалося зовсім небагато часу, перш ніж вони вирішать навідатися до його будинку й напевно вб'ють його на місці.\n\nВін мусив утекти, поки ще мав час. Тихо вислизнувши через задні двері, Кім побіг у густий ліс одразу за селом. Позаду залунали крики, але якщо чорносорочечники й кинулися навздогін, то вже запізно. Саме на такий випадок Кім підготував план утечі й добре знав, де за багато кілометрів у глибині лісу стояв невеликий прихисток. Але Кім розумів: він більше ніколи не зможе показатися людям. ПСАОА загинула, і ще один ворог Японської імперії знову зазнав поразки."
 amur.82.a: "Сподіваймося, він більше ніколи не покаже своєї гидкої пики."

 amur.83.t: "Новий арсенал Вождя"
 amur.83.desc: "Церемонія передачі була короткою й нічим не примітною: промови виголосили і японці, і Родзаєвскій. Разом із нею Вільний Всеросійський флот отримав п'ять колишніх есмінців Імператорського флоту Японії, що посилило вогневу міць російського арсеналу. Згода японців на пропозицію свідчить про наше дедалі більше зближення з ними та перспективу майбутньої дружби.\n\nКораблі поповнять дедалі більший російський флот і стануть одними з найсучасніших у його складі. Хоча корпуси дещо застаріли, а з кораблів зняли ракети, порівняно з рештою нашого флоту вони досі є останнім словом техніки. Їхнє озброєння й технічні можливості значно перевершують наші власні розробки, і ми віримо, що ці кораблі надійно служитимуть нам іще багато років."
 amur.83.a: "Дякуємо японцям за щедрий дар."

 amur.84.t: "Про фашистів і кошенят"
 amur.84.desc: "«Ну ж бо, - сказав Родзаєвскій крихітному кошеняті перед собою, - пий». Перед ним стояла мисочка теплого молока. Коли його пальці торкнулися голівки, кошеня засичало. Люте кошеня: коли Родзаєвскій знайшов його на вулиці своїх нових володінь, воно подряпало йому обличчя. Жодна людина не наважилася б зачепити це кошеня, подумав він, сміливе й відважне перед лицем смертельної небезпеки. Його шерсть була плямистим і жорстким переплетінням чорного й білого, але очі сяяли золотими дисками - Божий дар Вождю російського народу.\n\nУвійшов помічник. Родзаєвскій навіть не помітив кроків. Росія могла почекати; світ міг почекати; жиди могли почекати. Партія, Матковскій, Міхаїл - ніщо з цього не мало значення. Сичання й пирхання кошеняти важили більше за звіт помічника. Цмокання його маленького язичка, що хлебтав біле багатство перед ним, заспокоювало серце Константіна краще за будь-що інше. Дотик його шерсти - грубої та брудної, запорошеної й замурзаної - не відштовхував і не лякав його. Під його рукою було нове життя, незаплямоване й незіпсоване підступами світу, ворожого його ідеям.\n\n«Пане?» - озвався помічник. «З вами справді все гаразд?»\n\n«Так. І взагалі, що ти тут робиш?» Забирайся звідси, подумав Родзаєвскій. Він був не в гуморі посилати когось на розстріл.\n\n«Гарне кошеня, пане».\n\n«А то, блядь».\n\n«Ви вже придумали йому ім'я, пане?» Питання спантеличило Родзаєвского. Він про це навіть не думав. Яке ім'я пасувало б такому сміливому кошеняті?\n\n«Мура. Він - Мура. А тепер геть». Помічник негайно вийшов із кімнати й лишив Родзаєвского наодинці з новим другом, новим супутником на наступні десятиліття."
 amur.84.a: "Навіть у Вождя є серце."

 amur.85.t: "Вождь Національної держави"
 amur.85.desc: "Родзаєвскій скинув пальто й відчув, як тепло спальні розливається по його зболених кістках. Відколи він зміцнив свою владу над Центральним Сибіром, то відмовлявся від сну заради звичних опівнічних прогулянок лютими вітрами міста [AMR.Capital.GetName], поки в голові вирували видіння майбутнього. Він повернувся до ліжка. Колись воно видавалося таким теплим і привабливим, прихистком, де можна дати спокій голові, що розколювалася, і забути про гнітючу похмурість дійсности. Тепер воно було лише порожньою дрібною принадою в кутку кімнати.\n\nПопереду було багато роботи. Сибірська Національна держава розкинулася далеко й широко, розчавивши всю непокору під величною навалою його армії. Комуністичний непотріб загинув під гусеницями його танків, дрібних воєначальників розтерзав натиск його авіяції, а дегенератів розстріляли його відважні піхотинці. Його величне видіння жорстоко пробило собі шлях із крихітної мерзлої пустки Амура крізь розбиті простори Сибіру.\n\nВін був Вождем російського народу. Його хитку ходу змінив цілеспрямований крок. Його пригнічена гримаса скривилася в глузливу посмішку переваги. Люди дивилися на нього вже не з байдужістю чи жалістю, а зі справжніми страхом і повагою. На нескорених рівнинах Росії етнічні росіяни з радістю чекали на його неминучий тріюмф, поки жидо-большевицькі щури в жаху розбігалися.\n\nНа нього чекала спокуслива пляшка горілки. Він обхопив її змерзлими пальцями, підніс до пересохлого горла... і зупинився. Буркнувши, він змусив себе налити маленьку чарку й випив її одним ковтком. А тоді ще одну, про всяк випадок. Історія назве прихід Вождя до влади величнішим за Гітлерів, а історію Російської Національної держави - величнішою за історію Німецького Райху. Уперше за десятиліття присмак горілки й жовчі не отруїв його рота. Лишився тільки смак перемоги."
 amur.85.a: "Привид фашизму блукає Сходом."

 amur.86.t: "Застарий, щоб тікати"
 amur.86.desc: "«Не закривається», - задихано промовив Лєв, марно натискаючи на віко валізи. Він розчахнув її та вилаявся, вихопив ляльку й кинув через усю кімнату. Віко закрилося. Івана скрикнула й розридалася. «Виведи її надвір!» - гукнув він дружині, не зважаючи на ридання доньки й поспішаючи нагору. Як же він хотів утішити її, пригорнути, сказати, що все буде гаразд. Але не міг. Часу не було.\n\nҐєорґій сидів у тому самому кріслі, у якому вмостився годину тому, вдоволено поклавши зморшкуваті руки на живіт. Лєв із жахом витріщився на нього.\n\n«Я сказав тобі пакуватися!» - закричав Лєв. «Нам треба йти! Зараз же!»\n\n«Якщо тобі від того не стане гірше, я саме збирався подрімати», - пробурмотів помітно роздратований Ґєорґій.\n\n«Будь ласка, дідусю... вони скоро прийдуть, прийдуть чорносорочечники...»\n\n«Я старий, але не здурів!» - засміявся Ґєорґій. «Не маю жодного сумніву, що ці фашистські головорізи навідаються до мене. Нехай приходять! Я за своє життя мав справу з достатньою кількістю антисемітів». Він побачив розпачливий вираз Лєва й тяжко зітхнув. «Забирайся звідси, дитино. Бери родину. Я молитимуся за вашу безпеку, але не дурій і не думай, ніби я ще для когось зрушу з місця. Я тікав від большевиків. Тікав від війни. Бігав від одного воєначальника до іншого. Я втомився тікати». Він підморгнув. «Ну ж бо, онуку. Живи добре»."
 amur.86.a: "Настає час, коли людина мусить твердо стояти на своєму."

 amur.87.t: "Марність опору"
 amur.87.desc: "Дощ періщив із темного нічного неба, перетворюючи тверду грязюку на багно. Обірваний чоловік хитко ступив уперед і впав у рідкий бруд, стогнучи від болю, поки позаду вибухнув хор реготу.\n\n«Піднімайся, блядь!» - заревів один з озброєних головорізів. Їхні товсті ноги були втиснуті в чорні чоботи. Масивні тулуби напинали чорні сорочки. Квадратні голови стискали чорні військові кашкети. Закривавлена купка чоловіків, яких вони конвоювали, не підводила голів. Найнепокірніших уже розстріляли.\n\nДехто з них був біженцем-саблінцем. Інші - рештками Чорної армії. Кілька були демократами з поваленої Республіки. Усі вони посміли опиратися новій тиранії Россійской Фашистской Партії.\n\nОдин із чорносорочечників поскаржився на дощ, і партизанів швидко поставили до стіни. Вони навперемінно вигукували заклики до свободи, демократії, Революції. За зливою не було чути нічого - крім пострілів, що пролунали слідом."
 amur.87.a: "Стіни пофарбувалися червоним."

 amur.88.t: "Викурити їх"
 amur.88.desc: "Полум'я повзло стінами будинків, пожираючи все на своєму шляху. Вогонь танцював у блідо-блакитних очах Іґоря, поки той задоволено спостерігав. Офіцери ООБ жбурляли смолоскипи у вікна й на дахи, вигукували образи та співали пісень. Іґор не мав часу на таку непрофесійність.\n\nЗвіти видавалися надійними. У селі переховувалися жиди, яким зрадники держави давали притулок у льохах і під мостинами. День був виснажливим, і Іґор давно вже не мав сил обшукувати кожен окремий будинок. Натомість він наказав викурити щурів.\n\nЗ одного будинку, надсадно кашляючи, вивалився старий. Молодик вистрибнув із вікна з ножем, і його одразу застрелили. Дві жінки з вереском вибігли з охопленої вогнем хати, а кілька офіцерів із гиканням кинулися навздогін. Полум'я осяяло нічне небо, малюючи гарну картину для тих, хто ще міг її побачити."
 amur.88.a: "Щури згоряють у полум'ї."

 amur.89.t: "Ще один з'їзд Россійской Фашистской Партії"
 amur.89.desc: "Тиша в залі була гнітючою. Партійні соратники перекладали папери й ніяково покашлювали, чекаючи, поки заговорить Вождь. Нарешті Родзаєвскій прочистив горло й обвів залу жорстоким поглядом.\n\n«Мої Соратнікі, - почав Родзаєвскій, - Другий з'їзд Россійской Фашистской Партії оголошую відкритим! Дехто з вас, можливо, дивується, навіщо я скликав ці збори. Зрештою, хіба Партія не сягнула величних нових висот? Хіба єдність і сила не поставили Центральний Сибір на коліна?» Залою розійшовся підлабузницький гомін згоди. «Дім може здаватися величним, могутнім, непохитним. Але що станеться, якщо його підмурівок слабкий? Він завалиться сам у себе». Гомін гучнішав, голови хиталися дедалі завзятіше. Родзаєвскій грюкнув кулаком по столу, і в залі запала тиша. «Ви гадаєте, я довбаний ідіот? Думаєте, я сліпий і не бачу чвар між Болотовим і Шехєрєвим?»\n\nАлєксандр Болотов і Ґєорґій Шехєрєв, збліднувши, перезирнулися.\n\n«Затямте одне, - виплюнув Родзаєвскій. - Я - Вождь. Я - Партія. Серед вас немає недоторканних. Жодного. Якщо ви загрожуватимете стабільності всього, чого ми досягли, ваші падла викинуть у мерзлу яму!» Він погрозливо тицьнув пальцем у двох чоловіків. «Історія запам'ятає вас героями - або не запам'ятає взагалі. Самі обирайте свою долю»."
 amur.89.a: "Останній ультиматум."

 amur.90.t: "Остання чистка?"
 amur.90.desc: "Партія була всемогутня. Партія була всевідаюча. Але Партія не була чистою.\n\nПопри всі здобутки Вождя, у верхніх ешелонах Россійской Фашистской Партії досі гноїлося інакодумство, немов хвороба, що виснажує й знесилює свого носія. Ті, хто давно сумнівався в Родзаєвскім, і далі шастали коридорами влади, змовляючись за його спиною та плануючи усунути його від влади. Вони хотіли когось молодшого, безпечнішого, податливішого до їхніх забаганок. Те, що він так довго терпів таких людей, красномовно свідчило про його колишню безвихідь. Та настав час змін.\n\nРодзаєвскій зі садистським задоволенням уклав списки. Звісно, Болотов також зробив свої корисні доповнення, націлившись на тих, хто нібито змовлявся проти держави. Від наймізернішого чорносорочечника до найвищого члена Совєту - нікого не омине правосуддя Вождя. Деякі страти, звичайно, будуть жорстокими, щоб залякати всіх інших тхорів із Вєрховного Совєту, яким пощастить уникнути кулі."
 amur.90.a: "Киньте їх до ям."

 amur.91.t: "Скрізь тихо"
 amur.91.desc: "Стихли вигуки протесту, брязкіт кайданів і тріск пострілів.\n\nПараною Вождя втамовано, а його вороги або втекли, або були знищені. Чорносорочечники Шехєрєва повертаються до своєї звичної підозріливости й пильности, а Болотов складає нові списки для Вождя. З часом до стіни поставлять нових людей, а Вождь побачить нових супротивників навіть серед найвідданіших послідовників. Але наразі страт поменшало, й Вождь зосередився на інших справах."
 amur.91.a: "Наша влада в безпеці - поки що."

 amur.92.t: "Блудний син"
 amur.92.desc: "«Кількість арештів зменшилася, Вождю. Невтомні зусилля моїх людей привели до загального спаду підривної діяльности, а агітатори, боячись нашої відплати, тепер приховують свою присутність. Завдяки промисловості Центрального Сибіру ми добре озброєні, а підготовка до війни за Захід уже почалася».\n\nРодзаєвскій не був вражений. «Ти впевнений? На чому ґрунтуються твої слова, Шехєрєве?»\n\n«Кількість арештів зменшилася. Повідомлень про антидержавні думки в наших лавах надходить дедалі менше, хоча їх і раніше було небагато. Наша влада з кожним днем стає надійнішою».\n\nАлєксандр Болотов мовчав, поки очільник чорносорочечників вихваляв свої успіхи. Терпіння було необхідне, адже останнім часом Вождю його бракувало навіть для найбільш довірених радників.\n\n«Тоді чому ти зосередив свої зусилля на внутрішніх справах? Чи ти забув, що нам належить вести війну? Якщо ти належно виконав свою роботу, ворог уже не всередині».\n\nУ кабінеті запанувала тиша, а тоді пролунав шепіт Вождя.\n\n«Ти виконав свою роботу, Ґєорґію?»\n\nШехєрєв якусь мить затинався, аж поки Родзаєвскій знову не перебив його. «Поклади мені на стіл звіт про стан наших збройних сил. НЕГАЙНО!»\n\nПісля квапливого затинання на знак згоди й такого ж квапливого виходу Болотов і Вождь лишилися наодинці.\n\n«Він досі гадає, що ми живемо в старі часи, Алєксандре. Внутрішнього ворога розчавлено, і він уже не має надії скинути нас. Ворог на заході - облудний і слабкий претендент на провід над російським народом. Але ще далі на заході німці претендують на спадщину націонал-соціялізму, якої не заслуговують! Їхні жалюгідні спроби підтримати свою оману розіб'ються перед справжніми спадкоємцями!»"
 amur.92.a: "Вигнанці повертаються на вістрі меча."

 amur.93.t: "Повторюючи власний шлях"
 amur.93.desc: "Як ми сюди дісталися?\n\nЦе питання вже кілька днів не полишало думок Вождя. Він виріс серед насильства у Блаґовєщенску й у вісімнадцять років утік із дому. Тепер, після майже п'ятдесятьох років боротьби, він повернувся. Він гадав, що повернеться в кайданах - після зради японців чи симпатиків большевиків або проданий своїми ж, як тим зрадником Матковскім! Та натомість повернувся Цезарем на чолі армії вірних!\n\nВін досі з теплотою згадував роки в Харбіні: як чекав на нагоду, винюхував зрадників і жидів, щоб дати їм по заслузі. Та вік притупив його потяг до таких розваг, а дика атмосфера Харбіна поступилася колишній штаб-квартирі Комуністичної партії в Новосибірску. Лютий холод пустельної Зєї теж лишився позаду, а тепло опалюваного кабінету дарувало старечому тілу затишок під час роботи. Випробування тих днів, сорок років у вигнанні, зробили сильнішими і його, і тих, хто служив поруч. Болотов, цей жорстокий і непередбачуваний підлабузник, за роки тяжкого життя також виріс у дієвого воїна націонал-соціялізму.\n\nТак, саме вигнання відділило тих, хто лишився вірним націонал-соціялізмові, від корисливих шукачів влади, усіляких Пєтліних - покидьків, які відкинули його на роки назад, украли його жінку й змарнували тисячі російських життів у безплідній боротьбі проти неминучого сходження єдиного Вождя. Щоб Росія вижила, боротьба мала тривати.\n\nНявчання кішки перервало його думки, і Вождь узяв її на руки, гладячи м'яку шерсть і думаючи про майбутні перемоги."
 amur.93.a: "А що ж майбутнє?"

 amur.94.t: "Порожня чарка"
 amur.94.desc: "Міністри зібралися, обговорення відбулися, приготування завершилися, а після всього цього, далеко за північ, Вождь самотньо стояв у залі засідань, схилившись над столом. Стіл був завалений друкованими документами, що описували пересування військ і шляхи постачання, але всю увагу Вождь віддав мапі. Кордони старої Росії, роздерті стерв'ятниками Японії та, передусім, Німеччини. Спершу падуть західні слабаки, тоді Московія, і кордони буде відновлено. А потім, можливо, вони рушать далі й покажуть німецьким дегенератам, як далеко ті збилися зі справжнього шляху.\n\nВождь потягнувся до пляшки поруч із собою, звичним рухом відкоркував її, а тоді...\n\nДумки понеслися наввипередки. Спогади про пів століття у вигнанні, битви об'єднавчих воєн, кінець зрадника Матковского й усвідомлення того, що йому потрібно. Сила. Він був знесиленим калікою, який спирався на милиці інших фашистів та алкоголю, щоб дістатися сюди. І в міру просування він одну за одною відкидав їх геть. Матковскій - зрадник. Шехєрєв і Болотов - жорстокі головорізи.\n\nА тепер ця руйнівна, жалюгідна звичка стала непотрібною. Будь-які сумніви в собі полишили його розум. Зрадники вгамуються перед ним і не посміють здійснити своїх задумів. Армія вірних виконає його наказ, маршируючи до Москви й, можливо, ще далі. Вождь стояв один - незворушний і владний. Пляшка твердо дзенькнула, коли він із силою поставив її на стіл і закрутив корок.\n\nНе сьогодні."
 amur.94.a: "В ім'я Вождя - вперед!"

 amur.95.t: "Велич Вождя"
 amur.95.desc: "Як і щоранку перед школою, Андрєй увімкнув маленький телевізор і сів чекати, поки мати приготує сніданок. Звичайного дня він дивився б свою улюблену програму. Але цей день був незвичайним. Сьогодні всі державні частоти віддали промові Вождя, Константіна Родзаєвского.\n\nАндрєй нещодавно досяг віку, коли мусив вступити до Малюків, тож його докладно ознайомили з усім, що Вождь зробив для Росії. Для росіян. Для таких росіян, як він. Це було політичне пробудження, яке Андрєй зустрів із величезним захопленням. Ба більше, він, імовірно, стане одним із наймолодших молодших керівників у своїй секції.\n\nКоли Вождь розповідав про нові нещодавні тріюмфи, Андрєй відчував, як груди наповнює гордість. Цей чоловік, цей провидець, виступив проти покручів, зрадників, чужинців і паразитів та переміг їх усіх. Він створив сильну державу, у якій такі хлопці, як Андрєй, могли вирости сильними, і тепер Андрєй знав: немає величнішого взірця для наслідування й вищої посади, якої варто прагнути, - навіть якщо обіймати її може лише одна людина.\n\nМати покликала його снідати, перебивши слова Вождя, й Андрєй закричав, щоб вона замовкла. Він не міг і не хотів пропустити жодного слова. Старший керівник казав йому, що Вождь говорить за них усіх, отже, вони зобов'язані завжди слухати. Андрєй слухатиме. Андрєй коритиметься. Андрєй навчить інших робити те саме.\n\nІ одного дня Андрєй зустріне великого Вождя. Він знайде спосіб. Він доведе, що гідний."
 amur.95.a: "Велич Вождя незаперечна."

 amur.96.t: "Тяжкий трудовий день"
 amur.96.desc: "Тіхон Ніколаєв хитався вулицею, наче п'яний, серед натовпу таких самих робітників, що витікав із заводських дверей. Скільки минуло? П'ятнадцять, шістнадцять годин? Він збився з ліку невдовзі після того, як почалася понаднормова зміна. Вище керівництво казало, що вони готуються «очистити» Росію, а завод і його робітники найближчими тижнями мусять «пожертвувати заради Батьківщини всім, чим тільки зможуть». Тож він провів цілий день і значну частину ночі, наглядаючи за працею дедалі виснаженіших робітників. Він дивився на темні вулиці, намагаючись згадати, котра з них його, і збирав у ногах усі сили, щоб не впасти просто на місці.\n\nПісля вічности ходьби він дістався свого будинку на краю міста. Увалившись у двері, глянув на годинник. 23:20. Сімнадцять годин роботи. Йому був потрібен перепочинок. Тихо пробравшись на кухню, він відкрив комору, дістав пляшку горілки й відпив просто з горлечка. Скільки ще він муситиме пожертвувати заради Батьківщини? Скільки буде таких ночей? Як часто він бачитиме свою родину?"
 amur.96.a: "Кожен мусить виконати свій обов'язок перед Батьківщиною."

 amur.97.t: "Без жалю"
 amur.97.desc: "Як давно це було, подумав Васілій Тирсін, поки його автомобіль їхав вулицями Іркутска. Колись він був юним курсантом і навчався тут у військовій академії - спершу за білих, але значно довше за совєтів. Тепер він став одним із найвищих генералів Всеросійського уряду Далекого Сходу. Дивно все обернулося.\n\nВін проїхав перехрестя, де колись стояла стара корчма, в якій вони з товаришами-курсантами випивали на вихідних. Тепер там був житловий будинок. Шкода, подумав він. Може, якщо його призначать сюди, він її відбудує.\n\nТа Тирсін приїхав не оглядати пам'ятки й згадувати молодість. Він був тут у службових справах.\n\nАвтомобіль зупинився біля старого багатоквартирного будинку - навіть він досі тут стояв, подумав Тирсін. Разом із відділенням солдатів він вийшов із машини й попрямував усередину. Йому повідомили, що тут живе керівник великої шпигунської мережі, і завданням Тирсіна було забрати його, перш ніж того належно ліквідують. За даними розвідувальних документів, шпигун мешкав тут. Квартира 129. Рядовий вибив двері, й перед солдатами завмер приголомшений чоловік зі світло-каштановою бородою, у якій від старости проступали блідо-сиві пасма. Акім? Той хлопець, який колись пригощав його випивкою в корчмі?\n\nАкім кричав, і сльози котилися його обличчям, поки Тирсін зачитував ордер на арешт, а солдати витягали чоловіка з квартири.\n\n«Будь ласка! Ти не можеш так зі мною, Васю! БУДЬ ЛАСКА!»\n\nКоли солдати кинули його в багажник, Тирсін нахилився до нього й крижаним голосом промовив одне речення."
 amur.97.a: "«Це суто професійні відносини»."

 amur.98.t: "Огида демонів"
 amur.98.desc: "Мічіл із друзями вирушили із заводу додому в доволі доброму гуморі. Хоч праця й ламала спину, вона принаймні дозволяла прогодувати родини. Коли зміна нарешті скінчилася, вони відсвяткували кількома чарками, а тоді рушили додому. Та гарний настрій тривав недовго. За рогом вони пройшли повз корчму, яку полюбляли солдати Всеросійського уряду. Невелика група солдатів відділилася від тих, хто стояв при вході, і п'яною ходою стала перед ними.\n\n«Гляньте на цих довбаних покручів, думають, можуть просто пройти повз старших і не заплатити мита», - протягнув із сильним п'яним акцентом особливо здоровезний чоловік на чолі групи. Його друзі вже оточили Мічіла з товаришами. «Дивіть-но сюди, щури. Ви викладете свої рублі й підете собі далі. А якщо ні? Ми з друзями змусимо вас пошкодувати, що ви взагалі вилізли зі своїх довбаних печер».\n\n«Будь ласка, пане, ми просто хочемо додому... будь ласка», - Мічіл уже був близький до істерики. Якщо вони втратять ті крихти грошей, що мали, то, найімовірніше, помруть із голоду. Перш ніж він устиг продовжити, чоловік ударив його кулаком у живіт. Повітря вибило з легенів, і він упав на коліна під регіт довкола. Та перш ніж чоловік продовжив побиття, повітря прорізав гучний свист.\n\nВулицею до них марширував бувалий сержант із абсолютно оскаженілим виразом обличчя. «Якого хуя ви робите, довбані виродки?! Тягніть свої сраки до казарм, поки я особисто не здер із вас шкури!» Обличчя чоловіка свідчило, що він не жартує. Мічіл відкрив рота, щоб подякувати, але миттю закрив його, побачивши неприховану, щиру огиду сержанта до нього та його друзів."
 amur.98.a: "Навіть допомагаючи нам, вони нас ненавидять."

 amur.99.t: "У пащі жаху"
 amur.99.desc: "Капітан Саша Мінікін із жахом дивився, як солдати Всеросійського уряду налетіли на бурятське село. Капітан і його партизани воювали проти божевільного Вождя з Амура ще від падіння Бурятії. Навіть після смерти товариша Сабліна частини Червоної армії під його командуванням не розчинилися в повітрі. Вони продовжували боротьбу осередками на всій фашистській території. Саша та його люди стежили за цією групою фашистів від самої миті, коли ті увійшли до Бурятії, готуючись напасти, коли ворог буде найвразливішим. Наскільки він знав, ніхто із залишків Червоної армії не шукав притулку в селі під ними. Селяни не допомагали партизанам, та це ніколи не мало значення для псів Родзаєвского.\n\nПокидьки зібрали чоловіків села на центральній площі. Жінок і дітей ніде не було видно, хоча вони, ймовірно, ховалися у своїх домівках. Саша наказав би атакувати тієї ж миті, якби не чисельна перевага ворога. Фашистів було вдвічі більше, до того ж вони мали краще спорядження. Тому партизани могли лише дивитися, як чоловіків поставили до стіни місцевого храму й розстріляли.\n\nКоли останній чоловік упав на землю, солдати почали витягати з вантажівок бочки з паливом. Будинки й крамниці обливали нафтою, поки невинні люди всередині кричали від жаху. Кожного, хто намагався втекти, розстрілювали, перш ніж він устигав далеко відбігти. Останнім розграбували й підготували до спалення храм. Коли все було готово, солдати підпалили кожну будівлю в селі.\n\nКапітан Саша Мінікін міг лише плакати, поки вітер ніс до його людей крики вмирущих. Довкола нього чоловіки ридали й блювали, дивлячись, як горить село. Саша опустив погляд на мундир, на знаки розрізнення. Зі слізьми на очах він зірвав їх і кинув на землю.\n\nВін був негідний їх носити."
 amur.99.a: "Наслідки опору."

 amur.100.t: "Відкинута тінь"
 amur.100.desc: "У Новосибірску на центральній площі, колись відомій як площа Лєніна, зібрався натовп. Тепер її назвали площею Спасовского на честь покійного ідеолога, а старі большевицькі пам'ятники повалили й розтрощили. У центрі площі, на поспіх зведеній сцені й в оточенні озброєних чорносорочечників, стояв Родзаєвскій, згори пронизуючи поглядом присутніх.\n\n«Мої співвітчизники!» - почав Родзаєвскій, майже гаркнувши ці слова. «Нарешті вся Росія об'єднана під владою однієї держави, одного народу, одного Вождя! Пишайтеся собою, бо нарешті ми зможемо здійснити національне відродження й розчавити всіх, хто поставив нас на коліна!» Хоч дехто в натовпі вагався, більшість вітала це велике досягнення. Зрештою, міркували вони, жоден уряд не може бути гіршим за хаос, який їм довелося пережити. Чи може? З дикою посмішкою на обличчі Родзаєвскій дав їм похвилини покричати, а тоді жестом наказав замовкнути. «Можливо, дехто з вас запитує себе, хто ж довів Батьківщину до руїни. Я скажу вам, хто. Частково в цьому винні прокляті жидо-большевики, цього не заперечити. Однак найбільше заслуговують нашого гніву корумповані фашистські самозванці в Берліні, зіпсовані жидівським шепотом і багатством Сіону! Ми розчавимо їх, усіх до одного, і повернемо Батьківщину росіянам і лише росіянам. Сьогодні ми відпочиваємо. Але завтра готуватимемося обрушити пекельний вогонь на кожного німця, який і далі виконує накази жидів!» Навіть коли кілька людей вислизнули геть - чи то зі страху, чи то з огиди, - маси знову вибухнули оваціями.\n\nОстаточна перемога вже виднілася попереду, і вони принесуть її своєму Вождю.\n\nХай чого це коштуватиме."
 amur.100.a: "Розбитий світ чекає в темряві."

 amur.101.t: "Перенесення столиці"
 amur.101.desc: "Константін Родзаєвскій був сповнений сил. Солдати його держави - його солдати - завоювали значну частину Далекого Сходу, створивши міцну базу влади для РФП.\n\nІ це розширення поставило його перед вибором, якого він не очікував і не планував. Із такою кількістю нових територій столицю доводилося переносити. Зєя свого часу прислужилася, але була надто маленькою та провінційною, щоб лишатися осередком влади відродженої фашистської держави. Переїзд був необхідний, і на заміну з'явилися два можливі міста.\n\nПерше було очевидним. Іркутск був одним із найбільших міст у всьому Сибіру, мав значну інфраструктуру - як транспортну, так і будь-яку іншу - і стояв набагато ближче до кордону, через який, як знав Родзаєвскій, розпочнуться майбутні походи. Але це також робило його вразливішим, а попередній статус столиці решток совєцької держави означав, що серед цивільного населення, ймовірно, досі переховувалися саботажники й комуністи.\n\nДругим варіянтом була Чіта, донедавна окупована монархістами-відступниками. Вона була меншою й віддаленішою - хоча все ще не настільки, як Зєя, - зате пропонувала значно більшу безпеку, ніж Іркутск. Її статус осередку однієї з Харбінської трійці також давав певні ідеологічні та пропагандистські переваги. Але відстань до майбутніх фронтів, безумовно, створювала б адміністративний тягар.\n\nОбидва міста мали сильні та слабкі сторони, але Родзаєвскій знав, що мусить обрати одне. І як беззаперечний правитель своєї держави він також знав: вибір може бути лише його."
 amur.101.a: "Не можна втрачати пильність. Чіта надійніша."
 amur.101.b: "Мусимо готуватися до майбутнього. Іркутск - природний вибір."
 amur.101.c: "До біса обидва. Родзаєвск, бо вдома й серце на місці."

 amur.102.t: "Всеросійський план розвитку"
 amur.102.desc: "вступна економічна подія"
 amur.102.a: "Нехай серце Росії б'ється могутньо"

 #### Amur economic development stuff ####
 #Rodzaevsky economic development
 AMR_rodz_econ_development_category: "Розвиток наших володінь"
 AMR_rodz_econ_development_category_desc: "\n\n\n\n\n\nПовернувши у змія §qМатковского§! §iпорт Маґадана§! та §Wвелике місто Родзаєвск§!, ми здобули вікна в зовнішній світ, завдяки яким зможемо не лише наздогнати дрібних воєначальників у колишньому §eНечестивому Союзі§! та за його межами, а й перевершити їх. Ми розпочнемо амбітний проєкт індустріялізації, рівного якому Росія ще не бачила. Цей витвір мудрости §WКонстантіна Родзаєвского, Вождя Всеросійського уряду§!, є величним задумом швидкого розширення нашої стратегічної інфраструктури та промислової бази, якими так ганебно нехтували §eжиди§!, що завели нашу Батьківщину в безодню.\n\nХоча на папері він може здатися надто амбітним для наших можливостей, ми маємо кілька переваг, що ставлять нас на багато щаблів вище за корумповані вотчини на захід від нас. Наш козир - відносини зі §fСферою співпроцвітання§!, які §WВождь§! уміло плекав десятиліттями, ще від часів Харбіна. З їхнім промисловим і технічним досвідом на нашому боці ми зможемо одним стрибком обігнати в розвитку своїх суперників. Ба більше, доступ до єдиного чинного порту в Росії та прямий сухопутний вихід до Маньчжурії забезпечать нам кращий доступ до азійських ринків, ніж будь-кому з наших суперників. Нарешті, нещодавнє визволення російських земель від §eжидо-большевиків§!, §qкошерних фашистів§! і §Oплутократичних царистів§! дало нам більш ніж достатній резерв робочої сили, щоб досягти цих цілей у строки, передбачені нашими економістами й військовими керівниками. Справжні росіяни, які дорожать Батьківщиною, чесно працюватимуть і пожинатимуть плоди своїх зусиль, а ті, хто глумився з нашої любої Батьківщини й прагнув поживитися її трупом, муситимуть спокутувати все, що вони заподіяли Росії. Не сумнівайтеся: чорносорочечники під проводом §WАлєксандра Болотова§! подбають, щоб їхній борг перед нацією було сплачено до останку.\n\n§WЗа Бога, Націю і Труд!§!"

 AMR_amur_gold: "Золоті поклади Амура"
 AMR_amur_gold_desc: "Під самим Амуром залягають найбільші відомі поклади золота в усій Росії. Для §eжида§! цей метал годиться лише на вульгарну демонстрацію багатства. Та незліченні застосування в промисловості й електроніці роблять уже саму практичну цінність цих мінералів вартою зусиль, потрібних для їх видобутку. Маючи належне обладнання й нагляд чорносорочечників, ми організуємо найманців, які билися за змія §qМатковского§!, щоб вони взяли на себе найтяжчу роботу."
 AMR_amur_highway: "Амурське шосе"
 AMR_amur_highway_desc: "Проєкт шосе М58 мав стати ключовою дорожньою ланкою Сибірського плану й сполучити адміністративний центр области з Іркутском через Чіту. Воно мало простягнутися від Чіти на заході до міста, що носить ім'я нашого §WВождя§!, на сході, але, як і чимало інших невдач §eНечестивого Союзу§!, так і не було завершене. Якби його добудували, ми мали б ще один надійний сухопутний шлях для наших товарів до Маньчжурії. Спочатку §eбольшевицький НКВД§! планував примусити простих росіян працювати до смерти на будівництві цієї ділянки. У Бога таки дивне почуття гумору, бо тепер ті самі тварини, які мали наглядати за цим несправедливим актом рабської праці, гниють у тих самих таборах, якими колись керували. Можливо, варто ще трохи потішити Бога й змусити цих в'язнів завершити роботу, до якої вони так завзято гнали інших?"
 AMR_all_russian_metal_union_amur: "Всеросійський металообробний комбінат Амура"
 AMR_all_russian_metal_union_amur_desc: "Хоча значна частина металевих покладів Амура вже доступна для нас, надто довго справжнім вузьким місцем лишалася наша неспроможність належно очищувати й обробляти ці метали. Тому одним із перших кроків до відродження економіки регіону має стати будівництво металообробних підприємств по всій державі. Їхні могутні димарі здіймуться над обрієм Зєї, і місто почне змагатися з іншими промисловими центрами, які ще лишилися в Росії."
 AMR_start_zeya_dam: "Почати будівництво Зєйської греблі"
 AMR_start_zeya_dam_desc: "Річка Зєя - невикористане джерело безмежної енергії, що стане вирішальним для перетворення нашої столиці на промислову потугу. Оскільки це складне інженерне будівництво, яке ми не здатні виконати самотужки, ми укладемо договір із §fгрупою «Сумітомо»§!, щоб вона заклала основу цього великого інженерного звершення. Повне завершення гідроелектростанції триватиме багато років, але перші переваги ми маємо відчути вже невдовзі."
 AMR_oil_for_food: "Нафта в обмін на продовольство"
 AMR_oil_for_food_desc: "Через нерозвиненість нашої економіки й доступу до ресурсів деякі її галузі нам поки не потрібні - принаймні доки ми не розвинемо промислову базу. Натомість нам украй необхідний імпорт продовольства, щоб компенсувати низькі врожаї в регіоні. На щастя, наші добродії з Японії готові надсилати нам харчові припаси в обмін на частину надлишкового пального."
 AMR_Zeya_LJ_rail: "Залізниця Зєя-Родзаєвск-Лунцзян"
 AMR_Zeya_LJ_rail_desc: "Хоч порт Маґадана має для нас неабияке значення, через непривітний клімат ним буде важко користуватися протягом значної частини року, адже наші суднобудівні потужності не дають змоги виготовити достатньо криголамів для цілорічної роботи порту. Відбудувавши старі й занедбані залізничні сполучення з Маньчжурією, ми зможемо перевозити великі обсяги товарів навіть тоді, коли Маґадан не працюватиме на повну потужність."
 AMR_yakutsk_working_undesirables: "Змусити небажаних мешканців Якутска працювати"
 AMR_yakutsk_working_undesirables_desc: "Не дивно, що після повернення Якутска під повний російський контроль виявилося: його населення аж кишить небажаними елементами, значною мірою завдяки недавнім заграванням із плутократичним лібералізмом. Стару опору влади та її прихильників необхідно відправити на тяжкі виправні роботи. Ми переселимо значну частину найнепокірніших представників колишньої республіки до місця, де їх буде легше тримати під наглядом, а решту змусимо до тяжкої виправної праці, щоб вилікувати від колишніх хибних уявлень."
 AMR_expand_Magadan: "Розширити порт Маґадана"
 AMR_expand_Magadan_desc: "Ми заклали основу потужної промислової експортної економіки. Перш ніж рухатися далі, потрібно розширити порт Маґадана, щоб у майбутньому він не став вузьким місцем для нашого експорту. Розширивши портові споруди й імпортувавши з Японії достатньо криголамів, аби порт не замерзав навіть узимку, ми перетворимо Маґадан зі звичайного торговельного порту на регіональний торговельний осередок, здатний обслуговувати численні вантажні судна та їхні вантажі. Утім, часу обмаль, адже нам потрібно швидко наростити потужності, щоб виконати норми зростання. То хто ж краще подбає про вчасне завершення проєкту, як не полонені люди змія §qМатковского§!? Під пильним оком чорносорочечників вони гаруватимуть у своєму дорогоцінному порту аж до кінця днів."

 AMR_has_completed_a_mutually_beneficial_arrangement: "Виконано фокус §YВзаємовигідна домовленість§!"

 AMR_road_of_bones_v2: "Ще одна Дорога кісток"
 AMR_road_of_bones_v2_desc: "Шосе М58 сполучається з М56, що веде до Маґадана. Збудоване в минулі десятиліття, воно перебуває в жалюгідному стані, адже §eбольшевики§! спорудили його примусовою працею в'язнів ГУЛАГу. Жорстокість §eНКВД§! забрала стільки російських життів, що остання ділянка шляху дістала назву «Дорога кісток», але попри всі ці жертви вона ледве придатна для їзди, не кажучи вже про перевезення великих обсягів товарів. Щоб доправляти нашу продукцію до Японії та повніше використовувати розширені потужності Маґадана, ми мусимо залучити надлишок робочої сили до поліпшення дорожнього сполучення між ним і промисловістю нашої столиці. Цілком справедливо, щоб люди Ягоди завершили розпочату тут роботу."
 AMR_break_Yakutsk: "Зламати Якутск"
 AMR_break_Yakutsk_desc: "Попри всі наші зусилля повернути якутів до російської держави, вони й далі опираються нашій законній владі над усіма росіянами. §WВождь російського народу§! справедливо занепокоєний цими подіями й побоюється, що в державі, навіть після того, як ми відрубали голову змії, що годувала їх брехнею про демократію, могли лишитися §eбольшевицькі§! й §Oліберальні агітатори§!. Однак, на відміну від §eжидів§!, ми дамо їм нагоду довести свою цінність для російської держави працею, хоч би як неохоче вони приймали нашу простягнуту руку допомоги.\n\nЦе буде найамбітніша операція чорносорочечників досі. Під проводом §WБолотова§! тисячі наших відданих людей, підтримані наділеними повноваженнями російськими патріотами, розгорнуть поліційні операції в колишній республіці. Визнаних винними в большевицькій і ліберальній підривній діяльності переселять до різних куточків нашої держави, де нам потрібні робітники. Після спорудження нового житла їх примусять працювати в наших шахтах. Кількох років чесної праці з видобутку золота, срібла, діямантів, нікелю й залізної руди, потрібних для відбудови нації, має вистачити, щоб їх перевиховати."
 AMR_export_crops: "Експортувати врожай до Сфери співпроцвітання"
 AMR_export_crops_desc: "Сам Амур має одні з найродючіших земель на російському Далекому Сході. Роками ми переважно вирощували продовольчі культури для власних потреб. Однак завдяки розширенню нашої економіки варто переорієнтувати частину виробництва на прибутковіші культури для §fСфери співпроцвітання§!. Ми повернемо Амуру колишній статус найбільшого виробника сої в Росії та експортуватимемо врожай нашим добродіям у Японії, виділивши для цього частину орних земель. Щоб жодна важлива верства населення не постраждала від можливого дефіциту продовольства через таку зміну сільськогосподарських пріоритетів, наш Департамент сільського господарства розробив план переведення кількох бурятських трудових полків як додаткової робочої сили для обробітку цих земель, доки наша система не пристосується до змін."
 AMR_Zeya_dam_P2: "Запустити турбіни Зєї"
 AMR_Zeya_dam_P2_desc: "Завдяки нашим добрим друзям із промислових концернів «Асано» та «Сумітомо» Зєйську греблю, схоже, вдасться в рекордні строки ввести в обмежену експлуатацію шляхом імпорту й установлення високоякісних японських складників, яких нині не здатна виробляти жодна російська промисловість. Після запуску станції ми матимемо не лише вражаюче виробництво електроенергії, спроможне живити нашу промисловість і покласти край необхідності нормування енергії для цивільних, а й зможемо продавати надлишки електроенергії безпосередньо японським підприємствам у Маньчжурії, ще більше збільшуючи наші прибутки."
 AMR_japanese_experts: "Японські фахівці до Маґадана"
 AMR_japanese_experts_desc: "Завдяки невпинному зміцненню зв'язків із нашими добрими друзями в Японії тепер ми маємо змогу запросити японських інженерів та управлінців, щоб підвищити економічну продуктивність Маґадана. Повноцінний торговельний порт, доведений до японських стандартів, дасть нам змогу значно збільшити обсяг експорту до Японії. Після повного оновлення порту ми нарешті зможемо оголосити колишніх прихильників Матковского в маґаданських трудових загонах спокутуваними завдяки їхній праці на благо нашої нації. Як винагороду за заслужене право повернутися до цивільного життя вони отримають привілей служити робітниками під японським наглядом у порту Маґадана до кінця своїх продуктивних років."

 AMR_ruthless_industrialization: "Безжальна індустріялізація прикордоння"
 AMR_ruthless_industrialization_desc: "Від скромних початків ми дісталися завершального етапу величного плану §Wнашого Вождя Константіна Владіміровіча Родзаєвского§! з відродження російської економіки й піднесення національного духу труду. Він передбачає швидку індустріялізацію наших прикордонних міст зі §fСферою співпроцвітання§!, щоб якнайбільше наростити експорт металів, промислових складників та інших товарів до §fСфери§!. Перемога вже близько, і наші горді трудові частини готові виконати це завдання. Звісно, чорносорочечники також готові стежити, щоб у процесі їхній бойовий дух не занепав."
 AMR_manchurian_pipeline: "Маньчжурський трубопровід"
 AMR_manchurian_pipeline_desc: "§fСфера§! жадає енергії, і ми її забезпечимо. Залучивши й узгодивши роботу решти наших трудових батальйонів на всій протяжності трубопроводу, ми безпосередньо сполучимо газові родовища довкола Іркутска з маньчжурською енергетичною мережею, щоб Японія могла втамувати свою енергетичну спрагу безперервним потоком газу для живлення її промисловости. Звісно, цей об'єкт стратегічної інфраструктури принесе нам вельми солідне вливання прибутків."
 AMR_fujitsu_western_plants: "Сходинка в майбутнє"
 AMR_fujitsu_western_plants_desc: "§mЗаводи «Фуджіцу»§! постійно потребують складників, і ми готові їх постачати. Завдяки збільшенню промислових потужностей ми зможемо перетворити кілька великих заводських комплексів на заході на спеціялізовані підприємства з виробництва ключових складників для японської електронної промисловости. В обмін на солідне поповнення державних фінансів це, завдяки провідному світовому досвіду §m«Фуджіцу»§! в сучасних обчислювальних технологіях, стане трампліном для всіх майбутніх спроб модернізувати власну електронну промисловість."
 AMR_nissan_west: "Важка промисловість для сильнішої Росії"
 AMR_nissan_west_desc: "§m«Ніссан»§!, імовірно, є найуспішнішим автомобільним концерном у світі. Тому дозвіл перетворити частину нашої цивільної промисловости на окремий сектор із постачання складників для японської експортної економіки, а не лише сировини для них, свідчить про наш надзвичайний поступ. Ставши ключовим постачальником складників для японського автомобілебудування, ми завдяки цьому партнерству також зможемо поліпшити власну промисловість важких транспортних засобів."
 AMR_sphere_training_ground: "Навчальний полігон Сфери"
 AMR_sphere_training_ground_desc: "Японія визнає нашу цінність як союзника й важливість нашої перемоги у війні проти західних ворогів. З огляду на це ми під виглядом спільної програми військової підготовки §fСфери співпроцвітання§! започаткуємо нову програму, за якою певну кількість новобранців із малих союзних держав §fСфери§! переводитимуть до Амура для проходження військової служби в нашій армії. Зрештою, це буде не вперше, коли Індійський легіон битиметься пліч-о-пліч із непохитними фашистськими солдатами за визволення окупованих жидами земель."
 AMR_oil_for_food_2: "Більше нафти за більшу допомогу"
 AMR_oil_for_food_2_desc: "В обмін на значну частку паливних ресурсів, які можна видобути на Далекому Сході, ми зможемо збільшити обсяг отримуваної допомоги. Це полегшить частину тягаря справжніх російських громадян нашої держави й дасть нам змогу ще більше зосередитися на програмі швидкої індустріялізації."
 AMR_expand_Magadan_2: "Всеросійський контейнерний порт Маґадана"
 AMR_expand_Magadan_2_desc: "Оскільки наші солдати визволяють дедалі більше російських територій, а під нашим контролем опиняється дедалі більший промисловий потенціял, нам доведеться востаннє розширити §iпорт Маґадана§! - наше вікно в зовнішній світ, - щоб задовольнити невпинно більший попит наших братів і сестер у §fСфері співпроцвітання§!. Незабаром Маґадан стане відомий як один із великих контейнерних портів Азії, могутній пам'ятник російській старанності в труді й торгівлі. Наша свастика гордо майорітиме, являючи нашу могутність кожному кораблю, що наближатиметься до священних російських земель."

 AMR_smash_Tomsk: "Розгромити жидівську державу Томска"
 AMR_smash_Tomsk_desc: "Томск - воістину огидне кубло самопроголошених §eжидівських большевиків§!, що гноять нашу націю зсередини, і §Oмасонських інтелектуалів§!, які отруюють уми російського народу. Томск - їхня гнила столиця в Сибіру, пам'ятник усьому мерзенному. З так званих салонів колись безупинно вивергалася їхня дегенеративна гидота на маси. Настав час раз і назавжди викорінити цю розумову та культурну пошесть.\n\nВ операції, порівняно з якою наше поводження з якутами здаватиметься затриманням кількох дрібних злочинців, чорносорочечники розгорнуть усю свою силу, щоб їх розчавити. Усіх, кого зіпсувала зараза салонів, заарештують і відправлять до трудових таборів. По всьому регіону ми спорудимо нові в'язниці, де ці злочинці працюватимуть, доки не сплатять боргу перед російськими народами. Найгірших і найрозбещеніших винуватців, тих, хто завдав нашій нації найбільшої шкоди, вивезуть до старих таборів Норильського ГУЛАГу, щоб вони гнили в установах, які §eжиди Нечестивого Союзу§! спочатку збудували для російських патріотів. Вони заслужать привілей сплатити наші останні борги Японії за її щедру допомогу, працюючи в нікелевих шахтах, доки ті не виснажаться. §WЗа Бога, Націю і Труд!§!"
 AMR_erase_communal_legacy: "Стерти спадщину комун"
 AMR_erase_communal_legacy_desc: "Підступний §eжид§! і грубіян, спокушений його брехнею, - два боки однієї медалі. Схід Красноярска й північні халупи Монголії донедавна були домівкою для одних із наймерзенніших подоб чоловіків, які будь-коли ходили серед чесних росіян. Старі анархістські комуни й бастіони невдалого воєнного комунізму були випробувальними майданчиками для найруйнівніших соціяльних експериментів, що будь-коли відбувалися на нашій любій Батьківщині. Донині вплив цих огидних ідеологій не зник і продовжує розкладати серце Сибіру.\n\nТепер, коли ми визволили ці території, мусимо якнайшвидше втрутитися й виправити становище. Чорносорочечники заполонять регіон і загасять останні подихи цієї ідеологічної зарази. Буде створено нові трудові табори, а найгірших винуватців - тих, хто справді найбільше зневажає все добре й упорядковане, - відправлять до Норильска, де за ними пильно наглядатимуть чорносорочечники й Кемпейтай."
 AMR_novosib_mitsubishi: "Частка «Міцубісі» в Новосибірску"
 AMR_novosib_mitsubishi_desc: "Новосибірск, одне з найбільших міст Росії, - складний випадок. Корпоративна держава з економікою, якою керують олігархи. Хоч чимало її найгірших рис нагадують ліберальні плутократії, місто ще можна врятувати. Корпорації Сфери на чолі з §m«Міцубісі»§! й різноманітними кейрецу ввійдуть сюди зі своїми грошима, ресурсами та підтримкою японської держави, щоб заповнити порожнечу, яку лишили по собі старі корпоративні органи, що панували над Новосибірском. Це має забезпечити плавне повернення міста до нормальности й дати йому змогу стати продуктивною та заможною частиною нової російської нації. Додатковою перевагою роботи в Новосибірску одних із найпередовіших авіябудівних підприємств світу буде можливість використати їхній досвід як трамплін для майбутніх планів модернізації авіяції."
 AMR_sib_class_collab: "Сибірська класова співпраця"
 AMR_sib_class_collab_desc: "Колись над Кемеровом як власною занепалою вотчиною панував божевільний король. Попри всю зіпсутість розуму, тіла й душі, Ніколай Крилов у своїй основі втілював чимало ідеалів російського фашизму, але не досяг мети через §eжидо-большевицькі впливи§!, яких зазнав. Ідея традиційного російського голови держави, що співпрацює з класами й водночас зберігає те, що робить націю сильною, не надто відрізняється від партійної програми РФП. Утім, йому, очевидно, не вдалося втілити її через руйнівний алкоголізм і значно тяжчий випадок §Oмасонських марень§!.\n\nХай там як, у Кемерові й Красноярску досі лишаються рештки підтримки його режиму, тому нам доведеться зробити все можливе, щоб забезпечити плавний перехід цих країв до нової російської держави. Ставлячись до них м'якше, ми відновимо деякі старі профспілкові структури й доручимо міністерству пропаганди переосмислити спадщину божевільного короля так, щоб вона краще відповідала нашій партійній програмі, бодай заради безперервної роботи заводів. Наше Міністерство труду також запропонувало надати його доньці Лідії переважно символічну посаду, щоб допомогти створити структуру класової співпраці, якщо тільки вона не бажає побачити, як батькову спадщину знищать дощенту, а його нащадки гнитимуть у вигнанні чи полоні. Утім, наразі цих заходів буде досить."
 AMR_finish_Zeya: "Завершити Зєйську греблю"
 AMR_finish_Zeya_desc: "Через роки після початку проєкту Зєйська гребля близька до завершення. Завдяки цьому величезному починанню ми тепер володіємо двома великими гідроелектростанціями Далекого Сходу. Деякі іноземні спостерігачі можуть ставити під сумнів таку надзвичайну увагу до порівняно невеликого міста, але для російського народу символічність досягнення Вождя незаперечна. Ба більше, сама гребля уособлює наше піднесення: ми почали зі скромних витоків, щоб сягнути величі. Коли греблю завершать, вона живитиме нашу велику промисловість і дасть змогу значно наростити виробничі потужності. Довгі холодні дні й ночі нормування енергії та праці при свічках тепер далеко позаду."

 AMR_oil_for_food_dynamic_modifier: "Нафта в обмін на продовольство"
 AMR_oil_for_food_dynamic_modifier_desc: "Через здебільшого непридатні для землеробства умови на наших основних територіях ми попросили Сферу постачати нам продовольство, щоб компенсувати будь-який дефіцит харчів, спричинений нашою зосередженістю на важкій промисловості та експортних культурах."
 AMR_Sphere_training_ground: "Навчальний полігон Сфери"
 AMR_Sphere_training_ground_desc: "Оскільки Японія визнає нашу важливість для Сфери, ми регулярно отримуватимемо призовників з усієї Сфери, щоб поповнювати лави наших частин."
 AMR_labor_unto_redemption_dynamic_modifier: "Спокута трудом"
 AMR_labor_unto_redemption_dynamic_modifier_desc: "Щоб перемогти в нашій боротьбі й об'єднати російську націю під свастикою, ми всі мусимо згуртуватися й працювати заради спільної мети - порятунку Матінки-Росії. Ті, хто зрештою відповідальний за жалюгідний стан Росії, нестимуть особливо тяжкий тягар у відбудові Батьківщини. Під пильним наглядом чорносорочечників цих украй аморальних ворогів усіх росіян примусово зараховують до трудових батальйонів, які дадуть їм змогу заслужити квиток назад до цивільного життя, відбудовуючи зруйноване їхніми господарями. Тих небагатьох, хто дійде до кінця, можна буде вважати спокутуваними своїм трудом в очах Бога й Нації."
 
 AMR_oil_for_food_tt: "Це §Gполіпшить§! наші показники бідности й темпи зростання §Rза рахунок§! пального!"
 AMR_rodz_worsen_pop_growth: "§jУкрай аморальних ворогів Росії примусово зараховують до трудових батальйонів під суворим наглядом чорносорочечників.§!"
 AMR_yakutsk_relocation: "§YЯкутів розпорошать і переселять до різних областей, щоб вони служили нашою промисловою худобою.§!"
 AMR_tomsk_reorganization: "§YКорумповані жидівські установи буде знищено, а їхніх керівників направлено до виправних закладів. Крім того, нагромаджені ними під землею багатства нарешті буде викопано.§!"
 AMR_rodz_improve_income: "§GЦе збільшить наші прибутки.§!"

AMR.smuta.1.t: "Порятунок Росії"
AMR.smuta.1.desc: "У мерехтінні свічок Родзаєвскій вдивлявся в мапу Росії на стіні. Недбало зафарбований світло-коричневим, перед ним лежав маленький клаптик Росії. Кутики його вуст піднялися, бо він знав: контрольована ним територія була чистою.\n\nЗемля, де тепер не лишилося нікого, хто посмів би кинути йому виклик, жодних зрадників, здатних підірвати його волю й волю партії, очищена від дегенератів, що могли б повалити його державу й розбестити душу російського народу.\n\nАле цього було замало.\n\nСерце Родзаєвского впало, коли він поглянув далі й побачив, як мало Святої Росії звільнено від дегенерації: довкола стояли псевдокомуністичні кошерні фашисти Маґадана й безсилі пережитки минулого, що керували Чітою. Душу Родзаєвского охопив якийсь жах. Треба було зробити так багато, а проти нього стояло ще більше.\n\nВін інстинктивно простягнув руку вбік, сподіваючись ухопити пляшку горілки. Та натомість намацав теплу й пухнасту кішку, яка вмостилася просто перед пляшкою. Мура муркотіла, поки Родзаєвскій чухав їй живіт, а його тривоги поволі відступали, коли він оцінював становище.\n\nРодзаєвскій знову повернувся до мапи. Так, роботи було багато, але за ним стояла сильна партія, готова втілити його видіння за будь-яку ціну, хоч би довелося платити кров'ю. Росію буде врятовано, у цьому не було сумніву, - і саме його рукою."
AMR.smuta.1.a: "І Вождь стане спасінням Росії."

AMR.smuta.2.t: "Дім навіки"
AMR.smuta.2.desc: "Чути було лише кроки та брязкіт кайданів, коли чотирьох чоловіків вели вулицями на показ. Клімєнт ішов першим - його витягли з дому лише кілька хвилин тому, - і відчував, як погляди перехожих пропікають йому шкіру. Натовп стояв мертво тихо, якщо не рахувати одного чоловіка, який сипав лайкою й кричав їм: «Зрадники!»\n\nКлімєнт навіть не знав, що накоїв. Так, за зачиненими дверима він казав про режим неприємні речі, але обережно й лише тим, кому довіряв, - людям, яких вважав друзями. Клімєнт думав, хто ж на нього доніс, якщо, звісно, партія не просто кидала дротики в дошку, щоб виконати якусь довільну квоту.\n\nЙого вели, наче сліпу вівцю чи, точніше, ягня на заклання, і Клімєнт гадки не мав, яка доля на нього чекає. Смерть? На шибениці чи від кулі? Якщо така його доля, він сподівався на друге. Чи буде суд? Звісно, ні. Вождь не мав часу дозволяти тим, кого вже вважав винними, затримувати правосуддя.\n\nПісля короткої поїздки потягом картина для Клімєнта прояснилася. Попереду стояла велика арка з написом «Бог, Нація, Труд», затиснута між огорожею, яку поспіхом обмотали колючим дротом. За парканом були сотні чоловіків, багато з яких перетворилися на самі шкіру й кістки та, здавалося, ледве тримали молоти, якими били каміння.\n\nЧоловіків передали групі вартових. «Ласкаво просимо додому!» - весело вигукнув один із них, а решта захихотіла. Реальність нарешті дійшла до Клімєнта, і він зрозумів, що більше ніколи не побачить родини."
AMR.smuta.2.a: "Їхні долі запечатано."

AMR.smuta.3.t: "Твоя участь у порятунку Росії"
AMR.smuta.3.desc: "Вадім не був особливо примітним чоловіком. Він робив те, чого вимагала від нього держава, але не виявляв надзвичайної відданости. Чи то стара Російська імперія, чи Совєцький Союз, чи ця нова дивна державка - він звик пристосовуватися до того, що його оточувало. Він майже не зважав на піднесення Родзаєвского й продовжував жити своїм життям: працював, часто ходив до церкви та виховував дітей.\n\nОднак останнім часом він помітив виразну зміну атмосфери в Зєї. Хоч раніше тут теж було доволі галасливо, тепер здавалося, що Фашистська партія заполонила суспільне життя в зовсім новий і очевидний спосіб.\n\nЛише днями його син повернувся зі школи, розсипаючись у похвалах Вождю й захоплено переповідаючи Вадімові історії про його завоювання: наприклад, як він особисто повів довгий похід із Харбіна, щоб визволити Зєю від розпусти й тиранії уряду Ягоди. Хлопчик сипав словами, яких, напевно, навіть не розумів, але Вадім мимоволі відчував певну гордість від того, що син так захоплюється справами нації.\n\nСаме цей спогад виринув у його думках, коли одного недільного дня він виходив із церкви й зустрів одного з чорносорочечників Фашистської партії - охайного, добре доглянутого й красномовного чоловіка, який після короткої розмови про службу запропонував Вадімові маленьку книжку.\n\nВадім відчув, що мусить прийняти її - зрештою, чоловік закликав його «виконати свій обов'язок задля спасіння Росії!» Вадімові здавалося, що той щирий, адже він відвідав із ним службу. Він уважав, що людям із побожними цінностями можна довіряти. Повернувшись додому, Вадім сів читати книжку під назвою «За Бога й Росію».\n\nНемає нічого поганого в тому, щоб більше дізнатися про начальника, подумав Вадім. Він розгорнув книжку й заглибився в сторінки, знаходячи в них чимало поживи для роздумів."
AMR.smuta.3.a: "«А знаєш, він каже слушні речі!»"

AMR.smuta.4.t: "Час вийшов"
AMR.smuta.4.desc: "«Лайно!» - вигукнула Татьяна, квапливо намагаючись спинити молоко, що розливалося по стільниці. Вона ніяк не могла перестати тремтіти. Її погляд постійно кидався то до вікна, то назад, до дещо нерівних мостин, під якими вона ховала найдорожчі речі, що не відповідали ідеології.\n\nЇй треба було протриматися лише кілька днів і нашкрябати ще кілька рублів. Тоді її переправлять через кордон до Маньчжоу-ґо, і вона більше ніколи не боятиметься РФП. Думка, що потрібно ще кілька днів не висовуватися, трохи заспокоювала Татьяну. Сівши їсти несмачне місиво, яке вона називала «кашею», вона намагалася дихати повільно. Нарешті настала хвилина спокою.\n\nЗвуки дерева, що розліталося на друзки, грубо повернули Татьяну до дійсности: шестеро чорносорочечників увірвалися до її дому. Вона спробувала вилізти крізь вікно, але її схопили за щиколотку, перш ніж вона встигла втекти. «Вставай, жидівко!» - кричали чоловіки, ставлячи її на ноги й тягнучи вулицею напоказ. «Ви, довбані шпигуни, гадаєте, вам усе зійде з рук», - пробурмотів один із них.\n\nПодії останніх тижнів промайнули в думках Татьяни, поки вона намагалася збагнути, як вони дізналися про її походження. Фашисти знайшли сховок державних записів? Хтось підслухав її розмови? А тоді вона зрозуміла, що хтось із друзів майже напевно на неї доніс.\n\nТатьяна не знала, чи почуватися зрадженою. Зрештою, догоджати чорносорочечникам було питанням виживання - хіба вона сама не вчинила б так само, якби це врятувало їй шкуру? Розмірковувати було марно. Сльози покотилися її обличчям, і вона зрозуміла, що може вже ніколи не побачити зовнішнього світу."
AMR.smuta.4.a: "Довіра гине, а недовіра квітне."

AMR.smuta.5.t: "Сходження Росії"
AMR.smuta.5.desc: "Груди Родзаєвского розпирала гордість, коли він дивився на колони солдатів перед собою, нерухомі, наче статуї, попри крижаний вітер. Вони ловили кожне його слово, без нарікань чекали наказів, і це було чудово.\n\n«Росіяни! Ми переживаємо нову Смуту, спричинену жидо-большевицькою загрозою, що досі чигає серед нас, - проголосив Родзаєвскій. - Вони й далі розкладають душу нашої нації та її народу. Німецька окупація серця країни стала випробуванням, покликаним відсіяти найслабших, які обтяжують нас, і ми вийдемо з нього сильнішою нацією».\n\nВін підняв палець, і його голос рознісся над полями. «Безбожні комуністи, ліберали та жиди більше не підриватимуть нас. Лише повна відданість Богові, нації та вашому Вождю визволить Росію з прірви дегенерації! Ви, наші хоробрі солдати, станете авангардом, що поширить ці цінності. Століттями вас пам'ятатимуть як героїв! Покладімо край цій Смуті - сьогодні ми рушаємо за Батьківщину!»\n\n«Ура-а-а-а!» - закричали солдати, й ревіння ще кілька секунд лунало відлунням, поки вони салютували Родзаєвскому. Він купався в цьому звуці, переповнений гордістю за те, що збудував, здійснив і ще здійснить. Без нього ці хулігани були б безформними й безцільними. Він дав їм мету, яка приведе Росію до величі під проводом його й лише його."
AMR.smuta.5.a: "Якби ж він знав, що вони кажуть за його спиною."

AMR.smuta.6.t: "За Бога, за Росію, за вас"
AMR.smuta.6.desc: "Погляд Родзаєвского бігав натовпом у пошуках чогось незвичайного. Поки ніщо не викликало підозр - чорносорочечники довкола нього й по периметру мітингу про це подбали. Натовп дивився на нього із захватом і гордістю. Звісно, його добирали так, щоб тут були лише найвідданіші члени Фашистської партії. Однак Родзаєвскій відчував велике задоволення від відданости, здавалося б, звичайних людей йому самому та справі фашизму.\n\nРодзаєвскій постарався привести себе до ладу перед цією появою: напередодні ввечері не надто багато пив і поголився достатньо, щоб не виглядати геть неохайним. Принаймні перед камерами. Він особисто потиснув руки кільком членам партії, нагородив їх «Громадянськими відзнаками» за доноси на інакодумців і вербування нових членів, а також оголосив про різні підвищення.\n\nВін став за трибуну й продовжив промову, особисто дякуючи всім членам Фашистської партії за службу й намагаючись дотримати рівноваги між прославлянням себе та їх. Він сказав, що вони - воїни, які поведуть Росію в майбутнє під проводом його мудрости. Що разом вони принесуть кожному справжньому росіянинові заслужений добробут.\n\n«Ось за що ми боремося! За Бога! За Націю! За Труд! І за всіх вас, хто сьогодні тут!» Натовп вибухнув оплесками, і на обличчі Родзаєвского з'явилася усмішка. Його слова лунали по Сибіру з тих небагатьох телевізорів, які ловили сигнал, і з радіоприймачів по всьому Далекому Сходу.\n\nА на землях поза Амуром ті, кому вдалося почути промову, зовсім інакше відреагували на юрби, що вітали Вождя. Утім, їхня реакція нічого не важила. Він чув лише овації та людей, які вигукували його ім'я."
AMR.smuta.6.a: "Гадаю, все пройшло досить добре!"

AMR.smuta.7.t: "Найвеличніша зі змов"
AMR.smuta.7.desc: "Раїса дивилася, як тато вмикає телевізор: крихітне чорно-біле зображення збільшувала кругла лінза. Екран ожив мерехтінням, зловісне світло осяяло їхню квартиру й кинуло на стіну довгі тіні. «- і ви присягаєтеся під страхом смерти, що все сказане вами - правда?» - запитав добре вбраний чоловік в окулярах, що стояв за трибуною. Перед ним на стільці сидів інший чоловік. Попри зернисте зображення, Раїса бачила біль і смуток, викарбувані на його обличчі.\n\n«Присягаюся», - відповів чоловік, не підводячи очей від підлоги. Він згорбився, як тато після робочого дня й п'яної ночі. «Мене звати Ісак Бродскій, і я учасник міжнародної жидівської змови зі знищення Росії та християнського світу». Він говорив нерозбірливо, приголосні зливалися між собою. «Я мав проникнути до Амура як учитель дітей ґоїв і навчати їх атеїзму та лібералізму. Я мав допомогти своїм жидівським братам створити лихварську мережу, щоб знецінити валюту Амура й поневолити його всемогутнім шекелем». В'язень зітхнув - уривчасто й тремтливо. «Я мав убивати всіх дітей ґоїв, які не навернуться до атеїзму, та кожного, хто розкриє мою справжню природу». Опустивши голову й геть утративши непокору, в'язень повільно кивнув. «Я вбив християнську дівчинку Асю Смірнову й використав її кров, щоб приготувати мацу для своїх сіоністських братів».\n\n«Я почув досить, - сказав слідчий в окулярах. - В ім'я Бога й Вождя засуджую вас до смерти. Хай Бог змилується над вашою гнилою душею».\n\n«Раїсо, - почав тато з похмурим обличчям, - ми живемо в небезпечному світі. Є люди, які хочуть тобі зашкодити. Якби могли, вони зробили б тебе своєю рабинею, а якби не могли - убили б. Вождь робить світ безпечнішим, і одного дня жиди більше не зможуть нам загрожувати». Раїса вмостилася в батькових обіймах під суворим поглядом портрета Вождя. Вона почувалася в безпеці."
AMR.smuta.7.a: "Захищаючись від жида, я борюся за Господнє діло."

AMR.smuta.8.t: "Праця звільняє"
AMR.smuta.8.desc: "Тарасов ішов уздовж шеренги обірваних чоловіків, і на його обличчі застигла неприхована зневага. Він не хотів навіть зачитувати надісланих йому наказів, не кажучи вже про їх виконання. Цей непотріб годився лише для праці, але наказ є наказ.\n\nКоли холодний вітер шмагав зібраних чоловіків, кусаючи оголене тіло, Тарасов почав: «Слухайте сюди! Вождь постановив таке: кожного в'язня, який протягом року постійно виконуватиме свою норму, буде звільнено як вільну людину, бо його борг перед суспільством буде сплачено».\n\nНатовпом прокотився схвильований гомін, але Тарасов одним помахом руки змусив їх замовкнути. Що ці виродки робитимуть зі свободою, ліниво подумав він. Напевно, знову тероризуватимуть вулиці Амура, аж поки не повернуться під його опіку. Та він мусив знайти бодай якесь запевнення, що Вождь урахував такі побоювання.\n\n«Працюйте завзято, і, можливо, колись ви знову побачите світ за дротом, - закінчив він. - Підведете Вождя - помрете тут. Усе просто, покидьки. Розійтися й назад до роботи». Поки охоронці гнали в'язнів до робочих місць, Тарасов повернувся до кабінету й зачинив за собою двері.\n\nЯке марнотратство, подумав він. Йому завжди бракувало робітників, а рабська праця досі давала потрібну силу. Глибоко замислившись, Тарасов зупинився, бо йому дещо спало на думку. Указ був цілком зрозумілий, але це досі був його табір.\n\nВін сів за друкарську машинку й вистукав чергове зі своїх украй непопулярних трудових розпоряджень. Загальна норма лишиться такою самою, але її розподілять так, щоб кожному рабові дісталося більше роботи. Задоволений, він підготував записку до розсилання. Вождь міг видати свій указ, але це досі був його табір."
AMR.smuta.8.a: "Морква свободи й батіг необхідности."

AMR.smuta.9.t: "Один із тисячі"
AMR.smuta.9.desc: "Мітя слухав із недовірою, як начальник табору з очевидними ваганням і зневагою зачитував проголошення Вождя. «Працюйте завзято, і, можливо, колись ви знову побачите світ за дротом, - закінчив він. - Підведете Вождя - помрете тут. Усе просто, покидьки. Назад до роботи й розійтися».\n\nВідходячи разом із рештою в'язнів, Мітя ледве міг повірити в почуте. Коли поплічники Родзаєвского заарештували його за продемократичні погляди, він і гадки не мав, що колись знову зможе побачити світ за дротом.\n\nТепер, у нехарактерному нападі милосердя, Вождь пропонував Міті свободу - або принаймні шлях до неї. Звісно, Мітя ненавидів цього чоловіка та його нацистське кодло, але з нагоди здобути свободу не можна було глузувати, хто б її не пропонував.\n\nЗамахуючись кайлом на непіддатливий камінь, Мітя працював як одержимий. Зосереджений на меті демократичний агітатор перетворився на машину. Замах, удар, підйом. Значення мали лише виконання норми й обіцянка життя назовні.\n\nНаприкінці дня Мітя провалився в сон, сповнений образів відкритих полів і теплого вітерцю. Не мало значення, що обіцяну свободу насправді здобудуть лише одиниці: він стане одним із тих, хто її заслужить.\n\nЩодня прибували нові раби, яких витягували з ліжок або хапали просто на вулиці. Табір розростався, і Мітя думав, скільки людей тут помре. У душі він пообіцяв собі, що не буде серед них."
AMR.smuta.9.a: "Праця звільнить тебе."

AMR.smuta.10.t: "Цифри"
AMR.smuta.10.desc: "«...і на цьому наша екскурсія добігає кінця». Начальник табору поправив кашкета, насунувши його нижче, і ледь уклонився. «Сподіваюся, усе відповідає вашим вимогам».\n\nРодзаєвскій трохи поміркував. Він сподівався, що цей день буде цілком звичайним, але побачене сьогодні виявилося доволі визначним. Вони - міністри й він сам - перебували в одному з найбільших трудових таборів міста, де сотні людей працювали над виготовленням рукавиць для армії.\n\nСаме тієї миті він тримав у руці рукавицю з найновішої партії. Вона здавалася міцною й надійною: він ніколи не здогадався б, що її виготовили в таборі.\n\n«Ви добре тут попрацювали, - сказав Вождь. - Ваш табір ефективний, бо ви не знаєте милосердя до полонених, як і має бути».\n\nНачальник табору розслабився, але Родзаєвскій іще не закінчив. «Одне важливе питання. Ваші робітники стомлені, виснажені голодом, слабкі. Я бачив їхні обличчя - ця група довго не протягне. Як ви підтримуватимете роботу?»\n\n«Звісно. Запевняю вас, пане, жодних проблем із пошуком нових робітників не буде. Зрештою, ворожих солдатів і шпигунів іще багато».\n\nВождя задовольнила ця відповідь, і він кивнув начальникові табору. «Не шкодуйте їх», - сказав він."
AMR.smuta.10.a: "«Якщо їх треба замордувати працею, щоб постала нова Росія, я залюбки заплачу вдесятеро більшу ціну»."

AMR.smuta.11.t: "На нього дивляться. Його вітають"
AMR.smuta.11.desc: "Із балкона Родзаєвскій дивився на місто Харбін. Колись давно РФП була лише маргінальною організацією в цьому самому місті. Але часи змінилися. Тепер Фашистська партія стала одноосібним володарем російського Далекого Сходу, а Родзаєвскій - Вождем цієї нової націонал-соціялістичної гегемонії. Однак відродження Росії ще не завершилося. На Заході досі лишалися безбожні дегенерати, а возз'єднання нації напевно стане кривавим випробуванням. Та наразі Далекого Сходу було досить.\n\nОбраз самого Вождя, якого колись уважали лише фашистським посміховиськом і сумним нагадуванням про спотворення самої Росії, також поліпшився. Тепер люди бачили в ньому провідника, який веде націю до нової доби. Тисячі чоловіків і жінок стояли під час його промов, уважно слухаючи й вигукуючи привітання. Стіни Маґадана й Чіти вкривали плакати, на яких Родзаєвскій поставав великою людиною, посланою Богом урятувати Росію. Тепер він мав місію, а люди рівнялися на нього. Від самої цієї думки Родзаєвскій усміхнувся.\n\nА тоді він відчув, як щось притулилося до його ноги. Це була його найвідданіша шанувальниця. Узявши кішку на руки, він погладив Муру по голові, й вона тихенько замуркотіла. Розвеселений допитливою твариною, він заніс її всередину. Вождь уже почав планувати своє славетне повернення земель, але наразі Родзаєвскій був задоволений Далеким Сходом у своєму залізному кулаці."
AMR.smuta.11.a: "Це більше не фарс."
