 ### Starting tree ###
 AMR_the_true_heir_of_harbin: "Справжній спадкоємець Харбіна"
 AMR_the_true_heir_of_harbin_desc: "Доля була щедрою до багатостраждального російського народу, пославши Константіна Владіміровіча Родзаєвского та Россійскую Фашистскую Партію врятувати його від десятиліть жидо-большевицької різанини. Іскра справедливого гніву молодих патріотичних вигнанців із Харбіна стала полум'ям, що мало охопити російський Далекий Схід, принести волю пригнобленим росіянам і кару слугам совєцької тиранії. Рішучість фашистських героїв, їхні жертви й подвиги в ім'я Росії та Бога - справжнє свідчення законности РФП і любого Вождя як авангарду російської антикомуністичної боротьби.\n\nХоч зрада семеновської і матковської клік завадила нашим зусиллям, наша воля ще ніколи не була такою міцною. Справжня мета - цілковите визволення Святої Росії під фашистським знаменом - лише почала втілюватися. Вона або стане вершиною російської історії, або завершиться повним поневоленням жидівськими господарями."

 AMR_contact_the_japanese: "Зв'язатися з японцями"
 AMR_contact_the_japanese_desc: "У найтемніші роки комуністичної тиранії сумлінні й патріотичні харбінські вигнанці не могли бажати кращого союзника за величну імперію Ніппон. Тисячоліттями не знаючи жидівського впливу, вона стала провідною силою Вільної Азії, відкинула цінності торговельної семітської цивілізації та плекала честь і традицію. Моральні чесноти японців - справжня протилежність жидам.\n\nЯпонське керівництво бачило загрозу совєцької імперії й добре розуміло роль РФП в антибольшевицькому поході. Саме Імперія Вранішнього Сонця спрямувала нас на відвоювання Пріамур'я та допомогла зброєю і харчами проти червоних армій. Японія відійшла від російських справ, але ще може допомогти. Вождь за всяку ціну покаже себе гідним союзником Хризантемового трону та доведе бажання підтримувати добрі відносини."


 AMR_the_free_all_russian_army: "Вільна Всеросійська армія"
 AMR_the_free_all_russian_army_desc: "Воякам Россійской Фашистской Партії не бракує завзяття й відваги, але їм бракує вишколу та дисципліни сучасного війська. Наші сили, складені переважно з харбінських вуличних бійців і ополченців, навряд чи рівня найближчим суперникам із найкращими офіцерами білих клік або принаймні американськими найманцями. А що вже казати про большевиків, які муштрують солдатів до нестями й не гребують нелюдськими засобами заради жалюгідних перемог?\n\nЯкщо Росії судилося відродитися - а так і буде - реформа Всеросійської армії має стати першим завданням. Наші військові переймуть досвід японців і старшин Білої армії, новобранців скує воля Партії, а військо стане єдиним організмом, якого не роздиратимуть чвари. Можливо, колись світ із подивом побачить, як маленька купка послідовників стала силою, рівною могутньому Вермахтові..."

 AMR_secure_the_west: "Убезпечити захід"
 AMR_secure_the_west_desc: "Історія любить повторюватися в найдошкульніший спосіб: отаман Ґріґорій Сємьонов із фальшивим царем і підлабузницькими білими офіцерами вперше від завершення Громадянської війни повернувся до Чіти й Забайкалля. Колись він хоробро боровся з червоними за праведну справу, а нині прагне придушити російські націоналістичні зусилля проти комунізму. Уже не взірець офіцерської чести, він і його кліка позбавлені шляхетної мети й хочуть лише збагачуватися коштом маріонеткового царя Міхаїла.\n\nЗемні дні Сємьонова, Шепунова й інших реакціонерів добігають кінця, трон їхнього самозванця розвалюється, та поки вони тримаються, їхнє злиденне князівство лишається головним суперником. Треба пильно стерегти кордон із Чітою від небажаних вторгнень."

 AMR_secure_the_east: "Убезпечити схід"
 AMR_secure_the_east_desc: "Ниций боягуз, жалюгідний зрадник і мерзенна змія Міхаїл Матковскій опинився серед суворих маґаданських пусток, куди втік після невдалої спроби заради власної користи захопити провід антикомуністичного фронту. Відрізаний на мерзлій околиці Далекого Сходу, він виживає лише завдяки жменьці прибічників і постачанню американських лихварів.\n\nТа його позірна скрута не повинна нас обманути. Якщо Матковскій у чомусь і вправний, то в підступах і здатності виживати всупереч усьому. Навіть у безвиході він намагатиметься підточити нас і вдарити в спину в мить слабкости. Лишити кордон без захисту було б нерозумно. Північні укріплення стануть оборонною лінією перед останнім ударом по Відступнику."

 AMR_under_lock_and_key: "Під замком"
 AMR_under_lock_and_key_desc: "Найдивовижніше на підвладній Константіну Родзаєвскому території - глибина суспільного контролю. Від найменшого сибірського села до гамірного Родзаєвска присутність чорносорочечників і РФП відчутна в символіці та людях. Партійні бюрократи й головорізи всюди, а докладні реєстри жителів під Вождевою тінню дають їм змогу вистежити, записати й контролювати майже кожного, зокрема всіх, хто в'їжджає до Амура чи виїжджає з нього.\n\nРФП не лише точно знає, хто є хто на її землях, а й дієво ловить майбутніх перебіжчиків або не допускає підривних агентів. Вождь полюбляє жартувати, що невдовзі триматиме всю Росію «під замком»."

 AMR_the_rodzaevsk_officer_academy: "Родзаєвська військова академія"
 AMR_the_rodzaevsk_officer_academy_desc: "Політично свідомі білі офіцери й антибольшевицькі бійці, обізнані з японським воєнним мистецтвом, дуже допомогли у відвоюванні Амура, але самі вони не можуть надовго лишатися осердям війська. Війна дедалі ширшає, тож нам потрібні власні військові традиції. Щоб забезпечити частини офіцерським корпусом і фахівцями, які засвоїли досвід найвидатніших військових умів доби, мусимо всіма засобами навчитися кувати власні кадри.\n\nРодзаєвська військова академія стане першою воєнною школою нової Росії. Вождь особисто приїде до рідного міста на відкриття, привітає курсантів і проголосить сподівання на нове покоління російських офіцерів, що прославить фашистський меч."

 AMR_a_new_asano_brigade: "Нова Бригада Асано"
 AMR_a_new_asano_brigade_desc: "Особлива сторінка російсько-японської співпраці - історія Бригади Асано, антикомуністичного формування харбінської молоді, що служило разом з Імператорською армією Японії. Створена під опікою шанованих офіцерів Квантунської армії, Бригада добре показала себе проти комуністичних партизанів і стала цінним надбанням одного з найсильніших військ Азії. Їхню звитягу навіть порівнювали із самурайською. Згодом Бригаду розпустили, а чимало її вояків боролися з большевизмом на Далекому Сході й приєдналися до антикомуністичних армій Росії, зокрема нашої.\n\nЗ огляду на відродження большевицької загрози ми можемо попросити верховне командування Імператорської армії Японії створити другу Бригаду Асано. Вона послужить спільній справі Всеросійського уряду та Японської імперії й дасть нам надійну групу ветеранів для майбутніх походів."

 AMR_arms_from_the_sphere: "Зброя зі Сфери"
 AMR_arms_from_the_sphere_desc: "Уперше відкрившись світові під час реставрації Мейдзі в XIX столітті, Японія пройшла довгий шлях до провідної світової наддержави й економічно-промислового велетня, що досяг успіху в кожній мислимій галузі. Всемогутні дзайбацу, титани азійської економіки, виробляють незліченну кількість зброї та набоїв. Більшість не йде відразу Імператорській армії чи іншим силам Сфери, а лежить на складах до кращих часів. Нам це спорядження дуже знадобилося б.\n\nВласне виробництво не покриває нестачі озброєння, тож ми можемо дорого купити японські надлишки зброї й боєприпасів, пообіцявши застосувати їх проти спільних ворогів - прикордонних бандитів і комуністів."

 AMR_rethinking_our_tactics: "Переосмислити тактику"
 AMR_rethinking_our_tactics_desc: "Одна з головних причин, чому РФП не поширила владу на захід під час першого краху Союзу, проста: майже всі наші тактика й стратегія спиралися на застарілі плани, складені ветхими офіцерами російської Білої армії - людські хвилі, безумовна зверхність офіцера, грандіозні плани битв. Про що вони думали?\n\nМи цінуємо службу цих офіцерів, але не їхній конкретний внесок. Родзаєвскому та верховному командуванню час розробити нові стратегічні плани й тактику великих з'єднань, щоб якнайкраще підготуватися до прийдешніх конфліктів і не повторити помилок десятирічної давнини."

 AMR_blackshirt_field_divisions: "Польові дивізії чорносорочечників"
 AMR_blackshirt_field_divisions_desc: "Одне з найцінніших наших надбань - усіма страшені чорносорочечники, найідейніші партійці й осердя воєнізованого крила. Досі ми не використовували їхніх здібностей сповна.\n\nЦі фашистські фанатики, відомі залякуванням, крайньою жорстокістю й безмежною відданістю Родзаєвскому та РФП, займалися переважно цивільними дисидентами й нищили внутрішню опозицію Вождю.\n\nРодзаєвскій має кращий задум: зробити з них підрозділи придушення партизанів і своєрідних політичних комісарів при регулярних частинах, щоб забезпечити згуртованість і вірність партійній лінії серед солдатів та підвладних їм цивільних."

 AMR_armored_cars: "Панцирні автомобілі"
 AMR_armored_cars_desc: "Десятиліття тому війни в Сибіру точилися переважно на панцирних потягах. Із поступом техніки розвивалася й зброя: панцирні потяги поступилися панцирним автомобілям, а ті - вантажівкам для перевезення військ і логістики. Нині як ніколи треба здобути й залучити нову моторизовану техніку і на фронті, і в тилу. Вона підвищить ефективність армії та наблизить її до сучасної боєздатної сили, особливо якщо сформувати окремі рухомі частини. Друзі в Токіо напевно знайдуть зайве спорядження, хай навіть за завищену ціну!\n\n«Стратегічна мобільність - один з основних принципів війни - є природною рисою слов'янської раси. Тож цілком природно, що ми опануємо нову техніку. Вперед!»"

 AMR_a_disciplined_force: "Дисципліноване військо"
 AMR_a_disciplined_force_desc: "«Кругом! Зброю на огляд! Ні, не так, мерзото! Усе має бути точно, наче тобі справді не байдужа твоя служба. Не пильнуватимеш - вечерятимеш у гарнізонній буцегарні!»\n\nНині наші збройні сили - строката суміш призваних селян, розчарованих білих емігрантів і чужоземних найманців. Вони не готові до тривалих конфліктів: дисципліна часто руйнується навіть у боях із партизанами та бандитами. Треба запровадити нові програми вишколу, суворіші покарання й заохочення, щоб війська не ламалися й не тікали за першої ж скрути. Наші солдати мають стати найкращими не лише на Далекому Сході, а й у всій Росії."

 AMR_japanese_advisors: "Японські радники"
 AMR_japanese_advisors_desc: "Не буде перебільшенням сказати, що ціле покоління білих емігрантів в Азії виховали й вишколили японські наставники. Вони надавали військову та організаційну допомогу й зрештою привели нас до перемоги над большевицькими силами на окраїнах Далекого Сходу. Після того як допомогли РФП розпочати возз'єднання Росії, японці полишили нас діяти самостійно, але ми й далі можемо користуватися їхньою підтримкою.\n\nПрохання про японську допомогу не принизить національної гордости: большевицький уряд поневолив і пригнобив усіх фахівців, яких ми могли б залучити. Поглиблюючи зв'язки, запропонуємо радникам із Японії вигідні посади у війську та економіці задля взаємної користи обох країн."

 AMR_basing_rights: "Права на базування"
 AMR_basing_rights_desc: "Ми налагодили сухопутні зв'язки з японцями, але майже не розвивали морських. Попри дипломатичні люб'язності й дари через маньчжурський кордон, японським морякам і торговцям досі ніде причалити до наших берегів. Найближча точка дотику - маленький Чумікан, колишня гавань російсько-американських пароплавів, нині непридатна для сучасних суден і геть не здатна служити портом.\n\nЧумікан - не другий Владивосток і навіть не другий Маґадан, але може стати важливим перехрестям між Японськими островами та рештою Росії. Обладнавши його сучасною портовою технікою й надавши японцям привілеї, ми ще більше розширимо торгівлю з Токіо."

 AMR_lessons_from_the_kenpeitai: "Уроки Кемпейтай"
 AMR_lessons_from_the_kenpeitai_desc: "Кемпейтай, жандармерія Імператорської армії Японії, справляє надзвичайне враження. Це централізована сила проти антияпонських елементів удома й за кордоном, усюдисуща організація, що тримає порядок в Імперії та нав'язує її волю нелояльним підданим. Завдяки невтомній праці Кемпейтай Японії не дошкуляють диверсанти, які саботують накази, чи виродки, що прагнуть споганити шляхетну культуру.\n\nЧорносорочечникам та іншим силам внутрішньої безпеки варто повчитися в японських колег, можливо, навіть у їхніх консультантів. Щоб створити силу, здатну гарантувати стабільність і придушувати жидо-большевицьких підбурювачів щоразу, коли вони висунуть потворні голови, візьмімо Кемпейтай за взірець."

 AMR_onwards_to_liberation: "Уперед, до визволення!"
 AMR_onwards_to_liberation_desc: "Ми зробили все, щоб армія була готова до війни: спершу з Відступником і Фальшивим царем, потім із большевиками на заході. Стратегічне мислення осучаснено, чорносорочечників залучено до фронтових з'єднань, знайдено джерело моторизованої техніки, дисципліну військ докорінно зміцнено.\n\nЦе було нелегко, дещо ще завершується, але вже ясно: строката ватага селян, найманців та ідеологів стала дієвою бойовою силою, готовою визволити всю Росію. Нарешті мрія Родзаєвского набуває обрисів - Росія під твердою владою справжньої РФП і його самого, Вождя на чолі нації. Уперед, до визволення! Для Росії!"

 AMR_god_nation_labor: "Бог, Нація, Труд"
 AMR_god_nation_labor_desc: "«Бог, Нація, Труд!» Цим гаслом Россійская Фашистская Партія заявила про себе, коли далекоглядні білі емігранти заснували її в Харбіні. У цих словах - міць російського фашизму як творчої сили, спрямованої на відродження й удосконалення Всеросійської держави. На цих славетних засадах гідно постане відроджена Росія, вільна від скверни жидівського матеріялізму й людожерної ідеї класової боротьби.\n\nТа мрія про націоналістичну Росію під Божим проводом, згуртовану співпрацею класів, лишиться недосяжною, якщо кожен російський фашист не підпорядкує себе найславетнішій справі й не буде готовий віддати життя за російську націю. Керуючи перетворенням Всеросійської держави, Партія візьме до рук справи духовного й матеріяльного світу та поведе слухняний народ до просвітленого духу фашизму."

 AMR_define_the_enemy: "Визначити ворога"
 AMR_define_the_enemy_desc: "Ми не можемо щиро проголошувати місію сильної та незалежної Росії, не знаючи ворога, який присвятив життя знищенню любої Батьківщини. Навіть відчувши на собі комуністичний батіг, багато співвітчизників легко спокушаються закликами до «терпимости» й вважають антисемітизм варварством, а не виправданою відповіддю на тривалі спроби сіонських старійшин підкорити вільні нації.\n\nЩоб російський народ не збився зі шляху визволення від большевицької тиранії, наш священний обов'язок - викрити справжнього ворога: міжнародну жидівську змову, що простягає щупальця через брехню комунізму й лібералізму - найруйнівніших ідеологій XX століття, які принесли Росії незліченні лиха. Жидівство черпає силу з ілюзій і хитрощів над неосвіченими душами; щойно росіянин навчиться бачити крізь них, їхня сила розсиплеться, мов картковий будинок."

 AMR_our_own_patriarch: "Власний патріярх"
 AMR_our_own_patriarch_desc: "Мало які верстви російського суспільства постраждали від большевицької тиранії так, як православне духовенство. Примусове вигнання, погрози смертю, відбирання майна, силуване зречення віри - чого тільки вони не зазнали за Лєніна й Бухаріна! Навіть після кінця совєцької влади багато хто морально зламаний пережитим жахом і не повертається до традицій, а впадає в апатію чи навіть єресь. За морального й організаційного занепаду Церкви наш обов'язок - відбудувати її для служіння російській нації.\n\nРосійську православну церкву перебудують під наглядом держави й самого Вождя, а духовними справами керуватиме новий патріярх усієї Руси, уособлення симфонії фашистської влади та православної віри."

 AMR_for_holy_russia: "За Святу Росію!"
 AMR_for_holy_russia_desc: "Серед споріднених ідеологій Россійскую Фашистскую Партію вирізняє висока духовність і щира відданість ідеї Третього Риму та православній вірі, що тисячу років єднала Росію й рятувала її в скрутні часи. Хіба могло бути інакше? Прийнявши фашизм, як його уявляли Гітлер і Муссоліні, ми вдихнули в нього російську душу й поєднали з глибоко духовними російськими традиціями.\n\nБольшевики знали силу Православної церкви й усіляко намагалися її знищити, позбавити російський народ віри та змусити поклонятися сатанинським культам Мордехая Маркса й Лєніна - культам морального розкладу й богохульства. Ми цього не стерпимо. Росія знову стане взірцем християнської віри, а сам Бог поведе своїх воїнів проти сил Диявола."

 AMR_rodzaevskys_paranoia: "Параноя Родзаєвского"
 AMR_rodzaevskys_paranoia_desc: "Не таємниця, що Россійская Фашистская Партія, а з нею і Родзаєвскій, пережили незліченні зради так званих «соратників». Це були не лише особисті удари по Вождю: найвідоміші зрадники - Відступник у Маґадані та царисти в Чіті - прямо спричинили невдачі РФП і Родзаєвского, на роки відсунувши визволення Росії з-під комуністичного ярма.\n\nДосить. Після провалу єдиного фронту Вождь засвоїв одне: довіряти не можна нікому. Успіх дають лише особиста праця й здатність самому доводити справу до кінця. Настав час провести облік і вичистити дім. Від найнижчого партійного службовця до найближчого кола Родзаєвского - ніхто не уникне перевірки, а зі зрадниками розправляться якнайсуворіше."

 AMR_a_new_supreme_council: "Новий Вєрховний Совєт"
 AMR_a_new_supreme_council_desc: "Ніхто не стоїть над фашистським законом, і високі члени Вєрховного Совєта Россійской Фашистской Партії - не виняток. Совєт мав представляти найдіяльніших і найвідданіших партійців, але від початку кишів кар'єристами й зрадниками, що дбали лише про власний добробут. Нерозумно думати, ніби вони зникли разом із Матковскім: сліди зради видно в кожній царині державного життя. Дезінформація, корупція й непослух навіть унизу можуть вести до найвищого органу Всеросійського уряду, а ті самі імена раз у раз з'являються в паперах чорносорочечників на столі Родзаєвского.\n\nВождь завжди підозріло дивився на найближчих «соратників», а тепер винесе присуд кожному й визначить міру зради. Дехто справді вірний фашизмові, але значно більше приховує від чорносорочечників нечисте минуле..."

 AMR_eyes_in_every_home: "Очі в кожній оселі"
 AMR_eyes_in_every_home_desc: "Національне очищення не закінчується нагорі - воно має сягнути низів. Для покори населення самим вибірковим репресіям і чисткам замало: треба забезпечити послух і пильність на кожному рівні російського суспільства.\n\nЧорносорочечники продовжать і посилять звичну боротьбу з ворогами нації, але тягар протидії зраді ляже й на патріотичних, свідомих громадян. Сусід стежитиме за сусідом, дітей заохочуватимуть доносити на незгідних батьків, а наші службовці ховатимуться на видноті, готові будь-якої миті викрити антидержавну діяльність.\n\nКожного майбутнього повстанця оточить атмосфера невпинного терору й переслідування; він не зможе ступити кроку без страху відплати."

 AMR_the_heart_of_darkness: "Серце темряви"
 AMR_the_heart_of_darkness_desc: "Ряд за рядом, людина за людиною. Від верхів до низів перевірити треба всіх: чорносорочечників, партійців, військових офіцерів, міністрів. Кожен дістане номер і пройде випробування. Навіть ті, кого Вождь роками називав «другом», не уникнуть перевірки. Партію слід очистити від підривних елементів; і якщо Константіну Родзаєвскому доведеться власноруч пустити кулю в череп кожному останньому зрадникові, клянемося Богом, він це зробить. Лояльність кожного партійця буде перевірено.\n\n«Станьте за Росію! Станьте за свою націю! Погляньте на братів поруч: у кожному може чаїтися зрадник, Юда нашої справи. Що ми робимо з Юдою? Як зрадника приречено на вічний біль у пеклі, так і ми приречемо його на муки за життя. Будьте повсякчас пильні й доведіть вірність Вождю!»"

 AMR_tests_of_loyalty: "Випробування лояльности"
 AMR_tests_of_loyalty_desc: "Задум особисто перевірити лояльність кожного партійного урядовця дуже подобався Родзаєвскому, але через їхню кількість був нездійсненний. Для когось іншого це була б приємна проблема, та Вождя турбували інші речі. Тож він почав особисто складати випробування, яке викриє зрадників і визначить справжніх членів РФП.\n\nЩоб запобігти зраді та зрадницьким думкам, тест стане обов'язковим не лише для новачків, а й для чинних партійців. Його складатимуть усі, крім Вождя, щоб очистити партію від тих, хто може співчувати білим на заході чи Відступникові на сході."

 AMR_work_will_set_you_free: "Праця визволить вас"
 AMR_work_will_set_you_free_desc: "«Праця визволить вас! Спокутуйте гріхи проти нашого народу й нашого Вождя!»\n\nВождя тішить кількість викритих у партії зрадників, але їх так багато, що повісити чи розстріляти всіх просто непрактично. Вірні партійці запропонували наслідувати німців: замість убивати незгідних одразу, переселяти їх до трудових таборів. Там вони не лише пізнають наслідки своїх помилок у виснажливих умовах, а й допоможуть державі здобути остаточну перемогу. Мертве тіло треба закопати, на страту витратити кулю. А якщо зрадника запрацювати до смерти - його праця стане його спадщиною."

 AMR_the_one_true_vozhd: "Єдиний справжній Вождь"
 AMR_the_one_true_vozhd_desc: "«Найгірших повісити, решту запрацювати до смерти», - запропонував заступник Вождя Лєв Охотін. Трудові табори відкрито, найгірших викорінено й повішено - партія нарешті в безпеці. Уцілілі керівники пошепки звуть чистки «кривавою справою», адже з партії усунули не лише справжніх зрадників, а й тих, хто становив особисту загрозу Родзаєвскому. Серед зниклих високопосадовців були лише ті, хто колись відкрито заперечував провідникові РФП, і багато хто не вважає це збігом.\n\nУ будь-якому разі суперників за партійний провід більше немає - принаймні у володіннях Родзаєвского. Є і може бути лише один справжній Вождь: Константін Родзаєвскій."

 AMR_proud_russian_industry: "Горда російська промисловість"
 AMR_proud_russian_industry_desc: "Від самого зародження російський фашистський рух обстоював створення в післябольшевицькій Росії справді національної промисловости - незалежної, самодостатньої, не залежної від міжнародного чи іншого чужоземного капіталу, такої, що передусім служить російській нації та зміцнює й відроджує національну економіку.\n\nФашистські системи за кордоном традиційно спиралися на малий бізнес. Ми не відкидаємо його потреб, але наша доба вимагає особливої уваги до важкої промисловости - головного постачальника війни. З кількох іржавих заводів Амура відродиться російська промисловість, безпосередньо пов'язана з інтересами держави й нації."

 AMR_national_unions: "Національні спілки"
 AMR_national_unions_desc: "Міра державного контролю над профспілками давно була болючою темою для верхівки РФП. Та користь очевидна: вони заохочують робітників, допомагають заводам виконувати норми й зміцнюють нашу підтримку серед нижчих верств.\n\nТреба подбати, щоб солдати промисловости мали захист, але цей захист безпосередньо наглядала адміністрація. Ми заснуємо Національний Комітет Профсоюзного Прізрєнія - Комітет нагляду за профспілками, який відповідатиме безпосередньо перед Родзаєвскім.\n\nБезкарно діятимуть лише спілки, особисто схвалені любим Вождем. Вони тісно співпрацюватимуть із НКПП й державою та стежитимуть за вірністю робітників партійній лінії. Усе інше неприйнятне на шляху до сильної єдиної держави трудівників!"

 AMR_the_corporate_state: "Корпоративна держава"
 AMR_the_corporate_state_desc: "Надзвичайно важливо перебудувати економіку й усе суспільство за принципами корпоративізму - організувати його в сільськогосподарські, трудові, військові та інші групи.\n\nКожна представлятиме власні інтереси, але всі співпрацюватимуть заради Великої Росії! Селяни - серце держави; робітники, що трудяться годинами, - її м'язи й жили; військо, завжди пильне проти комуністів і розкольників, - довгі руки й кам'яні кулаки Росії. Вождь допоможе їй подолати межі традиційної економіки й перетворитися на ефективнішу корпоративну сутність."

 AMR_an_iron_grip: "Залізна хватка"
 AMR_an_iron_grip_desc: "Від Станового хребта на півночі до Амуру на півдні наш Вождь Константін Родзаєвскій утвердив владу на всій землі. Він перекував економіку на корпоративний лад, підкорив військо й очистив партію від незгідних. Тепер Родзаєвскій беззаперечно панує як Вождь Російської держави, готовий поширити владу на Далекий Схід!\n\nКоли становище Вождя зміцнилося, його параноя поволі відступає, а полум'яний і пристрасний ідеолог, який колись сформував РФП за власними ідеалами й привабив тисячі послідовників, знову виходить на світло. Нарешті можна взятися за Відступника на сході та Фальшивого царя на заході. Слава Росії! Слава Вождю!"


 AMR_the_vozhds_speech: "Промова Вождя"
 AMR_the_vozhds_speech_desc: "Вільна Всеросійська армія рушає вперед, внутрішні вороги лишилися позаду, і Всеросійський уряд цілком готовий до прийдешніх походів за возз'єднання. Прикро, що першими на нашому шляху постануть колишні антикомуністичні союзники, але їхня близька ганебна поразка закріпить за нами образ законного носія білої справи й знищить останні осередки білого опору фашизмові.\n\nПоки вірні солдати готують зброю, партійні діячі організовують війну, а російські робітники трудяться на фабриках і мануфактурах, Вождь Родзаєвскій готує столичну промову, щоб визначити наші цілі й надихнути вояків. Цей день відродить антибольшевицький хрестовий похід, ненадовго перерваний зрадниками, і возз'єднає російський далекосхідний антибольшевицький фронт під знаменом свастики."

 ### Expansion tree ###
 AMR_three_decades_of_exile_avenged: "Помста за три десятиліття вигнання"
 AMR_three_decades_of_exile_avenged_desc: "Невдача за невдачею. Приниження за приниженням. Наруга за наругою. Харбін був нашим прихистком, ганьбою і в'язницею. Ми бачили повільний занепад Россійской Фашистской Партії, доки від неї не лишилася сама оболонка. Самі накликали на себе цю долю, терплячи рани й побої, мов побитий пес, що скорився.\n\nДосить.\n\nБільше не терпітимемо приниження. Не прийматимемо наруги. Не вдовольнятимемося недоїдками. Вороги панували задовго - час покласти їм край. Сьогодні російські фашисти встають і кажуть: «Досить». Ми не просто відплатимо за пережите приниження.\n\nМи помстимося."

 AMR_a_godly_russia_made_true: "Втілити побожну Росію"
 AMR_a_godly_russia_made_true_desc: "Надто довго Росія жила без віри. Можливо, приниження Росії та її народу спіткало нас саме тому, що ми відвернулися від Бога й дозволили безбожним большевикам залити наші землі, палити церкви, страчувати священників і карати вірян. Большевики та їхні жидівські союзники майже знищили православну віру - аж доки Вождь не повернув Росію до Бога.\n\nПравослав'я більше не зневажатимуть і не переслідуватимуть. Вождь поширить Боже слово й поверне Церкві належне місце в російському суспільстві. Поганські релігії, безбожні ідеології та жидівський шепіт, що отруювали й далі отруюють російський розум, буде негайно вичищено з цієї землі."

 AMR_a_nationalist_russia_made_manifest: "Втілити націоналістичну Росію"
 AMR_a_nationalist_russia_made_manifest_desc: "Десятиліттями Росія грузла в поразці й розбитій ідентичності, роздерта ворогами. Як така позірно єдина країна могла впасти так швидко?\n\nВона впала, коли до влади прийшли большевики: вони винищували незгодних із червоним терором, розпорошили слабких білих і об'їдалися здобиччю російської землі. Та це були не росіяни, а люди, розбещені чужими цінностями, передусім німецькою ідеологією марксизму.\n\nВождеве бачення - суто російське, закорінене в історії нації та народу, очищене від корупції й пороків царизму та хвороби комунізму. Це Росія, що приймає спадщину, народ і Бога. Росія без вибачень, чиста й сильна."

 AMR_a_laborous_russia_made_strong: "Зміцнити Росію трудом"
 AMR_a_laborous_russia_made_strong_desc: "Самими бажаннями Росію не відродити. Не допоможуть ані чужоземне втручання, ані везіння, ані чужа щедрість: так постає лише слабкий залежний паразит, приречений без підтримки. Сильну Росію створять тільки тяжка праця й жертва її народу.\n\nНа щастя, працьовитих і винахідливих людей у Росії багато. Ми зберемо їх, краще організуємо, навчимо й використаємо на найбільшу користь державі. Гідних уваги винагородимо й піднесемо на належні місця.\n\nРешта трудитиметься, знаходячи втіху в тому, що саме їхня праця зміцнює Батьківщину."

 AMR_external_pathogen_attacking_us: "Зовнішній збудник нападає"
 AMR_external_pathogen_attacking_us_desc: "Мабуть, було надто сміливо сподіватися, що наше піднесення не приверне уваги вічного ворога. Жид хитрий, брехливий і підступний. Його напад був неминучий - тож відповімо тим самим.\n\nПоза кордонами піднімаються вороги - маріонетки жидів-змовників, яких мобілізують, щоб знищити нас у найслабшу мить. Але вони запізнилися, безнадійно запізнилися. Ми знаємо їхні змови, підступи й ігри.\n\nНехай шлють маріонеток. Ми зустрінемо їх у бою й розіб'ємо ці безпорадні знаряддя."

 AMR_silent_killers_from_inside: "Тихі вбивці зсередини"
 AMR_silent_killers_from_inside_desc: "Жид - хитра й підступна істота, що вміє використовувати людську природу, особливо в найуразливішу мить. Вони бачать жалюгідні державки за нашими кордонами й знають, що наш похід неминуче переможе. Тож прагнуть зруйнувати державу зсередини, а якщо армій замало - знайдуть інші засоби.\n\nНація може впасти без єдиного пострілу.\n\nНаша націоналістична революція й фашистське відродження - найбільша загроза жидівській владі, тому вони отруюють їх навіть у спілці з безбожними большевиками. Якщо послабимо пильність, їхні нашіптування й підступи заразять народ. На щастя, ми викрили задум, і національну революцію так легко не розвіяти."

 AMR_liberation_from_misguidance: "Визволити з омани"
 AMR_liberation_from_misguidance_desc: "Пересічні росіяни глибоко не розуміють фашизму. Мало хто здатен назвати навіть основні засади РФП, а дехто наполягає, що правда не має значення, бо ми фашисти. Такі обмежені люди - тягар, але з ним треба впоратися.\n\nНа невігластво відповідають просвітою. Російський народ має пізнати правду про фашизм - наші переконання, цінності, доктрини й статути. У питаннях політики, суспільства та самого життя не лишиться жодної двозначности.\n\nЗнадобиться час, та після достатньої кількости занять і належного заохочення вони навчаться дивитися очима Вождя й приймуть фашизм - як прийме вся Росія."

 AMR_venomous_sights_everywhere: "Отруйні погляди повсюди"
 AMR_venomous_sights_everywhere_desc: "Не можна втрачати пильність ані на мить. Шпигуни вже довкола нас. Більшість служить жидам та їхнім большевицьким маріонеткам. Їхні мережі величезні, зв'язки численні, а довіряти можна одиницям. Треба діяти негайно.\n\nПо-перше, створимо власну мережу контактів - надійних вірних фашистів, які слухатимуть і повідомлятимуть про підозрілу діяльність та зраду. По-друге, заохочуватимемо людей стежити за жидівськими й большевицькими шпигунами.\n\nВорог може пожертвувати кількома своїми, щоб приспати нашу увагу, але маріонетки нас не обдурять. Місію завершимо лише тоді, коли всі мережі буде знищено, а їхні члени доживатимуть останні дні в таборах."

 AMR_poisonous_words_all_around: "Отруйні слова повсюди"
 AMR_poisonous_words_all_around_desc: "Деякі невдячні громадяни відмовляються бачити правду фашизму й необхідність обраного шляху. Одні протестують відкрито: гуртуються та марширують вулицями. Вони називають це мирними діями, та їхні вуста вивергають ідеологічну отруту, що псує вразливі уми. Інші утворюють натовпи, трощать майно чи залякують вірних партійців.\n\nДосить і тихих, і буйних баламутів.\n\nМи спустимо чорносорочечників на всіх, хто насмілиться виступати проти об'єктивної істини фашизму та проводу Вождя або розбещувати народ Росії. Нехай вивергають єресь серед засуджених, служачи Росії в трудових таборах. Деінде ми її більше не почуємо."

 AMR_an_orthodox_soul_a_zealous_body: "Православна душа, завзяте тіло"
 AMR_an_orthodox_soul_a_zealous_body_desc: "Якщо Росія - обрана Богом нація, то РФП - обране тіло, а Вождь - Його улюблений учень. Бог вибрав мудро: хто ще має силу, мудрість і побожність, щоб очолити й об'єднати Росію? Хто, крім Вождя, має благодать, бачення й смирення, щоб привести російський народ до спасіння?\n\nНіхто!\n\nТа Бог не дасть перемоги без праці та жертви. За Бога треба битися. Щоб відродити православну Росію, її треба завоювати. Кріпися, добрий громадянине; слухай слова партії; відкрий очі на Вождеве бачення. Шукай розради в їхніх наказах і втіхи в заявах, бо вони промовляють владою не лише закону, а й самого Бога."

 AMR_those_who_have_helped_us: "Ті, хто нам допоміг"
 AMR_those_who_have_helped_us_desc: "Ми, звісно, не забудемо союзників у перші важкі часи.\n\nЯпонська імперія підтримала нас, коли багато хто - зокрема більшість росіян - відмовився. За це ми будемо в боргу, принаймні деякий час. Колись такі союзники стануть не потрібні, але нині мусимо знову покликати їх і попросити долучитися до нашої справи.\n\nЯпонці, звісно, назвуть ціну: послугу чи обіцянку на майбутнє. Боятися майже нічого. Ціна буде розумною, а важить зрештою наша близька перемога, в якій вони мають власну частку й тому доведуть нас до кінця."

 AMR_past_treason_cannot_be_buried: "Минулу зраду не поховати"
 AMR_past_treason_cannot_be_buried_desc: "Вражає, як низько жидівські агенти й большевицькі спільники повалили горду, славетну й могутню російську націю. Спершу звели Росію до безбожної оболонки Совєцького Союзу, а тоді, не вдовольнившись приниженням, розбили на друзки.\n\nМи не забудемо. Не пробачимо. Але навчимося.\n\nНенависть не повинна засліпити нас перед їхніми задумами. Вони раз розвалили Росію й можуть повторити це, якщо ми заплющимо очі. Ми вивчатимемо цих агентів, їхні методи й тактику, обернемо їхні сильні сторони проти них і зробимо Росію несприйнятливою до зарази жидів і большевиків."

 AMR_great_futures_await_us: "Нас чекає велике майбутнє"
 AMR_great_futures_await_us_desc: "Чимало громадян, дивлячись на стан Росії, впадають у відчай. Після десятиліть страждань, краху й смерти важко уявити краще майбутнє, тож багато хто вдовольняється виживанням і не тягнеться до мрії, яку знов можуть розбити.\n\nНарод волає про провідника, бачення й майбутнє. Ми відповімо.\n\nКомунізм і монархізм - ідеології невдачі - не повернули Росії слави. Є лише один шлях до належного місця Батьківщини, і РФП буде її дороговказом.\n\nКріпіться, громадяни: під проводом Партії матимете майбутнє, у яке можна вірити, і націю, якою можна пишатися!"

 AMR_marching_on_for_the_vozhd: "Маршем за Вождя"
 AMR_marching_on_for_the_vozhd_desc: "Далекий Схід - безплідна й нерозвинена земля, якій конче потрібні ефективність і цивілізація. Наявна інфраструктура не відповідає нашим потребам. Цифри ясні: через погані лінії постачання вороги легко оточать і розіб'ють солдатів.\n\nВождь не може допустити такого ризику для хоробрих патріотів Росії, тому наказав негайно зміцнити й розширити всі шляхи постачання. Ми мобілізуємо робітників; дехто неодмінно загине, але це необхідна жертва.\n\nНіщо не спинить похід воїнів Харбіна й тріумф Вождя."

 AMR_flying_banners_of_glory: "Майорять знамена слави"
 AMR_flying_banners_of_glory_desc: "Рев винищувачів. Міць двигунів. Що здатне дужче надихнути й оживити серце, ніж сама могутність повітряних сил? Одна річ - вести війну й володіти землею. Ми народжені на землі й прикуті до неї. Людині не судилося літати, а тим паче панувати в небі.\n\nТа ми пануємо.\n\nПовітряні сили свідчать про винахідливість, міць і спроможність, які не можуть не захоплювати. Вони доводять, що ми долаємо встановлені природою межі й підкоряємо навіть небо. Російські небеса - наше володіння, а хто володіє небом, той володіє війною. Цю силу ми покажемо, і коли фашизм пошириться Росією, його супроводжуватиме рев реактивних літаків."

 AMR_might_makes_right: "Сила творить право"
 AMR_might_makes_right_desc: "Надто багато людей ускладнюють простий світ. Слабкі вважають, що мають право на плоди трудівника. Бідні твердять, що багатство націй належить їм. Філософи просторікують, ніби слово могутніше за зброю. Порожні банальності й жалюгідна брехня. Істина очевидна.\n\nСилу здобувають працею, багатство - винахідливістю, владу - мечем, пошану - страхом.\n\nМи не домовляємося зі слабкими, не шануємо боягузів, не винагороджуємо ледарів і не панькаємося з воїном. Таким невдахам у нас немає місця. На цих принципах збудуємо Росію, що кує великих мужів і викликає у світі пошану - якщо не страх."

 AMR_freedom_awaits_you: "Воля чекає на вас"
 AMR_freedom_awaits_you_desc: "У таборах повно людей: дисиденти, зрадники, ворожі солдати, демократи, монархісти, комуністи та інші. Кожен у єдиному місці, гідному його мерзоти: довічно служить Росії фізичною працею. Та навіть цим людям потрібна надія, інакше вони заціпеніють і стануть непотрібними.\n\nМи дамо їм надію.\n\nПообіцяємо волю тим, хто працює без нарікань, кориться й готовий пізнати істину фашизму. Прощення - чеснота, а Вождь, безперечно, побожний чоловік. Але прощення не дарують - його заробляють."

 AMR_the_fallacy_of_class_struggle: "Хиба «класової боротьби»"
 AMR_the_fallacy_of_class_struggle_desc: "Мабуть, найпідступніша большевицька брехня - поняття «класової боротьби»: какофонія обману в шатах визвольної риторики, що лише роз'єднала російський народ і знищила його національну ідентичність. Зводячи людину до становища й визначаючи її працею, хіба не міняють одні кайдани на інші?\n\nВождь справді розіб'є кайдани й визволить російські уми з ідеологічного рабства. Він проголосить усіх росіян одним народом - і гордих харбінців, і загартованих заводських робітників. Є лише національна боротьба: знову об'єднати братів і сестер Росії під одним знаменом.\n\nІ в цій боротьбі ми переможемо."

 AMR_life_and_death_matters_not: "Життя і смерть не важать"
 AMR_life_and_death_matters_not_desc: "Прикро, але багато людей не мають мети, честолюбства чи справжнього бажання жити й задовольняються цим чистилищем. Не ми й не наші громадяни: на відміну від багатьох росіян, вони знають, що працюють заради вищої мети.\n\nБог, Нація і Вождь. Національна революція - їхнє життя, поширення її на всю Росію - місія.\n\nНіщо не спинить здійснення мрії. Жити за свій народ - честь, умерти за нього - привілей. Земний страх перед каліцтвом і смертю не повинен заважати шляхетній праці патріотів. Фабрики працюватимуть цілодобово, зайві норми буде скасовано, продуктивність доведено до межі - Національна революція вимагає від нас розуму, тіла й душі."

 AMR_rivers_of_blood_all_for_russia: "Ріки крови - усе за Росію"
 AMR_rivers_of_blood_all_for_russia_desc: "Розклад Росії зайшов глибоко - це видно навіть у сусідів. Большевики, монархісти, чужинці та жиди не просто заражають націю, а вкоренилися в ній. Вони не віддадуть влади, землі й підданих легко. Та ми не відвернемося, не завагаємося, не зупинимося.\n\nНа шляху стануть мільйони братів і сестер, чиї уми спотворив ворог. Байдуже, свідомо вони обрали це чи ні: надто багатьох уже не врятувати. Це не відверне нас від необхідного.\n\nМи помстимося за приниження й очистимо Росію вогнем фашизму, навіть якщо доведеться перейти океан крови."

 AMR_the_first_breaths_of_a_fascist_russia: "Перші подихи фашистської Росії"
 AMR_the_first_breaths_of_a_fascist_russia_desc: "Кров'ю, трудом і жертвою ми зробили перші кроки до перемоги. Росія у світлі фашизму - вже не сама мрія, а справжня можливість. Оточені ворогами, ми одного за одним розчавили їх силою воєнної машини й ідейною переконаністю.\n\nЦе визначний тріумф, але до завершення Національної революції ще далеко. Треба навчити громадян нашої доктрини, задушити останній опір і підготуватися до ворогів на заході. Ми не боїмося, бо знаємо: перемога неминуча.\n\nНаціональну революцію буде завершено, Росії повернеться слава. Слава Вождю!"


 AMR_precision_strikes: "Точкові удари"
 AMR_precision_strikes_desc: "Головний кошмар війни з північним проповідником - логістика: брак інфраструктури й нещадний рельєф північно-східного Сибіру. Треба завершити конфлікт якнайшвидше, зберегти найсильніші війська й розчавити бунтівного священника.\n\nВерховне командування пропонує швидкі й точні удари регулярних та спеціяльних сил по ключових військових і цивільних позиціях, щоб розладнати ворога, деморалізувати його війська й зрештою цілком обвалити сили Мєня. Щоб здобути перевагу, ці удари слід почати негайно."

 AMR_hang_the_heretic: "Повісити єретика"
 AMR_hang_the_heretic_desc: "Озираючись назад, наша перемога над навіженим проповідником була неминуча. Зібраний ним набрід затоптали дисципліновані чоботи вірних Вождевих солдатів. Коли Мєня з жменькою охоронців упіймали під час утечі на захід, вони вчинили лише короткий і жалюгідний опір.\n\nТепер священника ведуть столицею, а ми готуємо суд над Алєксандром Мєнєм. У полоні він мовчав - чи то з боягузтва, чи через недоречний стоїцизм. Світський і церковний суди, обидва з карою через повішення, остаточно запечатують його долю. Гучний процес принизить єретика, а страта розчавить рештки руху."


 AMR_the_vozhd_triumphant: "Тріумф Вождя"
 AMR_the_vozhd_triumphant_desc: "Константіна Родзаєвского називали по-різному: фашистським підбурювачем, контрреволюціонером, бандитом. Та всупереч усьому й не без щедрої допомоги східних покровителів він не лише прибрав титул Вождя, а й справді може назвати себе дороговказом Росії.\n\nВідступників, царистів і внутрішніх зрадників очищено; комуністів і сповнених надії переможено; навіженого проповідника та його селянські орди вирізано - усе рукою Родзаєвского. Вождь створив державу, охрещену кров'ю ворогів Росії, а його до смерти вірні війська готові рушити на захід і взяти решту країни. Слава Росії, слава Вождю!\n\n«Пам'ятайте трійцю: Бог, Нація, Труд»."

 #April fools pony tree

 AMR_probe_into_the_north: "Розвідати північ"
 AMR_probe_into_the_north_desc: "ВИЯВЛЕНО ЄРЕСЬ. РОЗПОЧАТИ ЕКСТЕРМІНАТУС"

 AMR_purify_siberia: "Очистити Сибір"
 AMR_purify_siberia_desc: "Поні - не чисті слов'яни. Гармоністи - не нацисти. Отже, вони мусять померти"

 AMR_hang_the_ponies: "Повісити поні"
 AMR_hang_the_ponies_desc: "Це взагалі спрацює? Неважливо, спробуймо"

 AMR_the_vozhd_triumphant_v2: "Тріумф Вождя"
 AMR_the_vozhd_triumphant_v2_desc: "Константіна Родзаєвского називали по-різному: фашистським підбурювачем, контрреволюціонером, бандитом. Та всупереч усьому й не без щедрої допомоги східних покровителів він не лише прибрав титул Вождя, а й справді може назвати себе дороговказом Росії.\n\nВідступників, царистів і внутрішніх зрадників очищено; комуністів і сповнених надії переможено; навіженого проповідника та його селянські орди вирізано - усе рукою Родзаєвского. Вождь створив державу, охрещену кров'ю ворогів Росії, а його до смерти вірні війська готові рушити на захід і взяти решту країни. Слава Росії, слава Вождю!\n\n«Пам'ятайте трійцю: Бог, Нація, Труд»."


