 ### Regional political tree ###
 AMR_the_soul_of_russia: "Душа Росії"
 AMR_the_soul_of_russia_desc: "Ми вирізали відступника та його прибічників, поклали край жалюгідній царистській боротьбі за владу, знищили большевицькі рештки на заході й стерли на порох послідовників єретика. Влада Вождя всередині та назовні нарешті безпечна. Тепер можемо - ні, мусимо - офіційно проголосити Всеросійський уряд Далекого Сходу й закріпити контроль над землею, за яку так дорого заплатили, хай якою буде подальша ціна. Душа Росії, Константін Родзаєвскій, наш вічний Вождь, поведе рух уперед і забезпечить успіх РФП!\n\n«Жодного незгідного не помилують, жодного зрадницького большевика не лишать розпалювати революцію, жодному жидові-змовникові не дозволять стати на шляху справді російської держави. Нині й навіки: Бог, Нація, Труд!»"

 AMR_the_party_congress: "З'їзд Россійской Фашистской Партії"
 AMR_the_party_congress_desc: "Було б несправедливо - принаймні офіційно - казати, що тільки Вождь сумлінно керує державою. РФП усе-таки партія, а кожна путня партія дає членам висловитися. Тому Вождь оголосив великий з'їзд, де старші й молодші партійці по-справжньому фашистським способом висловлять думки й визначать подальші державні справи. Та Родзаєвскій і всі інші вже знали: думка буде рівно одна - Вождева.\n\nУ найтемніші далекосхідні дні Родзаєвскій провів широкі чистки всіх, хто загрожував РФП, а отже йому самому. Без Родзаєвского немає РФП - вона просто не існувала б. Тож немає й іншої думки, крім його."

 AMR_cement_the_foundation: "Поговорити з Болотовим"
 AMR_cement_the_foundation_desc: "Любий Вождеві міністр безпеки Болотов, який керував чистками й допомагав їх організувати, запропонував принадну ідею: створити Загони гарантування безпеки. Офіційно названі Отрядами Обєспєчєнія Бєзопасності, або ООБ, вони стануть відповідником нацистської СС. ООБ доповнять чорносорочечників, які вже виконують незліченні обов'язки й, правду кажучи, надмірно розтягнуті; сама організація підпорядковуватиметься Болотову.\n\nНіхто краще за Родзаєвского не знає значення Шуцштаффеля для нацистів і німецької політики. З одного боку, нове партійне крило матиме широкий вплив на військове й цивільне життя та розвантажить чорносорочечників. З другого - дасть Болотову величезну владу. Але Вождь знає Болотова, і саме Вождь тримає все під контролем."

 AMR_our_great_future: "Наше велике майбутнє"
 AMR_our_great_future_desc: "Отряди Обєспєчєнія Бєзопасності... Звучить добре. Попри німецькі негаразди із СС, Вождеві вистачить мудрости ніколи не дати ООБ вийти з-під контролю. Чорносорочечники перевантажені, а ООБ чудово закріплять владу РФП над населенням: мир для слухняних, терор для незгідних. У війну ООБ битимуться поруч із регулярними частинами й чорносорочечниками, як СС, часто відділяючи славетну перемогу від ганебної поразки.\n\nБолотов дістане своє крило, і воно кине довгу тінь на Росію та внутрішніх ворогів. Большевик і жид пізнають новий страх, що пронизує до кісток, не дає спати й іще дужче єднає націю проти їхніх підступів. ООБ справді допоможуть збудувати велике майбутнє!"

 AMR_our_humble_origins: "Наші скромні витоки"
 AMR_our_humble_origins_desc: "Визнати чорносорочечників перевантаженими означало б збрехати. Вони впораються з усім, чого потребує партія, і навіть більше. Запропонована Болотовим надмірна й могутня організація надто схожа на НКВД, а всі знають небезпеку НКВД і СС без належної вуздечки. Це очевидна спроба Болотова наростити владу коштом організації, що була ключем до нашого тріумфу. Очистити Болотова поки не можна: він надто корисний, а служба його гідна похвали.\n\nТа легкий ляпас по руках покаже Вождеве невдоволення. Ці Загони гарантування безпеки не личать нашим скромним витокам! Чорносорочечники завжди були з нами в радості й горі."

 AMR_the_banner_above: "Знамено над нами"
 AMR_the_banner_above_desc: "У найтемніші дні, коли Вождь і найвірніші мерзли в нерозвиненій Зєї, та ще раніше в Харбіні, доводилося вживати крайніх заходів. РФП скидалася на синдикат організованої злочинности: головорізи-чорносорочечники патрулювали вулиці й били всіх, кому не пощастило потрапити під руку; партійні провідники, зокрема Родзаєвскій, діяли наче мафія - роздавали подарунки й замовляли вбивства.\n\nЦе допомагало партії животіти на крихтах політичного фанатизму, але так не керують великою нацією, що претендує - ні, неминуче має - об'єднати Росію. На щастя, завдяки «майстерним політичним маневрам» Родзаєвского ми очистили партію від найгірших рис і людей та перетворили її на дієвий політичний орган. Надалі вона працюватиме відкрито й ефективно."

 AMR_the_new_russian_society: "Нове російське суспільство"
 AMR_the_new_russian_society_desc: "Росії, яку десятиліттями знали слабкою й підвладною комуністові та жидові, більше немає. Справжні сини Росії проливали кров і вмирали, щоб знищити цю слабку дійсність і відбудувати Національну державу за баченням єдиного чоловіка, досить сміливого, щоб заснувати, організувати й привести РФП до перемоги.\n\nВождь оголосив оформлення «Нового російського суспільства». Серед іншого він видав порадник для доброї фашистської сім'ї: чоловік на чолі дому, жінка біля його ніг, діти виховані й постійно зайняті партією. Усі справжні росіяни, безперечно, охоче приймуть новий лад; бо якщо чинять опір, хіба не прагнуть лише й далі роз'єднувати націю?"

 AMR_fascist_little_ones: "Союз фашистських малят"
 AMR_fascist_little_ones_desc: "Колись, багато років тому, Россійская Фашистская Партія мала низку відгалужень, найголовнішим із яких був Союз фашистських малят. Ця організація під проводом чорносорочечників займалася вихованням і дозвіллям численної російської молоді Харбіна та решти Маньчжурії. Проте після походу Вождя в саму Росію її діяльність довелося призупинити. Та тепер, коли Родзаєвскій зміцнює свою владу над Далеким Сходом, він наказав не просто відновити програму, а поширити її на всі території під контролем партії.\n\nЯкщо відкинути труднощі з організацією, нашій державі це принесе саму лише користь: керівники вже розробили низку «фізичних проєктів», насправді ж украй виснажливих трудових робіт, покликаних загартувати характер і прищепити дисципліну. А якщо дійде до найгіршого, Союз зручно буде мобілізувати у відчайдушну воєнну годину..."

 AMR_fascist_women: "Російський жіночий фашистський рух"
 AMR_fascist_women_desc: "Недарма забобони називають «бабськими байками». Хіба є щось небезпечніше за бездіяльну жінку, полишену самій собі, чия надто жвава уява лише плодитиме чутки та ідеологічні відхилення? Хоча місце жінки, безперечно, поруч із її чоловіком, у турботі про домашнє господарство, ми мусимо подбати, щоб усі жінки Росії були так само ідеологічно чистими, як їхні чоловіки.\n\nОтже, найкраще відновити Російський жіночий фашистський рух - організацію, що пропагує істинні й традиційні жіночі цінності та придушує небезпечну думку, ніби жінки мають бути кимось більшим за господинь. Цей рух, хоч і суто «добровільний», проводитиме місцеві зібрання, де жінкам роз'яснюватимуть не лише їхню роль у суспільстві, а й тонкощі нашого вчення - настільки, наскільки вони взагалі здатні його зрозуміти."

 AMR_azbuka_fashizma: "Азбука Фашизма"
 AMR_azbuka_fashizma_desc: "«Антисемітизм, заклик до дії проти найбільшого й найнебезпечнішого ворога світу, непримиренність до жидівства та програма, що встановлює систему захисту від проникнення міжнародної спільноти, - у наші розкладені й занепадницькі часи це головні ознаки доброчесности, мудрости та потенціялу будь-якої організації чи руху, здатного не допустити, щоб сіонські старійшини здолали чистих серцем і розумом».\n\nНаш Вождь визнав за потрібне й корисне поширити свої писання по всій країні, оприлюднивши їх у своїй «Азбуці Фашизма». Цю працю давно видано й пущено в обіг. Проте Родзаєвскій постановив, що доступ до неї матиме кожен чоловік, кожна жінка й кожна дитина - держава розповсюджуватиме його «маленькі коричневі книжечки», дешеві у друці й доступні всім: від міського заводського робітника до мешканця найвіддаленішого села."

 AMR_live_for_your_vozhd: "Живи заради свого Вождя"
 AMR_live_for_your_vozhd_desc: "Константін Владіміровіч Родзаєвскій, Вождь усього російського народу й голова Всеросійського уряду, є найвищим провідником Далекого Сходу, і це ніколи не зміниться. Його такт, мудрість, сила й майстерне стратегічне мислення - риси, які кожен справжній росіянин має і славити, і наслідувати. Але замало просто славити Вождя та його численні таланти: російський народ повинен жити Вождем і вмирати за Вождя. Люди мають думати про нього наяву й бачити його уві сні. Бо Константін Родзаєвскій - спаситель російської нації, гідний належної йому пошани.\n\nТож ми мусимо розпочати всебічну кампанію, аби народ усвідомив значення свого провідника й навіки зберігав його в серці та пам'яті. Портрети Вождя мають стати доступними й обов'язковими в кожній оселі; життєпис нашого дорогого провідника вивчатимуть у школах; робітники й селяни щодня присягатимуть Родзаєвскому перед початком праці. Саме так народ житиме заради свого Вождя."

 AMR_live_for_your_god: "Живи заради свого Бога"
 AMR_live_for_your_god_desc: "«Пильнуйте себе та всю отару, в якій Святий Дух поставив вас наглядачами, щоб пасти Церкву Божу, яку Він набув власною кров'ю».\n\nСвята Російська Православна Церква - одна з головних основ російської культури й самовираження. Від самого прибуття до Зєї та утворення Всеросійського уряду Константін Родзаєвскій наполегливо зближував Церкву й державу, «узгоджуючи дії» з Православною Церквою Далекого Сходу. Та настав час покласти край юридичній фікції, ніби наша Церква є незалежною установою.\n\nМи маємо й далі звеличувати нашу Церкву, але водночас ще тісніше поєднати її з РФП: духовенство висвячуватимуть не лише на священників, а й у члени РФП, а молитви лунатимуть за успіх Вождя та його партії. Проповіді зосередяться на цінностях російського фашизму. Патріярх, призначений на свою посаду Вождем, не обмежуватиметься порожніми словами на адресу свого покровителя. Усе це перетворить Православну Церкву на урядову гілку в усьому, крім назви."

 AMR_persecute_the_enemy: "Переслідувати ворога"
 AMR_persecute_the_enemy_desc: "Росія з усіх боків оточена ворогами, а що гірше - ворог сидить і всередині. Большевики, масони й, найгірше з усіх, жиди змовляються, щоб послабити Росію комунізмом і внутрішнім розбратом. Ми знаємо свого ворога, але підвладний нам народ - ні. Лише кілька місяців тому багатьох із них гнобили ті самі большевики, яких ми зневажаємо. Чимало справжніх росіян досі живуть і працюють поруч із жидами та прихильниками комуністів. Так не може й не буде тривати. Наш народ мусить знати свого ворога. Наші сили, воєнізовані й усі інші, здатні виявити кожного ворога й ужити проти нього належних заходів: виставити на загальну ганьбу, примусити носити знаки генетичної та політичної скверни, занести імена й відомості до дуже, дуже довгого списку. На щастя, наш міністр безпеки має неабиякий досвід у складанні таких списків і безжальному втіленні їх у життя."

 AMR_the_scheming_jew: "Підступний жид"
 AMR_the_scheming_jew_desc: "«Немає нині більшого лиходія в Росії та світі, ніж жид. Треба зупинити жидівський намір знищити Росію й панувати над світом через тіньові уряди, які вони силкуються нав'язати світовим провідникам. Інакше ми ніколи не побачимо справедливого й чесного світу. Кожен жид - знаряддя їхнього задуму, інструмент їхнього руйнування. Це в них у крові й у мозку. Ось чому ми не можемо дозволити їм співіснувати з людьми чистого російського походження! Вони отруюють наш народ, діють проти нашого уряду й служать міжнародним сіоністським старійшинам. Ці підступні жиди лежать у корені наших страждань і лих усього світу. Ось чому ми мусимо занести їх до списків, знати кожного й готуватися до дій проти них!»"

 AMR_the_treasonous_bolshevik: "Большевик-зрадник"
 AMR_the_treasonous_bolshevik_desc: "«Ми зруйнували їхні установи й розстріляли кожного члена їхнього уряду, до якого змогли дотягнутися. Скажи мені, Болотове, що ще ми можемо зробити?»\n\nОдним із найбільших ворогів російського суспільства, поруч із жидом і масоном, є большевик. Навіть після знищення їхнього уряду на Далекому Сході та систематичних страт усіх, хто був пов'язаний із їхнім режимом, їхні прибічники досі лишаються, сіють розбрат і влаштовують заворушення серед нашого народу й у нашій владі. Ці огидні потвори, хай багато з них говорять нашою мовою й схожі на нас, - не росіяни. Вони навіть не люди, і ми мусимо пам'ятати про це, вистежуючи їх, наче псів."

 AMR_excise_the_cancer: "Вирізати пухлину"
 AMR_excise_the_cancer_desc: "Списки в нас.\n\nМи знаємо їхні імена.\n\nМи знаємо, де вони живуть, де працюють і кому довіряють.\n\nЧас вирвати гниль із корінням."

 AMR_find_em_list_em_catch_em: "Знайти. Записати. Схопити"
 AMR_find_em_list_em_catch_em_desc: "Знайти. Записати. Схопити. Ось три накази, які сьогодні отримали чорносорочечники й армія. Три накази, три слова - більшого їм не потрібно.\n\nСьогодні сам Вождь із великою помпою й урочистістю оголосив із балкона в місті [AMR.Capital.GetName], що нарешті візьметься за «жидівське питання» Росії. Він мобілізував воєнізоване крило Россійской Фашистской Партії - чорносорочечників, яких підтримає військо, - щоб почати зганяти жидів у межах наших кордонів до гетто. Гетто будуть тісними, брудними й дуже, дуже помітними, аби нагадувати всім усередині та ззовні, що чекає на тих, хто змовляється занапастити Росію."

 AMR_reopen_kolyma: "Знову відкрити Колиму"
 AMR_reopen_kolyma_desc: "«Пам'ятайте, що російські прадіди та їхні прадіди билися й гинули за нашу велику націю. Вони працювали до кісток, щоб збудувати кращу Росію. А тепер перед нами стоять такі, як ви, - ті самі люди, що прагнуть знищити здобутки наших предків. Настав час вам заплатити за вчинки вашого народу проти нашої нації. Більше не ми працюватимемо до повного виснаження. Тут, де золото й платина лежать просто під нашими ногами, ви працею спокутуватимете гріхи свого народу».\n\nСьогодні табори на Колимі офіційно відкрили знову, цього разу під пильним наглядом РФП. Тут жидівські в'язні та інші інакодумці, особливо большевики, працюватимуть до знемоги в неймовірно небезпечних умовах, сплачуючи борг перед російським суспільством видобутком величезних мінеральних багатств, прихованих у суворому передгір'ї Колими."

 AMR_glory_to_russia: "Слава Росії!"
 AMR_glory_to_russia_desc: "Бог, Нація і Труд. Ось три речі, за які бореться наша партія, і саме вони знову зроблять Росію великою. Наші кроки - глибоке насичення суспільства фашизмом, перебудова партійної структури РФП, початок знищення наших ворогів - дещо наблизили нас до втілення повноцінного Всеросійського уряду. Вочевидь, під проводом Вождя російського народу нас чекають великі звершення. У кожній оселі портрети Родзаєвского нагадують народові про його велич. Лише під його проводом ми повернемо втрачену славу Росії й очистимо нашу націю від ворогів, що завдали їй стільки кривд. Слава Росії! Слава Богу! Слава Россійской Фашистской Партії! І нарешті, нині й повіки, слава нашому Вождю Константіну Владіміровічу Родзаєвскому!"

 ### Regional economy tree ###
 AMR_the_heart_of_russia: "Серце Росії"
 AMR_the_heart_of_russia_desc: "Російський народ так само природно прийняв тягарі й блага промислової революції, як метелик летить на полум'я. Для кожного очевидно, що росіянин за своєю природою легко пристосовується й чудово годиться не лише для романтизованого сільського життя, а й для праці в наших величезних промислових комплексах, де виробляють промислові товари та зброю війни. Від перших днів індустріялізації серцем Росії, що невпинно б'ється, були її економічна та промислова міць.\n\nПід час Російської революції большевики й Бухарін захопили владу, звівши природний російський потяг до праці до жалюгідного заклику міжнародного робітника працювати задля їхньої держави; а коли їхній підступний союз розпався, подальша економічна катастрофа зруйнувала російську промисловість. Час її відбудувати."

 AMR_lessons_from_europe: "Уроки Европи"
 AMR_lessons_from_europe_desc: "Колись велика Німецька імперія нині борсається на заході, однак не її економіка спричинила цей занепад. Її господарство, в якому панували мегакорпорації та використовували геть недобровільну працю інакодумців - а їх у нас незліченна кількість, - зробило Німеччину провідною економічною потугою Европи.\n\nБа більше, корпоративна система, яку Родзаєвскій планує запозичити в німців, саме й принесла їм перемогу в Другій світовій війні та місце серед нинішніх великих держав: економічна міць Німеччини розтрощила хирлявий Союз і визначила його долю під час Західноросійської війни - майже цілковито завдяки їхньому непохитному фашистському духові й міцній економічній системі. Заохочуючи постання російських мегакорпорацій і розширюючи вже наявну систему примусової праці, ми зможемо засвоїти уроки Европи й застосувати їх у Росії завтрашнього дня."

 AMR_class_collaboration: "Класова співпраця"
 AMR_class_collaboration_desc: "Одна з найважливіших засад фашизму - сприяння співпраці між класами, на противагу огидній практиці комуністів, які розпалюють класовий конфлікт і ліквідовують тих, кого вважають «небажаними». Замість намагатися зробити неможливе ми повинні заохочувати співпрацю між усіма - від найнижчих верств до самого Вождя; байдуже, чи ти неписьменний сільський селянин, чи промисловий маґнат, якому домашнє тепло нагадує часи в Харбіні. Усі мають працювати заради єдиної мети - співпрацювати одне з одним і долати суспільно-економічні розбіжності.\n\nЦаристи нехтували цими розбіжностями, а совєти зазнали невдачі, намагаючись усунути їх через винищення інших класів. Вочевидь, єдиний шлях уперед - забезпечити злагоджену співпрацю між класами."

 AMR_the_worker: "Робітник"
 AMR_the_worker_desc: "Фабрики в нашій державі перебувають... далеко не в найкращому стані. Вождь уживав щодо них інші, менш пристойні слова, і він не помилявся. Ми багато зробили й просунулися до кінцевої мети - раю для наших робітників. Проте задля поліпшення фабрик та їхнього обладнання для робітника ще належить виконати чимало праці. Класова співпраця необхідна, а найважливіше схилити на наш бік тих, хто наче раб день і ніч гарує у промислових центрах нашої країни, виробляючи готові товари, без яких неможливе навіть найпростіше цивілізоване життя.\n\nСаме робітники почали першу революцію, а тоді й другу. Третьої не буде, доки вони від початку на нашому боці. А задля цього ми можемо поліпшити їхні умови праці та обладнання, можливо, за японської допомоги."

 AMR_the_farmer: "Селянин"
 AMR_the_farmer_desc: "На землях, якими ми нині володіємо, селянство не надто численне. Але це не означає, що так буде й надалі, коли ми здобудемо більше орних земель; ані що їх має бути мало; ані що вони менш важливі за інших членів суспільства. Зрештою, російський чоловік воює на російському харчі - де б ми були без нього?\n\nМи можемо запровадити щедрі сільськогосподарські ґранти й дешеві позики, щоб заохотити росіян засновувати власні господарства й допомогти тим, хто нині ледве дає собі раду, втриматися та продовжувати працю. Ми не можемо й не дозволимо західним сусідам випередити нас у виробництві харчів лише завдяки родючішій землі. На нашому боці дух російського селянина!"

 AMR_the_industrialist: "Промисловець"
 AMR_the_industrialist_desc: "Якщо робітники - серце нашої нації, а селяни - її м'язи й сухожилля, то промисловці, безперечно, її мозок: вони забезпечують злагоджену роботу всього організму й дбають, щоб люди в усьому суспільстві мали все потрібне для економічного успіху. Саме промисловці, звісно, після Вождя, відповідають за добробут економіки й зрештою не лише пожвавлять російське господарство, а й поведуть його в майбутнє.\n\nТож ми повинні надати цим промисловцям і представленим ними фірмам великі державні ґранти та юридичні привілеї, щоб подбати не лише про тіло, а й про мозок. Це може призвести до того, що низка російських мегакорпорацій міцно вчепиться в нашу економіку, але ж саме мегакорпорації колись зробили Німеччину наддержавою, а тепер зроблять те саме зі Святою Росією."

 AMR_all_as_one_for_holy_russia: "Усі як один - за Святу Росію!"
 AMR_all_as_one_for_holy_russia_desc: "«Сьогодні я почув, що наш народ - робітники, селяни, промисловці та інші - почав робити перші кроки до злагодженої праці в корпоративній системі. Це не просто економіка, а лад, у якому російська нація діє як людське тіло: серце, м'язи, мозок і все інше працюють разом одне для одного й на благо нації. Ми не повинні забувати, заради чого прагнемо цього!\n\nЖид і большевик хочуть розділити нашу націю, спонукають нас забути своє призначення й знищити нашого Бога. Об'єднавшись під спільним прапором економічної гармонії та цілковитої єдности в ці відчайдушні часи, ми забезпечимо російському народові не лише виживання, а й процвітання! Не беріться до свого ремесла й заробітку з похиленими головами та важкими серцями. Пам'ятайте, заради чого працюєте: ми куємо єдину Росію, не обтяжену чварами. Завжди пам'ятайте: ми повинні працювати всі як один, за Святу Росію! Бог, Нація і Труд!»"

 AMR_the_vozhds_vision: "Видіння Вождя"
 AMR_the_vozhds_vision_desc: "«Я маю видіння - для вас... і для всього російського народу. Я бачу російську націю, що працює в економічній гармонії, байдуже, хто переді мною: найбагатший промисловий маґнат чи найбідніший селянин. Усі росіяни можуть досягти достатку у фашизмі. Я бачу державу, єдину не лише в меті, а й у слові, де тіло російського народу складають окремі люди, що творять нашу економіку.\n\nМи не похитнемося, ми не зламаємося - ніхто, навіть жид, не зможе розірвати російське тіло й дух. Тому ми мусимо перекувати себе за корпоративним видінням, відкинувши руйнівну природу большевицької системи та хаотичну спадщину років після розпаду Союзу. Наш народ невтомно працюватиме незліченні години, віддаючи російській державі кров, піт і сльози, розум, тіло й дух. Ми, російська нація, зробимо це й віддамо все своїй державі, бо знаємо: наша жертва дозволить Росії процвітати»."

 AMR_collective_economic_management: "Колективне управління економікою"
 AMR_collective_economic_management_desc: "Вільний ринок Сполучених Штатів Америки, що перебуває під жидівським впливом, уже веде державу до загибелі, тоді як большевицький метод урядового контролю показав усю сміховинність своїх невдач. Очевидно, що в управлінні економікою не можна ані надто поступатися корпораціям і вільному ринкові, аби народ не впав у виродження чи жид нишком не прибрав країну до рук, ані надто їх обмежувати.\n\nМи повинні встановити політику колективного управління економікою, за якої уряд тісно співпрацюватиме з корпораціями, чиє постання й розвиток від самих низів ми заохочували. Насправді це означатиме спільне управління господарством із боку корпорацій та уряду: останній визначатиме межі й розумні обмеження для захисту нації, а перші забезпечуватимуть економічне зростання та новаторство."

 AMR_readjust_taxation_policies: "Переглянути податкову політику"
 AMR_readjust_taxation_policies_desc: "Який безхатько здатен купити фабрику й запустити її? Який селянин може заснувати підприємство й керувати ним? І який фабричний робітник може власними знаннями створити промислову фірму? Хоч як крути, багатство зосереджене в руках небагатьох, чимало з яких лишилися ще з харбінських часів.\n\nОднак ці заможні люди потерпають від податкової системи, яку ми вважаємо несправедливою: вона заохочує їх зберігати гроші, а не витрачати їх на благо російського народу. Ми повинні різко знизити податки для багатіїв і пов'язаних із ними підприємств, щоб заохотити їх і далі вкладати кошти в нашу економіку. Втрати державної скарбниці можна легко відшкодувати, ще більше підвищивши податки для тих верств суспільства, які не настільки важливі для економічного розвитку й успіху. І що вони зроблять - скаржитимуться?"

 AMR_all_russian_corporations: "Всеросійські корпорації"
 AMR_all_russian_corporations_desc: "У кабінеті лишилися тільки Вождь і Константін Стєклов, міністр економіки Російської держави, які допізна готували оголошення про заснування першої російської мегакорпорації. Хоча її фінансував і контролював приватний сектор - переважно заможні емігранти, що пережили чистки Родзаєвского, - уряд, а саме Стєклов, виконав чималу чорнову роботу, координуючи злиття низки фірм і приватних осіб. Вони сиділи у великому кабінеті, пили всю ніч і святкували початок нової доби російської економіки. Далекосхідний конґломерат - російською ДНК - мав стати першою з багатьох російських мегакорпорацій, покликаних панувати в російській економіці й кувати сильну Росію.\n\n«Росія завтрашнього дня нікого не чекатиме, еге ж, Соратніку Стєклове?»"

 AMR_glory_in_labor: "Слава в труді"
 AMR_glory_in_labor_desc: "У житті фабричного робітника є своєрідна поетична довершеність. Романтичний ідеал людини, яка так прагне розвивати свою націю й досягти величі не лише для себе, а й для своєї громади; яка виявляє відданість родині, громаді й зрештою своєму народові та багато чим жертвує на благо нації.\n\nРосіянин має пишатися своїм трудом. Наші фабричні робітники тяжко працюють задля найкращого для нації, і це вже приносить плоди. Але ми повинні скористатися зростанням ефективности й заохотити молоду промислову базу працювати ще завзятіше. Треба прищепити народові думку, що в труді - слава, а праця наших промислових солдатів служить благу держави, їхнього Бога та їхнього Вождя."

 AMR_lower_wages_longer_hours: "Менші зарплати, довший робочий день"
 AMR_lower_wages_longer_hours_desc: "«Працюйте більше, а не розумніше! Я не плачу вам за розумну працю! Ми мусимо виконати норму, інакше я не отримаю премії, а ви не отримаєте платні! До роботи, доки я справді не розлютився».\n\nХто сказав, що робітникам потрібен зручний графік і щедра платня? До чого це привело совєтів? Наші робітники працюватимуть задля нації, якою пишаються, - без високої платні й зручного розкладу. Наша промислова база досі жалюгідно мала порівняно з нашими потребами, і щоб забезпечити подальшу продуктивність фабрик та економічний добробут Всеросійської держави, ми мусимо урізати зарплати, збільшивши державні й приватні прибутки, та подовжити робочий день, іще більше підвищивши продуктивність. Нині ми не можемо дозволити розладу серед робітників, навіть якщо вони працюють тяжче, ніж будь-коли."

 AMR_survival_of_the_fittest: "Виживання найсильніших"
 AMR_survival_of_the_fittest_desc: "Росіянин за природою сильний і походить від міцного роду - це одна з наших расових рис, закладених у кожному з нас від народження. Ці хоробрі чоловіки тяжко працюють заради нашого видіння сильної та індустріялізованої Росії. Однак ні для кого не секрет, що деякі менш віддані робітники начебто не здатні працювати довше за меншу платню; дехто навіть насмілився скаржитися, що це шкодить їхньому фізичному здоров'ю!\n\nЖоден справжній росіянин не заперечував би проти запровадженої нами політики, інакше Вождь її не запровадив би. Вочевидь, цим людям не місце ані на наших фабриках, ані в нашій державі. Стєклов та кілька інших високопоставлених урядовців запропонували стратегію «виживання найсильніших» - неофіційну політику усунення найслабших і найменш здібних членів суспільства, на зміну яким прийдуть справжні росіяни, яких ми шукаємо."

 AMR_work_the_blood: "Вичавити кров працею"
 AMR_work_the_blood_desc: "Наша політика викорінення найслабших виявилася успішною, проте через неї виник певний брак доступних робітників. Не варто хвилюватися, запевняє Стєклов: він уже знайшов розв'язання, яке не лише подолає нестачу промислових робітників, а й не коштуватиме нам ані копійки. Люди, що нині наповнюють наші табори тяжкої праці - найменш небезпечні з політичних в'язнів і найнебезпечніші з інакодумців, - це невичерпна криниця робочих рук, яку лишилося відкрити.\n\nНині їм у найкращому разі відводять цивільну працю: зазвичай примушують видобувати корисні копалини, будувати інфраструктуру або, якщо випаде достатньо легке призначення, працювати на цивільному виробництві. Та коли табори переповнені в'язнями, а цивільної роботи на всіх не вистачає, чому б їм не виготовляти для нас рушниці й набої? Платити їм не потрібно, а щоб вони почали виробляти зброю війни, вистачить найповерховішого навчання."

 AMR_a_new_economy: "Нова економіка"
 AMR_a_new_economy_desc: "Нова Російська держава потребує нової економіки. Економіка Всеросійського уряду, побудована за принципами, що принесли нацистам славу й успіх у їхні золоті часи, вже показує перші здобутки цієї системи. Ми перепризначили наших цивільних «робітників» на військове виробництво, упорядкували й підвищили ефективність решти промисловости, розпочали масову корпоратизацію суспільства та створення перших корпорацій, які поведуть Росію до сильного й славного майбутнього.\n\nПопереду довгий шлях, але ми заклали підвалини потужної, впливової та міжнародної економіки, яка забезпечить Росії місце на світовій арені. За Бога, Націю і Труд!"

 ### Regional military tree ###
 AMR_the_pride_of_russia: "Гордість Росії"
 AMR_the_pride_of_russia_desc: "Росія має чим пишатися, і понад усе, звісно, своїм військом. Росіянин має довгу й славну історію воєнних успіхів, а ми є природними спадкоємцями слави цих слов'янських завоювань. Щоб продовжити цю спадщину, ми мусимо розширити й осучаснити збройні сили, аби здолати сіоністських маріонеток на заході та всіх інших, кому стане нахабства кинути виклик Вождю і його хоробрим воїнам.\n\nНові зразки зброї, нові танки, літаки й кораблі... звісно, нові системи постачання, щоб увесь цей апарат лишався зв'язаним і дієвим... усе слід оновити й омолодити, щоб армія - гордість Росії - лишалася нашою найпершою турботою та стала блискучим взірцем войовничого націонал-соціялізму Родзаєвского."

 AMR_a_strong_army: "Сильна армія"
 AMR_a_strong_army_desc: "Дієва армія - це сильна армія. Принаймні так проголосив Вождь. А коли Вождь вимагає - ми виконуємо. Сильна армія мусить мати сильний меч, а наш меч - це вогнепальна зброя. Кожен чоловік має її: зброю, яку легко опанувати на початках, але важко довести володіння нею до майстерности. Вона брикається, наче мул, а б'є ще гірше. Та з плином років ми побачили, що ці рушниці застаріли.\n\nВождь зажадав для нашої армії найновішого й найкращого спорядження - і ми здатні його створити. Ми накажемо зброярам дослідити автомат Калашникова, що первісно походить із далекого заходу. Вони розберуть його до найдрібніших деталей, вивчать, що можна вдосконалити й поліпшити, а тоді порадять найкращі, на їхню думку, зміни. Вільна Всеросійська армія заслуговує лише на найкращу зброю - і вона її отримає."

 AMR_a_proud_army: "Горда армія"
 AMR_a_proud_army_desc: "У найтемнішу годину Вождевого шляху до національного об'єднання наші війська робили те, що мусили. Іншого вибору просто не було: командири змирилися з тим, що нав'язана нам доктрина призначалася для частин, які ледь переважали чисельністю цивільне ополчення.\n\nТепер, коли ми володіємо Далеким Сходом, усе зовсім, зовсім інакше. Ми стоїмо на порозі величі; уперше за довгі роки можемо дозволити командирам зосередитися на справжній доктрині, а наші армії матимуть найвищу якість. Сучасні доктрини, сучасні армії, сучасна держава - ця трійця забезпечить нам перемогу в прийдешні роки. Бог, Нація і Труд!"

 AMR_a_devoted_army: "Віддана армія"
 AMR_a_devoted_army_desc: "«Бийтеся за свою націю! Бийтеся за своїх предків! Бийтеся за свого Бога! А понад усе - бийтеся за свого Вождя!»\n\nСьогодні на підконтрольних нам землях розпочалася перша хвиля реклами й пропаганди. Цей раунд «заохочень», перший із багатьох за словами Вождя, покликаний заманити широкі маси населення добровольцями до Вільної Всеросійської армії. Насправді однією з головних наших проблем є підтримання резервів людської сили, виснажених величезними обширами, які ми займаємо, та малою кількістю населення навіть у найбільших містах під нашим контролем.\n\nТому Вождь вигадав геніяльний «наступ», щоб молодь нашої нації масово записувалася до війська: на її крові буде збудовано нашу нову Росію."

 AMR_the_free_all_russian_navy: "Вільний Всеросійський флот"
 AMR_the_free_all_russian_navy_desc: "Коли весь російський Далекий Схід опинився під нашою владою, настав час оцінити наші морські сили. На жаль, завдання це непросте: доки ми сиділи замкнені в Зєї, Вільний Всеросійський флот існував здебільшого на папері.\n\nНавіть тепер, зміцнюючи владу над новими землями, здобутими ціною чималої крови, мудрий Вождь звертає погляд до океану, щоб офіційно створити новий Вільний Всеросійський флот. Флот потребує кораблів, а кораблі захищатимуть нашу торгівлю й започаткують новий, російський світанок на Тихому океані. Усі наші вороги тремтітимуть перед могуттю майбутнього Російського Тихоокеанського флоту!"

 AMR_a_job_offer: "Пропозиція роботи"
 AMR_a_job_offer_desc: "Серед численних потреб нашого флоту бракує й достатнього резерву новобранців, які стали б основою його особового складу. Проте очевидне потенційне джерело є: хирлявий Червонопрапорний Тихоокеанський флот, залишки безглуздої та невдалої спроби Івана Юмашева втримати свої війська в Пєтропавловску. Значна частина його людей досі жива в наших численних трудових таборах.\n\nНалагодивши зв'язок, організувавши й спробувавши завербувати людей зі старого командування Юмашева, ми отримаємо для флоту не лише численний, а й досвідчений особовий склад.\n\nА разом із людьми прийде й флот: кілька кораблів, великих і малих, а також гордість майбутнього Вільного Всеросійського флоту - лінкор, який буде перейменовано на «Вождь Константін Родзаєвскій»."

 AMR_walk_the_plank: "Пройтися по дошці"
 AMR_walk_the_plank_desc: "До тих, хто не співпрацюватиме й не зречеться безглуздої та нещирої віри в совєцьку справу, милосердя не буде. Ті, хто не працюватиме на нас і не допомагатиме створювати новий флот, нам ні на що не годяться - навіть до праці в найглухіших шахтах. Цих людей, що відкинули нашу пропозицію, зберуть докупи й розстріляють, адже вони не тільки дарма носять шкіру, а й загрожують режимові.\n\nТак само не всі кораблі, успадковані від Юмашева, були справними чи бодай придатними до відновлення. Деякі настільки не годилися до моря, що це було б смішно. Та це не робить їх непотрібними. Насправді в багатьох цих стародавніх морських чудовиськах повно тих самих матеріялів, із яких виготовляють рушниці, гармати й танки. Кораблі, що не можуть плавати, послужать своєму Вождю інакше - як брухт."

 AMR_resources_for_warships: "Ресурси в обмін на кораблі"
 AMR_resources_for_warships_desc: "Дотепер японці показали себе корисними, хоча й мінливими союзниками. Однак нашому флотові потрібні кораблі, а чого японцям не бракує - то це саме кораблів. Тож слід звернутися до них і обговорити можливість придбати їхні судна, принаймні старіші моделі, які допоможуть закласти ядро Всеросійського флоту.\n\nЗвісно, нам, можливо, доведеться ще більше поступитися доступом до сибірських багатств і їх видобутком - передусім вольфрамовими копальнями в глибині Маґадана, на які давно накинули оком японські корпорації. Проте ці поступки - мала ціна за те, що ми отримаємо натомість: величезний і повноцінний флот із найсучасніших японських кораблів."

 AMR_the_free_all_russian_airforce: "Вільні Всеросійські повітряні сили"
 AMR_the_free_all_russian_airforce_desc: "Вільна Всеросійська армія, можливо, найвеличніша сухопутна сила, яку бачив Далекий Схід за останні десятиліття, але вона саме така - сухопутна. Тепер, захопивши авіябазу Чєрьомушки, ми можемо звернути погляд у небо й зробити його наступним володінням хороброго російського воїна.\n\nМаючи під контролем авіябазу, пристойний резерв людей і східних покровителів, які, найімовірніше, охоче нададуть матеріяли й навчання для нового покоління пілотів реактивної авіяції, ми бачимо, що Вільні Всеросійські повітряні сили не просто досяжні - вони вже не за горами."

 AMR_japanese_designs: "Японські розробки"
 AMR_japanese_designs_desc: "Повітряні сили неможливі без літаків, а ті нечисленні машини, що ми маємо, належать до давно минулих епох. Піднімати цих стародавніх потвор у небо було б сміховинно. Проте через брак досвіду з реактивними й сучасними літаками навіть найобдарованішим нашим пілотам і конструкторам було б важко створити працездатні проєкти.\n\nВідповідь є - у Токіо. Дотепер японці надзвичайно щедро надавали нам матеріяльну, економічну й технологічну підтримку. Наші зв'язкові в японській столиці вже натякнули, що японці радо забезпечать нас не лише кресленнями, а й справжніми реактивними літаками, здатними дати поштовх Вільним Всеросійським повітряним силам. Звісно, ці літаки коштуватимуть недешево, але що у Сфері буває дешевим?"

 AMR_expand_cheryomushki: "Розширити Чєрьомушки"
 AMR_expand_cheryomushki_desc: "Хоч ми контролюємо авіябазу Чєрьомушки, найбільшу на всьому Далекому Сході, вона безнадійно застаріла. Її збудували для гвинтових літаків, а всі плани осучаснення покинули під час початкового розпаду Союзу.\n\nЧєрьомушки - наш найбільший козир у створенні й розгортанні сучасних повітряних сил, але це не означає, що їх не можна поліпшити. Треба розширити й осучаснити авіябазу, щоб там вистачало місця для запланованої величезної кількости реактивних літаків, були довші злітні смуги відповідно до більшого розбігу реактивних машин, а також сучасні диспетчерські вежі й системи. Ми перетворимо це летовище на аеропорт майбутнього!"

 AMR_quality_in_quantity: "Якість у кількості"
 AMR_quality_in_quantity_desc: "Вільна Всеросійська армія має багато рис. Однак «переважна чисельність» - не перше, що спадає на думку при огляді наших дивізій. Вождь і верховне командування неохоче жертвують якістю військ, проте сувора дійсність нашого становища змусила розглянути масовий призов.\n\nТакий призов справді зашкодить якості нашої нової професійної армії, але, дивлячись на бурю на заході, усі розуміють: нестача людської сили - наша найбільша слабкість. Настав час запровадити масовий призов на всьому Далекому Сході - принаймні поки що, - аби наша армія проклала шлях на захід, здолавши ворогів і кількістю, і своїм ідеологічним фанатизмом."

 AMR_more_men_more_guns: "Більше людей, більше зброї"
 AMR_more_men_more_guns_desc: "Коли прибуває більше вояків, природно, що їм потрібна зброя. Більше людей - більше рушниць. А більше рушниць треба ще й виготовити. Фабрики мусять працювати тяжче й довше. Керівники повинні витиснути з робітників, рабів чи вільних людей, усе можливе, щоб перевершити виробництвом наших західних суперників.\n\nА більше рушниць дозволить виставити більше людей - самопідживлюваний цикл. Отже, призов треба розширити ще далі: молоді, старі, хворі та всі, кого раніше вважали непридатними, мусять служити. Якщо здатні тримати рушницю й стріляти - здатні битися за нас. Наша армія буде передусім численною, наче чорний приплив, що накриє розкладених і занепалих та очистить Росію і світ від плям сіонізму й комунізму."

 AMR_look_to_the_future: "Погляд у майбутнє"
 AMR_look_to_the_future_desc: "Сумна правда нашого становища на Далекому Сході полягає в тому, що це найменш заселена область Росії. Тому від самого початку нашого повернення до Росії, ще в темні дні Зєї, нам завжди бракувало людей на передовій. Ми зміцнили своє становище на Далекому Сході, але нестачу людської сили не подолали.\n\nУтім, це не обов'язково має бути проблемою. Одні вважають масовий призов найкращим розв'язанням, інші ж пропонують зробити наголос на сучасній армії з надзвичайно рухливими силами. Механізоване військо, змодельоване за стратегією бліцкриґу, яку кілька десятиліть тому застосували німці, підтримане танками й тісно пов'язане з повітряними силами, перетворить нашу малу чисельність на ніщо супроти блискавичних ударів, які ми зможемо завдавати."

 AMR_the_best_of_the_best: "Найкращі з найкращих"
 AMR_the_best_of_the_best_desc: "Коли Россійская Фашистская Партія розкололася, а царисти загрожували нам зі свого гнилого осідку в Чіті, ми не могли відмовити в службі жодному чоловікові. Через це наша армія досить довго містила не найприємніші елементи суспільства: п'яниць, нездар і навіть наркозалежних. Часом становище ставало настільки поганим, що так звана армія діяла радше як зграя бандитів, а не як злагоджені збройні сили.\n\nГоді.\n\nНам бракує людської сили, але ми - горда нація з гордою армією. І якщо Вільна Всеросійська армія має перетворитися на силу, готову й здатну виконувати надзвичайно складні маневри бліцкриґу, слід позбутися найпроблемніших людей і створити військо, що справді складається з найкращих серед найкращих."

 AMR_across_the_tundra: "Крізь тундру"
 AMR_across_the_tundra_desc: "«Дужче бий, наш російський молот; грими, наче Божий грім... Нехай розсиплеться на прах сатанинський народний комісар! Уперед, брати, з нами шумить російський стяг; над горами, над долинами летить справжній росіянин!»\n\nНаш народ може працювати без упину, та вкладення в армію нарешті окупилися. Після всіх здійснених реформ Вільна Всеросійська армія стала вершиною наших досягнень. Непереможна сила, вона буде мечем у руці Вождя, що віддасть вогню сіоністських большевиків, які досі заважали нам поширити свою владу на решту Росії. За Бога, Націю і Труд!"

 ### Regional diplo tree ###
 AMR_the_hand_of_russia: "Рука Росії"
 AMR_the_hand_of_russia_desc: "Коли нагальні справи владнано, а Далекий Схід повернувся до законних рук єдиного справжнього Всеросійського уряду, ми нарешті можемо зосередитися на одному з найважливіших складників нашої боротьби за об'єднання - міжнародній дипломатії. Сполучені Штати Америки давно перебувають у пазурах міжнародного жидівства, про що свідчить їхня відверта й образлива підтримка відступника Матковского; однак є й інші держави, до яких ми можемо звернутися за визнанням і підтримкою нашої праведної справи об'єднання Росії. На заході нацисти - взірець нашого власного руху - почали оговтуватися від братовбивчої громадянської війни, а на сході лежать наші доброзичливі й давні покровителі - японці. Вождь уже зібрав досвідчений дипломатичний корпус для закордонних місій, якщо вони знадобляться, і почав писати викривальну тираду проти держав, які служать знаряддями жидівської тіньової влади."

 AMR_overtures_to_germany: "Зближення з Німеччиною"
 AMR_overtures_to_germany_desc: "Забезпечивши Далекий Схід і проголосивши Всеросійський уряд, ми змогли легітимізувати себе в очах світу. Нарешті можна звернутися до наших західних братів, німців, які досі були одними з найдіяльніших учасників знищення жидівських сил, що борються за встановлення свого світового ладу. Німці, звісно, можуть остерігатися єдиної Росії, особливо такої сильної, якою її уявив наш Вождь; однак Родзаєвскій засвідчив готовність надати їм переважне право на ресурси та інші «незначні» поступки в обмін на німецьку економічну й військову допомогу, а також, можливо ще важливіше, дипломатичне визнання нас законною Росією. Делегацію вже обрано з-поміж найшанованіших та ідеологічно найвідданіших дипломатів РФП - лишилося тільки відрядити її."

 AMR_denounce_the_elders_of_zion: "Викрити сіонських старійшин"
 AMR_denounce_the_elders_of_zion_desc: "«За свідченнями таємного жидівського сіонізму, ще 929 року до Р. Х. Соломон та інші вчені жиди теоретично розробили задум мирного підкорення Сіоном усього всесвіту. З плином історії цей задум докладно опрацювали й завершили посвячені в цю справу люди. Вони вирішили підкорити світ Сіонові підступністю Символічного Змія, чия голова мала уособлювати посвячених у плани жидівської управи, а тіло - жидівський народ. Проникаючи в серця зустрінутих ним націй, цей Змій підточував і пожирав усю нежидівську силу цих держав».\n\n«Прокиньтеся, усі вірні росіяни, віддані державі й своєму Вождю. Прокиньтеся й викрийте сіонських старійшин за Тихим океаном, які смикають за ниточки так званих провідників «Вільного світу», наче ляльок у дитячій виставі. Вони вихваляють демократію, ніби вона робить їх сильними, а не слабкими. Викрийте цих дурнів, що гарують на своїх жидівських господарів»."

 AMR_our_old_benefactors: "Наші давні покровителі"
 AMR_our_old_benefactors_desc: "Японці поєднують у собі багато чеснот: вони сильна раса, щедрий народ під проводом імператора, чия адміністрація зробила надзвичайно багато для нашого руху. Чимало наших солдатів досі воюють японською зброєю, а офіцери й чорносорочечники радяться з агентами Кемпейтай. Заперечувати зв'язок нашого руху з японцями було б безглуздо. То чи не варто спертися на стосунки, які наш Вождь і його товариші плекали десятиліттями? Японці близькі нам географічно й дипломатично, якщо не політично; якщо ми прагнутимемо тіснішої співпраці через економічні угоди й військову допомогу, то, можливо, повернемо частину російської землі та здобудемо дипломатичне визнання..."

 AMR_congratulate_japan: "Привітати Японію"
 AMR_congratulate_japan_desc: "Давно відомо, що Сполучені Штати Америки перебувають у пазурах жидів, які вже використовують американську промислову базу й величезну економіку, щоб знищити працю тих, хто так тяжко виборював свободу від сіоністських змов. Але хіба не Японська Імперія, чий непохитний імператор і фанатичні слуги хоробро билися з американцями та їхніми жидівськими ляльководами під час Тихоокеанської війни, не просто зупинила їх, а й перемогла, тріюмфуючи над американським велетнем? Великі уми мислять однаково, а немає умів величніших за японські й російські - це довершений приклад сумісности наших націй. Наше майбутнє - з японцями. Космополітичний наступ не підірве сили азійських народів."

 AMR_japanese_recognition: "Японське визнання"
 AMR_japanese_recognition_desc: "Наші дипломатичні загравання й вихваляння японців, як і величезні ресурси в наших руках, не лишилися непоміченими. Завдяки вправному й обережному маневруванню Вождь та команда його найдосвідченіших дипломатів, загартованих роками російсько-японських відносин у Харбіні, почали складати пропозицію до Японії про визнання. Хоч переконати найкращих представників імператорської служби буде нелегко, ми готові... обговорити певні економічні поступки в обмін на міжнародне дипломатичне визнання та майбутнє дружби й співпраці. Навіть саме це визнання суттєво легітимізує нашу владу в очах світу й відкриє подальші можливості для переговорів із друзями в Токіо."

 AMR_a_mutually_beneficial_arrangement: "Взаємовигідна домовленість"
 AMR_a_mutually_beneficial_arrangement_desc: "Тепер, коли японці та їхні союзники у Сфері співпроцвітання офіційно визнали нас, можна поглянути на схід задля поліпшення промислового становища. Японці ще не розчарували Вождя своїми щедрими «пожертвами» людей і матеріялів. Однак після переосмислення наших стосунків із Великим Самураєм Вождь визнав за доречне просити в Токіо більше, ніж зброю: економічного розвитку у вигляді промислового обладнання та засобів для його складання й використання. Звісно, це обладнання не безкоштовне - ціна його чимала: повна свобода дій японських компаній на нашій території. Утім, японці, безперечно, розуміють взаємність наших відносин, а отже, їхні компанії поважатимуть наші ринки й дозволять нашим корпораціям працювати поруч."

 AMR_economic_assistance: "Економічна допомога"
 AMR_economic_assistance_desc: "Ще одна велика перемога нашого Вождя! Японці прийняли нашу пропозицію й після кількох дрібних правок щодо своїх вимог на нашому ринку охоче, ба навіть радісно, відправили промислове обладнання до наших портів разом із представниками дзайбацу, які навчатимуть російських колег якнайефективніше працювати на цих машинах. Вождь уже проголосив «вічну дружбу» з Великим Самураєм, а чорносорочечники почали спрямовувати портових робітників для підготовки до прибуття обладнання й шукати найкращі місця під фабрики. Попереду чимало праці: збудувати й запустити фабрики, знайти для них робітників. Проте це великий крок до зміцнення наших відносин із Токіо."

 AMR_off_to_tokyo: "До Токіо"
 AMR_off_to_tokyo_desc: "Тепер, коли наші відносини з японцями потеплішали й ми почали економічно взаємодіяти з членами Сфери співпроцвітання, Вождь запропонував ще одну зустріч із японськими дипломатами - цього разу не про визнання, а про «Зовнішню Маньчжурію», більш відому росіянам як Пріамур'є. Захоплене японцями під час розпаду Совєцького Союзу, Пріамур'є за короткий час під владою нинішнього власника, Маньчжоу-ґо, принесло йому неймовірно багато клопоту. «Зовнішня Маньчжурія», як забажала назвати її маньчжурська адміністрація, кишить бунтівниками й бандитами... принаймні за її словами. На думку Вождя, це, найімовірніше, або збурені азійські розбійники, що користуються недієвістю жалюгідної поліції Маньчжоу-ґо, або палкі російські патріоти, які прагнуть лише приєднатися до Всеросійського уряду. Звісно, японці вимагатимуть того самого - економічних поступок, - але Вождь охоче їх надасть."

 AMR_our_new_provinces: "Наші нові провінції"
 AMR_our_new_provinces_desc: "У Блаґовєщєнску кажуть, що людина в пекельній безодні в більшій безпеці, ніж за міською межею. Хоч японці й вирішили повернути нам контроль над Пріамур'ям, поширити адміністрацію на величезний наданий нам терен виявилося... непросто. Нечисленні міста переповнені злиденними безхатьками й гіршими покидьками, а торгівля наркотиками й організована злочинність зовсім вийшли з-під контролю. Однак сільська місцевість іще гірша. Землі майже порівну контролюють російські бандити й корейські комуністичні повстанці, що ведуть між собою безглузді війни за територію. Але це колись була російська земля - і стане нею знову. Вождь виголосив промову про незламну волю Россійской Фашистской Партії та її неминучу перемогу в Пріамур'ї, хай ворогами Вождя є лише бандити й вигнані корейці. До краю вже прибувають вантажівки з найжорстокішими чорносорочечниками, готовими покласти край панівній анархії."

 #####################################
 ##=====| Superregional Trees |=====##
 #####################################
 AMR_one_step_closer: "На крок ближче"
 AMR_one_step_closer_desc: "Коли Центральний Сибір опинився в наших руках ціною чималих зусиль, Вождь замислився про себе та про здобутки, до яких він привів народ і партію. «На крок ближче», - раз у раз вітають його радники. Вони, звісно, мають рацію. Справді, на крок ближче.\n\nАле цей крок величезний. Россійская Фашистская Партія вже не дрібна примітка в історії Харбіна. А Константін Родзаєвскій аж ніяк не «король бандитів», як його колись намагалися назвати недоброзичливці. Вождю настав час стати тим, кого потребує Росія. Більше жодної залежности від японців і надій на німців. Росія стоятиме самостійно, а біля стерна буде хоробрий Вождь."

 AMR_the_second_party_congress: "Другий партійний з'їзд"
 AMR_the_second_party_congress_desc: "Вождь оголосив, що настав час Другого з'їзду Россійской Фашистской Партії. Дехто не розумів, навіщо взагалі потрібен цей з'їзд, особливо з огляду на те, що жоден голос у партії не насмілювався суперечити думкам Вождя. Проте стало зрозуміло: постійні чвари між Болотовим і Шехєрєвим стали нестерпними для голови РФП.\n\nВождь скликав з'їзд із однією, дуже конкретною метою: нагадати Болотову й Шехєрєву, хто тут головний, і що їм варто дослухатися до цього нагадування. Для Вождя ніхто не є «надто корисним» чи «недоторканним»."

 AMR_a_loyal_council: "Відданий Совєт"
 AMR_a_loyal_council_desc: "Після завершення з'їзду стало очевидно, що в Совєті досі є люди, які замишляють повалити Вождя. Перша хвиля чисток, покликана зміцнити владу Родзаєвского, була надзвичайно ефективною, але зрадники пустили коріння значно глибше, ніж вважалося. Складено новий, значно коротший список зрадників, заколотників та інакодумців, цього разу майже винятково з високопоставлених членів Россійской Фашистской Партії, і кожне наступне ім'я в ньому гучніше за попереднє.\n\nТа Вождь не терпить ані найменшої нелояльности. Константін Родзаєвскій - це Россійская Фашистская Партія, а Россійская Фашистская Партія - це Константін Родзаєвскій. Скривдити одного означає скривдити іншу. Вочевидь, під час першої хвилі чисток Болотов і Шехєрєв прогледіли декого зі зрадників. Вождь не повторить їхньої помилки."

 AMR_a_subservient_party: "Покірна партія"
 AMR_a_subservient_party_desc: "Вєрховний Совєт уже давно непокоїть Вождя. Принаймні на папері його члени могли голосувати щодо законодавства, партійного членства та інших, дедалі дріб'язковіших питань. Звісно, результати голосувань майже не розходилися з волею Вождя, проте Родзаєвскій завжди боявся, що за справжнього бажання Вєрховний Совєт цілком здатен накласти вето на будь-який задум, який він захоче втілити.\n\nЦя обставина завдавала Вождю неспокою. Тому однією з останніх дій Другого партійного з'їзду стало останнє голосування Вєрховного Совєту - про скасування власного права голосувати проти Вождя.\n\nНе дивно, що рішення ухвалили одноголосно."

 AMR_the_dawn_of_a_new_russia: "Світанок нової Росії"
 AMR_the_dawn_of_a_new_russia_desc: "Тепер, коли партію знову очищено й політичну сторону Всеросійського уряду впорядковано, партію втихомирено, а заступникам Вождя нагадано їхнє місце, починається нова доба російської історії - світанок Росії, не забрудненої жидами, комуністами й усіма, хто прагне зашкодити російській нації.\n\nВождь оголосив початок нового етапу так званого «відвоювання Росії» Россійской Фашистской Партієй. У промові «Світанок нової Росії» він заявив, що останніх зрадників і загрози його владі викорінено й усунено, а поки російський народ працює далі, він уже планує завершальний крок національного об'єднання. Як і всі його промови, ця завершилася сумнозвісним гаслом РФП: «За Бога, Націю і Труд!»"

 AMR_united_in_vision: "Єдині у видінні"
 AMR_united_in_vision_desc: "Є лише одне видіння майбутнього Росії, гідне обговорення. Це видіння Вождя - Константіна Родзаєвского. Він знає шлях уперед для Росії, а сумнів у ньому рівнозначний зраді Російської держави. Отже, кожен справжній росіянин знає, що всі мають об'єднатися довкола одного видіння - видіння Вождя, яке прокладе шлях до сильної й незалежної Росії, вільної від тиранії большевика та гніту жида.\n\nЗвісно, так думають усі справжні росіяни, але важливо не давати їм про це забути. На наших нових землях праці Вождя поширюватимуть і зроблять обов'язковим читанням, щоб усі зрозуміли важливість його місії."

 AMR_redouble_economic_development: "Подвоїти економічний розвиток"
 AMR_redouble_economic_development_desc: "Фабрики Далекого Сходу виробляють більше зброї, ніж будь-коли раніше. Ба більше, промислове зростання та ВВП нашої держави стрімко здіймаються. Вочевидь, економічний план Вождя, здебільшого заснований на моделі колишньої економічної наддержави - нацистської Німеччини, - працює.\n\nАле цього замало.\n\nПлан треба розширити, норми збільшити, знайти більше рабів, а робочий день подовжити ще сильніше. Систему слід перенести до Центрального Сибіру, де огидно щедрі умови праці розбестили робітників і привчили чекати, що ми схилятимемося перед їхніми бажаннями. Ми ніколи не потуратимемо большевицькій спадщині; ці червоні пізнають, за потреби під вістрям багнета, справжню трудову етику й важливість праці заради чогось вищого за власні втіхи."

 AMR_the_german_model: "Німецька модель"
 AMR_the_german_model_desc: "Німці поєднують у собі багато рис. Брехливі шахраї, невдалі націонал-соціялісти, слабкодухі й нижчі за нас. Проте Вождь ніколи не заперечував би, що їхня економічна модель - одна з небагатьох причин їхнього тривалого успіху - є рецептом перемоги, а сама система, безперечно, варта захоплення.\n\nТож ми маємо й далі наслідувати цей план, досконало дотримуючись того, як Вождь задумав пристосувати німецьку модель до наших потреб, і подбати, щоб у Центральному Сибіру її втілили так само точно, як на Далекому Сході.\n\n«Можливо, це не найлегше життя, Соратніку, але принаймні можна співати під час праці! До того ж усю небезпечну роботу виконують раби. Пам'ятай, Соратніку: за Бога, Націю і Труд!»"

 AMR_repurpose_the_siberian_plan: "Перепризначити Сибірський план"
 AMR_repurpose_the_siberian_plan_desc: "Ніколай Бухарін - людина, що навіки вкрила себе ганьбою, особливо в очах Россійской Фашистской Партії та її голови, самого Вождя. Він большевик і, що гірше, перебуває під впливом жидівської сіоністської верхівки, але навіть зупинений годинник двічі на добу показує правильний час.\n\nЙого Сибірський план, що передбачав широку й швидку індустріялізацію Росії на схід від Уралу, спричинив величезне зростання промислового виробництва в місцях, де раніше його майже не було. Тепер, коли більша частина Сибіру під нашим безпосереднім контролем, це принесло нам неабияку користь.\n\nВождь вважає, що Сибірський план і його спадщину можна пристосувати для переходу до Вождевого видіння, перекувавши їх так, аби наша Росія гарантовано стала промисловим велетнем."
 AMR_repurpose_the_siberian_plan_tt: "Це збільшить наш §YНаціональний борг§!.\n"

 AMR_our_reclaimed_lands: "Наші повернуті землі"
 AMR_our_reclaimed_lands_desc: "Наша війна за Центральний Сибір була кривавою й коштувала чимало військових і політичних втрат. Тож Вождь безпосередньо зацікавлений не просто поширити на цей край нашу адміністрацію, а й якнайшвидше привести його у відповідність до свого видіння.\n\nЗадля цього доведеться розбити чимало яєць. Робітників, звиклих до щедрих поступок, слід батогом привести до ладу. Ідеологічних противників режиму треба винищити - розстріляти або поневолити. А інакодумців, із найвищих чи найнижчих верств суспільства, необхідно викорінити й усунути. Звісно, вони, наче щури, комуністи чи жиди, ховаються на видноті, а отже, населення Центрального Сибіру доведеться залякати безмежним терором. Лише після його завершення край буде готовий до включення у Всеросійський уряд."

 AMR_dispatch_the_blackshirts: "Відправити чорносорочечників"
 AMR_dispatch_the_blackshirts_desc: "Чорносорочечники, які вже давно є водночас хребтом і довгою рукою Россійской Фашистской Партії, - природний вибір на роль приборкувачів Центрального Сибіру. Вони добре знають, як наводити жах на наших ворогів, і мають досвід викорінення жидів і комуністів; вони настільки дієві, що на Далекому Сході їх уже називають «псами Вождя». На це прізвисько вони справедливо не ображаються, а навпаки, пишаються тим, наскільки добре виконують свою роботу.\n\nВони мають приборкати край за всяку ціну. Вождь наказав будь-якими засобами зламати ворогів російського народу серед населення Центрального Сибіру - і вони це зроблять."

 AMR_dispatch_the_oob: "Відправити ООБ"
 AMR_dispatch_the_oob_desc: "Чорносорочечники як організація за своєю природою не годяться для інтеграції Центрального Сибіру. Їхні сили надмірно розтягнуті, особливо з огляду на те, що на Далекому Сході вони вже приборкують комуністів і корейських націоналістів.\n\nООБ - Отряди Обєспєчєнія Бєзопасності, Болотові загони гарантування безпеки - роками готувалися до внутрішнього умиротворення та викорінення зрадницьких і заколотницьких елементів на наших землях. Вони можуть не виконувати тієї самої політичної ролі, що чорносорочечники, зате чудово знають, як «залякати народ до покори»."

 AMR_take_the_worthy: "Прийняти гідних"
 AMR_take_the_worthy_desc: "Не кожен гідний членства в Россійской Фашистской Партії, а особливо колишні політики та правителі, якими кишів Центральний Сибір. Зрештою, вони затяті ідеологи, а ті, хто присягається у протилежному, ще гірші - потенційні шпигуни, що прагнуть знищити Россійскую Фашистскую Партію зсередини.\n\nВерхівка й середня ланка колишніх адміністрацій Центрального Сибіру не варті нічого, крім розстрільної команди чи трудового табору. Але ті, хто стояв нижче, так звані «писарчуки», - люди, яким колишні зверхники не дали ані Божої ласки, ані успіху. Ретельна перевірка цих осіб напевне виявить гідних кандидатів на партійне членство й адміністративні посади в Сибіру."

 AMR_united_in_practice: "Єдині на ділі"
 AMR_united_in_practice_desc: "Вільна Всеросійська армія, безперечно найуспішніша збройна сила, яку бачила Росія за десятиліття, легко змела слабкий опір, захоплюючи Центральний Сибір, займаючи міста й спалюючи непокірні села. Ворожі орди, у багато разів численніші за нас, лежать переможені й зганьблені.\n\nПроте було б нерозумно, як раніше, просто відправити цих нікчем до трудових таборів. Ми завжди знали, що завоювати Сибір буде важко, адже наші землі були значно менш заселені за території противника. Далі на захід становище лише погіршуватиметься.\n\nЯкщо ми хочемо мати бодай якийсь шанс утілити видіння Вождя, цих переможених солдатів доведеться включити до нашої армії. Вони пройдуть перепідготовку під наглядом наших офіцерів, засвоять належні вимоги й обернуть зброю проти ворога."

 AMR_weve_come_so_far: "Ми зайшли так далеко..."
 AMR_weve_come_so_far_desc: "Від найтемніших днів перебування Вождя в Зєї, через перемоги над відступниками й комуністами, аж до нинішньої миті, коли Вільна Всеросійська армія крокує вулицями Новосібірска, Россійская Фашистская Партія неабияк досягла успіху. Дехто навіть шепоче, що сам Вождь здивований, якщо не щасливий, від усього, що здійснили він та його адміністрація.\n\nПопереду ще безліч справ, але є й чимало приводів святкувати: Вождь уже кує вільну, сильну й незалежну Росію. Важливо озирнутися на все, що Константін Родзаєвскій зробив для свого народу."

 AMR_with_so_much_left_to_do: "...Та ще стільки треба зробити"
 AMR_with_so_much_left_to_do_desc: "Навіть визнавши, як далеко зайшла Россійская Фашистская Партія, ми розуміємо: цього досі замало. На заході лежать жидівські маріонетки й рештки большевиків. Ще далі - підступні німці, нині не більш ніж зламаний народ, який тримається за систему, чию неспроможність не бажає визнати. На Вождя чекає багато праці, а отже, багато праці чекає й на народ Росії.\n\nОб'єднання Батьківщини - найвища мета, а перехід через Урал буде нелегким. І після об'єднання на нас чекає наступний великий виклик - Німеччина.\n\n«...ми не похитнемося й не спинимося. Наше призначення, майже фаталістичне у своїй неминучості, - повернути Батьківщині втрачену славу! За Бога, Націю і Труд!»"

