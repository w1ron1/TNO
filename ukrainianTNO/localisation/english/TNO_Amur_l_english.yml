 ### Ideas ###
 AMR_rusfascist_stronghold: "Оплот російського фашизму"
 AMR_rusfascist_stronghold_desc: "Коли Нечестивий Союз вигнав справжніх синів Росії, декотрі з них дісталися Харбіна, де під проводом Родзаєвского ми прийняли ідеали фашизму, щоб дієвіше боротися з большевизмом. Оскільки Нечестивий Союз розсипався саме перед лицем фашизму, схоже, наш вибір був правильним; під стягом фашизму Батьківщина відродиться, а всіх її плюндрівників буде вигнано. Нині ми затиснуті в цій спустошеній далекосхідній землі лише через зраду: внутрішню - Матковского - та зовнішню - підлих японців. Та наша наполегливість пережила червоне інтермецо; вона переживе й усіх інших зрадників, а Батьківщину буде перековано у вогні."
 AMR_paranoid_vozhd_1: "Параноя Вождя"
 AMR_paranoid_vozhd_1_desc: "Роки на чолі Амура виснажили Вождя Родзаєвского, як і остаточна зрада Матковского та його союзників. За іронією долі, щоб утримати владу, провідник фашистів удався до методів совєцьких керманичів, яких прагнув повалити.\n\nКожен, кого підозрюють у зраді, шпигунстві чи просто невірності ідеалам РФП, потрапляє під приціл і рано чи пізно гине за наказом Родзаєвского.\n\nНаслідки для Амура очевидні: здібних урядовців і командирів лишається дедалі менше. Ті, хто вцілів, - лише маріонетки свого провідника."
 AMR_paranoid_vozhd_2: "Параноя Вождя"
 AMR_paranoid_vozhd_2_desc: "Роки на чолі Амура виснажили Вождя Родзаєвского, як і остаточна зрада Матковского та його союзників. За іронією долі, щоб утримати владу, провідник фашистів удався до методів совєцьких керманичів, яких прагнув повалити.\n\nКожен, кого підозрюють у зраді, шпигунстві чи просто невірності ідеалам РФП, потрапляє під приціл і рано чи пізно гине за наказом Родзаєвского.\n\nНаслідки для Амура очевидні: здібних урядовців і командирів лишається дедалі менше. Ті, хто вцілів, - лише маріонетки свого провідника."
 AMR_paranoid_vozhd_3: "Параноя Вождя"
 AMR_paranoid_vozhd_3_desc: "Роки на чолі Амура виснажили Вождя Родзаєвского, як і остаточна зрада Матковского та його союзників. За іронією долі, щоб утримати владу, провідник фашистів удався до методів совєцьких керманичів, яких прагнув повалити.\n\nКожен, кого підозрюють у зраді, шпигунстві чи просто невірності ідеалам РФП, потрапляє під приціл і рано чи пізно гине за наказом Родзаєвского.\n\nНаслідки для Амура очевидні: здібних урядовців і командирів лишається дедалі менше. Ті, хто вцілів, - лише маріонетки свого провідника."
 AMR_supreme_council_purge: "Чистка Вєрховного Совєта"
 AMR_supreme_council_purge_desc: "Прикро визнавати, але російський фашизм на кожному кроці стримували й калічили кар'єристи-диверсанти та матковські зрадники у власних лавах - найяскравішим прикладом є сам ниций Матковскій. Після довгих роздумів Вождь справедливо постановив очистити свій Вєрховний Совєт, щоб створити новіший, чистіший і сильніший уряд, який служитиме державі в його особі. Кожен зрадник зустріне смерть - від кулі або виснажливої праці в таборі. Ніхто не стоїть над правосуддям фашистських законів! Хай живе фашизм! Хай живе Вождь!"
 AMR_secret_police: "Таємна поліція"
 AMR_secret_police_desc: "Ми далеко просунулися у викоріненні корупції та, що гірше, інакомислення в уряді, але роботи ще багато. Особливо це стосується простолюду, серед якого на кожному кроці ховаються підступні заколотники й таємні комуністичні агенти. Задля безпеки держави ми всюди розставимо очі Вождя: в кожній оселі, на кожній фабриці, на кожній вулиці. Ми виплекаємо культуру терору, у якій друзі й навіть родичі мимоволі підозрюватимуть одне одного в зраді. Ми змусимо людей бачити большевиків у кожній тіні - і тоді лев фашизму почне пожирати змію соціялізму."
 AMR_true_vozhd: "Єдиний справжній Вождь"
 AMR_true_vozhd_desc: "Тяжкою працею та відданістю наш любий Вождь і його найближчі, найдовіреніші союзники очистили всю партію від продажних і зрадницьких елементів, вигнавши їх, наче щурів, що тікають від ножа. Большевики, які ще живуть на нашій землі, або повсякчас тремтять від страху, або поволі гинуть від праці в таборах. Нарешті владу Вождя на Амурі беззастережно визнає кожен, до кого сягають довгі руки його законів."
 AMR_corporate_state: "Корпоративна держава"
 AMR_corporate_state_desc: "Щоб колись об'єднати Росію під доброзичливим проводом нашого Вождя, ми мусимо перебудувати державу. Нинішня економічна система може годитися дрібному воєнному ватажкові, але довго не протримається.\n\nМи повинні узгодити економіку з принципами корпоративізму. Багаті й бідні росіяни мають співпрацювати, щоб держава дієво перейшла до нової економічної моделі."
 AMR_free_russian_army: "Свободная Русская Армія"
 AMR_free_russian_army_desc: "Після самого Вождя найбільшою гордістю нашої нації є Вільна Всеросійська армія. Самою рішучістю й силою зброї ми розгромили зрадників, недолюдей і большевиків Далекого Сходу.\n\nТа вдосконаленню немає меж. Ми викуємо з цієї армії найгрізнішу бойову силу Росії. Коли завершимо, вона зможе повернути нашу розбиту батьківщину."
 AMR_free_russian_army_2: "Свободная Русская Армія"
 AMR_free_russian_army_2_desc: "Після самого Вождя найбільшою гордістю нашої нації є Вільна Всеросійська армія. Самою рішучістю й силою зброї ми розгромили зрадників, недолюдей і большевиків Далекого Сходу.\n\nТа вдосконаленню немає меж. Ми викуємо з цієї армії найгрізнішу бойову силу Росії. Коли завершимо, вона зможе повернути нашу розбиту батьківщину."
 AMR_nerchinsk_mines: "Нерчінські копальні"
 AMR_nerchinsk_mines_desc: "Після тяжкої кампанії ми нарешті захопили горде місто Чіту та його околиці. Серед важливих об'єктів, якими керують із міста, є Нерчінські копальні з цінними покладами золота й срібла. Доки вони під нашим контролем, копальні залишатимуться вагомою опорою подальшого економічного зростання держави."
 AMR_nerchinsk_mines_2: "Нерчінські копальні"
 AMR_nerchinsk_mines_2_desc: "Після тяжкої кампанії ми нарешті захопили горде місто Чіту та його околиці. Серед важливих об'єктів, якими керують із міста, є Нерчінські копальні з цінними покладами золота й срібла. Доки вони під нашим контролем, копальні залишатимуться вагомою опорою подальшого економічного зростання держави."
 AMR_advisors_japanese: "Японські радники"
 AMR_advisors_japanese_desc: "Коли Росія впала перед жидо-большевизмом і виродженням, білий рух осиротів, утратив батьківщину й розсіявся світами. У найтемнішу годину японці та їхні поплічники в Маньчжоу-ґо тепло прийняли нас, коли ніхто інший не хотів: дали прихисток від лютих морозів і годували, коли ми голодували.\n\nПісля того як німецький орел уп'яв пазурі в російські поля й повалив усю прогнилу совєцьку споруду, розбивши Союз на друзки, саме Японія стала нашим благодійником у боротьбі проти продажної совєцької держави-обрубка Яґоди. Навіть після краху білої коаліції Японія й далі підтримувала наш праведний уряд - не безглуздих монархістських змій у Чіті й не зрадницький набрід Матковского.\n\nТепер, коли ми стоїмо оплотом чистоти й націоналізму серед темряви, японці лишаються нашим єдиним союзником, озброюють нас і наставляють у хрестовому поході за визволення батьківщини з кайданів виродження та очищення її від зрадників."
 AMR_blackshirt_divisions: "Польові дивізії чорносорочечників"
 AMR_blackshirt_divisions_desc: "Славетні чорносорочечники Россійской Фашистской Партії - одні з найвідданіших і найсамовідданіших патріотів Росії та бійців за фашистську справу в усьому світі. Вони живуть, щоб служити Вождю, і вмирають, щоб наблизити фашизм. Ми можемо розширити роль цих відважних фанатиків: нехай не лише придушують отруйне інакомислення, а й б'ються з ворогами фашизму на полі бою, де їхня абсолютна відданість стане ще кориснішою."
 AMR_defensive_redoubts: "Оборонні редути"
 AMR_defensive_redoubts_desc: "Вождь через державний апарат жорстко контролює кожну царину життя на підвладній території. Це дає нам змогу вистежувати й ловити втікачів-дисидентів і ворожих агентів; якщо так триватиме, невдовзі вся Росія буде під замком."
 AMR_quality_in_quantity_1: "Якість у кількості"
 AMR_quality_in_quantity_1_desc: "Одна з проблем нашої праведної армії - нестача живої сили, що заважає поширювати владу на щойно завойовані землі. Щоб спрямувати військо на кращий шлях, Вождь і верховне командування вирішили запровадити масовий призов і поповнити лави. Жовтопузі боягузи й нероби неодмінно нарікатимуть, однак Вождь розуміє: особисті турботи ніщо проти завдання, що стоїть перед нами. Визволення батьківщини - обов'язок кожного росіянина."
 AMR_quality_in_quantity_2: "Якість у кількості"
 AMR_quality_in_quantity_2_desc: "Одна з проблем нашої праведної армії - нестача живої сили, що заважає поширювати владу на щойно завойовані землі. Щоб спрямувати військо на кращий шлях, Вождь і верховне командування вирішили запровадити масовий призов і поповнити лави. Жовтопузі боягузи й нероби неодмінно нарікатимуть, однак Вождь розуміє: особисті турботи ніщо проти завдання, що стоїть перед нами. Визволення батьківщини - обов'язок кожного росіянина."
 AMR_a_modern_army_1: "Сучасна армія"
 AMR_a_modern_army_1_desc: "Одна з проблем нашої праведної армії - нестача живої сили, яка обмежує бойовий потенціял солдатів. Щоб виправити становище, Вождь і верховне командування погодилися модернізувати армію й урівноважити цей недолік. Замість іще ширшого та суворішого призову, який міг би зашкодити народній підтримці, ми імпортуватимемо всі сучасні військові технології, які зможемо дістати, і запровадимо нові, дієвіші форми військової організації."
 AMR_a_modern_army_2: "Сучасна армія"
 AMR_a_modern_army_2_desc: "Одна з проблем нашої праведної армії - нестача живої сили, яка обмежує бойовий потенціял солдатів. Щоб виправити становище, Вождь і верховне командування погодилися модернізувати армію й урівноважити цей недолік. Замість іще ширшого та суворішого призову, який міг би зашкодити народній підтримці, ми імпортуватимемо всі сучасні військові технології, які зможемо дістати, і запровадимо нові, дієвіші форми військової організації."
 AMR_brown_book: "Азбука Фашизма"
 AMR_brown_book_desc: "«Азбука Фашизма», або «Абетка фашизму», давно є основою віри й дороговказом Россійской Фашистской Партії. Її написали Ґєннадій Тараданов і Владімір Кібардін - тепер викриті як матковські архізрадники - та відредагував сам великий Вождь. Нещодавно вирішено переконати народ у нашій справі, видавши книжку для загального читання, попередньо ще раз прибравши вплив матковців. Фашистами не народжуються - ними стають; тож хіба є кращий спосіб поширити фашистську ідеологію, ніж широко рознести знання про обіцяне нею славетне майбутнє?"
 AMR_resources_to_japan: "Торгівля з Японією"
 AMR_resources_to_japan_desc: "Японці, безперечно, були нашими найнадійнішими й найкориснішими покровителями, хоч їхні цілі й корисливі. Але ми не можемо чекати, що вони й далі надаватимуть життєво важливу допомогу без негайної відплати. Тому в розумних межах дамо їм усе, чого вони забажають: виняткові економічні права й землі, які їхні дзайбацу зможуть освоювати та розвивати. Можливо, якщо винагорода досить їх потішить, згодом і ми дістанемо більше користи."
 AMR_the_german_model_idea: "Німецька модель"
 AMR_the_german_model_idea_desc: "Німці можуть бути нашими смертельними ворогами, а їхній Райх - жалюгідною пародією на націонал-соціялістичний ідеал, але принаймні їхня економічна модель працює. Їхня нація досі тримається завдяки національно-корпоративній економічній системі, тому ми наслідуватимемо її й застосуємо на завойованих землях. Підкорені маси нарікатимуть, але справедливо, щоб переможець керував переможеним. До того ж усю небезпечну й виснажливу працю робитимуть раби."
 AMR_rusfascist_stronghold_2: "Оплот російського фашизму"
 AMR_rusfascist_stronghold_2_desc: "Коли Нечестивий Союз вигнав справжніх синів Росії, декотрі з них дісталися Харбіна, де під проводом Родзаєвского ми прийняли ідеали фашизму, щоб дієвіше боротися з большевизмом. Оскільки Нечестивий Союз розсипався саме перед лицем фашизму, схоже, наш вибір був правильним; під стягом фашизму Батьківщина відродиться, а всіх її плюндрівників буде вигнано. Нині ми затиснуті в цій спустошеній далекосхідній землі лише через зраду: внутрішню - Матковского - та зовнішню - підлих японців. Та наша наполегливість пережила червоне інтермецо; вона переживе й усіх інших зрадників, а Батьківщину буде перековано у вогні."

 AMR_commandos: "Підрозділи командос"
 AMR_commandos_desc: "За наказом Вождя з регулярного війська виокремлено новий підрозділ спеціяльного призначення. Його бійців називають «командос», і вони виконують завдання, до яких звичайних солдатів не готують. Зокрема, ведуть асиметричну війну й деморалізують ворога раптовими нічними наскоками, позбавляючи його рівноваги та пробиваючи прогалини в лініях. Ми покладаємо на цих командос великі надії й сподіваємося, що в прийдешні часи вони їх виправдають."
 AMR_idea_lessons_from_the_ice_march: "Уроки Крижаного походу"
 AMR_idea_lessons_from_the_ice_march_desc: "Під час великої трагедії Російської громадянської війни, що сталася десятиліття тому й завершилася перемогою ненависних большевиків завдяки їхньому обману, наші попередники в білих військах зазнали страшних поневірянь, поволі відступаючи на схід. Особливо сумнозвісним став Крижаний похід: десятки тисяч вояків мусили взимку відступати кригою замерзлої річки Кан і величезними просторами Сибіру, щоб уникнути цілковитого розгрому чи полону. Цю майже катастрофу слід оплакувати, але з неї треба й учитися, аби вона не повторилася: ми дослідимо всі подробиці й застосуємо висновки до модернізації військової логістики."

 ### Custom Effect Tooltips ###
