 #Дерево фокусів США щодо Італії
 USA_Il_Duce_Disaster:0 "Катастрофа Іль Дуче"
 USA_A_Company_Man:0 "Людина Компанії"
 USA_Starting_a_Fire:0 "Розпалити вогонь"
 USA_Blockade_the_Gulf:0 "Задушення саудівців"
 USA_Subvert_the_Pan_Arabists:0 "Підрив панарабістів"
 USA_Feeding_The_Flames:0 "Підживлювати полум'я"
 USA_Sun_Never_Rises:0 "Сонце ніколи не заходить"
 USA_Preparing_The_Coup:0 "Справедлива війна"
 USA_Operation_Checkmate:0 "Операція «Мат»"
 USA_The_Fire_Rises:0 "Полум'я здіймається"
 USA_Il_Duce_Disaster_desc:0 "Муссоліні мертвий уже понад десятиліття, але батько фашизму досі завдає нам більше клопоту, ніж будь-який мрець, окрім Адольфа Гітлера. Безгосподарність Чіано у зовнішній політиці та управлінні Італійською імперією, заворушення, спричинені переходом до демократії, та некомпетентність італійської колоніальної адміністрації призвели до вибуху хаосу на Близькому Сході.\n\nЦе не стосувалося б нас із двох причин. По-перше, Італія є надзвичайно цінним союзником із величезним впливом у Середземномор'ї, потужною армією та економічними зв'язками як із нами, так і з нашими союзниками. По-друге, імперія Італії є одним із найбільших виробників нафти у світі, а крах її колоніальних урядів різко дестабілізував нафтовий ринок. Обидві ці причини достатні для втручання, єдине питання — характер цього втручання."
 USA_A_Company_Man_desc:0 "Часи «чистої» та «чесної» війни минули. Сьогодні війни виграють не армії, а підривна діяльність і брудні хитрощі, і якщо для перемоги над фашистами нам доведеться вдатися до ударів у спину та інтриг — нехай буде так. Незабаром ми розпочнемо операції на Близькому Сході, але перед цим нам потрібні очі на землі, і в нас є ідеальна людина для цієї роботи.\n\nІ. Говард Гант — експерт із таємних дій. Він ветеран кубинської операції та багатьох інших операцій у Центральній Америці, свого часу був начальником резидентури в Мексиці та зібрав групу чудових оперативників. Деякі його методи є досить суперечливими навіть у ЦРУ, але результати говорять самі за себе. Якщо ми хочемо досягти свого на Близькому Сході, він — найкраще, що може запропонувати Компанія."
 USA_Starting_a_Fire_desc:0 "Нафтова криза погіршиться, перш ніж почне покращуватися. Оскільки кожна велика міжнародна держава має свою частку в кризі, нам потрібно зробити ситуацію некерованою для наших ворогів, водночас зберігаючи контроль над нею. Це означає наймати місцевих воєначальників і кочівників, давати їм зброю та спрямовувати їх проти саудівців. Це означає надавати якомога більшу підтримку режимам, підтримуваним Італією, водночас стежачи, щоб вони не вислизнули з-під нашого контролю. Це означає відправляти наших агентів і радників на місця, щоб гарантувати перемогу обраних нами урядів.\n\nАгент Гант та його люди отримали накази й уже починають операції проти сил, підтримуваних Німеччиною та Японією. Близький Схід палитиме — це безсумнівно; важливо лише, щоб саме ми правили попелом."
 USA_Blockade_the_Gulf_desc:0 "Перед нашими італійськими союзниками стоять два головні вороги, і найбільш пов'язаний із міжнародною системою з них — саудівці. Тисячі барелів сирої нафти щодня відправляються з їхніх портів до нафтопереробних заводів по всьому світу, роблячи їх однією з найбагатших країн світу. Однак цей нафтовий потік може бути перекритий ВМС США, і якщо це станеться, саудівська економіка зазнає значних збитків. Щойно ми перекриємо постачання саудівської нафти, їм рано чи пізно доведеться підкоритися."
 USA_Subvert_the_Pan_Arabists_desc:0 "Баасисти — небезпечна група, яка наполягає на створенні окремого блоку сили на Близькому Сході, заснованого на арабському націоналізмі та крайній неприязні до втручання західних держав у їхні справи. На щастя, вони розпорошені та нерішучі, мають слабке керівництво й постійно сваряться між собою. Підкуповуючи потрібних людей, фінансуючи радикальних членів руху та проводячи бомбардування їхніх ключових військових центрів, ми можемо значно послабити їхню здатність протистояти італійцям."
 USA_Feeding_The_Flames_desc:0 "Одними ввічливими дипломатичними словами ми далеко не заїдемо. Наша моральна підтримка Італії має бути підкріплена військовою силою, інакше вона цілком безглузда. Італійські військові зусилля ще не зазнали повної поразки, але відновлення контролю над Близьким Сходом відбувається небезпечно повільно, а начальник резидентури Колбі повідомляє, що через їхнє поводження з кризою всередині уряду можуть готуватися змови окремих фракцій проти нього. Якщо ми хочемо зберегти Італію під нашим впливом, військове втручання необхідне."
 USA_Sun_Never_Rises_desc:0 "Доступ Японії до нафти десятиліттями був наріжним каменем її зовнішньої політики. Відтоді як Хірохіто посів трон, а фашисти захопили країну, вони шукали способи отримувати нафту для своїх танків і особливо для Імперського японського флоту. Тепер, коли одна половина Близького Сходу воює з іншою, японці мають чудову можливість підтримати переможця та отримати доступ до надійного й багатого джерела нафти.\n\nЦе, звісно, абсолютно неприйнятно для уряду Сполучених Штатів. Адмірал Голловей запропонував план розширити блокаду Перської затоки, включивши до неї перехоплення міжнародних суден, що не належать Саудівській Аравії. Хоча це потребуватиме додаткових ресурсів, план Голловея має надійно не допустити будь-якої японської підтримки в регіон, що стане важливим кроком до відновлення італійського контролю."
 USA_Preparing_The_Coup_desc:0 "Близький Схід від самого початку історії був домом для корумпованих і тиранічних королівств. Саудівська Аравія нічим не відрізняється. Це розсадник екстремістського ісламу та жорстока диктатура, яка, заради всього святого, досі відрубує людям руки мечами за крадіжку! Це означає, що наша боротьба із Саудівською Аравією стане великою визвольною кампанією — звільненням пригнобленого народу чужої землі та принесенням світла демократії на землю, що перебуває в темряві жорстокого абсолютного монарха. Нафта — лише приємний бонус."
 USA_Operation_Checkmate_desc:0 "Саудівці можуть мати значний контроль над своєю країною, але не всі задоволені нинішнім станом правління. Наші агенти зв'язалися з Насіром ас-Саїдом, лідером Народного союзу Аравійського півострова, і зробили йому пропозицію, від якої він не може відмовитися. Ми розробили плани фінансування спроби його організації повалити саудівського короля.\n\nІмовірність того, що цей план завершиться приходом ас-Саїда до влади в Аравії, досить низька, але ймовірність посилення антисаудівських настроїв і дестабілізації їхнього режиму досить висока. ЦРУ дуже впевнене в цьому плані, а директор Гелмс просить нашого схвалення для його реалізації."
 USA_The_Fire_Rises_desc:0 "По всьому Близькому Сходу палають нафтові родовища. Наші фашистські вороги роздмухують полум'я, щоб забрати те, що їм не належить. Армії панарабістів і саудівців воюють між собою, тоді як наші друзі в Італії намагаються повернути мир і порядок у регіон.\n\nАле миру не буде. Чорне золото кличе наддержави з-під пісків, а палаюче серце Близького Сходу з кожним днем розгорається дедалі яскравіше. Ми можемо лише сподіватися, що після завершення цієї катастрофи регіон буде під нашим контролем або принаймні не опиниться під контролем наших суперників."
 USA_Naples_Conference:0 "Неапольська конференція"
 USA_Naples_Conference_desc:0 "Криза, що охопила Близький Схід, а тепер і весь світ, повинна закінчитися. Іншого шляху просто немає. Але наш народ втомився від закордонних експедицій. Спогади про наших хлопців, які поверталися в мішках для трупів із Південної Африки, Індонезії, Філіппін, Західної Африки, Малаї та інших місць, налаштували наш народ проти цих хрестових походів проти фашистської загрози.\n\nАле є інший спосіб завершити цю кризу на нашу користь. Італійці, які так відчайдушно прагнуть повернути свою владу над регіоном, є для нас «ідеальними» союзниками. Ми надамо їм усе необхідне — готівку, обладнання, моральну підтримку — усе, що завгодно, аби покінчити з панарабістською загрозою та відновити порядок на Близькому Сході."
 USA_subsidize_the_Italians:0 "Субсидувати італійців"
 USA_subsidize_the_Italians_desc:0 "Хоча думка про постачання Італії коштів може здаватися скандальною, навіть зрадницькою, ОВН не залишає іншого вибору; італійська економіка перебуває на межі повного краху. Без іноземної допомоги всі держави, що залежать від італійських нафтових інтересів, будуть повалені разом із нею. Тому кожна держава повинна зробити свій внесок — чи то твердою, чи то неконвертованою валютою, — аби не дати італійцям ще глибше зануритися в економічну депресію. Обговорення на Неапольській конференції дали це чітко зрозуміти: Італія потребує допомоги, а ОВН повинна її надати. Спочатку фінансування буде відносно незначним, але з часом майже напевно виявиться, що італійцям потрібно більше грошей, щоб урятувати себе, і Сполученим Штатам Америки доведеться ці гроші надати. Якщо Італія впаде, вона цілком може потягнути за собою весь Вільний світ."
 USA_Seen_And_Not_Heard:0 "Посилити їхні сили"
 USA_Seen_And_Not_Heard_desc:0 "У більшій частині Близького Сходу італійці зазнають поразки, але ще не програли. Просто зараз тисячі італійських солдатів і близькосхідних союзників б'ються проти сил ОПЕК та баасистських повстанців. Однак це програшна битва: їхніх припасів надто мало, а ворогів надто багато. Лише питання часу, коли італійців повністю витіснять із Близького Сходу; тому Сполучені Штати, як і ОВН загалом, повинні надати певну військову допомогу. Якою б відчайдушною не ставала ситуація, американські війська не можуть бути відкрито відправлені для забезпечення волі гегемоністської фашистської Італійської імперії, тому підтримка обмежена. Ми можемо надсилати лише стрілецьку зброю, обладнання, військових аташе тощо."
 USA_Bail_Out_ENI:0 "Врятувати ENI"
 USA_Bail_Out_ENI_desc:0 "ENI, або Ente Nazionale Idrocarburi, є головним італійським постачальником нафти для значної частини Західного світу, або принаймні була ним. Оскільки більша частина Близького Сходу або вибухнула антиіталійськими громадянськими війнами, або приєдналася до ОПЕК і припинила експорт нафти, акції ENI обвалилися, а компанія стала епіцентром того, що вимальовується як одна з найбільших ринкових криз за останні два десятиліття. На цьому етапі ENI фактично збанкрутувала й планує невдовзі подати заяву про банкрутство. Однак якщо це станеться, ситуація лише погіршиться. Щоб запобігти подальшому краху світових ринків, ENI не можна дозволити збанкрутувати. Оскільки італійський уряд уже загруз у фінансових проблемах, уряд Сполучених Штатів повинен врятувати ENI та показати світові, що все буде гаразд."
 USA_Schwarzkopfs_Plan:0 "План Шварцкопфа"
 USA_Schwarzkopfs_Plan_desc:0 "Полковник Норман Шварцкопф є головним американським військовим аташе при італійцях на Близькому Сході. Ветеран як Південної Африки, так і Індонезії, цей чоловік побачив чимало сучасної війни та розуміє, як ефективно вести її. Тому він розробив план, якого мають дотримуватися італійці: передбачається зосередження значних сил для глибокого удару в пустелі Аравії та Єгипту, обходячи й оточуючи ворожі сили. Крім того, оскільки населення може бути не надто прихильним до італійців-окупантів, Шварцкопф передбачив ретельну організацію гарнізонів і патрулів для придушення будь-якого повстання, яке може виникнути. Наразі план Шварцкопфа є лише переліком основних завдань наступу, а деталі ще належить опрацювати, тому полковнику, ймовірно, знадобиться допомога як італійських, так і американських військових, щоб розробити справді комплексну стратегію."
 USA_The_Italian_Desk:0 "Італійський відділ"
 USA_The_Italian_Desk_desc:0 "Ми відправили Вільяма Колбі до Рима під виглядом службовця Державного департаменту. Цей старий лис має десятиліття шпигунського досвіду; якщо хтось і може викорінити гниль в італійському суспільстві, то це він! Переконаймося, що він має необхідні ресурси, аби передавати італійському уряду всю інформацію, яку зможе роздобути про екстремістські угруповання, що розхитують країну. А якщо якась із цієї інформації та фінансування випадково потрапить до антифашистських і проамериканських партій у спосіб, що принесе їм користь на виборах... Що ж, як кажуть: у Римі роби, як римляни."
 USA_Taking_Back_Their_Empire:0 "Повернення їхньої імперії"
 USA_Taking_Back_Their_Empire_desc:0 "Сполучені Штати Америки та Італійська імперія в минулому не мали найстабільніших чи найтепліших відносин, але тепер необхідна співпраця. Якщо італійці зазнають поразки, вони потягнуть за собою весь Вільний світ. Ціни на нафту злетять, ринок обвалиться, і історія повториться. Цього розвитку подій не можна допустити, тому надалі Сполучені Штати повинні повністю й відкрито підтримувати Італію та її імперію. Народ і преса можуть здійняти галас через допомогу колишньому ворогу, але без чорного золота, яке вони постачають, Америка буде поставлена на коліна."
 USA_Cool_The_Lead:0 "Охолодити свинець"
 USA_Cool_The_Lead_desc:0 "Колбі запросив додаткові ресурси, щоб охолодити напружену внутрішню ситуацію в Італії. Він вважає, що зосередження лише на фашистському підпіллі не допоможе врегулювати нинішню нестабільність в інтересах нашої країни. Якщо Італія впаде під владу по-справжньому радикалізованого лівого режиму або зануриться в повну анархію, ймовірність німецького втручання висока. Тому він хоче отримати ресурси для проникнення до більш войовничих комуністичних угруповань, екстремістських студентських організацій і навіть радикальних феміністичних об'єднань. Крім того, він хоче фінансування для створення мережі демократичних політиків і військової верхівки, яка залишатиметься в тилу на випадок німецького вторгнення або спроби радикального перевороту. Навіть якщо ці мережі виявляться нездатними відновити демократичний уряд, вони можуть ускладнити життя новому режиму. Даймо йому те, що потрібно."
 USA_Peace_In_Our_Time:0 "Мир у наш час"
 USA_Peace_In_Our_Time_desc:0 "Важко збалансувати потребу підтримувати італійців із нашим прагненням до мирного врегулювання, але ми знайшли компроміс, який, на нашу думку, може досягти обох цілей. Ми надішлемо підтримку італійцям, навіть військову. Але це буде допомога у вигляді інструкторів, медичних підрозділів, логістичних рот і військової поліції для підтримання миру. Жодного американця не буде на передовій. Світ побачить і цінність нашої дружби, і нашу відданість миру."
 
