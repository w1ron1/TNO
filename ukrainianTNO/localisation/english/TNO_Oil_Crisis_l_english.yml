 #Events
 OIL.500.t:0 "Нафта повинна текти"
 OIL.500.desc:0 "Подібно до вовчиці, яка вигодувала Ромула та його підступного брата Рема, Сполучені Штати прийшли запропонувати Італії допомогу в годину її потреби. Наш новий демократичний союзник, виснажений повстанням на Близькому Сході, має мало шансів утримати свою багату на нафту колоніальну територію без допомоги, яку здатна надати наддержава. Якщо Італії вдасться відновити свій контроль над регіоном, ми не лише зможемо поширити вплив ОВН, а й отримаємо необмежене джерело нафти, готове підтримувати світло в США протягом наступних десятиліть.\n\nОднак, як і майже кожне питання в наші дні, втручання на Близькому Сході стало предметом запеклих дебатів, і в Конґресі сформувалися два табори: ті, хто виступає за непряме втручання шляхом надання італійцям коштів, радників і матеріальних засобів, і ті, хто виступає за пряме військове втручання. Республіканці-демократи здебільшого підтримують обмежене втручання, тоді як НПП виступає за те, щоб обрушити на ворога всю міць збройних сил Сполучених Штатів, але підтримка кожної з політик є по обидва боки партійної межі. Тому дебати є щонайменше запеклими, а в найгіршому випадку — їдкими.\n\nПрихильники прямого втручання стверджують, що італійської армії, об'єднаної з усією силою Сполучених Штатів у бою, більш ніж достатньо, щоб перемогти купки розрізнених пустельних партизанів, і що це забезпечить перевагу ОВН у регіоні на найближче майбутнє. З іншого боку, стверджується, що, хоча непряме втручання, можливо, й не настільки ефективне, його більш ніж достатньо, щоб допомогти Італії самостійно виграти війну та не допустити загибелі тисяч американських хлопців у пісках.\n\nЗі свіжими спогадами про Південну Африку в думках кожного американця війна на Близькому Сході може стати вкрай поляризуючим питанням. Який би ступінь втручання не було обрано, ми повинні бути обережними, щоб не загрузнути в конфлікті, якого не зможемо виграти."
 OIL.500.a:0 "Нам потрібна ця нафта. Відправити війська."
 OIL.500.b:0 "Грати безпечно, італійці впораються з цим."
 OIL.501.t:0 "Орел летить нам на допомогу!"
 OIL.501.desc:0 "У дипломатичному повідомленні з Вашингтона наші найбільші сподівання справдилися: Сполучені Штати погодилися вдатися до прямих дій на Близькому Сході, розгорнувши бойові війська та надавши додаткові кошти, радників і матеріальні засоби!\n\nЦе великий день! Коли за нами стоїть уся міць американських збройних сил, немає жодних шансів, що саудівці чи панарабісти зможуть захопити контроль над Близьким Сходом. За кілька років ми відновимо свій контроль над регіоном, і наше майбутнє як світового постачальника нафти буде гарантовано.\n\nЗалишилося лише підготувати наших хлопців і вирушити в піски. Коли пил осяде, Близький Схід і нова ера процвітання знову опиняться в наших руках."
 OIL.501.a:0 "Золоті часи вже близько!"
 OIL.502.t:0 "Орел приходить нам на допомогу"
 OIL.502.desc:0 "Наш новий союзник, Сполучені Штати, відповів на наші молитви, підтримавши нас у війні проти зрадників і повстанців на Близькому Сході. На жаль, вони не наважилися відправити безпосередньо бойові війська для участі у військових зусиллях, натомість надаючи непряму підтримку у вигляді коштів, радників і матеріальних засобів.\n\nПоставки вже починають надходити, але разом із ними зростає тривога. Якби американські війська були на землі, нас було б неможливо зупинити, але тепер ситуація далеко не визначена. Багато хто з нас був упевнений, що американці прийдуть нам на допомогу, щоб гарантувати свої поставки нафти, і хоча вони допомагають нам, це пекельно мало порівняно з тим, що вони могли б зробити.\n\nУ нас усе ще є хороші шанси, головним чином тому, що ми маємо найсучаснішу, найкраще навчену та найкраще оснащену армію в регіоні, особливо порівняно з корумпованими саудівцями та розрізненими панарабістськими партизанами. Проте, хоча це краще, ніж нічого, очевидно, що ми залишилися самі."
 OIL.502.a:0 "Бийтеся до кінця, хлопці, бо допомоги не буде."
 OIL.503.t:0 "Захід сонця в Бахрейні"
 OIL.503.desc:0 "Стоячи спиною до призахідного сонця, І. Говард Гант, неперевершений оперативник ЦРУ, усміхався, спостерігаючи крізь бінокль, як три японські вантажні кораблі вибухають трійкою величезних вогняних куль. Звісно, вони ходили під прапором Таїланду, але тільки цілковитий дурень не побачив би, що за цим стоїть насправді.\n\nГант не міг не відчути певного тріумфу, хоча війна була далеко не закінчена. Це був останній удар, ляпас Імператору, і не було жодного чортового способу, яким ті скиглії могли б відповісти, не визнавши, що вони постачали зброю ісламістам.\n\nЗагалом це були непогані кілька місяців. Його хлопці з великим успіхом змогли таємно знищити японські шпигунські мережі по всьому Близькому Сходу та перешкодити їхнім поставкам матеріальних засобів партизанам. Без сумніву, японці точно знали, що відбувається, але не могли відповісти, не загостривши напруженість з Америкою. Не допомагало й те, що їхня найближча база впливу була аж у Бенгалії.\n\nГант глибоко вдихнув, насолоджуючись запахом важкого морського повітря, тепер змішаного з далеким смородом диму. Внизу, в порту, пожежники та кули бігали, мов безголові кури, поки кораблі горіли й повільно занурювалися в гавань. Він знайшов своїх агентів і стежив за ними, коли вони пробиралися крізь натовп і один за одним зникали.\n\nСховавши бінокль, Гант потягнувся, відчувши, як хребці хруснули, а потім неквапливо рушив назад униз пагорбом, поки позаду палала гавань. Назустріч сутінкам."
 OIL.503.a:0 "Так само, як в Африці."
 OIL.504.t:0 "Залізний кулак, м'яке зап'ястя"
 OIL.504.desc:0 "Після, здавалося б, нескінченного безладу, яким стала Південна Африка, ми очікували, що наше втручання на Близькому Сході зустріне певний рівень опору, але ми аж ніяк не очікували, що більшість незгоди походить від тих, хто хотів більш прямого протистояння. Схоже, наша програма непрямої допомоги італійцям у вигляді фінансування, матеріальних засобів і радників стала широко вважатися громадськістю та багатьма членами Конґресу неефективною.\n\nПрихильники війни широко критикували політику президента щодо недопущення бойових військ на Близький Схід і закликають нас проводити політику більш прямого втручання на підтримку наших італійських союзників, відправивши війська на землю та посиливши італійські сили власними. За їхніми словами, це зробить війну непереможною для ворога. Деякі навіть припускають, що будь-яке інше рішення президента було б відверто непатріотичним, мовчазним визнанням того, що американські збройні сили не здатні виконати це завдання, що нам недостатньо важливі інтереси наших союзників, щоб їх захищати.\n\nДивно, що після широких антивоєнних настроїв громадськості під час Південноафриканської війни вони стали настільки готовими посилати ще тисячі хлопців помирати в пустелі за цинічні та часто безглузді інтереси національних держав, але маємо те, що маємо. Поширюється багато страху, що без розгортання бойових військ наше втручання на Близькому Сході приречене, а разом із ним і наша економіка. Ми не можемо дозволити, щоб наші поставки нафти були перервані, але чи варта ціна, яку нам, можливо, доведеться заплатити за збереження цього трубопроводу відкритим?"
 OIL.504.a:0 "Хто контролює нафту, той контролює значно більше, ніж нафту."
 #Operation Checkmate
 OIL.505.t:0 "Операція «Мат»"
 OIL.505.desc:0 "В Овальному кабінеті, як завжди, напружений день. Зрештою, від рішень, які приймаються в цій кімнаті, залежить доля мільйонів людей не лише зі Сполучених Штатів, а й усього світу. Цього разу обговорюється можливість здійснення опосередкованої атаки на Саудівську Аравію, щоб дестабілізувати країну та відновити наш контроль над нафтовими свердловинами. На зустрічі з президентом директор ЦРУ Річард Гелмс пояснює переваги операції «Мат». «Ідея полягає в тому, щоб відправити арабських повстанців штурмувати затоку Тарут, Даммам. Саме... сюди», — каже він, вказуючи на карту Саудівської Аравії. Президент [USA.GetPresidentLastName] зводить кінчики пальців. «Кого ми відправляємо виконувати брудну роботу?» — запитує президент. «Купку психів, які називають себе Союзом народів Аравійського півострова. По суті, арабські націоналісти, натхненні тим єгипетським генералом, Насером. У них немає жодного політичного плану чи способу дістатися столиці Аравії».\n\nПрезидент [USA.GetPresidentLastName] раптом починає непокоїтися. «Якщо вони не можуть перемогти, тоді навіщо ми витрачаємо гроші на цей проєкт?» На обличчі Гелмса виступає піт. Президент застав його зненацька цим запитанням. Мабуть, відвертість була не найкращою стратегією. «Мета полягає в дестабілізації монархії, а не у створенні справжнього уряду. Саудівцям доведеться мати справу з партизанами, що зробить їх вразливішими до прийняття наших вимог. Так буде краще: мати справу з групою божевільних націоналістів, які контролюють більшу частину нафти на Близькому Сході, було б складно», — пояснює Гелмс.\n\n«Гаразд. Скільки все це коштуватиме?» — запитує президент. «Це залежить. Якщо ми матимемо достатньо фінансування для операції, ми зможемо більше інвестувати в підготовку та спорядження повстанців. Це збільшить наші шанси на успіх».\n\nПрезидент відкидається в кріслі. «Розумію. Ось що ми зробимо»."
 OIL.505.a:0 "Це не варте витрачених грошей."
 OIL.505.b:0 "Заощадити на інвестиціях."
 OIL.505.c:0 "Ми покажемо саудівцям, хто тут головний."
 OIL.505.d:0 "Вкласти в це кожен останній цент."
 OIL.506.t:0 "Підготовка"
 OIL.506.desc:0 "«Ще раз. Вогонь!» — кричав Ахмед. Двадцять мінометів одночасно вистрілили, утворивши величезні вирви в землі та знищивши решту навчальних мішеней. Кемп-Пендлтон, Вірджинія, був свідком подібних навчань щонайменше пів століття, але цього разу на полі були не американці. «Непогано», — задоволено сказав Ахмед. «Ти значно покращився від минулого разу. Два місяці тому ти ледве розумів, як ці речі працюють. На сьогодні досить. Постарайся добре поїсти й відпочити, бо завтра ми вирушаємо до Флориди відпрацьовувати наші висадки». Ахмед розумів, що до відправлення в Перську затоку залишалося лише шість тижнів. Чи буде цього достатньо, щоб зламати королівську оборону? Ахмед був колишнім працівником ARAMCO. Двадцять років служби в жахливих умовах були винагороджені чотирма пальцями на лівій руці, коли він спробував створити профспілку, люб'язно наданими саудівськими головорізами. Однак два роки служби в ЦРУ з підготовки саудівських дисидентів могли принести плоди, відмінні від понівеченої руки. Мрія про вільну арабську націю здавалася ближчою, ніж будь-коли.\n\nКоли новобранці розійшлися по своїх казармах, до нього підійшов Насір аль-Саїд, лідер Союзу народів Аравійського півострова. Насір познайомив Ахмеда з урядом США, коли вони обоє втекли з країни. «То ці хлопці вже готові принести мені голову короля?» — оптимістично запитав Насір. «Вони покращуються. Можливо, ми зможемо розпалити повстання після того, як розберемося з береговою обороною. Але що ми робитимемо з американцями після того, як захопимо владу? ЦРУ не дуже схоже на благодійну організацію», — зауважив Ахмед. Насір упевнено засміявся. «Пам'ятай про нафтові свердловини, друже. У нас буде те, чого вони хочуть». Ахмед у ту мить побажав мати таку ж упевненість, як його лідер. «До речі, що сьогодні на вечерю?»"
 OIL.506.a:0 "Чи можемо ми довіряти американцям?"
 OIL.507.t:0 "Висадка"
 OIL.507.desc:0 "Десантні човни хитало від сили хвиль Червоного моря. Хоча деякі з солдатів були підготовлені до таких ситуацій, вони не могли уникнути морської хвороби. День «Д» нарешті настав. Навіть Насіру було важко стояти на балконі транспортного корабля USS Lawrence of Arabia, щоб востаннє звернутися до своїх людей. «Хоробрі солдати арабської нації. Ви вирушаєте в хрестовий похід, щоб звільнити наших пригноблених братів і сестер від тиранії монархії!» — кричав він у мегафон. Звук Douglas B-26B прорізав промову Насіра. Ахмед сприйняв це як погану прикмету. Хіба американці вже не повинні були нейтралізувати саудівські військово-повітряні сили? Для успіху операції життєво важливо, щоб їхні десантники могли висадитися без опору. Пілоти, яких ЦРУ надало для підтримки з землі, не виконували свою роботу належним чином.\n\n«Коли ми вступаємо в нашу вирішальну битву, ворог запекло боротиметься, щоб захистити привілеї короля та його поплічників», — продовжив Насір гучнішим голосом. І знову промову революційного лідера перервав цього разу гучний гуркіт саудівської зенітної артилерії. З корабля Ахмед міг припустити, що це, ймовірно, старі моделі часів Другої світової війни. «Але ця битва стане наріжним каменем для побудови майбутнього для наших ді...». Раптом рота з п'яти старих німецьких танків почала обстрілювати транспортні кораблі з берега. Ахмед замислився, чи не були нацисти причиною того, що саудівці так добре знали про операцію. Ймовірно, усвідомлюючи це, Насір не зміг приховати гніву на обличчі. «Знаєте що? До біса все це. Вирушаємо до Ер-Ріяда прямо зараз. Слава арабському народу!» Решта загону Ахмеда підбадьорливо підняла кулаки в повітря. Ахмед відчув, що це найважливіший момент його життя. Битва за долю Аравії мала ось-ось розпочатися."
 OIL.507.a:0 "Побачимо, як усе це пройде."
 OIL.508.t:0 "Аравійські ночі"
 OIL.508.desc:0 "Коли над Даммамом сходить місяць, тіла повстанців вкривають пляжі затоки Тарут. Мрія про вільну арабську націю розбивається під шквальним вогнем кулеметних гнізд. У сум'ятті командос, які мали їх знищити, безладно відступили. Решта людей ледве могла втриматися на пірсі. USS Scheherazade мав доставити більше припасів, але тепер лежить на морському дні. Але коли вас переважають удесятеро, припаси не змінюють ситуації. Це було дивом, що вони взагалі протрималися хоча б один день. «Ти весь цей час мав рацію, Ахмеде. Американці просто використали нас як приманку», — у розпачі вигукнув Насір. Ахмед відчайдушно затискав рану свого друга. Ще двадцять чотири години тому він жартував про те, щоб повісити голову короля на стіні. «Я ще не втрачаю надії. Можливо, арабський народ повстане проти саудівців, а можливо, Насер вторгнеться в регіон. У будь-якому разі я не хочу, щоб ці покидьки так легко відбулися». Ахмед уже нічого не міг зробити. «Чесно кажучи, мені слід було залишитися в Єгипті», — востаннє видихнув Насір.\n\nАхмед віддав належне військове вітання, думаючи про те, як усе пішло шкереберть. Він проклинав ЦРУ за те, що воно відправило їх у цю смертельну пастку без належної підготовки. Як він міг очікувати, що люди, яких самих добряче відлупцювали німці, щось знають про військову справу? Звуки наближення кроків по піску сповнили Ахмеда рішучістю помститися за своїх полеглих товаришів. Арабський офіцер схопив свій кулемет для останньої сутички із саудівцями. Зрештою, це був кращий кінець, ніж бути забитим до смерті штрейкбрехерами за мінімальну зарплату. Коли дюжина солдатів почала обходити його з флангу, він приготувався стріляти. І тут сталося немислиме: його зброя заклинила. «Ви, жадібні шматки лайна, янкі...»"
 OIL.508.a:0 "Смерть мрії."
 OIL.509.t:0 "Прорив"
 OIL.509.desc:0 "Коли опівніч огортає місто Даммам, арабські вигнанці залишають позаду тіла саудівських солдатів і палаючі уламки старих німецьких танків на пляжі. Зазнавши важких втрат на своєму шляху, десантники змогли ефективно нейтралізувати ворожі кулеметні гнізда. USS Scheherazade вивантажив необхідні припаси, які незабаром знадобляться для тривалого маршу через пустелю. Насір мав сумніви щодо ефективности наданого спорядження, але воно чудово впоралося зі своєю роботою. Цього було достатньо, щоб розгромити погано навчене саудівське ополчення та взяти під контроль увесь острів. Розвідувальний патруль повідомив йому про, очевидно, останній саудівський опорний пункт: замок Тарут у Катифі. Схоже, саудівці зробили ставку на останній бій у стародавній фортеці. «Минуле — ідеальне місце для цих щурів, щоб сховатися», — жартома зауважив Насір.\n\nЗ вершини M26 Pershing Насір керував наступом на старий замок, але саудівці не зробили жодної спроби захищатися. На вершині будівлі не було видно ні артилерії, ні кулеметів. «Вони вже хочуть здатися?» — запитав Насір сам себе. З руїн вийшла група солдатів. «Негайно складіть зброю!» — закричав один із людей Насіра, наводячи гвинтівку. І тоді вони впізнали форму людей, які виходили з дверей: це були свої! «То коли ми вирушаємо до Ер-Ріяда?» — пожартував Ахмед. Загін Насіра вибухнув оплесками та сміхом. Ахмед уже передбачив можливість того, що саудівці укріпляться у фортеці, тому подбав про те, щоб зайняти її заздалегідь. Нещасні кілька саудівців, які спробували її відбити, були безцеремонно знищені. «Ти мене до біса налякав, ти неймовірний покидьку», — засміявся Насір."
 OIL.509.a:0 "Сьогодні перемагають араби, але... надовго?"
 OIL.510.t:0 "Звіт про операцію «Мат» — провал"
 OIL.510.desc:0 ""На жаль, результати операції «Мат» виявилися невтішними. Навіть за підтримки авіації повстанці не змогли прорвати берегову оборону. Із 834 людей, яких ми відправили до Даммама, щонайменше 615 загинули або зникли безвісти. Ми не впевнені, чи зможуть решта арабів під тортурами зізнатися в нашій причетності, оскільки це залежатиме від ступеня їхнього фанатизму. Із 46 американських пілотів, призначених для операції, ми втратили лише 3. Один із них упав у розташування ворога, але ми не знаємо, чи скористався він наданою йому капсулою з ціанідом. Одним із головних чинників провалу була недооцінка позицій противника. Саудівці були добре підготовлені до відбиття вторгнення. Цілком імовірно, що німці повідомили їх про операцію, але ми не виключаємо можливості італійського подвійного переходу на бік ворога за нашою спиною. Причина цього нам невідома. Ми також переоцінили як здатність десантників нейтралізувати укріплені позиції противника, так і невдоволення населення нинішнім урядом Саудівської Аравії"\n\n"Повний і детальний аналіз військових та логістичних провалів операції «Мат» уже готується. Такі помилки більше не повторяться. Особливо з огляду на загрозу фашизму, яка щодня зростає по всьому світу. Що стосується уряду Саудівської Аравії, операції меншого масштабу можуть дозволити нам ефективніше завдавати ударів по саудівцях"\n\nПрезидент [USA.GetPresidentLastName] закрив папку зі звітом ЦРУ про операцію, прикривши [GetHerHis] обличчя від розчарування. Після провалу операції «Мат» ЦРУ вжило всіх заходів для ліквідації будь-яких слідів американської причетності до операції. «Можливо, ЦРУ більше не потрібна така свобода дій у подібних питаннях», — подумав президент."
 OIL.510.a:0 "Марнування часу й ресурсів."
 OIL.511.t:0 "Довгий марш"
 OIL.511.desc:0 "Довгий караван повільно й важко просувався суворою аравійською пустелею. Початковий оптимізм після затоки Тарут, здавалося, згасав у міру того, як нескінченне море піску брало своє з революційної армії. Спрага та хвороби спустошували сили Союзу народів Аравійського півострова. Навіть найсильніший запал не міг подолати невблаганну силу природи. Розрахунки Насіра щодо того, що населення підніметься на повстання, виявилися наївно оптимістичними. Хоча деякі люди з навколишніх сіл співпрацювали з ним і навіть приєдналися до нього, більшість саудівців залишалася лояльною або, в кращому разі, нейтральною. У цій безнадійній ситуації Насір скликав екстрену нараду свого військового штабу. «Схоже, ми переоцінили власні можливості щодо швидкого захоплення країни», — зі смутком визнав Насір. Вітер, наповнений піском, невблаганно бив в обличчя арабських офіцерів. «Ми просуваємося вже два дні, а до Ер-Ріяда все ще двісті кілометрів».\n\n«Ахмеде, у якому стані наші сили?» — запитав Насір. «Ми втратили третину людей, пане. Якщо ви питаєте про моральний дух, то...». Ахмед замовк, здавалося, на цілу вічність. Він знав, як і всі в цьому імпровізованому наметі, що вони не мають жодного шансу проти посиленого гарнізону столиці. «Слухайте, я буду чесним. Якщо ми кинемо наших людей проти короля, їх просто переб'ють. Вони вже кілька днів марширують через пустелю», — прямо сказав Ахмед. Жахливе відчуття безпорадності пронизало лідера повстанців, мов стріла в груди. Найбільше його боліло те, що його армія втрачала моральний дух. Якщо його власні люди втратять віру в справу, то який сенс узагалі продовжувати? Насір зробив маленький ковток із пляшки з водою, щоб освіжити думки. «Гаразд, скільки в нас припасів?..»"
 OIL.511.a:0 "..."
 OIL.512.t:0 "Засідка!"
 OIL.512.desc:0 "Насір не встиг закінчити речення. Пролунав гучний звук, після чого на його чолі з'явилася велика червона пляма. Потім він мертвим упав на стіл, утворивши величезну калюжу крові. Безліч куль почали влучати в табір повстанців, поки саудівські розвідники просувалися зі своїх схованок у дюнах. «Засідка! Негайно в укриття!» — закричав Ахмед. Відчайдушні крики інших арабських повстанців лунали здалеку, коли їх одного за одним вистежували. Ахмеду вдалося сховатися за вантажівкою, але іншим членам штабу Насіра пощастило менше — їх розстріляли. Саудівцям якимось чином вдалося їх вистежити. Ймовірно, вони помітили двох солдатів, які пішли по воду до сусіднього села.\n\nПісля смаку перемоги в Даммамі революція Ахмеда розлетілася на мільйон уламків. Але він не збирався здаватися без бою. «Ви, саудівські виродки! Вам доведеться пройти через мій холодний труп!» — люто закричав Ахмед, скосивши дюжину саудівських ополченців, які наближалися до нього. Хоча він, імовірно, не зміг би змінити результат, принаймні він відправить до пекла якомога більше саудівських псів. Смерть його братів по зброї не буде марною. Поглинений власними думками, Ахмед не помітив саудівського снайпера, який цілився йому в спину."
 OIL.512.a:0 "Прощання, сповнене відчаю"
 OIL.513.t:0 "Звіт про операцію «Мат»"
 OIL.513.desc:0 ""Попри деякі перешкоди, результати операції «Мат» були задовільними. Повстанцям вдалося успішно прорвати берегову оборону саудівців і зайняти острів Тарут. Під час висадки вони втратили лише 20% своїх загальних сил, що полегшило проникнення на саудівську територію. Ми втратили лише одного власного пілота, який зник безвісти після падіння в Червоне море. Успіх початкової висадки можна пояснити їхньою попередньою підготовкою до повітряно-десантних операцій. Однак повстанці почали зазнавати справжніх невдач після просування через сільську місцевість. Їхні спроби заручитися підтримкою населення були, у кращому разі, млявими. Крім того, їхні припаси почали закінчуватися, щойно вони увійшли в Аравійську пустелю, а постійні переслідування з боку саудівських сил лише погіршували ситуацію. Тож не дивно, що більшість із них була знищена саудівською армією. На цей момент ми втратили будь-який зв'язок із рештою повстанців, але тепер це вже не наша проблема."\n\n"Проте важливим є вплив на Саудівську Аравію. Сам факт, що купка арабських повстанців ледь не дісталася столиці Саудівської Аравії, найімовірніше, спричинить певні потрясіння всередині саудівського уряду. Ми не виключаємо проведення операцій меншого масштабу для підтримки поміркованішої фракції під час подальшої внутрішньої боротьби". Президент... закрив папку зі звітом про операцію. Це був компетентний план, який дав чимало хороших результатів. «Гадаю, такі заходи ефективніші за дорогі військові авантюри», — подумав президент. «Якщо я правильно розумію, чим займається ЦРУ, вони, схоже, цілком здатні добре виконувати свою роботу»."
 OIL.513.a:0 "Задовільний результат."
 OIL.520.t:0 "Операція «Мат» дала зворотний ефект"
 OIL.520.desc:0 "Спочатку історії про провале арабських націоналістів вторгнення в Саудівську Аравію були десь на останніх сторінках газет, а можливо, й у короткій новині у вечірньому випуску. Зрештою, це був якийсь арабський націоналістичний рух із кумедною назвою, який намагався повалити гнітюче королівство в далекій країні. Були важливіші речі, про які варто було турбуватися, наприклад нафтова криза.\n\nАле сьогодні ті самі газети вже винесли цю історію на перші шпальти, а телевізійні мережі переривали новини, щоб повідомити, що вторгнення насправді було організоване власним Центральним розвідувальним управлінням Сполучених Штатів — спробою змусити Саудівську Аравію прийняти американські вимоги щодо дорогоцінної нафти. Витеклі звіти показали, що недостатні інвестиції ЦРУ в повстанців, а також провали в логістиці, розвідці та підготовці призвели до невдалого нападу на затоку Тарут поблизу епіцентру саудівської нафтової промисловости.\n\nАмериканці по всій країні лютують: одні обурені тим, що ми спонсорували «терористів» для повалення іноземного уряду, інші шаленіють через те, що ми підвели цих хоробрих «борців за свободу» в їхньому прагненні до автономії, а ще інші соромляться відвертої американської агресії та закулісних махінацій, які більше нагадували щось, що могли б вигадати в Германії чи Токіо, а не у Вашингтоні. Президент [USA.GetLeader] та його адміністрація досі не зробили жодної заяви щодо нападу, тоді як вороги уряду в Конґресі та редакціях по всій Америці вимагають покарання винних.\n\nЗрештою, операція «Мат» увійде в американську історію як одна з найбільш необдуманих і бездарних таємних операцій, коли-небудь проведених нашою нацією, погіршивши відносини з нашими друзями та перетворивши нас на посміховисько для наших ворогів."
 OIL.520.a:0 "Я ніколи не був особливо вправним у шахах."
 
 OILflavor.1.t:0 "Урок міжнародних відносин"
 OILflavor.1.desc:0 "Звук ретельних штрихів, ліній і рисок стих, залишивши на дошці лекційної зали крейдяне зображення карти так званого «Mittlerer Osten», Сходу, цього хаосу імперських кордонів, який зовсім нещодавно вибухнув видовищним спалахом полум'я, відомим як «Нафтова криза», і нині є об'єктом зовнішньої політики Райху. Стрілки та примітки позначали різні конфлікти, що точилися в регіоні.\n\nОскільки це справді був курс із зовнішньої політики, професор узяв політику Германії щодо Близького Сходу як чудовий приклад реалполітики найвитонченішого ґатунку. «Отже, клас. Чому ж, у біса, Фюрер вважає за потрібне підтримувати Баас?» — запитав він, додаючи на дошці ще одну лінію, щоб підкреслити слова «Arabische Sozialisten».\n\n«Тому що вони представляють інтереси арійської раси на Близькому Сході?» — відповів студент із першого ряду, розмірковуючи вголос.\n\n«Що ж, точаться академічні дебати щодо того, наскільки араби можуть претендувати на почесне звання аріїв, але ні, аріями їх не вважають. Розширте свої горизонти».\n\n«Тому що... вони підтримують благородні ідеї націонал-соціялізму!» — цього разу відповіла студентка з дальнього ряду.\n\n«Їхньому “соціялізму” особливо бракує расової свідомости — та навіть тоді він представляв би лише погляд окупованого й нижчого народу на якусь хворобливу форму справедливости. Не те».\n\nЦя лінія запитань, вочевидь, виявилася складнішою, ніж професор припускав раніше. Після п'ятої неправильної відповіді він запідозрив, що навіть сам почав сумніватися в причинах німецької участи на Близькому Сході — небезпечна перспектива. Вчений у верхівці Райху виживав лише завдяки правильному тлумаченню дій режиму, а не завдяки їхньому сумніву. Усвідомлюючи, що його мовчання щосекунди викликає дедалі більше підозр, він голосно перебив студента, який саме намагався пов'язати поточну громадянську війну в Єгипті з хрестовим походом Фрідріха Барбаросси, тим, що, на його думку, найменше могло не сподобатися Фольксгалле."
 OILflavor.1.a:0 ""Нафта! Усе це, чорт забирай, через нафту!""
 OILflavor.2.t:0 "Про імперії"
 OILflavor.2.desc:0 "Прогулянка зруйнованими вулицями Дамаска була сюрреалістичною. Стародавні будинки були понівечені вирвами від снарядів, стіни церков, які колись служили для богослужінь прихильникам уже зниклих конфесій, були вкриті слідами від куль... і все це в одній із найменш постраждалих від війни країн Близького Сходу. Томас Ворд ледве міг приховати своє захоплення. Місцевий перекладач, приставлений до нього, — глибоко цинічна, на думку Ворда, людина — мабуть, це помітив. Відчуваючи тиск заповнити мовчання хоч чимось, Томас почав одну зі своїх імпровізованих промов. Зрештою, він збирався написати про цей візит. Краще було заздалегідь відрепетирувати те, що він надішле до New York Times.\n\n«Отже, те, що ви зараз бачите, — результат незначної сутички в грандіозному масштабі подій, чи не так? Незначної сутички порівняно з тим, що відбувається в Багдаді, Каїрі — чорт, навіть в Адені! І все ж це жахливо. Цьому немає пояснення!» Чоловік поруч із ним майже не ворухнувся, що Ворд сприйняв як знак продовжувати.\n\n«Дехто каже, що Сирію найгірше оминула Криза — я не можу з чистою совістю сказати цього, стоячи серед наслідків невеликого протистояння урядових сил з однією-єдиною озброєною групою опору. Знаєте, можливо, країну було врятовано не просто так. Турки славилися порушеннями прав людини в регіоні ще з часів старої Османської імперії — а нова Італійська імперія якимось чином змусила їх здаватися добрими. Багато хто, можливо, забув про Італо-турецьку війну. Другу італо-турецьку війну — це розрізнення, яке більшість людей не вважає за потрібне робити, але я був тут! Ця Епоха імперій справила на людей цієї країни незбагненний вплив—»\n\nПерекладач перебив його. «І це не закінчиться найближчим часом».\n\n«Ну, німці в руїнах, ледве здатні відірвати погляд від Європи. Японський режим тріщить під вагою власного роздутого керівництва».\n\n«Є ще одна така імперія. Я ж не тут для супроводу агента німців чи японців, чи не так? Це та сама держава, яка фінансувала “групу опору”, що зробила це». Чоловік вказав на найближчу калюжу крові."
 OILflavor.2.a:0 "Решту шляху вони пройшли мовчки."
 OILflavor.3.t:0 "До Бейрута з миром"
 OILflavor.3.desc:0 "Крістофер Бут за своє життя побачив чимало бойових дій. Він був свідком війни на Тихому океані, був безпосередньо на землі в Південній Африці й навіть два місяці служив в Індонезії як радник проОВНських сил. Морська піхота зробила з нього чоловіка, після чого його відправляли по всьому світу, щоб робити те саме з іншими чоловіками. Відправлення до Бейрута для підготовки місцевого добровольчого загону було практично відпусткою.\n\nОдин погляд на два десятки чоловіків, яких він мав тут навчити базової підготовки, нічого не зробив, щоб розвіяти це враження. Більшість говорила трохи французькою — добре. Дехто говорив англійською — чудово. Найкраще було те, що більшість юнаків походила з однієї частини міста. Вперше він вважав своє призначення щасливим вибором... але, як це з ними часто буває, невдовзі виникли проблеми.\n\nВін не знав і не цікавився, хто такий мароніт, але очевидна присутність одного з них у його підрозділі занепокоїла двох інших чоловіків, і щойно їх залишили без нагляду, спалахнула сварка. Він уже бачив таке раніше — жителі півдня та південноафриканці, яким було незручно служити поруч із людиною іншого кольору шкіри, — але чоловіки, які сперечалися, були практично однаковими. Гірше того, здавалося, що цей інцидент відкрив усілякі невидимі лінії розколу між чоловіками. Мароніти, мусульмани, шиїти, суніти, навіть вірмени (Звідки тут узялися вірмени?) — усі вони, як виявилося, були представлені в певній кількості. Мабуть, найбільшою помилкою було запитати, чому саме ті двоє сунітських солдатів вирішили почати бійку з одним із маронітів: це розпалило в усій групі суперечку чотирма мовами про родинні ворожнечі, держави хрестоносців XII століття та маловідомі релігійні рухи.\n\nЦе було вже занадто. Після 30 хвилин цього цирку Бут вирішив відправити чоловіків назад до казарм — окремими групами, боронь Боже, щоб вони не зустрілися дорогою назад. Проблеми цієї частини світу здавалися йому цілком чужими, а ніхто в посольстві не збирався бути корисним, доки не закінчиться його служба тут. Що ж, Бейрут, можливо, зрештою виявиться не зовсім відпусткою."
 OILflavor.3.a:0 "Давайте... спробуємо ще раз завтра."
 OILflavor.4.t:0 "Фонд на чорний день"
 OILflavor.4.desc:0 "Тахара Кацу́мі не був прихильником цієї «Нафтової кризи», що обрушилася на світ. Їздити на роботу велосипедом через необхідність економити пальне було найменшою з проблем (хоча непередбачені витрати на сам велосипед таки пробили дірку в його щомісячному доході). Керована ним фабрика, що входила до ланцюга постачання Toyota Industries, була в гіршому стані, ніж будь-коли раніше: затримки поставок, нестача обладнання, неуважні працівники, а кожен звіт від керівництва компанії приносив гірші новини, ніж попередній.\n\nЗрозуміло, звіт за цей місяць змусив його усміхнутися. Хоча Криза так чи інакше вдарила майже по кожній частині японської економіки, настав час для перелому. Через те, що звіт міг пояснити лише «різноманітними замовленнями на закупівлю від невідомих груп з усього Близького Сходу», замовлення на автомобілі Toyota різко зросли, а разом із ними — і прогнозовані доходи фабрики. Нарешті промінь сонця зумів пробитися крізь дощові хмари.\n\nЛише прочитавши звіт від початку до кінця, він зрозумів, що в ньому нічого не сказано про полегшення проблем, з якими зіткнулася фабрика. Єдиний висновок, який він міг зробити, полягав у тому, що їм якимось чином доведеться задовольнити цей сплеск попиту вже на тих обмежених ресурсах, з якими вони працювали. Після короткого просвітку дощові хмари вирішили зімкнутися ще щільніше.\n\nКацу́мі був винахідливою людиною. Дощ чи сонце — це потрібно було зробити. Одразу постали два варіанти. Було відкритою таємницею, що більшість працівників не могла впоратися зі збільшеними через кризу витратами. Досі це вважалося несуттєвим для роботи підприємства, але чи відмовиться більшість працівників від довших робочих годин, якщо це дасть їм шанс оплатити рахунки? Він вирішив, що ні. З іншого боку, він зберігав довгий список контактів, до яких можна було звернутися в такий дощовий день. Зазвичай його недовіра до якости роботи підрядників не дозволила б йому відкрити цю шухляду, але важкі часи вимагали важких заходів, а кінцевий продукт усе одно мав бути відправлений за тисячі кілометрів. Зваживши витрати та переваги кожного варіанту, було вирішено, що:"
 OILflavor.4.a:0 "Працівники будуть вдячні за довші робочі години."
 OILflavor.4.b:0 "Аутсорсинг — метод майбутнього! Спускаємося за списком."
 OILflavor.5.t:0 "Дежавю"
 OILflavor.5.desc:0 "Не минуло й двох днів відтоді, як Йоахім і німецька добровольча армія під його командуванням уперше висадилися на берегах Ходейди під приводом «гуманітарної допомоги», надісланої, щоб позбавити охоплений війною народ Ємену від його безперервних страждань, але здавалося, ніби минула ціла вічність. У цій пекельній дірі не було чим зайнятися, окрім як сидіти в тіні табору й дивитися на гірський пустельний краєвид за його межами або вийти за ворота табору й піддатися палючому сонцю. Йоахім, можливо, служив у подібних умовах під командуванням Роммеля під час своєї служби на північноафриканському фронті, але він уже не був тим самим чоловіком, яким був три десятиліття тому.\n\nВід колишнього себе він залишився лише оболонкою: кістки скрипіли, м'язи боліли, а прогулянка без перепочинку була йому майже не під силу; його мучили недуги старості, ті самі недуги, з яких він колись насміхався в молодості. Змінилося не лише це: погляди, якими араби проводжали його, тепер були сповнені недовіри та люті, а не вигуків і привітань, якими супроводжувалися німецькі перемоги на Близькому Сході під час війни. Тоді він читав місцеві газети з тими крихтами арабської, яких навчився в Лівії, і бачив зображення святкувань та щиру віру в прийдешнє відродження арабів. Вони вітали німецьку армію як визволителів, залізну фалангу, послану Богом, щоб помститися за їхнє поневолення, вселити страх у серця колонізаторів і скинути їхнє іноземне ярмо, звільнивши арабський народ від його кайданів.\n\nАле до кінця війни та краху англо-французьких імперій ця ейфорія мала розвіятися, коли італійський фенікс і турецький натовп, підтримані німцями, накинулися на трупи повалених імперій та прикували ці держави, що прагнули незалежности, до власних імперій, що набирали сили. Зрештою, це був природний порядок речей: нецивілізовані й відсталі раси назавжди служитимуть своїм більш витонченим європейським господарям.\n\nПринаймні саме в це Йоахім завжди вірив, але тепер він опинився тут, служачи арабським повстанцям за незалежність, які прагнули звільнитися від італійського протекторату. Навіщо і заради чого? Він не знав, але це був наказ Фюрера — а всезнаючий Фюрер, непогрішний, яким він є, безсумнівно, мав рацію у своїх мотивах і планах. Його хід думок перервав раптовий прихід суворого на вигляд араба, який покликав його зустріти посланця, що прибував із Германії."
 OILflavor.5.a:0 "Зрада, що насувається, чи виправдання? Араби не знають."
 OILflavor.6.t:0 "Депеша з Каїра"
 OILflavor.6.desc:0 "КАЇР, ЄГИПЕТ — «Режими на Близькому Сході сьогодні нагадують старе гниле дерево. Багато з них хитаються, але важко передбачити, куди вони впадуть. Тут, у Єгипті, ситуація нічим не відрізняється. Натхненні повстаннями в сусідніх країнах, цього тижня жителі Каїра вийшли на вулиці, протестуючи проти уряду, який, за їхніми словами, більше дбає про італійські інтереси, ніж про їхні власні. Заворушення—».\n\nГучний кашель із мокротинням змусив Марка Деніелса з Chicago Tribune підвести погляд від своєї портативної друкарської машинки. Перед ним, у тісному коридорі його готелю, стояв чоловік у формі єгипетської палацової гвардії. У кутику його рота стирчала велика сигара. Він вийняв сигару та знову видав горлом гортанний звук. «Ти той американець, який розпитує про...» Він покрутив рукою із сигарою. «Джерела?»\n\nМарк розгублено усміхнувся. «У мене дедлайн, але, е-е... так. Звісно. А ви хто?»\n\nЧоловік знову вставив сигару до рота. «Я можу провести тебе до палацу за тридцять американських доларів».\n\nМарк кліпнув. Ще раз. «Ти взагалі уявляєш, скільком людям мені вже довелося дати хабар сьогодні? Водій таксі збирався дозволити релігійним фанатикам убити мене, якщо я не дам йому п'ять баксів. Поліцейський зовні погрожував—»\n\n«Двадцять американських доларів за сенсаційний матеріал, як ви кажете. Ніхто більше не пропонує вам такого», — сказав чоловік. Судячи з дорогої сигари, Марк чомусь сумнівався, що це правда. «Можете взяти фотографа й додати ще п'ять доларів — і отримаєте хороші фотографії для своїх босів».\n\nМарк потер перенісся. Бухгалтерія Tribune його вб'є за те, що він субсидує доходи кожного корумпованого охоронця, поліцейського та бюрократа в Єгипті, але вони знали, як добувати джерела, а він не збирався втрачати ексклюзив заради клятого Times. Він відклав друкарську машинку та дістав гаманець."
 OILflavor.6.a:0 "Я дам тобі десять баксів. Це остаточна пропозиція."
 OILflavor.7.t:0 "Війни фарб"
 OILflavor.7.desc:0 "Тільки араби могли битися через паркувальний майданчик, подумав Тошіро. Він та його колеги-радники стояли неподалік від центру Багдада, у заможному районі. Поруч із ними була «площа Газі бін Фейсала», або принаймні так, здавалося, можна було прочитати на вицвілому написі, який хтось намагався стерти. Під цією назвою було «площа Абдул Каріма Касема», а поверх неї намальовано «площа Мішеля Афляка». Здавалося, весь паркувальний майданчик захопили ворогуючі групи малярів, кожна з яких прагнула привласнити собі невелику ділянку, поки автомобілі всередині дедалі більше занепадали.\n\nТошіро зітхнув і намагався не замислюватися про наслідки стану паркувального майданчика. «Панове, сьогодні ми тут, щоб представляти Сферу спільного процвітання в Іраку», — сказав він, дивлячись на своїх колег. «Вкрай важливо, щоб ці араби бачили в нас натхнення, визволителів. Так само, як азійські народи були поневолені західними державами та неприродно розділені, так само розділені й араби. Під проводом Японії народ Багдада може стати сильним, вільним і—».\n\nВін урвався, коли один із його колег нахилив голову, вказуючи позаду нього. Тошіро вчасно обернувся, щоб побачити розлюченого чоловіка з відром фарби, який увійшов на паркувальний майданчик. Він люто дивився на стіну з написом «площа Мішеля Афляка», біля якої Тошіро припаркував свій службовий автомобіль. Коли він зрозумів намір чоловіка, той уже відкривав бляшанку. Тошіро видав розлючений крик, коли криваво-червона фарба полетіла в повітрі."
 OILflavor.7.a:0 "Ну, принаймні автомобіль усе ще може їхати."
 OILflavor.8.t:0 "Місця для курців"
 OILflavor.8.desc:0 "Вільгельму салон лімузина здавався чимось схожим на бджолиний вулик, майже ідентичний вулику, який душили б димом, щоб змусити бджіл замовкнути. Зробивши ще одну затяжку сигарою, представник із питань озброєнь хихикнув. Шофер озирнувся на Вільгельма з широкою усмішкою на обличчі, дивлячись радше з цікавістю, ніж із чимось іншим, і затнувся, коли їхні погляди зустрілися.\n\n«В-Він має бути тут із хвилини на хвилину, пане Штріку». Вільгельм усміхнувся й кивнув чоловікові та знову затягнувся сигарою. Після цього гаданий представник баасистів постукав у вікно, заліз до автомобіля та сів поруч зі своїм товаришем у Софії. «Пане Штріку, скажіть, у Lufthansa все ще дозволяють вам так багато курити?» Вільгельм простягнув коробку із сигарами, яку араб люб'язно відкрив.\n\n«Звісно, ні, пане Ахмаде! Цей автомобіль, мабуть, поступається лише димарям на сході, чи не так?» Ахмад усміхнувся, на його обличчі з'явився вираз незручности, коли він відкинувся на сидінні. «Не хвилюйтеся, справа баасистів, схоже, безпосередньо відповідає інтересам Райху, тому ви — найбезпечніші люди на планеті». Напруження в салоні спало, хоча дим нікуди не зник, і Ахмад дістав із портфеля стос паперів.\n\n«Перше питання: наскільки ми можемо розраховувати на вас щодо постачання вогнепальної зброї?» Вільгельм пирхнув у відповідь і з усмішкою підняв брову.\n\n«Ахмаде, Германія оплачує наші чеки віднині й до кінця світу, тож усе насправді залежить від того, наскільки ви впевнені, що зможете правильно використати зброю. Скільки у вас у резерві?» Запитання, здавалося, ошелешило Ахмада, хоча він явно приховував свою радість, якщо легка усмішка у відповідь щось означала. «Принаймні кілька десятків тисяч, я б сказав, близько 100 000, якщо не помиляюся?»"
 OILflavor.8.a:0 ""Вважайте, що справу зроблено. Очікуйте на результати найближчими місяцями.""
 OILflavor.9.t:0 "Прекрасне місто завдяки Японії"
 OILflavor.9.desc:0 "Вид на Ер-Ріяд був прекрасним; незліченні халупи та будинки, що становили більшу частину краєвиду, були витримані в одному стилі, а жовтувато-бежевий пісок, що вкривав усе навколо, здавався таким знайомим його власному дому, додаючи ще більше деталей для натренованого ока. Оскільки саудівські господарі запізнювалися, більше йому, зрештою, не було чим зайнятися.\n\nУже вкотре глянувши на годинник, він лише тоді помітив, як представник уряду пройшов крізь двері, здавалося, зовсім не усвідомлюючи власного запізнення. Коли саудівець зустрівся поглядами з японським представником, сяючи усмішкою, широкою, наче сама затока, Іно Такахаші вклонився, отримавши такий самий жест від чоловіка, який саме цієї миті, здавалося, вперше спілкувався з кимось зі світу за межами Ер-Ріяда.\n\n«Пане Такахаші, для мене честь бути у вашій присутності; гадаю, ваша подорож була приємною?» Чоловік був весь у поту, кремезний і до найменших деталей відповідав стереотипу запопадливого близькосхідного посіпаки, прагнучи догодити. Саудівець вказав на пару стільців, що стояли біля чудового краєвиду. Сівши, Такахаші поставив свій портфель на стіл і відкрив його, демонструючи безліч папок із манільського паперу та документів.\n\n«Ер-Ріяд справді досить прекрасний, і, судячи з вашого економічного зростання до цього періоду нестабільности, на те були всі підстави. Безумовно, інвестиції Імперії цьому не завадили». Вони обоє засміялися, причому лише Такахаші був упевнений, про яку саме імперію він говорив.\n\n«Так, пане Такахаші. Тепер, гадаю, ви усвідомлюєте загрозу, яку становлять для нас багато наших сусідів, чи не так? Баасизм загрожує знищити нас як внутрішньо, так і зовні, як ми вже бачили на прикладі багатьох із цих сусідів». На чолі чоловіка з'явилася ще одна крапля поту, хоча загалом він сидів майже нерухомо."
 OILflavor.9.a:0 ""Звісно, пане Тахіре. Вам аж ніяк не варто про це хвилюватися.""

