 TNO_Oil_Crisis_dynamic_modifier_desc: "Після недавнього краху нафтової компанії ENI ціни на нафту в усьому світі переживають період стрімких коливань, а спричинені цим заворушення по всьому світу загрожують обвалити світовий ринок загалом.\n\nНезалежно від ідеології, національности чи лояльности, економічні експерти по всьому світу погоджуються лише в одному:\n\nЄдина наша надія на економічне виживання — §Yпережити бурю§! та §Rмолитися про диво.§!"
