 TNO_Oil_Crisis:0 "§RНафтова криза§!"
 TNO_Oil_Crisis_desc:0 "Приріст політичної влади: [?OC_political_power_factor|=%+0]\nПотрібні споживчі товари: [?OC_consumer_goods_factor|%Y0]\nСтабільність: [?OC_stability_factor|=%+2]\nШвидкість будівництва: [?OC_production_speed_buildings_factor|=%+2]\nВиробництво фабрик: [?OC_industrial_capacity_factory|=%+2]\nВиробництво верфей: [?OC_industrial_capacity_dockyard|=%+2]\nСинтетична нафта: [?OC_production_oil_factor|=%+2]\nМодифікатор ставлення до торговельних угод: [?OC_trade_opinion_factor|=%Y2]\nПриріст пального на нафту: [?OC_fuel_gain_factor|=%+2]\nМодифікатор щорічного зростання ВВП: [?OC_annual_gdp_growth_factor|=%+2]\nПропорційна вартість: [?OC_proportional_pop_cost|=%-2]\nМодифікатор вартости особового складу: [?OC_personnel_cost_modifier|=%Y1]\n--------------\nПісля недавнього краху нафтової компанії ENI ціни на нафту в усьому світі переживають період стрімких коливань, а спричинені цим заворушення по всьому світу загрожують обвалити світовий ринок загалом.\n\nНезалежно від ідеології, національности чи лояльности, економічні експерти по всьому світу погоджуються лише в одному:\n\nЄдина наша надія на економічне виживання — §Yпережити бурю§! та §Rмолитися про диво.§!"

