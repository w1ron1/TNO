 #Ministers
 TBA_Horacio_Fernandez_Inguanzo:0 "Орасіо Фернандес Інґуансо"
 POLITICS_HORACIO_FERNANDEZ_INGUANZO_DESC: "Орасіо Фернандес Інґуансо приєднався до PCE під час початку громадянської війни, потрапивши в полон під час останньої відчайдушної спроби відступити до Франції, коли Астурія падала під натиском фашистського наступу. Завдяки помилці в документах Фернандес дивом уникнув страти, вийшовши з в'язниці у 1943 році. Після чергового арешту в 1945 році за антифранкістську діяльність його знову звільнили у 1954 році.\n\nФернандес був однією з ключових постатей у реорганізації PCE в Астурії в роки після громадянської війни. Фернандес та його союзники не могли сидіти склавши руки, коли репресії в регіоні посилювалися, а Іспанська національна хунта залишала без уваги кожен ресторан, яким володів старий уряд Союзу. Саме Фернандес організував повстання проти Хунти, яке призвело до того, що соціалістичні ополченці взяли Астурію під контроль. Саме Фернандес також виступав за співпрацю з Астурійською соціалістичною федерацією, щоб уряд міг заручитися ширшою підтримкою населення.\n\nФернандес не виступав за незалежність від Іспанії, попри повстання Соціалістичної республіки. Однак жодна з іспанських фракцій не представляє майбутнього, якого прагнуть Астурія та її народ, тож Астурія мусить боротися за себе сама. Не буде ні капітуляції, ні здачі, доки голоси Астурії не буде почуто."
 TBA_Decentralized: "Децентралізоване керівництво"
 TBA_Unorganized: "Неорганізоване керівництво"
 TBA_Jose_Barreiro_Garcia: "Хосе Баррейро Ґарсія"

 TBA_Rafael_Alvarez:0 "Рафаель Фернандес Альварес"
 TBA_Rafael_Alvarez_hog_desc:0 "§YГолова Ради міністрів\nСоціалізм§!\n--------------\n§LРафаель Фернандес Альварес був членом Міжпровінційної ради Астурії під час громадянської війни, тож висунути Фернандеса на посаду спікера Ради було нескладним рішенням, зважаючи на його досвід у воєнній політиці. На посаді спікера Ради уряду Фернандес має владу, еквівалентну владі прем'єр-міністра.\n\nФернандес є глибоко впливовим членом Астурійської соціалістичної федерації, місцевого відділення PSOE, однак він не є її лідером. Використовуючи свої зв'язки, він встановив контакт із PSOE в Республіці, але внутрішні чвари партії змусили його замислитися. Це ставить під питання саме майбутнє Астурії: якщо вони складуть зброю та реінтегруються до Республіки, чи буде післявоєнне керівництво справді готове внести необхідні зміни, щоб дозволити Астурії процвітати, зважаючи на їхній нинішній розкол?§!"

 TBA_Manuel_Mondelo:0 "Мануель Мондело Ронда"
 TBA_Manuel_Mondelo_for_desc:0 "§YМіністр закордонних справ\nСоціалізм§!\n--------------\n§LМануель Мондело Ронда був одним із лідерів страйків астурійських шахтарів 1962 року, через що був змушений переховуватися до моменту, коли Союз розпався у громадянській війні. Поряд із роботою шахтарем Мондело також був членом Астурійської соціалістичної федерації та одним із її лідерів. Коли настав час для повстання Астурії, Мондело був призначений радником із закордонних справ.\n\nЗ огляду на обставини Астурії, посада радника із закордонних справ не була надто завантаженою, хоча й передбачала важливі обов'язки. Мондело звернувся до лівих рухів в інших регіональних фракціях і встановив переговори з Республікою. Хоча спільний ворог і може їх об'єднати, головним пріоритетом Мондело є визначити, що станеться між Республікою та Астурією після завершення війни.§!"

 TBA_Felipe_Matarranz:0 "Феліпе Матаранс Ґонсалес"
 TBA_Felipe_Matarranz_sec_desc:0 "§YМіністр збройних сил\nКомунізм§!\n--------------\n§LФеліпе Матаранс, відомий серед своїх товаришів-партизанів під псевдонімом Ель Лобо, боровся проти фашизму в Іспанії ще до початку громадянської війни. Зрештою він потрапив у полон і дивом уникнув страти. Однак після громадянської війни Матаранс продовжив боротьбу проти фашизму, встановивши контакт з іншими астурійськими повстанцями та PCE й ведучи запеклий опір у суворих горах регіону. Тепер, коли Союз розпався, а фашисти нарешті стали вразливими, Матаранс знову взявся за зброю, щоб захистити Астурію.\n\nПризначений радником з оборони, Матаранс використав свої знання про гірський рельєф Астурії, щоб краще координувати ополченців, надаючи інформацію про оптимальні місця для укриття та маршрути, якими, ймовірно, рухатиметься ворог.§!"

 TBA_Amaro_Rosal:0 "Амаро дель Росаль"
 TBA_Amaro_Rosal_eco_desc:0 "§YМіністр економічної організації\nБухаринізм§!\n--------------\n§LАмаро дель Росаль спочатку був членом PSOE і тривалий час вважав, що партії було б вигідно співпрацювати з комуністами з PCE. У 1946 році через цю позицію його виключили з партії у вигнанні, і тому в 1948 році він приєднався до PCE. Однак, попри нову приналежність, Амаро дель Росаль залишався поміркованим у PCE. Саме тому його призначили радником з економіки, оскільки він міг виступати нейтральним кандидатом, якого були готові прийняти обидві фракції.\n\nБудучи радником, Амаро дель Росаль націоналізував кілька ключових галузей промисловості та шахт, значно розширивши права робітників. Використовуючи вироблену цими самими робітниками продукцію як джерело доходу, уряд може підтримувати своє ополчення належно оснащеним і продовжувати боротьбу за майбутнє Астурії.§!"

