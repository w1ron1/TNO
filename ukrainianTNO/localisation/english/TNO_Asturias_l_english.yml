 #War Tree
 l_english:0
 TBA_a_new_red_spark:0 "Нова червона іскра"
 TBA_a_new_red_spark_desc:0 "Вихори історії знову здіймаються, і сьогодні зорі сяють над нами — робітниками Астурії.\n\nЦе був довгий і важкий шлях до того, де ми перебуваємо сьогодні, і багато хто з нас досі не впевнений у тому, яким буде майбутній шлях. Зрештою, нашою метою ніколи не була незалежна Астурія, але й жодна з інших сил навколо нас не здатна здійснити наші цілі.\n\nПопри це, цілком очевидно, що ми, робітники та селяни Астурії, пройдемо цим шляхом у майбутнє самі.\n\nЗвичайно, якщо ми хочемо захистити батьківщину астурійської революції, ми повинні озброїти робітників проти смертоносних іспанських фашистів за межами наших кордонів. Навіть найтемніша ніч зрештою завершиться яскравим червоним світанком."
 TBA_a_new_red_spark_tt:0 "§eАстурія воліє померти стоячи, ніж жити на колінах§!"

 TBA_total_peoples_defense:0 "На захисті іскри"
 TBA_total_peoples_defense_desc:0 "Ми маємо підтримку робітників по всій Астурії, а наша природа, безперечно, робить нас популярними серед робітників сусідніх регіонів, але було б нерозумно витрачати сили та дорогоцінну живу силу на походи за межі наших земель, коли ми маємо астурійських робітників, яких потрібно прихистити, нагодувати і, що найважливіше, захистити.\n\nЗосередьмо наші зусилля на утриманні оборонних позицій. Зрештою, початковою метою нашої Республіки був захист робітників, і ми безумовно не перебуваємо в становищі, щоб здійснювати масштабні завоювання з огляду на наші обставини."

 TBA_the_revolutionary_council:0 "Революційна рада"
 TBA_the_revolutionary_council_desc:0 "Мало хто з нас пам'ятає Суверенну раду Астурії та Леону, що існувала під час громадянської війни, але багато хто знає про її подвиги як великого антифашистського руху опору проти головорізів Франко.\n\nСьогодні ж, коли історія повторюється, ми також беремо сторінку з громадянської війни. Астурійська революційна рада відіграватиме роль авангарду, ведучи робітників Астурії до захисту робітників і побудови соціалізму в Астурії. PCE та PSOE вже почали відігравати роль у її заснуванні, хоча деякі незалежні діячі також виступили вперед, щоб узяти на себе відповідальність як члени. Подальшими зусиллями на підтримку її ролі в астурійському суспільстві ми зможемо по-справжньому утвердити себе як уряд, створений робітниками, з робітників і для робітників!"

 TBA_booby_traps:0 "Пастки, форти, варта"
 TBA_booby_traps_desc:0 "Астурія — земля, яку значною мірою визначають її прибережні скелі та гірські кордони — важкопрохідна для будь-якої армії, але водночас вразлива, якщо її недостатньо захищати.\n\nОчевидно, ми не можемо забезпечити повне прикриття наших кордонів, але можемо створити якомога більше перешкод для підкорення. Повідомлення вказують на фашистські шляхи постачання та каравани, які перетинають або оминають астурійські землі, що свідчить навіть про можливе проникнення фашистів на нашу територію. Якщо ми встановимо пастки вздовж зовнішнього периметра Астурії, на які натраплятимуть військові, то зможемо одночасно затримати можливі масштабні наступи на Астурію та, можливо, захопити певне спорядження з нічого не підозрюючих фашистських конвоїв."

 TBA_raid_their_supply_lines:0 "Непрохані візити"
 TBA_raid_their_supply_lines_desc:0 "Хоча ми спрямували наші зусилля на те, щоб закріпитися та захищати регіони Астурії, економічно й логістично це підштовхнуло нас до руйнування, попри плоди, які ці зусилля принесли в захисті від зовнішніх загроз.\n\nТак чи інакше, кров повинна продовжувати текти. На щастя, військова машина фашистів демонструє величезні запаси саме того постачання, якого нам бракує, і час від часу вони заходять недалеко від доріг, що пролягають достатньо близько до наших кордонів, щоб ми могли... втрутитися та перепрофілювати їх, якщо висловлюватися просто. Тому було б мудрим рішенням створити рейдові загони з метою перетину кордону в пошуках конвоїв і складів, на які ми можемо нападати, порушуючи логістику наших ворогів і повертаючи плоди праці робітників у власні руки."

 TBA_breaking_the_chains:0 "Розірвати кайдани"
 TBA_breaking_the_chains_desc:0 "По горах і полях Астурії мільйон робітників відчайдушно волає перед обличчям навислої загрози смертоносних, гнобительських фашистів.\n\nПринаймні, такою була б реальність, якби ми не взялися за зброю та не почали захищати себе, і вона безумовно стане набагато гіршою, якщо ми провалимо нашу місію із захисту астурійських робітників і селян. Наш народ повинен усвідомити цю реальність і бути переконаним об'єднатися для захисту нашого майбутнього. Тож ми розпочнемо складну та масштабну пропагандистську кампанію, щоб забезпечити лояльність і співпрацю народу, аби він не лише зрозумів суть нашого становища, але й приєднався до нас у цій національній боротьбі."

 TBA_introduce_military_commissars:0 "Запровадити військових комісарів"
 TBA_introduce_military_commissars_desc:0 "Хоча наші ополченці складаються з колись пригноблених астурійських робітників, які наважилися взятися за зброю, щоб захищати свої домівки, фашистські агенти почали показувати свої потворні обличчя, породжуючи демагогів, шахраїв і навіть партизанів, які обдурили наших людей і навіть спричинили серйозні заворушення в самій армії.\n\nМи можемо звернутися до сторінок історії та боротися з цим за допомогою політичних комісарів, які забезпечуватимуть ідеологічну лояльність наших ополченців і триматимуть армію під контролем, щоб фашистські ідеї та відхилення не почали пускати коріння в армії."

 TBA_total_committal_to_the_revolution:0 "Повна відданість революції"
 TBA_total_committal_to_the_revolution_desc:0 "Досягнення наших останніх пропагандистських зусиль продемонстрували величезну відданість народу нашій справі, але цього просто недостатньо. Ми вимагаємо не менш ніж повної відданості Революції та знову звернемося до народу, щоб заручитися його підтримкою.\n\nДехто критикуватиме наші рішення посилити репресії та вимагати від народу більшого, порівнюючи нас із німцями, які оголосили своєму народу «тотальну війну», що привела їх до перемоги в останній Великій війні. Це просто помилкова або навіть оманлива точка зору, яка очорнює нас, порівнюючи з фашистами, яким ми намагаємося чинити опір.\n\nНаша повна відданість Революції ґрунтується на повній поразці фашистів, і ми не повинні вагатися в жодних зусиллях, спрямованих на гідний опір."

 TBA_take_the_fight_to_the_sky:0 "Перенести боротьбу в небо"
 TBA_take_the_fight_to_the_sky_desc:0 "Коли фашисти востаннє лютували в Іспанії, за підтримки темних германських орд їхні чорні крила затуляли небо та панували в повітрі. Було очевидно, що в перемозі, здобутій фашистами в громадянській війні, перевага фашистської авіації проклала шлях до їхнього повного панування над Іспанією.\n\nМи не маємо наміру повторювати ту саму помилку, яка коштувала республіканцям майбутнього Іспанії. Щоб не зазнати тієї самої долі, ми сформуємо й організуємо принаймні невеликі військово-повітряні сили для захисту неба Астурії та відбиття фашистських бомбардувань. Ми ще не можемо використовувати їх для рейдів за межами Астурії, але принаймні можемо захистити себе від повітряних атак і бомбардувань, які задушили б димарі наших фабрик і випалили б життя з наших міст."

 TBA_the_red_motor_brigades:0 "Червоні моторизовані бригади"
 TBA_the_red_motor_brigades_desc:0 "Оборонна ситуація навколо Астурії продемонструвала величезний успіх, тож тепер ми можемо перейти до підготовки масштабніших наступальних дій, щоб захистити й околиці Астурії.\n\nМоторизовані бригади, що складаються з моторизованої техніки, підтримуваної піхотою та артилерією, рухаються швидко й завдають сильних ударів, немов загострений наконечник списа, — що робить їх ідеальними для руху попереду наступального удару, звідси й назва «вістря списа». Посилення наступальних операцій вимагатиме створення та підготовки нових моторизованих бригад — Червоних моторизованих бригад. Із захопленим у фашистів спорядженням та складами зброї й арсеналами Астурії ми безумовно можемо зробити перший крок у розвитку цих нових бригад."

 TBA_the_young_revolutionaries:0 "Полум'я молоді"
 TBA_the_young_revolutionaries_desc:0 "Як усі ми знаємо, близько тридцяти років тому громадянську війну було програно, а ті, кому не вдалося влаштуватися та почати нове життя, залишилися під чорними крилами фашистського режиму. Ці чоловіки й жінки народжували дітей, таємно прищеплюючи їм ідеали й переконання, які робили нас людьми, даруючи їм гідність, якої фашисти позбавили всіх.\n\nСьогодні ці діти виросли й навіть народили власних дітей, передаючи ті самі слова своїх батьків наступному поколінню — і тепер настав остаточний іспит, який покаже, наскільки добре було засвоєно уроки їхніх батьків. Багато молодих астурійців приєдналися до революції та готові віддати свої життя заради майбутнього, яке так жорстоко забрали в них тридцять років тому. Ми повинні звернути на це увагу та подбати, щоб їхній запал і пристрасть не були змарновані."

 TBA_the_party_vanguard:0 "Жарини старого"
 TBA_the_party_vanguard_desc:0 "Колись це була лише чутка, що люди, які свого часу воювали в громадянській війні й зуміли продовжити своє життя навіть за фашистського режиму, досі переховуються серед родин Іберії, чекаючи слушного часу, щоб знищити чобіт, який пригнічував нас протягом кількох десятиліть.\n\nТепер, показавши свої обличчя в розпал цього кривавого кінця Іберії, вони, як і провіщало пророцтво, готові взятися за зброю для доблесного опору. Ветерани PCE та PSOE, загартовані ідеологічно й військово завдяки попередньому досвіду, — саме те, що потрібно Астурії на чолі боротьби з фашистами та збереження Революції. Будучи одними з перших, хто боровся, ми готові зробити їх одними з перших, хто також поведе нас."

 TBA_leading_from_the_front:0 "Вести з передової"
 TBA_leading_from_the_front_desc:0 "Часто кажуть, що війна — це не що інше, як смерть молодих людей заради сварливих старих, і що поки солдати жертвують своїми життями в жахливих умовах, ті, хто ними керує, живуть у комфорті, набиваючи животи вишуканою їжею, тоді як солдати живуть на пайках. Хоча це може бути правдою для феодальних і капіталістичних держав та фашистів, проти яких ми воюємо, щодо нас це просто неправда, і ми прагнемо це довести.\n\nМи забезпечимо регулярні візити керівництва на фронт, демонструючи підтримку військам особисто й показуючи навіть нашим ворогам, що наші лідери готові підкріпити свої слова власними життями. Очевидно, розміщення наших лідерів на бойових позиціях може виявитися катастрофічним, але сама їхня присутність у казармах і штабах неодмінно мотивуватиме солдатів."

 TBA_funding_the_struggle:0 "Підживити вогонь"
 TBA_funding_the_struggle_desc:0 "Як будь-який двигун має працювати на бензині чи дизельному паливі, так і Революції потрібна сильна економіка та доступ до дедалі більших ресурсів, щоб продовжувати працювати. Нехтування чимось настільки життєво важливим, що є кровоносною системою та кров'ю б'ючого серця — Астурійської революції, — стало б фатальною помилкою, якої ми краще не припускатимемося.\n\nЩоб наша боротьба тривала й дожила до сходу сонця кожного нового дня, ми докладемо цілеспрямованих зусиль не лише для запуску, а й для підтримання продуктивності астурійської економіки навіть у ці неспокійні часи, що визначають Революцію. Забезпечення астурійців достатньою кількістю їжі гарантує їхню підтримку та підтримуватиме їхню відданість нашій справі, готовими як боротися, так і виробляти більше зброї."

 TBA_liquidate_private_assets:0 "Ліквідувати приватні активи"
 TBA_liquidate_private_assets_desc:0 "Наші зусилля зі зміцнення астурійської економіки мали переконливий успіх, але це не єдине невикористане джерело доходів. Коли Астурія перебувала під централізованим контролем Іберійського Союзу, тут зберігалися активи кількох впливових фашистських організацій і підприємств — усі вони втекли або іншим чином втратили можливість чинити опір будь-яким нашим спробам захопити їх.\n\nУ багатьох аспектах це чудова можливість посилити наші зусилля зі збільшення економічного виробництва. Усе корисне можна безпосередньо спрямувати на боротьбу з фашистами, а те, що не можна використати, буде безпосередньо ліквідовано й перетворено на резерви."

 TBA_a_call_to_the_world:0 "Запалити маяк"
 TBA_a_call_to_the_world_desc:0 "Немає потреби стояти на самоті, коли інтернаціоналізм завжди був одним із наріжних каменів лівиці, а у світі не бракує товаришів, які охоче допомогли б нам у нашій справі, якби ми лише попросили їх про допомогу в ці відчайдушні часи.\n\nНастав час поширити звістку далеко й широко: Астурія закликає всіх друзів комунізму по всьому світу знову взятися за справу антифашизму в Іберії будь-яким можливим способом, щоб наша червона твердиня могла пережити наступ, що насувається."

 TBA_guns_of_the_revolution:0 "Сірники для нашої революції"
 TBA_guns_of_the_revolution_desc:0 "Карл Маркс свого часу писав про необхідність озброєння робітників — мудрість, якої ми повинні дотримуватися за будь-яку ціну, щоб не бути розчавленими в цій війні, а сили реакції не отримали змоги принести на цю землю ще одну темну добу.\n\nМи озброюватимемося всім, що є доступним, коли сучасної вогнепальної зброї бракує: від музейних експонатів часів Першої громадянської війни до старих гвинтівок часів 1934 року. Усе, що здатне випустити кулю, має нам послужити, щоб ми не залишилися цілком безпорадними."

 TBA_socialize_the_economy:0 "Розпалити його ще сильніше"
 TBA_socialize_the_economy_desc:0 "Потреби війни поки не дозволяють нам реалізувати всю нашу програму, але це не виправдання, щоб не готуватися до цієї неминучості, адже нагальність ситуації дає нам певну свободу дій у реорганізації економіки.\n\nМи почнемо робити кроки, щоб позбутися буржуазного контролю над засобами виробництва та раціоналізувати наш агропромисловий потенціал для кращого задоволення потреб народу й підготувати його до швидкої передачі робітникам."

 TBA_industrial_seizures:0 "Захоплення промисловості"
 TBA_industrial_seizures_desc:0 "Цілком очевидно, що дні буржуазії в суспільстві, яке ми будуємо, полічені, навіть якщо потреби війни не дозволили нам захопити всю приватну промисловість на початку. Але тепер воєнні зусилля необхідно розширювати, і такі поступки лише заважають нам.\n\nЗ цією метою ми захопимо будь-яку приватну промисловість, що залишилася в межах нашої республіки, і передамо її до рук робітників, відданих нашій справі та не обмежених логікою так званого вільного ринку, дозволивши нашій промисловості бути раціоналізованою та спрямованою на доведення цієї війни до кінця."

 TBA_revolution_in_the_universities:0 "Полум'я в університетах"
 TBA_revolution_in_the_universities_desc:0 "Хіба це не прекрасно?\n\nТе, що колись було лише шепотом у печерах і шахтах Авілеса, тепер поширилося вулицями Хіхона та проникло в серця й уми молоді! Хіба немає нічого приємнішого, ніж бачити, як молодь, носії нових революційних думок і запалу, бере до рук зброю та приєднується до нашої справи?\n\nЦі молодші революціонери можуть бути недосвідченими у поводженні зі зброєю, але завзяття їхньої відданості нашому руху не можна залишати без уваги. Можливо, за правильного ідеологічного виховання вони також поведуть наступне покоління світлої та глибокої соціалістичної думки."

 TBA_the_miners_due:0 "Шахтарям належне"
 TBA_the_miners_due_desc:0 "Що утримує життєво важливу основу астурійської економіки, а разом із нею й решту країни, від руйнування та хаосу? Відповідь на це питання можна знайти в простішому: де революційна думка проявляється найяскравіше?\n\nПромисловість, особливо наш великий гірничодобувний сектор, завжди була предметом нашої гордості ще з часів Союзу. Хоча напружені відносини ускладнювали співпрацю між адміністрацією та самими робітниками, що зрештою призвело до значних політичних і соціальних репресій, вони ясно дали зрозуміти, що зацікавлені в соціалістичній реорганізації. Можливо, прислухавшись до їхніх скарг на попередні умови праці, зробивши шахти безпечнішими та підвищивши заробітну плату, ми зможемо заручитися їхньою підтримкою."

 TBA_expand_unions_powers:0 "Розширити повноваження профспілок"
 TBA_expand_unions_powers_desc:0 "Партія є хребтом будь-якого соціалістичного проєкту, але сувора правда полягає в тому, що вона не може робити все сама й не може бути всюди одночасно — принаймні не перетворившись на щось викривлене до невпізнання порівняно зі своїми ідеалами. Однак варто пам'ятати, що в цій боротьбі ми не самі.\n\nUGT та CCOO давно стоять поруч із нами як союзники й товариші в довгій боротьбі проти реакції, тож цілком природно, що ми почнемо доручати їм більше відповідальності в міру розширення сфери діяльності нашого уряду, і вони, безумовно, будуть зацікавлені у зміцненні своєї та нашої присутності на кожному робочому місці регіону."

 TBA_prioritize_gun_production:0 "Надати пріоритет виробництву зброї"
 TBA_prioritize_gun_production_desc:0 "Побудова соціалізму ніколи не мала бути легкою — це шлях, сповнений небезпек і жертв, щоб полум'я робітничої революції не було загашене потоком реакції, який щоразу безвідмовно постає проти нас.\n\nТому, хоч це й прикро, необхідно, щоб цивільна економіка відійшла на другий план, оскільки пріоритет зміщується до виробництва якомога більшої кількості гвинтівок — стільки, скільки є людей, здатних їх носити, і навіть більше, — щоб ми могли дати відсіч тим, хто знову хоче закувати нас у кайдани. Ми можемо лише сподіватися, що ті, за кого ми боремося, зрозуміють цю необхідність."

 TBA_fortify_oviedo:0 "Укріпити наше домашнє вогнище"
 TBA_fortify_oviedo_desc:0 "Коли Іспанію знову охопив наступ громадянської війни, відлуння конфлікту 1936 року швидко повернулися, щойно почали формуватися лінії фронту. На північному заході Іберії лежить стародавнє місто Ов'єдо, колись оплот карлістів минулих часів, а тепер твердиня відродженої держави Астурії.\n\nОскільки перспективи незалежності Астурії від нині роздроблених держав Іспанії вже виглядають сумнівними, ешелонована оборона — єдиний справжній наступальний засіб у нашому арсеналі. Укріпивши місто та прилеглу територію проти неминучого іспанського вторгнення, ми зможемо краще виснажувати Мадрид, доки суверенітет Астурії не буде надійно забезпечений."

 TBA_keeping_the_people_satisfied:0 "У теплі та затишку"
 TBA_keeping_the_people_satisfied_desc:0 "Наша революція — це щось більше, ніж просто виживання. Раніше ми лише виживали, і якщо це стане нашою єдиною метою, то ми приречені повторити помилки тих, хто був до нас, і нічим не кращі за капіталістів, яких ми повалили.\n\nХоча це означатиме менше військового спорядження та обмежить воєнні зусилля, ми надамо пріоритет виробництву цивільних товарів, щоб задовольнити потреби народу та підтримувати його бойовий дух у цей важкий час. Хоча це здобуде нам чимало доброї волі, ми сподіваємося, що це не послабить нас настільки, що все буде втрачено."

 TBA_vanguards_of_the_revolution:0 "Аванґард революції"
 TBA_vanguards_of_the_revolution_desc:0 "Занадто довго народ Іберії був залишений сам на сам із відчаєм і жахом подвійного фашистського режиму. Майже 30 довгих, моторошних і кривавих років маси були змушені загрузати в занепаді деспотичного фашизму — огидної ідеології, яку підтримували мерзенні реакційні постаті Франко та Салазара. Тепер же вони нарешті можуть перевести подих, адже Астурійський робітничий батальйон постав, щоб дати бій фашистській загрозі. Ми — матеріальне втілення волі народу, справжнє вираження його настроїв через засоби народної збройної боротьби та захисники великої революції. Поки буржуазний колаборант, фалангістська наволоч і бюрократичні структури фашистської держави спокійно жили у своїх маєтках, BTA тепер постане, щоб навести страх на цих реакціонерів. Фашисти побудували свою владу на крові робітничого класу, але тепер ми завдамо удару вдвічі сильнішої сили в тому, що стане славною затяжною боротьбою. Фашист пізнає гнів робітничої люті, відчує силу народної волі, а літери «BTA» будуть викарбувані в їхніх проклятих головах як справжній живий привид. Ми тут, товариші, щоб досягти принаймні однієї ключової мети. Помститися за десятиліття тиранії та вбивств.\n\n«Ми не маємо співчуття й не просимо у вас співчуття... ми не виправдовуватимемо терор». — Карл Маркс"
 TBA_vanguards_of_the_revolution_tt:0 "Ми — єдині справжні поборники революції."

 TBA_venceremos:0 "¡Venceremos!"
 TBA_venceremos_desc:0 "Ще кілька років тому таке вважалося б неможливим, навіть фантастикою! Але всупереч усім обставинам ми не лише вижили, а й процвітали, і наша революція виросла з полум'я свічки до пожежі, що випалила темряву реакції по всій землі.\n\nПеремога над фашистами тепер як ніколи близька, а кінець цього кошмару вже в полі нашого зору. Тепер ми повинні йти вперед, і кожен має й надалі робити свій внесок у воєнні зусилля, поки ми мчимо до фінішу в цій гонці за виживання, щоб нарешті звільнитися від цієї проклятої війни."

 #TBA_asymmetric_warfare:0 "Асиметрична війна"
 #TBA_asymmetric_warfare_desc:0 "Наша революція — нетрадиційна, товариші. Ворог переважає нас за озброєнням і силами в усіх аспектах, окрім ідеології. Але самої нашої непохитної волі недостатньо. Щоб безпосередньо дати бій фашистам, ми повинні застосувати більш... нетрадиційні засоби ведення війни. Ми атакуватимемо лише тоді, коли самі цього забажаємо, і відступатимемо, коли ворог перегрупується. Ми завдаватимемо ударів безпосередньо в їхнє серце, у міських центрах, за допомогою вибухів і вбивств. Ми використовуватимемо будь-які доступні нам засоби, якою б не була їхня ціна, і саме завдяки такій формі збройної боротьби фашистський режим буде паралізовано. Боси фашистської держави більше не почуватимуться спокійно через безперервність наших збройних акцій, спрямованих на одну чітку мету. Адже фашисти будуть відчувати до нас огиду, фашисти говоритимуть про нас, а фашисти боятимуться нас. І через цей страх вони будуть паралізовані перед обличчям нашої революції."
 #TBA_raid_their_supply_lines:0 "Рейдувати їхні лінії постачання"
 #TBA_raid_their_supply_lines_desc:0 "Протягом історії ставилося принципове питання. Звідки приходять зміни? Колись привілейовані пихаті особи минулого стверджували, що зміни відбуваються лише завдяки ідеям. Тепер ми знаємо, що це не більше ніж буржуазна маячня. Якби це було правдою, то наші палкі соціалістичні ідеали перемогли б ідеологію реакційного фашизму в останній війні. Але цього не сталося, і ми були приречені на десятиліття страждань. Ми не повторимо тієї самої помилки, адже наша революція ґрунтуватиметься на справжніх матеріалістичних цінностях. Адже зміни приходять із дула гвинтівки.\n\nНашій революції потрібні як матеріальні можливості, так і ідеологічна спроможність протистояти фашистській машині. Щоб задовольнити цю потребу, ми здобуватимемо зброю та інше спорядження, атакуючи ворожі лінії постачання. Ми заберемо те, що по праву є продуктом праці робітника, і використаємо це для забезпечення потреб збройної боротьби проти фашистів. Те, що колись було зброєю реакціонера, стане зброєю соціалізму, і її буде використано без милосердя, щоб втілити наші мрії про помсту."
 #TBA_booby_traps:0 "Пастки"
 #TBA_booby_traps_desc:0 "Фашистська армія нишпорить по робітничій території. Їхні агенти снують і метушаться там, що мало б бути землею робітників, створюючи атмосферу ворожості. Тож ці фашистські бандити цілком заслуговують на кілька прихованих пасток, які вставлять їм палицю в колеса. Відтепер жоден агент фашизму не ходитиме спокійно територією, пов'язаною з BTA, адже наші пастки ловитимуть і калічитимуть кожного фалангістського підлабузника.\n\nДехто може назвати це боягузтвом, але ці ідеалісти мало що знають. Ми протистоїмо, здавалося б, непереможному ворогу, озброєному найновішою зброєю та технологіями. Ми не воюватимемо на умовах, які диктують фашисти, і не воюватимемо «чесно». Кожен доступний нам засіб ведення революційної боротьби буде використано на повну. Лише так буде по-справжньому «чесно»: ми повинні зрівнятися з фашистською військовою машиною нетрадиційними методами, інакше можемо просто припинити боротьбу зараз. А ми, товариші, аж ніяк не з тих, хто здається."
 #TBA_guardias_rojos:0 "Червона ґвардія"
 #TBA_guardias_rojos_desc:0 "Кожна революція потребує аванґарду — дороговказного світла, яке веде маси через діалектичну боротьбу, якою є збройний опір державі та громадянському суспільству. Армія також потребує свого аванґарду, і ним стане Червона ґвардія.\n\nЦі несамовиті, запальні червоні, озброєні найкращою ідеологічною та бойовою підготовкою, стануть одними з наших найвидатніших кадрів, здатних вести революційну війну проти фашистів. Жодна битва не буде непосильною, жодне завдання не буде визнане неможливим і жодна справа не вважатиметься нездійсненною. Червона ґвардія здатна до найвищого рівня революційних дій, і жоден боягузливий ідеаліст чи франкістський підлабузник не зможе їх зупинити. Будь то вбивства, охоронні завдання, вибухи чи навіть теоретичні дискусії — Червона ґвардія виконає необхідні завдання для завершення революційної боротьби. Їхня відданість збройній боротьбі, без сумніву, буде винагороджена плодами соціалістичної революції. Вони є фізичним втіленням озброєної волі мас і, Богом клянуся, вони виконають свою місію або стануть мучениками, намагаючись."
 #TBA_breaking_the_chains:0 "Розірвати кайдани"
 #TBA_breaking_the_chains_desc:0 "Смиренний робітник більше не відчуватиме тягаря гноблення у своєму повсякденному житті. Занадто довго вони були ув'язнені в щоденних нещастях занепадницького капіталізму та закуті в лещата кваз корпоративістської системи. На щастя, цьому часу настав кінець із визволенням робітничого класу від фордистського фашизму, адже ми масово виходимо на боротьбу, щоб звільнити трудящого від його системного гноблення.\n\nІсторія Астурії була історією класової боротьби. Саме тут героїчні шахтарі колись мужньо повстали проти своїх жахливих умов, але зіткнулися зі збройними головорізами правих сил Франко. Однак цього разу історія не повториться. Робітник здобуде своє визволення, підбурений грізними силами BTA. Адже ми маємо величезний арсенал зброї, готовий до боротьби з ненависним фашистом. У нас є рушниці, у нас є динаміт, у нас є кігті, і нам є за що чорт забирай боротися. Ми боротимемося, ми боротимемося, ми боротимемося — нехай вони почують це вночі! Бо фашист чує нас, він знає, що ми налаштовані серйозно, і ми вб'ємо їх усіх, якщо вони прийдуть!"
 #TBA_unity_above_all:0 "Єдність понад усе"
 #TBA_unity_above_all_desc:0 "Поки наша революція впевнено й стабільно просувається вперед, з іншого боку знову постає так звана «революція», що зароджується десь там, у Каталонії. В її основі лежить відродження ненависної ревізіоністської організації, відомої як CNT-FAI. Дехто може закликати до якоїсь «єдності лівих» у нинішній ситуації, в якій ми опинилися, але BTA ніколи не пробачає й не забуває злочинів минулого.\n\nУ 1934 році, коли героїчні шахтарі Астурії повстали проти входження фашистів до уряду, CNT виступила штрейкбрехером проти своїх товаришів-робітників, скоївши явну класову зраду. Засліплена ревізіоністською ідеологією анархо-синдикалізму, CNT знехтувала нашою сміливою страйковою акцією та чинила армії мало або взагалі ніякого опору, коли та прибула залізницями, контрольованими CNT, щоб вирізати повсталих робітників. Хіхон та Авілес були покинуті напризволяще, прирікаючи наш страйк на жорстоке придушення наймерзеннішими ксенофобськими силами правої реакції. Відтоді CNT мало змінилася, і тепер ми засуджуємо її так само рішуче, як і в '34-му. Визволення астурійського робітника — справа самого астурійського робітника, і нам не потрібен жоден зрадницький анархіст-штрейкбрехер у нашій соціалістичній боротьбі."
 #TBA_a_commissar_in_every_unit:0 "Комісар у кожному підрозділі"
 #TBA_a_commissar_in_every_unit_desc:0 "Причин, чому хоробрі, але розгублені ліві ополченці програли останню війну контрреволюційним негідникам, не бракує. Однією з найочевидніших була відсутність чіткої, визначеної та об'єднаної боротьби, яка могла б згуртувати лівих навколо єдиної мети. Натомість революція перетворилася на боротьбу его, оскільки багато хто вважав свою «незалежність» значно нагальнішою справою, ніж повна перемога над армією вбивць Франко. Повторна поразка знову прирекла б Астурію на десятиліття за десятиліттями страждань.\n\nЩоб запобігти цьому огидному майбутньому, серед наших бійців завжди має бути комісар, який забезпечуватиме їхню відданість революції та виконання наказів товариша Інґуансо. Лише так ми зможемо виконати нашу місію — озброєною масою робітників, об'єднаних навколо єдиної боротьби, а комісар буде нагадувати їм саме про це. Комісар вестиме нашу революційну армію вперед і керуватиме нашою великою боротьбою з передової. Це вдячне завдання, яке буде винагороджене здобиччю революції."
 #TBA_not_one_step_back:0 "Ні кроку назад"
 #TBA_not_one_step_back_desc:0 "Що б не сталося в цій війні, ми не можемо дозволити собі програти. Поразка означала б поступитися майбутньому, сповненому постійних убивств, страждань і злоби, які нав'язуватимуть ненависні вороги революції. Наші бійці це знають, адже ми чітко нагадали їм, що може статися з Астурією майбутнього, якщо не залишиться BTA, здатного боротися за просту людину. Жоден із наших бійців не бажає, щоб це жахливе майбутнє стало моторошною реальністю, і тому вони знають, що потрібно робити.\n\nКожен із наших бойовиків, молодий чи старий, чоловік чи жінка, готовий стати мучеником за мрію про соціалістичну державу. Вони не похитнуться; вони не здадуться і не капітулюють. Адже завдяки своїй участі у сміливій і відчайдушній боротьбі BTA вони стали безсмертними. Якщо вони загинуть на полі бою, борючись із фашистською загрозою, їхня пам'ять житиме вічно завдяки перемозі нашого Червоного повстання. Успіх будь-якою ціною, товариші, — лише так ми можемо забезпечити наш тріумф."
 #TBA_a_dream_of_red_iberia:0 "Мрія про революцію"
 #TBA_a_dream_of_red_iberia_desc:0 "Коли товариш Інґуансо спить уночі, йому сниться лише одне. Це мрія про Іберію, вільну від чуми фашизму. Більше ніколи робітників не вбиватимуть лише за сміливість подумати про страйк, більше ніколи простий громадянин не боятиметься висловити свою думку через страх перед фалангістським головорізом, і більше ніколи нам не доведеться жити в жахливих структурах фашистського капіталізму. Адже одного дня Іберія буде вільною від плями фашизму, якою б не була ціна. Це мрія, спільна для всіх у лавах BTA; вона веде нашу боротьбу, немов сяюча зоря вночі. Товариш Інґуансо по-справжньому революційний, коли говорить про цю мрію з масами, адже це справді спільна мрія. Коли ми досягнемо своїх цілей, на нас чекає славне соціалістичне майбутнє. У нас є бачення, тепер залишається лише втілити його в прекрасну реальність."
 #TBA_el_paisano:0 "El Paisano"
 #TBA_el_paisano_desc:0 "Орасіо Фернандес Інґуансо був простим робітником. Через свої прогресивні погляди на боротьбу робітників він став в'язнем режиму Франко. За час перебування в жахливій тюремній системі Франко він віч-на-віч зіткнувся з огидною жорстокістю фашистської ідеології. Як і багато інших марксистських політичних в'язнів до нього, зокрема такі замучені до смерті видатні діячі, як Антоніо Ґрамші та Марія Лакрамп, товариш Інґуансо зазнав невимовної жорстокості з боку найжорстокіших елементів фашистської пенітенціарної системи. Саме в цей виснажливий, здавалося б, нескінченний час товариш Інґуансо пообіцяв покласти край цій клятій нелюдській системі, якою б не була ціна.\n\nТепер, як Червоний каудильйо та головний керівник великого й славного Астурійського робітничого батальйону, товариш Інґуансо прагне помсти системі, яка привела Іберію до її нинішнього стану, понівеченого війною. Він досягне своєї мети — червоної Іберії — або загине, намагаючись, адже революційна збройна боротьба є єдиним способом повністю позбавити цю країну від чуми фашизму."
 #TBA_leading_from_the_front:0 "Вести з передової"
 #TBA_leading_from_the_front_desc:0 "Товариш Інґуансо не з тих, хто сидить позаду, поки інші воюють. Він не якийсь ледачий боягузливий політик, який дозволяє іншим робити за нього брудну роботу, поки сам сидить у затишку власного дому. Нізащо. Товариш Інґуансо веде власним прикладом, перебуваючи на фронті проти ворогів революції. Справжній лідер, вихований на науці революції, виходить назустріч ворогові пліч-о-пліч зі своїми товаришами. Бойовик залишається бойовиком, відданим вічній діалектичній боротьбі, незалежно від своєї посади чи звання. Піти проти цього принципу означало б стати штрейкбрехером, тарганом, ревізіоністом і класовим зрадником. Товариш Інґуансо не є нічим із цього, насправді він — повна протилежність цим реакційним рисам. Він робітник, бойовик, революціонер, соціаліст і, що найважливіше, товариш для всіх. Нам справді пощастило мати такого команданте, готового зробити все заради встановлення соціалізму в найтемніші часи."
 #TBA_revolutionary_government:0 "Революційний уряд"
 #TBA_revolutionary_government_desc:0 "Реакціонери ховаються за кожним рогом. Немов шкідники, вони снують по всій землі, паразитуючи на праці робітничих класів. Їх необхідно винищити, як гризунів, якими вони є, будь-якими необхідними засобами. Для цього ми звернемося до історії, щоб зрозуміти, як найкраще знищити цю ворожу загрозу контрреволюції.\n\nКоли Робесп'єр і Сен-Жюст опинилися оточені боягузами та реакціонерами, вони проголосили Терор і використали гільйотину, щоб знищити контрреволюційні чесноти. Коли більшовики побачили загрозу своїй соціалістичній перемозі над буржуазією, вони спрямували ЧЕКА, щоб загасити полум'я насильницького антикомунізму. Нарешті, під час останньої війни тут, в Іспанії, робітничі ополчення здійснювали революційне правосуддя проти таких класів мракобісся, як землевласники та духовенство. Ми підемо їхнім шляхом і запровадимо власні заходи, щоб навести жах на серце фашистської держави та її прихильників. Буржуазія може називати це «Червоним терором», але ми знаємо, що це просто революційне правосуддя пролетаріату проти його гнобителів. Хоробрі бійці BTA тепер розійдуться по всій землі, щоб виконати цю священну місію."
 #TBA_the_first_stone:0 "Перший камінь"
 #TBA_the_first_stone_desc:0 "Війна проти фашистської тиранії невпинно триває. Це кривава й затяжна боротьба, але водночас необхідна й благородна. На щастя, у нас є надихаючий лідер — великий революціонер товариш Інґуансо, який глибоко піклується про свою громаду, незважаючи на потрясіння народної війни. Народ повинен це знати: збройна боротьба BTA проти занепадницького фашистського капіталізму Іберії є моральною та справедливою.\n\nЩоб донести це послання до народу, товариш Інґуансо виступить перед масами, проголосивши свою величну місію. Адже товариш Інґуансо та його Астурійський робітничий батальйон поведуть пролетарський народ Іберії до остаточної перемоги. Це, товариші, на цьому етапі вже чистий факт. Тепер же наше завдання — переконатися, що громадськість поділяє це переконання, адже повна й абсолютна віра здатна зрушити навіть гори."
 #TBA_funding_the_struggle:0 "Фінансувати боротьбу"
 #TBA_funding_the_struggle_desc:0 "Революція не може існувати лише на самих ідеях. Людина вторинна щодо природи, а природа революції вимагає матеріальних можливостей. Це не товариська вечеря, товариші, — для визволення Іберії від проклятої пошесті фашизму необхідно здобути зброю. Щоб озброїтися для ведення збройної боротьби на вищому рівні, нам знадобляться кошти, а де краще знайти безмірне багатство, ніж на банківських рахунках заможного класу.\n\nДавно вже час «визволити» цих дрібнобуржуазних світських левів від їхнього вкраденого багатства. Роками вони безпосередньо користувалися насильницьким гнобленням робітничого класу та витрачали награбований достаток на бездумне споживацтво. Коли ми здійснимо набіги на їхні маєтки, ми повернемо те, що по праву належить нам. Вони можуть тішитися тим, що їхні активи тепер безпосередньо підуть на боротьбу робітників за визволення, а не на матеріалістичне лайно, на яке гедоністичний клас воліє витрачати свої гроші."
 #TBA_revolutionary_decrees:0 "Революційні декрети"
 #TBA_revolutionary_decrees_desc:0 "Банки є одними з найяскравіших представників панування Капіталу над іберійським суспільством. Вони є механічними інституціями капіталістичного суспільства та безпосередньо сприяють таким лихам, як імперіалізм і фашизм. Ці недуги найвиразніше уособлює постать банкіра — жадібного посередника буржуазного панування, якого мало хвилюють ті, кого він топче, забезпечуючи повсякденне функціонування капіталістичного порядку. Банки доверху наповнені надмірностями кричущого багатства, де накопичувачі Капіталу намагаються зберігати свої гроші в безпеці та надійності. Очевидно, вони не передбачали помсти робітників в особі BTA.\n\nМи тут, щоб пограбувати банки, здобути фінанси, необхідні для революційної боротьби, та спалити ці прокляті будівлі дотла. Неправомірне привласнення багатства триває надто довго, і тепер скромний трудівник може трохи спокійніше відпочити, знаючи, що BTA тут, щоб відновити справедливість. Робітник може відпочивати ще спокійніше, знаючи, що це новоздобуте багатство безпосередньо піде на забезпечення запасів, необхідних для революції."
 #TBA_world_comrades:0 "Товариші по всьому світу"
 #TBA_world_comrades_desc:0 "Як уже було сказано, ми тут, у BTA, не страждаємо від жодного історичного ревізіонізму. Як ґрунтовні дослідники історичного матеріалізму, ми знаємо минуле вздовж і впоперек. Ми особливо добре пам'ятаємо власне минуле та те, що відбувалося в Іберії протягом останнього століття. Ми яскраво пам'ятаємо, чий бік посіла Церква, коли у 1936 році стався фашистський переворот. Замість того щоб вирішити «заступитися за тих, хто не може говорити за себе, за права всіх нужденних» (Приповісті 31:8–9), духовенство вчинило так само, як і будь-який клас землевласників, вважаючи жахи фашизму кращими за перемогу робітників. Що ж, тепер робітники знову повстали, і цього разу не буде жодних кайданів, які завадять нам вести нашу праведну антиклерикальну боротьбу.\n\nЦеркви є домівкою для величних матеріальних предметів із золота та срібла, які так і просяться, щоб їх забрали. Завдяки цьому ми здобудемо ще більше коштів для війни проти фашизму. Ненависний священнослужитель, утім, навряд чи може скаржитися. Адже хіба не сказано в їхній власній священній книзі: «Хто гнобить бідного, той зневажає свого Творця» (Приповісті 14:31). Насправді ми, «язичницькі комуністичні відступники», набагато «побожніші» за будь-кого з цих продавців зміїної олії. Їхнє накопичене багатство тепер піде на спасіння робітників, і жоден священнослужитель, який симпатизує фашистам, не зможе перешкодити нам це зробити."
 #TBA_guns_of_the_revolution:0 "Зброя революції"
 #TBA_guns_of_the_revolution_desc:0 "Якось казали, що озлоблений і втомлений революціонер, доволі легковажно, заявив: «це місце завтра було б раєм, якби кожен наглядач мав пістолет-кулемет». Схоже, дні, коли ми могли сісти й поговорити з нашими гнобителями, справді давно минули. Боротьба революції потребує політичної влади, товариші; політична влада виростає з дула гвинтівки. Політика зброї дає партизанові інструмент, якого ніколи не можна було б отримати через політику реформ. Отже, кошти, які ми так праведно відібрали у капіталістичних корупціонерів суспільства, будуть використані для задоволення потреб політики дула гвинтівки.\n\nМожуть виникнути певні питання щодо того, звідки ми отримали це високотехнологічне озброєння, але зрештою це мало що змінює. Адже мета виправдовує засоби, чи не так? Кому яке діло, від кого ми отримали ці рушниці! Важливо те, як їх буде використано, а використано їх буде для вбивства багатьох фашистських підлабузників. Джерелом можуть бути дещо сумнівні особи, визнаємо ми, але коли все буде сказано й зроблено, саме з цією зброєю буде здобуто свободу робітників. Ми всі йдемо на певні жертви заради революції, і ця угода буде лише однією з багатьох, але з товаришем Інґуансо на чолі BTA завжди робитиме те, що необхідно, водночас не відхиляючись від діалектичної лінії, щоб гарантувати вірну комуністичну революцію."
 #TBA_guns_of_the_revolution_tt:0 "Якщо ми хочемо перемогти буржуазію, нам знадобиться зброя з будь-якого джерела, з якого ми зможемо її отримати."
 #TBA_total_peoples_defence:0 "Тотальна народна оборона"
 #TBA_total_peoples_defence_desc:0 "Досить унікальна боротьба, в якій ми опинилися, вимагає досить унікальних рішень. Перемога є необхідністю в цій війні, товариші, і просто ставати мучениками за програну справу більше недостатньо. У ці виснажливі часи соціалістична боротьба — це питання «зробити або померти», і ми не можемо дозволити собі програти на полі бою. Тому ми розробили справді революційну концепцію ведення війни, яка гарантуватиме перемогу нашої могутньої армії робітників над реакційними варварами.\n\nТотальна народна оборона — це оборонна доктрина тотальної війни. Згідно з цією концепцією, BTA має завдання захищати кордони від агресорів, маючи на меті затримати загарбника достатньо надовго, щоб товариші-бойовики встигли вийти на поле бою та почати виснажувати загарбника партизанською тактикою. Під час цієї великої затяжної народної війни все населення під нашим контролем братиме участь у збройному опорі, виробництві озброєнь і цивільній обороні. Вважається, що для меншої території, такої як наша, це безперечно найкращий спосіб належним чином захиститися від значно сильнішого загарбника. Фашистський звір не знатиме, що його вдарило, коли збройна боротьба по-справжньому розгорнеться і ця доктрина набуде повної сили. Тотальна народна оборона стане нашою визначальною концепцією ведення війни, яка призведе до прямого знищення фашистських армій."
 #TBA_arise_ye_workers:0 "Повстаньте, робітники"
 #TBA_arise_ye_workers_desc:0 "Для кожного робітника в наших володіннях буде честю безпосередньо брати участь у революційній боротьбі. Бути невід'ємною частиною визвольного процесу — це те, про що інші пригноблені народи світу можуть лише мріяти, але тут, в Іберії, BTA створив умови, за яких робітник став власним визволителем. Ми живемо в по-справжньому революційні часи, і саме від нас, тут, у BTA, залежить залучити якомога більшу кількість мас до їхньої власної боротьби за свободу. Це стане визначальним принципом нашої нинішньої кампанії з набору.\n\nДеяких, трохи втомлених від війни громадян, які ще не усвідомили класової свідомості, можливо, доведеться трохи переконати, але ми ж досить переконлива сила, чи не так? На фабриці чи вдома, чоловік чи жінка, старий чи молодий — усі вітаються в революційній боротьбі. Ці нові сповнені завзяття душі стануть масовою основою боротьби BTA. Для цих людей буде великою честю стати частиною революційної сили або мучеником за неї."
 #TBA_a_gun_in_every_hand:0 "Гвинтівка в кожній руці"
 #TBA_a_gun_in_every_hand_desc:0 "Зміни приходять із дула гвинтівки. Це вислів на вустах кожного революційного кадра в наших лавах. А BTA — не дискусійний клуб: коли наші кадри закликають до дій, ми діємо. Ця форма практики відрізняє нашу велику боротьбу від боротьби ревізіонера чи реакціонера, які є лише двома сторонами однієї антикомуністичної монети. Кожен, незалежно від того, які уявлення про його «нездатність» нав'язував капіталізм, є частиною великої боротьби за свободу. Ми боремося за свободу кожного, тож справедливо, щоб народ боровся разом із нами, пліч-о-пліч.\n\nУсі, хто здатен битися, це робитимуть, адже всі будуть озброєні засобами для цього. Адже ми озброюємо цих людей не лише рушницями, а й зброєю ідеології. Озброєні класовою свідомістю та знанням того, що необхідно зробити, жоден фашистський покидьок не зможе зупинити того, хто колись був найскромнішим громадянином. Наші рушниці перевершують зброю буржуазії, адже вони перебувають у руках мас. Кожен чоловік, жінка й дитина будуть готові, якщо фашист коли-небудь постукає у їхні двері, тепер маючи засоби, щоб відбити будь-якого майбутнього гнобителя."
 #TBA_guerrilla_legacy:0 "Партизанська спадщина"
 #TBA_guerrilla_legacy_desc:0 "Недавня історія дала нам дороговказ, можна сказати — сяючий шлях, як спрямувати нашу боротьбу проти потвори фашизму. Ми чули, що на Кубі Че Ґевара допоміг здійснити робітничу революцію завдяки своїй теорії фоко партизанської війни. У тому, що колись було Совєцьким Союзом, ми чуємо від товаришів історії про те, як хоробрі червоні партизани калічать і вбивають нацистських мерзотників із неабияким успіхом. Нарешті, у власній країні ми стали свідками великого повстання робітників у 1934 році, яке шокувало (і позбулося) чимало багатих паразитів, перш ніж було так несправедливо придушене об'єднаним союзом штрейкбрехерів і головорізів Франко. Усі наведені тут приклади мають спільну рису. Це повстання робітника, який стає партизаном перед обличчям непереборних страждань. Коли переслідувані класи, чи то селяни, чи то міські робітники, стикаються з таким систематичним жорстоким поводженням, цілком природно, що вони стають партизанами.\n\nПартизан не знає меж, адже перед ним лише кілька чітких, але важливих цілей. Звільнити свого ближнього від деспотизму та жорстоко помститися тим, хто колись ставився до них як до шкідників. Партизаном може стати будь-хто, незалежно від віку чи статі, аби лише він усвідомлював страждання та прагнув по-справжньому активно протистояти їм. Тепер ми звертаємося до цієї спадщини, щоб відбити фашистську загрозу та звільнити себе від її згубного впливу."
 #TBA_fight_for_utopia:0 "Боротися за утопію"
 #TBA_fight_for_utopia_desc:0 "Наша боротьба ведеться не за жалюгідні крихти, не за короткострокові здобутки й не за егоїстичні спроби захопити владу заради обраних небагатьох. Наша боротьба виходить далеко за межі всієї цієї реформістської маячні. Це боротьба за соціялізм, за робітника та за саме майбутнє людства. Кожен громадянин на нашій території, кожен боєць у наших лавах і кожен посадовець, який допомагає спрямовувати революцію, повинен це знати. Надзвичайно важливо, щоб усі знали, за що вони борються. Ця війна завершиться або утопічним соціялізмом, здійсненим в ім'я робітника, або цілковитим фашистським варварством.\n\nТак багато залежить від битв, які ми ведемо проти ненависного ворога. Коли ми стикаємося з ревізіоністом, реакціонером, багатієм чи контрреволюціонером, надзвичайно важливо, щоб ми виходили з боротьби переможцями. Адже наша перемога не лише звільнить Іберію, але й може надихнути інших розірвати свої кайдани. Нехай наша революція стане дороговказом для всіх, хто прагне свободи, яку приносить соціялізм. Створімо рай на Землі, яким зможуть насолоджуватися всі, і нехай усім буде місце в нашій червоній утопії."
 #TBA_seize_the_factories:0 "Захопити фабрики"
 #TBA_seize_the_factories_desc:0 "Захопити засоби виробництва та безпосередньо передати їх під контроль пролетаріату — це справді велике досягнення, яким не можуть похвалитися багато хто з так званих «революціонерів», що стали ревізіоністами. Більше не гнобитимуть відважних робітників боси та керівники фабрик, диктуючи їм умови праці й заробітну плату. Тепер, коли продуктивні сили перебувають у руках робітничого класу, у його руках перебуває й його доля. Це неймовірне досягнення революційної лінії BTA, яке більш ніж наочно демонструє наші можливості як сили, що діє в інтересах робітників.\n\nТепер потяг, відомий як робітнича революція, вже не зупинити! Адже фабрики Астурії належать робітникам і лише робітникам! Ніщо не здатне зупинити цю непохитну силу, і всіх торкнеться полум'я соціялістичної революції!"
 #TBA_raise_the_red_flag:0 "Підняти червоний прапор"
 #TBA_raise_the_red_flag_desc:0 "Прапор народу — найглибшого червоного кольору; часто він огортав наших замучених мучеників. І тут їхні кінцівки ставали холодними й нерухомими, а кров їхніх сердець забарвлювала кожну його складку".\n\nПроголосити справжній соціялізм — сміливий крок, і здійснити його не здатен жоден буржуазний реформіст. Проте ми тут, у BTA, опинилися в становищі, коли можемо стверджувати, що наша територія справді Червона. Коли Червоний прапор, символ нашої соціялістичної боротьби, майорить над усією територією, що перебуває під контролем BTA, перемога нашої боротьби над реакційними силами з кожним днем стає дедалі очевиднішою. Вони навіть не можуть сподіватися зупинити цю боротьбу; її рух понесе її крізь покоління. Присутність Червоного прапора на полі бою надихнула нашу армію; він наповнює її почуттям обов'язку, до якого капіталізм ніколи не зміг би піднестися. Для BTA є і честю, і привілеєм підняти Червоний прапор так високо, щоб його було видно, куди сягає око. Де б не замайорів цей прапор, там завжди буде надія на соціялістичну революцію.\n\n«Хоч боягузи й здригаються, а зрадники глузують, ми й надалі триматимемо тут Червоний прапор»."
 #TBA_for_whom_the_bell_tolls:0 "За ким дзвонить дзвін"
 #TBA_for_whom_the_bell_tolls_desc:0 "У нашій території досі залишається очевидна проблема зрадників і реакціонерів, які причаїлися серед нас. Вороги революції — непомітна зграя: на відміну від інших фашистів, з якими нам довелося мати справу, вони приховують свої злочини проти народу. Ми не можемо дозволити революції похитнутися на цих ключових етапах і поставити під загрозу все. Тож необхідно вжити відповідних заходів, щоб схопити ворогів народу та віддати їм належне революційне правосуддя.\n\nНаші служби безпеки склали список кількох підозрюваних антикомуністичних змовників, яких ми невдовзі схопимо та віддамо під суд. Але не бійтеся, товариші, адже суд не буде буржуазним. Наше соціялістичне право враховуватиме ширші суспільні потреби революції та ґрунтуватиметься на марксистсько-ленінських принципах, надаючи йому сильну народну орієнтацію на діалектичне та колективістське мислення. Цілком правильно, що ми проводитимемо ці суди в ширшому контексті класової боротьби. Не робити цього означало б розбавити нашу революцію, за яку ми так тяжко боролися. А тепер настав час цим контрреволюціонерам зустрітися зі своїм творцем."
 #TBA_venceremos:0 "Venceremos!"
 #TBA_venceremos_desc:0 "Із глибинного горнила батьківщини здіймаються голоси народу. Новий день сходить над обрієм, коли робітник долучається до заклику BTA.\n\nОстаточна перемога вже близько, великий довгий марш соціялізму почав проникати в життя народу. Це... майже неможливо описати словами — бачити початок кінця світового фашизму. Тут, в Іберії, він знайшов більш ніж гідного суперника в особі авангарду революції, народної армії — великого й славного Астурійського робітничого батальйону. Але це лише початок, товариші, справжній наступ починається зараз. Ми багато чого досягли під час цієї кампанії, але боротьба ніколи по-справжньому не закінчується. Покалічені рештки Франко продовжують дошкуляти нам, але ми не похитнемося, адже жодного кроку назад більше не буде. BTA пливе на діалектичних хвилях революції, адже історія крокує разом із робітником. Нам доведеться розірвати тисячу кайданів, але ми їх розірвемо! Під нашим прапором соціялізм стане нашим майбутнім!\n\nМи переможемо! Ми переможемо!"
 
 # National Spirits 
 TBA_memories_34:0 "Відгомін 34-го року"
 TBA_memories_34_desc:0 "Хоча відтоді минуло вже майже три десятиліття, відлуння Революції 1934 року досі гучно звучить серед тих товаришів, які самі або чиї родичі опинилися втягнутими в хаос Жовтневого повстання.\n\nТоді робітники також повстали проти дедалі більш фашистського режиму Мадрида, борючись за свої права та права своїх товаришів. І так само, як сьогодні, Астурія була на передовій цієї боротьби.\n\nТепер згадки про дві тисячі душ, що загинули внаслідок подальших реакційних репресій, ширяться повсюди як бойовий клич для нинішніх ополченців.\n\nНіколи знову."
 TBA_uncertain_future:0 "Невизначене майбутнє"
 TBA_uncertain_future_desc:0 "Якщо мало що є більш певним за правоту колективного фронту робітників у боротьбі проти фашизму, то питання про те, що буде після боротьби, є зовсім іншою загадкою.\n\nПравда полягає в тому, що прагнення до незалежності далеко не одностайне серед народу Астурії. Водночас варіант приєднання до лібералів Іспанської республіки також не користується великою підтримкою, через що питання майбутнього відкидається убік, поки увага зосереджена на передовій.\n\nУ міру того як затяжний конфлікт дедалі сильніше змушує тимчасовий режим виходити за межі можливостей його поспіхом сформованих інституцій, цю загадку, можливо, доведеться розв'язати набагато раніше, ніж очікувалося. І доки тимчасовий уряд не бажає займати чітку позицію, перед молодою республікою, здається, залишаються відкритими всі шляхи."

 # Events 
 TBA_wars.1.t:0 "Пастка"
 TBA_wars.1.d:0 ""Я назавжди тут застрягну, так?" — застогнав Карлос, дивлячись, як його напарник Мануель безуспішно намагається витягнути його з ями, в яку він упав. Цієї долі Карлос міг би уникнути, якби Мануель не був настільки захоплений звуком власного голосу, що не помітив величезної ями, яка тепер ув'язнила Карлоса.\n\n"Це не працює, Карлос. Яма надто глибока, щоб я зміг тебе витягнути. Я повернуся до табору й приведу допомогу. А ти залишайся тут, добре?" — сказав цей незграбний дурень, перш ніж побігти геть.\n\n"Наче я можу просто піти прогулятися. Не можу повірити, що мене поставили в пару з ним", — сердито пробурмотів Карлос, гадаючи, що він взагалі зробив у житті, щоб його відправили на патрулювання з таким непотребом — людиною, яка наблизилася до форми лише тому, що татусь був якимось нагородженим офіцером і все влаштував. І тепер йому та іншим здібним солдатам доводилося няньчитися з ним, а зараз, замість того щоб завершити патрулювання й піти відпочити після заслуженого дня, він застряг у цій...\n\nЙого думки урвалися, а гнів переплівся з роздумами. Він опинився в пастці буквально, коли озирнувся й зрозумів, що ця яма має ідеальні для цього розміри: достатньо, щоб утримувати людину всередині, але водночас залишати можливість витягнути її пізніше — надто ідеальні, щоб бути природними. Це була пастка. Але хто її встановив?\n\nВін підозрював, що невдовзі дізнається відповідь, коли почув обережні кроки, що наближалися до його позиції, а його очі, призвичаєні до темряви, змогли розгледіти трьох озброєних постатей, які не були його товаришами й дивилися на нього згори."
 TBA_wars.1.a:0 "Жахливий вечір стає ще гіршим."

 TBA_wars.2.t:0 "Ціна свободи"
 TBA_wars.2.d:0 "Арло колись чув, що жертви голоду можуть померти від переїдання, коли їжа знову стає доступною. Він не надавав особливого значення цьому знанню, аж доки тепер не зробив свої перші кроки за межами в'язниці, яка, як він думав, стане його могилою після років за ґратами. Його єдиним злочином було членство в PCE. Перший за багато років смак свободи був таким же лякаючим, як і захопливим.\n\nВін уже змирився з повільною смертю в тій в'язниці, коли сталося несподіване. Режим розвалився, наче картковий будинок, і Іберію накрили хаос та революції. Одна з них звільнила його з клітки й дала зробити перші кроки за межами проклятої будівлі, вдихаючи повітря, яке більше не мало нудотного запаху. Задоволення було миттєвим, коли його розум заповнили питання, над якими йому роками не доводилося замислюватися: що йому тепер робити? Куди йти? Чи залишився хтось із його знайомих зовні після стількох років?\n\nНа останнє питання відповідь знайшлася негайно, коли він побачив два знайомі обличчя, одне з яких так швидко рушило до нього, що він ледь не здригнувся, коли вона міцно його обійняла. Добре було знати, що Кармен залишилася такою ж сильною, як і раніше, а ще краще — побачити одну з рідкісних усмішок його старого товариша Хуана, коли той дивився на цю імпровізовану зустріч. Були сльози, пояснення та запитання, але Арло хотів лише одного. "То що, Хуане, думаєш, я зможу вступити до ополчення, Червоної армії чи хто там зараз воює з фашистами?" — запитав він і не здивувався, побачивши розгубленість на їхніх обличчях.\n\n"Не минуло й дня, а ти ледве ходиш, не те що можеш битися, друже. Може, краще т..." Арло похитав головою й поглянув на нього.\n\n"Я відновлю сили на марші, я готуватиму їжу, робитиму все, що зможу, але я роками жив у безпорадності, і радше помру, ніж знову житиму без мети...""
 TBA_wars.2.a:0 "...навіть секунди довше."

 TBA_wars.3.t:0 "Передати факел"
 TBA_wars.3.d:0 "Він очікував гніву, що йому скажуть, ніби він дурний хлопчисько, який марнує своє життя на речі, які краще залишити в минулому. Він передбачав безліч умовлянь і благань залишитися в безпеці з його останнім родичем. Він навіть був готовий до заперечень, до того, що його дід просто вдаватиме, ніби той нічого не казав, і продовжить жити як завжди.\n\nВін не був готовий до того, що Абуело просто зітхне й дасть йому своє благословення на вступ до ополчення, кинувши юнака в розгубленість і позбавивши його тієї бравади, яку він зібрав для цієї розмови.\n\n"Ти здивований. Я знаю, про що ти думаєш, і це не хитрість. Ти вільний піти й воювати, якщо це справді те, чого ти хочеш. Я навіть не змушуватиму тебе обіцяти повернутися живим. Такої обіцянки ніхто не може дотриматися, тим паче на війні". Він підвівся, і на мить Мануелю здалося, що вік його діда ніби розтанув.\n\n"Але якщо ти збираєшся це робити, тобі спершу багато чого треба навчитися, і відтепер ти слухатимеш усе, що я тобі скажу, якщо не хочеш стати тягарем, коли почнеться стрілянина, зрозумів?" — сказав він тоном, у якому поєднувалися і владність, і турбота.\n\n"Так, звісно, діду. Я зрозумів", — сказав він, не замислюючись.\n\n"Добре. А тепер те, чого я тебе навчу, не замінить досвіду; його ти здобудеш лише завдяки своїм успіхам і невдачам, але принаймні не починатимеш із нуля, а це вже більше, ніж було в мене, коли я був на твоєму місці", — сказав він із сумішшю ностальгії та гіркоти. "І понад усе...""
 TBA_wars.3.a:0 ""...тобі знадобиться удача, багато удачі.""

 TBA_wars.4.t:0 "Школа закінчилася"
 TBA_wars.4.d:0 ""Що значить, мене не пускають?"\n\nАнтоніо професійно стримав бажання закотити очі, дивлячись на свого колишнього колегу Сантьяґо, і повторив те, що вже сказав.\n\n"Вибач, друже, але університетська бібліотека зачинена й залишатиметься такою, доки триває реорганізація університету."\n\n"Так, я почув тебе з першого разу, але не розумію, чому мене не пускають. Мені потрібно отримати доступ до бібліотеки, щоб закінчити навчання, інакше всі гроші та зусилля, які я на це витратив, будуть марними. Ну ж бо, Антоніо, невже ти не можеш пустити мене хоча б цього разу?" — благав він, і Антоніо почав дратуватися через те, що Сантьяґо, здавалося, не помічав очевидного: зараз вони перебували у стані війни.\n\n"Відповідь та сама: бібліотека зачинена, доки начальство не скаже мені інакше. Якщо хочеш чимось зайнятися, університетська рада або ополчення могли б..." — він не закінчив речення, коли помітив, як його колишній товариш по навчанню сердито відходить.\n\n"Та ну вас до біса, мені це не цікаво. Я прийшов сюди вчитися, а не бігати й гратися в революційного героя"\n\n"
 TBA_wars.4.a:0 "Не надто дружня розмова."

 TBA_wars.5.t:0 "" #Поки не підключено, за бажанням можна додати хотфіксом
 TBA_wars.5.d:0 "Двоє солдатів Хунти патрулюють ліс навколо табору. Один перечіплюється через дріт і падає головою в яму, приховану листям. Інший намагається витягнути його, але яма надто глибока, і він не може до нього дотягнутися. Він кричить, що піде по допомогу до табору, залишаючи пораненого солдата самого. Залишившись наодинці, солдат бурчить і думає, який же непотрібний його напарник, аж раптом його осяює думка: хто встановив цю пастку? Його роздуми обриваються, коли він бачить трьох постатей, які спрямували на нього зброю згори ями."
 TBA_wars.5.a:0 ""

 TBA_wars.6.t:0 "" #Поки не підключено, за бажанням можна додати хотфіксом
 TBA_wars.6.d:0 "Двоє солдатів Хунти патрулюють ліс навколо табору. Один перечіплюється через дріт і падає головою в яму, приховану листям. Інший намагається витягнути його, але яма надто глибока, і він не може до нього дотягнутися. Він кричить, що піде по допомогу до табору, залишаючи пораненого солдата самого. Залишившись наодинці, солдат бурчить і думає, який же непотрібний його напарник, аж раптом його осяює думка: хто встановив цю пастку? Його роздуми обриваються, коли він бачить трьох постатей, які спрямували на нього зброю згори ями."
 TBA_wars.6.a:0 ""

 TBA_wars.7.t:0 "Відслужити свій термін у пеклі"
 TBA_wars.7.d:0 "Пил висів у повітрі квартири, не маючи змоги осісти, поки кімната здригалася від вибухів важкої артилерії неподалік. Світло, яке живилося від гучного й пошарпаного генератора, час від часу мерехтіло, занурюючи імпровізований штаб у темряву.\n\nКвартира пустувала ще до початку Війни. Біла фарба відшаровувалася від стін тонкими сірими лахміттями, а майже антикварні побутові прилади, які не можна було викинути, залишалися на своїх місцях. Її обрали нашвидкуруч після того, як прямі влучання поховали головний командний пункт під двадцятьма футами уламків. Ця тісна квартира, переповнена вимогами та наказами, була чи не всім, що залишилося від командування Ов'єдо. Більшість опинилася похованою разом зі своїм штабом.\n\n"Генерале!" — вигукнув радист із колишньої спальні. Його ледве можна було почути крізь гамір квартири, але той, кому він адресувався, якимось надприродним чином його почув. Кремезний чоловік, який виглядав на десять років старшим, ніж мав би, затушив сигарету в переповненій попільничці на обідньому столі. Вибачившись перед натовпом широкооких солдатів за те, що залишає їх, і за чорний попіл, що сипався з попільнички на карти, він протиснувся до іншої кімнати.\n\nРадист не гаяв часу й доповів своєму начальнику. "Терміново. Пост Ронда-Сур знищено. В останньому повідомленні сказано: якщо ми не перекинемо війська, вони швидко прорвуться на схід"\n\nПорожні очі генерала на мить, здавалося, дивилися просто в радіоприймач. "Виведіть цивільних з укриттів, усіх, хто здатен. Дайте їм зброю, будь-що, що може вбивати, — вони нам потрібні", — коротко сказав він.\n\n"Сер, невже це...?"\n\nГенерал розвернувся й попрямував до дверей. "Більше нікого послати", — сказав він, перш ніж протиснутися назад до іншої кімнати."
 TBA_wars.7.a:0 "Ворог був затриманий ще на кілька годин."

