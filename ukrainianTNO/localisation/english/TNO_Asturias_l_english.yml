 #War Tree
 l_english:0
 TBA_a_new_red_spark:0 "A New Red Spark"
 TBA_a_new_red_spark_desc:0 "The whirlwinds of history rise once more and today, the stars shine upon us - the workers of Asturia.\n\nIt was a long and arduous journey to reach where we are today, and many of us are still uncertain of the future to tread. After all, our goals were never an independent Asturias, but our goals would never be fulfilled with any of the others around us.\n\nNevertheless, it is nothing less than clear that we, the workers and peasants of Asturias, are going to walk this path to the future, alone.\n\nOf course, if we are to protect the home of the Asturian revolution, we must arm the workers from the murderous Spanish fascists beyond the frontiers. Even the darkest of nights will end in a bright red sunrise, of course."
 TBA_a_new_red_spark_tt:0 "§eAsturias prefiere morir de pie a vivir de rodillas§!"

 TBA_total_peoples_defense:0 "In Defence of the Spark"
 TBA_total_peoples_defense_desc:0 "We have the the support of the workers across Asturia and our nature certainly makes us popular to the workers of the surrounding regions, but it would be silly to expend any efforts and valuable manpower venturing beyond our lands, when we have Asturian workers to house, feed, and most importantly - protect.\n\nLet us orient our efforts to maintain our defensive positions. After all, the original goal of our Republic was to protect the workers, and we are certainly not in any position to make expansive conquests in the face of our circumstances."

 TBA_the_revolutionary_council:0 "The Revolutionary Council"
 TBA_the_revolutionary_council_desc:0 "Few of us remember the Sovereign Council of Asturias and León which existed during the Civil War, but many of us know of its feats as a great anti-fascist resistance movement against Franco's thugs.\n\nToday, however, as history repeats itself, so too are we to take a page from the Civil War. The Asturian Revolutionary Council will play the vanguard role in leading the workers of Asturias towards the defence of the workers and construction of socialism in Asturia. The PCE and PSOE have begun playing a role in its foundation, though some independents have come forth to take the responsibility of being members. WIth further efforts to support their role in Asturian society, we can truly assert ourselves as being a government by, of and for the workers!"

 TBA_booby_traps:0 "Traps, Forts, Guards"
 TBA_booby_traps_desc:0 "Asturias is a land heavily defined by its coastal cliffs and mountainous frontiers - difficult to traverse for any military though nonetheless vulnerable if insufficiently defended.\n\nObviously we cannot enforce total coverage of our borders, but we can make as many deterrences from subjugation as possible. Reports indicate Fascist supply routes and caravans which cross into or detour in Asturian lands, suggesting even potential Fascist infiltration into our territory. If we were to rig traps along the exterior of Asturias which the military will tread upon, we can simultaneously delay the possibility of larger offensives into Asturias as well as potentially grab some equipment from unsuspecting Fascist convoys."

 TBA_raid_their_supply_lines:0 "Unfriendly Visits"
 TBA_raid_their_supply_lines_desc:0 "While we have oriented our efforts towards bunkering down and defending the regions of Asturia, for the fruits they have bore us in defending ourselves from exterior threats, economically and logistically it has pushed us towards destruction.\n\nOne way or another, the blood must continue to flow. Thankfully, the Fascists' war machine demonstrates an immense wealth in the same supplies we are lacking in - and every now and then they venture not too far from roads which lie close enough to our borders for us to... Intervene and repurpose, to put it simply. For this reason it would be a wise decision to set up raid parties with the purpose of crossing the border in search of convoys and stashes which we can attack, disrupting the logistics of our enemies and putting the fruits of the workers' labours back in our own hands."

 TBA_breaking_the_chains:0 "Break the Chains"
 TBA_breaking_the_chains_desc:0 "Across the mountains and fields of Asturia, one million workers cry out in despair from the looming threat of the murderous, oppressive Fascists.\n\nAt least, this would be the reality were we not to take up arms and defend ourselves, and it certainly will be much worse than this if we are to fail our mission to defend the Asturian workers and peasants. Our people must be made to understand this as reality, and must be convinced to rally together to defend our future. Thus, we will initiate a complex and extensive propaganda campaign to ensure the loyalty and cooperation of the people so that not only will they understand the matter of the situation we are in, but they will us in this national struggle."

 TBA_introduce_military_commissars:0 "Introduce Military Commissars"
 TBA_introduce_military_commissars_desc:0 "Though our militias are comprised of the once-oppressed Asturian workers who dare to take up arms to defend their homes, Fascist infiltrators have begun to show their ugly heads, spawning demagogues, swindlers, and even partisans who have deceived our men and even caused great disruption within the army itself.\n\nWe can take a note from the pages of history and combat this using political commissars, who will ensure the ideological loyalty of our militiamen and keep the army in check, lest the fascist ideas and deviants start to take root in the army."

 TBA_total_committal_to_the_revolution:0 "Total Committal to the Revolution"
 TBA_total_committal_to_the_revolution_desc:0 "The accomplishments of our last propaganda efforts have demonstrated an immense loyalty to our cause from the people, but it simply is not enough. We demand nothing less than total commitment to the Revolution, and we will once again appeal to the people to win their support.\n\nSome will criticise our decisions to further repress and ask more of our people, likening us to the Germans who brought upon their people a "Total War" which brought upon their victory in the last Great War. This is simply a mistaken or even deceptive perspective, one that slanders us by likening us to the Fascists we are trying to resist.\n\nOur full commitment to the Revolution is predicated on the total defeat of the Fascists, and we must not falter in any effort to put up a valiant resistance."
 
 TBA_take_the_fight_to_the_sky:0 "Take the Fight to the Sky"
 TBA_take_the_fight_to_the_sky_desc:0 "When the Fascists last rampaged across Spain, with the support of the dark Germanic hordes their black wings smothered the skies and dominated the air. It was clear that in the victory the fascists achieved in the Civil War, the superiority of the Fascists' air power paved the way to their total domination of Spain.\n\nWe are not inclined to make the same mistake that cost the Republicans' the future of Spain. In order to ensure that we do not fall the same way, we will draft and organise at least a small air force to defend the Asturian skies and chase away the bombs of the Fascists. We cannot yet make any effort to use them for raids outside Asturia, but we can at the very least defend ourselves from aerial attacks and bombing runs which would choke the chimneys of our factories and burn the life out of our cities."

 TBA_the_red_motor_brigades:0 "The Red Motor Brigades"
 TBA_the_red_motor_brigades_desc:0 "With the defensive situation around Asturias having shown immense success, let us now move towards preparing increased offensives to protect the periphery of Asturias too.\n\nMotor brigades, consisting of motorised vehicles supported by infantry and artillery, move fast and hit hard, like the sharpened head of a spear - making them the ideal candidate to move in the front of an offensive thrust, hence being named a "spearhead". The increased offensive operations will require the creation and training of new motor brigades - the Red Motor Brigades. With the captured equipment from the Fascists and the weapons caches and arsenals in Asturias, we can certainly make a headstart on the development of these new brigades."

 TBA_the_young_revolutionaries:0 "The Flame of Youth"
 TBA_the_young_revolutionaries_desc:0 "Some thirty years ago, as we all know, the Civil War was lost, and those who were not managed to settle down and make new lives for themselves even under the black wings of the Fascist regime. Those men and women bore children, in secret instilling in them the ideals and beliefs that made us human, giving them the dignity that the Fascists had stripped from everyone.\n\nToday, those children have grown up and have even bore children of their own, passing the same words from their parents on to their children - and now has come the ultimate test to show exactly to what extent those lessons of their parents were learnt. Many young Asturians have joined in the revolution and are ready to lay down their lives for the future so cruelly taken from them thirty years ago. We must take note and see to it that their fervour and passion are not wastefully expended."

 TBA_the_party_vanguard:0 "The Embers of Old"
 TBA_the_party_vanguard_desc:0 "It was once only a rumour that the people who once fought in the Civil War and managed to continue their lives even under the Fascist regime still lingered among the households of Iberia, waiting for the right time to bring about the destruction of the jackboot that has oppressed us for several decades.\n\nShowing their faces now in the midst of this bloody end of Iberia, as the prophecy foretold they have now made ready to take up arms in valiant resistance. The veterans of the PCE and PSOE, ideologically and militarily hardened from their prior experience, are precisely what Asturias needs at the helm of fighting the Fascists and preserving the Revolution. One of the first to fight, we are ready to make them one of the first to lead, too."

 TBA_leading_from_the_front:0 "Leading from the Front"
 TBA_leading_from_the_front_desc:0 "It is often a criticism that war is nothing but young men dying fighting for bitter old men - and that while soldiers are sacrificing their lives in horrific conditions those in charge live comfortably, stuffing their faces with luxury foods while the soldiers live off rations. While this may be true for the feudal and capitalist states and the Fascists we are fighting, it simply isn't true of us, and we are dedicated to make a point of this.\n\nWe will have the leadership regularly visit the front, showing support for the troops in person and demonstrating to even our enemies that our leaders can put their lives where their mouths are. Obviously, putting our leaders in fighting positions could prove to be disastrous, but their mere appearances at the barracks and headquarters are sure to motivate the soldiers."

 TBA_funding_the_struggle:0 "Feed the Fire"
 TBA_funding_the_struggle_desc:0 "Like any engine must run on petrol or diesel, the Revolution requires a strong economy and access to even more resources to keep itself running. Neglecting something so vital that it makes the lifelines and bloods of the beating heart that is the Asturian Revolution would prove to be a fatal mistake - one that we know better than to make.\n\nTo ensure that our struggle lives on to see the sun rise each day, we will make a dedicated effort to not only jumpstart but keep the Asturian economy fruitful even through these turbulent times that define the Revolution. Keeping Asturians well-fed will secure their support and perpetuate their dedication to our cause, ready to both fight and build more weapons."

 TBA_liquidate_private_assets:0 "Liquidate Private Assets"
 TBA_liquidate_private_assets_desc:0 "Our efforts to bolster the Asturian economy have been resoundingly successful, but it isn't the only source of income left untapped. Asturias while under the central control of the Iberian Union housed the assets of several prominent Fascist organisations and businesses - all of which have fled or are otherwise incapacitated to resist any effort of ours to seize them.\n\nIn more ways than one, this is a golden opportunity to strengthen our efforts to grow our economic output. Everything useful can be allocated straight to the fight against the Fascists, while that which cannot shall be liquidated directly into the reserves."

 TBA_a_call_to_the_world:0 "Lighting a Beacon"
 TBA_a_call_to_the_world_desc:0 "There is no need for us to stand alone when Internationalism has always been one of the cornerstones of the left and the world does not lack comrades who would be eager to aid us in our cause if only we asked them for help in these desperate times.\n\nThe time has come to spread the word far and wide that Asturias calls upon all friends of communism around the globe to once again take up the cause of antifascism in Iberia in any way they can so that our red bastion can survive the oncoming onslaught."

 TBA_guns_of_the_revolution:0 "Matches for Our Revolution"
 TBA_guns_of_the_revolution_desc:0 "Karl Marx once wrote about the necessity of arming the workers, a wisdom we must heed now at all costs lest we be crushed in this war and the forces of reaction are free to bring about another dark age on this land.\n\nWe will arm ourselves with whatever is available when modern firearms are scarce, everything from museum pieces from the First Civil War to old rifles from the days of 1934, anything that can shoot a bullet will have to suffice so that we are not completely helpless."

 TBA_socialize_the_economy:0 "To Ignite It Further"
 TBA_socialize_the_economy_desc:0 "The necessities of war prevent us from being able to implement our full program just yet, but that is no excuse not to prepare for that inevitability as the urgency of the situation gives us leeway when it comes to reorganizing the economy.\n\nWe will begin to take steps toward moving past bourgeois control over the means of production and rationalizing our agro-industrial capacity to serve the needs of the people better and prepare it for handover to the workers soon."

 TBA_industrial_seizures:0 "Industrial Seizures"
 TBA_industrial_seizures_desc:0 "It is abundantly clear that the days of the bourgeoisie are numbered in the society we are building even if the needs of war kept us from seizing all private industry when we started. But now the war effort needs to be expanded and such allowances only hinder us.\n\nTo that end, we will seize any private industry that remains within our republic and place it in the hands of the workers, loyal to our cause and unbound by the logic of the so-called free market and allowing our industry to be rationalized and directed towards seeing this war to its end."

 TBA_revolution_in_the_universities:0 "A Flame in the Universities"
 TBA_revolution_in_the_universities_desc:0 "Isn't it beautiful?\n\nWhat was once a whisper in the caves and mineshafts of Avilés, now made its way through the streets of Gijón and into the hearts and minds of the youth! Isn't there nothing more satisfying than seeing the youth, the bringers of new revolutionary thought and fervour, take up arms and join our cause?\n\nThese younger revolutionaries may be inexperienced with arms, but the tenacity of their devotion to our movement cannot remain unexamined. Perhaps, with the right ideological teachings, they too will lead the next generation of bright, profound socialist thought."

 TBA_the_miners_due:0 "The Miners' Due"
 TBA_the_miners_due_desc:0 "What keeps the lifeline of the Asturian economy, and thereby the rest of the country, from destruction and chaos? The answer to this question can be found from a simpler one: Where does revolutionary thinking find itself most manifest?\n\nThe industry, particularly our large mining sector have always been something we pride ourselves on since the days of the Union - though tense relations strained the cooperation between the administration and the workers themselves, culminating in a significant degree of political and social repression, they have made it abundantly clear that they are interested in a socialist reorganisation. Perhaps by listening to their complaints about their previous conditions, making mines safer and increasing wages, we can win over their support."

 TBA_expand_unions_powers:0 "Expand Unions Powers"
 TBA_expand_unions_powers_desc:0 "The party is the backbone of any socialist project but the hard truth is that it can't do everything by itself nor can it be everywhere at once, at least not without becoming something warped beyond its ideals. However, it is good to remember that we are not alone in this struggle.\n\nThe UGT and CCOO have long stood by us as allies and comrades in the long struggle against reaction, it is only natural that we begin to entrust them with more responsibilities as our government expands its scope and surely they will be interested in bolstering their and our presence in every workplace in the region."

 TBA_prioritize_gun_production:0 "Prioritize Gun Production"
 TBA_prioritize_gun_production_desc:0 "Building socialism was never going to be easy, it is a path fraught with danger and demands sacrifice so that the flame of the workers' revolution is not snuffed out by the flood of reaction that rises against us every time without fail.\n\nThus it is regrettable but necessary that the civilian economy will have to take a back seat as priority shifts to producing as many guns as there are people to carry them and then some so that we can fight back against those who would put us in chains again. We can only hope those we fight for understand the need for this."

 TBA_fortify_oviedo:0 "Fortify Our Hearthfire"
 TBA_fortify_oviedo_desc:0 "With Spain once again racked by the onslaught of Civil War, echoes of the 1936 conflict have been quick to reappear as the battlelines begin to form. To the northwest of Iberia sits the ancient city of Oviedo, once a stronghold of the Carlists of yesteryear and now a bastion for the reincarnated nation of Asturias.\n\nWith the chances of Asturian independence from the now fractious states of Spain already dubious, defense in depth is the only real offense we have in our arsenal. By fortifying the city and surrounding area against inevitable Spanish invasion, we will be better able to bleed Madrid white until Asturias' sovereignty has been firmly secured."

 TBA_keeping_the_people_satisfied:0 "Warm and Comfortable"
 TBA_keeping_the_people_satisfied_desc:0 "Our revolution is about more than just mere survival. Survival was all we did before and if that becomes our sole focus then we are doomed to repeat the mistakes of those who came before us and are no better than the capitalists we overthrew.\n\nThough this will mean less military equipment and limit the war effort, we will prioritize the production of civilian goods to meet the people's needs and maintain their morale in this trying time. Though this will earn us much goodwill, we hope it does not weaken us so much that all is lost."
 
 TBA_vanguards_of_the_revolution:0 "Vanguards of the Revolution"
 TBA_vanguards_of_the_revolution_desc:0 "For too long the people of Iberia have been left alone in the despair and horror of the dual-Fascist regime. For near 30 long, gruesome and bloody years the masses have been left to wallow in the decay of despotic Fascism, a heinous ideology held aloft by the loathsome reactionary figures of Franco and Salazar. Now though, they can finally breathe a moment of reprieve as the Asturian Workers' Battalion has arisen to take the fight to the Fascist menace. We are the material reality of the people's will, the very convention of their attitudes through the means of popular armed struggle and the protectors of the great revolution. Whilst the bourgeois collaborator, the Falangist filth and the bureaucratic entities of the Fascist state once rested easy in their mansions, the BTA shall now arise to put the scare into these reactionaries. The Fascists built their power on the blood of the working class but we will now hit back twice as hard in what is to be a glorious prolonged struggle. The Fascist will know the anger of working-class rage, they shall feel the fury of popular willpower and the letters "BTA" shall be inscribed into their cursed minds as a real-life boogeyman. We are here, comrades, to accomplish at least one key objective. To take our vengeance for decades of tyranny and murder.\n\n"We have no compassion and we ask no compassion from you...we shall not make excuses for the terror." - Karl Marx"
 TBA_vanguards_of_the_revolution_tt:0 "We are the one true champions of the revolution."

 TBA_venceremos:0 "¡Venceremos!"
 TBA_venceremos_desc:0 "A few years ago such a thing would have been deemed impossible, a fantasy even! But against all odds, we have not only survived but thrived and our revolution has grown from a mere candle's flame to an inferno that has burned away the darkness of reaction across the land.\n\nVictory against the fascists is now closer than ever before and an end to the nightmare is within our sights. We must press onwards now and everyone must keep contributing to the war effort as we race to the finish line in this race for survival, so that we may finally be free of this damnable war."

 #TBA_asymmetric_warfare:0 "Asymmetric Warfare"
 #TBA_asymmetric_warfare_desc:0 "Our revolution is an unconventional one comrades. The enemy has us outgunned and outmatched in every aspect except ideology. But our buoyant willpower by itself is not enough. To take the fight directly to the Fascist, we must use more... unconventional means of warfare. We will attack only at times of our choosing and flee when the enemy regroups. We shall strike directly at their heart in the urban centers with bombings and assassinations. We will employ whatever means become available to us, no matter the cost, and it is through this form of armed struggle that the Fascist regime shall be crippled. The boss-men of the Fascist nation will no longer rest easy with the consistency of our armed actions, designed for one clear goal. For the Fascist will be sickened by us, and the Fascist will talk about us, and the Fascist will fear us. And through this fear, they shall become paralyzed in the face of our revolution."
 #TBA_raid_their_supply_lines:0 "Raid Their Supply Lines"
 #TBA_raid_their_supply_lines_desc:0 "A principle question has been asked throughout history. Where does change come from? It used to be posited by the hoity-toity privileged of the past that change occurred merely through ideas. We now know this to be little more than bourgeois bullshit. If it were the truth, then our heartened ideals of socialism would have won out against the ideology of reactionary Fascism in the last war. It was not so, and we were doomed to decades of misery instead. We shall not repeat the same mistake again, for our revolution shall entail true materialist values. For change comes through the barrel of a gun.\n\nOur revolution needs the material capabilities, as well as the ideological capacity, to face down the Fascist machine. To fill this necessity, we shall secure weapons and other equipment by attacking the enemies' supply lines. We will take what is rightfully the product of the worker and use it to fulfill the needs of armed struggle against the Fascist. What was once the weapon of the reactionary will become the weapon of socialism, and it shall be used without mercy to materialize our dreams of revenge."
 #TBA_booby_traps:0 "Booby Traps"
 #TBA_booby_traps_desc:0 "The Fascist army scuttles around the workers territory. Their agents scurry and hassle along what should be the workers land in order to generate an environment of hostility. Thus, these mobsters of Fascism are more than deserving of a few hidden traps to put a spanner in their works. No longer will any agent of Fascism tread lightly along BTA affiliated territory as our booby traps catch out and maim any bootlicking Falangist.\n\nSome may call this cowardly yet these idealists no very little. We face a seemingly insurmountable enemy armed with the very latest arms and technology. We will not fight on the terms dictated by the Fascist and we will not fight "fair". Every possible means available to us to wage revolution shall be utilized to the nth degree. It is only truly "fair" that we match the Fascist war machine by unconventional means or we might as well give up the fight now. And we, comrades, are certainly no quitters."
 #TBA_guardias_rojos:0 "Guardias Rojos"
 #TBA_guardias_rojos_desc:0 "Every revolution needs a vanguard, a guiding light to mentor the masses through the dialectical struggle that is armed resistance against the state and civil society. The army too, needs its vanguard and its vanguard shall come with the creation of the Red Guards.\n\nThese rip-snorting rambunctious Reds, armed with the very best ideological and combat training, will be among our very greatest cadres capable of waging revolutionary warfare against the Fascist. No battle will be insurmountable, no confirmation shall be condemned as impossible and no task will be deemed unworkable. The Red Guards are capable of the highest echelon of revolutionary action and no craven idealist or Francoist bootlicker can stop them in their tracks. Be it assassinations, protection duties, bombings or even theoretical discussion, the Red Guards will accomplish the necessary tasks to complete the revolutionary struggle. Their loyalty to the armed struggle will no doubt be rewarded with the fruit of socialist revolution. They are the physical embodiment of the masses armed will and, by God, they will accomplish their mission or be martyred trying."
 #TBA_breaking_the_chains:0 "Breaking The Chains"
 #TBA_breaking_the_chains_desc:0 "The humble worker shall no longer feel the burden of oppression in his everyday life. For too long, they have been entrapped in the day to day misfortunes of decaying capitalism and have been caged in the workings of the quasi-corporatist system. Thankfully, this time is set to end with the liberation of the working class from Fordist Fascism as we arrive, on mass, to free the working man from his structural oppression.\n\nThe history of the Asturian has been one of class struggle. It was here once, that the heroic miners valiantly rebelled against their toxic conditions only to be met by the armed thugs of Franco's rightists. On this occasion though, history will not repeat itself. The worker shall realize his liberation, spurred on by the fearsome forces of the BTA. For we have an almighty arsenal of weaponry ready to combat the hated Fascist. We have guns, we have dynamite, we have claws, and we've got a hell of a lot to fight. We will fight, we will fight, we will fight and let them hear it in the night! Because the Fascist can hear us, they know we mean it and we'll kill all if they come!"
 #TBA_unity_above_all:0 "Unity Above All"
 #TBA_unity_above_all_desc:0 "Whilst our revolution progresses at a strong and steady pace, there remains another resurgent so called "revolution" emerging from over yonder in Catalonia. At its heart, lies the re-emergence of the hated revisionist organization known as the CNT-FAI. Some may call for some kind of "left unity" in the current situation we find ourselves in, but the BTA never forgives nor forgets the crimes of the past.\n\nIn 1934, when the heroic miners of Asturias rebelled against the entry of Fascists into the government, the CNT turned scab on their fellow workers in a clear act of class treachery. Made blind by the revisionist ideology of anarcho-syndicalism, the CNT dismissed our brave strike action and gave the army little to no resistance when they rode in to butcher the workers revolt on CNT controlled railroads. Gijón and Avilés were left abandoned, condemning our strike to be ruthlessly put down by the most heinous xenophobic forces of rightist reaction. The CNT have changed little since that time and we condemn them as strongly now as we did in '34. The liberation of the Asturian worker is the job of the Asturian worker alone and we need no treacherous anarchist scab involved in our socialist struggle."
 #TBA_a_commissar_in_every_unit:0 "A Commissar In Every Unit"
 #TBA_a_commissar_in_every_unit_desc:0 "There are no shortage of reasons as to why the brave, yet confused, leftist militias lost the last war against the counter-revolutionary cads. One glaring reason was the lack of a clear, defined, united struggle that could coalesce the left in a single objective. Instead, the revolution became one of egos as many considered their "independence" as a far more pressing matter than total victory against Franco's army of murderers. To lose again would sentence Asturias once more to decades upon decades of anguish.\n\nTo stop the occurrence of this odious future, there must always be a commissar amongst our fighters to ensure their loyalty to the revolution and enforce Comrade Inguanzo's orders. It is only through this way that our mission can be accomplished, with an armed mass of workers that are united behind a single struggle and the commissar is there to remind them precisely of this. The commissar shall lead the way in our revolutionary army and direct our great struggle from the frontlines. It is a thankful task and one that shall be rewarded through the spoils of revolution."
 #TBA_not_one_step_back:0 "Not One Step Back"
 #TBA_not_one_step_back_desc:0 "Whatever may happen in this war, we cannot be allowed to lose. To lose would be to give in to a future of constant murder, misery and maliciousness directed by the hated enemies of the revolution. Our fighters know this, for we have acutely reminded them what may occur in a future Asturias with no BTA able to fight for the common man. Not one of our fighters wish for this awful future to become a harrowing reality and thus, they know what must be done.\n\nEvery one of our militants, be they young or old, man or woman, is ready to become a martyr for the dream of a socialist state. They will not falter; they will not surrender and they will not capitulate. For, through their participation in the BTA's bold and daring struggle, they have become immortal. Should they die in the field of combat against the Fascist menace then their memory shall live on forever through the victory of our Red rebellion. Success at all cost's comrades, it is only through this way that our triumph can be assured."
 #TBA_a_dream_of_red_iberia:0 "A Dream Of Revolution"
 #TBA_a_dream_of_red_iberia_desc:0 "When Comrade Inguanzo sleeps at night, he dreams of one thing and one thing only. It is a dream of an Iberia that is free from the scourge of Fascism. No longer would workers be murdered for even daring to think about strike action, no longer would the common citizen be scared to speak their mind in fear of the Falangist thug and no longer would we have to live in the horrifying structures of Fascist-Capitalism. For one day, Iberia will be free of the stain of fascism, no matter the cost. It is a dream shared by all within the BTA ranks; it guides our struggle like a shining star in the night. Comrade Inguanzo is truly revolutionary when he speaks of this dream to the masses for it truly is a mutual dream. It will be a glorious socialist future when we achieve our goals. We have the vision, now all that is needed to do is to make it a beautiful reality."
 #TBA_el_paisano:0 "El Paisano"
 #TBA_el_paisano_desc:0 "Horacio Fernández Inguanzo was but a worker. Due to his progressive beliefs on the workers struggle, he was made a prisoner of the Franco regime. During his time in Franco's wretched prison system he came eye to eye with the repulsive cruelty of Fascist ideology. Like many other Marxist political prisoners before him, including martyred greats such as Antonio Gramsci and María Lacrampe, Comrade Inguanzo faced unspeakable brutality committed to him by the most vicious parts of the Fascist prison system. It was during this gruelling, seemingly never-ending time, that Comrade Inguanzo promised to end this god-awful inhumane system no matter the cost.\n\nNow as the Red Caudillo and head-honcho of the great and glorious Asturian Workers' Battalion, Comrade Inguanzo now seeks vengeance against the system that has led Iberia to its current war-torn state. He will accomplish his goal of a red Iberia or die trying, for revolutionary armed struggle is to only way to completely rid this nation of the plague of Fascism."
 #TBA_leading_from_the_front:0 "Leading From The Front"
 #TBA_leading_from_the_front_desc:0 "Comrade Inguanzo isn't one to sit behind while others fight. He is no slob craven politician, allowing others to do his dirty work whilst he sits back in the comfort of his own home. No chance. Comrade Inguanzo leads by example, on the front against the enemies of the revolution. A true leader, one instilled by the science of revolution, goes out to face the combatant head on with their fellow comrades. A militant remains a militant, committed to eternal dialectical struggle, no matter their position or rank. To go against this grain would be the act of a scab, a cockroach, a revisionist and a class traitor. Comrade Inguanzo is none of these things, in fact he is the very antithesis of these reactionary characteristics. He is a worker, a militant, a revolutionary, a socialist and most importantly, a comrade to all. We are truly blessed to have such a comandante, willing to do it all to establish socialism in the darkest of times."
 #TBA_revolutionary_government:0 "The Revolutionary Government"
 #TBA_revolutionary_government_desc:0 "Reactionaries lurk in every corner. Like vermin they scurry throughout the land, leeching off the labour of the working classes. They must be stamped out like the rodent filth they are, by any means necessary. To do so, we shall look back to history in order to gage how best to wipe out this hostile threat of counter-revolution.\n\nWhen Robespierre and Saint-Just found themselves surrounded by cowards and reactionaries; they commanded the Reign of Terror and used the guillotine to wipe out counter-revolutionary virtues. When the Bolsheviks saw a threat to their socialist triumph over the bourgeois, they directed the CHEKA to extinguish the flames of violent anti-communism. Finally, during the last war here in Spain, the workers militias enacted revolution justice against the obscurantist classes such as the landlords and the clergy. We will follow in their example and enact our own measures to strike terror into the heart of the Fascist state and its adherents. The bourgeois may call it "Red Terror" but we know it simply to be the revolutionary justice of the proletariat against their oppressors. Brave BTA fighters will now spread out across the land to accomplish this sacred mission."
 #TBA_the_first_stone:0 "The First Stone"
 #TBA_the_first_stone_desc:0 "The war against Fascist tyranny carries on relentlessly. It's a bloody and protracted struggle but one that is both necessary and benevolent. Thankfully, we have an inspiring leader in the great revolutionary Comrade Inguanzo who cares deeply for his community despite the upheavals of the people's war. The people must know this, that the BTA's armed fight against the decaying Fascist-Capitalism of Iberia is a moral and just one.\n\nIn order to convey this message to the people, Comrade Inguanzo will give a speech to the masses stating his magnificent mission. For Comrade Inguanzo and his Asturian Workers' Battalion will lead the proletarian people of Iberia to final victory. This, comrades, is pure fact at this point. Now though, it is our job to make sure the public share this belief for complete and utter belief is capable of moving even mountains."
 #TBA_funding_the_struggle:0 "Funding The Struggle"
 #TBA_funding_the_struggle_desc:0 "The revolution cannot run on merely ideas alone. Man is secondary to nature and the nature of a revolution demands material capabilities. This is no dinner party comrades, weapons must be secured to liberate Iberia from the cursed affliction of Fascism. In order to equip ourselves with the armaments needed to carry out a higher level of armed struggle, we will need funds and where better to find abject wealth than in the bank accounts of the class of the rich.\n\nIt is high time we "liberate" these petit-bourgeois socialites of their stolen wealth. For years they have benefited direCTLy from the violent oppression of the working class and have used their poached affluence for mindless consumerism. When we raid their estates, we shall be taking back what is rightfully ours. They can be happy knowing their assets will now go direCTLy to the workers struggle for emancipation, instead of the materialistic shit the hedonistic class choose to spend their money on."
 #TBA_revolutionary_decrees:0 "Revolutionary Decrees"
 #TBA_revolutionary_decrees_desc:0 "The banks are amongst the clearest representatives of Capital's domination over Iberian society. They are the mechanical institutions of Capitalist society and are the direct contributors to ills such as imperialism and Fascism. These ailments are characterised most evidently in the figure of the banker, the greedy middleman of bourgeois domination who cares little for those he has trampled on to ensure the day to day running of Capitalist order. The banks are filled to the brim with the excesses of flagrant wealth, where the hoarders of Capital seek to keep their money safe and secure. Cleary, they did not anticipate the workers retribution in the form of the BTA.\n\nWe are here to raid the banks, secure the finances needed for the revolutionary struggle and burn the bedeviled buildings down to the ground. The misappropriation of wealth has gone on for far too long and the gentle labourer can now rest slightly easier that the BTA is here to set the record straight. The worker can rest perhaps even easier, in the knowledge that this newfound wealth shall go direCTLy to securing the supplies needed for the revolution."
 #TBA_world_comrades:0 "Comrades Around the World"
 #TBA_world_comrades_desc:0 "As has been said before, we here in the BTA do not suffer from any kind of historical revisionism. As profound studiers of historical materialism, we know the past inside and out. We are especially aware of our own past and what has occurred in Iberia over the last century. We remember, with vivid detail, what side the Church took when the Fascist coup occurred in 1936. Instead of deciding to "speak up for those who cannot speak for themselves, for the rights of all who are destitute" (Proverbs 31:8-9), the clergy acted in the same way as any landowning class and saw the awfulness of Fascism as preferable to the victory of the workers. Well now the workers have rose once again and this time, there will be no shackles in place that would stop us from our righteous anti-clerical strife.\n\nThe churches are home to grand materialistic objects of gold and silver just ripe for the taking. With it, we will be securing yet more funds for the war against Fascism. The hated clergyman should complain little though surely. For is it not pronounced in their own holy book that "whoever oppresses the poor shows contempt for their Maker" (Proverbs 14:31). In reality, we "heathenish communist apostates" are far more "devout" than any one of these snake oil salesmen. Their hoarded wealth will now go to the workers salvation and no Fascist sympathizing clergyman can stop us from doing so."
 #TBA_guns_of_the_revolution:0 "Guns Of The Revolution"
 #TBA_guns_of_the_revolution_desc:0 "An embittered and tired revolutionary was once said to have, rather glibly, stated "this place would be a paradise tomorrow if every supervisor had a submachine gun". Indeed, it seems the days of sitting down and talking with our oppressors are long gone. The revolutions struggle needs to command political power and comrades; political power grows out of the barrel of a gun. The politics of the gun gives the guerrilla a tool that could never be given through the politics of reform. And so, the funds we have so righteously seized from the capitalistic corruptors of society are to be used to fulfill the needs of gun barrel politics.\n\nThere may be some questions as to where we got this high-tech weaponry from but it matters little in the end. For the ends justifies the means, do they not? Who cares who we got these guns from! What matters is how they're going to be used and they shall be used to kill many a Fascist bootlicker. The source may be from some less than savoury figures, we shall admit to some, but when all is said and done it shall be with these guns that the workers freedom will be achieved. We all make certain sacrifices for the revolution and this deal shall be one of many but with Comrade Inguanzo at the helm, the BTA will always do what is necessary whilst keeping on the dialectical line to guarantee a faithful communist revolution."
 #TBA_guns_of_the_revolution_tt:0 "If we are to defeat the bourgeoisie we will need arms from whatever source we can receive them."
 #TBA_total_peoples_defence:0 "Total People's Defence"
 #TBA_total_peoples_defence_desc:0 "The rather unique struggle we find ourselves in, requires some rather unique solutions. Victory is a necessity in this war comrades, becoming merely martyrs for a defeated cause is no longer enough anymore. It's do or die for the socialist struggle in these grueling times and we cannot afford to lose out on the battlefield. Thus, we have come up with a truly revolutionary concept of warfare that shall guarantee the victory of our mighty army of workers against the reactionary brutes.\n\nTotal People's Defence is a defence doctrine of total war. Through this concept, the BTA has the role of defending borders against aggressors with the intention of delaying an invader long enough for fellow militants to enter the field and start wearing the invader down with partisan tactics. During this almighty protracted people's war, the entire population under our control will be engaged in armed resistance, armaments production, and civil defence. It has been deemed that this is by far the best method for a smaller territory, such as our own, to properly defend itself against a much stronger invader. The Fascist beast will not know what hit them when the armed struggle truly takes off and this doctrine comes into full force. Total People's Defence will be our defining concept of warfare that shall lead to the direct destruction of the Fascist armies."
 #TBA_arise_ye_workers:0 "Arise Ye Workers"
 #TBA_arise_ye_workers_desc:0 "It shall be an honour for every worker in our domain to be a direct participant in the revolutionary struggle. To be such an intrinsic part of an emancipatory process is something that the other oppressed peoples of the world could only dream of yet, right here in Iberia, the BTA has allowed for the conditions to arise in which the worker has become their own liberator. It is truly a revolutionary time we live in and it is up to us, here in the BTA, to involve as many of the masses as we can in their own struggle for freedom. This shall be the defining line in our current recruitment drive.\n\nSome, slightly war weary citizens who have still not grasped class consciousness yet, may take a little convincing but we are quite the persuasive force are we not? Be they in the factory or the home, man or woman, old or young, all are welcome to join the revolutionary struggle. These new heartened souls will the mass basis of the BTA's struggle. It will be a great accolade for these people to be a part of the revolution force or become a martyr for it."
 #TBA_a_gun_in_every_hand:0 "A Gun In Every Hand"
 #TBA_a_gun_in_every_hand_desc:0 "Change comes through the barrel of a gun. It is a saying on the lips of every revolutionary cadre in our ranks. And the BTA is no debate club, when our cadres call for action we deliver. This form of praxis is what differentiates our great struggle from that of the revisionist or the reactionary, whom are merely two sides of the same anti-communist coin. Everyone, no matter what capitalisms notions of their "inabilities" were, is part of the great struggle for freedom. We are fighting for everyone's freedom, so it is only fair that the people fight with us side by side.\n\nAll who can fight will do so, as all will be armed with the means to do so. For it is not only guns we are arming these people with, but also the weaponry of ideology. Equipped with the powers of class consciousness and the knowledge of what needs to be done, no Fascist bastard can stop what was once the most timid of citizens. Our guns outmatch those of the bourgeoisie, for they are guns in the hands of the masses. Every man woman and child will be prepared if the Fascist ever knocks on their door, now outfitted with the means to fight off any would-be oppressor."
 #TBA_guerrilla_legacy:0 "Guerrilla Legacy"
 #TBA_guerrilla_legacy_desc:0 "Recent history has provided a guiding light, a shining path you may say, for how to direct our struggle against the monstrosity of Fascism. We have heard that in Cuba, Che Guevara helped accomplish the workers revolution through his Foco theory of guerrilla warfare. In what was once the Soviet Union, we hear stories from comrades that brave red partisans maim and kill the Nazi scoundrel with some great success. Finally, within our own nation we saw the great rising of the workers in 1934 that shocked (and got rid of) many a rich parasite before it was so unjustly crushed by the combined alliance of scabs and Franco's goons. All examples listed here share a common trait. That of the worker rising up to become the guerrilla in the face of overwhelming suffering. When the persecuted classes, be they that of the peasant or the urban worker, face this kind of systematic maltreatment it is only right that they become the guerrilla.\n\nThe guerrilla knows no bounds for he has but a few clear but important objectives in mind. To free his fellow man from despotism and to take violent relation against those who once treated them like vermin. The guerrilla could be anyone, regardless of age or gender, just so long as the recognize suffering and wish to do something truly proactive against it. We call upon this legacy now to fight off the Fascist threat and free ourselves from its bane."
 #TBA_fight_for_utopia:0 "Fight For Utopia"
 #TBA_fight_for_utopia_desc:0 "Our fight is not done for mere crumbs, nor short term gains or selfish attempts to grasp power for the chosen few. Our fight goes far beyond any of that reformist claptrap. It is the struggle for socialism, for the worker and for the very future of humanity. Every citizen in our territory, every fighter in our ranks and every official helping direct the revolution must know of this. It is off intrinsic value that all know what they are fighting for. That this war will result in either utopian socialism done in the name of the worker, or utter Fascist barbarism.\n\nSo much rides on the battles we fight against the hated enemy. When we come up against the revisionist, the reactionary, the rich and the counter-revolutionary it is of paramount value that we emerge victorious. For our victory will not only free the Iberian but may also inspire others to break their chains. Let our revolution be a guiding light to all who seek the freedom that socialism brings. Let us create a heaven on Earth for all to enjoy and let all be welcome in our red utopia."
 #TBA_seize_the_factories:0 "Seize The Factories"
 #TBA_seize_the_factories_desc:0 "To seize the means of production and put them direCTLy into proletarian control is a truly great accomplishment which not many so-called "revolutionaries" turned revisionist can claim to have achieved. No longer will the oppressive bosses and factory managers dictate conditions and wages to the valiant workers. With the productive forces in the hands of the working class, their destiny is now in their hands as well. It's an incredible feat of the BTA's revolutionary line and more than shows off of our capabilities as a force for the workers.\n\nThere are no breaks on the train known as worker revolution now! For the factories of Asturias belong to the workers and the workers alone! Nothing can stop this immovable force and all will be touched by the fires of socialist revolution!"
 #TBA_raise_the_red_flag:0 "Raise The Red Flag"
 #TBA_raise_the_red_flag_desc:0 "The people's flag is deepest red; it shrouded oft our martyred dead. And here their limbs grew stiff and cold, their hearts' blood dyed its every fold".\n\nTo proclaim true socialism is a bold one, it is not something that can be done by any bourgeoisie reformist. Yet, we here in the BTA have found ourselves to be in a position where we can affirm our territory is one that is truly Red. As the Red Flag, the symbol of our socialist struggle, flies high across BTA aligned territory the victory of our struggle over reactionary forces rings truer day by day. They cannot hope to ever stop this struggle; its momentum will carry it on through the generations. Our army has become inspired by the Red Flag's presence on the battlefield; it fills them with a sense of duty that capitalism could never hope to aspire. It is both an honour and a privilege for the BTA to hoist the Red Flag up, so it can be seen as far as the eye can see. Wherever that flag can be spotted, there will always be hope for socialist revolution.\n\n"Though cowards flinch and traitors sneer, we'll keep the Red Flag flying here.""
 #TBA_for_whom_the_bell_tolls:0 "For Whom The Bell Tolls"
 #TBA_for_whom_the_bell_tolls_desc:0 "There remains a clear problem of traitors and reactionaries, lurking within our territory. The enemies of the revolution are an inconspicuous bunch, they hide away their crimes against the people unlike other Fascists we have had the pleasure of dealing with. We cannot allow for the revolution to falter at these key stages and put everything at risk. So, the necessary means must be employed to round up the enemies of the people and give them the revolutionary justice they deserve.\n\nOur security services have drawn up a list of several suspected anti-communist conspirators, whom we will soon capture and put to trial. Fear not though comrades, for the trial will not be a bourgeois one. Our socialist law will consider the wider social needs of the revolution and shall be based on Marxist-Leninist principles, giving it a strong people's bias towards dialectical and collectivist thinking. It is only right we are to do these trials within the larger context of the class struggle. To not do so, would water down our revolution we have fought so hard to achieve. Now though, it is time for these counter-revolutionaries to meet their maker."
 #TBA_venceremos:0 "Venceremos!"
 #TBA_venceremos_desc:0 "From the deep crucible of the homeland, the people's voices rise up. The new day comes over the horizon, as the worker joins the call of the BTA.\n\nFinal victory is upon us, the great long march of socialism has begun to arise in people's lives. It is... a near indescribable sight to see the beginning of the end for worldwide Fascism. Here in Iberia, it has more than met its match in the form of the vanguard of the revolution, the people's army, the great and glorious, Asturian Workers' Battalion. This is only the beginning though comrades, the real push begins now. We have accomplished much in this campaign but the struggle is never ever truly over. The bastardised remnants of Franco continue to plague us but we will not falter, for not one step back will ever be taken. The BTA rides on the dialectical waves of revolution, for history marches with the worker. A thousand chains we will have to break but break them we shall! Underneath our banner, socialism shall be our future!\n\nWe shall prevail! We shall prevail!"
 
 #National Spirits 
 TBA_memories_34:0 "Memories of '34"
 TBA_memories_34_desc:0 "While the better part of three decades might have since gone by, echoes of the Revolución de 1934 still ring high among those comrades that found themselves or their relatives thrown into the chaos of October's uprising.\n\nThen, too, were workers rising up against Madrid's increasingly fascist regime to fight for their rights and those of their peers. And just as today, Asturias was at the forefront of the struggle.\n\nNow, callbacks to the two thousand souls that perished from the subsequent reactionary repression spread far and wide as a rallying cry to the militias of now.\n\nNever again."
 TBA_uncertain_future:0 "An Uncertain Future"
 TBA_uncertain_future_desc:0 "If few things are more certain than the righteousness of the workers' collective front against fascism, the matter of what comes after the struggle is another riddle entirely.\n\nThe truth is that independent sentiment is far from unanimous among the people of Asturias. Yet, the option of joining the liberals of the Spanish Republic doesn't hold much sway either, leaving the question of the future tossed aside while focus is maintained on the front lines.\n\nAs the protracted conflict further pushes the provisional regime to exceed the means of its hastily formed institutions, this puzzle might find itself in need of solving much sooner than anticipated. And as long as the interim government stays reluctant to pick a clear stance, all paths remain seemingly open for the young republic."

 #Events 
 TBA_wars.1.t:0 "Entrapment"
 TBA_wars.1.d:0 ""I will be stuck in here forever, aren't I?" Carlos groaned as he watched his partner Manuel ineffectually try and get him out of the pit he fell into, a fate he could have avoided if Manuel hadn't been so distracted enjoying the sound of his voice that he failed to notice the gaping hole that now imprisoned Carlos.\n\n"This is not working, Carlos. The hole is too deep for me to get you out. I will go back to camp and get help. You stay put here, okay?" The bumbling idiot said before he ran off.\n\n"As if I could just walk away for a stroll, can't believe I got stuck with him." Carlos angrily muttered as he wondered what he had ever done in his life to get stuck on patrol with such a waste of space, a man who only got anywhere near a uniform because daddy was some decorated officer who made it happen. And now he and other capable soldiers had to baby him around, and now. instead of finishing his patrol and retiring for a well-earned rest. he was trapped in this...\n\nHis thoughts paused, and his anger was now interlaced with contemplation. He was trapped in a literal sense as he looked around and realized this pit had dimensions perfect for trapping a person in but also leaving the possibility of extraction later - far too perfect for it to be natural. It was a trap but who set it?\n\nHe suspected he would know the answer soon as he heard careful footsteps approaching his position, and his darkness-adjusted eyes managed to make out three armed figures who were not his comrades staring down at him."
 TBA_wars.1.a:0 "A terrible evening gets worse."

 TBA_wars.2.t:0 "Liberty's Price"
 TBA_wars.2.d:0 "Arlo had once heard that famine victims could die from overeating once food was available again. He didn't think much of this knowledge until now as he took his first steps outside the prison he thought would be his tomb as he spent years behind bars - his only crime was being a PCE member. His first taste of freedom in years was as frightening as it was exciting.\n\nHe had resigned himself to a slow death in that prison when the unexpected happened. The regime collapsed like a house of cards, causing Iberia to be swept by chaos and revolutions. One of those had seen him liberated from his cage and take his first steps outside that accursed building, taking in air that did not smell nauseating. The pleasure was momentary as his mind raced with questions it never had to consider for years: what does he do now? Where to go? Was there anyone he knew left on the outside after so long?\n\nThe last question was answered immediately, as he spotted two faces, one of whom moved towards him so fast he nearly flinched as she hugged him tight. Good to know Carmen was as strong as ever and even better to see his old comrade Juan crack one of his rare smiles as he looked at this impromptu reunion. There were tears shed, explanations told, and questions asked, but Arlo wanted one thing. "So Juan, think I can get me a place in the militia, Red Army, or whoever is fighting the fascists right now?" he asked and was not surprised to see befuddlement on their faces.\n\n"It hasn't been a day, and you can hardly walk, let alone fight my friend. Maybe, it's best t..." Arlo shook his head and gave him a look.\n\n"I will regain my strength on the march, I will cook, I will do anything I can, but I have lived through helplessness for years now, and I would rather die than live without purpose again..."
 TBA_wars.2.a:0 "...even for one second more."

 TBA_wars.3.t:0 "Passing the Torch"
 TBA_wars.3.d:0 "He expected anger, to be told he is a stupid boy wasting his life on things better left alone. He predicted a lot of pleading and begging to stay safe with his last remaining family. He was even ready for denial, and his grandfather simply pretending he never said a thing, going about everything like normal.\n\nHe was not ready when Abuelo simply sighed and gave him his blessing to join the militia, throwing the youth into confusion and deflating the bravado he mustered for this talk.\n\n"You look surprised. I know what you are thinking, and this is not a trick. You are free to go and fight if that is what you truly want. I won't even make you promise to come back alive. That's not a promise anyone can keep, not in a war of all places". He then stood up and for a moment, Manuel could swear his grandfather's age seemed to melt away.\n\n"But if you are going to do this, then there is a lot you must learn first, and you will listen to everything I tell you from this point forward if you don't want to be deadweight when the shooting starts, understand?" he said with a tone that carried both authority and care.\n\n"Yes, of course, Grandpa. I understand," he said without thinking.\n\n"Good, now what I tell you will not substitute for experience; you only get that through your successes and failures, but at least you won't be starting from scratch, which is more than I ever got when I was in your shoes," he said with a mix of both nostalgia and bitterness. "And above all else..""
 TBA_wars.3.a:0 ""...you will need luck, lots of it.""

 TBA_wars.4.t:0 "School's Out"
 TBA_wars.4.d:0 ""What do you mean I am not allowed in?"\n\nAntonio resisted the urge to roll his eyes out of professionalism as he stared at his former colleague Santiago and repeated what he said.\n\n"Sorry friend, but the university library is closed and will remain so while the university's reorganization is ongoing."\n\n"Yes I heard you the first time and I do not understand why am I not allowed in, I need to access the library to finish my degree otherwise all the money and effort I put into this will be wasted. Come on Antonio, can't you let me in just this once?" he pleaded and Antonio found himself irritated at the fact that Santiago seemingly did not notice the reality that they were at war right now.\n\n"The answer is still the same, the library is closed until the higher ups tell me otherwise. If you want something to do the university council or the militia could.." he didn't finish his sentence when he noticed his former study mate walk away in anger.\n\n"Forget it damn you, I ain't interested in this nonsense. I came here to study not run around playing revolutionary hero"\n\n"
 TBA_wars.4.a:0 "A not so friendly interaction."

 TBA_wars.5.t:0 "" #Not Hooked Up for Now, Can Come In Hotfix If Desired
 TBA_wars.5.d:0 "Two Junta soldiers are patrolling the forest around a camp. One trips over a wire headfirst into a pit hidden by foliage. The other tries to get him out but the pit is too deep and he can't reach him. He shouts he is going to get help at the camp, leaving the fallen soldier alone. The now alone soldier scuffs and thinks how useless his partner is when a thought crosses his mind, who put this trap here? His tribulations are cut short when he sees three figures pointing guns at him from the top of the pit."
 TBA_wars.5.a:0 ""

