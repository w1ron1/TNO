 TBA_wars.12.t: "Run Like Hell"
 TBA_wars.12.d: "Pedro could feel his lungs burning with every step he made. He could barely feel his legs as the effort of keeping them in motion, and the pain that came with it, became such a constant his body simply became numb to it. But he could not stop to rest, to do so would be to let them catch him.\n\nIt wasn't supposed to be this way, not so long ago he was just a clerk and not even a very important one. He might have expressed some loud nationalist sentiments, sure, but everyone had to do that if they wanted to keep their jobs. Behind the Francoist slogans was just a pile of paperwork. He dealt with road maintenance, for God's sake. With this "revolution" however, the people had decided they had always been latent revolutionaries. Now he was a target as if he were some Guardia Civil specter.\n\nHe had been lucky to have already been outside his home when they tore into it, incensed by the proclamations on the radio that a new Socialist Asturias Republic had formed, and had even been luckier still to make it out of town. If he hadn't heard the announcement, noticed the glances the people on his street had given him recently, he wouldn't have known to run. The thought terrified him but even now he knew they were still pursuing him. The voices were not getting any quieter.\n\nSuddenly, his legs failed and he felt dirt on his face as his muscles failed him and he fell down onto the rough ground. He could not stop panting even as he tried to stay still in the hopes they would miss his prone form.\n\nFootsteps and the clinking of metal grew louder. Then, it stopped. He looked up."
 TBA_wars.12.a: "They surrounded him, tools and bludgeons mockingly displayed."

 TBA_wars.13.t: "Paper Makes the World Go Round"
 TBA_wars.13.d: ""So many names, so little time" Armando said to himself as his eyes scanned yet another long list of arrests. Another round of purges meant more work for him to go through.\n\nHe wasn't ungrateful for his job. The birth of the Republic had allowed him to rise high, higher than he had dreamed, but he was now finding himself wondering if he was really suited for it. He forced himself to concentrate while sifting through the names, determining who was deserving of what punishment with a hasty scrawl. He sighed. The names never stopped\n\nThe only help he got was from his assistant Elena, who was efficient and dedicated he couldn't deny, but hardly the most socially adept or engaging person. A computer would have been more company, a thought that groaned through his head as she walked into his office, in her hands more lists for him to go through. He gasped as he saw them added to the already overflowing desk\n\n"More of these?!" He slammed his desk in impotent frustration, causing some of the papers that had been precariously clinging to the piles to fall slowly to the ground. Elena picked them up silently and re-added them before him, eliciting an exasperated squeal from Armando. He stood up and walked to the wall, leaning on it as days of monotony welled to the surface.\n\n"God, this is pointless!" he let out, "Can't they just shoot the bastards or something? How many police officers are even in this damned city?!" He felt his vein almost pop out from the frustration, so preoccupied that he didn't notice Elena nod and walk out to deliver his new order."
 TBA_wars.13.a: "Loose lips sink ships."

