 TBA_wars.12.t: "Біжи щодуху"
 TBA_wars.12.d: "Педро відчував, як легені палають із кожним кроком. Він ледве відчував свої ноги, адже зусилля, необхідні для того, щоб змушувати їх рухатися, та біль, що приходив разом із цим, стали настільки постійними, що його тіло просто перестало їх відчувати. Але він не міг зупинитися, щоб перепочити, адже це означало б дозволити їм його схопити.\n\nТак не мало бути, ще зовсім недавно він був просто клерком, та й навіть не особливо важливим. Можливо, він і висловлював деякі гучні націоналістичні погляди, але так робили всі, хто хотів зберегти свою роботу. За франкістськими гаслами ховалася лише купа паперової роботи. Він займався утриманням доріг, заради Бога. Але з цією «революцією» люди вирішили, що завжди були прихованими революціонерами. Тепер він став мішенню, наче якийсь привид Цивільної ґвардії.\n\nЙому пощастило, що він уже був поза домом, коли вони увірвалися туди, розлючені повідомленнями по радіо про те, що утворилася нова Соціялістична республіка Астурії, а ще більше пощастило вибратися з міста. Якби він не почув оголошення й не помітив останнім часом поглядів, які кидали на нього люди на його вулиці, він би не знав, що треба тікати. Ця думка лякала його, але навіть зараз він знав, що вони все ще переслідують його. Голоси не ставали тихішими.\n\nРаптом ноги підкосилися, і він відчув землю обличчям, коли м'язи відмовили й він упав на нерівну землю. Він не міг перестати важко дихати, навіть намагаючись лежати нерухомо в надії, що вони не помітять його лежачого тіла.\n\nКроки й дзенькіт металу ставали дедалі гучнішими. А потім усе стихло. Він підняв голову."
 TBA_wars.12.a: "Вони оточили його, насмішкувато демонструючи знаряддя та кийки."

 TBA_wars.13.t: "Папір рухає світ"
 TBA_wars.13.d: ""Стільки імен, а часу так мало", — сказав Армандо сам собі, коли його очі ковзнули ще по одному довгому списку арештів. Чергова хвиля чисток означала для нього ще більше роботи.\n\nВін не був невдячним за свою роботу. Народження Республіки дозволило йому піднятися високо, набагато вище, ніж він коли-небудь мріяв, але тепер він починав замислюватися, чи справді був придатний для цього. Він змусив себе зосередитися, перебираючи імена та швидкими закарлючками визначаючи, на яке покарання хто заслуговує. Він зітхнув. Імена ніколи не закінчувалися.\n\nЄдиною допомогою була його асистентка Елена, яка, цього не заперечиш, була ефективною та відданою, але аж ніяк не найкомунікабельнішою чи найприємнішою людиною. Здавалося б, навіть комп'ютер був би кращою компанією — ця думка промайнула в його голові, коли вона зайшла до кабінету, несучи в руках нові списки для опрацювання. Він ахнув, побачивши, як їх додали до вже переповненого столу.\n\n"Ще й це?!" — він ударив по столу в безсилому роздратуванні, через що кілька паперів, які хитко трималися на купах, повільно впали на підлогу. Елена мовчки підняла їх і знову поклала перед ним, викликавши в Армандо роздратований писк. Він підвівся й підійшов до стіни, сперся на неї, і назовні вирвалися дні монотонності, що накопичувалися в ньому.\n\n"Боже, це безглуздо!" — вигукнув він. "Невже вони не можуть просто розстріляти цих покидьків чи щось таке? Скільки взагалі поліцейських у цьому клятому місті?!" Він відчув, як від роздратування у нього мало не виступила вена, настільки був поглинутий ним, що не помітив, як Елена кивнула й вийшла виконувати його новий наказ."
 TBA_wars.13.a: "Слово не горобець."

