 TBA_wars.7.t:0 "Serve Your Time in Hell"
 TBA_wars.7.d:0 "Dust hung in the air of the apartment, unable to settle as the room shook from nearby blasts of heavy ordinance. The lights, powered by a noisy and battered generator, flickered intermittently, plunging the makeshift HQ into darkness.\n\nIt had been unoccupied since before the War. White paint peeled off the walls like thin gray appendages, almost antique appliances that couldn't be thrown out remained fixed in their places. It was chosen at the spur of the moment, after direct hits buried the primary command post under twenty feet of rubble. This dingy apartment, bustling with demands and orders was almost all that was left of Oviedo Command. Most were buried with their post.\n\n"General!" cried out a radio operator from the former bedroom. It could barely be heard over the racket of the apartment but its intended target registered it almost supernaturally. A gruff man, aged a decade older than he should be, shoved a cigarette into an overflowing ashtray on the dining room table. Apologizing for leaving to the throng of wide eyed soldiers, and for the blackened debris spilling onto the maps below the ashtray, he pushed his way into the other room.\n\nThe radio operator wasted no time in acknowledging his superior. "Urgent. The Ronda Sur Post is gone. Last message said if we don't move troops they'll overrun the east fast"\n\nThe General's hollow eyes seemed to stare into the radio for a moment. "Get the civilians out of the shelters, anyone who is able. Give them a weapon, anything that can kill, we need them." he said briskly.\n\n"Sir, is that...?"\n\nThe General turned and walked to the door. "There's no one else to send" he said, before pushing his way back into the other room."
 TBA_wars.7.a:0 "The enemy was stalled for a few more hours."

