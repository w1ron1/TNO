 #Ministers
 TBA_Horacio_Fernandez_Inguanzo:0 "Horacio Fernández Inguanzo"
 POLITICS_HORACIO_FERNANDEZ_INGUANZO_DESC: "Horacio Fernández Inguanzo joined the PCE during the outbreak of the Civil War, being captured during a last-ditch effort to retreat towards France as Asturias fell to the fascist advance. Thanks to a paperwork error, Fernández narrowly avoided execution, leaving prison in 1943. After being arrested once more in 1945 for anti-Franco activities, he was eventually released once more in 1954.\n\nFernández was one of the key figures in reorganizing the PCE within Asturias in the years after the civil war. Fernández and his allies could not sit idle as repression grew in the region, and the Spanish National Junta abandoned any restaurant possessed by the Union's old government. It was Fernández who organized the revolt against the Junta that led to socialist militias seizing control over Asturias. It was also Fernández who advocated for collaborating with the Asturian Socialist Federation, so that the government could gather broader support from the population.\n\nFernández has not advocated for independence from Spain, despite the Socialist Republic's uprising. However, none of the Spanish factions represent the future that Asturias and its people want, and so Asturas must fight for itself. There shall be no surrender, no capitulation, without Asturias having had its voices heard."
 TBA_Decentralized: "Decentralized Leadership"
 TBA_Unorganized: "Disorganized Leadership"
 TBA_Jose_Barreiro_Garcia: "José Barreiro García"

 TBA_Rafael_Alvarez:0 "Rafael Fernández Álvarez"
 TBA_Rafael_Alvarez_hog_desc:0 "§YChairman of the Council of Ministers\nSocialism§!\n--------------\n§LRafael Fernández Álvarez was a member of the Interprovincial Council of Asturias during the Civil War, and so it was an easy decision to nominate Fernández for the position of Speaker of the Council, given his experience in wartime politics. Within the position of Speaker of the Council of Government, Fernández wields power equivalent to that of a prime minister.\n\nFernández is a deeply influential member of the Asturian Socialist Federation, the local branch of the PSOE, however he is not its leader. Using his connections, he has established contact with the PSOE in the Republic, but the party's inner turmoil has given him pause. It puts the very future of Asturias into question: If they are to drop their arms and reintegrate into the Republic, would the post-war leadership truly be willing to make the changes necessary to allow Asturias to prosper, given their current division?§!"

 TBA_Manuel_Mondelo:0 "Manuel Mondelo Ronda"
 TBA_Manuel_Mondelo_for_desc:0 "§YMinister of Foreign Affairs\nSocialism§!\n--------------\n§LManuel Mondelo Ronda was one of the leaders of the 1962 Asturias miner strikes, forced to go into hiding until the Union collapsed into civil war. Alongside his work as a miner, Mondelo was also a member of the Asturian Socialist Federation, as well as one of its leaders. When the time came for Asturias to rise up, Mondelo was nominated as Councilor of Foreign Affairs.\n\nGiven the circumstances of Asturias, the role of Councilor of Foreign Affairs was not a busy one, although it does still bear important responsibilities. Mondelo has reached out to leftist movements within the other regional factions, and has established talks with the Republic. Whale there is a common enemy to unite them, it is Mondelo's top priority to establish what will happen between the Republic and Asturias after the war's conclusion.§!"

 TBA_Felipe_Matarranz:0 "Felipe Matarranz González"
 TBA_Felipe_Matarranz_sec_desc:0 "§YMinister of the Armed Forces\nCommunism§!\n--------------\n§LFelipe Matarranz, known by the alias of El Lobo amongst his fellow guerrillas, had been fighting against fascism in Spain since before the Civil War. He was eventually captured, and narrowly avoided execution. However, Matarranz continued his fight against fascism after the civil war, getting into contact with other Asturian rebels and the PCE, and waging a violent resistance within the rugged mountains of the region. Now that the Union has collapsed, and the fascists are finally vulnerable, Matarranz has once again taken up arms to defend Asturias.\n\nNamed Councilor of Defense, Matarranz has used his knowledge of the mountainous Asturian terrain to better coordinate the militias, providing knowledge of optimal places to hide, and what routes the enemy is likely to take.§!"

 TBA_Amaro_Rosal:0 "Amaro del Rosal"
 TBA_Amaro_Rosal_eco_desc:0 "§YMinister of Economic Organization\nBukharinism§!\n--------------\n§LAmaro del Rosal had originally been a member of the PSOE, and had long been under the belief that it would benefit the party to collaborate alongside the communists in the PCE. In 1946, this position saw him evicted from the party while in exile, and so he joined the PCE in 1948. Despite this new affiliation, however, Amaro del Rosal remained a moderate within the PCE. It was for this reason that he was appointed Councilor of Economy, as he could act as a neutral candidate that both factions were willing to accept.\n\nAs Councilor, Amaro del Rosal has nationalized several key industries and mines, greatly expanding the rights of the workers. Using those same workers' output as a source of revenue, the government s able to keep its militias equipped and able to continue the fight for Asturias's future.§!"

