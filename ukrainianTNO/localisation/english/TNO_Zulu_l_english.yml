 ### Characters ###
 ZUL_Mangosuthu_Buthelezi: "Манґосуту Бутелезі"

 ## Leader Descs ##
 POLITICS_MANGOSUTHU_BUTHELEZI_DESC: "Цілковита нездатність АНК запобігти захопленню Південної Африки бурами стала останньою краплею для поміркованої фракції організації. Коли лідери АНК були вбиті або вигнані режимом Герцоґа, у боротьбі за залишки організації переміг ніхто інший, як принц Манґосуту Бутелезі.\n\nОфіційно лише спадковий лідер племені Бутелезі, принц Манґосуту де-факто очолює Партію свободи Інката (ПСІ), найбільшу уламкову групу АНК. Манґосуту та головні ідеологи ПСІ непохитно вірять, що екстремізм АНК був коренем його провалу і що лише співпраця зі співчутливими білими урядами дозволить досягти расової рівности. Попри цю поміркованість, цілі ПСІ не менш радикальні, ніж цілі АНК, а негативна реакція на жахливе поводження бурів із корінним населенням Південної Африки лише більше переконала племінних лідерів, які підтримують уряд Манґосуту, що сегрегація має припинитися, так чи інакше.\n\nТонка межа, якою принц мусить балансувати між ідеологічним радикалізмом і своєю прагматичною стратегією, представлена нестабільним альянсом племен, що складають політичний фронт Манґосуту. Хоча це не більше ніж неформальна домовленість, яка майже цілковито тримається на особистій відданості Манґосуту, а за промисловими потужностями та військовим досвідом альянс поступається, він усе ж несе в собі незламний дух АНК. Це робить домовленість із поміркованими білими Вільйоена ще нагальнішою, адже якщо Манґосуту виявиться нездатним виконати свої обіцянки щодо переговорного припинення сегрегації, радикальніші елементи ПСІ можуть отримати перевагу."

 ### Ideas ###
 ZUL_ifp_anc_split: "Розкол ПСІ—АНК"
 ZUL_ifp_anc_split_desc: "АНК був побудований на альянсі радикальних і поміркованих корінних південноафриканців, який від самого заснування був нестабільним. Нездатність належним чином впоратися з бурами стала останньою краплею для цього альянсу, спричинивши розкол АНК. Найбільша поміркована фракція, ПСІ, утримує владу, але майбутнє може бути мінливим, і лише час покаже, чи залишиться зулусько-ксоський альянс стабільним, чи спіткає його та сама доля, що й його попередника."

 ZUL_anti_segregation_resurgence: "Відродження боротьби проти сегрегації"
 ZUL_anti_segregation_resurgence_desc: "ПСІ не завжди мала найбільш радикальний погляд на сегрегацію. Під час Південноафриканської війни вони були поміркованими, зосереджуючись більше на співпраці з білим урядом. Однак після несправедливостей, яких вони зазнали під владою Фолькштаату, це питання знову набуло важливости, а серед народу й уряду відродилася тривога, що така несправедливість ніколи більше не повинна повторитися."
