 #Leader descriptions
 POLITICS_GG_CHIESA_DESC:0 "Губернатор Карло Альберто далла Чієза - людина, чия швидка кар'єра здивувала багатьох, а ще більше викликала заздрість. Він - нагороджений ветеран Другої світової війни, який попросив переведення з Регійської армії в Карбіньєрі, щоб наслідувати шлях свого батька, самого генерала Карбіньєрі. Після закінчення війни його призначили в нещодавно захоплені італійські території на Леванті, де він продемонстрував свої навички та мужність у розслідуваннях та придушенні різноманітних терористичних і партизанських груп, які тероризували регіон. З кожним арештом він швидко піднімався по сходах кар'єри в Карбіньєрі і привернув увагу Галеаццо Чіано.\n\nКоли настав час призначити нового губернатора Леванту, новий Дуче, замість вибору старого фашиста, обрав молодого генерала на посаду наступника. Це рішення було спірним, оскільки було добре відомо, що далла Чієза мало симпатизує фашизму - але за його ще короткий термін на посаді, генерал Карбіньєрі зміг навести хоч якусь мирну атмосферу на Леванті, хоча для цього йому довелося застосовувати нестандартні методи. Рим чекав результатів, і це те, що далла Чієза дав їм - екстремістські партизанські групи стали мішенню репресій, в той час як було досягнуто перемир'я серед тих, хто готовий був вести переговори. Проте доля Леванту все ще висить на волосині.\n\nДля далла Чієзи очевидно, що італійське правління в регіоні не буде тривати, і необхідно знайти якийсь тип угоди між Італією і численними народами Леванту, якщо цей район знову не буде кинутий в хаос. Губернатор Карбіньєрі зміг відновити мир в Леванті, але скільки він триватиме, ще невідомо."

 POLITICS_Umberto_La_Rocca_DESC:0 "Кажуть, що доля людей визначається в момент їх народження, і в разі Умберто Ла Рокка це, ймовірно, правда. Народився в Порт-Саїді від італійського батька та французької матері, молодий Умберто дуже швидко став володіти трьома мовами, включаючи арабську - тому його прикріпили до арабських військ під час Другої світової війни, де він відзначився як офіцер в Північній Африці та Леванті проти британців. Після війни Ла Рокка розпочав блискучу дипломатичну кар'єру, виконуючи місії по всій Європі і навіть у США, де він представляв Італію та її новостворену імперію.\n\nПосол Ла Рокка нещодавно повернувся на батьківщину, щоб виконати ще одну місію. Левант роками був осередком конфліктів, але після того, як Єрусалимська конференція завершилася розподілом губернаторства, в регіоні був встановлений новий, хоча й крихкий порядок, і саме Єрусалим став його центром. Створений як корпус сепаратум, Єрусалим є нейтральною територією, гарнізонованою італійськими військами та керованою радою представників численних релігійних та етнічних спільнот, що складають населення священного міста - і на чолі цієї ради стоїть Ла Рокка, безсторонній і нейтральний посередник, якому доручено залагоджувати конфлікти, вирішувати кризи і забезпечувати безпеку для всіх.\n\nТепер Ла Рокка знає, що від нього залежить не тільки майбутнє Єрусалиму як безпечного притулку для миру серед народів, але і майбутнє всього Леванту - адже хоча як Палестина, так і Ізраїль неохоче прийняли створення корпусу сепаратум, мінливий характер політики Леванту означає, що загроза може з'явитися раптово і без попередження. Тільки час покаже, чи стане Святий Місто ключем до побудови тривалого миру на Леванті або центром нової бурі."

 POLITICS_Ahmed_Jibril_DESC:0 "Ахмед Джібріль ніколи не був людиною для компромісів. Для нього ситуація в Леванті була простою і зрозумілою для всіх. Палестина була заселена арабами з давніх часів - потім західні імперіалісти і їхні сіоністські посіпаки окупували країну, крали землю, вигнали мешканців і забирали життя задля своєї ницої амбіції та жадібності. Палестинці хотіли чинити опір, але на жаль, їхні лідери були абсолютно не здатні до цієї справи: боягузи, як Арафат, готові продати свою країну в обмін на порожні обіцянки миру, маріонетки, як Хусейн, занадто задоволені тим, що їхні кишені наповнюються лірою, щоб піклуватися про свою батьківщину, і дурні, як Хабаш, занадто захоплені філософією, щоб щось корисне зробити.\n\nІ ось так, Палестинський фронт визволення - Генеральне командування був заснований Джібрілем та невеликою групою палестинських бійців. Їхня мета - звільнити Палестину від окупанта і євреїв. Їхні методи - все, що може привести до досягнення цієї мети. ПФВ-ГК швидко перетворився з невідомої організації в найвідомішу арабську міліцію в країні, оскільки багато хто звернувся до єдиної групи, яка справді готова боротися за них. І де б ПФВ-ГК не з'являлася, там завжди слідували терор, кровопролиття і смерть - адже жодна ціна не була занадто великою для визволення Палестини.\n\nТепер, коли італійці пішли, Джібріль та його люди нарешті контролюють країну. І все ж, їхня робота ще далека від завершення. Сіоністська змія все ще чатує, готова знову випустити свій отруту, і з усіх напрямків вже виникають загрози для нововизволеної Палестини. За допомогою будь-яких засобів, Джібріль і ПФВ-ГК мають намір переконатися, що ніхто більше не зможе поневолити Палестину і її арабський народ, і що вічний єврей отримає свою заслужену відплату за спроби вкрасти те, що належить палестинцям."
 
 #POLITICS_Hussein_ibn_Talal_DESC:0 "Колись ім'я Хусейна ібн Талаала, нащадка Хашимітів, було всього лише одним із багатьох у довгому списку місцевих правителів, племінних вождів і дрібних королів, васалів до величезної італійської імперії, престиж його династії ледве підносив його серед інших. Його батько Талаал погодився поновити угоду про захист з Італією, яку підписав його батько Абдалла, але в наступні роки важка хвороба Талаала зробила його абсолютно непридатним навіть до ролі ляльки, і так молодий принц Хусейн став еміром Трансйорданії.\n\nВідтоді Хусейн активно працював над розвитком свого феодального володіння - завжди представляючи себе відданим союзником Італії, водночас таємно підтримуючи федаїнів та тісно співпрацюючи з ENI та іншими італійськими компаніями, щоб експлуатувати величезні ресурси Трансйорданії, поки сам не накопичував величезні багатства. Тим не менш, видима лояльність еміра була винагороджена Римом, і Трансйорданія отримала значну автономію всередині Леванту, навіть здобувши власну армію. Чим більше Палестина занурювалася в етнічні конфлікти та відкриті повстання, тим більше Трансйорданія ставала близькою до моделі протекторату: стабільною, процвітаючою і лояльною.\n\nХусейн використав свої багатства та зв'язки, щоб здобути довіру Італії, і тому не було дивно, що після того, як італійське панування на Близькому Сході було підтверджене після Другої італо-турецької війни, Рим побачив, що лише арабський король може зберегти стабільність у регіоні на довгострокову перспективу. Тепер Хусейн, новопроголошений король Леванту, контролює нову, сповнену надій арабську націю, але майбутнє вже накладає темні тіні на його правління. Між автократичними тенденціями еміра і зростаючим єврейським опором до нового арабського королівства більшість лояльність Італії до Хусейна може незабаром виявитися великою помилкою..."

