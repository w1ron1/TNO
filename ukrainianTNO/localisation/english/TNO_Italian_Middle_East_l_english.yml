 POLITICS_JORDAN_ABDULLAH_I_DESC:0 "Ім'я Абдалли ібн Хусейна - це ім'я, що викликає суперечки: для одних він може бути борцем за свободу, який намагається найкраще відстояти інтереси свого народу перед вимогами окупанта, а для інших він не більше, ніж прихвостень імперіалістів, що зрадив свій народ і спадщину свого батька. Проте правда набагато складніша, ніж будь-яке зганьблення чи звеличення чоловіка, який став символом 3 десятиліть правління Хашемітів над землями Йорданії.\n\nНародившись в 1882 році від майбутнього шерифа Мекки, Абдалла побачив, як його батько повстає проти османського халіфа й їхнього імперіалістичного контролю над Аравією, і повів свої війська в конфлікт, відновивши колишні іскри арабського націоналізму. Араби повстали, і мрія про об'єднану арабську державу була на горизонті - але так і не здійснилася. Араби були поділені на королівства, кожне з яких очолював син шерифа. Сміливому Абдаллі було запропоновано стати королем Іраку, але той відмовився, вирішивши стати еміром новоствореного Протекторату Трансйорданії. Абдалла віддано служив своїй країні та потребам свого народу до початку Другої світової війни.\n\nКоли держави Осі вторглися на Близький Схід та окупували колишні британські володіння, Абдалла присягнув на вірність Італії в надії зберегти своє правління під італійським орлом. Хоча італійці залишалися до нього недовірливими через його співпрацю з британцями, та його прагнення балансувати італійські інтереси з інтересами свого народу, вони все ж визнавали його ефективність і адміністративні навички, особливо в порівнянні з сусідніми губернаторами в Палестині.\n\nОднак не все було добре для еміра: палестинський джихад аль-Хусейні став причиною замаху на нього; спроба, яка потрясла всю династію Хашемітів, розколовши її на дві частини. Коли Король арабів наближається до своєї смерті, напруга між двома фракціями лібералів і колабораціоністів стає нестерпною."
 POLITICS_JORDAN_NAYEF_DESC:0 "Чи варто зберігати свою династію ціною зради своїх ідеалів та самих чеснот і принципів, які колись були їм дорогі? Хоча інтелектуали з їх романтичними концепціями націоналізму й демократії можуть сказати ні, Наїф бін Абдалла з Йорданії бачить це в іншому світлі.\n\nНароджений у 1914 році на початку Першої світової війни, Наїф був ще малюком, коли його дід організував повстання проти турків. Він не застав того часу посиленої націоналістичної боротьби в регіоні, замість цього став свідком трагічних подій, вже коли дорослішав. Спочатку падіння Хашемітів у Хіджазі, потім усунення хашемітського короля в Сирії через його надмірно гідне наполягання на націоналізмі, що принесло йому лише руїну - а потім, найгірше з усіх, різанина Хашемітів в Іраку, яких різали, як худобу на забій. Наїф не міг не замислитися, чи не буде він і його батько наступними? Голову принца постійно крутило від сумнівів і вагань щодо його власного питання.\n\nОднак він не залишався нерішучим надовго. Спалах джихаду аль-Хусейні став переломним моментом для нього. Його батька було відмічено аль-Хусейні, намагаючись вбити, але якесь диво від самого Всемогутнього врятувало його. Однак наслідки цього інциденту відгукнулися в свідомості принца й у самій династії Хашемітів. Для Наїфа все стало очевидним. Лише придушуючи ці так звані рухи незалежності та співпрацюючи з італійцями, голова короля могла уникнути гільйотини.\n\nХоча він завжди був улюбленим сином батька, Наїф все ж має опозицію зі сторони брата та лібералів при дворі. Проте король залишається відданим запобіганню падіння останнього бастіону правління Хашемітів."
 POLITICS_JORDAN_HUSSEIN_DESC:0 "Народжений у 1935 році, Хусейн ібн Талаал завжди був улюбленцем багатьох: навіть його дід не вірив, що будь-хто з його синів може бути королем - натомість він бачив потенціал у своєму онукові Хусейні й ставився до нього з особливою турботою та привілеями. Молодий і харизматичний принц змусив маси аплодувати, у той час як його батько був недовірливим через свою передбачувану юродивість, а його дядько висміяний як зрадник та лакей.\n\nХусейн усе своє життя провів під окупованим Йорданом, який був експлуатований та колонізований - спочатку британцями, а потім італійцями. Як і його попередник, Хусейн навічно зненавидів таку ситуацію. Він бачив страждання свого народу, нехай це йорданці чи палестинці, і як їх знищували під тиском Італійської імперії. Люди мріяли про свободу, про незалежність, але їхні мрії було викрадено.\n\nОбурений експлуатацією свого народу й бажаючи побачити їх звільненими, Хусейн здобув популярність завдяки своїй ідеї "Ліберального експерименту" та анти-італійській риториці, фактично ставши обличчям йорданського реформізму та заступником свого батька в ліберальній фракції королівського двору. Крім того, його прагнення й бажання бачити свій народ щасливішим, їхні мрії здійсненими та їхнє життя поліпшеним, призвели до того, що він здобув ще більшу популярність серед простих робітничих.\n\nУлюблений король йде вперед разом зі своїм народом до нових горизонтів, плануючи продовжити демократизацію, розпочату його батьком, і просувати волю народу. Хусейн навіть наблизився до поміркованих про-італійських та лівих рухів, сподіваючись знайти спільну мову з ними на користь свого народу та країни. Однак багато хто залишається сумнівним щодо щирості й прихильності монарха до демократизації, незважаючи на його засвідчення в націоналізмі та лібералізмі; підозри, які можуть бути підтверджені, коли він почне вступати в конфлікти з більш республіканськими елементами йорданської політики."
