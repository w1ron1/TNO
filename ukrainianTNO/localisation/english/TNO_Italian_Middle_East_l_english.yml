 POLITICS_George_Habash_DESC:0 "Відзначення підйому Джорджа Хабаша було випробувано через труднощі, біль, сльози та кров. Народившись в палестинській християнській родині,  
 
юнаком Хабаш одразу приєднався до арабських федаїнів проти італійської окупації Леванту, після Другої світової війни. Вірний марксист, Хабаш заснував Рух арабських націоналістів - широкий фронт із соціялістів, комуністів та лівих арабських націоналістів, які боролися проти італійської й сіоністської окупації Леванту. Ведучи жорстоку партизанську війну проти фашистських загарбників, одночасно вони заявляють свою відданість перетворенню Леванту в незалежну, не розділену на конфесії соціялістичну республіку.\n\nНезважаючи на внутрішні розбіжності серед арабів Леванту, головним чином через спроби Арафата продати свою землю фашистам і сіоністам під час війни, Хабаш та РАН досягли своїх революційних цілей. Народи Леванту піднялися проти імперіалізму й нетерпимості, здобувши велику перемогу після років народної боротьби, а країна тепер йде вперед, щоб побудувати своє нове майбутнє, під керівництвом товариша Генерального секретаря Хабаша.\n\nПроте боротьбу Хабаша ще не скінчено. Сіоністські ополчення, такі як Ірґун, і навіть великі частини Гаґани, підняли запеклий опір проти нової Народної республіки - а серед арабського населення все ще залишаються реакційні та фундаменталістські настрої, що повзуть, мов змія серед темряви, поширюючи контрреволюційну отруту серед людей. Тепер Хабаш повинен захистити те, що він здобув - захистити народ, захистити ідею, захистити революцію. Лише час покаже, чи буде світло соціялізму жити на Леванті, а чи загасить його полум'я зростаюча темрява."

