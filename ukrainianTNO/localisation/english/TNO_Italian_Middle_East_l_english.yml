 POLITICS_George_Habash_DESC:0 "Відзначення підйому Джорджа Хабаша було випробувано через труднощі, біль, сльози та кров. Народившись в палестинській християнській родині, як молодий чоловік Хабаш одразу приєднався до арабських федаїнів проти італійської окупації Леванту після Другої світової війни. Вірний марксист, Хабаш заснував Арабський націоналістичний рух, широку фронт із соціалістів, комуністів та лівих арабських націоналістів, які боролися проти італійської та сіоністської окупації Леванту - ведучи жорстоку партизанську війну проти фашистських загарбників, одночасно заявляючи свою відданість перетворенню Леванту в незалежну, ненависну за конфесіями соціалістичну республіку.\n\nНезважаючи на внутрішні розбіжності серед арабів Леванту, головним чином через спроби Арафата продати свою землю фашистам і сіоністам під час війни, Хабаш та АНМ досягли своїх революційних цілей. Народи Леванту піднялися проти імперіалізму та нетерпимості, здобувши велику перемогу після років народної боротьби, а країна тепер йде вперед, щоб побудувати своє нове майбутнє, під керівництвом товариша Генерального секретаря Хабаша.\n\nПроте боротьба Хабаша ще не закінчена. Сіоністські міліції, такі як Іргун, і навіть великі частини Хагани, підняли запеклий опір проти нової Народної Республіки, а серед арабського населення все ще залишаються реакційні та фундаменталістські настрої, які повзуть, як змія в темряві, поширюючи контрреволюційний отруту серед людей. Тепер Хабаш повинен захистити те, що він здобув — захистити народ, захистити ідею, захистити Революцію. Лише час покаже, чи буде світло соціалізму жити на Леванті, чи буде його полум'я затоптане зростаючою темрявою."
 
 