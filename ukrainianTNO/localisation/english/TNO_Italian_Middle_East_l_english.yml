 POLITICS_JORDAN_ABDULLAH_I_DESC:0 "Ім'я Абдалли ібн Хусейна - це ім'я, яке викликає суперечки: для одних він може бути борцем за свободу, який намагається найкраще відстояти інтереси свого народу перед вимогами окупанта, а для інших він не більше ніж собача лапа імперіалістів, який зрадив свій народ і спадщину свого батька. Проте правда набагато складніша, ніж будь-яка якость або міфізація чоловіка, який став символом 30 років правління Хашимітів над землями Йорданії.\n\nНародився в 1882 році від майбутнього Шерифа Мекки, Абдалла побачив, як його батько повстає проти османського халіфа і їхнього імперіалістичного контролю над Аравією і повів свої війська у конфлікт, відновивши колишні іскри арабського націоналізму. Араби повстали, і мрія про об'єднану арабську державу була на горизонті, але так і не здійснилася. Араби були поділені на монархії, кожну з яких очолював син Шерифа. Сміливий Абдалла отримав пропозицію стати королем Іраку, але відмовився, вирішивши стати еміром новоствореного Протекторату Трансйорданії. Абдалла віддано служив своїй країні та потребам свого народу до початку Другої світової війни.\n\nКоли Остромадні держави вторглися в Середній Схід та окупували колишні британські володіння, Абдалла присягнув на вірність Італії в надії зберегти своє правління під італійським орлом. Хоча італійці залишалися до нього недовірливими через його співпрацю з британцями та його прагнення балансувати італійські інтереси з інтересами свого народу, вони все ж визнавали його ефективність і адміністративні навички, особливо в порівнянні з сусідніми губернаторами в Палестині.\n\nОднак не все було добре для еміра: палестинський джихад Аль-Хусейні став причиною замаху на нього, спроба, яка потрясла всю династію Хашимітів, розколовши її на дві частини. Коли король арабів наближається до своєї смерті, напруга між двома фракціями лібералів і колабораціоністів стає нестерпною."
 POLITICS_JORDAN_NAYEF_DESC:0 "Чи варто зберігати свою династію ціною зради своїх ідеалів та самих чеснот і принципів, які колись були їм дороги? Хоча інтелектуали з їх романтичними концепціями націоналізму і демократії можуть сказати ні, Наїф бін Абдалла з Йорданії бачить це в іншому світлі.\n\nНароджений у 1914 році на зорі Першої світової війни, Наїф був ще молодим, коли його дід організував повстання проти турків. Він не пережив того часу посиленої націоналістичної боротьби в регіоні, замість цього він став свідком трагічних подій, коли дорослішав. Спочатку падіння хашимітів у Хіджазі, потім усунення хашимітського короля в Сирії через його надмірно гідне наполягання на націоналізмі, що принесло йому лише руїну, а потім, найгірше з усіх, різанина хашимітів в Іраку, яких різали як худобу на забій. Наїф не міг не замислитися, чи не буде він і його батько наступними? Голову принца постійно крутило від сумнівів і вагань щодо його власного питання.\n\nОднак він не залишався нерішучим надовго. Спалах Джихаду Аль-Хусейні став переломним моментом для нього. Його батька було позначено Аль-Хусейні та намагалися вбити, але якесь диво від самого Бога врятувало його. Однак наслідки цього інциденту відгукнулися в свідомості принца і в самому домі Хашимітів. Для Наїфа все стало очевидним. Лише придушуючи ці так звані рухи незалежності та співпрацюючи з італійцями, королівська родина могла уникнути гільйотини.\n\nХоча він завжди був улюбленим сином батька, Наїф все ж має опозицію зі сторони брата та лібералів двору. Проте король залишається відданим запобіганню падіння останнього бастіону правління Хашимітів."
 POLITICS_JORDAN_HUSSEIN_DESC:0 "Народжений у 1935 році, Хусейн ібн Талаал завжди був улюбленцем багатьох, навіть його дід не вірив, що будь-хто з його синів може бути королем, натомість він бачив потенціал у своєму онукові Хусейні і ставився до нього з особливою турботою та привілеями. Молодий та харизматичний принц змусив маси аплодувати, в той час як його батько був недовірливим через свою передбачувану божевільність, а його дядько був висміяний як зрадник та лакей.\n\nХусейн все своє життя провів під окупованим Йорданом, який був експлуатований та колонізований, спочатку британцями, а потім італійцями. Як і його попередник, Хусейн навічно ненавидів таку ситуацію. Він бачив страждання свого народу, будь то йорданці чи палестинці, і як вони були знищені під тиском Італійської імперії. Люди мріяли про свободу, про незалежність, але їхні мрії були вкрадені.\n\nОбурений експлуатацією свого народу і бажаючи побачити їх звільненими, Хусейн здобув популярність завдяки своїй ідеї "Ліберального експерименту" та анти-італійській риториці, фактично ставши обличчям йорданського реформізму та заступником свого батька в ліберальному фракції королівського двору. Крім того, його прагнення та бажання бачити свій народ щасливішим, бачити їхні мрії здійсненими та їхнє життя покращеним призвели до того, що він здобув ще більшу популярність серед простих трудящих.\n\nУлюблений король йде вперед разом зі своїм народом до нових горизонтів, плануючи продовжити демократизацію, розпочату його батьком, і просувати волю народу. Хусейн навіть наблизився до поміркованих про-італійських та лівих рухів, сподіваючись знайти спільну мову з ними на користь свого народу та країни. Однак багато хто залишається сумнівним щодо щирості та прихильності монарха до демократизації, незважаючи на його націоналістичні та ліберальні кредо; підозри, які можуть бути підтверджені, коли він почне вступати в конфлікти з більш республіканськими елементами йорданської політики."
