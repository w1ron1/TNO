 #ideas#
 IME_italys_finest:0 "Найкраще з Італії"
 IME_italys_finest_desc:0 "Під сильним, але справедливим керівництвом Генерал-губернатора далла Чієзи, наші збройні сили є одними з найкращих у сфері італійського впливу. Завдяки постійній необхідності придушення повстань - як сіоністів, так і палестинців - наші війська звикли до умов та стилю боротьби на Близькому Сході."
 IME_haganah_fatah_negotiations: "Нестабільний мир"
 IME_haganah_fatah_negotiations_desc:0 "Через крайню неефективність традиційних методів італійського колоніалізму, італійська адміністрація в Леванті була змушена вести переговори з двома основними політичними та парамілітарними організаціями в регіоні - Гаґаною та Фатагом, намагаючись зберегти стабільність у Леванті. Гаґана - це ополчення самооборони, що захищає єврейські поселення в Палестині за згодою Італії, у той час як Фатах є більшою арабською організацією та парамілітарною групою, що бореться за незалежність Леванту як окремої арабської держави. Хоча обидві організації частково готові співпрацювати з італійським урядом для досягнення власних цілей, їхні відносини між собою далекі від гармонії, і ненадійний мир між Італією, євреями та арабами постійно перебуває під загрозою."
 IME_terrorism:0 "Протилежні екстремізми"
 IME_terrorism_desc:0 "Незважаючи на зусилля Італії знайти в основному мирне рішення для заворушень у Леванті, у регіоні все ще є багато тих, хто рішуче протистоїть італійському уряду. Серед євреїв, ті, хто був незадоволений поміркованістю Гаґани, створили Ірґун - ревізіоністську сіоністську парамілітарну групу, яка бореться за єврейську державу, що охоплює весь Левант; і не боїться атакувати як італійців, так і арабів у своєму прагненні. Серед арабів була створена Харакійїн, або РАН, як вільна коаліція численних комуністичних, ліво-націоналістичних та інших груп, що борються за незалежний арабський Левант, атакуючи як італійських імперіалістів, так і їхніх уявних сіоністських маріонеток. Разом ці групи стали серйозною проблемою для італійського уряду, розповсюджуючи терор та страх серед населення своїми атаками на італійських солдатів і мирних жителів."
 IME_emirate_of_transjordan:0 "Емірат Трансйорданії"
 IME_emirate_of_transjordan_desc:0 "Поки італійська адміністрація в Леванті зосереджена на підтримці ненадійного миру в західній частині губернаторства, землі за річкою Йордан складають Емірат Трансйорданії. Ефективно васальна держава Італії, Трансйорданія має свої збройні сили (хоча й під командуванням італійських офіцерів), свій уряд (хоча й сильно залежний від італійського) і свого правителя, еміра Хусейна бін Талаала, який охоче співпрацює з Італією заради вигідних угод щодо нафти, які можна отримати, працюючи з ENI, надаючи йому достатньо багатства для модернізації та розвитку його царства. Останнім часом емір Хусейн став прихильником Фатага, особливо його більш традиціоналістського та поміркованого крила, а його глибокі кишені стали основним джерелом фінансування для організації, що викликає певне занепокоєння в Італії."

 ITA_idea_colonial_government:0 "Колоніальне правління"
 ITA_idea_colonial_government_desc:0 "Замість незалежної країни ця територія управляється безпосередньо Італією як губернаторство Імперії. Її зовнішня та внутрішня політика підпорядкована волі Риму, а її населення живе під пильним наглядом римського орла."

