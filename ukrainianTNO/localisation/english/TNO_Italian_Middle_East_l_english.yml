 #Leader descriptions
 POLITICS_GG_CHIESA_DESC:0 "Губернатор Карло Альберто далла Чієза - людина, чия швидка кар'єра здивувала багатьох, а ще більше викликала заздрість. Він - нагороджений ветеран Другої світової війни, який попросив переведення з Регійської армії в Карбіньєрі, щоб наслідувати шлях свого батька, самого генерала Карбіньєрі. Після закінчення війни його призначили в нещодавно захоплені італійські території на Леванті, де він продемонстрував свої навички та мужність у розслідуваннях та придушенні різноманітних терористичних і партизанських груп, які тероризували регіон. Із кожним арештом він швидко піднімався по сходах кар'єри в Карбіньєрі і привернув увагу Галеаццо Чіано.\n\nКоли настав час призначити нового губернатора Леванту, новий Дуче, замість вибору старого фашиста, обрав молодого генерала на посаду наступника. Це рішення було спірним, оскільки було добре відомо, що далла Чієза мало симпатизує фашизму - але за його ще короткий термін на посаді, генерал Карбіньєрі зміг навести хоч якусь мирну атмосферу на Леванті, хоча для цього йому довелося застосовувати нестандартні методи. Рим чекав результатів, і це те, що далла Чієза дав їм - екстремістські партизанські групи стали мішенню репресій, у той час як було досягнуто перемир'я серед тих, хто готовий був вести переговори. Проте доля Леванту все ще висить на волосині.\n\nДля далла Чієзи очевидно, що італійське правління в регіоні не буде тривати довго, і необхідно знайти якийсь тип угоди між Італією і численними народами Леванту, якщо цей регіон знову не буде кинутий в хаос. Губернатор Карбіньєрі зміг відновити мир у Леванті, але скільки він триватиме, ще невідомо."

 POLITICS_Umberto_La_Rocca_DESC:0 "Кажуть, що доля людей визначається в момент їх народження, і в разі Умберто Ла Рокка це, ймовірно, правда. Народившись в Порт-Саїді від італійського батька та французької матері, молодий Умберто дуже швидко став володіти трьома мовами, включаючи арабську - тому його прикріпили до арабських військ під час Другої світової війни, де він відзначився як офіцер у Північній Африці та Леванті проти британців. Після війни Ла Рокка розпочав блискучу дипломатичну кар'єру, виконуючи місії по всій Європі й навіть у США, де він представляв Італію та її новостворену імперію.\n\nПосол Ла Рокка нещодавно повернувся на батьківщину, щоб виконати ще одне завдання. Левант роками був осередком конфліктів, але після того, як Єрусалимська конференція завершилася розподілом губернаторства, у регіоні був встановлений новий, хоча й крихкий порядок, і саме Єрусалим став його центром. Створений як "корпус сепаратум", Єрусалим є нейтральною територією, яка під захистом італійських військ та керується радою представників численних релігійних та етнічних спільнот, що складають населення найсвятішого міста на Землі - і на чолі цієї ради стоїть Ла Рокка, безсторонній і нейтральний посередник, якому доручено залагоджувати конфлікти, вирішувати кризи й забезпечувати безпеку для всіх.\n\nТепер Ла Рокка знає, що від нього залежить не тільки майбутнє Єрусалиму, як безпечного притулку для миру серед народів, але й майбутнє всього Леванту - адже хоча як Палестина, так і Ізраїль неохоче прийняли створення "корпус сепаратум", мінливий характер політики Леванту означає, що загроза може з'явитися раптово й без попередження. Тільки час покаже, чи стане Святе Місто ключем до побудови тривалого миру на Леванті або центром нової бурі."

 POLITICS_Ahmed_Jibril_DESC:0 "Ахмед Джібріль ніколи не був людиною компромісу. Для нього ситуація в Леванті була простою й зрозумілою для всіх. Палестина була заселена арабами з давніх часів - потім західні імперіалісти й їхні сіоністські посіпаки окупували країну, вкрали землю, вигнали мешканців і забрали життя задля своєї ницої амбіції та жадібності. Палестинці кортіли чинити опір, але на жаль, їхні лідери були абсолютно нездібні до цієї справи: боягузи, як Арафат, готові продати свою країну в обмін на порожні обіцянки миру, маріонетки, як Хусейн, занадто задоволені тим, що їхні кишені наповнюються лірою, щоб піклуватися про свою батьківщину, і дурні, як Хабаш, занадто захоплені філософствуванням, щоб зробити щось корисне.\n\nІ ось так був заснований Фронт визволення Палестини - Генеральне командування, на чолі з Джібрілем та невеликою групою палестинських бійців. Їхня мета - звільнити Палестину від окупанта й єврея. Їхні методи - усе, що може привести до досягнення цієї мети. ФВП - ГК швидко перетворився з невідомої організації, у найвідомішу арабське ополчення в країні, оскільки багато хто перейшов до єдиної групи, яка справді готова боротися за них. І де б ФВП - ГК не з'являвся, там завжди слідували терор, кровопролиття й смерть, адже жодна ціна не була занадто великою для визволення Палестини.\n\nТепер, коли італійці пішли, Джібріль та його люди нарешті контролюють країну. І все ж, їхня робота ще далека від завершення. Сіоністська змія все ще чатує, готова знову випустити свою отруту, і з усіх напрямків вже виникають загрози для щойно визволеної Палестини. За допомогою будь-яких засобів, Джібріль і ФВП - ГК мають намір переконатися, що ніхто більше не зможе поневолити Палестину й її арабський народ, і що вічний жид отримає те, що заслуговує - за спроби вкрасти те, що належить палестинцям."
 
 #POLITICS_Hussein_ibn_Talal_DESC:0 "Колись ім'я Хусейна ібн Талаала, нащадка Хашемітів, було всього лише одним із багатьох у довгому списку місцевих правителів, племінних вождів і дрібних королів, васалів до величезної Італійської імперії; престиж династії ледве підносив його серед інших. Його батько Талаал погодився поновити угоду про захист із Італією, яку підписав ще його батько Абдалла, але в наступні роки важка хвороба Талаала зробила його абсолютно непридатним навіть до ролі маріонетки, і так молодий принц Хусейн став еміром Трансйорданії.\n\nВідтоді Хусейн активно працював над розвитком свого феодального володіння - завжди представляючи себе відданим союзником Італії, водночас таємно підтримуючи федаїнів та тісно співпрацюючи з ENI та іншими італійськими компаніями, щоб експлуатувати величезні ресурси Трансйорданії, доки відкладаючи собі величезні багатства. Тим не менш, видима лояльність еміра була винагороджена Римом, і Трансйорданія отримала значну автономію всередині Леванту, навіть здобувши власну армію. Чим більше Палестина занурювалася в етнічні конфлікти та відкриті повстання, тим більше Трансйорданія ставала близькою до моделі протекторату: стабільною, процвітаючою й лояльною.\n\nХусейн використав свої багатства та зв'язки, щоб здобути довіру Італії, і тому не було дивним те, що після того, як італійське панування на Близькому Сході було підтверджене після Другої Італо-турецької війни, Рим побачив - лише арабський король може зберегти стабільність у регіоні в довгостроковій перспективі. Тепер Хусейн, новопроголошений король Леванту, контролює нову, сповнену надій арабську націю, але майбутнє вже накладає темні тіні на його правління. Між автократичними тенденціями еміра й зростаючим єврейським опором до нового, арабського королівства, ставка Італії на лояльність Хусейна може незабаром виявитися великою помилкою..."

