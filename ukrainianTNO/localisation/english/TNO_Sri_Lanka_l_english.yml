 ## Leader Descs ##
 POLITICS_DUDLEY_SENANAYAKE_DESC: "Для Дадлі Шелтона Сенанаяке політичне життя не було його першим вибором, але завдяки його родині перед ним відкрилася можливість тривалої політичної кар'єри. Народившись у престижній родині Сенанаяке та будучи старшим сином Дона Стефена Сенанаяке, Дадлі під час навчання поступово обрав шлях у судовій системі Цейлону.\n\nПроте бажання його батька бачити сина в політиці привело його до Державної ради у 1936 році, де він понад десять років на посаді державного радника опікувався розвитком Дедіґами. Під час дебатів щодо суверенітету у 1940-х роках Дадлі підтримав вибір свого батька на користь статусу домініону для Цейлону, проте не приєднався до батька у відставці та здобув посаду міністра сільського господарства і земель, яку раніше обіймав його батько. Він зберіг цю посаду після перемоги батька на виборах 1947 року та виконував ці обов'язки до раптової смерті батька у 1952 році. На подив багатьох, генерал-губернатор обрав Дадлі прем'єр-міністром замість його кузена сера Джона Котелавали. Хоча він успішно очолив ОНП на виборах 1952 року, наступного року він пішов у відставку з посади прем'єр-міністра.\n\nОднак Дадлі повернувся в політику у 1957 році після невдалих виборів і повернув ОНП більшість на виборах 1960 року. Попри його успіх, проблеми, що стоять перед Цейлоном, не стали менш серйозними за час його правління: освітні реформи та економічна стабільність були достатніми, але сингальське питання та тісніші зв'язки з Індією спричинили незначні заворушення всередині країни. Зрештою, його політична кар'єра залежить від успіху його політики, і ще належить побачити, чи принесе він перемогу чи поразку на наступних виборах."
 