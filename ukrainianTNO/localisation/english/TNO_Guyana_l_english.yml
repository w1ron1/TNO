  GUY_news.1.t: "[Get_newspaper_header]Guyana's Black Friday"
  GUY_news.1.desc: "Afro-Guyanese agitators have attacked the town of Wismar, targeting its Indo-Guyanese residents. Businesses were looted and civilians were killed in what is now known as the Wismar Massacre. Though the official death toll from Georgetown officials stands at only five, witnesses from Wismar suggest the count to be much higher. Eyewitnesses allege that police officers had joined in the beatings of Indo-Guyanese civilians. Others reported rapes and molestations occurring throughout the night.\n\nInternational observers view the massacre as the latest continuation of "The Disturbances," an ongoing ethnic conflict since the 1950s between the Indo-Guyanese and Afro-Guyanese population. Public opinion has sharply turned against Prime Minister Cheddi Jagan, with some critics accusing him of failing to stop the conflict altogether. Others view this unrest as an opportunity to force Jagan out of power.\n"
  GUY_news.1.a: "What the hell is Jagan doing to Guyana?"
  GUY_news.1.b: "Was this the legacy we left behind?"
  GUY_news.1.c: "Leave it to the FBI to mastermind senseless killing."
  GUY_news.1.d: "A horrifying massacre."
  
  GUY_news.2.t: "[Get_newspaper_header]Burnham's Militants Strike PPP"
  GUY_news.2.desc: "This morning, Georgetown went up in flames, as militants loyal to President Forbes Burnham launched coordinated attacks on strongholds of the left-wing People's Progressive Party (PPP). Preliminary reports suggest hundreds are dead, with more wounded in its wake.\n\nWitnesses reported gang members as young as high schoolers assaulting members and suspected sympathizers of the PPP, with many Indo-Guyanese civilians getting caught in the crossfire. Local law enforcement authorities have refused to comment on the matter.\n\nThe attack marks the second major action by Burnham's paramilitaries since his inauguration, part of a campaign to beat the PPP out of future elections. Many consider Burnham to have successfully consolidated his regime, and the world waits for his next move in office.\n"
  GUY_news.2.a: "As long as Burnham knows where those bullets were made."
  GUY_news.2.b: "The Land of Many Waters turns red."
  