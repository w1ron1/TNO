  GUY_Forbes_Burnham_hog_desc: "§YПрем'єр-міністр\nНародна національна партія§!\n--------------\n§Lplaceholder§!"
  GUY_John_Carter_for_desc: "§YМіністр закордонних справ\nНародна національна партія§!\n--------------\n§LЮрист, який практикував та викладав право в Лондоні під час війни, Джон Картер є відданим союзником Форбеса Бернхема, з яким він співпрацює з 1957 року, коли він приєднався до Народної національної партії Бернхема і став її першим головою.\n\nПризначений Міністром закордонних справ частково, щоб дати Бернхему союзника в кабінеті, він ефективно виконує свою офіційну роль, хоча це забирає в нього мало часу для політичної підтримки Бернхема.§!"
  GUY_Lionel_Luckhoo_eco_desc: "§YМіністр фінансів\nОб'єднаний фронт§!\n--------------\n§LТак само відомий своєю вірністю до Пітера д'Агіара, як і своєю здатністю як юриста, Лайонел Лакху є найбільш здатним союзником д'Агіара в кабінеті.\n\nПісля служби в парламенті в 1950-х роках та на посаді мера Джорджтауна з 1955 по 1960 рік, саме під час своєї мерії він став асоційованим з Пітером, і після перемоги останнього на виборах 1961 року Лайонел став одним з перших, хто приєднався до партії Об'єднаний фронт. Наразі він обіймає посаду міністра фінансів у коаліційному уряді.§!"
  GUY_Plotemy_Reid_sec_desc: "§YМіністр внутрішніх справ\nНародна національна партія§!\n--------------\n§LСпочатку вчитель, а потім ветеринар, Птолемей Рейд тепер є одним з наймогутніших чоловіків країни. Закінчивши ветеринарну медицину в Таскейгському інституті, він спочатку не зміг знайти роботу в Гаяні, але згодом знайшов місце головного ветеринарного лікаря на потужній цукровій плантації в Гаяні, на плантації Booker’s Sugar Estate.\n\nПочавши політичну кар'єру в 1960 році як член Народної національної партії Форбеса Бернхема, він відомий своєю незалежною позицією, і Пітер д'Агіар переконаний, що Птолемей може бути переможений довгим терпінням. У свою чергу, Бернхем впевнений у лояльності Рейда до нього. Лише час покаже, хто з них має рацію.§!"

  POLITICS_Cheddi_Jagan_DESC: "Засновник і багаторічний лідер НПП, Чеді Джаган - це людина, яку або обожнюють, або ненавидять у політичному світі. Колишній Президент Гаяни, його каденція була відзначена серйозним опором як усередині, так і за межами його партії, розколами через різні політики. Він залишив пост після того, як програв вибори Форбесу Бернхему, незважаючи на великі труднощі з його боку, головним чином через зовнішній тиск з боку Сполучених Штатів. Однак Чеді - не людина, яку легко зламати, і він знову взяв на себе керівництво всією Гаяною. Після авторитарних дій Бернхема США запросили Чеді Джагана очолити уряд відновлення, за умови, що він відкладе свої радикальні економічні плани, на що Джаган погодився. Цього разу, маючи досвід минулих невдач, можливо, він зможе нарешті здійснити соціалізм у Гаяні."
  POLITICS_Peter_D_Aguiar_DESC: "Вважається найбільш жорстким захисником консерватизму та капіталізму в Гаяні, Пітер д'Агіар є людиною, яку багато хто любить, а решта ненавидить. Він брав участь у виборах 1951 року від Національної демократичної партії, але вирішив не балотуватися в 1955 або 1957 роках.\n\nЗ розколом в НПП між Форбесом Бернхемом і Чеді Джаганом, Пітер створив «Захисників свободи», антикомуністичну політичну організацію, пов'язану з Католицькою церквою, яка намагається захищати та пропагувати консервативні політики. Після укладення альянсу з Бернхемом для виборів 1961 року в спробі усунути Джагана з влади, Бернхем і його союзники успішно виграли вибори. Д'Агіар перетворив свою підтримку на політичну партію «Об'єднаний фронт» і зараз управляє разом із ПНП Бернхема.\n\nТепер він намагається реалізувати свої ідеали в Гаяні, але внутрішні проблеми в його коаліції та напруженість з Венесуелою можуть призвести до того, що ці сподівання залишаться лише мріями."

  ### National Spirits ###
  GUY_Elizabeth_British_Legacy: "Британська спадщина"
  GUY_Elizabeth_British_Legacy_desc: "Незважаючи на те, що Британська імперія більше не існує, привид імперії все ще залишає свій відбиток у Гаяні. Хоча правління під контролем США було коротким і швидко призвело до незалежної гаянської демократії, британський вплив залишився глибоким. Британські бізнесмени володіють великими частками гаянської економіки, а політична система залишається тісно пов'язаною з Вестмінстерською системою, де прем'єр-міністр є, а королева Єлизавета - главою держави.\n\nХоча адміністрація Чеді Джагана підтримувала програми деколонізації, зокрема націоналізацію деяких підприємств, створення соціальної держави та навіть новий прапор, Пітер д'Агіар не зацікавлений у продовженні цих програм і підтримує збереження Вестмінстерської системи.\n\nНевдоволення минулим колоніальним періодом глибоке в Гаяні, і поки залишаються сліди цього минулого, невдоволення буде існувати й надалі."
  
  GUY_Venezuela_border_dispute: "Ессекібо"
  GUY_Venezuela_border_dispute_desc: "Прикордонний спір з Венесуелою, який колись здавалося, був вичерпаний, знову виник.\n\nВенесуела претендувала на більше ніж половину території британської колонії Гаяна під час Латиноамериканських війн за незалежність. Хоча Гаяна вважала, що кордон був уточнений в Арбітражному вироку 1899 року, Венесуела вважає цей вирок англійською змовою.\n\nЗ моменту незалежності Гаяни у 1950 році Венесуела заявила, що більше не буде дотримуватися арбітражного рішення і заявила права на Гаяну Есекібо. Венесуела має більшу армію і здатна захопити цей регіон силою, однак США досі підтримують Гаяну в цьому конфлікті, і пряме зіткнення загрожуватиме їхнім відносинам з ОФН. Для того щоб Венесуела ніколи не спробувала захопити територію, ми повинні залишатися в ОФН та підтримувати відносини з Америкою."
  GUY_Venezuela_border_dispute_tt: "§RСпір може загрожувати єдності ОФН.§!"
  
  GUY_US_investment: "Американські інвестиції"
  GUY_US_investment_desc: "Однією з умов незалежності Гаяни було її становище в ОФН як союзника Америки та доступ до економічних ринків Гаяни. Хоча інвестиції мали місце з моменту незалежності, багато інвесторів були відлякані соціалістичними політиками Джагана.\n\nЗ обранням Пітера д'Агіара та його економічно ліберальною партією, він привернув багато американських бізнесів до інвестицій в малу економіку Гаяни.\n\nГаяна зараз переживає період економічного буму, і поки гроші продовжують надходити, економіка буде продовжувати зростати."
  
  GUY_Fragile_Coalition: "Крихка коаліція"
  GUY_Fragile_Coalition_desc: "Незважаючи на те, що НПП управляла Гаяною протягом всього 1950-х років, вона була переможена на виборах 1961 року через виборчий альянс між двома опозиційними партіями: ТUF на чолі з Пітером д'Агіаром і Народною національною партією на чолі з Форбесом Бернхемом. Цей альянс, який виник з необхідності усунути НПП з влади, тепер має співпрацювати в уряді.\n\nКоаліція не є стабільною, і за короткий час, що вона перебуває при владі, вже виникло кілька розбіжностей щодо ключових політик. Альянс залишається єдиним лише для того, щоб не дати НПП ініціювати голосування про недовіру та виграти наступні вибори. Однак, з часом і виникненням нових суперечок, більшість погоджуються з тим, що це лише питання часу, поки коаліція неминуче розпадеться."
  