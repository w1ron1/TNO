  ## Leader Bios ##
  POLITICS_GUY_CHEDDI_JAGAN_DESC: "Син бідних індоґаянських фермерів, що вирощували цукрову тростину, Джаганів батьки все ж змогли забезпечити йому освіту в столиці, Джорджтауні. Саме там він уперше пробудився політично, познайомившись із працями Ґанді та рухом за незалежність його прабатьківщини, Індії.\n\nПісля закінчення навчання Джаган переїхав до Сполучених Штатів, де познайомився з такими мислителями, як Маркс і Ленін. Повернувшись до Ґаяни у 1943 році, він цурався політики, але невдовзі перейнявся становищем робітників, що спонукало його заснувати Політичний комітет дій у 1946 році, попередника PPP.\n\nЙого політичне піднесення тривало, і 1953 року Джаган став першим демократично обраним прем’єр-міністром Ґаяни. Однак його перший термін тривав менш як 5 місяців — колоніальна адміністрація швидко відсторонила його через його радикальні тенденції. Ті самі тенденції згодом спричинили непримиренний розкол із співлідером PPP Форбсом Бернемом. Повернення Джагана на посаду прем’єр-міністра у 1957 році виявилося не менш суперечливим.\n\nЙого надії на багаторасовість були розбиті зростанням напруженості серед різноманітного населення Ґаяни та запеклим опором як колоніальних бюрократів, так і ділових магнатів. Та шанс на виживання все ще залишається — і для нього, і для його мрії, — доки він може йти по канату... і платити достатньо своїм покровителям у Вашинґтоні."
  POLITICS_GUY_CHEDDI_JAGAN_70_DESC: "Небагатьом людям вдалося звільнити свою країну від імперських кайданів. Ще менше зробили це, витративши все життя на те, щоб їм казали: свобода не для таких, як вони. На щастя, Чедді Джаган був терплячою людиною.\n\nСин бідних індоґаянських фермерів, першим актом непокори Джагана несправедливому світовому порядку було скидання кайданів бідності та засвоєння уроку з ідей Ґанді й Маркса. Влада в Ґаяні, зрозумів він, зрештою має належати народу.\n\nДругий урок він отримав у 1953 році. Після того як Джаган домігся посади прем’єр-міністра, імперія, не готова терпіти реформи, зневажила його. Влада в Ґаяні, зрозумів він, не була такою абсолютною, як голос народу.\n\nАле третій урок прийшов від близького друга та співзасновника Народної прогресивної партії. Форбс Бернем не лише розколов партію Джагана, а й зруйнував національну єдність Ґаяни, розділивши націю за расовою ознакою. Влада в Ґаяні, зрозумів він, залежала від відновлення національного характеру.\n\nДжаган засвоїв ці уроки. Він навчався в Західній півкулі, яка так хотіла його позбутися. Він навчався, коли Бернем розривав націю на частини. Тепер Джаган очолює націю, яка вже знає, хто вона, а не ким вона не є. Ґаяну, яка є індійською. Ґаяну, яка є чорною. Ґаяну, яка є корінною. Ґаяну, яка є вільною."
  POLITICS_Peter_D_Aguiar_DESC: "Пітер Станіслаус Д’Аґіар знає, що таке важка праця. Піднявши майже збанкрутілий сімейний бізнес до рівня однієї з найбагатших мереж Карибського басейну, тепер він бачить перед собою Ґаяну, яка потребує того самого. Однак порятунок нації не такий простий, як отримання прибутку.\n\nНародившись у Джорджтауні 9 жовтня 1912 року, Д’Аґіар більшу частину свого дорослого життя витягав занепалий бізнес свого покійного батька з нищівної боргової ями, формуючи етику, засновану на дисципліні та наполегливості.\n\nОгиджений заворушеннями в Ґаяні та радикалізмом Джагана, Д’Аґіар переніс свої таланти на політичне поле битви. Уклавши пакт із однодумцем Бернемом, лідером афроґаянського Народного національного конгресу (PNC), Д’Аґіар пообіцяв гроші, тоді як Бернем пообіцяв людей. Попри їхні ідеологічні розбіжності, їхня права коаліція вистояла на виборах 1965 року та забезпечила Д’Аґіару контроль над країною, придушивши політику Джагана.\n\nПісля відсторонення Джагана та бойкоту виборів PPP коаліція Д’Аґіара фактично володіє всією політичною владою Ґаяни, щоб робити те, що забажає партія. Але щоб утримати таку велику коаліцію разом, знадобилося б диво — таке, яке Д’Аґіар може виявитися нездатним відтворити."
  POLITICS_Peter_D_Aguiar_DESC2: "Пітер Станіслаус Д’Аґіар знає, що таке важка праця. Піднявши майже збанкрутілий сімейний бізнес до рівня однієї з найбагатших мереж Карибського басейну, тепер він бачить перед собою Ґаяну, яка потребує того самого. Однак порятунок нації не такий простий, як отримання прибутку.\n\nНародившись у Джорджтауні 9 жовтня 1912 року, Д’Аґіар більшу частину свого дорослого життя витягав занепалий бізнес свого покійного батька з нищівної боргової ями, формуючи етику, засновану на дисципліні та наполегливості.\n\nОгиджений заворушеннями в Ґаяні та радикалізмом Джагана, Д’Аґіар переніс свої таланти на політичне поле битви. Уклавши пакт із однодумцем Бернемом, лідером афроґаянського Народного національного конгресу (PNC), Д’Аґіар пообіцяв гроші, тоді як Бернем пообіцяв людей. На тлі ідеологічних розбіжностей їхній хиткий союз розпався, залишивши Д’Аґіару створити власний прапор: Об’єднану силу (TUF), прихисток для тих, кому не знайшлося місця: португальців, американських індіанців та правих індоґаянців, які відмовлялися брати участь у Заворушеннях.\n\nПісля відсторонення Джагана та бойкоту виборів PPP Д’Аґіар опинився на роздоріжжі. Він відкидає Ґаяну, якою правлять за расовою ознакою, прагнучи побудувати ту, якою правитимуть дисципліна, наполегливість і холодна готівка — вільну від хаосу Заворушень."
  POLITICS_GUY_RICHARD_LUYT_DESC: "Коли Річард Едмондс Лайт висадився на причалах Джорджтауна як щойно призначений генерал-губернатор, усе, що він чув, — це крики Ґаяни, яка благала його покласти край Заворушенням. На кожному континенті, у кожному конфлікті та на кожній посаді питання раси переслідувало кожен його крок. Йому доручили стабілізувати Ґаяну після радикальної політики Джагана до наступних виборів, і він отримав шанс раз і назавжди відповісти на це питання.\n\nНародившись у Кейптауні, Південна Африка, 8 листопада 1915 року, випускник Оксфорда безпорадно спостерігав, як політика апартеїду пригнічувала кожного, чия шкіра була темнішою за його власну. Однак, коли спалахнула війна, Лайт опинився серед ефіопських військ у Східній Африці. Через війну Лайт зміцнив свої зв’язки зі своїми африканськими побратимами, чия хоробрість і відданість контрастували з тим, чого його навчали вдома.\n\nПісля поразки Британії Лайт приєднався до британських вигнанців у Карибському басейні. Від дрібних завдань з економічного розвитку на Навітряних островах до масштабних зусиль із набору гарнізонів по всьому Карибському басейну Лайт довів, що є здібним адміністратором, об’єднуючи всіх, незалежно від раси, навколо спільної справи.\n\nАле коли вулиці Ґаяни вкрилися тілами, а її океани наповнилися кров’ю, Лайт мусив відповісти на заклик. Він підвів своїх чорних братів удома, підвів ефіопів у Східній Африці. Тепер він не міг підвести ґаянців."
  POLITICS_GUY_FORBES_BURNHAM_DESC: "Для Ліндена Форбса Семпсона Бернема Ґаяна без своїх африканських коренів — не Ґаяна взагалі. Захопивши кермо влади, Бернем готовий викувати націю за власним образом — із афроцентричною політикою, яку проводитимуть лише залізною рукою. Зрештою, Бернем знає, що омлету не приготуєш, не розбивши кілька яєць.\n\nНародившись у Джорджтауні 20 лютого 1923 року, Бернем виріс у побожній афроґаянській родині, де пишався своїм сімейним корінням і спадщиною. Водночас, оточений індоґаянським районом, Бернем відчував гіркоту від того, що його відсувають убік, що породило в ньому тихі підозри, яких він так і не зміг позбутися.\n\nАмбітний реформатор, Бернем увійшов у політику, заснувавши Народну прогресивну партію (PPP) разом з індоґаянським доктором Чедді Джаганом у 1950 році, рухаючись до незалежної Ґаяни. Однак серед індоґаянських прихильників Джагана він побачив загрозу. Страх. Заздрість. Образа. Усі ці почуття охопили Бернема. Незалежність Ґаяни нічого не означала, якщо його афроґаянський народ не був захищений від радикальної політики Джагана.\n\nТепер, як лідер Народного національного конгресу (PNC), Бернем є головним суперником Джагана та його PPP, голосом тих, хто опинився в меншості. Оплот проти соціялістичних ідеалів Джагана, Бернем не буде ніжним у захисті свого народу. Якщо Ґаяна має вижити за Бернема, кров проллється."
  POLITICS_GUY_LIONEL_LUCKHOO_DESC: "Гострий язик Лайонела Лакху на цей момент захищав у суді сотні ймовірних злочинців. Але в політиці адвокатська діяльність Лакху була не лише заради злочинців, а заради кожного ґаянського чоловіка й жінки.\n\nНародившись у Нью-Амстердамі, Британська Ґвіана, 2 березня 1914 року, Лайонел Лакху виріс у родині індоґаянських іммігрантів під пильним наглядом свого батька-адвоката. Пішовши його стопами, Лакху продовжив вивчати право в Англії, а потім повернувся саме тоді, коли Європа занурилася у війну.\n\nСпеціалізуючись на кримінальному праві, Лакху побудував блискучу кар’єру як один із найкращих юридичних умів не лише країни, а, можливо, і світу. Однак у міру того, як насильство в Ґаяні зростало, Лакху виявився перевантаженим людьми, які шукали правосуддя. У кожній усній промові, кожній справі, кожному вироку одне ім’я було спільним для всіх них: Чедді Джаган. До 1955 року Лакху зрозумів, що його судова кар’єра не може зупинити кровопролиття на вулицях Ґаяни. Сповнений рішучості зупинити правління Джагана, Лакху заснував Національний трудовий фронт (NLF), намагаючись забезпечити Ґаяні правосуддя.\n\nТепер, при владі, Лакху змушений балансувати між афро- та індоґаянськими інтересами, ретельно зважуючи кожну дію та слово. Але вулиці дедалі голосніше вимагають економічних реформ. Лакху мусить зробити все можливе, щоб переконати Ґаяну, що він може принести стабільність — перш ніж вирок вирішить інакше."
  POLITICS_GUY_LIONEL_LUCKHOO_DESC_2: "Велике журі винесло рішення, і його члени розділилися порівну. Народжений у 1914 році та вихований під наглядом батька-адвоката, Лайонел Лакху давно керувався принципом верховенства права. Після короткої спроби вивчати медицину він перейшов до права, склав адвокатський іспит в Англії та вирушив до Джорджтауна, щоб допомагати у кримінальному захисті. Між репутацією людини, яка виправдала сотні людей, та вступом у політику, щоб зупинити правління Чедді Джагана, на короткий час здавалося, що мало що може зупинити його піднесення.\n\nКоли Відаль вторгся до Ґаяни, здавалося, що його час як політика закінчився. Але після короткої окупації канадські війська спочатку утримувалися на своїх аванпостах, а потім змогли відтіснити противника за допомогою суринамського ополчення. Після короткого, але напруженого протистояння Відаль прийняв левову частку свого завоювання, дозволивши східній частині бути заселеною вигнаними залишками старих імперій Європи. Після нетривалого нагляду та повернення до цивільного управління Лакху обрали на роль надійної пари рук.\n\nАле тепер ці руки тремтять. У минулому Лакху й без того було важко керувати внутрішньою етнічною напруженістю, але захоплення більшої частини території Ґаяни лише перетворило її на відкриту лють. Без значної частини країни зусилля Лакху із забезпечення економічного процвітання стали цілком марними, а будь-яка спроба заявити про незалежність тепер давно випала з порядку денного. Джорджтаун може бути вільним, але якщо він не зможе невдовзі знайти рішення, сам Лакху незабаром може постати перед вироком про визнання винним."
  POLITICS_GUY_BRINDLEY_BENN_DESC: "Бріндлі Гораціо Бенн не з чуток знав про втрати чи боротьбу у відповідь. Підживлений смертю батька на бокситових шахтах, Бенн проклав собі шлях від крейдяних класів Джорджтауна до передової ґаянської політики з єдиною метою — вирвати коріння несправедливості з Ґаяни.\n\nНародившись у Джорджтауні 23 січня 1923 року, Бріндлі Гораціо Бенн приєднався до батьків у Кваквані, щоб працювати в бокситовій гірничодобувній промисловості. Прагнучи кращих можливостей, на початку 1940-х Бенн повернувся до Джорджтауна як учитель, де дізнався про смерть свого батька — момент, який змінив його.\n\nОдного вечора полум’яна промова Джагана з критикою корумпованої бокситової промисловості Ґаяни зачепила Бенна за живе. Прагнучи помститися за смерть батька, Бенн тієї ж ночі приєднався до Народної прогресивної партії (PPP) Джагана. Невдовзі Бенн використав свій досвід учителя, щоб створити молодіжне крило PPP — Прогресивну молодіжну організацію (PYO).\n\nПідіймаючись службовими щаблями, Бенн став рукою PPP, простягнутою до однодумних афроґаянців. Однак ескалація насильства підірвала його віру в PPP. Згуртувавши решту афроґаянських членів, він відколовся від партії, щоб створити Альянс трудового народу (WPA). Тепер Бенн нарешті тримає кермо влади, сповнений рішучості зцілити душу Ґаяни та поховати капіталістичну спадщину Д’Аґіара, тоді як іноземні очі втрачають терпіння."
  POLITICS_GUY_DESMOND_HOYLE_DESC: "Мало хто в Народному національному конгресі (PNC) вважав би Г’ю Десмонда Гойта особливо надихаючою постаттю. Цей стриманий чоловік не був запальним трибуном. І все ж доля помістила його в тінь правління Бернема, повівши націю крізь темні часи Ґаяни.\n\nНародившись у Джорджтауні, Британська Ґвіана, 9 березня 1929 року, Г’ю Десмонд Гойт походив із родини середнього класу та мав амбіції. Спочатку працюючи вчителем, Гойт перейшов до юридичної кар’єри, де 1960 року приєднався до юридичної фірми Clarke and Martin. Там він зустрів харизматичного вискочку Форбса Бернема, лідера PNC.\n\nДвох чоловіків мало що об’єднувало, крім кольору шкіри та бажання незалежної Ґаяни, але для Гойта цього було достатньо. Навіть у найглибші моменти особистої трагедії Гойт залишався вірним Бернему, виконуючи його прохання, водночас копаючи могили для своїх близьких. Його відданість окупилася. Гойт підіймався службовими щаблями, увійшов до парламенту, формував економічну політику Бернема та здобув місце в найближчому колі найвідданіших людей Бернема.\n\nАле Бернем залишив по собі націю, понівечену расовим насильством та авторитарним правлінням. Не маючи бажання зберігати ідеологію Бернема, Гойт має намір згорнути афроцентричну політику Бернема, знову відкрити країну для індоґаянців і перевести Ґаяну до демократії. Гойт повільно рухає Ґаяну вперед, без злоби до когось і з милосердям до всіх."
  POLITICS_GUY_OCCUPIED_DESC: "ОВН підняла білий прапор на задньому дворі Сполучених Штатів. Через річку вони чують крики й постріли в Ессекібо та сидять склавши руки, боячись приниження. Тепер, коли їхнього уряду більше немає, ґвіанці звертаються до голландських і канадських солдатів, які не змогли врятувати їх від Монкади Відаля та його наближених і перетворили їхню країну не більше ніж на стіну між Венесуелою та Суринамом.\n\nТимчасова хунта, яка тепер керує Ґвіаною, є покаранням для тих, хто не зміг її захистити. Як Наполеон на Святій Єлені, генерали дивляться на свої провали та знову й знову переплановують битви, думаючи про те, що могло б бути. У рідних країнах цих генералів їхні політики перекладають провину на них.\n\nНепідготовленість і переконання, що Венесуела блефує, списують на військових, але це не втамує гнів народу. ОВН зазнала невдачі, демократію втрачено, а щупальце Гітлера вторглося до Південної Америки. Багатьох буде звільнено, багато чого буде перебудовано, але Ессекібо втрачено, а фашисти все ще перемогли."
  ## Minister Bios ##
  GUY_Forbes_Burnham_hog_desc: "§YПрем’єр-міністр\nНародний національний конгрес§!\n--------------\n§Lзаповнювач§!"
  GUY_John_Carter_for_desc: "§YМіністр закордонних справ\nНародний національний конгрес§!\n--------------\n§LАдвокат, який під час війни практикував і викладав право в Лондоні, Джон Картер є затятим союзником Форбса Бернема, з яким він пов’язаний від 1957 року, коли приєднався до Народного національного конгресу Бернема та став його першим головою.\n\nПризначений міністром закордонних справ частково для того, щоб дати Бернему союзника в кабінеті, він поки що ефективно виконує свою офіційну роль, хоча це залишило йому мало часу, щоб політично допомагати Бернему.§!"
  GUY_Lionel_Luckhoo_eco_desc: "§YМіністр фінансів\nОб’єднана сила§!\n--------------\n§LНастільки ж відомий своєю відданістю Пітеру Д’Аґіару, як і своїми здібностями адвоката, Лайонел Лакху є найздібнішим союзником Д’Аґіара в кабінеті.\n\nПрослуживши в парламенті в 1950-х, а потім мером Джорджтауна з 1955 до 1960 року, саме під час перебування на посаді мера він зблизився з Пітером, а після перемоги останнього на виборах 1961 року Лайонел був серед перших, хто приєднався до партії Об’єднаної сили. Тепер він обіймає посаду міністра фінансів у коаліційному уряді.§!"
  GUY_Plotemy_Reid_sec_desc: "§YМіністр внутрішніх справ\nНародний національний конгрес§!\n--------------\n§LКолись учитель, потім ветеринар, Птолемей Рейд тепер опинився серед найвпливовіших людей країни. Після завершення навчання з ветеринарної медицини в Інституті Таскіґі він спочатку не зміг знайти роботу в Ґаяні, але зрештою отримав посаду головного ветеринарного лікаря в центрі потужної цукрової плантаційної промисловості Ґаяни — цукровому маєтку Букерса.\n\nЗалучившись до політики у 1960 році як член PNC Форбса Бернема, він відомий певною незалежністю, і Пітер Д’Аґіар переконаний, що Рейда можна схилити на свій бік достатньою терплячістю. Зі свого боку, Бернем переконаний у безумовній відданості Рейда йому. Лише час покаже, хто з них має рацію.§!"

  ### National Spirits ###
  GUY_Democracy_Under_the_Thumb: "Democracy Under the Thumb"
  GUY_Democracy_Under_the_Thumb_desc: "Step-by-step, law-by-law, commission-by-commission, Guyana has seen democratic institutions layered atop those of the old colony. There is no constitutional binding to cement the two together, merely the weight of accrued tradition and substantial popular participation.\n\nAnd from its base, the master of the old order, the colonial Governor, watches with unease as the latest Prime Minister mounts the teetering pile. For it is the Governor's role, his sworn duty, to maintain this creaking structure intact."

  GUY_Essequibo_Dispute: ""Hands Off Essequibo!""
  GUY_Essequibo_Dispute_desc: "The border dispute with Venezuela, once thought quashed has once again reared its ugly head.\n\nVenezuela claimed more than half of the territory of the British colony of Guyana at the time of the Latin American wars of independence. While Guyana thought the boundary was clarified in the Arbitral Award of 1899, Venezuela has called the award an Anglo conspiracy.\n\nIn 1950, Venezuela declared that it would no longer abide by the arbitration decision and has laid claim to the Guayana Esequiba. Venezuela has a larger army and the power to seize this region by force, however the USA has sided with Guyana so far in this conflict, and a direct confrontation would jeopardize their approachment to the OFN. To ensure Venezuela never makes a grab for the territory, we must remain in the OFN and cultivate relations with America."
  GUY_Essequibo_Dispute_tt: "§RThe dispute may threaten the unity of the OFN.§!"

  GUY_Anglo_American_Consortiums: "Anglo-American Consortiums"
  GUY_Anglo_American_Consortiums_desc: "Bauxite. Sugar. Rice. Three riches that Guyana's soil provides in abundance to Guyanese hands. Hands that load them, as they long have, on ships to sail far from Guyana.\n\nOnce they would have been bound for London, but now they travel under Canadian and American flags. They are measured and stored by firms like Demba or Booker Brothers. And of the dollars they sell for, only cents return to Guyana's shores."

  GUY_Racial_Polarization: "Racial Polarization"
  GUY_Racial_Polarization_desc: "Guyana is home to many races: Afro-Guyanese, Indo-Guyanese, indigenous peoples, Anglo-Guyanese, Portuguese-Guyanese, Chinese-Guyanese... and more. But it is a fractious and at times violent co-habitation.\n\nThe ethnic conflict known as the Disturbances has continued to grow since the late 1950s, with race becoming a central issue in the nation's politics. With Afro-Guyanese coalescing behind Burnham's PNC and Indo-Guyanese gravitating toward Jagan's PPP, the stage is set for contentious elections and deepening societal division."

  GUY_Apan_Jhatt: "Apan Jhatt"
  GUY_Apan_Jhatt_desc: "The riots that bled Guyana white from 1964 to 1966 left some bereaved, some others ruined, and most infuriated. More importantly, they left a long shadow of persistent racial discontent, leading in turn to mutual tension that has made Georgetown increasingly feel like a powderkeg.\n\nIn Hindustani as spoken in the Indo-Gangetic deltas, "apan jhatt" means "one's own community." As spoken in Guyana these words came to mean "support your own", a meaning allegedly invented by PPPers seeking votes among their Indo-Guyanese base. Yet the Hindustani etymology of the term obscures the fact that both sides of the Guyanese aisle are guilty of this practice. Due to this ethnic polarisation, regardless of who wins the next election, one ethnic group will find it hard to cooperate with the other. This persistent hostility is a seemingly immovable roadblock to Guyanese independence."

  GUY_Afro_Guyanese_Dominance: "Afro-Guyanese Dominance"
  GUY_Afro_Guyanese_Dominance_desc: "No one can say they did not see the current era of Afro-Guyanese dominance of national politics coming. From the outset, Forbes Burnham's political platform enshrined Afro-Guyanese interests at its core; now that he is in office, his government has indulged in retaliation directed at the previously dominant Indo-Guyanese.\n\nSuch vengeance, however, is mostly just a spectacle for the average Afro-Guyanese civilian. The vast majority of the power is centralized in the Afro-Guyanese bureaucracy and doled out only to those Burnham personally favors; the majority of the population that propelled Burnham to power is still poor. This has yet to bite Burnham, however, as interracial solidarity is as yet elusive despite a creeping realisation of the problem among his base."

  GUY_Afro_Guyanese_Dominance_2: "Afro-Guyanese Dominance"
  GUY_Afro_Guyanese_Dominance_2_desc: "From the outset, Forbes Burnham's political platform enshrined Afro-Guyanese interests at its core, and for years his government indulged in retaliation directed at the previously dominant Indo-Guyanese.\n\nThe latter may have hoped that the military's removal of the 'Comrade Leader' from power would return them to their ascendance, or at least balance the scales. Yet despite their protests and those of indigenous Guyanese, Afro-Guyanese remain in the plum posts Burnham secured for them throughout the nation's bureaucracy and nationalized firms."

  GUY_Comrade_Leader: "Comrade Leader"
  GUY_Comrade_Leader_desc: "The new leader of Guyana, Forbes Burnham, presents himself as a revolutionary par excellence and a "comrade leader" for his party. To perpetuate this image, he constantly cribs from socialist and black nationalist rhetoric - but those outside of the ingroup rapidly come to understand that this image of a revolutionary leader in the traditions of Garvey and Sékou Touré is one completely void of substance.\n\nLack of substance has not yet robbed Forbes Burnham's rhetoric of its effect on the hearts and minds of the faithful. But if it ever fails to suffice for his ambitions, he will pull out the independence card and whip up anti-Canadian fury. If now that also does not work, why, the People's National Congress will just fiddle the ballot figures and win anyway."
  GUY_Comrade_Leader_2: "Comrade Leader"
  GUY_Comrade_Leader_2_desc: "The new leader of Guyana, Forbes Burnham, presents himself as a revolutionary par excellence. To that end, he pushes towards the creation of a vanguardist - but not socialist - state under the total control of the People's National Congress. The Guyanese constitution is modified in purely personalistic fashion; the army is mollified through a constant stream of increased defense budgets.\n\nAmidst all this hue and cry it is quite clear what Burnham is aiming for. He wants to establish a party state. Since Burnham all but created the PNC, such a state is essentially a personalist vehicle for Burnham himself."

  GUY_Coalition_of_the_Few: "Coalition of the Few"
  GUY_Coalition_of_the_Few_desc: "The right-wing governing coalition recently elected in Guyana would not have been elected in a free and fair election with total participation among all political parties. Jagan's left-wing People's Progressive Party boycotting the election allowed Peter D'Aguiar to assume office with the votes of the wealthier Indo- and Afro-Guyanese communities, as well as white, Chinese, and indigenous minorities.\n\nLower-class Indo- and Afro-Guyanese are infuriated by what they perceived as a rigged vote; their fury and the anger of the PPP has turned Georgetown into a powder keg once more. Furthermore, D'Aguiar also cannot expect to know any peace in the halls of power themselves, since the populist People's National Congress is part of the coalition and carries significant influence - a knife directed at the heart of The United Force, D'Aguiar's party that sits at the head of the coalition."

  GUY_The_Hard_Sell: "The Hard Sell"
  GUY_The_Hard_Sell_desc: "Peter D'Aguiar has, from the outset of his administration, promoted Guyana as a suitable location for American investment. Under normal circumstances, he would have a strong case considering how many American and OFN businesses have already invested in Guyana. Guyana is a suitable location, after all; close to the United States and possessed of an ample supply of cheap labour, it would be a perfect choice - if not for the reality on the streets.\n\nThe economy is in chaos, with strikes and other assorted disturbances rocking Guyana's industry daily. Furthermore, politics is no more stable: daily riots and protests over sociopolitical injustices clog the streets of Georgetown and other towns in Guyana, and the People's National Congress is... not always inclined to play ball."

  GUY_The_Hand_Broken_1: "The Hand Broken"
  GUY_The_Hand_Broken_1_desc: "Cheddi Jagan has successfully pushed the break-up of Anglo-American consortiums and trusts in Guyanese territory. Nowadays, it is local capitalists and other such captains of industry that propel economic growth with governmental support.\n\nU.S. and Canadian investment is still around, but exports are no longer just raw materials: the freighters once full of sugar and bauxite are now making room for agricultural products, such as rice, corn, milk, coffee, and fish, as well as manufactured products like furniture, nails, and machine parts. All this is backed by a redoubtable Guyana Industrial Development Corporation personally brought into being by Jagan.\n\nHowever, it cannot be ignored that the direct support provided by United States intelligence helped both smooth and moderate this tumultuous transition."
  GUY_The_Hand_Broken_2: "The Hand Broken"
  GUY_The_Hand_Broken_2_desc: "Cheddi Jagan has successfully pushed the break-up of Anglo-American consortiums and trusts in Guyanese territory. He has done so while resolutely refusing American involvement and defying the retaliation that is all but certain at this stage.\n\nExports have been nearly totally redirected towards Mexico and Cuba, with Guyanase rice going to Cuba in exchange for Cuban cement for construction projects. Wealthy Indians, who years ago were a mainstay of the PPP, are ferociously opposed - but having abandoned the PPP by now their opinions are ignored. Crowning it all is a redoubtable Guyana Industrial Development Corporation personally brought into being by Jagan which manages consortiums that emerge."

  GUY_Guyanese_Capitalism: "Guyanese Capitalism?"
  GUY_Guyanese_Capitalism_desc: "The election of the National Labor Front, a populist conservative movement under the leadership of Lionel Luckhoo, signals a relieving shift in politics for the capitalist class of Guyana, long uneasy with the "radical" policies of Cheddi Jagan. Luckhoo, a devout believer in capitalism and the power of the market, has long ruled out even the slightest possibility of nationalizing foreign-owned business, a posture met with cautious optimism in Washington.\n\nAs Guyana veers away from the left, Anglo-American corporate consortiums remain dominant over the economy. At the same time, however, domestic small and medium enterprises have begun to crop up all over Georgetown and the rest of Guyana, showing forth the possibility of a uniquely Guyanese capitalism."

  GUY_A_Willing_Partner: "A Willing Partner?"
  GUY_A_Willing_Partner_desc: "The election of Lionel Luckhoo is well and good for the Americans, since Guyana has democratically chosen the Organisation of Free Nations, but the victory is not completely won yet. Lionel Luckhoo is less in control than D.C. would want.\n\nThe NLF government, though strong enough to secure Luckhoo's election for the time being, does not have a clear majority in the legislature. Though the National Labor Front had some success in challenging the PPP dominance over Indo-Guyanese voters, there is no clarity as to where they will go when the next election rolls around.\n\nIn the end, the reaction of the United States to Guyana's likely future is one of uneasy calm. They are happy with what they have, but they worry about losing it."

  GUY_Revolution_in_Progress: "Revolution in Progress"
  GUY_Revolution_in_Progress_desc: "The Anglo-American consortiums already dominated the Guyanese economy when their old friend and ally Peter D'Aguiar took office. His administration's firmly free-market policies increased their dominance and propped up their bottom lines - but now he is no longer in office and these consortiums live in fear. Brindley Benn's Working People's Alliance presides over a party filled to the brim with those victimised by the excesses of the foreign corporations, and even without such a past many of the new cabinet would advocate for nationalisations anyway.\n\nFear is spreading like wildfire even though the Brindley Benn administration has yet to say anything about the precise nature of his planned measures. What need have the foreign consortiums for official pronouncements when the WPA's priorities have been clear from the outset? Their response is also clear: capital strikes and disinvestment are accelerating, a terrible problem for Benn to confront at the start of his rule."

  GUY_New_Politics: "New Politics"
  GUY_New_Politics_desc: "Landless Indo-Guyanese sugarcane farmers joined hands with impoverished Afro-Guyanese labourers to put an end to the administration of Peter D'Aguiar in a series of strikes and mass protests referred to now as the "Disturbances". With the collapse of the D'Aguiar government and the discreditation of the right-wing, working-class Guyanese regardless of race are offering support to the Working People's Alliance of Brindley Benn.\n\n"Apan jhatt" is on its deathbed now. Racialism is far from extinguished, of course, but racial polarisation is now rubbish to the protestors returning home with memories of fighting side-by-side with people they would have violently insulted years prior. In fact the only place where racial polarisation is still much of an issue is within the WPA itself, where for some reason the Afro- and Indo-Guyanese party members are still somewhat divided."

  GUY_Reconciliation_in_Sight: "A Reconciliation in Sight"
  GUY_Reconciliation_in_Sight_desc: "Thanks to the Jagan government, for the first time there seems to be a crack in the wall of "apan jhatt" that has divided the two ethnicities of Guyana from one another. Cheddi Jagan's attempts to placate black revolutionary groups through targeted concessions of representation in government and politics has been directly linked to a reduction in previously bitter racial polarisation.\n\nHowever, not all is sunshine and rainbows in Georgetown. These same attempts to placate the other side have infuriated some hitherto firm Indo-Guyanese supporters of Jagan's People's Progressive Party. As a result, the once safe support the PPP had among the Indo-Guyanese is beginning to fray."

  GUY_Storm_Over_The_Caribbean: "Storm Over The Caribbean"
  GUY_Storm_Over_The_Caribbean_desc: "Cheddi Jagan never made any secret of his attraction to socialist and Marxist politics. This focus, reflected more and more in speeches and policy with the passage of time, increasingly and irretrievably soured his relations with the United States. At last the long-predicted permanent parting of ways has taken place.\n\nWith support from - some say at the instigation of - left-wing advisors such as Ranji Chandisingh, Cheddi Jagan passed measures withdrawing Guyana from the Organisation of Free Nations and is now making overtures to Mexico in hopes of joining up with the Veracruz Pact. These measures have infuriated the armed forces and led to fears among Afro-Guyanese and wealthy Indians of a total lack of checks and balances against Jagan's power."

  GUY_Cooperative_State: "The 'Cooperative' State"
  GUY_Cooperative_State_desc: "In order to placate the people on his journey towards centralising all power in Guyana upon himself, Forbes Burnham has frequently threatened nationalisations of what he, like any populist, has constantly called "parasite companies leeching off the good Guyanese people". Now fully exercising power over the government, he has actually managed to nationalise certain Canadian companies, notably Demba and Booker Brothers. At the same time, however, he has stopped short of nationalising American ones.\n\nSo as not to lose the favour of the USA and the OFN writ large, Burnham has embarked on an aggressive campaign of talking out of both sides of his mouth. Standing on a balcony or behind a podium, he affirms his devotion to a quasi-socialistic "cooperative state" in stemwinding, raucous speeches; he then withdraws into backrooms to enter into sweetheart deals with the same U.S. corporations he once harshly condemned."
  GUY_Cooperative_State_2: "The 'Cooperative' State"
  GUY_Cooperative_State_2_desc: "In order to placate the people on his journey towards centralising all power in Guyana upon himself, Forbes Burnham has frequently threatened nationalisations of what he, like any populist, has constantly called "parasite companies leeching off the good Guyanese people". Now fully exercising power over the government, he has nationalised any foreign corporation he has gotten his hands on - though most of the benefits have of course gone to his assorted loyalists and flunkies.\n\nUnder the present Burnham administration, there is heavy emphasis on anti-"Western" economic policy and a shift towards the Veracruz Pact. For the populace's consumption, there is also talk of a 'cooperative' state based on nationalism and patriotism. In reality, however, considering who has benefited from the nationalisations so far, the 'Guyanese cooperative state' is a thinly-veiled oligarchy."

  GUY_WIN_help: "West Indies Assistance"
  GUY_WIN_help_desc: "For almost three years, American engineers and military advisors have worked alongside federal West Indies authorities to weave the disparate islands into a singular, cohesive military architecture. From the deep-water docks of Port of Spain to the expanded runways in Kingston, the Federation has effectively turned into an unsinkable aircraft carrier.\n\nThis massive investment in interoperability and regional coordination is now yielding its grim dividend. As Caracas marches into Essequibo, they find a Guyana integrated into a sophisticated web of Caribbean defense in cooperation with the West Indies Federation. Partners alongside, Georgetown now stands ready to protect its western territory."

  ### Events
  GUY_US.1.t: "Greek Fire"
  GUY_US.1.desc: "Four paragraphs. The letter hastily written by Richard Luyt to mark and justify the removal barely filled a page, highlighting individual crises in little more than the time it took to write them, before moving on to broad condemnations of the Disturbances, his incompetence, and his left-wing stance. Designating him as unsuitable to govern Guyana, Jagan was removed from office, and replaced by little more than the calls rising from the burning void enveloping Georgetown yet further.\n\nThree speeches. With no direct successor yet selected, Cheddi Jagan was allowed to go first, and allowed to issue a harsh condemnation, rallying against the monarchy, and rallying.\n\nSecond, the leader of the opposition and the PNC, Forbes Burnham. Smiling warmly, he condemned Jagan's record, before applauding Luyt's decision warmly as Guyana's salvation. The third started, then stopped as different representatives, and then the Speaker, all failed to restore a measure of quorum above the protests of dozens.\n\nTwo crowds. Supporters of the PPP rallied around the National Assembly, chanting condemnations of colonialism, of London and Ottawa and Washington, all over the heads of the PNC members gathering ahead. Insults quickly threatened to tip into an outright riot, their fury only barely held back by national guardsmen. Among the crowds, reporters shouted dogwhistles, reading each attack as primitive, as barbarism, each speech from each politician as only loosely conceived.\n\nOne phone call. Delmar R. Carlson, the US Ambassador to Guyana, held his head in his hands. He didn't fully want to intercede in these affairs, and knew he didn't have to. Washington had been willing to use communists as meat shields across the Americas, but that didn't mean a love for them beyond that. Ottawa definitely wouldn't appreciate the intervention. But this removal was a worrying reversion of democratic norms, he thought as he reached for the phone, and an indebted Jagan could still be a useful ally..."
  GUY_US.1.a: ""Is this Luyt? You've overstepped. The United States still views Jagan as the legitimate Prime Minister...""
  GUY_US.1.b: ""Luyt? Stand firm. The United States agrees that Jagan's record is a total disaster...""

  GUY_US.2.t: "Cheddi Jagan Remains PM of British Guiana"
  GUY_US.2.desc: ""We'll keep Jagan. For now." The deputy exhaled a cloud of smoke before smothering the cigarette in the ashtray. Pens darted across papers, and briefcases were snapped shut, before the conference room had opened for the first time in hours. Washington's closed chambers empty, leaving only the dim humming of the light bulbs.\n\nAnd across the Atlantic Ocean, the decision from the White House reverberated across Guyana's streets. Crowds spilled into the streets with a chanting vigor, with red banners flying high as not only a show of support for their party leader, but also as a renewal of their defenses against the colonial hands that Jagna promised to fight off. Their survival was proof of destiny.\n\nAnd across the nation, the People's National Congress's rhetoric came into full force. Radios broadcasted spread a nationalistic fire, not only against Jagna's supporters, but also at the bureaucrats of Washington that had interfered in Guyana's election. Families listened in from home, some raising American flags, and some burning them.\n\nAnd across the city of Georgetown, a lamp hummed loudly in Jagan's office. A file swept under the door, stamped "CLASSIFIED - U.S. STATE DEPT." He promptly slid it under another folder marked "Budget Reform." Jagan glances towards the window, just long enough to catch a reflection. A silhouette watching him, before slipping away.\n\nJagan looked at the lamp. It hummed steadily. Then it flickered. Georgetown's power wasn't always reliable. But Jagan noticed that whenever he talked, the lamp would hum just a bit softer."
  GUY_US.2.a: "Don't let him forget who kept him here."

  # Just don't ask why
  GUY_US.32.t: "Condemned"
  GUY_US.32.desc: ""And we can confirm that Cheddi Jagan has been removed as Prime Minister, and will now be placed under house arrest. The former Prime Minister, who served in the role since 1961, has faced accusations of economic mismanagement and a failure to handle ongoing racial tensions, concerns that prompted the Governor-General to dismiss him from the post..." - NBC Broadcast, [GetDateText], 9:00AM\n\n"This decision may have been a disgrace," shouted Brindley Benn, his eyes scouring the crowd, "but it isn't one I'm surprised about. For too long have we bowed at the altar of Washington, of Ottawa! For too long have we expected colonial governments to treat our politics as little more than sideshow!" As midday loomed, jeers echoed across the square, condemnations of Nixon and Diefenbaker alike spat out, trampled almost as a thud.\n\n"We have to play our cards right here." spoke Forbes Burnham, cautiously looking around the room, and then at his watch. 3:00 PM. "No matter how happy we are about that socialistic charlatan being removed from office, openly supporting Luyt's actions will only play into Jagan's hand." Shaking his head, he leant forwards. "Right now, the PPP is at a breaking point. If we push a little further whilst remaining mute on his removal, we could really benefit from this..."\n\nAs the sun set, Richard Luyt fell into his seat. He had expected some backlash to the decision, but the pressure of responding to that, and of trying to maintain a limited sense of order in Georgetown, had been far more than he expected. As he closed his eyes, a phone call came, its ringing boring deeper into his skull as questions on its origins briefly, but only momentarily, paralysed him."
  GUY_US.32.a: "A country pirouettes into disaster. A sphere watches with mild fascination."

  GUY_US.3.t: "Sun Chapman Incident"
  GUY_US.3.desc: "Just after 4 PM today, the Guyanese passenger vessel, Sun Chapman, was rocked by an explosion while sailing up the Demerara River from Horadia, Georgetown. The detonation destroyed the boat's stern, leaving thirty-six casualties aboard the ship, with some drowning in the murky waters before rescuers could arrive.\n\nPreliminary reports suggest the majority of the casualties consisted of Afro-Guyanese people, fueling immediate suspicion within Guyana that this was a racially targeted attack. Within hours, Georgetown erupted into violent chaos, as reprisal killings against Indo-Guyanese suspects followed.\n\nBoth the People's National Congress (PNC) and People's Progressive Party (PPP) have capitalized on this national tragedy—one rallying for Afro-Guyanese unity, one calling for Indo-Guyanese solidarity. Neither side has called for any kind of mourning nor reconciliation.\n\nAs the bodies wash onto shore, and the once beautiful Georgetown beaches are transformed into desolate graveyards, the waters slowly turn as red as Guyana's streets. Peace in Guyana used to be difficult. Now, it is a myth."
  GUY_US.3.a: "A tragedy among the hundreds more to come in Guyana."

  GUY_US.4.t: "Contentious Election in British Guyana"
  GUY_US.4.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM JACK SMITH\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Contentious electoral results in Guyana.\n\n1. Recent elections have occurred in British Guyana, but only to the backdrop of electoral fraud and ethnic tensions. Cheddi Jagan's attempts to secure reelection under the PPP, which backs progressivism and Indo-Guyanese interests, were defeated in favour of the PNC, headed by Forbes Burnham and aligned with Guyanese nationalism and Afro-Guyanese interests.\n\n2. Ethnic tensions have been endemic in British Guyana in recent years, and the campaign only exacerbated this. Several major incidents have been recorded by news outlets, and our agents have evidence of further altercations. Moreover, there is evidence of numerous regions being outright rigged, especially in PNC-run areas.\n\n3. It is difficult to fully surmise further steps. Electoral fraud was rife on both sides, but many figures within the PPP argue that, beneath everything, Jagan was the legitimate victor. Calling for an electoral recount may further tensions, and will frustrate Canada, but such an intervention could provide a more legitimate government, aligned with us on more than ideological anti-communism."
  GUY_US.4.a: "Let Guyana choose its own devils. The results stand."
  GUY_US.4.tt: "Once in power, the §LPNC§! might be difficult to stop..."
  GUY_US.4.b: "They are right to have concerns. Push for a recount at the next meeting with the Organisation of American States."
  GUY_US.4.tt2: "§PJagan§! is no friend to American business..."

  GUY_US.5.t: "Disputed Election in British Guyana"
  GUY_US.5.desc: "The humid night hung heavily over the house of the governor general, while hums of the Guyanese horde could be heard outside, disputing the recent election's results. Ambassador Carlson sat opposite Governor General Luyt, reading the sheets laid across the table. The results were clear. The People's National Congress won a plurality, but not quite the Guyanese majority.\n\n"Seems like Burnham's boys carried the day, doesn't it, Richard?" Carlson sipped his whiskey, eyes still glued to the tallies. "Not enough to win the election, but enough to hold onto the democratic mandate."\n\n"But you've been in Guyana longer than I have." Carlson put down his glass, leaning forward with folded hands. "So Washington's asking: do we let Burnham have it?"\n\nLuyt stayed quiet, thinking about his next words carefully. He'd been to South Africa and the Caribbean. He knew the risks of propelling Burnham into power, giving the nation's reins to one race.\n\nAdjusting his spectacles, Luyt gave his answer. "The PNC speaks loudly for the Afro-Guyanese masses. But not for the Indo-Guyanese. Not for the Amerindians. Burnham's a wild card, Carlson. He can either ruin Guyana or propel it to new heights. But for now, I think we stick with D'Aguiar's right-wing coalition. It's a safer bet, a government the OFN can control."\n\n"Safer, Richard?" Carlson smiled. "They barely scraped the votes to get on the board. Like you said, Burnham's a wild card. Let's not snub his base then."\n\nThe governor general sighed. "Burnham has the people's mandate, but he is a radical. When it comes to this nation, I'm not casting the die that may doom Guyana, Ambassador.""
  GUY_US.5.a: "Back the PNC. Burnham's already won the mandate of Guyana."
  GUY_US.5.b: "Luyt's got a point. Let's just hope D'Aguiar's coalition keeps Guyana stable."
  GUY_US.5.tt: "§FWhile §DD'Aguiar§! is good for §mbusiness§!, it is unclear if he hold §PGuyana§! together.§!"

  GUY_US.6.t: "Second Act"
  GUY_US.6.desc: ""I wouldn't be here without you, that much is certain."\n\nAmbassador Carlson couldn't help but snort at such a snide remark from the newly christened President Jagan. "Oh, please," he chuckled softly, "you were going to take office, one way or another. We recognize fraud when we see it, as do your fellow neighbors." A sigh. Carlson took another swig from his glass, swirling its mahogany contents for a few polite moments. "A recount is the least we can do, Mr. President."\n\nJagan nodded silently. Cheddi Jagan's office presented itself with obvious signs of recent renovation: a patch of bleached wood near Carlson's feet, marking where a rug had once lain, with three new paintings looming over the president's desk. Imported on Washington's dime, of course. "If I may be so bold, Mr. Ambassador," Jagan set his glass upon a short coffee table before the two men, pursing his lips. "That the United States would work so tirelessly for the goodness of my nation—of my people, no less—it is..." He mulled over his words with silent care. "I must be honest, it surprises me."\n\nCarlson exchanged the sudden air of uncertainty with a reassuring smile. "The United States has a vested interest in the continued stability of Guyana, especially after the bombings in Sun Chapman. Rest assured, you will continue to receive our full support whilst in office, against threats both domestic and abroad."\n\nJagan took his glass from the table and raised it high. "Then, I will strive to be the unifier Burnham never could have been. To that much, I swear." And so a toast was had, celebrating brotherhood between nations, even as a crowd began to emerge outside of the presidential mansion. Their numbers, bearing the symbols and slogans of the PNC, swelled with a unified voice, decrying Jagan and his American benefactors. By the hour, their numbers grew, as did the volume of their voice."
  GUY_US.6.a: "And the volume grew. It grew, it grew."

  GUY_US.33.t: "The Four Little Parties"
  GUY_US.33.desc: ""Gentlemen! Order! Please!"\n\nPeter D'Aguiar sat at the head of parliament, clutching his gavel and shouting himself hoarse. The honeymoon phase had ended. His grand coalition now turned the chambers into nothing more than a children's playground.\n\nOne PNC member used his handkerchief to craft a makeshift Guyanese flag, feebly waving it from side to side, calling for Guyanese independence. A UDP man did nothing but fold his conference papers into paper airplanes, chucking them at any nearby TUF delegates. Another NLF representative fiddled with his microphones up and down with a sly grin.\n\nGavel clutched and eyes darting, D'Aguiar became nothing more than a babysitter for a coalition torn apart by independence negotiations, by economic policy, and by ethnic tension. These weren't statesmen at all, just quarrelsome children tearing this country apart.\n\nAs D'Aguiar barked orders, no one seemed to listen. One even dared to blow raspberries at the party leader. He suppressed his urge to return the favor.\n\nThe first to leave was the PNC. Their leader, Forbes Burnham, vowed to break away from the coalition, calling D'Aguiar nothing but a lapdog for their Canadian overlords. Other parties followed suit.\n\nThe meeting dissolved with slammed doors. Papers littered the floor. Spilled ink stained the carpet. The grand coalition had proved itself nothing more than quarrelsome children bickering in oversized suits.\n\nBut while the chamber had been dismissed, the Guyanese people hadn't. They stayed. They watched. And they seethed."
  GUY_US.33.a: "Nothing but babies with fancy suits."

  GUY_US.34.t: "Too Slow"
  GUY_US.34.desc: "Description: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: Jack Smith\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: GUYANESE COALITION COLLAPSES\n\nForbes Burnham, leader of the People's National Congress, has today withdrawn his support for Premier Peter D'Aguiar's government. This has left it without a workable majority to pass legislation and will mean that early elections in Guyana are imminent. The wedge issue for this collapse was the speed of which Guyanese independence was to be attained.\n\nFrom our operatives on the ground, the mood preceding this collapse was already tense. The "Big Tent Alliance" suffered several embarrassments already from a lack of unity on key issues, chaotic parliament sessions, and frequent walkouts from members. We suspect that Burnham and his party in particular may have inflamed these issues to increase his own future election prospects.\n\nWith the upcoming election scheduled, our analysts believe it will be a tense affair, to say the least. The air of racial unity within the country has dissipated, with the People's National Congress already employing xenophobic rhetoric towards the country's Indian population in sporadic incidents.\n\nIt is clear that alignment will be pivotal for the next government, as will independence. We have listed a number of recommendations below...""
  GUY_US.34.a: "Fidelity, Bravery, Integrity."

  GUY_US.35.t: "New King Walking"
  GUY_US.35.desc: "Standing by his window, D'Aguiar watched the Georgetown crowds roar like a tidal wave crashing into his office. But their cheers were not for him anymore. They cheered eagerly for their new master. He paged through the papers beside him, formalizing the transfer of power to Forbes Burnham. Each signature a nail in the coffin to Guyana's future.\n\n"Forbes," D'Aguiar muttered, still flipping through the pages, "we stood together once. Together against Jagan. Together against the red banners that threatened to swallow Guyana whole."\n\nBurnham reclined in his chair, folding his arms, curling his lips into a sly grin. "And we succeeded, Peter. Guyana is ours, not Jagan's."\n\n"Ours?" D'Aguiar snapped up, shooting a deep, burning glare into Burnham's eyes. "You tore our coalition apart, bit by bit, until all that remained was your stupid ego. I built this party. I dragged this country out of the gutter."\n\nBurnham shook his head. "It will never be out of the gutter as long as Guyana remains a pawn to Ottawa. It will never be out of the gutter as long as it remains shackled to foreign masters."\n\nD'Aguiar stared, locking eyes with Guyana's next leader. Stared at Burnham's confidence. Stared at Burnham's grin. Stared at the papers in his hands before finally handing them over, trembling.\n\nThe torch was passed. The crowd was pleased. And Guyana waited with abated breath for a new king walking."
  GUY_US.35.a: ""Maybe free from Ottawa, but now under your shackles, Forbes.""

  GUY_US.36.t: "Getting Down to Business"
  GUY_US.36.desc: "The last of the handshakes faded. The last clap on the shoulder was gone. The chamber's doors closed with a soft thud. Silence settled over the parliamentary room. The past months had seen incessant shouting, childish horseplay, slamming gavels, and partisan betrayal.\n\nBut now, the chamber was still. The ink-stained carpet, the scattered pens, the torn-up paper—all remnants of the battle that had been waged for Guyana's leadership. But the stars managed to align themselves for D'Aguiar. The leftist boycott continued, the governor endorsed his coalition, and Burnham's fiery rhetoric set him on the back foot for most of the campaign.\n\nD'Aguilar stepped to the Speaker's chair, handling the gavel with a firm grip. He'd learned from his mistakes of the past two years. Too much compromise, too much yielding, too much giving in. But now, with a unified coalition and enough constitutional power to pass just about anything he wanted, he didn't have to hold back anymore.\n\nHowever, shadows lingered, and as D'Aguiar signed away trade deals with the rest of the Ottawa commonwealth, Burnham's seductive dream of an independent Guyana free of Canadian influence paralyzed him.\n\nBut Burnham was no more. A political outcast. D'Aguiar had won. The chambers were his. Guyana was his. And for the first time, he stood alone in Parliament. Not with abandonment, but with responsibility."
  GUY_US.36.a: ""We've got a lot of work to do...""

  GUY_US.7.t: "Jagan Attempting Nationalisation"
  GUY_US.7.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM JACK SMITH\nMEMORANDUM FOR THE PRESIDENTSubject: Guyanese government embraces nationalisations.\n\n1. In the last few days, Cheddi Jagan's government has introduced measures aimed at nationalising large swathes of the economy. This move seems to have been influenced by Cuba, but much of the reasoning seems to be both practical and ideological, with Jagan aiming to bridge ethnic tensions in lieu of class. This has failed, though, and the measures do threaten local American assets.\n\n2. This shift in policy is sudden, but makes contextual sense. Internal polling data from our agent in the PPP indicates little real shift from the PNC over Jagan's moderation, but greater internal strife among the PPP's main base. Support for these measures are fairly partisan, but do have some support from Guyanese nationalists.\n\n3. The measures seem to be going ahead with little difficulty, at least internally. The PNC and TUF have both condemned the measures, the former over its impact on the Afro-Guyanese, and the latter over ideological concerns. American and Canadian businesses have also approached us to find a means to halt these, and to protect their regional interests."
  GUY_US.7.a: "This is a travesty. Jagan's moved too far, and his efforts must be stopped."
  GUY_US.7.b: "This is painful, but moving here would jeopardise our wider strategy. Turn a blind eye, albeit reluctantly."

  GUY_US.8.t: "Things Fall Apart"
  GUY_US.8.desc: "It was one of those late nights down in Sophia, Georgetown, the poorest ward of a poor city belonging to a poor country. B Field was where the vendors were, the descendants of slaves tending to other descendants whose work now carried a small stipend rather than just the threat of abuse. On this night in particular, the topic of politics arose.\n\n"Heard about Cheddi on the radio today, keeps talking a big game about bringing the wealth to us, but I haven't seen it yet." A younger voice, someone who worked with his hands his whole life, but still naive.\n\n"Ha, even if he did, would we see any of it?" Fat chance." A more gruff voice, older, and used to betrayal.\n\n"He's working for the people alright, just not our people. I see the sellers down in Queenstown getting all the handouts. Cheddi is probably down there right now checking up on them." One of the vendors this time, one without a lot of customers.\n\n"Yeah, and how would you know? You haven't moved your ass from the stall all day." Another vendor, half-smiling.\n\n"Forbes Burnham came down here and told me himself, said they were going to give our stalls to Jagan's Indians in City Hall. He said he and the PNC are going to be down there soon to give them a piece of his mind, hell, I'll show you." A creak as he got off his stool. "Anyone else who gives a damn oughta join me, cause they're going to come for you too."\n\nThe joking atmosphere dissipated for murmurs, as it became clear he wasn't the only one who felt that way. The walk turned to a march. The march became a protest, and the protest, a riot. Anything owned by someone not them was fair game, anyone different.\n\nBy daybreak, they were all equal: no one had anything left."
  GUY_US.8.a: "A single scene, multiplied across Georgetown."

  GUY_US.9.t: "Twelve Angry Corporations"
  GUY_US.9.desc: ""Did you hear what happened in Guyana?" asked one businessman, lighting a cigarette to a chorus of grumbles, a half-crowd angry. "They've stepped in to help Jagan! The fucker's getting even more aid!" Jeers rung out once more as more cigarettes were lit, but nothing else emerged immediately.\n\n"I almost regret bringing his attention to Guyana in the first place." complained another, sunglasses obscuring his eyes. "At least then, we could've gone out convinced it was weakness, not dignity." A silence, a few more lights, and then a cough.\n\n"Had stocks in their sugar plantations, and I've had to spend most of the last week finding any buyers." He paused for a moment, allowing dramatic effect to set in. "I'm down by almost a million, but I know people who are losing far more money to this."\n\n"Last time I vote for [USA.GetLeader], that's for certain." An echo of cheers rung out, but were mostly empty in enthusiasm. "I was suspicious of that pivot to propping up communists from the start, but here? Might as well give the entire country to Gus Hall right now and save us the anticipation."\n\nThe room's surroundings, already plain and featureless, faded further beneath the smoke, almost being obscured by plumes backed by lights. "And you know those Bolsheviks won't stop here. Every damn socialist across Latin America now knows that the United States will tear everything that made it great over potentially upsetting some pissant country."\n\n"I have some contacts in Guyana, saying they've got ways of resisting this socialism." mentioned another, taking the cigar out of his mouth to speak. "They're not as strong as they used to be, but there are enough people willing to resist that it could shift local affairs." A few eyes turned, but most people simply refused to bring their hopes up enough to listen."
  GUY_US.9.a: "A warning from Wall Street."

  GUY_US.10.t: "A Step Beyond"
  GUY_US.10.desc: "For once, officials within the National Assembly remained, the tension of waiting ensuring that they remain mute. Sitting in his seat, Forbes Burnham watched quietly as voting began on the bill. Despite his best efforts, any support from the United States seemed to dry up, and most external agitation had withered into a handful of demonstrators, consistently haranguing any Jagan event. A shame, but not one that mattered; the most important factor would be whether this bill survived the Assembly.\n\nOnce shuffled in, procedure worked to guide events. He stood to give a speech, condemning the radicalism of Jagan and warning of its ramifications on African-Guyanese people. Pete D'Aguillar gave his own ideological response, warning of the damage to free trade, echoed by another conservative. A welcome intervention, he thought, if one that embraced ideology too much. Jagan attempted to speak, but cut himself short. Burnham's eyes shut slightly as he watched; something had to be up.\n\nBut then came the expected drollery of the vote. The first few voters, himself included, were truly partisan, holding to party lines. From then on, however, votes changed. First, a wavering PPP member voted against, allowing his private dissent to come public. Another voice dissented from the party line next, one who had previously been totally uncertain, but leaning towards backing it. Jagan's vote came to right the ship, but as the vote continued and slipped further, the bill fell fully out of favour.\n\nAs the voting concluded, Burnham allowed a smile to creep over his face once more, looking towards Jagan's frenetic whispers with glee. Despite the United States' apparent betrayal, the budget had failed. With one flick of a wrist, D'Aguilar's proposed budget was brought back to Jagan's attention, a reduced affair mostly corresponding to increased investment in logging and security. Perhaps a rightist coalition could hold, and could become kingmakers even still."
  GUY_US.10.a: "And for a brief moment, Burnham could almost hear sighs of relief from outside."

  GUY_US.11.t: "Fast Falling"
  GUY_US.11.desc: "The National Assembly's decorum had, once again, long since devolved into chaos. Votes were quickly muffled beneath shouts from the opposition. As assembly members jostled through the protests of their opposition, Cheddi Jagan hung back, considering his position.\n\n"Do we have the votes?" he asked, yelling and turning away from the crowd slowly enveloping the Speaker's chair. Luckhoo remained silent for one moment, staring back into the crowd, and prompting Jagan to repeat himself.\n\n"I don't think so. We just lost two significant votes, and they were the most favourable. If they're voting against this, then like hell is the rest of our party!"\n\nThe words tore a chill through Jagan's heart. His eyes flicked for one moment to Forbes Burnham and Peter D'Aguilar, both still stood in perturbed rumination, and then back. "How far in are we right now?"\n\n"You're next, Jagan." another shout came out. "I'm telling you, we've lost this vote, and by a decisive margin." Panic came for just another moment, before he attempted to restore his resolve. "We can't do anything about it, Cheddi. Just bite the bullet and reconsider our next steps."\n\n"YES!" shouted Jagan, an empty pledge to a dying bill. "We'll have to moderate the bill. Only nationalise small industries, and look into reducing social spending." Jagan pushed himself further back, away from the limelight, but could still see Burnham's stance relax, his teeth crack with glee. The deficit widened; two, then three, then five. As the bill concluded, and as D'Aguillar smugly mocked his competence, Jagan felt empty."
  GUY_US.11.a: "And outside, the anti-PPP agitators became slightly wealthier..."

  GUY_US.12.t: "Rallying Cry"
  GUY_US.12.desc: "Outside of the National Assembly, the chants of protestors grew fiercer still, blaring reports about the course of voting the only thing to break up the near-deluge of chants. The controversy over Jagan's proposed budget and its ramifications had burst the seams of Guyanese politics open once more, anger and bigotry oozing over the cracks. Lines separating the two held, but the anti-Jagan demonstrators peered just slightly further, just slightly stronger.\n\nRelative silence settled over the crowds. The radio shifted, turning away from frenzied reports of international condemnation and endorsement to a cloistered, nervous wait. Then, the tallies trickled in, the numbers slowly shifting as the votes emerged. Rumours of defections and concessions fell to the wind as one representative, and then another, backed the party line, and as the vote shifted ever closer towards, and then finally to, passing the budget uncompromised.\n\nAnd then, the silence shattered into warfare. Groups of protestors turned to chants, praise merging with condemnation as individuals pushed the others back. The radios, now filling with comments of concern from upper-class individuals, were deafened by the cheers of progressives slowly marching forwards, their clashes and signs shifting ahead, and as the PNC's protesters, disheartened and distracted, saw themselves concede ground, pushed inexorably out of Georgetown's centre.\n\nAs the space cleared, the doors opened once again. Triumphant, Cheddi Jagan practically strutted out, arms outstretched as he reached for the podium. The counterprotesters, shrunken yet still motivated, gathered round with excitement as cameras rolled closer, only their flashes briefly obscuring reality even when capturing it. In coming hours, there would be condemnations from business, from the PNC, from Washington and Ottawa, all decrying the budget."
  GUY_US.12.a: "And yet, in Georgetown, Cheddi Jagan rose ever higher."

  GUY_US.13.t: "The Flowers of War"
  GUY_US.13.desc: "Outside, the rain silently rolled off the temple roof. Inside, the incense curled around the puja fire, before fading into the walls. Pandit Persuad adjusted his shawl, murmuring his final mantras, when the temple doors crashed open.\n\nMen in soaked khaki uniforms stormed in, grinding mud into the marble floors, trampling offering plates. The officer barked orders. Flower garlands scattered, marigolds crushed, altar bell ripped from its hook.\n\n"Brothers," Persuad said softly. "This is our mandir, our home. There can be no weapons here."\n\nA few soldiers glanced at him before returning to their business. His voice, drowned out by the wails of children and shouts of soldiers, could do nothing to protect their home.\n\n"Do you hear me? No soldiers here! This is the house of Shiva, destroyer of evil!" Persuad bellowed, stepping forward to push a soldier away from the crackling fire. "You are breaking the laws of man and of our gods!"\n\nThe officer strode to the pandit, saber in hand. "Is this not what Shiva wills? Destruction of your Indo-Guyanese evils?"\n\nWith a shove, the officer sent the old man sprawling into a brass lampstand, its clangs echoing off the desecrated halls. Women shielded their children. Fathers stood up defiantly, but were forced back down.\n\nWorshippers were dragged outside, the cold rain plastering the shivering bodies and stripping them of their warmth and last home in Guyana. Even the destroyer of evil couldn't stop Burnham's march on their last refuge."
  GUY_US.13.a: "And so Burnham becomes Destroyer of Guyana."

  GUY_US.13.tb: "The Day of Unity"
  GUY_US.13.descb: "Rain drizzled on the Georgetown grounds as Kwame stood among the crowd, the black, red, and gold tricolor of the People's Progressive Party waving overhead. Just last year, he'd be sprinting away from the area, praying he wouldn't be the next casualty in an Indo-Guyanese terror bombing.\n\nBut the scars left by the Sun Chapman incident had begun to heal. The last election changed him. Kwame watched ballot boxes get dumped in the Demerara. He heard Burnham declare victory before the election was even open. He saw voters beaten at stations for ticking the wrong box.\n\nAnd for what? Speeches about "African Unity" while rice prices rose beyond his reach? For endless talks about the enemy within when the real enemy was the leaking roof above his children's heads?\n\nAs the PPP speaker took the stage, he couldn't help but feel shame. Shame that just the other week, a PNC officer allowed him to steal his neighbor's confiscated land, no questions asked. Shame that he stood idly by while he ate up Burnham's rhetoric. Shame that he hated when he never needed to.\n\nBut he still smiled when he heard free elections. He still smiled when he heard promises of bread and rice. And when an elderly Indo-Guyanese man came up from behind him, not to beat him over the head with a baton, but to offer an umbrella to keep the rain off his head, Kwame still smiled.\n\nFor the first time in years, he felt Guyanese, not a pawn in Burnham's game.\n\n"
  GUY_US.13.b: "And the cracks in Burnham's regime grow..."

  GUY_US.14.t: "Burnham's Boys"
  GUY_US.14.desc: "On the outskirts of Georgetown, just a few klicks away from the city, a dozen recruits stumbled through their drills. Marching out of synch, saluting with the wrong hand, and collapsing after only a mile in the sweltering sun. It was only resolve—not strength—that lifted their stocks onto their shoulders.\n\nBut the American officers just watched with folded arms and forced smiles. One leans over to the other and mutters, "At least they'll look good in the paper." Supposedly Burnham's new batch of auxiliaries, the recruits knew not how to handle a rifle, but only how much they despised Jagan's socialist agitators running amok around Guyana.\n\nThe Guyanese violence had drastically increased since Burnham's inauguration, though it was coming from the winning side. Afro-Guyanese mobs took to the streets to terrorize any remaining People's Progressive Party members. But all attempts were sloppy, disorganized, and quite frankly, unprofessional. That's, of course, where the FBI men stepped in.\n\nYet, the officers still had their doubts. Not necessarily about the competency of the fresh recruits, but more so how arming boys straight out of high school plays out in the White House's grand realpolitik of the world. How these ragtag ruffians were supposed to curb Tokyo and Berlin's influence.\n\nBut the FBI men weren't unpaid philosophers. Quiet stipends from American bauxite and Canadian sugar industries kept them from asking questions and kept the bullets firing. And when the recruits stumbled again, dropping their rifles in the mud, one officer said, "It's good enough for Georgetown.""
  GUY_US.14.a: "Fidelity, Bravery, and Inciting violence abroad."

  GUY_US.16.t: "The Man in the High North"
  GUY_US.16.desc: "Jagan knew it was coming. From the very first night of broken bones and shattered windows, he had begun to feel the ground underneath slipping away from him, Guyana's roots disentangling themselves from his weary ankles. But knowing does not make the leaving any easier.\n\nThe humid air of Atkinson Field clung to him, giving him a final farewell of the weather. Janet already ushered their children onto the plane, but Jagan gave the fields of Guyana one last contemplative gaze. He could return. He would return. But the fields gave no answer. Guyana didn't believe him. He wasn't sure if he believed in himself anymore.\n\nSitting by the window as the engines roared, Jagan watched the Demerara River unspool before him, green and glimmering. It was no longer red from the Sun Chapman incident so long ago. He couldn't help but wonder if this was the last he'd see their rice paddies, the workers that cultivated them, the people he fought for. But the rice paddies would only turn away from him.\n\nCanada was safety, yes. It was also a cold and bitter exile. Like Bukharin or Churchill. Except war exiled them, not the democratic process. He'd remain defiant in Ottawa, but also futile like De Gaulle's lonely broadcasts. Dulled by distance, his letters and speeches would hold no effect in Georgetown. And he knew one by one, people would stop tuning in. One by one, they'd forget.\n\nBut as long as there was one believer in his ideals, he would continue fighting. Fighting for the dream of a Guyana where no race stood above any other, where no foreign shadow spoke at the pulpit, where the Land of Many Waters could be at peace.\n\nBut dreams alone cannot shield those left behind."
  GUY_US.16.a: "The dead will always remember."

  GUY_US.17.t: "The Eagle and the Jaguar"
  GUY_US.17.desc: "Carlson watched from across the room as every ballot was already penciled in before the upcoming election and maps were colored in of which districts to target next starting from the least loyal ones.\n\n"You really aren't hiding it, are you?" The American ambassador sighed. "You know, the Executive Council back in Canada's going to notice this."\n\n"They already notice it," Burnham scoffed, playfully punching Carlson with a slight grin. "They can whine and bang their gavels all they want, but Guyana belongs to me, not them. Besides, I can draw in on some favors from your folks back at the FBI."\n\nCarlson tapped ash into his tray, letting the cinders sizzle for a short while. "And what would those favors entail, Mr. Burnham?"\n\n"Cutting the crown clean off Guyana." Burnham leaned forward, muttering his words with unwavering tone. "I will give this place order. Stability. And I'll keep the money flowing into American bank accounts. As long as you tell those maple syrup sons of bitches to mind their own damn business."\n\nSilence filled the room. The humid air pressed in on Carlson, suffocating him with the deal offered. Somewhere outside, a bell tolled. Its long echoes making the choice feel all the longer.\n\nCarlson studied Burnham, cigarette smoke curling in between the two men. No promises, no refusals either, but a deal left in the room never to be spoken of again. The election had already been decided. Now, it became a question of which empire got the scraps."
  GUY_US.17.a: "Some empires just don't play fair."

  GUY_US.18.t: "The Return of Guyana's Disturbances"
  GUY_US.18.desc: "RESTRICTED/[GetDateText]\n\nFROM: WILLIAM CLINTON\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: GUYANESE STRIKE THREATENS D'AGUIAR GOVERNMENT\n\nLandless Indian sugarcane farmers and Afro-descendant workers have launched a nationwide strike against D'Aguiar's government in Guyana, threatening the government's stability amidst stalled independence negotiations. Should the strikes succeed and a leftist government take charge, Guyana's loyalty to the Organization of Free Nations will be jeopardized.\n\nAgents on the ground have reason to believe that the Manpower Citizens' Association (MPCA), People's Progressive Party (PPP), and Working People's Alliance (WPA) are backing these strikes in an effort to force D'Aguiar's resignation and align with other regional socialist blocs.\n\nIn ensuring Guyana's allegiance, American efforts will be directed to sowing dissent within the strikes, alienating any radicals, and propping up D'Aguiar's government. Possible operations may entail small-scale infiltration of leftist parties to large-scale propaganda efforts in support of D'Aguiar."
  GUY_US.18.a: "Fidelity, Bravery, Integrity."

  GUY_US.19.t: "Together For Victory"
  GUY_US.19.desc: ""Let's see here." D'Aguiar thumbed through his briefing papers, the weight of the strike leaders' ultimatum pressing heavily onto his palms. He skimmed through their demands. "Land. Food. Guyana can provide just that."\n\n"Wages," the Afro-Guyanese leader cut in, leaning forward from his chair. "And safety. We will not return to those deathtraps you call factories for just a few dollars a day."\n\nD'Aguiar lifted his hand. "Rest assured, I understand your plight—"\n\n"Do you really, Mr. D'Aguiar?" The Indian farmer's voice cracked dryly. "Do you understand the agony of our families' debt? Do you understand the pain of watching our children starve?"\n\nD'Aguiar snapped. His composure broke. His mask broken.\n\n"Do you know how I got here?" His voice echoed. "What? Like my money just grew on trees? My business was drowning in debt! I lived for years in a deficit! Maybe I don't know what it's like harvesting sugarcane. Maybe I don't know what it's like having my flesh torn apart by machines. But I know rock bottom—I know ruin."\n\nHe stopped. He let his words simmer, his fury evaporate. "And I know how to get the hell out of there. I know discipline. I know work. I offer your people an opportunity I was never given myself. The fact that you left your work today, your family today, to demand change—that's discipline. That's the spirit that'll transform the country."\n\nD'Aguiar lowered his gaze to the papers again before clearing his throat. "Now... you two have asked for a lot. And I cannot absolve myself of the blame. So let me offer you more than just money and land.""
  GUY_US.19.a: ""Ask not what you can do for me, but what I should do for you.""

  GUY_US.20.t: "Finished Requiem"
  GUY_US.20.desc: "Standing at the heart of the parliamentary chambers, Brindley Horatio Benn rested his hand on the cold wood of the Speaker's table. Around him, he heard echoes of victorious chants pressing against the wall. D'Aguiar's capitalist machine was gone, ripped from Guyana's roots, and ascended by the Working People's Alliance's great leap forward.\n\nGuyana, for the longest time, was the graveyard of empty promises. Empty promises of racial unity, empty promises of independence, empty promises of giving the country the revitalizing energy that it so desperately needed. Empty promises that his father was safe working in the bauxite mines.\n\nBenn placed a hand on the Speaker's table, the old, vacant throne of D'Aguiar, and so many others before him. His fingers trembled with the gravity of inheritance. The country was no longer a pawn to foreign players, nor a divisive circus tent riddled with factionalism. The people tore down the old order, brick by brick, shout by shout, strike by strike.\n\nBut the triumph hardly tasted delectable. Georgetown's streets still lingered with tear gas, names still written in blood, fields still littered with ash. Leadership was not a crown of glory, but a conductor's baton, riling up the masses with every swing, every decree, every speech. Benn now had to conduct the Guyanese orchestra towards a new path away from discordance.\n\nAnd so, Benn straightened his back, raising his gaze to the vacant seats that had once sat so many ignorant politicians. He had finished his requiem, a requiem for the Guyanese graves, a requiem for his father. Now began the hymn of life and healing."
  GUY_US.20.a: "Orchestrated not by one man, but by the masses."

  GUY_US.21.t: "True Colors"
  GUY_US.21.desc: "The screen flickers to life. Forbes Burnham sits rigid at his desk, a Guyanese flag draped behind him. His voice sharply cuts through the static.\n\n"Citizens."\n\n"In recent weeks, we have seen disorder. We have seen traitors masquerade as patriots. We have seen them destroy our country."\n\n"Let me be clear: the People's National Congress is the state. The state is Guyana. And Guyana will not be dictated by an unruly street mob."\n\n"To the Indo-Guyanese and Indigenous agitators—and those who shelter them—your protests are not political expression. They are rebellion."\n\n"Lay down your banners. Return to your homes. Obey the law."\n\n"If you refuse to do so, leave Guyana. Now. You are not safe here. Guyana is not your home anymore."\n\n"This is your first warning. This is your final warning. Your fight against 'corruption' and 'repression' is over."\n\nThe screen flickered sporadically before turning black. Seconds later, an emergency broadcast siren sounded, before repeating the same message.\n\nThe streets of Georgetown fell eerily silent.\n\nHalf a world away, Washington's Georgetown was abuzz with frantic calls and chaotic conferences. Burnham's true colors had finally been revealed."
  GUY_US.21.a: "That son of a bitch..."
  GUY_US.21.b: "...but he's our son of a bitch."
  
  GUY_US.22.t: "US BACKS BURNHAM AGAINST PROTESTS - WINS"
  GUY_US.22.desc: ""
  GUY_US.22.a: ""
  
  GUY_US.23.t: "US BACKS BURNHAM AGAINST PROTESTS - FAILS"
  GUY_US.23.desc: ""
  GUY_US.23.a: ""

  GUY_US.24.t: "The Agony of Those Too Loyal"
  GUY_US.24.desc: "The words in Hugh Desmond Hoyte's hands were perfect, polished phrases that he'd prepared earlier that week. Talk of national unity, a roaring economy, and a brighter Guyanese dawn. Rehearsed in front of mirrors and memorized down to the breath.\n\nEver since Burnham was suspended from the government by Ottawa, the OFN had worked closely with Hoyte to rebrand the PNC as a more moderate party. One without the raging racism. But as he stood at the podium, the words seemed to turn to ash.\n\nThe crowd below was thinner than imagined. Clear gaps could be seen in the masses, ones that would have been filled in by the thousands of Indo-Guyanese who fled the country. And their eyes. Cloudy. Glasslike. Exhausted. All belonging to a people that believed politics had become a cruel joke a long time ago.\n\nThere were not the roaring masses Burnham had commanded. These were not the cheers and claps of a proud people. This was not the speech for the right occasion.\n\nHoyte's pride turned into guilt. He could not tell the people that he was replacing Burnham. He could not tell the people that he wasn't Burnham. He could not tell the people that the PNC would be different—that Guyana would be different.\n\nHe had built his entire career in the shadow of Burnham. Loyal. Almost too loyal. Loyal to Burnham's Afro-centric policies. Loyal to his electoral fraud.\n\nNow, at the podium, standing as Burnham's successor after nearly twenty years of loyalty, he could not bring himself to promise anything to the Guyanese people. All the words sounded hollow even to him."
  GUY_US.24.a: ""I'm sorry.""

  GUY_US.25.t: "Hollow Graves"
  GUY_US.25.desc: "Each shovel strike was slower than the last. His arms ached, fingers blistered. But the rhythm kept his mind off the three shrouds laid neatly beside him. He tried to avoid eye contact with the smallest one.\n\nFrom the rusted radio perched on a small stool beside him came a broadcast, distorted by static. The phrases cracked, but they were still barely audible. "Military forces Burnham to resign... replaced by Clarence Price... promises of a peaceful future."\n\nThe words drifted one ear in and quickly out the other.\n\nHe stared at the ground. He thought about the night when they came. The boots. The mud. The door he left unlocked. The screaming. The rifles. The silence. The blood.\n\nBurnham was gone. But the three graves remained. Their house still smelled rotten. Their village still whispering in fear about the soldiers that came.\n\nAll over the country, posters were promising a new dawn. A fresh start.\n\nHe lowered his head, setting the shovel aside. This was the fresh start he was given. From father to mortician. From husband to widower. No leader could bring his family back. No speech could stitch Guyana back together."
  GUY_US.25.a: "Let's hope they're Guyana's last graves."
  
  GUY_US.26.t: "US BACKS PROTESTS AGAINST BURNHAM - FAILS"
  GUY_US.26.desc: ""
  GUY_US.26.a: ""

  GUY_US.27.t: "Guyanese Opposition Shifts Leftwards"
  GUY_US.27.desc: "TOP SECRET/[GetDateText]\n\nFROM JACK SMITH\nMEMORANDUM FOR THE PRESIDENT\n\nSubject: American response to Guyanese protests.\n\n1. Recent weeks have seen growing, left-wing protests emerge against the Guyanese government. In particular, the Working People's Alliance has become a major force, calling for further nationalizations and redistribution, and accusing the ruling party of favoritism toward the Asian-Guyanese minority. These protests have broad support from Afro-Guyanese, and the escalating violence has seen them dubbed 'The Black Power Riots'.\n\n2. There is a real threat of Guyana's government falling or being pushed radically to the left in response - with either outcome jeapordizing our commercial and political ties to the South American colony.\n\n3. The FBI has significant presence, and thus significant leeway, in Guyana. Leftist radical Professor Walter Rodney has taken a lead role in the riots and targeting him would likely paralyse the movement, but a failed operation carries substantial risk. Depending on our relations with the Guyanese government, we could provide them covert intelligence and policing support which would have similar repercussions for the movement internally but is both easier and less likely to leak."
  GUY_US.27.a: "Fidelity, Bravery, Integrity."

  GUY_US.28.t: "Shattered Requiem"
  GUY_US.28.desc: "The streets of Georgetown had fallen silent, yet the echoes of the Working People's Alliance's protests still lingered in Brindley Horatio Benn's mind. Hundreds of arrests, swift, ruthless, and backed by the American FBI, splintered the movement Benn had once led with fire and conviction.\n\nA letter weighed heavily in his hands, one he had not dared open until now. An offer to become the Minister of Community Development and Education. A seat at the table. A chance to be the voice for his Afro-Guyanese people. An opportunity to shape a future where equality was promised.\n\nBut the price was bitter. Accepting would mean abandoning the loyal men and women who marched beside him, who had followed him out of Jagan's People's Progressive Party in step. It meant joining the regime that wielded the iron fist and locked away friends and comrades.\n\nRejecting it meant clinging to a fight that was slipping away from his fingers every day. Each protest drew fewer faces. Each street saw more arrests. Each day had less hope than the last.\n\nBenn's heart ached. He remembered hearing Jagan's first speeches. He remembered believing the man was the only one capable of healing Guyana on the path to independence. He remembered joining the party to avenge his father's death.\n\nOn the steps of city hall, African civil servants were being brought in to mend the racial rift. But beneath tables and behind closed doors, the wounds still bled, as tear gas smothered Georgetown. This letter might be the last chance he had to make a difference."
  GUY_US.28.a: ""I only regret that I could not carry the dream further.""

  GUY_US.29.t: "The Day They Broke Their Chains"
  GUY_US.29.desc: "It fired up with Water Street. Dockworkers set down their tools, hoisting banners from torn sacks, painted in red. Then the sugar plantations. Afro-Guyanese students marched side by side with barefoot Indo-Guyanese farmers, chanting into the night. The voices thundered, echoing across not just in Guyana, but in the halls of Washington and Ottawa as well.\n\nGuyana for the Guyanese.\n\nIt burned from the balconies of Georgetown's mansions. Oil barons and merchants who had once ruled the city slipped away, cars loaded with cash and gold, flights headed straight to Miami or Toronto. In its wake, Guyana was left with only one people.\n\nGuyana for the Guyanese.\n\nIt peaked where Cheddi Jagan stood. Not with quiet negotiation, for it was too late for that. Not with unadulterated anarchy, for it was too united for that. It was with fire, with defiance, and with zeal. From the Parliament of his newly declared republic, his voice rang out against the Organization of Free Nations. This land is ours. This food is ours. This future is ours.\n\nGuyana for the Guyanese.\n\nAnd so, the fire simmered with Washington and Ottawa in shock. Panic set in the Oval Office. Emergency OFN conferences were called. Troops were mobilized. But it didn't matter to the Guyanese man or woman. The people walked taller. Prouder. Brighter. Whatever hardships they had ahead would not be faced divided, but as a united citizenry of a nation reborn.\n\nFor it was finally a Guyana for the Guyanese."
  GUY_US.29.a: "How united will they stand when our ships arrive in Georgetown?"

  GUY_US.30.t: "Back to Shackles"
  GUY_US.30.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: Jack Smith\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: GUYANESE GOVERNMENT QUELLS RACE RIOT\n\nThe riots in Guyana have come to an end with their leadership put behind bars, as Premier Lionel Luckhoo has signalled an end to martial law in the coming days, all in no small part thanks to our collective work. Despite attempts by malicious actors likely on the payroll of foreign governments to use the death of communist Walter Rodney for their own ends, the turmoil wrought has now passed.\n\nThe government remains committed to keeping surveillance trained on many of these agitators in preparation of more attempts to rupture its relationship with us prior to independence, keeping a tight lid on the media apparatus, but our analysts predict that the movement is spent and will unlikely be able to muster a greater show of force.\n\nPremier Lionel Luckhoo has already contacted us expressing gratitude, and is committed to allowing an easy facilitation of American investment into Guyana. His government appears set to stay in power for a long time, but hopes of conciliation and racial unity are currently shot. However, it is unlikely to severely impact its stability for the foreseeable future."
  GUY_US.30.a: "Fidelity, Bravery, Integrity."

  GUY_US.31.t: "Fall Apart"
  GUY_US.31.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: Jack Smith\n\nSUBJECT: GUYANESE GOVERNMENT OUSTED BY POPULAR REVOLUTION\n\nIn the face of overwhelming public pressure, Premier Lionel Luckhoo has resigned and his government has dissolved, unable to quell the rioting sparked by the death of communist Walter Rodney. Agitators were able to use his death to mobilize anger over ongoing issues regarding racism as a way of dislodging our influence over Guyana.\n\nIt is unclear when new elections will be held, but already, the People's Progressive Party and People's National Coalition have entered a pact on the basis of unequivocal independence from the OFN, with both Cheddi Jagan and Forbes Burnham speaking in a recent conference on their shared struggle. Our intelligence suggests Jagan will become Premier again, but with a far more radical streak.\n\nAt this point, we will be unable to further influence Guyana without taking extreme measures such as military intervention. Unless we can secure support from other members of the OFN, we recommend that the President simply denounce the radical government in power, and wash our hands of the affair."
  GUY_US.31.a: "Fidelity, Bravery, Integrity."

  GUY_US.52.t: "On the Line" 
  GUY_US.52.desc: "FROM: OFFICE OF SOUTH AMERICAN AFFAIRS\nMEMORANDUM FOR THE PRESIDENT\nSubject: Executive Update: Venezuelan-Guyanan Border Dispute\n\nThe dispute between Venezuela and Guyana regarding the Essequibo region is a long-running regional dispute dating back almost a century. The Essequibo region is a region rich in natural resources, both mineral and petrochemical, which offers a significant economic advantage to any regional power that controls it. Since 1899, the international community has recognized the Paris Arbitral Award, which assigns control of the region to Guyana, which has been an issue of significant consternation within Venezuela.\n\nWhile the issue has always been a minor cause of tensions within the region, with the installation of the new fascist government pursuing its own irredentist policy, tensions have significantly escalated within the region. Local media produces at least one sensationalist media piece a day. Some will allege that the Guyanan government brutally represses the local population, others claim that the Guyanan government seeks to stage a false flag operation in Essequibo to legitimize an invasion and regime change within Venezuela. The ruling Moncada Vidal regime has moved troops to the Guyanan border as a show of strength, but South America analysts believe that Moncada Vidal's intent goes beyond performative measures. It is considered highly probable that the Venezuelan government will escalate the conflict within the next 90 days.\n\nAn official communique to the Venezuelan government has been issued, urging the Moncada Vidal government to seek out a joint partnership for the resources in the region in the interests of global peace and stability. Guyana currently requires extensive OFN support to maintain its armed forces, but both its forces and a host Canadian garrison are considered insufficiently equipped to address a full-scale Venezuelan invasion."
  GUY_US.52.a: "Fidelity, Bravery, Integrity"

  GUY_US.53.t: "Action at a Moment's Breath"
  GUY_US.53.desc: ""...The White House condemns this brutal, unilateral invasion and calls upon the rest of the world to do likewise. The innocent people of Guyana did nothing to provoke this action by the Moncada Vidal government..." came the statement over the television. The White House Press Secretary was calm and stately, even as he was describing the nascent war in South America, attempting to project order into a world full of chaos.\n\nAt the Emergency Session of OFN High Command, few paid attention to the Press Secretary's statement as they looked over a map of Guyana. Spy planes had given a sense of the scale of the Venezuelan invasion, but the tree cover had meant the fog of war pervaded much of the battlefield. SOUTHCOM's General O'Meara commanded the room. "Gentlemen, we need to see what assets we can move now. Naval assets in the Caribbean must secure a supply pathway so we can land ground forces and resupply the garrison. Shore and aerial bombardment can inflict damage, but without men on the ground, we'll make no progress."\n\n"Let's not forget CASEVAC for our wounded. Canada has no shortage of volunteers willing to rescue their comrades-in-arms." General Austin Law remarked. "We'll coordinate with your forces and land in the first wave, if possible."\n\n"The Secretary of State has promised a full embargo," O'Meara nodded and continued, "but we need the ships to make that happen. I don't want a single ship entering or leaving Puerto Cabello. Now, get everything done, we need our counterattack prepared yesterday. I want sealift capacity reports on my desk pronto."\n\nThe television continued to broadcast the Press Secretary's words. "The United States has announced a formal blockade of Venezuela until their aggression ceases, and we encourage all members of the OAS and OFN to do likewise.""
  GUY_US.53.a: ""Easy words when you aren't the one doing it," muttered O'Meara."

  GUY_US.54.t: "The Lull"
  GUY_US.54.desc: "It had been a tense few weeks, but the storm had broken over Guyana. OFN troops had landed and reinforced key fighting positions in Guyana. Bombers had reduced supply routes and hubs to rubble, sparking a mass civilian exodus evacuating their dead and wounded from Anzoátegui, Monagas, and Sucre. The eastern coasts of Venezuela were under constant bombardment, and the electrical and oil infrastructure of the country were in shambles. By any metric, the OFN had secured an overwhelming victory, and the badly-battered Venezuelan army had retreated in failure, harried by shells and bombs every step of the way.\n\nAnd yet, General O'Meara didn't see this effort as finished. Even if the bulk of the Venezuelan army's armored corps was destroyed or abandoned, that still left plenty of manpower with air support. Tanks could be purchased from Germany with oil from the Orinoco basin. Moncada Vidal was unlikely to take this defeat lying down - he would need to galvanize his people if he hoped to remain in power. And so what did that mean after this operation was wound down? Would there be another frantic planning session in the Pentagon? Another round of massacred Canadian and Guyanese garrison troops? A periodic cost of blood and treasure as Vidal threw his army on the spears of the OFN again and again?\n\nO'Meara looked to his aide. "Take this down. Ground forces report successful operations. The enemy has issued a general retreat and has fallen into disarray. However, it is unlikely that the dispute regarding the Essequibo has come to its final conclusion. It is the opinion of USSOUTHCOM that Moncada Vidal is likely to attempt another attack after OFN forces have left. The recommended course of action is to remove Vidal from power and rebuild Venezuelan governance to ensure regional stability." O'Meara looked out to the west, then turned back as his aide finished his dictation."
  GUY_US.54.a: ""Send that to the Joint Chiefs, they'll forward it on to the SecDef and the President. And let's prepare for another storm.""
  GUY_US.54.tt: "§YA coordinated invasion of [VEN.GetFlag] §SVenezuela§! by joint [VNI.GetFlag] §mOAS-OFN forces§! will be put to vote in an OAS committee session.§!"
  GUY_US.54.tt2: "§F------------------------------------§!\n§YTo disrupt coordination and logistics between [COL.GetFlag] §$$Colombia§! and [VEN.GetFlag] §SVenezuela§!, we will authorize §Rbombing sorties§! inside the former and sabotage their assistance to the §,Bolivarian regime§!.§!"

  GUY_US.55.t: "A New Old Flag"
  GUY_US.55.desc: "From the Office of South American Affairs\nMemorandum for the Director\nSubject: FALN - Bandera Roja\n\nThe Fuerzas Armadas de Liberación Nacional - Bandera Roja (Armed Forces of National Liberation - Red Flag) is a large communist movement in Venezuela under the command of Américo Martín. While a left-wing partisan movement in Venezuela has been a known factor, the rising size and strength of the faction have allowed us to gather sufficient information about their intentions and capabilities.\n\nFALN - BR officially considers itself to be the next iteration of the Fuerzas Armadas de Liberación Nacional (FALN), a group previously thought near-exterminated after the rise of the Bolivarians to power, and is led by Américo Martín, one of the former caudillos of the FALN. FALN - BR acts as a haven for left-wing opponents of Moncada Vidal and has been steadily gaining in power as opposition continues to grow against Vidal and the Bolivarians. Martín espouses Amazonist ideology, stressing guerrilla warfare away from urban population centers and a focus on rural communities. He has become notably popular in Venezuela's southern rural region, where the group has attempted to take control of key supply hubs and seize weapons from Bolivarian arsenals. With the group's growing strength and Vidal's failed invasion of Guyana eroding his support and popularity, Bandera Roja has the strength to pose a moderate threat to Venezuelan internal stability.\n\nWhile the group is hostile to Moncada Vidal, outreach toward the group is strongly discouraged. The group expresses anti-US hostility and aggressive nationalist ideals and would be highly unlikely to ally or coordinate efforts to attack the Bolivarian regime. They may be useful in distracting government forces, forcing them to split their forces and preventing a unified defensive plan. If the Bolivarians and the FALN forces can weaken each other, that will be ideal for the transition from OAS occupation to democratic governance."
  GUY_US.55.a: "Fidelity, Bravery, Integrity"

  GUY_US.56.t: "Click"
  GUY_US.56.desc: "News services' cameramen jostled for position as General Rathvon Tompkins, head of the Inter-American Police Force, conducted the first of his frontline visits. OFN and OAS imagery crept into every shot. But only veterans, journalists or soldiers, noticed the conspicuous absence of American flags among Tompkin's troops. One who did, the war photographer with the Post, managed to capture the Marine general grimacing while speaking with the logisticians on the beach, door of his jeep slightly ajar, with Carúpano proper in the background. Front page material? Perhaps.\n\nIn Carúpano, the enemy was unseen but heard. The networks' TV cameras switched on to record Tompkins' unflinching drive past turn-of-the-century mercantile buildings and a small crowd of local onlookers, the sound of retreating Venezuelan National Guard potshots in the distance. The photographer could only snap Bandera Roja communist graffiti scribbled over a flattering Bolivarian mural of Colonel Moncada Vidal. Page 2 at best.\n\nNo firefights, no corpses piling up, just Tompkins moving steadily forward in the jeep as. The war photographer grabbed a photo of some lifelike statues of black children. Local color. He'd be relegated to the Culture section at this rate. A humiliating but quick end to a phony war.\n\nInter-American soldiers stood listlessly around Carúpano's city hall, snapping to attention only when they realized who the jeep carried. Those with more gusto 'stormed' the building to raise the OAS flag. Tompkins looked on with a nod, and the photographer looked on at him, heart sinking.\n\nBut there. Behind Tompkins. Glaring at the flag. A Venezuelan teen, lean frame, no older than 16. Fists clenched. Eyes fiery. Mouth poised to scream. A flash captured the teen, Tompkins, the flag, the growing crowd. The growing hate. This one would surely earn him his Pulitzer."
  GUY_US.56.a: "That's when he knew it would be war, after all."
  GUY_US.56.tt: "§QOAS§! forces must defeat both §oBolivarian§! and  §VRed Banner§! Forces to secure a stable future for [VEN.GetFlag] §SVenezuela§! and §Mpeace§! for the region."
  
  GUY_US.57.t: "Mission Accomplished"
  GUY_US.57.desc: "Medellín may have been one of Colombia's most important cities and the cornerstone of Colombia's efforts to support Venezuela, but from the altitude that Gabriel Garcia had flown, everything became a blur of colors. When Colombia expressed their support for the Bolivarian government, the United States stated that such a policy decision had made Colombia an unfriendly country. When Colombia followed with material support, that made them their enemy, and subject to bombing supply shipments and depots that were supporting the Bolivarian war effort.\n\nIt was doubly ironic for Gabriel. He had been taken by his parents when he was just a baby, and emigrated to the United States, literally in a swaddling cloth as his parents crossed the border. His father had worked humbly to support his family, but he was bright enough to earn sponsorship from his Senator to attend Colorado Springs for his son. He would prove to the country that had taken his family in that he was cut from the finest cloth, that he could serve them with distinction.\n\nCertainly, he was being tested on that now. His people, those down below, were his targets. People that, with a simple flip of a coin, would have been his friends and neighbors, were now little more than the drone of his control panel when his air-to-ground missile achieved target lock. But he had volunteered for his country. He had held his right hand up, swore an oath in front of God that he would uphold the Constitution and accomplish his mission. He was a soldier, and his mission was his life. That life was given to him by the United States, and now that life had asked him to take it from those who would oppose it."
  GUY_US.57.a: "Another target lock, and another missile fired home. Gabriel truly was cut from exceptional cloth."

  GUY_US.58.t: "No Joke" 
  GUY_US.58.desc: ""We Canadians are not meant for hot weather," Private Burt White muttered, the joke never getting any funnier nor providing any relief from the relentless humidity, no matter how many times he told it. The garrison in Guyana was a bit of a wash detail, oppressive temperature and horrible insects aside. This post was one of the closest to the Venezuelan border. Life on base consisted of basic border patrols in coordination with the locals, drill, and a whole lot of standing around.\n\nWhen the new Vidal government started pissing and moaning about Essequibo, the media talked a big game about how it was the end of the world, but the General Staff said that it was mostly bluster meant to rally the populace and domestically secure a fragile new government. Every so often, the Canadians heard a boom in the distance, sometimes a few in sequence - nothing but a chest-thumping artillery shot, the louie had said. What the General Staff was really worried about was provocations and infiltrators attempting to stage a false flag attack, which meant the hated jungle patrols that Burt despised so much were increased.\n\n"Christ Almighty, quit bitching," Corporal Miller shouted back at him. "Something's wrong with the radio. Getting spotty transmission from base."\n\nA couple of booms in the distance. Then suddenly, the world erupted in fury. A shriek and an explosion, and Burt White was thrown to the ground. Gunfire, not from one of his own, nearly deafened his head, compounding the pounding. When White's eyes came back into focus, he saw Miller struggling to get back to his feet. Another private, Burt couldn't tell who, was split in two.\n\nWhite went to the radio to try and report that they were attacked and help Miller pull himself up, and that's when he saw the brush move. Venezuelan infantry wearing jungle camouflage emerged from the trees and shot Miller and White without so much as a smile."
  GUY_US.58.a: "Across the Venezuelan border, platoons of Canadian and Guyanan forces are caught unprepared and shot to pieces."
  ESQ_VEN_invasion_tt: "§F------------------------------------\n§![GUY.GetFlag] §VGuyana§! will fall without §Yaid§!. The loss will cripple the §QOFN§!'s credibility and encourage §ofascism§! to spread in South America. The unprepared §QOFN§! forces will need to maintain control of §VGeorgetown§! to receive reinforcements, push back the [VEN.GetFlag] §SVenezuelan§! invaders, and keep the torch aflame.\n§F------------------------------------\n§!§YThe success of the Venezuelan offensive will be decided by the ghosts of the last decade.\n\n§!The strength of the regional coalition rallying to Guyana's aid will be directly proportional to the OFN's past victories in both proxy conflicts and intelligence operations. Likewise, where it has faltered, Venezuela shall find its path significantly less contested."

  GUY_US.59.t: "Business as Usual"
  GUY_US.59.desc: "The Secretary-General straightened his tie. "With that, the final vote is concluded. By an overwhelming majority, the OAS has affirmed the United States's proposal for a peacekeeping resolution in response to the Venezuelan government's actions labeled as crimes against humanity. I thank the committee members for their arguments and votes. This session is adjourned." With a rap of the gavel, the OAS had confirmed - they were going to war.\n\nThe vote having been an afterthought, a briefing was already underway in the secure conference room in the building, a line of Central and South American generals, small flags in front of their seats, sat across from General O'Meara and an entourage of OFN generals. "General Tompkins," General O'Meara turned to the craggy-faced Marine general to his left. "Give a rundown of the shore landing."\n\nGeneral Rathvon Tompkins stood up and pointed toward the map of Venezuela's coastline. "After we assemble our forces in the Caribbean, we'll start shore bombardment at these locations. Naval and aviation assets will strike these defenses to soften the LZ for our landing craft. We'll be landing at these seven locations. Marines will land and secure the beachhead for infantry landings. The OAS will administer joint supply depots, and we will have a dedicated logistics and signal corps to ensure interoperability between OAS and OFN forces.\n\n"This will be a very complicated undertaking. Who will be in overall charge of the mission?"\n\n"General Tompkins has the credentials to see it done. His actions in the region have given him strong local knowledge, and he has worked with OAS and OFN liaison forces. He will coordinate the mission, and in the next stage of operations, will command the OAS transitional military leadership as we work to restore Venezuela to rational statehood.""
  GUY_US.59.a: "One man with many flags behind him."

  GUY_US.60.t: "The Mess"
  GUY_US.60.desc: "From: Office of South American Affairs\nMemorandum for the Director\nSubject: The Fall of Georgetown\n\nThe situation in Essequibo has become untenable. With the fall of the capital of Georgetown following days of siege and the retreat of the Canadian garrison, it has become impossible for the OFN to maintain an intervention force across the whole of Guyana. While key persons of interest have been evacuated, drumhead trials and summary executions have become increasingly common. Revolts have popped up across the country against Moncada Vidal and the Bolivarian regime, and these are often brutally suppressed by Venezuelan forces when possible. Already, hundreds of people have been reported dead, with even more reported missing. OFN High Command was unprepared and uncoordinated, and has taken responsibility for the failure. The Office of South American Affairs is conducting an internal review to discover intelligence failures on our part - our preliminary report will be delivered within 30 days.\n\nThe Venezuelans have begun mobilizing forces to garrison the Essequibo and move in extraction equipment for the valuable resources of the region. Canadian forces have retreated to eastern Guyana and have received reinforcements from Dutch forces in Suriname. They have established defenses and provide a credible enough deterrent to prevent Venezuela from seizing the whole of the country. They will maintain the area under military jurisdiction.\n\nTalks have already begun, but it is unlikely to amount to much. OFN High Command is unwilling to push to maintain much of Guyana, save what we already occupy. It is advisable to allow the Venezuelans to occupy the Essequibo rather than attempt an attack, which will undoubtedly cause skyrocketing casualties on both sides; the results would only create further instability and could create significant domestic backlash."
  GUY_US.60.a: "The handwriting became increasingly sloppy as the report went on, as Simón Rodríguez could barely control his pen."

  GUY_US.61.t: "What Defeat Sounds Like"
  GUY_US.61.desc: "On the steps of the Hall of the Americas in Washington D.C. stood a lectern and a pale OAS spokesman. On the green Ellipse lawn in front of him waited the press, in its own way as vicious as the Venezuelan guerillas that had brought them all here today.\n\n"The OAS Inter-American Police Force is leaving Venezuela. Our hemisphere owes a deep debt to the brave troops that fought under General Rathvon Tompkins. Together, they debilitated the fascist Bolivarian and communist forces present in Venezuela to such an extent that they pose a reduced threat to regional security. This represents success in the fundamental mission we set out to accomplish."\n\nHe stammered over the outright lie, knew it would probably be his head. But momentum kept him talking, "However, these radical groups remain active in Venezuela. Forces of OAS member states will accordingly remain active in monitoring and defending against these threats. This monitoring and defensive stance will be performed entirely outside Venezuela's borders, minimizing casualties and expenditures."\n\n"We continue to call on Venezuelans to fight against the forces of chaos and violence that dominate their country. Venezuelans, your security and liberty are in your hands. Know that you have a willing partner in the OAS, and we are eager to see you rejoin the community of American nations.\n\nThe spokesman gulped, "Questions?" And every hand in the crowd went up."
  GUY_US.61.a: "Words can't hide bodybags or the flag flying over Caracas."

  GUY_US.62.t: "The Frontier Cavalry Dance"
  GUY_US.62.desc: "The greasy stink of fried chicken filled Lewis' nose. He hadn't eaten all day, from the moment he'd woken in the early hours he'd been hovering over a radio at the Miami field office fueled by little more than coffee and determination. With each swallow he felt his energy return a little more, each -\n\nHis hungry trance was broken by a call from the break room door. "Lewis, get out here!" it cried. "Tompkins did it!"\n\nThe chicken was left on the table as Lewis dashed out, into an office filled with the cheers of an ecstatic FBI. There was someone standing on a table, reading the cable again to the clink of champagne glasses and bottles below him, retrieved from some office hiding place. "Venezuela's military has collapsed. OAS forces making rapid progress. Caracas Secured." Brief, but exactly what they'd been waiting to hear.\n\nSome agents were turning up radios as all discarded their work for celebration. Lewis smiled as he weaved through them celebrating. They had been practically living at the office, monitoring the intervention. They needed the release. He reached his desk, picking up his radio, and taking it into the relative quiet of the toilet. He tuned it to a frequency he knew well. RCR, Radio Caracas Radio. He almost dashed into a cubicle, listening to the Spanish.\n\nIt was matter of fact, at odds with the FBI exuberance vibrating through the walls. A man read a script, voice cold and emotionless. "The city has fallen. The Bolivarianists have been defeated. The communists have been defeated. Remain in your homes. Follow all instructions from OAS forces." It played on repeat. Lewis couldn't help but be disappointed. They liberated them and the radio was playing an announcement like that? Where was the joy of his fellow FBI agents? He'd read reports that the locals were cagey, not helping their military, nor the communists, nor the OAS, but there was a US flag over Caracas now."
  GUY_US.62.a: "Didn't they know they had been rescued?"

  GUY_US.63.t: "An Abject Failure"
  GUY_US.63.desc: "From: Office of South American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: OFN-OAS Intervention in Venezuela\n\nThe situation in Venezuela has stabilized in an unfavorable direction. Following Moncada Vidal's assassination, the country experienced a period of prolonged rural crisis as Moncada Vidal's successor, Manuel Azuaje Ortega, and the FALN rebels struggled for control as rural and urban centers collapsed into open revolt and warlordism. This would have been an opportune time for the OFN-OAS forces to seize control of key regions in the country, however, Azuaje Ortega and the Venezuelan armed forces were able to secure their position and effect control over the majority of the country. The current status of FALN leaders is unknown, but rumors persist that most have been taken to secret prisons to be tortured by the regime, establishing them as an example for rebels for the future regime.\n\nThe failure of the OFN-OAS forces to credibly effect the removal of a single tinpot dictator will have worldwide ramifications. Japanese and German military and intelligence services are undoubtedly seeing weakness in the American continent and may be more willing to finance and supply proxy conflicts in South and Central America. More resources may need to be allocated to regional offices to maintain vigilance against any foreign-backed conflicts, weakening American positions in Europe and Asia.\n\nAfter-action analysis will certainly center on setbacks in the military, but we would be remiss if we did not examine the failures in our own processes as well. Failure to learn the lessons of this failure will only compound our humiliation on the world stage and may cost the lives of our agents."
  GUY_US.63.a: "Fidelity, Bravery, Integrity"

  GUY_US.64.t: "Involvement in the Intervention Force?"
  GUY_US.64.desc: "The American government has contacted the [?USA_VNI_support_requester.GetAdjective] government through diplomatic channels, requesting us to support the OAS-OFN Intervention Force in Venezuela by sending a volunteer division to Guyana. We have been contacted because of our close ties with the OFN.\n\n- The OAS-OFN Intervention Force has been set up by the US after the right-wing fascist Bolivarian Venezuelan government launched the invasion of [GUY.GetName]. In response, the US government sent support forces to the Guyanese government and the colonial garrison. Now, with the Guyanese front stabilized, they have started preparing for an intervention on Venezuelan soil.\n\n- We must carefully consider this choice, as this means committing to a war effort that many would consider unnecessary. If the OAS-OFN Intervention Force prevails, it will improve our standing with the OFN and OAS member states, especially the US. However, in the scenario that it doesn't, then we will have sent our own men to die for nothing."
  GUY_US.64.a: "They have our support."
  GUY_US.64.b: "They think we will send more to the meatgrinder?"

  GUY_US.65.t: "A New Ally for Freedom"
  GUY_US.65.desc: "We have received a response from the [?USA_VNI_support_requester.GetAdjective] government on our request for aid in the OAS-OFN intervention. Following tense negotiations, it seems the [?USA_VNI_support_requester.GetAdjective] diplomats have seen the moral necessity, and strategic importance, of returning a stable democratic regime to Venezuela.\n\nThe [?USA_VNI_support_requester.GetAdjective] forces are to serve as their own division in the intervention, although still led by us. The division is also expected to be supplied by their home country. Certainly with their help, Venezuela can be stabilized."
  GUY_US.65.a: "One more for the struggle against tyrants."

  GUY_US.66.t: "No Deals Made"
  GUY_US.66.desc: "You shouldn't be reading this"
  GUY_US.66.a: "Ok"

  GUY_US.67.t: "The Specter of Conflict"
  GUY_US.67.desc: "Bob Young sat facing the camera in his gray suit. "Good evening and welcome to ABC News Tonight with Bob Young. Our top story takes us to Venezuela, where the Bolivarian government in Caracas has announced final victory over the communist FALN insurgency. Following intense fighting, multiple critical strongholds have been crushed, with many guerrilleros surrendering en masse to government forces or fleeing as individuals or small groups. The OAS force has refused the Bolivarian government's orders to withdraw from the country, as the Secretary of Defense announced that the OFN operation will continue to 'ensure stability in the country for the people of Venezuela and the regional stability of the Americas as a whole.' For more, we go to ABC's own Frank Reynolds in eastern Venezuela.\n\nFrank Reynolds wore a linen suit as he stood against a cream-colored wall of a building that had been taken over as part of the OAS's regional operations base in this sector. "Frank Reynolds here in Venezuela, where OAS operations continue against the Venezuelan government. The OAS remains committed to their battle plans. The frontlines have become more static as conventional warfare becomes more prevalent with the surrender of the FALN guerrillas. OAS troops have reported combat with increasing amounts of armor and artillery compared to the light infantry ambush tactics of the FALN. No operational end-date has been predicted in this ongoing conflict that has already claimed the lives of so many."\n\nCutting back to Bob, he held his notes in his hand as the backdrop showed the skeletons of village buildings burned to matchsticks in Monagas and fires dotting the night sky after foliage ignited following artillery and air strikes. "As casualties mount both for OAS servicemen and Venezuelan civilians, some members of the American public begin to question the overall motivation and mission of the OFN mandate. Regardless, with the defeat of FALN, the war has shifted into a two-party conflict, with final victory a matter of inflicting a defeat on a solitary enemy.""
  GUY_US.67.a: "FALN's ghost tactics have rendered them ghosts themselves."

  GUY_US.68.t: "Rusted to Ruin"
  GUY_US.68.desc: "In his navy suit, Bob Young held his notes in his hand as the cameraman gave the signal to let him know that they were rolling. "Good evening, America, welcome to ABC News Tonight with me, your host, Bob Young. Tonight's headline takes us to Venezuela, where the Bolivarian government has collapsed, with Azuaje Ortega having been lynched in central Caracas while subordinate generals and officials have been put to death by firing squad or have fled and are currently in an unknown location."\n\nThe backdrop cut to a city square, where large rallies of people waving the red flag of FALN listened to leaders giving fiery speeches extolling their victory, proclaiming "Viva the People's Republic! Death to the Fascists and the Yanquis!"\n\nThe camera cut back to Bob Young as he leaned forward in his chair. "The Secretary of Defense stated in his press conference earlier today that the OAS would continue their mission in the interest of 'maintaining democratic continuity and protecting the Venezuelan people from the ravages of mob rule and rampant criminality.' The conflict appears to be staying with no signs of slowing, as OAS and OFN forces continue to attack FALN forces who hope to dig in and await attack. The mission has seemed to have transitioned from preventing further aggression in Guyana over the Essequibo region and targeting the criminal former Bolivarian government to ensuring that Venezuela remains democratic, stable, and a part of the OFN. So, despite the success of the initial objective, the conflict will remain a hot one as the war now settles into a two-party conflict, with the OAS and OFN on one side and FALN on the other. More on this conflict as it develops.""
  GUY_US.68.a: "Ortega was crushed under the very fist he envisioned he possessed."

  GUY_US.69.t: "Executive Summary: The Bandera Roja Regime"
  GUY_US.69.desc: "A successor to the former FALN insurgency, the revolutionary republic established by the Bandera Roja (Red Flag) movement currently controls Venezuela following the assassination of Moncada Vidal, and the subsequent fall of his successor, Manuel Azuaje Ortega's Bolivarian fascist regime. Although the movement initially faced geographical disadvantage and a lack of foreign support, OAS peacekeeping forces, supported by the OFN, were forced to evacuate on account of significant casualties in the operation. Américo Silva, the former caudillo of Bandera Roja, has assumed the role of head of government in the revolutionary republic.\n\nInformation of Américo Silva's earlier years prior to Bandera Roja's emergence is scarce. However, available public history suggests a continued support for communism, particularly adhering to the Amazonist tendency. Aligning with João Amazonas' anti-colonial and ruralist views, which he espoused in multiple publications, Silva opposes all foreign interventions in the region and has made high-profile criticisms of the agency's stabilization efforts on Latin American states in the past. The revolutionary republic has therefore demonstrated dismissiveness towards negotiations with U.S. officials.\n\nWhile the communist regime has denounced its Bolivarian predecessor and made trials on guilty officials, it retains many of the dictatorial characteristics, in addition to an expressed hostility towards American interests. Public confidence in the OFN has declined following Bandera Roja's takeover and some affiliates have expressed concerns regarding Washington's perceived mishandling of the situation. This outcome is humiliating for the agency, but not out of our previous estimations."
  GUY_US.69.a: "Simon Rodriguez, Office of South American Affairs"

  GUY_US.70.t: "Operation: Palisade"
  GUY_US.70.desc: "Flashes. Raised tape recorders. Zooming cameras. Smile. You're on TV.\n\n"...and so, the President has been briefed on the joint OFN-OAS Operation, something we call Operation: Palisade, a palisade to keep out troublemakers. Because that's what we do; stand up to bullies trying to break in. Questions?"\n\nGeneral Rathvon Tompkins stood within the White House Press Room, smiling at the sea of journalists before him as they jostled verbally for the eyes of the Press Secretary. It was a practiced smile, the reliable grin of American command. Ease allies, frustrate enemies - but most of all, survive the journalist. He dreaded to think how he would look in the papers. Briefing the President had been easy, at least they were too busy to ask many questions.\n\nThe Press Secretary pointed at one journalist, dressed in a double breasted brown suit and sporting the largest glasses the general had ever seen. "We will have you first."\n\n"Houston Miller, New York Times. General, as US forces are leading this operation, are you sure the military is ready? Should the public expect a long jungle war in our own backyard?"\n\nBastard, already trying to scaremonger. General Tompkin's brain scoffed, while his smile never faltered. Oh, he was proud of that skill. "An excellent question Mr. Miller, let me assure you and your readers that this will not be the case. We are assembling a strong force, and we are not waging a war of aggression. All Venezuela has to do is leave Guyana alone. If they don't, we'll use everything in our arsenal to make them. You can read my lips: no long wars."\n\nHe chuckled to himself as the Press Secretary chose a new speaker. He would have to remember that zinger."
  GUY_US.70.a: "Maybe the boys on their way to Venezuela would like it too."
  GUY_US.70.tt: "§YYou can now send volunteers to Guyana.§!"

  GUY_US.71.t: "Tabloidism"
  GUY_US.71.desc: "General Rathvon Tompkins placed the handset down. The Army Secretary hadn't finished, but he no longer cared to listen. The dull sound of angry words radiated from it as he placed it down, hearing the click. Silence. What terrible silence.\n\nHe sat in his Washington apartment, his velvet curtains swaying in the wind. All the windows were open, he needed the air. There was a thin layer of dust on everything. The sofa, the bed, the kitchen tabletop. By the door his bags were lazily discarded. He had little interest in unpacking. Half of his things were still in Georgetown anyway.\n\nHe bent over, head in his hands, and motionlessly pondered. For how long he couldn't say. A minute or an hour. In his mind he went over the last few weeks, searching for the moment. Where had he made a mistake? How had they been so rolled over by Venezuela? Venezuela! America's military was supposed to be the shield of the free world, and they couldn't beat Venezuela?\n\nHe couldn't beat Venezuela.\n\nHe looked at the newspaper by his side. A picture of him smiling, his zinger plastered on the headline. 'Read My Lips: I'm Out Of Here!'. The media were already doing their work, it was the first paper he'd picked up at the convenience store nearby. He'd seen the way the shopkeeper had looked at him. He supposed he would have to get used to that face.\n\nHe picked up the paper, walking to the curtains and opening them. The nighttime lights of Washington sprawled before him. He ignored it, simply throwing the newspaper out of the window. He didn't care where it went, just so long as it was away from him.\n\nHe knew his legacy now, he wasn't a fool. But he would not be reminded of it by such journalistic jeers."
  GUY_US.71.a: "His failure was his own, not some tabloid fodder, and he refused to suffer it."

