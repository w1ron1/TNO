 ### Ideas ###
 CHD_idea_inhospitable_conditions: "Непривітні умови"
 CHD_idea_inhospitable_conditions_desc: "Територія Чаду переважно складається з безлюдних пустель і посушливих луків. Через обмежений доступ до води великомасштабне землеробство практично неможливе, а більшість людей живе в невеликих поселеннях або серед кочових племен. Перетворення цього місця на процвітаючу сучасну державу вимагатиме величезних інвестицій і фінансування, до яких Чад практично не має доступу."
 CHD_idea_legacy_kanem_bornu_kingdoms: "Спадщина королівств"
 CHD_idea_legacy_kanem_bornu_kingdoms_desc: "Королівства Канем і Борну колись були одними з наймогутніших імперій Африки, контролюючи величезні території від Нігерії до Сахари. Пізніше в історії королівство Борну було однією з останніх незалежних держав Африки, капітулювавши перед французами лише 1900 року. Спадщина цих королівств сильно впливає на свідомість народу, і новий уряд повинен діяти швидко, якщо хоче бодай якось відповідати пам'яті про своїх попередників."
