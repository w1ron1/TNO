 ## Leader Descs ##
 POLITICS_HISSENE_HABRE_DESC: "У пустелях того, що колись французи називали Чадом, на сцену виходить нова сила. Нація та народ, роками перетворювані на порох під бомбардуваннями, тепер повстають наново, очолювані одним зі своїх. Цього чоловіка звати Хіссен Хабре, і йому є що розповісти.\n\nЯкщо поглянути на це раціонально, майже неможливо повірити, що один двадцятирічний чоловік, маючи мізерне фінансування та жодної зовнішньої допомоги, зміг скинути й знищити султанів і королів, які століттями правили Чадом. Однак уважніший погляд показує, як йому це вдалося. Молодший офіцер, навчений у міліціях Сао, Хабре відокремився від групи, щоб очолити власний рух. Обіцяючи централізацію, зміни та смерть старих порядків і систем, Хабре швидко набирав силу й обертів, ставши обличчям Канемської революції. Не маючи нікого, хто був би достатньо організованим чи могутнім, щоб його зупинити, армії Хабре швидко пройшли через північний Чад і захопили контроль, поставивши Хабре одноосібним правителем Канему.\n\nНарод Канему змінив систему диктаторів на одного диктатора, а Хабре не гаяв часу, зміцнюючи свою владу. Вже зараз ті, хто виступає проти його режиму, зникають, а серед населення час від часу просочуються чутки про безмежне розпусництво та катування. Катування, вбивства та порушення прав людини стали звичним явищем в ім'я стабільности й порядку. Хоча народ Канему поволі починає шкодувати про свій вибір, серед нього поширюється радше почуття покори, ніж революційні настрої.\n\nЗрештою, Хабре — не султан, а будь-що краще за султана. Правда ж?"

