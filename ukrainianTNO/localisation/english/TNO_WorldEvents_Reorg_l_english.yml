#Tooltips
News_Button_tt: "§FIn a world overflowing with data, too much can leave a leader struggling to grasp onto what is crucially important to guiding their country to its next strength. In the case of news, not everywhere may be of note for the leader's eyes, and better suited for the foreign office to sift through and send the appropriate responses.\n\nWith this in mind, news from §scertain continents§! can be redirected away from the leader's desk, §Rbut with critically important events still finding their way to alert the leader§!. For aspiring and dominant superpowers, a dilligent leader may wish to still have all news sent to their desks to never miss an opportunity to shape the world to their whims."
News_Button_delayed_tt: "§F\n§s*§!With the caveat that all tags receive news events of Worldwide importance, news from their home continent as well as any continent they/their faction have intrinsic interest in.\n(for example: §MOFN§! tags and §VJapan§! will receive all news events from §<Oceania§!)\n\n§R*§!Players may also receive news events from certain other tags/regions regardless if their continent's checkbox is ticked or not. This is usually due to the player's tag having special interest in the region, be it having a proxy there, being a member of the same faction or the tag in question being on a path that can align with the player.\n(for example: §qGermany§! will always receive news events from §KPakistan§!)"
