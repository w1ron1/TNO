#Tooltips
News_Button_tt: "§FУ світі, переповненому інформацією, її надлишок може завадити лідеру зосередитися на тому, що справді важливо для зміцнення його держави. Що стосується новин, не кожен куточок світу вартий уваги лідера, тож іноземне відомство може відсіяти інформацію та надіслати йому лише найважливіше.\n\nЗ огляду на це, новини з §sпевних континентів§! можна перенаправити з кабінету лідера, §Rале критично важливі події все одно потраплятимуть до нього§!. Лідери держав, що прагнуть стати або вже є домінуючими наддержавами, можуть побажати й надалі отримувати всі новини, аби не проґавити жодної можливості впливати на світ відповідно до власних інтересів.§!"
News_Button_delayed_tt: "§F\n§s*§!За умови, що всі країни отримують новини про події світового значення, новини зі свого континенту, а також із будь-якого континенту, до якого вони або їхня фракція мають безпосередній інтерес.\n(наприклад: країни §MОВН§! та §VЯпонія§! отримуватимуть усі новини з §<Океанії§!)\n\n§R*§!Гравці також можуть отримувати новини про певні країни/регіони незалежно від того, чи позначено відповідний континент. Зазвичай це пов'язано з особливим інтересом їхньої країни до регіону: наявністю там проксі, членством у тій самій фракції або можливістю зближення відповідної країни з гравцем.\n(наприклад: §qНімеччина§! завжди отримуватиме новини з §KПакистану§!)§!"
