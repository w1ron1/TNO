 ### Ідеї ###
 TRZ_idea_mauritanian_claims: "Мавританські претензії"
 TRZ_idea_mauritanian_claims_desc: "Мустапха Ульд Мохамед Салек і Військовий Комітет національного відновлення заявляють про себе як про легітимних правителів колишньої французької колонії Мавританії. Ці претензії включають великі території, які наразі контролює Іберія. Хоча мало хто в міжнародному співтоваристві серйозно сприймає амбіції Мавританії, всередині країни вони є важливими для підтримки політичної стабільності. Без цих претензій правлячий Військовий Комітет національного відновлення втратив би всі підстави для існування. Залишається побачити, чи буде у них навіть можливість реалізувати ці претензії."
 TRZ_idea_mauritanian_claims_tt: "§YЯкщо з'явиться можливість, CMRN висуне свої претензії.§!"
 TRZ_idea_military_committee_national_recovery: "Військовий Комітет національного відновлення"
 TRZ_idea_military_committee_national_recovery_desc: "Для забезпечення стабільності та єдності нації та підготовки до відновлення решти Мавританії, військові лідери Мавританії утворили хунту і заборонили інші політичні організації, ліквідувавши всі форми демократії на ім'я усунення політичних розколів і об'єднання людей. Мавританія — це нація без політики, принаймні на даний момент."
