 ## Опис лідерів ##
 POLITICS_MOUSTAPHA_OULD_MOHAMED_SALECK_DESC: "Мустапха Ульд Мохамед Салек був трирічним, коли війна спалахнула в Європі. Народжений у місті Кіффа, він був чотирнадцятирічним, коли бомби почали падати на Західну Африку. Але юність Салека не зменшує його рішучості, і тепер він принесе новий світанок для Мавританії, об'єднавши забуті народи Західної Африки в сильну і вільну державу, вільну від іберійського та французького впливу.\n\nСалек був лише підлітком, коли він приєднався до партії Моктара Ульд Дада, Руху Мавританського Народу, коли французи були змушені покинути Береговий Коста і Іберійці утримували свої землі за допомогою пістолетів. Відточивши свої навички, він піднявся по сходах і за п'ять років став одним з найбільш довірених генералів Дада. Шепоти про те, як цей молодий чоловік особисто відбив цілий полк іберійців, стали натхненням для борців за свободу Мавританії.\n\nАле Салек мав проблеми з Дадою, як і багато хто. Він бачив у ньому лише слабкість, соціаліста, який не підтримував ісламські цінності, як і будь-який інший зрадник віри, людину, яка відмовлялася зробити які-небудь великі кроки проти іберійських загарбників, що окупували землі Мавританії. З часом були створені змови, розроблені ідеї, і військовий план був втілений. Моктар Ульд Дада був змушений піти з поста лідера партії під дулом пістолета, щоб це не викликало тривоги, і Рух Мавританського Народу був реорганізований у Військовий Комітет національного відновлення, групу генералів, які були віддані створенню справжньої мавританської нації.\n\nАле Салек досі стикається з опором усередині Мавританії, як з більш соціалістичними членами населення, які бажають повернення Дади, так і з іншими генералами з його угруповання, а також завжди є загроза з боку іберійців, які, як він вважає, чекають моменту для удару..."

