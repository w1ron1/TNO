 #Characters
 CTL_Josep_Tarradellas:0 "Josep Tarradellas"
 POLITICS_Josep_Tarradellas_DESC: "Born in 1899, Josep Tarradellas is the old weathered totem around which the Catalan Republic congregates. As a member of the Esquerra Republicana de Catalunya, the legacy party of Catalonian autonomy, Tarradellas was prime minister of the Generalitat during the First Spanish Civil War. Surviving the conflict, in 1954 he was elected President of the exiled government.\n\nHowever, he and the ERC have since grown distant. Upon his election, the President declined to form a government-in-exile, name his ministers, or return until the restoration of Catalan autonomy. For thirty years, Tarradellas' strategy of republican legalism distanced the exiles from the home-grown forces of clandestinity. But now, with the people at their backs, and the business world abandoning Franco, the Generalitat is home, heading an independent republic.\n\nLooked upon as a unitary figure, his legitimacy was respected after independence was declared. This placed Tarradellas in an unusual position: leading a hastily arranged cabinet of disparate interests, holding a presidency uniting and legitimizing many who he disagrees with, all while head of an independent state he had not sought. Only if Spain keeps its fascist course will the old man gladly trade negotiated autonomy for permanent independence.\n\nDespite it all, a song is the air and on everybody's lips. Catalonia triumphant will be rich, full and free again."
