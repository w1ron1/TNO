 #Національні духи 
 CTL_discontinued_government:0 "Перерване правління"
 CTL_discontinued_government_desc:0 "Коли регіональну автономію було скасовано, уряд Женералітату втік за кордон і продовжував функціонувати, попри тортури та жорстокі вбивства багатьох його членів від рук франкістів. Коли Жозеп Тарраделяс став президентом Женералітату у вигнанні 1954 року, він відмовився формувати кабінет, спричинивши застій у політичній організації каталонців у вигнанні. Після його повернення на чолі Каталонської Республіки багато місцевих політиків прийшли до влади, скориставшись вакуумом, спричиненим послабленням Тарраделясом влади Женералітату. Хоча повернуті вигнанці наразі домінують у каталонській політиці, розкол, що виник між двома фракціями, неминуче зіграє на користь нового покоління місцевих каталонських політиків, щойно в Тарраделяса вичерпається політичний капітал."
 CTL_pancatalan_claims:0 "Панкаталоністські претензії"
 CTL_pancatalan_claims_desc:0 "Каталонія як національний проєкт не обмежується колишнім Женералітатом. Уздовж усього північно-західного узбережжя Середземного моря мільйони каталонців досі живуть за межами територій, які ми контролюємо. Попри те, що каталонські націоналісти не є однорідним рухом, вони загалом погоджуються, що однією з головних цілей нашого уряду має бути визволення цих територій та возз'єднання каталонського народу в межах єдиної держави. Наразі каталонці мають ідеал, до якого можуть прагнути."

 #Дерево
 CTL_the_rebirth_of_the_generalitat:0 "Відродження Женералітату"
 CTL_the_rebirth_of_the_generalitat_desc:0 "Майже 40 років тому полум'я Женералітату було заглушене чорним орлом.\n\nТепер орел упав із небес, жалібно стогнучи серед своїх колишніх жертв. Лише вчора законний уряд Каталонії повернувся до Барселони, але ще багато роботи належить виконати, аби забезпечити свободу та незалежність Каталонії. Ми подбаємо про те, щоб орел більше ніколи не звив гнізда на деревах Барселони.\n\nНехай із кожного балкона й даху на каталонських вітрах майорить жовто-червона Сенєра!"
 CTL_the_rebirth_of_the_generalitat_tt:0 "§fCatalunya, triomfant, tornarà a ser rica i plena!§!"

 CTL_to_bring_catalonia_to_a_new_generation:0 "Передати Каталонію новому поколінню"
 CTL_to_bring_catalonia_to_a_new_generation_desc:0 "Ми роками ховалися в тіні та тікали від прожекторів кровожерливої зграї Франко. Але тепер ми вільні грітися в середземноморському світлі — і разом із ним, подібно до квітки, що отримує поживу для свого обміну речовин із сонячних променів, каталонська культура також розквітне в космічному світлі нашої новознайденої свободи.\n\nНаше національне відродження почнеться з відродження нашої втраченої мови — нашого символу ідентичности та гордости. Відродімо каталонську мову та поховаймо кастильську."

 CTL_return_of_the_old_guard:0 "Повернення Старої ґвардії"
 CTL_return_of_the_old_guard_desc:0 "Хоча після приходу армій Франко під час громадянської війни втекли з країни не всі, майже кожен у Каталонії знав когось, хто це зробив, якщо тільки не втратив своє життя передчасно. Ветерани громадянської війни, політики, інтелектуали, профспілковці — усі, хто відповідав критеріям для внесення до списків приречених, складених ААС, — втекли, забравши каталонську мрію із собою за кордон. Однак сьогодні залишки Старої ґвардії повернулися з вигнання. Було б марнотратством не скористатися цим багатством думок, яке тепер опинилося в наших руках."

 CTL_mobilise_catalan_industry:0 "Мобілізувати каталонську промисловість"
 CTL_mobilise_catalan_industry_desc:0 "Foment del Traball Nacional є найбільшим об'єднанням роботодавців Каталонії, і нехтувати його впливом з нашого боку означало б політичне самогубство. Водночас надходять досить тривожні повідомлення про те, що в об'єднанні досі присутні прихильники Франко, які продовжують там діяти.\n\nМи виділимо необхідні засоби для ліквідації залишків франкістів у FTN. Не очікується значного опору з боку тих, хто залишився, оскільки вважається, що більшість підривних елементів утекла з Каталонії серед хаосу, що настав після нашої незалежности. Після цього, коли FTN міцно опиниться під контролем Женералітату, стане значно легше спрямувати промисловість Каталонії на роботу, забезпечивши нас необхідними ресурсами для ведення цієї війни."

 CTL_bring_omnium_cultural_into_the_light:0 "Вивести Omnium Cultural на світло"
 CTL_bring_omnium_cultural_into_the_light_desc:0 "Унія стала на коліна на шиї нашої культури та душила її розвиток, обмежуючи публічне вираження каталонської культури. Оскільки це єдиний логічний крок уперед, тепер ми повинні скасувати обмеження на вираження нашої культури.\n\nOmnium Cultural, одна з найбільших асоціацій, зосереджених на просуванні каталонської культури, буде відроджена разом з іншими каталонськими культурними клубами. Коли Omnium повноцінно запрацює, наша культура розквітне на вулицях і в домівках кожної каталонської родини, і світ нарешті дізнається про велич великої каталонської нації..."

 CTL_choosing_our_approach:0 "Обрати наш підхід"
 CTL_choosing_our_approach_desc:0 "Тепер, коли основи нашої нової країни закладено, настав час вирішити нагальне питання.\n\nЯк Каталонія має діяти в цій війні?\n\nЗ одного боку, давньою мрією каталонської нації є незалежність. Ми могли б продемонструвати свою відданість цим ідеалам, вистоявши самостійно та показавши світові, на що здатна повністю незалежна Каталонія. Однак, поки тінь Франко нависає над нами, ми могли б отримати ресурси та підтримку Республіки, щоб довше продовжувати боротьбу, ціною жертвування частиною своєї незалежности заради тісніших зв'язків із Республікою.\n\nНам слід діяти обережно та прийняти рішення, поки не стало надто пізно."

 CTL_restore_pyrenees_hydroelectricity:0 "Відновити гідроелектроенергетику Піренеїв"
 CTL_restore_pyrenees_hydroelectricity_desc:0 "Каталонію оточують ворожі сили, які військово загрожують нашій незалежності, тому забезпечення економічної незалежности є не менш важливим для воєнних зусиль, ніж усе інше. Під час початкових потрясінь, що ознаменували загибель Іберійської унії, кілька гідроелектростанцій по всіх Піренеях були змушені припинити роботу, як і будівництво додаткових дамб, яке, на наше нещастя, наближалося до завершення.\n\nЕкономічний захист почнеться із забезпечення джерел енергії безпосередньо у наших власних руках. Віддайте накази відновити будівництво дамб за всіма планами, які вдасться врятувати, та реактивувати станції, що припинили роботу. Ми в жодному разі не можемо дозволити проблемам, які перебувають у наших власних руках, стримувати нас."

 CTL_drown_them_in_catalan_steel:0 "Втопити їх у каталонській сталі!"
 CTL_drown_them_in_catalan_steel_desc:0 "Жодна війна ніколи не буває особливо милосердною до жодної зі сторін — ні до її учасників, ні до тих, хто опинився осторонь. Усвідомлюючи жалюгідний стан нашої металургійної промисловости після Іберійських війн, перед лицем неминучих загроз ми вкрай потребуємо реорганізувати металургійне виробництво в значно потужніший, масштабніший та ефективніший спосіб видобування й очищення сталі.\n\nЦе насамперед передбачає прискорення виробництва сталі шляхом будівництва нових підприємств, оптимізацію видобутку ресурсів, а також збільшення мобілізації та набору робітників для забезпечення сталеливарної промисловости, перетворюючи її на грізний механізм, який стане свідченням не лише наших оборонних можливостей, а й економічної продуктивности."

 CTL_the_drive_to_independence:0 "Шлях до незалежности"
 CTL_the_drive_to_independence_desc:0 "Як продемонстровано протягом останніх десятиліть і до сьогодні, будь-яка сильна, рішуча армія рухається швидко й завдає потужного удару. Тому нерозумно продовжувати покладатися на піхоту, коли вона може рухатися лише зі швидкістю найповільнішого солдата батальйону та битися лише доти, доки стоїть на ногах людина з найбільшою гарматою.\n\nАле щоб надати нашим людям будь-яку здатність вийти за межі звичайної піхоти, ми повинні забезпечити їх необхідним спорядженням і засобами. Для цього вантажівки та легкі танки підійдуть якнайкраще — вони забезпечать швидше пересування, ефективніші засоби транспортування та достатню броню й вогневу міць, щоб перейти в наступ. Для цього ми дамо поштовх автомобільній промисловості, аби вона забезпечила нас усім необхідним для втілення цього в реальність."

 CTL_complete_prewar_naval_projects:0 "Завершити довоєнні військово-морські проєкти"
 CTL_complete_prewar_naval_projects_desc:0 "Іберійські війни призвели до раптового й прикрого припинення деяких наших військово-морських проєктів, які сьогодні залишаються занедбаними на втомлених верфях Барселони та Таррагони — самі вони наполовину добудовані, а багато деталей усе ще перебувають у процесі виробництва. Із наближенням тіні війни до Каталонії потреба зміцнити та створити військово-морські сили в нашому регіоні стала як ніколи нагальною.\n\nПосилюючи наше військово-морське виробництво шляхом розширення портових потужностей і військово-морських верфей, ми убезпечимо прибережні кордони нашої держави та проєктуватимемо нашу силу принаймні в межах навколишніх берегів — і забезпечення здатности наших військово-морських сил захищати наші узбережжя стане центральною метою цієї нової ініціативи."

 CTL_against_our_enemies:0 "Проти наших ворогів"
 CTL_against_our_enemies_desc:0 "Понад усе ми взялися за зброю, щоб захистити Каталонію від тих, хто бажає їй зла, а також проголосити й захистити її суверенітет від наших гнобителів, які прагнуть тримати нас у кайданах. Це було нашим початковим бажанням від самого початку, і воно залишатиметься нашою головною метою.\n\nРеспубліка справді зацікавлена в тому, щоб заручитися нашою підтримкою, і з дещицею удачі та маніпуляцій ми напевно зможемо отримати її підтримку, водночас зберігши власні інтереси каталонського суверенітету. Однак було б нерозумно послаблювати пильність, коли ми досі оточені ворожими групами, що прагнуть нашого знищення. Тому, хоча це неодмінно ще більше загострить наше й без того нестабільне становище, ми зосередимося на перемозі над нашими ворогами, перш ніж звертатися до Республіки."

 CTL_sacramental_self_defense_forces:0 "Саграментальні сили самооборони"
 CTL_sacramental_self_defense_forces_desc:0 "Як знає кожен каталонець, Sometent, каталонська цивільна воєнізована самооборона, веде своє коріння від Sagramental 1068 року, коли селяни суворо координували свої дії для захисту від зовнішніх нападників. Відтоді вона брала участь у незліченних війнах — і навіть сьогодні залишається такою, хоча те, що від неї залишилося, перебуває в настільки жалюгідному стані, що ми можемо називати її «церемоніальною» лише як евфемізм.\n\nРеструктуризація Sometent, зі збереженням її коріння, але перетворенням на справді ефективні сили самооборони, дозволить звільнити поліцейських та інші гарнізони, які за потреби тепер зможуть вирушити на фронт. Зробімо саме це, щоб мати більше людей там, де вони потрібні найбільше."

 CTL_crack_down_on_unionists:0 "Придушити уніоністів"
 CTL_crack_down_on_unionists_desc:0 "Як і в кожній війні від початку часів, за нашими лініями завжди є зрадницькі покидьки та п'ята колона, які підіграють нашим ворогам у наївній вірі, що ворог може щось нам запропонувати — або, якщо зрадники справді егоїстичні, щось запропонувати їм. Однак, якою б неприємністю вони не були, під час останньої Великої війни ми бачили безліч прикладів того, як зрадники та колабораціоністи захоплювали владу, показуючи, що нездатність правильно їх придушити має тяжкі наслідки.\n\nНайбільше ускладнює їхнє переслідування те, що вони виглядають і живуть просто серед нас — каталонці, що розмовляють каталонською, народжені й виховані в наших містах, здобули освіту в наших школах, але значно більше зацікавлені у відданості Іспанії та збереженні Каталонії лише як частини Іспанії. Ми боротимемося з цими уніоністськими особами та групами й залишатимемося такими ж пильними, як і раніше, посилюючи операції з їхнього придушення. Якщо залишити їх без нагляду, це швидко переросте в новий фронт, боротися з яким буде значно важче. Найкраще придушити їх зараз."
 
 CTL_a_concrete_border:0 "Бетонний кордон"
 CTL_a_concrete_border_desc:0 "Західні кордони Каталонії неприступні для атак фашистів і становлять найбільший ризик для нашої безпеки. Фашисти щодня набирають сили, і щойно вони перестануть зосереджуватися на Республіці, їхні кулаки неминуче обрушаться на наші землі, але ворог нашого ворога не обов'язково є нашим другом — і було б нерозумно довіряти Республіці, попри всі попередні контакти...\n\nПриродно, найочевиднішим кроком було б створити низку укріплень і редутів уздовж західного фронту. Фашисти можуть розбивати голови об нашу стіну, можуть лютувати й розбиватися об нас... Але коли вони неминуче це зроблять, ми будемо готові. Інвестуймо в нові оборонні споруди, засоби захисту та пастки — у все необхідне, щоб вистояти перед вогнем, який вони принесуть на нашу землю."

 CTL_the_spirit_of_montjuic:0 "Дух Монжуїка"
 CTL_the_spirit_of_montjuic_desc:0 "Скільки років Каталонія була підкорена, стільки ж разів ми відбивали кожного гнобителя з наших земель. Наскільки високими були гори з ворогів, які приходили відібрати в нас свободу, настільки ж високим є сам Монжуїк. Хоча Барселона та решта Каталонії неодноразово зазнавали нападів протягом історії, Монжуїк завжди залишався — символом нашої ідентичности, символом нашої рішучости.\n\nМи вже зазнавали поразок, але ніщо, крім убивства всіх нас, не зітре каталонський дух із лиця Землі. Однак цього разу все буде інакше. Ми не здригнемося, ми не впадемо — і навіть якщо ворог здолає нас, дозвольмо собі героїчно зробити останній подих на вершині Монжуїка."

 CTL_if_you_are_catalan_you_shall_fight:0 "Якщо ти каталонець, ти маєш битися!"
 CTL_if_you_are_catalan_you_shall_fight_desc:0 "Ти народився в Каталонії? Тоді ти каталонець! Ти розмовляєш каталонською мовою? Тоді ти каталонець! Ти живеш між узбережжям Середземного моря та високими Піренеями? Тоді ти каталонець! Якщо ти бачиш, як червоно-жовта Сенєра майорить на вітрі, тоді ти теж каталонець! А якщо ти каталонець, тоді ти маєш битися! Ти маєш битися за наші гори й річки, нашу мову та наших дітей, і за все інше, що називає себе каталонським!\n\nУ нашої нації небагато людей, і, природно, це означає, що в нас небагато солдатів. Ми неодмінно повинні використовувати те, чим обмежені, — хоча тим, чим ми можемо похвалитися, є наша ідентичність. Єдиний спосіб розширити нашу армію, однак, полягає в тому, щоб переконати наш народ у нашій здатності перемогти завдяки нашій унікальній та винятковій культурі, а для цього ми застосовуватимемо більше націоналістичної риторики та пропаганди."

 CTL_an_understanding_with_other_regions:0 "Порозуміння з іншими регіонами"
 CTL_an_understanding_with_other_regions_desc:0 "Республіка може мати добрі наміри, але це лише робить її ще більш жадібною до контролю над нами, і хоча зараз ми є союзниками в цій боротьбі, ми повинні бути готові до того, що станеться після того, як фашистів буде поховано на шість футів під землею. І цілком логічно, що якщо ми не самотні у висуванні вимог, наш голос лунатиме гучніше.\n\nІнші поділяють наші побоювання — ті, кого кастильський велетень також роками тримав у в'язниці й хто лише тепер знову відчув смак свободи. Ми звернемося до них і, сподіваємося, досягнемо порозуміння, щоб Республіка не надумала топтатися по наших націях."

 CTL_m1938s_for_everyone:0 "М-1938 кожному!"
 CTL_m1938s_for_everyone_desc:0 "Неможливо вести війну без куль. За часів першої громадянської війни гвинтівка М-1938 була основою піхотного бою і продовжує використовуватися каталонськими солдатами навіть донині. Але оскільки запаси невпинно скорочуються, а бойові дії, схоже, не припиняться, стає дедалі очевиднішим, що необхідно розглянути альтернативу місцевого виробництва.\n\nЗа допомогою команди найкращих військових промисловців і конструкторів М-1938 отримає всі необхідні вдосконалення та оновлення, щоб залишатися конкурентоспроможною й ефективною в новій епосі війни. Коли це буде завершено, їх можна буде виробляти масово — а зі зменшенням залежности від іноземної зброї зростуть шанси нашої республіки на виживання."

 CTL_with_the_republic:0 "З Республікою"
 CTL_with_the_republic_desc:0 "Багато хто сприйматиме нашу боротьбу як боротьбу за свободу лише каталонців, але, можливо, потрібен менш ідеалістичний і більш приземлений, прагматичний аналіз нашого скрутного становища. Загнані в кут між Піренеями та Середземним морем, ми маємо лише одного союзника поблизу — Республіку, яка, хоча й чітко заявила про своє бажання тісно прив'язати до себе Каталонію, також надала свободу своєму народу, як і обіцяла."

 CTL_technocratic_middlemen:0 "Технократичні посередники"
 CTL_technocratic_middlemen_desc:0 "Хоча Каталонія має потенціал самостійно стояти на ногах, сліпота до реальности нікому не допоможе. З огляду на порівняльні економічні масштаби та силу Республіки й Каталонії, відсутність координації та співпраці неодмінно потопить воєнні зусилля — тому економічна синергія є вкрай необхідною.\n\nЩоб забезпечити безперебійну роботу, Республіка завербувала справжній легіон економічних радників. Місцеві дещо насмішкувато називають їх «людьми в чорному». Ці елегантно вдягнені чоловіки в костюмах із Республіки надаватимуть свої рекомендації щодо покращення економіки — Бог знає, Каталонії потрібна вся можлива допомога."

 CTL_refining_for_prisoners:0 "Упорядкувати питання іноземних полонених"
 CTL_refining_for_prisoners_desc:0 "У прагненні до справедливости та примирення з нашим найближчим союзником ми маємо питання, яке давно очікує вирішення і яке ми готові обговорити з Республікою: питання обміну полоненими.\n\nРепатріація осіб, затриманих третіми сторонами, а також повернення й суд над особами, затриманими нашими власними органами влади, є нагальним питанням від початку війни, і, судячи з певних повідомлень від Іспанської Республіки, це взаємне занепокоєння. З огляду на цей факт, укласти угоду про репатріацію буде нескладно."

 CTL_maintain_access_to_spanish_banks:0 "Зберегти доступ до іспанських банків"
 CTL_maintain_access_to_spanish_banks_desc:0 "Якщо є щось, що війни гарантовано розірвали та порушили, то це сім'ї, розкидані по всій країні, — усе від транспорту до фінансів і втрати власности. Щоб забезпечити фінансову стабільність і доступ до основних банківських послуг, а також пом'якшити шкоду, завдану війною добробуту цивільного населення, ми знову звернемося до Республіки.\n\nУ Республіці та банках під її контролем багато каталонських громадян досі мають свої активи й фінанси — те саме можна сказати про іспанських громадян, які мають свої активи в наших банках. Полегшення становища наших громадян та громадян Іспанії безумовно забезпечить нам позитивну рекламу, якої ми потребуємо перед власним народом, а завдяки нашим добрим відносинам із Республікою ми маємо безліч каналів зв'язку, які можна використати для переговорів про безперебійну співпрацю між каталонськими та іспанськими банками.\n\nУсунувши наявні перешкоди та розриви між нашими банками, ми одночасно зможемо підтримати наших громадян і отримати доступ до раніше недоступних коштів, які неодмінно посилять наші воєнні зусилля."

 CTL_food_for_guns:0 "Їжа в обмін на зброю"
 CTL_food_for_guns_desc:0 "Для такої маленької нації, якою ми є, ми можемо похвалитися вражаючою промисловістю, яка досі добре забезпечувала нас усім необхідним як незалежну державу, оточену ворожими силами.\n\nЗ іншого боку, наше сільськогосподарське виробництво та виробництво споживчих товарів, м'яко кажучи, залишають бажати кращого. Наші посадовці численні рази повідомляли про голод і недоїдання від початку війни, а розширити наявні ферми майже неможливо через атаки наших найближчих ворогів. Очевидно, в наших інтересах було б укласти взаємовигідну торговельну угоду з Республікою, чия більша територія забезпечує стабільний потік продовольства для її громадян.\n\nЦей пакт зрештою має на меті досягнення взаємовигідної угоди між нами та Іспанською Республікою — ми виділятимемо частину нашого промислового виробництва Республіці в обмін на необхідні поставки продовольства з Республіки. Використати наші промислові можливості для підтримки оборонних потреб потенційного союзника, водночас забезпечивши добробут власних громадян, — надто хороша можливість, щоб її проґавити."

 CTL_shared_bases_and_intelligence:0 "Спільні бази та розвідка"
 CTL_shared_bases_and_intelligence_desc:0 "Хоча це може ще більше прив'язати нас до Республіки взаємозалежністю, ми не можемо заперечувати очевидний факт наших обставин: ми та Республіка маємо широкий спектр спільних ворогів і набагато менше зацікавлені ставати ворогами одне одного, поділяючи багато спільних цінностей. Усвідомлюючи нагальну потребу встановити тіснішу військову співпрацю, ми прагнутимемо зміцнити наявні зв'язки між нашими урядами.\n\nМи визначили ключові стратегічні місця для спільних військових баз на обох наших територіях і підготували план спільного фінансування будівництва та розширення наявної інфраструктури в ключових місцях для спільних військових баз, а також створення системи обміну розвідданими у військовій та цивільній сферах. Завдяки тіснішій військовій інтеграції та обміну розвідданими ми зміцнимо принаймні один із наших фронтів і краще підготуємося до стримування агресії з боку тих, хто нас оточує.\n\nТепер залишається лише передати нашу пропозицію Республіці. Разом, що взагалі може становити екзистенційну загрозу нашій справі?"

 CTL_share_pegaso_blueprints:0 "Поділитися кресленнями Pegaso"
 CTL_share_pegaso_blueprints_desc:0 "Автомобільна компанія Pegaso була однією з найцінніших галузей промисловости Каталонії — виробляючи для нас усе, від вантажівок до броньованої техніки. Природно, це привернуло увагу Республіки, яка відчуває нестачу відповідних автомобільних виробництв і дослідницьких баз, необхідних для створення власних.\n\nНа знак солідарности та військової співпраці ми готові поділитися кресленнями автомобільної компанії Pegaso. Маючи доступ до повної документації креслень машин Pegaso та необхідних технічних специфікацій, усе, що нам потрібно, — це спосіб безпечно передати ці конфіденційні документи Республіці.\n\nЗвісно, це ставить нас у становище, коли ми можемо отримати важелі впливу на Республіку. Напевно, Республіка погодиться компенсувати нам це на наших умовах, чи не так?"

 CTL_hunt_down_terra_lliure:0 "Вистежити Terra Lliure"
 CTL_hunt_down_terra_lliure_desc:0 "Попри все, що ми зробили для забезпечення суверенітету Каталонії, схоже, серед нас є й такі каталонці, які незадоволені нашою співпрацею з Республікою. Через страх, що Республіка підпорядкувала нас собі? Чи через страх, що ми пов'язали свою долю з приреченою на провал Республікою?\n\nЯкими б не були їхні виправдання, не можна ігнорувати той факт, що вони становлять дедалі більшу загрозу безпеці країни. Останнім часом ми стежимо за ключовими членами ультралівої націоналістичної групи, яка називає себе Terra Lliure. Хоча вони ще не вчинили жодних насильницьких дій проти нас, ми можемо впевнено дійти висновку, що ці терористи планують щось масштабне проти нас. Ми склали список осіб і місць зустрічей для спостереження та можливих затримань — ми повинні завдати їм удару найближчим часом, поки їхня діяльність не вийшла з-під нашого контролю."

 CTL_remember_the_diada:0 "Пам'ятати про Діаду"
 CTL_remember_the_diada_desc:0 "Нарешті настав час! Відновімо День народу — Diada Nacional de Catalunya — знову. Надто довго головорізи та посіпаки Франко тримали в полоні не лише наші язики, а й наші обличчя та спосіб життя. Усе, що ми знали про те, як бути каталонцями... і все, що ми берегли у своїй ідентичності...\n\nХай би хто в Мадриді не коронував себе каудільйо нашого народу в Барселоні, нехай 11 вересня стане нашим великим закликом до пробудження народу. Цей день нагадує нам про все, що ми можемо втратити, коли Бурбони обрушилися на Барселону після їхньої жорстокої облоги, що тривала цілий рік, — фашисти у своїй закривавленій величі та руйнуванні спустошать наш народ так, як це неможливо описати словами."
 
 #Events
CTL_wars.1.t:0 "Святий позаду, нація попереду"
CTL_wars.1.desc:0 "Жозеп Тарраделяс стояв на балконі будівлі Женералітату, оточений апостолами свого нового уряду — білою статуєю Святого Юрія позаду нього. Внизу натовп ніс Сенєру з дев'ятьма смугами, розмахуючи величезними прапорами в унісон, наче окремі краплі у хвилі. Прапор навіть був перекинутий через сам балкон, приховуючи надмірно оздоблені поручні за значно простішим посланням.\n\n«Каталонці. Друзі. Співвітчизники». Щойно він відкрив рота, камери, спрямовані на нього, злегка затремтіли, ніби кожного оператора це особисто зачепило. «Країна — це значно більше, ніж група людей, які живуть в одному місці в один і той самий час». Багатоголовий мікрофонний стенд передавав його слова через кілька радіоканалів. «Це те, чого бюрократи в Мадриді не здатні зрозуміти». У натовпі безліч різних людей хотіли для Калатонії безліч різних речей, але всі слухали з очікуванням.\n\nОзирнувшись через плече на одного з членів свого кабінету, чоловік побачив краєм ока святого, що встромляв спис у черево дракона. Чи могли б вони бути настільки ж хоробрими, щоб узятися за зброю — встромити спис у дивну химеру, якою була Іберійська унія? Раптовий сплеск прагнення до незалежности був би кроком надто далеко. Він це знав. Кожен, хто бодай трохи розумівся на політиці, це знав. Але чи прийняв би це народ?\n\nПовертаючись до натовпу повільніше, ніж слід було, Тарраделяс глибоко вдихнув некомфортно тепле вечірнє повітря. «Ми хочемо, щоб народ Іберії знав, що ми тут — що ми каталонці! Ми сильні. Ми вільні»."
CTL_wars.1.a:0 "Це все, що він міг пообіцяти."

CTL_wars.2.t:0 "Легкий здобуток"
CTL_wars.2.desc:0 "«Нам не потрібно все ускладнювати, Ґальярдо. Ми пропонуємо вам почесну, спокійну пенсію, а Республіка не намагатиметься розкопувати нічого про ваші зв'язки з Матеу та Франко. Але нам потрібно, щоб FTN співпрацювала з нашим урядом».\n\nКолишній кабінет Мікеля Матеу-і-Піа, голови Foment del Treball Nacional, об'єднання роботодавців Каталонії, останніми тижнями пережив більше активности, ніж будь-коли від 1939 року. Покірний Матеу підпорядкував установу економічним директивам Франко від самого завершення війни, але тепер його не було. Утік, як і багато інших.\n\nЖозеп Марія Мунтанер, представник Департаменту економіки, оглянув франкістські символи, які досі прикрашали поспіхом покинутий кабінет. Це був шанс приборкати те, що залишилося від бізнесменів та промисловців Каталонії. Він не міг його змарнувати. «Мені шкода, але рішення вже прийнято», — сказав він із удаваним співчуттям, — «департамент уже обрав кандидата, який очолить об'єднання, Сальвадора Мільєта. Хороший економіст, а не якийсь радикал, який пустить вашу роботу нанівець. Вам лише потрібно підписати тут». Мунтанер посунув уперед заздалегідь підготовлену заяву про відставку та ручку.\n\nЗа столом Фелікс Ґальярдо-і-Каррера, виконувач обов'язків голови FTN, схрестив руки. «Ні. Це моя відповідальність, і я не довіряю вам, апаратникам. Я бачив пропозиції, які висувалися, і думаю, що ви всі гадки не маєте, що робите, окрім спроб забезпечити собі владу». Він відкинувся у кріслі. «Це не буде моєю спадщиною».\n\nМунтанер нервово крутив ручку, мовчазний, але безсумнівно щирий. «...Тоді ми можемо викликати поліцію»."
CTL_wars.2.a:0 "З пекучою люттю та важкою хвилиною мовчання Ґальярдо повільно поставив своє ім'я під заявою про відставку."

CTL_wars.3.t:0 "Відродження бароко"
CTL_wars.3.desc:0 "«Заходьте», — відповів Пау Рієра-і-Сала на три стуки у двері свого кабінету. Його секретарка Марія обережно зайшла, передаючи йому конверт із гербом каталонського уряду. Він нервово усміхнувся їй, швидко подякував і майже вихопив листа з її рук. Він уже понад тиждень чекав на урядового листа щодо фінансування Òmnium Cultural, своєї установи з популяризації каталонської культури та мови. Це був їхній шанс.\n\nІ що далі Рієра читав листа, то більше він захоплювався. Каталонський уряд виявив мудрість; грант буде надано. Разом із ним відкривалися раніше немислимі можливості; йому радісно спали на думку напівзабуті плани реконструкції приміщень Òmnium у бароковому Palau Dalmases у Барселоні, а також розширення видавництва та культурної діяльности.\n\nРієра підвів погляд у своєму доглянутому, але маленькому кабінеті, подумки уявляючи ці нарешті профінансовані приміщення. Palau Dalmases був прекрасною будівлею, але старою; різьблений мармур і пишні фасади не могли зрівнятися з належним електричним освітленням чи туалетами, а захопливі зусилля Марії з прибирання були сизіфовою спробою боротися з нескінченно живучими клаптями павутиння та плісняви. А тепер його відремонтують, створивши належний плацдарм для зусиль Òmnium Cultural зі справжнього відродження каталонської культури в новій каталонській державі. Це була можливість усього життя.\n\nРієра покликав секретарку. «Кармен — подзвони Карульї, Сендрóсу та Вальве. Нам потрібно організувати зустріч...»"
CTL_wars.3.a:0 "«...І ми готувалися до неї понад десятиліття»."

CTL_wars.4.t:0 "Із вогню та в полум'я"
CTL_wars.4.desc:0 "«Гаразд, останній пункт», — пробурмотів Тарраделяс, ведучи пальцем по аркушу з питаннями для обговорення дня, доки не дійшов до самого низу. Він знав, що ця розмова буде найскладнішою за все засідання, але її необхідно було провести. Вони більше не могли чекати.\n\n«Я пропоную офіційно визнати та підтримати Іспанську Республіку. Хоча нам доведеться чітко наголосити, що це наше власне суверенне рішення, це також єдине розумне рішення, яке ми можемо прийняти. Республіка — наш єдиний шанс на іспанський уряд, з яким ми можемо мирно співіснувати; якщо Республіка впаде, ми впадемо одразу ж, щойно війська опиняться біля наших дверей». Тарраделяс поклав руки на стіл, і на мить запанувала напруга, поки він готувався до шквалу обурених вигуків і їдких заперечень.\n\nЯк і слід було очікувати, кабінет вибухнув гучним галасом. Сердиті глузування та вигуки «Зрадник!» заповнили кімнату. Тарраделяс закликав до тиші, досягши цього лише після того, як перетворив свій черевик на імпровізований молоток, вдаривши ним по дубовому столу. Шум стих, і віцепрезидент Жоан Корнуделья підвівся, щоб викласти свою позицію.\n\n«Пане президенте, ви не можете серйозно це пропонувати. Ми категорично не можемо дозволити собі ставати на чийсь бік у іспанській війні». Дехто в кімнаті голосно пробурмотів на знак згоди. «Це не наша війна; вона лише затягне нас назад у яму імперської політики, з якої ми тільки починаємо вибиратися. Народ сприйме це лише як підлеглий акт, скільки б декларацій ми не робили про те, що це наш власний вільний вибір. Хто міг би їх звинуватити, коли ми запрошуємо хаос Війни у свій дім лише заради того, щоб поцілувати каблучку Севільї?» У кімнаті запала тиша.\n\nУсі погляди були спрямовані на Тарраделяса, їхні важкі погляди посилювали тягар рішення, що стояло перед ним."
CTL_wars.4.a:0 "«Запитайте їх, чи вони воліли б стояти поруч із Республікою, чи лежати ниць перед фашистами»."

CTL_wars.5.t:0 "Кров і болти"
CTL_wars.5.desc:0 "Життя на фабриці Pegaso перетворилося на рутину — вимогливу й нудну рутину, але все ж рутину. Відмітитися. Вислухати майстра. Піти на своє місце. Виконати роботу. Пообідати. Закінчити роботу. Знову вислухати майстра. Піти додому. Було щось приємне в тому, щоб мати роботу, знати, як її виконувати, і виконувати її.\n\nМайстер уже збирався нарешті відпустити їх, і тепер, коли більшості машин дозволили відпочити, звук його кроків було чутно на переходах. «Ми всі чули чутки», — почав він, і його голос лунав у промисловому соборі. Щось у тому, як він стискав поручні побілілими кісточками пальців, свідчило, що він не надто радий цьому. «Більше жодних автомобілів. Більше жодних вантажівок». Не мало значення, подобалася їм чи ні ідея приватизації їхньої фабрики. Важливо було те, що рутина змінювалася, і попереду були певні труднощі адаптації. «Буде відкрито нові програми учнівства. Ті, кому це буде потрібно, отримають необхідну підготовку. Я впевнений, більшість із вас упорається». Це був лише ввічливий спосіб сказати, що кріпити болт на вантажівці нічим не відрізняється від кріплення болта на танку.\n\nВийшовши через ворота лише після того, як усі пішли, майстер поглянув на зоряне небо. Двигуни є двигуни, чи не так? А крім того, в автомобільних аваріях гине більше людей, ніж на війнах, чи не так? Тож чому він так переймався цією зміною? Робітники не заперечували, правда ж? Звісно, не заперечували. Усе, що виходило з цієї фабрики, було його відповідальністю — його, і лише його. Отямившись, він потягнувся по сигарету. «Просто роби, що тобі кажуть» — такою була ідеологія його батька, яка дозволила йому піднятися до цієї посади. Робота буде такою самою. Платня буде такою самою."
CTL_wars.5.a:0 "Звичайна людина має триматися за своє важко зароблене щастя."

CTL_wars.6.t:0 "«Нетипова пресконференція»"
CTL_wars.6.desc:0 "«Я давно підтримую ці погляди, якщо ви переглянете мою попередню діяльність, то зможете переконатися в цьому самі», — в сотий раз заявив Едуардо Таррагона пресі. Ще до незалежности він був політиком і завжди виступав на захист свого дому, говорячи за Каталонію тоді, коли інші не наважувалися. На його думку, він зробив для Каталонії більше, ніж будь-коли зробили вбивство поліцейського чи бомба в кафе.\n\nНезалежність перетворила його на звичайного громадянина, але це навряд чи було дивно. Навіть критично налаштований іберієць усе одно залишався франкістським політиком; тепер захист Каталонії перейшов до інших. Його робота, принаймні на цей час, була завершена. Він майже змирився, попри те, що його дім був вирваний з Іспанії, коли хаос охопив країну, аж поки цього вечора, повертаючись додому, не зіткнувся з ордою журналістів.\n\nДіставшись входу до будівлі, відбиваючи вимоги засудити когось і сенсаційні звинувачення, він помітив поліцейську машину. Едуардо майже не звернув на неї уваги, коли побачив, що один із офіцерів вказує на нього, а занепокоєння зростає, коли вони швидко рушили до нього. Він уже збирався привітатися з офіцером, який, схоже, був старшим за інших, коли раптом йому заломили руки за спину.\n\n«Едуардо Таррагона, ви заарештовані за підозрою у державній зраді. Не чиніть опору», — Таррагона ледве встиг усвідомити слова офіцера, як його почали відтягувати без жодного слова, а нова хвиля запитань і спалахи фотокамер захлиснули його свідомість.\n\n«Що це означає? Державна зрада? Я ніколи не намагався б зробити щось проти Каталонії! Це неправильно!» — протестував Таррагона, коли його запхали в поліцейську машину й двері зачинилися перед його обличчям.\n\nРепортери намагалися поставити офіцерам безліч запитань, але на кожне отримували одну й ту саму відповідь:"
CTL_wars.6.a:0 "«Без коментарів»."

CTL_wars.7.t:0 "Я зробив свою частину"
CTL_wars.7.desc:0 "«Гей, хлопче! Не проти, якщо я поставлю тобі кілька запитань?»\n\n«Хлопець» продовжував іти відносно тихим провулком Барселони, а ретельно продуманий маршрут додому з роботи був спеціально спланований так, щоб уникати армійських вербувальників. «Не звертай на них уваги», — завжди казала його мама. Схоже, цей вербувальник не збирався цього розуміти.\n\n«Ти ж не хочеш провести решту життя, прибираючи столи, правда?» Хлопець завагався, на мить зупинившись, а світло ледь освітило його невдоволене обличчя. «Саме так. Я бачив тебе там, у кафе на розі. Хіба ти не хочеш більшого?»\n\nХлопець клюнув на приманку, повернувся до вербувальника, вдягненого в доглянутий камуфляж, із кобурою Beretta на стегні. «Що ти взагалі можеш знати про мене?» Його зачепило за живе.\n\n«Більше, ніж ти думаєш, синку. Ти все життя прожив тут, задушений відсутністю можливостей через своє виховання. Ні школи, ні майбутнього, ні грошей, нічого». Хлопець заціпенів; вербувальник не так уже й помилявся. Він дістав брошуру і тепло усміхнувся, жестом пропонуючи хлопцеві взяти її.\n\nХлопець подивився на неї у своїй руці, прочитавши напис на обкладинці: «Набувай навичок. Служи своїй країні. Борися за Каталонію». Далі був список посад, які він міг би обрати, від піхотинця до механіка танків. Безперечно, приваблива можливість.\n\nВербувальник подивився йому в очі. «Коли твої діти запитають тебе, що ти робив під час війни, що ти їм скажеш?»"
CTL_wars.7.a:0 "Хлопець здається."

CTL_wars.8.t:0 "Інтерв'ю з Тарраделясом"
CTL_wars.8.desc:0 "Жозеп Фаулі дописав ще кілька нотаток, поки Тарраделяс зробив ковток води. Фаулі поспішно писав, прагнучи якнайшвидше завершити заздалегідь відрепетирувану виставу. Гудіння стельового вентилятора в кабінеті лунало в тиші, намагаючись розігнати тонкий шар диму від сигарет, які курили обидва. Більшість сказаного можна було довірити пам'яті — зрештою, питання були підготовлені заздалегідь. Кілька зайвих вступних питань звучали незграбно, оскільки обидва чоловіки відчували їхню нещирість, просто чекаючи, коли вистава розіграється.\n\n«Каталонія — не єдиний регіон, що повстав проти Іберійського уряду. Багато хто запитує: чи підтримує президент боротьбу цих інших регіонів, поки тривають бойові дії?»\n\n«Звісно. Еускаді, Галісія та Каталонія — усі ці назви мають бути синонімами боротьби проти імперіялізму Мадрида. Ми повинні стояти разом».\n\n«Відомо, що ви підтримували федералізм у складі Іспанії. Яка ваша позиція тепер?»\n\n«Так, мене передусім цікавлять інтереси Каталонії, і я вважаю, що погане ставлення Мадрида до наших земель не означає, що ми повинні нашкодити самим собі назло йому. Каталонія — передусім у моїх думках, федералізм можливий лише за сильної Каталонії та зміненої Іспанії. Тому Каталонія та інші нації повинні налагоджувати тісні відносини з тими в Іспанії, з ким ми можемо співпрацювати. Заперечувати будь-який зв'язок між нашими націями було б нереалістично, але це працює в обидва боки».\n\nЦя фраза була несподіваною. «Співпрацювати? З ким?»\n\nТарраеляс запалив ще одну сигарету. «З будь-ким, хто може послужити інтересам Каталонії, ми не імперіяльна провінція»."
CTL_wars.8.a:0 "Зрештою, доля належить тим, хто хапається за неї, а не чекає, поки вона постукає у двері"

CTL_wars.9.t:0 "Старі гвинтівки"
CTL_wars.9.desc:0 "Двоє рядових захекано тягнули ящик із військовим вантажем до столу. Невже це американські гвинтівки? Може, німецькі? Будь-що було б краще за нинішні уламки, з якими їм доводилося мати справу. Вони відійшли, коли до ящиків підійшли офіцери — очі голодні від очікування.\n\nЗі скрипом молодший лейтенант відкрив кришку, показавши ряди гвинтівок, що лежали в соломі, із шипінням. Його захоплення зникло разом із повітрям. «Це що, їх вирвали з рук кубинців? Це з — якого — війни 1898 року?» — сказав лейтенант, незграбно тримаючи гвинтівку так, що капітан скривився, і піднімаючи цілик до ока. «Заклинить, щойно з неї вистрілиш».\n\n«Якщо тобі вдасться її заклинити, я б сказав, що ти зробив це навмисно», — гаркнув капітан, забираючи гвинтівку з незграбних рук колеги, як батько забирає небезпечний інструмент у дитини. Він на мить оглянув гвинтівку, наче вітав старого друга. Вона могла виглядати інакше, пахнути інакше, а спусковий гачок тепер можна було регулювати, але це все ще була його улюблена М-1938. Зверху була дивна опуклість, але він із полегшенням виявив, що це лише планка для всієї тієї вигадливої оптики, яка потрібна новим поколінням, щоб робити точний постріл. «Це та сама гвинтівка, яку ми використовували протягом усієї громадянської війни». Взявши ганчірку, капітан витер відбитки пальців, які лейтенант залишив на металевих деталях."
CTL_wars.9.a:0 "«Нема чого просто витріщатися. Подивімося, чи ця стара дівчинка досі співає»."

CTL_wars.10.t:0 "Люди в чорному"
CTL_wars.10.desc:0 "Як радник з економічного розвитку нації за таких унікальних обставин, Рамон Перера пишався собою. Скільки ще людей могли виконувати його роботу? Будь-який американський чи японський бюрократ міг схвалювати проєкти, маючи за спиною національні багатства. Країни ОВН мали своїх платників, а Азія могла користуватися токійською опікою навіть після краху. Навіть який-небудь німець чи італієць, можливо, зміг би впоратися завдяки своїм ресурсам, часто з розвагою міркував він. Досягати успіху в умовах обмежень, як це робила Каталонія, — ось що було справжньою майстерністю.\n\nІ все ж Перера завжди хотів опинитися де завгодно, тільки не на таких зустрічах, як та, в якій він зараз застряг.\n\nПерера прозвав двох економічних радників, яких Іспанська Республіка надіслала для роботи над їхньою економічною співпрацею, «Людьми в чорному», оскільки в них не було абсолютно нічого цікавого, окрім однакових чорних костюмів, які вони носили на кожну зустріч. Чорна порожнеча, похмурі близнюки з такими ж монотонними голосами, якими вони виглядали.\n\n«Ми ознайомилися з документами та звітами, які ви надіслали нам перед сьогоднішньою зустріччю», — сказав перший Чоловік, змусивши своє обличчя прийняти щось схоже на усмішку.\n\nПерш ніж Перера встиг запитати про їхні думки, другий Чоловік одразу продовжив: «Ми радимо Каталонії якнайшвидше внести зміни, викладені в цьому документі». Він дістав із валізи товсту папку.\n\nПерера перегорнув перші сторінки. «Мені потрібен час, щоб ознайомитися й відповісти—»\n\n«Співпраця з Іспанською Республікою вимагає від Каталонії дотримуватися певного... економічного консенсусу. Реалізація має критичне значення для успішности нашої співпраці». Люди в чорному видали свою звичну заяву, і Перера знав, що простору для компромісу буде мало."
CTL_wars.10.a:0 "Ці зустрічі завжди закінчувалися однаково."

CTL_wars.11.t:0 "Сіре й чорне"
CTL_wars.11.desc:0 "Застояне повітря всередині поліцейської дільниці смерділо сигаретами та старим папером. Члени Mossos d'Esquadra займали свої пости, зливаючись із тьмяно-сірими стінами. Єдиним звуком було час від часу постукування чобіт, потертих довгими патрулюваннями вулицями Барселони, та ковзання ручок по прострочених звітах.\n\nПотім вхідні двері зі скрипом відчинилися, впустивши бажаний порив свіжого повітря. Чоловік, що стояв найближче до входу, підняв голову й побачив двох офіцерів Guardia Civil. Їхня форма була чистою та бездоганною — начищені чоботи цокали по підлозі з машинною точністю, коли вони проходили повз нього й заглиблювалися в дільницю, прямуючи до приватного кабінету його начальника. Їх супроводжувала атмосфера відсторонености, зарозумілі очі розглядали кожну деталь занепалих умов.\n\nУ кабінеті начальник дільниці сидів за потертій дерев'яній стійкою. Не постукавши, двері відчинилися, і двоє офіцерів увійшли, перш ніж начальник устиг відреагувати. «Ми прийшли обговорити деякі зачіпки», — різко сказав один із них. Вони зупинилися, оглядаючи кімнату, наче заносили її деталі до звіту. «Йдеться про прохунтівські елементи в місті».\n\nНачальник дільниці опанував себе. Його попередили, що ці двоє прийдуть, і їхнє ставлення було очевидним. Не було сенсу вимагати люб'язностей. «Я чув», — нейтральним тоном сказав він. Не те щоб у нього були якісь конкретні подробиці, але з [SPR.capital.GetCapitalVictoryPointName] завжди щось було не так.\n\n«Ми будемо раді надати вам подробиці», — другий офіцер простягнув руку до пальта, щоб дістати складений аркуш паперу, а його рот розтягнувся в неприродно широкій усмішці — тонкі губи потріскувалися під пружною силою. «Ми розраховуємо на вашу співпрацю»."
CTL_wars.11.a:0 "За межами кабінету інші поліцейські намагалися вдавати, що не слухають."

CTL_wars.12.t:0 "Змії у високій траві"
CTL_wars.12.desc:0 "Патруль із п'яти чоловіків ішов звивистою стежкою, насторожено прислухаючись до звуків. Хрускіт листя під ногами та тихе коливання гілок, що утворювали над ними навіс, за інших обставин були б спокійними, майже приємними.\n\nПатруль не міг дозволити собі ані миті насолодитися красою, що їх оточувала. Ця місцевість була сірою зоною, а лінія фронту розчинялася в самому ландшафті. Будь-який кущ чи пагорб міг приховувати ворога. Партизани та передові підрозділи Хунти й Республіки невидимо панували над місцевістю. Вони не бачили невидимих очей, що оцінювали їх.\n\nСпостерігачі патруля безшумно рухалися крізь густу рослинність, легкі, мов вітер. Їм не потрібно було говорити — вони вже спланували свої дії. Залишалося лише виконати задумане. Невдовзі раптові повороти лісової стежки на коротку мить приховали шлях попереду, а дерева та папороть утворили непрозорий зелено-коричневий коридор. Патруль почав проходити ним, піднімаючи гвинтівки та сповільнюючи крок. Повітря було тихим; вони обережно просувалися вперед. Вони водили гвинтівками по густій зелені навколо. Нічого незвичайного. Вони затамували подих, їхні інстинкти були напоготові.\n\nЦе сталося. Чоловіки, замасковані під кущі, раптово вискочили із землі з-під папороті, просто під дулами гвинтівок. Вони кинулися вперед, а патруль не встиг опустити зброю, щоб зустріти нову загрозу. Підготовлені ножі пронизали плоть. За лічені секунди все скінчилося.\n\nТіла потягли до ями, де вже лежали тіла кількох нещасних, що почали гнити. Їх кинули туди, майже не приділивши їм уваги. Один із них звернув увагу на одяг. Він виглядав незнайомим, відмінним від того, у якому були ті, кого вони знищили раніше."
CTL_wars.12.a:0 "«Хтось узагалі впізнає цю форму?»"

CTL_wars.13.t:0 "Подвійне бачення"
CTL_wars.13.desc:0 "Ніч була теплою, застійне гнітюче повітря лежало на Франсіско, мов ковдра. Ніч була вдалою: зустріч із друзями та пиття Балеарського моря у віскі. Якби тільки сильний головний біль, що стрімко розвивався, погоджувався з ним.\n\nВін сидів, притулившись до стіни якоїсь будівлі на якійсь вулиці. Якщо бути чесним із собою, цієї ночі він зовсім заблукав і не впізнавав, де перебуває. Жорстока застійність, що ніби притиснула його до прохолодної стіни, не залишала місця для складних думок. А може, це було віскі? Війна була далеко, а вуличний ліхтар над ним горів. Вулиця була тихою. Усе було добре. Він обм'як і заплющив очі, насолоджуючись моментом.\n\nЙого затуманений розум усвідомив, що світло вуличного ліхтаря раптом було перекрите. Він розплющив очі й затуманено поглянув угору. Вони нестійко стояли, явно самі трохи напідпитку. «Добрий вечір, товариші, я можу вам допомогти?» — пробурмотів він.\n\nВони подивилися на нього з тьмяним упізнаванням в очах. «Ти ж Франсіско Серрано? Володієш тими гаражами?» — нарешті запитав один із них.\n\n«Новий світ, тепер ми всі чимось володіємо», — байдуже відповів Франсіско. Чоловіки, що стояли над ним, засміялися.\n\n«Цей хлопець відмовив моєму братові в роботі. У нього нічого не було, він показав свою роботу. Я вважаю, роботу хорошу. Але цей чоловік сказав йому забиратися з майстерні. А тепер він думає, що ми товариші?»\n\nФрансіско спробував щось нерозбірливо відповісти. «Я вступив до ОСКП, я хочу дати—»\n\n«Просто капіталіст, який їде на революції. Ставився до мого брата як до собаки, може, нам варто зробити те саме!» Франсіско схопили за комір, і його свідомість почала прояснюватися саме вчасно, щоб усвідомити кулаки."
CTL_wars.13.a:0 "Сприйняття та відплата"

