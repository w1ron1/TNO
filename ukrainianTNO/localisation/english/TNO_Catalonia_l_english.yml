CTL_wars.16.t:0 "Liquidation"
CTL_wars.16.desc:0 "In the dead of night, the camp's internees watched impotently as their guards were corralled just outside of the wire of the camp's fences. They were all young except for the camp's elderly commandant, meekly following the orders of the men that had so suddenly fallen upon them.\n\nTheir cars' heavy light beams illuminated the camp. Some looked like they had been taken from the streets of Barcelona, albeit dusty and worn. Others changed heavily, chopped and torn with weapons and cargo carrying modifications set up. Some of the men on the guns ignored the guards that had been taken prisoner. Others held a rapt attention, especially as one man began to speak elaborately to them about the necessity of sacrifice.\n\nAll the camp's inhabitants came out of their huts; men, women and children. Civil servants, soldiers, politicians, they'd all supported Franco in some way, so had been thrown into this camp in the middle of nowhere. The more optimistic ones began packing in their huts. Perhaps these were irregular in the service of the Government, people rising up against the terrorists at last?\n\nThe man speaking to the timid gang of guards raised his voice, loud enough for the camp to hear.\n\n"In this war, for us to survive gentleman, we need you elsewhere. We shall let you go free, after all we are your friends, but first we shall do you the service of cleaning up this vermin. Then perhaps you can join us in the real war."\n\nWith a gesture and a shout the men on the machine guns alerted and made ready - all weapons of these newcomers trained on the people behind the fence."
CTL_wars.16.a:0 "The Guards were reassigned, and a small inquiry found no evidence"

CTL_wars.100:0 "Preparing for War"
CTL_wars.100.d:0 "In his Palace of the Generalitat office, President Josep Tarradellas looked at the document in front of him. A pan-Catalanist dream transcribed into blunt, direct military prose. A war plan for an invasion of the Balearic islands and, contingent on hostile occupation, Valencia to the south.\n\nThe language, on the spare occasions when it was not a technical description of the attack or occupation, offered only military justifications for the operation. But Tarradellas could envision all the stirring rhetoric and trembling hands that had propelled these few pages to his desk. He hoped that the pan-Catalanists were as skillful at battlefield maneuver as they were in the backrooms... to get this measure through such a divided cabinet was no small accomplishment.\n\nTarradellas was stalling. He knew he was stalling. He tapped at the war plan with a pen. He turned the page to review section 43c. 'Naval Preparations in Tarragona' for a third time. Flipped the page to 57a. 'Reinforcement of Tortosa'. He looked up, over to Councilor of Defense Joan Roca i Caball, who stood still. Waiting.\n\nDid he too see the men Tarradellas would send to their death with a simple "yes"? The ones who would linger in hospital beds, crumpled with unending pain, unable to take another step on Catalan soil? Or was the only thing in his vision the trampled flag, the unbearable wait and unbearable weight of being small Catalonia in a Spain and Europe dominated by foes? A world unchanged by a "no".\n\nThat was a world he could no longer accept. One where the next generation of Catalans would be exiled, as he had been, or placed under the boot, as Roca i Caball had been.\n\nWith a single firm motion, he stamped the plan's cover. "Tell them to proceed when ready, Joan. I'll tell the world we're back."
CTL_wars.100.a:0 "Time to restore our homeland."
 
