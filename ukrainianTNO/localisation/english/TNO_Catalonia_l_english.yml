 CTL_Josep_Tarradellas:0 "Жозеп Тарраделяс"
 POLITICS_Josep_Tarradellas_DESC: "Народжений 1899 року, Жозеп Тарраделяс — старий загартований часом символ, навколо якого гуртується Каталонська Республіка. Як член Республіканської лівиці Каталонії, партії-спадкоємиці каталонської автономії, Тарраделяс був прем'єр-міністром Женералітату під час Першої громадянської війни в Іспанії. Переживши конфлікт, 1954 року його обрали президентом уряду у вигнанні.\n\nОднак відтоді він та ERC віддалилися одне від одного. Після обрання президент відмовився формувати уряд у вигнанні, призначати своїх міністрів або повертатися доти, доки не буде відновлено каталонську автономію. Протягом тридцяти років стратегія республіканського легалізму Тарраделяса віддаляла вигнанців від місцевих підпільних сил. Але тепер, коли народ за їхньою спиною, а діловий світ відвертається від Франко, Женералітат повертається додому, очолюючи незалежну республіку.\n\nСприйманий як єднальна постать, після проголошення незалежности його легітимність була визнана. Це поставило Тарраделяса в незвичне становище: очолити поспіхом сформований кабінет із різнорідних сил, обіймати президентську посаду, що об'єднує та легітимує багатьох людей, із якими він не погоджується, і водночас керувати незалежною державою, якої він не прагнув. Лише якщо Іспанія й надалі дотримуватиметься фашистського курсу, старий чоловік охоче проміняє домовлену автономію на постійну незалежність.\n\nПопри все, пісня лунає в повітрі й на вустах у кожного. Тріумфальна Каталонія знову буде багатою, повноцінною та вільною."
