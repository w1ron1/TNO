 #Ministers
 CTL_Jordi_Pujol:0 "Jordi Pujol"
 CTL_Jordi_Pujol_hog_desc:0 "§YVice President of the Generalitat\nConservatism§!\n--------------\n"

 CTL_Joan_Cornudella:0 "Joan Cornudella i Barberà"
 CTL_Joan_Cornudella_hog_desc:0 "§YVicepresident of the Generalitat\nProgressivism§!\n--------------\n§LThe fire of Catalunya was never quenched. Men like Joan Cornudella i Barbera, the son of a republican brickmaker, industrial engineer and fighter, saw to that. A pre-war agitator and member of Estat Català, he clandestinely returned in 1941 to keep the flame alive. Driven by the murder of his brothers, he returned as president of the Front Nacional de Catalunya (FNC) that he had founded, having pushed Estat Català into a subordinate position within this grand fighting coalition. Independent of the paralyzed Generalitat-in-exile, the FNC led the national struggle. Nothing would detain the struggle.\n\nFor all of the returning Generalitat's "legitimacy", Barbera's appointment as Vice-President was a fait accompli. Once ostracized from high politics, his direct involvement in the national struggle won him leadership of Tarradellas' government. There, he holds the weight of Catalan politics in balance, as a pro-independence socialist opposition to the moderate autonomists backing Tarradellas, and a bulwark against CNT radicals whom, alongside the Falange, he suspects of murdering his brothers. Both adversaries are nothing, fools whose distant ideas are alien to the nation. Nothing will waylay the hard-fought-for Catalan state or socialism with human dignity. Nothing.§!"

 CTL_Josep_Carner:0 "Josep Carnera i Ribalta"
 CTL_Josep_Carner_for_desc:0 "§YCouncillor of Foreign Affairs\nLiberalism§!\n--------------\n§LEducated at the liberal and Jesuit Escoles Pia, and resisting anarchist anti-clericalism, the "dangerous separatist" Josep Carner i Ribalta fled after the first civil war - not to France, but New York. Whether publishing in Mexico, directing the Free Catalonia bulletin alongside the Separatist Club, or even leading a war-time antifascist radio program approved by the US government, he worked to spread the Catalan message as far south as Chile. This climaxed in his presenting The Case of Catalonia to the OFN, requesting military intervention in support of a Greater Catalonia, which would envelop the Balearics, Valencia and Roussillon.\n\nNow, with a newfound vigour, the call for support emanates from the homeland itself. Through the radio box, the new Councilor for Foreign Affairs addresses the liberal Americas. Ribalta's call and the modest aid it garners are all in the name of an independent aggrandized Catalonia, regardless of Spain's government. Many deride this as impossible. And yet here Catalonia stands, after centuries of struggle. Justice cannot be expected from the oppressor, from Spanish unitarianism, of which Nazifascism is but one mask. Against these beasts, this professed humble and naive patriot sees only a grand nation of six million Catalans as a true defense.§!"
 
 CTL_Joan_Folchi:0 "Joan Josep Folchi"
 CTL_Joan_Folchi_eco_desc:0 "§YCouncillor of Economic Affairs\nConservatism§!\n--------------\n"

 CTL_Ramon_Perera:0 "Ramón Perera Comorera"
 CTL_Ramon_Perera_eco_desc:0 "§YCouncillor of Economic Affairs\nSocialism§!\n--------------\n§LRamón Perera Comorera: the man who saved Barcelona. As an industrial engineer and Partit Socialista Unificat de Catalunya affiliate, he was assigned secretary of Catalonia's defense works. In record time, Barcelona became a city of a thousand shelters. Lives were saved, but the war was lost. London welcomed the engineer but snubbed his designs. After this new home became the blitzed coffin of tens of thousands, the OFN resolved not to make the same mistake. From his new home in Mexico, the Catalan worked with the alliance on shelter designs, joined the Moviment Socialista de Catalunya, and continued his civil engineering career.\n\nBelieving they would never return, the outbreak of independence was a bittersweet surprise. Now, he returns to his old task with utter determination; through shelters and bleeding-edge frontline logistics and infrastructure, the people will be safe. This work calms President Josep Tarradellas' old nerves. Who can doubt that the socialists have representation with a socialist minister? Even if they are one so unbothered by all but his simple, honest task. Perera is no longer the unsung hero. Still, he looks to the sky in fear. Diffident, squeezed between autonomists and separatists and burdened by the memory of war, all he asks for is peace, not oblivion.§!"

 CTL_Joan_Roca:0 "Joan Roca i Caball"
 CTL_Joan_Roca_sec_desc:0 "§YCouncillor of Defense\nChristian Democracy§!\n--------------\n§LWhen faced with the choice, Joan Roca i Caball chose Catalanism over a lifetime of Carlism. In 1931 he teased away young Carlists to co-found the nationalist Unió Democrática de Catalunya, a Christian democrat party advocating for autonomy. Whether in the 1933 election, fleeing militant republican secularism in 1936, or advocating for a truce in the first civil war, Joan Roca failed to stake a conciliatory "Third Spain" between nationalist and republican extremes. Defeated, they limped home in 1942. Reorganizing the UDC for clandestinity, he was spared the worst repressions due to the cultural nature and Catholic guise of their resistance.\n\nBut now, Joan's tires of passivity. The councillor has played a key role in resurrecting the Galeusca alliance of Galicia, Euskadi and Catalonia, and the army only wants for resources which do not exist. However, despite the shared respect, the Council of Defense is his domain, its prerogatives guarded jealously. The reason echoes President Tarradellas' decision to appoint him — a fully civilian cabinet is born from panging memories of military suppression. Representing the nationalist right-wing in government, he will push Catalonia away from reprisals and toward autonomy within an Iberic republic. Conciliation is still possible. It must be.§!"
 
 CTL_Vicente_Guarner:0 "Vicente Guarner i Vivanco"
 CTL_Frederic_Escofet:0 "Frederic Escofet i Alsina"
 CTL_Josep_Maria_Benet:0 "Josep María Benet i de Caparà"
 CTL_Antoni_Blavia:0 "Antoni Blàvia i Esquirol"
 CTL_Virgilio_Botella:0 "Virgilio Botella Pastor"
 #National Spirits 
 CTL_discontinued_government:0 "Discontinued Government"
 CTL_discontinued_government_desc:0 "When regional autonomy was abolished, the Generalitat's government fled abroad and continued to function despite the torture and brutal murder of many of its members at the hands of the Francoists. When Josep Tarradellas became the Generalitat-in-exile's President in 1954, he refused to form a cabinet, causing a lull in political organization among exiled Catalans. Upon his return to lead the Catalan Republic, many local politicians achieved power by taking advantage of the vacuum caused by Tarradellas's weakening of Generalitat authority. While the returned exiles dominate Catalan politics for now, the rift that has emerged between the two factions will inevitably turn in favor of the new generation of local Catalan politicians once Tarradellas runs out of political capital."
 CTL_pancatalan_claims:0 "Pancatalanist Claims"
 CTL_pancatalan_claims_desc:0 "Catalonia as a national project is not limited to the former Generalitat. Across the Northwestern Mediterranean coast, millions of Catalans still live outside of our controlled territories. While not monolithic in its span, Catalan nationalists generally agree that it should be one of our government's major goals to liberate these territories and reunite the Catalan people under a single state. For now, the Catalans have an ideal to strive towards."

 #Tree
 CTL_the_rebirth_of_the_generalitat:0 "The Rebirth of the Generalitat"
 CTL_the_rebirth_of_the_generalitat_desc:0 "Almost 40 years ago, the flame of the Generalitat was smothered by the black eagle.\n\nThe eagle has now fallen from the skies, groaning pitiably among its former victims. It was only yesterday that the legitimate government of Catalonia returned to Barcelona, though, and there is much work to be done in ensuring the freedom and independence of Catalonia. We shall see to it, that the eagle never roosts once more on the trees of Barcelona.\n\nFrom every balcony and rooftop, let the yellow-and-red Senyera fly on Catalan winds!"
 CTL_the_rebirth_of_the_generalitat_tt:0 "§fCatalunya, triomfant, tornarà a ser rica i plena!§!"

 CTL_to_bring_catalonia_to_a_new_generation:0 "To Bring Catalonia to a New Generation"
 CTL_to_bring_catalonia_to_a_new_generation_desc:0 "We have hidden in the shadows for years and jumped from the searchlights from Franco's bloodthirsty pack. Now, however, we are free to bask in the Mediterranean light - and with it, like a flower derives its metabolic fuel from the rays of the sun, so too will Catalan culture blossom in the cosmic light of our newfound freedom.\n\nOur national rebirth will begin with the rejuvenation of our lost language - our mark of our identity and pride. Let us revive the Catalan language, and bury the Castilian tongue."
 
 CTL_return_of_the_old_guard:0 "Return of the Old Guard"
 CTL_return_of_the_old_guard_desc:0 "While not everyone fled the country upon the arrival of Franco's armies in the Civil War, nearly everyone in Catalonia knew someone who did, if not had their life taken prematurely. Civil War veterans, politicians, intellectuals, trade unionists alike, anyone who fit the criteria to be named on the hit lists the AAS compiled, fled, taking the Catalan dream abroad with them. Today, however, the remains of the Old Guard returned from exile. It would be a waste not to capitalise on this abundance of thought now in our hands."
 
 CTL_mobilise_catalan_industry:0 "Mobilise Catalan Industry"
 CTL_mobilise_catalan_industry_desc:0 "The Foment del Traball Nacional is the largest employers' association in Catalonia, and to neglect its influence would be a political suicide on our part. That being said, there are some rather worrying reports about the continued presence of pro-Franco remnants which are continuing to operate within the association.\n\nWe will allocate the means necessary to liquidate what remains of the Francoists in the FTN. There is not expected to be much resistance from those who remain, as most subversive elements are believed to have fled Catalonia amidst the chaos that ensued following our independence. Then, with the FTN firmly under the Generalitat's thumb, it will become much easier to put Catalonia's industry to work, giving us the necessary resources to fight this war."
 
 CTL_bring_omnium_cultural_into_the_light:0 "Bring Omnium Cultural Into the Light"
 CTL_bring_omnium_cultural_into_the_light_desc:0 "The Union kneeled on our neck of our culture and suffocated its growth, restricting public depictions of Catalan culture. As is the only logical step forward, we must now repeal the restrictions on the expression of our culture.\n\nThe Omnium Cultural, one of the largest associations focused on the promotion of Catalan culture, will be revived, along with other Catalan cultural clubs. With the Omnium fully operational, our culture will thrive in the streets and households of every Catalan family, and the world will finally know the mark of the great Catalan nation..."
 
 CTL_choosing_our_approach:0 "Choosing Our Approach"
 CTL_choosing_our_approach_desc:0 "Now with the foundations of our new country set up, the time to resolve the burning question strikes us.\n\nHow should Catalonia proceed in this war?\n\nOn one hand, a long standing dream of the Catalonian nation is a dream of independence. We would be able to demonstrate our commitment to these ideals by standing on our own and showing the world what a fully independent Catalonia can do. However, with the shadows of Franco breathing down our neck, we would have Republican resources and support to keep us fighting for longer at the cost of sacrificing some of our independence for closer ties to the Republic.\n\nWe should tread carefully and make our decision, before it's too late."
 
 CTL_restore_pyrenees_hydroelectricity:0 "Restore Pyrenees Hydroelectricity"
 CTL_restore_pyrenees_hydroelectricity_desc:0 "Surrounding Catalonia are hostile forces which threaten our independence militarily, ensuring our economic independence is just as crucial to the war effort as anything else. During the initial turmoil that spelt the demise of the Iberian Union, several hydroelectric dams across the Pyrenees were forced to cease operation, along with the construction of additional dams that were in the process of nearing completion, unfortunately for us.\n\nProtecting ourselves economically would begin with securing our source of power directly into our own hands. Send out orders to resume the dam constructions with whatever plans can be salvaged and to reactivate the dams that went offline. We absolutely cannot be held back by issues which lie in the palm of our hand."
 
 CTL_drown_them_in_catalan_steel:0 "Drown Them in Catalan Steel!"
 CTL_drown_them_in_catalan_steel_desc:0 "Any war is never particularly kind to either side, not to its belligerents nor to its bystanders. Recognising the decrepit state of our metal industry in the wake of the Iberian Wars, in the face of the imminent threats, it is absolutely imperative to reorganise our metallurgical industries into a much more robust, expansive and streamlined means of acquiring and refining steel.\n\nThis primarily involves acceleration of steel production through the construction of new facilities, optimisation of our resource extraction, and also an increase in labour mobilisation and recruitment to feed the steel industry, transforming it into a formidable engine that will be a testament to not only our defensive capabilities but also our economic output."
 
 CTL_the_drive_to_independence:0 "The Drive to Independence"
 CTL_the_drive_to_independence_desc:0 "As it has been demonstrated from the last few decades up to the present, any formidable, resolute army moves fast and hits hard. For that reason, it is foolish to continue relying on infantry when it can only move as quickly as the slowest man in the battalion, and can fight only as long as the man with the largest gun is still standing.\n\nBut, to give our men any sort of ability to transcend the typical infantry form, we must provide them with the necessary equipment and toys to do so. For that, trucks and light tanks will certainly do - they provide quicker mobility, more efficient means of transport, and reasonable armour and raw firepower to put us on the offensive. To accomplish this, we will jumpstart the automotive industry to give us what we need to make this a reality."
 
 CTL_complete_prewar_naval_projects:0 "Complete Pre-War Naval Projects"
 CTL_complete_prewar_naval_projects_desc:0 "The Iberian Wars led to an abrupt and unfortunate halting of some of our naval projects, which today remain sitting derelict in the tired dockyards of Barcelona and Tarragona - themselves half-completed and with many parts still under construction. With the shadows of war looming over Catalonia, the need for us to fortify and establish a naval capability within our vicinity has become more pressing than ever.\n\nBy enhancing our naval production through the expansion of our port capacities and naval dockyards, we will secure our nation's coastal borders and project our power at least within the shores in our surroundings - and ensuring that our naval forces can protect our shores will be the central goal of this new initiative."
 
 CTL_against_our_enemies:0 "Against Our Enemies"
 CTL_against_our_enemies_desc:0 "Above all else, we took up arms to protect Catalonia from those who wish to do it harm, and to proclaim and defend its sovereignty from our oppressors who seek to keep us in shackles. It was our initial desire from the start, and it shall remain our primary objective.\n\nThe Republic does show interest in winning over our support, and with a little bit of luck and manipulation we can certainly obtain their support whilst preserving our own interests of Catalan sovereignty. However, it would be foolish to let down our guard when we still find ourselves surrounded by hostile groups seeking our destruction. Therefore, though it will certainly put an even greater strain on our already volatile condition, we will focus on defeating our enemies before reaching out to the Republic."
 
 CTL_sacramental_self_defense_forces:0 "Sacramental Self Defense Forces"
 CTL_sacramental_self_defense_forces_desc:0 "As any Catalan would know, the Sometent, the Catalan civil self-defence paramilitary, traces its roots back to the Sagramental in 1068 through strict coordination by peasants defending themselves from external aggressors. Since then, it has found itself a participant in countless wars ever - and even today it remains one, though what exists lies in a laughably poor state that we could only euphemistically call "ceremonial".\n\nRestructuring the Sometent, keeping true to its roots but turning it into a truly effective self-defence force, would free up police officers and other garrisons that could now go off to the front if necessary. Let us do precisely that, so that we may have more men where they are needed most."
 
 CTL_crack_down_on_unionists:0 "Crack Down on Unionists"
 CTL_crack_down_on_unionists_desc:0 "Like in every war since time immemorial, there are always traitorous scum and fifth columnists behind our lines, pandering to our enemies in the naive belief that the enemy has something to offer us - or if the traitors really are selfish, something to offer them. Yet, as much of a nuisance as they are, we have seen in the last Great War that countless examples of traitors and collaborators seized power, showing that if not suppressed correctly, there are dire consequences.\n\nWhat makes them the most difficult to target, however, is that they look and live right among us - Catalan-speaking Catalonians, born and raised in our cities, educated in our schools, yet much more interested in bearing allegiance to Spain, and keeping Catalonia but just a part of Spain. We will combat these Unionist individuals and groups, and keep our eyes and ears as vigilant as ever, by increasing our operations in suppressing them. If they remain left unchecked, it will quickly spiral into a new front much more difficult to combat. Snuffing them out now is our best option."
 
 CTL_a_concrete_border:0 "A Concrete Border"
 CTL_a_concrete_border_desc:0 "The western frontiers of Catalonia are impervious to attack from the fascists and pose the most significant risk to our security. The fascists grow in strength every day, and once their eyes are off the Republic they will inevitably swing their fists towards our vicinity, but the enemy of our enemy is not necessarily our friend - and we would be foolish to place our trust in the Republic, all previous contact notwithstanding...\n\nNaturally, the most natural course of action would be to set up a series of fortifications and redoubts along the western front. The fascists may ram their heads against our wall, they may thrash and crash against us... But when they inevitably do, we will be ready. Let us invest in new defences, safeguards, and booby-traps - whatever necessary to withstand the fires brought upon us."
 
 CTL_the_spirit_of_montjuic:0 "The Spirit of Montjuic"
 CTL_the_spirit_of_montjuic_desc:0 "As numerous were the years Catalonia have been subjugated were just as numerous as the times we have repulsed every oppressor from our lands. As tall as the the piles of enemies who had come to take our freedom from us, is as tall as Montjuic herself. Though Barcelona and the rest of Catalonia have been attacked several times in history, Montjuic has always remained, a symbol of our identity, a symbol of our resolve.\n\nThough we have been defeated before, nothing short of killing us all will erase the Catalan spirit from the Earth. This time, however, things will be different. We will not falter, we will not fall - and even the enemy should overwhelm us, let us heroically breathe our last breath on the summit of Montjuic."
 
 CTL_if_you_are_catalan_you_shall_fight:0 "If You Are Catalan, You Shall Fight!"
 CTL_if_you_are_catalan_you_shall_fight_desc:0 "Were you born in Catalonia? Then you are Catalan! Do you speak the Catalan language? Then you are Catalan! Do you live between the coast of the Mediterranean and the lofty Pyrenees? Then you are Catalan! If you can see the red and yellow Senyera fluttering in the wind, then you too are Catalan! And if you are Catalan, then you shall fight! You shall fight for our mountains and rivers, our language and our children, and for everything else that calls itself Catalan!\n\nOur nation does not have many people, and naturally this means we do not have many soldiers. It is imperative that we make do with what we are limited to - though what we can boast of is our identity. The only way we can expand our army, however, is through convincing our people of our ability to succeed because of our unique and exceptional culture, and to do so we shall employ more nationalist rhetoric and propaganda."
 
 CTL_an_understanding_with_other_regions:0 "An Understanding With Other Regions"
 CTL_an_understanding_with_other_regions_desc:0 "The Republic may have good intentions but that only makes it more hungry for control over us and while we are allies in the current struggle we should be prepared for what comes after the fascists are buried six feet under, and it is only logical that if we are not alone in voicing any demands then our voice will ring louder.\n\nOthers share our concerns, those who were also imprisoned by the Castilian giant for years and have only now tasted freedom once more, we will reach out to them and hopefully come to an understanding to ensure that the Republic does not get any ideas of trampling on our nations."

 CTL_m1938s_for_everyone:0 "M-1938s for Everyone!"
 CTL_m1938s_for_everyone_desc:0 "One cannot fight a war without bullets. Back in the days of the first civil war, the M-1938 gun was a staple of infantry combat and continues to be used by Catalan soldiers even to this day. But as the stockpiles grow ever smaller and the fighting seems to show no signs of stopping, it is becoming more and more clear that a locally sourced alternative must be considered.\n\nWith the help of a crack team of military industrialists and designers, the M-1938 will be given all the necessary upgrades and updates for them to remain both competitive and efficient in the new age of warfare. Once this is complete, they can be rolled out en masse - and with the reliance on foreign weapons reduced, our republic's chance of survival increases."
 
 CTL_with_the_republic:0 "With the Republic"
 CTL_with_the_republic_desc:0 "Many will view our fight as a fight for freedom for Catalans and Catalans only, but perhaps a less idealistic and more grounded, pragmatic analysis of our dire situation is needed. Backed into a corner of only the Pyrenees and the Mediterranean, our only allies in the vicinity are the Republic, who though they have made clear their desire to bind Catalonia closely to it have also given freedom to their people as promised."
 
 CTL_technocratic_middlemen:0 "Technocratic Middlemen"
 CTL_technocratic_middlemen_desc:0 "While Catalonia has the potential to stand on its own two feet, being blind to reality helps nobody. Given the comparative economic size and strength of the Republic compared to Catalonia's, lack of co-ordination and co-operation would surely sink the war effort - hence why economic synergy is imperative.\n\nTo ensure that things continue to run smoothly, a veritable legion of economic advisors has been recruited by the Republic. Referred to somewhat deridingly by locals as the 'men in black', these smartly dressed men in suits from the Republic will be providing their input on how to improve the economy - goodness knows Catalonia needs all the help it can get."
 
 CTL_refining_for_prisoners:0 "Refining Foreign Prisoners"
 CTL_refining_for_prisoners_desc:0 "In the pursuit of justice and reconciliation between our closest ally, we have had a particular lingering matter that we are ready to address with the Republic: the issue of prisoner transfers.\n\nRepatriating individuals detained by third parties and the return and trial of individuals apprehended by our own authorities has been a pressing issue since the beginning of the war, and from the looks of certain communiques with the Spanish Republic it appears this is a mutual concern. Negotiating a repatriation agreement will not be a difficult task to accomplish, given this fact."
 
 CTL_maintain_access_to_spanish_banks:0 "Maintain Access to Spanish Banks"
 CTL_maintain_access_to_spanish_banks_desc:0 "If there is one thing the wars are sure to have torn apart and disrupted is families spread across the country - everything from transportation to finance and the loss of property. To secure financial stability and access to essential banking services as well as soften the damage inflicted upon civilian livelihood by the war, we find ourselves once more reaching out to the Republic.\n\nWithin the Republic and the banks under their control many Catalonian citizens still have their assets and finances held - and the same can be said for Spanish citizens who have their assets in our banks. Alleviating our citizens and those of the Spanish would certainly give us the good publicity we need before our own people, and with our existing good relations with the Republic we have many channels of communication which could be used to negotiate seamless cooperation between Catalan and Spanish banks.\n\nBy removing the existing obstacles and disconnections between our banks, we can simultaneously provide support for our citizens, whilst also tapping into previously inaccessible funds which will indispensably empower our war efforts."
 
 CTL_food_for_guns:0 "Food for Guns"
 CTL_food_for_guns_desc:0 "For what our little nation has, we boast of an impressive industry which has done well to sustain us thus far as an independent nation surrounded by hostile forces.\n\nOn the other hand, our agricultural and consumer goods output has been rather lacking to say the least. Reports of hunger and and starvation since the start of the wars have been numerous in count from our officials, and there has been little to no space to expand our existing farms due to attacks from our most proximal enemies. Clearly, it would be in our best interest to seek out a mutually beneficial trade deal with the Republic, whose larger domain has kept a steady flow of food for its citizens.\n\nThis pact will ultimately aim to come to a mutually favourable deal between us and the Spanish Republic - where we will allocate a portion of our industrial production to the Republic in exchange for essential food shipments from the Republic. Leveraging our industrial capabilities to support a potential ally's defence needs while ensuring the well-being of our own citizens is an opportunity too good to pass up on."
 
 CTL_shared_bases_and_intelligence:0 "Shared Bases and Intelligence"
 CTL_shared_bases_and_intelligence_desc:0 "As much as it may further bond us into interdependence with the Republic, we cannot deny the basic fact of our circumstances that we and the Republic share a wide range of common enemies and have much less of an interest in making an enemy of each other - sharing many values in common. Recognising the imperative need to establish closer military cooperation, we shall seek to strengthen the existing ties between our governments.\n\nWe have identified key strategic locations for joint military bases in both of our territories and prepared a plan to invest in common construction and expansion of existing infrastructure at key locations for joint military bases and establish a framework of intelligence sharing in both military and civilian sectors. Through closer military integration and intelligence sharing, we will fortify at least one of our fronts and allow ourselves to be better prepared to deter aggression from those around us.\n\nNow, all that remains is to deliver our proposal to the Republic. Together, what can possibly pose an existential threat to our cause?"
 
 CTL_share_pegaso_blueprints:0 "Share Pegaso Blueprints"
 CTL_share_pegaso_blueprints_desc:0 "The Pegaso automobile company has been one of the most prized industries of Catalonia - producing for us everything from trucks to armoured vehicles. Naturally, this has caught the attention of the Republic, finding itself lacking in adequate automotive production industries and the research bases necessary to create their own.\n\nIn a gesture of solidarity and military cooperation, we are prepared to share blueprints from the Pegaso automobile company. With access to comprehensive documentation of Pegaso vehicle blueprints and necessary technical specifications, all that is needed is a way to securely transfer these confidential documents to the Republic.\n\nOf course, this puts us in a position to gain leverage on the Republic. Certainly the Republic would be willing to oblige to compensate us how we see fit, right?"
 
 CTL_hunt_down_terra_lliure:0 "Hunt Down Terra Lliure"
 CTL_hunt_down_terra_lliure_desc:0 "For all we have done to secure the sovereignty of Catalonia it seems there are some of us, Catalans nonetheless, who are displeased with our efforts of cooperating with the Republic. Out of fear that we have been subverted by the Republic? Or out of fear that we have tied our destiny with a Republic doomed to fail?\n\nWhatever justifications they have, it cannot be neglected that they pose a growing threat to the security of the country. Lately we have been tracking top members of a far-left nationalist group calling themselves the Terra Lliure. Though they have yet to take any violent action against us, we can safely conclude that these terrorists are planning something big against us. We have compiled a list of individuals and meeting places to surveil and potentially make detainments at - we must strike against them soon, lest their operations grow out of our control."
 
 CTL_remember_the_diada:0 "Remember the Diada"
 CTL_remember_the_diada_desc:0 "The time at last has come! Let us re-establish the day of people - the Diada Nacional de Catalunya, once again. For too long Franco's thugs and goons have held not only our tongues, but our faces and our way of life. All that we have known about being Catalonians... and all that we have held dear to our identities...\n\nNo matter who in Madrid crowns himself Caudillo of our people in Barcelona, let the 11th day of September be our great call to an awakening of our people. The day serves as a reminder to us of all that we have to lose, when the Bourbons descended upon Barcelona after their brutal, year-long siege - the fascists in their bloodied glory and destruction will lay waste to our people in ways unspeakably worse."
 
 #Events
CTL_wars.1.t:0 "A Saint Behind, A Nation Ahead"
CTL_wars.1.desc:0 "Josep Tarradellas stood on the balcony of the Generalitat building, surrounded by the apostles of his new government — the white statue of St. George behind him. Below, a crowd bore the nine-stripped Senyera, waving the huge banners in unison like individual droplets in a wave. The flag was even draped over the balcony itself, hiding the over-carved railing for a much simpler message.\n\n"Catalans. Friends. Compatriots." As soon as he opened his mouth, the cameras that focused on him jittered slightly, as if each operator was personally affected. "A country is much more than a group of people living in the same place at the same time." The many-headed microphone stand picked up his words across several radio channels. "This is something that the bureaucrats in Madrid fail to understand." In the crowd, many different people wanted many different things for Calatonia, yet all listened with anticipation.\n\nLooking over his shoulder to face one of the members of his cabinet, the man caught a glimpse of the saint driving a lance into the belly of the dragon. Could they be as brave as to take up arms — to drive a lance into the weird chimera that was the Iberian Union? A sudden bout of independence would be a step too far. He knew it. Anyone with any understanding of politics knew it. But would the people accept it?\n\nTurning back to face the crowd slower than he should have, Tarradellas took a deep breath of the uncomfortably warm evening air. "We want the people of Iberia to know that we are here — that we are Catalans! We are strong. We are free.""
CTL_wars.1.a:0 "This was all he could promise."

CTL_wars.2.t:0 "Low Hanging Fruit"
CTL_wars.2.desc:0 ""We do not have to make this difficult, Gallardo. We are offering you an honorable, quiet retirement, and the Republic won't try and dig up anything about your connections with Mateu and Franco. But we need to have the FTN cooperating with our government."\n\nThe former office of Miquel Mateu i Pia, head of the Foment del Treball Nacional, Catalonia's employers' association, had seen more activity in recent weeks than it had since 1939. The compliant Mateu had subordinated the institution to Franco's economic directions ever since the end of the war, but now he was gone. Fled, like so many others.\n\nJosep María Muntaner, representative of the Department of the Economy, gazed at the Francoist symbols still adorning the hastily abandoned office. This was a chance to rein in what remained of the businessmen and industrialists remaining in Catalonia. He couldn't let it go to waste. "I'm sorry, but the decision has been made," he said with faux condolence, "the department has already decided upon a candidate to take charge of the association, Salvador Millet. A good economist, not some radical who'll run your work into the ground. You only have to sign here". Muntaner slid a prepared resignation letter and a pen forward.\n\nBehind the desk, Félix Gallardo i Carrera, the FTN's interim chairman, crossed his arms. "No. This is my responsibility and I don't trust you apparatchiks. I've seen the proposals being floated, I think you all haven't a clue what you're doing outside trying to secure power." He leaned back in his chair. "That won't be my legacy."\n\nMuntaner fidgeted with the pen, quiet but unmistakably sincere. "...Then we can call the police"."
CTL_wars.2.a:0 "With seething fury and a moment's heavy silence, Gallardo slowly signed his name on the resignation letter."

CTL_wars.3.t:0 "Baroque Revival"
CTL_wars.3.desc:0 ""Come in", Pau Riera i Sala responded to the three knocks on the door to his office. His secretary, Maria, gingerly stepped in, handing him an envelope with the insignia of the Catalan government. He looked at her with a nervous smile, quickly thanking her and almost snatching the letter from her hands. He had been waiting for more than a week now for a government letter regarding funding for the Òmnium Cultural, his institution for the promotion of Catalan culture and language. This was their chance to make it.\n\nAnd the further Riera read through the letter, the more excited he got. The Catalan government had seen wisdom; The grant would be provided. It brought with it previously unthinkable possibilities; half forgotten plans for the renovation of the Òmnium's facilities in the baroque Palau Dalmases in Barcelona and the expansion of its publishing house and cultural activities came to his joyous mind.\n\nRiera looked up in his well-kept but small office, mind wandering to see those finally sponsored places. The Palau Dalmases was a beautiful building but it was old; the carved marble and ornate facades were no match for proper electrical lighting or bathrooms, and Maria's admirable efforts at sweeping the place were a sisyphean attempt at battling the ever-tenacious patches of cobwebs and mold. And now it would be renovated, providing a proper launching pad for the Òmnium Cultural's efforts to truly revive Catalan culture in the new Catalan state. This was the opportunity of a lifetime.\n\nRiera called for his secretary. "Carmen - call Carulla, Cendrós and Vallvé. We have a meeting to arrange...""
CTL_wars.3.a:0 ""...And we've prepared for it for more than a decade"."

CTL_wars.4.t:0 "Out of the Frying Pan"
CTL_wars.4.desc:0 ""Alright, final point", Tarradellas hummed, tracing the paper with the points of discussion for the day until he reached the bottom. He knew this conversation would be the meeting's most difficult by far, but it had to be done. They couldn't wait anymore.\n\n"I propose we officially recognize and support the Spanish Republic. While we will have to make it abundantly clear that this is our own sovereign decision, it is also the only reasonable decision for us to make. The Republic is our only chance for a Spanish government we can peacefully live alongside; if the Republic falls, we will too as soon as troops can be placed at our door." Tarradellas put his hands on the table, a moment hung in tension, preparing for the onslaught of indignant exclamations and caustic counternotes.\n\nSure enough, the cabinet room exploded in a raucous cloud of noise. Angry derisions and cries of "Traitor!" dominated the room. Tarradellas called for silence, only succeeding after turning his shoe into a makeshift gavel upon the oaken table. The noise died down and Vice President Joan Cornudella rose to make his case.\n\n"Mister President, you cannot seriously be suggesting this. We absolutely cannot allow ourselves to take any sides in the Spanish war." Loud murmurs of agreement sounded from some in the room. "This is not our war; this will only drag us back into the pit of imperial politics we are just beginning to climb out of. The people would see just a servile act, no matter how many proclamations we make about it being our own free choice. Who could blame them, when we would invite the War's chaos to our home just to kiss Sevilla's ring?" The room fell silent.\n\nAll eyes were on Tarradellas, their heavy gazes adding weight to that of the decision before him."
CTL_wars.4.a:0 ""Ask them if they would rather stand next to the Republic or lie prostrate before the fascists"."

CTL_wars.5.t:0 "Blood and Bolts"
CTL_wars.5.desc:0 "Life at the Pegaso factory had reached a routine — a demanding and tedious routine, but routine nonetheless. Clock in. Listen to the foreman. Go to your station. Do your job. Eat lunch. Finish your job. Listen to the foreman again. Go home. There was a certain pleasure in having a job, knowing how to do a job, and doing said job.\n\nThe foreman was preparing to finally release them, with the sound of his footsteps being audible on the catwalks now that most of the machines were allowed to rest. "We've all heard the rumors," he began, his voice echoing in the industrial cathedral. Something about the way he held onto the railing with his whitened knuckles told them that he wasn't exactly thrilled about this. "No more cars. No more trucks." It didn't matter if they liked or hated the idea of their factory getting privatized. What mattered was that the routine was changing, and there were going to be some growing pains. "New apprenticeships will be opened. Those who need it will receive the necessary training. I am sure most of you will manage." This was just a polite way of saying that there was no difference between fastening a bolt on a truck and fastening a bolt on a tank.\n\nLeaving through the gates only after all were gone, the foreman looked up at the starry sky. Engines were engines, right? And besides, more people died in car accidents than in wars, right? So why then was he so hung up about the change? The workers didn't mind, did they? Of course, they didn't. Anything leaving this factory was his responsibility — his, and his alone. Snapping out of it, he reached for a cigarette. "Just do what you're told" was the ideology of his father which allowed him to rise to this position. The work would be the same. The pay would be the say."
CTL_wars.5.a:0 "A common man ought to cling to his hard-earned happiness."

CTL_wars.6.t:0 ""An Unconventional Press Conference""
CTL_wars.6.desc:0 ""I have long supported these views, if you review my past track record, you can confirm this for yourself" stated Eduardo Tarragona to the press for the hundredth time. A politician before independence, he'd always stood up for his home, speaking when others daren't for Catalonia. Achieving more for Catalonia than a policeman murder or cafe bomb ever had, in his mind.\n\nIndependence had reduced him to an average citizen, but that was hardly surprising. Even a critical Iberian was still a Francoist politician; now the defence of Catalonia had fallen to others. His work was, for the time being, done. He had been almost satisfied, despite his home being dragged out of Spain as chaos enveloped the land, until this horde of journalists descended upon him as he returned to his home this evening.\n\nAs he reached the building entrance, parrying demands for denunciations and lurid accusations, he noticed a police car arrive. Eduardo almost brushed it off when he noticed one of the officers point at him, concern mounting as they began quickly marching to him. He was about to greet the more important-looking officer when suddenly he was having his arms forced behind his back.\n\n"Eduardo Tarragona, you are being arrested under suspicion of treason. Do not resist," Tarragona barely processed the officer's words as they began pulling him away without a word more, a renewed wave of questions and flashing cameras overwhelming his senses.\n\n"What is the meaning of this? Treason? I would never attempt anything against Catalonia! This isn't right!" Tarragona protested as he was shoved into the police car and the door slammed in his face.\n\nThe reporters attempted to ask many questions to the officers, but every single one received the same response:"
CTL_wars.6.a:0 ""No comment.""

CTL_wars.7.t:0 "I Did My Part"
CTL_wars.7.desc:0 ""Hey, kid! Mind if I ask you a couple of questions?"\n\nThe "kid" in question kept walking down the relatively quiet Barcelona alleyway, his carefully planned route home from work specifically designed to keep army recruiters at bay. "Pay no attention to them," is what his mom would always say. This recruiter was not getting the message it seemed.\n\n"You don't want to spend the rest of your life cleaning tables, do you?" The kid hesitated, stopping for a moment, the light barely illuminating his displeased look. "That's right. I saw you back at the cafe on the corner. Do you not want more?"\n\nThe kid took the bait, turning around to meet the recruiter, donned in well-kept camouflage and with a Beretta holstered on his hip. "What could you possibly know about me?" A nerve was struck.\n\n"More than you think, son. You've been here all your life, choked of opportunity by your upbringing. No school, no future, no money, nothing." The kid was paralyzed; he wasn't too far off the mark. The recruiter pulls out a pamphlet, gesturing to the kid to take it with a warm smile.\n\nThe kid looked at it in his hand, reading the front: "Learn skills. Serve your country. Fight for Catalonia" It was followed with a list of roles he could take, from infantry to a tank mechanic. An enticing opportunity, to be sure.\n\nThe recruiter looked him in the eye. "When your children ask you what you did during the war, what will you say?""
CTL_wars.7.a:0 "The kid gives in."

CTL_wars.8.t:0 "An Interview with Tarradellas"
CTL_wars.8.desc:0 "Josep Faulí finished writing a few more notes as Tarradellas took a sip of water. Faulí wrote hastily, eager to continue the rehearsed affair quickly. The whirring of the office's ceiling fan hummed through the silence, attempting to diffuse the thin layer of smoke arising from the cigarettes both were smoking. Most of what was said could be entrusted to memory - the questions had been pre-arranged after all. A few redundant introductory questions felt awkward as both men felt their insincerity, both simply waiting for the theatre to play out.\n\n"Catalonia is not the only region to have risen up against the Iberian government. Many wonder, does the President support these other regions' struggles as hostilities continue?"\n\n"Of course. Euskadi, Galicia and Catalonia are all names that must be synonymous with the struggle against Madrid's imperialism. We must stand united."\n\n"You have been known to support federalism within Spain, what is your stance now?"\n\n"Yes, my interest is in Catalonia's interest and I believe Madrid's poor treatment of our lands shouldn't mean we cut off our nose to spite ourselves. Catalonia is foremost in my mind, federalism is only possible if she is strong with a changed Spain. As such, Catalonia and the other nations should make close relationships with those in Spain with whom we can cooperate. To deny any connection between our nations would be unrealistic, but that works both ways."\n\nThat line was unexpected. "Cooperate? With whom?"\n\nTarraellas lit another cigarette. "Any who can serve Catalonia's interests, we are no imperial province."
CTL_wars.8.a:0 "Fate, after all, belongs to those who seize it rather than waits for it to arrive at their door"

CTL_wars.9.t:0 "Old Rifles"
CTL_wars.9.desc:0 "Two Privates huffed as they hauled a case full of military cargo onto a table. Were these American rifles? Maybe German ones? Anything would be better than the current scraps they had to contend with. They stood back as their officers approached the cases — eyes hungry.\n\nWith a creak, the younger Lieutenant cracked the lid open, revealing rows of rifles nestled in straw with a hiss. His enthusiasm deflated together with the air. "Were these pried from the hands of Cubans? This is from — what — war of '98?" said the Lieutenant, clumsily holding a rifle in a way that made his Captain wince and lifting the iron sight to his eye. "Going to jam as soon as you take a shot from it."\n\n"If you do manage to jam it, I would say you did so on purpose," the Captain barked as he took the rifle from his colleagues clumsy hands, as a father takes a dangerous tool from a child. He took a moment to inspect the rifle as if he were greeting an old friend. It may have looked different, smelled different and the trigger was now adjustable, but it was still his beloved M-1938. There was a weird bump on the top, but he was relieved to find it was just a railing for all the fancy optics the newer generations needed to take a proper shot. "This is the same gun we used throughout the Civil War." Grabbing a cloth, the Captain wiped down the fingerprints that the Lieutenant had left on the metal components."
CTL_wars.9.a:0 ""No sense just staring. Let's see if this old girl still sings.""

CTL_wars.10.t:0 "The Men in Black"
CTL_wars.10.desc:0 "As Councilor of Economic Development for a nation in such unique circumstances, Ramón Perera was proud. How many other men could perform his work? Any American or Japanese bureaucrat could sign off projects with their national bounties. OFN nations had their paymaster and Asia could use Tokyo's teat even after the crash. Even the occasional German or Italian might be capable with their resources, he often mused with amusement. To succeed with limitation, as Catalonia did, that was true skill.\n\nAnd yet, Perera always wished he could be anywhere other than in the type of meeting he was currently stuck in.\n\nPerera had dubbed the two economic advisors that the Spanish Republic sent to work on their economic cooperation the "Men in Black" as there was absolutely nothing of interest about them beyond their identical black suits worn for every single meeting. A black void, dreary twins with voices as monotonous as they appeared.\n\n"We've consulted the documents and reports you sent us ahead of today's meeting," said the first Man, his face forced into something resembling a smile.\n\nBefore Perera could ask their thoughts, the second Man immediately followed. "We advise Catalonia to make the changes outlined within this document as soon as possible." He handed a loaded folder from his suitcase.\n\nPerera rifled through the first pages. "I'll need time to examine and resp-"\n\n"Cooperation with the Spanish Republic requires Catalonia to abide by a certain... economic consensus. Implementation is critical to our successful collaboration." The Men in Black had trotted out their usual statement, and Perera knew that there would be little room for compromise."
CTL_wars.10.a:0 "These meetings always ended up like this."

CTL_wars.11.t:0 "Grey and Black"
CTL_wars.11.desc:0 "The still air inside of the police station reeked of cigarettes and old paper. Members of the Mossos d'Esquadra occupied their posts, blending into the dull grey walls. The only sound was the occasional tapping of boots scuffed by the long patrols around the streets of Barcelona and the gliding of pens across overdue reports.\n\nThen, the front door creaked open, letting in a welcomed gust of fresh air. The man closest to the entrance raised his head, seeing a pair of Guardia Civil officers. Their uniforms were clean and sharp — polished boots clicking against the floor with the precision of a machine as they strode past him and deeper into the station towards his superior's private office. An air of aloofness followed them, arrogant eyes examining every facet of the run-down conditions.\n\nInside the office, the Station Chief sat behind a chipped wooden desk. Without a knock the door opened, the two officers striding in before the chief could react. "We're here to discuss some leads," one of them said briskly. They paused, scanning the room as if cataloging its details for a report. "It's about pro-Junta elements in the city."\n\nThe Station Chief composed himself. He had been notified that these two would arrive, and their attitude was apparent. No point in demanding pleasantries. "I've heard," he said in a neutral tone. It's not like he had any concrete details, but there was always something wrong with [SPR.capital.GetCapitalVictoryPointName].\n\n"We'd be happy to give you the details," the second officer reached into his coat to retrieve a folded piece of paper as his mouth formed into an unnaturally wide smile — thin lips cracking under the elastic force. "We trust you'll be cooperative.""
CTL_wars.11.a:0 "Outside the office, the other policemen tried to pretend they weren't listening."

CTL_wars.12.t:0 "Snakes in the Tall Grass"
CTL_wars.12.desc:0 "The patrol, five men in all, walked down the twisting path, ears pricked for sound. The crunching of leaves on the ground and the soft swaying of the branches that formed the canopy over them was tranquil, almost delightful in any other light.\n\nThe patrol couldn't allow themselves a moment to appreciate the beauty that surrounded them. This area was a gray zone, the frontline diffused into terrain itself. Any bush or hill could hold an enemy. Partisans and forward units of the Junta and the Republic dominated the landscape invisibly. They didn't see the invisible eyes assessing them.\n\nThe patrol's observers silently moved through the dense vegetation, moving as light as the wind. They had no need to speak - they had already planned their method. All that remained was the execution. Soon, the wooded path's sudden twists obscured the way ahead for a short moment, the trees and ferns making an opaque green and brown corridor. The patrol began to move through it, raising their rifles and slowing their pace. The air was silent; they moved through cautiously. They swung their rifles at the imposing greenery around them. Nothing unusual. They held their breath, their instincts on fire.\n\nIt happened. Men garbed as bushes all rushed from the ground under the ferns, underneath the barrels of the rifles. They charged up, the patrol not having the chance to lower their weapons to meet this new threat. Prepared knives pierced flesh. In seconds it was over.\n\nThe bodies were dragged to a ditch already holding some rotting unfortunates. They threw them in, sparing barely a thought for them. One of them took note of the clothing. It looked unfamiliar, different to those they had dispatched before."
CTL_wars.12.a:0 ""Does anyone actually recognise these uniforms?""

CTL_wars.13.t:0 "Double Vision"
CTL_wars.13.desc:0 "The night was warm, stagnant oppressive air feeling like a blanket upon Francisco. It had been a good night, meeting with his friends and drinking the Balearic Sea in whiskey. If only the raging headache that was quickly developing agreed with him.\n\nHe was sitting up against the wall of some building in some street. If he was honest with himself he'd been all turned around by the night, he didn't recognise where he was. The brutal stagnancy that seemed to hold him against the cool wall prevented much complex thought. Or maybe it was the whiskey? The War was far away, and the street lamp above him was lit. The street was quiet. All was well. He slumped and closed his eyes, he would enjoy the moment.\n\nHis misty mind became aware that the light from the street lamp was suddenly obstructed. He opened his eyes, looking up glazed. They stood unsteadily, clearly a little inebriated themselves. "Good evening comrades, can I help you?" he mumbled.\n\nThey looked at him with dim recognition in their eyes. "Aren't you Francisco Serrano? Own them garages?" one of them finally asked.\n\n"New world, we all own stuff now" Francisco idly answered. This earned a laugh from the men standing over him.\n\n"This guy turned down my brother for a job. He had nothing, showed off his work. Good work I reckon too. Yet this man told him to leave the shop. Now he thinks we're comrades?"\n\nFrancisco attempted a slurred retort. "I joined the PSUC, I want to giv-"\n\n"Just a capitalist riding the revolution. Treated my brother like a dog,maybe we should do the same!" Francisco was lifted by collar, his mind beginning to clear just in time to register the fists."
CTL_wars.13.a:0 "Perception and Retribution"

