CTL_wars.16.t:0 "Ліквідація"
CTL_wars.16.desc:0 "Глибокої ночі інтерновані табору безпорадно спостерігали, як їхніх охоронців зігнали просто за колючий дріт табірної огорожі. Усі вони були молодими, за винятком літнього коменданта табору, покірно виконуючи накази чоловіків, які так раптово на них напали.\n\nПотужні фари їхніх автомобілів освітлювали табір. Деякі машини виглядали так, ніби їх узяли просто з вулиць Барселони, хоча вони були вкриті пилом і зношені. Інші були значно змінені, понівечені й перероблені зі встановленими модифікаціями для зброї та перевезення вантажів. Деякі чоловіки біля кулеметів ігнорували полонених охоронців. Інші слухали дуже уважно, особливо коли один чоловік почав красномовно пояснювати їм необхідність жертви.\n\nУсі мешканці табору вийшли зі своїх бараків; чоловіки, жінки та діти. Державні службовці, солдати, політики — усі вони так чи інакше підтримували Франко, тому їх кинули до цього табору посеред нікуди. Більш оптимістично налаштовані почали пакувати речі у своїх бараках. Можливо, це були нерегулярні сили на службі уряду, люди, які нарешті повстали проти терористів?\n\nЧоловік, який говорив із боязкою групою охоронців, підвищив голос, щоб його почув увесь табір.\n\n«У цій війні, панове, щоб ми вижили, ви потрібні нам в іншому місці. Ми відпустимо вас, зрештою, ми ваші друзі, але спершу зробимо вам послугу й приберемо цих паразитів. Тоді, можливо, ви приєднаєтеся до нас у справжній війні».\n\nЖестом і криком чоловіки біля кулеметів привели зброю в готовність — усі стволи цих прибульців були спрямовані на людей за огорожею."
CTL_wars.16.a:0 "Охоронців перевели на інші посади, а невелике розслідування не виявило жодних доказів"

CTL_wars.100:0 "Підготовка до війни"
CTL_wars.100.d:0 "У своєму кабінеті в Палаці Женералітату президент Жозеп Тарраделяс дивився на документ перед собою. Панкаталоністська мрія, викладена сухою, прямою військовою мовою. План війни щодо вторгнення на Балеарські острови та, у разі їхньої ворожої окупації, на Валенсію на півдні.\n\nМова документа, за рідкісними винятками, коли це не був технічний опис атаки чи окупації, пропонувала лише військові обґрунтування операції. Але Тарраделяс міг уявити всю запальну риторику та тремтливі руки, які просунули ці кілька сторінок до його столу. Він сподівався, що панкаталоністи так само вправно маневрують на полі бою, як і за лаштунками... провести цей захід через настільки розділений кабінет було чималим досягненням.\n\nТарраделяс зволікав. Він знав, що зволікає. Він постукував ручкою по плану війни. Він утретє переглянув сторінку 43c. «Морські приготування в Таррагоні». Перегорнув сторінку до 57a. «Посилення Тортоси». Він підняв очі й подивився на радника з оборони Жоана Рока-і-Кабаля, який стояв нерухомо. Чекав.\n\nНевже він теж бачив чоловіків, яких Тарраделяс відправить на смерть простим «так»? Тих, хто лежатиме на лікарняних ліжках, скручені від нескінченного болю, нездатні зробити ще один крок на каталонській землі? Чи єдине, що було перед його очима, — розтоптаний прапор, нестерпне очікування та нестерпний тягар маленької Каталонії в Іспанії та Європі, де панують вороги? Світу, який не змінився б від одного «ні».\n\nЦе був світ, який він більше не міг прийняти. Світ, у якому наступне покоління каталонців буде вигнане, як він, або опиниться під чоботом, як Рока-і-Кабаль.\n\nОдним рішучим рухом він поставив печатку на обкладинці плану. «Скажи їм розпочати, щойно будуть готові, Жоане. Я скажу світові, що ми повернулися»."
CTL_wars.100.a:0 "Час повернути нашу батьківщину."
 
#Tooltip
CTL_Reclaim_Baleares_tt: "§YТепер ми можемо оголосити війну будь-кому, хто окупує Балеари, щоб повернути їх. Ми повинні обрати найкращий момент для удару.§!"
