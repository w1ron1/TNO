 CTL_Joan_Cornudella:0 "Жоан Корнуделья-і-Барбера"
 CTL_Joan_Cornudella_hog_desc:0 "§YВіцепрезидент Женералітату\nПрогресивізм§!\n--------------\n§LВогонь Каталонії ніколи не згасав. Такі люди, як Жоан Корнуделья-і-Барбера, син республіканця-цегляра, інженер-механік і борець, подбали про це. Довоєнний агітатор і член Estat Català, він таємно повернувся 1941 року, щоб підтримувати полум'я. Рушійною силою якого була смерть його братів, він повернувся як президент заснованого ним Національного фронту Каталонії (FNC), витіснивши Estat Català на підпорядковане місце всередині цієї великої бойової коаліції. Незалежний від паралізованого Женералітату у вигнанні, FNC очолив національну боротьбу. Ніщо не могло її зупинити.\n\nПопри всю «легітимність» повернутого Женералітату, призначення Барбери віцепрезидентом було доконаним фактом. Колись відкинутий від великої політики, його безпосередня участь у національній боротьбі принесла йому керівну посаду в уряді Тарраделяса. Там він утримує рівновагу каталонської політики, представляючи просепаратистську соціялістичну опозицію поміркованим автономістам, які підтримують Тарраделяса, та виступаючи опорою проти радикалів НКП, яких разом із Фалангою він підозрює у вбивстві своїх братів. Обидва противники — ніщо, дурні, чиї далекі ідеї чужі нації. Ніщо не зіб'є з курсу важко виборену каталонську державу чи соціялізм із людською гідністю. Ніщо.§!"

 CTL_Josep_Carner:0 "Жозеп Карнер-і-Рібальта"
 CTL_Josep_Carner_for_desc:0 "§YРадник із закордонних справ\nЛібералізм§!\n--------------\n§LНавчавшись у ліберальних та єзуїтських Escoles Pia і чинячи опір анархістському антиклерикалізму, «небезпечний сепаратист» Жозеп Карнер-і-Рібальта втік після першої громадянської війни — не до Франції, а до Нью-Йорка. Чи то публікуючи матеріали в Мексиці, чи керуючи бюлетенем «Вільна Каталонія» разом із Сепаратистським клубом, чи навіть очолюючи схвалену урядом США антифашистську радіопрограму воєнного часу, він працював над поширенням каталонського послання аж до Чилі. Кульмінацією стало представлення ним «Справи Каталонії» ОВН із проханням про військове втручання на підтримку Великої Каталонії, яка мала охопити Балеарські острови, Валенсію та Руссільйон.\n\nТепер, із новою енергією, заклик про підтримку лунає вже з самої батьківщини. Через радіоприймач новий радник із закордонних справ звертається до ліберальної Америки. Заклик Рібальти та помірна допомога, яку він отримує, спрямовані на створення незалежної розширеної Каталонії, незалежно від уряду Іспанії. Багато хто висміює це як неможливе. І все ж ось вона, Каталонія, після століть боротьби. Справедливости не можна очікувати від гнобителя, від іспанського унітаризму, одним із облич якого є нацифашизм. Проти цих звірів цей, за його власним визнанням, скромний і наївний патріот бачить лише велику націю з шести мільйонів каталонців як справжній захист.§!"

 CTL_Joan_Folchi:0 "Жоан Жозеп Фолькі"
 CTL_Joan_Folchi_eco_desc:0 "§YРадник з економічних питань\nКонсерватизм§!\n--------------\n"

 CTL_Ramon_Perera:0 "Рамон Перера Коморера"
 CTL_Ramon_Perera_eco_desc:0 "§YРадник з економічних питань\nСоціялізм§!\n--------------\n§LРамон Перера Коморера: людина, яка врятувала Барселону. Будучи інженером-механіком і членом Об'єднаної соціялістичної партії Каталонії, він був призначений секретарем оборонних споруд Каталонії. За рекордний час Барселона стала містом тисячі укриттів. Життя були врятовані, але війну програли. Лондон привітав інженера, але відкинув його проєкти. Після того як цей новий дім перетворився на розбомблену труну для десятків тисяч людей, ОВН вирішила не повторювати тієї самої помилки. Зі свого нового дому в Мексиці каталонець працював з альянсом над проєктами укриттів, приєднався до Соціялістичного руху Каталонії та продовжив кар'єру інженера-будівельника.\n\nВін вважав, що вони ніколи не повернуться, тому звістка про незалежність стала гірко-солодким сюрпризом. Тепер він повертається до своєї старої роботи з непохитною рішучістю; завдяки укриттям і найсучаснішій логістиці та інфраструктурі на передовій народ буде в безпеці. Ця робота заспокоює старі нерви президента Жозепа Тарраделяса. Хто може сумніватися, що соціялісти мають представництво, якщо соціяліст є міністром? Навіть якщо це людина, яку ніщо, крім її простої, чесної роботи, не турбує. Перера більше не безславний герой. І все ж він зі страхом дивиться в небо. Невпевнений, затиснутий між автономістами та сепаратистами й обтяжений пам'яттю про війну, він просить лише про мир, а не про забуття.§!"

 CTL_Joan_Roca:0 "Жоан Рока-і-Кабаль"
 CTL_Joan_Roca_sec_desc:0 "§YРадник з оборони\nХристиянська демократія§!\n--------------\n§LКоли постав перед вибором, Жоан Рока-і-Кабаль обрав каталонізм замість цілого життя карлізму. 1931 року він переманив молодих карлістів, щоб разом заснувати націоналістичний Демократичний союз Каталонії — християнсько-демократичну партію, що виступала за автономію. Чи то на виборах 1933 року, чи тікаючи від войовничого республіканського секуляризму 1936-го, чи виступаючи за перемир'я під час першої громадянської війни, Жоан Рока не зміг зайняти примирливу позицію «Третьої Іспанії» між націоналістичними та республіканськими крайнощами. Зазнавши поразки, вони насилу повернулися додому 1942 року. Реорганізувавши УДК для підпільної діяльности, він уникнув найгірших репресій завдяки культурному характеру та католицькому прикриттю їхнього опору.\n\nАле тепер Жоану набридла пасивність. Радник відіграв ключову роль у відродженні альянсу Ґалеуска Галісії, Еускаді та Каталонії, а армії бракує лише ресурсів, яких не існує. Однак, попри взаємну повагу, Рада оборони є його сферою, і він ревно оберігає її повноваження. Причина перегукується з рішенням президента Тарраделяса призначити його — повністю цивільний кабінет народжується з болісних спогадів про військові репресії. Представляючи націоналістичних правих в уряді, він відштовхуватиме Каталонію від репресій і наближатиме її до автономії в межах Іберійської республіки. Примирення все ще можливе. Воно мусить бути.§!"

