 ### Leader Bios ###
 POLITICS_CHRISTIAN_MAZIERE_DESC:0 "У самому центрі того, що колись було Францією, дивізія «Шарлемань» намагається відновити свій контроль — але немає жодних сумнівів щодо того, кого вони підтримають, щойно знову стануть на ноги.\n\nКрістіан де ла Мазьєр — дивний птах, один із небагатьох людей у Бургундії, які присягають Рейхсфюреру радше через особисту відданість, ніж через віру чи обов'язок. Колись солдат французької армії, Мазьєр останні два десятиліття піднімався кар'єрними сходами дивізії «Шарлемань», головної французької колабораціоністської дивізії у Ваффен-СС. Саме тут він уперше зустрів Генріха Гіммлера, і в міру його просування нагору сформувалася відданість людині, яку більшість вважала щонайменше тривожною, а коли було засновано Орденсштаат, він став командиром дивізії. Протягом багатьох років він пліч-о-пліч працював над втіленням спартаністського ідеалу, навіть коли зростало занепокоєння через огиду Гіммлера до французької культури, яку Мазьєр любив.\n\nПерш ніж він зміг по-справжньому обміркувати ці побоювання, все змінилося. Фюрер помер, зрештою його замінив Гейдріх — найкращий із можливих сценаріїв, як це сприйняв Мазьєр, і він так само це й відсвяткував. На коротку мить здавалося, що зрештою все налагодиться — аж поки новий Фюрер раптом не відкинув те, у що вірили СС, звинувативши Гіммлера в безглуздих мареннях про апокаліпсис, і все знову змінилося — не на краще.\n\n«Шарлемань» була захоплена зненацька цим раптовим поворотом, і це видно. Мазьєр спостерігає, як його люди метушаться, намагаючись відновити контроль над містами, на які вони не звертали уваги цілий рік. Хоча початкова ситуація здається жахливою, він не боїться — він знає, що зрештою переможе правильна сторона, а спартаністська мрія знову стане на правильний шлях. Не маючи жодних сумнівів щодо того, де лежить його вірність, питання лише в тому, коли, а не чи приєднаються його сили до сил Гіммлера й вирушать на війну."

 POLITICS_CHRISTIAN_MAZIERE_COLLAPSE_DESC:0 "Штандартенфюрер де ла Мазьєр давно чекав цього дня — дня, коли зрадливий шахрай, який називає себе Рейхсфюрером, покаже свою слабкість. Призначенням дивізії «Шарлемань» було знищити юдео-большевизм, а не служити одурілому, занепалому старому містикові в знищенні власного народу. Те, що від нього взагалі очікували такого, було не чим іншим, як образою для цвіту французького війська, який сотнями гинув на Східному фронті.\n\nМожливо, у Райху все ще є хороші люди — німці, які хотіли б мати товаришів, а не підданих, — але цього не можна сказати про Орденсштаат. Крістіан де ла Мазьєр забере те, що належить леґіону, і навіть більше; спочатку в СС, а потім у ворогів Франції. Якщо сама Німеччина опиниться серед них — нехай буде так. Поки він житиме, щоб побачити Генріха Гіммлера, який висітиме в петлі під Тріумфальною аркою, він буде задоволений своєю долею. Виживання з обіцянкою здобичі та очищеної Франції — лише приємний бонус."

 ## Ideas ##
 PIC_in_name_only:0 "Лише в назві"
 PIC_in_name_only_desc:0 "Люди Мазьєра носять ім'я Шарлеман, але більшість французів сприймає їх лише як німецьких підлабузників. Він може вважати себе засновником нової Франції, але Мазьєру ще далеко до того, щоб його співвітчизники бодай замислилися про виявлення поваги."

 PIC_robber_barony:0 "Розбійницьке баронство"
 PIC_robber_barony_desc:0 "Лідери «Шарлеман» — заможні люди, але не завдяки діловій хватці чи чесно заробленим винагородам. Їхні багатства майже повсюдно викрадені в інших. Хоча колись вони обмежувалися експропрійованою єврейською власністю, офіцери не гребують і менш патріотичними підприємствами..."
 