#Infobox stuff

SGR_igfarben_leader:0 "Герман Йозеф Абс\n§LІҐ ФАБЕН§!"
SGR_igfarben_expository_text:0 "Від бірж у Мілані та банків у Бордо до інститутів в Осло та рабських таборів у Москві простягається економічна імперія, непорівнянна ні з чим іншим. §WHermann Josef Abs§! сидить на її троні, контролюючи її з тіней і на світлі, під одним ясним завданням - владою. Його влада, і нічиєї більше.\n\n§LІҐ ФАБЕН§! є найбільшим активом імперії, яка охоплює §LDeutsche Bank та багато десятків інших компаній§!. Абс не є членом НСДАП; фактично, він завжди дистанціювався від Гітлера та його кліки. Незважаючи на це, він був великим архітектором воєнної економіки та сформував свою імперію зі здобутків Першої світової війни, навіть indulging у фінансуванні рабства до того, як зробив §LІҐ Фабен§! найбільшою корпорацією, що володіла рабами в Німеччині.\n\nЙого одержимість владою та небажання співпрацювати не можна більше ігнорувати. Абс та його імперія повинні бути знищені."

SGR_reichswerke_leader:0 "Едмунд Гайленберг\n§jРАЙХСВЕКЕ§!"
SGR_reichswerke_expository_text:0 "§WЕдмунд Гайленберг§! керує чудовиськом на ім'я §jReichswerke§!, однією з найбільших індустріальних конгломератів на Землі. Його призначення на посаду нового Wehrwirtschaftsführer було легким рішенням - зв'язок Гайленберга з конгломератом простягався ще до початку Другої світової війни.\n\n§jReichswerke§!'s reach across Europe базується на численних індустріях, які він поглинав із територій, анексованих Третім Райхом під час його злету. Незважаючи на те, що від ІҐ Фабен, він залишився однією з найбільших картелей та рабовласників у Німеччині.\n\nПроте боротьба проти конгломерату ще не втрачена. Оскільки він офіційно є державним, прямі дії проти Гайленберга значно легше обґрунтувати перед ідеологами та індустріалістами НСДАП. Гайленберг впаде, і Німеччина нарешті зможе піти від цієї варварської практики."

SGR_daimler_leader:0 "Фрідріх Флік\n§gДАЙМЛЕР-БЕНЦ§!"
SGR_daimler_expository_text:0 "§gVereinigte Stahlwerke§! була лише першим етапом у довічній кар'єрі у жорстокій індустрії та лобіюванні §WFriedrich Flick§!. Політично активний з часів Веймарської республіки, він став щедрим спонсором НСДАП, аж до того, що приєднався до §PКоло друзів Генріха Гіммлера§! та надав сотні тисяч на фонди для СС.\n\n§gDaimler-Benz§!, його володіння, може бути менш розширеним, ніж у його колег Wehrwirtschaftsführer, але Флік його здібності на ринкових справах та різних економіках залишають його сильним конкурентом попри все. Відомий як системний користувач і зловживач рабства, Флік витратив вже тисячі рабів у своєму прагненні до максимізації прибутків, не показуючи жодної краплини каяття за свої дії.\n\nФлік є найкращим прикладом безжального індустріаліста, який скористався підйомом НСДАП до влади та всіма жахами, що це принесло. Його слід видалити."

SGR_siemens_leader:0 "Ернст фон Сіменс\n§BСІМЕНС§!"
SGR_siemens_expository_text:0 "§WErnst von Siemens§! виділяється як дещо аномалія серед своїх колег. Під його керівництвом, §BSiemens§! збільшило свої прибутки у десять разів, уникнувши досягнення рівнів рабства, які демонструють інші компанії. Його компанія виділяється як одна з небагатьох у Німеччині, що зберігає поважну міжнародну репутацію.\n\nЩо найважливіше, паросток імперії електроніки та машинобудування, яку він очолює, виявляє симпатію до реформістської справи; принаймні, коли справа стосується програм, від яких §BSiemens§! виграє. Незалежно від того, чи це з реальної переконаності, чи лише прагматизму перед неминучим падінням рабства у новій Німеччині, фон Сіменс і його родинне підприємство мають значний потенціал як економічно, так і в боротьбі проти рабства.\n\nНезважаючи на те, що він малоймовірний союзник, природа §BSiemens§! як картеля заважає економічному потенціалу Німеччини. Хоча компанія та її власник можуть залишитися, їхня влада повинна зменшитися."


