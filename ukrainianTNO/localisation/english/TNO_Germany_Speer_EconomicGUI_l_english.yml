SGR_zollverein_germany:0 "Лідер Цолльферайну"
SGR_zollverein_germany_desc:0 "Модифікатор використання товарів широкого вжитку: [?SGR_consumer_goods|1Y%][getZollvereinIdeaBlock]\n--------------\n§!Цолльферайн - це спільний ринок і митний союз між його членами. Він замінює застарілу та неефективну концепцію Großraum Kontinentaleuropa, пропонуючи Німеччині залишатися гегемоном Європи - тепер, можливо, менш кривавим способом."
GER_SGR_ZV_member_dynamic_modifier:0 "Цолльферайн"
SGR_zollverein_basic:0 "Член Цолльферайну"
SGR_zollverein_basic_desc:0 "§DФактор приросту політичної влади: [?THIS.ZV_pp_gain|0+%]\nМодифікатор використання товарів широкого вжитку: [?THIS.ZV_consumer_goods|1Y%]\nФактор приросту ефективності виробництва: [?THIS.ZV_production_gain|1+%][getZollvereinMembersIdeaBlock]\n--------------\n§!Цолльферайн - це спільний ринок і митний союз між його членами. Він замінює застарілу та неефективну концепцію Großraum Kontinentaleuropa, пропонуючи Німеччині залишатися гегемоном Європи - тепер, можливо, менш кривавим способом."

SGR_zollverein_reich:0 "Німецький Цолльферайн"
SGR_zollverein_reich_desc:0 "Німецькоцентрична бюрократія Цолльферайну здебільшого збереглася, а в деяких аспектах навіть посилилася. Тому між німецькою економікою та економіками Східної Європи залишається мало відмінностей. Як і раніше."

SGR_zollverein_common:0 "Європейський Цолльферайн"
SGR_zollverein_common_desc:0 "Німецькоцентрична бюрократія Цолльферайну була значно послаблена. Економічний директивізм нацистів поступився місцем співпраці, очолюваній реформістською фракцією та східними економіками, що сприяло розвитку місцевої торгівлі."

SGR_siemenswelt:0 "Світ Сіменса"
SGR_siemenswelt_desc:0 "Сіменс - провідна технологічна компанія Німеччини та одна з небагатьох із значним міжнародним впливом. Її присутність на нашому боці - це перевага для наших досліджень і розробок."

SGR_reichswerke_mass_privatisation:0 "Приватизація Reichswerke"
SGR_reichswerke_mass_privatisation_desc:0 "Reichswerke перебуває в процесі масштабної приватизації, від якої найбільше виграють середні корпорації."

SGR_reichswerke_limited_privatisation:0 "Обмежена приватизація Reichswerke"
SGR_reichswerke_limited_privatisation_desc:0 "Reichswerke частково приватизується. Тим не менш, Райх збереже контроль над найважливішими аспектами компанії, а саме виробництвом зброї."

SGR_daimler_slashed:0 "Розпродаж активів Daimler-Benz"
SGR_daimler_slashed_desc:0 "Активи Daimler-Benz конфіскуються оптом і продаються нашим зростаючим середнім класом корпорацій за низькими цінами."

SGR_made_in_germany_reformist_tt:0 "Імпортні торгові платежі: §G+15%§!"
SGR_made_in_germany_conservative_tt:0 "Імпортні торгові платежі: §G+10%§!"
SGR_zollverein_common_tt:0 "Зростання ВВП Цолльферайну: §G+20%§!"
SGR_zollverein_reich_tt:0 "Зростання ВВП Цолльферайну: §G+10%§!"
SGR_zollverein_basic_tt:0 "Приріст ВВП: §G+1.5%§!\nПлатежі до бюджету Цолльферайну: §R10%§! річного доходу"

SGR_made_in_germany_reformist:0 "Зроблено в Німеччині"
SGR_made_in_germany_reformist_desc:0 "За тяжку працю та мільйони витрачених грошей Німеччина нарешті має фундамент для побудови економіки. Наша поточна політика все ще далекий від того, який економічний потенціал насправді має Райх - але це початок. Другий шанс, який Німеччина так потребувала. Проте, з відновленням нашої репутації, гроші, які іноземці готові платити за наші товари, будуть поступово зростати."

SGR_made_in_germany_conservative:0 "Зроблено в Німеччині"
SGR_made_in_germany_conservative_desc:0 "За тяжку працю та мільйони витрачених грошей Німеччина нарешті має фундамент для побудови економіки. Наша поточна політика все ще далекий від того, який економічний потенціал насправді має Райх - але це початок. Другий шанс, який Німеччина так потребувала. Проте, з відновленням нашої репутації, гроші, які іноземці готові платити за наші товари, будуть поступово зростати."

