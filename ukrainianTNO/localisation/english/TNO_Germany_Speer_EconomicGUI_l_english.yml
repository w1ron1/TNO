SGR_econ_overview:0 "Цолльферайн офіційно є спільним ринком між більшістю націй і територій, що входять до §gАйнхайтспакт§!. Дефакто, це економічна сфера §gНімеччини§!, оскільки практично вся східноєвропейська промисловість належить німцям, через те, що східні райхскомісаріати були нічим іншим як колоніальними адміністраціями Німеччини до недавнього часу. §RGeneralplan Ost§! та інші дурні плани зруйнували економіку сходу; однак, потенціал у ресурсах і робочій силі залишається. З скасуванням рабства і величезними інвестиціями на сході, §QЦолльферайн§! може стати однією з найбільших економічних блоків у світі.\n\nДля §gНімеччини§! мати майбутнє, вона повинна."

#Zollverein Decision Category things

SGR_Zollverein_members_investment_category:0 "Цолльферайні"
SGR_Zollverein_members_investment_category_desc:0 "\n\n\n\n\n\n§QTOTAL BUDGET: [?GER.ZollvereinBudget|+3]§GB USD§!§!\n\n§YALLOTMENT:§! [?THIS.MemberZVBudget|+3]§GB USD§!\n\n§OAVAILABLE BUDGET:§! [?THIS.MemberSpentBudget|W3]§WB USD§! / [?THIS.MemberZVBudget|+3]§GB USD§!\n\nЦолльферайн – це новий грандіозний проект економічного співробітництва між багатьма націями Європи. Ініційований §gНімеччиною§! §GGang of Four§!, він прагне об'єднати континент під єдиним, спільним ринком, забезпечуючи економічне співробітництво та взаємну стабільність у процесі."

zv_quarterly_budget_tt:0 "§QTotal Budget§! і §YAllotment§! будуть оновлені."

# Oil Crisis #

SGR_ZV_debt_reduction:0 "Виплата боргу"
SGR_ZV_debt_reduction_desc:0 "Хоча це не найелегантніше рішення для нашої зростаючої проблеми з боргом, бюджет Цолльферайн все одно може стати джерелом грошей для виплати державного боргу."
SGR_ZV_debt_reduction_cost:0 "§Y150M§! £GFX_dollar_sign"
SGR_ZV_debt_reduction_cost_blocked:0 "§R150M§! £GFX_dollar_sign"
SGR_ZV_debt_reduction_tt:0 "§W§RБорги§! і §Rпроцентні ставки§! знизяться на §Y200M USD§! і §Y1.5%§! відповідно."

SGR_ZV_oil_exploration:0 "Інвестуйте в альтернативну енергетику"
SGR_ZV_oil_exploration_desc:0 "Нафта стала кров'ю сучасної цивілізації, і саме ця криза показала нам, наскільки цінною є ця кров. Час інвестувати в альтернативні джерела енергії."

SGR_ZV_introduce_rationing:0 "Ввести нормування"
SGR_ZV_introduce_rationing_desc:0 "Легке, хоча й болісне для суспільства, нормування нафти і газу є найбільш розумним заходом проти нафтової кризи. Вводячи ці обмеження, ми економимо цінний час і гроші, навіть якщо нашим громадянам це не подобається."

SGR_ZV_fight_systematic_issues:0 "§YБоротьба з системними проблемами§!"
SGR_ZV_fight_systematic_issues_desc:0 "Незалежно від геополітичних подій, які запустили нафтову кризу, сама можливість, що це прийшло до такої ситуації у нашій країні, показує необхідність економічних реформ. Відкати завжди точні."

# Projects

SGR_RSFSTP_Extend_Railway:0 "Розширити програму швидкісних залізничних трас Reichsschnellfahrstreckenprogramm"
SGR_RSFSTP_Extend_Railway_desc:0 "Програма райхшвидкісних залізничних ліній (Reichsschnellfahrstreckenprogramm) досягла такого прогресу, що ми можемо зменшити витрати та підвищити ефективність будівництва залізничних ліній. Тепер, коли існує пряма лінія високошвидкісної залізниці з Праги до Ґерманії, перед нами відкрилася нова можливість. Краків, місто з гідною існуючою залізничною інфраструктурою та великими можливостями для розширення, тепер постає як досяжна мета для розширення. Якщо ми продовжимо лінію, це значно посилить зв’язок Польщі з Райхом."
SGR_RSFSTP_Krakau_Trigger:0 "§WЗавершено §Gбудівництво§! §Yлінії Прага-Ґерманія§!. Не §Rзавершено§! §!§gReichsschnellfahrstreckenprogramm§!."

# Standards #

SGR_ZV_open_investments:0 "§YПоказати загальні інвестиційні рішення§!"
SGR_ZV_open_investments_desc:0 "Натисніть, щоб показати доступні загальні інвестиційні рішення."

SGR_ZV_close_investments:0 "§YПриховати загальні інвестиційні рішення§!"
SGR_ZV_close_investments_desc:0 "Натисніть, щоб приховати доступні загальні інвестиційні рішення."

SGR_ZV_open_special_investments:0 "§BПоказати рішення спеціальних проєктів§!"
SGR_ZV_open_special_investments_desc:0 "Натисніть, щоб показати доступні рішення спеціальних проєктів."

SGR_ZV_close_special_investments:0 "§BПриховати рішення спеціальних проєктів§!"
SGR_ZV_close_special_investments_desc:0 "Натисніть, щоб приховати доступні рішення спеціальних проєктів."

SGR_ZV_civilian_investment:0 "Інвестиції в цивільну сферу"
SGR_ZV_civilian_investment_desc:0 "Використовуючи бюджет нового економічного союзу Європи - Цолльферайні, ми перенаправимо частину надлишкових коштів у власну промисловість, зосереджуючи увагу на відновленні цивільних товарів і забезпеченні економіки, здатної задовольняти населення."
SGR_ZV_civilian_investment_cost:0 "§Y150M§! £GFX_dollar_sign"
SGR_ZV_civilian_investment_cost_blocked:0 "§R150M§! £GFX_dollar_sign"

SGR_ZV_military_investment:0 "Інвестиції у військову сферу"
SGR_ZV_military_investment_desc:0 "Навіть під захистом багатьох держав Цолльферайні, ми все ще потребуємо боєздатної армії. З огляду на це, подальші інвестиції у збільшення нашого військового потенціалу виявляться корисним побічним ефектом Цолльферайні."

SGR_ZV_infrastructure_investment:0 "Інвестиції в інфраструктуру"
SGR_ZV_infrastructure_investment_desc:0 "Серце будь-якої нації б’ється так сильно, як міцні її залізничні лінії та бетон її доріг. Завдяки новій інвестиційній програмі, ініційованій Цолльферайні, ми забезпечимо зміцнення інфраструктури нашої країни."
SGR_ZV_infrastructure_investment_cost:0 "§Y100M§! £GFX_dollar_sign"
SGR_ZV_infrastructure_investment_cost_blocked:0 "§R100M§! £GFX_dollar_sign"

SGR_ZV_synthoil_investment:0 "Інвестиції в синтетичну нафту"
SGR_ZV_synthoil_investment_desc:0 "Ми не можемо повністю покладатися на світ за межами Європи - тому доцільно інвестувати у розширення запасів синтетичної нафти за рахунок коштів Цолльферайні та подальше вдосконалення процесу. Хоча автократія є складною метою, це полегшить можливі майбутні проблеми з нафтою."
SGR_ZV_synthoil_investment_desc_cost:0 "§Y250M§! £GFX_dollar_sign"
SGR_ZV_synthoil_investment_desc_cost_blocked:0 "§R250M§! £GFX_dollar_sign"

SGR_ZV_education_investment:0 "Інвестиції в освіту"
SGR_ZV_education_investment_desc:0 "Якщо щось і є важливим для основи нації, то це рівень грамотності та інтелект її народу. Незважаючи на важливість зосередження на освіті, Цолльферайні полегшив цей процес, сприяючи відновленню шкіл і перегляду національної навчальної програми, серед інших освітніх реформ."
SGR_ZV_education_investment_cost:0 "§Y50M§! £GFX_dollar_sign"
SGR_ZV_education_investment_cost_blocked:0 "§R50M§! £GFX_dollar_sign"

SGR_ZV_poverty_investment:0 "Ініціативи зі зменшення бідності"
SGR_ZV_poverty_investment_desc:0 "Люди, які ледве зводять кінці з кінцями, або ті, хто просто опинився на вулиці й просить дріб’язок, щоб вижити - це найбільш вразливі верстви, але й ті, які найпростіше повернути до суспільства. Завдяки підтримці Цолльферайні ми докладемо значних зусиль, щоб очистити вулиці й забезпечити більше людей можливістю частіше вмикати світло у своїх домівках."

SGR_ZV_workers_investment:0 "Ініціативи для ремісництва"
SGR_ZV_workers_investment_desc:0 "Наша промисловість має бути універсальною, і немає кращого способу закласти основи такої промисловості, ніж звернути увагу на молодь країни. Цолльферайні є корисним інструментом у цьому - перенаправляючи частину коштів, ми можемо створити програми, які заохочуватимуть нові яскраві уми до малоосвоєних сфер, тим самим урізноманітнюючи й зміцнюючи нашу економіку."

SGR_Zollverein_Quarterly_Update:0 "Квартальне оновлення бюджету"
SGR_Zollverein_Quarterly_Update_desc:0 "Бюджет і розподіл коштів Цолльферайні між країнами оновлюється щоквартально, що дозволяє робити нові інвестиції."


