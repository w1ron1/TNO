SGR_tasks_unavailable_tt:0 "§YБоротьба з Wehrwirtschaftsführer можлива лише після того, як Шпеєр зміцнить своє правління.§!"

SGR_task_invest:0 "§YІнвестиції в середній клас§!"
SGR_task_invest_tt:0 "§GІнвестиції§! в зародковий місцевий середній клас послаблять контроль §YWehrwirtschaftsführer§! над ним. Чим менше §Rрабів§! у регіоні, тим ефективнішою стає ця дія.\n\n§WПЕРЕРВА ДВА ТИЖНІ§!"

SGR_task_weaken:0 "§YВилучення корпоративних активів§!"
SGR_task_weaken_tt:0 "§RВилучення корпоративних активів§! у §YWehrwirtschaftsführer§! за допомогою вермахту є ефективним, хоча й жорстоким, способом зменшити їхній вплив.\n\n§WПЕРЕРВА ОДИН МІСЯЦЬ§!"

SGR_task_antitrust:0 "§YАнтитрестовий директив§!"
SGR_task_antitrust_tt:0 "Щойно §Yвлада Wehrwirtschaftsführer§!£GFX_megacorp! у регіоні досягне §Y0%§!, §Gуряд§! зможе видати директиву, щоб усунути їх із економічного контролю над регіоном.\nУсунення §YWehrwirtschaftsführer§! із контролю над цим регіоном надає наступний бонус:\n\n[getSGRStatesBonusTooltip]"
