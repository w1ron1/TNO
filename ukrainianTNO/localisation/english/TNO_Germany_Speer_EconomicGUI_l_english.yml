#Frontscreen Tolltips

SGR_GDP_entry_1_tt:0 "§QВВП Цолльферайну§! відповідає його економічному багатству та наразі становить §Y$§![?reich_GDP|2|Y]§YB§!, частка §gНімеччини§! складає §Y$§![?displayGermanyGDP|2|Y]§YB§!. Середній темп зростання становить [?zollvereinGDP_growth|%Y2].\n\nУ міжнародних переговорах високий §QВВП Цолльферайну§! зробить §gРайх§! більш привабливим для інвесторів і бізнес-партнерів. Зростання ВВП безпосередньо залежить від збільшення частки §GКваліфікованої робочої сили§!, яка наразі становить [?displayCivPercentage|%G2], та від скорочення і врешті-решт ліквідації §Rрабства§!."
SGR_slave_entry_1_tt:0 "§RРабство§! - це §gРайху§! рак, і воно охоплює [?Reich_SlavesNum_m|3|R] §Rмільйонів§! поневолених людей.\n\nЦя ганебна система, спочатку запроваджена для перемоги у Другій світовій війні та реалізації божевільних мрій еліти, зрештою була узурпована §HWehrwirtschaftsführer§! для наповнення їхніх власних кишень. Від міжнародних відносин до економіки, ліквідація §Rрабства§! може принести користь лише §gНімеччині§! та §QЦолльферайну§! загалом."
SGR_workforce_entry_1_tt:0 "§GКваліфікована робоча сила§! - це цивільна робоча сила кваліфікованих працівників у §gНімеччині§!, яка наразі становить [?displayCurrentWorkforce|4|G] §Gмільйонів§!, або [?displayCivPercentage|%G] від теоретично доступної робочої сили, яка становить [?displayTheoreticalWorkforce|4|G] §Gмільйонів§!.\n\n§GКваліфікована робоча сила§! збільшується за рахунок підтримки ініціатив для ремісників у §gРайху§! та скорочення кількості §Rрабської праці§! у §QЦолльферайні§!."


#Decision category stuff

SGR_Konjunkturpaket:0 "Запровадити §WKonjunkturpaket§!"
SGR_Konjunkturpaket_desc:0 "Німецький народ став надто залежним від рабської праці, через що не зміг створити надійну самодостатню економіку. Для забезпечення виживання Райху необхідно розробити плани для створення сталого економічного середовища в Європі. Раби більше не будуть розглядатися як необхідність, а як застаріла практика, яка поступово буде замінена працею сумлінних німців в індустріальному секторі."

SGR_Poland_investment:0 "Інвестиції в Польщу"
SGR_Poland_investment_desc:0 "Економіка та інфраструктура Польщі потребують значних інвестицій. Помилковий і короткозорий Генеральний план Ост, а також масове поневолення польського народу перетворили Польщу на відсталу територію. Якщо ми хочемо принести нову еру миру та стабільності на сході, ми повинні спершу зосередитися на покращенні й розвитку інфраструктури для стимулювання фінансового зростання в цьому регіоні."

SGR_Ukraine_investment:0 "Інвестиції в Україну"
SGR_Ukraine_investment_desc:0 "Німецьке недбале управління та рабство серйозно підірвали економічну та політичну стабільність України та прилеглих територій. Багато галузей української промисловості застарілі й базуються на трудових таборах, що є нежиттєздатною економічною практикою. Це необхідно виправити, якщо ми хочемо забезпечити процвітання України в майбутньому."

SGR_Ostland_investment:0 "Інвестиції в Остланд"
SGR_Ostland_investment_desc:0 "Хоча останні десятиліття стали свідками значного успіху в ґерманізації Остланду, значна частина промисловості регіону або не працює, або є застарілою. Зокрема, Білорусь перебуває в стані занепаду, а попередня адміністрація Остланду не змогла розвинути жодних засобів залучення іноземних інвестицій чи економічних можливостей у регіоні. Ми повинні виправити помилки наших предків, якщо хочемо відновити економічний вплив Німеччини в Європі."

SGR_Kaukasien_investment:0 "Інвестиції в Кавказ"
SGR_Kaukasien_investment_desc:0 "Багаті природні ресурси та дешева робоча сила в регіоні Кавказу створили нездорові відносини між Кавказом і Німеччиною. Робочі умови в РК Кавказу відомі своєю жахливістю, оскільки німецькі управителі експлуатують дешеву й недосвідчену робочу силу. Ми повинні вирішити ці жахливі умови праці на Кавказі, якщо хочемо сприяти економічному зростанню."

SGR_Volga_investment:0 "Інвестиції в Москвію"
SGR_Volga_investment_desc:0 "Хоча багато хто може вважати наших східних підданих бунтівними й беззаконними, співпраця між німцями й місцевими росіянами в регіоні часто відбувалася. Якщо ми хочемо створити будь-які ознаки довгострокового економічного процвітання, ми повинні розвивати ці відносини для блага Райху."

