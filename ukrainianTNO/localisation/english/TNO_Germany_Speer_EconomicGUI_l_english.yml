SGR_RSFSTP_title:0 "§gПРОГРАМА РАЙХШВИДКІСНИХ ЗАЛІЗНИЧНИХ ЛІНІЙ§!"
SGR_RSFSTP_title_tt:0 "Після інфраструктурного §Rколапсу§! §gНімеччини§! під час §xНімецької громадянської війни§!, поряд із загальним §Rзанепадом§!, уряд ініціював проєкт для початку будівництва §Bшвидкісної залізниці§! вздовж §gАйнхайтспакту§!.\n\nОчікується, що це принесе §Gвеликі§! економічні вигоди, §Yз'єднуючи§! великі міста та §Gрізко§! скорочуючи час у дорозі для кваліфікованих робітників.\n\nЦе також надасть §Gпереваги§! для перевезення цивільних осіб, репатрійованих рабів та товарів. Проєкт §Rвитратний за часом та коштами§!, але заради блага §gНімеччини§!, жодні витрати не є завеликими."
