 #Focus Trees
 ##Iberian War
 PPR_a_guerra_iberica:0 "A Guerra Ibérica"
 PPR_a_guerra_iberica_tt:0 "§VUnir, organizar, armar. A revoluçao triunfará§!"
 PPR_a_guerra_iberica_desc:0 "Iberia is in flames.\n\nThough as red as the blazes burn, are as red as our banners fly, and why do they fly? They flutter in the winds of revolution that were casted by exploited workers deprived of their dues! The monarchists desire another dysfunctional society dominated by a parasitic aristocracy, and the republicans are fighting to create what is merely a rebranded bourgeois dictatorship!\n\nHowever, the rise of a socialist Portugal begins to dawn on the horizon. The reactionary hordes which surround us and threaten Portugal's revolutionary future are fighting against the indomitable will of the class-conscious worker, and though our initial seizure of power was unsuccessful, we seek nothing less than total control of Portugal.\n\nOnly then, can the great Lusitanian spirit flourish once more."

PPR_o_exercito:0 "O Exército"
PPR_o_exercito_desc:0 "Just like the socialist revolutions of the past, the heralds of change were always the revolutionary soldiers. While our loyal comrades have taken up arms across the nation to come fight under our red and green banner, much of Portugal remains unilluminated by the brightness in the dark.\n\nGathering the revolutionaries across Portugal has been a difficult task for us thus far. Many of our dear comrades find themselves deep behind the lines of the enemies, beyond the range of communication with our command. However, tapping in to these wells of manpower and revolutionary fervour will prove to be the most invaluable asset of ours towards winning the war and spreading the revolution to all of Portugal."

PPR_reorganize_the_popular_army:0 "Reorganize the Popular Army"
PPR_reorganize_the_popular_army_desc:0 "While the existing militias may have suited us well enough in the initial stage of the revolution, the existing organisation of our fighting force hardly intimidate the enemy. Our warriors clutch outdated weapons, the logistics of our arisen guerrillas induce headaches to our officers, and it appears some workers will fail to identify which end of the rifle the bullet comes out of.\n\nWhether we choose to uphold the militia structure or not, many changes will have to manifest themselves before we can militarily contend for control of Portugal. This begins with a reorganisation of the militias and a revisit to our doctrine of combat. Each fighter must firmly grasp what is at stake here, and tenaciously awaken themselves ideologically."

PPR_favor_the_suv:0 "Favor the SUV"
PPR_favor_the_suv_desc:0 "Our soldiers are many and our cause is just - however, our motivations are poorly understood even by the soldiers who fight in our ranks. How many of them can really define 'class struggle' or 'collective ownership' of the means of production?\n\nThankfully, the Soldados Unidos Vencerão, an organisation of soldiers seeking to politically organise soldiers and low-ranking officers, has approached our cause. Many of our soldiers themselves have expressed explicit interest in this organisation, and their goals do not contradict our final objects anyway. Mobilising and integrating this group into our efforts would provide us with a well-organised and politically motivated army which we need desperately in these trying times."

PPR_a_professional_army:0 "A Professional Army"
PPR_a_professional_army_desc:0 "What distinguishes our soldiers from our enemies'? We eat the same rations, fight with the same obsolete detritus-clogged rifles, and cower under the same starry sky with the occasional explosion over the horizon, the naive one may answer. But this simply is not the whole truth! Our soldiers are tenacious, ideologically motivated, and steadfast in their belief in the promulgation of socialism across the entirety of Portugal.\n\nAt least, that's what it says on paper. The harsh reality is that many of our soldiers lack the political motivation and proper organisation worthy of a truly disciplined and hardened army.\n\nThat being said, though, we have obtained the support of the SUV, and the support of the vanguard of the SUV will provide the necessary expertise to ensure the ranks maintain the structure of a real army, while promoting the ideas of socialism and communism among our men."

PPR_lean_on_the_ara:0 "Lean on the ARA"
PPR_lean_on_the_ara_desc:0 "A building without a steel frame or a man without a skeleton falls apart and collapses due to its lack of structural support. Similarly, the current state of the army can only really be compared to a pile of flesh without the skeleton of a properly politically-motivated vanguard it requires to truly accomplish a revolution worthy of any sort of recognition.\n\nThe armed wing of the PCP, the Acção Revolucionária Armada, is a prime candidate for centring the armed forces behind, with its ties to key positions within the party. A politically motivated and robust and elite fighting force, we would gain a lot by setting it up for success as the backbone of the army. By providing it with necessary supplies, the PCP will be in a position to play a more central and involved role in the revolution."

PPR_a_popular_force:0 "A Popular Force"
PPR_a_popular_force_desc:0 "With the ARA as the main organizer of our armed forces for the revolution, the military will remain with a loose command structure but with the PCP involved we can expect more people to join the army as well as having top officers that are more committed to the revolutio\n\nnNow that we have integrated and established the ARA as the main organiser of our armed forces in the revolution, we've begun to see resounding successes in our campaigns as our men are much more steadfast from a bolstered morale and a competent, organised leadership.\n\nThough the military itself can remain loose in command structure, the PCP will play a much more involved role in control of the armed forces. By demonstrating this expression of political domination over the armed forces, we can be sure to see an influx of workers, peasants, and other citizens show their willingness to join our ranks - and most noticeably, our top officers in command conscious and committed to the revolution."

PPR_the_army_of_the_proletariat:0 "The Army of the Proletariat"
PPR_the_army_of_the_proletariat_desc:0 "The shining red light of communism illuminates the Portuguese lands, directing the Portuguese proletariat into the darkness which smothers and strangles our brethren oppressed by the reactionaries and tyrants beyond our reach. Nothing but horrors lie beyond our line of control, when we hear the silenced cries of the Portuguese farmer and we see the plight of the Portuguese worker!\n\nWe must remind and inform the people what is at stake should we falter, should our enemies triumph over us. We are all fighting for the revolution, and we must be willing to put our lives on the line, for a bright red future. Remind each man in the trench, and every mother and child, that they are all the first line of defence - a defence of the Portuguese proletariat against the dark forces of reaction and capitalism."

PPR_a_economia:0 "A Economia"
PPR_a_economia_desc:0 "How could we call ours a socialist revolution if we have not done away with the existing capitalist structures that rule our economy?\n\nWhile it is certainly impossible to carry out our more radical reforms to the economy, we've identified a number of... conveniently accessible parts of our economy. These parts of the economy, distant from the war effort enough that manipulating them wouldn't harm us in any meaningful way, but would certainly score us a huge boost in popularity from our growing supporters who are aching for a taste of socialism.\n\nThe most profound of our changes to the economy will have to wait, of course, but as of now, let us begin with tearing down the most token structures of our capitalist economy, so that in its place a socialist one may bloom."

PPR_the_road_to_industrialisation:0 "The Road to Industrialisation"
PPR_the_road_to_industrialisation_desc:0 "None would argue that our nation is great indeed, in spirit and dedication both. Unfortunately, however, we must also acknowledge our relative dearth of state industry, a dearth that cannot be overlooked if we are to prosecute a war. We must industrialize.\n\nAnd we will, by seizing private industry and the other interests of those not willing to provide them to their rightful owners - the people and their acclaimed leadership."

PPR_stick_with_the_prp:0 "Stick With the PRP"
PPR_stick_with_the_prp_desc:0 "The PRP is many things, and not all within our administration fully trust them or their further goals. They are, however, unquestioningly dedicated to the shared goal of winning our war, and ensuring the survival of our nation.\n\nTo that end, they are willing to compromise, and sacrifice some of their positions as they regard the economy in order to ensure relative unity in leadership. We shall accept."

PPR_follow_in_the_steps_of_the_nep:0 "Follow in the Steps of the NEP"
PPR_follow_in_the_steps_of_the_nep_desc:0 "It is an absolute necessity, now that we are firmly established, to ensure that the state has a stable economy - and this will be achieved through proper revolutionary measures. The PRP has taken the first step, outlining measures based on the NEP to achieve such, and they will be instituted.\n\nThe breakup of large landed estates will naturally continue, but critically it will be ensured that small landowners and businessmen can continue to operate. Under the careful watch of the state, of course."

PPR_back_the_pcp:0 "Back the PCP"
PPR_back_the_pcp_desc:0 "None can doubt that the PCP intends to win our war - through whatever means are necessary. One of those means is the implementation of a radical program of collectivization, throughout the state and at every level of economic activity.\n\nThey are adamant that the presence of any capitalistic economic action, whether directly or in a mixed fashion, will compromise the foundation of the revolution, and will not be deterred. We agree, and will align with them."

PPR_a_state_controlled_economy:0 "A State Controlled Economy"
PPR_a_state_controlled_economy_desc:0 "The PCP has presented their economic plan and, as expected, it calls for a fully state owned command economy. Under their model, all land and industry within our territory will be nationalized and redistributed along guidelines the state is to develop.\n\nIf the war is to be won we must have total control over finances, output, and economic organization. This plan recognizes that, outlining the basis for a series of development plans in addition, and it will serve us well moving forward."

PPR_apply_theoretical_economics_to_practicality:0 "From Theoretical to Practical"
PPR_apply_theoretical_economics_to_practicality_desc:0 "None would argue that the foundation of Marxism is economic - it was after all the exploitation of the worker that drove its theory, and Marxist intellectuals have devoted many works to economic theory. We find ourselves, however, locked in a struggle for survival, and so we must implement those theories into practice.\n\nIn so doing, we will reinforce political orthodoxy, further centralize our state, and further our goal of expanding the revolution throughout Portugal."

PPR_o_camarada:0 "O Camarada"
PPR_o_camarada_desc:0 "Symbols are important. Symbols are the way by which citizens can conceptualize the state. Carlos Antunes and Isabel do Carmo are two such symbols. Figures who cared as much for the worker as they did for each other. Who recognized the failings of the Republic, and acted to correct them.\n\nIn catalyzing the revolution it was they to whom we owe our current position and opportunity, and their legend, will be remembered by Portuguese workers for eternity."

PPR_rally_the_people:0 "Rally the People"
PPR_rally_the_people_desc:0 "It cannot be ignored that there are many - far too many - citizens who display insufficient revolutionary spirit. Who tolerate or, at worst, oppose the progress of the revolution. We must correct this, and show them that our effort will not only liberate them, it will liberate Portugal.\n\nAnd we will. Revolutionary leadership will make more public appearances, messaging and propaganda will be intensified, and a proper orthodox fervor will be restored."

PPR_the_shadow_of_cunhal:0 "The Shadow of Cunhal"
PPR_the_shadow_of_cunhal_desc:0 "Comrade Antunes requires a variety of skilled political players from the Portuguese Far-Left to ensure the People's Republic is able to survive once the revolution is complete. To this end, Antunes has appointed Álvaro Cunhal, general secretary of the PCP, to the position of Second Secretary to the Premier, for which Cunhal has humbly accepted.\n\nIt is Cunhal that will add a rather unique bite to the Antunes Regime, so much so that it has many worried. Cunhal and the PCP have very different ideals regarding the conduct of state affairs from others in the leadership, with some comparing him to a kind of 'Lusophone Yagoda'. As perhaps unfair as the comparison may be, Cunhal is still a very formidable individual, one that the Proletariat will keep very close eye on as the Civil War continues to escalate."

PPR_the_path_for_proletarian_liberation:0 "The Path for Proletarian Liberation"
PPR_the_path_for_proletarian_liberation_desc:0 "A Portugal free from capitalism, from reactionary elements, is a vision and dream shared by all within our movement, and all are willing to fight for it. We acknowledge, however, that this is likely to be a long fight, and we are only starting down the path to victory.\n\nBut we will follow it to completion. We will fight to liberate Portugal and its proletariat, despite all the forces arranged against it and us - and we will win."

PPR_seek_international_recognition:0 "At Home in a Free World"
PPR_seek_international_recognition_desc:0 "The revolutionary spirit of Portugal, long suppressed, is now free - and if it is to remain so we must ensure that any and all aid is found and secured. While it is true that reactionary efforts worldwide have suppressed many socialist governments, there are some remaining. We will reach out to them.\n\nThe Ministry of Foreign Affairs will be given the resources it needs to arrange proper meetings and embassies, and attempt to secure formal recognition of our legitimacy to the greatest extent possible. It must be seen that we represent Portugal."

PPR_proudly_alone:0 "Proudly Defiant"
PPR_proudly_alone_desc:0 "Many have said that our movement has no friends, no allies - and they are not wrong. But they consider this a weakness, and not a strength. We, alone among other so-called 'socialist' nations, remain committed to true socialism, without compromise or deviation.\n\nWe will wear that badge with pride, and use it to inspire both our cadres and the people at large of the righteousness of our struggle. Our achievements will be seen in the light of the struggle to overcome, and be all the greater for it."

PPR_in_amazonas_footsteps:0 "In Amazonas' Footsteps"
PPR_in_amazonas_footsteps_desc:0 "A movement, a revolution, requires heroes. Examples to follow. We are no different, and we can look to the international struggle for such examples. There is perhaps none better than João Amazonas in Brazil who, along with his party, have struggled against the Brazilian regime for a long time indeed.\n\nWe will learn from their commitment in the face of adversity, in their determination and endurance, in their commitment to revolutionary ideals, and in their message of liberation. We will apply them to Portugal, and inspire our own people by doing so."

PPR_unite_the_army_and_politics:0 "Unite the Army and Politics"
PPR_unite_the_army_and_politics_desc:0 "For our revolution to succeed everyone must be wholly committed to seeing the liberation of Portugal to its end no matter the odds and that goes double for those in charge of directing our brave soldiers on the ground.\n\nWhile some say the military should be apolitical we know such a thing is impossible. The war effort requires officers as unwavering in their belief in the people's liberation as they are skilled on the battlefield becoming a sword raised in our defense rather than a dagger in our back."

PPR_the_proletariats_economics:0 "The Proletariat's Economics"
PPR_the_proletariats_economics_desc:0 "Our revolution is meant to build a new world, powered by a new economy. One that works for the worker and not the other way around, one where all needs are met and want has been relegated to a myth.\n\nWe will fight to the last man for this future, a future now at hand with our revolution closer than ever to securing itself against the vultures who would see the Portuguese worker in chains once more. Once they are dealt with, exploitation will be at death's door itself soon after."

PPR_uma_revolucao_gloriosa:0 "Uma Revolução Gloriosa"
PPR_uma_revolucao_gloriosa_desc:0 "The Portuguese proletariat has struggled for so long against its oppressors. Whether they wore the guise of heartless technocrats or gaudy clergymen, the exploiters of the workers kept them in chains for decades while growing fat off their blood and toil.\n\nNo More we say! The time has come at last for the proletariat in Portugal to undertake its historical task and free all from the shackles of capital, ushering in the rebirth of the nation as a bastion of worker power and a model of a fairer and more equal society to be a beacon of hope for all workers of the world."

 #National Spirits 
 PPR_ideological_infighting:0 "Ideological Infighting"
 PPR_ideological_infighting_desc: "The government of the People's Republic is made up of several smaller, less consequential communist parties - although in reality, it is the PRP and the PCP that hold the most sway internally. In theory, the PPR is a grand coalition of the Portuguese left, all coming together to fight against the forces of reaction for a brighter future for the workers.\n\nIn theory, at least.\n\nDogs bark, mice squeak, and the left will fight with itself. Despite the government being ostensibly unified, co-operation between differing strains of communist on any level beyond winning the Iberian Wars is considered downright impossible. Anarchists, democratic socialists, and all other varieties of Communists may be willing to make nice now - but it is unlikely they will continue to do so should they win the war."

 PPR_iberian_claims:0 "Iberian Claims"
 PPR_iberian_claims_desc: "While upon its creation the Iberian Union was derided by many both at home and abroad, it would be downright naive to assume that it was universally hated. With Portugal and Spain joined together for as long as they were, it was inevitable that some bonds would form as the years went by - bonds that would not easily break.\n\nWith much of Portugal now under the aegis of the People's Republic, there are many who are turning their gaze outwards to their former Iberian comrades. Whether it be Spain, Catalonia, the Basque Country or Galicia, the government makes heavy use of rhetoric demanding the liberation of their Iberian kinsmen from the chains of capital to boost morale."
 
 PPR_weakened_uprising: "A Scarred Revolution"
 PPR_weakened_uprising_desc: "Against all odds, the Front has managed to grasp a tenuous hold after clawing its way out of the collapse of the Republic. Battered, burned, but not broken, the last vanguard claiming the mantle of a free Portugal finds itself dangerously lacking in material, manpower, but definitely not in will to fight. And so will they keep standing, facing against the fascist oppressors as they keep encroaching against the Portuguese People. For no one else will."

 #Event 
 PPR_wars.1.t:0 "A Different Kind of War"
 PPR_wars.1.desc:0 "The headlights shone full beam in the dead of night. Corporal Passos had a loose grip on the steering wheel as he led the convoy's vanguard car through the windy roads of the country hills, fleeting thoughts occupying his mind.\n\nHome. His sweetheart—with child, they had to get married before she started showing— and his mother, father. Brother Mico was going to be an uncle at the age of sixteen and in a matter of years he would probably have a family of his own. Where had the time gone? He scoffed in disbelief just as a resounding thud shook him to attention. The road up ahead went ablaze with orange flame and billowing smoke. The old bridge they were moments away from crossing had exploded.\n\nHeel slammed right down on the brake as his head struck the headrest from the whiplash. What seemed like hundreds of dark silhouettes ran from the tall grass on either side and began firing at the convoy, his fellow soldiers caught completely off guard with not even a chance to draw their rifles. Passos took his sidearm and rushed out of the truck only to be assaulted by a wail of bullets, returning blind fire as he dashed for cover. He stumbled, tried to move, only to feel something warm running down his leg. Blood was drawn. His pistol fell out of his hands a few feet away...\n\nAnother bullet in the stomach. The cracking of gunfire went silent. Shouting, yelling. The barrel of a militiaman's rifle stared him in the face. Was this the end? No—the gun lowered as a superior marched by. "No executions! We're taking them alive. Put him with the others."\n\nThe Corporal was hauled up on each arm. As he felt the life slowly drain from him, he saw the mangled bodies of his comrades and wondered how long it would be until he joined them in the clutches of death. He was thrown into the back of the truck he had been driving only a few moments before..."
 PPR_wars.1.a:0 "...only to disappear into the night."

 PPR_wars.2.t:0 "An Endgame Preempted"
 PPR_wars.2.desc:0 "Despite only being in a minor post for much of the previous administration, and not really moving from his office in Faro as the attempted coup deteriorated, Álvaro Cunhal was still able to spare some vague degree of luxury. He took his seat, a plush, lime chair, and leant forwards to try and gain Antunes' attention, his face painting a grim picture.\n\n"Our current policy isn't working." snapped Antunes, looking down at a series of figures listed on a chart that Cunhal strained to look at. "Not only are we failing to meet our targets, but we're struggling to get anywhere close. The shortfall is only broadening, Álvaro."\n\nCunhal smiled. "I expected as much. I warned Simões that this approach would only cost us valuable men and resources in the long-term."\n\nAntunes looked up, then sideways with suspicion. "Then what do you suggest instead?"\n\n"Full state control." responded Cunhal, pressing a finger onto the table. "Of armaments production first, but we must transition away from a private model in general. We should have done this from the start."\n\n"And yet you've refused to discuss this measure at all?" Antunes shouted, standing up for a brief moment as he slammed the paper on the table. "You left this issue to fester, and would have let it fester further if not for chance?"\n\n"Well, I wanted to hold out hope that this policy would work. I'd rather not collapse this government so soon." responded Cunhal, shrugging.\n\nAntunes collapsed back into his chair, slouching as he sighed loudly. "No, I suppose not. I'll prepare a meeting, consider our options. I don't know if it's wise to move ahead so soon, but the status quo isn't working""
 PPR_wars.2.a:0 ""I can only hope that this doesn't exacerbate our problem.""

 PPR_wars.3.t:0 "Prising Apart the First Draft"
 PPR_wars.3.desc:0 ""...these inevitable failings emphasise how damaging a philosophy capitalism and fascism have been for Portugal, across Iberia, and for the wider world." spoke Carlos Antunes, reading through the draft in front of him as if by rote. Writing a political programme in these times seemed to be wishful thinking, but surrounded by the rest of the cabinet, and consistently surrounded by a handful of aides, he knew that the appetite was there.\n\nJaime dos Santos Serra raised a hand, interjecting as he received little input. "I don't think there's any real need to separate the two ideologies. Fascism is the endpoint of capitalism, a natural evolutionary step as pressure from the proletariat begins to threaten the bourgeoisie."\n\n"Indeed, Jaime." replied Joaquim Gomes dos Santos, turning away as Antunes looked on in shock. "It would be much more fitting for us to describe the pair of ideologies as offshoots of imperialism."\n\nJust as Santos finished, Álvaro Cunhal stood up, clearing his throat. "If we're going to treat these ideologies as separate, then I worry about the direction that this programme will take." He threw down the copy distributed across the table into its centre, the papers within becoming strewn apart. "If we don't review this point soon, then I will have to leave this government."\n\nCarlos Antunes placed down his notes, standing up. ."We're already on a knife edge, and you think that the solution is to tear apart this government, to break ourselves apart over two words?" he shouted, looming over Cunhal, the base of his beard practically level with the tip of Cunhal's forehead. Looking around, few seemed willing to respond, instead looking away.\n\n"I apologise." replied Cunhal, looking downwards he shakily sat back down. "I should not have jumped to that extreme so soon.""
 PPR_wars.3.a:0 "The meeting continued with objections practically unabated."

 PPR_wars.4.t:0 "Martyrs of the Wrong Cause"
 PPR_wars.4.desc:0 "The dim, flickering lights and crowded passages of the Hospital do Litoral Alentejano in the city of Santiago do Cacém were not the background Isabel do Carmo had in mind when she imagined herself singing the praises of the socialist revolution. In her mind, she would rally the adoring masses, surrounded by red flags and rowdy comrades, and stand side by side with Carlos.\n\nBut Isabel knew that reality would be different. The masses were here, less adoring and more trying to stay out of her way. The nurse leading her through the tangle of people and beds was visibly nervous, trying to avoid meeting Isabel's gaze. But these were the proletarians of Portugal, at their most vulnerable, and she will have to rally them here.\n\nThe nurse led Isabel into a large room, filled with wounded men. These were soldiers of the bourgeois Republic, wounded before the revolution swept the old regime from power. The storm had passed over their heads and most of these men would never return to the ranks, but they needed to be brought on board, too.\n\n"Men, soldiers, proletarians!" A few of the former soldiers turned to look at Isabel, confused or sneering, but she continued. She had to. "You have been wounded in service to a Republic that claimed to fight for liberty. The sweet promise of freedom they have peddled was so alluring after so many years in the darkness of the Caudillos' rule. But that was only the first step, an insufficient one. The Republic never intended to truly fight for you as you did for it. It has discarded you as soon as you were no longer useful as pawns for its elite, left you to die here."\n\n"But now, things are different. A new government has taken control of the Republic, one that truly cares for all its children. You have shed your blood for a failed government, but now, you are under the care of the first government in the history of Portugal that truly cares for its people. You may not return to the battlefields, but the People's Republic will not forget about you.""
 PPR_wars.4.a:0 ""Things will be different. They will have to be"."

 PPR_wars.5.t:0 "Security Vanguard"
 PPR_wars.5.desc:0 "The small retinue filed into the car, muttering among themselves, frustration darkening their faces. As the gray government building they had just left disappeared from view behind them, Álvaro Cunhal cursed under his breath, pinching his nose under his prominent eyebrows.\n\n"These idiots in the PRP..." Cunhal almost spat at the thought of the meeting they had finished. "They're bending doctrine, talking about practical Portuguese socialism... We need them now, but I want you all to know they cannot be trusted. We must wait for an opportunity to correct things."\n\nThe group of agitated revolutionaries, perhaps not used to being able to speak their minds in the open for so long, grew louder and louder. The chorus of agreement, anger, frustration and possible sedition grew stronger and more chaotic, until suddenly, a voice pierced through the din. One of the men asked Cunhal: "...But they hold the government! What are we going to do? We can't just play second fiddle to the PRP forever!"\n\nCunhal leaned towards the man, once again quieter. "I know, Jaime. But while the PRP may have the government behind them, we have the people. When and where it counts, the people will have our back. The PRP will have to bend to us - or it will break.""
 PPR_wars.5.a:0 "In his heart, Cunhal dearly hoped that he was right."

 PPR_wars.7.t: "On the Airwaves"
 PPR_wars.7.desc: "Pedro was always drawn to radios, obsessed with them even. Something about how they transmitted sound over seemingly nothing was just magical for him.\n\nHe'd begun collecting discarded devices long ago, tinkering until he knew how to strip electronics and make rudimentary ham radios almost from scratch. It was now his most valuable skill since the war started, allowing him contact outside his remote village near the Spanish border. Particularly he appreciated the contact with his Spanish friend, Leonardo.\n\n"It's quiet for now but I don't expect it will last" Leonardo had said during their last conversation some days ago. "We are at the edge of Republic territory, and it feels more unstable everyday. Everyone is training how to use a gun or learning escape routes to use if bandits, or worse, arrive here. A hamlet nearby got looted and razed two days ago, we saw the smoke and some of us investigated. We don't know if it was soldiers or someone else. We only found one survivor, and she's been mute ever since. Maybe you should do the same preparations now while you can."\n\nThat conversation had stayed with him ever since, the words repeating even as he tried to sleep each night, ringing in his ears throughout the night's silence. The chaos further north was spoken about in hushed whispers, but his village was out of the way of anything interesting. No one was particularly political and there was nothing of use to anyone anyway, surely those fighting the war would not bother to show up to some middle of nowhere village, right?"
 PPR_wars.7.a: "He would have asked Leonardo, but only static greeted his calls to Spain now."

 PPR_wars.8.t: "Court Martial"
 PPR_wars.8.desc: ""It is the view of this court that the evidence presented is insufficient to implicate the accused, Major Oscar Pascoal, in the murder of Anacleto Ector. He is cleared of all charges and is returned to active duty with immediate effect."\n\nFrom the rear of the courtroom came some murmurs of discontent, from the front of the audience respectful applause. Oscar smiled. Vindication felt sweet. He stood up with the guards to be released - within hours he would be back in his position and the Republic would have one of its best in its service again.\n\nWas that arrogant? He mused on it and decided it wasn't. After all, there was something that separated him from the common soldier, a quality that Portugal would need in the days to come: doing what needed to be done. A complete understanding of the necessity of practicality, even if distasteful.\n\nHe had killed Ector. He was fairly certain the judge knew that too, he'd observed that he hadn't covered his tracks as well as he thought he had. But the result was entirely satisfactory. Ector had been a Quartermaster in the army, mostly unnotable. Young, quiet but not disliked. By all accounts a decent soldier, until he'd been found gutted under a bridge.\n\nEctor had been feeding information on supply movements to communist irregulars; an investigation Oscar had conducted had all but confirmed it. After Oscar had disposed of him, partisan activity in the area - mostly suspicious murders and rallies - had dropped considerably. The last thing Portugal needed was those lunatics getting more guns, weakening the homefront and social fabric, even if they shared the same enemy for now.\n\nOscar left the room with a smile. His victory was a victory for Portugal, and should more communist subversion threaten their young republic, he had no doubt that he would defend it again."
 PPR_wars.8.a: "The Republic was a house of cards, that Oscar wouldn't see collapse in their favor"

 PPR_wars.9.t: "Summary Sentence"
 PPR_wars.9.desc: ""Those eyes are creepy aren't they..."\n\n"Yeah. Rather they look like that than through a scope." Spittle hit the ground below the eyes. "Good riddance."\n\nThe body hung from a tree, eyes bulging from a bloated face, more black and purple than anything else. His features could barely be made through the injuries. Dirt and grime clung, the remains of maybe days crawling through the dirt of the countryside. This sniper had been picking off the unit one by one, turning a two day march into nearly a week for his executioners.\n\nBlood and tears punctuated the clothes underneath his terrible face. He wore no uniform, except for an armband with the emblem of the Kingdom. The leg had the worst of the scarlet discoloration, a bullet wound having leaked like a sieve into the trousers. Partisan? Soldier? Believer of the cause acting alone? They didn't know, and they didn't care much.\n\nThe body swung lightly in the breeze, hung by the rope. It had taken days to catch him, moving around where they thought he was praying he would not see them or move away. One group had been forced to be bait, while the other snuck towards him. The eventual encounter was almost by accident as they crawled into each other.\n\nThe sniper had jumped up, raised his rifle to fight off his foes. The squad was faster. A bullet through the thigh had collapsed him in a moment, the barrage of fists as the republicans' frustrations exploded. They'd bound his wrists with rifle sling and a rope from the pack had served as a noose. After the beating, he'd barely resisted.\n\n"Let's go, find the others. We're behind as it is." The unit walked away, sparing not a thought for the boy hanging from the tree."
 PPR_wars.9.a: "The boy's name would go unrecorded"

 PPR_wars.10.t: "Liberation of Aveiro"
 PPR_wars.10.desc: "For the Attention of the Council of Ministers,\n\nGentleman,\n\nToday I can communicate to you that our flag flies above Aveiro. As one of the Monarchist's primary fortifications in the North, this victory marks a significant military victory as we deprive the monarchists of one of their major links in their defenses against our campaign in the North. It is further hoped that this city can serve as a launchpad for further operations to secure the North.\n\nDensely populated, the fighting was regrettably intense with a large proportion of the population mobilized against us either actively or passively. The center of the city had been made a maze of fortifications and ambushes while attempts to use small boats to bypass and entrap some of the defenders were unsuccessful. Initial attempts to minimize the use of heavy munitions to just the outskirts had to be aborted due to the density of resistance. The result has been a city taken but greatly damaged.\n\nNews of the destruction of the City's Cathedral due to it being used as a final defensive position, is being suppressed in the media for now. Civilians continue to use its ruins however its reconstruction, as well as the reconstruction of the wider city, may take some years.\n\nAfter the rout of hostile troops resistance in the population has been minimal, perhaps facilitated by the difficult humanitarian situation. Evacuation of vulnerable individuals from the area is planned, however the camps intended for the program are not yet operational. Further humanitarian policy will be discussed at our meeting tomorrow.\n\nSigned,\n\nDefense Minister Gomes"
 PPR_wars.10.a: "A chain is only as strong as its weakest link"

 PPR_wars.100.t:0 "The Red Rooster of Barcelos"
 PPR_wars.100.desc:0 "In a small Braga apartment, a couple quietly went over the details of a plan. This was no small family outing, however, but the start of something greater. The liberation of the Portuguese worker.\n\nCarlos Antunes silently smoked a cigarette, watching the flaky gray residue fall from the tip as he looked one more time at the map. Galicia and the old Brigadas Revolucionárias hideouts in the state were marked with green pen. Across from him stood his wife, Isabel do Carmo. It took the pair back to before Carlos was Secretary of the Frente de Acção Popular, when it was just their rowdy band, when they were just a bunch of brave fools. "I don't know about you, but I like this," Isabel said.\n\nCarlos' voice was tinged with dry humor. "I can hardly shit without thinking I'm endangering the future of Portugal's working sons and daughters by my wasted time."\n\nIsabel laughed gently. "I know. And I know you're thinking of the losses, and the ones who won't come back. But I also know it's worth it." She walked around behind him and squeezed his shoulders. Carlos brought a hand up to rest on one of hers.\n\n"But I know that my heart must harden. Cunhal and the PCP have been stirring up the people against the regime, and with how intertwined his faction is with the army, I'm worried it may cause a rift between the revolutionaries. Maybe that's the only reason we're acting now instead of taking it slower," Carlos sighed.\n\nIsabel softly frowned, and then gently took his arm, guiding it back towards the map. Her guidance ended with his fingers settled on the circled X in faded red ink, some ways south of Ourense. "So find another reason to act. Act for the children yet unborn. For the ones who deserve a future. For Celso's final sacrifice that day twenty years ago."
 PPR_wars.100.a:0 "Antunes' mind fixed on the words, and his veins filled with steel."

 PPR_wars.101.t: "The Casting of the Dice"
 PPR_wars.101.desc:0 "On street corners across Portugal, televisions lit up with dials tuned. Communist-affiliated workers, policemen walking beats, soldiers preparing their gear, and young children swarmed like ants to bread crumbs. In seconds, hundreds of thousands of people were all turned out and ready to hear what would be said.\n\nProjected onto every screen and into every ear was the face of Carlos Antunes. He was dressed in a fine, well-tailored suit, but his hands became slicked with amber machine grease as they met the railing of a still-bustling arms factory platform. On his flanks stood Isabel do Carmo, his wife, and Álvaro Cunhal of the PCP, his rival. Across the screens, Antunes' voice rang out.\n\n"People of Portugal! I come before you today regarding our coming struggle. The rulers of Spain, despite our best attempts at diplomacy, have not proven amenable to coexistence with the Revolution. They believe they are above the true emancipation of their people, and as such, have denied our overtures towards peace. We are therefore pushed towards our only remaining option - war." In the towns and cities, attention snapped back to the screens, making the word feel silently uncomfortable. The gravity of the idea hung over those watching, introducing a palpable feeling of added weight to the speech. Men would die, and blood would spill, and there would be ruin and carnage to follow, no matter whose way the balance swung. "This will be a righteous war. It will be a war of liberation. It is a war to protect the Revolution, and a war to give glorious freedom to our Galician, Castilian, Catalonian, and Basque brothers, who will suffer and die for the profits of their overlords no more.\n\n"Portugal itself shall be the crucible to form our changed world. It will be the vanguard of Iberian communism, the tip of the revolutionary spear. We will fight, and we will win, in the name of the worker and the liberation of the peninsula we call home. Viva o trabalhador! Viva a revolução!""
 PPR_wars.101.a:0 "Beyond the screens, the revolution flooded outwards."

 PPR_wars.102.t:0 "Snake Eyes"
 PPR_wars.102.desc:0 "For several hours, the wounded men flooded into Braga Hospital, a consequence of the military's decisive defeat at Galicia and its expulsion from the territory. The military situation had turned against Portugal, and what remained of Iberia's revolution was in tatters.\n\nAntunes toured the hospital, doing his best to keep spirits high and minds off the disaster. Beside him, as usual, was Isabel, still auxiliary and available even in this dark hour. Walking into one of the wards of men with more grievous injuries, Antunes heard the radio crackle, and a few men limped near to listen. Off the airwaves came Cunhal, in a tone that made Antunes sick.\n\n"Men and women of Portugal, this is Álvaro Cunhal of the Partido Comunista Português. Let me state first that the measures I must now take were always the furthest from my mind, and that I would never enact them unless I believed the situation truly required them.\n\n"Let us speak frankly. Antunes has failed. The PRP has failed. He has squandered the blood of thousands, and even now, he refuses the Spanish ceasefire. I cannot overstate the generosity of the terms offered - a return to Portugal's original borders, and no further action taken against Portugal or her people. That is why it perplexes me that Antunes still refuses to halt the bloodshed, despite the war now being decisively over. That is why I must now announce that I, and the PCP, are now taking executive control of the Portuguese nation..."\n\nIn Antunes' mind, the rest devolved back into static. In a stunned daze, he looked around the room at the faces of the men in their beds. Some of them contorted in revulsion at the announcement, while others could barely hold back their excitement. Isabel, already in action, grabbed a phone and frantically spoke to him in words he still could not yet understand. While his mind was still racing, he managed to put together a reply..."
 PPR_wars.102.a:0 "We can still stop this. Contact our local militia units."
 PPR_wars.102.b:0 "We must escape and live on. The day is lost."

