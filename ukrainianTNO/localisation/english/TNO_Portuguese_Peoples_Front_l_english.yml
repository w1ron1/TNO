 ## Characters ##
 ################
 PPR_Carlos_Antunes:0 "Carlos Antunes"
 POLITICS_CARLOS_ANTUNES_DESC:0 ""The revolution can't come through words alone. It can come only through violent, overwhelming force against the fascists."\n\nThis thought is what drove Carlos Antunes to break from the Portuguese Communist Party in the mid-1960s, frustrated over by the lack of decisive action and the absence of its leadership of whom many were in exile. Now, all across Iberia his theory has come true as the house of cards the fascists created finally collapses in on itself.\n\nHe created the Brigadas Revolucionárias and the Partido Revolucionário do Proletariado to resist the Iberian State, not limited by the indecision of the PCP. They spread messages of revolution to the workers of Portugal and engaged in violent action where they could to destabilize the regime. As Iberia descended further into chaos many former critics found it harder to dismiss him. Now, he appears to many socialists as a man ahead of his time.\n\nThe violent overthrow of any oppressors, in his eyes, is absolutely necessary. After all, the promised land on the other side where all will stand free and equal will justify the horror."

 PPR_Alvaro_Cunhal:0 "Álvaro Cunhal"
 PPR_Alvaro_Cunhal_hog_desc:0 "§YSecond Secretary of the FAP\nBolshevism§!\n--------------\n§LWhile the PCP's position as the premier vanguard of socialism in Portugal has been reduced somewhat by the PRP, it remains a bedrock with influence across the socialist sphere. As such, Álvaro Cunhal - Secretary General of the PCP - being named the second most powerful man in the People's Republic was inevitable.\n\nIn Álvaro Cunhal is a man who saw the glimmer of socialism before it was snuffed out, who visited the Soviet Union and has a lifetime of resistance behind him. With position comes influence and Cunhal has one premier use for it; it is division that destroyed socialism before and he shall stop it happening here - and it is the PCP under whom such unity is possible.§!"

 PPR_Pedro_Soares:0 "Pedro dos Santos Soares"
 PPR_Pedro_Soares_for_desc:0 "§YMinister of Foreign Affairs\nBolshevism§!\n--------------\n§LFrom a small village in Beja, no one could have imagined that one of Portuguese Socialism's most fervent international soldiers would come. Pedro dos Santos Soares is the PCP's prominent representative around the world, having worked with several socialist movements in Latin America . With international action however, comes perspective.\n\nHe has seen the injustice; almost everywhere worker movements are hunted and battered. Governments never listen even if approached in good faith, as in Portugal where claims of democracy by the Republic were a screen for capitalist oppression. Only the PCP are the true protectors of the revolution, but everyday the PRP's arguments grow louder in his ears.§!"

 PPR_Joaquim_Santos:0 "Joaquim Gomes dos Santos"
 PPR_Joaquim_Santos_eco_desc:0 "§YMinister of Economy\nBolshevism§!\n--------------\n§LJoaquim Gomes dos Santos has seen the worst of the injustices against socialism.He spent time as a teenager in prison and survived the arrests of socialists for years, while socialism across the world collapsed.\n\nThere was one light in the sea of misfortune; a man called Josef Stalin in the Russian wastes. Santos took an interest in the economic reforms of his socialist fiefdom and underwent an epiphany as to the economic possibilities of rapid industrialization. The War prevents any action, but Santos sees more than just a strong Portuguese economy in the future.\n\nHe sees a leading one.§!"

 PPR_Jaime_Serra:0 "Jaime dos Santos Serra"
 PPR_Jaime_Serra_sec_desc:0 "§YMinister of Defense\nBolshevism§!\n--------------\n§LArrest. Imprisonment. Torture. Jaime dos Santos Serra makes no claim to being a martyr - he has suffered the same as many of his brothers and sisters across Portugal. Ever since he was arrested as a teenager for distributing socialist newspapers, he has stood side by side with the workers against the fascists.\n\nAs a result, Serra understands that sometimes violence must be met with violence. The PCP educates the workers and spreads the message, but sometimes the right message needs a firm shield. None in the party understands the web of pro-PCP militias as he does, and under his oversight a true People's Army will parade through Lisbon.§!"

