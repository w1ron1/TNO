 ### Leader Bios ###
 YAK_Georgy_Basharin: "Ґєорґій Башарін"
 POLITICS_GEORGIY_BASHARIN_DESC: "Ґєорґій Прокопієвіч Башарін вважається уособленням незалежного якутського духу в епоху хаосу й невизначеності. Як частина великої та бідної сім'ї селян - рішучість вела його до успіху в освіті. Він вивчав історію й літературу в Москві, доки не повернувся на його батьківщину в останні мирні роки для Росії. Уникнувши призову до армії під час війни з німцями й конфлікту в Сибіру, Башарін долучився до руху ліберальних націоналістів, націлених на боротьбу для здобуття свободи якутського народу. Через деякий час війська Вєрховного Совєту було вигнано, і інтелектуальному колові здалося, що вони досягли своєї мети.\n\nБуло встановлено демократичний уряд, що проголосив нову Якутську республіку й пообіцяв великі реформи, а також свободу для населення. Утім, щойно становлення нації розпочалося - їй завдала удару реальність. Як вважалося, чимала кількість природних ресурсів, таких як алмази, надасть допомогу в розвитку країни; вона виявилася згубною для неї. Місцеві компанії сформували монополії в видобувній промисловості, фінансуючи власні проєкти прибутком із їхньої діяльності. Вони зосереджували владу всередині Якутії, навіть створивши свої держави у вже встановленій державі, маючи окремі збройні сили для легшого здійснення своїх операцій. У цій країні панує злочинність, а олігархи пов'язані з мафіозними організаціями що вільно діють без урядового втручання.\n\nІ серед усього цього Ґєорґій Башарін залишається взірцем чесності й відвертості, керуючи урядом республіки з усіх сил. Він може користуватися повагою всюди, але для боротьби з олігархією, що утворилася довкола нього, він мало на що здатний. Наразі все на що Башарін може сподіватися - це на яскраво палаючий вогонь якутського націоналізму."
 
 YAK_Vladimir_Kuroedov: "Владімір Куроєдов"
 
