POLITICS_GIUSEPPE_CASTELLANO_DESC:0 "Генерал Джузеппе Кастеллано є, мабуть, головною темою пліток серед вищих кіл Регіо Есерсіто. Ветеран двох світових воєн, він із відзнакою служив на Балканах під час останньої Світової війни, перш ніж піднятися в рядах італійського вищого командування. Амбіції Кастеллано сягали височини, але доля мала інші плани - кілька років після закінчення війни, новий Дуче, Ґалеаццо Чіано, доручив Кастеллано стежити за беззаконним алжирським фронтиром.\n\nКастеллано вже кілька років є головою Алжирської військової території, але його керівництво не принесло значних результатів у виправленні ситуації в регіоні. Італійські поселенці, у основному з Сицилії та часто пов'язані зі старими мафіозними родинами, були залучені Алжиром, оскільки регіон сприймався як такий, що знаходиться далеко від пильного ока влади в Римі. Анклави поселенців тепер усіюють алжирський ландшафт, і ходять чутки щодо справжньої глибини зв'язків Кастеллано з мафією; нестабільність лише посилюється через рішення Риму підтримати корінні алжирські ополчення, такі як Фронт національного визволення (ФНВ), у їхній збройній боротьбі проти вторгнення іберійської влади та їхніх союзників - п'єр-нуарців.\n\nГенерал-губернатор, залишений у Алжирі та якому надано дуже обмежені ресурси для виконання своїх обов'язків, здебільшого був змушений сидіти й спостерігати, як ситуація втікає з-під його контролю. Однак із відновленням напруженості в Тріумвіраті, незабаром Алжир та Кастеллано можуть знову опинитися в центрі уваги. Коли це трапиться, можливо, Кастеллано отримає свій шанс реабілітуватися в очах Італії - від генерала, що керує віддаленим куточком імперії через сумнівні угоди й закулісні переговори, до героя нації, який врятував її кордони від численних ворогів."
