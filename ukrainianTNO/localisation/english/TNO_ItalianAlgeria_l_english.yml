 #Початкові ідеї#
 ILG_Wild_Frontier:0 "Дикий кордон"
 ILG_Wild_Frontier_desc:0 "Як неофіційна військова територія на де-юре французьких землях, ми не отримуємо великої уваги з боку Рима. Це фактично зробило нас безпорадними, і наша єдина надія на виживання – допомога наших італійських братів."

 ILG_Unofficial_Italian_Settlement:0 "Неофіційне італійське поселення"
 ILG_Unofficial_Italian_Settlement_desc:0 "Оскільки ця територія придатна для заселення, багато бідних італійців емігрували в надії отримати землю. Безсумнівно, масова імміграція італійців лише погіршить наші проблеми через слабкий контроль над регіоном."

 ILG_Saharan_Bandits_Prevalent:0 "Розгул бандитизму"
 ILG_Saharan_Bandits_Prevalent_desc:0 "Обмежена військова присутність і нестача людських ресурсів призводять до постійних нападів бандитів на наші конвої та грабежів поселень. Проте ситуація загострюється, оскільки злиденні місцеві мешканці приєднуються до бандитських угруповань у надії вибратися з убогості, що ще більше ускладнює італійський контроль."

 #Події#
 ILG.1.t:0 "Заклик з Риму"
 ILG.1.d:0 "Оточений половиною десятка найбільш довірених помічників та підлеглих, Генерал важко зітхнув, а потім повернувся до численних карт і діаграм, що покривали великий стіл посеред звичайної кімнати для зустрічей. Часу для підготовки баз до прибуття нових військ, офіцерів та добровольців було обмаль, тому більшість зустрічей і все їхнє перебування відбувалося в непривабливих військових складах, що хоча б пропонували втечу від пекельної спеки пустелі.\n\nДо заклику, значний алжирський гарнізон здебільшого був покинутий на боротьбу з арабами, піде-нуарами та своїми власними командирами, які, в свою чергу, намагалися звільнити ресурси для більш продуктивних театрів. Насправді, деякі з присутніх були все ще зайняті тактичними підрозділами та партизанськими методами боротьби, явно не усвідомлюючи, що кампанія, яку вони тепер розробляли, стане найбільшою з часів Другої світової війни.\n\nДжузеппе сам заробив свої відзнаки на війні в старій Югославії, і був готовий заплющити очі на деяку наївність своїх підлеглих. І все ж, коли обговорення почало все більше переходити до теоретичних дебатів, він зрозумів необхідність втручатися.\n\n"Це не справа цього чи того проходу. Це не конфлікт сутичок і селищ. Це битва. Битва за міста, залізниці і волю. Дуче оголосив, що Алжир буде полем бою, і я маю намір принести йому перемогу. Іспанці будуть шкодувати того дня, коли вони вперше поглянули через свій проклятий кордон і побачили можливість, і якщо вони цього не зроблять, то я особисто прийму їхню капітуляцію в порті Касабланки. Ви тут, щоб виконати свою частину у вічному поході нашої Імперії, чи будете ви це робити?""
 ILG.1.a:0 "Оливкова гілка витрачена."

 ILG.2.t:0 "Пропозиція, від якої неможливо відмовитися"
 ILG.2.d:0 "Мохамед Будіаф не був особливо лякаючим персонажем - чоловік був одягнений у західний костюм, і сторонній, який зустрів би його, міг би використати слово 'вишуканий', щоб описати його характер. Але вишуканість не була достатньою у світі дипломатії. Місцеві були не просто на межі, а перебували між двома лезами ножиць.\n\nЗустріч була організована дуже швидко, і два чоловіки зараз сиділи в просторій вітальні десь на південь від Константіни. Швидко переходячи на французьку як спільну мову, італійські переговори з алжирським ФНО почалися. Лише через кілька годин, амбіції Італії не досягли значного прогресу.\n\n"Ось. Ось у нас є незаперечні докази серії репресій, які іберійці провели в східних провінціях. Італія пропонує всі свої співчуття і лише просить, щоб-"\n\n"Італійські гарнізони вбили шістнадцять наших людей цього тижня. Тридцять цивільних було поховано цього місяця, ми не хочемо чути співчуття."\n\n"І..." — чоловік продовжив, намагаючись зберегти впевненість, яка вже почала танути. "І лише просить, щоб ми могли довести свою відданість алжирській справі, запропонувавши новий пакет реформ."\n\n"Французи пробували реформи," — відповів революціонер.\n\nПотрібні були дні, щоб досягти угоди. Угода, яка на папері надавала Алжиру незначні репарації та значну автономію. Це був справжній дар, що Рим не мав наміру дотримуватися порожніх слів, написаних на безглуздому папері."
 ILG.2.a:0 "Отримано розпорядження."

 ILG.3.t:0 "Іберія нападає!"
 ILG.3.d:0 "Неминуче сталося: після короткого періоду повної дипломатичної тиші з боку Іберійського Алжиру, озброєні міліції були помічені на кордоні в Кабілії, Туґурті, Адрарі та кількох інших районах уздовж італійського кордону. Хоча війна офіційно не була оголошена жодною зі сторін, одне було зрозуміло: Іберія почала військову наступальну операцію прямо в Італійський Алжир.\n\nПісля того, як про ситуацію стало відомо, перша реакція з материкової Італії була розчаровуюче нестривоженою — невиразні обіцянки про додаткові поставки обладнання та людських ресурсів, а іноді й лише слова підтримки. Невідомо, чи зможуть наші вимоги на підкріплення успішно пройти через напружену політичну ситуацію в Римі, і якщо материк вирішить, що витрати на утримання Алжиру занадто великі, є ймовірність, що ми можемо залишитися без будь-якої додаткової допомоги від Італії на решту війни. Додаючи до наших труднощів, цей конфлікт, безумовно, загострить наші вже серйозні проблеми з бандитизмом: оскільки все більше і більше наших сил безпеки будуть спрямовані на іберійський фронт, а значна частина наших уже обмежених постачань буде втрачена в пекельній алжирській пустелі, бандитські загони можуть знайти легкі можливості для нападу на конвої, що ще більше ускладнить наші постачання.\n\nУ будь-якому випадку, усі наші теперішні військові сили починають мобілізуватися, і ми активуємо всі наявні міліції. Як тільки наші кілька оперативних літаків піднімуться в повітря, а рвані загони місцевих підрозділів почнуть свій шлях через алжирську пустелю, багато хто задається питанням, чи зможемо ми насправді провести наступ на іберійське військове урядування, щоб вигнати їх з Алжиру повністю, а в разі невдачі, чи зможемо ми навіть відбити наступаючий іберійський напад. Незважаючи на все, битва за Алжир розпочалася."
 ILG.3.a:0 "Ми повинні відбити напад Іберійців!"

 ILG.4.t:0 "Заклик з Риму"
 ILG.4.d:0 "Лише кілька годин попередження дало Маріо Піраньї час, необхідний для підготовки до дзвінка.\n\nМаттеї завжди жартував, що якщо Дуче одного дня зайде до його офісу і попросить його вшанувати його за ввічливістю, то ENI буде закрито того ж дня. З того часу Маріо зрозумів, в якому селі стала італійська політика, і він мав більше зраджених товаришів, які переслідували його все життя.\n\nАле навіть через усі ці роки дзвінок від ПНФ - а це все ще був ПНФ, незалежно від того, як Кьяно намагався це пояснити - все одно залишав неприємний присмак у роті.\n\nОтримавши інформацію від одного зі своїх людей у міністерстві, голова ENI очікував дзвінка і заздалегідь підготувався. Якщо знання справді є силою, то йому потрібно було всієї сили, щоб повернути новий рівень безглуздя, що охопив уряд останнім часом: війна прокотиться повз і знищить усе, над чим ENI працювало останні десять років, і він не був єдиним, хто так думав. В Іберії кожен інвестор, який має голову на плечах, так само, як і він, благав уникнути конфлікту.\n\nТочно калібруючи свої слова і проводячи підтвердження з різними зв'язками в Лісабоні та Алжирі, Піраньї готувався до випробування, яке його чекало. Його тема, як він вирішив, буде одним словом, яке і диктатори, і пси війни зможуть зрозуміти та повністю сприйняти.\n\nКоли телефон подзвонив, він відповів з усмішкою.\n\n"Я не говорю про мир, ні. Я не бажаю піддати Італію приниженням відмови від війни." Він відкинувся на спинку, "Я говорю, дорогий пане, про прибуток.""
 ILG.4.a:0 "...А Алжир є можливістю, якої немає більше ніде."

 ILG.5.t:0 "Пальма Конференція"
 ILG.5.d:0 "ПАЛЬМА ДЕ МАЛЬЙОРКА, РЕЙТЕРС\n\nІспанське сонце сьогодні зігрівало символічну білу голубку, коли італійські та іберійські дипломати зустрілися на острові Мальорка, щоб обговорити поточну напругу в Алжирі. Хоча країна де-юре є французькою колонією, де-факто її правлінням займаються Італія на сході та Іберія на заході з часів закінчення Другої світової війни. Після падіння Тріумвірату як Італія, так і Іберійська Федерація намагаються розширити свої відповідні сфери впливу, а для провідних політиків обох країн це означає розширення колоніальних програм у глибинці Алжиру.\n\nОднак імперії діють як імперії, і конкуренція між колоніальними програмами природно веде до прямого конфлікту. Намагання уникнути повернення до колоніальних воєн вікторіанської епохи, іберійське керівництво вийшло за межі очікувань і запропонувало зустріч двох середземноморських потуг для обговорення майбутнього Алжиру. Італійці, своєю чергою, охоче погодились на таку можливість, щоб "підтвердити відданість Італії мирному та співпраці середземномор'ю".\n\nПам'ятаючи ще про Мальту, успіх цієї конференції зовсім не гарантований. У Мадриді та Римі провідні консерватори бажають показати силу і військово вигнати Алжир з рук суперника. Для багатьох спостерігачів поточна "Пальма Конференція" є просто перевернутим гвинтом Чехова: помилкова відволікаюча маневра перед тим, як конфлікт перейде до зубів і кровавих кулаків. Однак на самій Мальорці надія все ще жива, коли італійці та іберійці потискають руки і укладають угоди — одна зі сторін пропонує конструктивні плани для розвитку держави, а інша їх ретельно розглядає, і здається, що угода про спільне правління майже досягнута.\n\nПопри патріотичні та песимістичні заперечення, дзвони Ла Сеу, здається, звучать для миру, а не для війни. Провідні кореспонденти політики виглядають оптимістичними, що це серйозне свідчення лібералізації режимів з обох боків Балеарського моря. Можливо, з часом демократія повернеться до справедливої Європи."
 ILG.5.a:0 "Мир завжди був можливістю!"

 ILG.6.t:0 "Пальма Конференція"
 ILG.6.d:0 "Провівши останні кілька тижнів у запеклій комунікації з ПНФ у Римі, іберійцями в Мадриді та Лісабоні та своєю мережею союзників і помічників по обидва боки алжирського кордону, Пальма Конференція стала справжнім тріумфом для Маріо Піраньї.\n\nЗавжди втомлений перед зустрічами з аудиторією, він провів останні кілька годин до початку конференції, змінюючи свою промову, з якою мав почати, стоячи поруч з португальським послом Альберто Морейрою. Двоє чоловіків створили відмінне робоче партнерство, яке змогло, всупереч усім шансам, запобігти можливій руйнівній війні, яка могла б знищити активи та інвестиції обох націй в Алжирі. Тепер, проходячи повз різні делегації, які Італія та Іберія надіслали для представлення своїх інтересів, він кинув короткий знак рідній алжирській місії — з якою він сам допомагав вести переговори, — і маленьку посмішку групі представників ENI, що сиділа нижче делегації ПНФ, демонструючи, наскільки далеко зайшло вплив компанії завдяки її зусиллям сприяти миру та співпраці між Римом, Мадридом та Лісабоном, що тепер стало успішним.\n\nЙого робота була далеко не завершена. Вона, врешті-решт, лише починалася. Але коли він піднявся до подіуму і почав дякувати присутнім за те, що зробили цей шлях, він не міг не відчути, як його груди наповнюються гордістю: Війна була майже уникнута, і це не в останню чергу завдяки його власній праці."
 ILG.6.a:0 "Дами та панове, ласкаво просимо до Пальми."

 ILG.7.t:0 "Іберійський Алжир здається!"
 ILG.7.d:0 "Через кров, піт і сльози корінних і італійських сил ми перемогли Іберію!\n\nЗ італійсько-алжирськими військами, що марширували через Оран, а також втратою контролю над більшістю алжирської пустелі, Іберія прийняла поразку. Вона змушена була домовитися про те, щоб усі територіальні володіння іберійського Алжиру були офіційно передані нашій військовій адміністрації, і, не маючи іншого виходу, іберійсько-алжирський губернатор Хорхе Жардім змушений був повернутися до Іберії.\n\nОднак ми змушені прийняти важке рішення: щоб хоч якось стабілізувати країну, охоплену війною, нам доведеться припинити існуючий військовий уряд і замінити його на більш постійну політичну систему, яка, сподіваємося, зможе підтримувати стабільність і тривалий мир.\n\nМи могли б виконати наші обіцянки автономії алжирському народу та створити Алжирську Республіку, яку очолюватиме голова FLN Ферхат Аббат. Ця держава, хоча й близька до Риму, буде демократичною нацією, незалежною від прямого італійського втручання. Хоча ми й поступимося здатністю безпосередньо домінувати в Алжирі, новостворена країна залишатиметься в нашій сфері впливу, що дозволить нам зберегти значний вплив на регіон.\n\nАльтернативно, ми можемо відмовитися від нашої обіцянки і створити алжирську маріонеткову державу під прямим наглядом місцевого політика Саїда Боуалама. Така держава залишатиметься фактично частиною нашої імперії і служитиме корисним розмінним монетою у переговорах з Французькою Державою, а також надасть розширений прямий фронт із Іберійським Союзом у разі подальшої агресії. Однак Боуалам користується великою непопулярністю серед населення через свої антинезалежницькі настрої, і такий крок може спричинити спалахи насильства між чинним урядом і місцевими людьми.\n\nМайбутнє Алжиру в наших руках, яке ж рішення ми приймемо?"
 ILG.7.a:0 "Алжир залишатиметься під нашим прямим контролем."
 ILG.7.b:0 "Ми повинні виконати нашу обіцянку алжирському народу."

 ILG.8.t:0 "Народження Алжирського Мандату"
 ILG.8.d:0 ""Ну що ж," — сказав Піраньї, сповнений надії в його голосі, "ми досягли взаємної угоди?" Конференція тривала вже кілька годин, відзначаючись періодами поступок, підтверджень та загальної втоми. Іберійський дипломат на мить опустив погляд, швидко повернувши його до Піраньї та решти італійської делегації.\n\n"Мабуть, так." Залунали кілька стриманих, але все ж чутних зітхань по всьому просторому залу. "Ми хочемо обговорити деякі деталі, звісно, але так, ці умови нам підходять."\n\nНовина про успіх конференції швидко досягла Дуче; як йому пояснили кілька днів тому, запропонований план передбачав спільне правління Алжиру за дуальним мандатом. Замість того, щоб підтримувати невизначені кордони між різними зонами окупації, іберійські та італійські війська разом підтримували б мир, при цьому в Алжирі будувалася б функціонуюча демократична держава, що представляє як корінних, так і осілих жителів країни. Це вигідний результат, зауважив Дуче. Хоча існувала реальна можливість перемогти у війні, яка здавалася такою неминучою лише нещодавно, ані регіон, ані передбачуваний громадський осуд війни не робили її вартою, чи то в короткостроковій, чи в довгостроковій перспективі.\n\nУ будь-якому випадку, Алжир уникнув жаху війни, але йому все ще загрожує тривожне майбутнє. Якщо Іберія чи Італія вирішать вивести свої війська з території, Дуче знав, що залишившася країна змушена буде вибирати між витратами значних ресурсів на її утримання чи, у свою чергу, залишити Алжир зовсім. Тим не менш, сьогодні вся Італія може насолоджуватися тріумфом миру."
 ILG.8.a:0 "Найкращий можливий варіант."

