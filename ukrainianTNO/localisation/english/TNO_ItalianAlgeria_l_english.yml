 #Початкові ідеї#
 ILG_Wild_Frontier:0 "Дикий фронтир"
 ILG_Wild_Frontier_desc:0 "Як неофіційна військова територія на де-юре французьких землях, ми не отримуємо великої уваги з боку Риму. Це фактично зробило нас безпорадними й непотрібними, і наша єдина надія на виживання - допомога від італійських братів."

 ILG_Unofficial_Italian_Settlement:0 "Неофіційне італійське заселення"
 ILG_Unofficial_Italian_Settlement_desc:0 "Оскільки ця територія придатна для заселення, багато бідних італійців емігрували в надіях отримати землю. Безсумнівно, масова імміграція італійців лише погіршить наші проблеми через слабкий контроль над регіоном."

 ILG_Saharan_Bandits_Prevalent:0 "Розгул бандитизму"
 ILG_Saharan_Bandits_Prevalent_desc:0 "Обмежена військова присутність і нестача людських ресурсів призводять до постійних нападів бандитів на наші конвої та грабунків поселень. Проте ситуація загострюється, оскільки злиденні корінні мешканці приєднуються до бандитських угруповань у надії вибратися з бідності, що ще більше ускладнює італійський контроль."

 #Події#
 ILG.1.t:0 "Заклик із Риму"
 ILG.1.d:0 "Оточений половиною десятка найбільш довірених помічників та підлеглих, генерал важко зітхнув, а потім повернувся до численних карт і діаграм, що покривали великий стіл посеред звичайної в усьому іншому кімнати для зустрічей. Часу для підготовки баз до прибуття нових військ, офіцерів та добровольців було обмаль, тому більшість зустрічей і все їхнє перебування було в непривабливих військових складах, що хоча б пропонували втечу від пекельної спеки пустелі.\n\nЩодо заклику, значний алжирський гарнізон здебільшого був покинутий на боротьбу з арабами, п'єр-нуарцями та власними командирами, які, у свою чергу, намагалися звільнити ресурси для більш продуктивних театрів. Насправді, деякі з присутніх були все ще зайняті тактичними підрозділами та партизанськими методами боротьби, явно не усвідомлюючи, що кампанія, яку вони нині розробляли, стане найбільшою з часів Другої світової війни.\n\nДжузеппе сам заробив свої відзнаки на війні в старій Югославії, і був готовий заплющити очі на деяку наївність своїх підлеглих. І все ж, коли обговорення почало все більше переходити до теоретичних дебатів, він вгледів необхідність втручатися.\n\n"Це не справа цього чи того проходу. Це не конфлікт розбірок і селищ. Це битва. Битва за міста, залізниці й волю. Дуче оголосив, що Алжир буде полем бою, і я маю намір принести йому перемогу. Іспанці будуть шкодувати того дня, коли вони вперше поглянули через свій проклятий бік кордону й подумали, що побачили можливість, і якщо вони цього не зроблять, то я особисто прийму їхню капітуляцію в порті Касабланки. Ви тут, щоб виконати свою частину у вічному поході нашої Імперії, чи не так?""
 ILG.1.a:0 "Гілку оливи змарновано."

 ILG.2.t:0 "Пропозиція, від якої неможливо відмовитися"
 ILG.2.d:0 "Мохамед Будіаф не був особливо лякаючим персонажем - чоловік був одягнений у західний костюм, і сторонній, який зустрівся би з ним, міг би використати слово 'вишуканий', щоб описати його характер. Але вишуканості самої по собі недостатньо в світі дипломатії. Місцеві були не просто на межі, а перебували між двома лезами ножиць.\n\nЗустріч була організована дуже швидко, і двоє чоловіків зараз сиділи в просторій вітальні десь на південь від Константіни. Швидко переходячи на французьку як спільну мову, італійські переговори з алжирським ФНВ почалися. Лише через декілька годин, амбіції Італії не досягли значного прогресу.\n\n"Ось. Ось у нас є незаперечні докази серії репресій, які іберійці провели в східних провінціях. Італія пропонує всі свої співчуття і лише просить, щоб-"\n\n"Італійські гарнізони вбили шістнадцять наших людей цього тижня. Тридцять цивільних поховали тільки цього місяця, ми не хочемо чути співчуття."\n\n"І..." - чоловік продовжив, намагаючись зберегти впевненість, яка вже почала танути. "І лише просить, щоб ми могли довести свою відданість алжирській справі, запропонувавши новий пакет реформ."\n\n"Французи пробували реформи." - відповів революціонер.\n\nМинули дні, аби досягти угоди. Угода, яка на папері надавала Алжиру незначні репарації та значну автономію. Це було справжнім даром, що Рим не мав наміру дотримуватися порожніх слів, написаних на безглуздому папері."
 ILG.2.a:0 "Отримано розпорядження."

 ILG.3.t:0 "Іберія нападає!"
 ILG.3.d:0 "Неминуче сталося: після короткого періоду повної дипломатичної тиші з боку Іберійського Алжиру, озброєні ополчення були помічені на кордоні в Кабілії, Туґурті, Адрарі та кількох інших районах уздовж італійського кордону. Хоча війна офіційно не була оголошена жодною зі сторін, одне було зрозуміло: Іберія почала військову наступальну операцію прямо в Італійський Алжир.\n\nПісля того, як про ситуацію стало відомо, перша реакція з материкової Італії була розчаровуюче не тривожною - невиразні обіцянки про додаткові поставки обладнання та людей, а іноді й лише слова підтримки. Невідомо, чи зможуть наші вимоги на підкріплення успішно пройти через напружену політичну ситуацію в Римі, і якщо материк вирішить, що витрати на утримання Алжиру занадто великі - є ймовірність, що ми можемо залишитися без будь-якої додаткової допомоги від Італії на решту війни. Додаючи до наших труднощів, цей конфлікт, безумовно, загострить наші вже серйозні проблеми з бандитизмом; оскільки все більше й більше наших сил безпеки будуть спрямовані на іберійському фронті, а значна частина наших уже обмежених постачань буде втрачена в пекельній алжирській пустелі, бандитські загони можуть знайти легкі можливості для нападу на конвої, що ще більше ускладнить наше постачання.\n\nУ будь-якому випадку, усі наші теперішні військові сили починають мобілізуватися, і ми залучимо всі наявні ополчення. Як тільки наші кілька оперативних літаків піднімуться в повітря, а розрізнені загони місцевих підрозділів почнуть свій шлях крізь алжирську пустелю, багато хто задається питанням, чи зможемо ми насправді провести наступ на іберійськмй військовий уряд, щоб вигнати їх із Алжиру повністю, а в разі невдачі, чи зможемо ми взагалі відбити майбутній іберійський напад. Незважаючи на все, битва за Алжир розпочалася."
 ILG.3.a:0 "Ми повинні відбити напад іберійців!"

 ILG.4.t:0 "Заклик із Риму"
 ILG.4.d:0 "Лише кілька годин попередження дало Маріо Піраньї час, необхідний для підготовки до дзвінка.\n\nМаттеї завжди жартував, що якщо Дуче одного дня зайде до його офісу і попросить вшанувати його за ввічливістю, то ENI закриють того ж дня. Відтоді Маріо зрозумів, у який свинарник перетворилася італійська політика, і мав більше ніж достатньо зраджених товаришів, аби вони марилися йому все життя.\n\nАле навіть через усі ці роки дзвінок від НФП - а це все ще була НФП, незалежно від того, як Чіано намагався її називати - усе одно залишив неприємний присмак у роті.\n\nОтримавши інформацію від одного зі своїх людей у міністерстві, голова ENI очікував дзвінка й заздалегідь підготувався. Якщо знання справді є силою, то йому потрібна була вся його міць, щоб подолати новий рівень безглуздя, який охопив уряд останнім часом: війна прокотиться повз і знищить усе, над чим ENI працювало останнє десятиліття, і він був не єдиним, хто так думав. У Іберії кожен інвестор, який має голову на плечах, так само війчайдушно, як і він, благав уникнення конфлікту.\n\nТочно підбираючи свої слова й проводячи підтвердження з різними зв'язками в Лісабоні та Алжирі, Піраньї готувався до випробування, яке його чекало. Його тема, як він вирішив, буде одним словом, яке і диктатори, і пси війни зможуть зрозуміти та повністю сприйняти.\n\nКоли телефон подзвонив, він відповів із усмішкою.\n\n"Я не говорю про мир, ні. Я не бажаю піддати Італію приниженням відмови від війни." Він відкинувся на спинку, "Про що я говорю, дорогий пане, так це про прибуток.""
 ILG.4.a:0 "...А Алжир є можливістю, якої немає більше ніде."

 ILG.5.t:0 "Пальмська конференція"
 ILG.5.d:0 "
 
ПАЛЬМА ДЕ МАЛЬЙОРКА, РЕЙТЕРС\n\nІспанське сонце сьогодні зігрівало символічну білу голубку, коли італійські та іберійські дипломати зустрілися на острові Мальйорка, щоб обговорити поточну напругу в Алжирі. Хоча країна де-юре є французькою колонією, де-факто правлінням цієї африканської країни займаються Італія на сході та Іберія на заході, із часів закінчення Другої світової війни. Після падіння Тріумвірату - як Італія, так і Іберійська Федерація, намагаються розширити свої відповідні сфери впливу, а для провідних політиків обох країн це означає розширення колоніальних програм у глибині Алжиру.\n\nОднак імперії діють, як імперії, і конкуренція між колоніальними програмами природно веде до прямого конфлікту. Намагаючись уникнути повернення до колоніальних воєн вікторіанської епохи, іберійське керівництво вийшло за межі очікувань і запропонувало зустріч двох середземноморських лідерів для обговорення майбутнього Алжиру. У свою чергу італійці охоче погодились на таку можливість, аби "підтвердити відданість Італії мирному та співпрацюючому Середземномор'ю".\n\nЗі все ще незабутими спогадами про Мальту, успіх цієї конференції зовсім не гарантований. У Мадриді та Римі провідні консерватори бажають показати силу й вибороти Алжир із рук суперника військовим шляхом. Для багатьох спостерігачів поточна "Пальмська конференція" є всього лиш оберненою рушницею Чєхова: помилковий відволікаючий маневр перед тим, як конфлікт перейде до вибитих зубів і кривавих кулаків. Однак на самій Пальма де Мальйорці надія все ще жива, як італійці та іберійці потискають руки й укладають угоди - одна зі сторін пропонує конструктивні плани для розвитку держави, а інша їх ретельно розглядає, і здається, що угода про спільне правління майже досягнута.\n\nПопри патріотичні та песимістичні заперечення, дзвони Ла-Сеу, здається, звучать для миру, а не для війни. Провідні політичні кореспонденти виглядають оптимістичними на рахунок того, що це серйозне свідчення лібералізації режимів із обох боків Балеарського моря. Можливо, із часом демократія повернеться до справедливої Європи."
 ILG.5.a:0 "Мир завжди був можливістю!"

 ILG.6.t:0 "Пальмська конференція"
 ILG.6.d:0 "Провівши останні кілька тижнів у запеклій полеміці з НФП у Римі, іберійцями в Мадриді та Лісабоні й своєю мережею союзників і помічників по обидва боки алжирського кордону, Пальмська конференція стала справжнім тріумфом для Маріо Піраньї.\n\nЗавжди втомлений перед зустрічами з аудиторією, він провів останні кілька годин до початку конференції змінюючи свою промову, із якою мав її почати, стоячи поруч із португальським послом Альберто Морейрою. Ці двоє чоловіків створили відмінне робоче партнерство, яке змогло, усупереч усім шансам, запобігти можливій руйнівній війні, що могла б знищити активи та інвестиції обох країн у Алжирі. Тепер, проходячи повз різні делегації, які Італія та Іберія надіслали для представлення своїх інтересів, він кинув короткий знак алжирській корінній місії - із якою він сам допомагав вести переговори, - і крихітну посмішку групі представників ENI, що сиділа на ряд нижче делегації НФП, демонструючи, наскільки далеко зайшов вплив компанії завдяки її зусиллям сприяти миру та співпраці між Римом, Мадридом та Лісабоном, що тепер стали успішними.\n\nЙого робота далеко не була завершеною. Це був, врешті-решт, лише початок. Але коли ця людина піднялася до подіуму й почала дякувати присутнім за те, що пройшли цей шлях, він не міг не відчути, як його груди наповнюються гордістю: війна була майже уникнута, і не в останню чергу завдяки його власній праці."
 ILG.6.a:0 "Дами та панове, ласкаво просимо до Пальми."

 ILG.7.t:0 "Іберійський Алжир здається!"
 ILG.7.d:0 "
 
 Крізь кров, піт і сльози корінних та італійських сил, ми перемогли Іберію!\n\nІз італійсько-алжирськими військами, що марширували через Оран, а також втратою контролю над більшістю алжирської пустелі, Іберія прийняла поразку. Вона змушена була домовитися про те, аби всі територіальні володіння Іберійського Алжиру були офіційно передані нашій військовій адміністрації, і, не маючи іншого виходу, іберійсько-алжирський губернатор Жорже Жардін змушений був повернутися до Іберії.\n\nОднак ми вимушені прийняти важке рішення: задля хоч якоїсь стабілізації країни, охопленої війною, нам доведеться розпустити існуючий військовий уряд і замінити його на більш постійну політичну систему, яка, сподіваємося, зможе підтримувати стабільність й тривалий мир.\n\nМи могли б виконати наші обіцянки автономії алжирському народові та створити Алжирську республіку, яку очолюватиме голова ФНВ Фергат Аббат. Ця держава, хоча й близька до Риму, буде демократичною нацією, незалежною від прямого італійського втручання. Хоча ми й поступимося здатністю безпосередньо домінувати в Алжирі, новостворена країна залишатиметься в нашій політичній сфері, що дозволить нам зберегти значний вплив на регіон.\n\nАльтернативно ми можемо відмовитися від нашої обіцянки й створити алжирську маріонеткову державу, під прямим наглядом місцевого політика Саїда Буалама. Така держава залишатиметься фактично частиною нашої імперії й служитиме корисною розмінною монетою в переговорах із Французькою державою, а також надасть розширений прямий фронт із Іберійським союзом у разі подальшої агресії. Однак Буалам користується великою непопулярністю серед населення через свою позицію проти незалежності, і такий крок може спричинити спалахи насильства між чинним урядом і корінним населенням.\n\nМайбутнє Алжиру в наших руках, яке ж рішення ми приймемо?"
 ILG.7.a:0 "Алжир залишатиметься під нашим прямим контролем."
 ILG.7.b:0 "Ми повинні виконати нашу обіцянку алжирському народові."

 ILG.8.t:0 "Народження Алжирського мандату"
 ILG.8.d:0 "
 
"Ну що ж," - сказав Піраньї, сповнений надії в його голосі, "ми досягли взаємної угоди?". Конференція тривала вже кілька годин, відзначаючись періодами поступок, підтверджень та загальної втоми. Іберійський дипломат на мить опустив погляд, швидко повернувши його до Піраньї й решти італійської делегації.\n\n"Гадаю, що так." Залунали кілька стриманих, але все ж чутних зітхань по всьому просторому залу. "Звісно, ми бажаємо обговорити деякі деталі, але так, ці умови нам підходять."\n\nНовина про успіх конференції швидко досягла Дуче; як йому пояснили кілька днів тому, запропонований план передбачав спільне правління Алжиру за подвійним мандатом. Замість того, аби підтримувати невизначені кордони між різними зонами окупації, іберійські та італійські війська разом підтримували б мир, при цьому в Алжирі будувалася б працююча демократична держава, що представлятиме як корінних жителів країни, так і поселенців. Це вигідний результат, зауважив Дуче. Хоча існувала реальна можливість перемогти в війні, яка здавалася такою неминучою лише нещодавно - ані регіон, ані передбачуваний громадський осуд війни не робили її вартою, чи то в короткостроковій, чи в довгостроковій перспективі.\n\nУ будь-якому випадку, Алжир уникнув жаху війни, але йому все ще загрожує тривожне майбутнє. Якщо Іберія чи Італія вирішать вивести свої війська з території, Дуче знав, що одна з країн буде змушеною обирати або між витратами значних ресурсів на її утримання, або ж наслідувати прикладу й покинути Алжир зовсім. Тим не менш, сьогодні вся Італія може насолоджуватися тріумфом миру."
 ILG.8.a:0 "Найкращий можливий варіант."

