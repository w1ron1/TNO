 #Опис Лідера#
 POLITICS_GIUSEPPE_CASTELLANO_DESC:0 "Генерал Джузеппе Кастеллано — один з найпомітніших об'єктів пліток серед вищих кіл Регіо Есерсіто. Ветеран двох світових воєн, він служив з відзнакою на Балканах під час останньої Світової війни, перш ніж піднятися в рядах італійського вищого командування. Амбіції Кастеллано сягали височини, але доля мала інші плани — кілька років після закінчення війни новий Дуче, Ґалеаццо Чіано, доручив Кастеллано стежити за беззаконним алжирським кордоном.\n\nКастеллано вже кілька років є головою Алжирської військової території, але його лідерство не принесло значних результатів у виправленні ситуації в регіоні. Італійські поселенці, в основному з Сицилії та часто пов'язані з старими мафіозними родинами, були залучені Алжиром, оскільки регіон сприймався як такий, що знаходиться далеко від пильного ока влади в Римі. Поселенські анклави тепер усіяли алжирський ландшафт, і ходять чутки щодо справжнього ступеня зв'язків Кастеллано з мафією; нестабільність лише посилюється через рішення Риму підтримати корінні алжирські міліції, такі як Фронт національного визволення (ФЛН), у їхній збройній боротьбі проти вторгнення іберійських властей та їхніх союзників — пієднуарів.\n\nГенерал-губернатор, залишений в Алжирі та наданий дуже обмежені ресурси для виконання своїх обов'язків, здебільшого був змушений сидіти й спостерігати, як ситуація втікає від нього. Однак з відновленням напруженості в Тріумвіраті, незабаром Алжир та Кастеллано можуть знову опинитися в центрі уваги. Коли це трапиться, можливо, Кастеллано отримає свій шанс реабілітуватися в очах Італії — від генерала, що керує віддаленим куточком імперії через сумнівні угоди та закулісні переговори, до героя нації, який врятував її кордони від численних ворогів."
