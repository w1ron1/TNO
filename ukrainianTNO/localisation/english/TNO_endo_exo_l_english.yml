l_english:
  
 TNO_exonym_button: "§YПеремикач ендонімів/екзонімів§!\nПоточне налаштування: §DЕкзоніми/англійські назви§!"
 TNO_endonym_button: "§YПеремикач ендонімів/екзонімів§!\nПоточне налаштування: §DEндоніми/місцеві назви§!"
 TNO_default_button: "§YПеремикач ендонімів/екзонімів§!\nПоточне налаштування: §DТипове§!"
 TNO_endo_exo_info: "§YЕндонім-екзонім§!, або скорочено §YЕндо-Екзо§!, — це функція, яка дозволяє гравцеві налаштувати мову(-и), що використовуються для відображення назв §Dлокацій§! на всій карті світу. Функція також динамічно змінює назву локації залежно від її поточного власника або якщо відбувається певний сценарій.\n\nСистема §YЕндо-Екзо§! також повністю сумісна із системою §YАдміністративних одиниць§!, яку можна знайти праворуч в інтерфейсі вибраного регіону."