 ##Ideas##
 #########
 INS_IKKC: "IKKC"
 INS_IKKC_desc: "Після закінчення Великої Східноазіатської війни система військової мобілізації індонезійської праці була офіційно припинена. На практиці створення Індонезійського економічного розвитку (Indonesia Keizai Kaihatsucho - IKKC) або Індонезійської економічної розвивальної адміністрації, узаконило домовленість, за якою індонезійська праця 'компенсувалась' за роботу на японські компанії, які працюють на розвиток нації Індонезія.\n\nНа практиці ця компенсація є смішною копійкою, і все більше здається, що плоди розвитку накопичуються виключно для IKKC та його власників. Чим більше речі змінюються, тим більше вони залишаються тими ж самими."
 INS_Dwitungal: "Двітунгал"
 INS_Dwitungal_desc: "\"Підписано від імені народу Індонезії, Сукарно та Хатта.\"\n\nЦі слова позначають кінець Прокламації Незалежності: коротка, загальна заява, яку підтримували всі верстви індонезійського суспільства. Характер і воля мільйонів індонезійців представляються двома людьми, Двітунгал - двовладдя президента Сукарно та його віце-президента Мохаммада Хатти. Палкий сільський месія Сукарно, охолоджений прохолодним, космополітичним інтелектуалом Хаттою, утворюють пару лідерів, які працюють на благо Індонезії. Це зв'язок, міцний і незламний, що не буде підкорений часом.\n\n§VАле.§!"
 INS_Eight_Years_Development_Plan: "План розвитку на вісім років"
 INS_Eight_Years_Development_Plan_desc: "Мета уряду повинна полягати в тому, щоб виховати наступне покоління, яке зможе взяти на себе розвиток країни, побудувавши на її основах, а її цивільний апарат стане авангардом розвитку та будівництва. Так вважає один з технократів, який зараз очолює стабільні уряди Індонезії, Джуанда Картавіджая.\n\nМасштаб. Автентичність. Прискорення. Це основні принципи нового плану Джуанди, або більш офіційно - Універсальної схеми розвитку. Розширення важкої промисловості, мегапроекти інфраструктури, величезні дамби та неймовірні дороги, всі ці амбітні проекти включені в цей план, фінансовані Японією, звісно. Коли план вступає у свій другий рік, багато хто сумнівається, чи досягне цей план успіху."
 INS_The_Banteng_And_The_White_Crescent: "Бантенг і Білий півмісяць"
 INS_The_Banteng_And_The_White_Crescent_desc: "Хоча пропаганда може стверджувати протилежне, основна спадщина Японії в Індонезії - це не надання нації незалежності, а фактично двопартійна система, створена нею. Ця аномалія не була вигадана з доброти, а з метою стабільності, бажання зберегти існування Верховної ісламської ради та налагодити позитивні стосунки між Сукарно та Хаттою.\n\nПартії, домінуючі у ПНІ та ПРМ, довели свою здатність виживати, незважаючи на те, що це не задовольняє більшість на передовій політики Індонезії. Натомість це вважається шрамом японського колоніалізму, вічним спогадом про тих чоловіків, які ступили на їхні береги."
 INS_A_Nation_Of_18000_Islands: "Нація 18 000 островів"
 INS_A_Nation_Of_18000_Islands_desc: "Концепція Індонезії була змінною ідеєю з моменту її виникнення на початку 20-го століття. Романтичні інтелектуали і ідеалісти ранньої нації довго обговорювали, чи повинна Індонезія бути частиною Малайю Рая, окремою концепцією або різними іншими варіантами, які намагались дати етнічно, релігійно та лінгвістично різноманітному регіону, який ніколи не був єдиним у своєму повному складі.\n\nПроте прихід Японії і стимулювання індонезійського націоналізму для полегшення тягаря окупації все ж таки закріпило концепцію Індонезії як монолітної сутності - унітарної держави під однією конституцією, і на початковому етапі - однією національною партією, зв'язаною цивільним націоналізмом на основі спільного досвіду всіх, хто жив під гнітом і підкоренням голландського колоніального правління.\n\nЗ часу здобуття незалежності в 1949 році молода нація намагається подолати ці суперечливі ідеї такої монолітної системи, накладеної на різноманітне населення. Японці зосередили адміністративне та економічне розширення на центральному острові Яві. Це принесло жорстокі дивіденди завдяки присутності японських корпорацій і видобутку, але багато хто відчуває тертя через непоступливість і тотальність системи, нав'язаної Японією, вважаючи це зрадою того, що задумали засновники нації всього п'ятдесят років тому - і рано чи пізно одна зі сторін повинна поступитися іншій."
 INS_Three_Militaries_One_Destiny: "Три армії, одна доля"
 INS_Three_Militaries_One_Destiny_desc: "Збройні сили Індонезії куцають вперед, незважаючи, а не завдяки, злиттю, яке створило їх в реальності. Їхня історія різноманітна, оскільки вони складаються з різних військових доктрин, структур і офіцерських корпусів.\n\nТри колишні армії, які тепер складають її основу, це KNIL - стара голландська колоніальна сила, PETA та Гіюгун - японські створені добровольчі армії з Яви та Суматри відповідно. Тепер з'єднані спільною долею, вони борються за своє нове завтра, Індонезію під сонцем."
 INS_The_Year_of_Living_Dangerously: "Рік, коли живемо небезпечно"
 INS_The_Year_of_Living_Dangerously_desc: "Час, щоб Індонезія показала світу, що вона є нацією з незламною волею та стійкістю. Час мобілізувати наші сили - не тільки в тілі та числі, але й у дусі - проти бунтівників, які розливають таку непристойність на нашу Батьківщину. Кожен, включаючи молодь, повинен зробити свій внесок у справу нації. Не звертайте увагу на тих, хто критикує нас за 'відпускання банд озброєних молодих людей' в Індонезії, ми переможемо."
 INS_On_Land_Sea_and_Air: "На землі, на морі і в повітрі"
 INS_On_Land_Sea_and_Air_desc: "Здобувши лояльність ВМС, морської піхоти KKO, Повітряних сил та стратегічного резерву армії (KOSTRAD), Сукарно тепер має вірних людей на землі, в морі та в повітрі. Незважаючи на те, наскільки віддані і готові померти за справу, відкривається все більше фронтів, що залишає доступні професійні війська Сукарно розподіленими все більше."
 INS_Tokyos_Lifeline: "Життєва лінія Токіо"
 INS_Tokyos_Lifeline_desc: "У часи війни та криз, претензії на стандарти повинні також поступатися перед невідворотньою небезпекою. Незважаючи на всі зусилля Сукарно націоналізувати важливі японські корпорації та субсидії, які постачають ресурси на домашні острови, жоден інший кандидат не готовий підтримати Токіо в будь-якому вигляді. Зважаючи на цю нещасну ситуацію, обранець Японії - це чоловік, якого вони ненавидять, але якого також повинні підтримувати."

 #INS Війна
 indonesia.100.t:0 "Початок громадянської війни!"
 indonesia.100.desc:0 "Сукарно не був зовсім упевнений, яке саме рішення привело його до того, що він стояв на балконі, дивлячись на розлючену натовп. Напевно, був момент, коли Сукарно збився з шляху і продовжував робити помилки в своїх рішеннях. Він згадував, що колись сказав Хатта, його лист про відставку все ще був у його кишені. 'Ти заблукав у лісі влади і втратив свій шлях.' Ось воно, так? Все почалося, коли Сукарно переступив межі своїх повноважень? Протягом усього шляху він боявся, що не йде досить далеко, але ось він, стоячи в своєму офісі, дивився, як його люди беруться за зброю проти нього.\n\nНасутіон і Сухарто вже зібрали свої армії і кричали накази в радіостанції, а пости по всьому архіпелагу готувалися до облоги. Він дивився на своє палаюче місто і відчував, що повинен прийти до якогось великого усвідомлення, він відчував, що Сукарно повинен був щось зрозуміти, але ні, Сукарно був твердо переконаний у своїх поглядах більше, ніж коли-небудь. Це була політика, що відняла його від життя розкоші, це була ідеологія, що зробить вулиці червоними від крові. І тоді Сукарно більше не відчував жалості до Хатти, людини, яка забрала все у нього. Тепер не було часу на жалощі, лише на справедливість."
 indonesia.100.a:0 "Справедливість для Сукарно!"
 indonesia.100.b:0 "Справедливість для народу!"

 #нові події для бургерленду#
  usindoflavor.1.t:0 "Дух старого часу"
  usindoflavor.1.d:0 ""Знаєте, сержанте, я був тут тоді," - сказав капітан сержанту поруч, не відриваючи погляду від безкрайого океану.\n\n"Під час чого, сер?"\n\n"Коли вони розбомбили це місто," відповів 52-річний капітан Кеннет Грін, так і не зрушивши погляд з моря біля Дарвіна, "Я насправді думав, що за мною підуть війська, коли я ховався від бомб," продовжив Грін. Легка, але гнітюча прохолода вітру супроводжувалася оглушаючою тишею між двома чоловіками.\n\n"Сер, перепрошую, ми знову вдячні вам за волонтерство на цій місії, але якщо ви-"\n\n"Але якщо я що? Сержанте?" - капітан відірвав погляд від моря, і його очі зустріли очі сержанта, коли він підвищив голос з глибоким австралійським акцентом: "Якщо я надто боягузливий для цього завдання? Ви, янкі, попросили волонтера, і ось цього старого дурня ви й отримали!" Грін намагався заспокоїтися, але не зміг, і продовжував своє люте обурення, "Я особисто подбаю про те, щоб кулі з цих гвинтівок зустріли японську голову!"\n\n"Будь ласка, сер, заспокойтесь!" Сержант панічно оглядав порожні доки, "Ви зіпсуєте місію!" Грін погодився, але все ще був розлючений, що сержант сумнівається в його рішучості.\n\n"Вибачте, Грін, так?" - сказав капітан, знову дивлячись на горизонт.\n\nСержант знизив голову, задумавшись, і пішов від краю причалу, залишивши старого чоловіка наодинці з ревучим морем."
  usindoflavor.1.a:0 "Минуще минуле має особливий спосіб переслідувати людей."
  usindoflavor.2.t:0 "Дух молодих"
  usindoflavor.2.d:0 "Вітер посилився з учорашнього дня. Хвилі моря ревіли на слабко освітленому причалі перед світанком. Це було наче звуки пострілів і ударів артилерії розходилися по океану, досягаючи Дарвіна, де вони стояли. Сім чоловіків згадали про кровопролиття, що відбувалося на тому боці моря.\n\n"Ось, джентльмени, тут ми будемо страждати від морської хвороби наступні три тижні," - напівжартівливо презентував палубу корабля сержант своїм солдатам, призначеним охороняти судно, на якому контрабандою доставлялися зброя для індонезійських повстанців на Борнео.\n\n"Чорт, я отримаю морську хворобу, чи не так?" - пробурмотів солдат Роберт Стівенс Доу, заходячи на борт.\n\n"Розслабся, товаришу, як тільки звикнеш, нічого не відчуєш!" - відповів чоловік позаду нього, слідуючи за ним.\n\n"Так, ти не відчуєш нічого, поки не викинеш свої кишки," - насмішкувато сказав чоловік попереду, спершись своєю гвинтівкою M1 на одну з коробок на палубі. Група розсміялась, навіть сержант не зміг стриматися від сміху. Це мало сенс, Доу ще ніколи не був у активних бойових діях, і уявлення про морську хворобу не заспокоювало його.\n\n"Гей, солдат," - покликав сержант засмученого Доу, - "Не переживай, це просто звичайне завдання. Більшість кораблів, які йшли, благополучно дісталися до іншого берега, не дозволяй іншим нервувати тебе." Він намагався заспокоїти солдата.\n\n"Більшість, сер?" - спитав він. - "Це ж не звичайна місія. Серед океану немає куди втекти, якщо щось піде не так."\n\n"Тоді не будемо тікати, солдате," - сержант заспокоїв Доу, - "Пам'ятай свою підготовку, вона допоможе тобі, коли це буде потрібно." Це було дивно, подумав Доу, що сержант поводиться з ним м'якше, ніж під час тренувань. Ну, це ж не тренування, в кінці кінців."
  usindoflavor.2.a:0 ""Гей, сонце сходить, нам треба відпочити.""
  usindoflavor.3.t:0 "Десятий день"
  usindoflavor.3.d:0 "Корабель увійшов у води Індонезії кілька днів тому, але навколо не було нічого, окрім маленьких, пустельних островів, що складають знамените 17 000-острівне національне утворення. Ніч накривала все темною ковдрою, і вигляд у далечінь був схожий на погляд у безодню тієї безмісячної ночі.\n\n"Ви часто робите такі поїздки?" - спитав Доу капітана, що стояв на кермі корабля.\n\n"Ну, ні. Напевно, рік пройшов, як я вийшов у море. Насправді це досить освіжаюче, якщо не думати про те, що відбувається на цих островах," - капітан з відразою зітхнув, вимовляючи останнє речення. Доу жестом намагався задати ще одне питання.\n\n"О, давай, синку, не роби так," - капітан перебив його, - "кожного разу, коли ти так дивишся, це нагадує мені про мого сина."\n\n"Гех," - посміхнувся Доу, - "У тебе є син, старий?" Кілька секунд тиші, і старий чоловік відповів: "Так, є. Йому стільки ж років, як і тобі, може, трохи грубіший, але якби ви познайомились, ви б стали нерозлучними."\n\n"Де ж він зараз, твій син?" - продовжив солдат, помітивши похмуре обличчя капітана.\n\n"Чорт, перестань мене турбувати, я маю роботу," - капітан зніяковів від його слів.\n\n"Вибачте, сер, не хотів образити," - відповів Доу, вибачаючись.\n\n"О, подивися на ці вогні," - спробував змінити тему Доу, - "Що ти думаєш, що там відбувається? Люди відпочивають, може, п'ють тут і там, хто знає? Я маю на увазі..." - капітан почав відволікатися від балаканини Доу, коли зрозумів, що це було."
  usindoflavor.3.a:0 ""Або японський корабель.""
  usindoflavor.4.t:0 "Усі засоби хороші"
  usindoflavor.4.d:0 ""Будівельні матеріали, так?" - запитав командир капітана з важким японським акцентом.\n\n"Так, звісно, сер, залізо, бетон, все тут." - капітан Грін ковтнув, відповідаючи японському солдату, намагаючись не здригнутися.\n\n"І ви розумієте, що ви на війні, так?" - командир дивився на нього.\n\n"Ем, так, сер... але," - постава капітана розтанула від холодного нічного вітру. Він хвалився своєю відвагою перед японцями і тим, як сильно хоче принести їм бій, але коли зустрів їх без зброї, все його бажання зникло. Залишився тільки страх.\n\n"І це вся ваша команда, капітан?" - японський командир перейшов до наступного питання нетерпляче, вказуючи на команду корабля. "Так, вся команда на місці."\n\n"Я... відправляю... перевірку... під..." - морські піхотинці почули команду японського командира з-під палуби, міцно тримаючи свої гвинтівки M1. Група мовчала, намагаючись не видавати ніякого шуму, що може привести солдатів до їхнього укриття за рядами контейнерів. Доу дивився на інших, потім на свою гвинтівку, якось змусивши себе заспокоїтись і зібратися.\n\n"Я рахую лише одну пару ніг," - прошепотів Доу, - "Я його візьму." Його товариші по команді не знали, чи це відвага, чи дурість, але було вже надто пізно, Доу вийшов із укриття і витягнув пістолет.\n\nБАХ. Туп.\n\n"ДОУ, ТИ, ЧОРТ ВІЗЬМИ..." - крик сержанта обірвався, коли з'явився жахливий японський солдат, який вийшов по сходах і побіг до підпалуби з гвинтівкою Арісаку Type-99, націливши приціл.\n\nБАХ. Туп.\n\n"Ну," - прокоментував командир з верхньої палуби, почувши шум..."
  usindoflavor.4.a:0 ""Всі на місці?""
  usindoflavor.5.t:0 "Що залишається"
  usindoflavor.5.d:0 "Вечірнє світло купало сонний, безіменний порт у Папуа, поки чоловіки працювали цілодобово, розвантажуючи тонни таємної військової техніки, призначеної для фронту. Хоча денне світло починало згасати, даючи місце ночі, робота для чоловіків на причалі тільки починалася. У центрі всього цього двоє чоловіків намагалися підняти ящик, декорований зверху донизу знаками, що попереджають про вибухонебезпечний вміст.\n\n"Гаразд, вже не так далеко. Тримаємо рівно, якщо ми це впустимо, це може забрати з собою весь цей порт, так?" - сказав перший солдат, молодий австралієць, важко дихаючи.\n\nДругий, індонезієць, кивнув. Він був занадто зосереджений на вазі ящика, щоб відповісти. Кожен крок, який робила пара, ставала важчою за попередній, але, врешті-решт, вони дісталися до наступного місця для ящика: запилене складське приміщення, заповнене схожими доставками, де він залишиться, поки не буде відправлений до наступного місця. "Нарешті! Це був найгірший з усіх, я гадаю. А що саме в ньому?"\n\n"Чорт забирай, мабуть, там купа артилерійських снарядів. Скоро вони вирушать звідси і почнуть падати на голови тих, з ким ви там воюєте."\n\nІндонезійський солдат усміхнувся. "Не скоро, я б сказав. Хто знає, можливо, ти сам отримаєш шанс попітніти."\n\nАвстралієць замовк на мить. "Було б цікаво, правда? Мій батько провів роки, воюючи тут, знаєш, спочатку в тій війні, а тепер і в цій. Я певен, він був би гордий, що я продовжую боротьбу; хоча й занепокоєний, знаючи старого..."\n\n"Ну, в будь-якому випадку, радий, що ти тут, щоб допомогти, приватнику... ем..." 
  usindoflavor.5.a:0 ""Грін. Етан Грін. А ти?""
  usindoflavor.6.t:0 "Межі"
  usindoflavor.6.d:0 "Макassar кипів життям; життя, яке Томас Мартін мав залишити назавжди. У нього залишалась година в місті, оскільки літаки, в яких він був заброньований разом зі своєю дивізією, ще потребували трохи технічного обслуговування, але чи варто було виходити з аеропорту? Він уже попрощався; з милою літньою бабусею, що керувала його житловим будинком, з друзями, яких він завів серед місцевих міліціянтів Сулусі, і, найбільше, з Індою.\n\nТомас вирішив залишитися на місці. Він не зміг би знайти нікого в таку годину, окрім Інди. Він відчував сум у своєму серці, лише думаючи про неї. Натомість Томас вийшов зі свого місця і знайшов місце серед Джо та Тайрона за переповненим столом, де вони грали в Техаський холдем. Між картами та балаканиною, він добре відволікся. На мить.\n\nТомас був зламаний після двох ігор. Він поставив дві третини своїх фішок на стрейт, програвши на останньому раунді, коли суперник зібрав трохи вищий стрейт. Половина того, що залишилось, була втрачена після наступного раунду, коли він переробив трійку. Далі Томас взяв участь у повільному падінні фолдів до того, як у нього залишилась одна фішка. Втративши надію, він викинув карти і повернувся до свого місця.\n\nАле він не міг просто сісти знову. Вихід кликав його. За тими дверима був Макassar, стара добра орендарка, його друзі з міліції, і Інда. Місто було його життям протягом років, єдиним порятунком, поки його американські та вільноіндонезійські товариші по зброї боролися з японцями та колаборантами по всьому острову. Він міг згадати всі вулиці свого району, найкращі ресторани на узбережжі міста, навіть магазин, де він вперше зустрів Інду. Як він міг залишити це все?\n\nТомас вирушив до виходу. Хоча зал очікування аеропорту був переповнений, у нього не було іншого вибору. Це було його нове життя, і він би прокляв себе, якщо б залишив його."
  usindoflavor.6.a:0 "Америка може почекати"
  usindoflavor.7.t:0 "Американський патріот, який знаходить своє справжнє покликання"
  usindoflavor.7.d:0 "Протягом більшої частини свого життя Едвард Фостер був гордим членом Демократичної партії. Адже ця партія завжди служила Америці добре: навіть якщо її поразка від Оксидів у Другій світовій війні була сумною плямою на її спадщині, він все одно залишався вірним їй, незважаючи на всі труднощі. І навіть коли вони об'єдналися з республіканцями, Едвард не пішов з корабля і залишився вірним партії американського консерватизму. Однак, останнім часом все стало іншим. РДЦ, хоч і мав добрі наміри, останнім часом зробив помилку за помилкою, особливо в питаннях зовнішньої політики: що особливо боляче — це Індонезія, звісно, і сумна поразка американських повстанців на руках диктаторського режиму Сукарно.\n\n"Знаєш, я не думаю, що РДЦ навмисно піддається японцям. Але те, що я думаю і точно знаю, це те, що їхня некомпетентність ставить Америку в непривабливе світло на міжнародній арені; ти бачив Індонезію? Вони все там зіпсували, і ти чекаєш, що вони приведуть нашу країну до чогось хоча б пристойного?"\n\nЧоловік на телевізорі переважно виглядав, як ті, хто лаявся до цього моменту, але ці слова привернули увагу Едварда. Як його звуть? Кроммінг, щось таке... Ах, Кроммелін, так, Джон Кроммелін. Незважаючи на те, що він був якомусь Які, у нього були кілька хороших точок, подумав Едвард: його зауваження щодо повної та абсолютної некомпетентності республікансько-демократичного альянсу не були зовсім безпідставними, і насправді це було найближче, чого він наблизився до згоди з політиком за останній час. Кроммелін говорив правду, на відміну від медових слів республіканців-демократів; і хоча Едвард не погоджувався з більшістю позицій суверенів, він починав думати, що, можливо, вони могли б привести Америку до почесного місця на міжнародній арені."
  usindoflavor.7.a:0 "Національний авангард всієї Америки росте."
 #нові події для Японії#
