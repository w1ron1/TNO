 INS_Johannes_Leimena_for_desc: "§YМіністр закордонних справ\nХристиянська демократія§!\n--------------\n§LЙоганнес Леймена - або Дж. Леймена. Суворий вигляд, Леймена народився у 1905 році у родині двох вчителів у місті Амбон. На відміну від своїх братів і сестер, Леймена не переїхав жити з вітчимом після того, як його батько помер, коли йому було п'ять, і жив у родині дядька. Саме в юності Леймена став свідком життєвих труднощів і сімейних проблем, коли він виростав у період труднощів 1920-х років і зростаючої неприязні індонезійців до їхніх голландських окупантів.\n\nЗакінчивши медичний факультет STOVIA, Леймена працював у різних лікарнях по всій країні в Джакарті та Бандунзі. Коли прийшли японці - і довели, що вони надовго - Леймена став директором лікарень у Пурвакарті та Танджерангу. Леймена, ймовірно, завдяки своїй рішучій християнській освіті, розвинув сильну антикомуноістичну позицію щодо тих, кого він вважав такими, що переслідують і знищують віруючих. Водночас, на відміну від цього, Леймена відкидає вчення їхніх володарів, які займають індонезійськ архіпелаг, як "за їхнім власним благом".\n\nАле що ж у хорошого можна знайти в стражданнях, які вони принесла? Голод? Бідність? Смерть? Єдиний спосіб, яким вони можуть щось подарувати Індонезії - це відпустити і створити індонезійську державу, якою управляють самі індонезійці. Ця пристрасть привела Леймену до самого верху, ставши головним міністром закордонних справ Сукарно. Але саме цей шлях дав йому цінні уроки. Японія - це чума, але це чума, яку можна використати як зброю. Якщо їхні мільйони і іноземні радники приїдуть до нас на узбережжя, вони можуть побудувати важливі для нас послуги, такі як охорона здоров'я та освіта, особливо для тих, хто живе в периферії країни. Таку можливість інші держави не дають так просто.§!"
 INS_Ruslan_Abdulgani_for_desc: "§YМіністр закордонних справ\nРеволюційний націоналізм§!\n--------------\n§L§!"

 INS_Roosseno_Surjohadikusumo_eco_desc: "§YМіністр економіки\nКорпоративний статизм§!\n--------------\n§LКоаліція Сукарно є широкою, різноманітною і наповнена людьми та особами, які в іншому світі могли б стати арбітрами долі Індонезії, самі по собі. Одним із найяскравіших серед них є Роосено - народжений як Роосено Сурйохадікоесумо. Член технократичної фракції Хазаріна, Роосено є запеклим революціонером, який вважає, що Індонезією повинні керувати ті, хто краще за всіх розуміє, як підняти найбільш уразливих і найпригніченіших до стану гідності та миру.\n\nПоряд з технократами, Роосено фліртує з корпоратістами в Індонезії Сукарно, які вимагають, щоб країна була реорганізована для знищення можливості класового конфлікту і навіть віддаленої можливості того, що комуністи скористаються безладом і спробують організувати загальний повстання проти уряду. Роосено - інженер. Як будь-який хороший інженер, його завдання - з'ясувати, що не так з країною, знайти найпростіший і найбільш ефективний спосіб вирішення цієї проблеми та переконатися, що це ніколи не повториться. У його випадку? Погроза зовнішнього домінування, як з Вашингтона, так і з Токіо, накриває архіпелаг, загрожуючи тим суверенітетом, який вони мають під японським ярмом.\n\nІндонезія - це проект, як і будь-який інший. Основи вже закладені для того, щоб вона стала по-справжньому славною нацією. Все, що потрібно - це сильна, керівна рука, щоб довести це до кінця.§!"
 INS_Jusuf_Wibisono_eco_desc: "§YМіністр економіки\nІсламський консерватизм§!\n--------------\n§L§!"

 INS_Bambang_Supeno_sec_desc: "§YМіністр оборони\nДеспотизм§!\n--------------\n§LДалекі родич Сукарно, Бамбанг Супено завжди вів фізичне життя. Коли його батько помер у 13 років, а його виховувала одна мати, Супено повністю віддався світу крикету, футболу, бойових мистецтв і скаутингу. Він був харизматичним лідером навіть тоді, коли японці вперше висадилися на індонезійських берегах і вигнали голландських колонізаторів, Супено був обраний лідером студентської ради своєї школи.\n\nЦе було природно, що він став лідером чоловіків, схожих на нього. Приєднавшись до Пембела Танах Аїр - або Добровільних захисників Батьківщини - японською організованою та очолюваною парамілітарною силою, створеною для допомоги Імперській японській армії у боротьбі з залишками опору в архіпелазі, саме тут Бамбанг Супено вперше стикнувся з війною. Брудною, кров'ю та сміттям забрудненою і жахливою, Супено зрозумів, що у війні можна використовувати найсучасніші озброєння та бомби - але вони нічого не значать, якщо люди, які ними керують, не знають свого місця в історії.\n\nБої під час обох величезних конфліктів, таких як Друга світова війна та національна революція, переконали Бамбанга Супено в простій ідеї. Чому військові не повинні мати більше впливу в політиці? Чому осуджувати тих, хто віддав все, що мав, на службі Батьківщині, тільки тому, що це не відповідає правилам кількох привілейованих бюрократів. Тисячі людей пожертвували собою під час найжорстокішої війни, що коли-небудь велась на цих островах - їхні товариші хоча б повинні вирішити, як їх пам'ятатимуть.§!"


