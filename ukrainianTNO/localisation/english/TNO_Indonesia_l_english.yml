 FIELD_MARSHAL_SUHARTO:0 "Командувач Сухарто з індонезійської армії - друга за впливом і третя за важливістю особа в країні. Швидко піднявся по службових сходах під час національної революції, Сухарто став невід'ємною частиною армії і створив невелику групу підтримки навколо себе. Наповнений амбіціями, він намагається дати поради президенту Сукарно, що викликає незадоволення віце-президента Хатти, який виступає проти нього на кожному кроці. Куди саме амбіції Сухарто його приведуть - це не відомо, але всі очікують, або бояться, що він зробить все можливе, щоб досягти своєї мети."
 FIELD_MARSHAL_ABDUL_HARIS_NASUTION:0 "Командувач Абдул Харис Насутіон відомий своєю жорстокістю серед бунтівних сил Індонезії та навіть серед власних військ, і на те є підстави. Терор, який він сіє, є результатом того, що він має вищу мету, для якої не може бути помилок на службі Батьківщини. Все, що він робить, робиться для Індонезії. Кожне спалене село. Кожен розстріляний бунтівник. Кожен наказ. Все це для Індонезії."
 GENERAL_LB_MOERDANI:0 "Кар'єра генерала Леонардуса Бенжаміна Мурдані розпочалася з його служби в студентській армії під час національної революції. Він став відомим і здобув популярність, хоча й не завжди в хорошому сенсі, через свої сильні, публічно виражені політичні позиції та релігію. Будучи католиком в країні з переважно мусульманським населенням, він є об'єктом підозр, хоча його вірність Індонезії та Сукарно ніколи не ставилася під сумнів."

