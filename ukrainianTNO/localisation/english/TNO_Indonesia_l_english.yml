 ##Опис лідерів##
 POLITICS_SUKARNO_DESC:0 "Батько нації Індонезії та лідер у боротьбі за незалежність: усе це, і навіть більше, можна сказати про Сукарно, президента Індонезійської Республіки. Хоча реальність, як часто буває, трохи складніша, таке описання все ж таки не таке вже й далеке від істини.\n\nХоча взаємодія з японцями була необхідна для захисту молодої нації, швидкий погляд на Індонезію сьогодні показує, що вигоди значно переважають витрати: Сукарно є президентом гордої та швидко зростаючої нації, яка за кілька років може зрівнятися з найбільшими світовими потугами в економічному плані — завдання, яке є настільки сміливим, як і виглядає складним.\n\nПроте пройшло кілька років, і президент Екваторіального Смарагду стикається з хвилюваннями невдоволення. Централізація з Яви, найпросперитетнішого острова, не є одностайно популярною, а індонезійська армія стає все більш схильною до поляризації та радикалізму. Сукарно зовсім не боїться цього, адже він знає, що маси поважають і обожнюють його.\n\nЗ мандатом свого народу та силою президента Індонезія досягне нових висот і ніколи більше не буде поневолена."

