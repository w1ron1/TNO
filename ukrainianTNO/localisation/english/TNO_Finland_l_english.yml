 #Фокуси
 murmansk_peace.1.t: "Фінляндія пропонує капітуляцію"
 murmansk_peace.1.desc: "Дипломати, що представляють уряд Фінляндії, знову запропонували капітуляцію. Цього разу вони повністю поступаються нашим вимогам і готові передати Онєжську область, Мурманск і всю Карелію на схід від Віїпурі. Це відновить кордон до його положення 1936 року і поверне мільйони росіян під наше правління.\n\nПісля повернення нашої законної території і остаточного вирішення військових питань через розгром фінських збройних сил, нам більше нема чого здобувати у війні. Це був тріумфальний повернення російської нації на світову арену, з відновленням цінного регіону і переконливою перемогою над іноземним суперником.\n\nУкладімо ж мир із фінами і звернемо увагу на схід. Карелія — лише початок. Незабаром уся Росія возз'єднається під нашим прапором."
 murmansk_peace.1.a: "Чудово!"

 murmansk_peace.2.t: "Росія приймає нашу капітуляцію"
 murmansk_peace.2.desc: "Наші дипломати повернулися та повідомили, що росіяни прийняли нашу безумовну капітуляцію. Уся Карелія на схід від Віїпурі буде повернена їм, і кордон повернеться до свого положення 1936 року. Це руйнівна втрата для нашої країни. Десятиліття роботи з відновлення фінського населення наших східних територій і величезні інвестиції в ті самі регіони були зведені нанівець. Ця жертва була зроблена лише тому, що вона була необхідною для збереження будь-якої форми незалежної Фінляндії. Наше майбутнє, яке колись здавалося таким яскравим, тепер вислизає з наших рук, оскільки ми знову потрапляємо в тінь Росії."
 murmansk_peace.2.a: "Ми занадто близько підлетіли до сонця."

 murmansk_peace.3.t: "Фінляндія пропонує перемир'я"
 murmansk_peace.3.desc: "Наші війська не змогли пробити фінські лінії, як ми сподівалися, а, враховуючи поразку наших союзників у Мурманску, бойовий дух нашої армії почав хитатися, серед командирів почало ширитися поразництво. Фіни запропонували нам шлях, як вийти з конфлікту, Фіни запропонували нам шлях виходу з конфлікту, який все ще принесе нам території, хоч і мізерні. Вони пропонують віддати нам Онєґу в обмін на припинення бойових дій і повний відступ наших військ з Карелії.\n\nЧи приймемо ми договір, який вони запропонували, чи відкинемо його і боротимемося за більші здобутки, незважаючи на падіння бойового духу?"
 murmansk_peace.3.a: "Прийняти."
 murmansk_peace.3.b: "Відхилити."

 murmansk_peace.4.t: "Західна Росія приймає перемир'я"
 murmansk_peace.4.desc: "тимчасовий текст"
 murmansk_peace.4.a: "ймовірно, ніхто цього не побачить"

 murmansk_peace.5.t: "Західна Росія відхиляє перемир'я"
 murmansk_peace.5.desc: "ще один тимчасовий текст"
 murmansk_peace.5.a: "серйозно, хто це побачить?"

 murmansk_peace.6.t: "Фінляндія вимагає перемир'я"
 murmansk_peace.6.desc: "Наші солдати не змогли прорвати фінські лінії, як ми сподівалися, і, здається, війна, попри наші найкращі спроби та надії, зайшла в глухий кут. Із замороженими лініями та зі становища сили фіни запропонували нам перемир'я, щоб припинити бойові дії та повернути довоєнний статус-кво щодо кордонів. Їхню пропозицію підкріплює сам Райх, який оголосив, що якщо ми відмовимося - Пакт почне негайну військову інтервенцію.\n\nВони пропонують віддати нам Онєґу в обмін на припинення бойових дій. За нинішньої стагнації конфлікту, появи з кожним днем на фронті все більшої кількості мобілізованих фінських резервів, на додачу до всіх наших втрат, як у техніці, так і в підготовленому особовому складі, а також зростання міжнародного тиску, ми не можемо сподіватися на досягнення наших стратегічних цілей.\n\nУ нас немає іншого вибору, окрім як проковтнути цю отруєну пігулку, і сподіватися, що колись ми зможемо повернути наші втрачені землі іншими способами."
 murmansk_peace.6.a: "Де ж усе пішло не так?"

 murmansk_peace.7.t: "Західна Росія приймає перемир'я"
 murmansk_peace.7.desc: "тимчасовий текст"
 murmansk_peace.7.a: "ймовірно, ніхто цього не побачить"

