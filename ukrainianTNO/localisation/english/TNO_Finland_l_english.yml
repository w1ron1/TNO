 murmansk.2.desc: ""
 murmansk.2.a: ""

 murmansk.21.t: "Спустити псів війни"
 murmansk.21.desc: "Повстання почалося. Наші джерела вперше виявилися правими, і загальне повстання проти фінських сил вигнало Сили оборони Фінляндії з провінції Кола та звільнило місто Мурманск. Це, безумовно, славна перемога, але це лише початок. Їм дали по зубах, але вони не розбиті. Це лише перша фаза боротьби між нами та ними. Росіянин і фін знову зійдуться у сутичці — і наші повстанці не будуть на самоті.\n\nПорт Мурманска завжди був першою зупинкою для іноземців і постачання. Цього разу Мурманск стане домом для людей, значно ближчих до дому. Наші добровольці вже пройшли навчання і озброєні нами, щоб битися разом із нашими братами з Мурманської народної республіки. Саме ці легіони зустрінуть основний удар фінської армії та знищать їх, поки їхні сили виснажуватимуться партизанами Мурманська, аж поки у них не залишиться іншого вибору, окрім як евакуюватися з їхніх завоювань. Тоді, і лише тоді, коли Гельсінки буде принижено на очах у всього світу, Мурманськ і Східна Карелія повернуться до нас — так, як це мало бути від початку."
 murmansk.21.a: "Відправте їх..."
 murmansk.21.b: "...Фіни не єдині, хто вміє вести партизанську війну."
 RUS_MPR_volunteers_tt: "Ми зможемо надіслати §Yдобровольців§! для допомоги державі [MPR.GetNameWithFlag] у їхній боротьбі з §WФінляндією§!!\n\n§RЯкщо [MPR.GetNameWithFlag] зазнає поразки, нашим зусиллям з повернення Карелії буде завдано смертельного удару.§!\n"
 RUS_MPR_HARD: "§RОбрання цього варіянту ввімкне значно важчу версію конфлікту.§!\n\nМи НЕ зможемо надсилати §Yдобровольців§! для допомоги державі [MPR.GetNameWithFlag] у їхній боротьбі з §WФінляндією§!!\n\n§RЯкщо [MPR.GetNameWithFlag] зазнає поразки, нашим зусиллям з повернення Карелії буде завдано смертельного удару.§!\n"

