  #### AIR DOCTRINES ####
  GRAND_DOCTRINE_AIR_POWER_PROJECTION: "Air Power Projection"
  GRAND_DOCTRINE_AIR_POWER_PROJECTION_DESC: "Possessing an air force capable of projecting power over thousands of kilometers comes at a significant cost, as long-range airframes require enormous investments into their development, construction and maintenance, as well as significant stockpiles of ballistic weapons. However, they also offer unparalleled strategic opportunities, from striking vulnerable rear infrastructure to the ultimate act of nuclear annihilation: whatever the choice, no enemy will sit easily knowing that their entire territory is a potential target."
  GRAND_DOCTRINE_TACTICAL_AVIATION_DESC: "A developed and capable air force is instrumental for national security. Eschewing lofty dreams of grandeur in favor of a more practical approach to air warfare, we will ensure that our air force has the material means and the technical capabilities to protect our skies and support our armed forces as needed."
  GRAND_DOCTRINE_TACTICAL_AVIATION: "Tactical Aviation"
  # Fighter, CAS, Heavy, Helicopter? Light, Heavy, Helicopter, Operations?
  DOCTRINE_TRACK_FIGHTER_AIRCRAFT: "Fighter Aircraft"
  DOCTRINE_TRACK_HELICOPTER: "Helicopter"
  DOCTRINE_TRACK_BOMBER_AIRCRAFT: "Bomber Aircraft"
  ### Fighter Subdoctrine - The Road to Supremacy
  SUBDOCTRINE_FIGHTER_THE_ROAD_TO_SUPREMACY: "The Road to Supremacy"
  SUBDOCTRINE_FIGHTER_THE_ROAD_TO_SUPREMACY_DESC: "Air supremacy is a key battlefield condition to enable our operations, be they on land or in the air. We should always seek to dominate the skies: the best way to do so is to develop modern air superiority fighters, and develop effective tactics for their deployment."
  
  fighter_the_road_to_supremacy_speed_twins: "Speed Twins"
  fighter_the_road_to_supremacy_speed_twins_desc: "The perfect air superiority fighter combines superior speed and perfect agility. Twin turbofan engines will work in tandem to achieve maximum acceleration without adding too much to the weight: this will make our fighters costlier, but much more effective than single-engine aircraft."
  
  fighter_the_road_to_supremacy_the_owls_plumage: "The Owl's Plumage"
  fighter_the_road_to_supremacy_the_owls_plumage_desc: "When exposed to missile interception over contested skies, the best protection is to not be seen at all. By employing modern materials and building techniques, we can dramatically reduce our air superiority planes' radar signature: just as an owl's plumage makes their flight silent, so will our aircraft approach their prey undetected, until it is too late to react."
  
  fighter_the_road_to_supremacy_the_eagles_talons: "The Eagle's Talons"
  fighter_the_road_to_supremacy_the_eagles_talons_desc: "In order to achieve air supremacy, our tactics will emphasize aggressive and decisive action. Pilots must be trained to trust their instinct and deploy their impressive armaments as soon as the opportunity presents itself: like an eagle striking from the sky, our talons will kill the prey before it even realizes it has been caught."
  
  fighter_the_road_to_supremacy_mass_engagement_tactics: "Mass Engagement Tactics"
  fighter_the_road_to_supremacy_mass_engagement_tactics_desc: "The best way to achieve air supremacy is to launch large sorties aimed at effectively suppressing or destroying enemy air assets. Such engagements, however, are fraught with risks: establishing proper training courses and combat protocols will give our pilots the knowledge and means to maintain effective coordination during the battle."
  
  fighter_the_road_to_supremacy_caelum_nostrum: "Caelum Nostrum"
  fighter_the_road_to_supremacy_caelum_nostrum_desc: "Once achieved, air supremacy allows the dominating force to use another country's sky as if it were its own. From logistical flights to missile strikes and close air support, there will be no limit to our reach: therefore, it is of paramount importance that we are always ready to exploit any such instance to the fullest extent."

  ### Fighter Subdoctrine - Escort Primacy
  SUBDOCTRINE_FIGHTER_ESCORT_PRIMACY: "Escort Primacy"
  SUBDOCTRINE_FIGHTER_ESCORT_PRIMACY_DESC: "Air superiority as a concept has been rendered obsolete by the new reality of war. All we need fighters for is to escort our strategic air assets so that they can reach optimal firing solutions: once they unleash their payload, the enemy will no longer have any air force to contend the skies with."

  fighter_escort_primacy_destroyers_of_the_air: "Destroyers of the Air"
  fighter_escort_primacy_destroyers_of_the_air_desc: "With our new focus on escort-capable aircraft, range and wingload are a priority over residual agility and dogfighting capabilities. Larger fighters with heavy twin engines can keep operational pace with our strategic aircraft, and the additional thrust will allow them to mount enough air-to-air missiles to fend off any threat."

  fighter_escort_primacy_interlocked_radar_fields: "Interlocked Radar Fields"
  fighter_escort_primacy_interlocked_radar_fields_desc: "Modern radars can be mounted even on smaller aircraft such as fighters, but their effectiveness is still subpar compared to ground installations. By reducing interference and establishing communication protocols, we can exploit even these smaller detectors to maintain a field of constant surveillance around our vulnerable bombers."

  fighter_escort_primacy_anti_radiation_missles: "Anti-Radiation Missiles"
  fighter_escort_primacy_anti_radiation_missles_desc: "The greatest threat to our strategic aircraft is represented by enemy surface-to-air missile batteries. In order to engage such threats, our escort fighters will be equipped with anti-radiation missiles (ARM) that lock onto radar signatures: as soon as the enemy activates their air defence batteries, our new missiles will seek them out and either suppress or destroy them outright."

  fighter_escort_primacy_ground_based_interception: "Ground-Based Interception"
  fighter_escort_primacy_ground_based_interception_desc: "Our focus on escort aircraft leaves us more vulnerable to enemy air superiority fighters. To defend our exposed flank, the logical step is a comprehensive effort to strengthen our land-based air defences: ground radars and missile batteries will keep our skies safe from enemy incursion."

  fighter_escort_primacy_queen_bee_protocols: "Queen Bee Protocols"
  fighter_escort_primacy_queen_bee_protocols_desc: "The safety of our long-range bombers is of paramount importance, as even a single loss can cripple our power projection capabilities. In case of direct threat to our strategic aircraft, fighter pilots will prioritize bomber protection above all else: like worker bees swarming to protect their queen, our fighters will shield their assigned bombers with their own metal bodies if need be."

  ### Fighter Subdoctrine - Clear Skies
  SUBDOCTRINE_FIGHTER_CLEAR_SKIES: "Clear Skies"
  SUBDOCTRINE_FIGHTER_CLEAR_SKIES_DESC: "Our most realistic prediction is that, in a large-scale war, we won't have the means to achieve air superiority over enemy skies. As such, our main focus should be the protection of our own airspace, limiting enemy incursions to frontline areas and ensuring safety and continuity of operations in our rear: in this overarching strategy, our fighter wings must be primarily concerned with interception and defense against enemy aircraft or missile barrages."

  fighter_clear_skies_light_jet_fighters: "Light Jet Fighters"
  fighter_clear_skies_light_jet_fighters_desc: "With our current means, we simply cannot afford a large fleet of air superiority fighters. Instead, we'll focus on light mono-engine jets with simple designs: as we don't expect our fighters to operate far away from our home theater, we can safely delegate most weight-increasing components such as long-range radars or heavy missile pilons to ground infrastructure, keeping our aircraft light, agile and cheap."

  fighter_clear_skies_keep_the_factories_open: "Keep the Factories Open"
  fighter_clear_skies_keep_the_factories_open_desc: "Ever since the First World War, attrition has become the key factor in deciding who prevails in a conflict. Industrial capacity and logistical security are vital for the war effort, and we must ensure at all costs that the flow of supplies and reinforcements to the front never dries up: as such, interception will be a priority for our fighter wings, and they'll receive additional training and specialized equipment to intercept targets such as cruise missiles or bombers and their escorts."

  fighter_clear_skies_frontline_support_operations: "Frontline Support Operations"
  fighter_clear_skies_frontline_support_operations_desc: "We may not be able to push deep into enemy territory, but this doesn't mean we lack the ability to influence the flow of battle. With clear identification-friend-or-foe protocols and ample coordination between the air force and its ground assets, we can deploy our fighters close to the frontline to contest the airspace above our soldiers: achieving localized air superiority at the opportune time can enable a successful offensive on our side or thwart a hostile push."

  fighter_clear_skies_aerial_swashbuckling: "Aerial Swashbuckling"
  fighter_clear_skies_aerial_swashbuckling_desc: "Fighter planes are as nimble as they are fragile. Training regimes and doctrinal planning must take these two qualities into account, maximizing the former to minimize the latter: evasion will serve our fighters more than heavy armor, and agility more than heavy armament. As such, we will keep our aircraft light, equipping them only with the bare minimum needed for the mission: like swashbucklers of the Renaissance era, they will deliver all their power in one hit, and then retreat."

  fighter_clear_skies_fly_like_a_butterfly_sting_like_a_bee: "Fly Like a Butterfly, Sting Like a Bee"
  fighter_clear_skies_fly_like_a_butterfly_sting_like_a_bee_desc: "In spite of our limitations, our fighter wings have developed into an effective defensive force. Coordinating closely with ground crews and frontline operators, our light jets can quickly intervene to intercept missile barrages or prevent evemy air assets from achieving air superiority: as long as we can maintain operational tempo, we'll keep losses to a minimum and offer vital support to the rest of the army."

  ### Bomber Subdoctrine - Ground Pounding
  SUBDOCTRINE_BOMBER_GROUND_POUNDING: "Ground Pounding"
  SUBDOCTRINE_BOMBER_GROUND_POUNDING_DESC: "Despite the ever-increasing presence of missile-based anti-air defences, close air support remains a viable - if risky - tactic to deliver payloads superior than most artillery with great speed and precision. Of course, the times of Stuka bombers vertically launching bombs on enemy bunkers are long gone: adapting the old tactics to the modern times will be necessary to minimize losses and increase barrage effectiveness."

  bomber_ground_pounding_unguided_missiles: "Unguided Missiles"
  bomber_ground_pounding_unguided_missiles_desc: "Close air support planes are often equipped with clusters of cheap, unguided missiles capable of delivering widespread destruction over a large area without coming too close to the frontline - and to enemy anti-air batteries. Improving missile aerodynamics and ensuring our pilots can properly maneuver their planes to the optimal launching angle will surely help in reducing missile spread: the more missiles fall close to the target location, the more likely for it to be destroyed."

  bomber_ground_pounding_mixed_payloads: "Mixed Payloads"
  bomber_ground_pounding_mixed_payloads_desc: "The development of air-to-air missiles, and the subsequent realization that any kind of plane can carry airframe-killer weapons, has considerably reduced the difference between air superiority fighters and multirole planes. When engaged in missions over contested skies, our close air support airframes will carry a mixed payload, mounting at least two air-to-air missiles: this way, they will be able to defend themselves, against enemy interceptors without having to deploy air superiority fighters at their side."

  bomber_ground_pounding_strafing_runs: "Strafing Runs"
  bomber_ground_pounding_strafing_runs_desc: "In case of dire need, close air support planes must be able to provide direct frontline support. Such missions involve high risk of airframe loss to enemy MANPADS or missile batteries, but they might be the only thing stopping an armored breakthrough: to this end, we will establish clear procedures to authorize direct bombardments and strafing runs, and rely on our exceptional pilots to carry the day."

  bomber_ground_pounding_efficient_wing_distribution: "Efficient Payload Distribution"
  bomber_ground_pounding_efficient_wing_distribution_desc: "Modern close air support planes no longer need a bomb bay, instead housing their payload directly on pylons placed at regular intervals on the wings. This simple change means a complete revolution in weight distribution and flight patterns: standardizing payload distribution practices for each mission type will ensure our support aircraft always carry an effective weapon array without compromising their survivability."

  bomber_ground_pounding_gliding_bombs: "Gliding Bombs"
  bomber_ground_pounding_gliding_bombs_desc: "One of the greatest risks for close air support missions is the need for the aircraft to come close to the frontline to deploy its payload, exposing it to the full array of enemy anti-air defences. By mass-producing gliding kits for our old stock of unguided ammunition, and developing improved flight patterns for such bombs, our close air support planes will be able to launch powerful barrages from a safer distance: this will drastically improve mission survivability and barrage effectiveness."

  ### Bomber Subdoctrine - Operational Adaptability
  SUBDOCTRINE_BOMBER_OPERATIONAL_ADAPTABILITY: "Operational Adaptability"
  SUBDOCTRINE_BOMBER_OPERATIONAL_ADAPTABILITY_DESC: "Just as their predecessors during the Second World War, medium bombers are versatile aircraft, offering the ability to deploy large payloads at long ranges, without the logistical challenges of operating a strategic aviation. Modern developments in missile technology and jet propulsion have offered new tactical insights for medium bombers: exploiting this potential will require significant investment, but more than repay the cost in the long term."

  bomber_operational_adaptability_tactical_support_runs: "Tactical Support Runs"
  bomber_operational_adaptability_tactical_support_runs_desc: "While less effective than close air support aircraft at directly striking frontline targets, medium bombers are still capable of helping our troops by deploying clusters of short-range missiles at a range that is still comparatively safe. By establishing direct communication channels and request protocols between regiment-sized land units and the air force command, we can streamline such operations, reducing risks for our pilots and improving responsiveness: as long as the barrage arrives on time, the troops will thank us."

  bomber_operational_adaptability_modern_escort_patterns: "Modern Escort Patterns"
  bomber_operational_adaptability_modern_escort_patterns_desc: "The times of passing over enemy cities with a full bomb bay are long over, but the need to escort bombers remains ever present. Given the proliferation of long-range anti-air missile batteries, and the ability for interceptors to launch such weapons at stand-off distance, escorting fighters must develop new and improved tactics to keep our bombers safe from enemy fire: overlapping radar bubbles and light interception missiles will serve the air force well in this task."

  bomber_operational_adaptability_laser_guidance: "Laser Guidance"
  bomber_operational_adaptability_laser_guidance_desc: "Recent breakthroughs in missile technology allow guided warheads to automatically seek laser-marked targets. Deploying specialized reconnaissance teams with the sole task of "painting" ground targets with laser markings will greatly increase precision and effectiveness of aerial barrages: this will make our tactical aircraft much more capable of providing direct support to our ground troops."

  bomber_operational_adaptability_warning_and_control_system: "Warning and Control Systems"
  bomber_operational_adaptability_warning_and_control_system_desc: "Medium aircraft possess both the size and operational autonomy to mount long-range radar and detection equipment. Unlike land-based structures and vehicles, AWACS planes have an unimpeded bird's-eye view of the surrounding area, allowing them to scan hundreds, or even thousands of kilometers ahead without disturbance: these aircraft will thus serve as our eyes and ears in the skies, detecting enemy movements or missile barrages hours before they reach the target, or providing guidance to the rest of our armed forces."

  bomber_operational_adaptability_saturation_bombardment: "Saturation Bombardment"
  bomber_operational_adaptability_saturation_bombardment_desc: "A large concentration of medium bombers requires both significant logistical effort and extensive operational planning, but the results speak for themselves. By unleashing a coordinated barrage of tactical ballistic missiles at stand-off range, either simultaneously or in a carousel, we can overload local anti-air defences and ensure that any given target can be effectively obliterated, at no risk whatsoever for our airframes: though this new tactic, there will be little effective difference with actual strategic bombers."

  ### Bomber Subdoctrine - Opportunistic Bombardment
  SUBDOCTRINE_BOMBER_OPPORTUNISTIC_BOMBARDMENT: "Opportunistic Bombardment"
  SUBDOCTRINE_BOMBER_OPPORTUNISTIC_BOMBARDMENT_DESC: "Our bomber fleet is precious and nigh irreplaceable. We will never be able to win a war of attrition against our enemies, which means that we must deploy unconventional and opportunistic tactics to strike at our enemies: like a pack of hyenas, we will strike when our enemy is weak or distracted, and reap the highest toll we can before disappearing... until the next time."

  bomber_opportunistic_bombardment_low_altitude_runs: "Low-Altitude Runs"
  bomber_opportunistic_bombardment_low_altitude_runs_desc: "Large, slow and unwieldy, bombers and strike aircraft in general are easy to spot for enemy radars, and even easier to hit with modern anti-air missiles. In order to minimize the risk to our bombers, we will instruct our pilots to maintain their aircraft at low altitude: barrages will be somewhat less precise, but it will be much safer."

  bomber_opportunistic_bombardment_night_time_operations: "Night-Time Operations"
  bomber_opportunistic_bombardment_night_time_operations_desc: "Radars are effective twenty-four hours a day, but other surveillance assets such as forward observers and visual reconnaissance planes lose most of their usefulness during the night. In order to exploit this advantage, we will prioritize night-time bombing runs to protect our strike aircraft from enemy interception: the precision will suffer, but most of the inconvenience can be avoided with sufficient planning."

  bomber_opportunistic_bombardment_localized_superiority: "Localized Superiority"
  bomber_opportunistic_bombardment_localized_superiority_desc: "Just like us, our enemies too must protect a wide array of strategic locations and infrastructure from long-range strikes. As we lack the means to establish a general air superiority, we must plan each and every barrage around localized breakthrough: when the operation is launched, enemy anti-air defences in the targeted sector will be temporarily suppressed, giving our bombers a window of opportunity to reach optimal firing solutions for their bombardment."

  bomber_opportunistic_bombardment_salt_the_earth: "Salt the Earth"
  bomber_opportunistic_bombardment_salt_the_earth_desc: "Modern missiles are much more precise than earlier generations, but also much costlier. If we want to improve the effectiveness of our raids at an affordable price for our overstretched budget, then we need to work on the destructiveness: adding cluster and incendiary warheads to the ammunitions loaded on our bombers will dramatically increase the destructive power of any barrage even if it fails to directly connect with the intended target. We don't talk about what happens to the mistaken targets."

  bomber_opportunistic_bombardment_the_skybourne_scourge: "The Skyborne Scourge"
  bomber_opportunistic_bombardment_the_skybourne_scourge_desc: "What we can't achieve through size and technological superiority, we'll achieve through other means. Our bomber wings are now expert at striking the enemy at their weakest point, inflicting maximum damage before retreating in a cloud of smoke: as the ancient Mongols, we'll protect our elite soldiers by fighting opportunistically and spreading fear of what we can do. Let the enemy curse us for not fighting on their own terms, as long as we are victorious."

  ### Operational Subdoctrine - Spreading Our Wings
  SUBDOCTRINE_OPERATIONAL_SPREADING_OUR_WINGS: "Spreading Our Wings"
  SUBDOCTRINE_OPERATIONAL_SPREADING_OUR_WINGS_DESC: "Strategic bombers put "power" in the "power projection", but this is only half of the doctrine's focus. In order to project such power, a wide array of other technical means is needed, from far-flung airfields to tanker aircraft: without that vital support, our aviation will never be able to spread its wings."

  operational_spreading_our_wings_expeditionary_aviation: "Expeditionary Aviation"
  operational_spreading_our_wings_expeditionary_aviation_desc: "Our country's airstrips are enough to project power across our own region, but not even the most modern strategic bomber can reach across the ocean on its own. In order to truly extend our operational range across the globe, we need air bases in faraway theaters: colonial possessions, satellite governments, leased airstrips or even hostile takeover during proxy conflicts are all valid ways to secure an entry point into any theater."

  operational_spreading_our_wings_ground_support_crews: "Ground Support Crews"
  operational_spreading_our_wings_ground_support_crews_desc: "In order to maintain our strategic aviation at peak efficiency, air bases near the theater of operations must be fitted with state-of-the-art equipment. Fuel silos, spare part magazines, ammunition and missile depots must always be well supplied and readily accessible: such a logistical chain is neither cheap nor easy to maintain, but it's a price we're willing to pay to ensure the enemy is subjected to constant bombardment."

  operational_spreading_our_wings_carrier_based_escort_wings: "Carrier-Based Escort Wings"
  operational_spreading_our_wings_carrier_based_escort_wings_desc: "While strategic bombers have an operational range numbering in the thousands of kilometers, fighters have much less autonomy, limiting their escort effectiveness in situations where we don't have air bases adjacent to the theater. In such situations, carriers can serve well as a surrogate: basing our escort wings on long-range carriers will allow our strategic aircraft to strike targets normally outside of our operational range."

  operational_spreading_our_wings_stratotanker_initiative: "Stratotanker Initiative"
  operational_spreading_our_wings_stratotanker_initiative_desc: "If we want to truly reach every corner of the world, we need to be able to refuel our strategic aviation mid-flight. Tanker planes are already widespread in the air force, but none of these aircraft have the operational range and capacity to truly support a moving fleet of flying fortresses: to this end, we will develop and deploy our own stratotankers - immense aircraft filled to the brim with aviation-grade fuel, to keep dozens of planes afloat for days, or to the very end of the Earth."

  operational_spreading_our_wings_integrated_operational_command: "Integrated Operational Command"
  operational_spreading_our_wings_integrated_operational_command_desc: "Launching a strategic bombardment mission is no easy feat, as it involves the concerted efforts of dozens of support aircraft, hundreds of ground crews and thousands of other technical specialists. Establishing an integrated operational command for long-range missions will streamline the logistical and administrative work to enable such initiatives: coordination meetings, unified protocols and cross-branch procedures might be boring activities compared to watching the world burn from your cockpit, but they are no less necessary."

  ### Operational Subdoctrine - Data Refinement Initiative
  SUBDOCTRINE_OPERATIONAL_DATA_REFINEMENT_INITIATIVE: "Data Refinement Initiative"
  SUBDOCTRINE_OPERATIONAL_DATA_REFINEMENT_INITIATIVE_DESC: "There's no use in deploying a large strategic aviation if they don't know what to hit with their barrage. In order to maximize mission effectivement, we must improve our ability to gather intelligence about air targets: if we know exactly what, where and when to strike, there will be no safe refuge for our enemy."

  operational_data_refinement_initiative_intelligence_attaches: "Intelligence Attaches"
  operational_data_refinement_initiative_intelligence_attaches_desc: "Until our military satellites grow enough in number and reliability, ground targets need to be identified the old-fashioned way - that is, through the work of spies and double agents. With enough political backing, we can establish a preferential collaboration between our intelligence agencies and the air force: a web of informants and bribed officials will tell us which potential targets are decoys, which are well defended and which are vulnerable and ripe for the bombing."

  operational_data_refinement_initiative_ground_radar_arrays: "Ground Radar Arrays"
  operational_data_refinement_initiative_ground_radar_arrays_desc: "Even the most advanced Airborne Warning and Control Systems can only see a few kilometers ahead of themselves, which makes them unsuitable for long-range air missions. In order to fully support our strategic aviation, we need to built state-of-the-art radar arrays on land: their immense infrastructure is powerful enough to detect ether disturbances thousands of kilometers away, alerting us to potential aerial threats and keep our air wings updated in real time."

  operational_data_refinement_initiative_reconnaissance_drones: "Reconnaissance Drones"
  operational_data_refinement_initiative_reconnaissance_drones_desc: "The first unmanned aerial systems made their appearance already during the Second World War, but they were little more than old airframes refitted with remote radio controls. Modern breakthroughs in gyroscope guidance and rocket technology will allow us to deploy the first, dedicated reconnaissance drones: these one-way half-missiles will cut through the skies, flying fast and low enough to avoid interception, automatically taking films and pictures before returning home on pre-planned crash trajectories to deliver us their bounty of data."

  operational_data_refinement_initiative_military_satellite_constellation: "Military Satellite Constellation"
  operational_data_refinement_initiative_military_satellite_constellation_desc: "When enough satellites are placed within communication distance to each other and on pre-planned orbits, a constellation is born. Establishing our own, fledgling military satellite constellation will give us the ability to receive reliable pictures of growing technical quality in real time, without risk of interception and airframe loss: with such unparalleled wealth of information about our enemies, they will not be able to hide from our eyes in the sky."

  operational_data_refinement_initiative_operational_omniscience: "Operational Omniscience"
  operational_data_refinement_initiative_operational_omniscience_desc: "There is no "perfect" way to gather intelligence. Instead, every method has its use, with clear advantages and risks, potentials and limitations: as we collect more and more data, as we develop new and more effective ways to collate, compare and distill information, so do we come ever closer to true knowledge. Once our methods have been refined to perfection, we will achieve operational omniscience - the ability to direct our wrath with unerring precision, like the gods of pagan legend."

  ### Operational Subdoctrine - Mastery of the Spheres
  SUBDOCTRINE_OPERATIONAL_MASTERY_OF_THE_SPHERES: "Mastery of the Spheres"
  SUBDOCTRINE_OPERATIONAL_MASTERY_OF_THE_SPHERES_DESC: "In wartime, airspace can be seen as a given set of spheres that influence the importance, danger or potential of any given sector. Radar bubbles, missile battery coverage, airbase range, all contribute to the effectiveness of our air operations - or lack thereof: in order to maximize the capabilities of our air force, we need to master these spheres of battle so that our enemy will not catch us unaware."

  operational_mastery_of_the_spheres_multilayered_defence_bubble: "Multilayered Defense Bubble"
  operational_mastery_of_the_spheres_multilayered_defence_bubble_desc: "Nowadays, missile barrages have become capable of quickly overwhelming any defensive system. In order to protect our cities and strategic assets from enemy air raids, we need to establish a multilayered defensive network: a combination of early-warning radars, aerial observers, surface-to-air batteries and kinetic interceptors will give us a strong basis to counter any attack."

  operational_mastery_of_the_spheres_civilian_asset_integration: "Civilian Asset Integration"
  operational_mastery_of_the_spheres_civilian_asset_integration_desc: "Given our limited means compared to the enemies we might be called to face, it is imperative that we can mobilize as many assets as possible to support our air force. Civilian airports can be reserved for military operations, airliners and cargo planes can be seized as transport and logistical assets, even amateur monoplanes can be pressed into service for reconnaissance duties: though inferior to their military counterparts, these aircraft and their pilots can greatly increase our ability to conduct operations in the rearguard."

  operational_mastery_of_the_spheres_trierarchy_of_the_air: "Trierarchy of the Air"
  operational_mastery_of_the_spheres_trierarchy_of_the_air_desc: "In ancient Athens, Trierarchy was an honor bestowed upon rich citizens who subsidized the construction of a trireme. Given our budget constraints, it is in our interest to launch similar forms of diffused financial participation to military expenditure: assigning nationalistic value to voluntary donations from individuals or local communities, as well as launching special-issue bonds or non-repayable loans, will allow us to gather more funds for our air force."

  operational_mastery_of_the_spheres_intelligence_coordination: "Intelligence Coordination"
  operational_mastery_of_the_spheres_intelligence_coordination_desc: "As the old saying goes, an ounce of prevention is worth a pound of cure. If we can't increase the size of our air force, then we'll work on improving its effectiveness through other means: establishing a coordination office between intelligence and air force officials will give us access to high-quality information about our enemies, be it targets to strike or early warning about raids on our infrastructure."

  operational_mastery_of_the_spheres_castles_in_the_sky: "Castles in the Sky"
  operational_mastery_of_the_spheres_castles_in_the_sky_desc: "As things stand, we do not possess the means to protect our entire territory simultaneously. Instead, we will identify those key targets that our enemy is most likely to attack, and dispatch ad-hoc task forces to protect them: these garrisons, comprised of interceptor fighters as well as ground radars, surface-to-air missile batteries and all the needed logistical assets, will serve as veritable sky fortresses, protecting our vulnerable heartland from enemy barrages and ensuring that the war effort is not endangered."

  ### Air Superiority
  SUBDOCTRINE_DEFENSIVE_TACTICS: "Defensive Tactics"
