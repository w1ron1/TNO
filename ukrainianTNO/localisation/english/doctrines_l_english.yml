  SUBDOCTRINE_LIGHT_STRIKE_GROUPS_DESC: "Our helicopters may be good to use hit and run tactics due to the speed and low profile of them. If we attach small infantry groups to each helicopter, they can land in and out of hot-zones and be much faster than sending an armored section while giving support."
