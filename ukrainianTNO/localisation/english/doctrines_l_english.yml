  SUBDOCTRINE_DEEP_AIR_SUPPORT_DESC: "We can't just use our air power to attack the enemy in the field of battle. In an environment where infrastructure and industry are vital to military success, attacking enemy targets outside of the immediate combat zone will be vital."
