l_english:

  GRAND_DOCTRINE_MANEUVER_WARFARE: "Maneuver Warfare"
  GRAND_DOCTRINE_MANEUVER_WARFARE_DESC: "Maneuver warfare once guided the Reich to victory. Guderian and Rommel's principles might no longer apply to the modern, threat-saturated battlefield, but their core teachings remain valid today for the commander bold enough to embrace them."
  GRAND_DOCTRINE_STRATEGIC_WARFARE: "Strategic Warfare"
  GRAND_DOCTRINE_STRATEGIC_WARFARE_DESC: "Wars are unglamorous, but there is beauty in seeing well-planned, well-timed and well-performed operations unfold in real time. Our generals shall prioritize perfecting this art."
  GRAND_DOCTRINE_UNCONVENTIONAL_WARFARE: "Unconventional Warfare"
  GRAND_DOCTRINE_UNCONVENTIONAL_WARFARE_DESC: "The sad reality of war is that, in any conventional scenario, we'll be overwhelmed by our enemies. Our only chance to preserve our survival is to deny the enemy their advantage, and press our own with any available means."
  GRAND_DOCTRINE_DEFENSIVE_WARFARE: "Defensive Warfare"
  GRAND_DOCTRINE_DEFENSIVE_WARFARE_DESC: "It is not in our interest - or within our means - to bring war abroad. Instead, we must prepare our army, our industry and our people to resist against any act of aggression, and inflict disproportionate losses upon our enemies."

  DOCTRINE_TRACK_INFANTRY: "Army Core"
  DOCTRINE_TRACK_COMBAT_SUPPORT: "Fire Support"
  DOCTRINE_TRACK_ARMOR: "Armor Support"
  DOCTRINE_TRACK_OPERATIONS: "Operational Doctrine"

  ## Combined Operations
  SUBDOCTRINE_ARMY_INTEROPERABILITY: "Army Interoperability"
  SUBDOCTRINE_ARMY_INTEROPERABILITY_DESC: "A combined operations doctrine can only be successful if followers are coordinated. We must redouble our efforts to ensure cooperation on all levels of our armed forces. We may serve different roles, but none shall fight alone!"
  army_interoperability_1: ""
