  ### Army Core / Infantry Doctrines - Buffs Infantry & Support Companies
  SUBDOCTRINE_LIGHT_INFANTRY_PRIMACY: "Warriors of the Flea"
  SUBDOCTRINE_LIGHT_INFANTRY_PRIMACY_DESC: "Often overlooked by modern military manuals, light infantry is a versatile force that, if properly supported, can hit well above its stature. Effective command, surprise attacks and man-portable systems can turn even small infantry units into a sharp dagger that will thrust between our foe's armored ribs."
  light_infantry_primacy_flesh_and_bone: "Flesh and Bone"
  light_infantry_primacy_flesh_and_bone_desc: "The most immediate need for Light Infantry elements is physical fitness. They will have little else but their body to rely on in the field. Our training and recruitment will reflect this."
  light_infantry_primacy_flood_the_field: "Flood the Field"
  light_infantry_primacy_flood_the_field_desc: "The advantage of Light Infantry elements is that they are comparatively cheap. By focusing on mass deployment and recruitment we can leverage this."
  light_infantry_primacy_fob_mastery: "FOB Mastery"
  light_infantry_primacy_fob_mastery_desc: "Wherever a squad is, that is the frontline. By integrating fast and light equipment these smaller units can be reinforced continuesly."
  light_infantry_primacy_wolf_warriors: "Wolf Warriors"
  light_infantry_primacy_wolf_warriors_desc: "Consolidated units of proven soldiers can be quickly trained to a level of skill that other units can only dream of."
  light_infantry_primacy_fire_force: "Fire Force"
  light_infantry_primacy_fire_force_desc: "By integrating swift reaction technology and field intelligence, the LI can be brought to bear on any enemy, surrounding and destroying them before they have the chance to retreat or complete their attack."

  SUBDOCTRINE_REGULAR_INFANTRY_PRIMACY: "Queen of the Battlefield"
  SUBDOCTRINE_REGULAR_INFANTRY_PRIMACY_DESC: "Tanks and airplanes do not hold territory, artillery does not man trenches and mechanized columns can't defend a front spanning thousands of miles. If properly trained and equipped, the humble infantryman will do all of that, and more: steel may rust, blood does not."
  regular_infantry_primacy_discipline_and_vigor: "Discipline and Vigor"
  regular_infantry_primacy_discipline_and_vigor_desc: "The first and last duty of the infantry is to hold the line. By ensuring standard levels of fitness and integrating disciplinary officers into the unit, we ensure this will be done."
  regular_infantry_primacy_diy_households: "Home Is Where the Trench Is"
  regular_infantry_primacy_diy_households_desc: "Ensuring every man is equipped with entrenchment tools and training to match will enable them to greatly increase their survivability."
  regular_infantry_primacy_no_mountain_too_high: "No Mountain Too High"
  regular_infantry_primacy_no_mountain_too_high_desc: "Mountains provide cover, concelment and fortification for those who know how to use them. By mastering this terrain we will break any machine on the rocks."
  regular_infantry_primacy_all_the_bells_and_whistles: "All the Bells and Whistles"
  regular_infantry_primacy_all_the_bells_and_whistles_desc: "With sufficient support integration the humble infantry company can fight longer and harder than any isolated or overly specialized unit."
  regular_infantry_primacy_hearts_of_iron: "Hearts of Iron"
  regular_infantry_primacy_hearts_of_iron_desc: "It is the lot of all infantry to sacrifice themselves when called on to do so. By inculcating a spirit of stoic resilience and discipline, no heart will waver from this final duty."

  SUBDOCTRINE_MOTORIZED_INFANTRY_PRIMACY: "Frontline Motorheads"
  SUBDOCTRINE_MOTORIZED_INFANTRY_PRIMACY_DESC: "Easier to field and maintain compared to mass-mechanized infantry, motorized units gain in nimbleness and versatility what they lose in protection and staying power. Be they equipped with modern all-terrain trucks or cheap pick-ups, any commander will be glad to field units that can quickly react to any threat on the battlefield."
  motorized_infantry_primacy_five_minute_pitstops: "Five Minute Pit Stops"
  motorized_infantry_primacy_five_minute_pitstops_desc: "Speed and sustainment can only be ensured if our equipment is rugged and easily fixable. Our manufacturers will design for this, or they will not design for us at all."
  motorized_infantry_primacy_need_for_speed: "The Need for Speed"
  motorized_infantry_primacy_need_for_speed_desc: "Motorized units have neither the armor nor the entrenchment of their rivals: survival demands that they are always on the move, and navigate the terrain with maximum efficiency."
  motorized_infantry_primacy_burnin_rubber_savin_lives: "Burnin' Rubber, Savin' Lives"
  motorized_infantry_primacy_burnin_rubber_savin_lives_desc: "Extending our supply lines via motorization enables men and machines to be quickly supplied or evacuated from the front."
  motorized_infantry_primacy_it_followed_me_home: "It Followed Me Home..."
  motorized_infantry_primacy_it_followed_me_home_desc: "Harrasing the enemy in the retreat can turn a withdrawal into a rout. By motorizing and integrating our long range fires we will reach them no matter how far they run."
  motorized_infantry_primacy_wheels_of_steel: "Wheels of Steel"
  motorized_infantry_primacy_wheels_of_steel_desc: "By upgrading our suspension, motorized units can be equipped with heavier weapons and light armor, while still remaining faster and cheaper than the alternative."

  SUBDOCTRINE_MECHANIZED_INFANTRY_PRIMACY: "Off-Road Interceptors"
  SUBDOCTRINE_MECHANIZED_INFANTRY_PRIMACY_DESC: "Mechanized infantry possesses the perfect combination of speed, resilience and offensive punch. Like the cataphracts of ancient history, a fully-equipped, state-of-the-art mechanized unit is costly to field and challenging to maintain in an active warzone, but their charge will make the ground tremble in its wake."
  mechanized_infantry_primacy_top_gear: "Top Gear"
  mechanized_infantry_primacy_top_gear_desc: "The most recent innovation in mobile warfare, mechanized transports can deploy infantry under fire at a very close distance from enemy positions. While mass mechanization is a costly endeavor, the impact can be mitigating by developing sturdy and reliable vehicles, and supporting them effectively with a dedicated rear echelon."
  mechanized_infantry_primacy_all_inclusive_transportation: "All-Inclusive Transportation"
  mechanized_infantry_primacy_all_inclusive_transportation_desc: "Modern mechanized transports are, in effect, self-contained environments where a squad can find ammunition, food, medical supplies, spare equipment and protection from incoming fire. When properly employed, APCs are effective force multiplier for the infantry they are assigned to, strengthening their staying power and reducing the risk of losses."
  mechanized_infantry_primacy_fasten_your_ammo_belt: "Fasten Your Ammo Belt"
  mechanized_infantry_primacy_fasten_your_ammo_belt_desc: "The first APCs employed during the Second World War were little more than armored buses. Newer models, on the contrary, sport increased offensive capabilities such as heavy machine guns or light autocannons: while not as heavily armed as proper IFVs, the ability to provide fire support to advancing troops is a critical improvement to squad tactics."
  mechanized_infantry_primacy_hotshot_mentality: "Hotshot Mentality"
  mechanized_infantry_primacy_hotshot_mentality_desc: "Despite their name, APCs are not invulnerable to enemy fire. Modern military manuals should focus on aggressive maneuvers, exploiting the protection of the armored transport to deliver the troops as close to the enemy as possible: once dismounted, the infantry will neutralize the enemy threat before it can muster enough firepower to destroy the vehicle. Rinse and repeat, until something goes horribly wrong - as it usually does in this field."
  mechanized_infantry_primacy_twisted_metal: "Steel-Plated Hussars"
  mechanized_infantry_primacy_twisted_metal_desc: "Light cavalry never went away, it simply covered itself in steel. Modern mechanized units maneuver with great speed and aggressiveness, blitzing through enemy defenses: like the Hussars of Napoleonic memory, they will let their curved saber scythe from above, delivering their thrust where it hurts the most."

  SUBDOCTRINE_CAVALRY_INFANTRY_PRIMACY: "Outriding the Eclipse"
  SUBDOCTRINE_CAVALRY_INFANTRY_PRIMACY_DESC: "To use cavalry in the age of steel and gunpowder is to walk the razor-thin edge between madness and genius. The modern cavalryman knows he mounts his steed because he has nothing better, but their enemy may not be as enlightened: rider and mount will go together, to the bitter end, hoping against hope that the speed of their charge will outrun death itself."
  cavalry_infantry_primacy_three_centuries_and_counting: "Three Millenia and Counting"
  cavalry_infantry_primacy_three_centuries_and_counting_desc: "There's very little that can be improved upon a recipe that has worked for three millennia and counting. From time immemorial, cavalry has excelled at fast reaction and reconnaissance: if we are to employ our limited means effectively, it's better to just stick to the basics and let history work its magic."
  cavalry_infantry_primacy_horse_drawn_pounder_carriages: "Horse-Drawn 25-Pounder Carriages"
  cavalry_infantry_primacy_horse_drawn_pounder_carriages_desc: "Napoleon's innovations to artillery was to make it lighter and more mobile, so that it could strike at the enemy constantly across the battle. Given our inferior means of combat, having a highly-mobile and reactive force of light artillery pieces will greatly enhance our counterbattery effectiveness."
  cavalry_infantry_primacy_mastering_nature: "Mastering Nature"
  cavalry_infantry_primacy_mastering_nature_desc: "Whoever thinks that horses and mules are better than heavy-duty logistical trucks is an incompetent and should be fired immediately. That said, given our subpar motorization, effectively employing the horses at our disposal can be a stopgap meausre to strengthen our logistical chain with vehicles that need no fuel or spare parts."
  cavalry_infantry_primacy_ride_the_lightning: "Ride the Lightning"
  cavalry_infantry_primacy_ride_the_lightning_desc: "It is widely believed that the Charge of the Light Brigade was the final epitaph of cavalry as an effective fighting force. One hundred years later and counting, we can safely affirm that this is a lie: we may be mad, or desperate, or both, but as long as our trusty companions are with us, we'll ride the lightning and live to tell the tale!"
  cavalry_infantry_primacy_evil_intimidating_horse: "Born in the Saddle"
  cavalry_infantry_primacy_evil_intimidating_horse_desc: "There's no such thing as a "doctrine" behind our use of cavalry: all that could be written has been written long before we were born. All that remains are mad people and mad horses, still fighting against all odds: from the Russian steppes to the African desert, we'll dictate the tempo of this dance!"

  ### Fire Support/ Artillery Doctrines
  SUBDOCTRINE_TOWED_ARTILLERY_FIREPOWER: "The Timeless Classic"
  SUBDOCTRINE_TOWED_ARTILLERY_FIREPOWER_DESC: "While lacking the extreme range of modern ballistic missiles and the mobility offered by self-propelled guns, standard field artillery offers a perfect balance between firepower, survivability and economy of mass production. Be it used to soften enemy positions, support an advance, or thwart a sudden attack, a dense rain of high-calibre shells never fails to deliver results: times might change, gunpowder doesn't."
  towed_artillery_firepower_tried_and_true: "Tried, True and now Improved"
  towed_artillery_firepower_tried_and_true_desc: "Updating the techniques and equipment employed in the barrel's production process is the first step to increase the effectiveness of our ranged support units. Heat-resistant alloys, improved boring and rifling machinery, and anti-warping belts will increase the service life of each piece and reduce the risk of misfiring: this will result in more reliable, more precise and generally deadlier barrages."
  towed_artillery_firepower_modular_carriages: "Modular Carriages"
  towed_artillery_firepower_modular_carriages_desc: "Updating the techniques and equipment employed in the barrel's production process is the first step to increase the effectiveness of our ranged support units. Heat-resistant alloys, improved boring and rifling machinery, and anti-warping belts will increase the service life of each piece and reduce the risk of misfiring: this will result in more reliable, more precise and generally deadlier barrages."
  towed_artillery_firepower_diy_fortifcations: "DIY Fortifications"
  towed_artillery_firepower_diy_fortifcations_desc: "The best way to protect our artillery, no matter whether the battle is an offensive or defensive one, is to position them within protected and camouflaged field emplacements to hinder enemy reconnaissance and minimize any damage.\n\nTo this end, field manuals will be distributed among artillery crews to teach modern camouflaging and entrenchment techniques."
  towed_artillery_firepower_improved_cluster_warheads: "Improved Cluster Warheads"
  towed_artillery_firepower_improved_cluster_warheads_desc: "With their ability to spread high-explosive charges over large areas, cluster munitions are the best way for artillery to stop enemy offensives or clear defensive positions in preparation of an assault.\n\nHowever, cluster submunitions are often prone to malfunction or early detonation: by improving trigger mechanisms and spread patterns, we can ensure as much of our firepower hits the intended target."
  towed_artillery_firepower_anyplace_anywhere_anytime: "Anyplace Anywhere Anytime"
  towed_artillery_firepower_anyplace_anywhere_anytime_desc: "By using alphanumeric ciphers and a universal grid, we can translate any geological position on the planet into an unambiguous and univocal code that can be immediately understood by the recipient: this will dramatically increase coordination and responsiveness of our artillery barrages."

  SUBDOCTRINE_SP_ARTILLERY_FIREPOWER: "The Modern Alternative"
  SUBDOCTRINE_SP_ARTILLERY_FIREPOWER_DESC: "Self-propelled guns combine the destructive power of an artillery barrage with the speed of mobile units and the staying power of an armored vehicle. While costlier than their towed equivalents, and more complicated to maintain and organize, armored artillery can provide decisive support to any operation."
  sp_artillery_firepower_top_guns: "Top Guns"
  sp_artillery_firepower_top_guns_desc: "The Second World War saw the successful use of many dual-use platforms that could provide both anti-air and anti-tank support. By modernizing such weapons and installing them on an armored chassis, the resulting self-propelled vehicle would be highly versatile, and able to engage both aerial and land targets."
  sp_artillery_firepower_anchored: "The Anchor"
  sp_artillery_firepower_anchored_desc: "Being tracked vehicles, self-propelled guns are prone to recoiling when their large-calibre pieces open fire. In order to reduce recoil and improve general effectiveness, the armored chassis will be fitted with recoil-reducing spades in its rear: by discharging part of the inertial energy into the ground, displacement by recoil will be greatly diminished, reducing shot dispersal probability in longer barrages."
  sp_artillery_firepower_rock_paper_scissors: "Rock Paper Scissors"
  sp_artillery_firepower_rock_paper_scissors_desc: "Due to their high production cost and the logistical challenge of maintaining a large fleet of armored vehicles, it is rare for self-propelled artillery to be deployed in similar numbers to towed guns. Therefore, barrage effectiveness must be improved by increasing average precision of each round: as the latest development in the field of long-range engagement, laser-guided rounds can adjust the trajectory mid-flight, hitting the target even if it has moved after the shot was fired."
  sp_artillery_firepower_advanced_firing_positions: "Advanced Firing Positions"
  sp_artillery_firepower_advanced_firing_positions_desc: "We must make full use of the heightened mobility of self-propelled guns to establish proximate firing positions from which we can unleash their full force upon the enemy. Exposing this valuable equipment to our foes will be a risk, but the heightened accuracy and lethality is worth it."
  sp_artillery_firepower_shoot_and_scoot: "Shoot and Scoot"
  sp_artillery_firepower_shoot_and_scoot_desc: "Unlike towed artillery, self-propelled guns have both the size and the means to sustain a fully-automated loading mechanism. When mounted on vehicles with modern ammunition dispensing layouts, such systems can drastically reduce loading times, especially on large-calibre guns. This will not only increase the lethality of their barrage, but also increase survivability by reducing exposure time through quick manuevers away from threats." 

  SUBDOCTRINE_ALTERNATIVE_ARTILLERY_FIREPOWER: "Alternative Firepower"
  SUBDOCTRINE_ALTERNATIVE_ARTILLERY_FIREPOWER_DESC: "Without the industrial capacity to field a large artillery force, we cannot hope to meet the enemy long-range support on equal ground. Instead, our tactics must be geared towards countering enemy firepower, reducing their impact on the flow of battle and inflicting disproportionate artillery losses: as long as the attrition balance remains positive, the enemy will not achieve supremacy."
  alternative_artillery_firepower_defensive_artillery_tactics: "Defensive Artillery Tactics"
  alternative_artillery_firepower_defensive_artillery_tactics_desc: "Without the industrial capacity to field a large artillery force, we cannot hope to meet the enemy long-range support on equal ground. Instead, our tactics must be geared towards countering enemy firepower, reducing their impact on the flow of battle and inflicting disproportionate artillery losses: as long as the attrition balance remains positive, the enemy will not achieve supremacy."
  alternative_artillery_firepower_heavy_mortars: "Heavy Mortars"
  alternative_artillery_firepower_heavy_mortars_desc: "Though lacking the same range and destructive power as towed artillery, heavy mortars are cheaper to produce, faster to deploy and easier to conceal. By adding a heavy mortar platoon to each infantry battalion, our troops will have the means to support their operations even without artillery cover: of course, this will make our infantry forces somewhat slower to move around the battlefield."
  alternative_artillery_firepower_sky_denial_tactics: "Sky Denial Tactics"
  alternative_artillery_firepower_sky_denial_tactics_desc: "Aerial bombardment can cause widespread destruction as much as any artillery barrage, if not more. Without the means to deploy a large air force to protect our skies, we must at the very least deny freedom of operation to the enemy: widespread anti-air batteries and effective reconnaissance will, if not entirely disrupt enemy air support operations, at the very least make them a costly endeavor."
  alternative_artillery_firepower_tank_hunting_manuals: "Tank-Hunting Manuals"
  alternative_artillery_firepower_tank_hunting_manuals_desc: "If we are unable to match the massed tank forces of our enemy, then our task is to at least reduce our vulnerability to them. Man-portable anti-tank weapons are cheap enough for widespread distribution among infantry forces: good training, and support from our limited pool of anti-tank cannons, will maximize survivability for our forces and make any armored advance a bloody affair for the enemy."
  alternative_artillery_firepower_pivotal_barrages: "Pivotal Barrages"
  alternative_artillery_firepower_pivotal_barrages_desc: "The less artillery an army has, the more difficult it is to make it count. In order to extract as much effectiveness as possible from our limited artillery forces, we must employ extensive reconnaissance and careful planning: barrages must be coordinated and precise, and all guns must be able to quickly redeploy to avoid counterbattery fire."

  SUBDOCTRINE_AERIAL_ARTILLERY_FIREPOWER: "Aerial Firepower"
  SUBDOCTRINE_AERIAL_ARTILLERY_FIREPOWER_DESC: "In the modern, air-saturated battlefield, direct aerial bombardment is a risky gambit, but one that can wield incredible results. For the daring commander, modern aircraft can deliver with pinpoint accuracy payload that no howitzer would be able to hurl, at distances no cannon would be able to reach."
  aerial_artillery_firepower_who_needs_land: "Who Needs Land?"
  aerial_artillery_firepower_who_needs_land_desc: "Our relative dominance in the air allows us to substitute bombardment for artillery shells. An inexact swap with declining marginal benefits, but one that allows us to concentrate our scarce industrial and command resources on our military's strong suit."

  ### Armor Support Doctrines - Buffs One Specific Armor Type
  SUBDOCTRINE_HEAVY_ARMOR_SUPPORT: "Kings of the Battlefield"
  SUBDOCTRINE_HEAVY_ARMOR_SUPPORT_DESC: "Consecrated by the last war as the Kings of the Battlefield, heavy tanks bring forth their armored might against any foe unfortunate enough to stand in its path... as long as one is ready to pay the enormous economic and logistical price of fielding and maintaining such venerable machines - a King's ransom indeed. For the commander fortunate enough to field them, proper support and logistical efficiency are paramount."
  heavy_armor_support_draw_the_line_well_cross_it: "Draw the Line, We'll Cross it"
  heavy_armor_support_draw_the_line_well_cross_it_desc: "Heavy tanks were made to cross lines, the first of which was the very fact of their existence. There may be other ways to achieve the same result with a more efficient allocation of resources, but heavy tanks were not made to be efficient - they were made to flatten anyone unfortunate enough to stand in their path."
  heavy_armor_support_grease_monkey_nightmare: "A Grease-Monkey's Worst Nightmare"
  heavy_armor_support_grease_monkey_nightmare_desc: "The sheer logistical nightmare of fielding a sizable fleet of heavy tanks requires a large and specialized support echelon. These monsters often present problems to transmission, suspensions, tracks and turret hydraulics: therefore, spare parts, towing vehicles and mechanics must always be available to maintain combat fitness."
  heavy_armor_support_determination_that_is_incorruptable: "Determination That is Incorruptible"
  heavy_armor_support_determination_that_is_incorruptable_desc: "To be chosen as a heavy tank crew is an honor bestowed only upon seasoned operators... if anything, because inexperienced crews have a good chance of turning their vehicle into a fiery ball of death by pressing the wrong button. Still, this selection method has turned our heavy tank units into a well-coordinated and disciplined force, always ready to fulfill their orders to the letter and relentles in the pursuit of victory."
  heavy_armor_support_not_in_the_least_anachronistic: "Not in the Least Anachronistic"
  heavy_armor_support_not_in_the_least_anachronistic_desc: "There are some who say that heavy tanks are a relic of the past, and that their function can be performed just as well by modern Main Battle Tanks for a cheaper price. These people are all cowards and traitors, and should all be trampled to death under our tanks' threads... as soon as the next modernization package for our ageing fleet is passed, of course!"
  heavy_armor_support_blood_and_iron: "Blood and Iron"
  heavy_armor_support_blood_and_iron_desc: "Deploying heavy tanks is not merely a matter of tactics. When using such powerful vehicles, a commander must also understand the moral and political consequences of their action: heavy tanks have an effect on enemy morale that cannot be explained by modern manuals, and terror can be as effective a weapon as a main battle cannon in breaking the enemy."
 
  SUBDOCTRINE_MEDIUM_ARMOR_SUPPORT: "Knights in Shining Armor"
  SUBDOCTRINE_MEDIUM_ARMOR_SUPPORT_DESC: "Spiritual heirs to the Panzer IV, the Sherman and the T-34, modern main battle tanks try to achieve the same blend of versatility, reliability and ease of construction that marked their august predecessors. Once, tanks were so few that they were compared to modern knights on the battlefield: now, in this era of mass mechanization, we are all knights!"
  medium_armor_support_lead_the_charge: "Lead the Charge"
  medium_armor_support_lead_the_charge_desc: "Main Battle Tanks strive to achieve the perfect balance between numbers, versatility and offensive power. If properly supported, an armored charge can break through any enemy defense, allowing the army to penetrate deeply and cut off logistical routes and pre-planned redoubts: modern tactics and engagement manuals should focus on effective communication and coordination, as well as target prioritization."
  medium_armor_support_ninety_mm_battlecry: "Ninety-Five Millimeter Battlecry"
  medium_armor_support_ninety_mm_battlecry_desc: "The weapons mounted on the turrets of Main Battle Tanks not only powerful, but also versatile as they can fire a large variety of ammunition from penetrator rounds to high-explosive shells. This makes a tank company an effective force multiplier, as they support the rest of the army as much as they are supported, singing a symphony of destruction from their smoothbore mouths."
  medium_armor_support_knights_and_squires: "Knights and Squires"
  medium_armor_support_knights_and_squires_desc: "The knights of old needed a coterie of squires to always maintain their weapons and armor at peak conditions. Times might have changed, but the need for a qualified support echelon has remained the same: our armored units will be followed by specialized support vehicles such as tracked tows and mobile repair shops, and the attached complement of mechanics and logistics personnel."
  medium_armor_support_virtuous_service: "Virtuous Service"
  medium_armor_support_virtuous_service_desc: "While much attention is given to the more offensive aspect of an armored force, one should never forget that tanks also offer great support to the rest of the army. When a tank battalion enters the fray, their concentrated firepower can effectively suppress enemy formations and silence their artillery: as long as the flow of battle is kept fluid, our tanks' virtuous service will protect the entire army."
  medium_armor_support_saints_and_soldiers: "Saints and Soldiers"
  medium_armor_support_saints_and_soldiers_desc: "Ancient knights were seen as saints by the common soldiery. Why wouldn't they, when they were effectively invulnerable to enemy weapons and could cut through enemy formations like the wrath of God incarnate? Through rigorous training, technical excellence and modern tactics, our armored forces will descend upon the foe like a retinue of warrior saints: glory to us, and faith in our victory!"

  SUBDOCTRINE_LIGHT_ARMOR_SUPPORT: "Best of All the Worlds"
  SUBDOCTRINE_LIGHT_ARMOR_SUPPORT_DESC: "Modern AFVs are the logical successors to the light tanks of the last war. Thanks to technological breakthroughs, these vehicles blend agility with resilience, and can punch above their stature as long as their limitations are kept into consideration by a wise commander."
  light_armor_support_tool_for_every_job: "The Tool for Every Job"
  light_armor_support_tool_for_every_job_desc: "Faster than a horse, more survivable than a truck, cheaper than a tank, and usually able to bring enough fire to bear that any but the superpowers will need to think twice about facing one head on. The AFV is a decent answer to just about any problem faced by the modern commander."
  light_armor_support_friend_of_every_man: "Friend of Every Man"
  light_armor_support_friend_of_every_man_desc: "There are few tasks for a soldier which a good AFV will not make easier or more effective. The extra armor and carrying capacity allows all parts of a unit to take better shelter and organize more effectively under fire, as well as more aggressively seek out the enemy's position."
  light_armor_support_high_roller_by_design: "High Roller By Design"
  light_armor_support_high_roller_by_design_desc: "By designing our AFVs to carry larger guns and training their crews in tank tactics, we can emulate the tactics of maneuver warfare at a fraction of the cost."
  light_armor_support_one_thousand_more_miles_on_the_clock: "One Thousand More Miles on the Clock"
  light_armor_support_one_thousand_more_miles_on_the_clock_desc: "Focusing on improving the engine and suspension of our workhorse will increase the speed of the platform, and enable the AFV to exploit gaps in the enemies defense which would otherwise go unexploited. It will also improve the lifespan of every vehicle, ensuring we get more out of every one."
  light_armor_support_woe_the_middle_child: "Woe the Middle Child"
  light_armor_support_woe_the_middle_child_desc: "Our long experience in both the construction and use of AFVs has led to us becoming leading experts in the field. While we do not have the resources of the great powers or the desperate tenacity of the poor, what we do have we have mastered in full. Woe to him who underestimates the middle power."
 
  SUBDOCTRINE_ARMORED_CAR_SUPPORT: "Not Size That Matters"
  SUBDOCTRINE_ARMORED_CAR_SUPPORT_DESC: "Due to our nation's poorly developed industry, utilizing proper Armor battalions is beyond our means.\n\nAs such, we will instead focus our MiC on Light Armor Support elements such as specialized Support Companies and Armored Cars that can assist our units on the field.\n\nDue to the relatively simple production behind such vehicles, specializing in them will also result in higher production capabilities."
  armored_car_support_improved_recon: "Elite Recon Elements"
  armored_car_support_improved_recon_desc: "Armored cars are a natural evolution over cavalry, offering the same speed and maneuverability in difficult terrain while still fitted with modern electronics and a degree of armored protection. Such a blend of qualities makes these vehicles perfect for reconnaissance: small patrols of armored cars equipped with scanning gear and powerful radios can cover even a large area effectively and with little risk for the operators."
  armored_car_support_more_than_a_vehicle: "More Than a Fighting Vehicle"
  armored_car_support_more_than_a_vehicle_desc: "While unsuited for prolonged combat, armored cars nonetheless have a niche where they excel. Like their predecessors such as the German Schwerer Panzerspähwagen, light wheeled vehicles can equip autocannons or light anti-tank weapons with little loss of mobility: this way, they can support heavier AFVs, providing suppressive fire or engaging smaller targets to pave the way for their larger brethren."
  armored_car_support_we_brave_few: "We Brave Few"
  armored_car_support_we_brave_few_desc: "There is a degree of poetic justice in seeing an outnumbered and outgunned army prevail over a much-stronger foe. Like the English Army at Agincourt, the path to victory lies in maximizing one's own advantages and working diligently to deny the enemy their own: with careful reconnaissance, competent planning and zealous execution, even a lighter force such as ours may yet prevail."
  armored_car_support_strategic_positioning: "Strategic Positioning"
  armored_car_support_strategic_positioning_desc: "Speed is the greatest advantage armored cars have over their larger counterparts, and it should be used to its full extent. Moving ahead of the main thrust, small patrols can occupy strategic positions to set up ambushes or interlocking fields of fire: by striking at the enemy's most vulnerable points, these armored cars can punch way above their class, disabling or outright destroying mechanized transports or artillery."
  armored_car_support_not_size_that_matters: "Big Game Hunting"
  armored_car_support_not_size_that_matters_desc: "Recent innovation in shaped charges and recoil management have led to smaller, but still effective anti-tank weapons. These new inventions can be easily fitted even on light vehicles such as armored cars: tailoring new tactics around the bold use of light tank-hunters and assault vehicles, our forces can effectively support the rest of the army by engagind and disabling tanks and other strategic enemy assets."

  ### Operational Doctrine - Defines the Role of the Armed Forces
  SUBDOCTRINE_COIN_OPERATIONAL_DOCTRINE: "Counter-Insurgency"
  SUBDOCTRINE_COIN_OPERATIONAL_DOCTRINE_DESC: "In this new, Cold War, the threat of conventional warfare between superpowers has been supplanted by proxy conflicts and foreign-funded insurgencies. It is an unexplored battlefield, where the enemy lurks behind every corner and may wear the face of our loved ones: personal initiative and intuition - helped by covert intelligence and the occasional napalm bombardment - will be key to victory."
  coin_operational_doctrine_cordon_sanitaire: "Cordon Sanitaire"
  coin_operational_doctrine_cordon_sanitaire_desc: "The first step is to eliminate the insurgents' ability to move as they please. By surrounding designated areas and refusing all entry without a pass we can isolate the guerillas."
  coin_operational_doctrine_butcher_and_bolt: "Butcher and Bolt"
  coin_operational_doctrine_butcher_and_bolt_desc: "Not every area can be cordoned off, and those areas which remain ungoverned become recruiting and supply grounds. By using mobile troops we will damage these areas and leave before the resistance can contest us."
  coin_operational_doctrine_secure_collect_protect: "Secure, Collect, Protect"
  coin_operational_doctrine_secure_collect_protect_desc: "Counter-Insurgency is a strategy of political attrition, and our men cannot be seen as mere despoilers. Fortified, protected locations will permit prying eyes, while everything outside of these zones must be military access only."
  coin_operational_doctrine_zero_tolerance: "Zero Tolerance"
  coin_operational_doctrine_zero_tolerance_desc: "Training recon units to identify the signs of potential resistance enables them to better alert armed units where to find the enemy. By attacking not only where the enemy is known but where it is suspected, the resources available to them will be even further constrained."
  coin_operational_doctrine_innocence_proves_nothing: "Innocence Proves Nothing"
  coin_operational_doctrine_innocence_proves_nothing_desc: "Professional and alert men, aided by knowledgeable locals, can leap upon even the most minor act of resistance. By smothering these initial embers the flame of rebellion will never have the opportunity to spread and organize."

  SUBDOCTRINE_GUERRILLA_OPERATIONAL_DOCTRINE: "People's War"
  SUBDOCTRINE_GUERRILLA_OPERATIONAL_DOCTRINE_DESC: "We, the People, will not stand for oppression. Even if we are outnumbered, even if we are outgunned, we will resist to the bitter end: in this righeous struggle for our very survival, no tactic is too underhanded, no subterfuge too extreme. Victory may be a mirage, but our promise is real: for the crime of entering our home bearing arms, the invader will bleed."
  guerrilla_operational_doctrine_amongst_the_masses: "Moving Amongst the Masses"
  guerrilla_operational_doctrine_amongst_the_masses_desc: "Without popular support, or at least popular submission, our units will quickly be identified, surrounded and destroyed. Every fighter for our cause must maintain the discipline needed to ensure the masses part like water for them, rather than unite against them."
  guerrilla_operational_doctrine_ex_nihilo: "Ex Nihilo"
  guerrilla_operational_doctrine_ex_nihilo_desc: "Our weapons, food and pay must come through irregular sources. By either allying with or taking over smuggling routes and pressuring complacent authorities the restrictions of the state will not hinder us."
  guerrilla_operational_doctrine_behind_every_blade_of_grass: "Behind Every Blade of Grass"
  guerrilla_operational_doctrine_behind_every_blade_of_grass_desc: "To be both everywhere and nowhere is the guerrilla's aim. By infiltrating forbidden zones, setting ambushes and bombs in unexpected places, and dispersing our units across a wide area, we force the enemy to attempt to defend everything."
  guerrilla_operational_doctrine_attrition_of_the_will: "Attrition of the Will"
  guerrilla_operational_doctrine_attrition_of_the_will_desc: "For all wars the question of will is the ultimate decider: without it even the strongest will not fight, with it even the weakest will not surrender. Our tactics will focus on depleting the will of the enemy, both their soldiers and their civilians, by any means necessary."
  guerrilla_operational_doctrine_warriors_of_the_flea: "A Just Cause"
  guerrilla_operational_doctrine_warriors_of_the_flea_desc: "Ultimately our goal must be to reorganize as a regular army, and for that we must establish liberated zones within our control. By employing propaganda and responsive governance we will bind the people to our cause, preparing them to provide support for the army in the open."

  SUBDOCTRINE_SPECOPS_OPERATIONAL_DOCTRINE: "Individual Excellence"
  SUBDOCTRINE_SPECOPS_OPERATIONAL_DOCTRINE_DESC: "Ten elite men can achieve in a day what a thousand of common soldiery will struggle one month to secure. A strong cadre of specialists, given the best training and equipment our country can offer, will act as our spearhead in any engagement: extensive planning, timely deployment and effective air support - of both wing and rotor variety - are fundamental to achieve victory without losing our investment."
  specops_operational_doctrine_adaptive_combat_training: "Adaptive Command Training"
  specops_operational_doctrine_adaptive_combat_training_desc: "War is chaos and uncertainty, and our commanders must be trained to work autonomously within that environment. Rather than rote memorization, our leaders must be creative and flexible to adapt to any circumstance."
  specops_operational_doctrine_battlefield_self_sufficiency: "Battlefield Self-Sufficiency"
  specops_operational_doctrine_battlefield_self_sufficiency_desc: "A unit being fully dependent on a standard logistics chain makes them slow and predictable. By training our best in the arts of conservation, scavenging and improvisation they will fight harder and longer even when cut off."
  specops_operational_doctrine_dynamic_battleplanning: "Dynamic Battleplanning"
  specops_operational_doctrine_dynamic_battleplanning_desc: "A perfect plan is a myth, instead battles are decided by who can make a good enough plan faster than the enemy. Attacking at night and with greater elan that the foe will keep them on the backfoot and win the initiative to our own units"
  specops_operational_doctrine_valorous_service: "Men of Valor"
  specops_operational_doctrine_valorous_service_desc: "Our great men of war are the pride not only of the army but of our entire nation. Every patriotic young man wants to be one of them, and so the army has its pick of the best and brightest to choose from. The pride and status of the elite ensures they learn faster and hit harder than the enemy."
  specops_operational_doctrine_creme_de_la_creme: "Crème de la Crème"
  specops_operational_doctrine_creme_de_la_creme_desc: "Through the ruthless training and high standards of equipment the cream of our nation rises to the top and is then forged into superior war fighters. Institutional knowledge, a culture of innovation and endless training ensure that their status as the best will not fade away."

  SUBDOCTRINE_COMBINED_OPERATIONAL_DOCTRINE: "Combined Arms Operations"
  SUBDOCTRINE_COMBINED_OPERATIONAL_DOCTRINE_DESC: "An army is more than the mathematical sum of the men and material that make it up. An army is a living organism: it is made of flesh and metal, kept together by its command chain in the same way ligaments and nerves allow a body to act. Effective training, careful planning and well-honed cooperation between its branches will allow our armed forces to inflict maximum damage and limit losses within affordable parameters."
  combined_operational_doctrine_naval_support: "Naval Support"
  combined_operational_doctrine_naval_support_desc: "Fighting near the coast and conducting naval invasions are made far easier when both naval and ground elements are integrated and able to support each other's fires. Investing into the marines as the meeting of the two branches will enable us to breach any body of water."
  combined_operational_doctrine_air_land_battle: "Air-Land Battle"
  combined_operational_doctrine_air_land_battle_desc: "By ensuring air support has a direct connection to ground forces, precise fires can be made with maximum effective impact. The ideal platform for this mission is the attack helicopter, and so we shall invest into perfecting this new tool."
  combined_operational_doctrine_cogs_in_the_machine: "Cogs in the Machine"
  combined_operational_doctrine_cogs_in_the_machine_desc: "Consistent coordination between the branches requires that the equipment used by all be standardized and interchangeable. By ensuring repair and logistics is as painless as possible a point of potential friction can be eliminated and all elements well supplied."
  combined_operational_doctrine_iron_warriors: "Iron Warriors"
  combined_operational_doctrine_iron_warriors_desc: "Employing armored units into the support structure will provide greater survivability and tenacity to all ground units. Even those which are not dedicated armor divisions will be better able to follow and support the speartip of any offensive, enhancing those units' abilities."
  combined_operational_doctrine_all_in: "All In"
  combined_operational_doctrine_all_in_desc: "By leveraging the full spectrum of battlefield superiority, a single break in the line is all that is needed for the combined might of the entire armed forces to charge and overwhelm the enemy. Hit from air, land and sea the enemy will be unable to reestablish the defense."

  SUBDOCTRINE_SPEARHEAD_OPERATIONAL_DOCTRINE: "Spearhead Operations"
  SUBDOCTRINE_SPEARHEAD_OPERATIONAL_DOCTRINE_DESC: "Some countries may base their entire doctrine on outlasting their opponent in an attritional warfare. We reject these premises, and instead plan our approach to battle around a strong armored spearhead: there will be no attrition, if there's nothing of the enemy left to fight."
  spearhead_operational_doctrine_sweep_the_field: "Sweep the Field"
  spearhead_operational_doctrine_sweep_the_field_desc: "Speed and aggression are the twin keys to victory. Even at the cost of fuel consumption, maneuvering around or smashing through the enemy to cut them off from all supply is key to paralyzing and then destroying the enemy force."
  spearhead_operational_doctrine_long_haul_deep_pockets: "Long Haul, Deep Pockets"
  spearhead_operational_doctrine_long_haul_deep_pockets_desc: "Because we are so reliant on severing the enemy's supply, it is vital that our own units not run out of supply while securing the back lines. Designing for fuel efficiency, fuel capacity and logistical excellence will allow our units to operate faster, longer."
  spearhead_operational_doctrine_air_land_battle: "Javelins from the Clouds"
  spearhead_operational_doctrine_air_land_battle_desc: "Providing direct aerial support to our forward units will greatly increase their ability to quickly overcome fortifications and defend against any attempted counter attacks. Attack helicopters can both follow and protect forward units regardless of their speed."
  spearhead_operational_doctrine_preparing_is_half_the_battle: "Preparing is Half the Battle"
  spearhead_operational_doctrine_preparing_is_half_the_battle_desc: "In order to maintain the pace of our offensives our troops will need to both train to quickly plan and organize for the attack as well as be equipped with the tools needed to maintain their weapons. Both men and equipment must be ready to charge at a moment's notice."
  spearhead_operational_doctrine_indestructible: "Indestructible"
  spearhead_operational_doctrine_indestructible_desc: "Every element of a division must be capable of keeping pace with the main battle thrust. Armor for support elements will enable even greater pressure to be placed on the enemy as our own forces no longer need to protect a soft underbelly and so attack with all forces at their disposal. "

  SUBDOCTRINE_DEFENSE_OPERATIONAL_DOCTRINE: "Elastic Defense Operations"
  SUBDOCTRINE_DEFENSE_OPERATIONAL_DOCTRINE_DESC: "The concept of elastic defense is not new, having been employed as far back as the times of the Roman Empire. What is new, is the means to pursue it: if we are forced to retreat, we will do so in good order and to pre-planned positions, harrying the enemy from established directions to inflict maximum losses, always ready to exploit any blunder or overextension. As long as our men survive, our land will be retaken."
  defense_operational_doctrine_army_reserve_training: "Army Reserve Training"
  defense_operational_doctrine_army_reserve_training_desc: "In matters of war, preparing for the worst is never futile. Planning for an elastic defense involves accepting that the enemy may achieve localized breakthroughs and even annihilate some of our units: therefore, a key pillar of our strategy is a sizable and well-trained reserve, that can be called with little notice to man fortifications and plug gaps in the frontline."
  defense_operational_doctrine_prepared_redoubt_system: "Prepared Redoubt Systems"
  defense_operational_doctrine_prepared_redoubt_system_desc: "Building modern fortifications is a work that requires weeks, even months. While we can't preemptively destroy our country, we can hasten the work of our military engineers by preparing in advance for the eventuality: a widespread redoubt system of pre-built bunkers, depots and artillery positions will serve as a fortified core, that can be quickly expanded when needed with multi-layered trenches and minefields."
  defense_operational_doctrine_supply_chain_reinforcement: "Supply Chain Reinforcement"
  defense_operational_doctrine_supply_chain_reinforcement_desc: "When actively engaged in elastic defense, logistical lines become as fluid as the frontline, and mistakes in coordination can cost us valuable resources. Therefore, it is important that we plan in advance for potential enemy breakthroughs or localized counteroffensives: a capillar web of supply depots and province-based quartermasters will allow us to always keep our troops supplied, no matter where the fighting happens."
  defense_operational_doctrine_mountain_cannot_bow: "The Mountain Cannot Bow"
  defense_operational_doctrine_mountain_cannot_bow_desc: "Our country is a mountain, and like a mountain, it will not - nay, it cannot - bow. Its foundations are the very root of the earth, its peaks are taller than whatever the enemy can throw against us: as long as our people is united, and our army is ready to fight to the last in defense of our independence, then we will endure as an impregnable fortress - defiant and unyielding!"
  defense_operational_doctrine_this_well_defend: "This We'll Defend"
  defense_operational_doctrine_this_well_defend_desc: "As the old saying goes, one can turn necessity into a boon. As we prepare to fight throughout our own country, we can readily call upon our people to take up arms in defense of their homes and families: nationalist propaganda and local reserve officers will ensure that our provincial units are always motivated and ready to fight with zeal, if it means a chance to protect those they love."



  SUBDOCTRINE_ADAPTIVE_COMMAND_TRAINING: "Adaptive Command Training"
  SUBDOCTRINE_ADAPTIVE_COMMAND_TRAINING_DESC: "The tides of war can be as unpredictable as those of a stormy sea, and we must train our officers to account for this reality. Soon not even surprise and circumstance are acceptable excuses."
  adaptive_command_training_1: ""
  adaptive_command_training_2: ""
  adaptive_command_training_3: ""
  adaptive_command_training_4: ""
  adaptive_command_training_5: ""
  SUBDOCTRINE_MISSION_TYPE_TACTICS: "Mission-Type Tactics"
  SUBDOCTRINE_MISSION_TYPE_TACTICS_DESC: "While we cannot always expect our officers to predict the circumstances of combat, we can train them in every scenario we can think of. The more familiar they become with the situations they are likely to encounter, the better our officers will be able to confront our enemies in a more efficient fashion."
  mission_type_tactics_1: ""
  mission_type_tactics_2: ""
  mission_type_tactics_3: ""
  mission_type_tactics_4: ""
  mission_type_tactics_5: ""
  SUBDOCTRINE_MILITARY_DECEPTION: "Military Deception"
  SUBDOCTRINE_MILITARY_DECEPTION_DESC: "Part of the problem of adopting a strategy used to win the biggest war in history is that tactics are developed to counter it. Our enemies are doubtless ready to rush reinforcements to wherever we attack - therefore, we shall use feints to trick them into sending their forces away from the true battle."
  military_deception_1: ""
  military_deception_2: ""
  military_deception_3: ""
  military_deception_4: ""
  military_deception_5: ""

  SUBDOCTRINE_ASSAULT_CONCENTRATION: "Assault Concentration"
  SUBDOCTRINE_ASSAULT_CONCENTRATION_DESC: "Our officers shall conduct en masse attacks as resources and war's fortunes permit. They may be adepts in fighting equal or superior forces, but they are savants in fighting with the deck stacked in their favor."
  asssault_concentration_1: ""
  asssault_concentration_2: ""
  asssault_concentration_3: ""
  asssault_concentration_4: ""
  asssault_concentration_5: ""
  SUBDOCTRINE_STRATEGIC_DEPTH_EXPLOITATION: "Strategic Depth Exploitation"
  SUBDOCTRINE_STRATEGIC_DEPTH_EXPLOITATION_DESC: "We will strive to keep a significant distance between our front lines and the vulnerable home front. The use of depots and armories along the routes and airports for transportation will ensure that we are able to attack and defend without worrying about throwing our defenses into disarray."
  strategic_depth_exploitation_1: ""
  strategic_depth_exploitation_2: ""
  strategic_depth_exploitation_3: ""
  strategic_depth_exploitation_4: ""
  strategic_depth_exploitation_5: ""
  SUBDOCTRINE_SUPPLY_CHAIN_EXTENSION: "Supply-Chain Extension"
  SUBDOCTRINE_SUPPLY_CHAIN_EXTENSION_DESC: "Fighting deep into enemy territory is often required of the mobile modern army, likewise leaving them vulnerable to supply shortages and encirclement. We will train our generals to extend their supply lines through the use of rear echelon forces and garrisons that can secure the roads from home."
  supply_chain_extension_1: ""
  supply_chain_extension_2: ""
  supply_chain_extension_3: ""
  supply_chain_extension_4: ""
  supply_chain_extension_5: ""

  SUBDOCTRINE_SHOCK_AND_AWE: "Shock And Awe"
  SUBDOCTRINE_SHOCK_AND_AWE_DESC: "Even a well-prepared enemy can be thrown off of their footing by an impressive enough display of firepower and force. By leveraging massed artillery fire, coordinated air strikes, and overwhelming numbers at the point of contact any enemy can be crushed."
  shock_and_awe_1: ""
  shock_and_awe_2: ""
  shock_and_awe_3: ""
  shock_and_awe_4: ""
  shock_and_awe_5: ""

  ## Strategic Theorem
  SUBDOCTRINE_PREPARED_DEFENSE: "Prepared Redoubt Systems"
  SUBDOCTRINE_PREPARED_DEFENSE_DESC: "Small, well-fortified redoubts will serve as early warning systems against incoming enemy attacks. If positioned at certain strategic positions, these redoubts can delay offensives for hours and even days."
  prepared_redoubt_systems_1: ""
  prepared_redoubt_systems_2: ""
  prepared_redoubt_systems_3: ""
  prepared_redoubt_systems_4: ""
  prepared_redoubt_systems_5: ""
  SUBDOCTRINE_ARMY_RESERVE_TRAINING: "Army Reserve Training"
  SUBDOCTRINE_ARMY_RESERVE_TRAINING_DESC: "Guns, tanks and planes only perform as well as the men who man them. Take away the men, and even the most sophisticated weapon systems remain as inert and useless as scrap metal. A healthy reserve corps will preclude this scenario from occurring in our armies."
  army_reserve_training_1: ""
  army_reserve_training_2: ""
  army_reserve_training_3: ""
  army_reserve_training_4: ""
  army_reserve_training_5: ""
  SUBDOCTRINE_INFRASTRUCTURAL_RESERVE: "Infrastructural Reserve"
  SUBDOCTRINE_INFRASTRUCTURAL_RESERVE_DESC: "By maintaining a stockpile of construction materials, construction equipment and construction workers on hand, roads and factories damaged from air strikes or artillery fire will not have to wait long before returning to work as good as new."
  infrastructural_reserve_1: ""
  infrastructural_reserve_2: ""
  infrastructural_reserve_3: ""
  infrastructural_reserve_4: ""
  infrastructural_reserve_5: ""

  SUBDOCTRINE_OPERATIONAL_ASSAULT: "Operational Assault"
  SUBDOCTRINE_OPERATIONAL_ASSAULT_DESC: "An offensive attacks not only from the front, but also behind the adversary's lines and within their home fronts. A good general masters all three attacks to achieve unconditional victory."
  operationl_assault_1: ""
  operationl_assault_2: ""
  operationl_assault_3: ""
  operationl_assault_4: ""
  operationl_assault_5: ""
  SUBDOCTRINE_LARGE_FRONT_OPERATIONS: "Large Front Operations"
  SUBDOCTRINE_LARGE_FRONT_OPERATIONS_DESC: "By striking the enemy at multiple points simultaneously along their entire front we can keep our foes on their backfoot and without the initiative. They dare not launch a counterattack for fear of being broken through down the line and they further have no ability to reinforce the points of contact as there are too many to handle even by the best led armies."
  large_front_operations_1: ""
  large_front_operations_2: ""
  large_front_operations_3: ""
  large_front_operations_4: ""
  large_front_operations_5: ""
  SUBDOCTRINE_OVERWHELMING_FORCE: "Overwhelming Force"
  SUBDOCTRINE_OVERWHELMING_FORCE_DESC: "There is no point in fighting a battle you cannot be sure you will win. In modern warfare, the waste of equipment and manpower cannot be condoned. That is why, when we do attack, we do so with such a massed force as to sweep away any defensive that might be offered."
  overwhelming_force_1: ""
  overwhelming_force_2: ""
  overwhelming_force_3: ""
  overwhelming_force_4: ""
  overwhelming_force_5: ""

  SUBDOCTRINE_COMPREHENSIVE_STRATEGIC_ANALYSIS: "Comprehensive Strategic Analysis"
  SUBDOCTRINE_COMPREHENSIVE_STRATEGIC_ANALYSIS_DESC: "We need to train our staff officers to be able to grasp the strategic implication of every on-ground decision, and to be able to see the big picture as well as the small. Far too often an army is ruined by an inability to look beyond the tactical level. This will not happen to our forces, as our generals will have the skills needed to craft intelligent and successful operations."
  comprehensive_strategic_analysis_1: ""
  comprehensive_strategic_analysis_2: ""
  comprehensive_strategic_analysis_3: ""
  comprehensive_strategic_analysis_4: ""
  comprehensive_strategic_analysis_5: ""
  SUBDOCTRINE_LARGE_SCALE_EXERCISES: "Large Scale Exercises"
  SUBDOCTRINE_LARGE_SCALE_EXERCISES_DESC: "Individual recruit training is of course, a requirement for any professional army, but so too is strategic training. Using divisions, corps, and even entire armies we can simulate massive battlefields in which our generals will be able to learn the skills of directing troops and our soldiers will better learn to fight in their greater roles together."
  large_scale_exercises_1: ""
  large_scale_exercises_2: ""
  large_scale_exercises_3: ""
  large_scale_exercises_4: ""
  large_scale_exercises_5: ""

  SUBDOCTRINE_SUPPLY_ROUTES: "Supply Chain Reinforcement"
  SUBDOCTRINE_SUPPLY_ROUTES_DESC: "Our use of large scale operations is contingent upon plentiful supply lines. It is therefore imperative that we adequately prepare them by using our engineers to rebuild infrastructure in occupied territories and using reserve forces as truck drivers and escorts wherever possible to ensure a steady line of supply reaches the front."
  supply_chain_reinforcement_1: ""
  supply_chain_reinforcement_2: ""
  supply_chain_reinforcement_3: ""
  supply_chain_reinforcement_4: ""
  supply_chain_reinforcement_5: ""
  SUBDOCTRINE_WARTIME_INDUSTRY: "Wartime Industry"
  SUBDOCTRINE_WARTIME_INDUSTRY_DESC: "Napoleon had learned that an army marches on his stomach; a century and a half later, the army's stomach has grown enough to necessitate a nation's worth of factories and workers. Ours shall step up to the task."
  wartime_industry_1: ""
  wartime_industry_2: ""
  wartime_industry_3: ""
  wartime_industry_4: ""
  wartime_industry_5: ""

  SUBDOCTRINE_STRATEGIC_CYCLES: "Strategic Cycles"
  SUBDOCTRINE_STRATEGIC_CYCLES_DESC: "Always being on the offense will quickly wear out our forces, and always being on the defensive will ruin morale. We can make our strategic objectives easier to grasp and therefore easier to carry out by placing them into a cycle. We will attack along the line, hold to stabilize, and then attack after letting the enemy whittle themselves down uselessly."
  strategic_cycles_1: ""
  strategic_cycles_2: ""
  strategic_cycles_3: ""
  strategic_cycles_4: ""
  strategic_cycles_5: ""
  SUBDOCTRINE_CONCURRENT_FRONT_ASSAULTS: "Concurrent Frontal Assaults"
  SUBDOCTRINE_CONCURRENT_FRONT_ASSAULTS_DESC: "An enemy on the back foot, no matter how strong, can neither defend itself nor fight back. Our strategies shall hence make use of multiple units fighting concurrently to keep the enemy as often in the back foot as possible."
  concurrent_frontal_assaults_1: ""
  concurrent_frontal_assaults_2: ""
