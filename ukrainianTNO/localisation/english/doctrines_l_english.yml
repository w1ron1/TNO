  #NAVAL DOCTRINES
  GRAND_DOCTRINE_CARRIER_TASK_FORCE: "Carrier Task Force"
  GRAND_DOCTRINE_CARRIER_TASK_FORCE_DESC: "The ultimate tool of power projection on today's seas is the mighty aircraft carrier. Carriers complemented with the right contigent of vessels can be dispatched on any mission, rendering them our foremost tool as we confront a range of challenges across the globe."
  GRAND_DOCTRINE_CARRIER_STRIKE_FORCE: "Carrier Strike Force"
  GRAND_DOCTRINE_CARRIER_STRIKE_FORCE_DESC: "The primary aim of our navy when it leaves port is to strike the enemy. Whenever a plane launches, a submarine dives, a torpedo fires, a marine curses, a radar blips, we move to strike the enemy. This, and this alone, is essential."
  GRAND_DOCTRINE_NAVAL_BASTION_DOCTRINE: "Naval Bastion Doctrine"
  GRAND_DOCTRINE_NAVAL_BASTION_DOCTRINE_DESC: "Our goal is not to gallivant across the globe like modern day Kaiser Wilhelms, but to leverage our navy to secure our homeland. Through rigorous coordination with our land forces and a focus on supply networks, we will build an ever-shifting constellation of floating fortresses to defend our coastlines."
  DOCTRINE_NAVAL_AVIATION: "Naval Aviation"
  DOCTRINE_FLEET: "Fleet"
  DOCTRINE_STRATEGIC: "Strategic"
  DOCTRINE_TRACK_OPERATIONAL: "Operational"

  #Naval Aviation Subdoctrines
  SUBDOCTRINE_AIRSPACE_DOMINANCE: "Airspace Dominance"
  SUBDOCTRINE_AIRSPACE_DOMINANCE_DESC: "Carriers offer us the unique opportunity to deploy air assets without the need for air infrastructure on land. Other than the obvious advantages of being able to strike our enemies from the seas, a well-rounded carrier task force can also offer invaluable help with reconnaissance and intel gathering: a clever admiral and a powerful radar may serve the greater cause much more than any amount of dumb bombs and torpedoes."
  airspace_dominance_forward_reconnaissance: "Forward Reconnaissance"
  airspace_dominance_forward_reconnaissance_desc: "If properly equipped, a carrier can serve as an excellent reconnaissance asset for the rest of the fleet. Aircraft can be deployed for observation sorties, helicopters are readily available for short-range protection, and the ship itself, with its massive size, can mount powerful radar arrays: even hundreds of nautical miles from any friendly infrastructure, our task forces will never be blind."
  airspace_dominance_air_fleet_intel_coordination: "Air-Fleet Intel Coordination"
  airspace_dominance_air_fleet_intel_coordination_desc: "Carriers are not merely floating airstrips. They are, for all intents and purposes, a fully-operative air base, complete with service crews and powerful communication arrays: during combat operations, the carrier's control tower will act as central command and control hub for the fleet, streamlining communication and improving general operational effectiveness."
  airspace_dominance_fleet_air_cover: "Fleet Air Cover"
  airspace_dominance_fleet_air_cover_desc: "The relationship between a carrier task force and its aircraft is one of symbiosis and mudual dependence. Just as the aircraft scout ahead and protect the fleet from enemy airborne torpedoes, so do the ships offer their umbrella of radar and vertical-takeoff anti-air missiles: working in tandem and covering each other's weaknesses, the task force can act cohesively and reduce operational danger."
  airspace_dominance_branch_interoperability: "Branch Interoperability"
  airspace_dominance_branch_interoperability_desc: "Modern takeoff and landing gear have dramatically reduced the needed airstrip length for most aircraft. Unlike its first iterations, most modern jet fighters need only minimal adaptations to be refitted for carrier service: this interoperability gives our air command great freedom of operation, being able to easily deploy aircraft to carrier duty whenever needed, even to support ground operations."
  airspace_dominance_carrier_task_forces: "Carrier Task Forces"
  airspace_dominance_carrier_task_forces_desc: "It is foolish to think that carriers can operate alone. From escort firgades and corvettes, to fuel and and ammunition ships, the list of military and logistical vessels needed to keep a single carrier protected and operational is long: a large and well-organized task force not only ensures the carrier's protection against enemy threats, but also amplifies its general capabilities and sustains them over longer periods."

  SUBDOCTRINE_CONCENTRATED_STRIKE: "Concentrated Strike"
  SUBDOCTRINE_CONCENTRATED_STRIKE_DESC: "Naval combat has evolved greatly in but a few decades. Fleets that once required days to maneuver into position can now destroy each other in mere minutes through the power of stand-off weaponry and computer-guided torpedoes: if we are to prevail, we must strike first and with overwhelming force, devastating the enemy fleet before it can muster enough strength to launch their own attack."
  concentrated_strike_intensive_drilling: "Intensive Drilling"
  concentrated_strike_intensive_drilling_desc: "A carrier is a self-contained air base, seeing not only to the storage and deployment of naval aircraft, but also to their refuelling, rearmament and maintenance. Space constraints mean that only a fraction of the total complement of a given carrier can be serviced at the same time: through intensive drilling and exact time and resource allotment, we can minimize refurbisment time between missions, allowing our carriers to maintain a higher operational tempo."
  concentrated_strike_night_operations: "Night Operations"
  concentrated_strike_night_operations_desc: "At the onset of carrier warfare, night operations were fraught with risk, as the lack of guidance save for torchlights increased the risk of miscalculation on the pilots' side, potentially leading to aircraft missing the carrier or crashing into it. Modern signal techniques and directional jets drastically reduce the chance for such accidents, allowing carriers to operate even at night: with correct resource and manpower management, our task forces can effectively sustain continuous day-long operations without loss of sortie frequency."
  concentrated_strike_carrier_concentration: "Carrier Concentration"
  concentrated_strike_carrier_concentration_desc: "Mass naval air tactics were originally developed during the Second World War, the first - and, at least for now, only - conflict to see such large deployments of carriers. The latest advancements in long-range communication and computer-based calculations give our carrier task forces much greater ability to coordinate large numbers of deployed aircraft: it is high time that we revise decades-old manuals and rules of engagement, so that our task forces may flood the skies with death."
  concentrated_strike_ambush_tactics: "Ambush Tactics"
  concentrated_strike_ambush_tactics_desc: "From Salamina to the Jutland, catching the enemy unaware or mid-deployment can radically alter the outcome of the naval engagement. Of course, modern radar and naval reconnaissance make a modern \"ambush\" significantly different from what Nelson, Themistocles or Venier would have envisioned: rather than a fleet emerging from the fog, or from behind a cliff, the true surprise is the sudden appearance of hundreds or radar blips on your screen, all converging on you at supersonic speed."
  concentrated_strike_offence_oriented_air_operations: "Offence-Oriented Air Operations"
  concentrated_strike_offence_oriented_air_operations_desc: "In modern warfare, jack-of-all-trades is often a metaphore for botched projects whose creators are too cowardly to admit their responibility. Carriers are, first and foremost, an offensive naval asset and it is high time that we recognize this basic fact: other components of the fleet can take up defensive roles, while our carriers will be geared for massed, aggressive sorties - granting our naval aviation the operational space to deploy its offensive potential in full."

  SUBDOCTRINE_POSTERN_OPERATIONS: "Postern Operations"
  SUBDOCTRINE_POSTERN_OPERATIONS_DESC: "Contesting dominance over the high seas is a resource-intensive effort that we have little interest in. As our priorities lie to the interior of our coastline, defence takes precedence over offence: like besieged soldiers launching sorties from hidden posterns in their castle, we will fight at a time of our choosing and at our conditions, ever safe in the knowledge that the walls are near, offering refuge and protection."
  postern_operations_coastal_patrols: "Coastal Patrols"
  postern_operations_coastal_patrols_desc: "As expected, our coastline is vulnerable to submarine operations disrupting trade, and air sorties targeting our port facilities and industrial centers. Deploying well-equipped and numerous coastal patrols allows us to hunt for submarines and extend our missile early warning umbrella dozens of nautical miles from our coastline: even a single hour of advantage is more than enough to plot missile courses, and deploy appropriate countermeasures."
  postern_operations_land_based_aerial_cover: "Land-Based Aerial Cover"
  postern_operations_land_based_aerial_cover_desc: "Sailing close to the shore, our ships can take full advantage of land-based infrastructure such as radar installations and air bases. Much larger and more effective than any shipborne solution, these assets can provide full airspace cover for our fleet operations: be it detecting incoming aircraft, or senting air wings to support in naval engagements, our very landmass serves as an unsinkable carrier."
  postern_operations_standoff_tactics: "Standoff Tactics"
  postern_operations_standoff_tactics_desc: "For any aircraft, engaging enemy ships is always a risky endeavor due to the high risk of being intercepted by their anti-air batteries. With longer range but lower precision, standoff weapons represent a potential way to reduce operational risks for our aircraft, if at the cost of mission effectiveness: this latter disadvantage, however, can be mitigated through focused training and adoption of modern technical solutions."
  postern_operations_land_sea_support_operations: "Land-Sea Support Operations"
  postern_operations_land_sea_support_operations_desc: "Fleet engagements close to shore can receive direct aerial support from land-based airstrips. A direct communication channel between naval and air commands will streamline cooperation between the two branches, shortening the delay between request for support and aircraft takeoff: the sooner help arrives, the more it will influence the flow of battle."
  postern_operations_seaways_denial: "Seaways Denial"
  postern_operations_seaways_denial_desc: "When controlling the seas is outside of one's means, the next best thing is to deny the same to their foes. By deploying our naval aviation aggressively, we can project a denial zone that can reach up to hundreds of miles from our coast: in this area, anything from military ships to cargo vessels and oil tankers will be subjected to aerial bombardment, effectively closing it for any enemy activity, be it military or economic. Double points if said area covers a vital sea chokepoint such as a strait..."

  #Fleet Subdoctrines
  SUBDOCTRINE_TASK_FORCES: "Task Forces"
  SUBDOCTRINE_TASK_FORCES_DESC: "Modern ships can perform a variety of tasks on the battlefield in ways that our own grandfathers would never have been able to even fathom. The composition of a task force must reflect this new truth, prioritizing versatile ships that can support each other and perform any needed task: when sailing thousands of miles from home, there is no room for mistakes, and no way to make up for a lapse in judgment."
  task_forces_organizational_flexibility: "Organizational Flexibility"
  task_forces_organizational_flexibility_desc: "No two naval engagements are identical. From the composition of the enemy fleet, to positioning and environmental hazards, all factors must be considered and properly addressed to achieve victory with the least expenditure of time and assets: with these premises, a fundamental tenet for any naval commander must be organizational flexibility, or the ability to adapt to battle-influencing factors without loss of operational effectiveness - and as a corollary, each constituent element of the task force must possess the same flexibility."
  task_forces_hunter_killer_groups: "Hunter-Killer Groups"
  task_forces_hunter_killer_groups_desc: "A key lesson from the Second World War is the importance of submarine warfare, be it as the attacker or the defender. Submarine attacks can critically disrupt sea lanes, crippling both civilian trade routes and military logistical lines: to prevent such worst-case scenario from becoming reality, it is imperative that the naval command establishes specialized hunter-killer groups, given specialized equipment and training to detect, engage and destroy hostile submarines."
  task_forces_command_delegation: "Command Delegation"
  task_forces_command_delegation_desc: "Modern naval battles can be over in a matter of hours, with patrols given mere minutes to warn the fleet of enemy fire before being obliterated. In this new environment, no single admiral can effectively direct the task force as a whole and, at the same time, give punctual commands to each ship, no matter how advanced their communication array: to properly react to any threat over a front spanning hundreds of naval miles, the best solution is to give subcommanders the needed autonomy to act in the interest of the wider fleet, without the need for constant authorization from the top leadership."
  task_forces_forward_radar_picket: "Forward Radar Picket"
  task_forces_forward_radar_picket_desc: "When sailing the high seas, support from land-based infrastructure is minimal - if at all present - and sailing blind is a recipe for disaster. Therefore, it is prudent to deploy radar-equipped patrol ships in forward scouting positions to act as radar pickets: if their sensor arrays are suitably coordinated and interlocked, the resulting radar umbrella will serve as an effective early-warning system and give the fleet precious minutes to prepare for any incoming threat."
  task_forces_mission_specific_assignments: "Mission-Specific Assignments"
  task_forces_mission_specific_assignments_desc: "Task forces are not a monolithic entity, but rather an amalgamation of assets that can - and should - be divided and reassigned in case of need. A competent commander understands the need to divert assets to perform specific subtasks, and can do so without loss of force coordination and coherency: under such leaders, a task force can effortlessly switch between assignments and maintain full control of the overall tactical and strategic situation."

  SUBDOCTRINE_ATTACK_SQUADRONS: "Attack Squadrons"
  SUBDOCTRINE_ATTACK_SQUADRONS_DESC: "In naval warfare, balancing attack and defence lost significance thirty years ago at the very least. With a modern torpedo being able to pierce even the thickest steel hull, the only way to protect our ships is to destroy the enemy before they can open fire: as the old saying goes, offence is the best defence, and the only message we need to deliver our foe is a substantial salvo of missiles and torpedoes."
  attack_squadrons_rapid_deployment: "Rapid Deployment"
  attack_squadrons_rapid_deployment_desc: "The chances of a successful attack increase proportionally to its speed and coordination, relative to the enemy's. In order to achieve superiority, our strike forces must be able to deploy quickly within the theater of operations, without loss of coordination and cohesiveness: emphasizing boldness and autonomy amidst subcommanders will go a long way towards gaining the upper hand in naval engagements."
  attack_squadrons_detection_avoidance_tactics: "Detection Avoidance Tactics"
  attack_squadrons_detection_avoidance_tactics_desc: "Modern radar technology allows its users to detect enemy presence long before said presence appears over the horizon. There is no use in launching offensive operations if the enemy is already aware of our intentions, and moving to counteract: studying detection avoidance tactics, and refitting our ships with electronic warfare modules such as jammers will greatly increase our chances to launch successful strikes."
  attack_squadrons_strategic_concentration: "Strategic Concentration"
  attack_squadrons_strategic_concentration_desc: "No engagement can be considered successful if the enemy is allowed to limp away to lick their wounds. True victory consists in the obliteration of enemy assets until the latter's inability to maintain coherent operations: in order to turn this theoretical into practical, our fleet must possess the coordination and the technological means to quickly concentrate its strength, in the same way a hand clenches into a fist."
  attack_squadrons_strike_flotillas: "Strike Flotillas"
  attack_squadrons_strike_flotillas_desc: "When defeating the enemy in a single engagement is impossible or counterproductive, then the focus must shift to whittling down their ability to wage war. Dividing larger strike forces into a number of autonomous strike flottillas will allow us to attack simultaneously from several directions, harrying the enemy and disrupting vital logistics until the only choice left is whether to die a death of a thousand cuts or suffer a single, decisive defeat."
  attack_squadrons_fleet_showdown: "Fleet Showdown"
  attack_squadrons_fleet_showdown_desc: "No matter how elusive, a fleet always needs a central base of operations to conduct refuelling, rearmament and repairs. Just as the easiest way to hunt down a bear is to look for its cubs to stoke its maternal instincts, the quickest way to lure the enemy into open battle is to threaten its main logistical hub: once its location is known to us, we will assemble our fleet and launch a decisive strike against it, and the enemy will be forced to react in kind, lest it be left stranded and without means to resupply."

  SUBDOCTRINE_OVERWHELMING_FIREPOWER: "Overwhelming Firepower"
  SUBDOCTRINE_OVERWHELMING_FIREPOWER_DESC: "The practical means to wage war at sea might have evolved rapidly since the beginning of the century, but the key concept at its core has remained the same - hit them fast, and hit them hard. As such, the only way to achieve superiority over our enemies is to deploy overwhelming firepower in such a way that the enemy is left battered and unable to muster a response: we will define victory by the sight of enemy ships deflagrating into fiery balls of death."
  overwhelming_firepower_missile_supremacy: "Missile Supremacy"
  overwhelming_firepower_missile_supremacy_desc: "With their longer range and incredible precision, all fitted within a compact and self-disposing frame, missiles have eclipsed traditional naval gun in every way except munition availability. Thanks to modern breakthroughs in miniaturization and guidance, even a small frigade can be equipped with enough firepower to sink a battleship at standoff range: such a prospect opens myriad potential avenues. The age of battleships is over. The time of missiles has come. "
  overwhelming_firepower_fleet_maneuver: "Fleet Maneuver"
  overwhelming_firepower_fleet_maneuver_desc: "What good is the most powerful naval weaponry if we' ae too distant to strike our target or if the relevant vessels are out of position. The motion of every ship in a task force must be accounted for and optimized before, during, and after an engagement."
  overwhelming_firepower_centralized_command: "Centralized Command"
  overwhelming_firepower_centralized_command_desc: "Individual initiative is all well and good, but only our admiralty has the staffing, intelligence, and distance from the encounter to understand and act upon the larger picture. Reinforce this message to every captain at regular intervals."
  overwhelming_firepower_anti_access_area_denial: "Anti-Access/Area Denial"
  overwhelming_firepower_anti_access_area_denial_desc: "Critical swathes of sea can be turned into no-go-zones for our foes by preparing the firepower and targetting to eliminate all who enter."
  overwhelming_firepower_strategic_deterrence: "Strategic Deterrence"
  overwhelming_firepower_strategic_deterrence_desc: "The knowledge that irreparable assets will be destroyed in any encounter with our fleet can ward off attacks from numerically or qualitatively superior opponents. Send enough to the bottom and the fear will set in among their sailors - and their planners."

  #Strategic subdoctrines
  SUBDOCTRINE_UNHOLY_GHOSTS: "Unholy Ghosts"
  SUBDOCTRINE_UNHOLY_GHOSTS_DESC: "Within the Nuclear Triad, strategic bombers rule the heavens, ICBMs are grounded firmly on the earth. Now they are joined by ghostly spectres, prowling the depths unseen. But SSBNs are just as mighty as their counterparts, able to smite any nation that blaspheme against their name."
  unholy_ghosts_terror_from_the_deep: "Terror from the Deep"
  unholy_ghosts_terror_from_the_deep_desc: "We will blow uninhabitated islands to smithereens until our submarines master the relatively new technique of launching ballistic missiles while submerged."
  unholy_ghosts_tithe_below_the_tides: "Tithe Below the Tides"
  unholy_ghosts_tithe_below_the_tides_desc: "Nuclear submarines have immense benefits for range, silence, time submerged, and speed. But as with all good things, you must pay for the privilege. We will scrounge the funding to procure or convert the necessary vessels."
  unholy_ghosts_silence_of_the_dead: "Silence of the Dead"
  unholy_ghosts_silence_of_the_dead_desc: "Nothing is more critical for our strategic deterrent than that each limb of triad remains operational. No expense should be spared and no doctrinal leaf unturned to maximize the stealth capabilities of our ballistic missile submarines. Their survivability is non-negotiable."
  unholy_ghosts_alone_in_the_dark: "Alone in the Dark"
  unholy_ghosts_alone_in_the_dark_desc: "The binding constraints on our submarines' mission duration are now food stores and crew endurance. To maximize the latter, we will enforce rigorous psychological testing to ensure cohesion and efficiency under sustained pressures."
  unholy_ghosts_wielders_of_apocalypse: "Wielders of Apocalypse"
  unholy_ghosts_wielders_of_apocalypse_desc: "SSBNs are a key feature of our geopolitical power projection. The prestige and value of these vessels have facilitated their impeccably-integration into our overall naval command structure - overcoming the difficulties of coordinating with on the seafloor in silence."

  SUBDOCTRINE_HUNT_IN_THE_DEPTHS: "Hunt the Depths"
  SUBDOCTRINE_HUNT_IN_THE_DEPTHS_DESC: "Especially with the rise of nuclear-power, ballistic missile-equiped submarines, we must be prepared to play the highest stake game of cat-and-mouse conceivable fathoms below the waves."
  hunt_in_the_depths_mind_the_gaps: "Mind the Gaps"
  hunt_in_the_depths_mind_the_gaps_desc: "Open seas are a hellish place to find enemy submarines. Instead, we will place hydrophone arrays across relevant naval chokepoints, and establish the processing facilities and network to find them whenever they come too close."
  hunt_in_the_depths_borrow_the_cloak: "Borrow the Cloak"
  hunt_in_the_depths_borrow_the_cloak_desc: "Superpowers' navies are iterating rapidly through stealth techniques and technologies to hide their ballistic missile submarines from their rivals. At considerably less expense, we can look to learn from these innovations and apply them to our diesel-powered attack and cruise-missile submarines."
  hunt_in_the_depths_plug_the_breach: "Plug the Breach"
  hunt_in_the_depths_plug_the_breach_desc: "In the perils of the hunt, your own equipment must not fail. We will implement strict safety regime for our submarine fleet, establishing regular auditing and equipment tracing to ensure no accidents occur. And if damage is wrought, that it will be as survivable as possible."
  hunt_in_the_depths_follow_the_trail: "Follow the Trail"
  hunt_in_the_depths_follow_the_trail_desc: "The silence of nuclear-powered submarines is one of their chief advantages over diesel. So we must move beyond only listening - one tell-tale sign of their passage is a thermal scars. Maximize our ability to detect this and train our crews to look for it, and we mitigate their most deadly advantage."
  hunt_in_the_depths_prepare_the_strike: "Prepare the Strike"
  hunt_in_the_depths_prepare_the_strike_desc: "We've maximized our detection and the capabilities of our own submarines - now it's time to take down our fearsome targets with our combined ship-search-strike groups. Our subs will fire torpedoes at maximum range while ships and helicopters rain down explosives into the depths. Let the black water pour into our foes' lungs - the existential threat they posed to our homeland - ended."

  #Operational Subdoctrines
  SUBDOCTRINE_AMBHIBIOUS_ASSAULT: "Amphibious Assault"
  SUBDOCTRINE_AMBHIBIOUS_ASSAULT_DESC: "We must be prepared to use our regional naval dominance to project power inland by strengthening our amphibious warfare command and equipment. Soon our foes will view every beach and river as shadows from which their nightmares will emerge."
  amphibious_assault_raiders_and_invaders: "Raiders and Invaders"
  amphibious_assault_raiders_and_invaders_desc: "Given our focus on amphibious operations, we have begun to differentiate on a doctrinal and material level our approach to raids relative to larger-scale landings. Whether adapting our landing vehicles or adjusting far-shore logistics tasks, specialization is bound to pay dividends for both."
  raiders_and_invaders_tt: "All frontline elements:\n§YRiver§!\n  Movement: §G+5%§!\n  Attack: §G+5%§!"
  amphibious_assault_fearless_frogmen: "Fearless Frogmen"
  amphibious_assault_fearless_frogmen_desc: "Foremost among our amphibious units, in technical training, unit discipline, and prestige will be elite underwater demolition teams. Extreme physical fitness and personal bravery will clear landing areas well in advance of their fellows' arrival."
  amphibious_assault_established_channels: "Established Channels"
  amphibious_assault_established_channels_desc: "Amphibious operations on the scale our forces need to prepare for require flawless cooperation between services to cover sea, land, and air. If rivalries cannot be set aside, and they cannot, at least we can momentarily tame them by setting out establishing a joint command, defining the discrete roles and responsibilities beneath them and then drilling until they become second-nature."
  amphibious_assault_refined_rehearsals: "Refined Rehearsals"
  amphibious_assault_refined_rehearsals_desc: "Having drilled out some of the general kinks of interservice coordination, we now need to achieve mastery of the specific complexities of each amphibious operation. Setting standards for what constitutes adequate rehearsal based on operational scale, scope and surprise requirements will make sure our forces are ready for the show."
  refined_rehearsals_tt: "All Infantry Elements:\n§YRiver§!\n  Attack: §G+5%§!\n§YAmphibious§!\n  Attack: §G+5%§!\nAll Armor Elements:\n§YRiver§!\n  Attack: §G+5%§!\n§YAmphibious§!\n  Attack: §G+5%§!"
  amphibious_assault_expeditionary_all_in_one: "Expeditionary All-in-One"
  amphibious_assault_expeditionary_all_in_one_desc: "Modernizing or converting our attack transports into amphibious transport docks can increase their increasingly vital complement of landing craft, landing vehicles, and, most novelly, add transport helicopters to their kit. This Swiss Army Knife of a ship will pry open the toughest of invasion targets."

  SUBDOCTRINE_PASS_THE_AMMUNITION: "Pass the Ammunition"
  SUBDOCTRINE_PASS_THE_AMMUNITION_DESC: "Behind the glamor of gleaming warships and their arrays of glistening guns are several fleets of auxiliary vessels, a legion of command staff, and a spattering of ports and bases. By polishing those unseen elements, the inner workings of our navy will hum along as never before."
  pass_the_ammunition_the_guiding_hand: "The Guiding Hand"
  pass_the_ammunition_the_guiding_hand_desc: "It becomes far easier to supply our ships when we know what they need - and when they need similar supplies. By tracking and homogenizing, to the extent practicable, the characteristics of our vessels, whether under construction, at sea, or mothballed, we can limit costs and the risk of sending a widget when they needed a whatsit."
  pass_the_ammunition_the_quick_and_dirty: "The Quick and Dirty"
  pass_the_ammunition_the_quick_and_dirty_desc: "By channelling some of our brightest engineering minds into naval construction battalions, we can rapidly stand up the maritime infrastructure needed to sustain and enhance our campaigns. Docks, radar, airstrips - whenever, wherever."
  pass_the_ammunition_the_permanent_fixtures: "The Permanent Fixtures"
  pass_the_ammunition_the_permanent_fixtures_desc: "We'll tap our brightest mathematicians and geographers to locate strategic placements for specialized refitting stations to conduct maintenance and get our vessels back on patrol as fast as possible."
  pass_the_ammunition_the_hired_help: "The Hired Help"
  pass_the_ammunition_the_hired_help_desc: "By staffing our support fleet with civilian mariners, our specialized and costly uniformed sailors can be transferred to warship racks. With a range of contract lengths, we also gain the ability to grow or shrink that support fleet as needed."
  pass_the_ammunition_the_steady_tide: "The Steady Tide"
  pass_the_ammunition_the_steady_tide_desc: "Integrated tightly into admirals' staffs, material and logistics groups ensure a steady rhythm of ammo, fuel, machine parts, mail, square meals, and even creature comforts like films. Sailors can set their watch by the frequency of their deliveries, and their commanders can plan with surety. No squall, no shoal, and no enemy will keep supplies from our ships!"

