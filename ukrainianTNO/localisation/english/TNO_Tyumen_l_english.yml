 TYM_the_clock_breaks_desc: "Незвична тиша огорнула землі колишньої Народної Республіки. Далекі вибухи вже не стали буденністю, сирени тижнями не волали своїх моторошних попереджень, а в небі давно не бачили літаків. Кампанія терористичних бомбардувань, що так довго мучила Росію, нарешті скінчилася.\n\nТепер, коли бомби не падають, треба надолужити втрачений час. Перед нами багато проблем, і найнагальніша - відбудова держави. Адже Революція не матиме жодної надії на продовження, доки ми твердо не станемо на ноги!"
 TYM_rebuilding_a_nation_desc: "Тривала облога тяжко пошкодила наші економічні й політичні інституції. Ми опинилися на межі зникнення, але тепер, коли бомбардування більше нам не загрожують, настав час зібрати державу докупи.\n\nГолова Каґановіч мудро склав план ремонту заводів, скасування надзвичайного стану й відновлення бюрократії. Він також поверне до державного життя людей Тюмєні, яких боротьба за виживання віддалила від влади. Незабаром Комуністична партія остаточно відтягне державу від прірви, і почнеться тяжка праця з розширення."
 TYM_rebuilding_the_factories_desc: "Починаючи відбудову Тюмєні, ми мусимо визнати: зробити все водночас неможливо. Обмежені ресурси вимагають ретельно визначити найважливіші сфери суспільства, а отже без жертв не обійтися.\n\nЩоб швидко повернути економіку до колишнього стану, потрібна міцна основа. Найкращий шлях - першочергово ремонтувати зруйновану промисловість. Цивільною інфраструктурою займемося, коли матимемо на що спертися, а для цього слід відновити промислові потужності й поволі повернути економіці життєву силу."
 TYM_the_military_industrial_complex_desc: "Після багаторічної оборони від німців ми майже не мали нагоди розвивати військо. Як учив Маркс, робітникам життєво необхідна зброя, а ніде беззахисність не є такою небезпечною, як у Росії, де з усіх боків чатують голодні бандити. Загроза менша, ніж за бомбардувань, та зміцнення війська залишається необхідним.\n\nЗаводи відновлюються, тож кращої миті, щоб цілковито присвятити ресурси військовому розвиткові, не буде. Безперервний потік рушниць і бомб іще надовго гарантує безпеку робітничої держави."
 TYM_armored_production_desc: "З відкриттям заводів військове виробництво зростає. Це добра звістка, але просто зрівнятися з ворогами замало. Ми повинні перевершити їх, створюючи новішу й кращу зброю, щоб ущент розбити їх на полі бою. Так постановив голова Каґановіч.\n\nТюмєнь прийме лише найкращу бойову техніку, а що може краще уособлювати сучасну військову міць, ніж бронемашини? Дешевий, ефективний і добре захищений бронетанковий парк Тюмєні стане потрібним авангардом поширення комунізму по Росії."
 TYM_civil_infrastructure_desc: "Наслідки багаторічних німецьких бомбардувань видно в усіх сферах повсякдення. Головні шляхи непрохідні, об'їзди перевантажені, а майже всі мости й тунелі знищено. Це шкодить роботі держави й відтинає великі та малі громади від центрального уряду.\n\nТому голова Каґановіч оголосить програму інтенсивного цільового будівництва, зосереджену на заміні зруйнованих і створенні нових критичних ділянок національної інфраструктури. Усі жителі Народної Республіки мають бути пов'язані, бо лише спільними зусиллями ми зможемо й неодмінно здобудемо перемогу."
 TYM_swords_to_plowshares_desc: "Значну частину військового спорядження Тюмєні становлять надлишки часів Великої Вітчизняної війни. Після років бомбардувань і безладу вони, на жаль, застаріли, а через брак обслуговування часто працюють лише частково. Необхідність замінити все це ще більше ускладнює зміцнення війська.\n\nТа непридатне до бою спорядження не є цілком марним. Комуністична партія винахідливо вирішила перепрофілювати стару військову техніку для нагальних потреб сільського господарства. Кожна така вантажівка заощаджує державі ресурси на спеціялізовані машини. Це ще раз доводить, що наше керівництво має творчу силу й наснагу здолати будь-яку перешкоду!"
 TYM_all_roads_lead_to_siberia_desc: "Ревізіоністський уряд Ніколая Бухаріна провадив масштабну індустріялізацію сибірських земель Совєцького Союзу, але наші володіння вона оминула. Західний Сибір порівняно відсталий, а його інфраструктура блідне поруч зі східнішими регіонами. Якщо нічого не змінити, ми приречені відстати, а робітнича держава стане історичною приміткою.\n\nКомуністична партія не знає поразки, і до останнього подиху ми виправлятимемо помилки Бухаріна. Сьогодні Західний Сибір - глушина, але тріюмф Жовтневої революції показав, як стрімко може змінитися доля народу. З правильним авангардом навіть пустка з часом стане осередком миру й добробуту. Та відродження Західного Сибіру буде значно швидшим."
 TYM_seamless_industrialization_desc: "Індустріялізація - перший і найнеобхідніший крок до величі держави. Для гегемонії над Росією бажано швидко наростити промислові потужності, але це завжди має ціну: перенаселені міста, нестачу харчів, шкоду довкіллю та падіння рівня життя.\n\nОднак ЗСНР відрізняється від інших економік: нею керує робітничий авангард, що дбає про широкий загал. Без капіталістичної експлуатації ми здатні провести справедливішу індустріялізацію, не приносячи добробут народу в жертву зростанню. Повний уперед! Під проводом голови шанс на невдачу мізерний."
 TYM_red_storm_desc: "Після повернення Західного Сибіру ЗСНР змогла перепочити. Порівняно з війнами проти зрадницької хунти Свєрдловска й фашистських безумців Омска цей мир здається майже неймовірним. Та не помиляймося: це лише коротка пауза між минулими й майбутніми війнами. Ми не вийшли з бурі, а лише опинилися в її оці.\n\nВоєнна буря насувається незалежно від наших дій, тож слід готуватися до найгіршого. Промисловість має стати міцною й надзвичайно продуктивною. Роботи ще багато, але з початком війни реакціонери, що загрожують Росії, збагнуть: буря - це робітники, а її лють зітре саме їх."
 TYM_the_five_year_plan_desc: "Наполягання Ніколая Бухаріна на Новій економічній політиці подекуди мало успіх, але не розвинуло значні частини Совєцького Союзу й спричинило його повний крах під ударами німців. Нам украй потрібен швидкий розвиток. Дотримуватися старих темпів совєцької індустріялізації, поки ЗСНР така вразлива, було б самогубством.\n\nНіколи не втілений П'ятирічний план із програми большевицької опозиції - єдина відповідь на промислові негаразди. Запропонована Іосіфом Сталіним величезна державна мобілізація всіх продуктивних сил урятувала б Совєцький Союз 1941 року. Нам же доведеться повернути його нове втілення до влади над усією Росією."
 TYM_rebuilding_the_communes_desc: "Перебудова інфраструктури ЗСНР для війни потребуватиме невтомної праці всього населення. Швидка індустріялізація за планами Іосіфа Сталіна, безумовно, допоможе, але наш маленький уламок СССР може бути не готовий до таких докорінних змін. Реформа сільського господарства й підтримка цивільних потрібні, щоб подальший розвиток не обернувся лихом і зубожінням.\n\nНові, більші колгоспи! Масове поширення сільгосптехніки! Величезні кампанії житлового будівництва! Комуністична партія задовольнить усі вимоги народу й навіть більше, а промисловість згодом пожне щедрі плоди."
 TYM_repopulation_programs_desc: "Історія не була ласкавою до росіян. Війна й нужда залишили в демографічній структурі величезну порожнечу там, де мали жити мільйони людей. Коли майбутнє здавалося таким похмурим, хто міг звинувачувати змучених жінок у небажанні народжувати дітей у цей світ? Тепер становище поліпшилося, але постала інша проблема: для майбутніх економічних цілей просто бракує людей.\n\nМи передусім партія праці, а немає праці шляхетнішої за материнство. Допомога родинам і самотнім матерям, нагороди «матерям-героїням», які хоробро виховують десять і більше дітей, та контроль абортів повернуть чисельність населення до потрібного рівня."
 TYM_family_building_desc: "Кинутий Бухаріним у найтяжчу мить російський народ певною мірою став нацією сиріт. Та є й безліч справжніх сиріт, які втратили батьків через війну, голод або покинення. Дитячі будинки Тюмєні та інших міст переповнені. Тепер ми маємо час і ресурси виправити цю огидну ситуацію - і мусимо це зробити, інакше ми не соціялісти й навряд чи взагалі люди.\n\nЗСНР створить найкращу у світі систему всиновлення, поєднавши родини без дітей із дітьми без родин. Незабаром сиротинці спорожніють, а ми зробимо перший крок до подолання травми найуразливіших жертв цієї довгої війни."
 TYM_wives_for_soldiers_desc: "Політика заохочення приросту населення вже мала помірний успіх, але можна піти далі. Навіщо обмежуватися допомогою батькам і сподіватися на успіх, якщо держава здатна діяти безпосередніше? Ми не маємо часу чекати, поки кохання саме зробить свою справу.\n\nНова програма автоматично підбиратиме потенційних партнерів. Для цивільних жінок участь буде добровільною й винагороджуватиметься збільшеними пайками, а чоловіків автоматично реєструватимуть після вступу до війська. Зруйнувавши перепони між потенційними партнерами, Комуністична партія сподівається невдовзі створити тисячі плідних родин."
 TYM_enforced_farming_desc: "Бурхливий промисловий розвиток збільшує населення, а отже й потребу в харчах. Усе просто, але є проблема: Західний Сибір - далеко не житниця Росії. Сільське господарство ніколи не було сильною стороною регіону, та без значного приросту виробництва майбутнє ЗСНР важко уявити.\n\nМи повинні використати кожен клаптик землі. Зернові квоти зростуть. Лишати поля незасіяними буде заборонено. Селяни можуть протестувати, але зрештою отримають належну винагороду. Годувати країну - одне з найшляхетніших завдань."
 TYM_land_redistribution_desc: "Чимало селян готові долучитися до розвитку сільського господарства, але не мають землі. Нерівний розподіл угідь заважає нашим цілям і завдає великих страждань безземельному селянству. Як і з багатьма суспільними проблемами, виправити становище мусить Комуністична партія.\n\nКолективне господарство, політика Сталіна й частини большевицької опозиції, яку відкинув уряд Бухаріна, - ключ до подолання негараздів. Держава керуватиме господарствами, де працюватимуть усі селяни району, що дасть змогу провести масштабну модернізацію й ефективне управління. Безземельні селяни пізнають справедливість, а до міст надходитиме більше харчів, ніж будь-коли."
 TYM_communal_loyalty_desc: "Держава здатна спрямувати творчу силу громадян на приголомшливі звершення, але не може зробити все. Поки уряд зосереджений на важкій промисловості й колективному господарстві, він не задовольнить кожної потреби комун. У такі часи народ має брати справу у власні руки.\n\nПропаганда самодостатности й співпраці стане першим кроком до духу революційної жертовности. Людей слід навчити, що важить кожен внесок у спільне благо - будівництво криниць, навчання співвітчизників грамоті, організація праці чи безліч інших справ. Соціялістична держава не працюватиме, доки люди не навчаться всебічно співпрацювати."
 TYM_breakup_the_unit_desc: "Марксистська теорія вчить, що зі скасуванням приватної власности нуклеарна родина відмирає, а її місце посідають громадські інституції. Ми вже реформували родинні відносини, але революцію можна поглибити. Наступною ціллю Комуністичної партії має стати сама родинна одиниця.\n\nПередання виховання дітей усій громаді дасть батькам свободу для праці чи відпочинку. Цінності колективної солідарности легше прищепити, коли зруйновано родинні перепони між дітьми. З огляду на розмір і ресурси війська, можливо, варто дати йому певну роль у нових яслах."
 TYM_rebuilding_an_army_desc: "На жаль, військова історія Західносибірської Народної Республіки майже не знала успіхів. Через зраду зсередини Республіка розпалася, навіть не почавши повертати решту Росії. Тепер, коли від неї лишилися Тюмєнь і околиці, очевидно, що тактику треба переглянути.\n\nВійсько, можливо, є найважливішою складовою Революції, а розв'язання військової проблеми подібне до рецепта відродження совєцької держави: індустріялізація й централізація. Червону Армію буде відбудовано як силу, здатну кинути виклик наймогутнішим і невдовзі відновити пролетарську владу в усій країні."
 TYM_the_red_armor_desc: "Старий Совєцький Союз, ослаблений ревізіоністською некомпетентністю, був украй неготовий до натиску сучасної фашистської армії. Одні з найпринизливіших поразок спричинили танкові бригади Райху, що зі спустошливою силою прокотилися країною.\n\nГотуючись повернути Західносибірську Народну Республіку, ми можемо засвоїти один урок ворога: сучасна бронетехніка в умілих руках є надзвичайно потужною зброєю. Механізація Червоної Армії перетворить її на силу, здатну стрімко розширювати наші землі. У цій війні вирішальними будуть рішучі дії, а танки якраз їх і забезпечать."
 TYM_revisit_the_doctrines_desc: "Критики часто звинувачують нас у надмірній прив'язаності до доктрин. Теорій Маркса слід дотримуватися якнайточніше, але військова справа - інше питання. Перебудова армії для бронетанкової війни вже триває, а тактика не встигає за змінами.\n\nТанк - потужний засіб, але потрібна стратегія, щоб не марнувати машини під ворожим вогнем. У Великій Вітчизняній війні німці надзвичайно ефективно розгортали танки, придушуючи нас ще до можливої відповіді. Можливо, нам потрібен власний «бліцкріґ»..."
 TYM_study_modern_designs_desc: "Тривала ізоляція Росії відрізала її від новітніх військових розробок, що й не дивно в загальному хаосі. Ми не мали ні нагоди, ні коштів удосконалювати танкові технології, тоді як решта світу значно просунулася вперед.\n\nНа щастя, починати дослідження з нуля не доведеться. Захоплені німецькі та таємно передані американські й японські танки стоять покинутими в наших арсеналах із 1950-х. Залишається розібрати їх і створити власні зразки."
 TYM_homebrew_armored_power_desc: "Ми накреслили плани, заклали теоретичні основи й уважно вивчили найновіші іноземні розробки. Роки невтомної праці дали промислові потужності, потрібні сучасній армії. Робітники мають необхідне спорядження й палають бажанням служити пролетарській державі.\n\nМи маємо все для початку танкової програми. Заводи готові виробити стільки машин, скільки потрібно для повного визволення Західного Сибіру від зрадників, що так довго його мучили. Лишається лише почати."
 TYM_our_own_designs_desc: "Хоч ми й досягли значного поступу в розвитку бронетехніки, Тюмєнь досі є відсталою державкою, а конструктори - лише люди. Нові танки мають низку серйозних проблем, які треба розв'язати, щоб вони були ефективними.\n\nНа ці машини сильно вплинули іноземні зразки, не завжди придатні до природних і промислових умов Росії. Їх треба пристосувати до наших потреб і створити систематичний порядок перевірок та збирання даних."
 TYM_study_the_performance_desc: "Досі ми досягали великих успіхів у конструкції танків і теоретичному застосуванні. Тепер, коли почалося будівництво, треба перейти до практики. Точне вимірювання польових характеристик життєво важливе.\n\nНайкраще перевірити танки бойовими випробуваннями. Спостереження за їхнім рухом і боєм у контрольованому середовищі дасть науковцям конче потрібні дані та дасть змогу внести зміни на підставі точних чисел."
 TYM_our_own_stratagem_desc: "Однією з найбільших трагедій падіння Совєцького Союзу стало розсіяння найвидатніших талантів Росії. Генерал Міхаїл Тухачєвскій, відомий як «Червоний Наполеон» за внесок у 1920-30-х роках, - лише один із них. До гаданої загибелі під час краху ЗРРФ він здійснив чимало нововведень у військовій доктрині, особливо в теорії «глибокого бою», що наголошує на переміщенні численних з'єднань заради перемоги на всьому полі бою.\n\nУ боротьбі з обмеженими ресурсами, де результат висить на волосині, краща тактика життєво необхідна. Використання праць совєцьких великих діячів лише наблизить перемогу."
 TYM_study_the_results_desc: "Після закритих випробувань наступним кроком молодої танкової програми стануть бойові зіткнення. У бою трапляється те, чого не передбачиш зі спостережень на безпечному полігоні, а екіпажі поводяться зовсім інакше під справжнім вогнем.\n\nНа щастя чи ні, у Росії воєначальників нагод для бою вдосталь. Бандити й грабіжники роками тероризують село, полюють на селян і заважають управлінню. Відправивши проти них танки, ми з відносно малим ризиком зберемо дані й водночас звільнимо народ від давніх гнобителів."
 TYM_the_red_army_desc: "Основою будь-якої армії є не складна зброя й не величні стратегії, а люди. Від Великої Вітчизняної війни російські сили протистояли значно сучаснішому Вермахту завдяки добрій підготовці й дисципліні, попри брак ресурсів.\n\nБронетехніка має своє місце, але надмірна увага до нових технологій коштом згуртованости й ефективности солдатів марнує ресурси. Шлях до нового Совєцького Союзу - піхотна армія з професійними, добре оснащеними солдатами й технікою в ролі підтримки."
 TYM_be_brave_desc: "Через мізерні умови солдати часто погано навчені й мають низький бойовий дух. Багато хто б'ється лише за можливу платню й кидає позиції за першої небезпеки. Професіоналізація армії потребує реформи її культури.\n\nГідні спадкоємці Червоної Армії мають бути такими ж згуртованими. Ми виховаємо в солдатах братерство й спільний патріотизм. Маркс учив, що анархія гіперіндивідуалізму не годиться для суспільства. Так само вона веде до катастрофи будь-яке розумне військо."
 TYM_reform_the_NKVD_desc: "Режим Бухаріна, заражений ревізіонізмом та опортунізмом, не хотів і не міг належно придушувати контрреволюційні настрої. Особливо слабко наглядали за військом, що зрештою призвело до усунення самого Бухаріна й повного розпаду Совєцького Союзу.\n\nНова Червона Армія не повторить цих помилок. Відновлене НКВД особливо зосередиться на війську, забезпечуючи політичну відданість та освіту й караючи злочини солдатів під час повернення країни. Армія має величезний контрреволюційний потенціял, тому її слід якнайповніше контролювати партією."
 TYM_not_once_step_back_desc: "У Великій Вітчизняній війні Совєцький Союз упав того дня, коли солдати вперше вирішили тікати, а не боронитися до останнього! Вони говорили про безмежну Батьківщину, про людей і хліб аж до Уралу. Яка дурість! Відступ за відступом, боягузливі бійці Червоної Армії не розуміли, за що воюють, доки не опинилися за тисячу кілометрів від Москви. З Тюмєні ми надто добре бачимо межі Росії.\n\nСаме ця поразницька й боягузлива настанова згубила Союз! Солдатам бракувало рішучости, офіцерам - завзятости, всій армії - мужности. За правильного керівництва постала б залізна Росія з промисловим хребтом і основою з відданих, непохитних людей.\n\nТому ми вимагаємо від Червоної Армії: жодного несанкціонованого відступу за будь-яких обставин! За Каґановіча ми збудуємо нову Росію!"
 TYM_the_red_tide_desc: "Бійці Червоної Армії не можуть бути лише найчисленнішими, як нацистські пси змальовують «азійські орди». Вони мають бути найсильнішими, найзавзятішими й найкраще навченими в усій Євразії! Обов'язком бійця Червоної Армії було й залишається захищати Батьківщину від жахів фашизму та небезпеки реакційної думки й розколу!\n\nКожен працездатний росіянин також зобов'язаний у воєнний час стати на місце червоноармійця, віддячуючи Батьківщині за все, що вона дала. Він мусить мати найтвердішу волю, бути найстійкішим під тиском, утілювати Совєцьку Людину.\n\nЩоб повернути славу Совєцького Союзу й святість Батьківщини, слід почати з воїнів. Новою дисципліною ми викуємо новий СССР!"
 TYM_be_strong_desc: "Нас, росіян, висміювали й називали слабкими особами, що нападають на ворогів ордами. Ми покажемо світові силу російської людини, розкриту сповна. Розпочнемо нову кампанію з простим гаслом, яке сповнить солдатів незрівнянним патріотичним запалом: «Будь сильним!»\n\nНадто довго слов'ян топтали, їхні землі плюндрували, а народ винищували. Більше цього не буде. Наші солдати стануть взірцем сили й чесноти та отримають відповідне спорядження.\n\nЇм дістанеться найкраще з арсеналів і все, що можна придбати в роздробленій Росії, яку ми прагнемо зібрати. Хай найкраща російська техніка не є найкращою у світі, наші солдати, без сумніву, стануть утіленням Нової Совєцької Людини."
 TYM_reform_the_guard_desc: "Гвардія - один із численних політичних надмірів системи, уламок минулої доби, що згнив у нездатності пристосуватися. Якщо вона не може змінитися сама, ми її змусимо. Червона гвардія є радше політичною, ніж дієвою системою воєнізованих організацій і ледве здатна до бою.\n\nЦе треба виправити всеосяжною переоцінкою гвардії. Її політична роль і внесок у стабільність важливі, але чимало нижчих командирів узагалі не гідні керувати такою шанованою організацією.\n\nГнилі нарости буде відсічено й безжально досліджено, а посади отримають здібні люди. Гвардія частіше тренуватиметься за актуальною тактикою, отримає краще спорядження й регулярну платню для зміцнення відданости."
 TYM_russias_finest_desc: "Якщо наша армія має врятувати Росію від прірви, вона повинна бути найкращою. Кожен солдат стане взірцем Совєцької Людини, пройде виснажливі фізичні й розумові вправи. Вимоги зростуть, а простір для помилки зменшиться. Кожен, хто служить майбутньому Союзу, буде досконалим солдатом: сильним, розумним і завзятим.\n\nНавколо нас стоять селянські, найманські армії та війська лжепророків. Жодне не зрівняється із загартованою, дисциплінованою й навченою армією, що діє як механізм величезної машини й прокотиться Росією від Владівостока до Балтії.\n\nУ прийдешніх випробуваннях кожен солдат зустріне труднощі й жертви. Наш обов'язок - зробити так, щоб тоді він легко розігнав ворога й приніс славу Союзові!"
 TYM_power_to_the_mighty_desc: "Ми завжди прагнули створити в Росії справді меритократичне суспільство, де владу дають лише заслуги. Найкраще почати з армії, де на важливих посадах досі сидять корумповані генерали. Потрібна нова модель на засадах рівности, братерства й просування лише найкращих солдатів. Ми не станемо істинними спадкоємцями Совєцького Союзу, якщо новий Союз не продовжить і не розширить спадщину старого.\n\nКожного солдата оцінять, виміряють його рішучість і відстежуватимуть здібності. Так лише найкращі потраплять на додаткову офіцерську підготовку. Вишкіл наших людей у поєднанні з керівництвом справжньої меритократії стане рушійною силою, що приведе їх до Москви!"
 
 ###Non Expansion Tree
 TYM_call_forth_a_new_congress: "Скликати новий конгрес"
 TYM_call_forth_a_new_congress_desc: "Дрібна партійна політика відволікає нас, поки зрадницькі воєначальники Західного Сибіру мобілізуються. Щоб відновити Західносибірську Народну Республіку, не кажучи вже про Совєцький Союз, треба покласти край міжпартійним чварам. Лідери двох головних угруповань - голова Каґановіч і Хрущов - мають владнати розбіжності між собою та своїми прибічниками. Для цього буде скликано новий партійний конгрес.\n\nКонгрес зосередить бачення партії та об'єднає її розрізнені крила. Та за лаштунками укладатимуть угоди, висуватимуть погрози й братимуть хабарі, поки Каґановіч і Хрущов змагатимуться за вплив. Їхні відносини досі відносно приязні, але час покаже, чи надовго."

 TYM_what_is_the_five_year_plan: "Що таке П'ятирічний план?"
 TYM_what_is_the_five_year_plan_desc: "Під шарами бетону, у глибокому, темному й вогкому бункері знову збираються члени партії. Розмови час від часу уриваються від тремтіння приміщення, а спадщина програних війн не дає забути про себе. Це далеко не московські зали, але доведеться задовольнитися ними, якщо Комуністична партія сподівається туди повернутися.\n\nУ порядку денному багато питань, що визначать майбутнє Народної Республіки: бюджет, підвищення й призначення. Та конгрес відкриває найважливіше й найнагальніше питання.\n\nЩо таке П'ятирічний план?"
 
 TYM_in_its_hand_rests: "У його руці..."
 TYM_in_its_hand_rests_desc: "Питання про те, на чому будувати П'ятирічний план і ширшу економіку - на цивільному чи військовому секторі, - розколює партію. Голова Каґановіч переконаний, що слід зосередитися на війську: цивільна промисловість безглузда, якщо її не можна захистити від зрадників, які розірвали Західний Сибір. Він нагадує партії про втрачені землі й промисловість, яку можна повернути для підтримки народу та війська.\n\nХрущов підтримує інвестиції в цивільний сектор. Він запитує, навіщо сильне військо, якщо ми не здатні підтримати населення Тюмєні й земель, які невдовзі повернемо, та наголошує: саме сильний народ утримує армію.\n\nВід перемоги одного з цих бачень може залежати доля Росії."

 TYM_the_hammer: "...Молот"
 TYM_the_hammer_desc: "Чи завдяки кращій риториці й красномовству, чи завуальованим погрозам, але Каґановіч переконав більшість партії підтримати наголос на військовій і важкій промисловості. Щоб годувати зростаючу воєнну машину, буде колективізовано всі ще не колективізовані господарства. Інші господарства вилучать, а на їхній землі збудують промислові центри, які спершу підтримуватимуть і розширюватимуть самі себе.\n\nЗгодом їхні могутні виробничі лінії розвернуться назовні й виготовлятимуть спорядження, з яким армія вдарить у серце тих, хто покинув Совєцький Союз, а одного дня - і самої німецької загрози."

 TYM_the_sickle: "...Серп"
 TYM_the_sickle_desc: "Бачення Хрущова вразило більшість конгресу, і тепер його готові втілити. Як і Каґановіч, Хрущов розуміє потребу в подальшій індустріялізації, але підтримує збалансованіший підхід із розвитком цивільної промисловости.\n\nПередусім він прагне механізувати сільське господарство, збільшити врожаї та краще годувати країну. Господарства буде колективізовано й об'єднано у великі комплекси, розраховані на тривалу роботу та зі збереженням певного впливу тих, хто споконвіку обробляв землю. Так ми зробимо все, щоб голод ніколи більше не вразив совєцький народ."

 TYM_to_cast_the_enemies_of_the_revolution: "Щоб розтрощити ворогів революції..."
 TYM_to_cast_the_enemies_of_the_revolution_desc: "Розкол Західного Сибіру залишив військо в жалюгідному стані, особливо після заколоту значної частини Червоної Армії та створення військової ради у Свєрдловску. Рокоссовскій, Батов, Карбишев та їхні сили - зрадники, але їхня відсутність лишила в армії велику прогалину. Без дієвої бойової сили Революція не переможе, тож прогалину слід заповнити.\n\nРеспубліці потрібно більше патріотів, готових підтримати Революцію. Ми поширимо пропаганду по всій країні, виховуючи в народі совєцький патріотизм і показуючи нікчемність ворогів. Пізнавши правду, чоловіки неодмінно знову масово стануть під червоні стяги."

 TYM_and_bring_us_to_the_modern_era: "...і привести нас у сучасність"
 TYM_and_bring_us_to_the_modern_era_desc: "Значна частина промисловости не працює. Терористичні бомбардування випатрали заводи, а робітники, відрізані хаосом у містах, повернулися до сільського життя. Якщо ми сподіваємося відновити втрачене, ці тенденції слід повернути назад.\n\nУсе має бути присвячене зростанню промисловости. Усе можливе буде централізовано, а споживчі товари й легку промисловість обмежать, щоб зосередитися на найважливішому для виживання держави."

 TYM_for_the_bounty_of_the_land: "Бо багатство землі..."
 TYM_for_the_bounty_of_the_land_desc: "Ми працюємо не заради порожніх прибутків чи добробуту еліт. Наш Союз прагне вирвати людство з первісного стану й досягти наукового врядування. Він хоче викорінити буржуазний лад, що заважає суспільству розкрити справжній потенціял, і зробити щедрими колись неродючі землі.\n\nЦі нагальні проблеми вимагають негайних дій. Треба масово механізувати сільське господарство, колективізувати господарства, обробити землю й підготувати величезні сільськогосподарські комплекси, що ефективніше здобуватимуть харчі. Лише негайні, радикальні й необхідні дії принесуть нашому рухові успіх."

 TYM_is_her_own_people: "...її власний народ"
 TYM_is_her_own_people_desc: "Ми працюємо не заради порожнього прибутку чи добробуту еліт. Наш рух прагне втілити обіцянку соціялізму для звичайного робітника, полегшити людські страждання й подолати суспільні хвороби. Як писав сам Маркс, ми прагнемо світу для простих людей, де звуки щастя дістануться найглибших джерел і пробудять людей у кожній країні.\n\nРозв'язуючи ці проблеми, треба бути лагідними й розуміти людей. Держава має допомагати селянам і робітникам, давати освіту й соціяліьний захист, стати установою, якій довіряють маси.\n\nБо без них у нас майже нічого немає."

 TYM_below_its_feet_lays: "Під його ногами..."
 TYM_below_its_feet_lays_desc: "Друге питання нашого руху - на чому зосередити економічні пріоритети держави.\n\nДля голови Каґановіча відповідь проста: на природних ресурсах Росії. По всій країні лишилися величезні невикористані мінеральні багатства. Ми можемо збудувати шахти й заводи, видобувати їх і продавати на користь держави.\n\nХрущов бачить більше можливостей у проєктах для суспільного блага. Він будував би житло й поліпшував державну інфраструктуру, переробляючи наявні ресурси на придатні матеріали для всіх громадян Совєцького Союзу."

 TYM_a_land_of_steel: "...Край сталі"
 TYM_a_land_of_steel_desc: "Після тривалого обговорення аргументи голови Каґановіча перемогли - як ми й знали. Держава вже мобілізується для втілення його планів. Шахти знову відкриють, а нових робітників наймуть добувати мінеральні багатства Союзу.\n\nНезабаром щедрі дари природної величі Росії будуть у наших руках."

 TYM_so_steel_it_shall_bring_forth: "...тож сталь він і породить."
 TYM_so_steel_it_shall_bring_forth_desc: "Гірничі роботи швидко просуваються, видобуваючи руду, яку заводи негайно перетворюють на сталь. Ці ресурси змінюють інфраструктуру, армію й економіку, роблячи нас сильнішими, ніж будь-коли.\n\nТа крім матеріальних здобутків, джерелом сили є саме знання. Щодня ми дізнаємося, що працює, а що ні, й удосконалюємо методи видобутку. Ми розкололи Землю, і невдовзі вона віддасть усі свої скарби."

 TYM_the_home_of_the_revolution: "...Батьківщина революції"
 TYM_the_home_of_the_revolution_desc: "Після тривалого обговорення перемогли аргументи товариша Хрущова. Ми оголосимо тотальну війну бідності й самим класам. Незабаром усі відмінності зникнуть, а всі нації, класи й народи об'єднаються у відродженому СССР.\n\nПерший крок - житло. Для надто багатьох людей умови жахливі: більшість робітників не має безпечних, доглянутих осель, питної води й надійної електрики. Ми розпочнемо масштабне будівництво квартир по всьому Союзу. Ці «хрущовки», як їх називають чиновники, гарантують кожному - робітникові чи солдатові - бодай базовий дах над головою."

 TYM_and_her_soul_its_people: "...а її душа - народ."
 TYM_and_her_soul_its_people_desc: "Але цього замало, хіба ні? Плитка й бетон не розв'яжуть проблему людського становища. Союз повинен завжди дивитися вперед, до майбутнього й політики, що дасть народові змогу переступити нинішні обмеження.\n\nНайкращий шлях - інвестиції в дослідження. Кошти від нинішніх мінеральних багатств відкриють нові можливості завтра. Що розвиненішим буде Союз, то краще він зможе захищати й забезпечувати робітників у майбутньому."

 TYM_and_its_proud_sons: "І його горді сини"
 TYM_and_its_proud_sons_desc: "Попри всі суперечки й розбіжності, роботу зроблено. Ми заклали основи сильної держави, здатної відповісти на майбутні виклики. Каґановіч і Хрущов відклали останні сумніви й готові повести Союз у нову добу боротьби та випробувань.\n\nПершими й найважливішими обидва вважають військові виклики. Навколо нас - зрадники Союзу, які прагнуть знищити останню велику надію комунізму. Треба вдосконалити армію й дати їй перевагу в прийдешніх боях. Питання лише в тому, чи обрати переважно наступальну силу Каґановіча, чи оборонну силу Хрущова."

 TYM_casted_off_their_velvet_gloves: "Скинути оксамитові рукавички"
 TYM_casted_off_their_velvet_gloves_desc: "Наступальна сила - очевидна відповідь. Як відновити порядок, лише захищаючи те, що маємо? Сховаємося в халупах і відгородимося від світу? Чекатимемо, доки реакціонери й ухильники зберуть армії, здатні нас знищити?\n\nПерехід до оборони безглуздий. Голова Каґановіч навів блискучі докази. Під його проводом наша політика стане наступальною. Революційна армія рушить уперед, знову поширюючи соціялізм Росією. Настав час комунізму! Настав час Совєцького Союзу!"

 TYM_live_among_wolves: "Жити серед вовків"
 TYM_live_among_wolves_desc: "Оборонна сила - очевидна відповідь. Як поширювати Революцію за кордоном, не захистивши її вдома? Відчинимо міську браму й без спротиву впустимо загарбників? Пожертвуємо серцем нового Совєцького Союзу заради марнославних і безрозсудних завоювань?\n\nПерехід у наступ безглуздий. Товариш Хрущов блискуче спростував цю дурість. Під його проводом військо переорієнтується на оборонні доктрини, щоб захистити здобуте, а тоді відповісти. Можливо, це не принесе великих завоювань, про які дехто мріє, але для Союзу це безпечніша стратегія."

 TYM_that_is_the_five_year_plan: "Ось що таке П'ятирічний план"
 TYM_that_is_the_five_year_plan_desc: "Це був довгий і сповнений суперечок шлях, але нарешті в кімнаті запала тиша. Більше немає незалагоджених спорів і причин для сварок. П'ятирічний план завершено. Крапка.\n\nПомилкою було б назвати цей процес легким. Так само помилково вдавати, що ніхто не затаїв особистих образ, але публічно всі задоволені. Настав час почати виконувати План і нарешті вирішити, хто зрештою поведе наш Союз."

 TYM_and_so_we_wait: "Тож ми чекаємо..."
 TYM_and_so_we_wait_desc: "Ми підшиваємо останні папери й дивимося на країну. Навіть побіжного погляду досить, щоб побачити чимало приводів для гордости. Каґановіч і Хрущов тяжко працювали, об'єднуючи народ і поліпшуючи його становище.\n\nЗалишається лише йти вперед. Після об'єднання Західного Сибіру ми зможемо обговорювати нові питання, розв'язувати нові проблеми й визначати, як привести країну до нової доби."
 
 ### Regional Politics Tree ###
 TYM_the_great_popular_triumph: "Великий народний тріюмф"
 TYM_the_great_popular_triumph_desc: "Західносибірську Народну Республіку відновлено! Народи Сибіру звільнено від володарів - від лжелідера у Свєрдловску й огидної Всеросійської Чорної Ліги до злодіїв Юґри та мерзенних торговців війною зі Златоуста. Після об'єднання регіону починається найважчий етап довгого й виснажливого возз'єднання Росії. Тисячі співвітчизників безробітні, голодні й позбавлені домівок. Ми мусимо подбати про народ і підготуватися до майбутніх конфліктів, адже не лише ми прагнемо об'єднати Росію."
 
 TYM_honor_the_heroes_of_socialism: "Вшанувати героїв соціялізму"
 TYM_honor_the_heroes_of_socialism_desc: "Солдати й робітники багато зробили для об'єднання, але треба вшанувати хоробрих людей, які керували ними на передовій. Політики, бюрократи, генерали й дипломати, що привели республіку до перемоги, отримають найвищі нагороди. На честь тих, хто об'єднав регіон і, дасть Бог, об'єднає Росію, вручать медалі та зведуть пам'ятники."
 
 TYM_uplift_the_proletarian_contribution: "Вшанувати внесок пролетаріяту"
 TYM_uplift_the_proletarian_contribution_desc: "Генерали, бюрократи, політики й дипломати керували об'єднанням, але не можна забувати тих, хто працював, бився й помирав, щоб над регіоном майорів прапор Західносибірської Народної Республіки. Селяни, робітники й солдати пролили найбільше крови за наші здобутки, тому ми профінансуємо нові види пропаганди на честь буденних героїв партії. Пам'ятаймо: без робітника ми - ніщо."
 
 TYM_reflect_upon_stalins_word: "Осмислити слово Сталіна"
 TYM_reflect_upon_stalins_word_desc: "Західносибірська Народна Республіка стоїть на ідеологічному роздоріжжі. Думки Іосіфа Сталіна провели державу крізь найтемніші години, але вічно суворо дотримуватися сталінізму неможливо. Ми йдемо за вченням Сталіна, та з плином часу й лібералізацією дедалі більшої кількости країн у системі неминуче з'являться тріщини. Його ідеї щодня здаються застарілішими, тож настав час доповнити нашу ідеологію з інших теоретичних джерел, у більшості питань зберігаючи вірність первісному слову Сталіна."

 TYM_the_new_soviet_life: "Нове совєцьке життя"
 TYM_the_new_soviet_life_desc: "Ми підтримуємо всіх робітників Західносибірської Народної Республіки, а не лише тих, хто виглядом і поведінкою нагадує більшість росіян. Усі меншини в наших кордонах мають отримувати таку саму медичну допомогу, освіту й платню, як кожна людина, якій випало працювати й жити в нашій країні. Замість поділу за мовою, расою та культурою нас об'єднають ідеологія та спільні кров, піт і сльози, пролиті за Західний Сибір."
 
 TYM_for_the_abolition_of_oppression: "За ліквідацію гніту"
 TYM_for_the_abolition_of_oppression_desc: "Ми багато зробили для всіх робітників у наших кордонах, але не можна забувати жінок Західносибірської Народної Республіки. Чимало з них ведуть домашнє господарство, а багато під час об'єднавчих війн посіли місця чоловіків. Рекордна кількість жінок працює на заводах, у науці й інженерії та здобуває вищу освіту, але встановити рекорд легко, коли раніше показник був майже нульовим. Великі інвестиції дадуть жінкам змогу будувати кар'єру й учитися, а пропаганда привчить суспільство до рівности незалежно від статі."
 
 TYM_a_mother_should_be_proud: "Мати має пишатися!"
 TYM_a_mother_should_be_proud_desc: "У нашій республіці жінки повинні й будуть піднесені, та частина з них і далі має виконувати традиційні ролі. Жінку слід вважати рівною незалежно від того, чи вона хімік, чи готує вдома й доглядає дітей. Поєднавши в пропаганді традиційні ролі з ідеями рівности, ми непомітно досягнемо обох цілей."
 
 TYM_spiritual_and_political_flourishing: "Морально-політичний розквіт"
 TYM_spiritual_and_political_flourishing_desc: "Ми - єдина надія на возз'єднання Росії, а найкращий засіб для цього - наші громадяни, однак їхній дух має бути високим. Пропаганда пояснить людям, що саме вони найкраще здатні об'єднати країну та є найздібнішими й найчеснішими в усій Росії - від Московії до Далекого Сходу. Західносибірська Народна Республіка має це знати."
 
 TYM_a_culture_proletarian_over_all: "Пролетарська культура понад усе"
 TYM_a_culture_proletarian_over_all_desc: "Елітизм - ворог пролетаріяту й Республіки. Багато мистецьких стилів навмисно заплутують послання та ставлять себе понад звичайного робітника, заохочуючи елітизм. Утвердивши простий, практичний і зрозумілий стиль соціялістичного реалізму, ми зробимо твори талановитих митців доступними всім громадянам."
 
 TYM_the_new_soviet_spirit: "Новий совєцький дух"
 TYM_the_new_soviet_spirit_desc: "Матеріяльні потреби соціялістичної держави безперечно важливі, але треба дбати й про дух народу та ставлення людей одне до одного. Ми, звісно, є вільним інтернаціоналістичним суспільством, де всі громадяни й народи поділяють соціялістичну солідарність. Проте слід визначити, які саме погляди найкорисніші: космополітичні й відкриті чи патріотичні й захисні? Людський розум - найродючіший ґрунт соціялізму, тож його треба належно плекати."
 
 TYM_soviet_cosmopolitanism: "Совєцький космополітизм"
 TYM_soviet_cosmopolitanism_desc: "Ми маємо відкинути дрібні відмінності й стати єдиною нацією. Партійних поділів більше не буде. Усі народи Західного Сибіру стануть рівними членами пролетаріяту. Колишні національні ідентичності більше не потрібні: усі будуть громадянами Західносибірської Народної Республіки й разом просуватимуть наші цілі."
 
 TYM_rehabilitated_nationalism: "Реабілітований націоналізм"
 TYM_rehabilitated_nationalism_desc: "Сусіди безперервно сиплють риторикою про власну «свободу», водночас принижуючи нас і ганьблячи наші установи. Республіка й далі захищатиме рівність і братерство, але мусить посилити риторику проти ворогів. Якщо капіталісти стали космополітами, ми станемо націоналістами!"
 
 TYM_a_union_together_and_equal: "Союз, єдність і рівність"
 TYM_a_union_together_and_equal_desc: "Коли владу Республіки в регіоні майже цілком зміцнено, треба розв'язати одну з небагатьох нагальних політичних проблем: ставлення до меншин у наших кордонах. Багато хто приймає нових громадян, але дехто дивиться на них зверхньо й має упереджені погляди. Ми створимо новий урядовий орган для захисту прав меншин і покажемо суперникам на сході й заході, що саме ми - найсильніша Росія, об'єднана на засадах рівности!"

 TYM_unity_foremost_and_unity_enduring: "Єдність понад усе, єдність навіки"
 TYM_unity_foremost_and_unity_enduring_desc: "Щоб захистити меншини, які стали громадянами Республіки, ми маємо не допустити їхнього відсунення на узбіччя й переростання «традиціоналістських» поглядів частини населення в насильство. Нова адміністрація захищатиме меншини в наших кордонах і діятиме прямо та рішуче, щоб їхні права не порушувалися."
 
 TYM_the_new_soviet_state: "Нова совєцька держава"
 TYM_the_new_soviet_state_desc: "Як казав великий Маркс: «Філософи лише по-різному пояснювали світ, але справа полягає в тому, щоб змінити його». Те, що ми оберігаємо найортодоксальнішу течію большевізму, нічого не означає без застосування теорії. Західносибірську Народну Республіку треба перекувати за сталінським взірцем. Увесь уряд перебудують на сталінських засадах, службовців навчать сталінської теорії, а партію змусять виконати цілі, які Сталін поставив багато років тому."
 
 TYM_consistent_democratism: "Послідовний демократизм"
 TYM_consistent_democratism_desc: "Товариш Каґановіч був рушієм Західносибірської Народної Республіки від самого початку: його слово - закон, а партійна верхівка лише радить або покірно схвалює. Та це далеко від лєнінського демократичного централізму, за якого члени партії спершу обговорюють політику, а тоді голосують, а не просто виконують волю генерального секретаря. Настав час розширити демократичний централізм і дозволити більшій кількості партійців пропонувати й обговорювати політику перед голосуванням."
 
 TYM_an_eye_to_political_requirements: "З огляду на політичні вимоги"
 TYM_an_eye_to_political_requirements_desc: "Диктатура пролетаріяту, в якій пролетаріят нічого не диктує, є просто диктатурою. Тому згідно з принципами товариша Сталіна ми розширимо пряму демократію в Народній Республіці. Замість позбавляти прав незгодних, як-от священників і колишніх працедавців, запровадимо загальні, прямі й таємні вибори. Народ підтверджуватиме кандидатів до місцевих совєтів, висунутих Комуністичною партією, поданням простих чистих бюлетенів. Незгодні з кандидатами партії зможуть вільно висувати власних через виборчі дільниці. Так голос робітничого класу буде почуто навіть на найвищих щаблях партії."

 TYM_amnesty_for_the_redeemable: "Амністія для небезнадійних"
 TYM_amnesty_for_the_redeemable_desc: "Сказати, що реакційні режими Омска й Свєрдловска відійшли від революційних ідеалів Маркса, Лєніна й Сталіна, було б применшенням. Та в цих буржуазних державах працювали перспективні службовці, і марнотратно не допускати їх до відновленої служби лише через недосконалі результати перевірок на політичну відданість. Талановитим людям, здатним співчувати робітничому класові, слід дати шанс спокутувати провину службою в Народній Республіці. Під пильним оком Комуністичної партії вони неодмінно заслужать прощення робітничого класу й допоможуть відбудувати соціялізм у Західному Сибіру."
 
 TYM_eyes_on_the_nomenklatura: "Пильнувати номенклатуру"
 TYM_eyes_on_the_nomenklatura_desc: "Установи Народної Республіки кишать класовими зрадниками - лицемірами, які нібито співчувають бідним і пригнобленим Західного Сибіру, а самі жиріють з їхньої праці. Навіть реакціонери, що служили ультранаціоналістичній Чорній Лізі та свєрдловським заколотникам, пролізли на державну службу, бурмочучи порожні банальності партійним лідерам чи головам місцевих совєтів. Не можна дозволити цьому ракові розростатися в серці Тюмєні: без нагляду ліберали знищать Революцію зсередини, визискуючи найуразливіших заради власної наживи.\n\nНастав час діяти."
 
 TYM_springtime_for_the_soviet_people: "Весна для совєцького народу"
 TYM_springtime_for_the_soviet_people_desc: "Маркс заснував науковий соціялізм, Лєнін навчив світ утілювати його, а Сталін довів до досконалости. Під проводом марксистсько-лєнінсько-сталінської ідеології Західносибірська Народна Республіка квітне оазою в постсовєцькій пустці. Праці Сталіна надихають службовців будувати кращу й ефективнішу державу, а його приклад веде партійців до остаточної перемоги над капіталізмом. Республіка перебудовується за образом Сталіна й щодня міцнішає!"

 ### Regional Economics Tree ###
 TYM_continue_the_five_year_plan: "Продовжити П'ятирічний план"
 TYM_continue_the_five_year_plan_desc: "Завдяки П'ятирічному плану промисловість Республіки стрімко зростає. Щодня робітники наповнюють заводи, а машини крутяться з енергією живих істот. Димарі клубочаться від шаленого темпу праці, і повсюдна продуктивність повертає простим громадянам добробут, якого вони не знали з часів до Великої Вітчизняної війни. Якщо робітники збережуть темп, ми станемо найбільшою силою постсовєцьких земель!"
 
 TYM_the_wheels_of_an_industrial_revolution: "Колеса промислової революції"
 TYM_the_wheels_of_an_industrial_revolution_desc: "Кожен ортодоксальний марксист скаже: залежні від землеробства країни бідні й нужденні, а промисловість - шлях до соціялізму! Державна президія Тюмєні має визначити економічне майбутнє й найкращий спосіб розвинути промисловість, щоб не лише відбудувати та возз'єднати Росію під прапором наукового соціялізму, а й закласти основи марксистсько-лєнінсько-сталінського майбутнього. Від сьогоднішніх рішень залежить доля Росії та робітничого класу."
 
 TYM_rehabilitate_the_sibplan: "Реабілітувати Сибірський план"
 TYM_rehabilitate_the_sibplan_desc: "Поки що значна частина Західного Сибіру - безплідна пустка й болото, а люди бідні та ізольовані. Проте зовнішність оманлива. У сибірській землі приховані ресурси, здатні живити наймогутніші імперії: нафта, бензин, свинець, мідь та багато іншого. Першим кроком до добробуту кожного робітника стане будівництво шахт і свердловин на відомих родовищах та заводів для переробки сировини. Спершу видобуток буде малим, але саме на цих підвалинах постануть монументи соціялістичного майбутнього!"

 TYM_the_tested_approach: "Перевірений підхід"
 TYM_the_tested_approach_desc: "«Хочеш миру - готуйся до війни», - каже давнє прислів'я. Нас оточують ліберали й реакціонери, які прагнуть поневолити робітників Тюмєні заради власної вигоди й знищити сталінський робітничий рай. Щоб захистити Революцію від буржуазних хижаків, ми розбудували оборонну промисловість у всіх великих містах. Замість марнувати час на непевний видобуток мінералів, треба й далі розвивати обороноздатність, забезпечуючи Республіці добробут і безпеку."

 TYM_redouble_the_urbanization_campaign: "Подвоїти зусилля з урбанізації"
 TYM_redouble_the_urbanization_campaign_desc: "Хребет соціялізму - не селянство, а міський пролетаріят, що працює на великих заводах і в ливарнях. Щоб збудувати соціялізм у Західному Сибіру, ми не можемо лишатися сільським суспільством із поодинокими малими містами. Країна має урбанізуватися, а міста - вирувати життям і працею промислового пролетаріяту. Родини заохочуватимуть до переїзду нижчою орендою, податковими пільгами й перевагою при наймі, а впертих реакційних селян, що тримаються примітивного життя, каратимуть зборами. Батогом і пряником Тюмєнь перетвориться з відсталої країни на осяйний взірець майбутнього міського соціялістичного суспільства."
 
 TYM_a_framework_for_development: "Основа для розвитку"
 TYM_a_framework_for_development_desc: "Промислову революцію не можна проводити за примхами кількох егоїстів - у цьому помилка західних капіталістів. Найкращі економічні планувальники мають скласти чіткий план індустріялізації, який усі робітники виконуватимуть заради спільного блага. У ньому докладно визначать процедури й розподіл устаткування на кожному заводі. Так ми не лише розширимо інфраструктуру й забезпечимо національне зростання, а й поліпшимо життя всіх людей."
 
 TYM_the_khrushchev_plan: "План Хрущова"
 TYM_the_khrushchev_plan_desc: "Нікіта Хрущов пропонує відмовитися від надмірної централізації колгоспів. Замість залежности всіх господарств регіону від машинно-тракторних станцій, де зберігаються трактори й молотарки, кожне господарство отримає власну техніку. Децентралізація передасть селянам більше відповідальности за добробут і врожайність господарств, заохотить їх працювати краще та звільнить державу від витрат на централізоване обслуговування."
 
 TYM_strengthen_agricultural_control: "Посилити контроль над сільгоспом"
 TYM_strengthen_agricultural_control_desc: "Збереження великих централізованих колгоспів дасть змогу розвивати наявну інфраструктуру, збільшить виробництво харчів завдяки праці великими групами й зменшить адміністративний тягар обліку численних господарств. Якщо зробити чинні колгоспи ефективнішими й дати їм зростати, народ невдовзі матиме щедрі врожаї, наче великий бенкет із чарівної скатертини."
 
 TYM_the_riches_of_siberia: "Багатства Сибіру"
 TYM_the_riches_of_siberia_desc: "Наше розташування в Сибіру - і благословення, і прокляття. Це один із найбагатших на ресурси регіонів світу, наділений нафтою, рудою, мінералами й не тільки, але водночас один із найізольованіших, переважно з віддаленими селами, що майже не можуть використати багатства на користь людям. Для побудови соціялізму треба розширити інфраструктуру видобутку й переробки: відрядити геологів у віддалені землі, збудувати шахти й нафтопереробні заводи на великих родовищах та підприємства, що перетворять сировину на корисні товари."

 TYM_a_glance_to_bukharin: "Погляд у бік Бухаріна"
 TYM_a_glance_to_bukharin_desc: "ЗСНР побудована на марксистсько-лєнінсько-сталінській ідеології, але іноді практика вимагає прагматично відступити від теорії. Від розпаду Совєцького Союзу сибірські заводи мовчать і ржавіють, а робітники й селяни живуть у злиднях, які ортодоксальна сталінська політика майже не полегшила. Дехто з посадовців пропонує повернутися до марксистсько-лєнінсько-бухарінської політики вільного ринку й іноземних інвестицій, бо за нашої промислової відсталости вони здатні швидше розвинути продуктивні сили, ніж некапіталістичне виробництво."
 
 TYM_the_orthodox_approach: "Ортодоксальний підхід"
 TYM_the_orthodox_approach_desc: "Сталін недарма виступав проти вільного ринку: він може дати коротке зростання, але зрештою задушить великий соціялістичний експеримент, поглиблюючи нерівність і ускладнюючи робітникам захоплення засобів виробництва. Бухарінські методи можуть здаватися спокусливими ліками від бідности, але в Сибіру їх не можна застосовувати. Збільшення промислових квот, розширення заводів і рівний розподіл плодів праці серед усіх трудящих краще збудують справжнє соціялістичне суспільство."
 
 TYM_the_next_stage_awaits: "На нас чекає наступний етап!"
 TYM_the_next_stage_awaits_desc: "Сибір починав як злиденна глушина, але правильне застосування марксистсько-лєнінсько-сталінської теорії перетворило країну на осяйний взірець соціялізму в постсовєцькому світі й довело, що соціялістичний експеримент не зазнав краху. Заводи вирують, робітники вдень і вночі стоять біля машин, колгоспні поля золотіють стиглим збіжжям, а села вкриті шахтами, нафтовими свердловинами й залізницями. Та спочивати на лаврах рано: слід розширити здобуте й перейти до нового етапу економічного зростання."
 
 TYM_the_seeds_of_soviet_progress: "Насіння совєцького прогресу"
 TYM_the_seeds_of_soviet_progress_desc: "Ми не утопісти, що мріють про повітряні замки чи мляво моралізують про потребу соціялізму. Ми наукові соціялісти, чию перемогу в класовій боротьбі гарантує краще знання марксистсько-лєнінсько-сталінської теорії та діялектики. Щоб перемогти контрреволюцію, треба розвивати наукову й технологічну базу, мати найновішу зброю та машини. Кожен охочий має отримати освіту, а нових науковців, суспільних теоретиків і службовців слід готувати до керівництва Революцією. Лише тоді ми справді виправдаємо назву наукового соціялізму."
 
 TYM_illiteracy_liquidation_programs: "Програми ліквідації неписьменности"
 TYM_illiteracy_liquidation_programs_desc: "Після розпаду СССР неписьменність у Росії різко зросла: централізована державна освіта зникла, а сьогоднішня їжа стала важливішою за завтрашню освіту дітей. Це треба негайно припинити й розпочати програми ліквідації неписьменности для селянства та нижчих класів - хребта соціялізму. Кожне село матиме школу, яку діти регулярно відвідуватимуть за єдиною соціялістичною програмою, вивчаючи навички, технології, світ і, головне, прийдешнє революційне майбутнє."
 
 TYM_expand_the_institutes: "Розширити інститути"
 TYM_expand_the_institutes_desc: "Знання - найпотужніша зброя Революції, а найвища освіта - університетська й інститутська. Щоб належно підготувати нове покоління керівників Революції, треба відкрити університети для бюрократів і службовців та спеціялізовані інженерні, медичні й економічні інститути по всій країні. Там, де їх не було, нові заклади постануть під опікою чинних. Найголовніше - дати всім студентам безплатні освіту й житло, заохочуючи людей з усіх верств до навчання."
 
 TYM_revolution_in_thought_and_theory: "Революція в думці й теорії"
 TYM_revolution_in_thought_and_theory_desc: "Наш соціялізм недарма зветься науковим: він спирається на спостереження за світом і створення нової теорії та практики. Найважливіша риса науки - відкритість до змін і дискусій. Сталін розвинув теорії Лєніна, а Лєнін - думки Маркса. Настав час нового розділу марксистсько-лєнінсько-сталінської ідеології: заохочуймо вільну думку інтеліґенції й письменників, дозволяймо критикувати наявні підходи й формулювати нові розв'язання - звісно, в межах розумного..."
 
 TYM_honor_the_visionaries: "Вшанувати візіонерів"
 TYM_honor_the_visionaries_desc: "Революцію поведуть візіонери - мислителі, науковці й передусім теоретики марксізму-лєнінізму-сталінізму. Щоб виростити нове покоління великих чоловіків і жінок, здатних привести пролетаріят до соціялізму, освітні програми зосередяться на науках від географії до зоології. Програма наголошуватиме на критичному мисленні й творчому розв'язанні проблем, а найяскравіші новатори матимуть пріоритет. Передусім діти вивчатимуть марксізм-лєнінізм-сталінізм і соціялістичну думку, щоб одного дня розвивати цю життєво важливу галузь."
 
 TYM_a_generation_of_workers: "Покоління робітників"
 TYM_a_generation_of_workers_desc: "Робітничий клас - хребет кожного суспільства, і освіта має це відображати. Треба підготувати нове покоління технічних фахівців: геологів, інженерів, хіміків і техніків. Школи й університети нададуть найвищий пріоритет точним наукам та інженерії, професійності й практичним результатам. Завдання ґрунтуватимуться на реальних ситуаціях, а часткова праця за обраною спеціялізацією стане умовою випуску. Лише коли робітники Сибіру матимуть належну підготовку й твердий практичний досвід, буде збудовано соціялізм і кожен житиме як цар."
 
 ### Regional Military Tree ###
 TYM_the_workers_and_peasants_army: "Робітничо-селянська армія"
 TYM_the_workers_and_peasants_army_desc: "Західносибірська Народна Республіка - єдина законна спадкоємиця Совєцького Союзу й лєнінської ідеології, тому її Робітничо-селянська Червона Армія є єдиною законною наступницею Червоної Армії, що хоробро билася й гинула у війні проти фашизму. На честь загиблих героїв ми приймемо основні доктрини й тактику предків, але розвинемо їх нововведеннями, щоб нова армія перемогла реакціонерів, фашистів і ревізіоністів, які захопили Батьківщину. Лише тоді вона стане нестримною силою революційної люті."

 TYM_elevate_proven_officers: "Підвищити перевірених офіцерів"
 TYM_elevate_proven_officers_desc: "Підмурком Червоної Армії є стара армія Вітчизняної війни, а цеглою й розчином - офіцери, що ведуть робітників у бій. Під час об'єднавчих війн чимало молодих випускників кадетських шкіл виявили тактичний блиск, хитрість і хоробрість. Підвищення цих перспективних людей дасть Революції покоління новаторських, але вже досвідчених командирів і покаже громадянам Народної Республіки: кожен сміливий і розумний може стати героєм."
 
 TYM_repurpose_nkvd_units: "Перепрофілювати підрозділи НКВД"
 TYM_repurpose_nkvd_units_desc: "Непохитні чоловіки й жінки НКВД захищають Революцію. Мало хто поза їхніми лавами, крім самої партії, так відданий соціялізму, але їх значно більше, ніж потрібно для боротьби з внутрішніми ворогами. Польові підрозділи НКВД можуть допомогти Червоній Армії проти зовнішніх реакціонерів. Ідеологічно чисті й дисципліновані ударні частини стануть безцінним молотом, що без вагань і жалю розітре контрреволюцію на порох - якщо їм дозволять вийти на поле бою."
 
 TYM_new_commissarial_appointments: "Нові призначення комісарів"
 TYM_new_commissarial_appointments_desc: "ЗСНР побудована на марксистсько-лєнінсько-сталінській ідеології та є єдиною законною наступницею справи Лєніна. Та мало червоноармійців розуміють це й справжню сталінську справу, бо корпус політпрацівників розвалений. НКВД натомість має надлишок ідеологічно чистих кадрів. Переведення найвідданіших незадіяних працівників до комісаріяту згуртує робітників для революційної війни й водночас розв'яже проблему роздутого НКВД."
 
 TYM_lessons_from_the_reclamation_war: "Уроки війни за об'єднання"
 TYM_lessons_from_the_reclamation_war_desc: "У вогні об'єднавчих війн викувано Червону Армію ЗСНР, і тепер знайдені там нововведення та методи стануть офіційною доктриною. Офіцери, які створили сміливу тактику й хитрі плани проти лібералів та реакціонерів, першими отримають посади викладачів академій, а бюрократів, що навчилися берегти й розподіляти припаси під тиском, підвищать до вищого керівництва. Єдина стала діялектики - зміна, і хто не пристосується, той загине."
 
 TYM_remember_the_antifascist_war: "Пам'ятати Антифашистську війну"
 TYM_remember_the_antifascist_war_desc: "Робітничо-селянська Червона Армія походить від первісної Червоної Армії, що шляхетно пожертвувала собою в боротьбі проти фашизму. Щоб уникнути її долі, треба докладно проаналізувати всі битви, знайти помилки й виправити майбутню доктрину. Навіть фашистську тактику слід ретельно вивчати - не лише готуючись до нових війн, а й переймаючи вдалі методи. Коли фашисти постукають у двері, ворог відповість їм вогнем на вогонь."
 
 TYM_an_army_for_a_new_struggle: "Армія нової боротьби"
 TYM_an_army_for_a_new_struggle_desc: "Майбутні битви вестимуть не гвинтівками й середніми танками часів вторгнення, а автоматами, основними бойовими танками, гелікоптерами й іще неназваними технологіями. Для перемоги соціялістичної Революції треба вивчити нову техніку й способи війни. Попри труднощі зв'язків із зовнішнім світом, ми надсилатимемо спостерігачів до дружніх країн із передовими методами й якнайкраще пристосуємо їхню тактику для Робітничо-селянської Червоної Армії."
 
 TYM_developments_for_the_soldier: "Розробки для солдатів"
 TYM_developments_for_the_soldier_desc: "Більшість солдатів досі носить однострої й спорядження Антифашистської війни. За мірками російського об'єднання вони добрі, але проти зовнішніх армій сміховинно застарілі. Навіть середні держави вже дають звичайній піхоті камуфляж і бронежилети. Таке оснащення дасть перевагу над прикордонними реакціонерами й гарантує армії марксізму-лєнінізму-сталінізму перемогу над капіталістами за межами Росії."
 
 TYM_return_to_zlatoust: "Повернутися до Златоуста"
 TYM_return_to_zlatoust_desc: "Після краху Совєцького Союзу полковник Калашніков у Златоусті створив революційну зброю АК-47 для держав-наступниць. Відтоді минули десятиліття, й гвинтівка старіє. Якщо зброярі вивчать її переваги й створять новий соціялістичний автомат із найсучаснішими доступними технологіями, ми отримаємо могутню перевагу над нинішніми й майбутніми ворогами. Це буде машина смерти, вдосконалена науковим аналізом, і разючий символ пролетарської люті в руках робітників."
 
 TYM_revisit_the_armored_corps: "Переглянути бронетанковий корпус"
 TYM_revisit_the_armored_corps_desc: "Після поразки ревізіоністів-бухарінців у 1940-х механізовані війська користуються машинами, трохи кращими за трактори, рештками американського ленд-лізу та кількома прототипами з архівів. Треба прийняти сучасну бойову машину піхоти, яка захищає десант і завдає великої шкоди. Нова БМП буде російською й соціялістичною: дешевою для виробництва будь-якою підготовленою бригадою, здатною долати великі відстані суворою місцевістю з малою витратою пального й витримувати удари, не припиняючи бою, як справжній син Батьківщини."
 
 TYM_the_is_tank: "Танк ІС"
 TYM_the_is_tank_desc: "Бронетанкова війна далеко просунулася від Антифашистської війни. Королева поля бою - основний бойовий танк, що поєднує вогневу міць важкого танка з рухливістю середнього. Настав час збудувати власний. Більший, важчий і руйнівніший за все бачене, він зватиметься танком «Іосіф Сталін» - на честь найвидатнішого марксистського мислителя після Маркса й законного наступника Лєніна. На полі бою реакціонери й ревізіоністи пізнають справжню лють марксистсько-лєнінсько-сталінської ідеології."
 
 TYM_legacy_of_the_aviators: "Спадщина авіяторів"
 TYM_legacy_of_the_aviators_desc: "Можливо, ще травматичнішими за фашистські вторгнення були бомбардування, якими німці роками мучили вцілілих. Немає поселення, якого не атакували залізні стерв'ятники, і родини, що не втратила когось від фашистських бомб. Та якщо створити могутні повітряні сили й сильну ППО міст, ми більше ніколи не боятимемося такої кампанії. Нарешті робітники й селяни Сибіру спатимуть спокійно, знаючи, що небо бережуть марксистсько-лєнінсько-сталінські авіятори."
 
 TYM_the_siberian_air_fleet: "Сибірський повітряний флот"
 TYM_the_siberian_air_fleet_desc: "Сибірські повітряні сили вже створюються, але поки спираються на застарілі літаки Антифашистської війни й аеродроми з давньою інфраструктурою в місцях, що втратили стратегічне значення. Для панування в небі Росії слід розвивати наявні засоби: будувати сучасні аеродроми, а заводи переорієнтувати на літаки та обладнання для їхнього виробництва. Це забере час, але Сибірський повітряний флот стане дивом Росії та світу."
 
 ### Regional Diplomacy Tree ###
 TYM_returning_to_the_world: "Повернення у світ" 
 TYM_returning_to_the_world_desc: "Досі зовнішні зусилля були зосереджені на возз'єднанні Росії, але настав час шукати міжнародного визнання. За кордонами повно капіталістів і реакціонерів, однак потрібна чітка зовнішня політика, що врівноважить марксистсько-лєнінсько-сталінську ідеологію з реальністю. Остаточний вибір буде довгим і тяжким, а компроміси задовольнять не всіх, але зробити його необхідно."
 
 TYM_peaceful_coexistence: "Мирне співіснування"
 TYM_peaceful_coexistence_desc: "Настане день, коли робітники світу на чолі зі справжньою партією Лєніна повстануть проти буржуазних гнобителів. Озброєна марксистсько-лєнінсько-сталінською ідеологією та підтримана історією лють пролетаріяту знищить капіталістичну систему.\n\nТа не сьогодні.\n\nМи єдина така держава на Землі, а комуністичних країн мало, тим паче прийнятних для пуристів. Хай це й політично нечисто, співпраця з капіталістами допоможе швидко подолати найбільші загрози - фашистів Німеччини та Японії. Революцію завжди можна розпалити згодом..."
 
 TYM_the_revolution_does_not_wait: "Революція не чекає"
 TYM_the_revolution_does_not_wait_desc: "Саме німецькі фашисти катували робітничий клас Росії, а фашизм є капіталізмом у занепаді. Якою б спокусливою не була коротка співпраця з капіталістами, після поразки найближчих ворогів вони зрадять нас і спробують поневолити пролетаріят. Треба твердо виступити проти лібералів і реакціонерів, відмовитися від співпраці зі збоченою буржуазією й за кожної нагоди підтримувати марксистсько-лєнінсько-сталінські революції за кордоном. Революція починається зараз!"
 
 TYM_a_nod_to_the_west: "Кивок у бік Заходу"
 TYM_a_nod_to_the_west_desc: "Відносини капіталістичних країн із Совєцьким Союзом завжди були складними. Британія, Франція та США з підозрою сприйняли Жовтневу революцію й втрутилися на боці реакції. Тепер фашизм панує, а США лишилися єдиною ліберальною великою державою.\nПопри непримиренні класові суперечності, ми згодні в одному: фашизм є найбільшим ворогом людства, й заради його знищення слід відкласти розбіжності. Ми негайно відновимо відносини з Організацією Вільних Націй і почнемо будувати антифашистську коаліцію."
 
 TYM_southern_cooperation: "Південна співпраця"
 TYM_southern_cooperation_desc: "Лінії зв'язку встановлено: російський і казахський комуністичні уряди вперше після Західноросійської війни налагодили відносини. Та самого контакту з Казахською ССР замало. Обидві території спустошені війною й економічною скрутою. Як комуністи ми зобов'язані до солідарности, а сильніша ЗСНР мусить допомогти партнерові.\nНевдовзі почнуться торгівля, економічна допомога й передання військових припасів, зміцнюючи обидві республіки та їхній зв'язок. Сподіваємося, політична ситуація невдовзі дозволить Казахській ССР возз'єднатися з Росією."
 
 TYM_congratulate_compatible_governments: "Привітати прихильні уряди"
 TYM_congratulate_compatible_governments_desc: "В інші часи світовий соціялістичний блок був би досить великим, щоб виступати проти кожного капіталістичного уряду. Нині рух малий і вразливий перед фашистським велетнем. Треба будувати зв'язки не лише з комуністами, а з кожним урядом, прихильним до антифашизму й лівих принципів.\nНемарксистські соціялісти, ліві партії буржуазних демократій та інші недосконалі союзники в боротьбі за робітників і проти фашизму заслуговують похвали заради широкого «народного фронту» проти реакційної тиранії. Час ідеологічної чистоти настане після остаточної загибелі вірувань Гітлера й Муссоліні."
 
 TYM_contact_the_kazakhs: "Зв'язатися з рештою ССР"
 TYM_contact_the_kazakhs_desc: "Катастрофа Совєцького Союзу після нацистського вторгнення охопила й Центральну Азію. Її ССР потерпали від внутрішньої нестабільности та ірано-афганського вторгнення. Багато комуністичних урядів досі існують у зменшеному вигляді, й товариші заслуговують на підтримку.\nВласні війни довго нас відволікали, але тепер становище досить стабільне для контактів із дружніми урядами за кордоном. Ми відкриємо зв'язок із Центральною Азією, закладаючи підвалини майбутніх взаємовигідних відносин."
 
 TYM_support_central_asia: "Підтримати Центральну Азію"
 TYM_support_central_asia_desc: "Центральна Азія розколота, й не всі нові держави поділяють соціялістичні цінності. Казахські землі кишать реакційними воєначальниками, а деякі уряди цілком покинули соціялізм. Щоб відновити совєцьку систему, треба зміцнити зв'язки із сумісними державами й схилити баланс сили на їхню користь.\nКілька ССР лишилися вірними комуністичним ідеалам, і ми повинні стати їхніми союзниками. Поки сил для приєднання Центральної Азії замало, обмежимося розширенням геополітичного впливу."
 
 TYM_condemn_the_warmongers: "Засудити розпалювачів війни"
 TYM_condemn_the_warmongers_desc: "Немає більшого ворога народу, ніж імперіялістична війна. У XX столітті держави Європи, Азії та Північної Америки систематично посилали громадян гинути в окопах, морях і небі заради крихітної наживницької еліти. Німеччина та Японія заслуговують особливого осуду за насильницьке поневолення континентів і мільйони приречених. США, третя й «найдобріша» наддержава, лише трохи кращі, прикриваючи злочини турботою про свободу й демократію.\nЯк комуністи ми рішуче проти загарбницьких війн усіх сторін і винесемо цей принцип на міжнародну сцену. Якщо імперіялісти не припинять кровопролиття, ми невтомно їх критикуватимемо."
 
 TYM_a_policy_of_solidarity: "Політика солідарности"
 TYM_a_policy_of_solidarity_desc: "Від кінця XIX століття світ перебуває під владою імперіялістичних держав, які зростають розміром і скорочуються числом. Нині три-чотири великі держави залізною рукою правлять планетою, лишаючи справді незалежними лише маленькі райони. За Лєніном, імперіялізм - вища стадія капіталізму, й обов'язок соціяліста - боротися з ним усюди.\nІз Західного Сибіру ми мало допоможемо колонізованому світові, але можемо пообіцяти майбутню підтримку. Відроджений Совєцький Союз провістить світанок антиімперіялістичної боротьби й стане другом соціялістичних рухів національного визволення в усьому світі."
 
 TYM_denounce_social_fascism: "Викрити соціял-фашизм"
 TYM_denounce_social_fascism_desc: "Одна з найпідступніших ідеологій - соціял-демократія. Називаючись другом робітничого руху, вона обеззброює пролетаріят і спрямовує його силу в безглузді реформи замість боротьби з капіталом, знову й знову стаючи на бік розпалювачів війни та реакції. Це видно з Великої війни, невдалої Німецької революції, Російської громадянської війни й безлічі інших конфліктів. Вона не союзник робітників, а хитромудрий засіб буржуазії, інший бік тієї самої монети, що й фашизм.\nМи засуджуватимемо «соціял-фашизм», ведучи західних робітників із цієї пастки. Тих, кого можна врятувати, послухають; інші викриють себе, відмовившись покинути шлях виборчої «реформи»."
 
 TYM_the_call_of_the_comintern: "Поклик Комінтерну"
 TYM_the_call_of_the_comintern_desc: "Після Большевицької революції 1918 року молода совєцька держава створила Комуністичний Інтернаціонал для просування соціялістичної революції. Через міжвоєнний спад і піднесення фашизму Комінтерн не поширив революцію за межі Союзу й не пережив розпаду уряду Бухаріна. Тепер революційний рух поволі відбудовується, і потреба в Комуністичному Інтернаціоналі постає знову.\nЗСНР як законна спадкоємиця совєцької держави очевидно має очолити наступника Комінтерну. Заснування організації ознаменує відродження міжнародного соціялізму. Якщо вона вже існує, ми вступимо, швидко візьмемо провідну роль і всіляко сприятимемо світовій революції."

 
