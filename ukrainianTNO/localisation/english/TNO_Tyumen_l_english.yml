 TYM.60.t: "Нова політика?"
 TYM.60.d: "ВНУТРІШНІЙ ДОКУМЕНТ-AF12\n\nКОМУ: секретареві Лазарю Каґановічу\n\nВІД: Міністерства безпеки\n\nТЕКСТ:\n\nПісля об'єднання Західного Сибіру під проводом Секретаря ми опинилися на роздоріжжі в питанні регулювання життя як наших давніх громадян, так і нових громадян, які ввійшли до складу нашої славетної Народної Республіки. Зокрема, постає питання: чи слід нам так само рішуче почати перерозподіляти додаткову вартість наших нових громадян, як ми робили це в первісному осерді, аби захистити революцію (особливо щодо одягу, їжі, житла тощо) й урятувати їх від власного матеріяльного декадансу, чи ж наразі послабити подібні обмеження, щоб полегшити перехід для наших визволених народів.\n\n"Рішення належить ухвалити Секретареві, і його рішення стане волею народу та партії.""
 TYM.60.a: ""Революція не зупиниться заради мішка картоплі.""
 TYM.60.b: ""Можливо, ми можемо дещо послабити нашу політику. Поки що.""

 TYM.61.t: "Інформаційний бюлетень"
 TYM.61.d: "Матвєй Носов здебільшого був неуважною людиною. Друзі не назвали б його дурнем, але мешканці маленького села, де він жив, загалом погоджувалися, що він був дуже, дуже забудькуватим, часом аж до смішного. Тому, коли він раптом почав вчасно приходити на щотижневі партійні збори, культурні заходи й навіть найменші сільські посиденьки, це багатьох зацікавило.\n\nОдного дня Олєґ Марков запитав Матвєя, що спонукало його змінитися. "Я почав писати собі маленькі записки, щоб не забувати, - відповів він, трохи почервонівши, - і вони дуже допомагають". Коли Олєґ попросив показати їх, Матвєй простягнув аркуш паперу. На ньому був докладний перелік усіх подій у селі на наступний тиждень із датою й часом біля кожної. Там навіть були короткі описи, на диво добре написані.\n\n"Слухай, Матвєю, - сказав Олєґ, - а чому б тобі не писати це й для інших? Гадаю, людям було б корисно". Матвєй побачив нагоду застосувати свої здібності й погодився.\n\nНаступного дня половина села знайшла біля своїх домівок або просто на подвір'ях клаптики паперу. На них були похапцем нашкрябані, але докладні списки всіх подій того тижня. Унизу аркуша значилося: "Матвєй Носов, кореспондент".\n\nУпродовж наступних тижнів бюлетень із простого аркуша, який напередодні ввечері писала одна людина, виріс до щонайменше п'яти сторінок, кількох авторів і друку на саморобній машині. Тепер кожну подію висвітлював принаймні один кореспондент - сам Матвєй або доброволець. До кінця першого місяця бюлетень дістав офіційне благословення місцевого партійного органу, який вихваляв його як "доказ того, що робітники здатні самоорганізуватися без капіталістичної тиранії"."
 TYM.61.a: "Оце справжня людина з народу, наш Матвєй!"
 
 TYM.62.t: "Плач художника"
 TYM.62.d: ""Пробачте, товаришу, але, боюся, ви не можете виставляти свої роботи в цій галереї".\n\n"Але чому?! - закричав Ґоґа Іґнатьєв, почервонівши від люті. - Мої роботи популярні серед робітників цієї країни - чому, заради Бога, я не можу показувати їх у цій галереї?!"\n\nПосадовець трохи здригнувся від крику, але не відступив, навіть коли біля галереї почав збиратися натовп. Картини митця, які ще недавно висіли в міській галереї, тепер стояли біля вхідних дверей, загорнуті в тканину.\n\n"Товаришу Іґнатьєв, як давній прихильник партії ви, певно, розумієте нову політику, запроваджену секретарем Каґановічем?"\n\n"Звісно! Але чому прибирають мої картини?"\n\n"Тому що, товаришу, вони зображують непродуктивний спосіб життя пролетаріяту. На ваших картинах люди байдикують: дивляться кіно, вигулюють собак, ходять по крамницях, займаються спортом тощо. Часом малювати таке цілком припустимо, але небезпечно навіювати робітникам цієї країни думку, ніби на них чекають лише розваги й жодної праці, поки вороги стоять біля наших дверей".\n\nПоки посадовець говорив, щелепа Іґнатьєва дедалі нижче відвисала, а розум, здавалося, не міг осягнути всього безумства того, що відбувалося. Коли запала тиша, він запитав: "То що ж мені малювати?"\n\n"Не наша справа вказувати вам, що малювати, товаришу. Ми лише визначаємо, що дозволено малювати заради безпеки робітників. Та я певен, ви щось придумаєте"."
 TYM.62.a: "Цензура для мистецтва - те саме, що лінчування для правосуддя. Іноді вона виправдана."

 TYM.63.t: "Пропаганда словом"
 TYM.63.d: "Секретар Лазар Каґановіч піднявся сходами на другий поверх Виробничого комплексу революційної літератури - найбільшої пропагандистської друкарні Західного Сибіру. За ним тягнувся невеликий почет партійних підлабузників і керівників підприємства. Попереду стояли довгі ряди друкарських машин, які раз у раз штампували ті самі зображення. До кінця дня їх доправлять по всьому Сибіру й далі - товаришам і робітникам усієї Росії.\n\n"Це друкарський цех. Він потребує мінімальної людської участи й дуже ощадливо витрачає чорнило", - сказав керівник, трохи всміхаючись, поки Каґановіч оглядав його роботу. "Це добре", - відповів Каґановіч, крокуючи поміж машин. "Скільки ви виробляєте за день?"\n\n"Від п'ятисот до тисячі, залежно від погоди та інших виробничих чинників".\n\nКерівник підійшов до машини, витягнув пропагандистський плакат і простягнув Каґановічу. "Дуже гарний, якщо дозволите так сказати". На ньому був зображений Каґановіч - значно молодший і привабливіший, усміхнений серед гурту школярів. Унизу значилося: "Уроки Каґановіча для юних піонерів".\n\n"Мушу визнати, - сказав Каґановіч, - він мені дуже подобається"."
 TYM.63.a: ""От би ще збільшити виробництво...""

 TYM.64.t: "Народний націоналізм"
 TYM.64.d: "Трофім працював у Відділі пропаганди й агітації від самого його створення й завжди вірив у його безумовну необхідність для держави та в його працю з поширення серед народу позитивних ідей соціялізму. До недавнього часу.\n\nЗгори надійшла звістка, що голова Каґановіч визначив їхній майбутній напрям. Щоб протистояти дедалі численнішим наклепам і звинуваченням ворогів держави, риторику належало змістити від ідеологічних позицій до підтримки самої держави. До націоналістичних цілей.\n\nЦе стривожило Трофіма. Він знав, що Народна Республіка мусить, просто зобов'язана вистояти, а це вимагало компромісів, про які за інших обставин ніхто б і не думав. Але всьому була межа, а попередні описи нових кампаній, що вже почали потрапляти на його стіл, непокоїли його.\n\nЗначно більшу частину матеріалів присвячували виключно націоналізму, а не соціялізму, і з часом послання першого могло цілком поглинути послання другого. Трофім не хотів цього бачити, адже це було надто близько до принципів нині, на щастя, розгромленої Чорної Ліги.\n\nГірше того, Трофім достеменно знав, що не може нікому сказати ані слова про свої думки. Голова ухвалив рішення, і крапка. Будь-яка дія чи слово супроти нього дорівнювали б сумніву в державі. А судячи з нових кампаній, відтепер за таке каратимуть іще суворіше.\n\nНі, він виконуватиме свої обов'язки, як завжди, і сподіватиметься, що з часом правильна політика й соціялістичні переконання візьмуть гору."
 TYM.64.a: "Тривожна тенденція."

 TYM.65.t: "Особливі подарунки"
 TYM.65.d: "Павєл Новіков чистив стару, зношену гвинтівку Мосіна, коли командир відділення покликав його до себе. Саме по собі це не було чимось незвичним, але Павла занепокоїло прохання залишити гвинтівку на місці зі словами: "Нею займуться пізніше".\n\nЗазвичай Павєл не нервувався, та коли його привели до казарми, де всі його беззбройні товариші сиділи колом на стільцях, такі ж спантеличені, як і він, напруга зросла. Командир відділення підвівся з великою торбою в руці й осудливо подивився на них.\n\n"Товариші, - почав командир низьким, гортанним голосом, від якого Павлу захотілося виструнчитися й стати струнко. - Упродовж усієї служби ви, захисники революції, користувалися тією самою зброєю, що й ваші попередники. Вона добре нам служила, але разом із поступом суспільним мусить іти вперед і поступ матеріяльний".\n\nВін кинув торбу на підлогу посеред кола, і з неї виглянули, здавалося, десятки гвинтівкових стволів. "Це ваша нагорода за захист революції, товариші. Користуйтеся".\n\nПавєл глянув на товаришів - цікавість витіснила нервозність. Тоді він нахилився й витягнув новеньку гвинтівку, на вигляд щойно зі складальної лінії.\n\nІ тут Павєл замислився, чи відкритий сьогодні стрілецький полігон."
 TYM.65.a: "Це моя гвинтівка. Таких багато, але ця - моя."

 TYM.66.t: "Комедія на чотири дії"
 TYM.66.d: ""То що бос хоче, аби ми зробили?"\n\n"Хоче, щоб ми побавилися з різними моделями танків і подивилися, що працює найкраще".\n\n"У чому?"\n\n"У вибухах".\n\n"Е-е, Павле?"\n\n"Так, Владіміре?"\n\n"Хіба спереду на танку не має бути гармати певного калібру?"\n\n"Не за довоєнними кресленнями".\n\n"А що буде, якщо на нього залізе нацист?"\n\n"Ляж на спину й думай про Росію".\n\n"Владе?"\n\n"Так, Павле?"\n\n"Гусениці мають так виглядати?"\n\n"Ти поставив їх догори дриґом, так?"\n\n"Просто замовкни й допоможи зняти".\n\n"Мушу визнати, Владіміре, виглядає непогано".\n\n"Так".\n\n"Товста броня, чорт забирай, за задумом трохи нагадує мені воєнні панцери".\n\n"Так і є, товаришу".\n\n"А ця гармата - чорт забирай, як же весело було б засадити снаряд просто в одного з тих нацистських покидьків".\n\n"Авжеж".\n\n"І ти кажеш, це машина для передової? Вони міцні, але не знаю, чи витримають високоманеврову війну".\n\n"Е, це вже проблема генерала".\n\n"Твоя правда. Хочеш випити?""
 TYM.66.a: ""Авжеж, Павле"."

 TYM.67.t: "Питання доцільности"
 TYM.67.d: "Маршал авіяції Роман Іванов сидів за столом. Перед ним лежали два списки з нескінченними стовпцями й рядками імен, набраних офіційним шрифтом, - без сумніву, творіння якогось дрібного виродка з Департаменту безпеки.\n\nВін зітхнув і потер очі. Проблема здавалася неосяжною, величезною, але в самій своїй основі, якщо розкласти її на найпростіші складники, була цілком простою. Вільні авіатори - номінально соціялістична, але на практиці аполітична організація, яка впродовж двадцяти років робила все можливе, щоб захистити народ Росії від німецьких бомбардувальників, що шматували їхню зламану й побиту країну, - досить мирно влилися до війська. Вони прийняли нову владу як кращу альтернативу анархії, що терзала Росію. Проблема полягала не в їхній компетентності, якої не заперечила б жодна гідна людина. Питання було політичним.\n\nРоман отримав звістку згори: [TYM.GetLeader] та його підлабузники недолюблювали багатьох авіяторів. Не настільки, щоб чистити їх - для цього вони були надто популярні, - але достатньо, щоб не допустити їх до справжньої влади чи впливу в молодих Повітряних силах. Ось і постав вибір: підвищити імена з лівого списку - менш здібних, зате політично безпечніших діячів - чи з правого, тобто Авіяторів, хай там які будуть наслідки. Вибір, вибір.\n\nЗа кілька годин він вирішив..."
 TYM.67.a: "...Авіяторів."
 TYM.67.b: "...підлабузників."

 TYM.68.t: ""
 TYM.68.d: ""
 TYM.68.a: ""

 TYM.69.t: "Спадкоємець бачення..."
 TYM.69.d: "Лазар Каґановіч - революціонер у душі, людина, яка несе полум'я, котре, як усі вважали, загасили бухарінські ревізіоністи й зрадники Батьківщини. Він не раз висловлював свою думку про шлях улюбленої революції, до й після смерти людини, яку можна було врятувати, і щоразу бачив, як найгірші жахіття стають дійсністю. Коли гуни неминуче рушили на їхні землі й роздерли країну на шматки, коли Західноросійська війна зазнала поразки через зрадників у Росії та поза нею, коли його власна держава розвалилася через ревізіоністів і божевільних, будь-яка слабша людина зламалася б або здалася - залишилася б берегти власний уділ і не слухати плачу народу в сибірському вітрі.\n\nТа його це лише переконувало у власній правоті. Чоловік дозволив собі рідкісний смішок. Навіть у найгіршу мить вороги революції не могли зламати його дух.\n\nВони лише раз по раз доводили, що Сталін мав рацію. А тепер йому належало переконати у цьому власний внутрішній кабінет. Він саме застебнув сорочку, коли у двері постукали - безперечно, прийшли супроводити його на нараду в бункері. Поправивши комір і задоволений відображенням у брудному дзеркалі, Каґановіч вирушив назустріч новому року, сповнений такого ж палкого духу, як у день свого народження."
 TYM.69.a: ""Доброго ранку, товаришу Каґановіч"."

 TYM.70.t: "...і його відданий учень"
 TYM.70.d: "У сплюндрованій війною Росії зовнішній вигляд, слід визнати, стоїть чи не на останньому місці для пересічного росіянина: голод, спрага й повсякчасна загроза передчасної смерти панують у думках звичайної людини. Навіть у вищих політичних колах Тюмєні найбільше непокоїло те, чи почує голова саме твій голос серед десятків офіцерів і товаришів різного рангу. Але Хрущов був не простим рядовим Народної Республіки, а протеже самого Каґановіча й очільником власного кола у фракції. Його думку мало хто наважився б висловити вголос, аби не накликати гнів наставника.\n\nІсторія показує, що люди гуртуються навколо того, хто їх захищає й гарантує право не просто виживати, а жити. Що краще забезпечить відданість і прагнення до революції, ніж повний шлунок і почуття безпеки порівняно з реакціонерами за кордоном?\n\nЗвісно, це не означало, що товариш Сталін чи Голова помилялися. Він лише... урівноважував амбіції останнього. Революція не запалить волю виснаженого народу, як не вичавиш води із сухої губки.\nУмившись і поправивши краватку, він вийшов із дому та попрямував до бункера, дивлячись уперед, але пильно дослухаючись, чи не чути німецьких літаків. Зрештою, було б недоречно загинути в такий чудовий і важливий день."
 TYM.70.a: "Бомби - не виправдання для запізнення!"

 TYM.71.t: "Авіятори над Народною Республікою"
 TYM.71.d: "Майстер заводу на своєму робочому місці неподалік Тюмєні вилаявся, коли завила сирена повітряної тривоги. Він знав: як завжди, його завод стане однією з головних цілей налітників. І знав, що, хоч би якої шкоди вони завдали, голова Каґановіч вимагатиме зберегти рівень виробництва. І горе тим, хто не впорається.\n\nДіючи з відпрацьованою вправністю, майстер зупинив лінію й скерував робітників до нещодавно збудованого підземного сховища. Принаймні один плюс від прагнення перенести стільки всього під землю. Якби ж то й увесь завод можна було перенести.\n\nКоли бомби наблизилися, майстер силкувався зберігати спокій перед робітниками. Попри безліч пережитих бомбардувань, він так і не зміг цілком приборкати паніку, що охоплювала його, коли бомби падали зовсім поруч. Гуркіт наростав, і він знав, що ця мить ось-ось настане. Але вона не настала, а шум почав долинати з дивного боку.\n\nОдин чоловік зголосився визирнути назовні. Коли він повернувся, його очі палали, а на обличчі сяяла шалена посмішка. Прибули Авіятори, захопивши бомбардувальники зненацька й змусивши їх розсіятися. В одну мить паніку майстра змінила люта радість, і те саме почуття з'явилося на обличчях інших робітників. Сьогодні німці дізнавалися, що росіяни можуть і будуть давати відсіч. Він не знав, скільки їх загине, пошматованих кулями чи спалених у палаючих літаках, але і він, і решта сподівалися, що багато.\n\nА те, що виробництво не постраждало, було приємним додатком."
 TYM.71.a: "Дар у всіх значеннях цього слова."

 TYM.72.t: "Дисонанс у дискусії"
 TYM.72.d: "Коридорами урядового бункера в Тюмєні котився гамір. З-за дверей порожньої кімнати долинали приглушені голоси двох чоловіків. Раптом двері розчахнулися, й обидва, не припиняючи кричати, увірвалися всередину.\n\n"Та годі, ми вже це обговорювали, Хрущове. Треба зосередитися на війську для майбутньої війни. Економіка важлива, але новий економічний план на кшталт твого нам не допоможе".\n\n"Допоможе в довгостроковій перспективі, Каґановічу, - заперечив Хрущов. - Нова економічна політика пожвавить сільське господарство й цивільну промисловість. Треба розвивати те, що маємо, і підтримувати людей. Саме широкі й сміливі нові плани найбільше допоможуть економіці. Якщо ми підтримаємо цивільну економіку, військова теж піде за нею".\n\n"А, так, цивільна економіка звучить чудово. Певен, бомби над головою чи рейдери на наших кордонах погодилися б із твоєю оцінкою, - саркастично відрубав Каґановіч. - Прокинься, Хрущове, ми воюємо! Нова економічна політика не допоможе, коли нам потрібні гармати й рушниці".\n\n"Як і нарощування війська! - роздратовано відповів Хрущов. - О, звісно, зараз воно, може, й допоможе, але коли все скінчиться, у нас залишиться купа промисловости й робочих рук без жодного діла! До того ж де саме ти зберігатимеш усе це спорядження, щоб його не рознесла якась клята бомба? Армія здорова настільки, наскільки здорові її солдати. Сільське господарство, їжа - це важливо".\n\nОстання відповідь Хрущова лише з новою силою розпалила суперечку. Обидва сперечалися далі, вже подумуючи затягти в дискусію кількох нещасних партійців. Утім, до завершення дебатів було ще далеко."
 TYM.72.a: "Це тривало ще дві години."

 TYM.73.t: "Люті чвари"
 TYM.73.d: "Совєцький бюрократ ішов коридорами урядового бункера. Праворуч із-за зачинених дверей долинали крики - останнім часом цілком звичний звук. На мить зупинившись, він прислухався, щоб зрозуміти тему. "Гм, сільське господарство", - подумав він і рушив далі, не бажаючи втрапити в халепу.\n\n"Знову ці цілинні землі! - Каґановіч роздратовано зітхнув. - Ти так зациклився на своєму проєкті, що вперто ігноруєш реальність. Наші ресурси обмежені. Їх краще розподілити між іншими проблемами". Каґановіч із досади стиснув перенісся.\n\n"А хіба сільське господарство не заслуговує такої уваги? - Хрущов простягнув руку до Каґановіча. - Ці проєкти дадуть їжу й робочі місця, що допоможе добрим людям і в армії, і поза нею. Люди голодують просто зараз, і якісь сільськогосподарські проєкти потрібні неодмінно!" Він звів брову, сподіваючись, що хоч раз у своєму жалюгідному житті переконав упертого колегу.\n\n"А хіба немає кращого способу? Сільськогосподарські реформи мають поліпшити вже наявні землі! До того ж це ризиковано. Врожайність рік у рік коливається". Каґановіч заплющив очі й довго, виснажено зітхнув. "Слухай, я знаю, що сперечаюся з цегляною стіною, але колись ми мусимо домовитися - заради партії".\n\nХрущов опустив плечі й кивнув. Він не любив це визнавати, але цього разу Каґановіч мав рацію. "Гаразд, треба щось обрати. Може, вип'ємо за це, за партію?" Каґановіч не збирався відмовлятися від чарки, та ще до його відповіді Хрущов уже налив дві порції. Обидва підняли чарки й виголосили тост, завершивши напрочуд плідну дискусію."
 TYM.73.a: ""За партію!""

 TYM.74.t: "Шлунок для війни"
 TYM.74.d: "У безлюдному й забутому закутку Західного Сибіру серед полів стояло село з дерев'яних і цегляних хат. Кілька жалюгідних осель були старими реліквіями, де тулилися нещасні люди, давно забуті світом, окрім тих, хто хотів їм зашкодити.\n\nХудий літній чоловік біг селом єдиною ґрунтовою дорогою, що сполучала його із зовнішнім світом. Від маленької дерев'яної сільради він помчав навпростець до невеликої напівзруйнованої чужої хати. Хоч у вікнах не горіло світло, він знав, що потрібна людина сидить усередині без жодного діла.\n\n"Ґоґо, ти бачив цю нову листівку? - запитав він, простягаючи її. - Здається, я знайшов, де заробити, тепер, коли ми втратили господарства".\n\nПропагандистська листівка була від Революційної армії в Тюмєні. Вона вихваляла переваги служби у війську, визволення Росії та служіння революції. Та для Ґоґи найважливішою була перспектива заробітку.\n\nҐоґу переповнювали суперечливі почуття. Це була та сама організація, що забрала його господарство й знищила засоби до існування. Але ж треба було чимось годувати сім'ю, і це давало можливість. Після довгих вагань він вирішив.\n\n"Мабуть, це один із варіянтів, - зітхнув він. - Хоча їх у нас небагато лишилося. Схоже, час шукати вербувальника. Гадаю, ти теж підеш, Колю?"\n\nКоля кивнув, і вони разом вийшли з хати та рушили назад до сільради. Та поверталися вони значно повільніше: обох охопила туга від думки, що, можливо, вони бачать своє село востаннє."
 TYM.74.a: "Відчайдушні часи вимагають відчайдушних заходів."

 TYM.75.t: "Ода старим друзям"
 TYM.75.d: "У розкішній кімнаті бункера важкі дерев'яні меблі оточували чоловіка, який мав керувати Тюмєнню. Та зараз він зовсім не був схожий на спокійного й розважливого совєцького бюрократа, якого можна було очікувати. Лазар Каґановіч ходив кімнатою, відкинувши капелюха, а з чола котилися краплі поту.\n\nКаґановіч незграбно дістався непримітної шафки й витягнув пляшку горілки та дві чарки. Повернувшись до столу, він легко відкоркував пляшку й налив. Одну чарку поставив перед собою, другу - навпроти. Цей ритуал він колись виконував перед зустрічами зі своїм другом Сталіним.\n\nЯк же йому бракувало цієї людини, думав Каґановіч. На людях Сталін часто був грізним і крицевим, але наодинці мав жартівливий бік, який мало хто бачив. Коли вони підривали позиції Бухаріна, він пригадував випадок із метеорологами повітряної служби: Сталін запропонував їм повідомляти протилежний прогноз, щоб підвищити точність.\n\nНа жаль, довелося урвати ці хвилини, інакше він запізнився б на зустріч іще більше. В одну мить чарка перед Каґановічем спорожніла й грюкнула об стіл. Він поспіхом вийшов, лишивши горілку, щоб прибрати її після повернення."
 TYM.75.a: "Друга чарка так і лишилася недоторканою на столі."

 TYM.76.t: "Звична відповідь"
 TYM.76.d: "Темна й похмура ніч нависла над Західною Росією. На маленькому родинному господарстві посеред Тюмєні в полях чекав жнив урожай. Кілька рідкісних свійських тварин мирно спали в хліві. У хаті єдина лампа освітлювала стіл, за яким сидів господар.\n\nЛюдміл сидів з одним аркушем паперу в руках. Цю листівку він підібрав у сусідньому містечку, куди їздив по припаси. Урядова печатка на папері, як він уже знав із досвіду, означала неприємності. Розгорнувши листівку, він побачив черговий геніяльний витвір зі столиці.\n\n"Готуйтеся до наступної великої новації в сільському господарстві! Міністерство сільського господарства оголошує про впровадження колективних господарств, готових до колективізації та рівного розподілу всіх тягарів і винагород між робітниками. Це геніяльне рішення запропонував партійний діяч Нікіта Хрущов. Готуйтеся до майбутнього!"\n\nЯка ж то повна кінська срань, подумав Людміл. Він бачив наслідки колективних господарств, і все завжди закінчувалося неврожаєм та порожніми животами. Не довго думаючи, він викинув листівку з вікна просто в багнюку. Може, хоч на компост згодиться.\n\nТа поміркувавши, Людміл усе ж знайшов у ній дещо корисне. Тепер він принаймні знав заздалегідь, що вилучення зерна поновляться. У думках одразу замиготіли всі місця, де можна сховати збіжжя: під мостинами, у наволочках, посеред лісу - будь-де, де плоди його праці будуть у безпеці."
 TYM.76.a: "Він тривожно спав на купі зерна."

 TYM.77.t: "Випустити пару"
 TYM.77.d: "Ранній захід сонця в Тюмєні перетворив небо на суцільну темряву ще до завершення робочої зміни. У метушні ранніх сутінків Нікіта Хрущов після довгого дня проштовхнувся до свого кабінету. Він скинув пальто й дістався великого шкіряного крісла за столом.\n\nВідкинувшись на спинку, він випустив напругу дня довгим зітханням. Робота й суперечки завжди виснажували й, здавалося, нікуди не вели. У раптовому нападі роздратування Хрущов висунув шухляду столу й обережно дістав невелику дерев'яну коробку.\n\nНа пошарпаній роками світлині усміхався молодий чоловік у військовій формі. Під великою партійною емблемою на його кашкеті виднілися крила совєцького льотчика. Хрущов ледь усміхнувся, тримаючи перед собою фотографію свого сина Лєоніда. Обличчям покотилися сльози.\n\nЯк же йому бракувало хлопчика. Поруч із батьками він завжди був сповнений енергії та дотепности. Коли Лєонід сказав, що піде до авіяції, Хрущов пишався ним. Якби він знав, що син загине у Великій Вітчизняній війні, то, можливо, спробував би його зупинити. Струмок сліз перетворився на потік, а спогади Хрущова - на живу картину минулого.\n\nТа зараз не час було застрягати в минулому. Якби Лєонід був тут, то висміяв би батька за таку поведінку. Зрештою, на нього чекала робота, і він міг виконувати її лише завдяки жертвам молодих людей, подібних до його сина. Його праця не буде марною, хай там як глузують люди довкола. Поклавши світлину назад до коробки, Хрущов витер сльози й щось пробурмотів."
 TYM.77.a: ""Твоя смерть не буде марною"."

 TYM.79.t: "Копати заради перемоги"
 TYM.79.d: "ДЗЕНЬ! Звук кайла, що вдарило об камінь, луною рознісся шахтою. ДЗЕНЬ! Алік витер піт із чола. Робота була виснажливою й невдячною, але приносила шахтареві задоволення. ДЗЕНЬ! Розколовши чергову брилу, Алік зазирнув усередину.\n\n"Чорт, знову нічого!" - розчаровано зітхнув Алік. Він викреслив місце на клаптику паперу, який носив у кишені. Почухавши голову, він постукав олівцем по одній точці. "Спробую ділянку 47. Що ж, іду ще далі в шахту".\n\nЩо глибше він спускався, то розрідженішим ставало повітря й віддаленішою поверхня. У виробці панувала задуха, бо кам'яні стіни тримали тепло всередині. Відкрита державою мідна шахта давала матеріяли для боєприпасів і нескладної електроніки. Алік добре знав це, коли добровільно пішов сюди працювати.\n\nХоч праця була виснажливою, з часом він навчився її цінувати. Він прийшов, бажаючи по-своєму служити країні. Згодом зрозумів: у цій війні всі разом, і кожен мусить виконати свою роль. Його роллю була каторжна праця в шахтах, і він пишався своїм внеском у перемогу.\n\nДіставшись ділянки 47, Алік глибоко вдихнув і знову вдарив по каменю. Спершу порода здавалася такою ж безнадійною, як і в попередньому місці. Але саме тоді, коли він уже хотів здатися, останній удар відкрив багату жилу вздовж стіни. Його обличчя розтяглося в широкій зубатій усмішці. "Джекпот!" - вигукнув він у печеру й упустив кайло."
 TYM.79.a: "Кожен робітник - сам собі солдат."

 TYM.80.t: "У залах пролетаріяту"
 TYM.80.d: "Тюмєнь поринула в неприродний спокій, поки передсвітанкова темрява огортала місто. У приземкуватому багатоквартирному будинку Катя намагалася замкнути двері, плутаючись у ключах. Нове державне житло було дешевим, але до нього треба було звикнути. Нова робота на заводі вимагала раннього початку зміни, а отже, й блукання темним будинком.\n\nПоспішаючи до сходів, Катя раптом у щось врізалася. Біль і розгубленість змінилися роздратуванням, коли вона зрозуміла, що зіткнулася з рідкісною людиною, яка теж не спала о цій годині. Та перш ніж вона встигла накинутися на незнайомця, той обернувся - і виявився солдатом. У Каті похолола кров, і вона квапливо почала затинатися з вибаченнями.\n\n"П-перепрошую, т-товаришу, - запинаючись, промовила Катя. - Я не побачила вас у темряві, сподіваюся, ви не забилися. Скажіть, а що привело вас сюди так рано? До речі, мене звати Катя".\n\nБайдужий вираз солдата змінився щирим занепокоєнням. "Прошу, не треба вибачатися. Наче цей будинок із вічно вимкненим світлом полегшує пересування", - він засміявся із власного жарту. "А що привело сюди вас? І називайте мене Клімєнтом. Я не на службі, тож формальності зайві".\n\nПісля невимушених слів Клімєнта Катя трохи розслабилася. Кілька реплік потому між ними зав'язалася приємна розмова. З'ясувалося, що вони навіть сусіди. Та розмова не могла тривати вічно, й обом довелося попрощатися, щоб не запізнитися. Утім, дорогою на роботу обоє відчували нову рішучість, якої досі їм бракувало."
 TYM.80.a: "Ось заради чого ми працюємо."

 TYM.81.t: "Кінець початку"
 TYM.81.d: "Каґановіч стояв у кабінеті, а позаду чекали двоє помічників. Він поглянув на годинник, очікуючи колегу, повільного, мов черепаха. "П'ять хвилин. Де він може бути?" Щойно Каґановіч пробурмотів ці слова, двері відчинилися й до кімнати ввійшов його соратник Хрущов. Чоловіки усміхнулися один одному, зняли капелюхи й підійшли ближче.\n\nХрущов заговорив із незвичним спокоєм, без гніву чи почуття поразки. "Визнаю, я сумнівався й досі сумніваюся, але погоджене рішення - найкраще для партії та країни. Тепер лише час покаже, чи буде воно успішним". Він прокашлявся й продовжив: "Зрештою, попереду на нас чекають значно більші перешкоди".\n\n"Краще й не скажеш, товаришу, - на обличчі Каґановіча з'явилася ледь помітна посмішка. - Настав час зрадникам довкола нас заплатити - усьому свій час, звісно. Нехай бачення Сталіна принесе процвітання всьому Західному Сибіру, а одного дня й усій Росії!" Посмішка перетворилася на широку усмішку, а крик Каґановіча набув рідкісної веселости.\n\nПідійшовши один до одного, чоловіки міцно потисли руки й швидко обійнялися. Тоді один із помічників подав їм по чарці горілки, щоб відсвяткувати єдність. Та в глибині душі обидва думали, як перевершити суперника й захопити владу, коли все завершиться. Але це справа майбутнього, а нині був час святкування та єдности."
 TYM.81.a: "Майбутньому дістануться трофеї!"

 TYM.101.t: "Необхідні запобіжні заходи"
 TYM.101.d: "Коли годинник пробив дванадцяту, Боріс радісно вийшов із фабрики й бадьоро подався до свого улюбленого місця в Чєлябінську - затишного ресторанчика за рогом, однієї з небагатьох світлих плям у його житті в понівеченій війною Росії. Пельмені, шашлик, борщ - усі страви, якими виснажений робітник сподівався наповнити шлунок.\n\nТа завернувши за ріг, Боріс розгубився: невже він пішов не туди? Ресторан мав бути тут, він уже мав би відчувати запах свіжого шашлику, але перед ним був лише будівельний майданчик...\n\nЙого охопив страх, коли він усе зрозумів. Голодний чоловік повільно підійшов до одного з будівельників, із жахом на обличчі, й пробурмотів кілька слів.\n\n"П-пробачте, пане, ви не знаєте, що сталося з тутешнім рестораном?"\n\n"Оцим?" Він указав на майданчик. "Перепрофілювали. Тепер тут облаштовують бомбосховище за наказом генерального секретаря Каґановіча."\n\nТак Боріс і стояв із сумним обличчям, дивлячись, як одне з небагатьох світлих місць у його житті, де він міг відпочити й помріяти про кращі дні, перепрофілюють задля воєнних потреб країни."
 TYM.101.a: ""І де мені тепер їсти?""
 
 TYM.102.t: "У дорозі"
 TYM.102.d: "Стояв холодний день у сибірських степах, повітря було сухим, і в цій богом забутій пустці майже нічого не було видно. Далеко на обрії проступала невелика колона: солдати в кузовах вантажівок мерзли, тулячись один до одного, щоб зігрітися. Двоє з них розмовляли, не зважаючи вже на третю вибоїну, в яку вскочила їхня машина на розбитій дорозі.\n\n"Ненавиджу це. Сиджу з тобою на цій крижаній лаві, виглядаю якусь 'небезпеку', хоча навкруги нічого немає. Від охорони колони вже хочеться, щоб на нас напали бандити."\n\n"Та замовкнеш ти?" - відповів товариш. "Тільки й робиш, що ниєш, як тут погано, і без кінця торочиш, що краще б у когось постріляв. Це завдання життєво важливе, ми вже близько до Тюмєні. Радій, що комісар тебе не чує, бо інакше тебе б розстріляли."\n\nНевдоволений солдат буркнув і пробурмотів кілька образ. Та перш ніж він устиг знову завести свою пісню, товариш раптом повалив його на дно кузова: вантажівка різко звернула з дороги й зупинилася край гаю. Коли він спробував підвестися, над рівниною пронісся гул, а тоді щось схоже на ревіння звіра. Усі звели очі до неба, де без жодної протидії летіли німецькі літаки. За мить почулося свистіння, що завершилося оглушливим гуркотом.\n\nОдній вантажівці пощастило менше за інші: вона не встигла сховатися в гаю й була рознесена літаками на друзки. Землю вкривали охоплені полум'ям тіла, а кілька солдатів іще були при тямі й марно намагалися загасити вогонь, корчачись від болю.\n\n"Досі хочеш у когось постріляти? Ну ж бо, тигре, вони ще можуть повернутися - стріляй!"\n\nСолдат просто лежав мовчки, не відводячи очей від загиблих товаришів. Наче привида побачив. Усю решту шляху до Тюмєні він не промовив ані слова."
 TYM.102.a: "Примарні вершники в небі."

 TYM.103.t: "Людина зі сталі"
 TYM.103.d: "Генеральний секретар самотньо сидів у кабінеті зі склянкою в руці, згадуючи дні, що минули вже десятиліття тому. До війни, до фашистів, навіть до Союзу. Коли вони були представниками робітників і селян Росії, що гнули спини під гнітючим поглядом царя. Тоді, як і тепер, перемога не була певною. Але боротьбу не плямували фальшиві перемоги, змарновані нагоди й зрада. Вони були списом, що мчав у серце реакції, а думками повсякчас линули до славного майбутнього, яке на них чекало.\n\nКаґановіч підніс склянку до губ і випив горілку, пом'янувши численних товаришів, яких уже ніколи не побачить. Якою юною здавалася революція в ті дні! Якими яскравими були червоні прапори й зорі! Яким трагічним був занепад, що прийшов потім. Зі смертю Сталіна Росія ступила на шлях до загибелі. Та він нічого не міг удіяти: заслання на ту богом забуту посаду в Сибіру позбавило його будь-якого шансу підготувати падіння Бухаріна. Він застряг там і мусив дивитися, як Барбаросса підтверджує кожне його передбачення, як німці трощать неготову армію й утоптують російський народ у багно.\n\nВін грюкнув склянкою об стіл сильніше, ніж хотів, і сам здивувався власній люті. Та навіть це ще не було кінцем. Карбишев і Рокоссовскій, ті зрадницькі виродки, неодмінно мали ще й провернути ніж у рані.\n\nІ все ж нічого не було скінчено. Росія лежала розтрощена, її народ був розділений між різними ідеологіями й системами, що прагнули однієї мети. Це була нагода. Народ іще побачить майбутнє, яке в нього вкрав Бухарін, і саме рука Каґановіча приведе його до заслужених добробуту та свободи.\n\nАле та сама рука розчавить реакцію. Тут не буде місця фашистам та їхнім посіпакам із п'ятої колони. Каґановіч був непохитний: ніщо не матиме права загрожувати соціялізму та пролетарській державі. За ці роки він багато чого навчився, і один урок стояв понад усіма:"
 TYM.103.a: "Довіра - зброя фашиста."

 TYM.104.t: "Суперечливе бачення"
 TYM.104.d: "Нікіта Хрущов важко зітхнув, сідаючи у крісло в своєму кабінеті. Він потер скроню, намагаючись угамувати болісне пульсування. Якщо й був момент, коли Хрущову понад усе хотілося тримати в руці чарку, то саме зараз.\n\nВін щойно повернувся із зустрічі з Каґановічем. Вони говорили про належне поводження з політичними в'язнями - тими 'небажаними' й 'реакційним селянством', яких Каґановіч так ненавидів. Його накази були недвозначними: лише під пильним наглядом революціонера їх можна наставити на правильний шлях, а терор вилікує їхню хибну свідомість.\n\nХрущов, як уже не раз до того, спробував схилити Каґановіча до гуманнішої й менш марнотратної політики. Можливо, сказав він, їм можна запропонувати вибір між військовою службою та каторжною працею, що водночас розв'язало б проблему нестачі робочих рук.\n\nКаґановіч, звісно, відкинув цю пропозицію як неортодоксальну й невідповідну марксістсько-лєнінській думці. Хрущов повернувся до свого кабінету пригнічений. Потребуючи бодай хвилини спокою, він заплющив очі й дозволив собі короткий перепочинок від щоденного жахіття, співучасником якого був.\n\nМожливо, одного дня, дозволив він собі уявити, усе стане гуманнішим. Можливо, марксізм-лєнінізм зможе поліпшувати людське життя, а не обривати його жорстокими промисловими планами. Можливо, подумав він із крихтою дитячої втіхи, його можна буде спрямувати на знищення ворога всього морального - німців. Можливо, терор забудеться, а соціялізм знову постане з попелу розбитої й розтрощеної Росії."
 TYM.104.a: "Одного дня."

 TYM.105.t: "Інший Каґановіч"
 TYM.105.d: "Можна було б чекати, що саме старші брати й сестри матимуть владу над молодшими, та ось Міхаїл Каґановіч був радником свого молодшого брата Лазара, Людини зі сталі. Поки Лазар перебирав документи, наче зовсім не помічаючи старшого брата, Міхаїл мовчки стояв перед своїм начальником, а тоді легким кашлем нагадав про свою присутність. Лазар, здавалося, не помітив.\n\n"Лазарю..." - почав Міхаїл, але його перебили. "На роботі я генеральний секретар", - владним тоном відповів Лазар. Старший брат злегка зціпив зуби, виразно роздратований. "Генеральний секретарю, треба розв'язати проблему німецьких бомбардувань. Не можна й далі дозволяти їм залякувати простий народ і безкарно руйнувати нашу промисловість. Я благаю вас - прошу, почнімо негайно діяти проти фашистської загрози!"\n\nГенеральний секретар і далі дивився на розкладені перед ним документи й недбало відмахнувся від брата. "Так, так, коли ти так кажеш..." - мовив Лазар, і легка похмурість видала в ньому щось схоже на безнадію. Старший брат ледь чутно зітхнув: надія, що молодший брат колись сприйматиме його серйозно, знову трохи згасла, і її жарини слабнули з кожним днем."
 TYM.105.a: "Сімейні справи."

 TYM.106.t: "Меч Республіки"
 TYM.106.d: "'Товариші, товариші, ви - перша лінія оборони проти фашизму! Зі зброєю в руках і серцями, сповненими любові, ви - воїни свободи, від яких тремтять наші вороги!'\n\nІван Конєв на мить зупинився й зробив довгий глибокий вдих. Перед ним стояло щонайменше сто чоловіків у різномастих старих одностроях. Їхні тіла були худими, хоча й помітно міцнішими за тіла цивільних.\n\n'1-ша танкова дивізія - гордість і радість Народної Республіки, товариша Каґановіча й усіх друзів свободи та справедливости!'\n\nКраще б так і було, з гіркотою подумав Конєв. Щоб утримати 1-шу танкову дивізію в боєздатному стані, йому довелося вдатися до кошмарної кількости викручування рук, політичних торгів і домовленостей. Навіть у досконалій пролетарській державі Каґановіча завжди вистачало партійних апаратників, готових обмінюватися послугами заради політичної вигоди - навіть із самим міністром безпеки й командувачем Червоної армії.\n\nРаптом, продовжуючи промову, Конєв почув над собою тихе виття. Тоді інстинкт узяв гору: він закричав 'На землю!' і сам кинувся ниць за кілька кроків звідти. Навколо чоловіки безладно кричали, збагнувши, що за кілька тисяч футів над ними німецький бомбардувальник використовує їх як мішені.\n\nЗгодом, коли підбили втрати, загиблих було семеро, поранених - тридцять, і третина з них лишилася каліками назавжди. Іван Конєв зітхнув і з важким серцем скасував решту промови. Зрештою, бомбардування сказало більше, ніж зміг би він."
 TYM.106.a: "Хто від меча живе."

 TYM.107.t: "Несподівана зустріч"
 TYM.107.d: "Стефан поправився в кріслі, коли вони наближалися до цілі. Політ сюди був серйозним випробуванням для запасу пального його бомбардувальника, та найбільше його непокоїла нудьга цієї подорожі. Усе ставало одноманітним: годинами чекати, доки вони підлетять достатньо близько, скинути боєприпаси, а тоді летіти всю дорогу назад. Він записався до Люфтваффе, гадаючи, що це буде цікавіше за службу в охороні трудового табору в Остланді, але схоже, нудна рутина наздогнала його й у Сибіру. Він уже збирався зітхнути, коли раптом вибухнув радіоефір.\n\nЗенітний вогонь.\n\nВін, правду кажучи, не переймався - принаймні далеко не так, як решта ескадрильї. Кілька застарілих зенітних установок не становили великої загрози для реактивного бомбардувальника й лише робили політ цікавішим. Поки вони трималися вище певної висоти, їх було не дістати. Заспокоєний цією думкою, Стефан визирнув у вікно на решту строю - саме вчасно, щоб побачити, як ракета розносить 'Гортен' ліворуч від нього.\n\n"Scheiße!" - закричав він у мікрофон, мало не заглушивши командира, який наказував розірвати стрій і повертатися на базу.\n\nСтрах скував його, але підготовка взяла гору: він вчепився в керування, намагаючись розвернути літак. Радіо було сповнене криками вмираючих товаришів, а досі нешкідливий гупіт зеніток уже не здавався таким дріб'язковим. Вийти із зони обстрілу вони мали швидко, навіть якщо в росіян були ракети, то ніяк не могли...\n\nДумку Стефана урвав вибух - у літак влучили. Бомбардувальник клюнув носом униз, а прилади повідомили, що двигунам кінець. Він озирнувся, і серце впало в п'яти: там, де мала бути задня третина літака, було лише небо. Земля стрімко наближалася, а усвідомлення власної смертности стискало груди, наче лещата. Втечі не було, порятунку не було. Це був кінець."
 TYM.107.a: ""Ти бачив, Павле? Воно, бляха, вибухнуло!""

 TYM.108.t: "Кинуті вовкам"
 TYM.108.d: "Щоразу, коли Максім писав до місцевого партійного осередку з проханням про належну протиповітряну оборону, він отримував ту саму відповідь: "Ваше село має низький пріоритет. Тюмєнь та інші великі поселення наражаються на більший ризик удару, а тому більше потребують доступних засобів ППО. Будь ласка, наберіться терпіння". Після кожної невдачі односельці намагалися заспокоїти його лагідними запевненнями. Їхнє село таке маленьке, тут немає нічого військово важливого, тож ризик удару невеликий. Навіщо німцям узагалі морочитися?\n\nДивлячись на розтрощені рештки свого господарства, Максім міг лише гірко сміятися з тих спогадів. Жодні банальні заспокійливі слова не могли захистити село від Люфтваффе, коли воно нарешті прийшло по них. Саме як він і передбачав, хоча інші висміювали його параною, вони прилетіли посеред дня. Перша бомба зрівняла із землею будинок Бобрових і вбила всю родину за обідом. Інша знищила його клуню, а ще кілька рознесли будівлі або вирвали величезні кратери на порожніх ділянках поля. Він шістдесят років допомагав будувати цю громаду, і все зникло за одну ніч.\n\nБільшість уцілілих не могла повірити в те, що сталося. "Чому з усіх сіл вони обрали наше? - питала його дружина. - Чому з усіх людей саме ми?" Для Максіма відповідь була очевидною. Можливо, Тюмєнь виявилася їм не до зубів, і вони зігнали злість на слабших цілях. Він не сердився на них: проклинати німців за жорстокість було все одно, що проклинати лисицю за вкрадених курей. Така вже їхня природа. Кров йому кип'ятила бездушна байдужість Партії, яка запевняла, що не шкодує нічого для захисту народу. Можливо, якби Лазар Каґановіч не був так одержимий порятунком власної шкури в Тюмєні, їхнє село вдалося б урятувати."
 TYM.108.a: "Не кожному життю приділяють однакову увагу."

 TYM.109.t: "Пан або пропав"
 TYM.109.d: "Лука озирнувся з дерев'яного воза своєї родини. Позаду їхало ще приблизно шість возів - одні поламаніші чи старіші за інші, але всі служили тій самій меті. У деяких, як у тому, що їхав безпосередньо за ними, були самі жінки й діти, бо їхні чоловіки та батьки загинули, захищаючи село. В інших, як у возі Луки, тулилися цілі великі родини.\n\nЛуці не вірилося, що лише два тижні тому він жив у справжньому будинку, а не в наметі на холодній землі. Він із сумом думав, чи доведеться йому ще хоч раз поспати в ліжку до смерти. За словами батька, Тюмєнь уже була близько - невдовзі вони опиняться в безпеці. Лука в це не надто вірив, але мовчав, боячись розлютити батька.\n\nРаптом він почув у повітрі знайомий гул німецького бомбардувальника. Поглянувши вгору, він побачив удалині ескадрилью в строю - вона скидалася на пташиний ключ.\n\nВін закричав родині, й усі, від діда до онука, здригнулися, коли гуркіт бомбардувальників наблизився. Батько почав кричати на віслюків, і ті зі страху побігли швидше. Лука озирнувся й у глибині душі боявся, що вони вб'ють його та всю його сім'ю.\n\nКілька митей здавалося, що так і буде. Та щойно вони прилетіли, то одразу зникли - але перед тим скинули кілька бомб на караван утікачів. Озирнувшись, Лука побачив, що половина возів позаду була знищена й горіла. Далеко лунали крики. "Батьку, - закричав Лука, - ми мусимо їм допомогти!"\n\nБатько не відповів. Він лише стьобнув віслюків, змусивши їх бігти швидше.\n\n"Це ті виродки там усе влаштували! - почув Лука голос двоюрідного брата поруч. - Вони нічого для нас не зробили, поки люди гинуть!"\n\nІнші, особливо дід із бабою, погодилися. Лука нічого не сказав і лише сподівався, що німці не повернуться."
 TYM.109.a: "Не в тому місці й не в той час."

 TYM.110.t: "Усім не догодиш"
 TYM.110.d: ""Товаришу Каґановічу!"\n\nКаґановіч відірвав погляд від книжки й побачив біля дверей свого кабінету Хрущова з похмурим обличчям.\n\n"Товаришу Хрущов, заходьте, що сталося?"\n\nХрущов увійшов. "Ми щойно отримали повідомлення про знищення сіл - багато з них покидають, іноді цілими юрбами. Сотні, ні, тисячі людей намагаються потрапити до міст."\n\n"Так, це проблема", - сказав Каґановіч, а його думки вже поверталися до книжки. Він намагався говорити якомога співчутливіше, але в душі змирився з цим рішенням ще в мить, коли його ухвалив.\n\n"Ми могли щось зробити. Цього цілком можна було уникнути."\n\n"Боюся, що ні, товаришу Хрущов. Це було важке, але необхідне рішення."\n\n"Їхніх смертей цілком можна було уникнути. Ми могли розмістити в селах додаткові війська та зенітні гармати."\n\n"Ні!" - закричав Каґановіч, не приховуючи гніву. На мить здалося, що Хрущов перелякано здригнувся. "Ми не можемо думати про виживання купки неписьменних селян, товаришу Хрущов. Треба дивитися на загальну картину. Міста більше потребують військового захисту, ніж ці мішки картоплі. Я не ставлюся до таких рішень легковажно, товаришу Хрущов". Він зупинився, даючи отруті в слові 'товаришу' повиснути в повітрі. "Потреби більшости важливіші за потреби меншости - і крапка, товаришу Хрущов. Ви вільні."\n\nЩойно він договорив, Каґановіч повернувся до книжки. Він почув, як Хрущов пішов, похнюплено повертаючись до свого кабінету, наче зламана людина."
 TYM.110.a: "Заради загального блага."

 TYM.111.t: "Маршал-зрадник"
 TYM.111.d: ""І з маршалом можна буде розібратися?"\n\nКонєв кивнув, випроставши спину й завмерши напоготові. Голова Каґановіч кивнув і знову поглянув на справу перед собою. "Із Рокоссовскім треба розібратися якнайшвидше, товаришу Конєв."\n\n"Так, пане", - відповів Конєв. Каґановіч гортав звіт. Конєв пишався ним, хоча справді нового матеріалу там було небагато - новими були лише тактичні та стратегічні плани. Усі інші відомості вже раніше зібрали працівники розвідувального відділу.\n\n"Зрадник заслуговує на смерть зрадника. Ви ж згодні, товаришу Конєв?"\n\n"Так, товаришу голово."\n\n"Він завжди був політично незграбним. Треба було позбутися його за першої ж нагоди."\n\n"Це правда, товаришу голово."\n\n"Коли ми почнемо операцію?"\n\n"Щойно вам буде зручно, товаришу голово. Свєрдловск стане проблемою, але, гадаю, з нею можна впоратися.\n\n"Я хочу, щоб Рокоссовскій постав перед народним трибуналом. Цей виродок зрадив свою країну. Збережіть йому життя. Не хочу, щоб він помер раніше."\n\nКонєв кивнув. "Так, пане, але Рокоссовского не слід недооцінювати. Він видатний генерал, і надмірний поспіх без належного планування створить проблеми."\n\nКаґановіч перестав читати звіт і звів очі на Конєва. "Ви воліли б нічого не робити?"\n\n"Звісно ні, товаришу Каґановіч. Я лише кажу, що не слід квапитися. Операція має розпочатися в належний момент."\n\nКаґановіч знову повернувся до звіту, наче проігнорувавши пораду Конєва."
 TYM.111.a: ""Ви вільні, товаришу.""
 
 TYM.112.t: "Оглядова екскурсія"
 TYM.112.d: ""Мушу визнати, товаришу Хрущов, відновлення цього об'єкта справляє неабияке враження."\n\nГолова Каґановіч і Хрущов прибули на тракторний завод у Чєлябінську лише пів години тому, та обох цілковито захопила його робота. Найбільше їх вразила швидкість відбудови, адже лише три місяці тому завод був повністю знищений.\n\n"Так, голово Каґановіч. Це вражає. Жертви трудового народу не були марними."\n\nКаґановіч кивнув і продовжив іти вздовж проходів. Унизу чоловіки на складальних лініях виконували свою роль у добре налагодженій промисловій машині, майже не помічаючи двох діячів за кілька метрів над ними.\n\n"Одного дня, - закричав Каґановіч, щоб його було чути, - такими стануть усі наші фабрики. Нашу промисловість, зґвалтовану німцями, буде відбудовано й розширено."\n\n"Це правда, голово Каґановіч, але шлях буде важким і для нас, і для пролетаріяту. Доведеться йти на жертви."\n\n"Ні, товаришу Хрущов, жертви треба принести. Буде важко, але лише потом і тяжкою працею можна загоїти шрами, завдані Німеччиною."\n\nХрущов не відповів. Він лише кивнув і далі йшов за Каґановічем заводом."
 TYM.112.a: "Рішення, яке я готовий ухвалити."

 TYM.113.t: "Борги треба сплатити"
 TYM.113.d: ""Константіне Рокоссовскій, вас звинувачують у тяжких злочинах проти народу й робітників Західносибірської Народної Республіки. Що скажете на свій захист?"\n\nСтарий маршал якусь мить мовчав. Від тієї миті, коли він оголосив заколот проти Лазара Каґановіча та його республіки, що занепадала, Рокоссовскій знав: завжди існував шанс, що все завершиться судом над ним і його товаришами за невимовний злочин - спробу захистити народ від зловмисного демагога. Від початку повстання саме ця сцена не раз розігрувалася в його голові, тож він уже мав удосталь часу відрепетирувати відповідь.\n\n"Якщо ви чекаєте, що я впаду навколішки й благатиму про милість, забудьте. Я шкодую лише про одне: що не зможу востаннє плюнути в обличчя тому лисому щуру перед смертю."\n\nМаршал Рокоссовскій сів, а зала суду вибухнула лайкою; серед цього хаосу він зберігав сталевий спокій. Вирок про розстріл, що прозвучав після його виступу, звісно, не здивував його. Результат цього процесу визначили ще багато років тому, і він слугував лише переможним колом для Лазара, якого той так відчайдушно прагнув після довгих років боротьби з Третьою армією.\n\nКоли Лазареві сторожові пси прийшли тягти його на останню зустріч зі смертю, Рокоссовскій міг лише сподіватися, що його товариші уникнуть тієї самої долі. Поки він знав, що побратими-офіцери з Третьої зможуть продовжити його справу хоча б духом, він міг іти в могилу без особливого страху."
 TYM.113.a: "Непокірний до самого кінця."

 TYM.114.t: "Погляд у безодню"
 TYM.114.d: "СПЕЦІАЛЬНИЙ ЗВІТ: ЛИШЕ ДЛЯ ОЧЕЙ ГОЛОВИ\n\nНаші агенти в Омску (офіційно відомому як Сибірська Чорна Ліга) повідомили кураторам про внутрішню боротьбу за владу, яка нині руйнує ієрархію Верховного командування. Поки що інформація нечітка, але підтверджено таке:\n\n1. Генерали, віддані Карбишеву, після його смерти гризуться між собою.\n\n2. Найімовірнішим наступником Карбишева є генерал Дмітрій Язов, відомий протеже покійного генерала.\n\n3. Генерали, відомі як 'Стара гвардія', не люблять Язова з причин, що варіюються від особистих до ідеологічних розбіжностей.\n\n4. Якщо Язов не переможе в боротьбі за владу, Чорна Ліга, найімовірніше, розвалиться, адже вона надто безладна й розколота на фракції, щоб утриматися купи.\n\nНашим агентам у Лізі не вдалося визначити, яка сторона перемагає у внутрішній боротьбі. Рекомендовано збільшити фінансування агентури й кураторів у Лізі та сусідніх державах воєначальників, щоб надалі уникати такої самої нечіткости відомостей."
 TYM.114.a: "Цікаво."

 TYM.115.t: "Кінець Ліги"
 TYM.115.d: "Єлєна Карбишева нервово ковтнула, наближаючись до місця свідка. За якусь мить вона опиниться віч-на-віч із чоловіком, який намагався продовжити справу її батька; тим самим, від кого вона втекла, коли стало зрозуміло, що він прагне лише продовження смерти й страждань, які так довго мучили Росію. Єлєна не знала, що гірше: кривава бійня, якої жадав Язов, чи те, що він чинив це ім'ям її батька.\n\nЩе кілька кроків - і вона нарешті стала перед судом. Язова не довелося довго шукати: його чорний однострій, хоч пошарпаний і брудний, різко вирізнявся поміж усіх інших. На мить вони зустрілися поглядами, а тоді вона перевела очі на аркуш. Навіть відвернувшись, вона й далі відчувала його погляд.\n\n"Мене звати Єлєна. Мій батько, Дмітрій Карбишев, заснував Чорну Лігу. Коли я прибула з ним до Омска, то обманювала себе, вважаючи, що він дбає лише про інтереси Росії та її народу. Через чоловіка, який стоїть перед нами, я можу впевнено сказати: це було неправдою. Під час приходу Язова до влади після смерти мого батька я бачила незліченні звірства проти жителів Омска. Тіла тих, хто наважувався кинути виклик Лізі, лежали на вулицях, а робітники марніли й слабли від нестачі їжі та відпочинку. У їхніх стражданнях я звинувачую лише Дмітрія Язова та його Чорну Лігу."\n\n"Що обвинувачений скаже про ці звинувачення?" - втрутився суддя, коли Єлєна перегорнула сторінку. Цього разу вона не втрималась і поглянула, що відповість Язов. Її серце завмерло. Як вона й підозрювала, він дивився просто на неї.\n\n"Я ні про що не шкодую. Товариш Карбишев знав про необхідні жертви, як знав і я. Зараз ви можете не розуміти, але зрозумієте. І коли цей час настане, буде запізно.""
 TYM.115.a: "Кінець божевіллю."

 TYM.116.t: "Тихе місто"
 TYM.116.d: "Коли солдати Народної Республіки ввійшли до Омска, усіх, від найнижчого призовника до найвищого офіцера, об'єднувало одне почуття - здивування.\n\nСтільки років Омск і Чорна Ліга, що виросла з нього, наче ракова пухлина, були причиною великого занепокоєння. Усі вважали само собою зрозумілим, що хоч перемога й неминуча, будь-який наступ на місто зустріне запеклий опір. Ніхто не сумнівався, що кампанія умиротворення буде жорстокою й тривалою. Ніхто не сподівався взяти місто без бою. Ніхто не очікував побачити його покинутим, а розгалужені оборонні позиції й укріплення - полишеними своїми творцями.\n\nНевдовзі стало ясно, що втеча була цілковитою, а анархія, яка панувала в Лізі після падіння й смерти Язова, повністю знищила її як єдине ціле. З кожного об'єкта винесли все корисне, кожну цінну річ пограбували, а нечисленні мешканці, що залишилися, одразу почали благати бодай про якусь їжу чи припаси, які їм могли або хотіли виділити.\n\nТож щойно перше потрясіння минуло, було швидко видано нові накази. Так, місто тепер було лише оболонкою, але в ньому досі лишалася інфраструктура, завдяки якій воно могло знову стати великим. Згодом воно служитиме Народній Республіці та її об'єднавчим кампаніям.\n\nА ненависного ворога, якого воно так довго приховувало, забудуть. Як він того й заслуговує."
 TYM.116.a: "Чорної Ліги більше немає."

 TYM.117.t: "Під чоботом"
 TYM.117.d: "Вікторія багато разів приходила до книгарні. Пан Лєбєдєв дозволяв їй читати все, що заманеться, навіть якщо вона не могла купити жодної з дорогоцінних книжок. Це було дивовижне місце, яке пов'язувало маленьку дівчинку зі Свєрдловска з великим світом. Вона пізнавала філософські вчення минулого, історії нинішніх і зниклих держав. І навіть учила англійську за кількома книжками, привезеними з Америки.\n\nТепер вона дивилася, як чоловіки в темних сірувато-зелених одностроях виходять із крамниці й несуть книжки до вантажівки на вулиці. Кожен тримав одну чи дві. Усі мали суворі обличчя, і ніхто не дивився на Вікторію. Пан Лєбєдєв благав чоловіка з блискучими ґудзиками на кітелі. Поки що йому вдалося переконати чоловіка, якого Лєбєдєв називав 'лейтенантом', урятувати лише одну книжку.\n\n"Ще раз нагадую, - сказав лейтенант, - якщо вас не влаштовує закон, можете звернутися до місцевого Совєту, а той зв'яжеться зі своїм представником у Партії. Я лише виконую накази."\n\n"Але ж більшість цих книжок - звичайна художня література. Не можна забороняти її законом, вона навіть не критикує Совєцький Союз прямо."\n\n"Ще раз кажу, пане: я не пишу законів. Я їх виконую, а ці книжки тепер заборонені."\n\nБідолашний пан Лєбєдєв дивився, як спорожніла чверть полиць його книгарні. Не всі, та й книжки не знищували. Але десь у глибині душі Вікторія знала, що більше ніколи їх не побачить."
 TYM.117.a: ""За наказом Президії такі літературні твори визнано контрреволюційними...""

 TYM.118.t: "Знову до справи"
 TYM.118.d: "Гупіт чобіт об бруківку, гуркіт танків і героїчні вигуки 'Ура!' - усе це повертало Івана Конєва до щасливіших днів, коли такий тріумфальний грім відлунював Червоною площею. Сьогодні могутня хода й революційне свято котилися над Турою, а Тюмєнь здригалася від пам'яті про Сталіна. Великі червоні знамена старого Союзу й нові синьо-білі прапори Західносибірської Народної Республіки тріпотіли на вітрі; їх підносили вже не ім'ям давно померлого політичного велета, а ім'ям майбутнього володаря Росії - Лазара Каґановіча. Він, звісно, був тут, із Хрущовим і Конєвим обабіч, усміхався й махав радісним натовпам і лавам солдатів; старий був у захваті від відновлення кордонів республіки, що існували до заколоту.\n\nКонєв теж усміхався й махав, але не відчував радости, яка променіла від Каґановіча й Хрущова. Він нічого не сказав обом совєцьким велетам, та ніяк не міг позбутися думки, що такі прилюдні вияви радости передчасні. Так, Західносибірську Народну Республіку відновлено. Так, зроблено дуже багато. Проте попереду було ще стільки справ. Капіталістична діра Златоуст досі гноїлася, а Драгунов і Калашніков і далі постачали зброю ворогам народу. Відступники від соціялізму, воркутинські рабовласники-тюремники, досі батогами заганяли легіони невільників у покору. Війни не скінчилися й ще довго, виснажливо довго не скінчаться. Росії обіцяли соціялізм за будь-яку ціну, і він прийде - кривавий сантиметр за кривавим сантиметром. Конєв про це подбає."
 TYM.118.a: "І все ж він усміхався й махав."

 TYM.119.t: "Краще пізно, ніж ніколи"
 TYM.119.d: "З часом розбомблене село повернулося до якоїсь подоби нормального життя. Хоча кількох міцніших чоловіків убили під час нальоту, вцілілі всіма силами лагодили завдану шкоду й навіть знову зробили придатними для життя кілька зруйнованих будинків. Більшість сприйняла подію як стихійне лихо - невідворотне й таке, в якому нікого не звинуватиш. Лише Максім, який передбачив появу Люфтваффе й марно намагався випросити протиповітряну оборону, не відпускав своєї люті. Приблизно в ту саму пору дня, коли вперше впали бомби, він сидів на ґанку й п'яно згадував власну невдачу та відмову влади втрутитися.\n\nКоли прислані владою ремонтники з'явилися ні сіло ні впало після довгих місяців повного нехтування стражданнями селян, їх зустріли водночас із розгубленістю, полегшенням і образою. Місяці партійної байдужости незбагненним чином змінилися дуже запізнілою пропозицією такої потрібної допомоги. Робітники поводилися чемно, і більшість селян цінувала їхню працелюбність. Але навіть коли село швидко набувало колишнього вигляду, Максім сприймав їхню присутність зовсім інакше.\n\n"Ви нас зрадили! - кричав він щоразу, коли вони проходили повз. - Ви кинули нас помирати, а тепер чекаєте вдячности? Ми могли б усе полагодити самі, але ви відібрали в нас навіть цю гідність." Мало хто тримав у серці стільки самої образи, але ніхто не міг заперечити, що він мав рацію. Партія підвела людей, яких мала захищати, і щоб загоїти залишені нею в громаді шрами, цього буде замало."
 TYM.119.a: "Шлях до прощення буде довгим і важким."

 TYM.120.t: "Великий стрибок уперед"
 TYM.120.d: "Міхаїл очікував, що п'ятирічний план його брата буде довгим, масштабним і надзвичайно докладним. Тепер, поклавши п'ятисотсторінкову книжку на стіл під час зустрічі з головою та Хрущовим, він мусив визнати: план був саме таким і навіть більшим.\n\n"Отже, - промовив Лазар, і його незворушний тон приховував захоплення, яке Міхаїл добре відчував, - що ви думаєте?"\n\nМіхаїл поглянув на Хрущова, а Хрущов - на нього. Якусь мить обидва мовчки чекали, хто заговорить першим, і, на радість Міхаїлу, це змагання виграв він.\n\n"Гадаю, початок добрий. Відбудова нашої промислової бази має бути найпершим пріоритетом, і думаю, ця політика добре прислужиться цій справі."\n\nМіхаїл затамував подих, поки Хрущов розвивав думку й називав деякі проблеми, які Каґановіч здебільшого сприймав напрочуд добре. Можливо, через м'якість, із якою Хрущов подавав критику, а можливо, Каґановіч просто був у надзвичайно доброму гуморі. Та коли настала черга Міхаїла, він зітхнув і вирішив сказати все прямо.\n\n"Голово, боюся, що в цьому питанні мушу не погодитися з товаришем Хрущовим."\n\nЗа десять хвилин, коли Міхаїл завершив свій критичний монолог, його брат кілька митей не казав ані слова й навіть не рухався, наче манекен. Тоді він заговорив.\n\n"Ви навели слушні доводи, товаришу, - сказав Каґановіч, а Міхаїл помітив, як той скрегоче зубами за незворушним обличчям, - але недооцінюєте шкоду, яку політика Бухаріна завдала цій країні. Це покладе край НЕПу в його виродженій формі й розпочне економічний розвиток, потрібний для переходу від соціялізму до комунізму. Боюся, більшість проголосувала проти ваших застережень.""
 TYM.120.a: ""Звісно, голово Каґановіч.""

 TYM.121.t: "Червоний світанок"
 TYM.121.d: "Каґановіч дивився з вікна на вулиці внизу. Ними снували туди-сюди сотні чоловіків і жінок, що поспішали на роботу. Ще кілька місяців тому багато з них були селянами. Тепер, ставши робітниками, вони віддаватимуть свою додаткову працю на будівництво комунізму - те, про що завжди мріяли давні більшовики. Але цього разу ревізіонізм його не спотворить.\n\nВажко було повірити, що менш як рік тому вони були маленькою містом-державою. Щоб опинитися тут, їм довелося битися не на життя, а на смерть. Рівень життя зростав. Промисловість, колись обернена на попіл, тепер централізовано розширювалася на благо кожного. А невдовзі, коли запрацює П'ятирічний план, усе стане ще краще.\n\nВін обернувся й відкрив шафку під письмовим столом. Усередині стояла пляшка вина з грузинських полів. Коба подарував її багато років тому, коли вони вперше зустрілися. Каґановіч беріг її до особливого дня, коли зможе відплатити другові добром за добро.\n\nТепер, коли майбутнє світлішало, а виробничі спроможності народу зростали, час здавався слушним, як ніколи.\n\nВідкинувшись у кріслі, він налив собі вина й підніс келих."
 TYM.121.a: "За товариша Сталіна, чиї ідеали безсумнівно житимуть вічно."
 
 TYM.122.t: "Зростання розколу"
 TYM.122.d: "Усі, хто мав бути присутнім на зустрічі найвищих щаблів Партії в Народній Республіці, звісно, очікували сутички між двома її велетами. Але ніхто не думав, що розбіжності зайшли так далеко або, якщо й думав, що вони проявляться настільки виразно.\n\nТа вони проявилися.\n\nВід самої миті початку зустрічі Лазар Каґановіч і Нікіта Хрущов займали діаметрально протилежні позиції в тлумаченні соціялістичного курсу Республіки. Каґановіч, звісно, завзято й голосно підтримував пропозиції старого бюрократа Сталіна, а Хрущов не хотів про них і чути.\n\nСпроби партійних старійшин різних поглядів примирити їх нічого не дали: кожен чоловік лише дедалі впертіше стояв на своєму. Минали години, а крикливі суперечки дедалі частіше ходили по колу, тож стало ясно, що нічого досягти не вдасться. Зрештою обидва чоловіки грюкнули дверима, вийшовши із зали через протилежні виходи, а ті, хто залишився, гадали, що тепер робити.\n\nВідповіді не знайшлося."
 TYM.122.a: "Дедалі серйозніша проблема."

 TYM.123.t: "Викурювання щурів"
 TYM.123.d: "Стєпан ішов вулицею, знаючи, що це остання прогулянка в його житті. Принаймні як вільної людини. У його кроках відчувалася якась похмура рішучість. Якщо це остання прогулянка, навіщо проводити її в страху?\n\nХоробрість швидко покинула його. Він ішов далі, відчуваючи, як волосся на шиї стає дибки. Наче в обличчя вдарило жаром із доменної печі. Старий бухгалтер, щоправда, мало знався на такій роботі. Але порівняння здавалося влучним, бо пекучі очі НКВД пропалювали його шкіру. Просто на нього вже прямували двоє агентів. Стєпан сотню разів розігрував цю сцену в голові. Один із чоловіків гукне зупинитися. Він послухається, прийме долю з честю та гідністю. Повільно обернеться на підборах з усмішкою на обличчі. Саме так він хотів зустріти свою долю.\n\nАле коли чоловік наказав зупинитися, Стєпан не послухався. Навпаки, його розмірений крок перетворився на панічну втечу. Ноги рухалися дедалі швидше. "Стій!" - знову крикнув агент. Стєпан упустив горнятко чаю й ранкову газету. На бігу злетів і капелюх. Він відчув, як сльози течуть щоками. Зрештою молоді агенти повалили чоловіка середніх років на землю.\n\n"Присягаюся, я був лише бухгалтером! Я тільки підшивав папери!" - благав їх Стєпан, захлинаючись риданнями, шмарклі вже текли з носа у вуса. Чоловіки НКВД не відповідали. Стєпан благав і благав, аж доки один із них не заговорив.\n\n"Ми маємо ваші підписи на кількох документах, власноруч складених Рокоссовскім. Ви були не простим гвинтиком, ви відігравали важливу роль у його контрреволюційному режимі. А тепер замовкніть, ви жалюгідні." У Стєпана все похололо всередині. Звісно, він це знав. Знав, що вони знайдуть. Але лише тепер, коли настав вирішальний момент, зрозумів, якою нікчемною людиною був. Стєпан знав, що охоронці його не врятують, тож натомість почав молитися Богові."
 TYM.123.a: "Молитви мали приблизно такий самий ефект."

 TYM.124.t: "Довга ніч"
 TYM.124.d: "Минала перша година ночі, а Лазар Каґановіч не міг заснути.\n\nВін лежав у ліжку з розплющеними очима, а думки шалено кружляли в голові. Для голови Західносибірської Народної Республіки день був доволі напруженим: Політбюро дедалі сильніше розпадалося через дріб'язкові ідеологічні суперечки. Його власний протеже, Нікіта Хрущов, наче твердо вирішив нав'язати кожному чоловікові, кожній жінці й дитині своє тлумачення революції, а відстань між ними зростала з кожним днем.\n\nКаґановіч перевернувся на бік і почав гризти нігті. Колись Хрущов був йому наче син, то чому ж він так уперто намагався змінити напрям революції, яку Каґановіч так тяжко рятував? Дурні ідеї, які той проголошував на кожній зустрічі, на кшталт демократичного централізму й дозволу на непролетарське культурне самовираження, небезпечно наближалися до бухарінізму - ракової ідеологічної течії, що й довела Совєцький Союз до загибелі. Невже товариш Хрущов цього не розумів?\n\nГолова застогнав, знову перевернувся на спину й нервово почухав підборіддя, коли до його свідомости стали закрадатися темніші думки. Можливо, Хрущов чудово розумів, якої шкоди завдає. Може, все це й було його планом від самого початку?\n\nНі, не може бути! Хрущов був із ним від народження Республіки й стояв поруч, навіть коли навколо почали кружляти зрадники. Чому ж тоді голова Каґановіч ніяк не міг позбутися думки, що віра Хрущова в марксістсько-лєнінсько-сталінську революцію починає хитатися?\n\nМожливо, заради безпеки настав час пильніше за ним наглядати..."
 TYM.124.a: "Краще перестрахуватися..."

 TYM.125.t: "Розмова між друзями"
 TYM.125.d: "...а тоді він сказав: 'Третій зліва - товариш Хрущов!'" Нікіта Хрущов вибухнув хрипким сміхом і втративши самовладання, грюкнув долонею по столу. Його співрозмовник, голова Лазар Каґановіч, здається, не поділяв захвату Хрущова й натомість пильно дивився на друга через стіл. "Лазарю Моісєєвічу, щось не так?"\n\n"Усе гаразд, товаришу, просто сьогодні вранці я дуже втомлений. Ніч була важкою." Говорячи, Каґановіч совав виделкою сніданок по тарілці. Він не з'їв ані шматочка. "Не заперечуєте, якщо я поставлю запитання, товаришу Хрущов?" Хрущов, із повним ротом їжі, швидко кивнув.\n\nКаґановіч поклав виделку й зосередив погляд на Хрущові. "Ви ж розумієте, чого ми тут намагаємося досягти? Що треба зробити, щоб зберегти революцію?"\n\nХрущов підняв брову. "Що це за запитання? Звісно, розумію. Інакше ви не довірили б мені цю посаду."\n\n"Можливо. Ви також знаєте, що одне з головних наших завдань на шляху до цієї мети - раз і назавжди викорінити вплив зрадника Бухаріна, так?"\n\nХрущов на мить замовк. Поступова зміна пози виказувала його дедалі більшу тривогу. "Не розумію, до чого раптом усі ці дивні запитання? Ви... ви сумніваєтеся в моїй вірності справі, товаришу?"\n\nОбличчям голови розлилася усмішка, мабуть, надто тепла, щоб бути щирою. "Та забудьте, товаришу Хрущов. Сьогодні мої думки блукають у всіляких дивних місцях. Змінимо тему, гаразд?""
 TYM.125.a: ""Так, будь ласка.""

 TYM.126.t: "Не спускати очей"
 TYM.126.d: "Лазар Каґановіч тихо вилаявся, слухаючи протяжний гудок у слухавці. Треба було лише послати потрібних людей стежити за Хрущовим і його союзниками, і Лазар нарешті зміг би покласти край своїм сумнівам. "Міністерство внутрішніх справ, маршал Конєв слухає."\n\n"Товаришу маршале! Це Каґановіч. Буду коротким, бо не маю цілого дня на балачки. Мені потрібно, щоб СМЕРШ пильно простежив за кількома... підозрілими людьми."\n\n"Радий чути вас, товаришу голово. Е-е, хіба такими справами не займається НКВД? Можливо, вам варто зателефонувати їм."\n\nКаґановіч зціпив зуби. "Ні, ні! Це делікатна справа, товаришу, і, гадаю, ви єдиний, кому я можу довіряти. За Хрущовим і його друзями треба стежити, і я не хочу ризикувати, якщо в нього є друзі в НКВД, зрозуміло?"\n\n"Товариш Хрущов...? Розумію. Не думаю, що вам є чого боятися-"\n\nГолова грюкнув кулаком у стіну. "Не пригадую, щоб я питав вашої думки! Ви можете це зробити чи ні?!"\n\nЗапала пауза, за якою чулося приглушене шарудіння паперів. "Так, пане. Доручу це найкращим людям. Однак я наполегливо радив би-"\n\n"Добре! Виконуйте, маршале! Чекаю на результати!" Каґановіч кинув слухавку, давши маршалові недвозначну відповідь на його заклик до обережности."
 TYM.126.a: "Тепер ми знатимемо напевно..."

 TYM.127.t: "Вулиці мають очі"
 TYM.127.d: "Ще один довгий робочий день, потім довга дорога додому, а далі довга ніч у спробах збагнути, як саме переконати Каґановіча прийняти бодай частину його пропозицій. Вийшовши з будівлі й рушивши до квартири, Хрущов думав переважно про те, як довго триває його боротьба. Заглиблений у думки, він мало не помітив чоловіків, які йшли слідом.\n\nМало не помітив.\n\nНавмисно звернувши не туди, він почав гарячково міркувати. Їх було двоє; здавалися молодими, але під одягом та окулярами важко було розгледіти риси обличчя. Убивці? Ні, вони трималися надто далеко. Реакціонери чи іноземні агенти неодмінно вбили б його, щоб дестабілізувати режим, тож на кого вони працюють? Хрущов перебирав усі групи, які могли б захотіти шпигувати за ним, кожну менш імовірну за попередню, аж доки не мусив визнати єдиний правдоподібний варіянт.\n\nЦе був Каґановіч.\n\nЦі люди, напевно, працюють на державу. Інакше навіщо їм просто стежити за кожним його кроком? Їх, мабуть, послали перевірити, чи не зустрічається він із можливими змовниками проти Генерального секретаря й Народної Республіки. Він негайно рушив додому найкоротшим шляхом, удаючи, ніби не помічає стеження. Справи кепські. Дуже кепські. Удома буде час обдумати все докладніше, але вже зараз його не полишала одна думка:"
 TYM.127.a: "Це лише початок."

 TYM.128.t: "Стіни мають вуха"
 TYM.128.d: "Фьодор Кулаков уже збирався лягати спати, коли помітив, що лампа на приліжковому столику працює негаразд. Очевидно, лампочка перегоріла.\n\nДістаючи з шафи нову, він, правду кажучи, лише частково зосередився на простому завданні замінити стару лампочку. Думки були значно більше зайняті подіями дня. Як один із ключових членів хрущовської фракції в державі, він постійно мусив вести нескінченні дискусії про те, як найкраще реагувати на чергову ініціятиву Каґановіча. Дискусії, що зазвичай супроводжувалися добірною лайкою.\n\nЩойно стара лампочка вийшла з патрона, Фьодор побачив це й миттю повернувся думками до теперішнього. Вздовж внутрішнього боку абажура тягнувся тонкий дріт, оголений лише тому, що дешева строчка розійшлася, коли він посунув лампу, а на кінці дроту був маленький мікрофон.\n\nВін одразу зрозумів: його встановили прибічники Каґановіча. Хто ж іще? Кому ще він протистояв? Хто ще мав людей, ресурси й бажання стежити за ним, як не вони? Він лише дякував долі, що знайшов пристрій, водночас гарячково пригадуючи, що говорилося в цій кімнаті останнім часом.\n\nНадзвичайно обережно Фьодор відвів руку від мікрофона, докрутив нову лампочку й поставив лампу на місце. Не можна було дати тому, хто слухав на іншому кінці, зрозуміти, що жучок викрито. Якщо вони довідаються, то встановлять інші, а хто знає, чи пощастить йому знову їх знайти?\n\nНі, він залишить усе як є. І пильно стежитиме, щоб уголос звучало лише те, що він хоче дати підслухати. А ще обережно й у людному місці повідомить решті фракції те, що знає.\n\nЗа ними стежать. Пильно."
 TYM.128.a: "Чи знають вони, що я знаю?"

 TYM.129.t: "Фальшива тривога?"
 TYM.129.d: ""То ви нічого не знайшли?"\n\n"На жаль, так, товаришу голово. СМЕРШ уже певний час пильно стежить за Хрущовим і його друзями, ми знаємо все, що він робить: його розпорядок, із ким він говорить і що полюбляє на сніданок. Наскільки можемо судити, нічого лихого він не замишляє."\n\nЛазар Каґановіч на мить утратив дар мови. Після стількох параноїдальних ночей, проведених у роздумах про те, що саме Хрущов робить за зачиненими дверима, маршал Конєв щойно повідомив, що все це було марною витратою сил. Його охопила дивна суміш полегшення й ніяковости. "Розумію. Дякую за допомогу, товаришу маршале. Я повідомлю, якщо ви знову знадобитеся."\n\n"Гаразд, але наступного разу спершу ретельніше обміркуйте можливості. Ресурси Червоної Армії все ж не безмежні. Добраніч."\n\nПоклавши слухавку на стіл, Каґановіч відкинувся назад і тяжко зітхнув. Невже його параноя справді була безпідставною, а Хрущов і справді такий відданий, як каже? Голова зазвичай не любив помилятися, але цього разу охоче зробив би виняток."
 TYM.129.a: "Усе гаразд!"

 TYM.130.t: "Не все гаразд"
 TYM.130.d: ""Навіщо ви затягли нас у таку далечінь, Нікіто Сєрґєєвічу? Я тут до смерти замерзну". Андрєй Ґромико здригався, розтираючи руки в марній спробі зігрітися. Хрущов не міг дорікнути товаришеві за скарги. Однак він знав: очі голови є на кожному розі в кожному місті. Покинута хатина в крижаній сибірській глушині була не надто звичним місцем для обговорення незгоди, але іншого вибору не було.\n\n"Товариші, я знаю, що це місце не найгостинніше для зустрічі, але зрозумійте: те, що я хочу обговорити, не можна казати прилюдно. За останні кілька місяців я усвідомив, що за мною шпигують, і не сумніваюся, що за цим стоїть голова Каґановіч."\n\nФьодор Кулаков схопився з місця. "Ви не один! Нещодавно я знайшов прослуховування в лампі біля ліжка, а товариш Полянскій сказав, що хтось проник до його квартири, нічого не вкравши. Що, до біса, коїться?!"\n\nХрущов зітхнув і схрестив руки. "Гадаю, Лазареві набридли наші заперечення проти його бачення, і він готує чистку."\n\n"Ні, товариш Каґановіч напевно не зважиться на такі крайні заходи? Можливо, це лише велике непорозуміння?" Ґромико затинався, і цього разу не від холоду.\n\n"А навіщо ще він посилає людей стежити за нами й влазити до наших домівок? Він збирає докази, Андрєю! Товариші, я знаю, що ви всі глибоко поважаєте цю людину, але я не сидітиму склавши руки, чекаючи, поки він уб'є нас за фальшивими звинуваченнями. А ви?" В очікуванні відповіді Хрущов чув лише завивання вітру знадвору."
 TYM.130.a: "Відповіддю було гучне "ні"."

 TYM.131.t: "Братня вірність"
 TYM.131.d: ""Прокляття, Міхаїле, невже ти не бачиш? Товариш Лазар утратив зв'язок із реальністю, і невдовзі ти теж опинишся під прицілом!" Нікіта Хрущов грюкнув кулаком по столу, підкреслюючи свої слова. Вони з Фьодором Кулаковим вирішили, можливо, надто оптимістично, що зневажений брат голови подивиться на світ їхніми очима.\n\nМіхаїл Каґановіч похитав головою. "Тоді ти не менш божевільний за нього, якщо думаєш, що мій брат колись наважиться скривдити мене. Не зрозумій мене неправильно, Нікіто, я тобі вірю. Ситуація в Політбюро дуже мене непокоїть, і я не здивуюся, якщо Лазар вдасться до таких... параноїдальних заходів."\n\n"Товаришу, ваш брат нехтував вами за кожної нагоди. Саме через нього ви не можете втілити свої ідеали. Подобається вам це чи ні, але співпраця з нами може бути єдиною нагодою вирватися з-під його влади". Кулаков сподівався, що його слова влучать у ціль краще за хрущовську браваду.\n\n"Пробачте, товариші, але я не можу виступити проти власної родини. Лазар може бути впертим старим віслюком, який не бажає слухати розумних доводів, але я ніколи не пробачу собі, якщо засуджу його, знаючи, що він ніколи не вчинив би так зі мною". Міхаїл сердито підвівся. "Я не розповім про нашу розмову, але вам краще піти. На все добре."\n\nХрущов і Кулаков негайно вибігли з кабінету, не сказавши більше ні слова, й сподівалися, що Міхаїл дотримає обіцянки..."
 TYM.131.a: "Кров не вода."

 TYM.132.t: "План Б"
 TYM.132.d: "Схилити Міхаїла виступити проти Каґановіча не вдалося. Хрущов нервував: щоб зупинити все це божевілля, йому була потрібна більша підтримка. Утім, він мав іще кілька козирів у рукаві й швидко зателефонував. Приблизно за годину маршал Конєв зустрівся з ним біля тихої паркової лавки. Хрущов простягнув руку, але Конєв зупинив його й одразу перейшов до справи.\n\n"Ви хотіли поговорити зі мною, товаришу?"\n\n"Так, товаришу... про товариша Каґановіча."\n\n"Міхаїла? У нього дивні ідеї, але-"\n\n"Ні, Генерального секретаря. Його параноя зростає щодня, треба щось робити."\n\n"Не знаю, товаришу. Такі розмови-"\n\n"Лише подумайте: у вас багато зв'язків. Ви командуєте майже всіма збройними силами, а Генеральний секретар цілком може побачити у вас загрозу."\n\n"Ви кажете, що Генеральний секретар хоче мене позбутися?"\n\n"Ще ні, але в його теперішньому стані це може бути лише питанням часу."\n\nКонєв якусь мить мовчав, а тоді коротко відповів: "Я вас підтримаю", - і рушив до машини, перш ніж Хрущов устиг подякувати."
 TYM.132.a: "Схоже, маршал не любить зайвих балачок."

 TYM.133.t: "Усі фігури на місцях"
 TYM.133.d: "Хрущов зв'язався з усіма, кому міг довіряти, і тепер залишалося лише спланувати переворот. Конєв наказав непомітно провести Хрущова та його союзників до військових казарм у Тюмєні. Каґановіч перебував у Свєрдловску, де проводив раптову інспекцію міської адміністрації. Конєв розклав мапу з маршрутом, яким Генеральний секретар і його кортеж мали повертатися.\n\n"Мої люди влаштують засідку тут, - сказав Конєв, указуючи на місце за п'ятнадцять миль на захід від міста. - Ми перестріляємо охорону, а мої люди витягнуть його й-"\n\n"Стривайте, ми не можемо просто застрелити Генерального секретаря! Усе має виглядати законно, інакше розстріляють нас! - урвав його Кулаков. - Треба водночас надати собі законности й позбутися Каґановіча". Хрущов погоджувально кивнув. Каґановіч був із тих, хто змушував ворогів безслідно зникати; вони мали бути кращими за нього.\n\nҐромико озвався: "А якщо висунути йому звинувачення? Оголосити непридатним до служби й примусити піти у відставку?"\n\n"Мені подобається, - відповів Хрущов. - Ми влаштуємо засідку за планом Конєва, швидко звинуватимо його в кричущій некомпетентності й прилюдно усунемо з посади". Інші погодилися, хоча Конєв і без особливого запалу. Дні Каґановіча на посаді Генерального секретаря були пораховані."
 TYM.133.a: "До справи, товариші!"

 TYM.134.t: "Тюмєнські процеси"
 TYM.134.d: "Коли Лазара Каґановіча та його найближчих союзників ввели до захищеної частини судової зали люди, для яких іще кілька тижнів тому вони були беззаперечними господарями, присутні мовчки спостерігали з галерей.\n\nПісля того як протягом багатьох років вони прирекли стількох інших на таку саму долю, багато хто очікував, що в'язні мовчки просидять слухання, проведене за жорстко контрольованим планом. Але Каґановіч явно не мав жодного наміру дотримуватися цього плану.\n\nЗа кожної нагоди він перебивав державного обвинувача. Ігнорував призначеного державою захисника. Лаяв суддів і чиновників та подбав, щоб усі присутні добре розуміли: він не піде й не може піти тихо. Утім, його сповнені жовчі прокльони на адресу всього процесу блідли проти тих, що призначалися архітекторові його падіння.\n\nНікіта Хрущов і його політика, гучно кричав він, призведуть до краху держави. До повної втрати послідовного соціялістичного курсу. Зосередять владу в його руках на шкоду народові, як він давно стверджував і як довели його арешт та сьогоднішня поява тут.\n\nТак тривало незліченні години, але зрештою, як усі й знали, вистава не мала значення. Суд мав відбутися, і він відбувся. Вирок мав бути визначений наперед, і так воно й було. Довічне ув'язнення в таборі каторжної праці.\n\nЧерез роки уважні спостерігачі згадували вираз обличчя Каґановіча, коли суддя оголосив вирок. Він явно очікував смерти. Політичного мучеництва. Якби вони помінялися місцями, він неодмінно вимагав би для Хрущова саме такої долі. Натомість на нього чекали роки виснаження, протягом яких його дедалі більше забуватимуть. На його думку, це було значно гірше.\n\nЙого крики не стихали, коли його силоміць виводили."
 TYM.134.a: "Але ніхто вже не слухав."

 TYM.135.t: "Нове обличчя революції"
 TYM.135.d: "СТЕНОГРАМА ВИСТУПУ ГОЛОВИ ХРУЩОВА ПЕРЕД ПОЛІТБЮРО\n\n"Товариші, я постав перед вами як бойовий побратим. Не як голова, а як такий самий член партії, як і всі інші.\n\nСаме тому я прокладаю новий курс не лише для нашої партії, але й для нашої країни та нашого народу. Доба політичних репресій проти невинних скінчилася. Доба крайнього політичного деспотизму й одноосібної влади скінчилася. Відтепер соціялізм визначатимуть не накази однієї людини, а новознайдений консенсус членів нашої партії, як і вчив Лєнін.\n\nЦим я не хочу применшити діяння нашого попереднього голови. Багато його рішень я підтримую, як підтримає і більшість із вас. Нашого голову усунули не через практичні розбіжності, а через його душевну нестабільність і неповагу до посади. Він справедливо рівнявся на товариша Сталіна, але захоплення засліпило його перед дійсністю власних учинків: він уважав, що має право робити все, чого забажає.\n\nМи, товариші й друзі соціялізму, ніколи не дозволимо, щоб дії однієї людини підривали нашу відповідальність перед народом і нашим рухом.""
 TYM.135.a: "Новий світанок?"

 TYM.136.t: "Два ідеали, одна революція"
 TYM.136.d: "Для годиться Каґановіч запросив Хрущова до кабінету відсвяткувати. Адже Тюмєнь, маленька держава посеред Західного Сибіру, що не мала нічого, крім волі й рішучости, оточена зрадниками й демагогами, послідовно розправилася зі зрадниками: зрадницьке військо Рокоссовского й божевілля Карбишева були приречені на смітник історії. Що може бути доречнішим, ніж відкоркувати найкращу пляшку з запасів Генерального секретаря й провести приємний вечір із товаришем-протеже?\nТа в повітрі висіла напруга, наче між двома дуелянтами, кожен із яких чекав першого пострілу суперника. Самого Сталіна вже не було серед живих, але він жив у Союзі, й ні для кого не було таємницею, що обидва чоловіки зовсім по-різному розуміли сталінізм.\nГнітючу тишу порушило лише зітхання: Генеральний секретар Союзу нахилився по дві чарки й сам розлив горілку.\n"Знаєте, я наполовину очікував, що прийду сюди з двома офіцерами за спиною".\n"...Не скажу, що не розмірковував про це. Ваші ідеї небезпечно наближаються до поглядів зрадників, які продали б Батьківщину тому, хто більше заплатить."\n"Невже Сталін хотів би, щоб ви зосередили всю цю владу у своїх руках, Каґановічу?"\n\nКаґановіч припинив наливати й без жодного виразу втупився у власне віддзеркалення в чарці. Тиша й напруга затягнулися, а тоді він мовчки закоркував пляшку й грюкнув нею об дерев'яний стіл.\n\n"Союз - це Сталін, Нікіто. Усе, що я зробив, що роблю і що робитиму до кінця життя, має одну мету: не дати згаснути на холодному вітрі тій маленькій жарині, тому ідеалові, народженому з Лєніном, відточеному Сталіним і прожитому нами кожної миті. Світ там жорстокий, і саме ти маєш це знати."\n\nКулаки Нікіти стиснулися, обличчя спохмурніло ще більше, а Каґановіч дивився на нього незворушно.\n"Але ми тут. Ми живі, Союз живий. Це ж щось означає, правда? Ми зайшли так далеко, тож... це напевно щось означає", - закінчив Каґановіч, піднявши одну чарку й залишаючи Нікіті вирішити, чи буде тост.\n\nНа думку спав загиблий син; розпач і горе Єфросінії над порожньою труною, позбавленої навіть останків, які можна було б повернути додому; змучені обличчя полонених; нескінченні тортури в руках Райху...\n\nКаґановіч має рацію. Не годилося чіплятися за розбіжності."
 TYM.136.a: "На здоров'я."

 TYM.137.t: "Змастити колеса промисловости"
 TYM.137.d: "Лазар і Міхаїл сиділи один навпроти одного, вивчаючи документи з економічного планування. Матеріяли були докладні й щільні, але обидва знали, що не підуть, доки не завершать роботу. Проєкти у сфері охорони здоров'я та інфраструктури просувалися порівняно добре, але вони знову зупинилися на питанні, яке, здавалося, розділяло їх у кожній іншій справі.\n\n"Центральне планування - єдиний спосіб індустріялізувати регіон, товаришу, - спокійно сказав Лазар. - З наукового погляду це єдиний спосіб витягти його з прірви."\n\nУ звичній манері Міхаїл спробував обережно заперечити братові. "Це правда. Сибірський план мав чимало вад, і найбільшою була нестача централізованого планування. Але, гадаю, деякі його складники треба використати, щоб зробити систему ефективнішою."\n\nЯкусь мить Міхаїл очікував, що брат розлютиться, почне лаяти Бухаріна й дорікати йому небажанням протистояти економічній катастрофі. Натомість той кивнув. "Деякі децентралізовані місцеві проєкти могли б стати в пригоді - гадаю, усе залежить від обставин."\n\nЙого брат був трохи приголомшений. Раніше він відкинув би це з ідеологічних міркувань. Вони продовжили роботу, обговорюючи загальні засади, які належало докладно опрацювати на наступному засіданні Політбюро."
 TYM.137.a: "Можливо, у компромісу є майбутнє."

 TYM.138.t: "Зібрати уламки"
 TYM.138.d: "Як уже стало тривожно звичним, Нікіта Хрущов і його оточення знову працювали до пізньої ночі, виснажливо переглядаючи записи, цифри й документи економічної політики, що лишилися від уже виправленого режиму Каґановіча. Точніше, ті документи, що вціліли.\n\nПопри неповноту зібраних відомостей, масштаб катастрофи, якої вони щойно уникнули, був очевидним. Економіка, м'яко кажучи, перебувала в цілковитому безладі, й Хрущов та його прибічники дедалі більше доходили висновку: через брак знань будь-яка зміна курсу могла спричинити повну катастрофу через якусь невідому їм практику.\n\nЦе підводило його до неприємного висновку. Кулаков украй неохоче запропонував діяти обережно й поки що продовжити плани та політику Каґановіча щодо індустріялізації держави. Як Хрущов не силкувався, іншого шляху він не бачив.\n\nВін так прагнув запустити власні плани й мріяв виправити помилки Каґановіча. Але вибору не було. Державі понад усе потрібна стабільність, а він зрештою був її розпорядником. Тихо вилаявшись, він узяв ручку й почав писати."
 TYM.138.a: "Дії, продиктовані необхідністю."

 TYM.139.t: "Закрутити гайки"
 TYM.139.d: "Реакція на оголошення Нікіти Хрущова, заховане в черговій довгій промові перед Політбюро, була стриманою. Усі розуміли, що це станеться, і навіть незгодні особисто не наважилися б заперечити.\n\nСеред численних реформ Хрущов чітко висловив намір принаймні тимчасово заборонити прийом нових членів до партії. Звісно, це було цілком необхідно: після такого насильницького переходу влади не можна було знати, хто з кандидатів політично надійний, а політична надійність мала вирішальне значення.\n\nЦе також означало, хоча вголос про це не говорили, що Хрущов контролюватиме майбутнє партійних кадрів загалом. Матиме час і простір визначити, які якості слід зміцнювати. Які погляди підтримувати. Якої відданости вимагати як природного порядку речей. Ніхто зі слухачів не міг чесно сказати, що вчинив би інакше.\n\nЗгодом обмеження, звісно, послаблять, а потім узагалі скасують. Але доти вони ще більше зміцнять контроль нової адміністрації та її керівника над усією державою.\n\nЗвичайно, всі проголосували за пропозицію Хрущова. Адже Бюро мусило демонструвати одностайність у всьому. Інше було просто немислиме. І суперечило партійній єдності."
 TYM.139.a: "Заради блага партії."

 TYM.140.t: "Союз Хрущова"
 TYM.140.d: "Хрущов дивився з вікна партійної штаб-квартири на засніжені дахи й вулиці Тюмєні. Позаду стояли Фьодор Кулаков і Андрєй Ґромико, двоє товаришів, які були поруч із ним у всіх випробуваннях. Каґановіч не мав кому довіряти, а Хрущов знав, що його міністри й після перемоги віддано йтимуть за ним.\n\n"Після зникнення тирана Каґановіча тут навіть стало якось спокійніше", - сказав Кулаков.\n\n"Так, тепер Росія справді дихає, - відповів Хрущов. - Це поворот долі для всього Союзу. Російське суспільство вдихне повітря справжнього соціялізму й нарешті посяде належне йому місце."\n\n"Але ми не можемо повторити помилки Каґановіча, - озвався Ґромико. - Інакше реакція цілком може знову проникнути до партії."\n\n"Я не стану ані другим Каґановічем, ані другим Бухаріним, - заявив Хрущов. - Росія належить нам, товариші, й ми не змарнуємо цієї нагоди.""
 TYM.140.a: "Нагоди принести Союзові досконалу форму комунізму."

 TYM.141.t: "Переосмислений Союз"
 TYM.141.d: "Хто не мріяв об'єднати Росію? Витягти її з прірви, виплекати, знову зробити цілою після всіх жахіть минулого, що розірвали її на шматки? Нікіта, правду кажучи, не міг уявити нікого, хто хотів би залишити все як є, і це його цілком влаштовувало. Коли ожили теле- й радіоприймачі, а по всьому Союзу натовпи вибухнули оваціями й почалися святкування, Нікіта Хрущов на мить глибоко вдихнув.\n\nВін це зробив. Якимось чином саме він. Відверто кажучи, напевно, він сам найбільше в Росії дивувався власному успіху. За короткий час він піднявся службовими щаблями до Генерального секретаря, а тоді став правителем усієї відродженої Росії, переосмисленого Союзу. І вперше за довгий час відчув утому. Після всієї боротьби, змов, війн і поневірянь сьогодні нарешті був день із порожнім розкладом, і ніщо не заважало йому подрімати.\n\nНа дзвінки й вітальні листи можна відповісти згодом; уперше він відчув свій вік. Підіймаючись сходами, він на мить замислився про наступників і майбутнє, а тоді зупинився. Потім. Найпізніше завтра він почне про це думати. Нарешті, ще раз пригадавши вже двічі перевірені звіти й переконавшись, що виконав усе необхідне, він ліг у ліжко.\n\nІ коли Нікіта заплющив очі, то знав: усе, над чим він працював, було саме тим, чого хотів Сталін."
 TYM.141.a: "І вперше за довгий час він не просто заснув - він побачив сон."
 
 TYM.142.t: "Ще одна довга ніч"
 TYM.142.d: "Лазар Каґановіч пильно вдивлявся з ліжка в годинник на тумбочці. Стрілки показували майже другу ночі, але голова був так само бадьорий, як удень. Останнім часом нічні битви з безсонням частішали, а перевертання з боку на бік не допомагало їх скінчити й лише зрідка будило дружину Марію, надзвичайно її дратуючи.\n\nТа думки Лазара були зосереджені не на втрачених годинах цінного сну, а на зовсім інших тривогах. Нещодавно голова переможно завершив боротьбу за контроль над ще однією величезною частиною Росії; таким здобутком напевно можна було пишатися, особливо людині, якій іще стільки треба було довести.\n\nЧому ж тоді Лазар досі почувався... вразливим?\n\nЗовнішні вороги республіки поки що перестали бути проблемою, але що з ворогами всередині? Політичне становище голови Каґановіча здавалося таким самим міцним, як завжди, а політичні суперечки з Хрущовим нібито вдалося мирно владнати навіть після прикрої низки непорозумінь щодо його відданости. Хрущов напевно не був проблемою, то хто ж?\n\nДумки голови мчали дедалі швидше. Хтось у республіці точно мав власні плани щодо революції, що суперечили баченню покійного товариша Сталіна й самого Лазара, але це мусили бути люди, які досі уникали підозр і діяли майже без державного нагляду. Очі Лазара широко розплющилися, коли стрімкий потік думок урешті досяг логічного завершення й прийшло усвідомлення."
 TYM.142.a: "Червона Армія..."

 TYM.143.t: "Шлях до величі"
 TYM.143.d: "Каґановіч під гучні оплески підійшов до трибуни перед Політбюро. Попри показову підтримку політиків, його не полишало гнітюче відчуття, що зрадники, напевно, є навіть тут. Утім, плани вже укладено, і він мусив представити їх Політбюро, хоч яким підступним воно могло бути.\n\n"Товариші! - почав він. - Настав час розпочати план справжнього возз'єднання Росії!" Нові оплески. "Коли Західна Росія приєдналася до революції, час поширити бачення Сталіна на схід. Разом із наближенням возз'єднання Росії наближається й перебудова нового Совєцького Союзу. Сильнішого Совєцького Союзу, що не зігнеться під загрозою фашистських і реакційних сил. Союзу, який вистоїть завдяки залізній волі й рішучості! Наша армія вже сильна, але мусить стати ще сильнішою. Разом із нею має зростати військова промисловість, і лише тоді за Росію буде помщено. Ми не можемо дозволити слабкість, коли німці й реакціонери жадають знову нас знищити!"\n\nКімнату заповнили ще гучніші оплески. "І нарешті, - процідив Каґановіч, - із перебудовою нового Союзу ми мусимо також приборкати реакціонерів на власних землях. Незабаром буде вжито заходів для усунення певних контрреволюційних сил, щоб Союз став сильнішим і безпечнішим. Ворогів соціялізму не терпітимуть ніде, а надто в Росії."\n\nЗавершивши промову, Каґановіч холодним поглядом обвів кімнату, де оплески вже стихли." 
 TYM.143.a: "Боятися мають лише реакціонери."

 TYM.144.t: "Ще п'ять років"
 TYM.144.d: "Коли Нікіта Хрущов і Міхаїл Каґановіч увійшли до кабінету братового останнього, вони знали, що той планує оголосити щось важливе. Щось, над чим особисто працював уже давно. Уся його постава свідчила саме про це.\n\nВони мали рацію. Поглянувши на обох, Лазар Каґановіч підписав адміністративне розпорядження, над яким працював, і жестом запросив їх сісти. Коли вони сіли, він без зайвих слів повідомив, що завершив укладати положення й настанови Другого п'ятирічного плану, та вказав на товсту теку перед ними.\n\nОбидва чоловіки, старші члени партії та безпосередні радники голови, швидко перезирнулися, з напрацьованою швидкістю мешканців коридорів влади авторитарної держави передавши взаємне здивування. Вони знали, що укладати такі настанови безглуздо. Але просто сказати цього не могли.\n\nУрешті запитання поставив Міхаїл, який як брат голови мав певні привілеї. Перший п'ятирічний план, якомога дипломатичніше зазначив він, іще не завершено. Його загальний вплив іще невідомий. Як тоді можна належно визначити цілі другого плану?\n\nНе має значення, пролунала відповідь. Загальні цілі відомі, проголосив голова: поліпшення в усіх галузях, - а отже, план можна накреслити. Незабаром стало зрозуміло, що більше сказати нічого. Рішення ухвалено, й принаймні вони їх не змінять.\n\nТож обоє пішли, спантеличені так само, як і раніше."
 TYM.144.a: "План, безперечно, матиме шалений успіх."

 TYM.145.t: "Його слідами"
 TYM.145.d: "Після падіння царя новий режим узявся перетворювати місто Вятку, знову перейменовану на Риков, за власним образом. Це неминуче означало репресії, але також і будівництво. Величні громадські споруди на просторих площах мали демонструвати силу й славу відновленої совєцької держави. Навколо одного з таких нових творінь, урочисто й гучно відкритого місцевим партійним відділенням, тепер зібрався невеликий натовп цікавих.\n\n"Бачиш, тату? - сказав юнак старшому чоловікові поруч. - На такий проєкт роками не було грошей. Гадаю, це знак. Ми справді знову постаємо з попелу."\n\n"Це кляте страхіття, ось що це таке". Батько злісно плюнув на землю. "Якби цар досі був при владі-"\n\nКілька інших людей у натовпі схвально забурмотіли, але наполегливе шикання сина змусило їх замовкнути. "Думайте, перш ніж говорити, старі дурні! Тепер правила інші."\n\nЗдавалося, про споруду кожен мав власну думку. Для одних вона була символом кращих часів попереду. Інші вважали її образою доброму смаку й виказували невдоволення настільки, наскільки це було політично безпечно. Одна жінка розгублено сказала, що хоч і зберігає теплі спогади про соціялізм, не розуміє, чому просто не поставили Лєніна. Поява кількох нетерплячих на вигляд міліціонерів мовчки розігнала натовп за вітром, і предмети їхнього зацікавлення залишилися самі. Одним була височезна статуя Іосіфа Сталіна, який по-батьківськи дивився на людей з-під вусів. Його руку міцно, у жесті сили й дружби, стискало не менш велетенське зображення самого голови Каґановіча."
 TYM.145.a: "Хтось має завелику думку про себе."

 TYM.146.t: "Краще майбутнє під землею"
 TYM.146.d: "Коли бригаду робітника разом із кількома іншими зняв із відбудови доріг навколо Тюмєні дуже суворий чоловік із Державної безпеки й наказав почати переобладнання одного зі старих дооб'єднавчих бункерів під містом, той неабияк розгубився. Мета дорожніх робіт була очевидною, але тут усе було значно менш зрозумілим.\n\nБригадир, здавалося, знав не більше. Та наряд на роботи мав усі потрібні печатки й дозволи та дуже чітко визначав обов'язки. Тож вони взялися до праці. Об'єкт був у жахливому стані, і, виконуючи доручені завдання, робітник зрозумів: вони фактично знову роблять його придатним до використання. Придатним до життя. Від бригадира він чув, що те саме відбувається в інших бункерах по всьому місту.\n\nРобітник уголос запитав найближчого товариша, навіщо взагалі потрібна така величезна справа, що вимагала й іще вимагатиме неймовірного обсягу праці. Зрештою, держава вже багато років не потребувала таких великих підземних комплексів, а загрозливі кордони, що колись лежали просто за обрієм, тепер були за тисячі кілометрів.\n\nІнший робітник суворо зиркнув на нього, а чоловік із Державної безпеки - ще суворіше. Робітник швидко замовк. Йому платили недостатньо, щоб ризикувати через такі запитання, та й зрештою це не мало значення."
 TYM.146.a: "Такі міркування засекречено."

 TYM.147.t: "Під поглядом голови"
 TYM.147.d: "Фєдір ненавидів ці довбані очі. Вони, здавалося, вкривали кожну стіну, кожну партійну будівлю, кожен автобус, кожну поверхню в усій Тюмєні. Заради Бога, всі й так знали, який вигляд має голова. Не треба було обклеювати ціле кляте місто його пикою. "Іди за товаришем Каґановічем", - закликав один плакат, де сам чоловік стояв серед усміхнених дітей. Він висів просто перед його житловим будинком, щодня застаючи своєю банальністю зненацька на початку дороги на роботу.\n\nДеякі друзі Фєдіра хитали головами й казали, що він просто дратівливий. Партієць попередив, що з таким ставленням він заробить квиток в один кінець до Арктики. Та Фєдір не вважав себе нерозважливим. На його думку, цілком природно дратуватися на лисіючого деспота, якому конче треба розповісти всім про власну велич. Щодня дорогою до будівельного майданчика він мучився через Каґановічів, кількість яких зростала за експонентою. Сьогодні з'явився новий плакат, наліплений поверх гарного муралу. На ньому голова люто стискав штурвал, а напис угорі проголошував: "Росія без Комуністичної партії - як корабель без керманича!" Фєдір мав кілька влучних слів про те, куди партія веде Росію, але стримався й натомість кинув спопеляючий погляд у байдужі очі на плакаті.\n\nДорогою сотні пар очей голови, здавалося, свердлили його душу, але він нарешті дістався майданчика. Щойно він полегшено зітхнув, у поле зору потрапило дещо, від чого він мало не закричав від обурення. На стіні щойно добудованого вокзалу глузливо висів найбільший плакат, який він будь-коли бачив."
 TYM.147.a: "Самозакоханий покидьок!"

 TYM.148.t: "Велика чистка"
 TYM.148.d: "У суворому житті призовника сон був єдиною втечею рядового від виснажливої служби. Удень він без кінця муштрувався, готуючись до ворога, який міг ніколи не прийти. Уві сні він безтілесно ширяв рідним селом і бачив батьків та давніх друзів. Цей сон нічим не відрізнявся. Він підплив до коханої дитинства й відкрив рота, щоб заговорити до неї. Та замість слів пролунав уривчастий тріск стрілянини, й він різко прокинувся на нарах.\n\nІ справді, за кілька кімнат звідси хтось стріляв. На них напали? Тут, далеко від ворожої території, де солдатів муштрували мало не до смерти лише для того, щоб чимось зайняти? Це просто не мало сенсу. Решта чоловіків у казармі вже прокинулися й тривожно тинялися навколо, спантеличені ситуацією та відсутністю наказів. Ширилися чутки про громадянську війну, закулісну реакцію, замах та інші жахливі можливості. Усі розмови враз урвалися, коли знадвору долинув голос чоловіка з мегафоном.\n\n"Товариші, зберігайте спокій. На вас не напали. НКВД отримав повідомлення про державну зраду в цьому місці, й один із підозрюваних відкрив вогонь. Залишайтеся в казармах. Ситуація нормальна". Тривога розвіялася, поступившись раптовому пожвавленню: юрби чоловіків кинулися до вікон. Визирнувши, рядовий побачив, як група незнайомців у формі НКВД веде в кайданках кількох людей. Упізнавши їх, він завмер. До фургона таємної поліції запихали не кого іншого, як його командирів."
 TYM.148.a: "А що сталося з порядком підпорядкування?"

 TYM.149.t: "Заради блага народу"
 TYM.149.d: ""Заощадиш нам трохи часу? Відмовою зізнаватися ти нічого не досягнеш."\n\nОфіцер НКВД говорив тихо, але його голос, здавалося, відбивався від стін тісної кімнати для допитів. Єдина лампочка, що непевно звисала зі стелі, давала все світло, а дим від офіцерової цигарки заповнив увесь простір. Чоловік, до якого він звертався, досі в однострої Червоної Армії, сидів із зав'язаними очима на стільці посеред кімнати й задихався від кашлю. "Але я, бляха, нічого не зробив! Коли голова Каґановіч про це почує, то знесе тобі голову, я подбаю!"\n\nСлідчий зареготав від такого припущення й мусив спертися об стіну. "А хто, по-твоєму, віддав наказ?" - запитав він, витираючи сльозу. Та веселощі зникли так само швидко, як з'явилися. "Люди пам'ятають зустрічі зі мною, товаришу генерале, і зовсім не з доброго боку. Якщо не хочеш, щоб я вирізав сувенір на твоєму тілі, негайно розкажеш, як зрадив совєцький народ!"\n\nЗа видовищем спостерігала пара офіцерів, що стояли на варті біля дверей. Вони намагалися зберігати безсторонність, але обоє були явно стривожені. "Якове, - прошепотів один другому, - хіба це не занадто? Він же генерал!"\n\n"Голова напевно має причини, про які ми можемо лише здогадуватися". Невпевненість у голосі Якова виказувала його сумніви. "Безпечніше нічого не питати". Допит тривав годинами, і навіть серед криків генерал не визнав жодного проступку. З кожним запереченням вартові дедалі більше сумнівалися у справедливості свого завдання, але страх не давав їм відступити від наказу бодай на сантиметр."
 TYM.149.a: "Жорстока машина, яку живить страх."

 TYM.150.t: "Нова кров"
 TYM.150.d: "Гладко виголене обличчя, гострі очі й перлинно-білі зуби прикрашали Ґєлія, коли він дивився на власне віддзеркалення у дзеркалі. Груди сповнювала гордість від нового однострою, що засвідчував його злет від сержанта до полковника. Хтось здивувався б такому стрімкому просуванню, але що вони знали? Молодий офіцер служив бездоганно й за останні роки проявив себе здібним солдатом. Вони напевно заздрили, інакше й бути не могло!\n\nТа попри всі самозаспокоєння на задвірках свідомости роїлися думки, породжені шепотом рядових солдатів: деякі старші офіцери, навіть генерали, під командуванням яких служив полковник, зникли, наче ніколи не існували. Казали, що їх забрали серед ночі похмурі тіні в шкіряних одностроях, і більше їх ніхто не бачив.\n\nМожливо, його підвищили не за заслуги, а тому, що вище начальство вважало його слухняним? Якщо подумати, інших молодих офіцерів, схожих на нього, нещодавно теж підвищили...\n\nЦе була лише думка, та її вистачило, щоб він зблід, а усмішка зникла. Він мовчки дійшов висновку: на деякі запитання краще не знати відповіді."
 TYM.150.a: "Блаженні невігласи..."

 TYM.151.t: "Навчання на робочому місці"
 TYM.151.d: "Запах клею та стукіт крейди по чорній дошці добре знайомі дітям, змушеним терпіти і те, й інше п'ять днів на тиждень, на муку малим шибеникам. Та сьогодні настав день, який зазвичай побачиш хіба в гарячковому сні: діти стояли біля заводських конвеєрів, а їхні батьки сиділи на холодних дерев'яних стільцях, не зводячи очей із чужинських знаків на дошці, хоча з напливом нудьги зосередженість поступово згасала.\n\n"Тепер візьмімо слово 'товариш': ТО-ВА-РИШ", - літня жінка, яка була вчителькою, написала на дошці, так сильно натискаючи на крейду, ніби хотіла посилити слухові муки нових учнів. "Усі ви знаєте це слово, але не можете його прочитати чи написати. Сьогодні це зміниться завдяки складовому методу читання. Хтось знає, що таке склад?" - запитала вона.\n\n"То часом не щось їстівне?" - відповів грубий на вигляд робітник, піднявши руку. Учителька недовірливо похитала головою й знову почала писати на дошці, вкотре сильно натискаючи на крейду."
 TYM.151.a: "Склад - це..."
 
 TYM.152.t: "Зробити омлет"
 TYM.152.d: ""Це неприйнятно! Ми що, маємо просто схилятися й коритися кожній його примсі?!"\n\n"Залежить від того, чи хочемо ми зберегти голови на плечах."\n\nҐлухов обурено загарчав на відповідь колеги: "Боягуз! Ви всі надто обісралися, щоб висловити думку про божевільну політику Каґановіча!"\n\nВін обвів поглядом колег із Політбюро, але ніхто не подивився у відповідь. Старий державний діяч вийшов із кімнати, бурмочучи прокльони.\n\nДержавний діяч Ґлухов був одним із найвідвертіших членів Політбюро, не боявся висловлювати невдоволення політикою Генерального секретаря й відомий був неприязню до пасивности Політбюро перед нею. Коли він вийшов на вулиці Тюмєні, гнів ослаб, але не зник. "Чому вони дозволяють цьому тоталітарному божевільному робити все, що заманеться? - подумав він. - Товариш Лєнін перевернувся б у могилі, якби побачив божевілля Каґановіча."\n\nВін зціпив зуби, дивлячись, як сонце сідає над містом і дедалі ближче підступає ніч. Совєцький політик зітхнув: тепер не було сенсу кипіти через чужу боягузливість. Незабаром він буде вдома й їстиме борщ, який приготувала любляча дружина Софія. Від цієї думки обличчя трохи проясніло. "Принаймні цей день не скінчиться погано-"\n\n"Він тут, хапайте!"\n\nПерш ніж Ґлухов устиг зреагувати, кілька чоловіків у темно-коричневих одностроях оточили старого, накинули мішок йому на голову й скрутили руки кількома парами дужих долонь.\n\n"Хто ви, бляха, такі?! Я член Політбюро, відпустіть мене!" - гаркнув Ґлухов.\n\n"Товаришу Ґлухов, вас звинувачують у зраді та змові проти Генерального секретаря Каґановіча", - відповіла одна з похмурих постатей. Лише тоді старий совєцький політик зрозумів, чого боялися його колеги.\n\nТієї ночі Софія віддано чекала на нього, поставивши на обідній стіл тарілку борщу. Наступного дня колеги помітять зникнення свого крикливого товариша й удаватимуть, наче його ніколи не існувало."
 TYM.152.a: "Незнання - блаженство."

 TYM.153.t: "Очі на кожному розі"
 TYM.153.d: "Розмова між двома чоловіками, чиновниками середньої ланки в адміністрації Каґановіча, почалася доволі легковажно. Вона також дуже швидко й тривожно скінчилася.\n\nУсе почалося з жарту, тихо розказаного одним другому, що мав пояснити дедалі суворіші обмеження, в яких останнім часом вони мусили працювати. Щотижня, здавалося, з'являлося нове правило. Нова вимога, якої слід дотримуватися. Нова неодмінна ознака кожного їхнього рішення.\n\nОбидва швидко погодилися, що помічені зміни були наслідком політики Каґановіча. Цей чоловік ставав дедалі тоталітарнішим навіть за мірками авторитаризму, завжди притаманного державі. Жоден не був достатньо сміливим, щоб припустити можливість "виправлення", але в оцінці вони зійшлися.\n\nРозмову перервали двоє інших у непримітному, але міцному одязі. Вони підійшли до співрозмовників і почали розпитувати про зміст діялогу. Особливо їх цікавив напрям розмови про Каґановіча, чиє ім'я вони почули.\n\nУсе життя проживши в Росії, чоловіки одразу зрозуміли, що новоприбулі були співробітниками Державної безпеки. І знали, що тепер треба мовчати. Знали, що треба запевнити їх у відданості режимові загалом і голові Каґановічу зокрема. Знали, що зрештою їм дозволять піти. Але також знали, що за ними стежать. І що їхні імена записано.\n\nБільше розмов не буде."
 TYM.153.a: "Завжди слухають."

 TYM.154.t: "Сталева воля"
 TYM.154.d: "Звершилося. Революцію захищено, і майбутнє Росії лежить перед нею. Контрреволюційні сили переможено всюди, де вони поставали, а бачення Сталіна для Росії близьке як ніколи. Це був великий тріюмф російського народу, та Каґановіч усе одно відчував неспокій.\n\nСхід. Ось у чому річ. Західну Росію, можливо, очищено від реакціонерів, але схід і досі був гнійною ямою зрадників сталінського бачення. Вони прагнули знову зламати дух російського народу й іще на кілька років відкласти неминучу революцію пролетаріяту.\n\nЙого східні товариші страждають, але вже недовго. Червона Армія готова раз і назавжди визволити країну. Робітник більше не страждатиме під чоботом капіталіста, реакціонера, свині з п'ятої колони. Ні, Каґановіч тримав ключ до майбутнього Росії, вільного від болю її минувшини.\n\nЗавтра може бути світлим, але лише крізь темряву сьогодення. Проллється кров, більше, ніж Росія бачила від часів Західноросійської війни. Це трагічно, це марнотратство, і це необхідно. Каґановіч не міг віддати російський народ до рук контрреволюціонерів, а ті боротимуться проти справжнього соціялізму до останнього подиху. Його засмучувала потреба проливати ще більше крови, але Людина зі сталі не відступала перед труднощами.\n\nХоч якою буде ціна, майбутнє треба забезпечити. Ніщо не повинно стояти на шляху соціялізму й революції. Солдати Каґановіча готувалися до смерти, а він готував накази, дозволивши собі одну-єдину сльозу за тими, хто муситиме загинути в ім'я свободи."
 TYM.154.a: "Смерть однієї людини - трагедія..."

 TYM.155.t: "Ідеальна домовленість"
 TYM.155.d: "Калашніков постукував пальцями по чашці чаю в руці. Усе його тіло тремтіло, але тьмяне освітлення лабораторії допомагало приховати жалюгідний стан. Нарешті двері підвалу розчахнулися, й увійшов Міхаїл Каґановіч. Було зрозуміло, що він дістався сюди таємно: пальто промокло, а з капелюха вода лилася, мов із фонтана.\n\n"Ну? Ви їх перевірили?" - запитав Калашніков.\n\nМіхаїл сів. "Мої можливості дуже обмежені. Брат не довіряє мені політичних в'язнів, але я маю друзів у підземеллях. Віктор у безпеці, його добре годують."\n\nКалашніков полегшено зітхнув. "А Драґунов?"\n\nМіхаїл опустив очі. "Учора його розстріляли."\n\n"Покидьки!" - Калашніков болісно скрикнув. Він знав Драґунова стільки років... разом вони створювали дивовижні винаходи... а тепер труп його друга, напевно, лежав у якійсь канаві.\n\n"Заспокойтеся, друже, - сказав Міхаїл, дістаючи щось із сумки. - Йому не запропонували те саме, що вам". Брат голови витягнув буханець свіжого хліба, рідкісну розкіш у цьому вогкому місці.\n\nКалашніков узяв його, відчуваючи тепло їжі. "Не знаю, скільки ще витримаю. Вони вимагають, щоб я винайшов гвинтівки, яких не можуть створити навіть американці. Як мені зберегти дітей живими?"\n\n"Я знову спробую поговорити з Лазарем, - сказав Міхаїл. - Не хвилюйтеся. Я змушу його дослухатися до розуму". Обоє сиділи глибоко під землею, кожен міркуючи про негаразди власної родини."
 TYM.155.a: "Але нічого не змінилося."

 TYM.156.t: "У тіні велетнів"
 TYM.156.d: "Лазар дивився крізь замерзле вікно на обрій, на нові фабрики, що викидали нескінченні клуби диму. Унизу безперервний потік робітників метушився над своїми завданнями. Він пригадав мурашник, який колись бачив у молодості. Упорядкований, досконалий, усе на своїх місцях. І до біса близький до невразливости.\n\n"Брате, - Міхаїл увійшов до кабінету, - чому я щойно бачив, як поїзд, повний робітників, від'їхав?"\n\nЛазар не ворухнувся. Його очі метнулися до протилежного кінця двору, де висіла величезна таблиця з історією соціялізму.\n\n"Прокляття, Лазарю! - Міхаїл тупнув ногою. - Сьогодні неділя, заводські норми мають бути мінімальними!"\n\nКаґановіч зітхнув. "Учора Тюмєнський металургійний завод не виконав норму. Тепер вони працюють у дві зміни". Він повернувся до брата. "Хіба ти не маєш бути на кремації Калашнікова?"\n\n"Так", - виплюнув Міхаїл. "Прощавай, брате". Він пішов через двір, пройшовши під таблицею. На мить зупинився подивитися: витвір був прекрасним, із зображеннями Маркса, Лєніна, Сталіна... Лазара. "Наша справа шляхетна, - намагався він себе переконати. - Це... усе це того варте". Міхаїл рушив далі, повз юрби робітників, крізь густий сніг, до залізничної станції..."
 TYM.156.a: "Із кабінету Каґановіч знову перевів погляд на роботу."

 TYM.157.t: "На плечах велетнів"
 TYM.157.d: ""І на честь здобутків совєцького пролетаріяту я оголошую Робітничий меморіял відкритим!" - проголосив Міхаїл і перерізав стрічку. Натовп вибухнув оваціями, підкидаючи капелюхи в повітря. Неподалік солдати грали старий гімн, а на стоянку під'їхали вантажівки з додатковими пайками. Робітники бронетанкового заводу імені Конєва оточили машини, тягнучись по морозиво, рідкісний товар у пустці.\n\nІз натовпу вийшов Хрущов. "Міхаїле!" Чоловіки потиснули руки й повернулися до меморіялу. Він був доволі скромним: кам'яна скульптура на всю ширину заводу з робітниками й робітницями, що тримали Молот і Серп. Але для тих, хто пережив анархію, ця споруда була епохальним досягненням.\n\n"А де голова? - запитав Хрущов. - Він ніколи не запізнюється!"\n\n"Лазар не прийде, - тихо відповів Міхаїл. - Сказав, що має роботу."\n\n"Але ж він замовив цей пам'ятник!" - сказав Хрущов.\n\nМіхаїл нічого не відповів і перевів погляд на темні хмари вгорі. "Знаєш, Нікіто, - зітхнув він після довгої паузи, - я хвилююся за нього. Лазар їсть дедалі менше. Цього тижня я взагалі не бачив, щоб він спав". Міхаїл подивився Хрущову в очі. "Та найгірше...""
 TYM.157.a: ""Гадаю, він плете змову проти мене"."

 TYM.158.t: "Останній подих Третьої" #Needs new one
 TYM.158.d: "Кожен, хто бував у кабінеті Лазара Каґановіча, знає: це взірець чистоти. У цілковито мінімалістичній кімнаті є лише голова, його стіл, стілець і шафа. Єдине звуконепроникне вікно виходить у двір. Ті, хто заходить, не можуть не дивуватися: Каґановіч, один із наймогутніших людей Росії, працює й живе без затишку та розваг.\n\nОднак колись рівновага всього порушується. Після завоювання Свєрдловска до кабінету голови без попередження вдерлася група генералів, офіцерів і червоногвардійців, тягнучи найбільший трофей: маршала Рокоссовского. Від колишньої людини лишилася сама оболонка: закривавлений, побитий, зі свіжим шрамом на обличчі. Офіцери кинули його на підлогу, ганьбили його справу й закликали голову негайно виголосити промову.\n\n"Я відмовляюся зізнаватися, я чинив спра-" - забелькотів Рокоссовскій, але його голос потонув у святкуванні офіцерів. "Ану тихо, прокляття!" Каґановіч грюкнув кулаком по столу, і в кімнаті запала тиша. Усі погляди звернулися до нього. Незручну паузу порушив сам голова. "Не заважайте мені працювати! - він указав на Рокоссовского. - І заберіть його звідси, він мені підлогу кров'ю забруднює!"\n\nМовчки, але швидко офіцери винесли маршала у двір, де його та решту зрадників мали розстріляти."
 TYM.158.a: "А Каґановіч не дивитиметься, бо має важливіші справи."

 TYM.159.t: "Невдалий суд" #Needs new one
 TYM.159.d: "Брязкіт ключів розбудив Дмітрія. Голова невпинно боліла, а він силкувався пригадати подробиці минулої ночі. Зринали короткі картини: перестрілки на вулицях Омска, тіла, що падали навколо, червоногвардійці, які вривалися до бункера...\n\nЗалізні двері розчахнулися, й увійшов вартовий. Камера була поділена навпіл: Язов сидів на брудній підлозі в одній частині, прикутий до цегляної стіни. Скляна перегородка давала вартовому оглядати Язова, не розмовляючи з ним. Чоловік підсунув стілець, сів і порожнім поглядом мовчки втупився в Язова.\n\nМинали хвилини, але нічого не відбувалося. Очі Дмітрія не відривалися від дверей: будь-якої миті мав увійти підлий Лазар Каґановіч, безсумнівно, зловтішаючись перемогою. У думках Дмітрій квапливо складав промову. Він лишатиметься непокірним, холодним. Чорна Ліга могла програти війну, але він не дозволить Каґановічу зламати свою гордість.\n\nМинула година, та ніхто не прийшов. Думки Дмітрія заблукали в глибинах свідомости, де він звинувачував офіцерів у програші Суду ще до його початку. Раптом скляна перегородка розсунулася, і вартовий ступив уперед із пістолетом та... телефоном? Дмітрій поглянув на нього з усією ненавистю, на яку був здатен.\n\n"Так, товаришу", - сказав вартовий у слухавку. Він прицілився в Язова й вистрілив. Колишній воєначальник бездиханно впав на холодну цегляну підлогу, востаннє думаючи, наскільки ж він був нікчемним, якщо йому не дали навіть люб'язности поглянути в обличчя вбивці."
 TYM.159.a: ""Прокляття! Я забруднив однострій кров'ю!""

 TYM.160.t: "Тихе місто"
 TYM.160.d: "Коли солдати Народної Республіки входили до Омска, всі, від найнижчого призовника до найстаршого офіцера, поділяли одне почуття: здивування.\n\nПротягом стількох років Омск і Чорна Ліга, що розрослася з нього, наче рак, викликали величезне занепокоєння. Усі сприймали як належне, що попри неминучість перемоги будь-яке просування до міста зустріне лютий опір. Ніхто не сумнівався, що кампанія з умиротворення буде жорстокою й довгою. Ніхто не очікував узяти місто без бою. Ніхто не очікував побачити його покинутим разом із розгалуженими оборонними позиціями й укріпленнями, залишеними їхніми творцями.\n\nНезабаром стало зрозуміло, що покинули геть усе, а анархія, яка панувала в Лізі після падіння й смерти Язова, цілковито знищила її як єдине ціле. З кожного об'єкта винесли все корисне, усі цінності розграбували, а нечисленні мешканці, що залишилися, поспішили благати про будь-яку їжу чи припаси, які їм могли або хотіли віддати.\n\nТож коли шок минув, швидко надійшли нові накази. Тепер місто було оболонкою, але досі мало інфраструктуру, щоб знову стати великим. Згодом воно служитиме Народній Республіці та її кампаніям за об'єднання.\n\nА ненависного ворога, якого воно так довго приховувало, забудуть. Як він того й заслуговує."
 TYM.160.a: "Чорної Ліги більше немає."

 TYM.161.t: "Зовсім інший сталінізм"
 TYM.161.d: "Голова Міхаїл Каґановіч розбирав щоденні папери, яких після возз'єднання Західносибірської Народної Республіки лише побільшало. Його перервав військовий офіцер із "терміновими новинами", як він це назвав. Після того як чоловік по-військовому віддав честь, Каґановіч жестом дозволив йому говорити.\n\n"Згідно з радіопередачами й повідомленнями наших зв'язкових на захід від Уралу, Західну Росію возз'єднано. Вони називають свою державу 'Західноросійською Вільною Республікою', а очолює її президентка Свєтлана Сталіна".\n\nПрізвище Сталіна привернуло увагу Каґановіча: "Свєтлана Сталіна? Вона дочка Сталіна?"\n\n"Ми вважаємо, що так, товаришу. Однак її ідеологія дуже далека від переконань батька. Вона запекла антикомуністка й антифашистка, а її режим наскрізь капіталістичний, товаришу", - Каґановіч кивнув у відповідь на слова офіцера.\n\n"Цього й варто було очікувати, хоча й прикро. Мобілізуйте війська: треба забезпечити контроль над Уралом, перш ніж вони завдадуть удару", - наказав Каґановіч. Офіцер кивнув, віддав честь і швидко вийшов із кімнати. Каґановіч відкинувся на спинку крісла, а тоді повернувся до роботи."
 TYM.161.a: "Шкода, що вона не пішла в батька."
 
