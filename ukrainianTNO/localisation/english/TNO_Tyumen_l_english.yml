 ### Ideas ###
 TYM_revisionist_remnant: "Ревізіоністський уламок"
 TYM_revisionist_remnant_desc: "Хай ми й опустилися до становища дрібної держави-уламка в Західному Сибіру, та не дозволимо, щоб це стало останнім подихом справи Лєніна. Задля цього нам, можливо, доведеться відхилитися від ортодоксального лєнінізму, але генеральний секретар Каґановіч має все необхідне: його нова доктрина виведе нас із цієї зруйнованої держави до переможного завершення Революції."
 TYM_closed_union: "Закритий Союз"
 TYM_closed_union_desc: "Фатальна помилка Бухаріна полягала в тому, що він віддав надто багато контролю над Державою, дозволивши розколам і контрреволюційним думкам проникнути всередину, послабити наш Великий Союз і довести його до краху. Більше цього не буде. Надихаючись старим другом нашого генерального секретаря Іосіфом Сталіним, ми візьмемо під контроль усе на нашій території. Ніщо не сховається від нашого нагляду, а всі ресурси буде спрямовано на майбутнє Визволення."
 TYM_open_union: "Відкритий Союз"
 TYM_open_union_desc: "Відмовитися від свободи заради безпеки й ефективности означало б зрадити дух Революції - усе просто. Відчайдушні часи можуть вимагати відчайдушних заходів, але ми не зречемося своїх принципів заради помсти."
 TYM_unorthodox_bolshevism: "неортодоксальний большевізм"
 TYM_unorthodox_bolshevism_desc: "Усім зрозуміло, що сліпа відданість ідеям Лєніна й большевиків не дасть нам майбутнього в цьому мінливому світі. Хоч якої поваги заслуговують старі большевики, задля власного блага нам доведеться відхилитися від їхніх ідей."
 TYM_stalinism: "неортодоксальний большевізм"
 TYM_stalinism_desc: "Усім зрозуміло, що сліпа відданість ідеям Лєніна й большевиків не дасть нам майбутнього в цьому мінливому світі. Хоч якої поваги заслуговують старі большевики, задля власного блага нам доведеться відхилитися від їхніх ідей."
 TYM_trove_of_salvage: "Скарби з руїн"
 TYM_trove_of_salvage_desc: "Наша остання експедиція знайшла справжню скарбницю старих совєцьких благ і грошей. Революціонерові не годиться тішитися такою розкішшю, але народ треба годувати й одягати, а додаткові кошти допоможуть нашій молодій економіці."
 TYM_armored_production_idea: "Виробництво бронетехніки"
 TYM_armored_production_idea_desc: "Бійці Червоної Армії могутні й хоробрі, але армія складається не лише з людей. Значною мірою їхня дивовижна сила походить від озброєння, яке виробляють горді робітники держави. До нього належать моторизовані й броньовані машини, здатні безпечно доправляти війська на передову та проривати ворожі лінії. Щоб забезпечити армію всім цим і зміцнити наші славні війська, ми розпочнемо нову виробничу кампанію."
 TYM_siberian_roadways: "Сибірські дороги"
 TYM_siberian_roadways_desc: "Німецькі бомбардування пошкодили значну частину нашої інфраструктури, зокрема дороги й залізничні колії. Вони необхідні для перевезення військ і припасів, тож напередодні нових війн ми не можемо лишити їх напризволяще. Тому партія мудро оголосила на наступний рік кампанію будівництва й ремонту доріг. Нашим дорогам заздритиме весь Західний Сибір!"
 TYM_red_storm_rising: "Червона буря"
 TYM_red_storm_rising_desc: "Терористичні бомбардування добігають кінця, і ми нарешті можемо повною мірою скористатися промисловою міццю Тюмєні. Промисловість запрацює на найвищих обертах, а на складальних лініях не залишиться вільних місць. Ніхто не буде без роботи: держава залучить кожного промислового робітника. Завдяки новому припливу робочих рук і сили ми засиплемо війська товарами, а ремонтні бригади - матеріалами для відновлення інфраструктури."
 TYM_repopulation_program: "Програми репопуляції"
 TYM_repopulation_program_2: "Програми репопуляції"
 TYM_repopulation_program_3: "Програми репопуляції"
 TYM_homebrew_tanks: "Вітчизняні зразки бронетехніки"
 TYM_homebrew_tanks_desc: "На обрії війна, а сучасна війна потребує сучасного спорядження. Наші заводи й конструкторські бюро спільно працюють над новою лінійкою вітчизняної бронетехніки. На вигляд вона може бути й не найсучаснішою, зате міцна й масово виробляється найкращими робітниками Республіки."
 TYM_homebrew_tanks_2: "Вітчизняні зразки бронетехніки"
 TYM_homebrew_tanks_2_desc: "На обрії війна, а сучасна війна потребує сучасного спорядження. Наші заводи й конструкторські бюро спільно працюють над новою лінійкою вдосконаленої вітчизняної бронетехніки. На вигляд вона може бути й не найсучаснішою, зате міцна й масово виробляється найкращими робітниками Республіки."
 TYM_armor_focus: "Механізація армії"
 TYM_the_red_army_morale: "Червона Армія"
 TYM_the_red_army_morale_desc: "Дві невдалі спроби Червоної Армії відбити нацистську загрозу залишили по собі гіркий присмак. Очевидно, що для повернення Росії нам передусім потрібна дисципліна. Під наглядом Комісаріяту російського солдата буде перетворено на дисциплінованого воїна, а з лав викорінено всі прояви боягузтва й нелояльности."
 TYM_the_red_army_morale_2: "Червона Армія"
 TYM_the_red_army_morale_2_desc: "Щоб продовжити реформу армії, НКВД ретельно перевірить кожного новобранця на дисциплінованість і політичну надійність. Нелояльний солдат не може битися за пролетаріят, а боягуз утече за першої ознаки небезпеки. Лише політичний контроль над Червоною Армією гарантує силу й дисципліну наших солдатів."
 TYM_the_red_army_morale_3: "Червона Армія"
 TYM_the_red_army_morale_3_desc: "Гасло нової Червоної Армії - «Ні кроку назад!» Кожен солдат - гордий і хоробрий боєць за соціялізм, готовий знищити ворога й принести Революцію решті Росії. Численні політпрацівники забезпечують якнайкраще керівництво, щоб наші солдати завжди були готові битися й померти за справу. Червона Армія готова хоробро зустріти будь-якого ворога."
 TYM_the_red_army_strength: "Червона Армія"
 TYM_the_red_army_strength_desc: "Дві невдалі спроби Червоної Армії відбити нацистську загрозу залишили по собі гіркий присмак. Очевидно, що для повернення Росії нам передусім потрібна сила. Російського солдата буде перетворено на могутнього воїна, що не здригнеться перед ворогом - чи то німцями, чи то зрадниками."
 TYM_the_red_army_strength_2: "Червона Армія"
 TYM_the_red_army_strength_2_desc: "Щоб продовжити реформу армії, Червону гвардію ретельно перевірять на боєготовність та ідеологічну чистоту. Непридатних виженуть із лав, а здібних підвищать. Ми також подбаємо, щоб гвардія була добре оснащена й навчена."
 TYM_the_red_army_strength_3: "Червона Армія"
 TYM_the_red_army_strength_3_desc: "Червону Армію перетворено на могутню й дисципліновану силу, геть не схожу на неорганізований набрід, який виставляють наші суперники-воєначальники. Щоправда, підготовка тепер триває довше, тому ми не можемо розгортати війська так швидко, як хотілося б. Попри це, наші нинішні солдати - найкращі з найкращих і зможуть дати відсіч будь-якому ворогові, що наважиться кинути нам виклик."
 TYM_united_against_evil_idea: "Об'єднані проти зла"
 TYM_united_against_evil_idea_desc: "У боротьбі за возз'єднання Західного Сибіру не можна лишити непереможеним жодного ворога. Зокрема й чудовиськ в Омску разом із їхньою огидною, сповненою ненависти ідеологією. Битися зі співвітчизниками може бути тяжко, але Червона Армія єдина в боротьбі проти цієї земної зарази, і від цього її бойовий дух лише міцнішає. Скористаймося новою наснагою, щоб швидко розгромити ревізіоністів і покінчити з ними раз і назавжди!"
 TYM_against_rocky_idea: "Проти Рокоссовскоґо"
 TYM_against_rocky_idea_desc: "На півночі засіли ганебні зрадники з Єкатєрінбурґа, які лише називають себе бійцями Червоної Армії, а насправді є найгіршими ревізіоністами і Сталіна, і навіть Бухаріна. Ми не забули їхньої зради, і тепер настав час показати, що буває з тими, хто виступає проти партії. Нехай наші армії зітруть Рокоссовскоґо й назавжди покладуть край його жалюгідному бунтові, а бойовий дух наших військ залишатиметься високим."
 TYM_enemy_of_the_republic: "Ворог народу"
 TYM_our_proud_sponsor: "Вшанування наших зусиль"
 TYM_honoring_the_heroes: "Герої Росії"
 TYM_famine_1: "Наростаючий голод"
 TYM_famine_2: "Поширення голоду"
 TYM_famine_3: "Тяжкий голод"
 TYM_famine_4: "Спустошливий голод"
 TYM_famine_5: "Нищівний голод"
 TYM_survival_programs: "Програми виживання"
 TYM_survival_programs_desc: "Поки тривають німецькі терористичні бомбардування, ми вчимося переживати їхній натиск. Передбачуваний і шаблонний графік нальотів значно полегшує організацію евакуацій, бомбосховищ і ремонтних бригад. Наша промисловість розосереджена, що запобігає тяжким утратам, яких вона зазнала за Бухаріна. У цих умовах ми й далі розвиватимемо державу та запобігатимемо жертвам серед пролетаріяту й армії."
 TYM_remove_mod_tt: "§YПрограма виживання§! більше не буде потрібна."
 TYM_NKVD_repurposed: "Перепрофільоване НКВД"
 TYM_NKVD_reformed: "Реформоване НКВД"
 TYM_NKVD_reformed_desc: "Завдяки новій реорганізації НКВД стало злагодженим механізмом, готовим підтримувати ідеологічну чистоту й революційний запал у лавах робітників і Червоної Армії. Переведення здібних співробітників на нові комісарські посади у війську зміцнить моральний дух і мобілізацію, адже ідеологічна відданість і мотивація залишатимуться незмінно потужними. І все це - під пильним оком організації, яка гарантує безпеку держави."
 TYM_honor_the_party: "Вшанувати партію"
 TYM_honor_the_party_desc: "Всєсоюзная комуністіческая партія провела нас крізь розпад Росії, терористичні бомбардування й Смуту, а тепер - у нову добу влади над Західним Сибіром. Цілком справедливо й надалі вшановувати її успіхи та спадщину, поки вона веде нас до прийдешнього об'єднання всієї Росії. А доти ми можемо покладатися на стабільність і силу, які вона нам дає, та на її винахідливість у просуванні Революції."
 TYM_honor_the_worker: "Вшанувати робітника"
 TYM_the_next_stage: "Наступний етап"
 TYM_the_next_stage_desc: "Підготовка нового покоління наукових соціялістів, які керуватимуть економікою та нестимуть добробут Революції в майбутнє, вже дає бажані результати. Виробничі потужності зростають, а економіка сягає висот, про які наші попередники Сталін і Лєнін могли лише мріяти. До остаточної досконалости ще далеко, але це вже крок уперед - і доволі обнадійливий, якщо все триватиме так само."
 TYM_tyumen_military_academy: "Тюмєнська військова академія"
 TYM_tyumen_military_academy_desc: "Готуючись до неминучої нової об'єднавчої війни із західними сусідами, ми мусимо подбати про достатню кількість старших офіцерів, щоб військові операції відбувалися без збоїв. Завдяки новим військовим академіям Червона Армія отримає офіцерів, навчених сучасної тактики бою й відданости партії. Це має значно полегшити проведення майбутніх операцій."
 TYM_an_intellectual_revolution: "Інтелектуальна революція"
 TYM_an_intellectual_revolution_desc: "Наш науковий соціялізм не знає меж, і це помітно серед інтеліґенції. Щодня виникають нові ідеї, що критикують теорію й суспільство та пропонують можливі розв'язання проблем. Не всі ці міркування корисні, але чимало з них справді дають поштовх технологічному й суспільному прогресу. Принаймні доти, доки ці ідеї не виходять за встановлені державою межі."
 TYM_an_intellectual_revolution_2: "Інтелектуальна революція"
 TYM_an_intellectual_revolution_2_desc: "Наш науковий соціялізм не знає меж, і це помітно серед інтеліґенції. Щодня виникають нові ідеї, що критикують теорію й суспільство та пропонують можливі розв'язання проблем. Не всі ці міркування корисні, але чимало з них справді дають поштовх технологічному й суспільному прогресу. Принаймні доти, доки ці ідеї не виходять за встановлені державою межі."
 TYM_a_hammer_in_every_hand_idea: "Молот у кожній руці"
 TYM_a_hammer_in_every_hand_idea_desc: "Якщо ми хочемо визволити совєцьку землю й народ, напівзаходи неприпустимі! Кожен чоловік, кожна жінка й кожна дитина мусять зробити свій внесок у відновлення Совєцького Союзу. Поки солдати б'ються на фронті, громадяни повинні працювати на заводах і в майстернях. Задля цього ми мобілізували на промислові роботи стільки людей, скільки можемо собі дозволити, здобувши потрібну перевагу у виробництві перед прийдешніми випробуваннями."
 TYM_commissariat_of_civil_defence_idea: "Комісаріят цивільної оборони"
 TYM_commissariat_of_civil_defence_idea_desc: "Комісаріят цивільної оборони - серце зростаючої воєнної машини Каґановіча. Цей орган керує всіма складниками підготовки до війни, зокрема виробництвом озброєнь, набором і навчанням військових та пропагандою."
 TYM_major_military_purge: "Триває велика чистка в армії"
 TYM_major_military_purge_desc: "Чистка опозиції у війську, проведена Каґановічем, не минула без наслідків: кар'єри й життя багатьох досвідчених і здібних людей обірвалися, а замінити їх буде непросто. Доки цього не зроблено, наша армія потерпатиме від серйозних вад, лишаючи державу вразливою."
 TYM_major_military_purge_2: "Заміна репресованих офіцерів"
 TYM_major_military_purge_2_desc: "Тепер, коли з усіма підозрюваними в інакомисленні розібралися, можна почати заповнювати спустошені лави офіцерського корпусу. Ми масово підвищуємо ветеранів і заслужених солдатів. Армія досі в кепському стані, але найгірше вже позаду."
 TYM_what_is_the_five_year_plan_idea: "Що таке П'ятирічний план?"
 TYM_what_is_the_five_year_plan_idea_desc: ""
 TYM_what_is_the_five_year_plan_idea_2: "План під впливом Каґановіча"
 TYM_what_is_the_five_year_plan_idea_2_desc: "Під керівництвом товариша Каґановіча П'ятирічний план уже втілюється. Він іще на ранньому етапі й потребуватиме тривалого обговорення в Політбюро, але ми впевнені в його успіху."
 TYM_what_is_the_five_year_plan_idea_3: "План під впливом Хрущова"
 TYM_what_is_the_five_year_plan_idea_3_desc: "Під керівництвом товариша Хрущова П'ятирічний план уже втілюється. Він іще на ранньому етапі й потребуватиме тривалого обговорення в Політбюро, але ми впевнені в його успіху."
 TYM_what_is_the_five_year_plan_idea_4: "Бачення Каґановіча"
 TYM_what_is_the_five_year_plan_idea_4_desc: "Під проводом товариша Каґановіча П'ятирічний план починає втілюватися. Він передбачає масштабну індустріялізацію, подальше розширення інфраструктури й політичного авангарду та зміцнення війська. Це буде важке завдання, але з належним керівництвом ми впораємося."
 TYM_what_is_the_five_year_plan_idea_5: "Бачення Хрущова"
 TYM_what_is_the_five_year_plan_idea_5_desc: "Під проводом товариша Хрущова П'ятирічний план починає втілюватися. Він передбачає розвиток і механізацію сільського господарства, розширення масового житлового будівництва та пом'якшення законів про свободу слова. Це буде важке завдання, але з належним керівництвом ми впораємося."
 TYM_what_is_the_five_year_plan_idea_6: "Спільне бачення"
 TYM_what_is_the_five_year_plan_idea_6_desc: "Цей план є компромісом між товаришами Каґановічем і Хрущовим та поєднує в нашому П'ятирічному плані найкраще з обох підходів. Можливо, він не буде таким ефективним, як кожен із двох окремо, зате ми зможемо й далі працювати разом і не дозволимо розбіжностям стати на заваді прогресу."
 TYM_Kaganovich_five_year_plan: "П'ятирічний план Каґановіча"
 TYM_Kaganovich_five_year_plan_desc: "Політбюро нарешті схвалило П'ятирічний план, і ми готові розпочати його виконання. Товариш Каґановіч невтомно працював задля його успіху, і ми певні, що так і буде. Настав час пролетаріяту Західносибірської Народної Республіки згуртуватися довкола голови Каґановіча й невтомно працювати, втілюючи його бачення. Настав час нового Совєцького Союзу."
 TYM_Khrushchev_five_year_plan: "П'ятирічний план Хрущова"
 TYM_Khrushchev_five_year_plan_desc: "Політбюро нарешті схвалило П'ятирічний план, і ми готові розпочати його виконання. Товариш Хрущов невтомно працював задля його успіху, і ми певні, що так і буде. Настав час пролетаріяту Західносибірської Народної Республіки згуртуватися довкола голови Хрущова й невтомно працювати, втілюючи його бачення. Настав час нового Совєцького Союзу."
 TYM_united_five_year_plan: "Об'єднавчий П'ятирічний план"
 TYM_united_five_year_plan_desc: "Цей план є компромісом між товаришами Каґановічем і Хрущовим та поєднує в нашому П'ятирічному плані найкраще з обох підходів. Можливо, він не буде таким ефективним, як кожен із двох окремо, зате ми зможемо й далі працювати разом і не дозволимо розбіжностям стати на заваді прогресу."
 TYM_Khruschyovka_idea: "Програма хрущовок"
 TYM_Khruschyovka_idea_desc: "Під керівництвом товариша Хрущова ми взялися долати бездомність і погані житлові умови в містах. Програма хрущовок передбачає будівництво багатьох нових багатоквартирних будинків, де робітники та їхні родини житимуть у більшому комфорті. Це також скоротить кількість бездомних у містах і загалом поліпшить якість життя громадян."

