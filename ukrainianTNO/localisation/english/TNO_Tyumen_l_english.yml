 TYM_the_new_institutions_desc: "Закріпившись в уряді, голова Хрущов готовий до перших реформ Західноросійської Народної Республіки. Під його опікою, наче квіти, постануть нові відомства й адміністрації. Керівників добиратимуть особисто для втілення його бачення. Великих реформ поки не буде, але нові установи закладуть основу тривалих політичних змін.\n\nМи не стримуватимемо суспільство: для поступу країни й Революції воно має рухатися як одне ціле. Меншини більше не боятимуться, бо ми всі єдині."

 TYM_uphold_progressive_values_desc: "Як писав Маркс і повторювали численні соціялістичні мислителі, нас поділяють не раса, стать чи кордони, а клас. Тому ми заохочуватимемо співпрацю всіх народів заради кінця капіталізму.\n\nРасизм, сексизм і будь-яка дискримінація реакційні - їх треба викорінити для побудови комуністичного суспільства!"

 TYM_establish_the_assrs_desc: "Новий Совєцький Союз не повинен загрузнути в неефективній роздутій бюрократії. Для дієвого управління ми створимо за етнічним принципом Автономні Совєцькі Соціялістичні Республіки із самоврядуванням у ширшому Союзі. Їхніх лідерів, звісно, особисто добере голова Хрущов.\n\nМи збудуємо державу, якою пишався б сам Сталін, адже саме він нас веде."

 TYM_a_state_to_make_stalin_proud_desc: "Товариш Сталін був недооціненим візіонером своєї доби. Він заплакав би, дізнавшись, що історія довела його правоту. Голова Хрущов глибоко засвоїв теорію Сталіна й успішно застосував її. Навіть після смерти його слова сяють світлом, що веде російський народ до досконалішого соціялізму!"

 TYM_out_with_the_old_desc: "Світ змінився, і ми мусимо змінитися з ним. Політика Каґановіча була безперечно ефективною, але більше не відповідає часу. Хрущов почне викорінювати його вплив в уряді: чиновників чиститимуть, закони переписуватимуть і скасовуватимуть, а шкоду його правління виправлятимуть.\n\nДехто протестуватиме, але ці заходи необхідні для виживання соціялізму в тяжкі часи."

 TYM_the_secret_speech_desc: "Політика й переконання колишнього голови Каґановіча безперечно зраджували сталінізм, соціялізм і Совєцький Союз. Та в партії лишилися дисиденти й симпатики, які називають ревізіоністами нас і вважають чистку Каґановіча зрадою справи.\n\nМи доведемо протилежне.\n\nНа наступному партійному засіданні Хрущов у закритому колі розкриє справжній масштаб злочинів Каґановіча проти народу й оголосить програму виправлення шкоди, завданої ним та його прибічниками."

 TYM_lock_down_the_party_desc: "Комуністичній партії, особливо в нинішньому стані, не можна довірити захист соціялізму й пролетаріяту. Тому Хрущов запровадить мораторій на партійні вибори й отримає повний контроль над урядом. Це необхідно, бо лише він здатен захистити народ від реакції. Повнота влади допоможе йому краще втілити сталінське бачення великої Росії."

 TYM_another_five_year_plan_desc: "Перший П'ятирічний план завершено. Через його гучний успіх голова Хрущов оголосить новий, Другий п'ятирічний план. Народ Росії славно працюватиме, продовжуючи індустріялізацію в небачених масштабах і наближаючи країну до справжнього промислового соціялізму.\n\nНастав час реінтегрувати західні землі - ми всі росіяни."

 TYM_reintegrate_the_west_desc: "Німецькі фашисти могли знищити Росію, але не совєцький дух. Разом ми відбудуємо державу під червоним прапором Совєцького Союзу. Ніщо не зупинить народ на шляху до возз'єднання Батьківщини!"

 TYM_continue_agricultural_mechanization_desc: "Тисячоліттями землеробство годувало людство й зміцнювало держави. Щоб отримати від нього всю можливу користь, ми цілком механізуємо галузь і навчимо селян зберігати родючість ґрунту. Згодом буквальні плоди праці проявляться в достатку їжі для народу."

 TYM_repudiate_literary_policy_desc: "Стара літературна політика суперечить ідеалам Маркса, Лєніна й Сталіна. Книжки мають підносити пролетаріят, а не пригнічувати. Тому Хрущов скасує каґановічівські репресії проти книжок та інших мистецьких форм. Пролетарі Росії стануть найкультурнішими у світі!"

 TYM_an_end_to_extraneous_repression_desc: "Червона Армія - наш меч, щит і захисниця пролетаріяту. Карати її за хоробрість у бою було б не лише нерозумно, а й несправедливо. Військо має служити Союзові з поваги й любови до голови, а не зі страху. Тому ми припинимо всі репресії в армії."

 TYM_commence_the_khrushchevshchina_desc: "Росія давно переросла образ бідної відсталої країни. Заводи гудуть машинами, чоловіки й жінки разом працюють задля її добробуту, трактори обходять пшеничні поля, що годують робітників. Та культура досі загрузла у феодальній реакції. Хрущов розпочне хвилю культурних реформ, щоб знищити рештки старого світу й утвердити справжнє соціялістичне суспільство."

 TYM_shining_in_glory_desc: "Росія постала з попелу маяком соціялізму у світі визиску й тиранії. Відродження не спиниться: ми йдемо визволяти робітників світу. Ми перемогли німецьких фашистів із меншими ресурсами, ніж маємо тепер; сьогодні ми світова держава. І на відміну від інших використаємо цей статус для світової пролетарської справи."


 ### Events ###
 TYM.1.t: "Привид Сталіна"
 TYM.1.d: "Хай живе Комуністична партія Лєніна-Сталіна! Хай живе генеральний секретар Західносибірської Комуністичної партії товариш Лазар Каґановіч! Хай живе народ Росії, народна справа та Червона Армія, що оберігає нас!\n\nСмерть Чорній Лізі в Омску, яка зрадила революцію й принесе загибель усій Росії! Смерть безумцеві Карбишеву, що очолює її та прагне занурити нашу колись славну країну в пітьму! Смерть зрадникам Червоної Армії у Свєрдловску, які погрожують знищити наше славне військо й нашу славну країну! І смерть підступному «фельдмаршалові» Рокоссовскому, що очолює цей заколот проти слави товариша Каґановіча!\n\nКоли зрадник Бухарін призначив товариша Каґановіча до Західного Сибіру, він і гадки не мав, що цим прокладає шлях до власної загибелі. Коли він показав своє справжнє обличчя й не спинив ненависних німецьких покидьків, які знищили нашу прекрасну країну, товариш Каґановіч повів славну громадянську війну проти Бухаріна в ім'я свого колишнього товариша, Іосіфа Сталіна. Хоч Союз і впав, Каґановіч не зрікся своєї справи та заснував велику Західносибірську Народну Республіку.\n\nОднак час не став нашим союзником: зрадники в Омску та Свєрдловску зрадили революцію й раптово напали на столицю Тюмєнь. Хоч ми хоробро вистояли та відбили ці напади, Народної Республіки більше немає. Німецькі бомбардування й досі стирають на порох ті крихти, що в нас лишилися, і таке становище триває вже понад рік. Та невдовзі ми знайдемо спосіб здійснити правосуддя над цими зрадниками й відновити Союз на славу товариша Каґановіча! І товариша Сталіна! І товариша Лєніна! За народ! Ура!"
 TYM.1.a: "Ура!"
 
 TYM.2.t: "Повість про Схід і Захід"
 TYM.2.d: "Лазар Каґановіч зосередив більшу частину возз'єднаного Совєцького Союзу на першому для країни «П'ятирічному плані», але водночас виділив кількох представників інтеліґенції молодої держави для іншого завдання.\n\nСьогодні «Повість про Схід і Захід» вийшла міжнародним накладом. Твір було замовлено Каґановічем, засновано на його особистих записах і надіслано за кордон у надії, що дослідження альтернативної історії, в якій кумир Каґановіча Іосіф Сталін переміг Ніколая Бухаріна в боротьбі за владу, додасть державі легітимности. Перед виходом «Нью-Йорк Таймс» навіть розхвалювала книжку як «перший твір російської літератури за пів століття».\n\nТа, на жаль для режиму Каґановіча, критики розгромили книжку скрізь, окрім самого Совєцького Союзу, де її читання стало обов'язковим у кількох державних школах. І критики, й історики наголошують на нереалістичності сюжету та безглуздих натяжках історичної правдоподібности. У повісті Сталін не лише знищує нацистську Німеччину, а й доходить аж до Берліна; створює «Будапештський пакт» на противагу очолюваній Заходом «Північноатлантичній договірній коаліції»; британці засновують єврейську національну державу, а самі зберігають більшість своєї імперії, проте разом із більшістю інших європейських держав поволі відступають через посилення африканського націоналізму; Совєцький Союз існує «принаймні до вісімдесятих, коли сталінізм і вільний ринок розпочнуть своє останнє протистояння, а якщо сталінізм зазнає поразки, Росія все одно йтиме за його спадщиною та відновить свою силу в новому тисячолітті вторгненням в Україну».\n\nЯк узагалі вдалося надрукувати таку нісенітницю - лишається тільки здогадуватися."
 TYM.2.a: "А що сталося з Троцкім!?"

 TYM.3.t: "Тягар, який ми несемо"
 TYM.3.d: "Товаришу! Не можна заперечувати, що часи тяжкі. Совєцький Союз був великим, але зрада, фашизм і ревізіонізм сточили його до порожньої оболонки колишньої величі. І все ж ми - його справжні спадкоємці, не заплямовані бухарінізмом чи будь-яким іншим відхиленням від шляху Маркса, Лєніна та Сталіна. Зрадники можуть обмовляти нас, підривати нас ізсередини, бомбити й убивати. Але вони не можуть убити праведний дух робітничого класу.\n\nТоваришу! Нехай тебе заспокоює те, що Комуністична партія пішла на численні жертви в ім'я тебе. Голова Каґановіч працює вдень і вночі, прагнучи захистити тебе від нацизму та влади воєначальників. Червона Армія, непохитна як завжди, пильно стереже нас від бандитів, які бажають заподіяти тобі шкоду. Найкращий уряд Росії ухвалює найтяжчі рішення, щоб ти міг жити без страху.\n\nТоваришу! Якщо тебе охопить зневіра, пам'ятай: усі наші труднощі, усі наші вороги викували з нас вістря, гостріше за багнет. Пробиваючись крізь наших супротивників, постав собі життєво важливе питання. Як ти можеш прислужитися?"
 TYM.3.a: "Присвятивши комуністичній справі кожну часточку свого єства!"

 TYM.4.t: "Бункери вдалині"
 TYM.4.d: "Із легень рядового Станіслава Харітонова здійнявся клуб диму, коли той дивився з вершини пагорба. Тільки-но починало світати - була ще раніша година, ніж та, коли його зазвичай грубо витрушували з ліжка. Та що поробиш? Він стояв у дозорі, а його обов'язком було пильнувати. Червона Армія мало що зносила гірше за непокору. Принаймні він міг курити.\n\nВін із насолодою затягнувся цигаркою й дозволив поглядові привести себе до чогось цікавого. Його очі зупинилися на бомбосховищах, які незворушно стояли вдалині, очікуючи свого часу. Можливо, річ була в ранній годині, але його потягло до роздумів. Він ніколи по-справжньому не замислювався, яким великим досягненням вони були. Після всього, що їм довелося пережити, після розпаду Союзу, зради у власному генеральському корпусі та загального краху Західносибірська Народна Республіка вистояла, бодай у Тюмєні. Жодна кількість бомб чи куль не могла завадити солдатам пролетаріяту повернути те, що належало їм по праву.\n\nАвжеж, армія була суворою. Для Станіслава й тисяч таких, як він, це було ніщо проти втрат, яких вони вже зазнали."
 TYM.4.a: "Червона Армія стоїть."

 TYM.5.t: "Схвалені експедиції зі збору ресурсів"
 TYM.5.d: "Совєцький Союз, що розпадався, лишив по собі величезну кількість поселень, сховищ припасів, заводів та інших об'єктів, які його державки-наступниці не мали ні коштів, ні спроможности повернути. Недавні потрясіння в ЗСНР перешкоджали нам організувати великомасштабні експедиції.\n\nТа навіть за таких обставин робітники здобувають маленькі перемоги! В околицях Тюмєні ми знайшли кілька місць, де можна зібрати корисні ресурси. Перше - великий запас пального, що лишився від бронетанкової дивізії, яку так і не розгорнули. Друге - схованка військового спорядження, покинутого після масового дезертирства. Найменш важливим для війни, але потенційно цінним для бойового духу є склад харчів, одягу та інших цивільних благ.\n\nНаразі в нас вистачає ресурсів лише на одну експедицію. За нашого стану тотальної мобілізації пальне чи зброя були б неоціненними, але постає й питання, скільки ще здатен витримати народ."
 TYM.5.a: "Ми не повинні кам'яніти серцем. Обрати цивільні блага."
 TYM.5.b: "Більша гармата - довше життя. Обрати зброю."
 TYM.5.c: "Наше військо має вистояти. Обрати пальне."

 TYM.6.t: "Надзвичайні заходи"
 TYM.6.d: "Кожна скинута бомба змушує нас робити ще один вибір. Кого нам захистити? Хай як би ми старалися, у Тюмєні просто не вистачає бункерів, щоб убезпечити всіх. Як і завжди, кожен вибір має свою ціну. Кожен солдат, що виживе, зможе зробити свій внесок у війну. Чимало представників нашого вищого командування переконливо доводять, що ми мусимо віддати перевагу тим чоловікам, які здатні витягнути нас із цього жалюгідного становища.\n\nІ все ж голова Каґановіч вагається. Яка користь із солдатів, якщо вони ховаються, поки люди, яких вони повинні захищати, лишаються безборонними? Нинішня криза мине, але наступне покоління пам'ятатиме наші гріхи. Бойовий дух цивільних, і без того крихкий, може не пережити того, що жінок і дітей покинули на поталу Люфтваффе. Впливові представники адміністрації вважають, що ми мусимо захистити найуразливіших, аби не втратити з поля зору моральні засади, які нами керують.\n\nБомбардувальники не чекатимуть, поки ми ухвалимо рішення. Краще врятувати одну групу зараз, ніж зволікати й утратити обидві."
 TYM.6.a: "Як ми можемо говорити від імені робітників, якщо не захищаємо їх?"
 TYM.6.b: "Оплачемо цивільних, коли повернемо Москву."

 TYM.7.t: "Під землею"
 TYM.7.d: "Чекаючи в коридорі біля кабінету місцевого партійного секретаря, Іґор відчував, як тремтять його руки. Боже! І чому робітники не доручили іншому бригадирові зробити цю доповідь? Він знову й знову прокручував промову в голові.\n\n«Товаришу секретарю, деякі чоловіки мають застереження щодо безпечности цих планів будівництва бункерів. Вони вважають, що споруди, зведені точно за цими планами, матимуть неприпустимо високий ризик обвалення. Звісно, це аж ніяк не означає, що ви, товариш Каґановіч або Комуністична партія зробили бодай щось, що могло б поставити під загрозу безпеку народу Тюмєні. Якщо з'ясується, що плани саботували контрреволюціонери або що причиною стала некомпетентність робітників, я цілковито прийму на себе відповідальність».\n\nМинуло ще кілька хвилин чекання та повторення промови, перш ніж двері нарешті відчинилися й із кабінету вийшов секретар - невисокий вірменин із нудьгуючим виразом обличчя. Попри всі старання, слова полилися з Іґора нервовим потоком, але секретар стишив його ще до того, як той дістався обов'язкової похвали Каґановіча.\n\n«Так, так, застереження щодо безпеки. Я повідомлю начальству».\n\nКоли чоловік зачинив двері, Іґора хвилею накрило полегшення. Тепер лишалося тільки сподіватися, що повідомлення підніматиметься ланцюгом телефонних дзвінків аж до самого Каґановіча й що знаний своєю впертістю лідер Тюмєні дослухається до нього."
 TYM.7.a: "Хто ми такі, якщо не можемо захистити народ?"
 TYM.7.b: "Ми мусимо понад усе ставити ефективність - щоб розмістити всіх."

 TYM.8.t: "Заховані від світу"
 TYM.8.d: "Попиваючи каву за робочим столом, Лазар Каґановіч широко позіхнув. Короткий погляд на годинник підказав, що вже майже північ, а отже, він увесь день просидів у кабінеті, читаючи звіти й затверджуючи різноманітні державні справи. Відбудовувати країну було тяжкою працею! Та перш ніж він зможе піти спати, належало зробити ще чимало. Саме тоді до кімнати ввійшов помічник, вочевидь теж дуже стомлений. Від помічників Каґановіча чекали такого самого робочого розкладу, як у нього, але мало хто мав витривалість «Залізного Лазара».\n\n«Для вас є ще один звіт, пане. Про стан нашого промислового розвитку».\n\nГолова коротко буркнув на знак того, що почув, відпустив помічника й посунувся на стільці, щоб прочитати документ. У ньому знову йшлося про збільшення виробництва, як і в стількох інших комюніке, прочитаних того дня. Повіки почали стулятися, але він вчасно опанував себе. «Я справді виснажений», - подумав він і продовжив читати. Сухою бюрократичною мовою документ докладно викладав можливість скоротити виробництво споживчих товарів, щоб прискорити випуск важкої техніки. Наслідки для цивільних згадувалися лише побіжно, після чого занепокоєння відкидалося. Вони вже стільки витримали заради держави - чому б не витримати ще трохи?\n\nУ голові промайнула думка вже зараз піти до своїх покоїв і відкласти справу до ранку, але він одразу її відкинув. Совєцькому Союзові не потрібен лідер, нездатний дисциплінувати самого себе. Він розмірковував ще кілька хвилин, а тоді, як робив уже багато разів, дістав ручку й записав своє рішення на документі."
 TYM.8.a: "Зробити. Розкішшю вони насолодяться пізніше."
 TYM.8.b: "Народ заслуговує на свої маленькі перемоги."

 TYM.9.t: "Наша програма дає плоди"
 TYM.9.d: "Як завжди за голови Каґановіча, його пропозиції стежити за розкладом німецьких терористичних бомбардувальників мали надзвичайний успіх. Народ, завчасно попереджений про можливі атаки, ще ніколи не був у такій безпеці, а шляхи постачання працювали краще, ніж будь-коли. Та ми не можемо дозволити собі самозаспокоєння: Комуністична партія не задовольняється прийнятним результатом, а прагне досконалости! Наразі ми, можливо, й розгадали їхній розклад, але німці завжди можуть змінити його, щойно усвідомлять нашу винахідливість. Саме тому необхідно знайти постійніше розв'язання проблеми бомбардувань.\n\nОдин із можливих варіянтів - скористатися знанням їхніх переміщень і перейти в наступ, завдавши фашистам удару, якого так потребує народ, щоб наступного разу вони двічі подумали, перш ніж знову йому загрожувати. Для цього доведеться будувати винищувачі, які перехоплюватимуть бомбардувальники в повітрі й завдяки раптовості долатимуть технологічну відсталість. Фашисти за своєю природою боягузливі, а Люфтваффе не звикла зустрічати опір; рішучий удар може налякати їх і змусити покинути наш повітряний простір заради слабших цілей.\n\nІнше розв'язання обережніше, але здатне усунути проблему на довший час. У попередніх війнах радіолокаційні вежі довели свою ефективність, а їхня здатність віддалено стежити за літаками позбавить нас потреби в докладних розкладах бомбардувань у майбутньому, адже ми зможемо реагувати на бомбардувальники, щойно виявимо їх. Такий підхід, хоч і не передбачає прямого протистояння з бомбардувальниками, може в майбутньому серйозно обмежити їхні дії.\n\nНімці, хоч і грубі, але не дурні. Хоч яку операцію ми оберемо, вона має бути гнучкою й здатною надзвичайно швидко реагувати, щоб зміна тактики Люфтваффе не дала змоги цілком її обійти."
 TYM.9.a: "Зосередитися на виявленні ворогів."
 TYM.9.b: "Зосередитися на створенні умов для перехоплення."

 TYM.10.t: "Пропозиції Міхаїла"
 TYM.10.d: "Можна було б подумати, що такий чоловік, як Лазар Каґановіч, висуває до інших винятково суворі вимоги через власні лінощі. Насправді все було навпаки. Каґановіч працював як віл. Зазвичай його можна було застати за робочим столом у кабінеті, де, оповитий густою хмарою сигарного диму, він заглиблювався в документи, час від часу порушуючи одноманітність гучною телефонною розмовою. Саме таким його застав Міхаїл, брат і міністр економіки, коли приніс стос паперів.\n\nМіхаїл стояв у дверях і кашляв, коли дим заповнював його легені. Хоча Лазар насправді був молодшим братом, Міхаїл не міг позбутися відчуття, що той його лякає, але придушив ці почуття. Зрештою, вони були братами, а справа була важлива. Він чекав, поки Лазар визнає його присутність, але Голова невтомно працював далі - чи то не чув Міхаїла, чи то не зважав на нього. Міхаїл прокашлявся.\n\n«Я маю кілька пропозицій і хотів би, щоб ти прочитав їх, коли матимеш час».\n\n«Гм? А, так, звісно», - непереконливо відповів Лазар, чию увагу явно поглинула вже чимала купа на столі. Побачивши, що брат і далі стоїть у дверях, він заговорив знову, тепер уже відверто роздратовано. «Тебе непокоїть іще щось? Якщо ти не проти, я хотів би повернутися до роботи».\n\nМіхаїл ніяково пішов. Хоча він волів би покластися на брата, інстинктивно знав, що стос його пропозицій ще довго лежатиме непрочитаним."
 TYM.10.a: "Не найтепліші стосунки."

 TYM.11.t: "Закономірності змінюються"
 TYM.11.d: "Лазар Каґановіч був роздратований. Розклад німецьких бомбардувань, який роками лишався відносно незмінним, змінився. Зміна була невеликою - правду кажучи, пристосуватися й далі йти попереднім шляхом було б не надто складно. Однак на його столі лежала пропозиція Міхаїла пристосувати міську оборону, щоб компенсувати цю зміну.\n\nЗ одного боку, якщо просто продовжити будувати бункери, будь-які зміни в розкладі втратять значення. З іншого, у короткостроковій перспективі пристосування до нового розкладу заради захисту наземної інфраструктури було б кращим для народу й морального духу загалом.\n\nХоч який варіянт обрати, він потребуватиме величезних вкладень. Бункери забезпечать повний захист від бомб, а якщо бомбардування колись припиняться, їх можна буде використовувати для оборони інфраструктури від інших російських воєначальників. Водночас збереження гнучкости оборони дасть змогу швидше реагувати на зміни в бомбардуваннях.\n\nСправді, обидві ідеї були перспективні, але зрештою можна було втілити лише одну. Питання полягало в тому, яку саме?"
 TYM.11.a: "Скористатися програмою Міхаїла й пристосуватися."
 TYM.11.b: "Ми скористаємося програмою Голови."
 
 TYM.12.t: "Годуючи підземелля"
 TYM.12.d: "Глибоко під вулицями Народної Республіки бригади чоловіків орудували кирками й лопатами, розчищаючи тунелі для найновішої лінії метро Республіки. Владіслав Шаповалов змахнув киркою й розколов шмат каменю. Його бригада мала завершити останню ділянку тунелю, щоб інші бригади змогли прийти й укласти колію. Це була виснажлива праця, якої, здавалося, завжди було замало, але все-таки праця - а її він не мав уже багато років.\n\nВлад помітив, що, попри небезпеку, робота приносила йому певне задоволення. Під час нових розкопок, доки не встановлять опори, загроза обвалу була майже постійною. Через обвали він утратив багатьох друзів, останнім часом - Льва, але навіть попри це праця була того варта. Їм досить часто втовкмачували, наскільки важлива ця лінія: від тунелів залежала безпека їхніх родин. Саме цей тунель був невіддільною частиною плану, що мав уберегти заводи від бомб, а безпечні заводи означали краще життя для їхніх сімей.\n\nТепер Влад уже чув, як по той бік скелі працює техніка. Він знав, що за кілька годин тунель буде готовий до подальшого будівництва. Коли Влад змахнув киркою, то почув характерний гуркіт, що передував обвалові. Він крикнув: «Обвал!» - і спрямував своїх людей до безпечної ділянки позаду, звідки вони прийшли. Він відступив останнім - саме перед тим, як стеля завалилася й метри каменю перекрили прохід."
 TYM.12.a: "Це ще стане в пригоді."

 TYM.13.t: "Остаточний тріюмф"
 TYM.13.d: "Лазар Каґановіч був у захваті. Програми, у які він уклав усе своє єство, мали приголомшливий успіх. Підступні німці та їхні бомби так довго мучили народ Народної Республіки, що люди навіть почали використовувати бомбардування як своєрідний будильник. До нового життя ще доведеться довго звикати, адже старий лад змете нова доба добробуту.\n\nОднак завдяки успіхові програм бомбардувальники, які колись наводили жах на кожного громадянина Росії, тепер стали лише другорядною прикрістю. Народ Тюмєні жив найбезтурботніше за багато років. Уперше загроза раптової смерти практично зникла з життя російського народу.\n\nУ своєму кабінеті Лазар підняв невеликий тост за власні успіхи, оточений найближчими соратниками. Політика, яку провадив Каґановіч, була геніяльною. Під його доброзичливим проводом німців позбавили змоги завдавати їм шкоди. Під його проводом Народна Республіка посяде належне їй місце у світі, а він посяде належне йому місце на чолі Росії."
 TYM.13.a: "Німці безсилі."

 TYM.14.t: "Обійшли увагою!"
 TYM.14.d: "Лють. Він не знав нічого, крім люті. Лазар Каґановіч був оскаженілий. Після всієї праці й усіх жертв, на які він пішов, захищаючи народ Народної Республіки, він очікував, що цей народ визнає його зусилля - віддасть йому належне.\n\nЦей покидьок Міхаїл привласнював заслуги за його працю, а величезні зусилля Лазара ігнорували заради його чепурного брата-себелюбця. Він надто тяжко працював, надто багато вклав у ці проєкти й у порятунок народу Росії від німецьких псів, щоб тепер його отак обійшли увагою. І ось він сидів тут, тоді як його внесок у налагодження бездоганної роботи Тюмєні ігнорували й зневажали.\n\nЛазар кипів від люті, поволі варячись у власній ненависті. Цей покидьок нічого не зробив для людей, які тепер мало не вигукували його ім'я з дахів. Як таке могло статися? Невже народ не розумів, скільки він працював заради їхньої безпеки? Чим він пожертвував, щоб не довелося жертвувати їм? Як вони могли так учинити?"
 TYM.14.a: "Це абсурд!"

 TYM.15.t: "Розширити програму репопуляції?"
 TYM.15.d: "Трагічним, але загальновідомим фактом є те, що після десятиліть чужоземних і громадянських воєн наше населення страждає. Роками німецькі літаки літали в нашому небі й атакували наш народ, без розбору вбиваючи солдатів і цивільних, чоловіків, жінок і дітей. Безсумнівно, це завдало нашим землям величезних страждань, але найжахливішим наслідком цієї анархії стало скорочення й без того нечисленного населення через бомбардування, бандитські напади та стихійні лиха.\n\nДля так званої «проблеми репопуляції» було розроблено кілька різних рішень, але одне з них особливо вирізняється. Уже певний час жінки працюють нарівні з чоловіками на деяких посадах, що їм підходять. Спочатку це було продиктовано необхідністю, але тепер, коли становище поступово нормалізується, варто відзначити додаткову продуктивність, яку жіночі робочі руки забезпечують на виробництві. З іншого боку, однак, жіноча природа полягає в народженні дітей. Якщо жінки працюють, вони не можуть народжувати дітей, і навпаки.\n\nЯкщо ми знову обмежимо можливості жінок працювати й просуватися по службі, доки вони не народять установлену кількість дітей, це водночас заохотить їх до материнства, але не заборонить їм працювати цілковито, як могли б запропонувати деякі реакційні посіпаки. Безперечно, якщо ми вирішимо розширити цю програму, продуктивність може знизитися, бо частина жінок залишить роботу заради народження дітей, зате народжуваність помітно зросте.\n\nЗрештою, рішення залишається за головою."
 TYM.15.a: "Ні. Ми мусимо заступитися за наших сестер."
 TYM.15.b: "Зробити це. Від нас залежить майбутнє Росії."

 TYM.16.t: "Революційні ясла"
 TYM.16.d: "Однією з найважливіших складових нашої програми репопуляції стало створення так званих революційних ясел - мережі цивільних організацій, присвячених вихованню дітей і догляду за ними. Під пильним наглядом партії ці ясла також запровадили низку різноманітних освітніх програм як для дітей, так і для жінок, які ними опікуються, створюючи осередки майбутніх ідеологів та совєцьких ревнителів.\n\nОднак постало питання про конкретний порядок управління яслами. Їхній стрімкий успіх спонукав кілька зацікавлених груп домагатися контролю над ними, адже чимало людей бачать у яслах шлях до майбутнього успіху й впливу. Зрештою, Каґановіч і його найближчі радники зібралися, щоб визначити подальший курс і оголосити, хто отримає остаточний контроль над цими установами з виховання дітей. Після, здавалося б, багатогодинних нарад вони звузили перелік претендентів на управління яслами до двох можливих кандидатів: місцевих комун і війська.\n\nЯкби контроль над яслами отримали місцеві комуни, діти виховувалися б у власних громадах, де їм прищеплювали б не лише розуміння важливости громади й родинної єдности, а й давали справедливу та необхідну цивільну освіту, доступну кожному юнакові. З іншого боку, якби яслами керувало військо, вони стали б значно централізованішими, а діти виростали б із сильнішою загальною ідентичністю, ніж прив'язаністю до власної громади. Крім того, військо, звісно, було б так само зацікавлене, як і ми, у вихованні майбутнього покоління солдатів, буквально від народження підготовлених битися й помирати за Союз.\n\nКоли ніч уже добігала кінця, дорадча рада Каґановіча, затамувавши подих, чекала на його остаточне рішення..."
 TYM.16.a: "Ними керуватиме військо."
 TYM.16.b: "У розумних межах нехай кожна комуна вирішує сама."

 TYM.17.t: "Відбудова Червоної Армії"
 TYM.17.d: "Валєрій Константіновіч Зіма вдихнув холодне сибірське повітря. Офіцер армії Каґановіча впродовж останніх кількох років майже нічого не знав, крім бункерів і навчальних тривог під час бомбардувань, і хоча зимовий мороз цього холодного ранку, здавалося, пронизував його до кісток, він майже не відчував холоду - надто вже приємним було свіже повітря на обличчі та в легенях. Досвідчений совєцький солдат оглянув те, що жартома називав перед товаришами своєю «отарою», - строкатий гурт призовників з усіх верств суспільства. Серед них був Швєц, виходець із бідної родини переселенців: його ніс ламали стільки разів, що й не злічити, а худорлява статура й низький зріст виказували родинну нужду та недоїдання. Був Філіппов, син зганьбленого інтелектуала, що тримався з нічим не заслуженою пихою, і Віноґрадов, чия гладкувата постать чимало розповідала про його походження четвертого сина партійного чиновника.\n\nЦі троє були лише кількома знайомими обличчями в натовпі з далеко більш ніж десятка людей. Попри довгу службу, Зіма все ще посідав до нестями низький щабель у командній структурі Республіки. Він дивився, як його бійці намагаються вишикуватися, і зітхав, помічаючи кричущі вади, про які самі солдати, мабуть, навіть не здогадувалися. Роботи було багато, подумав Зіма. Та коли один солдат мало не наштовхнувся на іншого, він викинув тривоги з голови й знову глибоко вдихнув свіже повітря - повітря в бункері було найгіршим, нагадав він собі.\n\nКоли він видихнув, груди сповнило почуття гордости, якого він не відчував уже дуже, дуже давно. «Товариші!» - гаркнув він, випромінюючи гордість на своїх підопічних. «Час опанувати основи!»"
 TYM.17.a: "«Почнемо зі стройового кроку»."

 TYM.18.t: "Уперед на гусеницях"
 TYM.18.d: "«Товаришу Крєвчєнко, заведімо знову цю стареньку, га?»\n\nКапітан Євґєновіч відчинив командирський люк і визирнув назовні, поки його механік-водій Крєвчєнко брався до роботи. Двигун гучно заревів, і старий Т-54 уперше за кілька років ожив. Спогади про минулі битви й пригоди майже миттєво нахлинули на капітана, який завжди почувався як удома, сидячи в танку разом із товаришами. Тепер, коли небо очистилося, Червона Армія знову могла пустити в діло свою бронетехніку. Капітан Євґєновіч нахилився назад усередину танка й легенько штовхнув водія ногою, щоб привернути його увагу.\n\n«Гаразд, товаришу, час обтрусити іржу. Виведи нас зі складу, повільно й обережно». Крєвчєнко кивнув у відповідь, а Євґєновіч повернувся до попереднього положення. Двигун знову гучно заревів, Т-54 різко сіпнувся, аж капітана трусонуло, і поволі рушив уперед. Коли танк викотився зі складу в сонячне світло, капітан Євґєновіч відчув себе могутнішим, ніж будь-коли.\n\nТанк, можливо, був уже доволі застарілим, але працював як новенький. Біля складу стояло кілька інших солдатів, і вони не могли відвести погляду, коли перед ними постали броньований звір і його тріюмфальний командир. Молодші новобранці на кшталт них, мабуть, іще ніколи не бачили повністю справного танка в дії, і капітан знав, наскільки разючим мало бути це видовище. Піднесений Євґєновіч тепер аж сяяв від радости й час від часу махав рукою тим, хто прийшов подивитися. Нарешті старий танкіст повернувся туди, де йому належало бути."
 TYM.18.a: "Уперед на гусеницях, товариші!"

 TYM.19.t: "Випробування"
 TYM.19.d: "«Гей, Юрію, не скидай швидкість, коли під'їдемо до того схилу, навіть не думай гальмувати. Хочу побачити, чи зможе ця штука злетіти!» Юрій почув командира, який кричав, щоб його голос було чутно в неймовірно гучному нутрі танка, але не повернувся до нього. Відвести погляд від траси означало накликати лихо.\n\n«Ви певні, що це розумно, товаришу?! Від удару ми всі можемо загинути!»\n\n«Ми в танку, дурню! Усе буде гаразд! Тримай швидкість, Юрію!» Коли Юрій увійшов у поворот, попереду нарешті показався підйом. Усупереч власному здоровому глузду він вирішив виконати наказ командира. Офіцери, які спостерігали збоку, дещо занепокоїлися, коли Т-54, наближаючись до природного трампліна, не сповільнився, як зазвичай.\n\nТанк налетів на схил, і, як і боявся Юрій, через швидкість на мить здійнявся в повітря. Тим часом спостерігачі із захватом і легким жахом дивилися, як танк несамовито перевалився через трамплін. Гуркіт удару було чутно навіть крізь рев двигунів інших танків, що долали смугу перешкод. Знову зустрівшись із землею, танк завмер.\n\nПісля кількох напружених митей він відновив свій невпинний рух трасою, а вздовж узбіч подекуди вибухали оплески й радісні вигуки. Дехто зі старших офіцерів зневажливо пирхав через безрозсудність цього трюку, та навіть вони не могли не захоплюватися запалом новобранців."
 TYM.19.a: "Запалу їм точно не бракує."

 TYM.20.t: "Тактика прориву"
 TYM.20.d: "«Вітаю, товариші з бронетанкового корпусу Червоної Армії. Сьогодні вас зібрали тут, щоб навчити ефективно використовувати бронетанкові частини для розвитку проривів на полі бою. Розпочніть сьогоднішній урок із того, що викиньте з голови все, що ви досі знали про ведення війни бронетехнікою. Скажу відверто: від часів воєн проти фашистів усе змінилося, а покладатися на стару тактику було б майже самогубством!»\n\nОфіцери бронетанкових військ, з яких складався клас, ретельно занотовували слова генерала. Кімнату заполонив шурхіт олівців.\n\n«Вийти на сучасне поле бою, не знаючи, які небезпеки там чекають, означало б цілковиту катастрофу. Переносні ракетні комплекси та спеціялізовані боєприпаси дають ворогові таку здатність нищити танки, якої ви й уявити не можете. Щоб вижити, товариші, ви мусите навчитися пристосовуватися.\n\nВід того, чи дослухаєтеся ви до моїх слів на сьогоднішньому невеликому занятті, залежатиме, чи покотитеся ви до славної перемоги, чи загинете у вогняній погибелі. Не помиляйтеся, товариші: якщо ви загинете й заберете із собою свої дорогі танки, то станете для Червоної Армії гіршими за непотріб, тож слухайте уважно!»\n\nОфіцери й далі шкребли олівцями по записниках, час від часу поглядаючи вгору, аби показати викладачеві, що вони таки слухають."
 TYM.20.a: "«А тепер, перш ніж продовжимо, є запитання?»"

 TYM.21.t: "Звіти про бойову ефективність"
 TYM.21.d: "Капітан Макаров оглядав у бінокль безкраї сибірські рівнини. Він поволі вивчав обрій, приділяючи увагу кожному дивному обрису й кожній можливій плямці на лінзі. Зрештою він виявив ціль. Макаров відклав бінокль і подав знак решті свого загону. Настав час вирушати. Група танків із гудінням покотилася рівною землею.\n\nБандитський табір упав майже без опору. Благенькі тимчасові намети легко розчавили двадцять п'ять тонн совєцької інженерної думки. Самі бандити спробували чинити слабкий опір зі стрілецькою зброєю, а тоді кинулися тікати в усі боки. Кількох узяли в полон. Не стільки, скільки хотілося б капітанові Макарову, але загалом завдання однаково було виконане успішно. Без своїх припасів бандити більше не могли тероризувати місцеві села.\n\nКоли сонце заходило перед ними, а позаду димів бандитський табір, капітан Макаров зі своєю танковою ескадрою рушив назад до бази, прагнучи якнайшвидше взятися за наступне завдання. Гудіння танків супроводжувало їх усю дорогу."
 TYM.21.a: "Створені знищувати."
 
 TYM.22.t: "Знову в похід"
 TYM.22.d: "Сержант Кузнєцов перебирав у руках сторінки звіту. Його люди впоралися винятково добре, фактично майже бездоганно, але все одно не виправдали його сподівань. Він іще раз пробіг очима папери, а тоді поклав їх на стіл. Сержант засвистів, скликаючи солдатів.\n\nЙого люди розбрелися по різних наметах: хтось розмовляв, хтось грав у карти, а хтось узагалі нічого не робив. Виснажені цілоденними військовими навчаннями, вони мліли під теплим полудневим сонцем, яке заколисувало натруджені м'язи й важкі повіки в невинній напівдрімоті, де трава була м'якою, а денна праця вже майже скінчилася. Свист розтрощив їхню наївну дійсність, і невдовзі вони вишикувалися в кілька рівних шеренг, готові слухати свого командира.\n\n"І це ви називаєте своїм найкращим результатом!?" - виплюнув Кузнєцов.\n\nКілька солдатів здригнулися, але ніхто не відвів погляду.\n\n"Ви й наступного разу так ледарюватимете, коли бандити нападуть на село!? Сядете, закурите й дивитиметеся, як вони ріжуть жінок і дітей?!" - закричав він на солдатів. "Ну? Відповідайте!"\n\n"Ні, товаришу сержанте!" - пролунала одностайна відповідь.\n\n"Тоді поверніться на позиції! Повторюємо вправу від початку, і цього разу зробіть усе як слід!""
 TYM.22.a: ""Так точно!""

 TYM.23.t: "Повернення комісарів"
 TYM.23.d: "Алєксєй Ільїн був новачком. Новачків не любить ніхто, а загартовані в боях російські солдати - й поготів. Особливо коли цей новачок - політрук.\n\nАлєксєй натягнув на обличчя привітну, але стриману усмішку. Він хотів їм сподобатися. Якщо він їм сподобається, вони можуть зрештою йому довіритися. Він простягнув праву руку для привітання, а лівою притримував біля боку сумку з одягом та особистими речами.\n\nКапітан, до якого його приписали, подивився на руку Алєксєя так, ніби в ній був ніж. Він обережно простягнув свою й незручно коротко потис її.\n\n"Твоя койка ось тут", - мовив він, злегка кахикнувши. Він показав на нижнє ліжко двоярусної койки в кутку, далеко від вікон та інших солдатів.\n\nАлєксєй кивнув і спокійно підійшов до свого ліжка. Дорогою він відчував, як погляди нових товаришів пропалюють у ньому діри. Кожному він усміхнувся, а кільком навіть махнув рукою. Діставшись койки, Алєксєй витяг свої нечисленні пожитки, зокрема невеличкий записник. Поки солдати перешіптувалися й пліткували про нього, Алєксєй складав перший звіт про бойовий дух своєї роти."
 TYM.23.a: "Улиття до колективу минуло легше, ніж очікувалося."

 TYM.24.t: "Герої соціялізму"
 TYM.24.d: "Рядова Валєрія Осіпова оглянула натовп. Усі радісно вигукували. Вигукували на її честь. Вона витягнула шию, шукаючи матір. За кілька секунд вона побачила її біля самого помосту: мати вітала її гучніше за всіх. Осіпова всміхнулася їй, а тоді знову спрямувала погляд уперед - незворушна й відважна, якою й належить бути героїні.\n\nВона стояла на помості на міській площі разом із кількома високопоставленими партійцями й, що найважливіше, головою Каґановічем. Позаду них висіли прапори Західноросійської Народної Республіки та Совєцького Союзу.\n\n"Сьогодні ми зібралися тут, щоб ушанувати товаришку Валєрію Осіпову за відвагу, виявлену під час порятунку цілої родини від німецького нападу, - почав голова, промовляючи в мікрофон, який розносив його голос усією площею. - Товаришка Осіпова ризикувала власним життям, щоб урятувати родину з п'ятьох осіб після бомбардування їхнього господарства. Вона пробралася крізь руїни, визволила їх із палаючих уламків і навіть змогла повернути до життя одну дитину, яка без її допомоги загинула б. За цей доблесний учинок я нагороджую товаришку Осіпову званням Героя Народної Республіки".\n\nКаґановіч приколов їй на груди просту, але виразну медаль і почав аплодувати. За ним заплескали партійці, потім натовп, і невдовзі вся площа аплодувала Валєрії Осіповій, Герою Народної Республіки."
 TYM.24.a: "Тричі слава товаришці Осіповій!"

 TYM.25.t: "День возз'єднання"
 TYM.25.d: "Сьогодні по обіді генеральний секретар Каґановіч виголосив про відродження та возз'єднання Західносибірської Народної Республіки у величній промові перед багатьма тисячами робітників і бійців Червоної Армії, що зібралися в центрі Тюмєні. "Саме знання, а не рушниця, є наймогутнішою зброєю в арсеналі робітників, - сказав генеральний секретар, - і, озброєний безсмертною наукою діялектичного матеріялізму, осягнутою геніяльним розумом Сталіна, робітничий клас одного дня відправить своїх буржуазних гнобителів на смітник історії!"\n\nТривають широкі приготування до возз'єднання Західного Сибіру, зокрема мобілізація армії, збільшення щорічного призову та нарощування виробництва зброї, щоб здолати ліберальних контрреволюціонерів, які загарбали землі робітників."
 TYM.25.a: "Уперед!"

 TYM.26.t: "Старі солдати"
 TYM.26.d: ""...а в чому саме реваншизм Карбишева є надмірним?" - гаркнув старшина Лєбєдєв.\n\n"Товаришу старшино, він ставить націю вище за клас!" - хором вигукнули новобранці.\n\nЦе було останнє питання на сьогодні, відзначив Лєбєдєв.\n\n"Чудово, панянки, - сказав він. - Схоже, ви добре знаєте своїх ворогів. За кілька годин штаб-сержант Ґусєв перевірить вашу влучність. А поки що ви вільні".\n\nСолдати вийшли з казарми. Дочекавшись, поки піде останній, Андрєй Лєбєдєв дістав від друга пляшку горілки й ковтнув. День у день він розповідав свіжому м'ясу про жахіття Чорної Ліги. Про Омск. Про нього. Андрєй стримував спогади про часи, коли був ад'ютантом Карбишева, і чув від нього поради щодо командування й тактики. Про сонячне світло, що різало очі того дня, коли він повернувся, досі в шрамах і крові. Андрєй знову ковтнув, намагаючись забути довгі безладні тиради Карбишева про "Великий Суд" та "природжену силу російського народу", а ще день, коли той зрікся соціялізму, революції та Комуністичної партії, проголосивши, що його Чорна Ліга служитиме лише помсті й війні.\n\nАндрєй допив пляшку. У горлі палало так само, як у голові."
 TYM.26.a: "Усі ми мусимо йти на жертви заради революції."

 TYM.27.t: "Тюмєнь ушановує наші зусилля!"
 TYM.27.d: "Сьогодні ми отримали несподівану звістку: Лазар Каґановіч, який нині править із Тюмєні, надіслав дипломатів повідомити про спорудження пам'ятника Нічним Відьмам. Тюмєнь бажає відкрити пам'ятник перед народом, нагородивши нашу очільницю Євдокію Бочарову званням Героя Народної Республіки.\n\nЦе, безперечно, велика честь, і Каґановіч, схоже, цілком щирий, однак він не бездоганний. Він диктатор, а його різновид комунізму особливо авторитарний. Прийнявши пропозицію, ми можемо опинитися в боргу перед людиною, яка воліла б позбавити нас свобод. Можливо, йому варто спрямувати свої зусилля на щось інше..."
 TYM.27.a: "Подякувати друзям за теплі слова."
 TYM.27.b: "Ми не терпітимемо цього жорстокого режиму."

 TYM.28.t: "Вільні авіятори відкинули нашу пропозицію!"
 TYM.28.d: "Наші дипломати повернулися ні з чим. Вочевидь, Вільні авіатори не захотіли нашої вдячности й заявили, що нам краще спрямувати зусилля на щось інше. Євдокія Бочарова відмовилася від нагороди й не приїде на відкриття пам'ятника.\n\nЦе обурливо! Ми лише хотіли вшанувати їхню боротьбу за захист Росії від Люфтваффе, а вони поводяться так, наче ми образили їхню честь! Вони навіть мали нахабство назвати генерального секретаря Каґановіча тираном і заявити, що відмовляються розмовляти з тим, хто позбавляє народ свобод."
 TYM.28.a: "Як вони сміють?"

 TYM.29.t: "Вільні авіятори дякують нам!"
 TYM.29.d: "Вільні авіатори люб'язно прийняли нашу вдячність, а Євдокія Бочарова прилетіла особисто отримати нагороду. Схоже, Вільні авіатори оцінили нашу доброзичливість, і церемонію нагородження вирішили провести перед присвяченим їм пам'ятником.\n\nЦеремонія минула досить гладко: погода була сприятлива, а температура - порівняно комфортна як для сибірського дня. Євдокія піднялася на трибуну, радо прийняла медаль, яку генеральний секретар Каґановіч повісив їй на шию, і виголосила коротку промову з подякою народові Каґановічграда. Генеральний секретар, можливо, волів би, щоб Євдокія подякувала в промові йому особисто, але не виказав невдоволення. Після її виступу кілька пілотів виконали повітряні маневри над натовпом, а завершення церемонії ознаменував військовий гарматний салют."
 TYM.29.a: "Початок прекрасної дружби!"

 TYM.30.t: "Возз'єднання з Тюмєнню?"
 TYM.30.d: "До нас прибули дипломати з Каґановічграда. Вони прийшли не для того, щоб запевнити нас у вдячності чи дружбі Західносибірської Народної Республіки, а щоб зробити пропозицію.\n\nГенеральний секретар Лазар Каґановіч пропонує Вільним авіяторам увійти до складу Західносибірської Народної Республіки. Тепер, коли наші держави межують, вони не бачать причин, чому ми маємо залишатися в ізоляції та самотності. Якщо ми погодимося, вони обіцяють військові почесті кожному пілотові та винагороду цивільному населенню за його самовідданість.\n\nЦе не що інше, як повне приєднання, і його слід ретельно обміркувати. Згода означатиме кінець нашої незалежности, але водночас назавжди розв'яже проблему нестачі ресурсів, а цивільним більше не доведеться йти на такі жертви задля утримання наших літаків.\n\nПроте Каґановіч не змінився. Він тиран, який не терпить жодного відхилення чи виклику. Приєднання означатиме не лише кінець нашої незалежности, а й нашої свободи.\n\nЩо краще: жити під владою тирана чи загинути, зберігши свободу? Якщо ми відмовимо, поблажливості Каґановіча напевно настане край, і нашим пілотам, можливо, доведеться збивати російські літаки замість німецьких. Перед нами вибір, у якому немає доброї відповіді. Що ж ми скажемо?"
 TYM.30.a: "Ми знову служитимемо соціялістичній революції."
 TYM.30.b: "Каґановіч - тиран у геройському вбранні. Ми відмовляємося."

 TYM.31.t: "Повітряні сили повернулися"
 TYM.31.d: "Посол у Сурґуті повернувся з чудовими новинами: після кількох тижнів переговорів Вільні авіятори погодилися приєднатися до нашої держави й використати свою повітряну міць для захисту соціялістичної революції в Тюмєні. Просто зараз цивільний персонал перевозять до їхньої колишньої столиці та на нову авіябазу Народної Республіки, де його навчатимуть авіятори, а наші заводи будують бойові літаки, щоб посилити цю пілотську силу. Нарешті робітничий клас знову має власні повітряні сили, які захищатимуть бідних і пригноблених усього світу від капіталістичного гніту!"
 TYM.31.a: "Вітер прошепоче, коли прилетять Нічні Відьми!"
 
 TYM.32.t: "Авіатори пішли проти нас!"
 TYM.32.d: "Сьогодні вранці переговори в Сурґуті зірвалися: представники Вільних авіаторів просто відмовилися прийняти наші пропозиції допомоги й ресурсної підтримки з Тюмєні, назвавши генерального секретаря Каґановіча "тираном у геройському вбранні", який "не вірить ні в що, крім власної влади". Їхня невдячність так само приголомшує, як і не має пояснення, адже ми лише намагалися укласти угоду, яка зрештою принесла б користь усім.\n\nХоч би чому вони вирішили налаштуватися проти нас, очевидно, що їхнє панування в повітрі разом із новою ворожістю робить Вільних авіаторів загрозою безпеці революції. Напад на Сурґут буде складним, але наші генерали передбачають: якщо вдаримо досить швидко, то зупинимо цих вискочок, перш ніж вони загрожуватимуть трудовому народові самої Тюмєні."
 TYM.32.a: "То де там моя КС-19?"

 TYM.33.t: "Заколот у наших лавах!"
 TYM.33.d: "Кілька випадків непокори цілком очікувані. Кілька сотень - уже тяжка аномалія.\n\nКількість зрад, заколотів і дезертирства в армії сягнула тривожного рівня й майже не подає ознак припинення цього зрадницького зростання. Пересічний солдат почав ставити великі, важливі й, передусім, небезпечні питання. За що ми воюємо? За що маємо воювати? Що робити, якщо відповіді на попередні два питання не збігаються?\n\nПричина новоявленої філософської схильности нашої піхоти - не хто інший, як соціялістичні баламути з Тюмєні. Каґановіч хоче загарбати нашу землю й зустріне значно менше опору з боку армії, яка більше думає, ніж стріляє. Його лазутчики та пропагандисти зробили свою справу, і тепер наші війська воюють самі із собою.\n\nУсе можливе для обмеження шкоди вже зроблено. Зрадників розстріляно. Бунтівних офіцерів покарано напоказ. Чи вистачить цього, щоб протистояти червоній хвилі, ще належить побачити."
 TYM.33.a: "Цілься й стріляй - жодної поезії."

 TYM.34.t: "Республіка знову стоїть!"
 TYM.34.d: "Сепаратистські держави Омска та Свєрдловска офіційно оголосили про капітуляцію, зробивши возз'єднання Західносибірської Народної Республіки доконаним фактом після кількох років безладу.\n\n"Розкол Народної Республіки контрреволюціонерами став однією з найтемніших сторінок у літописі соціялізму від часів фашистського вторгнення 1941 року, - заявив Каґановіч у промові в центрі Тюмєні на честь возз'єднання. - Та, озброєний сталіністською теорією, розум класово свідомого пролетаря зміг здобути перемогу над рушницями буржуазії!"\n\nНа честь возз'єднання Західного Сибіру готують численні святкування, зокрема загальнодержавний вихідний для робітників, військові паради у великих містах і безплатні семінари зі сталінізму в освітніх закладах."
 TYM.34.a: "Багряний стяг знову замайорить!"

 TYM.35.t: "Відновлення наших кордонів"
 TYM.35.d: "Після возз'єднання Західносибірської Народної Республіки державна Президія звертає погляд на об'єднання всього Західного Сибіру під прапором сталінізму. У промові перед тисячами людей у центрі Тюмєні Лазар Каґановіч заявив: "Від Лєнінґрада до Владівостока буржуазія відчуває великий дрож під ногами. Це чоботи робітників, що йдуть війною на своїх гнобителів. Озброєна знанням сталіністської теорії й нестримна у своїй люті, хвиля пригноблених буде нездоланною!"\n\nАрмію вже мобілізовано на кордонах Республіки, і вона готова вдарити по буржуазних сусідах. Із лав завзятих призовників формують нові підрозділи. По всій державі люди готуються відбудувати Совєцький Союз."
 TYM.35.a: "Знову до перемоги!"

 TYM.36.t: "Торговельні каравани заарештовано!"
 TYM.36.d: "Останні кілька тижнів із кордону з Тюмєнню надходять тривожні повідомлення. Порушуючи укладені раніше торговельні угоди, озброєні патрулі, що відкрито несуть знамена покійної Західноросійської Народної Республіки, без належних підстав затримують наші торговельні каравани.\n\nЇхні офіційні дипломати стверджують, що каравани не мали належних дозволів, перевозили крадені товари чи займалися бандитизмом, але ми знаємо, що це брехня. Очевидно, Каґановіч та його посіпаки націлилися на наш клапоть російської анархії, щоб угамувати свою жагу до експансії. Ці незаконні напади на наші каравани - прелюдія до повномасштабного вторгнення.\n\nА поки що мусимо чекати. Схоже, червоні задовольняються переслідуванням наших найменш цінних караванів. Відтепер ціннішим експедиціям радитимуть уникати кордону з Тюмєнню. Відносини можуть бути напруженими, а війна - маячити на обрії, але це навряд чи привід припиняти цілком прибуткову справу."
 TYM.36.a: "Це порушення нашого протоколу про ненапад!"

 TYM.37.t: "Комуністична агітація в наших містах!"
 TYM.37.d: "Листівки з чіпкими, зухвалими й незаконними гаслами кружляють вулицями разом із вітром. Плакати з простими наочними зображеннями класової боротьби з'являються на будівлях швидше, ніж влада встигає їх зривати. Групи людей збираються в мертвій нічній темряві й обмінюються ідеями, книжками та планами. Стихійні страйки паралізують заводи, поки сп'янілі фантазіями про рівність робітники сліпо кусають руку, яка їх годує.\n\nЦе не природне явище. Це справа агітаторів, зрадників і шпигунів. Усі вони походять з одного місця, і розслідування підтвердило те, що й так усі знали: з Тюмєні.\n\nСхоже, Каґановічу замало тиранити власну частину Росії, і він вирішив обрушити червоний гніт на наших громадян. Те, що починається як невеличкий, нібито незалежний рух, виросте в народну революцію, яка зустріне тюмєнських солдатів як визволителів. Цього не можна допустити."
 TYM.37.a: "Єдиний добрий комуніст..."

 TYM.38.t: "День відновлення"
 TYM.38.d: "Західносибірська Народна Республіка знову єдина! По всій нашій славетній державі чути, як співає народ і сурмлять труби, як наші солдати йдуть парадом вулицями міст, що вітають не лише своє визволення, а й нове російське процвітання. Усі вони вигукують одне: слава Росії та слава Каґановічу, її визволителю! Єдиний Західний Сибір - лише перший крок до єдиної Росії, і ми віримо, що під проводом нашого вождя неодмінно досягнемо успіху.\n\nСьогодні Каґановіч виступив перед величезним натовпом у Тюмєні, а через гучномовці - перед людьми в усьому Західному Сибіру, проголосивши визволення Західного Сибіру та возз'єднання Західносибірської Народної Республіки. Народ здобув свою найбільшу перемогу, сказав він радісній публіці, і тепер народний авангард цілковито контролює Західний Сибір під керівництвом партії та її вождя Лазара Каґановіча. Із Західного Сибіру немає яснішого шляху, ніж шлях до визволення Росії! Народний уряд уже тут!"
 TYM.38.a: "За Союз!"

 TYM.39.t: "У майбутнє"
 TYM.39.d: "Реформи завершено! Ніколи раніше в совєцькій історії розвинені сили держави не були такими міцними, і тепер уся роздроблена Росія тремтить перед нашою могутністю. Тепер, ставши визволителями російської житниці, ми маємо поширити революцію на решту колишнього Союзу, щоб принести нове процвітання під керівною рукою реформ Каґановіча. Нам удалося поширити реформи на всю Народну Республіку, і землі, якими раніше володіли слабкі реакційні воєначальники, тепер під законною владою Росії та її сильного й згуртованого народу.\n\nЗ тими, хто опирався диктатурі пролетаріяту, вчинили як належить, народ завзято працює заради возз'єднання, а міста, що колись були незначними крапками на мапі, тепер стали промисловими центрами, де сталь перетворюється на знаряддя народу! З нашої нової міцної промислової бази в Західному Сибіру шлях до возз'єднання Росії очевидний: спершу дріб'язковий, чварний Урал, а потім Західна Росія, де опір шляху революції буде сильнішим, ніж будь-коли. Товариші, вперед! За Батьківщину, за Каґановіча!"
 TYM.39.a: "Ура!"

 TYM.40.t: "Продовження П'ятирічного плану"
 TYM.40.d: "Спершу це був кістяк із металу й дерева. Тонкі балки й крихкі опори стирчали під дивними кутами, викликаючи цікаві погляди містян. Діти гралися на кроквах і брали одне одного на слабо, перестрибуючи прогалини на третьому поверсі.\n\nТа споруда поволі поставала, деталь за деталлю. Одного дня всередину зайшли робітники: чоловіки й кілька жінок у простих бездоганних комбінезонах стали на свої місця, готуючись до першого робочого дня.\n\nІ тоді завод заревів.\n\nПо всій Західносибірській Народній Республіці індустріялізація здобуває одну перемогу за іншою. Народ має роботу. У крамницях є товари. Продуктивні сили розвиваються. Безплідна сибірська пустка, де колись були лише поодинокі кустарні майстерні й господарства, воскресає в палахкотливому вогні виробництва.\n\nЗусиллями народу, партії та, звісно, товариша [TYM.GetLeader] революція рухається вперед. І все ж, поки плянувальники й архітектори метушаться державними установами, поки механічні звірі вивергають поступ у повітря, а робітники рвуть і бруднять нові комбінезони, це лише початок."
 TYM.40.a: "Ніхто не встоїть перед могутністю прогресу!"

 TYM.41.t: "Уроки минулого"
 TYM.41.d: "Маршал Іван Конєв розглядав вицвілі бойові плани в майже непроглядній темряві військового архіву. Йому світила єдина свічка. Його руки простежували прикро недосконалу тактику командирів, які померли двадцять років тому. Картини битв раз у раз поставали в його голові й завжди доходили однакового висновку: поразки.\n\nМаючи за плечима десятиліття досвіду, він легко бачив помилки товаришів і власні. Дивізію туди. Постачання перенаправити сюди. Утримувати цю точку. Уявні війни переверталися, мов пісочний годинник. Зрештою пісок вичерпався, а Конєв залишився з перемогою.\n\n"А як могло бути?" - подумав він. Тоді похитав головою. Не було сенсу роздумувати про інші можливості, коли попереду чекала аж надто справжня війна. Російські зрадники й німецькі фашисти не дадуть йому розкоші знати їхні кроки наперед.\n\nПовіки Конєва налилися вагою. Було вже дуже пізно, і зосередитися на розпливчастому чорнилі та нерозбірливому почерку ставало дедалі важче. Він востаннє глянув на стародавню тактику. Колись вона вже зазнала невдачі, але більше цього не станеться. Цього разу вона мусить спрацювати. Він простягнув руку до свічки й задушив полум'я вказівним і великим пальцями, затопивши кімнату густою темрявою."
 TYM.41.a: "Що можуть розповісти могили?"

 TYM.42.t: "Привид"
 TYM.42.d: "Привид блукає Росією. Німецьке Люфтваффе не змогло його знищити. Священний союз фашистів, реакціонерів і капіталістів не зміг його вигнати. Його не здолати ані людям із плоті, ані машинам зі сталі.\n\nПривид почав дивитися далеко за межі наших штучних кордонів. Він блукає темним континентом Європи, вислизаючи від німецьких поліцаїв-шпигунів та офіцерів СС. Він звивається серед азійських рисових полів, де корінні робітники гарують на японські корпорації. Він повзе Африкою, надихаючи мрії про вільний континент. Він летить над південноамериканськими джунглями й стежить за щупальцями імперіялізму. Він ховається у профспілкових залах і на заводах Північної Америки, підточуючи найбільшу фортецю капіталу. Привид блукає світом, і світ справді нажаханий.\n\nНаша держава - лише легкий подих цього привида, один солдат у глобальній класовій війні. Однак її роль годі переоцінити. Як приклад справжнього, дієвого соціялізму для міжнародного пролетаріяту, ми зобов'язані простягнути руку рухам однодумців, протистояти реакціонерам, які загрожують революції, та наближати світ до комунізму."
 TYM.42.a: "Пролетарі всіх країн, єднайтеся!"

 TYM.43.t: "З Росії з любов'ю"
 TYM.43.d: "Лист перетнув гори й моря. Він прослизнув крізь руки фашистів і цензорів. Захищений печаткою офіційного вигляду та безапеляційною манерою свого носія, дорогий папір дістався президентського столу.\n\n"До Сполучених Штатів, - починався лист. - Значна частина анархічної російської пустки повернулася до лона законного совєцького уряду на чолі з головою Каґановічем, а решта невдовзі піде за нею. Ми усвідомлюємо, що Сполучені Штати, попри свою капіталістичну природу, протистоять фашизмові в усьому світі, як і за часів Другої світової війни. З огляду на екзистенційні загрози з боку Японської та Німецької імперій, законний російський уряд зацікавлений у тому, щоб між нашими народами не було ворожнечі".\n\n"Однак знайте: агресії проти Росії чи дій усупереч інтересам міжнародного соціялізму ми не терпітимемо. Росія відродилася й стане або небезпечним ворогом, або цінним союзником.\n\nВерховний Совєт СССР""
 TYM.43.a: "Схоже, червоний знову в моді."

 TYM.44.t: "Совєцьке привітання"
 TYM.44.d: "Нашим казахським товаришам,\n\nСоюз Совєцьких Соціялістичних Республік відроджено під керівництвом голови Каґановіча та згідно з його баченням. Ми зробили перші кроки до побудови соціялізму в Росії, але прагнемо також створити справді інтернаціоналістичний рух.\n\nЯк колишній член Союзу, ваша республіка, сподіваємося, допоможе нам розвинути взаємовигідні відносини співпраці з можливістю в майбутньому відновити Союз у повному складі. А поки що ми пропонуємо простий договір про ненапад, щоб заявити світові про нашу спільну готовність розвивати міжнародний соціялізм.\n\nЗначна частина Росії досі охоплена хаосом і перебуває під владою реакціонерів. Ширший світ мало чим відрізняється. У ці темні часи дружба й співпраця - наш щит від загибелі."
 TYM.44.a: "Ми згодні!"

 TYM.45.t: "Зброя від Президії"
 TYM.45.d: "Нашим казахським, туркменським, киргизьким і таджицьким товаришам,\n\nУ дусі інтернаціоналізму ми надіслали вам кілька партій озброєння для самозахисту від бандитів та імперіялістичних держав. Світ досі залишається небезпечним темним місцем, поділеним між трьома імперіями. На лініях розлому, де стикаються їхні сфери, конфлікт неминучий.\n\nУ прийдешні роки, коли Росія підніматиметься під керівною рукою голови [TYM.GetLeader], ваш регіон напевно також набуватиме дедалі більшої геополітичної ваги. Революцію слід захищати і від зовнішніх, і від внутрішніх загроз. Сподіваємося, ця військова допомога добре прислужиться вашим державам у захисті соціялізму."
 TYM.45.a: "Ми згодні!"

 TYM.46.t: "Засудження з Уралу"
 TYM.46.d: "Міністерство закордонних справ отримало повідомлення про публічний дипломатичний осуд від утворення, яке називає себе Західносибірською Народною Республікою. Цей уряд, що править зі східного міста Тюмєні, заявляє про правонаступництво поваленого Совєцького Союзу. Його очолює голова Комуністичної партії Лазар Каґановіч, який називає свій курс "антиревізіоністським". Послання, безсумнівно написане під великим впливом голови, звучить так:\n\n"Японська імперія, одна з провідних імперіялістичних держав Землі, є одним із найогидніших ворогів світового пролетаріяту. Під виглядом протистояння європейському імперіялізму вона військовою силою окупувала й увела до своєї "Сфери співпроцвітання" низку азійських країн, лише щоб іще більше поневолити їх під власною владою. Серед її злочинів - вторгнення, окупація та підкорення Китаю й масове винищення його мешканців, систематичне викачування ресурсів Маньчжурії та Південно-Східної Азії заради власних потреб, широке застосування рабства у формі "ромуша" й подібних систем, підтримка кривавих фашистів у колишньому Совєцькому Союзі, придушення народних рухів у Японії та за її межами, а також незліченна кількість інших злочинів. Японська буржуазія фактично злилася з державним і військовим апаратом, щоб поглиблювати гноблення та експлуатацію народів Азії, а за самою лише кількістю людей під її владою Японія є найбільшим фашистським режимом у людській історії. Завдання робітників світу - розтрощити цю жахливу імперію й дати народам Сфери співпроцвітання справжнє самовизначення".\n\nПозиція ЗСНР, цілком очікувана від комуністичної держави, є вкрай антияпонською. Якщо Каґановічу дозволять відродити Совєцький Союз, утримувати наш контроль над державами Східної Азії стане значно складніше."
 TYM.46.a: "Червона зоря сходить, кидаючи виклик Сонцю."
 
 TYM.47.t: "Нова комуністична ворожість"
 TYM.47.d: "Райхсміністр закордонних справ отримав повідомлення, що російська держава воєначальника, яка називає себе "Західносибірською Народною Республікою", виступила з дипломатичним засудженням Великонімецького Райху. Республіка, якою, за повідомленнями, керує голова [TYM.GetLeader], єврей, має столицю в Тюмєні й нібито проводить агресивнішу економічну політику, ніж її совєцькі попередники. Послання, їдка тирада, як і слід було очікувати, сповнена большевицьких кліше, звучить так:\n"Великонімецький Райх є однією з найбільших і, можливо, найкривавішою імперіялістичною державою в історії людства. Його фашистська, гіперреакційна ідеологія спонукала його вчинити найбільший геноцид у людській історії: винищення євреїв, поляків, росіян, балтів та інших народів Східної Європи в ім'я колоніялізму й імперської експансії. Широко застосовуючи рабство, засноване на расовому поділі, він здійснював огидну експлуатацію праці понад сорока мільйонів людей лише в Європі, а завоювання колишніх колоніяльних володінь в Африці збільшило це число ще на багато мільйонів. Совєцький Союз, світовий маяк робітничої боротьби, також став жертвою німецьких грабунків, що завдали його народові незліченних втрат і досі тривають через окупацію його основних земель. Отруйна ідеологія расизму, яка розколює робітничий клас лише для того, щоб приректи на злидні всіх його членів, ніде у світі не мала більшого успіху, ніж тут. Метою міжнародного робітничого руху має бути повалення цієї фашистської потвори й визволення народів як Німеччини, так і Східної Європи".\nЗСНР може стати загрозою в майбутньому, але нині вона ще слабка й оточена ворогами, а її погрози - лише брязкання зброєю. Нехай спробує кинути виклик гегемонії Райху. Скільки б разів большевики не повставали проти нас, вони завжди зазнаватимуть поразки."
 TYM.47.a: "Дитячі просторікування держави-уламка."
 
 TYM.48.t: "Зв'язатися з Центральною Азією"
 TYM.48.d: "Після більш ніж десятирічної ізоляції від товаришів з інших ССР комуністи Центральної Азії дістали надзвичайно приємний сюрприз: звістку від росіян! Дипломати й посланці Західносибірської Народної Республіки з півночі прибули до регіону з розповідями про прихильне керівництво та відроджену комуністичну систему під проводом держави, очільник якої добре усвідомлює помилки старого Совєцького Союзу. Вони обіцяють, що допомога, торгівля та кращі відносини не за горами, щойно ЗСНР налагодить постачання через досі неспокійну сільську місцевість. А поки що просять лише про визнання й запевнення, що, коли настане час, центральноазійські народи працюватимуть разом із ними над відбудовою Совєцького Союзу.\nДля Центральної Азії ця пропозиція, безперечно, приваблива. Допомога у відновленні розбитих і нерозвинених економік та зброя для дрібних прикордонних воєн стали б у пригоді. Зв'язок із зовнішнім світом уперше за багато років здається аж надто добрим, щоб бути правдою. Але сумніви є завжди: що буде, якщо Тюмєнь висуне вимоги, які порушать їхній суверенітет? Чутки, що просочуються з Тюмєні, змальовують "Залізного Лазара" значно владнішим, ніж можна подумати з райдужних оповідей його дипломатів. Якщо центральноазійські держави вирішать стати на шлях дружби із сибірським силовиком, попереду на них чекає багато доброго й багато такого, чого слід остерігатися."
 TYM.48.a: "Союз поволі зшиває себе докупи."
 
 TYM.49.t: "Солідарність із соціялістами"
 TYM.49.d: "Соціялізм у всьому світі поринув у темряву, коли згасло світло СССР. Тепер, коли його відновлено, ми мусимо зробити все, щоб це більше ніколи не повторилося. Робітники світу мають об'єднатися й ділитися знаннями, а тому ми мусимо встановити дипломатичні зв'язки із соціялістичними урядами всієї земної кулі.\n\nІз портів Далекого Сходу та Арктики дипломати вирушають до братніх держав Африки, Азії та обох Америк. Тим країнам, які не так далеко просунулися шляхом до комунізму, знадобиться керівництво досвідченішого старшого брата."
 TYM.49.a: "Єднайтеся, робітники світу!"
 
 TYM.50.t: "Привітати прихильні уряди"
 TYM.50.d: "Хоч світло соціялізму на довгі роки потьмяніло, деякі держави попри темряву залишилися вірними його шляху. Ізоляція зробила життя в цих країнах важким, адже з усіх боків їх оточують реакційні сили, які прагнуть заперечити саме їхнє існування. Тепер, коли Совєцький Союз повернувся, вони можуть не хвилюватися, знаючи, що мають друга й союзника.\n\nБудівництво посольств у столицях наших комуністичних друзів значно допоможе визнати законність їхніх урядів і зміцнити доброзичливість до нашого."
 TYM.50.a: "Ушануємо їхню боротьбу."
 
 TYM.51.t: "Поклик Комінтерну"
 TYM.51.d: "Протягом багатьох років соціялістичні та комуністичні організації в усьому світі були розпорошені й відокремлені одна від одної тиранічними імперіями, що охопили земну кулю. Відродження СССР дає чудову нагоду покласти край цій ізоляції та зібрати найсвітліші уми світу на одному форумі. Москва чи Лєнінґрад уже не є столицями революції, але Каґановічград готовий перебрати їхню мантію. Каґановічградська конференція обговорить усі аспекти соціялізму: від світової революції й економічного плянування до високої ідеології."
 TYM.51.a: "Інтернаціонал повертається додому."
 
 TYM.52.t: "Постання Комінформу"
 TYM.52.d: "Діяспора соціялістів, що прибула до Каґановічграда, вражає. Революційні бійці з Африки пліч-о-пліч стоять із членами Національного прогресивного пакту з Америки, палестинські араби та євреї з однаковою зневагою відвертаються одне від одного, а британські комуністи розмовляють із континентальними колегами. Обсяг інформації, якою тут обмінюються, незліченний, однак їх запросили сюди не лише для чемної бесіди за чаєм із печивом.\n\nКоли привітання змінюються обговоренням, делегатів спрямовують до потрібної теми. Після кінця Інтернаціоналу нова організація мусить посісти його місце. Товариш Каґановіч виголосив палку промову про важливість соціялістичного братерства, яку зібрані делегати зустріли бурхливими оплесками.\n\nВідтак товариш Каґановіч запропонував створити організацію, яка координуватиме соціялістичні рухи в усьому світі під доброзичливою керівною рукою СССР. Інформаційне бюро комуністичних і робітничих партій стане організацією, яка координуватиме соціялістичні рухи в усьому світі під доброзичливою керівною рукою СССР. Кожному урядовому делегатові пропонують приєднатися як повноправний або асоційований член."
 TYM.52.a: "Інтернаціонал має наступника."
 
 TYM.53.t: "Делегація до Каґановічграда"
 TYM.53.d: "Запрошення на Каґановічградську конференцію стало несподіванкою, адже після падіння Москви й Лєнінґрада ніхто не очікував, що Росія знову стане батьківщиною революції. Утім, ми завжди раді зустрітися із соціялістичними братами, тож швидко зібрали делегацію й зафрахтували літак до Совєцького Союзу.\n\nПопри занепалий стан Союзу конференція вражала. Товариш Каґановіч явно зробив усе можливе, щоб утрачу Москви не відчували надто гостро, і зібрання за відвідуваністю не поступалося Комуністичному Інтернаціоналу в часи розквіту революції. Іспанські анархісти та британські троцькісти, кубинські лєніністи й російські сталіністи - були присутні представники всіх можливих різновидів лівого руху. Такого зібрання умів це покоління ще не бачило.\n\nІ весь цей час скрізь був Лазар Каґановіч: тиснув руки й знайомився. До кінця вечора всі запам'ятають його ім'я, а він знатиме ім'я кожного. Кажіть про нього що завгодно - а багато хто так і робив, - але він старанний."
 TYM.53.a: "А тепер останнє оголошення..."
 
 TYM.54.t: "Ласкаво просимо до Комінформу"
 TYM.54.d: "Падіння Совєцького Союзу залишило малі соціялістичні держави світу без союзників у ворожому оточенні. Під час конференції Лазар Каґановіч оголосив план створення організації, яка знову об'єднає соціялістичний світ, - Інформаційного бюро комуністичних і робітничих партій, що координуватиме соціялістичні рухи в усьому світі й обмінюватиметься розвідданими заради поступу робітників світу.\n\nЯк горда соціялістична держава, ми отримали пропозицію про членство. І хоча наше найбільше бажання - допомагати справі соціялізму, дехто підозрює Каґановіча та СССР у прихованих намірах."
 TYM.54.a: "Ми радо приєднаємося."
 TYM.54.b: "Ми спостерігатимемо збоку як асоційований член."
 TYM.54.c: "Ми відмовляємося, адже мусимо зосередитися на соціялізмі у своїй країні."
 
 TYM.55.t: "[FROM.GetName] приєднується до Комінформу"
 TYM.55.d: "Після успіху Каґановічградської конференції не було сумнівів, що кількість членів Комінформу швидко зростатиме. Тепер наші сподівання підтверджено: велика держава X визнала мудрість цієї ідеї та вирішила стати державою-засновницею Комінформу.\n\nЩе одна країна стала на наш бік, і світ наблизився до визволення від привида фашизму."
 TYM.55.a: "Ця людина - ваш друг. Вона бореться за свободу!"
 
 TYM.56.t: "[FROM.GetName] стає асоційованим членом"
 TYM.56.d: "Каґановічґрадська конференція завершилася успішно, проте наші цілі, вочевидь, не цілком збігаються з цілями решти світу. Держава X вирішила приєднатися до Комінформу як асоційований член. Це надасть їй місце спостерігача у справах Бюро та пільговий торговельний статус, однак вона не матиме права на іноземну допомогу й організаційну підтримку, які отримують повноправні члени.\n\nПринаймні ми можемо бути певні, що вони нам не вороги."
 TYM.56.a: "Так за ними буде легше наглядати."
 
 TYM.57.t: "[FROM.GetName] відмовляється вступити до Комінформу"
 TYM.57.d: "Каґановічґрадська конференція успішно відсіяла фальшивих друзів, ворогів соціялістичної справи. Держава [FROM.GetName], хоч і заявляє про відданість марксистській думці, відмовляється вступити до Комінформу й стати поруч із СССР у братерській єдності."
 TYM.57.a: "Тепер ми знаємо, що цим замаскованим реакціонерам допомоги надсилати не слід."

 TYM.58.t: ""
 TYM.58.d: ""
 TYM.58.a: ""

