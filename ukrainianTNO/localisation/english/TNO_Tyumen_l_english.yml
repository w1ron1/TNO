 TYM_five_year_plan_category_desc: "\n\n\n\n\n\nВиконуючи сміливу програму індустріялізації §Sголови§! §V[TYM.GetLeader]§! задля добробуту §VНародної Республіки§!, ми маємо пам'ятати, що §Rзрадники§! та §Oшкідники§! можуть саботувати цю вкрай важливу справу. У цей період ми станемо §Gсильнішими§!, але водночас §Rуразливішими§! - уразливішими до загрози §Rголоду§!.\n\nЯкщо наші дії зашкодять §fсільському господарству§!, §Yсільськогосподарське навантаження§! зросте. Якщо воно сягне §Y100§!, §Rнас почне вражати голод§! або він §Rпосилиться§!, якщо §Rголод§! уже триває.\n\nІ навпаки: якщо §fсільське господарство§! залишатиметься §Gстабільним§!, а §Yсільськогосподарське навантаження§! знизиться до §Y0§!, ми почнемо §Gвідновлюватися.§!\n\nПоточне §Yсільськогосподарське навантаження§!: §Y[?TYMAgriculturalStrain]§!.\nЩомісяця §Yсільськогосподарське навантаження§! зменшуватиметься на §Y[?TYMAgriculturalStrainTicker]§!."
