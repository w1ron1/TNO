 TYM_bandaid_krush_coup_category: "Внутрішня опозиція"
 TYM_bandaid_krush_coup_category_desc: "§RФракційність§! завжди була в крові §Vреволюції§! - ще до її тріюмфу того доленосного §Vжовтня§!. На жаль, і нас не оминули її наслідки. Останнім часом кількість повідомлень про внутрішнє невдоволення політикою §eКаґановіча§! стрімко зросла, і почалася §Rборотьба§! за долю §VЗахідносибірської Народної Республіки§!. Саме тут вирішиться доля §SРеспубліки§!, §eмарксізму-лєнінізму§!, §VСовєцького Союзу§! й навіть самого §xсоціялізму§!.\n\nВнутрішня опозиція Каґановічу зараз [TYMGetKrushInfluence] ([?khrushchev_coup])."

