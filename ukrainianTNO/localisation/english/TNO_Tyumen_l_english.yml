 TYM_holding_out_desc: "Землі колишнього Совєцького Союзу ще ніколи не знали таких темних часів. Дрібні воєначальники воюють між собою, а ненависні фашисти, що спричинили це лихо, посилають жахливу Люфтваффе сіяти смерть і руїну просто нам на голови.\n\nЖорстоким фашистам Райху замало наших попередніх поразок - вони воліють іще й добивати повалений російський народ. Так далі тривати не може! Голова Каґановіч чує страждання людей, і з його допомогою ми застосуємо нові стратегії, щоб послабити найгірші наслідки."
 TYM_bunker_building_desc: "Щодня, коли падають бомби, людям нашої республіки ніде ховатися, і вони змушені рятувати життя втечею. Страх такий відчутний, що переслідує їх навіть уві сні. Кількість загиблих щодня зростає, тож людям потрібне місце, де вони зможуть сховатися, коли Люфтваффе знову прилетить збирати криваві жнива.\n\nВідповідь? Більше бункерів! Незабаром кожне місто й селище матиме потужну систему бункерів, які в мирний час служитимуть неприступними бомбосховищами, а у воєнний - надійною обороною. Наша республіка стане великою фортецею, яку неможливо буде пробити ні з повітря, ні з землі!"
 TYM_military_holdouts_desc: "Тепер, коли народ має вдосталь бомбосховищ, він може сидіти у відносному комфорті й безпеці, поки Люфтваффе марно намагається зламати його тіло й дух. Але що робити війську? Як воно стежитиме за численними ворогами, коли на голови регулярно сиплеться вибухівка?\n\nПросто: збудуємо ще більше укріплень! Цього разу місця для них обиратимуть передусім з огляду на потреби війська. Найімовірніші рубежі оборони перетворяться на неприступні редути, здебільшого захищені від повітряних ударів і добре підготовлені до можливого наземного штурму."
 TYM_scavengers_paradise_desc: "Товариші, погляньмо правді у вічі: Західносибірська Народна Республіка знала кращі часи. Більша частина інфраструктури лежить у руїнах, а в хаосі розпаду було втрачено незліченну кількість цивільного й військового спорядження. Тепер, коли ми серйозно намагаємося стати на ноги, це спорядження вкрай потрібне.\n\nПоки нам бракує промисловости для власного виробництва, просто неба лежать мільйони цінних речей із кращих часів, чекаючи, доки їх заберуть. Дозволено розпочати масштабну експедицію на нічийну землю, щоб урятувати якомога більше втраченого майна. Якщо пощастить, наші збирачі повернуться з купою покинутого спорядження, яке тільки й чекає, щоб знову послужити справі."
 TYM_hidden_communes_desc: "Бомбосховища довели свою ефективність, але сама їхня природа вимагає від тих, хто працює на поверхні, надзвичайної пильности, аби вчасно дістатися укриття. До того ж невідомо, що станеться, якщо Люфтваффе вирішить тероризувати нас уночі.\n\nМожливо, варто розширити сховища й надати їм ще одну функцію: перетворити на підземні, захищені від бомб домівки! Якщо люди житимуть і працюватимуть у безпеці під землею, їм не доведеться боятися нальотів. Ба більше, вони нарешті зможуть спати, знаючи, що сирена їх не розбудить!"
 TYM_behind_the_times_desc: "Сучасні технології - річ чудова, але яка з них користь, якщо наші заводи надто пошкоджені, щоб їх виробляти? Розкоші сучасного світу доведеться відкласти, доки Народну Республіку майже щодня засипають бомбами й ми не можемо відновити промисловість.\n\nРозв'язання - забезпечити людей старішими, застарілими товарами. Ними менш зручно користуватися, зате їх значно легше виробляти, особливо в такі тяжкі часи. Коли з неба регулярно падає смерть, люди навряд чи вередуватимуть щодо доступних товарів і послуг. Власне, їм слід радіти, що вони взагалі щось отримують!"
 TYM_survival_society_desc: "У ці часи ми маємо дбати не так про комфорт, як про виживання. Від рішень уряду залежить життя сотень тисяч людей, і, на жаль, настає мить, коли доводиться робити тяжкий вибір.\n\nЦя мить настала. Бомбардування вражають нашу шляхетну республіку на всіх рівнях - від невинних людей, безсилих перед Люфтваффе, до війська, що щотижня зазнає нестерпних утрат від масованих авіянальотів. Дедалі очевидніше, що врятувати всіх неможливо. На чому зосередитися: на захисті невинних чи на збереженні військової сили?"
 TYM_the_underground_world_desc: "Уже багато років поверхня є землею смерти й страждань, тому люди шукають кращих можливостей під землею. Хто ми такі, щоб їм заважати? У цій тенденції є велика мудрість, і нам варто прийняти її з розпростертими обіймами.\n\nСам голова дозволив розпочати будівництво величезних підземних комплексів найрізноманітнішого призначення - від виробництва до житла. Пропонують навіть будувати під землею цілі військові бази! Ось вона, кмітлива винахідливість справді соціялістичного суспільства: знаходити надію в найнесподіваніших місцях у найтемніші часи!"
 TYM_rapid_caravaning_desc: "Ще однією необхідністю, породженою нальотами, стала система караванів - життєва артерія спустошених регіонів Росії. На жаль, фашисти вже вивчили найпоширеніші маршрути й почали завдавати ударів, щоб перерізати постачання в дорозі.\n\nЩоб уникнути таких катастроф, ми розробимо нові маршрути, які якнайменше наражатимуть каравани на перехоплення серед численних небезпек російської нічийної землі. Караванникам доведеться звикати до незнайомих шляхів, але безперервний приплив припасів безперечно вартий можливих незручностей."
 TYM_living_in_the_shadow_desc: "Бомбардування лише посилюються, а наша й без того слабка промисловість працює на межі. Виробництво йде повільніше, ніж хотілося б, тому на фронт надходить менше припасів і спорядження. Щоб військо залишалося готовим до будь-якого ворога навіть за цих обставин, можливо, доведеться піти на нові жертви.\n\nЗначна частина наших потужностей виробляє цивільні товари. Теоретично їх перенаправлення дало б відчутний приріст виробництва зброї та спорядження, але чи варто забирати в народу ті крихти зручностей, які ще лишилися? Остаточне рішення за головою Каґановічем..."
 TYM_study_the_bombings_desc: "Люфтваффе затьмарює небо своєю зловісною присутністю й майже щодня несе смерть невинним людям нашої республіки. Та, можливо, саме частота нальотів стане погибеллю фашистів? Найспостережливіші товариші із залишків наших повітряних сил помітили певні закономірності, але переконатися в них можна лише після докладного вивчення.\n\nВідтепер ми ретельно записуватимемо всі фашистські нальоти. Розклад атак проаналізують, щоб з'ясувати, чи справді вони мають очевидні закономірності. Якщо пощастить, товариші зможуть точно передбачати час і місце падіння бомб, і ми нарешті серйозно візьмемося обмежувати більшу частину шкоди."
 TYM_on_the_clock_desc: "Вивчення фашистських нальотів дало плоди! Завдяки ретельному аналізу часу, дат і місць бомбардувань ми справді виявили разюче чітку закономірність. Повітряна міць Люфтваффе жахає, та тепер зрозуміло: фашисти надзвичайно передбачувані.\n\nТепер, коли ми можемо точно й надійно передбачати місця ударів, наступним кроком стане завчасна підготовка можливих цілей. Поки що зупинити падіння бомб не вдасться, але принаймні можна зробити так, щоб вони падали там, де майже не завдадуть критичної шкоди. У кінці тунелю справді видно світло!"
 TYM_the_mikhail_system_desc: "Товариш Міхаїл, брат голови, висунув мудру пропозицію щодо подальшого зменшення наслідків бомбардувань. На його думку, значну частину наших зусиль слід присвятити безпеці всіх працівників, яких вважають незамінними для нашої справи.\n\nМиттєва загибель цих надзвичайно важливих чоловіків і жінок під час одного нальоту стала б катастрофою для республіки. З огляду на це ідея Міхаїла набуває ваги. Запропонована ним система дасть змогу суттєво посилити захист незамінних кадрів і водночас не покинути народ напризволяще."
 TYM_off_the_clock_desc: "Системам захисту від значної шкоди знадобився час, щоб дати результат, але тепер вони, здається, нарешті запрацювали. Боєприпаси Люфтваффе вибухають у неважливих місцях, тоді як критична інфраструктура переживає наліт за нальотом.\n\nЗа останні місяці помітно зменшилася й кількість загиблих. Люди знову почуваються безпечно на поверхні, якщо дотримуються належних запобіжних заходів, і здебільшого вже не бояться появи Люфтваффе. Тепер, коли можна перевести дух, можливо, час подумати, як підрізати фашистам крила..."
 TYM_preventative_measures_desc: "Надто довго ми тремтіли перед німцями та їхньою Люфтваффе! Більше не доведеться, наче щурам, метушитися до бомбосховищ, поки фашисти безкарно тероризують і нищать наші землі, а ослаблене військо безсиле їх зупинити. Тепер їхні бомби стали гіршими за непотріб, а ми здобули нагоду діяти й самим посіяти страх.\n\nПротягом років ми з різних джерел отримували передові зенітні системи. Нарешті застосуємо їх, розмістивши батареї поблизу місць, де часто літають німецькі бомбардувальники. Коли все буде готове, самовпевнених пілотів Люфтваффе чекатиме неприємний сюрприз: гадані беззахисні цілі відкриють вогонь у відповідь!"
 TYM_necessary_losses_desc: "Попри всі спроби захистити людей від найгірших наслідків бомбардувань, урятувати до останньої людини неможливо. Голова Каґановіч розуміє цю жорстоку правду краще за будь-кого й знає: якщо однаково захищати міське та сільське населення, становище не поліпшиться ніде.\n\nТому він вирішив надати перевагу містянам. Через високу щільність населення міста значно вразливіші за розкидані сільгоспугіддя. Міста отримають нові бункери для надзвичайних ситуацій, а сільським громадам доведеться обходитися тим, що вони мають."
 TYM_do_and_die_convoys_desc: "Через посилення протиповітряної оборони до наших кордонів ринуло більше біженців, ніж будь-коли. Ми раді новим людям на наших знелюднених землях, але цей раптовий потік до безпеки, яку дає республіка, не лишився непоміченим німецьким ворогом...\n\nМи можемо допомагати біженцям, та спроба врятувати всіх накличе катастрофу, якої легко уникнути. Потреби більшости важливіші за потреби меншости, тому, на жаль, меншими колонами доведеться пожертвувати заради більших. Унаслідок цього чимало невинних, безперечно, загине жахливою смертю, але значно більше життів буде врятовано, ніж якби ми розпорошили сили, намагаючись захистити кожну людину, що перетинає кордон."
 TYM_black_zones_desc: "Наше виробництво досі значно повільніше, ніж могло б бути. Бомбардування завдають набагато менше шкоди, ніж кілька місяців тому, але ремонтувати давно покинуті зруйновані заводи все ще надто ризиковано. Однак послаблення нальотів відкриває нові можливості.\n\nГолова Каґановіч затвердив блискучий спосіб відновлення виробництва озброєнь. Збройові заводи й арсенали будуватимуть у розосереджених, цілком таємних місцях, щоб підтримати ослаблену промисловість. Ці об'єкти буде суворо засекречено й обрано за найменшою ймовірністю виявлення Люфтваффе. Німці вже не так охоче й нахабно літають у нашому небі, як колись, а в наших володіннях є непримітні райони, майже не зачеплені нальотами."
 TYM_unpopular_decisions_desc: "Попри всі спроби захистити населення уламків ЗСНР, нескінченні суперечки між комунами та їхніми чиновниками не вщухають. Ба більше, за останні місяці невдоволення лише зросло! Впливові посадовці заявляють, що ми кидаємо комуни й народ республіки напризволяще заради корисніших секторів, прирікаючи тисячі людей на страждання.\n\nЦі звинувачення не цілком безпідставні, але зараз не час сперечатися про мораль. Навіть якби ми безглуздо занедбали життєво важливу інфраструктуру й промисловість, аби кілька людей могли орати поля, вони однаково знайшли б на що нарікати. Ми продовжимо успішну політику прагматизму й подбаємо, щоб ці безглузді скарги ніхто не почув."
 TYM_for_our_survival_desc: "Заради виживання нашій республіці довелося піти на багато тяжких жертв, щоб гарантувати безпеку Революції та добробут держави. Чимало людей віддали кров і навіть життя, а складні рішення назавжди закарбують останні місяці як один із найтемніших періодів нашої історії. Ми не пишаємося жорстокими рішеннями, що коштували життів, та ніхто не скаже, що зрештою вони були марними.\n\nБомбардування здебільшого припинилися, а небо стало чистішим, ніж за багато десятиліть. Люди знову виходять зі сховищ і живуть життям, якого так довго були позбавлені.\n\nТепер, коли ми захищені від німецької чуми, настав час ушанувати тих, хто віддав життя, щоб це стало можливим. Нехай їхня жертва ніколи не буде забута."
 
