 ### Leader Bios ###
 POLITICS_LAZAR_KAGANOVICH_DESC: "Багато хто вважав, що після розпаду Совєцького Союзу Бухаріна одному з його заклятих ворогів буде майже неможливо здобути стільки влади, щоб стати одним із наймогутніших лідерів Росії. Однак Лазар Моісєєвіч Каґановіч довів протилежне. Палкий прихильник Іосіфа Сталіна, він виступав проти політики Бухаріна й був відряджений до Західного Сибіру на посаду, яка за звичайних обставин не мала б жодного значення. Проте, опинившись далеко від фронтів війни, він накопичив достатньо влади, щоб іще до Західноросійської війни створити одну з найбільших держав Росії.\n\nЗаручившись відданістю фельдмаршала Константіна Рокоссовскоґо й генерал-лейтенанта Дмітрія Карбишева, а також підтримкою 3-ї та 10-ї армій, Лазар Каґановіч проголосив утворення Західносибірської Народної Республіки, що простяглася від Уралу до Омска. На його лихо, Республіці не судилося проіснувати довго. Безперервні бомбардування Люфтваффе та віддалення двох колишніх союзників урешті призвели до її краху. На місці недовговічної держави, народженої з попелу СССР, на заході згуртувалася армія Рокоссовскоґо, а на сході - Чорна Ліга Карбишева. Каґановічу не лишалося нічого іншого, як відступити до Тюмєні й утримувати під контролем рештки Західного Сибіру.\n\nТепер Каґановіч мусить провести крізь ці буремні часи державу-уламок, релікт міжвоєнної Росії. Його володіння оточують вороги зсередини й ззовні, та революційна воля Каґановіча залишається незламною. Як непримиренний старий большевик, він не гребуватиме жодними засобами, щоб знищити ворогів держави й утілити всеосяжну пролетарську державу, яку Великий Учитель Лєнін та його найвидатніший учень товариш Сталін провіщали ще зі славних днів Красного Октября."

 POLITICS_BORIS_SHCHERBINA_DESC: "Якщо поглянути на послужний список Боріса Євдокімовіча Щєрбіни, не дивно, що саме його обрали адміністратором Тюмєні. Прибувши до Західного Сибіру молодим, але честолюбним партійним чиновником, він невдовзі опинився відрізаним від світу, коли московський уряд упав. Від хаосу його захистив Лазар Каґановіч, який помітив його здібності, а на час вторгнення Златоуста вже давно зробив своїм головним економічним радником.\n\nУтім, щойно добре озброєні сили Драґунова рушили на схід, стало очевидно, наскільки мало Щєрбіна відданий авторитарній системі, якою так захоплювався Каґановіч. Відкинувши колишні переконання й жадаючи влади, Щєрбіна таємно домовився з торговцями смертю. Уральській Республіці знадобилася така людина для управління беззаконними землями, тож його призначили губернатором Тюмєні. Його талант невдовзі став очевидним, і тепер Щєрбіна прагне перетворити свої володіння на зразкову провінцію навіть під пильним оком Златоуста."

 POLITICS_BORIS_SHCHERBINA_ONEGA_DESC: "Якщо поглянути на послужний список Боріса Євдокімовіча Щєрбіни, не дивно, що саме його обрали адміністратором Тюмєні. Прибувши до Західного Сибіру молодим, але честолюбним партійним чиновником, він невдовзі опинився відрізаним від світу, коли московський уряд упав. Від хаосу його захистив Лазар Каґановіч, який помітив його здібності, а на час вторгнення Онєґи вже давно зробив своїм головним економічним радником.\n\nУтім, щойно добре озброєні сили Кірпічнікова рушили на схід, стало очевидно, наскільки мало Щєрбіна відданий авторитарній системі, якою так захоплювався Каґановіч. Відкинувши колишні переконання й жадаючи влади, Щєрбіна таємно домовився з антикомуністами. Північноросійській Республіці знадобилася така людина для управління беззаконними землями, тож його призначили губернатором Тюмєні. Його талант невдовзі став очевидним, і тепер Щєрбіна прагне перетворити свої володіння на зразкову провінцію навіть під пильним оком Онєґи."

 POLITICS_NIKITA_KHRUSHCHEV_DESC: "Нікіта Сєрґєєвіч Хрущов уособлює водночас те, що було, і те, чому так і не судилося статися. Він народився 1894 року в цілковитих злиднях, і його родина докладала неймовірних зусиль, щоб дати йому бодай якусь вищу освіту, доступну російському селянству. Можливо, саме непохитне прагнення батьків, братів і сестер забезпечити йому краще життя виховало в ньому терплячість, стриманий розум та обачність, яких так бракувало багатьом ідеалістичнішим членам Комуністичної партії за Бухаріна. Це привернуло увагу Лазара Каґановіча - майбутнього наставника й колишнього друга Хрущова.\n\nПід крилом Лазара Каґановіча й опікою покійного Сталіна скромний кріпак виріс у старанного, але обережного державного діяча й неголосного критика системи Бухаріна. Особливо після початку чисток, коли багато його друзів загинули або зникли, зокрема й сам Іосіф Сталін, у чию смерть через «нещасний випадок на виробництві» не вірили ані він, ані Каґановіч.\n\nТа після падіння СССР між спадкоємцями сталінізму виникла тріщина - спершу непомітна, але дедалі ширша. Каґановіч дедалі глибше поринав у своє ідеальне бачення сталінізму й досконалого комунізму під проводом держави - сильної держави, яка не впаде, як невдалий експеримент Бухаріна. Нікіта ж бачив лише голодних дітей і жінок та порожню могилу власного сина.\n\nРозбіжності між ними стали непримиренними, і Нікіта з жалем завдав першого удару по людині, яка колись була його наставником і другом. Тепер він стоїть сам - уже не старанний заступник і не учень, а голова нової совєцької Росії. Напередодні власної відставки він аж ніяк не прагнув опинитися в центрі такої пильної уваги. Але так само, як його родина багатьом пожертвувала, щоб він зміг посісти це місце, він пожертвує всім, аби дати Росії майбутнє, на яке вона заслуговує.\n\nВін завинив це Сталіну й Лєоніду."

