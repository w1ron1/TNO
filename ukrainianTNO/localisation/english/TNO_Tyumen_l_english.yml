 TYM_khrushchev.1.t: "Переворот"
 TYM_khrushchev.1.d: "Лазар Каґановіч постукував ногою по підлозі літака, квапливо пояснюючи молодому чиновникові важливість наступного П'ятирічного плану. День зіпсовано, подумав він, коли літак приземлився в Тюмєні; у Хрущова мала бути вкрай вагома причина викликати мене через пів країни. Ранок був цілком звичайним - Лазар дотримувався звичного розпорядку: швидко прийняв душ, поснідав і вирушив оглядати нові заводи на Півночі. Усе пішло шкереберть, коли він отримав звіт про незаплановані переміщення армії, а тоді мусив негайно летіти до партійного керівництва.\n\nДвері літака відчинилися, і Лазар кинувся на летовище, де чекали п'ять чорних автомобілів. Назустріч вийшов Хрущов у супроводі озброєних офіцерів НКВД. Не встиг Голова отямитися, як його літак знову заревів і злетів.\n\n"Товаришу Каґановічу, - почав Хрущов, поки солдат надягав на Лазаря кайданки, - вас звинувачено в некомпетентності та зраді партії. Сьогодні вранці загальні збори визнали вас винним".\n\nГолову запхали на заднє сидіння автомобіля, а він силкувався висловити своє збентеження й лють. Нікіта продовжив: "Мене призначено Головою. Ваша тиранія більше не переслідуватиме народ Росії". Двері грюкнули - і Лазара Каґановіча не стало."
 TYM_khrushchev.1.a: "Хай живе товариш Хрущов!"

 TYM_khrushchev.2.t: "Нарешті вільні"
 TYM_khrushchev.2.d: "Кістляві руки Владіміра стискали теплу каву; він пильнував, аби не розлити перший за багато днів пристойний напій. Сніг уже не впивався йому в спину, захищену новим пальтом. На честь візиту Голови в таборі ввімкнули світло, і воно осяяло ніч. Колона в'язнів поспішала до вантажівок, біля яких офіцери роздавали пайки, - разючий контраст з іншим краєм табору, звідки саме висилали стару ґвардію ҐУЛАҐу.\n\nГомін ущух, коли група солдатів утворила коло на головній площі. Усі розмови стихли, щойно чоловік оголосив себе Президентом Совєцького Союзу: "Товариші, радійте! Тирана Каґановіча усунуто від влади, і вас більше не примушуватимуть працювати в цих таборах!" Тепер Нікіта Хрущов заволодів увагою всіх, і його голос загримів крізь снігопад: "Наш новий Союз збудовано на справедливості, рівності й свободі, а не на рабстві та цих ґулаґах. Завтра мої вірні офіцери доправлять вас додому, але спершу наїжтеся досхочу!" Натовп вибухнув радісними вигуками; ніколи раніше Владімір не бачив у таборі такого щастя. Його думки полинули додому, до давно минулих спогадів і надії знову побачити свою родину..."
 TYM_khrushchev.2.a: "Ми звільнимо Росію."

 TYM_khrushchev.3.t: "Новий Союз"
 TYM_khrushchev.3.d: ""Товариші, коли було засновано наш Союз, Лєнін мріяв про суспільство, де люди будь-яких переконань, кольору шкіри й статі могли б вільно жити та процвітати". Партія відповіла оплесками, що відлунювали головною залою. "Але тоталітарні сили спотворили цей ідеал на чолі з Лазарем Каґановічем та його клікою офіцерів. Годі!" Хрущов здійняв кулаки. "Віднині ми робитимемо все, що в наших силах, аби зміцнити соціялістичну мрію! Поки ми говоримо, в'язнів звільняють із крижаних ґулаґів, бюрократію очищують, і навіть держави далекого Заходу дивляться на нас прихильніше!"\n\nПісля перевороту партія й справді змінилася: кільком татарам вдалося отримати місця, жінки дістали ширше представництво, а офіцери НКВД вже не підслуховували кожну розмову. Повернулася подоба совєцького оптимізму, схожа на той, що панував у старому Союзі. Будівлі Тюмєні прикрасили плакати в стилі соціялістичного реалізму, багряний стяг високо майорів у небі, і навіть лунав дитячий сміх."
 TYM_khrushchev.3.a: "Тінь минула."

 TYM_khrushchev.4.t: "Те, чого ніколи не було"
 TYM_khrushchev.4.d: "Ґреґорі не міг стримати легкого тремтіння, входячи до кабінету Голови. Перед ним скромно сидів сам Нікіта Хрущов, Реформатор і очільник найвеличнішої держави на Землі. Кімнату прикрашали портрети Маркса й Лєніна, але Голова дивився на невеличку скульптуру в кутку. Ґреґорі зачинив за собою двері, привернувши увагу Нікіти. "О, товаришу Ґреґорі! Вітаю!"\n\nНа мить юнакові здалося, що ноги більше не тримають його, а з вуст не виходить ані слова. "Заходьте, сідайте!" Хрущов указав на вільний стілець поруч і підняв склянку.\n\nПриголомшений Ґреґорі сів і поглянув на статую. "А, так, - Хрущов знову повернувся до погруддя, - це товариш Сталін. Ви про нього знаєте?" Ґреґорі спромігся лише похитати головою.\n"Шкода! Яка ж чудова це була людина - він міг збудувати Союз, якого ніколи не було". Нікіта опустив погляд і завагався. "Сталін вірив у країну із заліза, але також у країну справедливости. Місце, де кожен мав би хліб і дах над головою, вільне від буржуазного декадансу". Він раптом пожвавішав. "Та байдуже, у партії ми й досі рівняємося на нього". Ґєорґій дивився на погруддя, міркуючи про те, що могло б бути..."
 TYM_khrushchev.4.a: "Ми змусимо Сталіна пишатися."

 TYM_khrushchev.5.t: "Кінець старої ґвардії"
 TYM_khrushchev.5.d: "Тонка цівка сигарного диму здіймалася в холодне ранкове повітря, аж раптом її розірвав гучний кашель. Шеренга піхотинців нетерпляче дивилася на Малініна, поки той докурював останню сигару. Крихти тютюну впали на чорний асфальт, і чобіт чоловіка їх розчавив. Офіцер НКВД, значно молодший хлопець, якому доручили наглядати за першою в його житті стратою, запитав: "Останнє слово, товаришу?" - фразою, яку часто чув у кіно. Малінін зітхнув, поправив кашкета й, раптово змінившись, закричав: "Хай живе товариш Каґановіч!"\n\n"Приготуватися! - вигукнув офіцер. - Цілься!" Солдати взяли його на приціл. "Ви, пси, своїми реформами лише занапастите Союз! Росію збудовано на крові та сталі! Ви, які звільняєте ворогів держави, які..."\n\n"Вогонь!" Буря свинцю обірвала Малініна, його тіло смикнулося назад і впало на асфальт. Офіцер розпустив солдатів, але не міг відвести погляду від трупа перед собою. На його місці міг бути я, нагадав він собі, а тоді пішов геть, назавжди залишивши минуле позаду."
 TYM_khrushchev.5.a: "Ми не повторимо їхніх помилок."

 TYM_khrushchev.6.t: "Почута правда"
 TYM_khrushchev.6.d: "Останній місяць Хрущов готував величну промову. У рідкісні вільні хвилини він занотовував щось у записник, добираючи формулювання та звинувачення проти колишнього Голови. Нарешті "Таємна доповідь" була готова до виголошення перед Комуністичною партією. І коли Нікіта з паперами в руках піднявся сходами до трибуни, то не міг позбутися страху перед можливою реакцією. А що, як у партії досі є його прихильники? А що, як комітети виступлять проти реформ? Але Голова все одно почав.\n\n"Товариші, слухайте, слухайте! У мене є перелік звинувачень і правди про Лазара Каґановіча. Цей перелік аж ніяк не вичерпний, але сподіваюся, він проллє світло на приховані злочини, які той скоїв проти Союзу". Серед присутніх почулися здивовані зойки, а Хрущов глянув на телекамеру в кутку. Зараз або ніколи. І він зачитав перелік: таємні вбивства, нічні викрадення, депортації до нікому не відомих місць, секретні ґулаґи, яких немає на жодній мапі. Партія й народ слухали з жахом. У декого навіть стався серцевий напад. Хтось розчаровано хитав головою. Інші всміхалися й казали: "А я ж говорив!""
 TYM_khrushchev.6.a: "А інші сподівалися на краще майбутнє."

 TYM_khrushchev.7.t: "Революційна література"
 TYM_khrushchev.7.d: "(уривок із Наказу 491):\n\n...Відповідно до нової політики новоствореному "комітету революційної літератури" доручено наглядати за фільтрацією бібліотечних фондів. За Лазара Каґановіча чимало текстів (деякі з них були аполітичними) заборонили за антипартійні погляди. Російську літературу, історичні праці та окремі закордонні романи спалювали, а за їх зберігання карали засланням до ґулаґу. За допомоги нещодавно звільнених інтелектуалів комітет ретельно наглядатиме за поверненням літератури в суспільство.\n\nОкрім того, слід переглянути питання закордонного імпорту. Поки нашій молодій відродженій країні бракує інженерів і професорів, для навчання наступного покоління можна покладатися на американські тексти. Звісно, всі книги редагуватимуть відповідно до теорії марксізму-лєнінізму, але нам також доведеться створити власні друкарні."
 TYM_khrushchev.7.a: "Годі заборон!"

 TYM_khrushchev.8.t: "Повторна перевірка"
 TYM_khrushchev.8.d: "(уривок із Наказу 568):\n\n...Якщо ви отримали цього листа, то досі керуєте установою ҐУЛАҐу, де утримують неперевірених в'язнів. Голова Хрущов особисто видав наказ (Наказ 239 від XX/XX/XXXX) повторно перевірити всіх політичних в'язнів і звільнити тих, хто не відповідає новим критеріям. Якщо ваш ҐУЛАҐ не виконає розпорядження протягом наступного місяця, чекайте на візит підрозділів НКВД та безповоротну втрату нинішнього звання. До листа додано аркуш із докладними вказівками щодо перевірки й належного звільнення."
 TYM_khrushchev.8.a: "Підпис: Нікіта Хрущов."

 TYM_khrushchev.9.t: "СССР навіки"
 TYM_khrushchev.9.d: "Новий Совєцький Союз разюче відрізняється від Союзу часів Бухаріна. Поки контрреволюційні елементи й далі скаржаться на "брак свобод" і "соціялізм", ми дивимося у світле майбутнє. Диктатор Каґановіч давно пішов у небуття, а наш сталінізм не заплямований збоченнями старої ґвардії. Рівність помітно зміцнюється, так само як і ефективність П'ятирічних планів. Ґулаґи закрили або суттєво скоротили кількість їхніх в'язнів, а дух свободи волі та надії тепер ширяє над усім Сибіром. Ми знову розпалили полум'я, яке не горіло десятиліттями."
 TYM_khrushchev.9.a: "Підіймімо багряний стяг!"
