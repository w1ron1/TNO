 TYM_project_cain: "Проєкт КАІН"
 TYM_no_such_thing_as_propaganda: "Немає такої речі, як пропаганда"
 TYM_only_truth: "Лише правда"
 TYM_and_only_what_they_need_to_know: "І лише те, що треба знати"
 TYM_a_job_left_unfinished: "Незавершена робота"
 TYM_new_talented_officers: "Нові талановиті офіцери"
 TYM_man_of_steel: "Людина зі сталі"

 TYM_on_the_right_track_desc: "Відновлення Совєцького Союзу йде правильною дорогою. Майже половину Батьківщини повернуто у фашистів, самозванців і воєначальників. Тепер, коли в Центральній Росії створено надійну опору, війнам потрібна перерва. Товариш Каґановіч розуміє: для подальшого розширення потрібні сильна промисловість, організоване військо й політична система без внутрішніх загроз.\n\nМи швидко збудуємо важку промисловість для танків, гвинтівок і гармат; розширимо й переорганізуємо військо після виснажливого об'єднання Західного Сибіру; а певні політичні елементи... усунемо, щоб не допустити опозиції провідній руці Каґановіча. Це складно, але необхідно для відновлення Союзу."

 TYM_inaugurate_the_third_five_year_plan_desc: "Повернені сибірські землі вкрай бідні: мало доріг, електрики й водогонів, а більшість людей веде натуральне господарство в селах. Настав час другого П'ятирічного плану. Після його схвалення весь Сибір охопить модернізація, індустріялізація й будівництво. Заводи танків, зброї та боєприпасів стануть нормою, давши Червоній Армії змогу боротися зі значно більшими й краще озброєними ворогами.\n\nСтарий Союз упав, бо Бухарін не створив сучасної військової промисловости й не збагнув потреби якнайшвидшої індустріялізації. Він і російський народ заплатили кров'ю. Каґановіч розуміє ворогів, народ і уроки минулого та не повторить цієї помилки."

 TYM_in_stalins_way_desc: "Покійний товариш Сталін був великим другом і наставником Каґановіча. Його політична й суспільна філософія не раз спрямовувала та захищала Каґановіча й державу. Сам Каґановіч визнає, що в складній ситуації питає себе, як учинив би Сталін. Ми вшануємо дароване ним світле майбутнє й цілком приймемо «сталінські» ідеали як офіційну позицію держави. Це збереже пам'ять про нього та поведе нас до кращого майбутнього."

 TYM_commissariat_of_civil_defence_desc: "Самої армії замало. Мільйон людей у резерві марний без зброї, організації та логістики, яких бракує в сибірській пустці. Тому товариш Каґановіч, зважаючи на зростаючу міць держави, створить Комісаріят цивільної оборони.\n\nВін керуватиме всією підготовкою до війни: формуватиме й оснащуватиме частини, забезпечуватиме достатнє заводське виробництво та готуватиме пропаганду на випадок війни. Світ змінюється, й безпека держави та народу має найвищий пріоритет."

 TYM_factory_institutes_desc: "Вторгнення гітлерівців і крах Союзу були трагедіями не лише через загиблих, а й через шкоду майбутньому. Безліч людей серед уламків Батьківщини не вміє читати й писати, знаючи лише ріллю та посів. Так було століттями, але сучасність - доба машин, заводів і сталі, й Росію треба силоміць втягнути в промислове суспільство. Нових робітників доводиться навчати усно, бо вони не читають простих інструкцій.\n\nПлан Каґановіча - заводські школи. При великих фабриках і підприємствах діятимуть класи грамотности для переважно неписьменних робітників. Це не повна освіта світового рівня, але її буде більш ніж достатньо."

 TYM_breaking_some_eggs_desc: "Як каже Каґановіч, для омлету треба розбити яйця, а для справи часом треба зламати політичну опозицію. Внутрішнє становище надто хитке: забагато загроз його владі та зрадників Революції, які не лише небезпечні, а й можуть бути причетні до певних... минулих невдач держави.\n\nАгітаторів і проблемних осіб швидко та без опору схоплять, як нещодавно військових, і відправлять до сибірських трудових таборів або стратять. Деякі комісаріяти втратять цінні кадри, але це ніщо проти користи від їхнього усунення."

 TYM_long_arm_of_the_nkvd_desc: "НКВД - найкорисніший засіб державної безпеки для Каґановіча й Революції. Воно вже велике, але мусить зростати разом із державою: що більше громадян, то більше нагляду й підзвітности. НКВД матиме очі й вуха в кожному кутку, провулку, кабінеті та на кожній виробничій лінії. Ніхто не зможе поділитися таємницею, а отже змови стануть неможливими.\n\nНове НКВД вселятиме буквально невимовний страх. Усі знатимуть, що за ними стежать і слухають, але не знатимуть звідки й не наважаться назвати організацію. Жоден злочин проти Революції не уникне кари, жоден камінь не лишиться неперевернутим, жодна людина - недопитаною."

 TYM_a_hammer_in_every_hand_desc: "Кожна людина - молода, стара чи хвора - мусить якось служити суспільству. Особа не має цінности поза користю для держави як знаряддя війни або виробництва. Для возз'єднання Росії відновленому Союзові потрібні всі працездатні робітники й солдати. Нові заводи потребують робочих рук - основи соціялізму. Їх, за браком кращого слова, мобілізують переважно з малих сіл. Кожна рука, що не тримає гвинтівки чи дитини, отримає молот заради совєцького соціялізму. Бо неробочі руки - іграшка гітлерівців."

 TYM_metro_2_desc: "Людство стоїть перед безпрецедентною загрозою повного ядерного знищення. Бійся чи тікай, воно однаково може настати й винищити вид. Чи то через амбіції Гіммлєра, ескалацію між великими державами, чи просту помилку - ризик надто великий. Тому Каґановіч склав план збереження російського народу й совєцького соціялізму після будь-якої катастрофи.\n\n«Метро-2» - велика мережа тунелів і житла під Тюмєнню, підземне місто приблизно на 10 000 людей. Воно матиме чисту воду, геотермальні й гідроелектричні генератори, запаси їжі, приміщення для вирощування рослин і великий дослідницький відділ для найтаємніших експериментів. Якщо світ спалахне, МЕТРО-2 може стати найбезпечнішим місцем, де можна дочекатися, доки охолоне попіл."

 TYM_project_cain_desc: "«Комплекс авторизованого інформаційного надання» - задум Каґановіча, натхнений успіхом МЕТРО-2. Великі міста Західного Сибіру отримають підземні мережі бункерів, нібито для захисту відданих громадян у ядерній війні. Насправді бункери складатимуться переважно з лабораторій, повних завзятих науковців. Там проводитимуть найтаємніші та найнебезпечніші експерименти подалі від очей народу й шпигунів. Дехто назве їх «неетичними», але хіба етично не використати кожну перевагу заради соціялізму й російського народу?"

 TYM_no_such_thing_as_propaganda_desc: "Те, що ліберальні дисиденти називають «пропагандою» чи «обманом», Каґановіч зве «необхідністю». Сибір подібний до вітража. До розпаду Союзу партія й держава були металевою оправою, що тримала скло. Тепер воно розбите на тисячі барв та ідеологій. Зібрати його можна лише через медіа й політичне виховання.\n\nДля масової пропаганди потрібна значно міцніша влада над Сибіром. ЗМІ розширять, у школах запровадять єдині програми, а НКВД розгорнуть у містах і селах, бодай щоб налякати місцевих до покори."

 TYM_only_truth_desc: "Товариш Каґановіч суворий, але не брехун. Він часом перекручував правду чи подавав альтернативні факти, та ніколи не брехав би народові Росії! Деякі речі просто не потрібні широкому загалові. Державні таємниці чи оманливі іноземні байки, що виставляють Каґановіча в поганому світлі, не слід показувати й обговорювати. За зачиненими дверима дехто шепоче про страх перед Каґановічем і НКВД, але не заражена іноземною брехнею більшість добре ставиться до улюбленого лідера."

 TYM_and_only_what_they_need_to_know_desc: "Довіряти не можна нікому. Найневинніша людина може стати політичним маніпулятором, агітатором, дисидентом чи іншим ворогом держави. Кожен робітник, солдат, мати й агент НКВД - очі та вуха, які можуть використати проти держави. Для здійснення бачення Каґановіча очі народу мають бути заплющені, а вуха закриті від усього, крім необхідного.\n\nБюрократію розширять так, що доступ до інформації стане майже неможливим. Офіцери й партійці отримуватимуть лише мінімум для виконання завдань. Справжній стан нового Союзу знатимуть лише Каґановіч і кілька обраних. Інформація стане ворогом народу й союзником держави."

 TYM_a_job_left_unfinished_desc: "Попри працю Каґановіча над безпекою, декого неможливо переконати покинути нікчемні ідеології. Тисячі людей уже заражено підривними переконаннями; вони становлять помітну частину бюрократії, війська й навіть таємної поліції. Усіх цих ворогів Революції нарешті буде вичищено - це слід було зробити давно.\n\nВіддані агенти НКВД знайдуть і допитають підозрюваних у непатріотичній чи підривній діяльності. Їх допитуватимуть, віддаватимуть під показовий суд і стратять або відправлять до сибірських таборів. Надто довго вони діяли безкарно, але за Каґановіча їхній час вичерпано."

 TYM_new_talented_officers_desc: "Велика чистка нарешті скінчилася. Останніх відомих ворогів держави відправлено до Сибіру або в землю. Та чистка знищила значну частину офіцерського корпусу: тисячам частин, переважно взводів, бракує командирів. Без них сильне військо розпадеться в першому бою. Новий корпус офіцерів підготують із ветеранів. Вони досвідчені й загартовані, але їм бракує знань сучасної тактики та загальновійськових операцій. Навчання забере час, зате зробить їх надзвичайно ефективними командирами."

 TYM_man_of_steel_desc: "Каґановіч нарешті став людиною, якою завжди захоплювався й яку наслідував: Іосіфом Сталіним, Людиною зі сталі. Це не лише бажання, а потреба. Для повернення слави Росії та Союзу потрібен суворий, безжальний лідер. Каґановіч керуватиме Революцією зі сталевим серцем. Він не любитиме майна, дітей і навіть народу - але любитиме Росію."


