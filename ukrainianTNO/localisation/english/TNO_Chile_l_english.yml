#### Ideas ####
CHL_idea_social_question: "Соціальне питання"
CHL_idea_social_question_desc: "Соціальне питання стосується проблеми широко поширеної бідності в Чилі. Проблема, що переслідує Республіку від самого її заснування, досі не демонструє жодних ознак покращення.\n\nВід здобуття незалежності різні уряди поспіль шукали різні рішення цієї нерозв’язної проблеми. Хоча подекуди їм вдавалося досягти успіхів, жодного з них не було достатньо, щоб усунути проблему. У результаті бідність у Чилі є постійною, похмурою реальністю, яку різко видно, куди б ви не пішли: від скупчених багатоквартирних будинків у містах до бідних, безпорадних селян у сільській місцевості — від неї не втекти. І це ще не кінець. Вона спричиняє всілякі суспільні негаразди: внутрішні міграції, широко поширену неписьменність і постійну потребу в інвестиціях хоча б для того, щоб не допустити погіршення проблеми.\n\nЖоден уряд, нинішній чи майбутній, незалежно від його політичних поглядів, не зможе уникнути необхідності розв’язувати цю проблему. Якщо ж вони цього не зроблять, наслідки будуть жахливими."
CHL_idea_political_fragmentation_alessandri_0: "Політична фрагментація" # Chad Alessandri
CHL_idea_political_fragmentation_alessandri_0_desc: "заповнювач"
CHL_idea_political_fragmentation_alessandri_1: "Політична фрагментація" # Status-Quo Alessandri
CHL_idea_political_fragmentation_alessandri_1_desc: "Республіка Чилі переживає безперервну політичну кризу останні двадцять років, відколи впали останні радикальні уряди.\n\nКонсолідація могутніх опозиційних блоків, що призвела до постійного стану політичної облоги й обструкціонізму, войовнича бездіяльність та інертність могутніх лібералів і, найгірше за все, стрімке й безпрецедентне зростання політичного екстремізму та насильства залишили цю країну, здавалося б, назавжди паралізованою. Фактично сучасна молодь навіть не може згадати, коли ця країна востаннє була стабільною.\n\nОбрання технократичного реформатора Хорхе Алессандрі президентом Чилі та початкові етапи його мандата вселили надію в багатьох чилійців: можливо, криза добігала кінця. Але політична криза після катастрофи Вальдівійського землетрусу лише поглибила її, і тепер Алессандрі залишився з похмурою реальністю: у своїй спробі хоча б трохи реформувати країну він розколов FDdC, а єдність Коаліції тепер ледве тримається на волосині після катастрофи, якою стали парламентські вибори 1961 року."
CHL_idea_political_fragmentation_alessandri_2: "Політична фрагментація" # Cucked Alessandri
CHL_idea_political_fragmentation_alessandri_2_desc: "заповнювач"
CHL_idea_economic_subservience: "Економічна підлеглість"
CHL_idea_economic_subservience_desc: "Від кінця XIX століття експортозалежна економіка Чилі в поєднанні з тривалим іноземним контролем над його ринками означає, що політична та економічна доля країни часто залежить від примх зовнішніх, нерідко недружніх сил.\n\nЧи то британці в минулому, американці або, останнім часом, японці — Чилі тягнуть у різні боки протиборчі сили, які загрожують розірвати країну на частини, як це вже не раз траплялося раніше."
CHL_idea_agrarian_timebomb: "Аграрна бомба уповільненої дії"
CHL_idea_agrarian_timebomb_desc: "Південь Чилі описували багатьма прикметниками: "різноманітний", "густонаселений", "унікальний" — на думку спадають саме вони з огляду на присутність незліченних етносів і народів у масштабах, небачених навіть в іммігрантських державах Америки та Канади. Останнім часом, однак, аналітики почали використовувати досить негативну метафору для опису цього ж регіону: "бомба уповільненої дії". Ці слова применшують реальність того, що Південь Чилі є катастрофою, яка лише чекає свого часу.\n\nНа тлі зростання невдоволення знедоленого селянства, змушеного жити в квазіфеодальних умовах на гасієндах, що немовби випали зі старої колоніальної доби, дедалі гучніших закликів до аграрної реформи та посилення політичних екстремістів у регіоні Південь, здається, відділяє від буквального й, можливо, навіть цілком реального спалаху вогню розбрату та гніву лише одна іскра."

CHL_idea_rural_collapse: "Розпад сільської місцевості"
CHL_idea_rural_collapse_desc: "Вогонь. Вогонь — єдина постійна величина на Півдні Чилі. Насичений вогнем, охоплений димом, короткого хрипкого хрипіння задиханої худоби не чути за стріляниною. Палаючі ліси випускають екстремістів, які лінчують і грабують під гуркіт вибухів. Поля горять, їжі бракує; червоний серпанок — задушлива ковдра, що душить Південь, — дієта з ненависті. Єдиний політичний дискурс, що пережив усе це, — вбивство, а будь-які дії уряду слід здійснювати з великою обережністю, щоб розпад не поповз на північ."
CHL_idea_rural_collapse_dummy: "Розпад сільської місцевості"
CHL_idea_rural_collapse_dummy_desc: "§FЩотижнева жива сила: §R-50§!\nСтабільність: §R-10%§!\n--------------\n§!Вогонь. Вогонь — єдина постійна величина на Півдні Чилі. Насичений вогнем, охоплений димом, короткого хрипкого хрипіння задиханої худоби не чути за стріляниною. Палаючі ліси випускають екстремістів, які лінчують і грабують під гуркіт вибухів. Поля горять, їжі бракує; червоний серпанок — задушлива ковдра, що душить Південь, — дієта з ненависті. Єдиний політичний дискурс, що пережив усе це, — вбивство, а будь-які дії уряду слід здійснювати з великою обережністю, щоб розпад не поповз на північ."

