CHL_Salvador_Allende: "Сальвадор Альєнде Ґоссенс"
POLITICS_SALVADOR_ALLENDE_DESC: "Одним із улюблених жартів Сальвадора Альєнде було те, що на його надгробку буде написано: "Тут лежить Сальвадор Альєнде, наступний президент Чилі". Зважаючи на його невезіння з національними виборчими кампаніями, це відчуття фаталізму здавалося цілком доречним. Зручна поразка 1952 року та жорстока парламентська колотнеча, що вихопила в нього перемогу в 1958 році, це підтверджують. Однак сьогодні «наступний» уже настав.\n\nПогляди Альєнде сформувалися самостійно: він відійшов від свого заможного походження, щоб присвятити себе ідеалам, за які боровся протягом 20-х років у студентському активізмі, поки Чилі розривало саме себе. Він проклав собі шлях через найвизначніші моменти чилійських лівих, почавши з короткочасної Соціялістичної республіки Мармадука Ґрове та створеної після неї Соціялістичної партії, під прапором якої Альєнде брав участь у кожній своїй виборчій кампанії. Потім був Народний фронт Педро Аґірре Серди, чию виборчу кампанію Альєнде допоміг успішно провести, здобувши посаду міністра охорони здоров'я — принаймні доти, доки Аґірре Серда не помер посеред свого терміну, не спричинивши розпаду Фронту та нового самостійного існування соціялістів. Тепер, маючи урядовий досвід, зірка Альєнде піднялася ще вище — до певної межі: він не міг подолати бар'єр президентства. Для перемоги у 1958 році було створено коаліцію з радикалами, сформувавши FRAP. Альєнде завжди казатиме, що обраний мав бути саме він, завдяки його незначній перевазі в народному голосуванні, але доля та парламент вирішили інакше.\n\nЦього разу, однак, жодні кулуарні угоди не змогли позбавити Альєнде належного йому. Унаслідок цілковитого політичного перевороту Альєнде нарешті переміг і готовий втілити чилійський шлях до соціялізму, який він обіцяв десятиліттями. Його прихильники вітають його як політичного месії, людину, яка нарешті розірве цикл хаосу та бідності, що поглинав Чилі стільки, скільки будь-хто може пам'ятати. Його противники, навпаки, бачать у ньому когось ближчого до Диявола, який зажене Чилі в могилу в гонитві за соціялістичною диктатурою. Над радикальною поляризацією на вулицях армія спостерігає та розколюється, а поляризація вгризається в її міцні аполітичні засади.\n\nПрихильник, противник, військовий — усі озброєні, параноїдальні та готові вбивати й помирати за власне бачення Чилі. Дамоклів меч висить над головою Дона Чічо, але він тримає власну зброю. Усе, про що він коли-небудь мріяв, уже в його руках, але йому доведеться боротися, щоб утримати це — зберегти владу, не допустити цілковитого краху нації та навіть захистити власне життя."

CHL_Eduardo_Frei: "Едуардо Фрей Монтальва"
POLITICS_FREI_MONTALVA_DESC: "Едуардо Фрей не чужий у центрі уваги. Він насолоджується ним уже десятиліттями, частково активіст і частково політик, постійно з'являючись у найважливіші моменти Чилі. Саме в його стилі, що коли нація входить у свої чи не найскладніші роки, Фрей опиняється там, щоб посісти владу як наступний президент Чилі.\n\nІм'я Фрея стало відомим три десятиліття тому, коли він був визначним студентським лідером під час повалення диктатури Ібаньєса. У хаотичний період після революції він використав здобутий вплив, щоб об'єднати незадоволену консервативну молодь у Національну фаланґу, яка, після нетривалого загравання з націонал-синдикалізмом іспанського зразка, схилилася до християнської демократії. Потім він ненадовго приєднався до кабінету Ріоса, що розпадався, як міністр громадських робіт у 1945 році, перш ніж того ж року розірвати з ним відносини на тлі поглиблення політичної кризи, що лише ще більше посилило його популярність. Його розрив із радикалами призвів до зближення Фаланґи з консервативним крилом FDdC, де протягом наступного десятиліття він поступово здобував вплив і владу. Завдяки його реформістським соціально-християнським поглядам усе, здавалося, було готове до його висунення та перемоги 1958 року як їхнього кандидата — якби Хорхе Алессандрі та Хорхе Прат не втрутилися, зруйнувавши FDdC і вибивши політичну опору з-під ніг Фрея. Розлючений, Фрей став одним із найзапекліших критиків Алессандрі — чудова позиція, коли непопулярна адміністрація президента зазнавала краху. Маючи за своєю наступною кампанією загальний консенсус консерваторів, центристів і навіть частини лібералів, Фрей нарешті отримав належне йому, тріумфально прийшовши до влади у 1964 році на гребені хвилі змін.\n\nЗвісно, Фрей не має наміру дозволяти своїй увазі згаснути. Як він міг би, тепер, коли перебуває у найвеличніший момент свого життя? Поки він формує свій кабінет і зміцнює свої зв'язки, вулицями лунають суперечки про те, що приготував новий лідер. Він просто черговий млявий консервативний реформатор чи справді має на увазі те, що каже? Він прогресист, якого згадуватимуть позитивно, чи проігнорує проблеми, що мучать націю? Він підкориться традиціям чи прокладе власний шлях? На ці питання може відповісти лише сам Фрей, і він сповнений рішучості відповісти на них якнайкраще."

CHL_Jorge_Prat: "Хорхе Прат Ечауррен"
POLITICS_PRAT_ECHAURREN_DESC: "До Хорхе Прата був Артуро Прат. Його героїчна смерть у битві при Ікіке під час Тихоокеанської війни перетворила його на національну ікону, мученика Чилі, якого увічнили святом і безмежною славою в очах населення. Хорхе Прат, можливо, ніколи не зможе відповідати планці, встановленій його дідом, але це буде не через брак спроб.\n\nНа відміну від таких постатей, як Альєнде та Фрей, досвід Прата у 20-х роках вплинув на нього зовсім інакше. Він бачив розділену й безпорадну націю, що перебувала на милості іноземних держав і не могла рухатися вперед через дріб'язкові суперечки. Саме ця бездіяльність привела його до Націонал-соціялістичного руху, але їхня некомпетентність і їхній лідер швидко розчарували його, і він перейшов до значно більш мейнстримних консерваторів. Його ім'я, безумовно, допомогло йому, коли він очолив молодіжне крило партії через бурхливі 40-ві. Його унікальне поєднання корпоративістської, порталівської та аполітичної риторики забезпечило йому віддану базу прихильників, поки він виступав за об'єднавчу фігуру, яка мала очолити Чилі, зрештою здобувши посаду міністра юстиції в адміністрації Коломи. Хоча його стандартна програма приваблювала консерваторів, його боротьба за виборче право для жінок під час перебування на посаді принесла йому підтримку багатьох впливових жінок Чилі, зокрема його нинішньої ключової союзниці Марії де ла Крус, перетворивши його на привабливого наступника для консерваторів у FDdC та прогресистів поза ним, коли адміністрація Коломи захиталася від нестабільності. Саме тут, звісно, фатальна боротьба з Алессандрі та Фреєм розколола коаліцію, і Прат залишився майже лише зі своїми прихильниками, які могли рухати його вперед.\n\nОднак вони таки рухали його вперед, а опозиція Прата адміністрації Алессандрі залишила його в ідеальній позиції, щоб об'єднати праве крило та здобути перемогу над своїми суперниками. Вперше за десятиліття справжній консерватор тримає кермо влади, і Прат не має наміру змарнувати свою можливість — уже зараз він виступає за нові рішення старих проблем, обіцяючи, що реформа в Конгресі, єдність і порядок — це те, чого потребує Чилі. Буде важко протистояти великим силам, з яких складається істеблішмент чилійської політики, але коли Хорхе Прат дивиться на портрет свого діда, він знає, чого хотів би старий герой."

CHL_Ramon_Callis: "Рамон Кальїс Арріґорріаґа"

POLITICS_ROBERTO_VIAUX_DESC: "Що пов'язує таких людей, як Фідель Кастро, Франсіско Франко, Дієґо Порталес, Карлос Ібаньєс дель Кампо та Хуан Домінґо Перон? Якщо коротко, то їхня сила як виняткових, добрих католицьких людей, які рятують свої нації від корупції, виродження та занепаду. Якби не вони, їхні нації занурилися б у пекло страждань і не були б спрямовані ними на новий, славний шлях, заснований на праведності та західних, християнських чеснотах. Найбільше захоплюючись Пероном та Ібаньєсом, Роберто Віо — не більше й не менше, ніж остання ланка цього довгого ряду достойних сучасних людей.\n\nНароджений у родині, де поколіннями служили військові, Віо піднімався кар'єрними сходами не завдяки винятковій майстерності чи тактичній вправності, а завдяки своїй працьовитості, надійності та доступності як офіцера. Завдяки цим рисам Віо здобув повагу своїх підлеглих і начальників і відтоді став маяком для пригнічених офіцерів Чилі — чимось життєво важливим у цей час, коли пошесть комуністів і соціальних паразитів почала проникати в кожен аспект життя Чилі.\n\nОскільки ця хвороба лише погіршувалася, а ця інвазія розколювала Чилі на частини, стало вкрай необхідно, щоб така велика людина, як Роберто Віо, прийшла до влади та врятувала цю націю. Незабаром Чилі приєднається до галереї великих держав Латинської Америки та назавжди залишить свій слід в історії. Для такої людини, як Роберто Віо, це лише доля."

POLITICS_TORIBIO_MERINO_DESC: "Існує тисяча способів описати Хосе Торібіо Меріно: американофіл, іберофіл, самопроголошений Захисник християнсько-західних цінностей, затятий противник популістів і фашистів у всьому світі — і тих, і інших особливо в Аргентині, — до яких він не знає милосердя, не кажучи вже про запеклого ворога ліберальних демократій, відомого п'яницю, ветерана, байкера, скульптора, художника, ненависника комуністів та ще сотні інших речей. Хосе Торібіо Меріно — тисяча різних речей, але найбільше він по-справжньому любить плавання.\n\nНародившись у родині моряків у 1915 році, Меріно від самого початку був пов'язаний із морем. З юних років вивчаючи англійську та французьку, Меріно домінував у своїй військово-морській академії від 15 до 27 років, служачи академії як висхідна зірка — коли Друга світова війна покликала, Меріно не мав іншого вибору, окрім як відповісти через ВМС США. Коли Тихоокеанська кампанія поставила його життя під загрозу вогнем зенітної артилерії, Меріно відкликали з передової через напад малярії, що назавжди пошкодив його слух. Протягом наступного десятиліття Меріно здобув міжнародну популярність завдяки своїй ролі в сутичках з Аргентиною через протоку Біґл та Антарктику, і відтоді для багатьох став обличчям чилійсько-аргентинського конфлікту — для аргентинців він слугує стереотипом для глузування, маніакальним жартом без панчлайна. Для чилійців, однак, він є патріотичним, ексцентричним символом національної ідентичності та плакатним хлопчиком чилійської войовничості — з чим погодиться більшість аргентинців, — хоча тепер він став значно більшим, ніж дехто міг коли-небудь подумати — чи побоюватися: лідером.\n\nОднак після його перевороту багато хто замислюється над спокусливими — чи жахливими — наслідками президентства Меріно, хоча тепер усі в Південній Америці ставлять лише одне питання: як далеко він зайде?"

POLITICS_CHL_SEPULVEDA_GALINDO: "Хосе Марія Сепульведа Ґаліндо, генерал чилійських карабінерів, — проста людина. Карабінери були всім його життям, і протягом служби він завжди демонстрував дві головні риси, за якими його знали всі колеги: схильність до надмірного вживання алкоголю та запальний характер у ставленні до інших.\n\nРадіопатрулі в Сантьяґо, Школа карабінерів, сходження до звання генерала — усе це було відносно просто для поліцейського з Куріко, звичайне просування кар'єрними сходами. Але так тривало не завжди; з часом його обов'язки дедалі більше ускладнювалися через необхідність мати справу з погіршенням політичної ситуації на батьківщині. Але в усіх своїх обов'язках він пам'ятав, що склав присягу; коли його запитали, чи обіцяє він захищати чилійську конституцію та її національний порядок, у нього була лише одна відповідь:\n\n"Так, обіцяю."\n\nЦі слова — які здавалися такими буденними, коли він їх вимовляв, — тепер назавжди визначатимуть спадщину Ґаліндо. На генерала карабінерів покладено обов'язок згуртувати розрізнені конституціоналістські сили проти спроби Хорхе Прата зробити себе новітнім диктатором світу; Ґаліндо виконає свою присягу або загине, захищаючи її."

