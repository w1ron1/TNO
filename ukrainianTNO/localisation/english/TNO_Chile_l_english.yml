#### Leader Descriptions ####
CHL_Jorge_Alessandri: "Хорхе Алессандрі Родріґес"
POLITICS_ALESSANDRI_DESC: "Хорхе Алессандрі завжди казав, що не хотів бути президентом. Зрештою, не його провина, що він народився сином Артуро Алессандрі та братом Фернандо Алессандрі — обидва свого часу відомі президенти, у спадок від яких він отримав увесь тягар, що з цим ішов. Не його провина, що частину своєї юності він провів у вигнанні, зруйнувавши те, що мало стати повноцінним соціальним життям. Не його провина, що найсильніший землетрус в історії спостережень стався посеред його правління, перекресливши його плани. Якби все залежало від нього, Хорхе став би архітектором або принаймні вів би тихе життя — і так могло б бути, якби не тиск і неймовірний збіг обставин.\n\nУсе почалося з послуги його братові, президенту Фернандо: той опинився на дні стрімкого падіння цін на мідь і благав Хорхе перебрати на себе посаду міністра фінансів — не лише заради нього, а й заради Чилі. Його успіхи врятували економіку, але розлютили профспілки — спалахнули масові протести, зруйнувавши ліберальне домінування в Демократичній конвенції. Навіть після того, як його брат залишив посаду, Алессандрі залишився радником президента Коломи, його консервативного наступника — знову ж таки, послуга заради Чилі, не більше. Та сама логіка змусила його вступити в боротьбу за наступного лідера FDdC, попри його відразу до політики — адже Чилі потребувало компромісного лідера, який зможе стримати радикалів, і хто підходив для цього краще за нього?\n\nПопри всі його заперечення, нинішній стан Чилі — провина Хорхе Алессандрі. Ніхто, крім нього, не винен у тому, що він відмовився поступитися консерваторам у 1958 році, розколовши коаліцію та зруйнувавши власну політичну базу. Ніхто, крім нього, не винен у тому, що його аполітичні, технократичні програми стабілізації, хоч і успішні на папері, лише залишили населення бідним і розлюченим на статус-кво FDdC. Ніхто, крім нього, не винен у тому, що апарат FDdC насилу протягнув себе через вибори 1961 року, зазнавши нищівної поразки та змусивши піти на нові компроміси.\n\nДо кінця правління Алессандрі залишилося два роки, а країна як ніколи поляризована, бідна та хаотична. Він сидить на троні з розплавленого скла, який тріщить і обпалює його, пекучо гарячий, поки він уперто бореться з дедалі сильнішим відчуттям приреченості. Хоч би як він скаржився, він відмовляється зробити ще одну помилку — одна необдумана помилка означає, що трон Чилі розірве його своїми палаючими уламками, а разом із ним може забрати й країну. Зрештою, який був сенс у всьому цьому, якщо не заради Чилі?"

CHL_Julio_Philippi: "Хуліо Філіппі Іск'єрдо"
POLITICS_PHILIPPI_DESC: "У 1959 році бути наступником, якого особисто обрав Хорхе Алессандрі, означало б гарантовану перемогу. У 1963 році це, здавалося, означало принизливу поразку. І все ж, коли адміністрація Алессандрі пакує валізи, вона залишає після себе того самого наступника при владі — Хуліо Філіппі, колишнього міністра юстиції, а тепер президента Чилі.\n\nАлессандрі та Філіппі мають багато спільного, якщо дивитися на них разом. Жодним із них не керує політичне прагнення, обидва є незалежними діячами та загалом не беруть участі в парламентських іграх. Обидва — стоїчні, мовчазні люди, які уникають гучних промов на користь стриманих політичних пропозицій. Обидва бачать президентство не як велике особисте досягнення, а як службу, яку вони приймають заради блага нації. Не дивно, що Алессандрі так довго підтримував свого міністра.\n\nОднак ці люди не однакові, попри спроби опозиції зобразити їх такими. На відміну від холодної манери Алессандрі, Філіппі — дружня та доступна людина. Він водночас захоплений і глибоко обізнаний у предметах, що його цікавлять, таких як ботаніка, орнітологія, географія та інші академічні дисципліни. Найважливіше за все те, що управління Філіппі відновленням після Вальдівійського землетрусу принесло йому велику прихильність народу завдяки його спокійній компетентності.\n\nПопри ці відмінності, новому президенту буде вкрай важко вийти з тіні свого попередника. Його незалежна приналежність і загальна відстороненість від партійної політики мають дві сторони — даючи йому свободу ухвалювати власні рішення, спираючись на те, що він вважає найкращим, але водночас породжуючи побоювання щодо ще більшої бездіяльності та глухого кута, якщо він не зможе навести мости. Так само його технократичні погляди були важливою частиною того, чому Алессандрі його підтримав, але ці заходи в найкращому разі суперечливі. З огляду на його манеру поведінки та позиції, багато хто побоюється — і навіть очікує, — що Філіппі незабаром буде поглинутий виром чилійської політики, зникнувши під натиском ідеологів, набагато відданіших своїй справі, ніж він.\n\nМожливо, показово, що серед галасу навколо приходу нового президента ніхто, здається, не намагається запитати самого президента, що він думає. Як би там не було, він вступає на посаду з непохитною рішучістю довести те, що довгий час вважалося неможливим, — що чесний державний службовець може досягти успіху на найвищій посаді Чилі. Чи правильне його твердження — ще належить побачити."

