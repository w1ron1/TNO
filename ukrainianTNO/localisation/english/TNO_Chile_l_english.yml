# Alessandri Cabinet
CHL_Sotero_del_Rio: "Сотеро дель Ріо Ґундіан"
CHL_Arturo_Maschke: "Артуро Машке Торнеро"
CHL_Carlos_Vial: "Карлос Віаль Інфанте"
CHL_Roberto_Vergara: "Роберто Верґара Еррера"

CHL_Sotero_del_Rio_hog_desc: "§YМіністр внутрішніх справ\nНезалежний§!\n--------------\n§LДоктор Сотеро дель Ріо Ґундіан, лікар за професією, політично незалежний діяч і впливовий масон, є правою рукою президента. Близький друг президента ще з часів їхньої спільної роботи в кабінеті президента Фернандо Алессандрі, він обіймає посаду міністра внутрішніх справ. Як лікар, дель Ріо все життя займався державною службою в медицині та пов'язаних із нею сферах. Повернувшись до Чилі наприкінці 20-х років після навчання в Європі, дель Ріо став міністром соціального добробуту при президенті Монтеро після падіння уряду Ібаньєса та анархії, що настала за ним. Його короткий термін перебування на посаді здебільшого був присвячений створенню безкоштовних їдалень і притулків, доки Монтеро не був повалений і за цим не послідувала низка переворотів.\n\nМинуло десятиліття, і він опинився на тому самому місці в кабінеті президента Ріоса, де розбудовував лікарні та робив усе можливе, щоб допомогти знедоленим дітям і молоді. За адміністрації Фернандо Алессандрі він обіймав посаду міністра охорони здоров'я та познайомився і заприятелював із тодішнім міністром фінансів Хорхе Алессандрі. Тепер він обіймає посаду міністра внутрішніх справ і є заступником свого друга.\n\nПопри особисту близькість, однак, Алессандрі починає сумніватися у своєму другові. Сотеро дель Ріо надто войовничий на власну користь, через свій гнів робить із мухи слона, спромагаючись створювати нескінченні бюрократичні кошмари та політичні суперечки, змушуючи Алессандрі прибирати за ним і породжуючи дедалі більше сумнівів у думках свого начальника.§!"
CHL_Arturo_Maschke_for_desc: "§YМіністр закордонних справ\nЛіберал§!\n--------------\n§LБувалий член Ліберальної партії, а також юрист і економіст, Артуро Машке з 1936 року неодноразово обіймав посаду президента Центрального банку Чилі, а 1937 року короткий час був міністром фінансів Артуро Алессандрі. Відтоді він був впливовою фігурою у фінансових питаннях і надійним джерелом допомоги щоразу, коли щось потребувало компетентного управління. Його досвід представника Центрального банку Чилі у відносинах з іноземними банками та міжнародними фондами зробив його очевидним кандидатом на посаду посла Чилі у США, яку він обіймав з 1959 до 1961 року.\n\nПісля поразки FDC на парламентських виборах 1961 року Хорхе Алессандрі був змушений включити лібералів до свого кабінету; відповідно, Машке відкликали з його посади та призначили міністром закордонних справ. Хоча ліберали бажали отримати Міністерство економіки, Алессандрі відмовився навіть розглядати скорочення ролі Хуліо Філіппі в цьому відомстві. Тому Машке виступає головною фігурою істеблішменту в уряді. Звісно, так може бути не завжди: на краще це чи на гірше, посади в адміністрації Алессандрі постійно підлягають змінам. Одного дня людина залишає свою посаду, а наступного може залишитися вже без посади.§!"
CHL_Arturo_Maschke_eco_desc: "§YМіністр економіки, розвитку та відбудови\nЛіберал§!\n--------------\n§LБувалий член Ліберальної партії, а також юрист і економіст, Артуро Машке з 1936 року неодноразово обіймав посаду президента Центрального банку Чилі, а 1937 року короткий час був міністром фінансів Артуро Алессандрі. Відтоді він був впливовою фігурою у фінансових питаннях і надійним джерелом допомоги щоразу, коли щось потребувало компетентного управління. Його досвід представника Центрального банку Чилі у відносинах з іноземними банками та міжнародними фондами зробив його очевидним кандидатом на посаду посла Чилі у США, яку він обіймав з 1959 до 1961 року.\n\nПісля поразки FDC на парламентських виборах 1961 року Хорхе Алессандрі був змушений включити лібералів до свого кабінету; відповідно, Машке відкликали з його посади та призначили міністром закордонних справ. Оскільки Алессандрі був змушений зіткнутися з хитким становищем свого уряду й тому передати контроль лібералам, Машке призначили міністром економіки замість Хуліо Філіппі. З призначенням Машке на цю посаду ліберали отримують свободу почати демонтаж проєкту технократії Алессандрі... на краще це чи на гірше.§!"
CHL_Julio_Philippi_eco_desc: "§YМіністр економіки, розвитку та відбудови\nНезалежний§!\n--------------\n§Lзаповнювач§!"
CHL_Carlos_Vial_sec_desc: "§YМіністр національної оборони\nЛіберал§!\n--------------\n§LКарлос Віаль, міністр оборони Алессандрі, насправді не є кадровим офіцером і взагалі не має прямого стосунку до військової справи. Фактично він інженер.\n\nХоча він не військовий, його жорсткий, могутній характер і ставлення роблять його цілком протилежним до невійськової людини; саме його вольова натура змусила Алессандрі обрати його на цю посаду. Як міністр оборони, Віаль має забезпечувати добрі відносини та співпрацю зі Збройними силами Чилі, оскільки він розуміє, що чим далі військових тримати від політичної сфери, тим стабільнішою буде крихка чилійська демократія.§!"
CHL_Roberto_Vergara_eco_desc: "§YМіністр економіки, розвитку та відбудови\nЛіберал§!\n--------------\n§Lзаповнювач§!"

