 ## Leader Descs ##
 POLITICS_MUSTAFA_BARZANI_DESC: "Багато груп говорять про гноблення, про свою боротьбу за утвердження незалежности у світі, охопленому жорстокими імперіялістами. Та вони не бачать способів, якими самі пригнічують інших, насильства, якого вони завдають в ім'я своїх так званих «революцій».\n\nМустафа Барзані розуміє цей факт краще за більшість людей. Він виріс у в'язниці після того, як турецькі війська ув'язнили всю його родину. Його дитинство було сповнене страт його діда, батька та брата. Будучи підлітком, Мустафа воював проти британських сил і очолював повстання проти них та новоствореної іракської монархії — дії, які призвели до його вигнання. Коли він нарешті повернувся до Курдистану після революції «Золотого квадрата», то виявив, що весь його дім зруйнований, а його народ голодує. Його прохання про допомогу до Багдада зустріли репресіями, які перервав лише турецький наступ у 1959 році та друга війна між Іраком і Туреччиною кількома роками пізніше. Попри все це, Мустафа Барзані ніколи не припиняв боротися за свій народ.\n\nХоча Мустафа Барзані поважав Касима та поблажливо ставився до його обіцянок багатонаціональної республіки, він ніколи не відмовлявся від надії на вільний Курдистан. Він бачить Нафтову кризу як найкращу можливість покласти край століттям гноблення себе та свого народу. Хоча щодо його керівництва й лунають тихі нарікання — переважно через звинувачення у свавіллі та чутки про корупцію, — усі готові відкласти свої претензії вбік і підтримати його, аби не бути змушеними піти в гори та воювати ще одне покоління."
