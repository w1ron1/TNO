 ## Leader Descs ##
 POLITICS_SEYNI_KOUNTCHE_DESC: "Колись народ зарма був лише простими людьми, які виживали під французьким чоботом, а їхня знать робила все можливе, щоб пережити їхнє просування, укладаючи угоди та уникаючи неприємностей. Але тепер вони мають лідера, який має волю та засоби вести зарма до свободи. Сейні Кунтче — саме така людина, людина, пов'язана із зарма історично, яка дає народу Зармаґанди силу протистояти тим, хто є ворогами зарма, як-от Ісса Коромбе та його боротьба з фулані. Однак це лише фасад. Сейні Кунтче був лише людиною, яка опинилася у правильному місці у правильний час. Народившись спадкоємцем Зармакоя Тондікандіє, у глибоко стратифікованому суспільстві зарма до Кунтче та його родини завжди ставилися з великою повагою, а юнак досить рано вступив до навчання у західноафриканській філії французької армії. Після падіння метрополії він поступово піднімався службовими щаблями у Вільній французькій армії.\n\nУ міру того як Вільні французи повільно відступали, Кунтче усвідомив, що зарма залишилися без лідера і що це може стати простим шляхом до здобуття влади. Він швидко скористався нагодою, використовуючи своє становище серед знаті, щоб підбурити зарма під своїм проводом, утвердивши цю територію як свої володіння в Західній Африці, поки Люфтваффе руйнувало все навколо. Однак ця земля випадково опинилася в межах Султанату Сокото, але що вони могли вдіяти? Пекло лилося з небес, і не було жодного способу перешкодити цій людині назвати цю землю своєю. Та одного дня бомбардування припинилися. Сокото були слабкими, а ще важливіше — значна частина їхньої армії складалася із зарма. Кілька промов тут і там — і союзники потягнулися до них. Через кілька місяців після припинення бомбардувань Кунтче проголосив незалежну державу зарма від Сокото. Але контроль Кунтче, схоже, добігає кінця. Народ його ненавидить, а його заступники ненавидять його ще більше. Схоже, Кунтче доведеться зробити кілька складних виборів, щоб утриматися при владі..."

