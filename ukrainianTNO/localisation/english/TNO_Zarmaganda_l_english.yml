 ### Ideas ###
 ZAR_idea_warlord_state: "Держава воєначальника"
 ZAR_idea_warlord_state_desc: "Термін «держава воєначальника» став повсюдним. Його використовують для опису незліченних дрібних держав, але це просте визначення часто приховує складнішу ситуацію. У Зармаґанді це не так. Сейні Кунтче та його армія становлять весь уряд Зармаґанди, а сама Зармаґанда складається лише з територій, які вони захопили. Для багатьох дивно, що Кунтче взагалі досяг якихось успіхів у своєму повстанні проти Сокото, і мало хто очікує, що Зармаґанда проіснує довше за нього."
 ZAR_idea_deficient_administration: "Недієздатна адміністрація"
 ZAR_idea_deficient_administration_desc: "Якщо говорити просто, адміністрації Зармаґанди не існує. Армія Кунтче чинить жорстокий контроль над країною, придушуючи будь-які ознаки заворушень і забираючи все, що їй заманеться, під виглядом оподаткування. Через небажання місцевих чиновників приєднуватися до такого жорстокого та нестабільного уряду, а також через недовіру Кунтче до всіх, крім кількох найближчих офіцерів, уряду Зармаґанди, схоже, судилося залишатися малим і неефективним."
