#Leader Bios
POLITICS_NIC_LUIS_SOMOZA_DEBAYLE_DESC: "Доля має звичку наздоганяти тих, хто найменше цього очікує. Народжений у 1922 році, Луїс Сомоса Дебайле жив життям, властивим будь-якій латиноамериканській еліті. Його відправили навчатися до католицьких академій у Тампі та Нью-Йорку, а згодом він навіть вступив до братства в Університеті штату Луїзіана. У 1947 році він одружився з Ісабель Уркуйо з кохання, вступив до Національної гвардії Нікарагуа, як і його батько, і прямував до того, щоб одного дня стати президентом. Для Луїса цей день був ще далеко. Поки що він був просто сином президента.\n\nА потім прийшла доля. У 1956 році поет застрелив його батька в їхньому рідному місті. Настав час Луїсу посісти трон. Однак Луїс не зберіг залізної хватки свого батька. Йому ніколи не доводилося пробиватися на вершину чи протистояти масштабному повстанню на кшталт повстання Авґусто Сандіно. Насправді Луїс сам вирішив послабити тиск на Нікарагуа. Коли Кубинська революція сколихнула його країну, Луїс реформував конституцію, щоб заборонити негайне переобрання та не допустити висування родичів. Він проклав шлях до інвестиційного буму в країні, а частки аграрної реформи поступово доходили з його кабінету до народу. Та не варто обманюватися. Луїс не реформатор; він усе ще Сомоса. Опозиції не існує, а ті, кому навіть не надали формальності існувати, животіють у його в’язницях. Луїс може бути м’якшою версією свого родинного імені, але він усе ще син свого батька. Коли він обійняв посаду президента, кардинал Нью-Йорка сказав йому: «Я певен, ваш батько був би дуже радий дізнатися, що ви станете його наступником»."
POLITICS_NIC_ANASTASIO_SOMOZA_DEBAYLE_DESC: "Анастасіо Сомоса Дебайле в Нікарагуа не відомий під своїм ім’ям. Його називають «Тачіто», або «маленький Тачо», на честь його батька. Народжений у 1925 році, Тачіто жив життям, дуже схожим на життя свого брата, навчаючись у тих самих школах у Сполучених Штатах. Однак якщо Луїс обрав шлях цивільного, Анастасіо обрав шлях солдата, закінчивши Вест-Пойнт як інженер. Коли батько покликав його назад до Нікарагуа, він став командувачем Національної гвардії. Там він використав своє становище для власного збагачення, налагоджуючи зв’язки, які зрештою знадобилися йому для захоплення президентства.\n\nКоли його брат помер, він недовго сумував. Відбулися театральні вибори, і династія продовжилася разом із ним. Однак Тачіто не інтелектуал, як Луїс. Він успадкував процвітаючу націю й набив кишені з державної скарбниці. Майже половина країни належить одній із його численних компаній, а популізм, який за його родичів тримав народ ситим, використовується дедалі рідше. Як і його батько, Тачіто не терпить інакомислення. Показова опозиція продовжує виголошувати вихолощену критику в Національній асамблеї, але партизани в глухих куточках країни стикаються зі значно жорстокішими репресіями. Видимість демократії в Нікарагуа зберігається, а Тачіто виступає її палицею, тоді як його дружина — морквиною. По країні ширяться чутки, що він ледве розмовляє іспанською або що його брат намагався перешкодити його президентству.\n\nЙого система почала давати тріщини, і народ, який довго був байдужим до свого уряду, може думати лише одне: «Яблуко від яблуні недалеко падає»."
POLITICS_NIC_ANASTASIO_SOMOZA_DEBAYLE_DICTATOR_DESC: "Анастасіо Сомоса Дебайле в Нікарагуа не відомий під своїм ім’ям. Його називають «Тачіто», або «маленький Тачо», на честь його батька. Народжений у 1925 році, Тачіто жив життям, дуже схожим на життя свого брата, навчаючись у тих самих школах у Сполучених Штатах. Однак якщо Луїс обрав шлях цивільного, Анастасіо обрав шлях солдата, закінчивши Вест-Пойнт як інженер. Коли батько покликав його назад до Нікарагуа, він став командувачем Національної гвардії. Там він використав своє становище для власного збагачення, налагоджуючи зв’язки, які зрештою знадобилися йому для захоплення президентства.\n\nТачіто захопив президентство й деякий час правив так само, як до нього його батько. Театральна демократія Нікарагуа продовжила існувати, і він підтримував образ її демократичного керівника. Однак коли геополітичні вітри відвели Тачіто від тиску Янкі, завіса над його демократією опустилася.\n\nЙому більше не потрібно було стримувати свої надмірності чи дотримуватися умов отримуваної допомоги. Тачіто відкрито визнав правду: він та його сім’я — єдина справжня інституція Нікарагуа. Він править так, як вважає за потрібне, адже саме він є джерелом влади. Усе, що відбувається в його країні, має пройти через його стіл, і безсилі політики та протестувальники більше не впливатимуть на його дії.\n\nКажіть що завгодно, але Тачіто знає, що змусив свого батька пишатися ним. Тепер Нікарагуа — це Сомоса, а Сомоса — це Нікарагуа."
POLITICS_NIC_HOPE_SOMOZA_PORTOCARRERO_DESC: "Народжена у 1929 році в Тампі, штат Флорида, Гоуп Портокарреро опинилася частиною однієї з найбагатших родин Нікарагуа. Походячи з довгої низки колишніх президентів, генералів і навіть угорського ветерана революції 1848 року, її родина посіла своє місце серед світської еліти. Її мати навіть була відома як «найвродливіша жінка Нікарагуа». Гоуп провела більшу частину життя у Сполучених Штатах, у таких місцях, як Маямі, Каліфорнія та Нью-Йорк. У 1949 році її відправили навчатися до Швейцарії, де вона також прославилася своєю красою, манерами та приємною вдачею. Після повернення вона вийшла заміж за сина президента Сомоси, і в Національному соборі відбулася пишна церемонія.\n\nВона присвятила свій час у Нікарагуа соціальному добробуту, будуючи лікарні в найбідніших регіонах, намагаючись реформувати пенітенціарну систему та створюючи програми для сиріт по всій країні. Відома своєю красою й чарівністю на дипломатичних зустрічах, вона була людським обличчям холодної зовнішності режиму. Ставши улюбленицею народу Нікарагуа, вона природно стала вибором її чоловіка для президентства після смерті його брата. Сомоси очікували, що правління Гоуп послабить тиск на занепалу, непопулярну систему, яка протягом останніх 30 років виключала власний народ із політичного життя.\n\nПоки народ вітає Гоуп, Анастасіо залишається за лаштунками, зберігаючи їхній контроль під новим, яскравим шаром фарби на «Республіці» Сомоси. Гоуп може мати серце народу, але Анастасіо залишається справжньою силою за нікарагуанською «Есперансою»."
POLITICS_NIC_GOVERNMENT_TRIUMVIRATE_DESC: "Довгий час виключена з будь-якої реальної політичної влади, Консервативна партія залишалася постійною скалкою в боці Сомос. Спочатку здавалося, що вони задоволені самим фактом існування в Національній асамблеї, але з часом їм захотілося більшого. Коли вони перетворилися на справжню політичну загрозу, Сомоси зрозуміли, що з ними доведеться щось робити. Коли в’язниці були переповнені, Сомоса розпочав політичний діалог, щоб принести демократію Нікарагуа — принаймні так він стверджував. Поки найрадикальніша опозиція відкрила вогонь по гвардійцях, спричинивши різанину на вулицях Манагуа, консерватори на чолі з доктором Фернандо Аґуеро Рохою домовилися про створення тріумвірату з трьох осіб, який мав керувати країною та підготувати її до вільних виборів.\n\nПопри пишні церемонії та численні реформи, що розпустили Національну асамблею та скликали Конституційну раду, їхня угода залишила Національну гвардію де-факто виконавчою владою країни. На її чолі стояв Анастасіо Сомоса Дебайле. У Нікарагуа закони — лише для показухи, а справжня влада тепер сидить в армії, як і завжди.\n\nМожливо, за якимось дивом Сомоса та його поплічники віддадуть владу на далеких виборах, коли умови нарешті будуть виконані. А поки що країною керують троє, але лише Сомоса володіє владою."
POLITICS_NIC_CORNELIO_HUECK_DESC: "Хто такий Корнеліо Гюек? Для решти Нікарагуа він був президентом Національної асамблеї. Тихий, невисокий, лисий, товстий чоловік, який завжди стояв поруч із кимось із Сомос. Для мешканців Масая він був відомий як «Ель Сеньйор», людина, до якої зверталися у скрутну хвилину по послугу чи подарунок готівкою. Для його родини він був чоловіком, який приніс їм багатство, честь і славу. Для Сомоси він був його правою рукою. Для себе самого він був нікарагуанською історією успіху.\n\nНароджений у 1911 році в Масая, Корнеліо виріс у землевласницькій родині, пов’язаній з Анастасіо Сомосою ще до його першого президентства. Його елітна родина європейського походження дала йому доступ до якісної освіти. Спочатку здобуваючи фармацевтичну освіту, він зацікавився оподаткуванням і в 1953 році очолив Національне управління прибуткового оподаткування. Він використав свої зв’язки, щоб отримати посаду міністра фінансів, а згодом потрапив до Конґресу від Націоналістичної ліберальної партії. Пробиваючись на вершину, він завжди був найгучнішим голосом у кімнаті, пропонуючи популістські заходи, щоб зберігати «волю народу» в партії, водночас особисто підтримуючи заходи, які зміцнювали владу Сомоси. Людина консервативних і традиційних поглядів, він використовував свою проникливість, щоб втілювати свою розпливчасту політичну філософію в політику, причому багато його ідей сам Анастасіо підписував як закони.\n\nТепер він сам опинився наступником Сомос, продовжуючи гру, яку допомагав створювати. Чи були вибори, що привели його на цю посаду, вільними та чесними? Кому це цікаво? Для Корнеліо мало значення лише те, що народ задоволений і що нагорі перебуває саме він."
POLITICS_NIC_PEDRO_JOAQUIN_CHAMORRO_DESC: "У кожній молодій республіці Латинської Америки завжди була трагічна історія. Молодий, ідеалістичний борець, одержимий прагненням принести своїй нації зміни або власне бачення свободи. Для Нікарагуа такою людиною був Педро Хоакін Чаморро, головний редактор La Prensa, найгучніший голос проти Сомос. Людина, яку ув’язнювали, катували й яка п’ять разів ледь не зустрілася з Богом. Людина, яку мало не вбили, — усе заради мети принести свободу своєму народу.\n\nНароджений у 1924 році в одній із численних багатих кріольських родин Манагуа, Педро провів ранні роки у Сполучених Штатах, навчаючись у низці католицьких академій, зокрема в La Salle, де він був однокласником Анастасіо Сомоси Дебайле. Він продовжив навчання в Мексиці, а після повернення до Нікарагуа перебрав батькову газету La Prensa. Зі шпальт кожного ранку Педро засуджував Сомосу як ніхто інший, здобувши славу завдяки сміливим викриттям, які ставили його життя під загрозу. Він брав участь у змовах із метою повалити кожного Сомосу, який обіймав президентство, за що кожного разу зазнавав арешту й ледь не був убитий. У 1959 році він заручився підтримкою кубинців на рівнинах Чонталес, а згодом здобув достатньо прихильників, щоб відколотися від консерваторів і заснувати UNO. Через кров, піт, слова та сльози Чаморро й UNO боролися за повалення корумпованих тиранів, які грабували власну країну.\n\nТепер, звільнивши її, він очолює порядок денний, написаний у тисячах статей. Можливо, політика стане йому на заваді, але Чаморро не зупиниться, доки Нікарагуа не стане вільною та справедливою для всіх."
POLITICS_NIC_CARLOS_FONSECA_DESC: "Карлос Фонсека — багато хто. Для сомосистів він кровожерливий комуніст. Для UNO він небезпечний радикал. Для решти світу він — сигнал тривоги. Карлос Фонсека повалив режим Сомоси та приніс світові нову форму революції, натхненну Кубою, подарувавши кожному деспоту ще одну причину не спати ночами.\n\nНароджений позашлюбним сином матері з робітничого класу та багатого землевласника, який став сомосистом, Фонсека змалку почав зневажати корумповану еліту Нікарагуа. Його багатий батько допоміг йому здобути освіту, але він змінив прізвище на материнське, щоб вшанувати її боротьбу та трудову етику. Він палко читав Маркса, переходячи з однієї студентської групи до іншої щоразу, коли вважав їх надто буржуазними. Коли почалася Кубинська революція, він уже був затятим марксистом і вирушив вивчати революцію та партизанську боротьбу. Натхнений Авґусто Сандіно та Рухом 26 липня, Фонсека побачив себе в невдалих повстаннях, зокрема в перших днях FSLN. Лише Манагуанський землетрус і огидна поведінка Сомос змусили суспільство піти далі за межі традиційної опозиції. Бідняків масово вербували, і лави FSLN зростали, щоб витіснити Тачіто. Тепер Фонсека очолює народну революцію, поваливши Сомосу, як про це давно мріяв Сандіно.\n\nВін стоїть на чолі країни, яку може збудувати з нуля та сформувати так, як забажає. Але жодна освіта чи боротьба не могли підготувати його до запитання: що тепер?"

#Ideas
### Somoza Dynasty State
NIC_The_Heart_and_the_Fangs: "Серце і ікла"
NIC_The_Heart_and_the_Fangs_desc: "Уже пів століття родина Сомоси є нікарагуанською політикою. Відтоді як США залишили країну в 1933 році, Сомоси були її вірними управителями. Навіть раніше, коли країна вперше була окупована, Сомоси панували на політичній сцені. Луїс Сомоса запровадив деякі реформи, щоб задовольнити народ, але родина збереже своє панування як королі нації, маючи всю владу та багатство Нікарагуа під рукою."

NIC_Somocismo: "Сомосизм"
NIC_Somocismo_desc: "Уже пів століття родина Сомоси є нікарагуанською політикою. Відтоді як США залишили країну в 1933 році, Сомоси були її вірними управителями. Навіть раніше, коли країна вперше була окупована, Сомоси панували на політичній сцені. Луїс Сомоса запровадив деякі реформи, щоб задовольнити народ, але родина збереже своє панування як королі нації, маючи всю владу та багатство Нікарагуа під рукою."
NIC_Somocismo_2: "Трохи надії"
NIC_Somocismo_2_desc: "На подив дедалі меншої кількости людей у Центральній Америці, родина Сомоси зберегла своє становище президентських імператорів Нікарагуа, ще більше посиливши давню хватку родини на важелях уряду. Та попри відверте захоплення влади, Сомоси вдалися до нетипово ліберального кроку, щоб забезпечити майбутнє режиму, призначивши дружину Тачіто Сомоси на посаду президента.\n\nПопри показовий характер першого в історії Нікарагуа жіночого президентства, цей крок виявився напрочуд популярним. Улюбленицю світського товариства, Ла Президенту, пересічний нікарагуанець значною мірою обожнює, і вона, ймовірно, добре впорається із завданням утримання суспільного невдоволення на мінімальному рівні, навіть якщо справжня влада в Нікарагуа все ще залишається в руках її сумнозвісного чоловіка, Тачіто Сомоси."
NIC_Somocismo_3: "Старі звички помирають важко"
NIC_Somocismo_3_desc: "Знову коронований на виборчій урні, республіканський імперіалізм родини Сомоси був підтверджений для нового покоління дедалі більш невдоволених нікарагуанців. Задовольняючись наповненням родинної скарбниці під приводом уявної стабільности, новим спадкоємцем нікарагуанського режиму став Тачіто Сомоса, голова Національної гвардії Нікарагуа та молодший син покійного Анастасіо Сомоси.\n\nЗначно більш авторитарний і непримиренний, ніж його старший брат, прихід молодшого Сомоси знаменує продовження правління президентського непотизму та сфабрикованої демократії. Ширше майбутнє Нікарагуа може бути таким же непередбачуваним, як і все інше за Нового порядку, але Сомоси, як і їхні скарбниці, майже напевно пожинатимуть плоди свого подальшого розкішного життя."
NIC_Somocismo_4: "Рукавички знято"
NIC_Somocismo_4_desc: "Після відходу американців із тла нікарагуанської політики передній план режиму Сомоси в Манагуа набув помітно іншого відтінку. Безцеремонне використання Тачіто Сомосою політичної машини своєї родини тепер майже ні для кого не є секретом, а демократія Нікарагуа стала не більше ніж добре зрежисованим театром для широкого загалу.\n\nПарадоксально, але пересічний нікарагуанець, схоже, пристосувався до цієї нової парадигми з певною приглушеною покорою. Більшість людей задовольняється тим, що живе непомітним життям, доки президентська династія стабільно підтримує відносний мир у Нікарагуа. Можливо, нікарагуанцям ніколи не було за чим особливо сумувати в демократії, а залишилося лише визнати те, що колись було, тим, що є тепер. Нікарагуа — це родина Сомоси, а родина Сомоси — це Нікарагуа."

### Internal Situation
NIC_Bracing_for_Impact: "Готуємося до удару"
NIC_Bracing_for_Impact_desc: "Найбільші страхи Сомос справдилися 1 січня 1959 року. Ідеалісти, підбурені Кастро, повстали проти родини та змусили народ захотіти чогось — змін. Протягом двох років FSLN лише нарощує свою силу, обіцяючи здійснити те, про що мріяв Сандіно. Щоб правління Сомос тривало, сутички та пограбування мають припинитися — шляхом переговорів або, що ймовірніше, насильством."

NIC_The_Tremors: "Поштовхи"
NIC_The_Tremors_desc: "Після вторгнення в Пуерто-Плату, що призвело до падіння одного з давніх правих режимів Латинської Америки, надто охочого загравати з Іберією та Німеччиною, багато членів FSLN прийшли в захват, сприймаючи це як знак неминучого успіху в поваленні режиму Сомоси. Було оголошено про нові наступи, підтримані ідеалістичними та схвильованими партизанами.\n\nУряд Нікарагуа нині насилу утримує свою владу. Майже щоденні лісові сутички виснажують нікарагуанських солдатів, тоді як дедалі більше сіл вітають FSLN. Ті нечисленні символічні реформи, що були ухвалені, майже не сповільнили цього наступу, але доки продовжує надходити американська допомога, їхній червоний приплив зрештою може досягти гребеня."

NIC_Silent_but_Deadly: "Тихо, але смертельно"
NIC_Silent_but_Deadly_desc: "Хоча продовження існування режиму Сомоси було гіркою пігулкою, ліва опозиція в Нікарагуа відмовилася припиняти боротьбу. Замість того щоб відступити, FSLN та інші партизанські рухи використовують згубну присутність Сомоси в Манагуа, щоб іще більше мобілізувати агітаторів проти режиму.\n\nНе бажаючи відставати, сандиністи цілодобово працюють над цією ініціативою. Солдати перебувають у русі, партизанські застави укріплюються, а там, де зброя не потрапляє у внутрішні райони з-за кордону, вона зникає зі збройових складів і вирушає в гори глибинних районів Нікарагуа. Скільки зусиль було витрачено на звільнення від іспанського правління? Скільки ще — на створення Совєцького Союзу? Чимало, але такі люди, як Сомоси, часто є не більше ніж сходинкою на шляху до революції, навіть якщо вона потребує певного часу."


NIC_Somoza_in_Heaven: "Сомоса в раю, Сандіно в пеклі"
NIC_Somoza_in_Heaven_desc: ""

### USA Relations
NIC_Our_Son_of_a_Bitch: ""Наш сучий син""
NIC_Our_Son_of_a_Bitch_desc: "Протягом усього їхнього правління найбільшим благодійником Сомос були США. Хоча через свій авторитаризм вони не можуть бути офіційним союзником ОВН, держава все ж отримує допомогу від організації.\n\nУ міру того як Центральна Америка вступає в нову еру, а американські громадяни дедалі більше насторожено ставляться до диктатури Сомос, Сполучені Штати можуть переглянути своє партнерство з Нікарагуа, і Сомосам, можливо, доведеться знайти нового найкращого друга."

NIC_Our_Son_of_a_Bitch_2: ""Наш сучий син""
NIC_Our_Son_of_a_Bitch_2_desc: "Будь-яка можливість переходу Манагуа під опіку євразійського покровителя згасла, а їхній союз зі Сполученими Штатами закріплено. Навіть якщо він потай бурчить через останню ініціативу Куби чи чергову статтю у Washington Post, що засуджує його правління, Сомоса знову усвідомлює, що краще не кусати руку, яка його годує, і насолоджується новими програмами допомоги та торгівлі, що надходять від американців.\n\nВін також знає, що не варто відмовлятися від минулих зобов’язань. Хоча Нікарагуа невелика, вона все ще має міцно сформовану армію, і Сомоса радий спрямувати і своїх людей, і будь-які кошти, які може виділити, на фінансування міжнародних ініціатив Сполучених Штатів, а також надати Вашинґтону ще одне око для спостереження за розвитком подій у Латинській Америці."

NIC_Falta_de_Respeto: "Falta de Respeto"
NIC_Falta_de_Respeto_desc: "На папері Нікарагуа залишається твердим союзником і продовжить публічно підтримувати американські зусилля в регіоні там, де це відповідає її інтересам. Але Сомоса невдоволений. Постійна американська підтримка Кастро та Ґайтаністів, разом із незмінним засудженням авторитаризму Сомос, переконали його, що Вашинґтон є, у найкращому разі, ненадійним покровителем, а в найгіршому — активною загрозою його режиму та його інтересам, яка нетерпляче чекає нагоди усунути його.\n\nВін уже звернувся до інших міжнародних благодійників і довів, що є спритним бізнесменом. Якщо ця тенденція продовжиться і якщо Сомосу не переконають у протилежному, цілком імовірно, що він знайде спосіб перейти на інший бік. Наслідки цього для американських інтересів можуть бути катастрофічними."

NIC_Our_Son_of_a_BitchEffect: "§gРівень орієнтації на £GFX_GNG_USA_texticon Сполучені Штати:§! [?NIC_US_alignment|0Y]/§V10§!"

NIC_Their_Son_of_a_Bitch_IBR: ""Їхній сучий син""
NIC_Their_Son_of_a_Bitch_IBR_desc: "Американський уряд міг тиснути на Манагуа лише до певної межі. Зіткнувшись із постійними відмовами, Манагуа тепер змінило свою риторику, засуджуючи Вашинґтон водночас як імперіалістичний і вироджений та натомість приймаючи нового союзника. Хоча географічно він не такий близький, схоже, Нікарагуа має намір глибоко інтегруватися у свої нові партнерства, не очікуючи тиску щодо проведення реформ.\n\nПотай Сомоси насолоджуються своєю новонабутою свободою. Кожна нова програма, що надходить з Євразії, приносить не заклики до вільних виборів чи захисту дисидентів, а усміхненого дипломата й міцне рукостискання. Позбавившись ще однієї зовнішньої загрози, Нікарагуа створила новий міцний союз, можливо, на десятиліття вперед."
NIC_Their_Son_of_a_Bitch_GER: ""Їхній сучий син""
NIC_Their_Son_of_a_Bitch_GER_desc: "Американський уряд міг тиснути на Манагуа лише до певної межі. Зіткнувшись із постійними відмовами, Манагуа тепер змінило свою риторику, засуджуючи Вашинґтон водночас як імперіалістичний і вироджений та натомість приймаючи нового союзника. Хоча географічно він не такий близький, схоже, Нікарагуа має намір глибоко інтегруватися у свої нові партнерства, не очікуючи тиску щодо проведення реформ.\n\nПотай Сомоси насолоджуються своєю новонабутою свободою. Кожна нова програма, що надходить з Євразії, приносить не заклики до вільних виборів чи захисту дисидентів, а усміхненого дипломата й міцне рукостискання. Позбавившись ще однієї зовнішньої загрози, Нікарагуа створила новий міцний союз, можливо, на десятиліття вперед."
NIC_Their_Son_of_a_Bitch_JAP: ""Їхній сучий син""
NIC_Their_Son_of_a_Bitch_JAP_desc: "Американський уряд міг тиснути на Манагуа лише до певної межі. Зіткнувшись із постійними відмовами, Манагуа тепер змінило свою риторику, засуджуючи Вашинґтон водночас як імперіалістичний і вироджений та натомість приймаючи нового союзника. Хоча географічно він не такий близький, схоже, Нікарагуа має намір глибоко інтегруватися у свої нові партнерства, не очікуючи тиску щодо проведення реформ.\n\nПотай Сомоси насолоджуються своєю новонабутою свободою. Кожна нова програма, що надходить з Євразії, приносить не заклики до вільних виборів чи захисту дисидентів, а усміхненого дипломата й міцне рукостискання. Позбавившись ще однієї зовнішньої загрози, Нікарагуа створила новий міцний союз, можливо, на десятиліття вперед."
NIC_Their_Son_of_a_Bitch_BRA: "У мене є друг"
NIC_Their_Son_of_a_Bitch_BRA_desc: "Американська політика могла розлютити Сомосу, але ризик повної ізоляції від решти Латинської Америки змусив його діяти. Замість того щоб ризикувати відчуженням континенту заради союзу з байдужими євразійськими державами, Сомоса натомість налагодив міцні зв’язки з військовою хунтою Бразилії. Можливо, вона й не є визнаною міжнародною наддержавою, але образ великого благодійника переважив ізоляцію в Манагуа.\n\nМожливо, це не такий уже й значний геополітичний поворот. Завдяки зв’язкам Бразиліа зі Сполученими Штатами американці спробували налагодити зближення, сподіваючись усунути свої новонабуті вразливості. Однак, попри особисту зневагу та розчарування Сомоси, зрештою він поступиться. Надто багато можна здобути, щоб самих доларів вистачило на крузейро."
NIC_Their_Son_of_a_Bitch_ARG: ""Їхній сучий син""
NIC_Their_Son_of_a_Bitch_ARG_desc: "Американський уряд міг тиснути на Манагуа лише до певної межі. Зіткнувшись із постійними відмовами, Манагуа тепер змінило свою риторику, засуджуючи Вашинґтон водночас як імперіалістичний і вироджений та натомість приймаючи нового союзника. Хоча географічно він не такий близький, схоже, Нікарагуа має намір глибоко інтегруватися у свої нові партнерства, не очікуючи тиску щодо проведення реформ.\n\nПотай Сомоси насолоджуються своєю новонабутою свободою. Кожна нова програма, що надходить з Євразії, приносить не заклики до вільних виборів чи захисту дисидентів, а усміхненого дипломата й міцне рукостискання. Позбавившись ще однієї зовнішньої загрози, Нікарагуа створила новий міцний союз, можливо, на десятиліття вперед."
NIC_Their_Son_of_a_Bitch_ITA: ""Їхній сучий син""
NIC_Their_Son_of_a_Bitch_ITA_desc: "Американський уряд міг тиснути на Манагуа лише до певної межі. Зіткнувшись із постійними відмовами, Манагуа тепер змінило свою риторику, засуджуючи Вашинґтон водночас як імперіалістичний і вироджений та натомість приймаючи нового союзника. Хоча географічно він не такий близький, схоже, Нікарагуа має намір глибоко інтегруватися у свої нові партнерства, не очікуючи тиску щодо проведення реформ.\n\nПотай Сомоси насолоджуються своєю новонабутою свободою. Кожна нова програма, що надходить з Євразії, приносить не заклики до вільних виборів чи захисту дисидентів, а усміхненого дипломата й міцне рукостискання. Позбавившись ще однієї зовнішньої загрози, Нікарагуа створила новий міцний союз, можливо, на десятиліття вперед."
NIC_Their_Son_of_a_Bitch_DOM: "Наш добрий друг"
NIC_Their_Son_of_a_Bitch_DOM_desc: "Хоча ще десять років тому це могло здаватися цілковито несумісним, панування родини Сомоси в Нікарагуа зберігається, лише тепер вона вислизнула з-під американської парасолі в обійми проосівських елементів регіону.\n\nМожливо, президентські династи просто втомилися плазувати перед дедалі мінливішими вимогами Вашинґтона, а можливо, вони щиро вірять у справу своїх нових благодійників. У будь-якому разі режим Сомоси завжди мав більше спільного з Трухільйо в Санто-Домінґо, ніж майже з ким-небудь у Білому домі. Ці відносини можна по-справжньому розвинути, показавши, що молода центральноамериканська держава може запропонувати своїм колишнім союзникам щось справді цінне, попри будь-які... ідеологічні розбіжності, що можуть існувати між рядками."

### Economy
NIC_Coffee_Cattle_Control: "Кава, худоба й контроль"
NIC_Coffee_Cattle_Control_desc: ""Я не хочу освічених людей, я хочу волів" — таким було гасло нікарагуанської економіки відтоді, як Сомоси вперше прийшли до влади. Хоча сільське господарство та промисловість розширилися, економіку стримують Сомоси, яким належить майже кожна галузь у країні.\n\nРодина не ставиться до Нікарагуа як до країни, а радше як до бізнесу чи феодального володіння. Прибуток на першому місці, усе інше — на другому.\n\nОднак останнім часом Луїс вклав чималі кошти в інфраструктуру та розвиток. Чи то добрі наміри, чи просто інвестиція заради майбутніх багатств, міста й дороги вже відчули наслідки, хоча сільські райони залишилися недоторканими."

NIC_Developmental_Death_Grip: "Мертва хватка розвитку"
NIC_Developmental_Death_Grip_desc: "Нікарагуа відійшла далеко від своїх аграрних коренів. Тепер, маючи значну промисловість, Сомоси перетворили Нікарагуа на економічну силу Центральної Америки. З містами, що височіють над конкурентами, Нікарагуа далеко випереджає своїх сусідів.\n\nПопри це економічне зростання, Сомоси все ще є єдиними власниками Нікарагуа. Усі ці фабрики належать Сомосам, а розвиток, започаткований Луїсом, перетікає на банківський рахунок Анастасіо. Хоча країна може розвиватися повільнішими темпами, без керівництва Сомос цей прогрес був би немислимим."

NIC_Managuas_Magic_Trick: "Магічний трюк Манагуа"
NIC_Managuas_Magic_Trick_desc: "Залиште Сомосам зробити неможливе: вони змусили десятки мільйонів іноземної допомоги зникнути! На її місці можна знайти лише кілька мільйонів. Безперечно, це майстерність фінансового мага такого рівня, як Анастасіо Сомоса; лише він має спритність рук, необхідну для такого трюку.\n\nОднак глядачі Сомоси не знайшли в цій виставі жодної розваги. Тисячі лежать мертвими після землетрусу, а людям дали лише крихти для відбудови. Для них це просто чергове пограбування, причому таке, що сталося в найтемнішу годину країни."

NIC_Somocismo_sin_Somoza: "Сомосизм без Сомоси"
NIC_Calm_Before_the_Storm: "Затишшя перед бурею"
NIC_Somocismo_Moderno: "Сучасний сомосизм"
NIC_Somocismo_Moderno_desc: "У 1936 році слово Анастасіо Сомоси було голосом Бога в нікарагуанській політиці. Через 36 років його син чудово знає, що слово його батька, так само як і його власне, має обмежений вплив. Небезпечні потрясіння Другої світової війни та Холодна війна, що настала після неї, давали лише стільки виправдань для утримання влади, скільки можна було використати, — урок, який останні три з половиною десятиліття зробили цілком очевидним.\n\nЗамість того щоб спокушати вітри долі змити режим Сомоси від влади, Тачіто Сомоса вирішив здійснити своєрідний «ребрендинг» президентської династії. Фасад Нікарагуа, звернений назовні, подається як «держава розвитку», ідеологічно неприєднана, щоб зручно тримати великі держави на відстані витягнутої руки. Тим часом заздалегідь організовані вибори та партійна опозиція тривають, і все це заради заспокоєння цивільного населення та забезпечення того, щоб родина Сомоси залишалася єдиним справжнім голосом, який має значення."
NIC_Somocismo_Moderno_2: "Тріумвірат"
NIC_Somocismo_Moderno_2_desc: "Усі організми проходять процес еволюції, включно з театральною демократією Нікарагуа. Намагаючись послабити дедалі сильніший тиск на родину Сомоси, Анастасіо звернувся до Консервативної партії, щоб сформувати хунту, яка працюватиме над новою конституцією та вільними виборами. На папері ця хунта ділить владу між урядом та опозицією, залишаючи посаду виконавчої влади Національній гвардії.\n\nАле насправді демократія в Нікарагуа померла. Чому? Тому що командувачем Національної гвардії є не хто інший, як Анастасіо Сомоса. Будь-яка подоба опозиційних партій і республіканських процесів безцільно складає конституцію, яка ніколи не побачить світ. Диктатура Національної гвардії нарешті вийшла на світло як справжня влада в Манагуа, а маска свободи остаточно сповзла, відкривши правління занепаду та реакції."
NIC_Somocismo_Moderno_3: "Сомоса назавжди"
NIC_Somocismo_Moderno_3_desc: "Анастасіо Сомоса був не просто босом Нікарагуа; він був босом усього, що в ній було. Роки після 1936-го колись навчили Сомос скромности, але часи такої потреби у фальшивій ввічливості минули; старі трюки перестали бути практичними в сучасному світі. Дехто в родині говорить про прийняття лібералізованого образу, але чому б не піти в протилежний бік?\n\nСтворювати подобу демократії взагалі було помилкою від самого початку. Тачіто Сомоса не має над собою очей, критиків, які б його прискіпливо контролювали, і тепер немає жодної причини приховувати той факт, що він єдиний — найбагатша й наймогутніша людина в Центральній Америці. Нікарагуа завжди була феодальним володінням Сомос, і це ніколи не зміниться."

NIC_Eruption: "Виверження"
NIC_Eruption_desc: "Час настав. Міські жителі, які довго були типовими мовчазними прихильниками Сомоси, нарешті були доведені до краю. Після гротескного розкрадання іноземної допомоги, призначеної жертвам землетрусу в Нікарагуа, міські жителі відвернулися від Сомоси, і вулицями, мов лісова пожежа, поширилися заворушення. Серед цих заворушень UNO та FSLN нарешті знайшли союзників у місті, нарешті знайшли опору в самому серці бази підтримки Сомоси.\n\nУ міру того як опір Сомосі зростає, а партизани спускаються до міст, стало зрозуміло одне: вулкан повстання нарешті вивергнувся."

NIC_Callado: "Callado"
NIC_Callado_desc: "У Нікарагуа спалахнуло повстання, і UNO та FSLN скористалися можливістю, щоб нарешті спробувати повалити режим Сомоси. Тепер вони відступають назад у пагорби та тіні, побиті й розгромлені. Це була нелегка боротьба. Сомоса бомбив міста, масово страчував полонених, і по всій країні лежить незліченна кількість мертвих.\n\nОднак, хоча Сомоса міг убити багатьох людей, ідеї, за які вони трималися, досі живі. Одного дня народ Нікарагуа знову повстане, але поки що він залишатиметься мовчазним і пригнобленим. Спершу він має дозволити часу залікувати свої рани."


NIC_From_La_Prensa: "Від La Prensa до El Pueblo"
NIC_From_La_Prensa_desc: "Від своїх перших днів на посаді головного редактора найбільшого опозиційного видання Нікарагуа Педро Хоакін Чаморро пишався тим, що перебував у авангарді народної боротьби проти правління Сомоси.\n\nБудучи невтомним прихильником широкої демократії участі та розважливої політики, він втілив ці принципи у складі очолюваного ним руху; поспіхом сформованого з різноманітних усунутих від влади політичних партій та інших перебіжчиків.\n\nТепер йому випала нагода нарешті втілити на практиці ідеї, про які він кричав останні пару десятиліть, і перетворити UNO з некерованої широкої коаліції колишніх дисидентів на щось, здатне повести Республіку в нову, демократичну еру."
NIC_An_Old_Friend: "Старий друг"
NIC_An_Old_Friend_desc: "Десятьма роками раніше значно молодший Чаморро потиснув руку Фіделю Кастро, ледве заручившись його підтримкою для амбітного військового вторгнення в Нікарагуа.\n\nНевдовзі після цього сто двадцять чоловіків, сповнених революційного запалу та озброєних кубинською зброєю, висадилися в Боако й Чонталесі, сміливо намагаючись повалити Сомосу Дебайле. Ця спроба призвела до того, що Чаморро провів наступні кілька років за ґратами.\n\nЗрештою досягнувши своєї мети за кардинально інших обставин, Чаморро вирішив приєднати свою щойно звільнену країну до Пакту Веракруса, пліч-о-пліч ставши з чоловіками, які колись підтримували його мрію про вільну та справедливу Нікарагуа, а тепер привели його до найвищого крісла."
NIC_The_Sour_Sandinistas: "Розлючені сандиністи"
NIC_The_Sour_Sandinistas_desc: "Як усі раділи можливості кинути виклик деспотичному правлінню Сомоси, так усі тепер у ейфорії насолоджуються наслідками падіння його режиму. Усі, крім FLSN.\n\nЯкщо широкій коаліції UNO було радо залучити найрізноманітнішу коаліцію — від усіляких лібералів до консерваторів, — то тих, хто прагнув піти далі й похитнути глибоко традиційне суспільство країни та її католицькі інституції, цілком закономірно не запросили на свято.\n\nІ тому комуністи та інші представники ліворадикального крила несуть своє обурення просто на ті самі вулиці, де колись бралися до зброї пліч-о-пліч із тими, хто тепер привласнить їхню революцію та оголосить її своєю."
NIC_Foundations_on_Sand: "Основи на піску"
NIC_Foundations_on_Sand_desc: "Всупереч більшості очікувань, останнім подарунком Сомоси Нікарагуа став борг, такий же вражаючий, як і обурливі статки його родини; які так само зникнуть.\n\nХоча допомога від Пакту Веракруса дає більш ніж щедрий поштовх економіці країни, що потерпає від труднощів, цього буде недостатньо, щоб заповнити величезну діру в скарбниці, залишену колишніми власниками цієї землі.\n\nІ поки нова адміністрація Чаморро починає відновлювати промисловість та давати раду з неписьменною глушиною, якою є решта країни, шлях до відновлення, на жаль, залишатиметься довгим."
NIC_Foundations_on_Sand_2: "Основи на піску"
NIC_Foundations_on_Sand_2_desc: "Коли Сомоса втік із Нікарагуа, народ очікував успадкувати його багатство. Реальність виявилася значно більш розчаровуючою. Натомість народ виявив порожню скарбницю та гору боргів; останній фінансовий магічний трюк Сомос.\n\nПограбування Сомосами національного багатства втягнуло Нікарагуа у спіраль, і тепер Фонсеці та FSLN належить знайти з неї вихід.\n\nПерші кроки вже зроблено; масові програми ліквідації неписьменності та відбудова Манагуа вже розпочалися. Разом із допомогою, що надходить від інших соціялістичних держав, FSLN може лише сподіватися, що всього цього буде достатньо, аби вирватися з економічної чорної діри, яку вони успадкували."
NIC_Nicaraguas_Jan_1: "1 січня Нікарагуа"
NIC_Nicaraguas_Jan_1_desc: "1 січня 1959 року Куба подарувала щось світові. Тепер Фонсека та FSLN принесли цей дар до Нікарагуа.\n\nМаси ґерильєрів проходять парадом вулицями столиці та інших міст на святкування, прославляючи FSLN і Сандіно, відзначаючи довгоочікуване звільнення країни від хватки Сомоси. Тим часом Фонсека та FSLN провели час у вигнанні на Кубі після революції Кастро та вивчали процес, через який пройшла Куба після революції. Тепер вони застосовують цей самий досвід і знання до Нікарагуа.\n\nОднак Хунта національної реконструкції тепер мусить зіткнутися з новою перешкодою: численними фракціями, що сперечаються про те, як саме відбудовувати Нікарагуа за соціялістичною моделлю."
NIC_Theory_Into_Practice: "Від теорії до практики"
NIC_Theory_Into_Practice_desc: "Будучи союзниками Інтернаціоналу, соціялістичні союзники спрямували допомогу до Нікарагуа для сприяння відбудові. Саме питання про те, якою буде ця відбудова, тепер мають вирішити Фонсека та FSLN.\n\nФонсека був свідком революції Кастро, а тепер намагається застосувати кубинську модель до Нікарагуа, щоправда, перетворивши її на вдосконалену соціялістичну форму. Однак він також мусить узгодити своє бачення країни з фракціями всередині Хунти національної реконструкції. Дехто тепер виступає за повільний перехід, тоді як інші закликають до масового втручання уряду."
NIC_Revolutionary_Inertia: "Революційна інерція"
NIC_Revolutionary_Inertia_desc: "Фундаментальне правило цього світу полягає в тому, що кожній дії має відповідати рівна їй протидія.\n\nНікарагуа не є винятком.\n\nДемократична опозиція втомилася від того, що їй платять лише порожніми словами. Найбільш антисоціялістичні фракції Національної гвардії та демократичної опозиції почали братися до зброї проти сандиністської загрози. Хватка FSLN над владою почала збиватися з курсу. Якщо їм не вдасться придушити невдоволення опозиції, вони можуть зіткнутися зі справжньою контрреволюцією."


