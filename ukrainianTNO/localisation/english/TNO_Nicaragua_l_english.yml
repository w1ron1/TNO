 NIC_forpol.1.t: "Друзі серед білого дня"
 NIC_forpol.1.desc: "Того дня сонце було нещадним до Нікарагуа. Попри це, американський посол Адлай Стівенсон граційно спустився сходами, усміхаючись не лише через спалахи камер довкола, а й чоловікові, що стояв унизу.\n\n"Адлаю!" Президент Луїс Сомоса стояв випроставшись, оточений військовими генералами та міністрами, з усмішкою, радше відполірованою, ніж щирою. "Ласкаво просимо до Країни озер і вулканів."\n\n"Дякую за привітання, пане президенте." Стівенсон усміхнувся. "І, звісно, вітаю з недавнім обранням. Однак Вашинґтон... дедалі більше занепокоєний вашим урядом, пане Сомоса. Арешти, цензура, зникнення..."\n\nСомоса тихо хихикнув. "І все ж, пане Стівенсон, Вашинґтон досі підписує наші чеки."\n\n"Не з милосердя, мій друже." Стівенсон чемно помахав репортерам, проходячи повз, намагаючись не дати їм підслухати розмову. "Ми створюємо Організацію вільних націй, а одне гниле яблуко псує всю бочку."\n\n"Поки гвинтівки прибувають вчасно..." — сказав Сомоса, зупинившись просто перед кортежем лімузинів, — "...запевняю вас, Нікарагуа залишатиметься найвідданішим союзником по цей бік каналу."\n\nСтівенсон розчаровано поглянув на нього. Американська зовнішня політика винагороджувала відданість більше за все, а не демократію. Він зітхнув, перш ніж сісти в машину, маючи намір відстоювати ліберальні ідеали, але поїхавши з паршивими фотографіями."
 NIC_forpol.1.a: "Просто поновімо наші торговельні угоди. Не варто надто поспішати."
 NIC_forpol.1.b: "Поновімо торгівлю та запропонуймо урядову допомогу. Стабільність теж є пріоритетом."
 NIC_forpol.1.c: "Торгівля, допомога та кулі. Виконаймо все до кінця заради Династії Сомоси."
 NIC_stolen_money_tt: "§YЦя інвестиція не дійде до народу Нікарагуа.§!"
 
 NIC_forpol.2.t: "Сомоса й Америка"
 NIC_forpol.2.desc: "Ти сів на літак із Маямі до Манагуа. На фюзеляжі літака було написано LANICA. В аеропорту ти зупинився випити кави. Пізніше ти пообідав із другом і замовив яловичину. Ти купив місцеву газету. Заселився до готелю. На вечерю їв рибу. Десь у всіх цих транзакціях родина Сомоси отримала свою частку.\n\nТакими є численні статті економічного портфеля Сомоси. Його щупальця глибоко проникли в економіку Нікарагуа. Мало знайдеться секторів усередині країни, де не відчувається присутність Сомоси: у первинному, вторинному та третинному секторах; від видобутку ресурсів до переробки; від банків до ферм, від особняків до багатоквартирних будинків. Навіть якби ти повернувся назад, ти все одно міг би відчути їхню руку на своєму плечі. Вони володіють квартирами в Маямі, клубами вздовж узбережжя.\n\nТи підвів погляд. Над головою пролетів літак LANICA. На борту були представники родини Сомоси, які прямували до свого маєтку в Палм-Біч, Флорида. Можливо, він був зареєстрований на компанію на Віргінських островах, але коли президент [USA.GetLeader] відвідує його, він знає, кому той насправді належить.\n\nТи читаєш газету. Сомоса на першій шпальті, говорить про подальші економічні зв’язки зі Сполученими Штатами. На сторінці — самі обіцянки й похвала. Є фотографія його зі Стівенсоном. Ти бачиш усмішку на обличчі Сомоси, надто широку, щоб бути правдивою. Ти читаєш між рядків. У цій усмішці є напруження. Сомоса щойно вийшов із невдалої зустрічі, коли було зроблено цю фотографію. Щось у тому, як уряд Сомоси подає себе, як поводиться з дисидентами. Надто схоже на Японію. Надто схоже на Німеччину."
 NIC_forpol.2.a: "Та все ж Сомоса — людина Америки. Але надовго?"
 NIC_Somoza_tt: "§F§sДинастія Сомоси§! є §Yскладним§! партнером для §QОВН§!, і якщо ми хочемо зберегти їхню орієнтацію на нас, ми повинні бути готові йти на §Yпоступки§!.§!"

 NIC_forpol.3.t: "Сомоса й Трухільйо"
 NIC_forpol.3.desc: "Ти прокинувся. Вийшов із номера готелю. Взяв газету на рецепції. Сталося саме те, чого ти боявся: Пуерто-Плата зазнала поразки, американська міць здулася. Ти відклав газету й узяв таксі. На тебе чекали зустрічі, угоди, контакти, якими треба було керувати. Надворі ти побачив вулиці Манагуа; таксі та пішоходи рухалися без поспіху.\n\nЗустрічі завершили раніше. Деякі угоди зірвалися, інші довелося переглянути. Твої контакти здавалися тихішими, ніж зазвичай. Ти відчув відлуння Пуерто-Плати через нерішучість у голосах своїх контактів. День завершився невеликим прибутком. Ти ліг спати, думаючи про все це.\n\nПопри численні економічні зв’язки між Нікарагуа та Сполученими Штатами (але ти виправляєш себе: між родиною Сомоси та Сполученими Штатами), ти ледве міг назвати Сомосу чимось більшим за друга гарної погоди. Він охоче приймав американську допомогу й напевно ще охочіше скуповував американську нерухомість. Він був значно менш захоплений прийняттям зобов’язань та обіцянок, які йшли разом із цією допомогою. Реформи навмисно гальмувалися, набираючи обертів лише тоді, коли посол проштовхував їх, тоді як репресії та жорстокість, властиві навіть найдружнішим авторитарним режимам, ставали дедалі нахабнішими за уряду Сомоси.\n\nТи вирішив, що рано чи пізно щось має зламатися.\n\nТи прокидаєшся. Виходиш із номера готелю. Береш газету на рецепції. На першій шпальті — обличчя Сомоси. Заголовок/підзаголовок: "СОМОСА ОГОЛОШУЄ ЗАКОН ПРО ЦЕНТРАЛІЗАЦІЮ" / "ПРЕЗИДЕНТ ПОСИЛАЄТЬСЯ НА ПОТОЧНІ КРИЗИ В ЛАТИНСЬКІЙ АМЕРИЦІ: «МИ МАЄМО БУТИ СИЛЬНИМИ В ЦІ ЧАСИ»"."
 NIC_forpol.3.a: "Ти тихо лаєшся собі під ніс і запихаєш газету назад на полицю."
 NIC_forpol.3.b: "Ти тихо лаєшся собі під ніс і думаєш про ціну збереження орієнтації Нікарагуа."
 NIC_Trujillo_tt: "\n§RНаша нездатність усунути Трухільйо закріпила авторитарне бачення у §SДинастії Сомоси§!.\nУ майбутньому буде важче переконати їх провести реформи.§!"
 
 NIC_forpol.4.t: "Сомоса й Балаґер"
 NIC_forpol.4.desc: "Ти прокинувся. Вийшов із номера готелю. Взяв газету на рецепції. Сталося саме те, чого ти й очікував: Пуерто-Плата зайшла в глухий кут. Трухільйо пішов, Балаґер прийшов. Серед карибських авторитарних лідерів Балаґер здавався цілком розумною людиною. Вони із Сомосою добре порозумілися б. Ти відклав газету й узяв таксі. Вулицями Манагуа таксі ковзало повз вуличних торговців та дітей, що грали у футбол.\n\nТи зустрівся з кількома представниками уряду Сомоси. Під прикриттям торговельних угод і дипломатичного протоколу ти оцінював їхню зацікавленість Домініканською Республікою. Вони позитивно відгукувалися про Балаґера. Вони були задоволені тим, що більш розумний лідер опинився в Санто-Домінґо. Їхня критика Трухільйо у твоїй присутності здавалася формальною, але від чиновників Сомоси ти вже звик цього очікувати. За вечерею зі стейком ти почув, що деякі люди Балаґера прилітали зустрітися з одним із синів Сомоси, з тих, кому можна було довірити приймати гостей у їхньому маєтку в Палм-Біч і представляти інтереси країни їхнього батька.\n\nТи повернувся до номера. Увімкнув радіо. Ти ненадовго замислився над вечірньою чаркою внизу, але відклав цю думку й обмежився склянкою скотчу з шафки номера. Ти відчинив балконні двері та сів на садові меблі. Надворі ти вдивлявся у нічні вогні Манагуа. Зробив ковток. Усе так зручно склалося, чи не так? Усе, чого вони хотіли, — це людина, яка віддзеркалювала б їхню власну поведінку, щоб вони могли виправдовувати власні потурання. Їм потрібна була модель центральноамериканського диктатора, який усе ще міг би готівкою оплачувати американські чеки. Балаґер, принаймні, був кращим прикладом для наслідування, ніж Трухільйо.\n\nТи прокидаєшся. Виходиш із номера готелю. Береш газету на рецепції. На першій шпальті — обличчя Сомоси. Заголовок/підзаголовок: "СОМОСА ВІДВІДАЄ ДОМІНІКАНСЬКУ РЕСПУБЛІКУ" / "НОВА ГЛАВА В ЗОВНІШНІЙ ПОЛІТИЦІ НІКАРАГУА"."
 NIC_forpol.4.a: "Ти відкладаєш газету, не замислюючись."
 
 NIC_forpol.5.t: "Сомоса та Легіон"
 NIC_forpol.5.desc: "Ти прокинувся. Вийшов із номера готелю. Взяв газету на рецепції. Сталося саме те, чого ти хотів: молот свободи розтрощив Пуерто-Плату й Трухільйо. Ти вийшов із готелю в гарному настрої. Сів у таксі, щоб зустрітися зі своїми контактами. Твій гарний настрій на них не передався. Хмара розчарування, немов радіоперешкоди, застелила їхні очі та вуха. Вони не чули твоїх запевнень.\n\nТи знайшов бар на пляжі й помахав рукою приятелеві з Бюро, який приїхав сюди. Це був Легіон, сказали вони. Саме цього вони бояться, коли лягають спати вночі: що Америка вирішить, що її прихильність до регіональної та міжнародної демократії — не просто показуха. Звісно, Трухільйо не був другом Сполучених Штатів. Але тепер Америка починає демонструвати свою силу, і хлопці Сомоси замислюються, чи не відчути їм на собі того самого молота, що впав на Домініканську Республіку. Ти розвернувся на табуреті. Хвилі лагідно накочувалися на пляж. Сонце високо стояло над тобою, освітлюючи все навколо й залишаючись байдужим. Ти зробив ковток пива. Вітер приніс із собою смак чогось гіркого.\n\nТи повернувся до готелю. Обслуговування номерів принесло вечерю. Ти ледве торкнувся стейка. Ти був зайнятий тим, що дивився у вікно на міський краєвид Манагуа, де далекі вогні відбивалися у склі. Десь серед цих вогнів — Сомоса. Що він тепер думає про Америку? На мить тобі здалося, що він дивиться прямо на тебе. Потім ти зрозумів: він дивиться не сюди. Його погляд спрямований на захід, через Тихий океан; на схід, через Атлантику. Він шукає покровителів, які приймуть його таким, яким він є, — стабільним авторитарним правителем.\n\nТи прокидаєшся. Виходиш із номера готелю. Затримуєшся біля входу. На тебе чекає зустріч із чиновником Сомоси. Хтось достатньо високопоставлений, щоб мати його на слуху. Тобі також сказали, що він не надто зацікавлений у зустрічі з тобою. Ти міг би тиснути на нього далі. Але якби ти пропустив зустріч, він би не заперечував. Це лише підтвердило б те, що Сомоса вже думає про Сполучені Штати."
 NIC_forpol.5.a: "Ти прийшов на зустріч, запевнивши Нікарагуа та Сомосу у важливості їхньої ролі."
 NIC_forpol.5.b: "Ти пропустив зустріч; тут уже нічого не можна було сказати, що допомогло б."
 
 NIC_forpol.6.t: "Сомоса й Ґайтан"
 NIC_forpol.6.desc: "Ти прокинувся. Вийшов із номера готелю. Взяв газету на рецепції. Того ранку тобі не було куди поспішати, тож ти влаштувався в готельному кафе, замовив каву й почав переглядати газети. Новини про німецьку колотнечу, що тривала, домінували в міжнародному розділі. Ти пропустив те, кого New York Times вважає переможцем, намагаючись прочитати інформацію між рядків. Ти нічого там не побачив. Це не твій континент; це не твій світ. Крихти яблучного пончика вкривали півсторінки, присвяченої виборам Головного виконавчого директора в Ґуандуні.\n\nУ міжнародному розділі була захована коротка замітка про колумбійський конфлікт. Це привернуло твою увагу. Ти придивився уважніше, але й тут не знайшов нічого для себе. Більшість написаного тобі вже було відомо: Центральний уряд воює з націоналістами та фашистами в усіх напрямках, крім східного.\n\nТи поклав газету на стіл і зробив ковток домашньої кави. Ти пригадав фотографію, яку десь бачив (ти забув де), де Сомоса потискав руку президентові Лауреано Ґомесу Кастро. Це було до інсульту, до того, як Роберто Урданета Арбелаес був протиснутий на посаду президента, до всього іншого, що розірвало серце Колумбії. Навіть з огляду на все це Сомоса все ще міг бути готовий працювати з Центральним урядом. Ти зробив ще один ковток, дивлячись на фотографію свого чоловіка в Колумбії та причину, через яку він більше не може з ними працювати.\n\nКапітан Сальседо навряд чи був тим, кого Сомоса хотів би бачити своїм другом. Ґайтаніст, революціонер і соціяліст; три смаки, яких нікарагуанське піднебіння не сприймає. Карти були в руках Дядька Сема: кого вони підтримають, хто переможе — Сомосі залишалося лише спостерігати. Глибоко всередині ти знаєш, що він боїться того, що може означати ще одна Куба. Дух Ґайтана вийде з революційної Колумбії, і Сомоса боїться, що його грізний дух переслідуватиме його диктатуру."
 NIC_forpol.6.a: "Ти відклав газету й пішов у своїх справах."
 
 NIC_forpol.7.t: "Випробування Нікарагуа"
 NIC_forpol.7.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД СКОТТА БЕРНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Напруженість у відносинах із Нікарагуа\n\n1. Наша допомога URC викликала занепокоєння за межами країни. Уряд Нікарагуа почав відходити від своєї багаторічної підтримки наших спільних інтересів у Центральній Америці, і це може загостритися. З огляду на силу лівих елементів у країні та революцію Кастро на Кубі багато хто побоюється, що наступною може стати саме Нікарагуа.\n\n2. Багато нікарагуанських дипломатів із реальним страхом сприймають нашу позицію щодо Колумбії. Поява лівих противників режиму Сомоси, таких як Карлос Фонсека Амадор, посіяла параною щодо того, що ліве повстання може отримати негласну американську підтримку. Наразі мало що вийшло за межі приватного засудження, але перехоплені повідомлення свідчать, що Сомоса розглядає геополітичну переорієнтацію.\n\n3. Наразі існує очевидний, хоча й керований ризик подальшої ескалації, але наша підтримка Сомоси могла б послабити ці побоювання. Нікарагуа все ще є союзником, але тепер є."
 NIC_forpol.7.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ВИЗВОЛИТЬ ВАС."
 
 NIC_forpol.8.t: "Безпека виборців"
 NIC_forpol.8.desc: "У залі, де проходив імпровізований прийом, більшість дипломатів, як американських, так і нікарагуанських, поринули в розваги та мрії, сміючись із приглушених жартів. Не Майкл Ріс. Він ніколи не хотів бути частиною цієї місії; спочатку його призначили до Перу, потім до Венесуели. Однак чутки про те, що Нікарагуа шукає переорієнтації, виявилися достатніми, щоб перевернути американську політику, змусивши значно розширений дипломатичний корпус працювати понаднормово, аби знову його прихилити.\n\nТост. Луїс Сомоса Дебайле спершу насилу пробрався до передньої частини зали, його постать привернула погляд, який швидко перемістився до натовпу, коли він постукав виделкою по своїй чашці. Оживившись, він почав говорити, і його голос одразу набув сильнішого акценту, а слова полилися вільніше, коли він хвалився своїми минулими сумнівами та поверненням до американського шляху. Під вигуки схвалення він проголосив свою підтримку американських дій по всьому світу, аж до колумбійського питання, яке колись було вирішальним фактором.\n\nПролунали оплески, а полегшення непомітно змішалося із загальною підтримкою. Вранці, звісно, ця промова стане формальнішою. Сомоса надішле нові послання пресі, і їхні статті про Колумбію змінять тон від екзистенційного страху до цілковитої байдужості. Протягом наступних кількох днів гроші тихо потечуть до Манагуа, а заходи Сомоси стануть лише трохи розкішнішими. І знову режим, влаштувавшись на своєму місці всередині американської гегемонії, продовжить існувати.\n\nДосі стоячи осторонь, Ріс намагався це виправдати. Він знав, за що виступала династія Сомоси і до чого призведе її подальше правління. І все ж він знав, куди все це могло б піти інакше. Якби Сполучені Штати справді відкинули Нікарагуа, ті просто кинулися б в обійми Німеччини або Іберії. Це було найкраще, що можна було зробити, щоб не допустити утворення цієї прогалини. Поки його внутрішні розрахунки намагалися виправдати цей крок, Ріс протиснувся ще глибше в натовп."
 NIC_forpol.8.a: "Думки, загублені у статус-кво."

 NIC_forpol.9.t: "Світлі сторони"
 NIC_forpol.9.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД СКОТТА БЕРНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Американсько-нікарагуанські відносини\n\n1. Хоча поразка URC у Колумбії відкинула американські інтереси в регіоні назад, ця поразка не залишила нас цілком безпорадними. Багато авторитарних лідерів, незадоволених нашою минулою підтримкою Ґайтаністів, як-от Сомоса в Нікарагуа, почали докладати зусиль для відновлення зв’язків і скоротили співпрацю з геополітичними суперниками.\n\n2. Обговорення між американськими та нікарагуанськими дипломатами останніми тижнями стали позитивнішими. Певне занепокоєння нашою підтримкою URC все ще залишається, але воно виражається у формі пошуку запевнень, а не прямого засудження. Нещодавно численні нікарагуанські підприємства також зробили спроби отримати нові американські контракти, що свідчить про повернення до довоєнних відносин.\n\n3. Без цілковито примирливої політики малоймовірно, що Сомоса повністю відмовиться від своїх нещодавніх заходів. Однак немає підстав вважати, що такі кроки вийдуть за межі риторики. За відсутності непередбачених подій Нікарагуа має залишатися орієнтованою на Сполучені Штати, що повинно зменшити ціну нашої поразки в Колумбії."
 NIC_forpol.9.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ВИЗВОЛИТЬ ВАС."
 
 NIC_forpol.10.t: "Диктаторська зрада"
 NIC_forpol.10.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД СКОТТА БЕРНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Американсько-нікарагуанські відносини\n\n1. Наша підтримка Ґайтаністів не минула без наслідків. Багато наших авторитарних союзників сприймають наші кроки як ознаку ширших змін політики, які можуть бути спрямовані проти них, тоді як такі авторитарні лідери, як Сомоса, почали формалізувати попередні зусилля з відходу від своїх колись тісних зв’язків зі Сполученими Штатами.\n\n2. У Нікарагуа риторика проти американських дій лише посилилася. Дипломатичні місії відкликано, а торгівля та військова співпраця різко скоротилися. Перехоплені повідомлення також свідчать про спроби Нікарагуа налагодити контакти з режимами в Європі. Страх перед майбутнім лівим повстанням став невротичним, хоча певного підґрунтя йому надає повстання Фонсеки.\n\n3. На цьому етапі мені важко уявити, як це можна врегулювати, навіть якщо ми повністю припинимо підтримку Колумбії. Багато заходів, вжитих Нікарагуа, незворотні, а на їхнє примирення підуть роки, особливо з огляду на їхній поворот до Європи. Однак через ширше розчарування авторитарних лідерів, які колись були нам віддані, будь-яка реакція на поворот Сомоси має бути ретельно зваженою."
 NIC_forpol.10.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ВИЗВОЛИТЬ ВАС."
 
 NIC_forpol.11.t: "Вихід із Нікарагуа"
 NIC_forpol.11.desc: "Першою ознакою того, що щось було не так, стала сама присутність Ліліан Сомоси де Севілья Сакаси. Вона ніколи не була прихильницею відвідувати засідання ОАД; натомість її посада завжди передбачала участь у зустрічах і заходах, що проводилися в Нью-Йорку. Її присутність на засіданні, за цілковитої відсутності типового нікарагуанського представника, вже була приводом для очікуваних дискусій. Вона залишалася тихою, але ледь-ледь, коли зустріч повільно наближалася до неї.\n\n"Роками ми старанно працювали в межах Організації американських держав, сподіваючись, що наші зусилля допоможуть забезпечити стабільність континенту", — вигукнула вона, нахилившись до мікрофона. "Але тепер ми бачимо, що працювали заради неправильної справи. Сполученим Штатам байдуже до країн цієї групи. Вони бачать у нас лише пішаки у своїх геополітичних іграх". Поки вона говорила, зал охопив галас, хоча б через шок від того, що саме вона від Нікарагуа виголошує цю промову.\n\n"Тепер ми знаємо, на чиєму боці стоять Сполучені Штати. Вони стоять на боці радикалізму, екстремізму глобального марксизму. Відмовляючись навчатися на провалі ідеології, що знищила Росію, вони підтримали більшовиків по всьому світу! Від Пуерто-Плати до Колумбії та Індонезії вони обрали хаос замість порядку. Якби президент отримав те, чого хотів, ми всі стали б совєтами!" Жваві дискусії тривали, але почали стихати. Усі знали, до чого це веде, і навіть ті, кому було незручно через Боготу, почали замовкати.\n\n"З огляду на це я не бачу майбутнього Нікарагуа в цій Організації. Наш президент докладав зусиль, щоб подолати минулу прірву, але всі наші спроби примирення ні до чого не привели". Нарешті остання група замовкла, а її промова відлунювала в німому коридорі. "У такому становищі ми не бачимо причин залишатися тут і назавжди залишимо цю марксистську організацію". Ніхто з присутніх не аплодував, лише кілька покашлювань позначили фінал — і промови, і американсько-нікарагуанських зв’язків."
 NIC_forpol.11.a: "За ними не сумуватимуть."

 NIC_forpol.12.t: "Вступ до Нікарагуа"
 NIC_forpol.12.desc: "Сполучені Штати знайшли той міфічний моральний хребет, про який так люблять говорити. Велика родина Сомоси, сюзерени Нікарагуа, розірвала відносини зі своїми колишніми благодійниками. США більше не могли терпіти надмірного накопичення особистого багатства та влади цією правлячою родиною. Династія в кожному сенсі цього слова, що править за старою традицією божественного права. Вони особисто збагатилися до приголомшливого ступеня. За приблизними оцінками, їм належить 18% території Нікарагуа, а активи під контролем родини становлять 25% ВВП країни. Навряд чи варто дивуватися, що все це супроводжується повсякденним придушенням будь-якого інакомислення та демонтажем будь-якої опозиції.\n\nЖахливо шкода, що американцям, здається, бракує шлунка для того, що є безперечно важливим стратегічним активом. Нікарагуа розташована між континентом і двома океанами, з режимом, який, так, мінливий, але безперечно стабільний і прагне отримати кращу угоду від будь-кого, хто її запропонує. Ми все ще мусимо бути особливо уважними до всіх можливих ризиків і маємо зазначити, що Сомоси свідомо довели свої відносини зі Сполученими Штатами за межу неповернення.\n\nУ цій сфері ми можемо прийняти певний рівень ризику. Повне захоплення держави режимом, який він контролює, є принаймні частковою гарантією того, що угоди з ним будуть виконані, а не спалені у вогні революції. Основу для використання цієї дипломатичної суперечки вже закладено, і наш висновок полягає в тому, що ми повинні повною мірою скористатися цією можливістю."
 NIC_forpol.12.a: "Час долучитися до сімейного бізнесу."
 
 NIC_forpol.13.t: "Вступ до Нікарагуа"
 NIC_forpol.13.desc: "Поки ми говоримо, іберійські озброєння та людські ресурси продовжують вирушати до Нового Світу в спробі відновити суворий вплив Старого. Подібно до Колумба та королеви Кастилії, наш благородний Союз прагне знову прив’язати себе до своїх колишніх колоніальних підданих. Колись іспанські та португальські кораблі прибували до цих тоді ще незнайомих вод як завойовники, а тепер у цю епоху вони повертаються як визволителі від тиранії доктрини Монро.\n\nПісля того як Республіка Колумбія нарешті завершила свою громадянську війну, можливості хоч і скромних Іберійських збройних сил та промисловості було доведено. Цю військову перемогу майже так само широко святкували в Мадриді та Боготі, як і численні вілли та маєтки династії Сомоси в Нікарагуа, часто за участю тих самих високопосадовців.\n\nМіж цими святковими прийомами та супровідними військовими парадами вищі ешелони трьох держав готують і дипломатичний тріумф, фактично два. Один полягає у формальному союзі між Боготою та Манагуа, а інший закріплює їхні взаємні зв’язки з Мадридом. Крім того, обидві країни виявили зацікавленість у розширенні цього договору до повноцінної організації, яка об’єднала б антиамериканські держави регіону в єдиний щит.\n\nМожливо, саме цей момент у майбутньому назвуть іскрою Іберійського десятиліття, якщо не Іберійського століття. Звісно, лише нікчемна людина не мріяла б про більше. Якщо Сомос, колись затятих прохачів Вашинґтона, можна повернути, то кого ще можна було б залучити під парасольку Іберії?"
 NIC_forpol.13.a: "Гавана? Ліма? Мехіко? Можливо, ті старі наші карти все ще можуть стати в пригоді..."

 NIC_forpol.14.t: "Богота падає, Манагуа хитається"
 NIC_forpol.14.desc: "Нотатки з розмови з президентом Нікарагуа Сомосою Дебайле — підлягають розшифруванню та передачі кабелем. Надзвичайно секретно.\n\nПрезидент Сомоса виглядав помітно нервовим і нездоровим. Блідий, спітнілий. Ледь торкнувся вечері зі стейком. Швидко говорив, зосередившись на Колумбії, оплакуючи падіння антиамериканського уряду Боготи. Після власного нещодавнього рішучого розриву з Вашинґтоном і виходу з ОАД будував тісне партнерство. Наголосив, що шляху назад немає, і шукатиме нового міжнародного партнера. Очевидний жест у наш бік, хоча він також звернувся до наших суперників. Відчай може дозволити нам встановити умови.\n\nСомоса зазначив зростання популярності фашизму серед Національної гвардії Нікарагуа — частково під впливом відрядження до Колумбії. На обличчі Сомоси було помітне певне занепокоєння. Прагне врятувати колумбійську ситуацію та продемонструвати своїм військам спроможність режиму, змінивши орієнтацію з переможеного Центрального уряду на Другу патріотичну армію або Нову Гранаду. Природно, ми рекомендували Сомосі нашого власного колумбійського партнера.\n\nПісля вечері Сомоса пішов до лімузина, що чекав біля посольства. Очевидно, що якщо ми продемонструємо військову міць у громадянській війні в Колумбії та забезпечимо країну за нашим табором, Манагуа піде слідом. Рекомендую збільшити ресурси для наших зусиль там — залучення цих клептократів до нашої сфери впливу буде більш ніж вартим цього."
 NIC_forpol.14.a: "Два птахи чекають, нам залишається лише кинути камінь."

 #Japanese Alignment
 NIC_forpol.15.t: "Сомоса в Калі"
 NIC_forpol.15.desc: "Транскрипція промови президента Нікарагуа Сомоси в Університеті Вальє в Калі, Колумбія\n\n"Я вдячний Асоціації за запрошення виступити сьогодні. Коли я дивлюся на цю залу й на ваше місто, я бачу плоди безпеки та процвітання. ANDI була невтомною силою заради них у Калі, Новій Гранаді, і незабаром поширить і те, й інше по всій Колумбії. Я вітаю ANDI та всіх присутніх у цій залі з вирішенням Ла Віоленсії та знаю, що на вас і ваших співвітчизників чекає велике багатство.\n\nАле не буде применшенням визнати, що ви не зробили цього самі. Японія була вірним другом вашої країни, як і всіх тих, хто виступає за процвітання та безпеку по всій Латинській Америці. Поки Вашинґтон вагається або, що ще гірше, вирішує підтримати атеїстичних комуністів, які загрожують знищити наші суспільства та нашу власність, Токіо діє.\n\nЯ, моя родина, Національна гвардія та народ Нікарагуа дякуємо вам і дякуємо Японській імперії за вигнання примари соціялізму з цієї життєво важливої частини Латинської Америки. Ми з нетерпінням чекаємо на реалізацію комерційних можливостей, що тепер розквітають між нашими трьома державами.""
 NIC_forpol.15.a: "Іди за грошима — і там знайдеш Сомос."

 NIC_forpol.16.t: "Вісь Манагуа—Токіо"
 NIC_forpol.16.desc: "Після успішних перших заходів режиму Сомоси Нікарагуа офіційно оголосила про свій новий союз із Японською імперією та її нещодавно переможними колумбійськими союзниками. Поки ми говоримо, військові й дипломатичні аташе з Токіо вже почали зближуватися з родиною Сомоси, тоді як спільно з Національною гвардією Нікарагуа плануються навчання колумбійських військ. Консолідація японської присутності в Латинській Америці, хоча й досі дуже свіжа, схоже, просувається гладко.\n\nНе менш важливим за розширення Сфери спільного процвітання в Нікарагуа є вплив нових союзницьких зобов’язань Сомос на уряд Нікарагуа. Або, можливо, так було б у будь-якій іншій країні. Гегемонія династії Сомоси над більшістю аспектів економічного життя забезпечила те, що зміна здебільшого обмежилася прапорами вантажних кораблів у доках.\n\nОднак є одна сфера, де зміни стали помітними. Через більш індустріалістичну спрямованість Токіо та відсутність ринку для товарної сільськогосподарської економіки Нікарагуа почали розроблятися плани відкриття кількох нових фабрик у Манагуа, що знаменує поворот режиму Сомоси до девелопменталізму. Успіх такого повороту поки невідомий, але можна втішатися тим, що він призведе до сильнішої Нікарагуа... якщо кошти не будуть повністю розкрадені."
 NIC_forpol.16.a: "Нагадування Вашинґтону та його прихильникам із Волл-стріт, що Токіо теж уміє грати нечесно."
 NIC_forpol.16.b: "Вони зрікаються Старої Вітчизни заради нового капіталу."
 NIC_forpol.16.c: "Якщо японці думають, що ми просто спостерігатимемо, як вони запускають свої щупальця на нашому задньому дворі..."

 #Italian Alignment - Unused
 NIC_forpol.17.t: "Нова Гранада перемагає"
 NIC_forpol.17.desc: "Хто посміє сказати, що Італійська імперія коли-небудь була лише другорядним гравцем на світовій політичній арені? Хто скаже, що історія італійської дипломатії не має спільного коріння з іменами Марка Антонія, Макіавеллі та Гарібальді? Ми не просто ще одна фігура на вічно мінливій дошці, адже сама гра, в яку грає весь світ, побудована на римському фундаменті, чиї польоти дипломатичної фантазії були настільки високими, що все це могло здаватися лише грою!\n\nПогляньмо на Нову Гранаду, де фашистська революція прокотилася через Анди, несучи наш найславетніший спосіб життя аж до Південної Америки та Карибського басейну, аж до підніжжя Американського Колоса! Але наші успіхи на цьому не закінчуються, адже інші держави регіону тепер стають свідками латиноамериканського фашистського відродження та прагнуть наслідувати його самі.\n\nДалекий від нас географічно, Нікарагуа, колись уособлення американської співпраці в Центральній Америці, наважилася відірватися від капіталістів у Вашинґтоні, але нерозважливо шукала прихистку в обіймах своїх колишніх володарів в Іберії. Із падінням уряду Боготи так само відступив і вплив Мадрида в Південній Америці, залишивши Нікарагуа на самоті в морі дедалі більшої недовіри, підігрітої американською агітацією.\n\nЯк і слід було очікувати, родина Сомоси в Манагуа сподівається виправити цю тимчасову помилку судження, оголосивши про підтримку нового режиму в Новій Гранаді. Хоча їхня спроба підірвати фашистський вплив у Латинській Америці, безперечно, не буде забута, ми не настільки не сприймаємо розрядку, щоб відмовитися від щасливого спільника в подальшому розширенні впливу Імперії в Америці.\n\nДля цієї великої кампанії ми залишимо минуле в минулому й приймемо Сомос у свої обійми! Це неодмінно розлютить Сполучені Штати через те, що ми вихопимо їхнього колишнього товариша просто з-під носа, але нехай це стане уроком про необхідність поважати авторитет Рима!"
 NIC_forpol.17.a: "Наші нові союзники значно доповнять новознайдене становище сили Італії в Америці!"
 
 NIC_forpol.18.t: "Італо-нікарагуанська орієнтація"
 NIC_forpol.18.desc: "Перемога Нової Гранади в Андах являє собою справжній перелом у веденні державних справ у Латинській Америці, оскільки фашистське сходження в Боготі стане очевидним доказом для всіх скривджених держав Центральної Америки та Карибського басейну того, що Американський Колос має над ними владу лише доти, доки вони самі відмовляються від сили свого національного характеру. Їм потрібно лише позбутися архаїчних інституцій і доктрин, щоб реалізувати свій справжній потенціал.\n\nНавіть союзники Янкі бачать це, адже перемога Нової Гранади змусила давніх співробітників Вашинґтона побачити плоди амбіцій Рима в регіоні. У Нікарагуа, добре відомій як прихильна до інтересів Сполучених Штатів за президентської династії Сомоси, уряд, схоже, відмовився від будь-якої видимості продовження союзу з Америкою. Побачивши споріднений дух у новій прихильності Нової Гранади до фашизму, родина Сомоси офіційно оголосила про підтримку Італо-колумбійського блоку, твердо узгодивши себе з інтересами Італійської імперії.\n\nДля керівництва в Римі це стало абсолютним переворотом, оскільки любовний роман Анастасіо Сомоси з американським втручанням сягає поколінь. Там, де Сомоса колись вважався затятим союзником президента США, тепер багато хто проводить паралелі між ним і Рафаелем Трухільйо як із новим обличчям італійського південноамериканського союзу. Однак те, що Італії та Новій Гранаді вдалося похитнути такого палкого американофіла й залучити його до фашистського блоку, якою б незначною не здавалася ця перемога, безперечно варте святкування."
 NIC_forpol.18.a: "Ґраціє, Нікос!"

 #German Alignment
 NIC_forpol.19.t: "Ґусячий крок у Манагуа"
 NIC_forpol.19.desc: "Анастасіо Сомоса був кадетом у Вест-Пойнті. Він був гостем на коронації вигнаної британської королеви Єлизавети в Торонто. Він був другом президента Ніксона — наскільки чоловіки на кшталт Сомоси та Ніксона взагалі могли мати друзів. Зв’язок між династією Сомоси та «Вільним світом», іншими словами, історично був досить міцним.\n\nАле в повітрі відбулися зміни, коли SPA пройшла ґусячим кроком через Боготу. Несподівана перемога ґерманофілів у Колумбії майже одразу підбадьорила ґерманофілів по всій Центральній Америці стати сміливішими — і Нікарагуа не стала винятком.\n\nУ Президентському палаці Сомоса спостерігав поверх оправи окулярів за розвитком ситуації — одного дня поліцейський звіт про інтелектуала, який симпатизує фашизму й продає зал для лекцій, наступного — небажана тирада одного з його генералів про чесноти Гітлера. Насправді однодумці в його уряді дедалі більше заохочували Сомосу зміцнювати національні зв’язки з Німеччиною, тепер, коли вона створила такий значний плацдарм у сусідньому регіоні.\n\nУряд, тобто його родина, вагався щодо рішення, і не лише через те, що його батько оголосив війну Німеччині ще в 1941 році; відчинивши одні двері, ці, він зачинив би інші, а бізнесмен у Сомосі хотів знати, що йде правильним шляхом, перш ніж поставити свої американські активи під загрозу конфіскації FBI. А втім, як щодо нових можливостей, які це відкривало для його портфеля? Фюрер був ні вашим ні нашим, але гроші Фюрера були хороші."
 NIC_forpol.19.a: "Анастасіо Сомоса почав набирати номер свого бухгалтера."
 
 NIC_forpol.20.t: "Сомоса на Рив’єрі"
 NIC_forpol.20.desc: "У затишному маленькому кафе на Французькій Рив’єрі Анастасіо Сомоса насолоджувався кавою та сигаретою, поки післяобіднє сонце хилилося до горизонту. На його столі лежали папки з фотографіями та договорами купівлі-продажу його нових маєтків у цьому районі. За двома столами обабіч Сомоси сиділи серйозні чоловіки в костюмах — його особиста охорона. У кутку дві місцеві літні жінки невинно пліткували.\n\nТе, що президент Нікарагуа взяв своїх охоронців та бухгалтерів у подорож на приватному літаку, не було незвичним, але трансатлантична подорож була. Однак нещодавні події — найважливішою з яких була перемога SPA в Колумбії — заохотили Сомосу розширити свій портфель на нові ринки, і з кожним рукостисканням перспектива інвестування в орієнтовану на Німеччину Європу ставала дедалі прийнятнішою. Зрештою, яка різниця між спекуляціями з нерухомістю на узбережжі Французької Рив’єри та у флоридських Еверґлейдс?\n\nУ будь-якому разі, варто було подбати про власну кишеню, оскільки його уряд отримав нові одноразові витрати; деякі німці, яких вислали з Нікарагуа, повернулися й могли очікувати на компенсацію від уряду. Його міністри дошкуляли йому подробицями ще на злітній смузі — фармаколог і його родина, театральний актор — а Сомоса відмахнувся від них.\n\nСомоса відкинувся на спинку крісла й замислився над поточними подіями, відчуваючи внутрішню огиду до цієї гітлерівської хвилі в Колумбії, Нікарагуа та деінде. В Америці були люди, які могли стати маленькими Гітлерами — на думку спадав Трухільйо, але навіть у межах ОАД були такі, — але сам він ніколи не міг бути таким лідером. У нього було надто багато впливу для цього."
 NIC_forpol.20.a: "Він замислився, чи є гроші в будинках для відпочинку на Чорному морі."
 NIC_GER_Alignment_tt: "§FТепер, коли §xгромадянська війна в Колумбії§! завершилася, а вплив §jПакту§! домінує, §$$Нікарагуа§! знайде нового покровителя в §jГерманії§!."
 NIC_JAP_Alignment_tt: "§FТепер, коли §xгромадянська війна в Колумбії§! завершилася, а вплив §eСфери§! домінує, §$$Нікарагуа§! знайде нового покровителя в §eТокіо§!."

 NIC_forpol.21.t: "Прощавай, старий друже"
 NIC_forpol.21.desc: "Інформація про дуже тривожний розвиток подій надійшла незалежно й майже одночасно як від FBI, так і від Державного департаменту. І ми мусимо вирішити, як діяти.\n\nБуло виявлено, що уряд Нікарагуа в рамках таємної угоди з недружнім режимом у Боготі відправляє повітрям і морем великі обсяги «обладнання» та іншої допомоги, вміст якої наразі невідомий. Однак, з огляду на відносно обмежені військово-промислові ресурси Нікарагуа (порівняно з нами) та конкретні потреби режиму Боготи, вважається дуже ймовірним, що ця допомога включає великі обсяги американського військового обладнання, раніше переданого цій країні.\n\nХоча воно, безперечно, буде старішої моделі й тому менш спроможним, ніж сучасні запаси, отримання американського обладнання режимом Боготи є небезпечною ескалацією і просто неприйнятне з дипломатичної та військової точки зору.\n\nРозроблено плани дій у надзвичайних ситуаціях — передусім із залученням як морського, так і повітряного перехоплення. Якщо кораблі буде захоплено, а літаки збито, обладнання не зможе бути передане. Крім того, якщо втрати будуть достатньо значними, ймовірно, нікарагуанський режим зрештою припинить здійснювати передачі.\n\nНам потрібен лише наказ."
 NIC_forpol.21.a: "Серйозне рішення, над яким варто замислитися."

 ##Fires during Iberian Wars Sphere Creation
 NIC_forpol.22.t: "Сомоса й Сантьяґо"
 NIC_forpol.22.desc: "Державний департамент повідомив нам про неминучий розвиток подій у Латинській Америці. Завдяки регіональному впливу інших країн цього регіону Нікарагуа підписала необхідні протоколи, щоб приєднатися до Форуму Сантьяґо як повноправний член і партнер.\n\nЗ огляду на значне багатство режиму Сомоси та численні організації, які він контролює як усередині країни, так і за її межами, вони мають і спроможність, і бажання інвестувати в інфраструктуру та військові спроможності інших членів Форуму й розвивати їх незалежно від американського впливу. Це дуже тривожно, особливо якщо йдеться про режим Боготи та його рішучу антиамериканську позицію, і ми прогнозуємо значне підвищення їхнього рівня майстерності найближчим часом унаслідок цього.\n\nНам потрібно залишатися пильними щодо можливостей впливати на ці процеси та перешкоджати їм, оскільки вони являють собою подальше послаблення нашого м’якого контролю над регіоном, сприйняття сили ОВН і потенційний канал для втручання іноземних держав у Південну Америку. Дядько Сем не повинен виявитися нездатним протистояти цьому ще більшою мірою."
 NIC_forpol.22.a: "Дуже тривожно."
 
 NIC_forpol.23.t: "Колумбійсько-нікарагуанський союз"
 NIC_forpol.23.desc: "Державний департамент із обережним оптимізмом представив оновлену інформацію про двосторонні відносини між Нікарагуа та Колумбією після нещодавнього підписання в Боготі взаємної угоди про союз і оборону.\n\nЗа словами нашого посла в країні, угода, підписана міністрами закордонних справ обох країн і майже одразу після цього відповідно ратифікована, закладає основу для взаємної допомоги під час внутрішніх заворушень як початковий крок. З огляду на ситуацію в обох державах, цілком імовірно, що це прикриття для підготовки значного втручання Нікарагуа, як обладнанням, так і особовим складом, у колумбійську війну. Це також відкриває шлях до подальшої співпраці.\n\nЦе суперечливий розвиток подій. Такі незалежні дії ще більше демонструють дедалі більшу незалежність Нікарагуа та її намір діяти без попередніх консультацій із Державним департаментом, але водночас вони демонструють дуже близьке розуміння американських зовнішньополітичних прагнень. Ця дія ідеально відповідає нашим довгостроковим цілям впливу в Латинській Америці, навіть якщо ми не контролюємо її повністю.\n\nСама угода вже чинна. Ми повинні бути пильними щодо подальших дій і визначити, наскільки ми хочемо в них залучатися, особливо коли автономія менших держав сприяє досягненню цілей Дядька Сема."
 NIC_forpol.23.a: "Дуже цікаво. Можливість?"
 NIC_COL_Alliance_tt: "§YЦей новостворений союз гарантує, що §$$Нікарагуа§! допоможе нашим §fколумбійським§! партнерам, якщо §xЛа Віоленсія§! загостриться.§!"
 
 NIC_forpol.24.t: "Несподівані висоти"
 NIC_forpol.24.desc: "Двосторонні відносини між Нікарагуа та Колумбією ще більше розширилися, і Державний департамент знову висловлює обережний оптимізм, хоча тепер із більшим наголосом на необхідності чітких вказівок щодо намірів адміністрації в такій ситуації.\n\nПопередню угоду між Колумбією та Нікарагуа нещодавно було змінено — знову цілком автономно й без консультацій із Державним департаментом — щоб дозволити повну та негайну, за бажання, військову підтримку й втручання Нікарагуа. Це значно розширює підтримку нікарагуанського уряду добровольцями та обладнанням, а також відповідно значно посилює становище Боготи в Колумбійській війні.\n\nЗнову ж таки, це створює суперечність. Така допомога з боку регіональних партнерів дружньому уряду надзвичайно корисна з погляду зовнішньої політики, посилюючи заявлене прагнення Америки сприяти створенню прийнятних урядів у Латинській Америці. Безперечно, саме цього й прагнула Нікарагуа, формулюючи угоду. Однак, як і раніше, це знову демонструє напористість та автономність від американських консультацій, що в майбутньому може призвести до конфлікту.\n\nЯк і раніше, поправки вже набули чинності. Але Державний департамент чітко дав зрозуміти, що незабаром йому знадобиться більше ясності щодо того, як реагувати, оскільки цілком імовірно, що ця «автономія» продовжить зростати."
 NIC_forpol.24.a: "Завжди якісь ускладнення."

 ## US Negotiations - Occurs for the 5 or Higher Path
 NIC_forpol.25.t: "Демократизація диктатури?"
 NIC_forpol.25.desc: "Луїс Сомоса колись називав це «Безпекою». Бійці опору, що гнили у в’язницях, називали це «смертю республіки». Газети зникали за одну ніч. Кавові барони набивали собі кишені. Суддю знайшли мертвим у провулку після того, як він виніс рішення проти Національної гвардії. Попри це, Вашинґтон і далі надсилав зброю та навчав тих самих солдатів, які розібрали нікарагуанську демократію.\n\n«Ми обидва знаємо, чому ви тут». Ліллі Сомоса сиділа, схрестивши ноги, навпроти американського дипломата у своїй таунхаусі в Джорджтауні, помішуючи каву. «Америка... переглядає своїх друзів».\n\nЧиновник не ворухнувся. «Друзі не влаштовують ескадрони смерті на шкільних подвір’ях».\n\n«Ці ескадрони підтримують стабільність нашої країни». Ліллі закотила очі. «Ми ж не хочемо повторення Пуерто-Плати, правда?»\n\nПосланець кинув теку на стіл. Із неї вислизнули фотографії — зернисті, але беззаперечні. «Тож почнімо з основ. Припиніть арешти. Послабте контроль над пресою. А ваш брат? Його не повинно бути в наступному виборчому бюлетені. Ваша таємна поліція працює на американських кулях, не забувайте про це».\n\nЛіллі зробила довгий ковток. «Ви хочете жестів. Ми хочемо гарантій. Тут можна укласти угоду... якщо ви, звісно, готові запропонувати поступки».\n\nЧоловік підвівся зі свого стільця. «Якщо ваш брат слухає лише хабарі, то скільки часу мине, перш ніж він перестане слухати взагалі?»\n\nЛіллі холодно посміхнулася. «Доти, доки Токіо не запропонує кращу угоду». Вона поставила чашку. «А поки ви вже на ногах, будьте ласкаві й принесіть мені щось краще за цю американську бурду. Її неможливо пити»."
 NIC_forpol.25.a: "Чинити тиск на реформи в односторонньому порядку. Вони навчаться нас слухати."
 NIC_forpol.25.b: "Кілька хабарів могли б допомогти провести наші реформи. Дайте їм те, чого не може дати Токіо."
 NIC_forpol.25.c: "Не переймайтеся реформами. Можливо, вони мерзотники, але це наші мерзотники."
 NIC_USA_Push_Reforms_tt: "§FУспішне переконання §sДинастії Сомоси§! провести реформи вплине на майбутнє §$$Нікарагуа§!.§!"
 NIC_USA_Push_Reforms_Rude_tt: "§FОдносторонній тиск є ризикованим кроком, який може мати §Rжахливі наслідки§! для наших відносин із §sДинастією Сомоси§!."
 NIC_USA_Abandon_Reforms_tt: "§FВідмова від можливості реформувати режим може §Yзберегти§! наші відносини із §sДинастією Сомоси§!§!... але чи варто це того, щоб приректи її народ ще невідомо на скільки десятиліть репресій?§!"
 
 NIC_forpol.26.t: "Сомоса зміцнює зв’язки з Америкою"
 NIC_forpol.26.desc: "Протягом минулого тижня виконувач обов’язків президента Нікарагуа Лоренсо Ґерреро запровадив низку політичних реформ, які мають застосовуватися на майбутніх виборах. Було запроваджено незалежні виборчі комісії, внесено поправки до положень для посилення свободи преси, а сотні політичних опонентів офіційно помилувано.\n\nОднак деспотизм і досі зберігається в інших частинах уряду. Голоси все ще підраховують за дверима казарм. Сомоси зберігають контроль над більшістю засобів масової інформації. Тисячі лівих і далі нидіють за ґратами.\n\nТим не менш, ми можемо назвати це перемогою. Різні представники Організації американських держав похвалили «демократичні зусилля» Сомоси. Усередині країни громадські заворушення вщухли, а американські прапори можна побачити поруч із нікарагуанським триколором."
 NIC_forpol.26.a: "Ми не можемо чекати троянд від тернового куща, але все ж можемо підстригти його, щоб він мав пристойний вигляд."
 
 NIC_forpol.27.t: "Сомоса відкидає американців"
 NIC_forpol.27.desc: "Нікарагуа рішуче відхилила всі американські вимоги щодо проведення демократичних реформ, назвавши їх «невиправданим втручанням у суверенітет Нікарагуа». Попри численні дипломатичні місії та щедрі економічні пропозиції протягом останніх років, династія Сомоси залишається непохитною у своїх авторитарних методах. Політичні дисиденти залишаються під вартою, а преса й далі перебуває під жорстким контролем.\n\nСьогодні вранці американський прапор вперше за десятиліття було помітно спущено біля Національної асамблеї Нікарагуа. Повідомляється, що Сомоси шукають альтернативних міжнародних партнерств. Американський вплив у регіоні ослаб, що ускладнює нашу політику та динаміку всередині Центральної Америки.\n\nПодальші дипломатичні переговори або додаткові фінансові стимули можуть допомогти, але відносини може виявитися важко відновити."
 NIC_forpol.27.a: "Надіслати ще одного посланця. Ми все ще можемо це врятувати."
 NIC_forpol.27.b: "Надіслати їм гроші. Нагадати, хто утримує їхню армію на плаву."
 NIC_forpol.27.c: "Відмовитися від наших зусиль. Ми вже достатньо крові пролили, намагаючись підстригти цей терновий кущ."
 NIC_USA_Push_Reforms_Again_tt: "§FПодальший тиск на режим може принести результати, але за це наші відносини з §sДинастією Сомоси§! §Rпостраждають§!."

 ##Flavor Events for other possible backers
 #Fires After Puerto Plata
 NIC_forpol.28.t: "Історія двох континентів"
 NIC_forpol.28.desc: ""...і я обіцяю вам, панове, що ніщо не зрівняється з красою озера Манагуа», — вихвалявся Анастасіо Сомоса Дебайле, усміхаючись, коли потискав руки місцевим діловим лідерам. Більшість іберійського керівництва ще не прибула — затримка, яку Сомоса відчував навіть у спеку, — але він відмовлявся дозволити цьому змінити його ставлення. Навіть ділові лідери могли забезпечити вкрай потрібні інвестиції.\n\n«Навіть Камбадос?» — запитав один чоловік, уже представлений як Себастьян Фіґереро, пов’язаний із місцевою лісозаготівельною компанією і вже такий, що встиг зарекомендувати себе як дружній.\n\nДебайле злегка хихикнув. «Можливо, якби я мав більше часу в цій чудовій країні, але, на жаль!» Клацнуло кілька камер, але він рідко звертав на них увагу. Деякі фотографії, можливо, потраплять до преси, але більшість призначалася для приватного використання — до колекцій, за допомогою яких ділові лідери демонстрували свій вплив.\n\nЧерез кілька місяців Сомоса подбав про те, щоб більше не запізнюватися. Інвестиції Іберії в Іспаністський культурний центр у Манагуа були бажаними, але він починав цей дипломатичний поворот не для того, щоб інвестиції на цьому закінчилися, і не для того, щоб зібрати стількох недавніх іммігрантів на церемонію відкриття. Щойно він почав сумніватися у своєму розкладі, прибула іберійська делегація.\n\n«А, Лауреано, вітаю!» — промовив Сомоса, особливо наголосивши на останньому слові, повертаючись до Мануеля Ауґусто Хосе де Мельйо.\n\n«Радий бути тут», — відповів Лауреано Лопес Родó. «Сподіваюся, ви не брехали про красу озера Манагуа».\n\n«Я не брехав!» — відповів Сомоса, ще дужче засміявшись. «Просто запитайте Себастьяна Фіґереро. У нього була лісозаготівельна компанія в Ґалісії, але він переїхав, коли підписали той закон про імміграцію...»"
 NIC_forpol.28.a: "Ще більше проходить через Атлантику."

 #Fires for Nicaraguan Alignment with Iberia during the CCW
 NIC_forpol.29.t: "Риба, що з’їла кита"
 NIC_forpol.29.desc: "Розрив відносин між Нікарагуа та американцями був добре сприйнятий у Мадриді, як і запрошення, отримані посадовцями Союзу, відвідати численні заходи в Манагуа. Нове партнерство окреслило певні очікування з обох боків переговорного столу. Безпека, інвестиції, пляжні маєтки... та серед них було одне, що відрізнялося. Для справжнього союзу спільною передумовою, пропозицією та обов’язком було те, що Богота мала здобути перемогу в Громадянській війні, а соціялістичну загрозу, що нависла над усім регіоном, слід було безжально усунути.\n\nВідповідно до нового курсу династія Сомоси почала відриватися від долара та від обмежень, які він накладав на боротьбу з марксистським опором, що блукав сільською місцевістю. Економічно цей зсув проявився у формі нетипових конфіскацій власності, за якими слідували обіцянки приватизації на користь вигідніших ділових партнерів.\n\nАле Іберія була не єдиною, кого запросили на цей танець, як стало очевидно після прибуття заміни для представників Організації американських держав, що вибули. Японці, італійці, навіть дещиця німців — конкуренція була великою, приз відповідно вагомим, але виклик для всіх залишався тим самим.\n\nОдного дня, вже не так далеко, переможця буде визначено. До того дня танець та ігри триватимуть — ніколи надто близько, ніколи надто далеко, а місце Іберії завжди залишатиметься теплим."
 NIC_forpol.29.a: "А ось і гроші."

 #Fires After Puerto Plata
 NIC_forpol.30.t: "Спадщина вигнання"
 NIC_forpol.30.desc: "Спека в Хінотезі зовсім не змінилася за двадцять один рік, відколи його вигнали. Флора й досі пахла вологою землею. Гори — стародавні й непорушні. Гостра й незабутня кава наповнювала повітря, мов парфуми.\n\nАдольф Айцен не бачив цього раю відтоді, як династія Сомоси розграбувала його маєток і перетворила його на табір ув’язнення, а його родина була розсіяна по той бік Атлантики. Однак частина його фатерлянду все ще зберігалася в смарагдових джунглях Нікарагуа.\n\nАйцен вийшов зі своєї орендованої машини; його костюм був надто жорстким для спеки, а чоботи — надто важкими для пошкодженої землі. Перед ним лежали кістки його гниючого дому. Ліани поглинули й задушили кожен отвір, а ворота іржавіли. Попри покинутий маєток, пахощі розкішних зерен нагадували Айцену про його дні слави.\n\nВін чекав ціле життя, щоб повернутися сюди — у місце, де він був кимось, де міг стати кимось більшим. Американські помилки в Пуерто-Платі послабили ярмо над Нікарагуа, дозволивши Берліну відкрити двері до можливості, помсти та впливу.\n\nСтоячи там, він плакав сльозами, сповненими лише ностальгічної гордости. Тепер Айцена мучило лише одне питання. Чи повертався він пішаком у цій великій політичній грі, провісником Пакту єдности? Чи був він привидом, який намагався повернути те, що втратив так давно?"
 NIC_forpol.30.a: "Запропонувати підтримку — більший вплив в Америці може бути корисним."
 NIC_forpol.30.b: "Heims ins Reich, not in Managua."

 #Fires for Nicaraguan Alignment with Japan during the CCW
 NIC_forpol.31.t: "Сакура і сакуанхоче"
 NIC_forpol.31.desc: "Американський дипломат ледве встиг вийти, як до кімнати провели другого гостя Ліллі Сомоси цього вечора. Принцеса Нікарагуа лише нещодавно повернулася з вкрай неприємної та остаточної розмови в Організації американських держав. Звісно, часу на відпочинок було мало, адже для павутини, сплетеної її родиною, потрібен був делікатніший дотик.\n\n«Цього разу без лекцій?» — сухо запитав нікарагуанський олігарх.\n\nМасару Ікавара тихо хихикнув із ледь помітною усмішкою, перш ніж сісти навпроти неї. Представник дзайбацу пам’ятав, як минула їхня остання зустріч. Чемна, але безрезультатна. «Цього разу ні, сеньйоро Сомоса. Гадаю, ваш останній гість був не надто дружнім?»\n\n«Ви ж знаєте, які американці», — зітхнула Ліллі. «Звинувачення у “винищенні демократії”. Вимоги помилувань, виборів — усього того, чого можна було б очікувати від лібералів, народжених зі срібною ложкою в роті».\n\n«Токіо», — сказав Іва́кура, поправляючи окуляри перед тим, як відкрити шкіряну теку, — «віддає перевагу партнерствам перед односторонніми жестами».\n\nНа столі опинилися таблиці, листи та контракти. В обмін на інвестиції нікарагуанської власності в Токіо та Кіото японський капітал мав відкрити заводи й склади в Манагуа та Леоні. Дешева робоча сила для Японії. Безкоштовні робочі місця для нікарагуанців. Товстіші кишені для Сомос.\n\nЛіллі замовкла, перш ніж поглянути у вікно й побачити, як вогні Вашинґтона мерехтіли за повільною течією Потомаку. У тихій ночі вона відчувала відчай Конґресу. Взявши кулькову ручку, яку подарував їй Ніксон, вона знову перевела погляд на контракти.\n\n«Назвімо речі своїми іменами», — сказала вона, виводячи свій підпис. «Угода між друзями»."
 NIC_forpol.31.a: "Америка вже мала свої шанси. Японія просто попросила менше."
 NIC_Alignment_tt: "§F§$$Нікарагуа§! §Gприєднається§! до нашої §YЕкономічної сфери§!.§!"
 NIC_Alignment_2_tt: "\n§FІз крахом американського впливу §$$Нікарагуа§! зближується з нашою §YЕкономічною сферою§!, однак, щоб повністю приєднати її, нам знадобиться, щоб наші §fколумбійські§! союзники здобули перемогу в §xЛа Віоленсії§!.§!"

 #Fires After Puerto Plata
 NIC_forpol.32.t: "Усі дороги ведуть до Рима"
 NIC_forpol.32.desc: "Сьогодні вранці до наших міністерств надійшло повідомлення про цікавий — і вельми бажаний — розвиток подій у Нікарагуа.\n\nУпродовж певного часу до Нікарагуа відбувається значна міграція італійських інтелектуалів як з ділових, так і з академічних причин. Звісно, зважаючи на міську витонченість нашого величного народу, ті, хто видає себе за місцеву аристократію, швидко прийняли їх до своїх кіл. Риторична майстерність, набута в наших університетах, невдовзі захопила їх, і тепер багато хто з них поділяє наш ідеологічний світогляд.\n\nХоча, звісно, відкрито називати себе фашистом в Америках і не зазнати остракізму складно, у межах своїх можливостей вони діють. Повідомляється про дискусійні гуртки, політичні організації та інше, і цілком імовірно, що з часом з’явиться можливість для держави значно розширити свій вплив у цій країні.\n\nСправді, багатьох їхніх синів відправляють до елітних університетів Мілана та Рима, де їм, звісно, прищеплять правильний світогляд, а в Манагуа відкривається Італійський культурний центр, де невдовзі демонструватимуть італійське мистецтво, промисловість та багато іншого.\n\nВелике досягнення, і для його здійснення з нашого боку знадобилося зовсім небагато!"
 NIC_forpol.32.a: "Чудово."

 ## US Relations 5 or Higher Path
 NIC_forpol.33.t: "Смерть Луїса Сомоси"
 NIC_forpol.33.desc: ""То що тепер, Анастасіо?"\n\nЛоренсо Ґерреро сидів поруч із тілом наймогутнішого чоловіка, якого коли-небудь знала Нікарагуа, — Луїса Сомоси. Прямо навпроти нього стояв чоловік у коричневій формі, вкритій медалями. Генерал Анастасіо Сомоса був занурений у думки про втрату брата, але також і про майбутнє країни.\n\n"Ти мені скажи, Ґерреро. Ти наступний у черзі на спадкоємство". Анастасіо говорив чітко, придушуючи емоції, навіть не підводячи очей, щоб зустрітися поглядом із Ґерреро. "Однак це не робить тебе Сомосою".\n\nҐерреро ковтнув. Він обіймав президентську посаду лише близько дня, але тягар уже був надто великим. Кожна розмова з генералом звучала радше як завуальовані погрози смертю, ніж розмова. "Я маю намір відслужити свій термін, Анастасіо. Людям потрібен хоч якийсь спокій у ці важкі часи".\n\n"Неправильна відповідь, Ґерреро", — сказав Анастасіо, не відводячи очей від брата, що лежав на смертному одрі. "Це не твоя країна. Це була країна мого батька. Це була країна мого брата. Вона залишиться країною Сомос".\n\nҐерреро нічого не сказав, лише механічно кивнув, подбавши лише про те, щоб мовчки присягнути на вірність залізному правлінню Анастасіо. Надії Ґерреро дати Нікарагуа нового лідера згасли після однієї-єдиної розмови.\n\nЗрештою, Нікарагуа завжди буде родиною з нацією."
 NIC_forpol.33.a: ""Зігрівай для мене крісло, Ґерреро.""
 NIC_Prevent_Anastasio_tt: "§FЗаради стабільности §$$Нікарагуа§!, ми повинні не допустити приходу до влади §sАнастасіо Сомоси§!§!"

 NIC_forpol.34.t: "Гоуп Сомоса Портокарреро номінована на посаду президента"
 NIC_forpol.34.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Line of succession in Nicaragua\n\n1. Гоуп Сомоса Портокарреро, дружина Анастасіо Сомоси, брата колишнього диктатора Луїса Сомоси, здобула 92% голосів під час внутрішньопартійних виборів. Її кандидатура стала прямим наслідком тиску з вимогою реформувати нікарагуанський режим, однак навряд чи вона буде активною політичною діячкою. Натомість її кандидатура є спробою Анастасіо Сомоси правити поза увагою публіки.\n\n2. Ця новина не викликала жодного захоплення серед місцевого населення, але змусила насторожитися консервативніші кола Вашинґтона, а її американське походження породило твердження, що країна перетворюється на «американську маріонетку».\n\n3. Опозиція диктатурі демонструє дедалі більшу запеклість, а мізерні поступки, які їй запропонували, виявилися недостатніми, щоб її заспокоїти. Крім того, дедалі більше презирство серед американської громадськости й навіть у самому Вашинґтоні до диктатури малює похмуру картину перспектив родини Сомоси.\n\n4. Через закостенілу структуру PLN та гегемонію родини Сомоси над політичним істеблішментом можливості змінити цю ситуацію незначні. Будь-яка потенційна криза може охопити країну полум’ям."
 NIC_forpol.34.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ."

 NIC_forpol.35.t: "Анастасіо Сомоса Дебайле номінований"
 NIC_forpol.35.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Line of Succession in Nicaragua\n\n1. Анастасіо Сомоса, син колишнього нікарагуанського сильного правителя Луїса Сомоси, здобув 92% голосів під час внутрішньопартійних виборів, що визначали кандидата на майбутніх виборах. Через неліберальні практики Нікарагуа його перемога на самих виборах є гарантованою, а його термін навряд чи принесе країні якісь позитивні зміни.\n\n2. Анастасіо давно відомий нашим агентам у регіоні як природний наступник. Він намагався відтворити образ своїх попередників, щоб здобути популярність. Тим не менш, його брак харизми та гірше суспільне сприйняття порівняно з його братом закріпили за ним статус найменш популярного Сомоси\n\n3. Опозиція диктатурі демонструє дедалі більшу запеклість, а небажання PLN запропонувати будь-які реформи лише погіршує її сприйняття населенням. Крім того, дедалі більше презирство серед американської громадськости й навіть у самому Вашинґтоні до диктатури малює похмуру картину перспектив родини Сомоси.\n\n4. Через закостенілу структуру PLN та гегемонію родини Сомоси над політичним істеблішментом можливості змінити цю ситуацію незначні. Будь-яка потенційна криза може охопити країну полум’ям."
 NIC_forpol.35.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ."

 NIC_forpol.36.t: "Президентські вибори в Нікарагуа [GetYear]"
 NIC_forpol.36.desc: "Едвард — недосвідчений співробітник посольства США в Нікарагуа — отримавши на свій стіл стос документів, неохоче взявся до роботи. Колись його захоплювала перспектива відрядження, але реальність нікарагуанської політики невдовзі лягла тягарем на його совість. Колись він вірив, що Сполучені Штати підтримують демократії по всьому світу, допомагаючи людям усюди скидати чобіт диктатури. Правда ж була далеко не такою приємною. Перебігаючи очима останні підрахунки голосів на президентських виборах у Нікарагуа — за прогнозами, чергова нищівна перемога PLN династії Сомоси, — Едвард уголос замислився, чи правильним був вибір США знову стати на бік деспотів Центральної Америки. Його керівник, містер Вокер, почув це й підійшов: "Сумніви? Якщо це допоможе вам заспокоїтися, Сомоси — корисний інструмент для наших інтересів". Едвард раптом оживився й відпустив пальці від документів, які він стискав трохи надто сильно. "Якщо вони інструмент, то чому б нам не змінити ноти? Ми маємо силу зробити все краще, навіть якщо це ризиковано."\n\n"Влада рідко відхиляється від самозбереження", — відповів Вокер. "Але це неважливо. Те, чи орієнтується Сомоса на нас чи на нацистів, має значно більше значення, ніж його політика. І зараз, завдяки зусиллям таких людей, як ми... він і надалі слухатиме Америку, коли це матиме значення. Ми повинні пам’ятати, що династія не безперешкодно панує — зрештою, ми їм потрібні."\n\nЕдвард опустився у своє крісло й почув, як Вокер розмовляє зі своєю секретаркою. Коли керівник повернувся, молодий співробітник ледве стримав смуток, коли почув новину: "PLN перемогла — тепер їм залишається лише запевнити Національну гвардію, і США відповідно їх підтримають.""
 NIC_forpol.36.a: "Тієї ж ночі Едвард подав у відставку."

 #Despotist Nicaragua Path
 NIC_forpol.37.t: "Смерть Луїса Сомоси"
 NIC_forpol.37.desc: "Для багатьох у Нікарагуа сталася велика трагедія; для інших нарешті здійснився давно очікуваний тріумф. Слова «Президент Сомоса мертвий!» великими заголовками газет по всій Америці міцно закарбувалися у свідомості населення, а сама можливість того, що сомосистська династія могла бути в стані занепаду так невдовзі після переобрання покійного, розпалила уяву бійців FSLN тієї ж миті, коли пролунала новина.\n\nОдна з членкинь FSLN, Алехандра Лакайо, не плекала таких ілюзій. Серед натовпу в Манагуа вона здавалася цілком спокійною, непримітною; але в глибині її свідомости вирувала буря. Покійний Сомоса був відносно популярним або вважався привітним — ця «трагедія» стала б найкращою можливістю для режиму заручитися підтримкою населення. Вона знала, що президент ділив владу зі своїм братом Анастасіо Сомосою, очільником Національної гвардії, прихильником європейських фашистів; і всі знали, що він надзвичайно безжальний у своїх спробах зберегти династію своєї родини, садистичний деспот, чия жага до автократії дуже рідко втамовувалася. А з огляду на те, що відносини зі Сполученими Штатами досягли значного занепаду, було очевидно, що фасад демократичної системи невдовзі зникне, а за ним відбудеться геополітична переорієнтація.\n\nКулаки Алехандри напружилися від гніву, але цього було недостатньо, щоб усунути сомосистський режим від влади, а FSLN ще не були готові до тривалого повстання. Здавалося, що надії немає — чому складалося враження, ніби лише вона могла це бачити? Вдалині формувався протест — малий і жалюгідний. Замість того щоб приєднатися до нього, вона ковзнула в тіні провулка. Вона була втомленою, старою. Алехандра помітила плакат проти Сомоси, наполовину зірваний і розвішений вітром, що глузливо дивився на неї, мов жорстокий жарт. Ще один Сомоса сходив на вершину влади.\n\nПо всій Манагуа новий Сомоса справді тріумфував; виходячи з кабінету виконувача обов’язків президента Лоренсо Ґерреро, Анастасіо посміхнувся й повідомив своїй секретарці: "Ґерреро повідомлено. А тепер підготуємося до прийдешніх днів". Коли вони зникли у вечорі, обличчя Ґерреро було зморщене віком і ганьбою."
 NIC_forpol.37.a: "Повне затемнення Серця, сходження Іклів."

 NIC_forpol.38.t: "Путч Анастасіо Сомоси Дебайле"
 NIC_forpol.38.desc: "Коли Вокер, співробітник дипломатичного персоналу посольства США в Нікарагуа, вперше почув новину, він не міг повірити власним вухам; Анастасіо Сомоса справді зробив це. Заручившись підтримкою Національної гвардії, він захопив усі урядові будівлі в Манагуа та забезпечив повне підкорення своїй владі. Відбувся путч. Старший чоловік ще кілька годин сидів у своєму кабінеті, поки уривчасті звуки радости, насильства й жаху знадвору не стали саундтреком до його відчаю.\n\nУ наступні дні Вокер зробив низку дзвінків, коли катастрофічні наслідки перевороту почали вщухати й певна нормальність почала відновлюватися; однак відчуття тривоги залишалося, особливо в посольстві США. Анастасіо фактично плюнув в обличчя Сполученим Штатам, і попри обіцянку підтримувати тісну координацію, одразу стало очевидно, що це буде використано лише як привід для зміцнення власної влади. Намагаючись налагодити відносини, Вокер запропонував зустрічі з деякими обізнаними державними чиновниками, але поки що майже не мав успіху.\n\nОдного вечора, коли Вокер курив на балконі, до нього прийшов відвідувач; Марко був його особистим знайомим і нікарагуанським державним службовцем, чиї неофіційні зв’язки зі США протягом останніх кількох місяців викликали певне обурення. Він увійшов до кабінету так, ніби повертався додому з війни, закривавлений і побитий. "Вокере, заради Бога—" "Марко, ти поранений". Вокер підвівся з балкона, загасив сигарету й поспішив до нього.\n\n"Все гаразд, все гаразд", — крізь стогони від болю сказав Марко, спираючись на шафу для документів; "Ти мусиш мене вислухати. Анастасіо планує путч, а не вибори..." Вокер стривожено перебив: "Цей сучий син..."\n\n"Він відкине всі претензії на пристойність, щойно доведе, що має народний мандат. Він завдасть удару по тобі, щойно буде підраховано останній бюлетень"\n\nМарко похитнувся до стільця, коли секретарка Вокера поспішила до кабінету, вибачаючись, що не зустріла Марко під час його приходу. Вокер жестом наказав їй вийти, а потім став навколішки поруч зі своїм другом. "Тебе тут ніколи не було, Марко. Ми знайдемо спосіб тебе вивезти.""
 NIC_forpol.38.a: ""Вашинґтон мав запобігти цьому заздалегідь...""
 NIC_Too_Late_tt: "... однак, оскільки дата виборів уже завтра, ми не можемо перешкодити Анастасіо захопити владу.\n\n§RОднак настане день, коли §sДинастія Сомоси§! отримає те, на що заслуговує.§!"
 NIC_forpol.38.b: "За кілька годин голос у Вашинґтоні скаже: "Людина до душі мені.""
 NIC_Nixon_Bromance_tt: "§YЧерез особливе ставлення президента Ніксона до династії Сомоси вони залишатимуться орієнтованими на ОВН.§!"

 NIC_forpol.39.t: "Президентські вибори в Нікарагуа 1967 року"
 NIC_forpol.39.desc: "Нижче наведено зміст газетної статті, що публікується нікарагуанською пресою. Розвідники на місцях вважають це ознакою того, що американський гегемон тріщить зсередини Латинської Америки, а його контроль стає дедалі нестабільнішим. Наступний звіт не зазнав змін:\n\n"У черговій демонстрації гордої демократичної традиції Нікарагуа громадяни нашої Республіки чітко висловили свою волю на виборчих дільницях. Анастасіо Сомоса Дебайле, брат Луїса Сомоси, здобув переважний мандат від народу, забезпечивши продовження миру й процвітання династії Сомоси.\n\nРадісні натовпи розмахують прапорами на вулицях Манагуа, святкуючи чергову мирну передачу влади. Анастасіо присвятив себе не лише подальшій модернізації нації, а й процвітанню всіх нікарагуанців.\n\nНікарагуа стоїть єдиною, її збройні сили непохитні, а політичні інституції міцні. Уже зараз Анастасіо звернувся до Partido Conservador та командирів Нікарагуанської національної гвардії із закликом про підтримку, пообіцявши посади в уряді та розширену автономію в обмін на лояльність.\n\nНехай не буде жодних сумнівів: вороги республіки переможені й розгромлені волею народу!"\n\nНікарагуа вирвалася з хватки Білого дому, але тепер залишилася без ресурсів і важелів впливу. Можливо, можна укласти угоду, щоб допомогти Сомосі повернути лояльність Національної гвардії... в обмін на певні послуги..."
 NIC_forpol.39.a: "Кому взагалі потрібні були чесні вибори?"

 #Earthquake Chain
 NIC_forpol.40.t: "Роздавання милостині"
 NIC_forpol.40.desc: "Газети гули, усі вони повідомляли про одне й те саме. Допомога. Підтримка. Порятунок. Заголовки були одностайними, а найпопулярнішими на цьому кіоску на околиці міста були обмежені наклади La Prensa; її штаб-квартира була зруйнована землетрусом, але вона й далі випускала свої видання. На її обкладинці було просто написано:\n\n"ОВН ОГОЛОШУЄ ВЕЛИЧЕЗНИЙ ПАКЕТ ДОПОМОГИ"\n\nНатовп людей, що проходив повз кіоск на вулиці, бачив, як багато хто купував газету; найзавзятіші або найбільш постраждалі вигукували кілька схвальних вигуків. Більшість газет містили фотографії Тампської конференції, усміхнених делегатів з усього ОВН та його союзників, які стояли разом після завершення обговорень. Загальну заяву про надану ними допомогу та перелік проголошених цілей.\n\nМало хто раніше чув про USAID, який, здавалося, був головною силою в допомозі, що наближалася до їхнього міста, але майже всім було приємно читати про заявлені ним цілі. Відновлення інфраструктури, координація інвестицій країн ОВН у межах програми, пряма допомога нікарагуанській економіці. Дядько Сем, здавалося, відкрив свої скарбниці, і, попри спустошення від землетрусу та їхню складну історію, до нації нарешті дійшла добра звістка. Звістка, яку багато хто так відчайдушно потребував почути.\n\nРаніше, серед натовпу, один чоловік підслуховував розмови. Розмови про представників USAID, які вже перебували в столиці, суперечки про те, які райони слід визначити пріоритетними, похвала американцям за те, що вони нарешті використовують свою силу, аби змусити Вільний світ допомогти Центральній Америці. Тепер цей чоловік спостерігав за кіоском поверх голів натовпу, усміхаючись. Це була проста робота: просто стежити за кіоском і оцінювати реакцію, а відкрите вікно його квартири впускало всі звуки години пік. Однак до цього звуку він добре звик, а натовпи читачів і захоплені вигуки біля кіоску були безпомилковими. Вони дякували ОВН, але благословляли американців."
 NIC_forpol.40.a: "Агент ФБР Майлз усміхнувся, записуючи це. Дядько Сем справді здавався відповідальною стороною."

 NIC_forpol.41.t: "Корупція у фондах допомоги"
 NIC_forpol.41.desc: "Великодушний жест Америки щодо допомоги Нікарагуа у відбудові, хоч і морально правильний та політично вигідний, не обходиться без ризику. А саме — жахливо корумпований режим Сомоси просто привласнить кошти.\n\nНа жаль, і в інтересах збереження привілейованого становища Сполучених Штатів у Нікарагуа, ми мусимо прийняти певний рівень привласнення та шахрайства. Це не означає, що гадюкам, які населяють усі рівні нікарагуанської адміністрації, згори донизу, буде дозволено діяти таким чином — принаймні щодо більшости коштів.\n\nМи можемо і будемо ретельно контролювати канали розподілу, дозволяючи брати участь у процесі лише надійним неурядовим організаціям та перевіреним релігійним об’єднанням.\n\nДядько Сем може змиритися з деякими втратами, зважаючи на ширшу картину американського впливу в регіоні — а картина ця справді значно ширша — але він не дурень."
 NIC_forpol.41.a: "Не кусай руку, яка тебе годує."

 NIC_forpol.42.t: "Землетрус у Манагуа"
 NIC_forpol.42.desc: "Новини про землетрус у Манагуа продовжують поширюватися, і очевидно, що збитки є водночас надзвичайними та масштабними.\n\nХоча відносини Нікарагуа з ОВН та Організацією американських держав протягом останніх років були, м’яко кажучи, бурхливими, вона й далі перебуває у сфері дії доктрини Монро, а тому допомога їй сприяє здобуттю прихильности регіону та підтриманню стабільности. Економічну допомогу буде негайно мобілізовано, а представників USAID буде відправлено для нагляду за її розподілом і безпосередньої допомоги у відбудові у партнерстві з місцевими, за винятком тих, що належать родині Сомоси, та американськими компаніями. Це дозволить значно швидше відбудувати країну і, сподіваємося, сприятиме зростанню проамериканських настроїв серед нікарагуанського народу.\n\nЗвісно, задля дипломатії іншим членам Організації американських держав та ОВН буде дозволено зробити свій внесок, але їхню допомогу ретельно контролюватимуть та інтегруватимуть у наші графіки постачання. Ми, природно, вітаємо їхню допомогу, але вкрай важливо, щоб Америка зберігала провідну роль у цій скоординованій відповіді, аби кошти не опинилися в кишенях родини Сомоси.\n\nВартість реагування для американського платника податків мінімальна, а потенційні здобутки значні. Наші перші рятувальники вирушають протягом години."
 NIC_forpol.42.a: "Рука допомоги від Дядька Сема."

 NIC_forpol.43.t: "Корупція у фондах допомоги"
 NIC_forpol.43.desc: "Великодушний жест Америки щодо допомоги Нікарагуа у відбудові, хоч і морально правильний та політично вигідний, не обходиться без ризику. А саме — жахливо корумпований режим Сомоси не просто привласнить усе собі.\n\nНа жаль, і в інтересах збереження привілейованого становища Сполучених Штатів у Нікарагуа, ми мусимо прийняти певний рівень крадіжок. Але діяти все ще можна. Природно, гадюки, які населяють усі рівні нікарагуанської адміністрації, згори донизу, намагатимуться забрати все, що зможуть, але завдяки нашим тісним зв’язкам в уряді ми можемо чітко дати зрозуміти, що це має бути обмежено — інакше інші форми допомоги, не пов’язані з цією подією, будуть перенаправлені. Америка не здається так легко.\n\nМи також можемо і будемо ретельно контролювати канали розподілу, зосередившись на американських неурядових організаціях та релігійних об’єднаннях, які займатимуться коштами та контролюватимуть виплати. Природно, представники нікарагуанського уряду знайдуть спосіб «офіційно» пограбувати ці організації та перевести якомога більше коштів до корумпованих нікарагуанських організацій — а відтак до трастів Сомоси, — але ми можемо докласти зусиль, щоб максимально це обмежити.\n\nДядько Сем може змиритися з деякими втратами, зважаючи на ширшу картину американського впливу в регіоні — а картина ця справді значно ширша — але він не дурень."
 NIC_forpol.43.a: "Прийнятна стратегія."

 NIC_forpol.44.t: "Землетрус у Манагуа"
 NIC_forpol.44.desc: "Новини про землетрус у Манагуа продовжують поширюватися, і очевидно, що збитки є масштабними в усіх відношеннях.\n\nХоча це, звісно, зменшує ефективність нашої позиції в Нікарагуа, оскільки їхній уряд зосередиться на реагуванні на нього, це також створює додаткову можливість забезпечити продовження нашого впливу на режим Сомоси. Було вирішено розпочати всеосяжну кампанію допомоги, що складатиметься з добровільного цивільного та військового персоналу, коштів на відбудову, спеціалізованої техніки та припасів тощо.\n\nЦе значно пришвидшить ремонт і відбудову критично важливої інфраструктури та допоможе Нікарагуа значно швидше стати на ноги. Люди там, звісно, подякують нам за це, а це також стане сигналом для інших проамериканських або прихильних до Америки держав регіону, що щедрість не обов’язково має надходити лише з Вашинґтона. Відносна вартість для нас мінімальна."
 NIC_forpol.44.a: "Чудово."

 NIC_forpol.45.t: "Корупція у фондах допомоги"
 NIC_forpol.45.desc: "Надання допомоги Нікарагуа, хоч і є розсудливим та чудовою можливістю розширити вплив, не обходиться без ризику. А саме — династія Сомоси та незліченні наближені в її адміністрації просто привласнять усе, що їм передадуть.\n\nЦього не можна і не буде допущено. Певний рівень крадіжок, звісно, буде завжди, це правда для будь-якої системи, але абсурдні масштаби інституційного хабарництва, що стали звичними в Нікарагуа — особливо у відносинах із ОВН та американцями, — не буде дозволено вплинути на допомогу для відбудови Манагуа.\n\nСеред них будуть ті, хто спробує перевірити межі дозволеного, і ми пильно стежитимемо за ними. Щойно їх буде виявлено, названо та усунуто з комфортних посад на вимогу нашого посла, послання буде чітким. Ми відбудуємо Манагуа, але не дозволимо використовувати нас у своїх інтересах.\n\nЗрештою, ми не американці."
 NIC_forpol.45.a: "Пильнуймо."

 
 ##Endgame Coups
 NIC_forpol.46.t: "Революція в Нікарагуа"
 NIC_forpol.46.desc: "RESTRICTED\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: NICARAGUAN REVOLUTION\n\nМасові заворушення в Нікарагуа переросли у збройну революцію демократичної опозиції. Попри незліченні спроби повалити режим протягом останніх років, народ Нікарагуа нарешті досяг точки кипіння. Революцію очолює Unión Nacional Opositora (UNO), широка коаліційна партія, що об’єднує консерваторів, соціялістів і лібералів.\n\nПідрозділи UNO вже захопили кілька провінційних міст, а контроль над Манагуа слабшає щогодини. Зважаючи на те, наскільки непопулярною та нестабільною була чинна диктатура, тисячі людей приєдналися до UNO, щоб узяти зброю проти уряду.\n\nЧисленні ліві представники всередині Frente Sandinista de Liberación Nacional (FSLN) висловили невдоволення тим, що UNO узурпувала керівництво революцією. Зв’язок між двома сторонами переривається, поки лідери намагаються виробити компроміс.\n\nРозвідка й далі активно збирає інформацію на місцях. Попри це, результат очевидний. Народ Нікарагуа нарешті скинув свої кайдани. Допомога нікарагуанському режиму навряд чи змінить результат конфлікту. Малоймовірно, що UNO співпрацюватиме з Організацією Вільних Націй (ОВН)"
 NIC_forpol.46.a: "Вірність, мужність, чесність"

 NIC_forpol.47.t: "Революція в Нікарагуа"
 NIC_forpol.47.desc: "RESTRICTED\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: NICARAGUAN REVOLUTION\n\nМасові заворушення в Нікарагуа переросли у збройну революцію. Наразі Frente Sandinista de Liberación Nacional (FSLN), що складається з лівих і комуністів, очолює повстання проти нікарагуанського режиму.\n\nПідрозділи FSLN вже захопили кілька провінційних міст, а контроль над Манагуа слабшає щогодини. Зважаючи на те, наскільки непопулярною та нестабільною була чинна адміністрація, тисячі людей приєдналися до FSLN та взяли зброю проти уряду.\n\nБагато поміркованих лідерів із широкої коаліційної партії Unión Nacional Opositora (UNO) відчули себе відчуженими від своїх лівих колег. Між лідерами FSLN та UNO почала виникати недовіра, а деякі члени UNO відмовляються брати участь у повстанні.\n\nРозвідка й далі активно збирає інформацію на місцях. Попри це, результат очевидний. Народ Нікарагуа нарешті скинув свої кайдани. Допомога нікарагуанському режиму навряд чи змінить результат конфлікту. Малоймовірно, що FSLN співпрацюватиме з Організацією Вільних Націй (ОВН)."
 NIC_forpol.47.a: "Вірність, мужність, чесність"

 NIC_forpol.49A.t: "Врятовані зміни"
 NIC_forpol.49A.desc: "Ота Хіротада відкинувся у своєму кріслі за столом, вдивляючись у цифри перед собою. Міжнародна експансія Kubota йшла добре та значно диверсифікувала їхні ринки. Коли йому переадресували телефонний дзвінок, він вимкнув радіо й узяв слухавку. "Алло, це Ота Хіротада, офіси Kubota в Японії. З якого приводу ви телефонуєте, Ма-"\n\nЛінія ожила, перервавши Оту, коли співробітник поспішив пояснити, що сталося. "Кірісіма Цурукі, керівник операцій у Центральній Америці. Нікарагуанці щойно увірвалися на наш склад. Оливкові однострої. Цивільні. Спалили його."\n\nОта похитав головою. "Повільніше, Кірісіма. Щось можна врятувати?"\n\n"Ні, сер, усе знищено", — відповів Кірісіма, сповільнившись, коли пояснював повну втрату. Ота записав це, скривившись. Це була велика кількість запасів. "Нам потрібно, щоб Kubota негайно зафрахтувала наші рейси. Токіо, Сіньцзін, Джакарта, куди завгодно. Будь ласка, сер, навіть просто людина, яка відвезе нас до Гондурасу, була б достатньо-"\n\nОда засміявся в слухавку з такого прохання. Вони давно прийняли ризик інвестування в настільки нестабільну країну. Раптом над лінією прогримів удар, і після ще однієї тиради благань із того кінця він зітхнув і поставив абонента на утримання, збільшивши гучність радіо.\n\n"...і хоча цивільні виходять на вулиці, щоб вітати сандиністів, натомість вони звернули свою увагу на пограбування будь-яких заводів або складів, збудованих за часів його старого уряду—" — загриміло радіо, перш ніж його вимкнули. Не дивно, зрозумів він, що бідолашний Цукірі був таким наляканим. Замкнений у країні, що розвалюється, за океаном, і, ймовірно, ось-ось буде схоплений та лінчований радикалами? Він узяв слухавку, сподіваючись, що на іншому кінці все ще хтось був."
 NIC_forpol.49A.a: "Чи все ще тримається дріт, через океан?"
 NIC_forpol.49B.t: "Революція в ефірі"
 NIC_forpol.49B.desc: "Хвилі ревіли над затокою, але їхній гуркіт заглушали вікно та гучний телефонний дзвінок. Була середина дня, але для Самуеля Сальданьї відбувалося недостатньо, щоб виправдати його неспання. На відміну від інших аеропортів, які здебільшого перетворилися на міжнародні вузли, його аеропорт переважно обслуговував внутрішні канарські рейси й був здебільшого проігнорований. До сьогодні. Коли він узяв слухавку, дивне прохання його спантеличило, і він передав його своєму керівнику.\n\nЗа годину Ельпідіо Моніс також узяв слухавку. Спочатку він відмахнувся від цього. Тенерифе був міжнародним туристичним напрямком, а Іберія роками відкривалася для Латинської Америки. Навіть якщо це був менший напрямок, він не міг зрозуміти, чому рейс із Манагуа був таким незвичайним. Після кількох коротких слів Моніс знизав плечима, погодився та передав питання міністру закордонних справ, перш ніж узятися за наступний дзвінок.\n\nТой не був таким безтурботним. Коротке слово згоди на посадку швидко змінилося дзвінком іберійському послу в Манагуа, який пошепки попередив про бродячих бунтівників. Лише після заходу сонця він отримав відповідь. Дзвінки з іберійського посольства посипалися один за одним, попереджаючи, що місце небезпечне, що по дипломатах, бізнесменах та аташе стріляли, і намагаючись зафрахтувати рейси з Лас-Мерседес у Манагуа практично до будь-якого місця в Європі. Щойно він узяв третій дзвінок, на його стіл кинули повідомлення.\n\nСАНДИНІСТСЬКІ ПОВСТАНЦІ ВХОДЯТЬ У МАНАГУА\n\nШлунок міністра закордонних справ стиснувся. Він стежив за подіями в Нікарагуа місяцями й тижнями благав Франко втрутитися, але тепер реальність настала. Нікарагуа впала під владу комунізму, і саме йому доведеться збирати уламки іберійської стратегії протидії американському впливу. Зітхнувши, він узяв слухавку, щоб зателефонувати ще одному цивільному, готуючись до довгого тижня."
 NIC_forpol.49B.a: ""Принеси мені кави. Це надовго.""

 ##News
 NIC_news.1.t: "[Get_newspaper_header]Демократична революція в Нікарагуа"
 NIC_news.1.desc: "Прихильники ліберальної демократії по всьому світу сьогодні усміхаються, адже в Нікарагуа було повалено одвічно непопулярний режим, підтримуваний Америкою, демократичною опозицією. Після кількох років дедалі гіршої нестабільності та дедалі меншої кількості людей, готових підтримувати режим, Unión Nacional Opositora — широка коаліція демократів і центристів — очолила революцію, поваливши уряд і пообіцявши більше свобод, ніж раніше.\n\nХоча більшість нікарагуанців вдячні за зміну керівництва, серед багатьох досі існує незгода, особливо серед політичних лівих — частково через прихильність УНО до економічного партнерства з іншими країнами Латинської Америки, серед них існує переконання, що вони лише обміняли одні капіталістичні кайдани на інші."
 NIC_news.1.a: "Час покаже."

 NIC_news.2.t: "[Get_newspaper_header]Революція ФСЛН у Нікарагуа"
 NIC_news.2.desc: "Frente Sandinista de Liberación Nacional, лівий революційний фронт, захопив владу в Манагуа та більшості департаментів Нікарагуа. Хоча боротьба проти сомосистської Національної гвардії триває у високогір'ї, ФСЛН оголосив про створення Хунти національної відбудови на чолі зі своїм лідером Карлосом Фонсекою. \n\nЇхні молоді, соціялістичні прихильники та значна частина населення вийшли на вулиці, щоб відсвяткувати падіння династії Сомоси. Клептократичне правління Сомоси стало нестерпним після того, як родина привласнила величезні обсяги допомоги, призначеної для відбудови Манагуа після руйнівного землетрусу. Ця відверта крадіжка радикалізувала нікарагуанців — дозволивши ФСЛН перемогти як режим, так і відсунути на другий план помірковану демократичну опозицію, УНО. Оскільки Фонсека націоналізує власність Сомоси та засуджує вплив США, схоже, Нікарагуа безповоротно змістилася вліво.\n"
 NIC_news.2.a: "Старий ворог Сомоси отримує свою остаточну помсту."
 
 NIC_news.3.t: "[Get_newspaper_header]Гоуп Сомоса Портокарреро перемагає на президентських виборах у Нікарагуа"
 NIC_news.3.desc: "Криза керівництва, що охопила правлячу родину Сомоси в Нікарагуа, сьогодні завершилася, коли сфальсифіковані вибори привели до президентства Гоуп Сомосу Портокарреро, невістку покійного президента Луїса Сомоси. Народжена у Флориді та одружена з командувачем Національної гвардії Анастасіо Сомосою Дебайле, вона здобула відомість як соціальна реформаторка, допомагаючи створювати низку нікарагуанських установ, як прихильниця благодійності та завдяки своїй минулій ролі постійної господині для дипломатів.\n\nПопри зусилля опозиційної коаліції УНО, її обрання аж ніяк не стало несподіванкою. Міжнародна реакція була стриманою, але загалом негативною. Окрім певного захоплення з боку американських таблоїдів, спостерігачі вважають її лише маскою, нездатною належним чином приховати жорстокість її чоловіка та Національної гвардії, а її благодійність лише підкреслює корупцію, що лежить в основі її родини.\n"
 NIC_news.3.a: "Ідеальна жінка для National Enquirer!"
 NIC_news.3.b: "Зміна лише в назві."

 NIC_news.4.t: "[Get_newspaper_header]Анастасіо Сомоса Дебайле перемагає на президентських виборах у Нікарагуа"
 NIC_news.4.desc: "Криза керівництва, що охопила правлячу родину Сомоси в Нікарагуа, сьогодні завершилася, коли сфальсифіковані вибори засвідчили, що Анастасіо "Тачіто" Сомоса Дебайле, командувач Національної гвардії та брат покійного президента Луїса Сомоси, тепер є її патріархом. Хоча його перемога ніколи не викликала сумнівів, масове вбивство сотні протестувальників лише ще більше зменшило явку демократичної опозиції УНО.\n\nОскільки образ його батька знову піднесено, а зневага до інакодумства залишилася тією самою, спостерігачі очікують, що Анастасіо скасує останні роки виваженої, обмеженої лібералізації, а нікарагуанська держава повністю зануриться в персоналізм. Пам'ятаючи про різанину на авеню Рузвельта, деякі нікарагуанці звертаються до сандиністських революціонерів Карлоса Фонсеки за порятунком, і їхня активність значно зросла протягом останніх тижнів.\n"
 NIC_news.4.a: "Будемо сподіватися, що Сомоси незабаром відкриють для себе пряник..."
 NIC_news.4.b: "Нікарагуа ще глибше занурюється в прірву."
 
 NIC_news.5.t: "[Get_newspaper_header]Анастасіо Сомоса Дебайле захоплює президентство Нікарагуа"
 NIC_news.5.desc: "Після смерті колишнього президента Луїса Сомоси Дебайле у віці лише 44 років Нікарагуа ненадовго поринула в кризу керівництва. Хоча до влади прийшов просомосистський уряд, командувач Національної гвардії Анастасіо "Тачіто" Сомоса Дебайле повалив його. Він оголосив вибори під наглядом Гвардії, а перемогу було оголошено вже через годину після закриття дільниць. Після придушення опозиції УНО не залишилося нікого, хто міг би усунути його з посади без застосування зброї.\n\nНікарагуанська демократія значною мірою була лише декоративною відтоді, як Сомоси прийшли до влади у 1937 році, але Анастасіо відмовився навіть від цієї видимості, а звинувачення в шахрайстві та насильстві з боку La Prenza були швидко придушені. Сполучені Штати виступили із засудженням, але оскільки Манагуа протягом останніх кількох років значно дистанціювалася від США, Анастасіо не дав жодної відповіді, окрім критики американських суспільних практик у газетах, пов'язаних із Сомосою.\n"
 NIC_news.5.a: "Тюремник стає м'ясником власних друзів."
 NIC_news.5.b: "Знову корупція та зброя правлять бал."
 
 NIC_news.6.t: "[Get_newspaper_header]Землетрус спустошує Манагуа, Нікарагуа"
 NIC_news.6.desc: "Сьогодні з Манагуа надходять похмурі звістки: потужний землетрус спустошив значну частину Нікарагуа. Сила землетрусу становила 6,3 бала за шкалою Ріхтера, він зруйнував значну частину міста, залишивши його без електрики, води та більшої частини місцевого управління. Рятувальні служби досі шукають тих, хто вижив, серед руїн, але, ймовірно, тисячі вже загинули, а ще тисячі життів будуть забрані хворобами, переохолодженням або спрагою.\n\nОскільки сотні тисяч людей у бідній країні залишилися без домівок, гуманітарна криза здається неминучою. По всій Америці благодійні організації та уряди вже пообіцяли значну допомогу, особливо Сполучені Штати, і перші поставки вже прибули. Однак через те, що члени Національної гвардії патрулюють вулиці в пошуках "мародерів", а також через репутацію Сомоси щодо корупції, дехто побоюється, що ці зусилля лише наповнюють резерви однієї родини.\n"
 NIC_news.6.a: "Будемо сподіватися, що допомога дійде."
