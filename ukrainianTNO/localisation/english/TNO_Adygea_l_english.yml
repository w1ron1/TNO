 ## Описи лідерів ##
 POLITICS_LYUBOV_LYSENKO_DESC: "Любов Кирилівна Лисенко не з чуток знає, що таке страждання. Коли пролунали барабани війни, а німці заполонили обрій, її батька, брата та чоловіка призвали служити Батьківщині в Червоній армії. Ніхто з них більше не повернувся. Нацистські окупанти зігнали її та всіх інших мешканців її рідного міста, змусивши їх примітивними інструментами, виснажливою працею та без жодних норм безпеки копати водосховище вздовж річки Кубань. За ті роки вона втратила багатьох своїх друзів, але Любов вистояла. Коли водосховище було завершене, робітників, що вижили, перевели до різноманітних потогінних підприємств і шахт уздовж Чорного моря. Любов часто били та морили голодом охоронці садисти, але вона вистояла. Протягом років у неї склалася репутація людини, яка дуже добре вміє виживати. Дехто навіть вважав це натхненним прикладом.\n\nКоли Райхскомісар помер, а охоронці заметушилися, робітники таборів і шахт скористалися нагодою та повстали. Вони гуртувалися навколо в'язнів, яких найбільше шанували. Дехто був героями війни, дехто - священниками, дехто - харизматичними політиками, а дехто - простими фермерами, яких поважали за їхню внутрішню силу. Незабаром Лисенко побачила, як тисячі людей, таких самих обірваних до нитки вцілілих, як і вона сама, стікаються до неї по пораду та допомогу. І, як і з кожним іншим тягарем, покладеним на її плечі протягом життя, Лисенко присягається, що й надалі вистоюватиме, як завжди."
