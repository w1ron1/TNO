 # National Spirits
 LAO_Postcolonial_Backwater:0 "Постколоніальний пустир"
 LAO_Postcolonial_Backwater_desc:0 "Сучасна історія Лаосу сповнена трагедій, страждань та поневолення. Від часів Трьох королівств і до Операції Іссара - до Лаосу відносилися, як до прикордоння потужніших держав, що оточували його; майже без змін у ньому з кінця дев'ятнадцятого століття.\n\nСлабка адміністративна сила, майже всеосяжна безграмотність, надпанівна корупція й кошмарного стану інфраструктура є лише добіркою з плеяди проблем, із якими зіштовхується Лаос після століть нехтування. Натуральне господарство залишається основною галуззю економіки Лаосу; сучасні галузі, пов'язані з міським простором, розвиваються проблематично - саме тому лаоські лідери схилилися до японських багатств у спробі розвинути країну, проте тільки час покаже, якою буде ефективність подібної стратегії."
 
 LAO_Legacy_of_Operation_Issara_Unmitigated:0 "Спадщина Операції Іссара - 
Безвідносна"
 LAO_Legacy_of_Operation_Issara_Unmitigated_desc:0 "Вторгнення Таїланду в Лаос, що його підбурювачами називається «Операція Іссара», відкинуло той незначний прогрес, якого було досягнуто за приведення Лаосу до епохи сучасності. Перспективні урядовці були звільнені зі своїх посад, спільноти масштабно винищувалися крізь примусове переміщення та смерті, головні дороги Лаосу зношено до неможливого, а промисловий розвиток стагнував до закінчення конфлікту. Наслідки вторгнення поринули Лаос у адміністративну, демографічну, інфраструктурну й економічну анархію.\n\nПроте незважаючи на ці тяжкі проблеми, не було здійснено майже нічого для їх серйозного вирішення. Застрягнувши з 1957-го в політичній кризі, В'єнтьян не зміг надати ні значної допомоги регіонам, що постраждали, ні розпочати якісь об'ємні зусилля з відновлення зруйнованих промисловості та інфраструктури. Більшість лаосців, як результат, живуть в умовах гірших, ніж за колоніального правління - вони байдужі до національного проєкту Лаосу, через його неспроможність допомогти їм або їх громадам у відбудові того, що втрачено через тайців."
 
 LAO_King_Sisavang_Vatthana:0 "Король Сісаванґ Ваттана"
 LAO_King_Sisavang_Vatthana_desc:0 "Його Величність Самдач Бргат Чао Маваттаха Срі Вітга Лан Ксанґ Гом Кгао Пхра Раджаначакра Лао Пхенґдара Парама Сідга Хаттія Сурія Варман Бргат Мага Срі Саванґса Вадгана, більш відомий як Король Сісаванґ Ваттгана, є сувереном Королівства Лаос.\n\nЗа минулих років така посада гарантувала всезагальну повагу, але зусилля Принца Пхетсаратг Ратанавонґси щодо зменшення впливу монарха на політику та недобровільна співпраця Короля Саванґ Вонга з тайцями під час Операції Іссара - зробили монархію менш гідною в народі. Спроби Короля Сісаванґ Ваттгани втрутитися в керівництво тільки поглибили це: постійно озвучуючи погляди на державні справи й свою обмежену владу, лаоська королівська династія перетворилася з політично недоторканої на страждальну від чималої критики.\n\nІз зрештою, завдяки скромним публічним появам та відданості буддистській вірі, незважаючи на його контроверсійні заходи - популярність монархії та Короля Сісаванґ Ваттгани залишається високою. Тому прихильники відвертого республіканізму все ще перебувають на окраїні політики Лаосу, так і тримаючись осторонь її, допоки королю вдається підтримувати публічний імідж на рівні своїх політичних амбіцій."
 
 LAO_The_Golden_Triangle:0 "Золотий трикутник"
 LAO_The_Golden_Triangle_desc:0 "Заснований 93-ю дивізією генерала НРА Лі Мі після поразки Китаю в Другій світовій війні та з частковою підтримкою від тайського уряду, Золотий трикутник охоплює шанські князівства в Бірмі та Таїланді, а також частини півночі Лаосу. Він став пристанищем для виробництва, транспортування й обробки опіуму в Південно-Східній Азії. Його вплив значним чином було розширено під час смути за Операції Іссара, оскільки Національна армія Лаосу - попередниця Королівської лаоської армії - налагодила потаємні зв'язки з НРА в Бірмі, виробляючи й продаваючи наркотичні речовини разом у небачених раніше масштабах.\n\nТа коли Операція Іссара підходила до свого завершення й НАЛ розірвала свої зв'язки з тайськими союзниками, співпраця між НРА та НАЛ зупинилася також. Ледь не за одну ніч, дві армії з партнерів постали суперниками - коли НРА виводила свої ресурси з Лаосу, НАЛ спробувала скористатися перевагою метушні й закріпитися в князівствах Шану. Навіть, коли НАЛ переформувалася в КЛА й Індокитай поринув у нестійкий мир, конфлікт за Золотий трикутник не було закінчено, бо КЛА й НРА продовжують боротися за контроль над трикутником."
 
 LAO_The_Royal_Lao_Army:0 "Королівська лаоська армія"
 LAO_The_Royal_Lao_Army_desc:0 "Після відновлення Національної армії Лаосу для відмежування від її історії, як інструмента пригноблення тайськими загарбниками під час Операції Іссара, було створено Королівську лаоську армію. Проте помилково називати Королівську лаоську армію "армією" в будь-якому розумінні цього слова. Її солдати - кволі й погано навчені; командири її підрозділів - частіше всього лишень призначені туди завдяки кумівству, і не здатні й вивести взводу за рогом; а її вище командування - не більше, ніж запливші жиром барони розбою, що носять звання генерала.\n\nІ все ж, незважаючи на некомпетентність майже на всіх рівнях, як військової організації, КЛА усе ще становить загрозу існуючому демократичному порядку Лаосу. Вони мають серед себе переважно правих у керівництві, як от Пхумі Носаван, що тільки зневажають процес демократії. Лідери КЛА є раковою пухлиною, яку неможливо видалити без ризику смерті пацієнта, оскільки будь-яка дія проти них може спровокувати ворожий військовий переворот. Це змушує громадянський уряд Лаосу дотримуватися тонкої межі: тримати КЛА якомога далі від урядових справ, не випробовуючи при цьому їхнього гніву на повну."
 
 LAO_Indochinese_Communist_Party_Insurgency_Minor:0 "Повстання Індокитайської комуністичної партії - Незначне"
 LAO_Indochinese_Communist_Party_Insurgency_Minor_desc:0 "Незважаючи на те, що анти-колоніальним бійцям було гарантовано амністію з набуттям Лаосу незалежності в 1947-му, одна група продовжила чинити супротив, доки Лаос не звільниться від усіх видів імперіалізму. Лаоському відділенню Індокитайської комуністичної партії вдавалося запобігати встановленню контролю нового уряду Лаосу над північно-східним кордоном із В'єтнамом; вона підтримувалася в'єтнамським товаришем і невеликою мережею селищ. Те, що раніше вважали неприємною дрібницею в кращому випадку, цілком змінилося після початку Операції Іссара.\n\nАби побороти тайців під час Іссари, між залишками легітимного лаоського уряду й ІКП було складено неофіційну угоду, що значним чином допомогло в визволенні Лаосу. ІКП повернулася на свої бази в Пхонґсалі й Хуапхангу, із звеличеннями зі сторони лаоського селянства за їхню службу. Відтоді "визволена зона" ІКП на північному сході чимало зросла, обмежуючи там контроль уряду. Але ІКП усе ще є неприємністю - нехай і набагато більшою за масштабом. Не маючи ані військових, ані політичних можливостей для протистояння урядові Лаосу, для статусу-кво вони не становлять жодної загрози... поки що."
 
 LAO_Stung_Treng_Dispute:0 "Спір щодо Стунґ Тренґу"
 LAO_Stung_Treng_Dispute_desc:0 "Провінція Стунґ Тренґ є останньою й найпівденнішою територією Лаосу. Хоча більшість цього регіону населена лаосцями, він перебував під кампучійським правлінням із 1905-го по 1949-й роки. Контроль над областю було повернено Лаосу на початку «Операції Іссара», під час якої Лаос був розділений на королівства Луанґпрабанґ і Чампассак - останньому передали провінції Стунґ Тренґ і Накхон Чампассак за їхнї близькі зв'язки з тайським урядом. Після завершення операції в 1956-му, за Тайгокським договором були відновлені довоєнні кордони між Таїландом і індокитайськими сусідами; проте в договорі не було написано щодо повернення кордону між Кампучією й Лаосом до минулого стану. Це призвело до суперечки між двома країнами, коли Лаос відмовився повернути окупований ними Стунґ Тренґ.\n\nЯпонська влада направила місцевих фахівців для вирішення диспуту й досягнення порозуміння. Ті в свою чергу дізналися, що населення низовин Стунґ Тренґу майже повністю було лаоським - що призвело до підтримки Японією Лаосу в цій сутичці. Хай офіційно ситуація й була вирішеною, кампучійський уряд продовжував лютувати над втратою провінції Стунґ Тренґ. Як результат: північний схід Кампучії стрімко мілітаризувався, значно посилилися реваншистські настрої в кхмерській політиці, а взаємні відносини між двома країнами було цілковито зруйновано."
