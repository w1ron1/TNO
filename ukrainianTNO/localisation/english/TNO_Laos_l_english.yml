 ## Leader Descs ##
 POLITICS_KOU_ABHAY_DESC: "Із того часу, як Пхетсарат Раттанавонґса перестав бути прем’єр-міністром, спірний Носаван задіяв усю свою присутню політичну й добру волю, аби призначити Ку Абхая прем’єр-міністром. Генерал шляхетного походження, чия співпраця з тайцями під час Іссари була настільки незначною, що не викликала суперечок - Носаван вважав його найкращим компромісом між своїм бажанням посилити КЛА, і лібералами, які хотіли зберігати спадщину Пхетсарата.\n\nНезважаючи на це, Абхай переміг зі слабкою більшістю; виконуючи лише роль доглядача, що не послаблював і не посилював жодну фракцію. Починаючи з кінця терміну Пхетсарата в 1959-му, і аж до узгоджених виборів 1962-го, Абхай був неефективним та поступливим головою держави. Зараз, коли вибори наближаються, Абхай готується до довгоочікуваної відставки.\n\nМало що можна сказати про самого Ку Абхая. Він - син заможної сім’ї з півдня й батько видатного генерала Купрасіт Абхая. Він старий чоловік на порозі смерті, що не був зайнятий нічим, окрім підписування паперів та спостерігання за парадами. Він є аркою, через яку Лаос входить у нову добу своєї політичної історії."
 POLITICS_SOUVANNA_PHOUMA_DESC: "Можливо, покликом Суванни Пхуми завжди було очілювати лаоський народ. Брат покійного й легендарного принца Пхетсарата Раттанавонґси, політично пов’язаний з усім лаоським суспільством, старанний слуга Коаліційного уряду вільного Лаосу під час «Операції Іссара» - цей принц успадкував горду спадщину свого брата щодо служіння Лаосу.\n\nУтім, Суванна Пхума виглядає, як невиразна людина з особливими ідеологічними переконаннями. Часом він упертий; у іншому випадку, він швидко здається. Співпрацює з лівими, але простягає руки перед правими. Грає з націоналістичною риторикою, та користується повною підтримкою японців. Він усвідомлює політичні ігри, які відбуваються в тіні - проте йому не вистачає будь-якої підступності чи хитрості, щоб отримати з цього вигоду.\n\nПхума безсумнівно некомпетентний, але він швидше за все, також, занадто дурний для продовження справи свого брата. Тим не менш: він перебуває при владі завдяки цій спадщині, йому доручено продовжувати цю спадщину, і він керуватиме лаоською нацією настільки, наскільки це можливо. Але Пхума знає, що позаду нього точаться ножі - чекаючи перших ознак слабкості, аби встромити їх йому в спину."
 POLITICS_SOUPHANOUVONG_1_DESC: "Брат Принца Пхетсарата Раттанавонґси, отця сучасної лаоської нації, Супханувонґ повернувся після здобуття вищої освіти в Франції - із ідеями, що не личили королівській знаті. У метрополії в нього з’явилась відраза до імперіалізму, який приносив користь лише таким аристократам, як він. Коли той повернувся у Лаос, Операція Іссара змусила його слідувати за своїм братом у Сам Нуа, де Супханувонґ заробив популярність всередині КУВЛ через підтримку повстанських рухів. Там він розвинув доволі сильні відносини з селянством, які в комбінації з лівими симпатіями й дали йому прізвисько "Червоний Принц".\n\nЗараз Супханувонґ править Лаосом із волі народу, а не з волі божественної. Вступивши на посаду прем’єр-міністра, він поклявся боротися за селянство на полях, і за робітників у містах. Він закликає до розширення соціального забезпечення, розвитку інфраструктури й промисловості - і щоб підтримати країну в цих починаннях, Супханувонґ особливо зацікавлений у поглибленні зв'язків із Японією, вбачаючи в Сфері найбільший шанс Лаосу для розвитку національної індустрії. Праві називають його запроданцем большевиків, ентузіазм лівих знижується через його паназіатську риторику - та незважаючи на критику, Супханувонґ знає, що він патріот, і робить все можливе заради лаоського народу."
 POLITICS_SOUPHANOUVONG_2_DESC: "Дехто сказав би, що лівий аристократ - поняття заперечливе, що для королівської крові ірраціонально прагнути покласти край монархії й створювати комуністичну державк. Супханувонґ із задоволенням тримає ножа, прорізуючи горло монархії й використовуючи її кров, аби полити народні господарства та сади.\n\nБагато хто знав про його ліві симпатії, але мало хто здогадувався, наскільки далеко ці симпатії можуть зайти. Із 1949-го Супханувонґ був таємним союзником Індокитайської комуністичної партії, по-тихому фінансуючи й оснащуючи їх за допомогою зв’язків у КУВЛ. Проведений час у Парижі направив його до комунізму, а іноземна окупація вмотивувала втілити теорію на практиці. Але він знав, що Лаос не був готовий до революції; він перебував нерозвиненим і оточеним реакціонерами. Тож він очікував свого часу й провів ПФЛ крізь турботи після Іссари.\n\nІз союзником у В’єтнамі відкривається найбільший троянський кінь 20-го століття. Супханувонґ видав світу все, що він завжди тримав у серці: те, що він вірить в ідеї Маркса, Лєніна й Бухаріна, і боротиметься за реалізацію їхнього бачення для Лаосу. Ніхто не був шокованим більше, ніж Японія, яка стала жертвою багаторічної афери Супханувонґа, який грав на паназійських настроях, щоб отримати послуги, інвестиції та кредити - які він ніколи не поверне. Вони можуть лютувати, але Супханувонґ упевнений: Лаос вільний, і через піт своїх робітників, він залишиться вільним."
 POLITICS_PHOUI_SANANIKONE_DESC: "Пхуї Сананікон витратив останні десять років, у спробах зібрати до купи розмазану по землі репутацію свого брата. Удоне очолював колабораціоністів разом із Пхумі Носаваном під час Операції Іссара; у той час, коли Пхуї переховувався в лаоській бюрократії - і за цей злочин династія Сананікон була заплямована зрадою. Але тепер, коли Пхуї став прем'єр-міністром, можливо, він і його сім'я справді врятовані. Мабуть, Пхуї просто вміє виглядати достатньо добре, аби Лаос прийняв його.\n\nПхуї, який народився в північній шляхетній династії - колись відомої, як лаоські Рокфеллери - став проблемним через співпрацю його брата з тайцями під час Операції Іссара. Він усе ще використовував ім’я своєї родини, щоб зберігати високу позицію в бюрократії: безпечно залишаючись подалі від того, що він вважав болотом. Після успіху КУВЛ, Пхуї тихо повернувся до політичного життя, як голос прихильників моральних традицій, поміркованих аристократів і монархістів, що не настирливо співпрацювали з тайцями.\n\nТепер він - прем’єр-міністр, обраний на хвилі закликів до обачливого керівництва з боку землевласницьких класів, і завуальованих антияпонських настроїв із боку селянства. Він говорить про побудову сильнішого, морального Лаосу, але всі знають про його глибоку корумпованість. Маючи широкі зв’язки серед еліти та армії, Пхуї Сананікон не соромиться використовувати їх для власної вигоди." POLITICS_BOUM_OUM_NA_CHAMPASSAK_DESC: "Запитайте будь-якого лаосця, що він думає про Операцію Іссара, і кожен дасть вам варіацію цієї відповіді: доба безладу та кровопролиття, яка, проте, була необхідною для нашої волі. Є тільки одна людина, що не згодна з цією загальноприйнятою думкою - людина, для якої Операція Іссара була єдиним часом, коли він був по-справжньому вільним. Людина, яка була королем, коли цей титул щось означав. Ця людина - Бун Ум На Чампассак.\n\nЗгідно з умовами Договору Паксе, підписаного ним самим та Пхумі Носаваном, Бун Ум колись був Королем Чампассака; південної частини країни, де правити він ніколи не хотів. Зрада Носавана та перемога КУВЛ зруйнували це королівство й свій трон, і, незважаючи на його відважні спроби втриматися при владі, королем Лаосу став Сісаванґ, а той занепадський ліберал Пхетсарат вивів його зі шляху від законного королівського правління. Бун Ума відштовхнули вбік; голос, навколо якого могли об’єднатися лише найзапекліші з роялістів.\n\nСерія помилок його опозиції дала Бун Уму можливість поборотися за втішливий приз. Завдяки тому, що він скористався хаосом після референдуму, то тепер він прем’єр-міністр - а над ним стоїть політично недосвідчений Вонґ Саванґ, яким можна користуватися за нагодою. По правді кажучи, він віддав би перевагу титулу Вонґ Саванґа, і аби цей титул щось означав. Але Бун Ум усе ще має владу, і він задіятиме її, щоб зберегти та підтримати роялістів у лаоській політиці."
 POLITICS_SOMSANITH_VONGKOTRATTANA_DESC: "Чи був Принц Сомсанітг Вонґкотраттана коли-небудь самостійним? Точно не у власній політичній кар’єрі. Під час Операції Іссара, він відповідав за таємну поліцію Лаосу - цю посаду нав’язав йому зрадник Носаван, перш ніж його милостиво змінили товариші Носавана. Після завершення Іссари він перейшов на зручну посаду на державній службі; час від часу його витягували на другорядні посади в попередніх кабінетах. Тепер, після невдалого референдуму щодо скасування монархії, новий король Бун Ум На Чампассак одягнув Вонґкотраттану в костюм і призначив його прем'єр-міністром.\n\nВін знає, ким він є: простий посланник між королем і його народом, апологет політики роялістів. Бун Ум виконав своє бажання - знову став королем і назначив Вонґкотраттану прем’єр-міністром, аби ще більше зміцнити свій контроль над Лаосом. Він тепле тіло в кріслі, рука для підпису документів, і більше від нього ніхто нічого не потребує - тому посеред ночі, коли його ніхто не чує, Вонґкотраттана часто запитує між тихими зойками: чому він?"
 POLITICS_PHOUMI_NOSAVAN_DESC: "Ось та людина, яка тричі організувала державний переворот у Лаосі: уперше - задля підтримки тайців, вдруге - проти них, а втретє - для того, щоб встановити себе беззаперечним лідером Лаосу.\n\nПід час Операції Іссара, він був головним протайським колабораціоністом. Політично кмітливий, хоча з браком стратегічності, він командував більшою частиною колабораціоністських сил проти КУВЛ у серії славних перемог і нищівних поразок. Коли Таїланд припинив підтримку в 1951-му, Носаван самостійно фінансував свою війну за рахунок продажу опіуму та грабунків тайських арсеналів. Лише коли вони справді втратили терпіння з ним у 1955-му році - він звернувся до КУВЛ, допомігши їм у їхній остаточній перемозі. Він відійшов на другий план, повернувшись до КЛА й розбудувавши єдину підтримку, яка йому була потрібна: абсолютна лояльність із боку збройних сил.\n\nОскільки КЛА виправдали всі очікування в «Операції Сеттгатіратг», Носаван одержав цей успіх і переконав армію; аби вони могли показати тим, хто серед цивільного уряду, як керувати Лаосом. Іще один переворот, і Носаван нарешті мав би владу, якої прагнув із 1949-го. Але тепер, коли вона в нього є - він не знає, що з нею робити. Він делегує більшість завдань людям, які лише трохи компетентніші за нього, а ті завдання, які виконує він - здатен вирішити лише грубою силою.\n\nНічого з цього довго не триватиме."
 POLITICS_BONG_SOUVANNAVONG_DESC: " Можливо, один із найбільш суперечливих і дивних лаоських політиків 20-го століття - це Бонґ Суваннавонґ, своєрідні ідейні переконання якого підкріплено проникливою політичною хваткою та широкою мережею зв’язків, які допомогли йому піднятися до ролі прем’єр-міністра.\n\nСуваннавонґ проповідує еклектичну програму традиційних соціальних вірувань, монархізму й демократії в гармонії, буддистського моралізаторства, а також асортименту нечітких лівих переконань щодо економіки. Усі ці вірування підпадають під егіду дхармічного соціялізму: злиття буддистських вчень і соціялістичної думки в інтерпретації Суваннавонґа. У той час, як багатьом важко підтримати чи навіть зрозуміти його програму - власний син зажадав приєднатися до Патріотичного фронту та їх більш узгодженої політичної ідеології - він знає, як заручитися підтримкою й грати в політику, аби отримати владу.\n\nПровал консервативного режиму привів до влади ексцентричного реформатора. Сукхавонґ знає, що його політичні конкуренти стежать за ним, немов яструби. Тим не менш - він впевнений у власній політичній хватці. У гіршому випадку, його буде важко відсторонити від влади. У кращому випадку, він міг би навіть добитися ухвалення кількох своїх реформ - можливо, розглядатиметься навіть створення ізольованого, нейтрального, незалежного Лаосу."
 POLITICS_AMKHA_SOUKHAVONG_DESC: " Герой Сам Нуа ніколи не займався політикою, незважаючи на те, що боротьбою за політичні зміни він займався все своє життя. Раніше служивши капітаном у КУВЛ і пройшовши шлях до генерала, Сукхавонґ зарекомендував себе, як стійкий захисник та чудовий командир - керуючи обороною міста від колаборантів Носавана. Саме в Сам Нуа змінилася доля КУВЛ, і спритніший Сукхавонґ міг перетворити свій успіх на хорошу політичну кар’єру. Але Сукхавонґ ніколи не піклуаався щодо політичного процесу: лише про те, що це була система, яка вартує боротьби. Коли Операція Іссара завершилася, Сукхавонґ повернувся до КЛА сумлінним генералом, тримаючись подалі від справ В’єнтьяну.\n\nТоді Носаван, поводир зрадників - рушив на В’єнтьян. Що ще міг зробити Сукхавонґ, окрім як згуртувати лояльних прихильників на його захист? Битва при Сам Нуа відбулася знову; історія повторилася, коли Сухавонг розгромив Носавана.\n\nНавіть якщо обурений цим, він розуміє, чому після цього вони зробили його прем'єр-міністром. Хоча він знаходить цю роботу поза межами своїх вмінь - він розуміє свій обов’язок перед Лаосом. Якщо нового прем’єр-міністра має бути обрано, то він повинен забезпечити вільні вибори та плавний перехід влади. Амха Сукхавонґ довів, що лаоську демократію захищає найкраще - навіть якщо він ненавидить захищати її за столом у В’єнтьяні."
 POLITICS_SOUKANE_VILAYSARN_DESC: "Революція в В'єтнамі розкрила натуру Супханувонґа; він був змієм, зрадником лаоського народу. Необхідна буде стабілізація, і Сукане Вілайсарн виступить в якості побічних коліщат для пост-комуністичного Лаосу.\n\nЗв'язки Сукане з Японією сягають глибоко: вони були присутніми ще до здобуття незалежності Лаосу від французького правління, а тривали впродовж його кар'єри - окрім короткотривалого періоду за Операції Іссара, коли він служив у Збройних силах Лао-Іссара - допомагаючи йому на кожному кроці, доки він не став комісаром поліції В'єнтьяну.\n\nРаніше співпрацювавши зі своїм братом, Сукане перейшов на сторону Суванни Пхума й Націонал-прогресивної партії, що розділяли з ним його японофільські настрої. Діючи, як головний зв'язок із Імперським генеральним штабом у Лаосі - він був першим, хто попередив Токіо щодо прихованих комуністичних переконань Супханувонґа. На жаль, дії з їхньої сторони почалися надто пізно.\n\nНині перебуваючи в найвищому кабінеті Лаосу, Сукане не кортить робити з себе господарника. Коли його робота закінчиться - він із радістю відновить демократію, і буде впевненим у обранні Суванни Пхума на справедливих і вільних виборах. Але до цього, він мусить очистити гниль серед свого народу; винищуючи комуністичну напасть, аби вона ніколи не змогла закріпитися знову."

