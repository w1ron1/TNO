 ### Events ###

 etr.1.t:0 "Чорний вовк"
 etr.1.d:0 "Попри свій вік, Мухаммад Амін Бугра не втратив свого вогню. Старий чоловік високо підняв прапор Першого повстання над мечетями Кашґара, проповідуючи масам, що Аллах волів, аби тюрки знову об'єдналися під одним прапором, що вся Центральна Азія одного дня знову буде під владою тюрків. Він розповідав про славу Першого повстання та історії, які тюркські діти чують по всьому світу, знову розпалюючи вогонь пантюркізму серед населення. Більше, казав він, тюркські народи не будуть пригноблені своїми сюзеренами.\n\nНастав час діяти, час повернути собі батьківщину."
 etr.1.a:0 "Машаллах!"

 etr.2.t:0 "Друга Східнотуркестанська Республіка"
 etr.2.d:0 "Минуло понад десятиліття відтоді, як було створено Другу Східнотуркестанську Республіку. Під час революції, названої Днем визволення у 1946 році, Іса Юсуф Альптекін і низка впливових революціонерів проголосили незалежність у Кашґарі.\n\nТепер, після багатьох років, СТР загрузла у вічній війні з китайською провінцією Сіньцзян, що супроводжується частими сутичками та битвами. Чжан Чжичжун не може триматися вічно, і він старіє, як і лідери СТР. Одного дня одна з фракцій зрештою переможе й проголосить нову еру для Сіньцзяну, і цей день уже наближається..."
 etr.2.a:0 "Іншаллах!"

 etr.3.t:0 "Рейд на Аксу"
 etr.3.d:0 "Ще один день, ще один рейд. Цього разу — спустошливий. Наші сили знову завдали удару по китайському гарнізону міста Аксу, майже зламавши його оборону. Однак піщана буря та прибуття підкріплень зі Сходу змусили нас відступити."
 etr.3.a:0 "Ми повернемося знову..."

 etr.4.t:0 "Мухаммад Амін Бугра виступає"
 etr.4.d:0 "Старий пантюркістський джадидист Мухаммад Амін Бугра, ветеран першого повстання, якого нинішній уряд глибоко шанує, виступив перед великим натовпом у Кашґарі. Він підтримав рух нової СТР і закликав до об'єднання всіх тюрків — від Східної Європи до Центральної Азії. Його запальна промова надихнула багатьох, а його послання пантюркізму пролунало по всьому Кашґару та Хотану."
 etr.4.a:0 "Надихає!"
