 ## Ideas ##
 
 DSG_nascent_refugee_crisis:0 "Зародження кризи біженців"
 DSG_nascent_refugee_crisis_desc:0 "По всій Німеччині мільйони людей тікають від ситуації, що стрімко погіршується, шукаючи десь притулку, доки не закінчаться пожежі та кровопролиття. На сході лежить анархія, на заході - пекло, а на півдні - підступна імперія, про яку державна пропаганда попереджала роками. Проте ходять чутки, що на півночі можна знайти порятунок від цієї нескінченної боротьби. Якщо просто дістатися Кіля, то, кажуть, можна переправитися через Балтику до Швеції.\n\nҐросадмірал Дьоніц стоїть на сторожі цих земель, і коли маси біженців починають збільшуватися, необхідно прийняти рішення, як впоратися зі станом справ."
 
 DSG_tiring_stance:0 "Виснажливе становище"
 DSG_tiring_stance_desc:0 "Ґросадмірал Дьоніц уперше виступив проти занепаду Райху, коли його фавориту Мартіну Борману було відмовлено у призначенні на посаду в Німеччині. Очікуючи, що Борман підніметься тріумфально над рештою натовпу, Дьоніц не міг передбачити нинішньої поразки.\n\nВідтоді минуло багато часу. Повернувшись із заслання лише для того, щоб захопити Гамбурґ і Кіль і збільшити свою непокору до Німеччини, він дедалі більше виснажується, спостерігаючи, як Райх, який він так любив, занурюється в цілковиту анархію. Чи була вся його непокора марною?"
 
