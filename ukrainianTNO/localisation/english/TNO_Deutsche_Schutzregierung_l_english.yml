 HWL_Karl_Donitz:0 "Карл Дьоніц"
 POLITICS_Karl_Donitz_DESC:0 "В іржавих доках Гамбурґа Кріґсмаріне нарешті здійснює своє тріумфальне повернення - і на його чолі сидить старезний адмірал, змучений роками праці та крові.\n\nКарл Дьоніц, мабуть, останній незаплямований герой Райху. Всі інші загинули, зникли безвісти або пов'язані з СС. Адмірал, який тероризував союзників своїми «вовчими зграями», Дьоніц знову втік від тих, хто бажає йому зла - а таких у новій Німеччині чимало. Його сім'ї, однак, не так пощастило - сини загинули під час Другої світової війни, дружина померла кілька років тому, а дочка і зять майже напевно зазнали жорстокого ставлення, опинившись у пастці, в лапах СС. За зовнішніми проявами спокійного і могутнього героя війни, друга Гітлера і нищівника ворогів Райху, ховається втомлена, виснажена людина.\n\nНедивно, що адмірал створив при собі раду, яка займається нагальними справами дня - він дає їм репутацію, а вони дають йому владу. Таким чином, Гамбурґ є місцем відносного спокою - хоча СС кружляє біля його борту і розчавить його, щойно зможе, принаймні хтось притомний керує кораблем.\n\nВтім, під палубою не все гаразд, оскільки в голові старіючого адмірала борються дві сторони. Одна сторона, гордий герой війни, бореться за те, щоб відстояти свою позицію - щоб закріпити Кріґсмаріне не просто як забуту руку армії, а як справжню силу Німеччини та острівець здорового глузду серед шторму. Інший, втомлений старий, не бажає нічого іншого, окрім як використати те, що зветься «Кріґсмаріне», як ворота на північ - для біженців, що переповнюють вулиці міста, і для себе. Невідомо, хто з них візьме гору, але поки що адмірал робить свій останній ривок."

